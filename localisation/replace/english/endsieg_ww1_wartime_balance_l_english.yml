l_english:
 WW1_entente_wartime_balance: "Strains of Coalition Warfare"
 WW1_entente_wartime_balance_desc: "The coalition's armies must coordinate their offensives across several fronts. Differing timetables and stretched lines of communication make it difficult to concentrate strength when it is needed."
 WW1_central_wartime_balance: "Wartime Arsenals"
 WW1_central_wartime_balance_desc: "The army has concentrated its reserves and given the arsenals priority for labour and materials. A steadier supply of rifles and shells gives the front more room to act."
