 TUR_stab_penalty_severe_tt:0 "Local manpower: §R-30%§!\nLocal resources: §R-15%§!\nState construction speed: §R-20%§!"
 TUR_stab_capacity_tt:0 "Fewer than two programmes are running, and our current capital is controlled by us."
 TUR_stab_region_controlled_tt:0 "We own land in this region and control all its states still administered by us."
 TUR_stab_region_free_tt:0 "No other programme is running in this region."
 TUR_stab_programme_unfinished_tt:0 "This programme has not yet been completed in the region."
 TUR_stab_relief_cooldown_tt:0 "At least 270 days have passed since the last relief programme was completed here."
 TUR_stab_settlement_ready_tt:0 "A political settlement has been adopted through the Ottoman focus tree."
 TUR_stab_implementation_ready_tt:0 "Provincial hearings, civil registers and a budget agreement have been completed here."
 TUR_stab_programmes_tt:0 "Up to two regional, national, cabinet or officer programmes can run at once. Costs begin on selection; benefits apply only on completion. A durable settlement requires at least 48 months of work and 12 consecutive peaceful assessment months, food security of at least 50, and discontent below 25 with implemented settlements in every present region."
