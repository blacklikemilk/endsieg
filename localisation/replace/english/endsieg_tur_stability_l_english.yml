 TUR_stab_sick_man_europe:0 "The Sick Man of Europe"
 TUR_stab_sick_man_europe_desc:0 "Our provinces differ in their institutions, languages and expectations of the government. Petitions, taxation and recruitment expose weaknesses that cannot be corrected by a single decree. Select a region to examine its discontent and the work available there. At most §Ytwo programmes§! can run at once, including cabinet and officer work.\n\nFood security: §Y[?TUR_stab_food_security|0]/100§!\nAverage regional discontent: §Y[?TUR_stab_average|1]/100§!\nCabinet authority: §Y[?OT1_R_cabinet_authority|0]/100§!\nOfficer loyalty: §Y[?OT1_R_officer_loyalty|0]/100§!\n\nOnly regions still under direct Ottoman administration enter the average. Lost territory is not restored by these programmes."
 TUR_stab_sick_man_spirit:0 "The Sick Man of Europe"
 TUR_stab_sick_man_spirit_desc:0 "The state’s weakness reflects regional grievances, unreliable services and the strain of mobilisation. The penalty scales with average regional discontent. Army reforms reduce its military component, but lasting confidence requires local implementation and sustained peace.\n\nAverage regional discontent: §Y[?TUR_stab_average|1]/100§!."
 TUR_stab_elevated_discontent:0 "Elevated Provincial Discontent"
 TUR_stab_elevated_discontent_desc:0 "Unresolved grievances hamper local recruitment, raw-material production and public works. The effect ends when discontent falls or the state leaves direct Ottoman administration."
 TUR_stab_penalty_elevated_tt:0 "Local manpower: §R-5%§!\nLocal resources: §R-2.5%§!\nState construction speed: §R-5%§!"
 TUR_stab_high_discontent:0 "High Provincial Discontent"
 TUR_stab_high_discontent_desc:0 "Unresolved grievances hamper local recruitment, raw-material production and public works. The effect ends when discontent falls or the state leaves direct Ottoman administration."
 TUR_stab_penalty_high_tt:0 "Local manpower: §R-15%§!\nLocal resources: §R-7.5%§!\nState construction speed: §R-10%§!"
