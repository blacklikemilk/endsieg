 ww1_tur_stability.1.t:0 "The Sick Man of Europe"
 ww1_tur_stability.1.d:0 "Reports reaching the Porte describe a state whose laws and institutions seldom carry the same weight in every province. Officials complain of missing registers and uncertain budgets. Local representatives ask for reliable services, while the army demands men and supplies that the districts can ill afford to give.\n\nThe cabinet can adopt a settlement in the capital. Giving that settlement practical effect will require years of appointments, expenditure and negotiation. War and shortage may undo work that appears secure on paper."
 ww1_tur_stability.1.a:0 "The work must begin in the provinces."
 ww1_tur_stability.10.t:0 "The Provincial Appropriations"
 ww1_tur_stability.10.d:0 "The authorities in [TUR_stab_crisis_region_name] have disputed the latest appropriation. Local officials say that the sum assigned to their offices will not meet the obligations imposed by the ministries. The treasury replies that every province asks for concessions while the common expenses continue to rise."
 ww1_tur_stability.10.a:0 "Examine their accounts with the local representatives."
 ww1_tur_stability.10.b:0 "The existing appropriation must stand."
 ww1_tur_stability.11.t:0 "Petitions from the District Offices"
 ww1_tur_stability.11.d:0 "A delegation from [TUR_stab_crisis_region_name] has brought complaints over appointments and the language used in the district offices. The petitioners ask that ordinary business be handled by officials who understand the communities they serve. The ministry warns against promising staff and funds it cannot supply."
 ww1_tur_stability.11.a:0 "Arrange a conference with the provincial authorities."
 ww1_tur_stability.11.b:0 "The ministry will appoint the officials it requires."
 ww1_tur_stability.12.t:0 "Supplies for the Provinces"
 ww1_tur_stability.12.d:0 "The provincial authorities in [TUR_stab_crisis_region_name] report that grain has failed to reach the districts in the expected quantities. Transport officers blame competing requisitions and damaged connections. Merchants are withholding stocks until they know which authority will pay for them."
 ww1_tur_stability.12.a:0 "Release supplies and settle the outstanding accounts."
 ww1_tur_stability.12.b:0 "Army requisitions must take priority."
 ww1_tur_stability.13.t:0 "Men, Wagons and Requisitions"
 ww1_tur_stability.13.d:0 "The military authorities have asked [TUR_stab_crisis_region_name] for another allotment of men and transport. Local officials reply that the previous requisitions have left villages short of labour and wagons. The army considers the request indispensable; the province asks when the burden will end."
 ww1_tur_stability.13.a:0 "Reduce the demand and hear the provincial complaints."
 ww1_tur_stability.13.b:0 "Every district must meet its allotted share."
 ww1_tur_stability.20.t:0 "The Provincial Settlement Holds"
 ww1_tur_stability.20.d:0 "For a year the ministries have received fewer reports of unresolved grievances. Provincial budgets are being observed, offices are staffed and supplies reach the districts with greater regularity. The settlement has become more than a declaration issued in the capital.\n\nThe burdens of the state remain. Peace and continued attention will be needed if the confidence now established is to survive another crisis."
 ww1_tur_stability.20.a:0 "Maintain the agreements that made this possible."
 ww1_tur_stability.21.t:0 "Confidence in the Settlement Falters"
 ww1_tur_stability.21.d:0 "Reports from the provinces again speak of unpaid obligations and disputes that the local authorities cannot settle. The arrangements which held during quieter months are being tested by fresh demands. The cabinet can no longer assume that yesterday’s agreement will command tomorrow’s confidence."
 ww1_tur_stability.21.a:0 "The provinces must be heard again."
