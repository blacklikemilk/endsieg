l_english:
 TUR_stab_thrace_consult:0 "Hear Provincial Petitions: Constantinople and Thrace"
 TUR_stab_thrace_consult_desc:0 "The ministries will hear local representatives and examine the grievances brought before them. A record of promises and practical obligations must precede lasting reform. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_consult_tt:0 "After §Y60 days§!, discontent in Constantinople and Thrace falls by §G6§! in peace or §G4§! during war. This programme can be completed once in this region."
 TUR_stab_thrace_registers:0 "Complete the Civil Registers: Constantinople and Thrace"
 TUR_stab_thrace_registers_desc:0 "Clerks, interpreters and surveyors must be appointed before taxation, recruitment and civil justice can be conducted consistently. The work must accommodate local languages and existing rights. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_registers_tt:0 "After §Y120 days§!, discontent in Constantinople and Thrace falls by §G9§! in peace or §G5§! during war. Completed offices also reduce monthly discontent growth. This programme can be completed once in this region."
 TUR_stab_thrace_budgets:0 "Agree the Provincial Budget: Constantinople and Thrace"
 TUR_stab_thrace_budgets_desc:0 "Local authorities and the Porte must agree which services can be maintained and how they will be paid for. A published appropriation is more useful than another promise without funds. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_budgets_tt:0 "After §Y150 days§!, discontent in Constantinople and Thrace falls by §G10§! in peace or §G6§! during war. Completed offices also reduce monthly discontent growth. This programme can be completed once in this region."
 TUR_stab_thrace_services:0 "Staff Schools and District Services: Constantinople and Thrace"
 TUR_stab_thrace_services_desc:0 "Teachers, medical staff and district officials will be trained and assigned to the province. These appointments take time and divert resources from other work. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_services_tt:0 "After §Y180 days§!, discontent in Constantinople and Thrace falls by §G9§! in peace or §G5§! during war. Completed offices also reduce monthly discontent growth. This programme can be completed once in this region."
 TUR_stab_thrace_compact:0 "Implement the Provincial Settlement: Constantinople and Thrace"
 TUR_stab_thrace_compact_desc:0 "The political settlement must be made effective through local appointments, financial arrangements and ordinary law. Its adoption in the capital has not completed the work in the province. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_compact_tt:0 "After §Y240 days§!, discontent in Constantinople and Thrace falls by §G12§! in peace or §G7§! during war. Completed offices also reduce monthly discontent growth. This programme can be completed once in this region."
 TUR_stab_thrace_relief:0 "Maintain Provincial Relief: Constantinople and Thrace"
 TUR_stab_thrace_relief_desc:0 "Food distribution, medical assistance and a review of local grievances can prevent hardship from becoming a new crisis. War restricts the relief that can reach the province. Benefits apply on completion. Loss of control cancels the work without a refund."
 TUR_stab_thrace_relief_tt:0 "After §Y90 days§!, discontent in Constantinople and Thrace falls by §G5§! in peace or §G3§! during war. Relief can be repeated 270 days after completion."
