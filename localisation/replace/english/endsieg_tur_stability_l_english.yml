 ww1_tur_stability.1.t:0 "The Provincial Question"
 ww1_tur_stability.1.d:0 "The government has inherited an administration whose authority is felt unevenly across the provinces. Registers are incomplete, revenues uncertain, and local officials must answer for services they have neither the staff nor the money to provide. Communities with grievances of their own are increasingly reluctant to place their trust in distant ministries.\n\nOrders from the capital will not mend these troubles by themselves. We must find officials, negotiate with local representatives and provide the means to carry out our promises. The task will take years, and every new crisis threatens to set it back."
 ww1_tur_stability.1.a:0 "The work must begin."
 ww1_tur_stability.10.t:0 "A Dispute Over Provincial Funds"
 ww1_tur_stability.10.d:0 "Officials in [TUR_stab_crisis_region_name] have challenged the funds assigned to their administration. They argue that the sum is too small to meet the obligations imposed upon them. The treasury, faced with claims from every quarter, insists that there is little left to spare.\n\nA review of the accounts may produce an accommodation, but the ministries must also decide how far they are prepared to yield to provincial demands."
 ww1_tur_stability.10.a:0 "Review the accounts with their representatives."
 ww1_tur_stability.10.b:0 "The appropriation will stand."
 ww1_tur_stability.11.t:0 "Petitions from the Provinces"
 ww1_tur_stability.11.d:0 "A delegation from [TUR_stab_crisis_region_name] has arrived with complaints about local appointments. Its members argue that district officials must understand the language and needs of the people they serve. The ministry fears that concessions in one province will be followed by demands elsewhere.\n\nWe may hear the petitioners and seek an agreement, or reaffirm the ministry's authority to make its own appointments."
 ww1_tur_stability.11.a:0 "Hear the delegation."
 ww1_tur_stability.11.b:0 "The ministry will make the appointments."
 ww1_tur_stability.12.t:0 "Shortages in the Provinces"
 ww1_tur_stability.12.d:0 "Reports from [TUR_stab_crisis_region_name] speak of shortages and rising anger as grain deliveries fail to arrive. Merchants are reluctant to part with their stocks, while officials dispute who is responsible for arranging transport and payment. The government must decide how to secure supplies without deepening the province's resentment."
 ww1_tur_stability.12.a:0 "Arrange supplies and settle the accounts."
 ww1_tur_stability.12.b:0 "Enforce the requisitions."
 ww1_tur_stability.13.t:0 "The Burden of Requisitions"
 ww1_tur_stability.13.d:0 "The military authorities have called upon [TUR_stab_crisis_region_name] for more men and transport. Provincial officials warn that earlier requisitions have already left villages short of labour and wagons. The army maintains that the needs of the war cannot be postponed.\n\nThe government must weigh the army's demands against the growing discontent of those asked to meet them."
 ww1_tur_stability.13.a:0 "Hear the province and seek an accommodation."
 ww1_tur_stability.13.b:0 "The army must receive its due."
 ww1_tur_stability.20.t:0 "The Provincial Settlement Holds"
 ww1_tur_stability.20.d:0 "The provincial reports give us reason for cautious satisfaction. After years of negotiation and administration, the arrangements we undertook have been put into practice, and local grievances have subsided. For a full year the settlement has weathered its disputes without breaking down.\n\nMuch remains to be done, but the government now has a stronger foundation on which to govern."
 ww1_tur_stability.20.a:0 "We must preserve what has been achieved."
 ww1_tur_stability.21.t:0 "The Settlement Under Strain"
 ww1_tur_stability.21.d:0 "Confidence in the provincial settlement is faltering. Fresh grievances have brought renewed protests, and officials warn that arrangements once accepted are now being openly questioned. The government can no longer take the cooperation of the provinces for granted.\n\nOur earlier work has not been forgotten, but it will take more than old assurances to restore confidence."
 ww1_tur_stability.21.a:0 "We must attend to their grievances."
