 interwar_white_russia.1.t:0 "The Rival Strategies of the White Command"
 interwar_white_russia.1.d:0 "The southern White movement is divided over the direction of the campaign. Pyotr Krasnov favours a drive towards Tsaritsyn and cooperation with neighbouring governments, while Anton Denikin insists on a united Russia and a southern advance after securing the Kuban. Both seek victory over the Bolsheviks, but neither is willing to concede the political future of the movement to the other."
 interwar_white_russia.1.a:0 "Follow Krasnov's strategy."
 interwar_white_russia.1.b:0 "Follow Denikin's strategy."
 interwar_white_russia.2.t:0 "The Former Imperial Frontier"
 interwar_white_russia.2.d:0 "Germany's withdrawal has transformed the position of the states that emerged along Russia's western and southern borders. Supporters of a united Russia are urging the government to reassert its claims, reopening disputes that the struggle against the Bolsheviks has left unresolved."
 interwar_white_russia.2.a:0 "Reaffirm the unity of Russia."
 interwar_white_russia.3.t:0 "A Campaign against Poland"
 interwar_white_russia.3.d:0 "The government is preparing to challenge Polish independence by force. Its supporters regard the western territories as part of a united Russia, while Warsaw is determined to defend the state established beyond our authority."
 interwar_white_russia.3.a:0 "Order the advance into Poland."
 interwar_white_russia.4.t:0 "A Campaign against Ukraine"
 interwar_white_russia.4.d:0 "Our government is preparing to reassert Russian authority in Ukraine. The Ukrainian authorities reject these claims, leaving the frontier between the two governments on the brink of a new war."
 interwar_white_russia.4.a:0 "Begin the campaign in Ukraine."
 interwar_white_russia.5.t:0 "A Campaign in Finland"
 interwar_white_russia.5.d:0 "The White command is preparing an attempt to restore Russian authority over Finland. The rival Finnish governments face a threat to the independence around which their own bitter struggle has unfolded."
 interwar_white_russia.5.a:0 "Begin the northern campaign."
 interwar_white_russia.6.t:0 "A Campaign in the Baltic"
 interwar_white_russia.6.d:0 "Plans have been prepared for a military campaign against the independent Baltic governments. Our leaders invoke the unity of the former empire, while the Baltic authorities regard Russian claims as a direct threat to their survival."
 interwar_white_russia.6.a:0 "Advance towards the Baltic."
 interwar_white_russia.7.t:0 "A Campaign in Transcaucasia"
 interwar_white_russia.7.d:0 "The command is preparing to assert Russian authority beyond the Caucasus. The governments established in Georgia, Armenia and Azerbaijan are unwilling to surrender their independence, bringing the region towards another armed confrontation."
 interwar_white_russia.7.a:0 "Begin the Transcaucasian campaign."
 interwar_white_russia.8.t:0 "Recognising the New States"
 interwar_white_russia.8.d:0 "Governments have taken root in the former imperial borderlands, and their cooperation may be more valuable than renewed conflict. The Foreign Ministry proposes recognising their independence as the foundation for agreements with Russia."
 interwar_white_russia.8.a:0 "Seek agreement with our neighbours."
 interwar_white_russia.9.t:0 "An Agreement with Poland"
 interwar_white_russia.9.d:0 "Our representatives are preparing to recognise Poland and conclude a non-aggression agreement. A settled relationship on the western frontier would give both governments a firmer basis for dealing with the disorder left by war and revolution."
 interwar_white_russia.9.a:0 "Conclude the agreement with Poland."
 interwar_white_russia.10.t:0 "An Agreement with Ukraine"
 interwar_white_russia.10.d:0 "Negotiators have prepared an understanding recognising Ukrainian independence. A non-aggression agreement will give relations with Kyiv a formal basis and ease the immediate uncertainty along the frontier."
 interwar_white_russia.10.a:0 "Conclude the agreement with Ukraine."
 interwar_white_russia.11.t:0 "Agreements with the Baltic Governments"
 interwar_white_russia.11.d:0 "Estonia, Latvia and Lithuania are seeking acceptance of their independent governments. Our representatives propose recognition and bilateral non-aggression agreements as the basis for a more stable Baltic frontier."
 interwar_white_russia.11.a:0 "Conclude the Baltic agreements."
 interwar_white_russia.12.t:0 "An Agreement with Finland"
 interwar_white_russia.12.d:0 "The government is preparing to recognise Finland's independence and settle its relations with Helsinki. A non-aggression agreement offers a way to end uncertainty without another campaign on the northern frontier."
 interwar_white_russia.12.a:0 "Conclude the agreement with Finland."
 interwar_white_russia.13.t:0 "Agreements in the Caucasus"
 interwar_white_russia.13.d:0 "The governments of Georgia, Armenia and Azerbaijan are seeking recognition of their independence. Our representatives have prepared bilateral agreements intended to replace disputed imperial claims with more stable relations across the Caucasus."
 interwar_white_russia.13.a:0 "Conclude the Caucasian agreements."
 interwar_white_russia.14.t:0 "Kolchak Becomes Supreme Ruler"
 interwar_white_russia.14.d:0 "A coup in Omsk has displaced the regional government and brought Admiral Alexander Kolchak to power. Backed by the remaining cabinet and military leaders, he is assuming the title of Supreme Ruler as opponents of the new regime face arrest and exile."
 interwar_white_russia.14.a:0 "Rally behind the Supreme Ruler."
 interwar_white_russia.15.t:0 "The Restoration of the Monarchy"
 interwar_white_russia.15.d:0 "With the imperial family safe from Bolshevik custody, supporters of the dynasty are preparing to restore Nicholas II to the throne. They hope that the crown can unite the movement and secure a legitimacy that its competing military governments have struggled to establish."
 interwar_white_russia.15.a:0 "Restore the Emperor."
 interwar_white_russia.16.t:0 "A Common White Government"
 interwar_white_russia.16.d:0 "The eastern and western White movements are drawing together behind a proposal for a common government. Political representatives and military commanders are seeking an authority founded on the surviving deputies of the Constituent Assembly."
 interwar_white_russia.16.a:0 "Unite the White movement."
 interwar_white_russia.17.t:0 "Recognition from the Western Allies"
 interwar_white_russia.17.d:0 "The Western Allies have recognised our government following the unification of the White movement. Their decision strengthens our claim to represent Russia, even as the outcome of the struggle remains uncertain."
 interwar_white_russia.17.a:0 "Our cause has gained recognition."
 interwar_white_russia.18.t:0 "Autonomy within a United Russia"
 interwar_white_russia.18.d:0 "Representatives of Cossack and minority communities are pressing for a settlement of their place within Russia. The government is prepared to recognise local autonomy in the hope of securing their cooperation in the struggle against the Bolsheviks."
 interwar_white_russia.18.a:0 "Honour the agreement on autonomy."
 interwar_white_russia.19.t:0 "Discontent among the Nationalities"
 interwar_white_russia.19.d:0 "Promises of autonomy have failed to satisfy the communities whose support the government sought. Cossack and minority representatives are losing confidence in the White leadership, while reports of desertion and disobedience reach the command."
 interwar_white_russia.19.a:0 "Our promises are losing their force."
 interwar_white_russia.20.t:0 "A Further Settlement on Autonomy"
 interwar_white_russia.20.d:0 "The government is renewing its efforts to reach agreement with regional and national representatives. Recognition of their local institutions is intended to hold together a coalition whose members fear that military victory may leave their demands unanswered."
 interwar_white_russia.20.a:0 "Confirm the autonomous settlement."
 interwar_white_russia.21.t:0 "Land Reform and the White Government"
 interwar_white_russia.21.d:0 "Peasant demands for land have placed the government under growing pressure. Ministers are preparing reforms despite the objections of property owners and commanders who would prefer to postpone the question until the fighting has ended."
 interwar_white_russia.21.a:0 "Proceed with land reform."
 interwar_white_russia.22.t:0 "The White Terror"
 interwar_white_russia.22.d:0 "White authorities are extending their campaign against suspected Bolsheviks and other opponents. Arbitrary arrests and executions are spreading with the armies, exposing civilians to reprisals far beyond the battlefield."
 interwar_white_russia.22.a:0 "The campaign of repression continues."
 interwar_white_russia.23.t:0 "Requisitions in the Countryside"
 interwar_white_russia.23.d:0 "The armies' need for food has brought compulsory requisitions to the countryside. Commanders insist that supplies must be found, while villagers face demands that deepen their resentment of the forces claiming to restore order."
 interwar_white_russia.23.a:0 "The army must be provisioned."
 interwar_white_russia.24.t: "Constituent Assembly Restored"
 interwar_white_russia.24.d: "The Constituent Assembly has been de-facto eliminated since the rise of the Bolsheviks in the October Revolution where it later under their power disassembled, bringing back the Constituent Assembly will be seen in a more positive light by the Western Allies and improve political stability in Russia."
 interwar_white_russia.24.a: "Good"
 interwar_white_russia.25.t:0 "The Ilya Muromets Aircraft"
 interwar_white_russia.25.d:0 "Our forces have secured a number of the former imperial air service's Ilya Muromets bombers. The surviving aircraft and crews are scattered among the competing governments, but those in our hands offer a valuable remnant of Russia's wartime aviation effort."
 interwar_white_russia.25.a:0 "Bring the aircraft into service."
 interwar_white_russia.26.t: "French-Greek Expeditionary Force Arrives"
 interwar_white_russia.26.d: "A French-Greek expeditionary corps has seized the ports of Odessa, Sevatopol, and Kherson and transfered them to us. Whilst the French and allied governments would like for this force to support us in our struggle against the Bolsheviks the expeditionary troops are not motivated. French soldiers eagerly await to be demobilized after a long and remote service on the oriental fronts during the war. The expeditionary force will not however become involved in the conflict unless they are attacked."
 interwar_white_russia.26.a: "Great!"
 interwar_white_russia.27.t: "British Tanks Arrive"
 interwar_white_russia.27.d:0 "British armoured vehicles have arrived in southern Russia for the White armies. Crews and workshops are preparing the unfamiliar machines for a campaign in which dependable supplies and maintenance may matter as much as their armour."
 interwar_white_russia.27.a:0 "Prepare the tanks for the front."
 #interwar_white_russia.28.t:0 "Invasion of Mongolia"
 #interwar_white_russia.28.d:0 "Roman von Ungern-Sternberg has taken a few thousand men to the border of Mongolia where he will"
 #interwar_white_russia.28.a:0 ""
 interwar_white_russia.29.t:0 "Ungern-Sternberg in Mongolia"
 interwar_white_russia.29.d:0 "Roman von Ungern-Sternberg has brought his forces into Mongolia and established himself as a dominant figure in its government. His ambitions combine the restoration of monarchy with a campaign against the revolutionary order, drawing Mongolia into the upheavals left by the Russian Civil War."
 interwar_white_russia.29.a:0 "The baron has brought his war to Mongolia."
 interwar_white_russia.30.t:0 "An Offer to Japan"
 interwar_white_russia.30.d:0 "Some of our representatives favour territorial concessions in the Far East to secure greater Japanese assistance. Such an offer might strengthen the armies in the short term, but it would compromise the very claims to a united Russia upon which the movement rests."
 interwar_white_russia.30.a:0 "Put the offer before Tokyo."
 interwar_white_russia.30.b: "There will be no such offer!"
 interwar_white_russia.31.t:0 "The Gold Reserve at Kazan"
 interwar_white_russia.31.d:0 "Our forces have taken control of the imperial gold reserve held at Kazan. The treasure offers the government a means of paying for supplies abroad and backing its promises of assistance to the armies."
 interwar_white_russia.31.a:0 "Secure the reserve."
 interwar_white_russia.32.t:0 "The Imperial Family Rescued"
 interwar_white_russia.32.d:0 "The advance into Yekaterinburg has brought the imperial family out of Bolshevik custody alive. Their survival is a profound relief to the dynasty's supporters and immediately reopens the question of the monarchy's place in Russia's future."
 interwar_white_russia.32.a:0 "Place the family under protection."
 interwar_white_russia.33.t:0 "Washington Distances Itself"
 interwar_white_russia.33.d:0 "President Wilson's government is showing growing reservations about the White leadership. Doubts over Kolchak's political intentions and concern about Japanese ambitions in Siberia are weakening hopes of a common Allied policy in Russia."
 interwar_white_russia.33.a:0 "Our position in the West is less certain."
 interwar_white_russia.34.t:0 "Kolchak Executed"
 interwar_white_russia.34.d:0 "Admiral Kolchak has been handed over to the revolutionary authorities at Irkutsk and condemned to death. His execution, alongside Viktor Pepelyayev, deprives the eastern White movement of its former Supreme Ruler as the retreat continues."
 interwar_white_russia.34.a:0 "The eastern command has lost its leader."
 interwar_white_russia.35.t:0 "The Great Siberian Retreat"
 interwar_white_russia.35.d:0 "The remnants of the eastern White armies are retreating across Siberia with their families and possessions. Cold, exhaustion and broken communications are taking a terrible toll as the columns struggle to escape the advancing Red forces."
 interwar_white_russia.35.a:0 "Keep the columns moving."
 interwar_white_russia.36.t:0 "General Kornilov Killed"
 interwar_white_russia.36.d:0 "General Lavr Kornilov has been killed when a shell struck his headquarters during the fighting near Ekaterinodar. His death leaves the Volunteer Army without the commander who led it through the hardships of the southern retreat."
 interwar_white_russia.36.a:0 "The command must pass to another."
 interwar_white_russia.37.t:0 "Krasnov Prevails in the White Command"
 interwar_white_russia.37.d:0 "The capture of Tsaritsyn has vindicated Pyotr Krasnov's strategy. His supporters are using the victory to secure his authority over the western White movement, bringing the contest with Denikin to a decision."
 interwar_white_russia.37.a:0 "Recognise Krasnov's command."
 interwar_white_russia.38.t:0 "Denikin Prevails in the White Command"
 interwar_white_russia.38.d:0 "Krasnov's failure to secure the success he promised at Tsaritsyn has weakened his position among the White commanders. Anton Denikin has emerged with his authority intact, leaving the movement's western leadership in his hands."
 interwar_white_russia.38.a:0 "Confirm Denikin's authority."
 interwar_white_russia.39.t:0 "Krasnov Leaves the Struggle"
 interwar_white_russia.39.d:0 "Pyotr Krasnov has withdrawn after the triumph of Denikin's leadership within the White movement. His departure unsettles the Don Cossack officers and soldiers who followed him, exposing divisions that victory in the command dispute has not healed."
 interwar_white_russia.39.a:0 "The movement must hold together."


 INT_hungary.1.t: "Treaty of Trianon"
 INT_hungary.1.d: "With our defeat in the Hungarian-Romanian War we have conluded a peace agreement to finally end the First World War officially regulating the status of us an an independent state and defining our borders. The Treaty of Trianon has left us landlocked with all remaining territory being 28% of the original Pre-War Kingdom of Hungary, the population remains at only 7.6 million, 36% of our pre-war population of 20.9 million with 3.3 million Hungarians being left outside of our borders. The Treaty has also limited our army to 35,000 officers and men as well as forcing us to pay war reparations to our neighbors. We have had no other option but to accept these horrid terms, perhaps one day it will be reversed..."
 INT_hungary.1.a: "Damn!"
 INT_hungary.2.t: "Communists Take Hold of Goverment"
 INT_hungary.2.d: "With Mihaly Karolyi announcing that the Denes Berinkey government would resign and informing the Council of Ministers that only Social Democrats could form a new goverment seeing as they were the party with the highest public support, in an effort to form a governing coalition the Social Democrats without the party leader Mihaly Karolyi started secret negotations with the communist leaders who were still imprisoned. These negotaitions eventually merged the Social Deocrat Party and the Hungarian Communist Party into one government under the name of the Hungarian Socialist Party. Karolyi who was not informed of this also an outspoken Anti-Communism quickly found himself faced with a government dominated by communists and resigned and following the release of Bela Kun other communists from prison the Communists took power establishing the Hungarian Soviet Republic."
 INT_hungary.2.a: "Rise my comrades!"
 INT_hungary.3.t: "Yugoslav Occupation of Vojvodina"
 INT_hungary.3.d: "With the territory of Vojvodina promised to the new Yugoslav state the Assembly of Serbs and other nationals of Vojvodina in Novi Sad have proclaimed the unification of Vojvodina with Yugoslavia which has been followed by Yugoslav troops moving into the region against our border."
 INT_hungary.3.a: "But the hungarians there?!"
 INT_hungary.4.t: "Czech Occupation of Carpathian Ruthenia"
 INT_hungary.4.d: "Czech troops acting in coordination with Romanian forces have arrived from the east - both acting under French auspices - and have entered the area crushing local hungarian militias before integrating it into Czechoslovakia."
 INT_hungary.4.a: "We will be back!"
 INT_hungary.5.t: "Hungarian-Rummanian War Begins"
 INT_hungary.5.d: "With us failing to agree upon the 'Vix Note' the Rumanians have taken things into their own hands and have started to prepare for an offensive on the border. As a result Bela Kun, who has previously tried to buy our country time to prepare for such possibilities of war has pushed for an immediate offense to catch the Rumanians off guard. Hopefully if we manage to hold the Rumanians off long enough Soviet Russia could come to our aid and invade the Rumanians from the east."
 INT_hungary.5.a: "We will not surrender our territory!"
 INT_hungary.6.t: "The Vix Note"
 INT_hungary.6.d: "In exchange for Hungary's agreement to the conditions set out in the Vix note the allies have promised to lift the blockade of Hungary and to take a benevolent attitude towards Hungary's loss of territory to Romania, Czechoslovakia, and Yugoslavia. If we accept the Vix Note the Rumanians will take the whole of Transylvania where millions of ethnic Hungarians live. We cannot let this happen!"
 INT_hungary.6.a: "We will back down"
 INT_hungary.6.b: "We would not accept something so preposterous!"
 INT_hungary.7.t: "Communists Arrested"
 INT_hungary.7.d: "Today a demonstration has turned violent with agressive demonstrations from the radical communists who have protested against the media and Karoliy's liberal government. The protestors have attacked the editorial office of the Social Democratic Party of Hungary's offical papaer the 'People's Word' in which several people and policemen were killed. \n\n This disturbance of the peace has prompted the Social Democrat party to arrest the leaders of the communist party and ban the Voros Ujsag closing down the communist party's building."
 INT_hungary.7.a: "A neccesary action"
 INT_hungary.8.t: "Victory in Hungary"
 INT_hungary.8.d: "We have defeated the Hungarians. We can now decide whether we want a moderate peacedeal, keeping in mind that even though Hungary is defeated now they were once a powerful nation, or we can choose to occupy as much as we can."
 INT_hungary.8.a: "We don't want to wake a giant"
 INT_hungary.8.b: "I want it all"
 INT_hungary.9.t: ""
 INT_hungary.9.d: ""
 INT_hungary.9.a: ""
 INT_hungary.10.t: ""
 INT_hungary.10.d: ""
 INT_hungary.10.a: ""
 INT_hungary.11.t: "Prekmurje Declares Independence!"
 INT_hungary.11.d: "The Area of Prejmurje Was Controlled by the croatian Armies in 1918 until our reoccupation shortly later, it has been in our control for several months, however yesterday, a hungarian socialist, supported by local protestant organizations declared prekmurje to be an independent, sovereign state, our forces are vunerable and we will work to retake the area in coming months"
 INT_hungary.11.a: "The Bastards!"
 INT_hungary.12.t: "The Annexation of Prekmurje"
 INT_hungary.12.d: "Prekmurje Declared its independence a month ago, however, Our soldiers have contained the young republic and restored control"
 INT_hungary.12.a: "Excellent!"

 INT_italy.1.t: "March on Rome"
 INT_italy.1.d: "Italian dictator Benito Mussolini has assembled a march on the italian capital of Rome. The quadrumvirate leading the Fascist Party, General Emilio De Bono, Italo Balbo (one of the most famous ras), Michele Bianchi and Cesare Maria de Vecchi, organized the March while the Duce stayed behind for most of the march, though he allowed pictures to be taken of him marching along with the Fascist marchers. Generals Gustavo Fara and Sante Ceccherini assisted to the preparations of the March of 18 October. Other organizers of the march included the Marquis Dino Perrone Compagni and Ulisse Igliori."
 INT_italy.1.a: "Power to the Duce!"
 INT_italy.2.t: "Tellini Murdered"
 INT_italy.2.d: "In 1923 the Italian general, Enrico Tellini was part of a team of Italians sent by the League of Nationst to survey the disputed border between Greece and Albania. Whilst on the mission he was shot and killed along with four companions after their car was stopped by a fallen tree across a road that ran along the disputed border near the town of Ioannina on the way to the Albanian Border. The responsible persons were never found and incident could have been carried out by either side however the Italians under Benito Mussolini blamed the Greeks who refused any responsibility. Benito Mussolini demanded 50 million lira in reparations from Greece however they denied."
 INT_italy.2.a: "We will get out revenge!"
 INT_italy.3.t: "Italy Occupies Corfu"
 INT_italy.3.d: "After Greece denied to carry out all of the demands of the Italian ultimatum to Greece sent on August 29, 1923 the Italians whom were not satisfied with the reply of the Greek government declared it was unacceptable and on August 31, 1923 a sqadron of the Italian Navy started to bombard the Greek island of Corfu and landed 5,000 to 10,000 troops. Airplanes aided in the attack and Italian fire was concentrated on the town's old fortress which was for a long time demilitarized and served as a shelter for refugees. The bombardment lasted 15 to 30 minutes and 16 civilians were killed 30 injured and two had limbs amputated. No soldiesr were amongst the victims and a majority of those killed were children."
 INT_italy.3.a: "This is the price they have to pay!"
 INT_italy.4.t: "Resolution of Corfu Incident"
 INT_italy.4.d: "Britain favored reffering the Corfu matter to the League of Nations, but France opposed such a course of action fearing it would provide a precedent for the League to become involved in their occupation of the Ruhr and with the threat of Mussolini to withdraw Italy from the League combined with the lack of French support on the matter went to the Conference of Ambassadors. Italy's prestige was safeguarded and the French were relieved from any linkage between Corfu and the Ruhr. The Greek Fleet had to render a salute of 21 guns to the Italian fleet, a funeral service was to be attended by the Greek cabinet, Greece had to pay INT_italy 50,000,000 lire, the highest Greek military authority had to apologize to British, French, and Italian representatives at Athens, and there was to be a Greek inquiry in to the murders. Italy eventually evacuated the island and the issue was resolved."
 INT_italy.4.a: "Good thing it didn't go any further than this"
 INT_italy.5.t: "Greece says 'We won't comply with demands'"
 INT_italy.5.d: "The Greeks have responded to our list of demands saying they will not comply with them, this will mean war, or we could just let them go, however this would mean a large reduction of our prestige and loss of faith in the government by our people who would view this as a weak move."
 INT_italy.5.a: "This means war!"
 INT_italy.5.b: "Let them go"
 INT_italy.6.t: "National Fascist Party Founded in Italy"
 INT_italy.6.d: "The National Fascist Party (Partito Nazionale Fascista), was an Italian political party, created by Benito Mussolini as the political expression of Fascism (previously represented by groups known as Fasci). It was founded on November 9, 1921 by Benito Mussolini  and was deeply rooted in Italian natonalism and the desire to restore and expand Italian territories which the Italian Fascists deemed necessary for a nation to assert its superioty and strength and to avoid succumbing to decay. The group claimed modern Italy is the heir to ancient rome and its legacy and historically supported the creation of an Italian Empire to provide 'living space' for colonization by Italain settlers and to establish control over the Mediterranean Sea."
 INT_italy.6.a: "Interesting"

 INT_generic.1.t: "Factory Policy"
 INT_generic.1.d: "With the interwar period fully started, we should define our new factory policies. We could focus on mass production, or we could prioritise on inward stability and slow progress."
 INT_generic.1.a: "Our nation will be producing ALL of the guns."
 INT_generic.1.b: "We will put our nation first, and our production second."

 INT_generic.2.t: "The State of the Wife"
 INT_generic.2.d: "In this new time, this time where everything is possible and nothing is out of the blue, we are ushered into a new age. An age where women have possibilities for new opportunities, and have a chance at becoming something more to our nation. We stand at a crossroads, one which might be vital for the future of our nation."
 INT_generic.2.a: "This is certainly a matter of big importance."

 INT_generic.3.t: "[FROM.getName] rallies against Communism!"
 INT_generic.3.d: "[FROM.getName] has shown to the world that it is against us. They are an enemy to our way of life, our traditions. If they cannot see our way, their nation does not deserve to exist. "
 INT_generic.3.a: "We will certainly remember this."

 INT_generic.4.t: "[FROM.getName] rallies against Nationalism!"
 INT_generic.4.d: "[FROM.getName] has shown to the world that it is against us. They are an enemy to our way of life, our traditions. If they cannot see our way, their nation does not deserve to exist. "
 INT_generic.4.a: "We will certainly remember this."




    austria.13.t: "Habsburg Law"
    austria.13.d: "Passed on the 3rd of April 1919, the Habsburg law officially and legally dethroned the House of Habsburg-Lothringen as rulers of Austria after it had become a republic on November of 1918. All Habsburgs were exiled from Austria unless they renounced their titles and formally abdicated. The law as well confiscated their property. The law was momentarily repealed in 1935 and the family given back its property but following the Anschluss it was reintroduced by National Socialist Germany."
    austria.13.a: "They are not welcome here!"
    austria.14.t: "Carinthian Plebiscite"
    austria.14.d: "The Carinthian plebiscite was held on 10 October, 1920 in the area predominantly settled by Carinthian Slovenes. It determined the final southern border between the Republic of Austria and the newly formed Yugoslavia following WWI. The Carinthian area was disputed between both German-Austria and Yugoslavia but on November 5th, Yugoslav forces moved into the area which led to an amounting demand for a plebiscite for a region with a mixed population. The occupation of southeastern Carinthia by Yugoslav troops led to armed clashes. Before the plebiscite both sides waged intensive propaganda campaigns in which both promised a brotherhood particularly Austria. The results however were 59.1% in favor of adhesion to Austria and 40.9% in favor of annexation by Yugoslavia. Since the Austrian option gained a majority of votes in Slovene Zone A, the second stage of referendum in the Northern Zone B was not carried out and another Yugoslav foray was fiercely rejected by the Entente Powers."
    austria.14.a: "Surprising resolution"
    austria.15.t: "Marburg's Bloody Sunday"
    austria.15.d: "Marburg’s bloody sunday took place on Monday, 27, 1919 in the city of Maribor in Slovenia when Yugoslav soldiers under the command of Slovene officer Rudolf Maister killed between 9 and 13 civilians of German ethnic origin, wounding a further 60, during a protest in a city centre square. Estimates of the casualties differ between Slovene and Austrian sources."
    austria.15.a: "Horrible!"
    austria.16.t: "Treaty of Saint-Germain-en-Laye"
    austria.16.d: "The Treaty of Saint-Germain-en-Laye was signed on 10 September, 1919, by the Allies and the Republic of German-Austria. It contained the Covenant of the League of Nations and as a result was not ratified by the United States. The treaty declared the Austro-Hungarian Empire had to be dissolved and the Austrian side accept responsibility for causing the war with the rest of the Central Powers. It included large sums of war money or war reparations to the allies and prevented Austria from refraining or directly/indirectly compromising its independence meaning it could not enter into a political or economic union with the German Reich without agreement from the LoN. The new republic's initial self-chosen name German-Austria had to be changed to Austria, concription was abolished, and the Austrian Army was limited to 30,000 volunteers. \n\n The vast reduction of population, territory, and resources, wreaked havoc on the economy and Vienna the former imperial capital was now left with no empire to administrate or support it. The countries very unity was called into question and unlike Hungary, Austria never had been a nation in the true sense of word even though it existed for 700 years, it had no unifying force other than loyalty to the Hapsburgs which were now deposed for good."
    austria.16.a: "We are broken..."
    austria.17.t: "U.S.-Austrian Peace Treaty"
    austria.17.d: "The U.S.-Austrian Peace Treaty was signed between the United States and Austria in Vienna on August 24, 1921. This seperate peace treaty was required because the United States Senate refused to advise and consent to the ratification of the multilateral Treaty of Saint-Gemrain-en-Laye of 1919. The treaty laid foundations for US-Austrian cooperation and the US government embarked on a path of partially assisting the government of Austria to ease the burden of war reparations imposed in the Treaty of St. Germain."
    austria.17.a: "Great!"
    hungary.6.t: "Hungarian-Czechoslovak War"
    hungary.6.d: "The Hungarian-Czechoslovak war was fought between the First Hungarian Republic and the First Czechoslovak Republic from November 1918 to March 1920. After the collapse of Austria-Hugary which led to a declaration that formed Czechsolovakia, the Czechs and Slovaks wanted to ensure success of their territorial demands and started a counterattack on Hungary. During th ewar the Hungarian Red Army fought seperate battles against troops from Czechoslovakia and Romania, France had also been highly involved diplomatically in the conflict. 120,000 troops on both sides were involved and the war was appealing to Hungarians who were promised of regaining lost land to Czechoslovakia by Bela Kun."
    hungary.6.a: "We will retain what is rightfully ours!"
    hungary.7.t: "Easter Crisis: Part I"
    hungary.7.d: "On March 26th 1921, during the Holy Saturday that year the dit (Parlamentum Publicum) was not in session and the diplomatic corps was away at the time in the country. The regent of Hungary, Horthy had planned a quiet holiday with his family in the royal palace. Charles had been informed by his Swiss entourage whom told the former emperor of promises from European royalist circles and prompted Charles to take advantage of ‘this quiet’ against the warnings of his many supporters and Horthy himself whom said the time was not right to return to the throne. This did not change his stance as he was optimistic. His secret negotiations with Aristide Briand the French Prime Minister promised French Support if he was to succeed and no armed intervention from Hungary’s neighbors the ‘Little Entente’ whom were very willing to all invade Hungary if a Habsburg came back to power. Charles left his Swiss villa arriving undetected at Szombathely on the 26th of March where he made his way to the palace of Count Janos Mikes a prominent legitimist, from there the news spread like wildfire amongst local legitimist and by the 27th of March Charles had already acquired a small privy council including Horthy’s Minister of Education. After Charles met with the Prime Minister, Pal Teleki, he replied to Charles saying “too soon, too soon” before Charles and urged him to return back to Switzerland saying a civil war would break out with an intervention of the Little Entente. Charles made a final agreement to meet with Horthy and once he arrived at the palace, he was completely unannounced just as Horthy was sitting down to an Easter dinner with his wife. After Horthy finished his soup he led Charles to the Regent’s Office and had a two hour ‘emotional’ discussion with Charles which Horthy described as “the most difficult moments in my entire life”. Charles thanked Horthy for his service as regent but said the time came to “hand over the power to me” with Horthy replying “This is a disaster. In the name of God, Your Majesty must leave at once and return to Switzerland, before it’s too late and the powers learn of your presence in Budapest”. Charles frustrated said he “burned his bridges” speaking in German he continuously argued with Horthy and reminded him of his tearful pledge of loyalty made at the Schonbrunn Palace in November 1918 and the sworn oath of obedience to him from which he was never released. Horthy retaliated he sworn an oath to Hungary and Charles shocked said he would stick by his position and gave Horthy 5 minutes to think over it. Horthy was skeptical of Charles’s claims of assurance from PM Briand and reiterated his fear of civil war. Horthy expected Charles to leave Hungary and either march on Vienna or retire to Switzerland."
    hungary.7.a: "We will see how this progresses..."
    hungary.8.t: "Easter Crisis: Part II"
    hungary.8.d: "On the 28th of March, Czechoslovak and Yugoslavian envoys declared a restoration would be ‘casus belli’; on 1 April the diet with the legitimists abstaining passed a unanimous resolution endorsing status quo and the calls for Charles’ arrest grew louder though Horthy refused this. By April 3rd, the French PM Briant denied any deal being made which severely weakened Charles’ position. With the army still loyal to Horthy, Charles reluctantly left by train on the 5th of April reaching Hertenstein Palace that day. He still proclaimed himself to be the rightful Hungarian ruler two days later which showed up on the newspaper and the Swiss government placed stricter limits on his political activity. Charles left Hungary with a great dislike toward Horthy believing that the Great powers would not oppose restoration and that he was holding the power for his own personal reasons. He thought the Hungarian people yearned for his return, though no demonstrations of support occurred in Hungary during the Easter Crisis except minor scale demonstrations in traditionally royalist counties. People had generally treated him with indifference and Teleki resigned on the 6th of April with his poor handling of affairs."
    hungary.8.a: "Bad timing Charles"
    hungary.9.t: "March on Budapest: Part I"
    hungary.9.d: "On October 23rd 1921 a Treaty of Versailles-mandated plebiscite was scheduled to occur in Burgenland, due to this Count Gyula Ostenburg-Moravek and Colonel Lehar as well as other legitimist officers decided to take advantage of the tense situation sending Charles a message that he should seize power before the 23rd of October saying that he would expect no opposition due to the political situation and his restoration would be greeted everywhere. Charles whom got the message after dictating his will made a daredevil flight (the plane’s engine stopped working several times) in an Ad Astra Aero Junkers F.13 monoplane landing surreptitiously in Western Hungary on a field belonging to a legitimist and from there making his way to Sopron. He had no intention to seek compromise with Horthy whose cabinet he considered illegitimate and formed his own provisional government. That day a group of armored trains were being equipped in Sopron guarded by Ostenburg’s troops who were told a communist rebellion erupted in Budapest with Horthy calling on Charles to restore order. The battalion took the traditional Honved oath of Loyalty to ‘Charles of Hapsburg, King of Hungary, and King of Bohemia’. From there they departed to Budapest 190 km away in the late morning. The armada stopped at each village station to have the local garrison and public officials take the oath of loyalty and to allow groups of loyal peasants chant ‘Long live the King!’ and pay homage to the royal couple. This took approximately 10 hours which then had allowed Horthy to regroup. A report reached Horthy late on October 21st and he was shocked Lehar and Ostenburg betrayed him and Horthy communicated his decision that force would be used if necessary citing the danger Hungary would be destroyed and made a military proclamation he would keep power and demanded loyalty from his army. Most who were stationed along the Royal Armada's path found it impossible to be disloyal to Charles. As Charles approached Budapest the Entente powers reaffirmed their opposition to the restoration and Czech, Yugoslav, and Rumanian ministers made it clear such a move would be regarded as a Casus Belli. Horthy then sent a letter telling Charles, begging him to give up but the latter did not even read the letter."
    hungary.9.a: "Charles must give up on this foolish mission!"
    hungary.10.t: "March on Budapest: Part II"
    hungary.10.d: "On the morning of the 23rd of October Hungary seemed to be on the brink of a civil war. Charles’ army was outside Budapest and 30 km away from Kelenfold train station. Martial law at this time was already declared in Budapest. Czechoslovakia at the same time reported and claimed to be mobilising. Thomas Hohler the British envoy was convinced all was lost anticipating that Charles would ender Budapest that afternoon. Horthy received news that if the legitimists launched an attack the defense of Budapest would collapse. General Pal Hegedus who was a legitimist allied with Charles met with Hohler the British envoy whom informed him that Britain “Would never recognise Charles and would never permit the return of a Habsburg.”. Later warning Budapest if taken by Royal Troops would be overrun by the Czechs within a week. Hegedus now denied being associated with Charles and offered brokering an armistice after learning that Charles' assurances that the Great Powers backed him were false. Horthy later that day met with a large volunteer force which had been guarding the city giving a speech warning if Charles came to power A-H would be revived and Hungary once again would resume her inferior position. He also said that Charles’ army consisted mostly of “Austrian and Czech Volunteers”. This emboldened the army which began firing on Charles's forces. After news of the Battle of Budaors (A village close to Budapest) was spread much of Charles' supporters were surprised and lost morale thinking the march would be Budapest. After Charles’ army saw that Horthy was determined to resist and found that Charles and his officers lied that there was an eruption of a Bolshevik rebellion in budapest support grew to Pro-Horthy. By now Charles reluctantly agreed to an armistice and arranged a truce the next morning."
    hungary.10.a: "We are in no position to accept Charles as king!"
    hungary.10.b: "God save King Charles IV!"
    hungary.11.t: "Aftermath of the March on Budapest"
    hungary.11.d: "On October 24th, 1921, by which time Horthy held a decisive military advantage. Harsh terms were composed (Charles was called on to order his troops to lay down arms and turn over all war material); Charles's safety would only be guaranteed if he abdicated in writing. In return of this all supporters of the restoration, “except agitators and ringleaders”, would be amnestied. Whilst Charles read these terms shots rang out and a stray bullet hit the royal train and the train started to move westward with Lehra and Ostenburg calling for a ‘Last Stand’ and ‘Fight to the last drop of blood’, but Charles was largely reluctant to do this and ordered the train to stop and opened the window yelling  "Lehár! Ostenburg! Stop and come back here! I forbid any more fighting! It's all quite senseless now...". He then dictated the final surrender order. Many prominent legitimists were arrested and Charles complied with every request except that he did not abdicate the throne for which was agreed upon from both parties."
    hungary.11.a: "It was a lost cause anyway"


    hungary.13.t: "Exile of Charles IV"
    hungary.13.d: "On the 3rd of November 1921, the British gunboat the HMS Glowworm left Hungarian waters with the royal family aboard. At this time Bethlen presented Parliament with a bill that would nullify the Pragmatic Sanction of 1713 essentially dethroning the Habsburgs though Hungary remained a monarchy. Charles was taken to Madeira where he was permanently exiled"
    hungary.13.a: "He won't be coming back any time soon"
    hungary.12.t: "Hungarian Civil War"
    hungary.12.d: "Charles IV may have lost his chance to capture Budapest itself, but the fight will still continue, Charles has refused to give up the fight and will continue. However this won't be an easy fight, not for Charles and not for Horthy, and even if Charles manages to get the initiative there is a high chance of the Little Entente intervening against Charles to try and get some more territorial concessions out of Hungary."
    hungary.12.a: "Down with the King!"
    hungary.12.b: "God save the King!"
    hungary.14.t: "Defeat of Charles IV"
    hungary.14.d: "Charles IV has finally surrendered to following his failed attempt to take control of Hungary when he pushed the nation on a full on Civil War. Following his ultimate defeat he has turned himself over to Pro-Horthy authorities and will be taken aboard the HMS Glowworm and sent to the Portoguese island of Madiera where he will live in exile with his family."
    hungary.14.a: "He deserves worse than that for all the damage he caused!"
    hungary.15.t: "Support Charles IV?"
    hungary.15.d: "Charles IV made secret negotiations with the French Prime Minister, Aristide Briand who had led him to expect the French would support him if he succeeded and no armed intervention from Hungary's neighbors."
    hungary.15.a: "Support Charles"
    hungary.15.b: "I don't remember talking to Charles?"
    hungary.16.t: "Romanian Intervention?"
    hungary.16.d: "Following Charles' attempted 'March on Budapest' the Little Entente whom swore to never let another Hapsburg come to power ever again threatened to mobilize and march on Budapest to force a peace between both parties. If we let Charles' side we are not directly threatened in any way however, if we intervene we could get some more territory out of Hungary."
    hungary.16.a: "Intervene"
    hungary.16.B: "It's not worth it"
    hungary.17.t: "Czech Intervention?"
    hungary.17.d: "Following Charles' attempted 'March on Budapest' the Little Entente whom swore to never let another Hapsburg come to power ever again threatened to mobilize and march on Budapest to force a peace between both parties. If we let Charles' side we are not directly threatened in any way however, if we intervene we could get some more territory out of Hungary."
    hungary.17.a: "Intervene"
    hungary.17.b: "It's not worth it"
    hungary.18.t: "Yugoslav Intervention"
    hungary.18.d: "Following Charles' attempted 'March on Budapest' the Little Entente whom swore to never let another Hapsburg come to power ever again threatened to mobilize and march on Budapest to force a peace between both parties. If we let Charles' side we are not directly threatened in any way however, if we intervene we could get some more territory out of Hungary."
    hungary.18.a: "Intervene"
    hungary.18.b: "It's not worth it"
    hungary.19.t: "Horthy Negotiates Seperate Peace"
    hungary.19.d: "Our valiant leader Miklos Horthy has announced today to all Hungarians that he has been negotiating a seperate peace with the Soviet Union that should withdraw Hungary from this disastrous war, but how much of it is true is unknown with the amount of German troops occupying Hungary."
    hungary.19.a: "A precarious situation indeed..."
    hungary.20.t: "Horthy Negotiates Seperate Peace"
    hungary.20.d: "Our valiant leader Miklos Horthy has announced today to all Hungarians that he has been negotiating a seperate peace with the Soviet Union that should withdraw Hungary from this disastrous war, but how much of it is true is unknown with the amount of German troops occupying Hungary."
    hungary.20.a: "A precarious situation indeed..."


    yugoslavia.1.t: "Alexander I Assassinated!"
    yugoslavia.1.d: "After the Velebit Uprising in November 1932, Alexander ironically said "If you want to have serious riots in Yugoslavia or cause a regime change, you need to kill me. Shoot at me and be sure you have finished me off, because that's the only way to make changes in Yugoslavia". And indeed exactly that happened; on 9 October 1934, as Alexander I arrived in Marseilles to start a state visit to France in hopes to strengthen the two countries alliance in the Little Entente he was suddenly shot by Bulgarian Vladi Chernozemski as he stepped from the street and shot the King twice while he was slowly being driven through the streets. It was one of the first assassinations to be captured on film, the assassin was a member of pro-Bulgarian Internal Macedonian Revolutionary Organization which closely worked with the Croatian Ustase group."
    yugoslavia.1.a: "Changes will be made!"
    yugoslavia.2.t: "Peter I Dies"
    yugoslavia.2.d: "King Peter I has died in Belgrade on August 16, 1921 at the age of 77. His legacy however will live on of uniting the majority of South Slavs into what we know as Yugoslavia today."
    yugoslavia.2.a: "He will be missed!"
    yugoslavia.3.t: "Stjepan Radic Assassinated!"
    yugoslavia.3.d: "Stjepan Radic was a Croatian politician and founder of the Croatian People's Peasant Party and largely opposed the union with Yugoslavia and Serb Hegemony in the unified state. With the Radical Party weakened in 1928, Radic's own Peasant-Democratic coalition was still not able to form a government which led to the atmosphere in the parlianment becoming increasingly unstable and contentious based on ethnic lines. Death threats and threats of violence were made against Radic in parliament and he was warned of an assassination attempt against him however he replied he was like a soldier in the war, in the trenches, and such was his duty to go. In the Assembly, Punisa Racic, a member of the People's Radical Party got up and made a provocative speech which produced a stormy reaction from the opposition but Radic stayed compeltely silent, as Punisa Racic made his way to the speaker podium facing the Croats he put his hand in his pocket where he held a revolver, as he pulled out his gun Minister Vujicic grabbed his gun but he broke himself free and fired shots which killed Radic. This would lead to Alexander I later abolishing the constitution, dissolving parliament, and declaring a royal dictatorship."
    yugoslavia.3.a: "The Croatian problem is dealt with...for now"
    yugoslavia.4.t: "6th January Dictatorship"
    yugoslavia.4.d: "At response to the political crisis triggered by the assassination of Stjepan Rdaic, King Alexander abolisheed the Constitution, dissolved parliament, and declared a personal/royal dictatorship (called the January 6th Dictatorship) and changed the name of the country to the Kingdom of Yugoslavia."
    yugoslavia.4.a: "Order shall be restored!"
    yugoslavia.5.t: "Velebit Uprising"
    yugoslavia.5.d: "The Velebit Uprising took place during the night of September 6 and 7, 1932 as the Ustase launched an attack on a police station in Brusane village near Gospic. The Yugoslav authorities were unnerved by the small uprising because the power of the Ustase at the time was unknown, as a result major security measures were insured and this action had a large impact in foreign media, especially that from Italian and Hungarian Press."
    yugoslavia.5.a: "This an uprising? More like a joke!"
    yugoslavia.6.t: "1931 Yugoslav Constitution"
    yugoslavia.6.d: "The 1931 Yugoslav Constitution was the final Constitution of the Kingdom of Yugoslavia issued by decree on September 3, 1931. It banned the posession of firearms within by members of Parliament while in session and transferred executive power to Alexander I. Elections were to be by universal male suffrage. The provision for a secret ballot was dropped and pressure on public employees to vote for the governing party was to be a feature of all elections held under Alexander's constitution. The King would also ahve permission to appoint half of the upper house directly and legislation could become law with the approval of one of the houses alone if it were also approved by the King."
    yugoslavia.6.a: "Interesting"
    shammar.1.t:0 "The Assassination of Saud bin Abdulaziz"
    shammar.1.d:0 "Emir Saud bin Abdulaziz of the House of Rashid has been assassinated by his cousin Abdullah bin Talal. His death leaves the court to manage another succession amid the rivalries that threaten the emirate."
    shammar.1.a:0 "Secure the court and the succession."
    shammar.2.t: "Fall of the Central Powers"
    shammar.2.d:0 "The defeat of the Central Powers has deprived the emirate of Ottoman support. With Nejd pressing its ambitions and Britain influential in the region, our government must face a far more uncertain struggle for survival."
    shammar.2.a:0 "The emirate must stand alone."


    news.42.d: "The Tragic Week was a series of riots and massacres that took place in Buenos Aires, Argentina during the week of January 7th, 1919. The riot was led by anarchists and communists, and was eventually crushed by the Argentine Federal Police under Luis Dellepiane and the intervention of the Army. It resulted in a total of 700 hundred casualties. The conflict began as a strike at a British owned plant in the suburbs of Buenos Aires which at first attracted no attention but eventually picketing workers fired on a group of policemen. Eventually after the police fought it out with the striking workers at the Vasena metal works, shortly after mobs went loose all over the city and everything went out of control. Groups overturned and burned street cars and robbed shops for guns, and violence erupted in Congress."
    argentina.1.t: "The Tragic Week"
    argentina.1.d:0 "A strike at the Vasena metalworks has escalated into street fighting in Buenos Aires. Police, soldiers and armed civilian groups are confronting workers and demonstrators, leaving many dead as violence spreads through the city."
    argentina.1.a:0 "Restore order and tend to the wounded."
    argentina.2.t:0 "The Napalpí Massacre"
    argentina.2.d:0 "Police and armed settlers have attacked indigenous workers and their families at Napalpí. Reports of killings have reached the authorities, exposing the violence behind the labour dispute and conditions in the territory."
    argentina.2.a:0 "The killings demand an accounting."


    georgia.1.t: "1920 Gori Earthquake"
    georgia.1.d: "The 1920 Gori earthquake hit the Democratic Republic of Georgia on the 20 February, with a magnitude of 7.2. There was heavy damage which an additional 114-130 deaths which affected the town of Gori."
    georgia.1.a: "It could have been a lot worse"
    georgia.2.t: "1920 Coup Attempt"
    georgia.2.d: "On May 3, 1920, an unsuccessful attempt to take power by the Bolsheviks in the Democratic Republic of Georgia by a coup was tried. The Bolsheviks attempted to take control of a military school and government offices in the Georgian capital of Tbilisi but the Georgian government  suppressed disorders in Tbilisi and concentrated forces on successfully blocking the advance of Russian troops on the Azerbaijani-Georgian Border. The Georgian resistance combined with the uneasy war with Poland persuaded Red leadership to deter plans for Georgia’s sovietization and recognize Georgia as an independent nation in the May 7 Treaty of Moscow, for the moment."
    georgia.2.a: "This is preposterous!"
    georgia.3.t: "Treaty of Moscow 1920"
    georgia.3.d: "The Treaty Of Moscow signed between the Russian SFSR and the Democratic Republic of Georgia on May 7, 1920 granted Georgia de jure recognition of independence in exchange for a promise not to grant asylum on Georgian soil to troops of powers hostile to Bolshevik Russia."
    georgia.3.a: "How long will this phony peace last?"

    ww1_baltic.1.t: "Dissolution of the United Baltic Duchy"
    ww1_baltic.1.d:0 "Germany's defeat and the withdrawal of its troops have undermined the United Baltic Duchy. The regency can no longer sustain its authority as Estonian and Latvian national governments press their claims to independence."
    ww1_baltic.1.a:0 "The duchy cannot endure."
    ww1_baltic.2.t: "Treaty of Riga"
    ww1_baltic.2.d:0 "Latvian and Soviet Russian representatives have concluded a peace treaty at Riga. Moscow recognises Latvia's independence, bringing the war between the two governments to an end."
    ww1_baltic.2.a:0 "Our independence is recognised."
    ww1_baltic.3.t: "Treaty of Tartu"
    ww1_baltic.3.d:0 "A peace treaty signed at Tartu ends the war between Estonia and Soviet Russia. Moscow recognises Estonian independence and renounces its former claims, giving the republic a crucial diplomatic settlement."
    ww1_baltic.3.a:0 "Ratify the peace."
    ww1_baltic.4.t: "Moscow Peace Treaty"
    ww1_baltic.4.d:0 "Lithuanian and Soviet Russian representatives have signed a peace treaty in Moscow. The agreement recognises Lithuanian independence and sets out the terms of their relationship amid the wider conflict in the region."
    ww1_baltic.4.a:0 "A diplomatic foundation for independence."
    ww1_baltic.5.t:0 "A Failed Coup in Lithuania"
    ww1_baltic.5.d:0 "Authorities have uncovered a plot to overthrow the Lithuanian government and replace it with one prepared to accept union with Poland. The attempt has failed, but it has deepened suspicion between the two countries at a dangerous moment."
    ww1_baltic.5.a:0 "Guard against further interference."
    ww1_baltic.6.t: "Polish-Lithuanian War"
    ww1_baltic.6.d:0 "The dispute over Vilnius and the surrounding region has drawn Poland and Lithuania into armed conflict. Rival claims and movements along the frontier threaten to turn the struggle over the city into a lasting confrontation."
    ww1_baltic.6.a:0 "Defend our claims to Vilnius."
    ww1_baltic.7.t: "Suwałki Agreement"
    ww1_baltic.7.d:0 "Polish and Lithuanian representatives have reached an agreement at Suwałki following international pressure to halt the fighting. The terms seek to stabilise the front, although the dispute over Vilnius remains unresolved."
    ww1_baltic.7.a:0 "Uphold the agreement."
    ww1_baltic.8.t:0 "The Żeligowski Mutiny"
    ww1_baltic.8.d:0 "Troops under General Żeligowski have entered the Vilnius region in a proclaimed mutiny against the Polish command. The operation has established a new authority in the city while Warsaw denies responsibility, leaving Lithuania to face another challenge to its claims."
    ww1_baltic.8.a:0 "Vilnius has a new authority."
    ww1_baltic.9.t:0 "A Failed Uprising in Tallinn"
    ww1_baltic.9.d:0 "An armed communist attempt to seize power in Tallinn has been defeated. Government forces have regained control, and arrests are continuing as the authorities investigate the organisation and support behind the uprising."
    ww1_baltic.9.a:0 "The government has held."
    ww1_baltic.10.t:0 "A Coup in Lithuania"
    ww1_baltic.10.d:0 "A military coup has displaced Lithuania's elected government and brought Antanas Smetona to power. The new leadership promises order, while its opponents face the loss of parliamentary authority and growing restrictions on political life."
    ww1_baltic.10.a:0 "A new administration takes power."
    ww1_baltic.11.t: "Lithuanian Monarchy Comes to an End"
    ww1_baltic.11.d:0 "Germany's defeat has ended the prospect of a Lithuanian monarchy under German protection. The government has adopted a republican course as it seeks to secure the country's independence."
    ww1_baltic.11.a:0 "Establish the republic."
    eg_finland.1.t: "East Karelian Uprising"
    eg_finland.1.d: "On November 6th, 1921 East Karelian separatists aided by a number of Finnish volunteers fought a conflict with the RSFSR hoping to gain independence. This was supported by a number of Finnish nationalists through the idea of a ‘Greater Finland’ but were not considered wars between Russia and Finland."
    eg_finland.1.a: "Interesting..."
    eg_finland.2.t: "Civil War Over!"
    eg_finland.2.d: "The Civil War which has started on January 27, 1918, has finally ended today with the Finnish Whites in full control of the country, thanks due to help given to the whites from the Imperial German Army which has reinforced the Whites regularly throughout the war. There is no doubt that the German Empire has secured its hegemony in Finland with plans being to establish a German-led Finnish monarchy. The civil war however has still left the nation divided and it is unknown when the Finnish society will truly be reunited."
    eg_finland.2.a: "Thank god!"
    eg_finland.3.t: "Civil War Over!"
    eg_finland.3.d: "The Civil which has started earlier this year on January 27, 1918 between the Finnish Reds and Finnish Whites has finally ended today with the Reds retaining full control of the country, thanks due to help given from our Soviet allies who are still fighting their own civil war at this very moment. There is no doubt about it that the revolution should be spread to all corners of the world and we plan to achieve that with our Soviet ally. However the Civil War has left our nation divided and it is unknown when the Finnish society will be mended once and for all."
    eg_finland.3.a: "Hurray!"
    eg_finland.4.t: "Moscow Armistice"
    eg_finland.4.d: "The war for Finland has not been so kind, although we have regained much of our land annexed in the Winter War by the Soviet Union the tide has turned against us and before it is too late we should sign an armistice to stop the fighting or end up like one of Germany's other allies, invaded by communism with a puppet bolshevik government installed against the peoples will."
    eg_finland.4.a: "It is time to put an end to this war"
    eg_finland.4.b: "We will keep fighting!"
    eg_finland.5.t: "Risto Ryti Resigns"
    eg_finland.5.d: "Risto Ryti, our president has announced that he will be resiging following the new Soviet Offensive which has pushed us back and broke through to the Karelian Isthmus. His successor will be none other than Carl Gustaf Emil Mannerheim who is determined to seek an alternative rather than cotninuing this war we have no chance at winning."
    eg_finland.5.a: "Lets hope things can turn around"
    eg_finland.6.t: "Lappland War Begins"
    eg_finland.6.d: "Today our government, shortly following their signing of the Moscow Armistice has started fighting German divisions in their country in an effort to push out the frantically fleeing German divisions from northern Finland."
    eg_finland.6.a: "We will fight if we have to!"
    eg_finland.7.t: "King Proclaimed"
    eg_finland.7.d: "Following the victory of the white faction in the Civil War the Social Democrat party has been excluded from the parliament where a new constitution has been adopted allowing for Karl Fredrik of Hesse to be elected to the throne of Finland today."
    eg_finland.7.a: "So the Kingdom of Finland it is"
    eg_finland.8.t: "Frderick Charles Abdicates Throne!"
    eg_finland.8.d: "Following the German defeat in the Great War barely a month ago the weest has been weary of having a German born prince as the Kingd of Finland, along with several warnings recieved Frederick Charles was convinced into renouncing the throne today with C.G.E. Mannerheim being made regent for the mean time before the upcoming elections."
    eg_finland.8.a: "It was never meant to be"

    norway.1.t: "Christiania in Norway changes name to Oslo"
    norway.1.d: "After the city was moved closer to the Akershus Fortress during the Reign of Christian IV of Denmark following its destruction by a fire in 1624, it was renamed Christiania in his honour, however it was then known as Kristiania from 1877 and 1925 and eventually on 1 January, 1925, its original Norwegian name ‘Oslo’ was restored."
    norway.1.a: "Oslo it is!"
    transcauc.1.t:0 "Georgia Seeks Independence"
    transcauc.1.d:0 "Georgian leaders are seeking to leave the federation and establish an independent republic with German support. The government must decide whether to accept the separation or attempt to hold the union together by force."
    transcauc.1.a:0 "Accept the separation."
    transcauc.1.b:0 "Preserve the federation by force."
    transcauc.1.c:0 "Continue the struggle as Georgia."
    transcauc.2.t: "The End of Transcaucasia"
    transcauc.2.d:0 "The federation can no longer reconcile the separate ambitions of its members. Armenian and Azerbaijani leaders are preparing independent governments as disputes over territory and the position of Baku threaten further fighting."
    transcauc.2.a:0 "Stand with Armenia."
    transcauc.2.b:0 "Stand with Azerbaijan."
    transcauc.3.t: "Treaty of Poti"
    transcauc.3.d:0 "Georgia has concluded an agreement with Germany at Poti, exchanging access and economic arrangements for protection and recognition. The government hopes the understanding will strengthen its position against outside threats while it consolidates independence."
    transcauc.3.a:0 "Ratify the understanding."
    transcauc.4.t:0 "The Baku Commune"
    transcauc.4.d:0 "Bolshevik leaders have established a commune in Baku amid the struggle for control of the city. Its armed supporters and opponents are preparing for a confrontation as rival authorities seek outside assistance."
    transcauc.4.a:0 "Watch the struggle for Baku."
    transcauc.4.b:0 "Move against the commune."
    transcauc.5.t: "Fall of Baku Commune"
    transcauc.5.d:0 "The Bolshevik administration in Baku has fallen, and a new Central Caspian authority is seeking British support. The struggle for the city continues as Ottoman and Azerbaijani forces threaten its position."
    transcauc.5.a:0 "A new authority takes control."
    transcauc.6.t: "March Days"
    transcauc.6.d:0 "Fighting in Baku between rival political and armed groups has escalated into mass violence against Muslim civilians. Reports of killings are deepening the divisions in the city and the hostility between communities across the region."
    transcauc.6.a:0 "The violence must end."
    transcuac.7.t: "Svalbard Treaty"
    transcauc.7.d:0 "An international treaty has recognised Norwegian sovereignty over Svalbard. The agreement also establishes terms for commercial access and limits on military use of the Arctic archipelago."
    transcauc.7.a:0 "An agreement for the Arctic."
    transcauc.8.t:0 "The Leipzig War Crimes Trials"
    transcauc.8.d:0 "Trials of Germans accused of wartime offences have opened before the court at Leipzig. The proceedings face intense scrutiny as the Allied governments and the German authorities dispute how responsibility for the conduct of the war should be judged."
    transcauc.8.a:0 "The proceedings face a difficult test."
    transcauc.9.t:0 "The Kaiser Remains in Exile"
    transcauc.9.d:0 "The Dutch government has rejected Allied demands to extradite the former German emperor. Wilhelm II will remain in exile in the Netherlands as the dispute over his responsibility for the war continues."
    transcauc.9.a:0 "The Netherlands will not surrender him."
    transcauc.10.t:0 "The Transcaucasian Federation Dissolves"
    transcauc.10.a:0 "Recognise the successor governments."
    transcauc.10.d:0 "The federation can no longer contain the competing claims of its member governments. Armenian and Azerbaijani authorities are preparing to establish separate states as the common administration breaks down."


    persia.1.t: "Persian Couo d'etat of 1921"
    persia.1.d:0 "Cossack troops under Reza Khan have entered Tehran and compelled the government to resign. The coup has exposed the weakness of the Qajar administration as its new leaders seek to establish control amid unrest and foreign pressure."
    persia.1.a:0 "A new government takes control."
    persia.2.t: "Russo-Persian Treaty of Friendship"
    persia.2.d:0 "Persian and Soviet Russian representatives have signed a treaty of friendship. The agreement renounces earlier privileges and addresses navigation in the Caspian, while both governments seek a more secure relationship along their troubled frontier."
    persia.2.a:0 "Ratify the treaty."
    persia.3.t: "Persian Socialist Soviet Republic Founded"
    persia.3.d: "In May 1920, as the Soviet Caspian Fleet entered the Caspian port of Anzali. This mission was declared to be only in pursuit of Russian vessels and ammunition taken to Anzali by White Russian counter-revolutionary General Denikin who was given asylum in Anzali and was soon evacuated. The Jangalis (Group that rebelled against monarchist rule of Iran) there felt the Bolsheviks offered a real solution to the problems shared by both Russia and Persia, more or less the domination of the upper-classes and the Imperial Court. Kuchik Khan’s second-in-command had become a communist and advocate of an alliance with the Bolsheviks. Kutchik Khan was hesitant at first due to his religious and nationalist background but eventually entered an agreement with the Bolsheviks. In May 1920 the Persian Socialist Soviet Republic was declared however by 1921 the Soviets decided not to further support the Persian SSR as they made an agreement with the British and the Russo-Persian Treaty of Friendship was signed. The Soviet Republic of Gilan officially came to an end in September 1921."
    persia.3.a:0 "The revolutionary government has fallen."
    persia.4.t: "End of the Persian Socialist Soviet Republic"
    persia.4.d:0 "The Persian Socialist Soviet Republic has lost the outside support on which it depended. Its collapse ends the revolutionary government's hold in Gilan, leaving the central authorities to reassert their position."
    persia.4.a: "Great!"
    persia.5.t: ""
