    spain1.1.t:0 "The Assassination of Eduardo Dato"
    spain1.1.d:0 "Prime Minister Eduardo Dato has been assassinated in Madrid while returning from parliament. The killing adds to the strain on a political system already challenged by labour unrest and violence."
    spain1.1.a:0 "The government must face this crisis."
    spain1.2.t: "Spanish Foreign Legion Founded"
    spain1.2.d:0 "A royal decree has authorised the formation of a Foreign Legion for service under Spanish command. The army must now recruit and organise the new force as it seeks a more dependable instrument for its colonial campaigns."
    spain1.2.a:0 "Organise the new force."
    spain1.3.t:0 "The Rising in the Rif"
    spain1.3.d:0 "Resistance in the Rif has developed into a serious challenge to Spanish authority. Fighters under Abd el-Krim are attacking our positions, forcing the government to confront the weaknesses of its occupation and the demands of another campaign."
    spain1.3.a:0 "Review our position in the Rif."
    white.1.t: "Kolchak Executed"
    white.1.d: "Kolchak was promised safe passage by the Czechoslovaks to the British military mission in Irkutsk. Instead, he was handed over to the Left Soviet Russian authorities in Irkutsk on 14th of January 1920. On the 20th of January the government in Irkutsk surrendered power to a Bolshevik military committee. The White Army under the command of General Vladimir Kappel advanced toward Irkutsk while Kolchak was interrogated by a commission of five men representing the Revolutionary Committee (REVKOM) during nine days between the 21st of January and 6th of February. Despite the arrival of a contrary order from Moscow, Admiral Kolchak was condemned to death along with his Prime Minister, Viktor Pepelyaev. Both prisoners were brought before a firing squad in the early morning of 7 February 1920. According to eyewitnesses, Kolchak was entirely calm and unafraid, "like an Englishman." The Admiral asked the commander of the firing squad, "Would you be so good as to get a message sent to my wife in Paris to say that I bless my son?" The commander responded, "I'll see what can be done, if I don't forget about it." A priest of the Russian Orthodox Church then gave the last rites to both men. The squad fired and both men fell. The bodies were kicked and prodded down an escarpment and dumped under the ice of the frozen Angara River. When the White Army learned about the executions, its remaining leadership decided to withdraw farther east. The Great Siberian Ice March then followed. The Red Army did not enter Irkutsk until 7 March, and only then was the news of Kolchak's death officially released and the dream of restoring the Monarchy to Russia was crushed."
    white.1.a: "How Terrible!"
    white.2.t: "Great Siberian Ice March"
    white.2.d: "Following Alexander Kolchak’s defeat and subsequent retreat across Siberia during the winter of 1919-1920 (with the Red Army pursuing) which came to a halt near Irkutsk the White Army suffered tremendous casualties, and once at Irkutsk tried to flee across the then frozen Lake Baikal with their possessions and the stolen Kazan Gold. The Arctic winds at the same time blew unobstructed across the lake with many soldiers and their families freezing to death on the lake, during the spring the corpses and their possessions disappeared in the deepest lake in the world and Vladimir Kappel, one of the White Army generals fell victim to this as well. It is believed most of the Tsar’s Gold disappeared here sinking to the bottom of the lake."
    white.2.a: "We musn't give up!"
