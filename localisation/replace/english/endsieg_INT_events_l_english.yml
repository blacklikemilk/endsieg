    eg_romania.1.t: "Treaty of Bucharest 1918"
    eg_romania.1.d:0 "Romania has signed the Treaty of Bucharest after its isolation on the eastern front. Territorial concessions and extensive economic privileges for the Central Powers impose a heavy burden on the country as the government seeks to preserve what it can of its position."
    eg_romania.1.a:0 "The country must bear these terms."
    eg_romania.2.t: "Treaty of Bucharest Declared Null and Void"
    eg_romania.2.d:0 "Germany's defeat has undone the settlement imposed at Bucharest. The government can now challenge the concessions extracted during the war and pursue a new diplomatic settlement."
    eg_romania.2.a:0 "The imposed settlement is at an end."
    eg_romania.3.d:0 "The National Council of Bessarabia has proclaimed union with Romania. The government must now consolidate the arrangement amid competing claims and uncertainty over the region's future."
    eg_romania.3.t: "Union of Rumania with Bessarabia"
    eg_romania.3.a:0 "Consolidate the union."
    eg_romania.4.t: "King Michael's Coup"
    eg_romania.4.d: "Following a successful Soviet offensive into Northeastern Romania, King Michael who had been viewed as a mere figure head in Romanian politics successfully overthrew Ion Atonescu and alligned himself with the allies declaring war on Germany shortly after, however King Michael only shortly remained the Head of State of Romania being being replaced by a Soviet Communist Puppet Government."
    eg_romania.4.a: "The war continues, now on Germany!"
    eg_romania.5.t: ""
    eg_romania.5.d: ""
    eg_romania.5.a: ""
    bulgaria.1.t: "Armistice of Salonica"
    bulgaria.1.d: "The Armistice of Salonica was signed 29th September 1918 between Bulgaria and the Allied Powers in Thessaloniki following a request for ceasefire five days earlier on the 24th of September. The Request followed successful allied Vardar Offensive that penetrated through the Bulgarian defenses in Macedonia from which the Central Powers never recovered from. The armistice called for the immediate demobilization of all Bulgarian military activities, the evacuation of Bulgarian-occupied Greek and Serbian territories as well as Bulgaria allowing the Allies to pass through Bulgarian territory."
    bulgaria.1.a: "We are cursed with defeat after defeat"
    bulgaria.2.t: "Ferdinand I Abdicates the Throne"
    bulgaria.2.d: "In order to save the Bulgarian throne, Ferdinand who by this time had become very unpopular with the people losing two great conflicts which resulted in territorial loss handed over the throne via abdication to his eldest son Tsar Boris III on the 3rd of October 1918. Under this new leadership Bulgaria surrendered to the allies."
    bulgaria.2.a: "Boris III will bring us back!"
    bulgaria.3.t: "St. Nedelya Church Assault"
    bulgaria.3.d: "The St Nedelya Church assault was a terrorist attack on St Nedelya Church in Sofia, Bulgaria, It was carried out on 16 April, 1925, when a group of Bulgarian Communist Party members blew up the church’s roof during the funeral service of General Konstantin Georgiev who had been killed in a previous Communist assault on 14 April. 150 people, mainly from the country’s political and military elite, were killed in the attack and around 500 were injured."
    bulgaria.3.a: "Tragic"
    bulgaria.4.t: "Boris III Dies"
    bulgaria.4.d: "Shortly after returning to Sofia from a meeting with Hitler, Boris III died supposedly of heart failure on 28 August, 1943. It is believed the King was poisoned during his stay in Germany, one of them Hans Eppinger believe he found the same poison he had allegedly found two years prior in a postmortem examination of Ioannis Metaxas, a slow poison which takes week to do its work. Boris will be succeeded by his six-year-old son Simeon II under a regency council headed by Prince Kiril of Bulgaria."
    bulgaria.4.a: "What a tragedy!"
    crybabia.1.t: "Conquest of Ha'il"
    crybabia.1.d: "The Conquest of Ha’il also known as the Second Saudi-Rashidi War was fought between Saudi forces which received British military assistance against the Emirate of Jabal Shammar under the last Rashidi ruler who would surrender Jabal Shammar to the saudi forces on November 2, 1921."
    crybabia.1.a: "Ha'il will fall to us!"
