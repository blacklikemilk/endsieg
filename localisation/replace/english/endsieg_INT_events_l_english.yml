l_english:
 interwar_greece.1.t: "Vardar Offensive Begins"
 interwar_greece.1.d: "The Vardar Offensive was fought between the 15th and 29th of September 1918 which ultimately led to the defeat of the Kingdom of Bulgaria on the Macedonian Front an ultimate armistice was signed. A combined force of Serbian, French, and Greek troops attacked the Bulgarian-held trenches in Dobro Pole, present day Macedonia. Being defeated twice already the allies preceding artillery preparation and assault had a devastating effect on Bulgarian morale which led to mass desertions along the front in a chaotic manner. After the allies captured the former HQ of Uskub and endangered the remenants of the 11th Army with the development of an anti-moanrchist Radomir Rebellion, the Kingdom of Bulgaria was forced to sign the Armistice of Salonica and withdrew from the war. \n\n If you're a player you get the idea 'Vardar Offensive' which gives you tons of bonuses, good luck!"
 interwar_greece.1.a: "They will shatter like glass"
 interwar_greece.2.t: "Death of Alexander I"
 interwar_greece.2.d: "On October 2, 1920, King Alexander while trying to separate a barbary macaque monkey attacking his German Shepherd Dog got in the process bit deeply in the leg and torso by another monkey. The king did not consider the incident serious and his wounds were promptly cleaned and dressed. However in the evening his wounds became infected and he gained a strong fever and septicemia set it. His doctors considered amputating his leg but nobody wanted to take responsibility for such a drastic act. 23 days later on October 25, 1920, Alexander died of sepsis and his body was conveyed to Athens Cathedral."
 interwar_greece.2.a: "May he rest in peace..."
 interwar_greece.3.t: "Referendum for Return of Constantine I"
 interwar_greece.3.d: "A Referendum on the return of King Constantine I was held in Greece on the 22nd of November 1920, it followed the death of his son, King Alexander. The Proposal was happily approved by 99.0% of the voters. The result ensured and affirmed the dominance of the Anti-Venizelist camp in the country."
 interwar_greece.3.a: "God Save the King!"
 interwar_greece.4.t: "Constantine I Abdicates!"
 interwar_greece.4.d: "Following the failed Asia Minor Campaign the king's new-found popularity was lost again and following the army revolt Constantine abdicated the throne once again on 26 September, 1922 and was succeeded by his eldest son, George II."
 interwar_greece.4.a: "Down with the monarchy!"
 interwar_greece.5.t: "11 September 1922 Revolution"
 interwar_greece.5.d: "The 11 September, 1922 revolution was an uprising by the Greek army and navy against the government in Athens. Following the Greek Army's defeat in the Asia Minor campaign and the army's evacuation from anatolia to the Greek islands in the eastern Aegian there was high discontent amongst the middle-ranking officers and men for the campaign's conduct by the royal government boiled over into an armed revolt led by pro-Venizelist and anti-royalist officers. The mutiny spread quickly and managed to seize power inAthens forcing King Constantine I to abdicate and leave the country not longer after and left the military government in control of the country until 1924 when the Greek Monarchy was officially abolished."
 interwar_greece.5.a: "The monarchy has brought nothing but trouble!"
 interwar_greece.6.t: "Constantine I Dies"
 interwar_greece.6.d: "After being exiled to Italy following his abdication he lived a mere four months of his life being dying on January 11, 1923 at Palermo, Sicily of heart failure. His life and reign that started under the brightest of auspices ended in utter ruin."
 interwar_greece.6.a: "He won't be missed here"
 interwar_greece.7.t: "Second Hellenic Republic Proclaimed!"
 interwar_greece.7.d: "The Second Hellecnic Republic was proclaimed on 25 March, 1924, in the aftermath of Greece's deeat by Turkey in the Asia Minor Campaign which was widely blamed on the royalist government."
 interwar_greece.7.a: "Long live the republic!"
 interwar_greece.8.t: "Greek Republic Referendum"
 interwar_greece.8.d: "A referendum on becoming a republic was held in Greece on 13 April 1924, it followd the catastrophic outcome of the Asia Minor Campaign in which the Greek dreams of recapturing Constantinople were dashed and as a result Constantine I was forced to abdicate and George II, the heir presumptive went on to live in Romania while the government debated the fate of the Monarchy. Ultimately a plebiscite in which 70% people voted for the republic and only 30% voted against."
 interwar_greece.8.a: "A better future awaits!"
 interwar_greece.9.t: "Corfu Incident: Our Reply"
 interwar_greece.9.d: "The Italian Government has given us a list of silly demands such as rendering a salute to their fleet, depositing 50,000,000 lire, apologising for something we were not even reponsible for. The question is, is it worth it to just give up or keep our prestige and risk a war between our two countries?"
 interwar_greece.9.a: "Peace"
 interwar_greece.9.b: "We will protect our honor!"
 interwar_greece.10.t: "Pangalos Takes Power!"
 interwar_greece.10.d: "On June 24, 1925, officers loyal to Pangalos, fearing that the political instability was putting his country at risk, overthrew the government in a coup and forced President Pavlos Kountouriotis to appoint Pangalos as Prime Minister. Pangalos immediately abolished the young republic and began to prosecute anyone who could possibly challenge his authority, including his old chief, Plastiras. Freedom of the press was abolished, and a number of repressive laws were enacted (including a law dictating the length of women's skirts - no more than 30 cm above the ground), while Pangalos awarded himself the Grand Cross of the Order of the Redeemer."
 interwar_greece.10.a: "He won't last long..."
 interwar_greece.11.t: "Pavlos Jountoriotis Ends Dictatorship"
 interwar_greece.11.d: "After Theodoros Pangalos took power in a quick and fast military coup abolishing the republic for pear of instability and the country being put at risk he soon began to use his powers irresponsibly and passed a series of repressive laws such as dicating length of women's skirts - no more than 30 cm above the ground, awarded himself the Grand Cross of the Order of the Redeemer, and prosecuted anyone who opposed him. On August 29, 1926 a counter coup led by General Georgios Kondylis deposed him and Pavlos Kountouriotis returned to power as president while Pangalos was imprisoned for two years in the Izzeddin Fortress."
 interwar_greece.11.a: "Get out of here you dictator!"
 interwar_greece.12.t: "Welcome to the Mod"
 interwar_greece.12.d: "Greek situation \n\nGreece had just entered the war on the side of the allies in the summer of 1917 following the deposition of the pro-German, King Constantine I, and the rise of his pro-Allies son Alexander I. Thus forming the Macedonian front which had mostly stayed stable for now..."
 interwar_greece.12.a: "Ok!"

 interwar_soviet.1.t:0 "The Communist International"
 interwar_soviet.1.d:0 "Delegates from communist parties have gathered in Moscow to establish a new international organisation. Its founders intend to unite revolutionary movements around a common programme after the divisions exposed by the war."
 interwar_soviet.1.a:0 "Workers of the world, unite!"
 interwar_soviet.2.t:0 "Aid for the Persian Socialists"
 interwar_soviet.2.d:0 "The Persian Socialist Republic has appealed for help in sustaining its forces. Supplies from Russia could strengthen its position on the Caspian and demonstrate that its struggle has support beyond Persia."
 interwar_soviet.2.a:0 "Send arms and provisions."
 interwar_soviet.3.t: "The Westward Offensive"
 interwar_soviet.3.d: "With the former areas ceded to Germany and her puppets now abandoned by the Ober Ost garrisons which have been withdrawn back to Germany following their defeat we have decided to move our troops back into these abandoned lands to reintigrate them back where they belong, with us!"
 interwar_soviet.3.a: "We will have our land back!"
 interwar_soviet.4.t:0 "Intervention for Soviet Hungary"
 interwar_soviet.4.d:0 "The Hungarian Soviet Republic is fighting for its survival against neighbouring opponents. Our government is preparing to enter the struggle against Romania and give the Hungarian revolution the direct support its leaders have sought."
 interwar_soviet.4.a:0 "Intervene in support of Hungary."
 interwar_soviet.5.t:0 "Intervention in Finland"
 interwar_soviet.5.d:0 "Red Finland faces an uncertain struggle against its opponents. The Soviet government is preparing to commit its own forces, turning assistance to the Finnish revolution into an open conflict with the White Finnish authorities."
 interwar_soviet.5.a:0 "Stand beside Red Finland."
 interwar_soviet.6.t: "Invasion of Azerbaijan"
 interwar_soviet.6.d: "With the Central Powers defeated in the First World War there is no treaty or foreign armies left to defend these wreteched lonely and isolated capitalist states whom belong with the motherland!"
 interwar_soviet.6.a: "You belong with US!"
 interwar_soviet.7.t: "Invasion of Georgia"
 interwar_soviet.7.d: "With the Central Powers defeated in the First World War there is no treaty or foreign armies left to defend these wreteched lonely and isolated capitalist states whom belong with the motherland!"
 interwar_soviet.7.a: "You belong with US!"
 interwar_soviet.8.t: "Invasion of Armenia"
 interwar_soviet.8.d: "With the Central Powers defeated in the First World War there is no treaty or foreign armies left to defend these wreteched lonely and isolated capitalist states whom belong with the motherland!"
 interwar_soviet.8.a: "You belong with US!"
 interwar_soviet.9.t:0 "The Treaty of Kars"
 interwar_soviet.9.d:0 "Negotiations with Turkey have produced a settlement of the southern frontier. The agreement returns Kars to Turkish authority and establishes a basis for more stable relations across the Caucasus."
 interwar_soviet.9.a:0 "Ratify the frontier settlement."
 interwar_soviet.10.t:0 "Supplies for Red Finland"
 interwar_soviet.10.d:0 "The Finnish Reds have requested further weapons and provisions. Our representatives urge that we answer the appeal before shortages undermine their forces."
 interwar_soviet.10.a:0 "Dispatch the supplies."
 interwar_soviet.11.t:0 "Supplies for Soviet Hungary"
 interwar_soviet.11.d:0 "The Hungarian Soviet Republic is seeking weapons and provisions from Russia. Its representatives warn that the revolution cannot sustain a prolonged struggle without dependable outside assistance."
 interwar_soviet.11.a:0 "Send the requested aid."
 interwar_soviet.12.t:0 "A Soviet Government in Romania"
 interwar_soviet.12.d:0 "Romania's defeat has opened the way for a new political settlement. Our representatives are preparing a communist government in Bucharest whose authority will rest upon close ties to Soviet Russia."
 interwar_soviet.12.a:0 "Establish the new government."
 interwar_soviet.13.t:0 "A Closer Bond with Soviet Hungary"
 interwar_soviet.13.d:0 "The Hungarian Soviet Republic has become increasingly dependent on Russian support. Our government is moving to place that relationship on a more binding footing, bringing Budapest under Soviet protection and influence."
 interwar_soviet.13.a:0 "Secure our position in Hungary."
 interwar_soviet.14.t:0 "The Treaty of Tartu"
 interwar_soviet.14.d:0 "Negotiators have reached an agreement intended to settle the frontier between Russia and Finland. The treaty offers both governments a chance to replace the uncertainty left by revolution and civil war with a recognised border."
 interwar_soviet.14.a:0 "Conclude the treaty."
 interwar_soviet.15.t:0 "Soviet Protection for Red Finland"
 interwar_soviet.15.d:0 "The Finnish socialist government continues to rely heavily on our assistance. A closer political arrangement will place Red Finland under Soviet protection and give Moscow a more decisive voice in its affairs."
 interwar_soviet.15.a:0 "Bring Red Finland under our protection."
 interwar_soviet.16.t:0 "The Japanese Withdrawal"
 interwar_soviet.16.d:0 "Japanese forces are withdrawing from positions held during the intervention in the Russian Far East. Soviet officials are preparing to re-establish administration in the territory they leave behind."
 interwar_soviet.16.a:0 "Restore our administration."
 interwar_soviet.17.t:0 "The Far Eastern Republic Reintegrated"
 interwar_soviet.17.d:0 "The authorities of the Far Eastern Republic are preparing to dissolve their separate administration. The buffer state that emerged during the intervention will pass under direct Soviet authority as Moscow reasserts its control in the east."
 interwar_soviet.17.a:0 "Complete the reunification."
 interwar_soviet.18.t:0 "An Agreement with Japan"
 interwar_soviet.18.d:0 "Negotiators have prepared a convention to restore relations with Japan after the bitter disputes of the civil-war intervention. Both governments see value in replacing uncertainty in the Far East with a more regular diplomatic relationship."
 interwar_soviet.18.a:0 "Conclude the convention."
 interwar_soviet.19.t:0 "Intervention against Ungern-Sternberg"
 interwar_soviet.19.d:0 "Roman von Ungern-Sternberg's ascendancy in Mongolia has alarmed the Soviet government. His monarchist ambitions and armed followers have brought the frontier into renewed turmoil, prompting preparations for intervention."
 interwar_soviet.19.a:0 "Send the Red Army into Mongolia."
 interwar_soviet.20.t: ""
 interwar_soviet.20.d: ""
 interwar_soviet.20.a: ""
 interwar_soviet.21.t: "War Communism"
 interwar_soviet.21.d:0 "The disruptions of civil war have left the government struggling to supply both the towns and the Red Army. The proposed emergency system places industry, trade, labour and food distribution under direct state control, demanding further sacrifices from an already exhausted population."
 interwar_soviet.21.a:0 "Adopt the emergency programme."
 interwar_soviet.22.t:0 "The Cheka"
 interwar_soviet.22.d:0 "The Council of People's Commissars is establishing an extraordinary commission under Felix Dzerzhinsky. Charged with combating counter-revolution and sabotage, the new body will wield sweeping powers of arrest and repression beyond the ordinary machinery of justice."
 interwar_soviet.22.a:0 "Establish the commission."
 interwar_soviet.23.t:0 "The Campaign against the Cossacks"
 interwar_soviet.23.d:0 "The authorities are preparing a campaign of repression against Cossack communities associated with the White movement. In the Don and Kuban, collective punishment threatens to carry the struggle far beyond the armed formations still resisting Soviet power."
 interwar_soviet.23.a:0 "Proceed with the campaign."
 interwar_soviet.24.t:0 "The Red Terror"
 interwar_soviet.24.d:0 "The Soviet authorities are expanding their campaign against those they identify as enemies of the revolution. Arrests and executions are becoming instruments of government, spreading fear well beyond the ranks of armed opposition."
 interwar_soviet.24.a:0 "Authorise the campaign of repression."
 interwar_soviet.25.t:0 "The New Economic Policy"
 interwar_soviet.25.d:0 "The government is reconsidering the emergency controls imposed during the civil war. Lenin's proposed New Economic Policy permits limited private trade and market activity while leaving the principal institutions of economic power in state hands."
 interwar_soviet.25.a:0 "Adopt the New Economic Policy."
 interwar_soviet.26.t: ""
 interwar_soviet.26.d: ""
 interwar_soviet.26.a: ""
 interwar_soviet.27.t:0 "Grain Requisitioning"
 interwar_soviet.27.d:0 "Food officials have been ordered to obtain more grain for the army and the towns. Requisition detachments are preparing to enter the countryside, where compulsory deliveries are provoking anger and resistance among the peasantry."
 interwar_soviet.27.a:0 "Authorise the requisitions."
 interwar_soviet.28.t:0 "The Union Treaty"
 interwar_soviet.28.d:0 "Representatives of the Soviet republics have prepared a treaty establishing a common union. The new federal structure will bind their governments together while concentrating essential powers in the institutions based in Moscow."
 interwar_soviet.28.a:0 "Ratify the Union Treaty."
 interwar_soviet.29.t:0 "A System of Labour Camps"
 interwar_soviet.29.d:0 "The government is expanding the use of camps for prisoners and political detainees. Officials present compulsory labour as a means of punishment and state service, placing those confined within an increasingly coercive administrative system."
 interwar_soviet.29.a:0 "Establish the camp administration."
 interwar_soviet.30.t:0 "The GOELRO Plan"
 interwar_soviet.30.d:0 "A national plan for electrification has been presented to the Soviet government. Its authors envisage new power stations and a coordinated programme of industrial development to help rebuild an economy damaged by war and revolution."
 interwar_soviet.30.a:0 "Begin the electrification programme."
 interwar_soviet.31.t: ""
 interwar_soviet.31.d: ""
 interwar_soviet.31.a: ""
 interwar_soviet.32.t: ""
 interwar_soviet.32.d: ""
 interwar_soviet.32.a: ""
 interwar_soviet.33.t:0 "The Integration of Red Finland"
 interwar_soviet.33.d:0 "The Finnish socialist government is being drawn into a closer union with Soviet Russia. Its separate administration is to give way to direct rule as Moscow completes the incorporation of its northern neighbour."
 interwar_soviet.33.a:0 "Complete the integration."
 interwar_soviet.34.t: "Intervention in Persia"
 interwar_soviet.34.d:0 "The Persian Socialist Republic is seeking more than weapons and provisions in its struggle against Tehran. The Soviet government is preparing to commit the Red Army, opening a direct campaign in support of its allies on the Caspian."
 interwar_soviet.34.a:0 "Commit our forces to the intervention."
 interwar_soviet.35.t:0 "The Former Imperial Officers"
 interwar_soviet.35.d:0 "The Red Army's shortage of experienced commanders has brought the government back to officers trained under the old regime. Their employment promises needed expertise, but mistrust and threats against their families shadow the arrangements securing their service."
 interwar_soviet.35.a:0 "Bring the military specialists into service."
 interwar_soviet.60.a: "Tsaritsyn becomes Stalingrad"
 interwar_soviet.61.a: "Petrograd becomes Leningrad"
 interwar_soviet.62.t:0 "The End of the Civil War"
 interwar_soviet.62.d:0 "The last organised White authorities have collapsed, and their remaining forces can no longer sustain the struggle. Soviet administration is extending across the territories they held, ending the principal contest between the Red and White governments. After years of destruction, the country faces the work of restoring its railways, rebuilding industry and feeding the countryside."
 interwar_soviet.62.a:0 "Begin the work of reconstruction."
 interwar_soviet.36.t: "Attempted Assassination on Lenin!"
 interwar_soviet.36.d: "Today the 30th of August 1918 after Vladimir Lenin spoke at the Hammer and Sickle, a factory in Moscow following his speech when he left the building Fanny Kaplan a radical revolutionary whom viewed Lenin as a 'traitor to the revolution' called out to Lenin and as he turned towards her she fired three shots using a Browning pistol. \n\n One of the bullets managed to pass through Lenin's coat the other two struck him, one passed through his neck and the others puncturing a part of his left lung and lodging into his left shoulder. Lenin was taken back to his living quarters at the Kremlim and due to his fear of other plotters he refused to seek immediate medical attention. Doctors later were brought in to treat him and were uanble to remove the bullets immediately however Lenin has  remarkably managed to survive."
 interwar_soviet.36.a: "She is a traitor to the revolution!"
 interwar_soviet.37.t:0 "The Fate of the Romanovs"
 interwar_soviet.37.d:0 "The former emperor and his family remain in custody as the civil war brings their place of confinement into danger. Local authorities fear that their release could give the White movement a powerful symbol, while their continued imprisonment leaves their fate in our hands."
 interwar_soviet.37.a:0 "Order their execution."
 interwar_soviet.37.b:0 "Keep the family alive."
 interwar_soviet.38.t: "Kronstadt Rebellion"
 interwar_soviet.38.d: "Today on March 7th, 1921, a major uprising has occured on Kotlin Island, Kronstadt, a naval fortress, against us. It consisted mainly of Russian sailors, soldiers, and civilians, and was according to those who rebelled caused by Lenin’s choice to loosen control of the Russian economy (New Economic Policy). However, the rebellion has been largely unsuccessful and crushed after a 12 day military campaign that resulted in roughly 3-4 thousand deaths total."
 interwar_soviet.38.a: "Traitors!"
 interwar_soviet.39.t: "Soviet Russia Defeated: White Victory!"
 interwar_soviet.39.d: "After a long and brutal war between Soviet Russia and the White Movement the Russian Reds have finally surrendered after the White Movement captured the major strong points of Moscow, Petrograd, and Tsaritsyn leaving the Reds cut off and pocketed in several areas. While the Reds have lost for good, the path is still not clear for the very split White Movment which has been shown even throughout the Civil War with the movement leadership consisting of several leaders rather than one. The power struggle that will follow is surely to leave the nation even more in ruins, however for the moment we have won against the evil Bolshevik forces and for that is what is most important for now..."
 interwar_soviet.39.a: "Death to the Bolsheviks!"
 interwar_soviet.40.t: "White Russia Defeated: Bolshevik Victory!"
 interwar_soviet.40.d: "After a long and brutal war between the Russian SFSR and the White Movment the split and undecided White Movment eventually fell due to its own faults and never again recovered with the Reds establishing total dominance in politics and government of the new state. The Whites have lost for good, but hard times are still ahead for the country, we must make a successful path to Communism from this current state of affairs and show spread the revolution!"
 interwar_soviet.40.a: "Power to the Soviets!"
 interwar_soviet.41.t: "Far Eastern Republic Established"
 interwar_soviet.41.d: "The Far Eastern Republic has been established as now that the Russian Civil War is over which has led to the evacuation of Japanese and local white forces, a political vacuum has ensued in this region. A new central authority has been established at Chita to govern the FAR. It is viewed as a temporary buffer state between us and the territories still occupied by Japan and the allies. The FAR will be viewed as a sort of Treaty of Brest-Litovsk in the east providing us some breathing space and allow us to recover economically and militarily before we can re-integrate the territory."
 interwar_soviet.41.a: "A neccesary precaution"
 interwar_soviet.42.t: "Kazan Gold Train Breaks Down"
 interwar_soviet.42.d: "The train carrying the Russian gold reserve of the former Tsars' Empire has been blocked in the Kazan train station and we will not be able to repair it before early October. We must hold Kazan long enough to repair the train and prevent its capture by White Forces, if in there hands the gold will help them tremendously set up their armies and purchase foreign weapons."
 interwar_soviet.42.a: "Uh oh!"
 interwar_soviet.43.t: "Establishing the Don Soviet Republic"
 interwar_soviet.43.d: "After our victory against the Don Republic, we now have an option to form the Don Soviet Republic. Doing so would increase the stability in the region, and would free up some administrational maintenance as well as increasing local support. We would however have less direct control over the area."
 interwar_soviet.43.a: "We need their support."
 interwar_soviet.43.b: "We will secure our own support."
 interwar_soviet.44.t: "The fate of the Don Soviet Republic"
 interwar_soviet.44.d: "Now that the war has ended, the fate of the Don Soviet Republic should be determined. Are they to be a recognised country under the Soviet Union, or should they be annexed directly into the Soviet Union?"
 interwar_soviet.44.a: "They will be fully recognised."
 interwar_soviet.44.b: "Partial recognition for partial protection."
 interwar_soviet.44.c: "We will annex them."
