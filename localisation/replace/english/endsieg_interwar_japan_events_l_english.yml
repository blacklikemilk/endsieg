l_english:
 INT_japan_news.a:0 "A new development"
 INT_japan_interwar.1.t:0 "The Postwar Crash"
 INT_japan_interwar.1.d:0 "The speculative boom has broken. Factories lose orders and banks face mounting demands for credit."
 INT_japan_interwar.1.a:0 "Stabilize the market"
 INT_japan_interwar.2.t:0 "Hara Takashi Assassinated"
 INT_japan_interwar.2.d:0 "Prime Minister Hara has been stabbed at Tokyo Station. His death leaves the party cabinet without its central figure."
 INT_japan_interwar.2.a:0 "Preserve cabinet government"
 INT_japan_interwar.3.t:0 "The Washington Naval Settlement"
 INT_japan_interwar.3.d:0 "Japan has accepted limits on capital ships at Washington. Naval officers debate whether the new ratio can protect the empire's Pacific interests."
 INT_japan_interwar.3.a:0 "Accept the treaty framework"
 INT_japan_interwar.4.t:0 "The Great Kanto Earthquake"
 INT_japan_interwar.4.d:0 "A devastating earthquake has struck the Tokyo-Yokohama region. Fire and ruined infrastructure make relief and reconstruction an urgent national task."
 INT_japan_interwar.4.a:0 "Begin emergency relief"
 INT_japan_interwar.5.t:0 "Universal Manhood Suffrage"
 INT_japan_interwar.5.d:0 "The revised election law has expanded the vote to adult men without a tax qualification. The Diet now answers to a much wider electorate."
 INT_japan_interwar.5.a:0 "Prepare for the wider electorate"
 INT_japan_interwar.6.t:0 "Emperor Taisho Dies"
 INT_japan_interwar.6.d:0 "Emperor Taisho has died, and Crown Prince Hirohito succeeds him. The new reign opens amid economic uncertainty and sharpening political disputes."
 INT_japan_interwar.6.a:0 "Proclaim the Showa reign"
 INT_japan_interwar.7.t:0 "A Financial Crisis Grips Japan"
 INT_japan_interwar.7.d:0 "Banks have suspended payments as the weakness of the postwar credit system becomes plain. The cabinet faces a struggle to keep businesses and savers solvent."
 INT_japan_interwar.7.a:0 "Support the banking system"
 INT_japan_interwar.8.t:0 "Zhang Zuolin Killed"
 INT_japan_interwar.8.d:0 "A bomb has killed the Manchurian warlord Zhang Zuolin. The attack draws suspicion toward Japanese officers and tests Tokyo's authority over the Kwantung Army."
 INT_japan_interwar.8.a:0 "Investigate the officers"
 INT_japan_interwar.9.t:0 "Japan Returns to Gold"
 INT_japan_interwar.9.d:0 "The yen has returned to the prewar gold parity. Tight credit and falling prices threaten firms already struggling with weak export demand."
 INT_japan_interwar.9.a:0 "Maintain the parity"
 INT_japan_interwar.10.t:0 "London Naval Treaty Ratified"
 INT_japan_interwar.10.d:0 "The government has ratified further naval limits despite opposition within the services. The dispute raises a larger question about civilian control of defense policy."
 INT_japan_interwar.10.a:0 "Uphold the agreement"
 INT_japan_interwar.11.t:0 "Hamaguchi Shot at Tokyo Station"
 INT_japan_interwar.11.d:0 "Prime Minister Hamaguchi has been gravely wounded by an assassin. The attack sharpens conflict around his cabinet's economic and naval policies."
 INT_japan_interwar.11.a:0 "Keep the cabinet functioning"
 INT_japan_interwar.12.t:0 "The Mukden Incident"
 INT_japan_interwar.12.d:0 "An explosion on the South Manchuria Railway has become the pretext for a Kwantung Army offensive. Tokyo must reckon with a campaign initiated outside normal cabinet control."
 INT_japan_interwar.12.a:0 "Confront the Army's initiative"
 INT_japan_interwar.13.t:0 "Gold Exports Suspended"
 INT_japan_interwar.13.d:0 "The new cabinet has abandoned the gold constraint. A weaker yen and public spending may relieve deflation, though prices and budgets will change rapidly."
 INT_japan_interwar.13.a:0 "Pursue reflation"
 INT_japan_interwar.14.t:0 "Manchukuo Proclaimed"
 INT_japan_interwar.14.d:0 "A new state has been proclaimed in Manchuria under Japanese protection. Foreign governments question whether it is independent in more than name."
 INT_japan_interwar.14.a:0 "Recognize the new state"
 INT_japan_interwar.15.t:0 "Inukai Tsuyoshi Assassinated"
 INT_japan_interwar.15.d:0 "Naval officers have killed Prime Minister Inukai. A non-party cabinet is taking shape as the military's political influence grows."
 INT_japan_interwar.15.a:0 "Form a national cabinet"
 INT_japan_interwar.16.t:0 "Japan Leaves the League"
 INT_japan_interwar.16.d:0 "The League has rejected Japan's position in Manchuria. Japan has announced its withdrawal, deepening its isolation from the postwar international order."
 INT_japan_interwar.16.a:0 "Accept the diplomatic break"
 INT_japan_interwar.17.t:0 "Notice to End the Washington Treaty"
 INT_japan_interwar.17.d:0 "Japan has given notice that it will leave the Washington naval limitation system. The treaty remains in force until the end of 1936, but fleet planners now look beyond it."
 INT_japan_interwar.17.a:0 "Prepare for future construction"
 INT_japan_interwar.18.t:0 "The Emperor-Organ Controversy"
 INT_japan_interwar.18.d:0 "Political attacks on the constitutional theory of the emperor are intensifying. The dispute places cabinet government under fresh pressure."
 INT_japan_interwar.18.a:0 "Defend the cabinet's authority"
 INT_japan_news.1.t:0 "Japanese Prime Minister Assassinated"
 INT_japan_news.1.d:0 "Prime Minister Hara Takashi has been killed at Tokyo Station. The assassination unsettles Japan's party government."
 INT_japan_news.2.t:0 "Five Powers Sign Naval Treaty"
 INT_japan_news.2.d:0 "Japan, Britain, the United States, France and Italy have signed a treaty limiting capital ships and reshaping naval competition."
 INT_japan_news.3.t:0 "Japan Expands the Franchise"
 INT_japan_news.3.d:0 "Japan has adopted universal manhood suffrage, extending the vote to adult men without the old tax qualification."
 INT_japan_news.4.t:0 "Japan Enters the Showa Era"
 INT_japan_news.4.d:0 "Emperor Taisho has died. Hirohito has succeeded him, beginning the Showa reign."
 INT_japan_news.5.t:0 "Japanese Banks Face Crisis"
 INT_japan_news.5.d:0 "A banking panic has spread through Japan, exposing unresolved postwar debts and threatening wider industrial activity."
 INT_japan_news.6.t:0 "Manchurian Warlord Killed"
 INT_japan_news.6.d:0 "Zhang Zuolin has died in a railway bombing near Mukden. Suspicion falls on officers of Japan's Kwantung Army."
 INT_japan_news.7.t:0 "Japan Ratifies London Naval Treaty"
 INT_japan_news.7.d:0 "Japan has approved the London Naval Treaty. Opposition among naval officers remains strong."
 INT_japan_news.8.t:0 "Japanese Prime Minister Wounded"
 INT_japan_news.8.d:0 "Prime Minister Hamaguchi Osachi has been shot at Tokyo Station. His condition is serious."
 INT_japan_news.9.t:0 "Japanese Forces Advance in Manchuria"
 INT_japan_news.9.d:0 "After an explosion near Mukden, Japanese forces are moving across Manchuria. The speed of the operation raises questions about who directs it."
 INT_japan_news.10.t:0 "Japan Leaves the Gold Standard"
 INT_japan_news.10.d:0 "Japan has suspended gold exports and allowed the yen to depreciate as the government seeks relief from deflation."
 INT_japan_news.11.t:0 "Manchukuo Is Proclaimed"
 INT_japan_news.11.d:0 "Authorities in Manchuria have proclaimed a new state closely tied to Japan. Other powers question its independence."
 INT_japan_news.12.t:0 "Japan's Prime Minister Assassinated"
 INT_japan_news.12.d:0 "Prime Minister Inukai Tsuyoshi has been killed by naval officers. The attack ends Japan's run of party cabinets."
 INT_japan_news.13.t:0 "Japan Withdraws from the League"
 INT_japan_news.13.d:0 "Japan has announced its withdrawal from the League of Nations after condemnation of its actions in Manchuria."
 INT_japan_news.14.t:0 "Japan Denounces Washington Naval Treaty"
 INT_japan_news.14.d:0 "Japan has notified the other powers that it will end its participation in the Washington naval treaty when its terms expire."
