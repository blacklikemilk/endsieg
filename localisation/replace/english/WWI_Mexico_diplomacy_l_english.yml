l_english:
 mex_ww1_diplomacy.1.t:0 "A Proposal from Mexico"
 mex_ww1_diplomacy.1.a:0 "We should pursue an understanding."
 mex_ww1_diplomacy.1.b:0 "We cannot accept the proposal."
 mex_ww1_diplomacy.11.t:0 "The German Reply"
 mex_ww1_diplomacy.11.accepted.d:0 "Our envoys report that the German government is willing to pursue the proposed convention. Its consent is a diplomatic opening; the agreement still requires action by our own government before it can take effect."
 mex_ww1_diplomacy.11.refused.d:0 "The German government has declined our proposal. Our representatives must return without an agreement, and the cabinet will have to reconsider its foreign policy."
 mex_ww1_diplomacy.11.withdrawn.d:0 "Our mission has ended without an answer on the proposed terms. Changed circumstances have brought the negotiations to a close, leaving the cabinet to consider another course."
 mex_ww1_diplomacy.11.a:0 "Bring the matter before the cabinet."
 mex_ww1_diplomacy.11.b:0 "We must consider our position."
 mex_ww1_diplomacy.13.t:0 "A Convention Delayed"
 mex_ww1_diplomacy.13.d:0 "The government has sought to put its German policy into effect, but the necessary conditions for a convention have not been met. The Foreign Secretariat will keep the matter under review while ministers consider how to proceed."
 mex_ww1_diplomacy.13.a:0 "Instruct the Secretariat to continue its work."
 MEX_WW1_renew_central_convention:0 "Renew the Request for German Guarantees"
 MEX_WW1_renew_central_convention_desc:0 "Reopen the negotiations on the guarantees requested by the council. Our representatives will again seek firm deliveries and confirmation of the convention, while preserving Mexico’s freedom to refuse an agreement that cannot be supported. An existing ratification can be carried out only if its accepted terms and the German alliance remain valid."
 mex_ww1_diplomacy.2.t:0 "The Mexican Envoys"
 mex_ww1_diplomacy.2.a:0 "Let the negotiations continue."
 mex_ww1_diplomacy.2.b:0 "We must decline."
 mex_ww1_diplomacy.12.t:0 "The French Reply"
 mex_ww1_diplomacy.12.accepted.d:0 "The French government has indicated its willingness to pursue a convention with Mexico. The proposal now returns to our ministers, who must decide whether to give the understanding effect."
 mex_ww1_diplomacy.12.refused.d:0 "The French government has rejected the proposed convention. Our mission has secured no agreement, and the cabinet must reconsider its approach."
 mex_ww1_diplomacy.12.withdrawn.d:0 "The negotiations have ended without a binding answer. The circumstances in which the mission was sent have changed, and our representatives have been instructed to close the matter."
 mex_ww1_diplomacy.12.a:0 "The cabinet will consider the agreement."
 mex_ww1_diplomacy.12.b:0 "We shall have to look elsewhere."
 mex_ww1_diplomacy.14.t:0 "A Convention Deferred"
 mex_ww1_diplomacy.14.d:0 "Our attempt to put the proposed French convention into effect has stalled. Until the necessary conditions are in place, the government cannot proceed with the arrangement. The Foreign Secretariat will continue to watch for an opportunity."
 mex_ww1_diplomacy.14.a:0 "The matter must remain under review."
 MEX_WW1_renew_entente_convention:0 "Renew Talks with Paris"
 MEX_WW1_renew_entente_convention_desc:0 "Our representatives will spend two months revising the proposed military convention and seeking a fresh undertaking from Paris. If the cabinet has already ratified an agreement, they will work to put that commitment into effect. Another mission must wait until the Foreign Office has assessed the result."
 MEX_WW1_foreign_negotiations:0 "Mexico and the Great Powers"
 MEX_WW1_foreign_negotiations_desc:0 "The powers at war in Europe offer arms, credit and diplomatic support, but every agreement carries obligations. Our envoys must secure terms that Mexico can honor without surrendering control of its own affairs."
 MEX_WW1_zimmermann_offer_tt:0 "The German proposal will be considered by the Foreign Office."
 MEX_WW1_zimmermann_consider:0 "Have the Foreign Office examine the offer."
 MEX_WW1_zimmermann_decline:0 "Decline the German proposal."
 mex_ww1_diplomacy.1.available.d:0 "Mexican representatives have approached us about a military understanding. Closer ties would give us a partner across the Atlantic, but any promise we make would also place demands on our diplomats and our resources.\n\nThe Foreign Office must decide whether to encourage the proposal."
 mex_ww1_diplomacy.1.unavailable.d:0 "The Mexican mission came seeking a military understanding, but circumstances have changed since its proposal was made. We can no longer offer the arrangement under discussion. The envoys must be given our answer."
 mex_ww1_diplomacy.2.available.d:0 "The Mexican government has sent representatives to explore closer military cooperation. Their proposal offers an opportunity to strengthen our position across the Atlantic, but it would also bring obligations of its own.\n\nOur ministers must decide whether to continue the negotiations."
 mex_ww1_diplomacy.2.unavailable.d:0 "The Mexican envoys sought a military understanding, but the conditions necessary for their proposal no longer exist. We must inform them that the arrangement cannot go forward."
 mex_ww1_diplomacy.11.expired.d:0 "The Foreign Secretariat can find no decision on which the government can act. The proposal is no longer before the cabinet in a form that can be ratified."
 mex_ww1_diplomacy.12.expired.d:0 "The Foreign Secretariat has reviewed the correspondence and found no decision on which the cabinet can act. The proposal cannot presently be ratified."
