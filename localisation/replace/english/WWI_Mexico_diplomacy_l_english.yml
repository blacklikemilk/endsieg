l_english:
 mex_ww1_diplomacy.1.t:0 "A Mexican Military Convention"
 mex_ww1_diplomacy.1.d:0 "Mexican diplomats have presented a draft convention linking their government with our coalition. They seek access to arms and staff discussions in exchange for a political commitment. Mexico must still ratify the agreement, but our answer will determine whether these talks can proceed."
 mex_ww1_diplomacy.1.a:0 "Approve the draft convention."
 mex_ww1_diplomacy.1.b:0 "We cannot undertake another commitment."
 mex_ww1_diplomacy.11.t:0 "Germany Answers Our Envoy"
 mex_ww1_diplomacy.11.accepted.d:0 "Our envoy in Berlin reports that the proposed military convention has been approved. The agreement promises closer contact between our staffs and a place for Mexico in the coalition. The cabinet must now decide whether to ratify these terms and accept the obligations that accompany them."
 mex_ww1_diplomacy.11.refused.d:0 "The government in Berlin has declined our proposal. Its ministers are unwilling to extend their military commitments to Mexico, despite the assurances offered by our envoy. The cabinet has recovered part of the funds reserved for the mission and may seek fresh talks when circumstances permit."
 mex_ww1_diplomacy.11.withdrawn.d:0 "Our envoy has been unable to obtain a binding answer from Berlin. The conditions under which the convention was drafted no longer hold, and the mission will return to Mexico. Part of its expenses has been recovered. A new approach may yet succeed if a suitable opening appears."
 mex_ww1_diplomacy.11.a:0 "Bring the convention before the cabinet."
 mex_ww1_diplomacy.11.b:0 "Keep the diplomatic channels open."
 mex_ww1_diplomacy.13.t:0 "A Convention Without Effect"
 mex_ww1_diplomacy.13.d:0 "The cabinet has approved the convention, but our envoy cannot put it into effect. Changes within the German coalition have overtaken the terms negotiated earlier. Mexico will maintain its commitment while the Foreign Office seeks assurances that the agreement can still be honored."
 mex_ww1_diplomacy.13.a:0 "Seek renewed assurances."
 MEX_WW1_renew_central_convention:0 "Renew the Request for German Guarantees"
 MEX_WW1_renew_central_convention_desc:0 "Reopen the negotiations on the guarantees requested by the council. Our representatives will again seek firm deliveries and confirmation of the convention, while preserving Mexico’s freedom to refuse an agreement that cannot be supported. An existing ratification can be carried out only if its accepted terms and the German alliance remain valid."
 mex_ww1_diplomacy.2.t:0 "A Mexican Military Convention"
 mex_ww1_diplomacy.2.d:0 "Mexican diplomats have presented a draft convention linking their government with our coalition. They seek access to arms and staff discussions in exchange for a political commitment. Mexico must still ratify the agreement, but our answer will determine whether these talks can proceed."
 mex_ww1_diplomacy.2.a:0 "Approve the draft convention."
 mex_ww1_diplomacy.2.b:0 "We cannot undertake another commitment."
 mex_ww1_diplomacy.12.t:0 "France Answers Our Envoy"
 mex_ww1_diplomacy.12.accepted.d:0 "Our envoy in Paris reports that the proposed military convention has been approved. The agreement promises closer contact between our staffs and a place for Mexico in the coalition. The cabinet must now decide whether to ratify these terms and accept the obligations that accompany them."
 mex_ww1_diplomacy.12.refused.d:0 "The government in Paris has declined our proposal. Its ministers are unwilling to extend their military commitments to Mexico, despite the assurances offered by our envoy. The cabinet has recovered part of the funds reserved for the mission and may seek fresh talks when circumstances permit."
 mex_ww1_diplomacy.12.withdrawn.d:0 "Our envoy has been unable to obtain a binding answer from Paris. The conditions under which the convention was drafted no longer hold, and the mission will return to Mexico. Part of its expenses has been recovered. A new approach may yet succeed if a suitable opening appears."
 mex_ww1_diplomacy.12.a:0 "Bring the convention before the cabinet."
 mex_ww1_diplomacy.12.b:0 "Keep the diplomatic channels open."
 mex_ww1_diplomacy.14.t:0 "A Convention Without Effect"
 mex_ww1_diplomacy.14.d:0 "The cabinet has approved the convention, but our envoy cannot put it into effect. Changes within the Entente coalition have overtaken the terms negotiated earlier. Mexico will maintain its commitment while the Foreign Office seeks assurances that the agreement can still be honored."
 mex_ww1_diplomacy.14.a:0 "Seek renewed assurances."
 MEX_WW1_renew_entente_convention:0 "Renew Talks with Paris"
 MEX_WW1_renew_entente_convention_desc:0 "Our representatives will spend two months revising the proposed military convention and seeking a fresh undertaking from Paris. If the cabinet has already ratified an agreement, they will work to put that commitment into effect. Another mission must wait until the Foreign Office has assessed the result."
 MEX_WW1_foreign_negotiations:0 "Mexico and the Great Powers"
 MEX_WW1_foreign_negotiations_desc:0 "The powers at war in Europe offer arms, credit and diplomatic support, but every agreement carries obligations. Our envoys must secure terms that Mexico can honor without surrendering control of its own affairs."
 MEX_WW1_zimmermann_offer_tt:0 "The German proposal will be considered by the Foreign Office."
 MEX_WW1_zimmermann_consider:0 "Have the Foreign Office examine the offer."
 MEX_WW1_zimmermann_decline:0 "Decline the German proposal."
