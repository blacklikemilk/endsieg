l_english:
 ww1_fg_bulgarian_alliance_name:0 "Secure the Bulgarian Alliance"
 ww1_fg_bulgarian_alliance_desc:0 "$WW1_historical_header$An agreement with Sofia can strengthen the southern front and give the coalition a partner between Serbia and the Ottoman Empire. Bulgaria must join through a negotiated political commitment."
 ww1_fg_constantinople_corridor_name:0 "The Route to Constantinople"
 ww1_fg_constantinople_corridor_desc:0 "$WW1_historical_header$Our armies and workshops must be connected with the Ottoman Empire. With Bulgaria and the Ottomans in the alliance, secure the principal railway junctions from Berlin through Vienna, Budapest and Serbia to Sofia and Constantinople."
 ww1_fg_eastern_peace_name:0 "A Separate Peace in the East"
 ww1_fg_eastern_peace_desc:0 "$WW1_historical_header$A settlement with Russia would release forces for the remaining fronts and establish a new balance in Eastern Europe. The negotiations must produce an accepted treaty before the eastern campaign can be considered concluded."
 ww1_fg_polish_regency_name:0 "A Polish Kingdom under Our Protection"
 ww1_fg_polish_regency_desc:0 "$WW1_historical_header$The occupation of Russian Poland raises a political question as well as a military one. Establish a Polish state under the protection of the Central Powers, with a government able to exercise authority in Warsaw."
 ww1_fg_western_settlement_name:0 "Force a Settlement in the West"
 ww1_fg_western_settlement_desc:0 "$WW1_historical_header$The alliance seeks a peace that will secure its position against France and Britain. Military successes must be converted into a settlement accepted by the opposing coalition, rather than another temporary pause in the fighting."
 ww1_fg_italian_commitment_name:0 "Bring Italy into the Entente"
 ww1_fg_italian_commitment_desc:0 "$WW1_historical_header$Rome must decide whether the promises of the Entente outweigh its former commitments. Secure Italian membership through the negotiations and political decisions required by the Italian government."
 ww1_fg_romanian_commitment_name:0 "Secure Romanian Cooperation"
 ww1_fg_romanian_commitment_desc:0 "$WW1_historical_header$Romanian participation can open another front against the Habsburg monarchy. Diplomatic assurances must lead to an agreed place for Bucharest in the alliance."
 ww1_fg_alsace_lorraine_name:0 "Recover Alsace-Lorraine"
 ww1_fg_alsace_lorraine_desc:0 "$WW1_historical_header$The loss of Alsace-Lorraine in 1871 remains central to French war aims. Bring the disputed province under French control as part of the liberation of occupied territory."
 ww1_fg_open_the_straits_name:0 "Open the Dardanelles"
 ww1_fg_open_the_straits_desc:0 "$WW1_historical_header$An Allied position at the Straits would threaten the Ottoman capital and improve communications with Russia. Secure the approaches through Thrace and Edirne, then take Constantinople."
 ww1_fg_italian_promises_name:0 "Honour the London Promises"
 ww1_fg_italian_promises_desc:0 "$WW1_historical_header$Italian intervention rests upon promises concerning the Habsburg frontier. Place South Tyrol, Trentino and Trieste under Italian control to give substance to those commitments."
 ww1_fg_restore_belgium_name:0 "Restore Belgian Sovereignty"
 ww1_fg_restore_belgium_desc:0 "$WW1_historical_header$Belgium must emerge from the war free from occupation and foreign subordination. An end to the German campaign must be accompanied by the restoration of Belgian government over its homeland."
 ww1_fg_restore_serbia_name:0 "Restore Serbia"
 ww1_fg_restore_serbia_desc:0 "$WW1_historical_header$The Serbian homeland must be freed from occupation. Following the defeat or withdrawal of the Habsburg armies, Belgrade and eastern Serbia must be governed by an independent Serbian or Yugoslav state."
 ww1_fg_balkan_agreement_name:0 "Unite the Four Balkan Allies"
 ww1_fg_balkan_agreement_desc:0 "$WW1_historical_header$The agreement against Ottoman rule depends upon cooperation between Serbia, Bulgaria, Greece and Montenegro. Bring all four governments into the League before the campaign divides their interests."
 ww1_fg_macedonian_campaign_name:0 "End Ottoman Rule in Macedonia"
 ww1_fg_macedonian_campaign_desc:0 "$WW1_historical_header$The League seeks to remove Ottoman authority from Macedonia. Secure the regions around Skopje and Salonika through the common campaign, leaving their final allocation to the peace negotiations."
 ww1_fg_london_peace_name:0 "Conclude the Peace of London"
 ww1_fg_london_peace_desc:0 "$WW1_historical_header$Military gains must become an agreed end to the war. Conclude the London settlement with the Ottoman Empire and bring the League’s campaign to a close."
 ww1_fg_central_corridor_states:0 "Berlin–Constantinople Railway Junctions"
 ww1_fg_central_corridor_secured_states:0 "Secured Berlin–Constantinople Railway Junctions"
 ww1_fg_alsace_lorraine_states:0 "Alsace-Lorraine"
 ww1_fg_alsace_lorraine_secured_states:0 "Secured Alsace-Lorraine"
 ww1_fg_dardanelles_states:0 "The Straits Approaches"
 ww1_fg_dardanelles_secured_states:0 "Secured The Straits Approaches"
 ww1_fg_italian_promises_states:0 "South Tyrol, Trentino and Trieste"
 ww1_fg_italian_promises_secured_states:0 "Secured South Tyrol, Trentino and Trieste"
 ww1_fg_belgian_restoration_states:0 "The Belgian Homeland"
 ww1_fg_belgian_restoration_secured_states:0 "Secured The Belgian Homeland"
 ww1_fg_serbian_restoration_states:0 "The Serbian Homeland"
 ww1_fg_serbian_restoration_secured_states:0 "Secured The Serbian Homeland"
 ww1_fg_balkan_macedonia_states:0 "The Macedonian Campaign"
 ww1_fg_balkan_macedonia_secured_states:0 "Secured The Macedonian Campaign"
 ww1_fg_central_manifest_name:0 "The Imperial Alliance"
 ww1_fg_central_manifest_desc:0 "The alliance rests upon the security of its member states. Defend their homelands while pursuing the military and diplomatic objectives agreed by the coalition."
 ww1_fg_entente_manifest_name:0 "The Allied Cause"
 ww1_fg_entente_manifest_desc:0 "The allied governments have joined their strength against a common threat. Preserve their homelands and turn cooperation into the liberation and settlements for which the coalition fights."
 ww1_fg_balkan_manifest_name:0 "The Balkan Agreement"
 ww1_fg_balkan_manifest_desc:0 "The League brings together states with different interests in the Ottoman provinces. Protect the allied homelands while carrying the common campaign towards an agreed peace."
 ww1_fg_brest_signed_tt:0 "The Treaty of Brest-Litovsk has been concluded."
 ww1_fg_central_victory_tt:0 "The Entente has accepted the Central Powers victory settlement."
 ww1_fg_london_signed_tt:0 "The Treaty of London has ended the First Balkan War."
