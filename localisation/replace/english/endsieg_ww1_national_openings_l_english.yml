l_english:
 GE1_national_opening: "The Place in the Sun"
 GE1_national_opening_desc: "An industrial empire has outgrown the place allotted to it by the old powers. Berlin must decide which ambitions it can afford and which alliances it can trust."
 FR3_national_opening: "The Republic and Its Frontiers"
 FR3_national_opening_desc: "France must reconcile the demands of a citizen army with the burdens of a continental frontier. The Chamber will set the terms on which the country prepares for another crisis."
 EN1_national_opening: "The Balance and the Seas"
 EN1_national_opening_desc: "The fleet protects Britain’s trade, but it cannot settle every dispute on the continent. The Cabinet must decide where to spend the Empire’s limited attention."
 AUH_national_opening: "The Common Affairs"
 AUH_national_opening_desc: "Vienna and Budapest must agree on the affairs they still conduct together. A common budget will buy time while the Crown seeks a way to hold its lands."
 RUS_national_opening: "The Empire after 1905"
 RUS_national_opening_desc: "The Crown has survived revolution and defeat. Its ministers must rebuild trust at home and decide which of Russia’s frontiers the country can defend."
 OT1_national_opening: "The Empire after the Revolution"
 OT1_national_opening_desc: "The constitution has returned, but neither the Palace nor the officers can govern the provinces by decree alone. Constantinople must decide how to restore the authority of the state."
 IT1_national_opening: "A Kingdom Still Being Made"
 IT1_national_opening_desc: "The government in Rome seeks a place among the great powers while the kingdom’s regions develop at different speeds. Its military and colonial ambitions must be weighed against the demands at home."
 JP1_national_opening: "The Settlement after Portsmouth"
 JP1_national_opening_desc: "Victory has given Japan new responsibilities and new rivals. Tokyo must decide whether to consolidate its gains or use them as the foundation of a wider policy."
 US2_national_opening: "A Republic Between Oceans"
 US2_national_opening_desc: "American industry reaches across both oceans, but Congress remains divided over what commitments should follow. Washington must reconcile commercial interests with the country’s reluctance to fight abroad."
