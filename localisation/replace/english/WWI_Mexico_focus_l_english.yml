l_english:
 MEX_WW1_reconstruction_board:0 "The Reconstruction Board"
 MEX_WW1_reconstruction_board_desc:0 "Railway companies, provincial treasuries and army contractors answer to different masters. A national board must first establish what the government can repair, collect and supply before another programme of grand promises begins."
 MEX_WW1_railway_commission:0 "The National Railway Commission"
 MEX_WW1_railway_commission_desc:0 "Lines that once carried exports now carry rival armies. Bring the surviving railway offices together, establish repair priorities and restore a dependable timetable between the capital and the provinces."
 MEX_WW1_fiscal_registers:0 "Rebuild the Treasury Registers"
 MEX_WW1_fiscal_registers_desc:0 "Customs advances and emergency loans have obscured the public accounts. A reliable register of receipts and obligations will allow the treasury to pay its servants without surrendering every future source of revenue."
 MEX_WW1_reopen_workshops:0 "Reopen the National Workshops"
 MEX_WW1_reopen_workshops_desc:0 "With railway priorities agreed and the accounts in order, abandoned workshops can return to civilian production. Repairs to machinery and rolling stock will provide work while the larger industries recover."
 MEX_WW1_textile_cooperatives:0 "The Textile Towns"
 MEX_WW1_textile_cooperatives_desc:0 "The mills of Puebla and the central plateau can supply more than the army. Contracts for cloth and basic machinery will bring dependable orders to manufacturers and wages to towns scarred by the fighting."
 MEX_WW1_machine_tool_contracts:0 "Machine Tools for the Workshops"
 MEX_WW1_machine_tool_contracts_desc:0 "A workshop cannot live indefinitely on salvaged parts. Standard purchases of lathes, presses and gauges will establish the foundations of a more capable domestic engineering industry."
 MEX_WW1_oil_inspectorate:0 "Inspect the Gulf Oilfields"
 MEX_WW1_oil_inspectorate_desc:0 "The wealth beneath the Gulf coast has attracted companies whose influence often exceeds that of the state. An inspectorate will establish what is being extracted and which obligations remain unpaid."
 MEX_WW1_rural_credit:0 "Credit Beyond the Hacienda"
 MEX_WW1_rural_credit_desc:0 "Small cultivators rarely have access to credit on terms they can survive. Provincial loan offices can finance seed, tools and the first harvest without restoring dependence on the old estate owners."
 MEX_WW1_contract_standards:0 "A Common Industrial Standard"
 MEX_WW1_contract_standards_desc:0 "Government orders should specify the same dimensions whether they are filled in a railway shop or a private foundry. Consistent standards will reduce waste and allow smaller firms to accept national contracts."
 MEX_WW1_customs_receipts:0 "Account for the Export Revenues"
 MEX_WW1_customs_receipts_desc:0 "Oil and mineral exports must support the country that produces them. Regular audits of the customs houses will improve collection without promising another confiscation that our officials cannot enforce."
 MEX_WW1_industrial_recovery:0 "A Programme of Industrial Recovery"
 MEX_WW1_industrial_recovery_desc:0 "The first factories are working again. We can now undertake the slower task of replacing worn machinery, training skilled workers and giving domestic firms a market that will outlast the present emergency."
 MEX_WW1_university_chairs:0 "Chairs of Applied Science"
 MEX_WW1_university_chairs_desc:0 "The National University can train the surveyors, engineers and doctors the republic needs. Endow its scientific chairs and place public laboratories at the service of practical work."
 MEX_WW1_provincial_technical_schools:0 "Provincial Technical Schools"
 MEX_WW1_provincial_technical_schools_desc:0 "Engineering knowledge must travel beyond the capital. Technical schools in the provinces will train mechanics and foremen close to the workshops where they will earn their living."
 MEX_WW1_polytechnic_federation:0 "A National Polytechnic Network"
 MEX_WW1_polytechnic_federation_desc:0 "The university and provincial schools can share laboratories, equipment and trained staff. A coordinated research network will give Mexican industry the capacity to solve its own problems."
 MEX_WW1_road_grants:0 "Road Grants to the Interior"
 MEX_WW1_road_grants_desc:0 "A railway station is of little use to a village that cannot reach it. Grants for bridges and feeder roads will connect local markets to the restored national network."
 MEX_WW1_civic_congress:0 "The Unfinished Revolution"
 MEX_WW1_civic_congress_desc:0 "The contest for the presidency has become a struggle over who may speak for Mexico. The armies, provincial authorities and villages will not accept the same settlement merely because the government in the capital has changed."
 MEX_WW1_local_delegates:0 "The Anti-Reelection Clubs"
 MEX_WW1_local_delegates_desc:0 "The demand for effective suffrage has brought lawyers, provincial notables and working people into political clubs. Their petitions and newspapers will give the opposition a national voice beyond a single candidate."
 MEX_WW1_civil_registry:0 "Restore the Civil Registers"
 MEX_WW1_civil_registry_desc:0 "Land titles, court records and municipal rolls have disappeared with successive administrations. Recovering these documents will make lawful government more than the authority of whichever commander arrives next."
 MEX_WW1_national_convention:0 "The Convention at Aguascalientes"
 MEX_WW1_national_convention_desc:0 "The armies that defeated Huerta have not agreed on the government that should replace him. The delegates at Aguascalientes claim sovereignty for the Convention, while Carranza defends the authority of the First Chief. Their decision may divide the revolution once more."
 MEX_WW1_constitutional_compact:0 "The Authority of the First Chief"
 MEX_WW1_constitutional_compact_desc:0 "Carranza rejects the Convention’s claim to appoint a national government. The constitutional cause will continue under the First Chief, even if the break turns the armies that defeated Huerta against one another."
 MEX_WW1_civilian_officer_oaths:0 "The Officers and the Law"
 MEX_WW1_civilian_officer_oaths_desc:0 "The army must swear its loyalty to the lawful government. Civilian ministers will oversee appointments, and reliable officers will be entrusted with the defence of the presidency against another palace conspiracy."
 MEX_WW1_municipal_elections:0 "Municipal Elections"
 MEX_WW1_municipal_elections_desc:0 "The ballot must be restored where citizens know the candidates and can judge their conduct. Municipal elections will begin the return to representative government without entrusting the whole settlement to a single national contest."
 MEX_WW1_constitution_1917:0 "The Constitution of Querétaro"
 MEX_WW1_constitution_1917_desc:0 "The delegates at Querétaro must give lasting form to the revolution. The new constitution will establish the authority of the republic and provide the legal foundation for land reform, public education and the rights of labour."
 MEX_WW1_land_commissions:0 "Apply Article 27"
 MEX_WW1_land_commissions_desc:0 "The constitution has declared the rights of the nation and its villages. Land commissions must now survey disputed estates, hear claims and turn that declaration into settlements the courts can defend."
 MEX_WW1_labour_code:0 "Apply Article 123"
 MEX_WW1_labour_code_desc:0 "Rights written on paper offer little protection without inspectors and courts. Establish the machinery to enforce working hours, compensation and the right of labour to organize."
 MEX_WW1_constitutional_republic:0 "The Constitutional Republic"
 MEX_WW1_constitutional_republic_desc:0 "Civil government has acquired more than a new name. Elections, courts and a working body of social legislation can bind the provinces to a republic whose authority no longer depends on a single revolutionary chief."
 MEX_WW1_agrarian_convention:0 "Recognise the Sovereign Convention"
 MEX_WW1_agrarian_convention_desc:0 "The delegates have declared the Convention sovereign and chosen Eulalio Gutiérrez as provisional president. Recognising its authority will require a government that can reconcile the agrarian armies and withstand the opposition of the First Chief."
 MEX_WW1_village_councils:0 "Recognise the Village Councils"
 MEX_WW1_village_councils_desc:0 "Village assemblies have administered land and settled local disputes while national governments rose and fell. Recognise their authority and require public accounts in return for national assistance."
 MEX_WW1_return_the_land:0 "Restore the Village Lands"
 MEX_WW1_return_the_land_desc:0 "The promise of restitution must be carried out by surveyors and local commissions, rather than by another army of estate agents. Begin with the claims for which dispossession can be clearly established."
 MEX_WW1_ayala_settlement:0 "The Settlement of Ayala"
 MEX_WW1_ayala_settlement_desc:0 "Land restitution and local government must support one another. A national settlement based on the villages can end the struggle over who speaks for the agrarian revolution."
 MEX_WW1_agrarian_cooperatives:0 "Cooperative Stores and Workshops"
 MEX_WW1_agrarian_cooperatives_desc:0 "Individual villages cannot obtain every tool or market every harvest on their own. Cooperative stores and workshops will pool purchases and protect producers from the worst terms offered by middlemen."
 MEX_WW1_rural_schooling:0 "Teachers for the Villages"
 MEX_WW1_rural_schooling_desc:0 "A village that can elect its council should be able to keep its accounts and teach its children. Train rural teachers and supply schools that have long survived without regular assistance from the capital."
 MEX_WW1_federation_of_communes:0 "A Republic of Free Municipalities"
 MEX_WW1_federation_of_communes_desc:0 "The local assemblies must be joined by institutions capable of defending their independence and resolving disputes between them. A federation of free municipalities will make village government a national settlement."
 MEX_WW1_army_of_reconstruction:0 "The Presidential Succession"
 MEX_WW1_army_of_reconstruction_desc:0 "The constitutional settlement has not resolved the succession. Obregón and the Sonoran leaders oppose an arrangement imposed from the capital, while the president argues that the revolution still requires firm direction."
 MEX_WW1_unified_command:0 "One National Command"
 MEX_WW1_unified_command_desc:0 "Personal armies cannot remain the foundation of the republic. Bring appointments, supply and the payment of the troops under a single national chain of command."
 MEX_WW1_military_governors:0 "Accountable Provincial Governors"
 MEX_WW1_military_governors_desc:0 "Provincial commanders must answer for the money they collect and the orders they issue. Regular inspection will replace private arrangements with a system of military administration responsible to the national government."
 MEX_WW1_army_cabinet:0 "A Cabinet for Reconstruction"
 MEX_WW1_army_cabinet_desc:0 "The government needs administrators as well as soldiers. Place the public accounts, communications and rebuilding programme in a cabinet whose ministers can be held to a common plan."
 MEX_WW1_public_works_corps:0 "The Public Works Corps"
 MEX_WW1_public_works_corps_desc:0 "Men released from field formations can repair roads, irrigation works and public buildings. An organized works corps will preserve their livelihood while turning the resources of the army towards reconstruction."
 MEX_WW1_merit_commissions:0 "Promotion by Service"
 MEX_WW1_merit_commissions_desc:0 "Loyalty to a revolutionary chief is an uncertain qualification for public office. Commissions will examine service records and professional training before confirming promotions in the army and the administration."
 MEX_WW1_ordered_republic:0 "Regularise the Presidency"
 MEX_WW1_ordered_republic_desc:0 "The emergency administration has restored the public services and brought the army under national control. Regular elections and a settled term of office will give the presidency an authority that no longer rests solely on military victory."
 MEX_WW1_foreign_secretariat:0 "Restore the Foreign Secretariat"
 MEX_WW1_foreign_secretariat_desc:0 "Mexico cannot leave its relations with other powers to provincial commanders, oil companies or foreign creditors. Restore a professional secretariat able to negotiate in the name of the republic."
 MEX_WW1_customs_diplomacy:0 "Customs and Commercial Rights"
 MEX_WW1_customs_diplomacy_desc:0 "Foreign trade must rest on agreements that our own customs officers can administer. Review the outstanding concessions and distinguish legitimate commercial rights from claims to political influence."
 MEX_WW1_consular_network:0 "A Working Consular Service"
 MEX_WW1_consular_network_desc:0 "Our representatives need dependable communications and clear instructions. Rebuilding the consular service will protect Mexican citizens abroad and give the government a reliable account of foreign intentions."
 MEX_WW1_sovereign_policy:0 "A Sovereign Foreign Policy"
 MEX_WW1_sovereign_policy_desc:0 "The foreign secretariat can now present a consistent policy. Mexico will negotiate with the great powers as an independent republic and decide for itself what obligations it is prepared to accept."
 MEX_WW1_safeguard_neutral_trade:0 "Safeguard Neutral Commerce"
 MEX_WW1_safeguard_neutral_trade_desc:0 "The European war need not close every market to Mexican goods. Defend lawful neutral commerce while refusing to make our ports and oilfields the instruments of another power."
 MEX_WW1_german_mission:0 "The Channel to Berlin"
 MEX_WW1_german_mission_desc:0 "Keep a confidential channel to the German mission without promising Mexico’s participation in the war. Its proposals must be judged against the country’s own military position and the means by which foreign assistance could actually reach us."
 MEX_WW1_entente_purchasing:0 "An Entente Purchasing Mission"
 MEX_WW1_entente_purchasing_desc:0 "The Entente needs supplies and seeks friendly ports across the Atlantic. A purchasing mission can explore whether commercial cooperation might lead to a convention that respects Mexican sovereignty."
 MEX_WW1_border_commission:0 "A Permanent Border Commission"
 MEX_WW1_border_commission_desc:0 "The frontier should not be governed by rumour and punitive expeditions. A permanent commission will document incursions, maintain contact with the American authorities and defend Mexico’s jurisdiction through regular diplomacy."
 MEX_WW1_military_credit:0 "German Arms Specifications"
 MEX_WW1_military_credit_desc:0 "The German military mission can supply drawings, gauges and instructions more readily than a guaranteed wartime shipment of rifles. Have the national workshops examine those specifications while the diplomats continue their negotiations."
 MEX_WW1_shipping_agreement:0 "An Atlantic Shipping Agreement"
 MEX_WW1_shipping_agreement_desc:0 "Regular freight space and clear insurance terms will determine whether an Atlantic convention can be supplied in practice. Establish the commercial arrangements before considering a military commitment."
 MEX_WW1_armed_neutrality:0 "Ratify Armed Neutrality"
 MEX_WW1_armed_neutrality_desc:0 "Mexico has endured enough destruction in the struggles for its own government. Preserve our independence, defend our territory and trade where we can, without promising another country the lives of Mexican soldiers."
 MEX_WW1_ratify_central:0 "Ratify the Central Convention"
 MEX_WW1_ratify_central_desc:0 "The German terms have been accepted in principle. Ratification will now bind Mexico to the Central Powers and end the policy of standing apart from the European coalitions."
 MEX_WW1_ratify_entente:0 "Ratify the Atlantic Convention"
 MEX_WW1_ratify_entente_desc:0 "The Entente has agreed to the convention. Mexico can now enter the alliance on the negotiated terms and take its place among the associated powers."
 MEX_WW1_carranza_doctrine:0 "The Doctrine of Equal Sovereignty"
 MEX_WW1_carranza_doctrine_desc:0 "No government should claim a privileged right to intervene in the affairs of another. State plainly that foreign residents are subject to the same laws as our citizens, and that diplomacy must rest on mutual respect between sovereign nations."
 MEX_WW1_continental_war_plans:0 "The Continental War Plan"
 MEX_WW1_continental_war_plans_desc:0 "If Mexico is to enter the American war, its objectives and preparations must be settled first. Prepare a campaign for the northern frontier while seeking German recognition of our claims to the territories lost in the previous century."
 MEX_WW1_atlantic_expedition:0 "Enter the Atlantic War"
 MEX_WW1_atlantic_expedition_desc:0 "The convention has been ratified and the army is prepared. Mexico will enter the war alongside the Entente, furnishing the forces and supplies that its government has undertaken to provide."
 MEX_WW1_army_board:0 "The National Army Board"
 MEX_WW1_army_board_desc:0 "The revolution has produced experienced soldiers and competing military traditions. A national board will establish a common organization, record the available equipment and begin replacing personal armies with a service of the republic."
 MEX_WW1_soldaderas:0 "Recognise the Soldaderas"
 MEX_WW1_soldaderas_desc:0 "Women have carried supplies, nursed the wounded and fought alongside the armies. Recognising their service and organizing the support work of the camps will preserve experience that the new army cannot afford to discard."
 MEX_WW1_arms_workshops:0 "The National Arms Workshops"
 MEX_WW1_arms_workshops_desc:0 "The army needs a dependable source of ammunition, repaired rifles and spare parts. Restore the national workshops and place their contracts under officers trained to inspect what they receive."
 MEX_WW1_staff_college:0 "Reopen the Staff College"
 MEX_WW1_staff_college_desc:0 "Experience in the field must be examined and taught. The staff college will train officers to coordinate formations, supply and communications beyond the limits of a single commander’s personal following."
 MEX_WW1_cavalry_scouts:0 "Cavalry and Reconnaissance"
 MEX_WW1_cavalry_scouts_desc:0 "Mounted formations know the distances and terrain of the republic. Establish proper reconnaissance detachments and teach their commanders to report what they find rather than commit the whole column to an uncertain pursuit."
 MEX_WW1_machinegun_sections:0 "Permanent Machine-Gun Sections"
 MEX_WW1_machinegun_sections_desc:0 "Machine guns should be organized, supplied and trained as part of the formation that employs them. Permanent sections will make fire support more reliable than weapons distributed on the eve of battle."
 MEX_WW1_field_artillery:0 "A Common Artillery Establishment"
 MEX_WW1_field_artillery_desc:0 "The batteries operate guns of different makes with ammunition that cannot always be replaced. Concentrate training and procurement on a common establishment that the workshops can support."
 MEX_WW1_supply_columns:0 "Organize the Supply Columns"
 MEX_WW1_supply_columns_desc:0 "A field army must carry its food and ammunition beyond the nearest railway station. Permanent supply columns will give commanders a realistic measure of how far their formations can operate."
 MEX_WW1_field_engineers:0 "Engineers with the Field Army"
 MEX_WW1_field_engineers_desc:0 "Bridges, roads and field works have too often depended on whatever labour a commander can obtain locally. Engineer detachments will provide trained men and standardized tools for these essential tasks."
 MEX_WW1_army_medical_service:0 "A National Army Medical Service"
 MEX_WW1_army_medical_service_desc:0 "The wounded should not depend entirely on improvised hospitals and the generosity of the next town. Organize medical detachments, evacuation arrangements and regular supplies for the field army."
 MEX_WW1_field_regulations:0 "The National Field Regulations"
 MEX_WW1_field_regulations_desc:0 "The branches of the army have been reorganized. Common field regulations will join reconnaissance, fire support and supply in a method that officers from every regional command can understand."
 MEX_WW1_regional_recruiting:0 "Regional Recruiting Offices"
 MEX_WW1_regional_recruiting_desc:0 "Recruitment must provide trained replacements without surrendering the army to local patrons. Establish regional offices that keep national records and send men to the formations that require them."
 MEX_WW1_officer_exchanges:0 "Lessons from the Sierra"
 MEX_WW1_officer_exchanges_desc:0 "Operations in the mountains have tested commanders and supply services alike. Regular exercises in difficult country will turn those lessons into practical training for the next generation of officers."
 MEX_WW1_professional_army:0 "A Professional Mexican Army"
 MEX_WW1_professional_army_desc:0 "Regular recruitment, common training and a functioning staff have given the army an institutional life beyond its commanders. Complete the transition to a professional national service."
 MEX_WW1_restore_national_territory:0 "Restore the National Territory"
 MEX_WW1_restore_national_territory_desc:0 "Armed governments that continue to hold Mexican provinces cannot be ignored indefinitely. Once the national army is ready, prepare to restore the authority of the republic over the remaining separatist commands."
 MEX_WW1_technical_services:0 "The Naval and Aeronautical Services"
 MEX_WW1_technical_services_desc:0 "The coast and the air require specialist skills that the field army cannot supply on its own. Establish a common technical programme for the small services on which future expansion will depend."
 MEX_WW1_naval_arsenals:0 "Restore the Naval Arsenals"
 MEX_WW1_naval_arsenals_desc:0 "Our small fleet needs reliable repair facilities before it needs ambitious building plans. Reopen the arsenals and train the craftsmen required to keep the ships at sea."
 MEX_WW1_gulf_patrols:0 "Patrol the Gulf Approaches"
 MEX_WW1_gulf_patrols_desc:0 "Oil exports and coastal traffic pass through waters that the government must be able to watch. Organize patrols, establish reporting stations and restore a regular naval presence along the Gulf coast."
 MEX_WW1_merchant_escorts:0 "Refit the Coastal Transports"
 MEX_WW1_merchant_escorts_desc:0 "The merchant ships that supply the ports can also support the fleet in an emergency. Survey suitable vessels and prepare standardized refits for transport and escort duties."
 MEX_WW1_coastal_service:0 "A Permanent Coastal Service"
 MEX_WW1_coastal_service_desc:0 "Patrol work, transport and repair must form a single dependable service. Common instructions and regular exercises will make the most of the vessels Mexico can maintain."
 MEX_WW1_balbuena_school:0 "The Flying School at Balbuena"
 MEX_WW1_balbuena_school_desc:0 "Military aviation begins with instructors, mechanics and a suitable field. Establish a flying school at Balbuena to train a small cadre before attempting a larger air service."
 MEX_WW1_aviation_workshops:0 "The TNCA Workshops"
 MEX_WW1_aviation_workshops_desc:0 "The Talleres Nacionales de Construcciones Aeronáuticas will give the military flying service the capacity to repair and build its own machines. Train mechanics beside the school and support the development of Mexican engines and propellers."
 MEX_WW1_flight_instructors:0 "Train Mexican Flight Instructors"
 MEX_WW1_flight_instructors_desc:0 "A school cannot expand while every lesson depends on a visiting specialist. Train Mexican instructors and establish a common course in flying, observation and the care of aircraft."
 MEX_WW1_army_air_service:0 "The Mexican Army Air Service"
 MEX_WW1_army_air_service_desc:0 "The flying school now has instructors and the workshops can maintain its machines. Form a permanent air service to provide observation, liaison and the first organized support for the field army."
 MEX_WW1_plan_san_luis:0 "The Plan of San Luis"
 MEX_WW1_plan_san_luis_desc:0 "The manifesto issued in Madero’s name has challenged the election and called for resistance. Its promise of effective suffrage has become the rallying point of movements whose hopes extend well beyond the presidency."
 MEX_WW1_ciudad_juarez_accords:0 "The Treaties of Ciudad Juárez"
 MEX_WW1_ciudad_juarez_accords_desc:0 "The fall of Ciudad Juárez has made the position of the old government untenable. The resignation of Díaz and an interim administration open the way to elections, but the federal army and the demands of the villages remain unresolved."
 MEX_WW1_orderly_retirement:0 "An Orderly Retirement"
 MEX_WW1_orderly_retirement_desc:0 "If the old presidency still holds office, it can avert another campaign by accepting a lawful transfer of power. Díaz will retire and Madero will be invited to form a civilian government under the existing constitution."
 MEX_WW1_civil_presidency:0 "Defend the Civil Presidency"
 MEX_WW1_civil_presidency_desc:0 "Madero’s victory need not end in another military government. Loyal officers, a free press and a practical answer to the villages can give the civilian presidency the authority that its enemies believe it lacks."
 MEX_WW1_commission_of_restitution:0 "A Commission of Restitution"
 MEX_WW1_commission_of_restitution_desc:0 "Madero cannot answer the southern villages with appeals to patience alone. A commission must establish which claims can be settled under the law and provide a timetable that the agrarian movement can judge."
 MEX_WW1_protect_liberal_press:0 "Protect the Liberal Press"
 MEX_WW1_protect_liberal_press_desc:0 "A civilian government must tolerate criticism without allowing armed conspiracies to decide every dispute. Defend the newspapers and political associations that have placed their trust in constitutional government."
 MEX_WW1_mediators_in_morelos:0 "Mediators in Morelos"
 MEX_WW1_mediators_in_morelos_desc:0 "The settlement in the south will be carried by officials who can hear the villages without treating every petition as an act of rebellion. Fulfilled land claims will give those officials an argument stronger than another ultimatum."
 MEX_WW1_honour_no_reelection:0 "Honour the Promise of No Re-election"
 MEX_WW1_honour_no_reelection_desc:0 "The principle that brought the civilian movement to power must also bind its president. A regular succession can demonstrate that the republic has outgrown the rule of an indispensable man."
 MEX_WW1_plan_guadalupe:0 "The Plan of Guadalupe"
 MEX_WW1_plan_guadalupe_desc:0 "The constitutionalist movement has fought in the name of restoring lawful government. Reaffirm the Plan of Guadalupe and establish a national command that can carry that claim beyond the decrees of the First Chief."
 MEX_WW1_municipio_libre:0 "The Free Municipality"
 MEX_WW1_municipio_libre_desc:0 "The law of the free municipality offers local government a place in the constitutional settlement. Restore municipal institutions while requiring commanders to surrender the revenues and appointments they have treated as their own."
 MEX_WW1_agrarian_law_1915:0 "The Agrarian Law of 6 January"
 MEX_WW1_agrarian_law_1915_desc:0 "Restitution cannot wait for every question of national government to be settled. The agrarian law will authorize commissions to hear village claims and begin restoring land under the authority of the constitutionalist government."
 MEX_WW1_casa_obrera_pact:0 "The Pact with the Casa del Obrero Mundial"
 MEX_WW1_casa_obrera_pact_desc:0 "The workers’ organizations and the constitutionalists share an enemy, but they do not share every aim. An agreement can bring organized labour into the struggle in return for recognition and promises that the government will later be expected to honour."
 MEX_WW1_red_battalions:0 "Organize the Red Battalions"
 MEX_WW1_red_battalions_desc:0 "Workers prepared to serve the constitutional cause will be organized in separate battalions. Their service may strengthen the army, but a government that accepts these volunteers will acquire obligations as well as soldiers."
 MEX_WW1_arbitrate_general_strike:0 "Arbitrate the General Strike"
 MEX_WW1_arbitrate_general_strike_desc:0 "The workers who supported the revolution now demand wages that will keep pace with food prices. Bring employers and unions before a regular tribunal rather than treating their dispute as another military rebellion."
 MEX_WW1_emergency_strike_decrees:0 "Emergency Labour Decrees"
 MEX_WW1_emergency_strike_decrees_desc:0 "The authorities can order the workshops reopened and place essential services under military protection. Production may resume, but the measures will deepen the breach with organizations that once supplied the government with volunteers."
 MEX_WW1_constituent_congress:0 "Summon the Constituent Congress"
 MEX_WW1_constituent_congress_desc:0 "The provisional government must finally define the law under which it intends to govern. Invite delegates to Querétaro, where the demands of the provinces, labour and the agrarian movement will meet the proposals of the executive."
 MEX_WW1_social_guarantees:0 "Guarantees for the Social Revolution"
 MEX_WW1_social_guarantees_desc:0 "The delegates insist that a constitution must address the conflicts that brought the country to war. Accept a charter of social rights and prepare the administrative machinery needed to make it more than a declaration."
 MEX_WW1_executive_constitution:0 "A Constitution of Executive Authority"
 MEX_WW1_executive_constitution_desc:0 "The government can seek a narrower settlement that places order and the power of the presidency ahead of the delegates’ broadest demands. Its authority will be stronger on paper and more dependent on continued support from the commanders."
 MEX_WW1_article_three:0 "Apply Article 3"
 MEX_WW1_article_three_desc:0 "The constitution has entrusted public education to the secular state. Train teachers, support the schools and establish a system that can operate in the villages as well as in the capital."
 MEX_WW1_ayala_leadership:0 "The Programme of Ayala"
 MEX_WW1_ayala_leadership_desc:0 "Zapata’s movement insists that the villages must control the lands restored to them. Give that programme the leadership of the national government and bind its armies to the authority of their communities."
 MEX_WW1_northern_leadership:0 "The Army of the North"
 MEX_WW1_northern_leadership_desc:0 "Villa’s soldiers can carry the Convention’s cause beyond the capital. Their leadership offers an army capable of defending the settlement, at the cost of a stronger military voice in the government."
 MEX_WW1_provisional_presidency:0 "Uphold the Provisional Presidency"
 MEX_WW1_provisional_presidency_desc:0 "Gutiérrez must be more than the temporary choice of rival commanders. Keep the presidency above the armies and seek a common programme that the Convention can defend in law as well as in the field."
 MEX_WW1_convention_programme_1916:0 "The Programme of the Revolution"
 MEX_WW1_convention_programme_1916_desc:0 "The Convention must unite its demands in a programme of government. Land, labour and municipal autonomy will be joined by national institutions capable of defending the settlement against its enemies."
 MEX_WW1_peasant_self_defence:0 "Village Defence Committees"
 MEX_WW1_peasant_self_defence_desc:0 "Local guards can protect the restored lands and prevent another commander from treating a village as his private source of supplies. Their responsibilities must be defined before local defence becomes another rival army."
 MEX_WW1_plan_agua_prieta:0 "The Plan of Agua Prieta"
 MEX_WW1_plan_agua_prieta_desc:0 "The Sonoran leaders have repudiated the authority of Carranza while reaffirming the Constitution of 1917. Back their challenge and prepare a provisional administration that can conduct the presidential election."
 MEX_WW1_extend_first_chief_mandate:0 "Extend the First Chief’s Mandate"
 MEX_WW1_extend_first_chief_mandate_desc:0 "The president can refuse to surrender the direction of the revolution to the Sonoran commanders. An extraordinary mandate will keep the government intact, but it will place military loyalty above the promise of a regular succession."
 MEX_WW1_veterans_settlement:0 "Settle the Claims of the Veterans"
 MEX_WW1_veterans_settlement_desc:0 "The men who followed the revolutionary commanders expect land, employment or a pension. A national settlement must honour legitimate service without allowing the veterans’ organizations to dictate the appointments of the government."
 MEX_WW1_war_damaged_railways:0 "The War-damaged Railway Network"
 MEX_WW1_war_damaged_railways_desc:0 "Locomotives have been worn out, bridges destroyed and railway workers dispersed. Restoring a national timetable will require coordinated repair contracts rather than another order to give military trains priority."
 MEX_WW1_mining_taxation:0 "Silver, Copper and the Treasury"
 MEX_WW1_mining_taxation_desc:0 "The mines can provide export revenues while the rest of the economy recovers. Establish an enforceable tax account and reinvest part of the proceeds in the roads and machinery that extraction requires."
 MEX_WW1_foreign_concession_review:0 "Invite Reconstruction Capital"
 MEX_WW1_foreign_concession_review_desc:0 "Foreign capital can restore production before the national treasury is able to finance every undertaking. Offer defined contracts and accept the political cost of relying on companies whose governments will defend their interests."
 MEX_WW1_national_purchasing_board:0 "A National Purchasing Board"
 MEX_WW1_national_purchasing_board_desc:0 "Domestic workshops can be strengthened by reliable public contracts. Establish a purchasing board that will favour Mexican suppliers and accept a slower recovery in return for greater control over the programme."
 MEX_WW1_monetary_commission_1916:0 "The Monetary Commission"
 MEX_WW1_monetary_commission_1916_desc:0 "Military notes and competing issues have undermined confidence in the currency. A monetary commission must settle the obligations of the treasury and establish which notes the government is prepared to honour."
 MEX_WW1_oil_decrees_1918:0 "The Oil Decrees of 1918"
 MEX_WW1_oil_decrees_1918_desc:0 "The state’s claim over the subsoil has brought it into conflict with foreign oil companies. Apply the new tax and registration requirements, and prepare to answer the governments that will speak on behalf of their investors."
 MEX_WW1_read_zimmermann_telegram:0 "The Zimmermann Telegram"
 MEX_WW1_read_zimmermann_telegram_desc:0 "Von Eckardt has presented a confidential proposal from Berlin. Germany offers financial assistance and recognition of Mexican claims in the north if war with the United States makes an alliance necessary. Before replying, the government must establish what such a promise would mean in practice."
 MEX_WW1_border_strength_review:0 "Examine the Northern Balance"
 MEX_WW1_border_strength_review_desc:0 "The General Staff must compare the forces that Mexico could sustain on the frontier with those the United States could deploy against them. Distance, railway capacity and replacement supplies matter as much as the number of men under arms."
 MEX_WW1_audit_german_deliveries:0 "Examine the German Guarantees"
 MEX_WW1_audit_german_deliveries_desc:0 "A promise of assistance is not a delivered rifle or a funded campaign. Ask how German money and equipment could reach Mexico through the wartime blockade, and who would bear the cost if the expected deliveries failed."
 MEX_WW1_weigh_military_report:0 "The General Staff’s Findings"
 MEX_WW1_weigh_military_report_desc:0 "The commission has examined the proposed alliance and the campaign it would require. Its findings must be read as a military assessment rather than an invitation to recover lost territory by declaration. The government will now decide whether any terms could justify the risk."
 MEX_WW1_request_german_guarantees:0 "Demand Binding Guarantees"
 MEX_WW1_request_german_guarantees_desc:0 "If Berlin wants Mexican participation, the agreement must contain more than a promise of future victory. Demand funded assistance and deliveries that the German government can actually provide before a convention is put before the national authorities."
 MEX_WW1_secure_diplomatic_cables:0 "Secure the Diplomatic Cables"
 MEX_WW1_secure_diplomatic_cables_desc:0 "The publication of private correspondence has shown how little protection a distant embassy can assume. Review the channels used by our missions and separate confidential instructions from routine commercial traffic."
 MEX_WW1_veracruz_settlement:0 "The Veracruz Settlement"
 MEX_WW1_veracruz_settlement_desc:0 "The occupation of Veracruz has left claims against the customs revenue and a deep distrust of American intentions. Seek a settlement that restores Mexican administration without conceding a standing right of intervention."
 MEX_WW1_border_patrols:0 "Reorganize the Border Commands"
 MEX_WW1_border_patrols_desc:0 "The raid on Columbus and the movement of American troops have exposed the weakness of communications along the frontier. Establish regular reports and clear instructions before a local clash becomes a war neither government intended."
 MEX_WW1_reject_unrestricted_pursuit:0 "Reject Unrestricted Pursuit"
 MEX_WW1_reject_unrestricted_pursuit_desc:0 "Mexico will not accept a permanent licence for foreign troops to cross its territory. Demand a defined limit to the expedition and make clear that our authorities retain responsibility for order on Mexican soil."
 MEX_WW1_negotiate_border_protocol:0 "Negotiate a Border Protocol"
 MEX_WW1_negotiate_border_protocol_desc:0 "A narrowly defined agreement may prevent clashes while the search for the raiders continues. Permit limited cooperation under Mexican supervision, and accept the criticism of those who see any concession as a threat to sovereignty."
 MEX_WW1_foreign_debt_commission:0 "The Foreign Debt Commission"
 MEX_WW1_foreign_debt_commission_desc:0 "The debts and claims left by successive governments cannot be settled by another promise against future customs receipts. Establish a commission to distinguish recognized obligations from the demands created by the fighting."
 MEX_WW1_bucareli_conference:0 "The Bucareli Conferences"
 MEX_WW1_bucareli_conference_desc:0 "Recognition and access to foreign capital have become entangled with claims over land and oil concessions. Open negotiations with the United States while defining which obligations the Mexican government is prepared to recognize."
 MEX_WW1_celaya_campaign:0 "The Campaign in the Bajío"
 MEX_WW1_celaya_campaign_desc:0 "The armies of the First Chief and the Convention are approaching a decisive test. Prepare the positions, reserves and railway supply needed to meet the northern cavalry in the Bajío."
 MEX_WW1_celaya_fieldworks:0 "Fieldworks at Celaya"
 MEX_WW1_celaya_fieldworks_desc:0 "Wire, trenches and carefully sited guns can break the momentum of a mounted attack. Train the infantry to hold its fire and to support the batteries instead of abandoning their positions for a premature pursuit."
 MEX_WW1_railway_warfare:0 "Railway Supply in the Bajío"
 MEX_WW1_railway_warfare_desc:0 "A prepared position will fail if its ammunition remains at the last station. Establish stores, protect the rolling stock and coordinate military movements with the railway officers responsible for keeping the line open."
 MEX_WW1_deserter_amnesty:0 "An Amnesty for the Ranks"
 MEX_WW1_deserter_amnesty_desc:0 "Many soldiers followed the commander who could feed and pay them rather than a settled political cause. Offer a controlled return to national service for those prepared to lay down their former loyalties."
 MEX_WW1_field_courts:0 "Regularize the Field Courts"
 MEX_WW1_field_courts_desc:0 "The government can insist that desertion and unauthorized requisitions be tried by regular field courts. The rules will strengthen discipline while exposing the army to the resentment created by their enforcement."
 MEX_WW1_serie_a_aircraft:0 "The Serie A Aircraft"
 MEX_WW1_serie_a_aircraft_desc:0 "The national workshops have advanced from repair work to the construction of Mexican aircraft. Support the development of the Serie A machines and the practical experience gained in building their engines, propellers and airframes."
 MEX_WW1_monterrey_foundries:0 "The Foundries of Monterrey"
 MEX_WW1_monterrey_foundries_desc:0 "The iron and steel works of the north can supply rails, tools and military contracts if their furnaces and transport connections are restored. Place regular orders with the foundries rather than leaving them dependent on the demands of the nearest commander."
 MEX_WW1_electricity_commission:0 "Connect the Power Stations"
 MEX_WW1_electricity_commission_desc:0 "Factories and tramways need a dependable supply of electricity. Coordinate the existing generating companies, repair transmission lines and settle the public contracts on which new industrial districts will depend."
 MEX_WW1_hydraulic_surveys:0 "Survey the Water Resources"
 MEX_WW1_hydraulic_surveys_desc:0 "Engineers will examine the rivers that might supply power and irrigation to the growing towns. Their surveys must weigh the needs of the villages against the concessions sought by the generating companies."
 MEX_WW1_workers_housing:0 "Housing for the Workshop Towns"
 MEX_WW1_workers_housing_desc:0 "The return of regular employment has crowded workers and their families into districts with poor water and sanitation. Housing grants and municipal services can make industrial recovery more durable than another cycle of recruitment and dismissal."
 MEX_WW1_rebuild_public_services:0 "Restore the Municipal Services"
 MEX_WW1_rebuild_public_services_desc:0 "The capital and the provincial towns need working water supplies, public buildings and roads. Assign engineers and regular grants to the municipalities so that reconstruction reaches beyond the railway shops."
 MEX_WW1_northern_cattle_trade:0 "Restore the Northern Cattle Trade"
 MEX_WW1_northern_cattle_trade_desc:0 "War has scattered the herds and disrupted the routes to the border markets. Veterinary inspection and clear export rules can restore trade while preventing military authorities from requisitioning the same cattle twice."
 MEX_WW1_mountain_batteries:0 "Batteries for the Mountain Campaigns"
 MEX_WW1_mountain_batteries_desc:0 "Heavy guns that cannot leave the railway offer little help in the sierra. Organize light batteries with pack transport and train their crews to accompany the infantry through broken country."
 MEX_WW1_naval_ordnance_school:0 "A School of Naval Ordnance"
 MEX_WW1_naval_ordnance_school_desc:0 "A small fleet must make effective use of the weapons it can maintain. Train artificers and gunnery officers in a common school, with workshops for the inspection of guns, ammunition and torpedo equipment."
 MEX_WW1_veracruz_defences:0 "Secure the Veracruz Approaches"
 MEX_WW1_veracruz_defences_desc:0 "The port is both a customs house and an approach to the capital. Survey its defences and establish permanent positions which can be manned without stripping the field army of its trained formations."
 MEX_WW1_reconstruction_board_shortcut:0 "Reconstruction"
 MEX_WW1_civic_congress_shortcut:0 "The Political Settlement"
 MEX_WW1_foreign_secretariat_shortcut:0 "Foreign Relations"
 MEX_WW1_army_board_shortcut:0 "The National Army"
 MEX_WW1_technical_services_shortcut:0 "Naval and Air Services"
 MEX_WW1_spirit_reconstruction_administration:0 "The Reconstruction Board"
 MEX_WW1_spirit_reconstruction_administration_desc:0 "Regular accounts and a common programme are restoring the authority of the national administration."
 MEX_WW1_spirit_rural_credit:0 "Provincial Credit Offices"
 MEX_WW1_spirit_rural_credit_desc:0 "Village producers can obtain seed and tools without surrendering their harvest in advance."
 MEX_WW1_spirit_customs_administration:0 "A National Customs Account"
 MEX_WW1_spirit_customs_administration_desc:0 "Export revenues are collected under a common system of inspection and public accounts."
 MEX_WW1_spirit_technical_education:0 "Provincial Technical Schools"
 MEX_WW1_spirit_technical_education_desc:0 "Training close to the workshops is creating a body of skilled mechanics and foremen."
 MEX_WW1_spirit_constitutional_settlement:0 "The Constitutional Settlement"
 MEX_WW1_spirit_constitutional_settlement_desc:0 "Civil institutions, representative government and a working body of social legislation bind the provinces to the republic."
 MEX_WW1_spirit_agrarian_settlement:0 "The Agrarian Settlement"
 MEX_WW1_spirit_agrarian_settlement_desc:0 "Village councils and land commissions provide a common foundation for the agrarian government."
 MEX_WW1_spirit_municipal_federation:0 "The Municipal Federation"
 MEX_WW1_spirit_municipal_federation_desc:0 "National institutions protect local self-government and settle disputes between the municipalities."
 MEX_WW1_spirit_provincial_inspection:0 "Provincial Inspection"
 MEX_WW1_spirit_provincial_inspection_desc:0 "Governors must account for public funds and the conduct of their administrations."
 MEX_WW1_spirit_reconstruction_cabinet:0 "The Reconstruction Cabinet"
 MEX_WW1_spirit_reconstruction_cabinet_desc:0 "The army has entrusted the public services to a common programme of national reconstruction."
 MEX_WW1_spirit_regular_presidency:0 "A Regular Presidency"
 MEX_WW1_spirit_regular_presidency_desc:0 "The authority of the presidency rests on an established term and a regular political settlement."
 MEX_WW1_spirit_armed_neutrality:0 "Armed Neutrality"
 MEX_WW1_spirit_armed_neutrality_desc:0 "Mexico defends its territory and lawful commerce while refusing the obligations of a foreign coalition."
 MEX_WW1_spirit_sovereign_diplomacy:0 "Equal Sovereignty"
 MEX_WW1_spirit_sovereign_diplomacy_desc:0 "Diplomacy rests on mutual respect between independent nations and equal treatment under Mexican law."
 MEX_WW1_spirit_field_services:0 "The Field Services"
 MEX_WW1_spirit_field_services_desc:0 "The experience of the soldaderas has been preserved in organized support and medical work."
 MEX_WW1_spirit_supply_service:0 "The Army Supply Service"
 MEX_WW1_spirit_supply_service_desc:0 "Permanent columns and regular stores allow the army to plan beyond the nearest railway station."
 MEX_WW1_spirit_field_regulations:0 "The National Field Regulations"
 MEX_WW1_spirit_field_regulations_desc:0 "Reconnaissance, fire support and supply follow a common set of instructions throughout the army."
 MEX_WW1_spirit_professional_army:0 "The Professional Army"
 MEX_WW1_spirit_professional_army_desc:0 "Regular recruiting and professional training have replaced dependence on personal military followings."
 MEX_WW1_spirit_coastal_service:0 "The Permanent Coastal Service"
 MEX_WW1_spirit_coastal_service_desc:0 "Patrol work, escort duties and repair are administered as a single naval service."
 MEX_WW1_spirit_air_service:0 "The Army Air Service"
 MEX_WW1_spirit_air_service_desc:0 "A permanent cadre of pilots, observers and mechanics supports the field army."
 MEX_WW1_spirit_land_restitution:0 "Land Restitution Commissions"
 MEX_WW1_spirit_land_restitution_desc:0 "Surveys and public hearings are turning the promise of land restitution into enforceable local settlements."
 MEX_WW1_spirit_labour_inspection:0 "The Labour Inspectorate"
 MEX_WW1_spirit_labour_inspection_desc:0 "Inspectors and labour courts enforce basic standards without leaving every dispute to a strike or an armed intervention."
 MEX_WW1_spirit_trained_workshops:0 "The Re-equipped Workshops"
 MEX_WW1_spirit_trained_workshops_desc:0 "New machinery and trained mechanics have made domestic production more dependable."
 MEX_WW1_spirit_industrial_conciliation:0 "Industrial Conciliation"
 MEX_WW1_spirit_industrial_conciliation_desc:0 "Regular agreements between employers and their workers protect production from renewed political conflict."
 MEX_WW1_alvaro_obregon:0 "Álvaro Obregón"
 ww1_mexico_focus.1.t:0 "Obregón and the Presidency"
 ww1_mexico_focus.1.d:0 "The election has given Álvaro Obregón a regular mandate after the provisional government established by the Sonoran movement. The new president must restore the public finances, settle the claims of the veterans and secure recognition abroad without surrendering the rights affirmed by the constitution."
 ww1_mexico_focus.1.a:0 "The country must be rebuilt."
 ww1_mexico_focus.2.t:0 "The Agrarian Convention"
 ww1_mexico_focus.2.d:0 "The delegates agree that the villages must be given more than another promise of reform. They must now choose the leader who will represent the movement in the national government. Emiliano Zapata speaks for the defence of village land and local authority; Francisco Villa commands a wider military following in the north."
 ww1_mexico_focus.2.a:0 "Zapata will carry the programme of Ayala."
 ww1_mexico_focus.2.b:0 "Villa can unite the revolutionary armies."
 ww1_mexico_focus.3.t:0 "The Presidency Secured"
 ww1_mexico_focus.3.d:0 "Officers entrusted with the defence of the lawful government have uncovered preparations for an armed conspiracy in the capital. The principal commands remain at their posts, while the civil authorities take charge of the investigation. For the moment, the presidency has been preserved without surrendering it to another general."
 ww1_mexico_focus.3.a:0 "The army serves the republic."
 ww1_mexico_focus.4.t:0 "The Constitution of Querétaro"
 ww1_mexico_focus.4.d:0 "The delegates have approved a new constitution for Mexico. Its provisions affirm the authority of the republic and address the demands for land, education and protection at work that have accompanied the revolution. The document is a foundation rather than a conclusion: the government must now create the institutions capable of applying it."
 ww1_mexico_focus.4.a:0 "Let the constitution become the law of the land."
 ww1_mexico_focus.5.t:0 "The First Land Settlements"
 ww1_mexico_focus.5.d:0 "The land commissions have completed their first surveys and heard the claims of the affected villages. Some communities can take possession at once, while other cases remain entangled in old titles and competing promises. The government must decide how much weight to give speed and how much to place on a settlement that will withstand a challenge in court."
 ww1_mexico_focus.5.a:0 "Begin with the clearly established claims."
 ww1_mexico_focus.5.b:0 "Pay for a thorough legal settlement."
 ww1_mexico_focus.6.t:0 "The Workshops Re-equipped"
 ww1_mexico_focus.6.d:0 "The machinery has been installed and the first groups of trained mechanics have returned to regular work. The programme has given the government a more dependable industrial base. Its next priorities will determine whether that capacity chiefly serves production targets or a broader agreement between employers and their workers."
 ww1_mexico_focus.6.a:0 "Put the engineers in charge of the new production programme."
 ww1_mexico_focus.6.b:0 "Secure the cooperation of the workers as well."
 ww1_mexico_focus.7.t:0 "The First Labour Agreements"
 ww1_mexico_focus.7.d:0 "Inspectors have begun visiting the larger workplaces and the first cases have reached the new labour courts. Employers and workers are discovering that disputes can be settled without calling in a commander or bringing an entire town to a halt. The system will require patience, but the law now has officers prepared to enforce it."
 ww1_mexico_focus.7.a:0 "Keep the inspectors at their work."
 MEX_WW1_railway_restoration:0 "Restore the Railway Workshops"
 MEX_WW1_railway_restoration_desc:0 "Bring the principal railway workshops back into regular service and rebuild their stocks of replacement parts. A dependable repair service will allow the railway commission to reopen lines that cannot be maintained by improvised work alone."
 MEX_WW1_land_restitution_project:0 "Survey the Village Claims"
 MEX_WW1_land_restitution_project_desc:0 "Send surveyors and legal officers to the districts where the land commissions are ready to begin. The resulting settlements must identify the land to be restored and provide the villages with records they can defend."
 MEX_WW1_labour_inspection_project:0 "Establish the Labour Inspectorate"
 MEX_WW1_labour_inspection_project_desc:0 "Recruit inspectors and create the first labour courts. The new service will have to enforce working hours and compensation while convincing both employers and their workers to accept regular arbitration."
 MEX_WW1_oil_survey_project:0 "Complete the Gulf Oil Survey"
 MEX_WW1_oil_survey_project_desc:0 "Inspect the coastal concessions, verify the accounts and prepare the infrastructure required for further extraction. Development must proceed under Mexican supervision rather than through another unchecked grant of authority."
 MEX_WW1_industrial_retooling:0 "Re-equip the National Workshops"
 MEX_WW1_industrial_retooling_desc:0 "Import the machinery that cannot yet be made at home, train the necessary mechanics and put the reconstruction contracts on a regular footing. The workshops must become a lasting industrial base rather than an emergency repair service."
 MEX_WW1_consolidate_industry:0 "Consolidate the Industrial Base"
 MEX_WW1_consolidate_industry_desc:0 "The re-equipped workshops and technical schools can support a broader industrial economy. Stable contracts, trained supervisors and a dependable supply network will allow the country to move beyond its first stage of industrial recovery."
 MEX_WW1_reconstruction_office:0 "The National Reconstruction Office"
 MEX_WW1_reconstruction_office_desc:0 "The republic must turn its programmes into work that can be carried out in the provinces. Railway repairs, land surveys and industrial development require trained staff, regular funds and time. The reconstruction office will coordinate these efforts as the government establishes their legal and administrative foundations."
 MEX_WW1_railway_programme_tt:0 "Unlocks the railway workshop restoration programme."
 MEX_WW1_oil_programme_tt:0 "Unlocks the Gulf oil survey."
 MEX_WW1_industrial_programme_tt:0 "Unlocks the industrial re-equipment programme."
 MEX_WW1_land_programme_tt:0 "Unlocks the village land survey programme."
 MEX_WW1_labour_programme_tt:0 "Unlocks the labour inspection programme."
 MEX_WW1_programme_bonus:0 "Mexican Research Programme"
 MEX_WW1_border_dialogue:0 "The Permanent Border Commission"
 MEX_WW1_central_convention_ready_tt:0 "Germany has accepted the convention and remains able to honour its terms. Mexico has not joined another faction."
 MEX_WW1_entente_convention_ready_tt:0 "France has accepted the convention and remains able to honour its terms. Mexico has not joined another faction."
