l_english:
 WW1_WA_FRA_1871:0 "The Legacy of 1871"
 WW1_WA_FRA_1871_desc:0 "The defeat at Sedan and the loss of Alsace-Lorraine still weigh on the Republic. The army and the government must agree how the recovery of the lost provinces is to be pursued, and what preparations that undertaking will require."
 WW1_WA_FRA_alsace_lorraine:0 "Recover Alsace-Lorraine"
 WW1_WA_FRA_alsace_lorraine_desc:0 "The settlement imposed at Frankfurt severed Alsace-Lorraine from France. We will make the return of the lost provinces an explicit national demand and prepare the men and supplies required to uphold it."
 WW1_WA_FRA_frankfurt:0 "Undo the Treaty of Frankfurt"
 WW1_WA_FRA_frankfurt_desc:0 "The frontier of 1871 cannot be changed by declarations alone. Our operational plans will place the recovery of Alsace-Lorraine at the centre of a campaign against Germany."
 WW1_WA_FRA_lost_departments:0 "Reunite the Lost Provinces"
 WW1_WA_FRA_lost_departments_desc:0 "French administration must return with more than a proclamation. Schools, railways and public services in the recovered provinces will be brought back into the life of the Republic."
 WW1_WA_WW1_WA_FRA_lost_departments_research:0 "Reunite the Lost Provinces Research"
 WW1_WA_FRA_eastern_frontier:0 "A Secure Eastern Frontier"
 WW1_WA_FRA_eastern_frontier_desc:0 "The recovery of Alsace-Lorraine must be followed by a durable settlement. We will prepare the frontier services and transport arrangements on which the security of the eastern departments depends."
 WW1_WA_GER_war_programme:0 "A Programme for Victory"
 WW1_WA_GER_war_programme_desc:0 "The September memorandum has set out the questions a German victory would have to settle. The ministries and the army must turn those demands into a common programme, while respecting obligations already accepted by the government."
 WW1_WA_GER_western_industry:0 "The Briey Iron Basin"
 WW1_WA_GER_western_industry_desc:0 "The ironfields around Briey and Longwy supply the industry of eastern France. Control of this district has become a central demand of those who seek a lasting industrial advantage over our western opponent."
 WW1_WA_WW1_WA_GER_western_industry_research:0 "The Briey Iron Basin Research"
 WW1_WA_GER_eastern_security:0 "An Eastern Security Zone"
 WW1_WA_GER_eastern_security_desc:0 "A war with Russia has exposed the length of our eastern frontier. Liaison officers and transport staffs will prepare a defensible settlement with the authorities that emerge beyond it."
 WW1_WA_GER_colonial_restitution:0 "Restitution of the Overseas Empire"
 WW1_WA_GER_colonial_restitution_desc:0 "The loss of overseas stations must not be accepted as a permanent consequence of the war. Our peace delegation will identify former German possessions held by our enemies and seek their restitution."
 WW1_WA_GER_settlement_industry:0 "Industry after the War"
 WW1_WA_GER_settlement_industry_desc:0 "The end of hostilities will leave shipping, railways and export markets disorganised. A reconstruction commission will turn the resources assembled for the war towards the needs of peace."
 WW1_WA_WW1_WA_GER_settlement_industry_research:0 "Industry after the War Research"
 WW1_WA_AUH_common_war_aims:0 "The Monarchy Must Endure"
 WW1_WA_AUH_common_war_aims_desc:0 "The war has placed the existence of the Monarchy in question. The Common Council of Ministers will set out the political and military conditions required to preserve its authority and the security of its frontiers."
 WW1_WA_AUH_serbian_question:0 "A Settlement of the Serbian Question"
 WW1_WA_AUH_serbian_question_desc:0 "Serbian hostility cannot remain an open threat on the southern frontier. Our delegation will demand a settlement that prevents Belgrade from again becoming the centre of a hostile coalition."
 WW1_WA_AUH_carpathian_frontier:0 "Preserve the Carpathian Frontier"
 WW1_WA_AUH_carpathian_frontier_desc:0 "The Galician approaches and the passes through the Carpathians protect the heart of the Monarchy. Their defence requires a common timetable for reserves, artillery and the trains that carry them."
 WW1_WA_AUH_adriatic_position:0 "Maintain Our Adriatic Position"
 WW1_WA_AUH_adriatic_position_desc:0 "The naval stations and coastal routes of the Adriatic are essential to the Monarchy. The army and navy will coordinate the supplies needed to hold them against an enemy advance."
 WW1_WA_AUH_postwar_common_services:0 "Restore the Common Services"
 WW1_WA_AUH_postwar_common_services_desc:0 "Peace will leave the surviving institutions of the Monarchy with urgent work. Reopening transport links and restoring civilian supplies will give the crownlands a practical foundation for recovery."
 WW1_WA_WW1_WA_AUH_postwar_common_services_research:0 "Restore the Common Services Research"
 WW1_WA_ITA_irredenta:0 "Italia Irredenta"
 WW1_WA_ITA_irredenta_desc:0 "The war against Austria-Hungary gives a definite purpose to the demand for national completion. Trentino and Trieste will stand at the centre of the programme submitted to our allies."
 WW1_WA_ITA_trentino:0 "Beyond the Trentino Frontier"
 WW1_WA_ITA_trentino_desc:0 "The mountain frontier divides valleys, roads and communities whose future has become a question of national policy. We must supply the formations charged with reaching the northern objectives."
 WW1_WA_WW1_WA_ITA_trentino_research:0 "Beyond the Trentino Frontier Research"
 WW1_WA_ITA_trieste:0 "The Road to Trieste"
 WW1_WA_ITA_trieste_desc:0 "Trieste gives the eastern campaign a clear objective. The advance must be supported by a coordinated movement of artillery, engineers and supplies along the Isonzo front."
 WW1_WA_ITA_adriatic_terms:0 "The Adriatic Terms"
 WW1_WA_ITA_adriatic_terms_desc:0 "Our representatives must distinguish the promised frontier from wider ambitions along the Adriatic. We will maintain the claims set out for the Italian littoral without pretending that an allied promise has already transferred the land."
 WW1_WA_ITA_redeemed_cities:0 "The Redeemed Cities"
 WW1_WA_ITA_redeemed_cities_desc:0 "Italian rule in Trentino and Trieste must be secured through the reopening of railways, public services and ordinary commerce. The work of national completion continues after the armies have passed."
 WW1_WA_WW1_WA_ITA_redeemed_cities_research:0 "The Redeemed Cities Research"
 WW1_WA_ENG_war_aims:0 "The British War Aims"
 WW1_WA_ENG_war_aims_desc:0 "The cabinet must define the purpose for which British forces are fighting. The security of the sea routes and a European settlement that can be maintained will guide our preparations for peace."
 WW1_WA_ENG_belgium:0 "Restore Belgian Independence"
 WW1_WA_ENG_belgium_desc:0 "The restoration of Belgium is a test of the settlement we seek in Europe. We will sustain the Belgian forces and place the recovery of their country among the declared objects of the war."
 WW1_WA_ENG_sea_routes:0 "Secure the Ocean Routes"
 WW1_WA_ENG_sea_routes_desc:0 "Our armies and the population at home depend upon ships reaching British ports. The protection of the trade routes must remain a principal object of naval operations until the war is won."
 WW1_WA_ENG_suez:0 "Keep the Route through Suez"
 WW1_WA_ENG_suez_desc:0 "An enemy advance against the canal would threaten the connection between Britain and its eastern possessions. Supplies and shipping will be reserved for the forces responsible for keeping that route open."
 WW1_WA_ENG_peace_commitments:0 "The Settlement and Our Commitments"
 WW1_WA_ENG_peace_commitments_desc:0 "The obligations assumed during the war must be reconciled with the resources of the peace. Our delegates will prepare the commercial and transport arrangements needed to sustain the settlement."
 WW1_WA_WW1_WA_ENG_peace_commitments_research:0 "The Settlement and Our Commitments Research"
 WW1_WA_RIE_war_aims:0 "Russia and the Coming Settlement"
 WW1_WA_RIE_war_aims_desc:0 "The military effort must serve a political purpose. The Council of Ministers will define the security of the western frontier, our Balkan commitments and the questions to be raised with our allies."
 WW1_WA_RIE_galicia:0 "The Galician Question"
 WW1_WA_RIE_galicia_desc:0 "War with Austria-Hungary has brought the future of Galicia before our government. Our delegation will put forward its demands while the army prepares to sustain the advance beyond the frontier."
 WW1_WA_RIE_constantinople:0 "The Constantinople Claim"
 WW1_WA_RIE_constantinople_desc:0 "The passage between the Black Sea and the Mediterranean has long constrained Russian trade and strategy. At war with the Ottoman Empire, we will place the future of Constantinople before our allies as a principal question of the peace."
 WW1_WA_RIE_balkan_commitment:0 "Uphold the Serbian Commitment"
 WW1_WA_RIE_balkan_commitment_desc:0 "The survival of Serbia remains bound to our position in the Balkans. Military supplies and liaison officers will give practical support to the undertaking our government has made."
 WW1_WA_RIE_western_recovery:0 "Reopen the Western Provinces"
 WW1_WA_RIE_western_recovery_desc:0 "A settlement will mean little if the provinces behind the front remain cut off from the rest of the country. Railway services and civilian administration will be restored as the armies stand down."
 WW1_WA_WW1_WA_RIE_western_recovery_research:0 "Reopen the Western Provinces Research"
 WW1_WA_TUR_imperial_survival:0 "The Survival of the Empire"
 WW1_WA_TUR_imperial_survival_desc:0 "The loss of provinces and repeated wars have left the Empire with little room for another defeat. The cabinet must define the frontiers and communications that its armies are fighting to preserve."
 WW1_WA_TUR_caucasus:0 "Recover the Caucasian Frontier"
 WW1_WA_TUR_caucasus_desc:0 "The districts lost on the Caucasian frontier remain a grievance. A war with Russia offers an opportunity to recover them, provided that the army can be supplied through the mountains."
 WW1_WA_TUR_canal:0 "Challenge British Control of Suez"
 WW1_WA_TUR_canal_desc:0 "British control of the canal sustains its position in Egypt and the eastern Mediterranean. A campaign towards Suez will seek to disrupt that connection and restore our influence on the approaches to Egypt."
 WW1_WA_TUR_capital:0 "Keep the Straits Open to the Empire"
 WW1_WA_TUR_capital_desc:0 "The capital and the passages to the Black Sea must remain in Ottoman hands. Engineers, replacement stores and transport officers will be assigned to the forces responsible for the Straits."
 WW1_WA_TUR_surviving_empire:0 "Peace for a Surviving Empire"
 WW1_WA_TUR_surviving_empire_desc:0 "With the capital secure and hostilities ended, the government can turn from emergency requisitions to ordinary administration. Restoring commerce and public services will make survival more than a military achievement."
 WW1_WA_JAP_german_bases:0 "The German Naval Stations"
 WW1_WA_JAP_german_bases_desc:0 "The German stations in East Asia provide support for a fleet operating far from Europe. Our campaign will seek their removal and a settlement of the rights they sustain in the region."
 WW1_WA_WW1_WA_JAP_german_bases_research:0 "The German Naval Stations Research"
 WW1_WA_JAP_siege_train:0 "Land the Siege Train"
 WW1_WA_JAP_siege_train_desc:0 "The reduction of a fortified harbour requires more than the presence of warships. Siege stores and engineers will accompany the troops assigned to the German naval station."
 WW1_WA_JAP_east_asia_squadron:0 "Pursue the East Asia Squadron"
 WW1_WA_JAP_east_asia_squadron_desc:0 "German cruisers threaten the routes between our ports and the Pacific stations. Patrols and wireless reports will be coordinated to deny them a secure base of operations."
 WW1_WA_JAP_island_garrisons:0 "Supply the Island Garrisons"
 WW1_WA_JAP_island_garrisons_desc:0 "The capture of a station is only the beginning of its occupation. Regular shipping and replacement stores will allow the garrisons to remain in place while their future is negotiated."
 WW1_WA_JAP_pacific_peace:0 "The Pacific Peace Delegation"
 WW1_WA_JAP_pacific_peace_desc:0 "The disposal of the former German stations will be a question for the peace conference. Our delegates will prepare the records and transport arrangements needed to uphold Japan's position."
 WW1_WA_WW1_WA_JAP_pacific_peace_research:0 "The Pacific Peace Delegation Research"
 WW1_WA_USA_associated_power:0 "An Associated Power"
 WW1_WA_USA_associated_power_desc:0 "Congress has committed the country to war. Our forces will cooperate with the other belligerents while remaining responsible to the government and people of the United States."
 WW1_WA_USA_seas:0 "Freedom of the Seas"
 WW1_WA_USA_seas_desc:0 "The safety of peaceful commerce is among the objects for which we have entered the war. Merchant shipping and its escorts will receive the equipment needed to keep the Atlantic routes open."
 WW1_WA_USA_restoration:0 "Restore the Invaded Nations"
 WW1_WA_USA_restoration_desc:0 "The settlement must allow the invaded countries to recover their independence. American supplies will support the forces still fighting for that purpose, beginning with Belgium."
 WW1_WA_USA_declared_aims:0 "Give Force to Our Declared Aims"
 WW1_WA_USA_declared_aims_desc:0 "A statement of principles must be supported by a sustained military effort. The expeditionary command will prepare its final campaign in accordance with the objects set before Congress."
 WW1_WA_USA_peace_work:0 "The Work of the Peace"
 WW1_WA_USA_peace_work_desc:0 "With hostilities ended, the wartime departments must turn to the return of the forces and the restoration of trade. The obligations of the peace will be examined alongside the needs of the Republic."
 WW1_WA_WW1_WA_USA_peace_work_research:0 "The Work of the Peace Research"
 WW1_WA_SOV_revolution:0 "Defend the Revolution"
 WW1_WA_SOV_revolution_desc:0 "The survival of Soviet power depends upon defeating the armies assembled against it. The military authorities will give the fronts a common account of the forces and supplies available."
 WW1_WA_SOV_white_armies:0 "Break the White Armies"
 WW1_WA_SOV_white_armies_desc:0 "The White armies draw strength from separate commands and distant bases. A coordinated effort must prevent them from combining their advances against the Soviet centre."
 WW1_WA_SOV_interventionists:0 "End Foreign Intervention"
 WW1_WA_SOV_interventionists_desc:0 "Foreign forces have intervened in the struggle within Russia. Where they are at war with us, the fronts will coordinate the operations needed to compel their withdrawal."
 WW1_WA_WHR_civil_war:0 "A Russia without Bolshevism"
 WW1_WA_WHR_civil_war_desc:0 "The anti-Bolshevik forces must agree upon the immediate object of their campaign. Defeating Soviet power and restoring a common civil authority will require more than separate advances by rival commanders."
 WW1_WA_WHR_red_centres:0 "Advance against the Red Centres"
 WW1_WA_WHR_red_centres_desc:0 "The railway junctions linking the Soviet centres sustain their armies. Our staff will concentrate supplies for the operations needed to break that system."
 WW1_WA_WHR_civil_authority:0 "Restore Civil Authority"
 WW1_WA_WHR_civil_authority_desc:0 "The front cannot be sustained if disorder follows behind it. Transport officers and civil administrators will coordinate the movement of supplies through the districts held by our forces."
 WW1_WA_WW1_WA_WHR_civil_authority_research:0 "Restore Civil Authority Research"
 WW1_WA_GEN_mandate:0 "Define Our War Aims"
 WW1_WA_GEN_mandate_desc:0 "The government must state the objects for which the country will fight. A clear mandate will give the military authorities a basis for their preparations and our representatives a common position abroad."
 WW1_WA_GEN_mobilisation:0 "For the Defence of the Country"
 WW1_WA_GEN_mobilisation_desc:0 "The struggle must be sustained by a dependable system of supplies and replacements. The government will make the equipment needed by the field forces available to the military authorities."
 WW1_WA_GEN_territory:0 "Secure the National Territory"
 WW1_WA_GEN_territory_desc:0 "The country cannot accept the permanent loss of its own territory through occupation. The military and civil authorities will prepare the recovery of districts held by an enemy and the restoration of ordinary government behind the front."
 WW1_WA_GEN_serbian_unity:0 "The South Slav Question"
 WW1_WA_GEN_serbian_unity_desc:0 "The war has brought the future of the South Slavs before Europe. Our representatives will put forward the claim to Bosnia-Herzegovina while the army sustains the struggle against the power that holds it."
 WW1_WA_GEN_bulgarian_revision:0 "Revise the Peace of Bucharest"
 WW1_WA_GEN_bulgarian_revision_desc:0 "The settlement of 1913 left the Macedonian question unresolved in Bulgarian eyes. Where the holders of the disputed districts are our enemies, the government will make revision an explicit object of the war."
 WW1_WA_GEN_romanian_union:0 "The Romanians beyond the Carpathians"
 WW1_WA_GEN_romanian_union_desc:0 "The future of the Romanian communities in Transylvania and Bukovina is central to our position in the war. The delegation will set out those claims while the army prepares to cross the frontier."
 WW1_WA_GEN_greek_frontiers:0 "The Greek National Claims"
 WW1_WA_GEN_greek_frontiers_desc:0 "The islands of the eastern Aegean and the disputed Thracian frontier remain matters of national policy. We will state our demands against the enemy powers that hold those territories."
 WW1_WA_GEN_belgian_restoration:0 "Restore the Belgian Kingdom"
 WW1_WA_GEN_belgian_restoration_desc:0 "The restoration of the kingdom requires the survival of its army and its civil institutions. Supplies will be reserved for the forces that continue the struggle for Belgian independence."
 WW1_WA_GEN_portuguese_overseas:0 "Safeguard Our African Possessions"
 WW1_WA_GEN_portuguese_overseas_desc:0 "The war has exposed our African possessions to attacks across distant frontiers. Replacement stores and regular shipping will sustain the garrisons responsible for holding them."
 WW1_WA_GEN_chinese_shandong:0 "The Shandong Settlement"
 WW1_WA_GEN_chinese_shandong_desc:0 "German rights in Shandong have become a question of Chinese sovereignty. Our representatives will seek the recovery of the leased port and reject a settlement that merely replaces one hostile foreign holder with another."
 WW1_WA_WW1_WA_GEN_chinese_shandong_research:0 "The Shandong Settlement Research"
 WW1_WA_GEN_albanian_independence:0 "An Independent Albania"
 WW1_WA_GEN_albanian_independence_desc:0 "The military struggle must preserve an Albanian state able to govern its own territory. Arms and supplies will be placed at the disposal of the forces responsible for defending that independence."
 WW1_WA_GEN_persian_sovereignty:0 "Sovereignty over Our Own Soil"
 WW1_WA_GEN_persian_sovereignty_desc:0 "Foreign armies cannot be allowed to decide the future of Persia without regard for its government. The military authorities will strengthen the forces charged with restoring control of the country."
 WW1_WA_WW1_WA_GEN_persian_sovereignty_research:0 "Sovereignty over Our Own Soil Research"
 WW1_WA_GEN_dervish_resistance:0 "Maintain the Dervish Resistance"
 WW1_WA_GEN_dervish_resistance_desc:0 "The survival of the resistance depends on keeping arms and supplies moving between the districts still under our control. The field forces will coordinate their stores before the next enemy advance."
 WW1_WA_GEN_mexican_republic:0 "The Revolution and the Republic"
 WW1_WA_GEN_mexican_republic_desc:0 "The struggle for Mexico must produce a government capable of upholding its authority. The military commands will coordinate the supplies needed to defeat their opponents and restore civil administration."
 WW1_WA_GEN_overseas_service:0 "Our Share in the War"
 WW1_WA_GEN_overseas_service_desc:0 "Our expeditionary forces must be able to sustain the part assigned to them in the common campaign. Replacement stores and transport will support their service beyond the country's shores."
 WW1_WA_GEN_national_settlement:0 "The Terms We Will Defend"
 WW1_WA_GEN_national_settlement_desc:0 "The government will place the country's security and sovereignty at the centre of its demands. Military supplies and transport plans must support the position our delegates are asked to maintain."
 WW1_WA_WW1_WA_GEN_national_settlement_research:0 "The Terms We Will Defend Research"
 WW1_WA_GEN_peace_delegation:0 "Prepare the Peace Delegation"
 WW1_WA_GEN_peace_delegation_desc:0 "With hostilities ended, our representatives must turn the objects of the war into a defensible settlement. Civil departments will prepare the records and reconstruction plans they will require."
 WW1_WA_WW1_WA_GEN_peace_delegation_research:0 "Prepare the Peace Delegation Research"
 WW1_WA_campaign_staff:0 "Campaign Liaison Staff"
 WW1_WA_campaign_staff_desc:0 "The staffs have agreed a common timetable for the movement of formations and their supplies."
 WW1_WA_maritime_operations:0 "Coordinated Maritime Operations"
 WW1_WA_maritime_operations_desc:0 "Patrol reports, convoy schedules and the supply of overseas stations are being considered together."
 WW1_WA_reconstruction:0 "Postwar Reconstruction Commission"
 WW1_WA_reconstruction_desc:0 "Civil departments are coordinating the reopening of transport, workshops and public services."
