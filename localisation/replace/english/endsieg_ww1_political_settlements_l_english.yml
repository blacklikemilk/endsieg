l_english:
 shared_GEN_state_claims_2_desc:0 "The Entente must hear our demands before we accept further commitments. Ministers should agree on a programme that our representatives can defend abroad."
 ww1_political_cabinets.1.t:0 "A Parliamentary Ministry"
 ww1_political_cabinets.1.d:0 "With the constitutional settlement secured, the parties must agree on a ministry capable of commanding the Commons. Supporters of the present administration favour continuity, while Labour argues that its growing parliamentary voice entitles it to lead a government of its own."
 ww1_political_cabinets.1.a:0 "Continue with the present ministry."
 ww1_political_cabinets.1.b:0 "Invite Ramsay MacDonald to form a ministry."
 ww1_political_cabinets.2.t:0 "Leadership of the Unionist Cabinet"
 ww1_political_cabinets.2.d:0 "The Unionists have agreed on the need for a more accountable cabinet, but its leadership remains disputed. Some favour preserving the present balance between civilian ministers and the palace. Enver Pasha's supporters instead demand that the direction of government be placed in the hands of the military leadership."
 ww1_political_cabinets.2.a:0 "Retain the present cabinet."
 ww1_political_cabinets.2.b:0 "Entrust the government to Enver Pasha."
 ww1_brazil.1.t:0 "A New President in Rio de Janeiro"
 ww1_brazil.1.d:0 "Hermes da Fonseca has secured the presidency. His supporters expect the new administration to restore confidence in the government and defend the arrangements on which the republic rests."
 ww1_brazil.1.a:0 "The new administration takes office."
 ww1_brazil.2.t:0 "The Presidential Election"
 ww1_brazil.2.d:0 "Venceslau Brás has won the presidential contest. The incoming administration faces the task of maintaining the republic's political balance while events abroad threaten to disrupt its commerce."
 ww1_brazil.2.a:0 "Entrust the government to Brás."
 ww1_brazil.3.t:0 "A Change of Administration"
 ww1_brazil.3.d:0 "Delfim Moreira will assume the responsibilities of the presidency. The new administration must preserve continuity while the country faces the consequences of war and growing uncertainty at home."
 ww1_brazil.3.a:0 "The work of government must continue."
 ww1_brazil.4.t:0 "Brazilian Shipping under Attack"
 ww1_brazil.4.d:0 "German submarines have attacked Brazilian merchant shipping. The losses have provoked demands that the government answer these attacks with more than a diplomatic protest. Entering the war would align us openly with the Entente, while restraint would leave the anger at home unresolved."
 ww1_brazil.4.a:0 "Brazil will enter the war."
 ww1_brazil.4.b:0 "Keep our response diplomatic."
 ww1_britain.1010.t:0 "The Scandinavian Governments Refuse"
 ww1_britain.1010.d:0 "Our request that the Scandinavian governments restrict trade with Germany has been rejected. Their ministers insist that neutral commerce cannot be abandoned at British demand, leaving a serious obstacle to the effectiveness of the blockade."
 ww1_britain.1011.t:0 "A Scandinavian Trade Agreement"
 ww1_britain.1011.d:0 "The Scandinavian governments have agreed to restrict their commercial dealings with Germany. Their cooperation will strengthen the blockade and make it harder for German buyers to obtain supplies through neutral ports."
 ww1_britain.1011.a:0 "An important success for the blockade."
 ww1_serbia.4.t:0 "Trouble on the Albanian Frontier"
 ww1_serbia.4.d:0 "Reports from the districts around Debar describe renewed fighting and attacks on isolated garrisons. Our commanders believe that armed groups are using the Albanian side of the frontier as a refuge. Pursuing them across the border may end the immediate threat, but would challenge the settlement agreed in London."
 ww1_serbia.4.a:0 "Our troops must remain on our side of the frontier."
 ww1_serbia.5.t:0 "Talks on the Albanian Frontier"
 ww1_serbia.5.d:0 "A proposal has reached Belgrade to end our operations beyond the Albanian frontier. Our representatives argue that the army cannot abandon the border districts to further raids. An agreement to withdraw would reduce the danger of foreign intervention, while another refusal would leave the dispute unresolved."
 ww1_serbia.5.a:0 "Arrange a withdrawal through the talks."
 ww1_serbia.6.t:0 "Our Troops Leave Albania"
 ww1_serbia.6.d:0 "Our commanders have confirmed that Serbian troops have returned behind the Albanian frontier. Vienna has been informed that its demand has been met. The immediate crisis has passed, though the frontier remains a source of distrust between our governments."
 ww1_serbia.6.a:0 "The frontier must now be secured from our side."
 ww1_serbia.7.t:0 "Serbian Troops beyond the Albanian Frontier"
 ww1_serbia.7.d:0 "Reports from Albania confirm that Serbian forces have crossed the frontier fixed by the powers. Belgrade describes the advance as an operation against armed bands, but a continued Serbian presence would undermine the Albanian settlement. We can demand evacuation, seek another agreement in London, or decline to press the matter."
 ww1_serbia.7.a:0 "Give Belgrade eight days to evacuate."
 invade_azerbaijan:0 "Advance into Azerbaijan"
 invade_azerbaijan_desc:0 "The Azerbaijani government is consolidating its authority beyond our southern frontier. An advance by the Red Army would challenge its independence and seek to place the republic under Soviet rule."
 invade_georgia:0 "Advance into Georgia"
 invade_georgia_desc:0 "Georgia remains outside the authority of the Soviet government. The Red Army can carry the struggle into the Caucasus, though the Georgian republic is preparing to defend its independence."
 invade_armenia:0 "Advance into Armenia"
 invade_armenia_desc:0 "The Armenian republic stands between the competing ambitions of its neighbours. An advance would seek to replace its government with Soviet authority and bring the frontier under our control."
 invade_baku:0 "Advance on Baku"
 invade_baku_desc:0 "Baku's oil fields and port give the city an importance far beyond its size. The Red Army must secure the approaches if Soviet authority is to be established there."
