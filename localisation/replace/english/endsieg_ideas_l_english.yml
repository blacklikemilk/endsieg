    soviet_occupation_war_exhaustion: "Soviet Resistance"
    soviet_occupation_war_exhaustion_desc: "Additionally to the army debuffs, this idea adds 1 daily §RWar Exhaustion§! while at war and removes the ability to lose §RWar Exhaustion§! while at peace. We should attempt to fix the resistance problem as soon as we can."
    soviet_occupation_war_exhaustion_2: "Soviet Resistance"
    soviet_occupation_war_exhaustion_2_desc: "Additionally to the army debuffs, this idea adds 1 daily §RWar Exhaustion§! while at war and removes the ability to lose §RWar Exhaustion§! while at peace. We should attempt to fix the resistance problem as soon as we can."
    soviet_occupation_war_exhaustion_3: "Soviet Resistance"
