    treaty_of_versailles: "Treaty of Versailles"
    treaty_of_versailles_desc: "The post-war settlement restores the Rhineland and Palatinate to Germany while granting France resource rights there and in the Ruhr, Moselland and Westerwaldkreis. Germany pays consumer-goods reparations of 20% each to France and Britain. Its military is limited to a 100,000-man Reichswehr; naval and air rearmament are prohibited."
    versailles_reparations_recipient: "Versailles Reparations"
    versailles_reparations_recipient_desc: "German reparations reduce consumer-goods requirements by 20%."
 AUH_ww1_food_strained:0 "Strained Civilian Food Supply"
 AUH_ww1_food_strained_desc:0 "Food security below 40 undermines army recovery and civilian production. Deliveries and distribution must improve."
 AUH_ww1_food_crisis:0 "Imperial Food Crisis"
 AUH_ww1_food_crisis_desc:0 "Food security below 20 disrupts recovery and production. Unreliable deliveries reduce native stability each month until food access improves."
 AUH_ww1_food_distribution:0 "Priority Food Distribution"
 AUH_ww1_food_distribution_desc:0 "Paid transport and distribution measures reduce waste in military supply."
 AUH_ww1_strike_concessions:0 "Strike Settlement Concessions"
 AUH_ww1_strike_concessions_desc:0 "Negotiated concessions restore confidence while temporarily limiting factory output."
 AUH_ww1_imperial_censorship:0 "Imperial Press Directives"
 AUH_ww1_imperial_censorship_desc:0 "Censorship provides temporary control but restricts the circulation of technical knowledge."
 AUH_ww1_civilian_kitchens:0 "Municipal Kitchen Network"
 AUH_ww1_civilian_kitchens_desc:0 "Public kitchens improve confidence while requiring additional civilian resources."
 AUH_ww1_common_army:0 "The Common Army"
 AUH_ww1_common_army_desc:0 "A coherent training system gives the multilingual common army a practical military foundation."
 AUH_ww1_siege_artillery:0 "Imperial Siege Artillery"
 AUH_ww1_siege_artillery_desc:0 "Prepared observation and specialist artillery services help supply the heavy batteries."
 AUH_ww1_mountain_troops:0 "Alpine Troop Services"
 AUH_ww1_mountain_troops_desc:0 "Mountain training and specialized support improve the endurance of our frontier formations."
 AUH_ww1_general_staff:0 "Reformed Army High Command"
 AUH_ww1_general_staff_desc:0 "A clearer chain of command and better staff procedures improve practical operational coordination."
 AUH_ww1_alpine_front:0 "The Alpine Defensive System"
 AUH_ww1_alpine_front_desc:0 "Prepared local defenses support troops fighting on imperial territory."
 AUH_ww1_air_service:0 "The Luftfahrtruppen"
 AUH_ww1_air_service_desc:0 "Dedicated instruction improves the small imperial air service."
 AUH_ww1_fighter_production:0 "Licensed Fighter Production"
 AUH_ww1_fighter_production_desc:0 "Licensing contracts and common specifications accelerate aircraft research."
 AUH_ww1_naval_command:0 "Imperial Naval Command"
 AUH_ww1_naval_command_desc:0 "Permanent liaison between naval bases and fleet command improves professional instruction."
 AUH_ww1_adriatic_patrols:0 "Adriatic Patrol Services"
 AUH_ww1_adriatic_patrols_desc:0 "Coastal reconnaissance and disciplined patrol routines support operations close to our bases."
 AUH_ww1_dualist_compromise:0 "The Renewed Dualist Compromise"
 AUH_ww1_dualist_compromise_desc:0 "The common government has secured negotiated support from Budapest while retaining the constitutional settlement."
 AUH_ww1_trialist_administration:0 "Trialist Administration"
 AUH_ww1_trialist_administration_desc:0 "A South Slav political partner strengthens cooperation but requires civilian administrative resources."
 AUH_ww1_federal_administration:0 "Federal Imperial Institutions"
 AUH_ww1_federal_administration_desc:0 "Negotiated institutions strengthen common defense while imposing slower administration and training."
 AUH_ww1_workers_councils:0 "Recognized Worker Delegations"
 AUH_ww1_workers_councils_desc:0 "Factory representatives secure more reliable production in exchange for civilian resources."
 AUH_ww1_joint_industry_board:0 "The Joint Industrial Board"
 AUH_ww1_joint_industry_board_desc:0 "Austrian and Hungarian representatives coordinate new military construction."
 AUH_ww1_common_customs:0 "The Common Customs Market"
 AUH_ww1_common_customs_desc:0 "Technical standards and internal contracts support civilian industrial expansion."
 AUH_ww1_transition_economy:0 "The Transition Economy"
 AUH_ww1_transition_economy_desc:0 "Emergency contracts give way to reconstruction. Factory output temporarily falls while demobilization closes wartime plants."
 IT1_ww1_food_shortage:0 "Legacy Food Shortage"
 IT1_ww1_food_shortage_desc:0 "This former food-security penalty is no longer active."
 IT1_ww1_food_crisis:0 "Legacy Food Crisis"
 IT1_ww1_food_crisis_desc:0 "This former food-security penalty is no longer active."
 IT1_ww1_social_unrest:0 "Legacy Social Unrest"
 IT1_ww1_social_unrest_desc:0 "This former home-front index is no longer active."
 IT1_ww1_social_crisis:0 "Legacy Social Crisis"
 IT1_ww1_social_crisis_desc:0 "This former home-front index is no longer active."
 IT1_ww1_rationing:0 "Priority Food Distribution"
 IT1_ww1_rationing_desc:0 "Paid transport and distribution measures reduce waste in military supply."
 IT1_ww1_strike_agreement:0 "Negotiated Labor Concessions"
 IT1_ww1_strike_agreement_desc:0 "Concessions restore confidence at a temporary cost to factory output."
 IT1_ww1_colonial_constabulary:0 "Funded Colonial Security"
 IT1_ww1_colonial_constabulary_desc:0 "A paid local security programme improves the supervision of existing holdings."
 IT1_ww1_colonial_investment:0 "Colonial Civil Services"
 IT1_ww1_colonial_investment_desc:0 "Paid investment supports construction and civilian services within existing holdings."
 IT1_ww1_neutral_trade:0 "Neutral Trade Contracts"
 IT1_ww1_neutral_trade_desc:0 "Paid guarantees support civilian trade and construction while reducing the share of resources available for military contracts."
 IT1_ww1_mediation_mission:0 "A Paid Mediation Mission"
 IT1_ww1_mediation_mission_desc:0 "The government funds a diplomatic channel rather than forcing the opposing factions to make peace."
 IT1_ww1_general_staff:0 "Coordinated Army Staff"
 IT1_ww1_general_staff_desc:0 "A professional staff improves reinforcement and operational coordination."
 IT1_ww1_alpini:0 "Alpine Training Services"
 IT1_ww1_alpini_desc:0 "Specialist mountain instruction improves endurance and defense on national territory."
 IT1_ww1_assault_corps:0 "The Assault Training Programme"
 IT1_ww1_assault_corps_desc:0 "Small-unit assault instruction improves attack at the cost of slower specialized training."
 IT1_ww1_artillery_survey:0 "Artillery Survey Services"
 IT1_ww1_artillery_survey_desc:0 "Observation and common firing procedures support the accuracy and supply of the batteries."
 IT1_ww1_logistics_service:0 "The Military Logistics Service"
 IT1_ww1_logistics_service_desc:0 "Coordinated deliveries reduce waste and improve the endurance of deployed formations."
 IT1_ww1_aviation_service:0 "The Servizio Aeronautico"
 IT1_ww1_aviation_service_desc:0 "Dedicated instruction supports the professional development of the air service."
 IT1_ww1_caproni_contracts:0 "Caproni Bombing Programme"
 IT1_ww1_caproni_contracts_desc:0 "Bombing trials and a dedicated operational command improve target selection and the effectiveness of strategic missions."
 IT1_ww1_adriatic_patrols:0 "Adriatic Patrol Services"
 IT1_ww1_adriatic_patrols_desc:0 "Coastal reconnaissance improves naval detection around the fleet bases."
 IT1_ww1_fleet_command:0 "The Coordinated Fleet Command"
 IT1_ww1_fleet_command_desc:0 "Staff instruction and naval liaison improve professional naval experience."
 IT1_ww1_army_transition:0 "The Army Reform Transition"
 IT1_ww1_army_transition_desc:0 "Early command reform reduces the old military penalties while the army learns its revised procedures."
 IT1_ww1_modernized_army:0 "The Reorganized Army"
 IT1_ww1_modernized_army_desc:0 "Reformed command and unit services reduce the old military weaknesses, while some wartime strain remains."
 IT1_ww1_industrial_mobilization_spirit:0 "Central Industrial Mobilization"
 IT1_ww1_industrial_mobilization_spirit_desc:0 "Central supervision directs the national armament programme and raises factory output while placing additional demands on civilian production."
 IT1_ww1_industrial_labor:0 "Wartime Industrial Labor"
 IT1_ww1_industrial_labor_desc:0 "Paid training and workplace facilities temporarily sustain production."
 IT1_ww1_state_arsenals:0 "State Armament Programme"
 IT1_ww1_state_arsenals_desc:0 "Coordinated public contracts support new armament plants and military output, with a civilian commitment to their upkeep."
 IT1_ww1_private_consortia_spirit:0 "Industrial Consortia"
 IT1_ww1_private_consortia_spirit_desc:0 "Competitive long-term contracts encourage civilian investment and improve production efficiency."
 IT1_ww1_transition_economy:0 "Civilian Industrial Conversion"
 IT1_ww1_transition_economy_desc:0 "Conversion accelerates civilian factory construction and reduces consumer demands, at a temporary cost to military factory output."
 IT1_ww1_saver_protection:0 "Small Subscriber Guarantees"
 IT1_ww1_saver_protection_desc:0 "Paid guarantees support confidence while diverting resources toward civilian commitments."
 IT1_ww1_domestic_credit:0 "Domestic Supply Programme"
 IT1_ww1_domestic_credit_desc:0 "A predictable schedule of domestic orders improves armament output and production efficiency."
 IT1_ww1_trade_credit:0 "Foreign Purchasing Offices"
 IT1_ww1_trade_credit_desc:0 "Purchasing machinery abroad accelerates civilian industrial construction while reserving some capacity for the programme."
 IT1_ww1_consular_network:0 "The Consular Network"
 IT1_ww1_consular_network_desc:0 "Commercial and diplomatic reporting improves the work of public officials."
 IT1_ww1_colonial_trade_board:0 "The Colonial Trade Board"
 IT1_ww1_colonial_trade_board_desc:0 "Common contracting and civilian services support public construction."
 IT1_ww1_armed_neutrality_spirit:0 "Permanent Armed Neutrality"
 IT1_ww1_armed_neutrality_spirit_desc:0 "The kingdom commits resources to national defense while avoiding general war."
 IT1_ww1_mediterranean_council:0 "The Mediterranean Security Council"
 IT1_ww1_mediterranean_council_desc:0 "A paid council coordinates diplomatic and naval consultation."
 IT1_ww1_parliamentary_government:0 "Parliamentary Consultation"
 IT1_ww1_parliamentary_government_desc:0 "Accountable committees improve ordinary political administration."
 IT1_ww1_catholic_coalition:0 "The Catholic Parliamentary Understanding"
 IT1_ww1_catholic_coalition_desc:0 "A broader coalition provides political support while requiring civilian commitments."
 IT1_ww1_liberal_cabinet_spirit:0 "The Responsible Liberal Cabinet"
 IT1_ww1_liberal_cabinet_spirit_desc:0 "A responsible parliamentary ministry strengthens political administration and civilian construction."
 IT1_ww1_royal_cabinet_spirit:0 "The Royal Executive Cabinet"
 IT1_ww1_royal_cabinet_spirit_desc:0 "The royal executive directs political business and military administration, with a larger civilian commitment to its public services."
 IT1_ww1_professional_civil_service:0 "A Professional Civil Service"
 IT1_ww1_professional_civil_service_desc:0 "Qualified officials and predictable service standards support civilian construction and reduce administrative demands on production."
 IT1_ww1_republican_guarantees:0 "Republican Civil Guarantees"
 IT1_ww1_republican_guarantees_desc:0 "Accountable government and civil guarantees support political administration, education and research."
 IT1_ww1_factory_councils:0 "Recognized Factory Councils"
 IT1_ww1_factory_councils_desc:0 "Factory councils coordinate armament output and production learning while reserving civilian resources for the workers' services."
 AUH_ww1_stable_institutions:0 "Stable Imperial Institutions"
 AUH_ww1_stable_institutions_desc:0 "Native stability is at least 60%. Common offices can carry out their duties; this tier adds no stability bonus."
 AUH_ww1_strained_institutions:0 "Strained Imperial Institutions"
 AUH_ww1_strained_institutions_desc:0 "Native stability is below 60%. Political disputes slow common administration."
 AUH_ww1_fragile_institutions:0 "Fragile Imperial Institutions"
 AUH_ww1_fragile_institutions_desc:0 "Native stability is below 40%. Contested appointments and unreliable services disrupt production."
 AUH_ww1_fragmented_institutions:0 "Fragmented Imperial Institutions"
 AUH_ww1_fragmented_institutions_desc:0 "Native stability is below 25%. Civic disorder disrupts production and the common army."
 AUH_ww1_provincial_consultation:0 "Provincial Consultation"
 AUH_ww1_provincial_consultation_desc:0 "Paid representative panels provide liaison and reliable appointments."
 AUH_ww1_local_police_reform:0 "Local Police Reform"
 AUH_ww1_local_police_reform_desc:0 "Language training and local supervision improve police work in occupied districts."
 AUH_ww1_parliamentary_scrutiny:0 "Parliamentary Scrutiny"
 AUH_ww1_parliamentary_scrutiny_desc:0 "Independent review reduces waste in public procurement, at a political cost."
 AUH_ww1_civil_administration:0 "Civil Administration"
 AUH_ww1_civil_administration_desc:0 "Coordinated permits and civil registers improve the delivery of public construction contracts."
 AUH_ww1_public_works:0 "Public Works Programme"
 AUH_ww1_public_works_desc:0 "Public maintenance supports roads and civilian construction. Civilian capacity remains tied to the programme."
 AUH_ww1_dualist_cabinet:0 "The Renewed Dual Cabinet"
 AUH_ww1_dualist_cabinet_desc:0 "The two governments maintain separate responsibilities and a written procedure for common business."
 AUH_ww1_centralist_cabinet:0 "The Common Executive"
 AUH_ww1_centralist_cabinet_desc:0 "Central appointments speed executive decisions but retain the nationality dispute."
 AUH_ww1_trialist_crown:0 "The Three-Part Crown"
 AUH_ww1_trialist_crown_desc:0 "A negotiated South Slav partner joins the common constitutional framework."
 AUH_ww1_federal_chamber:0 "The Federal Chamber"
 AUH_ww1_federal_chamber_desc:0 "Elected crownland representation administers the integrated federation."
 AUH_ww1_confederal_council:0 "The Crownland Council"
 AUH_ww1_confederal_council_desc:0 "Autonomous crownland governments coordinate common defence and services."
 AUH_ww1_republican_assembly:0 "The Danubian Republican Assembly"
 AUH_ww1_republican_assembly_desc:0 "An elected federal government replaces imperial executive power and supervises common services."
 AUH_ww1_austrian_reconstruction:0 "Austrian Reconstruction"
 AUH_ww1_austrian_reconstruction_desc:0 "The Austrian remnant concentrates on civilian services and defence after an agreed separation."
 AUH_ww1_nationality_charter:0 "The Nationality Charter"
 AUH_ww1_nationality_charter_desc:0 "Language and local institutional rights receive a common administrative guarantee."
 AUH_ww1_regimental_language_service:0 "Regimental Language Service"
 AUH_ww1_regimental_language_service_desc:0 "Interpreters and liaison officers improve command within the multilingual army."
 AUH_ww1_crown_amnesty:0 "Reviewed Political Amnesty"
 AUH_ww1_crown_amnesty_desc:0 "Civil oversight supports a carefully reviewed amnesty. The programme requires continuing political attention."
 AUH_ww1_federal_army:0 "A Common Federal Army"
 AUH_ww1_federal_army_desc:0 "A ratified federal command organises the army under common recruitment and language services."
 AUH_ww1_danubian_customs_union:0 "The Danubian Customs Union"
 AUH_ww1_danubian_customs_union_desc:0 "Common commercial standards support construction and industry across the participating governments."
 AUH_ww1_constitutional_dispute:0 "A Disputed Constitutional Draft"
 AUH_ww1_constitutional_dispute_desc:0 "Unresolved regional objections require another round of negotiations."
 AUH_ww1_staff_college:0 "The Common Staff College"
 AUH_ww1_staff_college_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_defence_in_depth:0 "Defence in Depth"
 AUH_ww1_defence_in_depth_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_assault_detachments:0 "Assault Detachments"
 AUH_ww1_assault_detachments_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_pilot_school:0 "Imperial Pilot School"
 AUH_ww1_pilot_school_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_observer_service:0 "Aerial Observer Service"
 AUH_ww1_observer_service_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_aircraft_workshops:0 "Aircraft Workshops"
 AUH_ww1_aircraft_workshops_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_naval_engineering:0 "Naval Engineering Service"
 AUH_ww1_naval_engineering_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_flotilla_command:0 "Adriatic Flotilla Command"
 AUH_ww1_flotilla_command_desc:0 "A dedicated service develops this specific military capability through trained staff and maintenance, rather than another general political bonus."
 AUH_ww1_delivery_registers:0 "Common Delivery Registers"
 AUH_ww1_delivery_registers_desc:0 "Municipal returns and railway records expose waste in public contracts. Better delivery schedules reduce household demands and help factories improve their production routines."
 AUH_ww1_restored_public_services:0 "Restored Provincial Services"
 AUH_ww1_restored_public_services_desc:0 "A coordinated programme of housing, schools and municipal reconstruction supports civilian industry and eases the burden on households."
 AUH_ww1_reserve_coordination:0 "Common Reserve Schedules"
 AUH_ww1_reserve_coordination_desc:0 "Liaison among the Honved, Landwehr and common army gives reserve training and replacement drafts a shared timetable."
 AUH_ww1_combined_operations:0 "Common Operational Planning"
 AUH_ww1_combined_operations_desc:0 "Army staffs prepare campaigns together and match their operational plans to the transport and supply services available."
 AUH_ww1_front_squadrons:0 "Front Air Companies"
 AUH_ww1_front_squadrons_desc:0 "Assigned patrol sectors and a common reporting system extend the effective reach of our front-line air companies."
 AUH_ww1_knoller_programme:0 "Knoller Programme Review"
 AUH_ww1_knoller_programme_desc:0 "Operational trials and observer reports turn promising proposals into more accurate bombing procedures."
 AUH_ww1_aviation_supply_pool:0 "Air Service Spare-Parts Pool"
 AUH_ww1_aviation_supply_pool_desc:0 "Compatible parts and scheduled maintenance keep aircraft available and reduce avoidable accidents."
 AUH_ww1_joint_air_command:0 "Joint Air Command"
 AUH_ww1_joint_air_command_desc:0 "Reconnaissance, fighter protection and infantry contact flights operate under one mission schedule."
 AUH_ww1_cattaro_repair_service:0 "Cattaro Repair Service"
 AUH_ww1_cattaro_repair_service_desc:0 "Workshops serving the southern flotillas repair battle damage quickly and reduce the wear of Adriatic patrols."
 AUH_ww1_otranto_strike_plan:0 "Otranto Strike Plan"
 AUH_ww1_otranto_strike_plan_desc:0 "Common signals and coordinated training prepare the light forces for a limited campaign against the Otranto patrol line."
 IT1_ww1_colonial_civil_service:0 "Colonial Civil Service"
 IT1_ww1_colonial_civil_service_desc:0 "District officials work under common legal and administrative standards, building cooperation with local communities and restraining resistance."
 IT1_ww1_public_accounts:0 "Published Wartime Accounts"
 IT1_ww1_public_accounts_desc:0 "Inspections improve industrial routines and expose waste in army purchasing. Maintaining the programme places a modest additional demand on the civilian economy."
 IT1_ww1_veteran_resettlement:0 "Veteran Resettlement Programme"
 IT1_ww1_veteran_resettlement_desc:0 "Pensions, reserve courses and public works support returning soldiers. The programme improves training and infrastructure construction while requiring additional civilian resources."
 IT1_ww1_local_charters:0 "Local Administrative Charters"
 IT1_ww1_local_charters_desc:0 "Written responsibilities and permanent local councils support cooperation with the colonial administration."
 IT1_ww1_campaign_staff:0 "Italian Campaign Staff"
 IT1_ww1_campaign_staff_desc:0 "Reserve schedules, operational plans and supply arrangements are prepared together for the coming campaign."
 IT1_ww1_air_operations:0 "Coordinated Air Operations"
 IT1_ww1_air_operations_desc:0 "Common mission schedules and maintenance procedures improve efficiency and reduce accidents."
 IT1_ww1_arsenal_repairs:0 "Naval Arsenal Repair Network"
 IT1_ww1_arsenal_repairs_desc:0 "Shared inspection reports and workshop schedules turn repairs around quickly and reduce wear at sea."
 IT1_ww1_battlefleet_doctrine:0 "Battle-Fleet Doctrine"
 IT1_ww1_battlefleet_doctrine_desc:0 "The heavy squadrons concentrate on coordination and organisation for fleet engagements."
 IT1_ww1_light_force_doctrine:0 "Adriatic Light-Force Doctrine"
 IT1_ww1_light_force_doctrine_desc:0 "Scouts, destroyers and small craft use superior detection and speed to conduct patrols and raids."

 GE1_I_chemical_research:0 "Chemical Research Cartels"
 GE1_I_chemical_research_desc:0 "German chemical firms coordinate research, laboratory practice, and industrial scale-up across the cartel system."
 GE1_I_export_credit_network:0 "Export Credit Network"
 GE1_I_export_credit_network_desc:0 "Prewar export finance keeps orders moving through German firms, while credit commitments limit the room left for civilian consumption."
 GE1_I_rail_freight_priority:0 "Rail Freight Priority"
 GE1_I_rail_freight_priority_desc:0 "Railway offices give industrial freight priority, improving the handoff from coalfields and steelworks to production lines."
 GE1_I_war_contracts:0 "War Corporations"
 GE1_I_war_contracts_desc:0 "Krupp, Rheinmetall, and state arsenals receive clearer contract standards, making procurement more reliable at a cost to civilian orders."
 GE1_I_substitute_materials:0 "Substitute Materials Programme"
 GE1_I_substitute_materials_desc:0 "Blocked imports are replaced with domestic fibres, chemicals, and ration inputs. Output improves modestly while civilian goods remain constrained."
 GE1_A_staff_spirit:0 "General Staff Field Methods"
 GE1_A_staff_spirit_desc:0 "The General Staff standardises map exercises, staff rides, and rapid operational reporting across the field army."
 GE1_A_logistics_spirit:0 "Field Logistics Corps"
 GE1_A_logistics_spirit_desc:0 "Dedicated supply and transport officers keep ammunition, rations, and replacements moving through the railhead and forward depots."
 GE1_A_fire_support_spirit:0 "Integrated Fire Support"
 GE1_A_fire_support_spirit_desc:0 "Artillery observers, infantry commanders, and engineers coordinate a single fire plan before the assault reaches the wire."
 GE1_A_defence_spirit:0 "Elastic Defence Doctrine"
 GE1_A_defence_spirit_desc:0 "Forward positions delay the enemy while reserves and machine guns prepare a controlled counterstroke from depth."
 GE1_N_surface_spirit:0 "High Seas Risk Doctrine"
 GE1_N_surface_spirit_desc:0 "The High Seas Fleet accepts measured risks to force a decisive action while preserving its battle line for the next sortie."
 GE1_N_screen_spirit:0 "Coastal Screen Command"
 GE1_N_screen_spirit_desc:0 "Destroyers, minesweepers, and coastal crews protect the fleet's approaches and keep the North Sea channels open."
 GE1_N_u_boat_spirit:0 "U-Boat Service"
 GE1_N_u_boat_spirit_desc:0 "The submarine arm builds a disciplined patrol service around torpedo practice, patient reconnaissance, and coordinated reports."
 GE1_N_merchant_spirit:0 "Merchant Protection Office"
 GE1_N_merchant_spirit_desc:0 "Naval planners treat merchant routing, port repair, and convoy intelligence as one continuing operational responsibility."
 GE1_P_burgfrieden_compromise:0 "Burgfrieden Committee"
 GE1_P_burgfrieden_compromise_desc:0 "A cross party committee keeps the Reichstag working during the emergency while preserving the constitutional balance."
 GE1_P_reichstag_oversight:0 "Reichstag War Oversight"
 GE1_P_reichstag_oversight_desc:0 "Parliamentary committees scrutinise expenditure and the conduct of the war, improving legitimacy at the cost of slower military planning."
 GE1_P_press_review:0 "Press Review Commission"
 GE1_P_press_review_desc:0 "Censors retain wartime controls while legal review limits arbitrary closures and keeps public confidence from collapsing."
 GE1_D_mitteleuropa_trade:0 "Mitteleuropa Trade Board"
 GE1_D_mitteleuropa_trade_desc:0 "Commercial attachés coordinate contracts and credit across the Central Powers, improving access to imports while the war economy pays an administrative cost."
 GE1_D_ottoman_mission:0 "Ottoman Economic Mission"
 GE1_D_ottoman_mission_desc:0 "A permanent mission coordinates rail, credit, and military procurement with Constantinople without assuming an automatic alliance outcome."
 GE1_D_anglo_german_compact:0 "Anglo-German Compact"
 GE1_D_anglo_german_compact_desc:0 "A formal understanding with Britain lowers naval tension and gives the two governments a shared diplomatic position before the continental crisis."
 GE1_D_continental_coordination:0 "Continental Coordination"
 GE1_D_continental_coordination_desc:0 "France and Russia coordinate a separate continental front while Berlin preserves the agreed channels with Britain and Austria-Hungary."
 RUS_ww1_state_council:0 "A Working Council of Ministers"
 RUS_ww1_state_council_desc:0 "Ministers use a common calendar and written responsibilities to bring provincial reports into government business."
 RUS_ww1_zemstvo_services:0 "Zemstvo Public Services"
 RUS_ww1_zemstvo_services_desc:0 "Local institutions maintain schools, public health and roads under predictable service agreements."
 RUS_ww1_land_bank:0 "Agricultural Credit and Settlement"
 RUS_ww1_land_bank_desc:0 "Rural purchasing and settlement agreements strengthen civilian development while requiring public investment."
 RUS_ww1_workers_insurance:0 "Workers Insurance Funds"
 RUS_ww1_workers_insurance_desc:0 "Factory insurance and public health offices reduce disruption, while employers contribute to the new services."
 RUS_ww1_imperial_cabinet:0 "The Reformed Imperial Cabinet"
 RUS_ww1_imperial_cabinet_desc:0 "A disciplined imperial ministry directs the bureaucracy and maintains the authority of the crown."
 RUS_ww1_responsible_ministry:0 "A Ministry Responsible to the Duma"
 RUS_ww1_responsible_ministry_desc:0 "A parliamentary ministry supports civilian investment and publishes the government's financial accounts."
 RUS_ww1_republican_institutions:0 "Constituent Republican Institutions"
 RUS_ww1_republican_institutions_desc:0 "Elected institutions oversee national services and maintain civil guarantees."
 RUS_ww1_social_coalition:0 "A Labour and Peasant Coalition"
 RUS_ww1_social_coalition_desc:0 "Representatives of workers and rural communities direct public investment while providing broader civilian services."
 RUS_ww1_military_directorate:0 "Alekseev's Staff Directorate"
 RUS_ww1_military_directorate_desc:0 "The executive is organised around the general staff and a disciplined civil service. Mobilisation and army administration gain priority, while civilian building programmes compete with the demands of military government."
 RUS_ww1_civil_registers:0 "Reconciled Civil Registers"
 RUS_ww1_civil_registers_desc:0 "Written procedures and trained clerks improve the administration of provincial contracts."
 RUS_ww1_national_compact:0 "The Imperial Nationalities Compact"
 RUS_ww1_national_compact_desc:0 "Provincial assemblies share a written division of powers and common defence obligations."
 RUS_ww1_federal_union:0 "A Union of Self-Governing Provinces"
 RUS_ww1_federal_union_desc:0 "Regional governments administer local services while defence, railways and the internal market remain common."
 RUS_ww1_unitary_administration:0 "Uniform Provincial Administration"
 RUS_ww1_unitary_administration_desc:0 "Common service regulations connect provincial offices directly to the national ministries."
 RUS_ww1_common_market:0 "The Russian Internal Market"
 RUS_ww1_common_market_desc:0 "Agreed customs and transport standards improve the exchange of goods across the provinces."

 GE1_RP_prussian_franchise:0 "The Prussian Franchise Compact"
 GE1_RP_prussian_franchise_desc:0 "The crown preserves the three class franchise in Prussia while granting the Reichstag a clearer place in budget and war administration. Conservatives accept a measured constitutional settlement; reformers must continue to work through the provincial balance."
 GE1_RP_equal_franchise:0 "Equal Reichstag Franchise"
 GE1_RP_equal_franchise_desc:0 "The government accepts equal votes for the Reichstag and binds wartime legitimacy to a broader national electorate. The reform strengthens civilian confidence, though the army and conservative estates surrender part of their old influence."
 GE1_RP_zabern_accountability:0 "Zabern Accountability"
 GE1_RP_zabern_accountability_desc:0 "Military authority remains subject to civilian review after the Zabern affair. The army retains its honour and chain of command, while ministers gain the right to answer publicly for abuses committed in the crown's name."
 GE1_RP_ohl_directive:0 "Third Supreme Command Directive"
 GE1_RP_ohl_directive_desc:0 "Hindenburg and Ludendorff direct the war through the Oberste Heeresleitung. Centralised planning improves the army's coordination, but the generals' authority narrows parliamentary control and burdens the cabinet with military demands."
 GE1_RP_civilian_control:0 "Civilian War Ministry"
 GE1_RP_civilian_control_desc:0 "The chancellor and Reichstag committees retain authority over war credits, procurement and the political direction of the campaign. Planning becomes slower, but the government can still negotiate with labour and the parties behind the front."
 GE1_RP_fatherland_mobilisation:0 "Fatherland Party Mobilisation"
 GE1_RP_fatherland_mobilisation_desc:0 "The Fatherland Party rallies annexationists, industrialists and nationalist associations behind a victory without compromise. Its campaign sustains the will to fight while consuming political capital and civilian capacity."
 GE1_RP_peace_resolution:0 "Reichstag Peace Resolution"
 GE1_RP_peace_resolution_desc:0 "The Reichstag calls for a peace without annexations and demands a settlement that can be defended before the German public. The resolution lowers the temperature at home, but the army must reconcile it with its war aims."
 GE1_RP_easter_promise:0 "Easter Constitutional Promise"
 GE1_RP_easter_promise_desc:0 "The crown promises reform after the emergency and offers the parties a constitutional future within the Empire. The promise steadies the home front, though every delay in fulfilling it becomes more dangerous."
 GE1_RP_october_reforms:0 "October Constitutional Reforms"
 GE1_RP_october_reforms_desc:0 "The chancellor becomes responsible to the Reichstag and the imperial government accepts parliamentary confidence as the basis of authority. Reform cannot erase the losses of the war, but it gives the Empire a constitutional path through the crisis."
 GE1_RP_abdication_crisis:0 "Crisis of the Crown"
 GE1_RP_abdication_crisis_desc:0 "Defeat, naval mutiny and demonstrations have turned the question of the Kaiser's future into a question of state survival. Ministers must decide whether to preserve the crown through reform or authorize a republican transition."
 GE1_RP_ebert_republic:0 "Ebert's Provisional Republic"
 GE1_RP_ebert_republic_desc:0 "A provisional republican government under Friedrich Ebert assumes responsibility for order and negotiations. It inherits the imperial bureaucracy while trying to prevent the collapse of administration during demobilisation."
 GE1_RP_constitutional_empire:0 "Constitutional Empire Settlement"
 GE1_RP_constitutional_empire_desc:0 "The crown, the Reichstag and the federal states accept a written balance of authority. A victorious or negotiated Empire can now reconcile military prestige with responsible government."
 GE1_RP_reconciliation:0 "Imperial Reconciliation"
 GE1_RP_reconciliation_desc:0 "The government brings veterans, parties, industrial leaders and the federal states into a common constitutional settlement. The compromise restores confidence and lets the army return to public service without ruling the state."
 GE1_RP_russian_neutrality:0 "Potsdam Neutrality Understanding"
 GE1_RP_russian_neutrality_desc:0 "Berlin and Petrograd renew a cautious neutrality through commercial and diplomatic channels. The understanding lowers the cost of trade and leaves both empires room to pursue their own interests without an automatic alliance."
 RUS_ww1_zemgor:0 "The Zemgor Service Network"
 RUS_ww1_zemgor_desc:0 "Municipal and zemstvo organisations coordinate medical supplies, military contracts and public services."
 RUS_ww1_refugee_services:0 "Civilian Evacuation Services"
 RUS_ww1_refugee_services_desc:0 "Registration offices and transport arrangements support families displaced by the fighting."
 RUS_ww1_front_coordination:0 "Coordinated Front Headquarters"
 RUS_ww1_front_coordination_desc:0 "Front staffs compare intelligence and reserve schedules before preparing their operations."
 RUS_ww1_neutral_diplomacy:0 "Armed Neutrality"
 RUS_ww1_neutral_diplomacy_desc:0 "Russia maintains a national defence programme and a diplomatic position outside the competing alliances."
 RUS_ww1_diplomatic_corps:0 "A Professional Diplomatic Service"
 RUS_ww1_diplomatic_corps_desc:0 "Permanent missions and an agreed negotiating mandate strengthen the work of our representatives."
 RUS_ww1_allied_purchasing:0 "Allied Purchasing Missions"
 RUS_ww1_allied_purchasing_desc:0 "Supervised orders bring industrial machinery through the ports used by our allies."
 RUS_ww1_balkan_liaison:0 "Balkan Liaison Missions"
 RUS_ww1_balkan_liaison_desc:0 "Diplomatic and military representatives maintain common plans with our partners in the Balkans."
 RUS_ww1_caucasus_administration:0 "Caucasian Service Agreements"
 RUS_ww1_caucasus_administration_desc:0 "Provincial offices coordinate transport and public services across the Caucasus."
 RUS_ww1_far_eastern_commerce:0 "Far Eastern Commercial Agreements"
 RUS_ww1_far_eastern_commerce_desc:0 "Port and purchasing agreements support civilian investment and maritime commerce."
 RUS_ww1_reconstruction:0 "The Reconstruction Programme"
 RUS_ww1_reconstruction_desc:0 "Civilian projects absorb returning workers and rebuild transport after the fighting."
 RUS_ww1_soldier_committees:0 "Soldiers' Committees"
 RUS_ww1_soldier_committees_desc:0 "Elected representatives give soldiers a political voice, while parallel authority complicates the army's chain of command."
 RUS_idea_imperial_supply_bureau:0 "Imperial Supply Bureau"
 RUS_idea_imperial_supply_bureau_desc:0 "Russia's supply administration must move men, equipment and requisitions across a continent. Common returns and coordinated depot work give the army a more dependable flow of supplies."
 RUS_idea_ural_steel_trust:0 "Ural Steel Trust"
 RUS_idea_ural_steel_trust_desc:0 "Ural furnaces burn through the night under state contracts. The output is dependable, but the concentration leaves distant workshops waiting for orders."
 RUS_idea_railway_corps:0 "Railway Corps"
 RUS_idea_railway_corps_desc:0 "Railway troops treat the timetable as a weapon. Their bridges and locomotives shorten the front, at the price of drawing skilled hands away from the factories."
 RUS_idea_officer_academies:0 "Reopened Officer Academies"
 RUS_idea_officer_academies_desc:0 "The academies turn field reports into lessons for the next class. The new professionalism raises standards before it raises confidence."
 RUS_idea_gas_defence:0 "Gas Defence Service"
 RUS_idea_gas_defence_desc:0 "Chemists and nurses build a defence against the new poison clouds. Masks save lives, yet the drills burden already exhausted formations."
 RUS_idea_artillery_school:0 "Imperial Artillery School"
 RUS_idea_artillery_school_desc:0 "Gunners learn to read the ground before the first shell leaves the barrel. The school improves fire discipline and consumes scarce optical equipment."
 RUS_idea_cossack_screen:0 "Cossack Screening Service"
 RUS_idea_cossack_screen_desc:0 "Mounted patrols screen the army's flanks across the open country. They bring reach and warning, while demanding horses that industry cannot replace quickly."
 RUS_idea_air_observation:0 "Air Observation Service"
 RUS_idea_air_observation_desc:0 "Observers map roads, batteries, and railheads from fragile machines above the front. Their reports reward patient commanders and expose inexperienced crews."
 RUS_idea_fighter_school:0 "Fighter Pilot School"
 RUS_idea_fighter_school_desc:0 "A generation of pilots learns to fight as a formation rather than as solitary daredevils. Fuel and instructors remain the price of every lesson."
 RUS_idea_bomber_command:0 "Bomber Command"
 RUS_idea_bomber_command_desc:0 "Long range crews train to find the rail junctions that feed the front. The doctrine promises reach, though each bomber diverts engines from fighters."
 RUS_idea_baltic_fleet:0 "Baltic Fleet Reform"
 RUS_idea_baltic_fleet_desc:0 "The Baltic squadrons rebuild their signals and routines after years of uncertainty. Their officers gain a common language before they gain a modern fleet."
 RUS_idea_black_sea_shipyards:0 "Black Sea Shipyards"
 RUS_idea_black_sea_shipyards_desc:0 "Black Sea yards work around old plans and limited cranes. Local construction keeps the fleet alive, although every refit takes longer than the admirals want."
 RUS_idea_submarine_bureau:0 "Submarine Bureau"
 RUS_idea_submarine_bureau_desc:0 "Designers study the Baltic's minefields and the Black Sea's long horizons. Small boats offer reach without a battleship bill, but demand crews willing to take the darker watch."
 RUS_idea_coastal_defence:0 "Coastal Defence Command"
 RUS_idea_coastal_defence_desc:0 "Guns, mines, and observation posts turn the principal harbours into layered positions. The forts protect the fleet while tying engineers to the shoreline."
 RUS_ww1_kornilov_emergency_rule:0 "Kornilov's Emergency Administration"
 RUS_ww1_kornilov_emergency_rule_desc:0 "Military discipline and rapid mobilisation define the executive programme. The army gains offensive strength, but a restricted political life makes civilian government harder to sustain."
 RUS_ww1_kolchak_executive:0 "Kolchak's National Executive"
 RUS_ww1_kolchak_executive_desc:0 "Ports, transport services and naval administration receive priority. Efficient supply and fleet organisation come at a cost to the resources available for civilian consumption."
 GE1_R_agrarian_compact:0 "Agrarian Compact"
 GE1_R_agrarian_compact_desc:0 "Protected agricultural interests support the crown and provide army recruits, while tariff concessions increase the civilian burden."
 GE1_R_professional_administration:0 "Professional State Secretaries"
 GE1_R_professional_administration_desc:0 "Experienced state secretaries coordinate civilian procurement and keep the federal administration working."
 GE1_R_labour_recognition:0 "Recognised Collective Bargaining"
 GE1_R_labour_recognition_desc:0 "Unions and employers bargain within recognised institutions. Recruitment is more cautious, while skilled industrial workers remain at their posts."
 GE1_R_constitutional_monarchy:0 "Constitutional Monarchy"
 GE1_R_constitutional_monarchy_desc:0 "The monarchy shares executive responsibility with an elected parliamentary majority. Constitutional cooperation improves political administration while restraining militarist agitation."
 GE1_R_dependants_relief:0 "Soldiers Dependants Relief"
 GE1_R_dependants_relief_desc:0 "Support for service families moderates wartime discontent, at a continuing civilian cost."
 GE1_R_women_war_workers:0 "Women in the War Workshops"
 GE1_R_women_war_workers_desc:0 "Industrial employers recruit women into wartime workshops, expanding output without permanently lowering the standards of army training."
 GE1_R_patriotic_instruction:0 "Patriotic Instruction"
 GE1_R_patriotic_instruction_desc:0 "The army explains the official war aims to troops and workers. Its instruction sustains war support but adds a political burden to exhausted institutions."
 GE1_R_victory_mandate:0 "The Victory Mandate"
 GE1_R_victory_mandate_desc:0 "The military leadership ties its authority to obtaining victory. Offensive preparations receive priority while civilian construction slows."
 GE1_R_reinsurance_spirit:0 "Continental Reinsurance"
 GE1_R_reinsurance_spirit_desc:0 "A negotiated Russian understanding gives the Foreign Office room to pursue security through restraint."
 GE1_R_colonial_supply:0 "Colonial Supply Depots"
 GE1_R_colonial_supply_desc:0 "Supply depots and local purchasing sustain expeditionary formations with fewer demands on the home network."
 GE1_R_prize_rules:0 "Prize Rules Observed"
 GE1_R_prize_rules_desc:0 "Warning and search procedures limit the submarine campaign while giving diplomacy more room to preserve neutral relations."
 GE1_R_responsible_ministry:0 "A Responsible Ministry"
 GE1_R_responsible_ministry_desc:0 "Cabinet appointments depend on an elected majority. The civilian government gains administrative authority while military agitation loses influence."
 GE1_R_social_insurance_idea:0 "Imperial Social Insurance"
 GE1_R_social_insurance_idea_desc:0 "Insurance funds support industrial households while adding a continuing civilian expense."
 GE1_R_provincial_compromise:0 "Provincial Compromise"
 GE1_R_provincial_compromise_desc:0 "Provincial institutions retain cultural responsibilities within a common state. Cooperation eases occupation administration, at the price of less direct political control."
 GE1_R_skilled_returnees_idea:0 "Skilled Workers Recalled"
 GE1_R_skilled_returnees_idea_desc:0 "Selected skilled workers return from military service to industrial employment. Production improves, while army recruitment has fewer reserves."
 GE1_R_civilian_modernisation_idea:0 "Imperial Civilian Modernisation"
 GE1_R_civilian_modernisation_idea_desc:0 "A civilian industrial office coordinates standards and credit for a measured expansion of German productive capacity."
 GE1_R_export_capital_idea:0 "Export Capital at Home"
 GE1_R_export_capital_idea_desc:0 "Export houses redirect foreign credit networks toward domestic machinery and electrical production."
 GE1_R_university_research_idea:0 "University Research Network"
 GE1_R_university_research_idea_desc:0 "Universities and industrial laboratories share research priorities while retaining civilian scientific institutions."
 GE1_R_railway_directorate_idea:0 "Railway Directorate"
 GE1_R_railway_directorate_idea_desc:0 "Railway standards and repair schedules give coal, military stores and civilian freight a common priority."
 GE1_R_labour_bureaux_idea:0 "Labour Bureaux"
 GE1_R_labour_bureaux_idea_desc:0 "Labour offices direct exemptions, volunteers and retraining toward plants whose skilled trades are scarce."
 GE1_R_war_finance_idea:0 "Disciplined War Finance"
 GE1_R_war_finance_idea_desc:0 "Bond issues and industrial credit sustain contracts while recording the obligations that peace will inherit."
 GE1_R_training_corps_idea:0 "Industrial Training Corps"
 GE1_R_training_corps_idea_desc:0 "Plant schools train fitters and inspectors so output can rise without exhausting the skilled labour reserve."
 GE1_R_worker_welfare_idea:0 "Worker Rights in Wartime"
 GE1_R_worker_welfare_idea_desc:0 "Wage arbitration and safer shifts protect the skilled workforce while placing a small administrative cost on production."
 GE1_R_reconstruction_credit_idea:0 "Reconstruction Credit"
 GE1_R_reconstruction_credit_idea_desc:0 "Civilian orders and railway repairs are prepared before wartime contracts end, reducing the shock of conversion."
 GE1_R_army_reform_spirit:0 "Army Reform Committee"
 GE1_R_army_reform_spirit_desc:0 "A practical reform programme improves planning while the army absorbs the cost of reorganising old formations."
 GE1_R_trench_engineer_spirit:0 "Trench Engineering Board"
 GE1_R_trench_engineer_spirit_desc:0 "Permanent field works become stronger at the cost of tying more labour to static defence."
 GE1_R_air_service_spirit:0 "Air Service Inspectorate"
 GE1_R_air_service_spirit_desc:0 "A unified inspectorate improves sortie planning while its central procedures slow improvisation."
 GE1_R_naval_coordination_spirit:0 "Fleet Coordination Office"
 GE1_R_naval_coordination_spirit_desc:0 "Surface and submarine staffs share intelligence, but coordination consumes scarce naval administration."
 GE1_R_merchant_routes:0 "Merchant Routing Office"
 GE1_R_merchant_routes_desc:0 "Routing and repair priorities protect shipping while reducing the fleet's freedom to concentrate for battle."
 GE1_RP_credit_review_drive:0 "Emergency Contract Reviews"
 GE1_RP_credit_review_drive_desc:0 "Parliamentary reviews identify waste in emergency procurement and improve the coordination of war production."
 GE1_RP_coastal_raid_preparations:0 "Coastal Raid Preparations"
 GE1_RP_coastal_raid_preparations_desc:0 "Specialist crews prepare a limited coastal operation while the naval staff keeps its wider campaign responsibilities."
 GE1_RP_assault_supply_columns:0 "Assault Supply Columns"
 GE1_RP_assault_supply_columns_desc:0 "Additional supply columns sustain the formations assigned to the next offensive."
 GE1_RP_civilian_supply_drive:0 "Civilian Supply Coordination"
 GE1_RP_civilian_supply_drive_desc:0 "Civil administrators coordinate workshop orders and deliveries for a limited wartime programme."
 GE1_RP_patriotic_rallies:0 "Patriotic Mobilisation Rallies"
 GE1_RP_patriotic_rallies_desc:0 "The Fatherland Party campaigns for continued mobilisation around its programme of a victorious peace."
 AUH_ww1_german_commercial_pressure:0 "German Commercial Pressure"
 AUH_ww1_german_commercial_pressure_desc:0 "German credit and trade missions are pressing Vienna to accept a closer economic relationship."
 AUH_ww1_german_local_pressure:0 "Crownland National Pressure"
 AUH_ww1_german_local_pressure_desc:0 "Czech, Hungarian and local representatives are demanding a durable constitutional settlement."
 AUH_ww1_german_ultimatum_pressure:0 "The Vienna Ultimatum"
 AUH_ww1_german_ultimatum_pressure_desc:0 "An ultimatum has unsettled the monarchy while its government weighs negotiation against war."
 GE1_R_timed_A_general_staff:0 "Staff Manoeuvres"
 GE1_R_timed_A_general_staff_desc:0 "Staff Manoeuvres coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_staff_reforms:0 "Staff Training Courses"
 GE1_R_timed_staff_reforms_desc:0 "Staff Training Courses coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_railway_mobilisation:0 "Railway Mobilisation Priority"
 GE1_R_timed_A_railway_mobilisation_desc:0 "Railway Mobilisation Priority coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_A_combined_arms:0 "Combined-Arms Exercises"
 GE1_R_timed_A_combined_arms_desc:0 "Combined-Arms Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_fire_and_movement:0 "Fire and Movement Drills"
 GE1_R_timed_A_fire_and_movement_desc:0 "Fire and Movement Drills coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_A_elastic_defence:0 "Elastic Defence Exercises"
 GE1_R_timed_A_elastic_defence_desc:0 "Elastic Defence Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_depth_defence:0 "Defence in Depth Preparations"
 GE1_R_timed_A_depth_defence_desc:0 "Defence in Depth Preparations coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_tactics_1:0 "Officer Tactical Courses"
 GE1_R_timed_tactics_1_desc:0 "Officer Tactical Courses coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_infiltration_groups:0 "Infiltration Group Training"
 GE1_R_timed_A_infiltration_groups_desc:0 "Infiltration Group Training coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_tactics_2:0 "Small-Unit Training Rotation"
 GE1_R_timed_tactics_2_desc:0 "Small-Unit Training Rotation coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_tactics_3:0 "Assault Formation Exercises"
 GE1_R_timed_tactics_3_desc:0 "Assault Formation Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_tactics_4:0 "Operational Staff Rehearsals"
 GE1_R_timed_tactics_4_desc:0 "Operational Staff Rehearsals coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_assault_reserves:0 "Assault Reserve Concentration"
 GE1_R_timed_A_assault_reserves_desc:0 "Assault Reserve Concentration coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_A_eastern_command:0 "Eastern Staff Coordination"
 GE1_R_timed_A_eastern_command_desc:0 "Eastern Staff Coordination coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_war_front:0 "Eastern Command Exercises"
 GE1_R_timed_war_front_desc:0 "Eastern Command Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_A_railway_redeployment:0 "Priority Rail Redeployment"
 GE1_R_timed_A_railway_redeployment_desc:0 "Priority Rail Redeployment coordinates specialist training and operational preparation for a limited campaign. Its effects last 90 days and end with the Great War settlement."
 GE1_R_timed_war_front_2:0 "Redeployment Supply Columns"
 GE1_R_timed_war_front_2_desc:0 "Redeployment Supply Columns coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_eastern_redeployment:0 "Veterans Transferred West"
 GE1_R_timed_eastern_redeployment_desc:0 "Veterans Transferred West coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_war_front_3:0 "Western Reserve Staff Work"
 GE1_R_timed_war_front_3_desc:0 "Western Reserve Staff Work coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_kaiserschlacht:0 "Kaiserschlacht Preparations"
 GE1_R_timed_kaiserschlacht_desc:0 "Kaiserschlacht Preparations coordinates specialist training and operational preparation for a limited campaign. Its effects last 90 days and end with the Great War settlement."
 GE1_R_timed_fliegertruppen:0 "Air Service Training Cycle"
 GE1_R_timed_fliegertruppen_desc:0 "Air Service Training Cycle coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_reconnaissance_wings:0 "Reconnaissance Crew Exercises"
 GE1_R_timed_reconnaissance_wings_desc:0 "Reconnaissance Crew Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_aviation_effort_1:0 "Aviation Staff Courses"
 GE1_R_timed_aviation_effort_1_desc:0 "Aviation Staff Courses coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_pilot_training_1:0 "Pilot Training Rotation"
 GE1_R_timed_pilot_training_1_desc:0 "Pilot Training Rotation coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_aviation_effort_2:0 "Air-Ground Coordination Exercises"
 GE1_R_timed_aviation_effort_2_desc:0 "Air-Ground Coordination Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_pilot_training_2:0 "Advanced Pilot Courses"
 GE1_R_timed_pilot_training_2_desc:0 "Advanced Pilot Courses coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_fighter_focus:0 "Fighter Formation Exercises"
 GE1_R_timed_fighter_focus_desc:0 "Fighter Formation Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_bomber_focus:0 "Bomber Formation Exercises"
 GE1_R_timed_bomber_focus_desc:0 "Bomber Formation Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_R_air_command:0 "Air Command Staff Rotation"
 GE1_R_timed_R_air_command_desc:0 "Air Command Staff Rotation coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_naval_staff:0 "Admiralty Staff Exercises"
 GE1_R_timed_N_naval_staff_desc:0 "Admiralty Staff Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_cruiser_warfare:0 "Cruiser Squadron Exercises"
 GE1_R_timed_cruiser_warfare_desc:0 "Cruiser Squadron Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 120 days and end with the Great War settlement."
 GE1_R_timed_N_jutland_lessons:0 "Fleet Damage-Control Exercises"
 GE1_R_timed_N_jutland_lessons_desc:0 "Fleet Damage-Control Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_surface_risk_theory:0 "Battle-Fleet Concentration"
 GE1_R_timed_N_surface_risk_theory_desc:0 "Battle-Fleet Concentration coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_coastal_defence:0 "Coastal Defence Exercises"
 GE1_R_timed_N_coastal_defence_desc:0 "Coastal Defence Exercises coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_merchant_protection:0 "Merchant Convoy Coordination"
 GE1_R_timed_N_merchant_protection_desc:0 "Merchant Convoy Coordination coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_naval_morale:0 "Fleet Training Rotation"
 GE1_R_timed_N_naval_morale_desc:0 "Fleet Training Rotation coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_timed_N_commerce_focus:0 "Commerce-Raiding Patrol Programme"
 GE1_R_timed_N_commerce_focus_desc:0 "Commerce-Raiding Patrol Programme coordinates specialist training and operational preparation for a limited campaign. Its effects last 180 days and end with the Great War settlement."
 GE1_R_AUH_trade_preparations:0 "Danubian Trade Commission"
 GE1_R_AUH_trade_preparations_desc:0 "A temporary trade commission coordinates purchasing and technical exchanges across the Danube."
 GE1_R_AUH_credit_commitment:0 "Conditional Danubian Credit"
 GE1_R_AUH_credit_commitment_desc:0 "Credit guarantees support a stronger negotiating position while imposing a continuing civilian cost."
 EN1_R_parliamentary_scrutiny:0 "Parliamentary Scrutiny"
 EN1_R_parliamentary_scrutiny_desc:0 "The Commons scrutinises contracts and executive orders. Its committees improve administration, but ministers must make their case before acting."
 EN1_R_cabinet_continuity:0 "Cabinet Continuity"
 EN1_R_cabinet_continuity_desc:0 "Asquith retains authority over a cabinet of experienced ministers, preserving parliamentary procedure while delegating wartime administration."
 EN1_R_small_war_cabinet:0 "The War Cabinet"
 EN1_R_small_war_cabinet_desc:0 "A smaller executive meets continuously, separating the conduct of the war from ordinary departmental business."
 EN1_R_unionist_compact:0 "The Unionist Compact"
 EN1_R_unionist_compact_desc:0 "Liberal and Unionist ministers share office under a negotiated programme of national service and parliamentary accountability."
 EN1_R_labour_compact:0 "Labour Representation"
 EN1_R_labour_compact_desc:0 "Trade-union representatives take part in industrial arbitration and recruitment planning. Recognition comes with an obligation to keep essential services running."
 EN1_R_civil_liberties:0 "Civil Liberties in Wartime"
 EN1_R_civil_liberties_desc:0 "Courts and parliamentary committees review emergency powers. The government sacrifices some administrative speed to preserve consent."
 EN1_R_realm_administration:0 "Emergency Administration"
 EN1_R_realm_administration_desc:0 "The Defence of the Realm framework places transport and communications under temporary ministerial direction."
 EN1_R_irish_compact:0 "An Irish Settlement"
 EN1_R_irish_compact_desc:0 "A negotiated programme of local government and minority safeguards gives the Irish parliamentary delegation a stake in constitutional politics."
 EN1_R_recruiting_board:0 "Parliamentary Recruiting Campaign"
 EN1_R_recruiting_board_desc:0 "Recruiting committees coordinate publicity, medical examination and local volunteer depots."
 EN1_R_service_administration:0 "National Service Administration"
 EN1_R_service_administration_desc:0 "Exemption tribunals reserve skilled workers and distribute the burden of conscription."
 EN1_R_treaty_liaison:0 "Allied Liaison Offices"
 EN1_R_treaty_liaison_desc:0 "Diplomats and military representatives settle differences before competing national plans reach the battlefield."
 EN1_R_neutral_shipping:0 "Neutral Shipping Agreements"
 EN1_R_neutral_shipping_desc:0 "Commercial assurances and inspection procedures reduce the cost of maintaining overseas trade without committing the country to a continental war."
 EN1_R_berlin_liaison:0 "Anglo-German Staff Liaison"
 EN1_R_berlin_liaison_desc:0 "British naval officers and German army planners exchange schedules through a joint secretariat. Cooperation remains bounded by the naval convention and Belgian neutrality."
 EN1_R_mediterranean_staff:0 "Mediterranean Planning Staff"
 EN1_R_mediterranean_staff_desc:0 "Naval escorts and expeditionary supply plans are coordinated before men are sent ashore."
 EN1_R_arab_liaison:0 "Arab Liaison Mission"
 EN1_R_arab_liaison_desc:0 "Local liaison officers support the revolt with intelligence and modest deliveries rather than counting allied volunteers as British conscripts."
 EN1_R_peace_commission:0 "The Peace Commission"
 EN1_R_peace_commission_desc:0 "The Treasury, Foreign Office and military departments assemble a common negotiating position and begin closing emergency programmes."
 EN1_I_railway_priority:0 "Railway Priority"
 EN1_I_railway_priority_desc:0 "A common freight timetable coordinates coal, food, military stores and civilian traffic."
 EN1_I_finance_committee:0 "Treasury Finance Committee"
 EN1_I_finance_committee_desc:0 "War loans and procurement contracts are recorded together so emergency finance remains accountable."
 EN1_I_munitions_board:0 "Munitions Board"
 EN1_I_munitions_board_desc:0 "A central board turns Britain's coal and steel commitments into predictable shell deliveries."
 EN1_I_prewar_social_insurance:0 "Prewar Social Insurance"
 EN1_I_prewar_social_insurance_desc:0 "The 1911 settlement remains in force and carries a modest administrative cost during mobilisation."
 EN1_I_demobilisation_relief:0 "Demobilisation Relief"
 EN1_I_demobilisation_relief_desc:0 "Returning labour and converted workshops ease the transition from wartime procurement to civilian orders."
 EN1_E_direct_rule:0 "Direct Imperial Administration"
 EN1_E_direct_rule_desc:0 "The Colonial Office coordinates governors, requisitions and administrative standards."
 EN1_E_imperial_preference:0 "Imperial Preference"
 EN1_E_imperial_preference_desc:0 "Reciprocal contracts and preferential trade bind imperial producers to British procurement."
 EN1_E_federation:0 "Imperial Federation Debate"
 EN1_E_federation_desc:0 "A proposed federation links constitutional representation to shared defence responsibilities."
 EN1_E_materials:0 "Imperial Materials Contracts"
 EN1_E_materials_desc:0 "Food, fibres and metals arrive through negotiated colonial and dominion supply contracts."
 EN1_E_defence_council:0 "Imperial Defence Council"
 EN1_E_defence_council_desc:0 "Dominion forces, naval stations and colonial logistics share a practical defence plan."
 EN1_E_alliance_respect:0 "Respectful Imperial Alliance"
 EN1_E_alliance_respect_desc:0 "Partner governments retain their mandates while Britain gains durable cooperation and trust."
 EN1_idea_trench_engineers:0 "Trench Engineers"
 EN1_idea_trench_engineers_desc:0 "Professional field engineering prepares the BEF for entrenchment and firepower. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_staff_exercises:0 "Staff Exercises"
 EN1_idea_staff_exercises_desc:0 "Restore operational skill through staff rides and manoeuvres. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_gas_defence:0 "Anti-Gas Discipline"
 EN1_idea_gas_defence_desc:0 "Create a respirator and chemical-warning service. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_open_order:0 "Open Order Training"
 EN1_idea_open_order_desc:0 "Disperse under machine-gun fire while retaining control. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_battle_schools:0 "Battalion Battle Schools"
 EN1_idea_battle_schools_desc:0 "Make lessons from Neuve Chapelle and Loos routine. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_all_arms_planning:0 "All-Arms Planning"
 EN1_idea_all_arms_planning_desc:0 "Link infantry, artillery, engineers, and signals in deliberate operations. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_bef_command:0 "BEF Command"
 EN1_idea_bef_command_desc:0 "Build a durable BEF command and staff system. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_haldane_staff:0 "Haldane Staff System"
 EN1_idea_haldane_staff_desc:0 "Preserve the General Staff, expeditionary planning, and regular standards. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_territorial_training:0 "Territorial Training"
 EN1_idea_territorial_training_desc:0 "Make the Territorial Army a credible second line through annual training. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_kitchener_volunteers:0 "Kitchener Volunteers"
 EN1_idea_kitchener_volunteers_desc:0 "Answer the 1914 emergency with voluntary recruitment and New Armies. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_shell_committee:0 "Ministry of Munitions"
 EN1_idea_shell_committee_desc:0 "Put shells, labour, and industrial contracts under wartime direction. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_creeping_barrage:0 "Creeping Barrage"
 EN1_idea_creeping_barrage_desc:0 "Develop timed artillery lifts behind which infantry can advance. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_combined_arms:0 "Combined-Arms Battle"
 EN1_idea_combined_arms_desc:0 "Unite artillery, infantry, tanks, aircraft, and engineers. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_tank_corps:0 "Tank Corps"
 EN1_idea_tank_corps_desc:0 "Give the new armoured arm dedicated training and maintenance. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_western_logistics:0 "Western Front Logistics"
 EN1_idea_western_logistics_desc:0 "Improve railheads, motor transport, and depot organisation. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_mesopotamia:0 "Mesopotamian Expedition"
 EN1_idea_mesopotamia_desc:0 "Treat Iraq as a separate theatre with river transport and command. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_gallipoli_lessons:0 "Gallipoli Lessons"
 EN1_idea_gallipoli_lessons_desc:0 "Turn the failed Dardanelles expedition into an amphibious planning school. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_egypt_expedition:0 "Egypt Expeditionary Force"
 EN1_idea_egypt_expedition_desc:0 "Build a mobile imperial army around Egypt and the Suez base. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_indian_expedition:0 "Indian Expeditionary Force"
 EN1_idea_indian_expedition_desc:0 "Coordinate Indian Army formations across the imperial theatres. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_admiralty_reform:0 "Admiralty Reform"
 EN1_idea_admiralty_reform_desc:0 "Clarify civilian and naval responsibilities during a global war. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_naval_budget:0 "Dreadnought Budget"
 EN1_idea_naval_budget_desc:0 "Protect naval appropriations through the naval race. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_grand_fleet:0 "Grand Fleet"
 EN1_idea_grand_fleet_desc:0 "Concentrate the battle fleet at Scapa Flow. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_limited_naval_agreement:0 "Limited Naval Agreement"
 EN1_idea_limited_naval_agreement_desc:0 "Pursue a negotiated limit if British security is preserved. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_north_sea_patrols:0 "North Sea Patrols"
 EN1_idea_north_sea_patrols_desc:0 "Close the approaches with destroyers, cruisers, and observation. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_mine_warfare:0 "Mine Warfare"
 EN1_idea_mine_warfare_desc:0 "Lay defensive minefields and clear enemy mines. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_anti_submarine:0 "Anti-Submarine Defence"
 EN1_idea_anti_submarine_desc:0 "Coordinate hydrophones, patrol craft, and intelligence. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_convoy_system:0 "Convoy System"
 EN1_idea_convoy_system_desc:0 "Adopt escorted convoys against unrestricted submarine warfare. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_hunter_killers:0 "Hunter-Killer Groups"
 EN1_idea_hunter_killers_desc:0 "Combine destroyers, trawlers, and intelligence. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_merchant_shipping:0 "Merchant Shipping Board"
 EN1_idea_merchant_shipping_desc:0 "Coordinate requisition, repair, and loading of merchantmen. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_armed_trawlers:0 "Armed Trawlers"
 EN1_idea_armed_trawlers_desc:0 "Use civilian fishing craft for minesweeping and harbour defence. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_naval_aviation:0 "Naval Air Service"
 EN1_idea_naval_aviation_desc:0 "Put seaplanes and coastal reconnaissance under Admiralty direction. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_royal_marines:0 "Royal Marines"
 EN1_idea_royal_marines_desc:0 "Expand Marines for raids, ship security, and landings. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_dardanelles:0 "Dardanelles Support"
 EN1_idea_dardanelles_desc:0 "Commit naval fire support and mine-clearing to Gallipoli. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_aegean:0 "Aegean Landing Force"
 EN1_idea_aegean_desc:0 "Retain an eastern Mediterranean landing capability. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_suez_support:0 "Suez Naval Support"
 EN1_idea_suez_support_desc:0 "Use the fleet to sustain Egypt and the Suez route. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_bomber_coordination:0 "Bomber Coordination"
 EN1_idea_bomber_coordination_desc:0 "Explore bombing and tactical support. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_long_range_bombing:0 "Long-Range Bombing"
 EN1_idea_long_range_bombing_desc:0 "Study range, payload, and navigation beyond the front. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_aerial_reconnaissance:0 "Aerial Reconnaissance"
 EN1_idea_aerial_reconnaissance_desc:0 "Expand observation flights for artillery direction. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_pilot_training:0 "Pilot Training Schools"
 EN1_idea_pilot_training_desc:0 "Create a steady pipeline of trained pilots. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_fighter_defence:0 "Fighter Defence"
 EN1_idea_fighter_defence_desc:0 "Choose fighter defence and air superiority. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_rfc:0 "Royal Flying Corps"
 EN1_idea_rfc_desc:0 "Expand army aviation for observation and spotting. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_idea_raf_merger:0 "Royal Air Force"
 EN1_idea_raf_merger_desc:0 "Merge RFC and RNAS into an independent 1918 air service. This programme supports the forces for a limited period while its training and staff work are carried out."
 EN1_I_import_control_spirit:0 "Import Control Office"
 EN1_I_import_control_spirit_desc:0 "Shipping space is allocated to food and strategic materials by a central office."
 EN1_E_economic_cooperation_spirit:0 "Imperial Economic Cooperation"
 EN1_E_economic_cooperation_spirit_desc:0 "Credit, trade and technical exchange are coordinated through reciprocal agreements."
 EN1_I_skilled_labour_spirit:0 "Skilled Labour Reserve"
 EN1_I_skilled_labour_spirit_desc:0 "Training and exemptions preserve the trades that keep mines, railways and yards operating."
 EN1_I_controlled_mobilisation_spirit:0 "Controlled Mobilisation"
 EN1_I_controlled_mobilisation_spirit_desc:0 "British contracts and labour assignments are coordinated around the output the front can actually consume."
 EN1_I_war_loans_spirit:0 "War Loan Market"
 EN1_I_war_loans_spirit_desc:0 "Private savings finance contracts while the Treasury records their obligations."
 EN1_I_us_credit_spirit:0 "American Credit"
 EN1_I_us_credit_spirit_desc:0 "American credit cushions British imports and procurement after the United States enters the economic war."
 EN1_I_coal_board_spirit:0 "Coal Board"
 EN1_I_coal_board_spirit_desc:0 "Mine, rail and power schedules keep coal moving toward the plants that need it."
 EN1_I_merchant_shipping_spirit:0 "Merchant Shipping Priority"
 EN1_I_merchant_shipping_spirit_desc:0 "Merchant hulls and repairs receive a wartime priority alongside naval construction."
 EN1_I_export_board_spirit:0 "Export Board"
 EN1_I_export_board_spirit_desc:0 "Foreign orders and exchange earnings are redirected toward imports and machine tools."
 EN1_I_import_dependence_spirit:0 "Import Dependence"
 EN1_I_import_dependence_spirit_desc:0 "British industry plans around the cost and vulnerability of food and strategic imports."
 EN1_E_self_government_spirit:0 "Imperial Self-Government"
 EN1_E_self_government_spirit_desc:0 "Constitutional partnership gives self-governing members a voice in imperial commitments."
 EN1_I_aircraft_workshops_spirit:0 "Aircraft Workshops"
 EN1_I_aircraft_workshops_spirit_desc:0 "Standardised workshops expand practical airframe and engine output through existing industry."
 EN1_I_timed_works_spirit:0 "Timed Works Programme"
 EN1_I_timed_works_spirit_desc:0 "A short public works programme repairs plant utilities and transport bottlenecks."
 EN1_I_shipbuilding_board_spirit:0 "Shipbuilding Board"
 EN1_I_shipbuilding_board_spirit_desc:0 "Yards and Admiralty orders share standards, repair capacity and scarce skilled labour."
 FR3_R_parliamentary_committees_spirit:0 "The Parliamentary Committees"
 FR3_R_parliamentary_committees_spirit_desc:0 "Parliamentary commissions review contracts, transport and mobilisation notices. Oversight gives the ministries a common record without suspending civilian government."
 FR3_R_labour_arbitration_spirit:0 "Industrial Arbitration"
 FR3_R_labour_arbitration_spirit_desc:0 "Trade-union delegates and employers negotiate conditions in essential industries. Recognition carries responsibility for maintaining the supply of the armies."
 FR3_R_civil_rights_spirit:0 "Republican Legal Safeguards"
 FR3_R_civil_rights_spirit_desc:0 "Courts and parliamentary commissions review extraordinary powers. Political criticism remains distinct from disclosure of military information."
 FR3_R_national_defence_spirit:0 "National Defence Administration"
 FR3_R_national_defence_spirit_desc:0 "Departments share schedules for transport, depots and civil defence. Clear orders reduce administrative friction without granting an unlimited reserve of recruits."
 FR3_R_presidential_mandate_spirit:0 "A Presidential Mandate"
 FR3_R_presidential_mandate_spirit_desc:0 "An exceptional constitutional mandate strengthens the executive while leaving civilian institutions in place. Central direction trades some parliamentary flexibility for a more reliable chain of orders."
 FR3_R_cabinet_continuity_spirit:0 "Cabinet Continuity"
 FR3_R_cabinet_continuity_spirit_desc:0 "Briand coordinates military, financial and diplomatic responsibilities through a broader cabinet. Allied consultation remains a political responsibility rather than a task delegated entirely to generals."
 FR3_R_clemenceau_spirit:0 "Clemenceau's War Government"
 FR3_R_clemenceau_spirit_desc:0 "The government concentrates on supply, command and the prosecution of the war. Its authority rests on Parliament, but ministers are expected to make and carry out decisions promptly."
 FR3_R_soldier_welfare_spirit:0 "Soldier Welfare Services"
 FR3_R_soldier_welfare_spirit_desc:0 "Leave rotas, billets and dependable supplies reduce exhaustion in the fighting formations. Rest is organised as part of operational planning rather than as an alternative to defending the front."
 FR3_R_refugee_services_spirit:0 "Refugee and Evacuation Services"
 FR3_R_refugee_services_spirit_desc:0 "Local authorities organise accommodation and transport for civilians driven from the occupied departments. Reusable records prevent the ministries from competing for the same trains and buildings."
 FR3_R_allied_liaison_spirit:0 "Inter-Allied Liaison"
 FR3_R_allied_liaison_spirit_desc:0 "Military missions compare operational calendars and supply requests with willing partners. Coordination improves preparations without turning foreign recruits into French manpower."
 FR3_R_channel_liaison_spirit:0 "Channel Transport Liaison"
 FR3_R_channel_liaison_spirit_desc:0 "French port authorities and British shipping representatives coordinate embarkation, repair and unloading. The arrangement supports an actual ally and ceases when the political relationship changes."
 FR3_R_russian_liaison_spirit:0 "Franco-Russian Staff Liaison"
 FR3_R_russian_liaison_spirit_desc:0 "Officers exchange railway and mobilisation schedules with an aligned Russian government. Neutrality and separate agreements remain binding choices rather than administrative inconveniences."
 FR3_R_continental_staff_spirit:0 "The Continental Staff Secretariat"
 FR3_R_continental_staff_spirit_desc:0 "France coordinates a willing continental coalition in response to the actual Anglo-German alliance. Its operational arrangements require separate agreement from each participating government."
 FR3_R_commercial_dialogue_spirit:0 "Commercial Diplomatic Channels"
 FR3_R_commercial_dialogue_spirit_desc:0 "Commercial missions keep communication open with governments outside our coalition. Economic talks do not by themselves decide a country's alignment or transfer its territory."
 FR3_R_armed_neutrality_spirit:0 "Armed Neutrality"
 FR3_R_armed_neutrality_spirit_desc:0 "France maintains border preparations and commercial inspection while standing outside a continental war. The policy must be supported by a real withdrawal from military commitments."
 FR3_R_balkan_mission_spirit:0 "The Balkan Liaison Mission"
 FR3_R_balkan_mission_spirit_desc:0 "Advisers and supply representatives coordinate with governments sharing our war. Local operations remain subject to the decisions and capabilities of the allied armies."
 FR3_R_reconstruction_spirit:0 "The Reconstruction Commission"
 FR3_R_reconstruction_spirit_desc:0 "The ministries identify damaged districts, returning workers and temporary war plants. Reconstruction proceeds through the state map and the existing demobilisation ledger."
 FR3_R_army_strain_spirit:0 "Strain in the Army"
 FR3_R_army_strain_spirit_desc:0 "Failed promises of a rapid breakthrough and accumulated exhaustion undermine confidence. Discipline alone cannot repair a force that lacks rest, sound planning and dependable supply."
 FR3_R_final_coordination_spirit:0 "Coordinated Allied Offensives"
 FR3_R_final_coordination_spirit_desc:0 "A common command calendar connects reserves, artillery and successive attacks. The programme is available to actual co-belligerents rather than every country named in a historical script."
 FR3_WW1_reconstruction_spirit:0 "Reconstruction Coordination"
 FR3_WW1_reconstruction_spirit_desc:0 "We keep civilian and military works on one timetable. The spirit rewards steady rebuilding after industrial loss."
 FR3_WW1_controlled_mobilization:0 "Controlled Mobilisation"
 FR3_WW1_controlled_mobilization_desc:0 "State contracts keep French arms output moving while credit and labour are rationed by the production boards."
 FR3_WW1_allied_orders:0 "Allied Orders"
 FR3_WW1_allied_orders_desc:0 "We use allied contracts to keep French lines supplied and employed. The bonus reflects predictable military production."
 FR3_WW1_colonial_coordination:0 "Colonial Coordination"
 FR3_WW1_colonial_coordination_desc:0 "We tie colonial service to transparent supply and training. Cooperation improves logistics without granting a welfare windfall."
 FR3_WW1_workers_charter:0 "Workers' Production Charter"
 FR3_WW1_workers_charter_desc:0 "A wartime bargain protects skilled labour while keeping the arsenal programme on schedule."
 FR3_gas_mask_1_spirit:0 "Chemical Warning Section Programme"
 FR3_gas_mask_1_spirit_desc:0 "A chemical warning section links sentries, weather reports, and medical posts along the front. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_gas_mask_2_spirit:0 "Improved Respirators Programme"
 FR3_gas_mask_2_spirit_desc:0 "Improved respirators are tested against persistent gas and issued with drills for rapid fitting. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_gas_mask_3_spirit:0 "Gas Discipline Programme"
 FR3_gas_mask_3_spirit_desc:0 "Gas discipline joins sentry drills, decontamination parties, and medical reporting. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_general_staff_spirit:0 "General Staff Reorganisation Programme"
 FR3_general_staff_spirit_desc:0 "The General Staff separates strategic assumptions from reports coming back from the trenches. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_three_year_law_spirit:0 "The Three-Year Law Programme"
 FR3_three_year_law_spirit_desc:0 "The 1913 Three-Year Law expands conscription and keeps trained classes available for mobilisation. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_railway_coordination_spirit:0 "Railway Mobilisation Staff Programme"
 FR3_railway_coordination_spirit_desc:0 "Railway mobilisation staff synchronise troop trains, ammunition columns, and civilian traffic. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_front_reserve_spirit:0 "Army Group Reserves Programme"
 FR3_front_reserve_spirit_desc:0 "Army group reserves are held far enough back to answer a breakthrough yet close enough to move before a sector collapses. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_colonial_reserves_spirit:0 "Colonial Reserve Depots Programme"
 FR3_colonial_reserves_spirit_desc:0 "Colonial reserve depots organise men, uniforms, and language support before overseas formations reach France. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_moroccan_divisions_spirit:0 "Moroccan Divisions Programme"
 FR3_moroccan_divisions_spirit_desc:0 "Moroccan divisions bring hard-earned field experience and disciplined manoeuvre to the French front. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_anti_gas_service_spirit:0 "Anti-Gas Service Programme"
 FR3_anti_gas_service_spirit_desc:0 "The anti-gas service combines detection, respirator maintenance, medical treatment, and decontamination. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_counterbattery_office_spirit:0 "Counter-Battery Office Programme"
 FR3_counterbattery_office_spirit_desc:0 "The counter-battery office centralises survey data, sound ranging, flash reports, and aerial plates. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_overseas_logistics_spirit:0 "Colonial Supply Depots Programme"
 FR3_overseas_logistics_spirit_desc:0 "Colonial supply depots sort food, ammunition, uniforms, and spare parts at Mediterranean ports. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_front_artillery_school_spirit:0 "Front Artillery School Programme"
 FR3_front_artillery_school_spirit_desc:0 "The front artillery school turns battle reports into instruction on maps, fuzes, observation, and ammunition economy. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_army_standardization_spirit:0 "Army Standardisation Board Programme"
 FR3_army_standardization_spirit_desc:0 "The standardisation board compares rifles, machine guns, shells, tools, and field repairs across formations. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_engineer_companies_spirit:0 "Sapeur-Pionnier Companies Programme"
 FR3_engineer_companies_spirit_desc:0 "Sapeur-pionnier companies bridge shell craters, cut wire, drain trenches, and restore roads under fire. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_algerian_regiments_spirit:0 "Algerian Regiments Programme"
 FR3_algerian_regiments_spirit_desc:0 "Algerian regiments receive dependable cadres, interpreters, and replacement channels before entering major battles. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_nivelle_offensive_spirit:0 "Nivelle Offensive Programme"
 FR3_nivelle_offensive_spirit_desc:0 "Nivelle’s 1917 offensive stakes French recovery on a rapid rupture of the Chemin des Dames. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_petain_rest_spirit:0 "Pétain’s Army Rest Programme"
 FR3_petain_rest_spirit_desc:0 "Pétain restores worn divisions through rotation, leave, food, and limits on futile mass assaults. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_ft17_tanks_spirit:0 "Renault FT-17 Programme"
 FR3_ft17_tanks_spirit_desc:0 "The Renault FT-17 enters service as a small tank that can cross the same ground as the infantry it supports. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_1918_methods_spirit:0 "The 1918 Method Programme"
 FR3_1918_methods_spirit_desc:0 "The 1918 method joins short preparatory fires to tanks, storm groups, and flexible reserves. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_dockyard_1_spirit:0 "Toulon Dockyard Expansion Programme"
 FR3_dockyard_1_spirit_desc:0 "Toulon adds slips, cranes, and trained artificers to keep warships moving through refit. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_dockyard_2_spirit:0 "Brest Yard Workshops Programme"
 FR3_dockyard_2_spirit_desc:0 "Brest workshops standardise hull repairs, boilers, and gun maintenance for the Atlantic fleet. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_dockyard_3_spirit:0 "Mediterranean Yard Rotation Programme"
 FR3_dockyard_3_spirit_desc:0 "Mediterranean yards rotate repair teams and critical spares between Toulon and Bizerte. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_dockyard_4_spirit:0 "Emergency Dockyard Stores Programme"
 FR3_dockyard_4_spirit_desc:0 "Emergency stores hold plates, shells, cables, and engineering tools close to the fleet bases. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_bizerte_fleet_spirit:0 "Bizerte Fleet Base Programme"
 FR3_bizerte_fleet_spirit_desc:0 "Bizerte becomes a working fleet base with fuel, ammunition, signals, and repair capacity. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_escort_destroyers_spirit:0 "Escort Destroyers Programme"
 FR3_escort_destroyers_spirit_desc:0 "Escort destroyers pair depth charges, lookouts, and convoy station keeping. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_cruiser_squadrons_spirit:0 "Cruiser Squadron Doctrine Programme"
 FR3_cruiser_squadrons_spirit_desc:0 "Cruiser squadrons practise scouting lines and controlled withdrawals around the Adriatic. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_fleet_battle_plan_spirit:0 "Fleet Battle Planning Programme"
 FR3_fleet_battle_plan_spirit_desc:0 "Fleet battle planning fixes signals, rendezvous points, and fallback routes before a sortie. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_adriatic_support_spirit:0 "Adriatic Support Programme"
 FR3_adriatic_support_spirit_desc:0 "French ships support the guarded Adriatic campaign with observation, shore fire, and convoy cover. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_algeria_escorts_spirit:0 "Algerian Convoy Escorts Programme"
 FR3_algeria_escorts_spirit_desc:0 "Algerian convoy escorts link Marseille, Oran, Algiers, and Bizerte with regular patrols. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_naval_fire_control_spirit:0 "Improved Fire Control Programme"
 FR3_naval_fire_control_spirit_desc:0 "Improved fire control joins rangefinders, plotting rooms, and signal discipline aboard French warships. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_submarine_patrols_spirit:0 "Mediterranean Submarine Patrols Programme"
 FR3_submarine_patrols_spirit_desc:0 "Mediterranean submarine patrols focus on likely approaches and the traffic that sustains an enemy fleet. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_convoy_escort_service_spirit:0 "Convoy Escort Service Programme"
 FR3_convoy_escort_service_spirit_desc:0 "The convoy escort service assigns destroyers, patrol craft, and lookouts to a common sailing plan. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_marine_transport_spirit:0 "Marine Transport Service Programme"
 FR3_marine_transport_spirit_desc:0 "The Marine Transport Service schedules troopships, coalers, and hospital ships around naval protection. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_gallipoli_preparations_spirit:0 "Gallipoli Lessons Programme"
 FR3_gallipoli_preparations_spirit_desc:0 "Gallipoli reports expose the cost of weak reconnaissance, difficult beaches, and uncoordinated naval fire. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_adriatic_blockade_spirit:0 "Adriatic Blockade Support Programme"
 FR3_adriatic_blockade_spirit_desc:0 "The Adriatic blockade uses patrol lines, minesweeping, and observation to restrict enemy movement. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_gallipoli_support_spirit:0 "Guarded Dardanelles Support Programme"
 FR3_gallipoli_support_spirit_desc:0 "French support for the Dardanelles is tied to reconnaissance, minesweeping, and protection of the landing force. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_bizerte_repair_docks_spirit:0 "Bizerte Repair Docks Programme"
 FR3_bizerte_repair_docks_spirit_desc:0 "Bizerte repair docks stock plates, boilers, and ordnance for ships returning from hard patrols. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_bomber_focus_spirit:0 "Aerial Bombardment Programme"
 FR3_bomber_focus_spirit_desc:0 "Aerial bombardment units study target selection, weather, and the limits of small wartime loads. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_aviation_effort_1_spirit:0 "Aerial Reconnaissance Programme"
 FR3_aviation_effort_1_spirit_desc:0 "Aerial reconnaissance maps trenches, roads, and artillery flashes before an attack. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_pilot_training_1_spirit:0 "Pilot Training Schools Programme"
 FR3_pilot_training_1_spirit_desc:0 "Pilot training schools teach navigation, observation, and emergency landings alongside flying skill. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_aviation_effort_2_spirit:0 "Forward Observation Flights Programme"
 FR3_aviation_effort_2_spirit_desc:0 "Forward observation flights keep aircraft close enough to correct artillery yet high enough to survive rifle fire. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_pilot_training_2_spirit:0 "Advanced Flight Training Programme"
 FR3_pilot_training_2_spirit_desc:0 "Advanced flight training adds formation work, reconnaissance discipline, and recovery from damaged engines. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_fighter_focus_spirit:0 "Fighter Protection Programme"
 FR3_fighter_focus_spirit_desc:0 "Fighter protection assigns patrols to shield observation aircraft and vulnerable formations. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_aeronavale_spirit:0 "Aéronavale Patrols Programme"
 FR3_aeronavale_spirit_desc:0 "Aéronavale patrols watch the approaches to French ports and Mediterranean convoys. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_aeronautique_militaire_spirit:0 "Aéronautique Militaire Programme"
 FR3_aeronautique_militaire_spirit_desc:0 "The Aéronautique Militaire consolidates army aircraft, observers, and maintenance under a common service culture. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_escadrilles_spirit:0 "Escadrille Organisation Programme"
 FR3_escadrilles_spirit_desc:0 "Escadrille organisation fixes staff tables for pilots, mechanics, observers, and replacement aircraft. The temporary programme keeps that lesson active through trained staffs, crews, or instructors."
 FR3_WW1_agricultural_supply:0 "Agricultural Supply Reserve"
 FR3_WW1_agricultural_supply_desc:0 "We reserve rail capacity for seed, food and army rations. The reserve keeps industrial mobilization supplied when farms compete for wagons."
 FR3_WW1_algerian_reform:0 "Algerian Reform Programme"
 FR3_WW1_algerian_reform_desc:0 "We pair Algerian councils with technical schools and public works. The programme rewards cooperation through administration rather than coercion."
 FR3_WW1_armament_credit:0 "Armament Credit"
 FR3_WW1_armament_credit_desc:0 "We guarantee credit for factories that meet army contracts and labor rules. Measured credit sustains arsenals during the emergency."
 FR3_WW1_chemistry_spirit:0 "National Chemistry Programme"
 FR3_WW1_chemistry_spirit_desc:0 "We keep wartime chemical expertise in French laboratories. Research support improves industry without adding a new resource system."
 FR3_WW1_coal_board:0 "Coal Allocation Board"
 FR3_WW1_coal_board_desc:0 "We direct coal toward railways, furnaces and depots with a published priority list. Better allocation keeps civilian fuel from starving production."
 FR3_WW1_colonial_labor_board:0 "Colonial Labor Board"
 FR3_WW1_colonial_labor_board_desc:0 "We set transparent contracts for workers moving between colonial projects. A labor board prevents emergency requisitions from destroying local capacity."
 FR3_WW1_demobilization:0 "Demobilization Offices"
 FR3_WW1_demobilization_desc:0 "We prepare an orderly return from wartime production. The offices protect trained capacity while the temporary munitions ledger closes."
 FR3_WW1_equipment_offices:0 "Colonial Equipment Offices"
 FR3_WW1_equipment_offices_desc:0 "We place equipment offices near the communities supplying our armies. Their work rewards service with tools, rifles and predictable maintenance."
 FR3_WW1_imperial_association:0 "Imperial Association"
 FR3_WW1_imperial_association_desc:0 "We give cooperating territories a continuing forum for reform and investment. France gains reliable partners when rewards follow service."
 FR3_WW1_indochina_ports:0 "Indochinese Port Works"
 FR3_WW1_indochina_ports_desc:0 "We improve port works that connect Indochina to allied shipping. Better links make local supply more dependable."
 FR3_WW1_indochina_schooling:0 "Indochinese Technical Schools"
 FR3_WW1_indochina_schooling_desc:0 "We fund technical schooling for clerks, engineers and medical staff. Knowledge travels farther than a coercive decree."
 FR3_WW1_indochina_trade:0 "Indochinese Trade Links"
 FR3_WW1_indochina_trade_desc:0 "We let Indochinese ports trade more directly with French arsenals. Predictable contracts give local firms a stake in cooperation."
 FR3_WW1_labor_directorate:0 "Labor Directorate"
 FR3_WW1_labor_directorate_desc:0 "We coordinate exemptions, training and workshop transfers through one labor directorate. Controlled mobilization becomes orderly instead of chaotic."
 FR3_WW1_moroccan_cooperation:0 "Moroccan Cooperation"
 FR3_WW1_moroccan_cooperation_desc:0 "We negotiate practical Moroccan cooperation around ports and roads. French contracts reward reliable service instead of coercive expansion."
 FR3_WW1_munitions_reserve:0 "Munitions Reserve"
 FR3_WW1_munitions_reserve_desc:0 "We keep a measured reserve for the next offensive. The existing state ledger records real temporary arms factories for later demobilization."
 FR3_WW1_plant_safety:0 "Plant Safety Standards"
 FR3_WW1_plant_safety_desc:0 "We make powder magazines and shell lines safer for workers. Fewer accidents keep trained hands available for the front."
 FR3_WW1_postwar_conversion:0 "Postwar Conversion Plan"
 FR3_WW1_postwar_conversion_desc:0 "We convert arsenals toward civilian machinery when the guns fall silent. Timed coordination keeps useful capacity from freezing."
 FR3_WW1_rail_priority:0 "Rail Freight Priority"
 FR3_WW1_rail_priority_desc:0 "We rank every load by military urgency and distance. A published list gives commanders supplies without paralyzing civil railways."
 FR3_WW1_repair_crews:0 "Mobile Repair Crews"
 FR3_WW1_repair_crews_desc:0 "We train mobile crews to repair weapons near the rail heads. Their expertise is worth more than a symbolic factory bonus."
 FR3_WW1_saharan_routes:0 "Saharan Routes"
 FR3_WW1_saharan_routes_desc:0 "We improve routes across the Sahara for mail, medicine and supplies. Better links make cooperative administration practical."
 FR3_WW1_state_coordination:0 "State Contract Coordination"
 FR3_WW1_state_coordination_desc:0 "We audit large contracts against rail and steel capacity. Controlled orders keep the state from promising more shells than factories can deliver."
 FR3_WW1_tunisian_councils:0 "Tunisian Councils"
 FR3_WW1_tunisian_councils_desc:0 "We support Tunisian councils that keep rail and harbor work accountable. Their cooperation earns administrative training and supplies."
 FR3_WW1_tunisian_trade:0 "Tunisian Trade Links"
 FR3_WW1_tunisian_trade_desc:0 "We give Tunisian merchants predictable access to French contracts. Trade links turn harbor capacity into useful wartime supply."
 FR3_WW1_war_bonds:0 "Victory Loan Drive"
 FR3_WW1_war_bonds_desc:0 "We link bond issues to visible arsenal and railway work. Public credit pays for supplies the army actually consumes."
 FR3_WW1_west_africa_rail:0 "West African Rail Programme"
 FR3_WW1_west_africa_rail_desc:0 "We lay short rail links where West African authorities can maintain them. Dependable supply matters more than a paper empire."
 FR3_WW1_women_workshops:0 "Women's Workshop Programme"
 FR3_WW1_women_workshops_desc:0 "We train women for skilled workshop jobs while protecting essential civilian trades. Their contribution is measured by output and safety."
 US2_R_merit_spirit:0 "Merit in Federal Service"
 US2_R_merit_spirit_desc:0 "Competitive appointments give federal departments a more dependable professional staff. Clear procedures reduce the influence of political patronage over routine administration."
 US2_R_tariff_spirit:0 "Underwood Tariff Programme"
 US2_R_tariff_spirit_desc:0 "Lower tariff schedules ease the cost of selected imports and challenge protected monopolies. Treasury officials balance the change against a broader source of federal revenue."
 US2_R_trusts_spirit:0 "Federal Competition Commission"
 US2_R_trusts_spirit_desc:0 "Investigators examine unfair practices that ordinary litigation struggles to address. Regular scrutiny encourages producers to compete on costs and service."
 US2_R_farm_credit_spirit:0 "Cooperative Farm Credit"
 US2_R_farm_credit_spirit_desc:0 "Farmers organise longer term credit against productive land rather than the next harvest alone. Cooperative institutions give rural investment a steadier financial foundation."
 US2_R_cabinet_spirit:0 "Cabinet Legislative Coordination"
 US2_R_cabinet_spirit_desc:0 "The executive departments present a coordinated legislative programme to Congress. Clear responsibilities reduce delays between an appropriation and its practical use."
 US2_R_new_nationalism_spirit:0 "New Nationalism"
 US2_R_new_nationalism_spirit_desc:0 "Federal regulation accepts that concentrated industry requires public oversight. Conservation and social protection become part of a stronger national executive programme."
 US2_R_conservation_spirit:0 "National Conservation Service"
 US2_R_conservation_spirit_desc:0 "Surveyors and land officers coordinate protection of forests and watersheds. Infrastructure planning can now account for the long term condition of the public estate."
 US2_R_compensation_spirit:0 "Industrial Compensation Standards"
 US2_R_compensation_spirit_desc:0 "Inspection and compensation arrangements make employers responsible for preventable industrial injuries. Workers can accept new methods without bearing every risk themselves."
 US2_R_health_spirit:0 "Public Health Coordination"
 US2_R_health_spirit_desc:0 "Federal health offices support sanitation and disease prevention across state boundaries. Better coordination reduces illness among workers and recruits."
 US2_R_courts_spirit:0 "Constitutional Administration"
 US2_R_courts_spirit_desc:0 "The administration relies on courts and carefully framed legislation to settle disputed federal powers. A predictable legal process supports investment and official confidence."
 US2_R_business_spirit:0 "Commercial Confidence"
 US2_R_business_spirit_desc:0 "Officials maintain clear commercial rules while enforcing existing competition law. Manufacturers can plan civilian investment without abrupt changes to their obligations."
 US2_R_conciliation_spirit:0 "Industrial Conciliation"
 US2_R_conciliation_spirit_desc:0 "Mediators bring organised labour and employers into negotiations before disputes close essential plants. Agreements address hours and contracts rather than relying solely on emergency force."
 US2_R_civil_liberties_spirit:0 "Constitutional Civil Liberties"
 US2_R_civil_liberties_spirit_desc:0 "Courts and legislators scrutinise restrictions on public speech and association. Government accepts a slower emergency process in exchange for keeping dissent within constitutional institutions."
 US2_R_press_bureau_spirit:0 "Committee on Public Information"
 US2_R_press_bureau_spirit_desc:0 "A wartime bureau distributes official reports and organises public explanations of military policy. Its campaign mobilises support while drawing criticism over the boundary between information and propaganda."
 US2_R_women_spirit:0 "Women in War Work"
 US2_R_women_spirit_desc:0 "Employment offices recruit women into workshops and administrative services facing wartime shortages. Training and agreed working conditions help sustain essential production."
 US2_R_veterans_spirit:0 "Veterans Medical Administration"
 US2_R_veterans_spirit_desc:0 "Military and civilian hospitals prepare to receive wounded soldiers and men with lasting disabilities. Coordinated records connect treatment to pensions and employment assistance."
 US2_R_congress_spirit:0 "Congressional War Committees"
 US2_R_congress_spirit_desc:0 "Congressional committees scrutinise the contracts and appropriations required by the war. Suppliers receive clearer authority while the executive must account for expenditure."
 US2_R_loans_spirit:0 "Liberty Loan Administration"
 US2_R_loans_spirit_desc:0 "Public subscriptions provide a regular channel for financing emergency purchases. Treasury officials organise the campaign without treating wartime borrowing as permanent ordinary revenue."
 US2_R_neutral_trade_spirit:0 "Neutral Shipping Office"
 US2_R_neutral_trade_spirit_desc:0 "Shipping agents record cargoes and apply consistent rules to trade with belligerents. Transparent documentation helps defend American commercial rights."
 US2_R_mediation_spirit:0 "American Mediation Mission"
 US2_R_mediation_spirit_desc:0 "Diplomats maintain channels between governments that cannot yet agree on peace. Careful proposals avoid binding the United States to territorial demands it has not accepted."
 US2_R_german_commerce_spirit:0 "Berlin Commercial Liaison"
 US2_R_german_commerce_spirit_desc:0 "Commercial representatives examine the guarantees accepted by Berlin. Cooperation protects American shipping without granting an automatic military commitment."
 US2_R_continental_spirit:0 "Continental Diplomatic Liaison"
 US2_R_continental_spirit_desc:0 "American officers and diplomats consult the consenting continental powers. Shared information clarifies the terms on which a future military partnership could operate."
 US2_R_border_spirit:0 "Southwestern Border Patrols"
 US2_R_border_spirit_desc:0 "Army posts coordinate transport and observation along the Mexican frontier. Prepared patrols address raids without assuming that every Mexican faction is an American enemy."
 US2_R_pacific_spirit:0 "Pacific Commercial Diplomacy"
 US2_R_pacific_spirit_desc:0 "American representatives press for stable commerce and respect for the existing Pacific balance. Consistent consultation supports naval observation without ordering an immediate war with Japan."
 US2_R_reconstruction_spirit:0 "Industrial Survey Programme"
 US2_R_reconstruction_spirit_desc:0 "Federal departments and commercial organisations survey the capacity of American workshops. A common industrial record helps direct civilian investment before emergency orders arrive."
 US2_R_federal_credit:0 "Federal Credit"
 US2_R_federal_credit_desc:0 "We will steady long term industrial credit. Predictable finance lets factories expand without a panic driven rush for capital."
 US2_R_rail_coordination:0 "Rail Coordination"
 US2_R_rail_coordination_desc:0 "We will give railroads a common freight timetable. Priority movement joins mines, arsenals and ports while preserving scarce rolling stock."
 US2_R_steel_methods:0 "Steel Methods"
 US2_R_steel_methods_desc:0 "We will align Pennsylvania and Illinois furnaces with national orders. Steel output serves rails, tools and armaments through contracts that reward delivery."
 US2_R_machine_shop:0 "Machine Shop"
 US2_R_machine_shop_desc:0 "We will treat precision lathes as a strategic foundation. Shared standards let small shops produce parts for larger contracts."
 US2_R_farm_logistics:0 "Farm Logistics"
 US2_R_farm_logistics_desc:0 "We will connect grain elevators, refrigerated cars and army depots. Better movement keeps soldiers supplied without creating a separate food mechanic."
 US2_R_shipyard_program:0 "Shipyard Program"
 US2_R_shipyard_program_desc:0 "We will coordinate Atlantic yards around repeatable hull designs. American dockworkers deliver merchant tonnage and naval auxiliaries on a dependable schedule."
 US2_R_mining_surplus:0 "Mining Surplus"
 US2_R_mining_surplus_desc:0 "We will catalogue coal and iron seams for an expanding industrial base. Survey teams guide investment toward mines with reliable rail access."
 US2_R_gauge_standard:0 "Gauge Standard"
 US2_R_gauge_standard_desc:0 "We will remove bottlenecks between regional rail systems. Common gauges make every locomotive and wagon more useful to the national network."
 US2_R_carnegie_contracts:0 "Carnegie Contracts"
 US2_R_carnegie_contracts_desc:0 "We will turn Pittsburgh furnace capacity toward predictable government orders. Contracts bind steel output to rails, armor and tools without nationalizing private works."
 US2_R_tool_standardization_spirit:0 "Tool Standardization"
 US2_R_tool_standardization_spirit_desc:0 "We will publish interchangeable dimensions for machine tools. American workshops shorten repairs by sharing the same gauges and drawings."
 US2_R_grain_storage:0 "Grain Storage"
 US2_R_grain_storage_desc:0 "We will expand storage around interior rail junctions. Reserve capacity keeps harvests moving when shipping is tight."
 US2_R_merchant_yards:0 "Merchant Yards"
 US2_R_merchant_yards_desc:0 "We will place merchant construction on a repeatable schedule. Coastal yards receive steel and engines in the order that keeps hulls moving."
 US2_R_coal_allocation:0 "Coal Allocation"
 US2_R_coal_allocation_desc:0 "We will give coal consumers a common allocation board. Furnaces, railways and depots receive fuel before shortages slow production."
 US2_R_clearinghouse:0 "Clearinghouse"
 US2_R_clearinghouse_desc:0 "We will share orders and inventories across federal departments. A single ledger exposes shortages early and matches unused capacity to urgent work."
 US2_R_armor_plate_spirit:0 "Armor Plate"
 US2_R_armor_plate_spirit_desc:0 "We will reserve heavy rolling capacity for armor plate. American mills learn to meet naval and artillery specifications on schedule."
 US2_R_army_supply_spirit:0 "Army Supply"
 US2_R_army_supply_spirit_desc:0 "We will tie quartermaster orders to rail schedules and depot capacity. Better planning turns American manufacturing into reliable field supply."
 US2_R_navy_yards_spirit:0 "Navy Yards"
 US2_R_navy_yards_spirit_desc:0 "We will add covered work space around established naval yards. Dockworkers gain capacity to repair escorts while new hulls continue through the slips."
 US2_R_war_industries_board_spirit:0 "War Industries Board"
 US2_R_war_industries_board_spirit_desc:0 "Federal contract standards let American factories expand without competing blindly for the same materials."
 US2_R_federal_procurement_spirit:0 "Federal Procurement"
 US2_R_federal_procurement_spirit_desc:0 "We will publish common specifications for every department. Central orders reduce duplicate designs and give firms confidence to add shifts."
 US2_R_ordnance_contracts_spirit:0 "Ordnance Contracts"
 US2_R_ordnance_contracts_spirit_desc:0 "We will place artillery orders with plants meeting measured tolerances. Inspectors and advance payments turn capacity into dependable field pieces."
 US2_R_aircraft_materials_spirit:0 "Aircraft Materials"
 US2_R_aircraft_materials_spirit_desc:0 "We will reserve aluminum, engines and fabric for the new air arm. Materials research lets American factories learn aircraft production safely."
 US2_R_meatpacking:0 "Meatpacking"
 US2_R_meatpacking_desc:0 "We will align inspection, cold storage and army contracts. Predictable deliveries protect soldiers' rations without adding a new resource system."
 US2_R_emergency_shipbuilding_spirit:0 "Emergency Shipbuilding"
 US2_R_emergency_shipbuilding_spirit_desc:0 "We will put emergency hull orders beside merchant yards. Standardized construction replaces lost tonnage and keeps American exports moving."
 US2_R_controlled_materials_spirit:0 "Controlled Materials"
 US2_R_controlled_materials_spirit_desc:0 "We will allocate copper, rubber and steel by delivery priority. Transparent schedules keep armament plants working while civilian needs remain visible."
 US2_R_liberty_loans_spirit:0 "Liberty Loans"
 US2_R_liberty_loans_spirit_desc:0 "We will connect public subscriptions to contracts with workers and materials. Treasury finance sustains production without creating a debt counter."
 US2_R_rail_priorities_spirit:0 "Rail Priorities"
 US2_R_rail_priorities_spirit_desc:0 "We will give military freight a published place in the timetable. Clear priorities prevent one emergency order from paralyzing the network."
 US2_R_artillery_expansion_spirit:0 "Artillery Expansion"
 US2_R_artillery_expansion_spirit_desc:0 "We will add inspected artillery lines to the national order book. American crews receive dependable guns and a trained maintenance chain."
 US2_R_airplane_contracts_spirit:0 "Airplane Contracts"
 US2_R_airplane_contracts_spirit_desc:0 "We will give aircraft makers stable specifications and milestones. Early American aviation grows through measured procurement."
 US2_R_cold_storage_spirit:0 "Cold Storage"
 US2_R_cold_storage_spirit_desc:0 "We will place cold rooms at rail and port junctions. Stored provisions travel farther while inspectors keep the army supplied."
 US2_R_merchant_fleet_spirit:0 "Merchant Fleet"
 US2_R_merchant_fleet_spirit_desc:0 "We will commission standardized freighters for Atlantic service. A larger merchant fleet carries American production without a new stockpile mechanic."
 US2_R_standard_contracts_spirit:0 "Standard Contracts"
 US2_R_standard_contracts_spirit_desc:0 "We will make delivery clauses and inspection rules identical. Firms expand with less uncertainty when every bureau measures the same result."
 US2_R_treasury_procurement_spirit:0 "Treasury Procurement"
 US2_R_treasury_procurement_spirit_desc:0 "We will place Treasury schedules beside the production calendar. Predictable payments keep emergency factories supplied with labor and materials."
 US2_R_army_arsenals_spirit:0 "Army Arsenals"
 US2_R_army_arsenals_spirit_desc:0 "We will modernize federal arsenals around repeatable small arms work. Skilled inspectors turn contracts into equipment that field units can repair."
 US2_R_convoy_shipbuilding_spirit:0 "Convoy Shipbuilding"
 US2_R_convoy_shipbuilding_spirit_desc:0 "We will dedicate slips and engines to escortable merchant hulls. Standard work keeps the ocean route open as American output reaches the Allies."
 US2_R_industrial_mobilization_spirit:0 "Industrial Mobilization"
 US2_R_industrial_mobilization_spirit_desc:0 "We will join contracts, credit and materials under one calendar. American industry expands without losing the measurements that made it dependable."
 US2_R_federal_arsenals_spirit:0 "Federal Arsenals"
 US2_R_federal_arsenals_spirit_desc:0 "We will share drawings, gauges and maintenance methods among plants. Common practice makes American weapons easier to replace in the field."
 US2_R_merchant_conversion:0 "Merchant Conversion"
 US2_R_merchant_conversion_desc:0 "We will convert emergency hull lines after the armistice. Demobilization releases wartime capacity while preserving yards and skills."
 US2_R_alaska_logistics_spirit:0 "Alaska Logistics"
 US2_R_alaska_logistics_spirit_desc:0 "We will improve routes linking Alaskan settlements, ports and depots. A measured program supports the territory without off map industry."
 US2_R_hawaii_stations:0 "Hawaii Stations"
 US2_R_hawaii_stations_desc:0 "We will reinforce infrastructure around Hawaii's naval station. Better services keep the Pacific fleet supplied within existing administration."
 US2_R_puerto_rico_works_spirit:0 "Puerto Rico Works"
 US2_R_puerto_rico_works_spirit_desc:0 "We will improve roads and depots around established facilities. Local construction strengthens Caribbean routes without adding factories outside cores."
 US2_R_philippine_procurement_spirit:0 "Philippine Procurement"
 US2_R_philippine_procurement_spirit_desc:0 "We will align procurement with the Philippine government's administration. Equipment and training improve defense while local institutions remain intact."
 US2_R_alaska_mining_spirit:0 "Alaska Mining"
 US2_R_alaska_mining_spirit_desc:0 "We will map mineral deposits that can support northern construction. Survey work guides later investment without granting an instant factory."
 US2_R_pearl_harbor_logistics_spirit:0 "Pearl Harbor Logistics"
 US2_R_pearl_harbor_logistics_spirit_desc:0 "We will coordinate fuel, repair stores and harbor access around Pearl Harbor. The station serves the Pacific fleet through practical logistics."
 US2_R_caribbean_stations_spirit:0 "Caribbean Stations"
 US2_R_caribbean_stations_spirit_desc:0 "We will coordinate signals and supplies between the canal and island routes. Shared schedules make the Caribbean a dependable transit region."
 US2_R_pacific_telegraph_spirit:0 "Pacific Telegraph"
 US2_R_pacific_telegraph_spirit_desc:0 "We will improve telegraph links between Hawaii and continental offices. Faster reports help fleets and depots respond to changing conditions."
 US2_R_antilles_shipping_spirit:0 "Antilles Shipping"
 US2_R_antilles_shipping_spirit_desc:0 "We will publish a regular schedule for Caribbean cargo and repair calls. Reliable shipping supports the islands without a custom resource or stockpile."
 US2_R_philippine_constabulary_spirit:0 "Philippine Constabulary"
 US2_R_philippine_constabulary_spirit_desc:0 "We will provide measured training and small arms for local security forces. Cooperation strengthens defense while preserving the Philippine chain of administration."
 US2_R_pacific_fleet_support_spirit:0 "Pacific Fleet Support"
 US2_R_pacific_fleet_support_spirit_desc:0 "We will coordinate station services from Hawaii to the canal. Prepared repairs and fuel keep the fleet active over long distances."
 US2_R_territorial_supply_offices_spirit:0 "Territorial Supply Offices"
 US2_R_territorial_supply_offices_spirit_desc:0 "We will place accountable supply officers at the main territorial routes. Their ledgers match equipment to local needs before shortages become crises."
 US2_R_integrated_territorial_logistics_spirit:0 "Integrated Territorial Logistics"
 US2_R_integrated_territorial_logistics_spirit_desc:0 "We will connect the canal, Pacific stations, Caribbean routes and northern depots. A practical network supports defense without coercive territorial expansion."
 US2_R_railway_board_spirit:0 "Military Railway Board"
 US2_R_railway_board_spirit_desc:0 "A military railway board reserves locomotives, timetables, and repair crews for mobilisation. Its schedules connect inland depots to Atlantic embarkation points while keeping inland transport dependable."
 US2_R_m1917_rifle_spirit:0 "M1917 Rifle Conversion"
 US2_R_m1917_rifle_spirit_desc:0 "Springfield tooling alone cannot equip the expanding force, so arsenals adapt the M1917 pattern. Standardised manufacture closes the gap between American ambition and available rifles."
 US2_R_browning_m1917_spirit:0 "Browning M1917 Machine Guns"
 US2_R_browning_m1917_spirit_desc:0 "The water-cooled Browning M1917 gives battalions sustained fire from prepared positions. Crews train in belts, cooling, and traverses so the gun supports movement instead of merely guarding a trench."
 US2_R_75mm_guns_spirit:0 "75 mm Field Batteries"
 US2_R_75mm_guns_spirit_desc:0 "French 75 mm batteries teach American gunners rapid laying and observed concentrations. The lesson makes a familiar calibre useful in the coordinated fires of the AEF."
 US2_R_staff_college_spirit:0 "Command and General Staff School"
 US2_R_staff_college_spirit_desc:0 "Staff officers study allied operations, map exercises, and the limits of telephone control. Graduates carry a common vocabulary into divisions assembled from state units."
 US2_R_field_hospitals_spirit:0 "Forward Field Hospitals"
 US2_R_field_hospitals_spirit_desc:0 "Forward hospitals combine triage, surgery, sanitation, and evacuation routes near the line. Faster treatment protects experienced soldiers without pretending casualties can be removed from war."
 US2_R_wireless_sets_spirit:0 "Wireless Sets"
 US2_R_wireless_sets_spirit_desc:0 "Wireless sets give headquarters a second path when shellfire cuts telephone cable. Operators practise brevity and encryption so information reaches the guns before it becomes stale."
 US2_R_railway_mobilization_spirit:0 "Railway Mobilisation Tables"
 US2_R_railway_mobilization_spirit_desc:0 "Railway mobilisation tables match troop trains to ports, depots, and rolling-stock repairs. The board reduces idle formations without assuming that Europe can be reached instantly."
 US2_R_pershing_planning_spirit:0 "Pershing’s Expeditionary Plan"
 US2_R_pershing_planning_spirit_desc:0 "Pershing’s headquarters sets standards for training, American command, and the commitment of divisions overseas. The plan keeps the AEF from becoming a collection of borrowed battalions."
 US2_R_curtiss_observation_spirit:0 "Curtiss Observation Flights"
 US2_R_curtiss_observation_spirit_desc:0 "Curtiss aircraft and observers practise mapping columns, roads, and artillery positions. Their reports give commanders a practical bridge between cavalry reconnaissance and modern fire control."
 US2_R_supply_depots_spirit:0 "Overseas Supply Depots"
 US2_R_supply_depots_spirit_desc:0 "Supply depots sort food, ammunition, uniforms, and spare parts at American ports and European bases. Their schedules make the AEF sustainable without creating off-map factories."
 US2_R_aef_planning_spirit:0 "AEF Planning Staff"
 US2_R_aef_planning_spirit_desc:0 "The AEF planning staff combines American objectives with the fire and logistics lessons of France. Its maps set attainable phases instead of promising a parade-ground breakthrough."
 US2_R_creeping_barrage_spirit:0 "Creeping Barrage School"
 US2_R_creeping_barrage_spirit_desc:0 "Gunners and infantry rehearse a barrage that moves by clock and map reference. Close liaison keeps assault waves behind the shells while limiting friendly fire."
 US2_R_motor_transport_spirit:0 "Motor Transport Corps"
 US2_R_motor_transport_spirit_desc:0 "Motor Transport Corps units organise trucks, workshops, fuel, and traffic control for the AEF. Reliable movement lets reserves and ammunition keep pace with an attack."
 US2_R_selective_training_spirit:0 "Selective Training Camps"
 US2_R_selective_training_spirit_desc:0 "Selective Service camps standardise drill, marksmanship, and non-commissioned officer instruction. Their graduates arrive less raw when the United States finally enters a major war."
 US2_R_artillery_observers_spirit:0 "Artillery Observation School"
 US2_R_artillery_observers_spirit_desc:0 "Observers learn map grids, sound reports, and aircraft corrections beside the gun line. Their work turns artillery from a stockpile into a coordinated battlefield arm."
 US2_R_american_expeditionary_force_spirit:0 "American Expeditionary Force"
 US2_R_american_expeditionary_force_spirit_desc:0 "The United States commits a national expeditionary force under Pershing’s command. Training, transport, and American formations now answer one wartime headquarters."
 US2_R_front_rotation_spirit:0 "Front Rotation System"
 US2_R_front_rotation_spirit_desc:0 "Division rotation balances leave, rest, replacements, and time under bombardment. PÃ©tain’s lessons abroad are adapted to keep American morale from being spent in one battle."
 US2_R_renault_ft_lessons_spirit:0 "Renault FT Lessons"
 US2_R_renault_ft_lessons_spirit_desc:0 "American crews study the Renault FT as a small tank that can cross ground with infantry. The lesson favours reliable cooperation over unsupported armoured spectacle."
 US2_R_pershing_reserves_spirit:0 "Pershing’s Reserves"
 US2_R_pershing_reserves_spirit_desc:0 "Pershing holds trained formations and transport ready to reinforce the decisive sector. Reserve commitment becomes a deliberate operational choice supported by current reports."
 US2_R_1918_methods_spirit:0 "The 1918 American Method"
 US2_R_1918_methods_spirit_desc:0 "The 1918 method links tanks, aircraft, storm sections, and artillery to a measured advance. American formations apply the war’s lessons without erasing the cost of learning them."
 US2_R_1916_naval_programme_spirit:0 "The 1916 Naval Programme"
 US2_R_1916_naval_programme_spirit_desc:0 "The 1916 programme funds battleships, destroyers, submarines, and supporting yards. Congress treats a modern navy as insurance while neutrality still shapes policy."
 US2_R_destroyer_squadrons_spirit:0 "Destroyer Squadrons"
 US2_R_destroyer_squadrons_spirit_desc:0 "Destroyer squadrons train for screens, patrols, rescue work, and submarine hunts. Their dispersed presence gives the fleet eyes and escorts where capital ships cannot be everywhere."
 US2_R_submarine_theory_spirit:0 "Submarine Theory"
 US2_R_submarine_theory_spirit_desc:0 "Submarine officers study patrol lines, battery endurance, and the limits of torpedo attacks. The theory values disciplined reconnaissance over an impossible search for every enemy ship."
 US2_R_standard_destroyers_spirit:0 "Standard Destroyers"
 US2_R_standard_destroyers_spirit_desc:0 "The Navy standardises destroyer machinery, torpedoes, and repair parts for large orders. Common patterns make escort flotillas easier to train and keep at sea."
 US2_R_convoy_escorts_spirit:0 "Convoy Escorts"
 US2_R_convoy_escorts_spirit_desc:0 "Destroyers practise convoy station keeping, depth-charge attacks, and rescue procedures. Escort work becomes a repeatable service for troops and supplies moving through submarine waters."
 US2_R_submarine_patrols_spirit:0 "Submarine Patrols"
 US2_R_submarine_patrols_spirit_desc:0 "American boats receive patrol sectors, torpedo allocations, and maintenance cycles suited to the Atlantic. Commanders conserve batteries and break contact when a hunt turns cold."
 US2_R_curtiss_navy_aircraft_spirit:0 "Curtiss Naval Aircraft"
 US2_R_curtiss_navy_aircraft_spirit_desc:0 "Curtiss aircraft are adapted for ship spotting, coastal patrols, and seaplane operations. Naval observers learn to turn a sighting into a usable fleet report."
 US2_R_naval_radio_spirit:0 "Naval Radio Service"
 US2_R_naval_radio_spirit_desc:0 "Naval radio stations coordinate escorts, aircraft, and fleet headquarters across long distances. Operators practise concise reports so the fleet can act before a contact disappears."
 US2_R_atlantic_fleet_spirit:0 "Atlantic Fleet Readiness"
 US2_R_atlantic_fleet_spirit_desc:0 "The Atlantic fleet rotates fuel, ammunition, and crews through a common readiness schedule. A ship that is available on paper must also be ready to sail."
 US2_R_anti_submarine_warfare_spirit:0 "Anti-Submarine Warfare"
 US2_R_anti_submarine_warfare_spirit_desc:0 "Lookouts, hydrophones, aircraft, and depth-charge crews train as one hunting system. The fleet learns to force submarines down and protect the convoy’s timetable."
 US2_R_naval_repair_spirit:0 "Fleet Repair Service"
 US2_R_naval_repair_spirit_desc:0 "Repair ships and base workshops share priority lists for boilers, hull plates, and weapons. Faster return to duty keeps escort and fleet plans from collapsing after one damaged vessel."
 US2_R_escort_command_spirit:0 "Escort Command"
 US2_R_escort_command_spirit_desc:0 "A dedicated headquarters coordinates screens, radio reports and convoy schedules across the Atlantic."
 US2_R_hampton_roads_output_spirit:0 "Hampton Roads Output"
 US2_R_hampton_roads_output_spirit_desc:0 "Hampton Roads coordinates construction, repair, and ammunition flow for the Atlantic fleet. Industrial output becomes a dependable stream of hulls and readiness work."
 US2_R_air_service_act_spirit:0 "Air Service Act"
 US2_R_air_service_act_spirit_desc:0 "The Air Service Act gives aviation a legal structure, instructors, and procurement authority. Organisation matters because aircraft without mechanics and observers cannot serve an army."
 US2_R_curtiss_jn4_spirit:0 "Curtiss JN-4 Trainers"
 US2_R_curtiss_jn4_spirit_desc:0 "Curtiss JN-4 trainers give new pilots a forgiving machine for navigation and observation practice. Training records make flight hours a military resource rather than a private hobby."
 US2_R_air_observation_spirit:0 "Air Observation"
 US2_R_air_observation_spirit_desc:0 "Observation crews map roads, trenches, and artillery flashes for commanders below. Their reports connect aviation to the decisions made by guns and infantry."
 US2_R_bomber_experiments_spirit:0 "Bomber Experiments"
 US2_R_bomber_experiments_spirit_desc:0 "Bomber crews test target selection, weather judgement, and the limits of early aircraft loads. Their reports favour repeatable battlefield work over spectacular claims."
 US2_R_air_mechanics_spirit:0 "Air Mechanics Corps"
 US2_R_air_mechanics_spirit_desc:0 "Mechanics standardise engines, fabric, propellers, and field inspections for American aircraft. A reliable ground crew gives pilots more useful sorties than a paper fleet of machines."
 US2_R_aef_observation_spirit:0 "AEF Observation Squadrons"
 US2_R_aef_observation_spirit_desc:0 "AEF observation squadrons fly grids, photographs, and artillery corrections over the Western Front. Pilots and observers learn a common routine for turning a sighting into action."
 US2_R_aef_fighters_spirit:0 "AEF Fighter Protection"
 US2_R_aef_fighters_spirit_desc:0 "Fighter squadrons protect observation aircraft and deny the enemy an easy view of American movements. Patrols are assigned to the mission rather than chasing every distant contact."
 US2_R_aef_bombers_spirit:0 "AEF Tactical Bombers"
 US2_R_aef_bombers_spirit_desc:0 "Tactical bombers strike railheads, batteries, and reserves in support of an operation on the ground. Crews coordinate target lists and weather instead of treating bombing as an independent war."
 US2_R_daylight_sorties_spirit:0 "Daylight Sorties"
 US2_R_daylight_sorties_spirit_desc:0 "Daylight sortie planning accounts for visibility, enemy fighters, and the changing front. Mission officers prefer timely reports and survivable flights to empty sortie counts."
 US2_R_air_service_logistics_spirit:0 "Air Service Logistics"
 US2_R_air_service_logistics_spirit_desc:0 "Fuel, cameras, ammunition, and replacement engines move through a dedicated aviation supply system. The service protects sortie rates without creating off-map resources."
 US2_R_close_support_spirit:0 "Close Support Studies"
 US2_R_close_support_spirit_desc:0 "Close support studies signals, target marking, and safe distances between bombs and friendly troops. Pilots are taught to arrive where the ground plan needs them, not where the map looks impressive."
 US2_R_lafayette_liaison_spirit:0 "American Volunteer Aviators"
 US2_R_lafayette_liaison_spirit_desc:0 "American volunteers learn the demands of aerial fighting alongside French squadrons. Their reports bring practical experience back to the Army aviation service."
 US2_R_export_orders_spirit:0 "Atlantic Export Contracts"
 US2_R_export_orders_spirit_desc:0 "Private buyers place large orders with American workshops and shipping firms. Standard contracts help manufacturers maintain a reliable flow of finished munitions."
 US2_R_submarine_alert_spirit:0 "Merchant Shipping Alert"
 US2_R_submarine_alert_spirit_desc:0 "Naval officers and shipping agents prepare merchant crews for submarine attacks. Route notices and emergency drills reduce losses while Washington determines its response."
 US2_R_election_campaign_spirit:0 "A National Electoral Mandate"
 US2_R_election_campaign_spirit_desc:0 "The voters have chosen a programme for the next administration. Organised party committees now work to turn that mandate into legislation."
 US2_R_shipping_board_spirit:0 "Emergency Shipping Contracts"
 US2_R_shipping_board_spirit_desc:0 "The Shipping Board coordinates yards, merchant hulls and transport schedules. These emergency arrangements help carry the expanding army across the Atlantic."
 US2_R_hemisphere_compact_spirit:0 "Pan-American Consultation"
 US2_R_hemisphere_compact_spirit_desc:0 "American governments exchange assurances about sovereignty and commercial access. Regular conferences give disputes a diplomatic channel before military action is considered."
 US2_R_caribbean_supervision_spirit:0 "Caribbean Customs Mission"
 US2_R_caribbean_supervision_spirit_desc:0 "A limited American mission supervises customs receipts and port administration. Civilian agreements, rather than a general war, provide the basis for its work."
 US2_R_ae_french_liaison_spirit:0 "American Expeditionary Liaison"
 US2_R_ae_french_liaison_spirit_desc:0 "American and French headquarters coordinate training, supply and the reception of arriving divisions. The American command retains responsibility for its soldiers while sharing lessons from the front."
 OT1_R_constitutional_council_spirit:0 "Constitutional Council"
 OT1_R_constitutional_council_spirit_desc:0 "Ministers and deputies agree procedures for presenting legislation and scrutinising expenditure. A regular council gives the restored constitution an administrative routine."
 OT1_R_unionist_secretariat_spirit:0 "Unionist Secretariat"
 OT1_R_unionist_secretariat_spirit_desc:0 "The Committee coordinates the appointment of officials and the work of loyal deputies. Greater executive coordination comes at the cost of confidence outside its network."
 OT1_R_said_halim_spirit:0 "Said Halim Pasha’s Cabinet"
 OT1_R_said_halim_spirit_desc:0 "The grand vizier coordinates departments while the Committee and military leaders retain considerable influence. Cabinet procedure provides a channel through which their competing requests can be reconciled."
 OT1_R_civil_registers_spirit:0 "Revised Civil Registers"
 OT1_R_civil_registers_spirit_desc:0 "Provincial offices maintain consistent records of households, taxation and military obligations. A more dependable register reduces the cost of locating the people and resources required by the government."
 OT1_R_public_schools_spirit:0 "Provincial School Programme"
 OT1_R_public_schools_spirit_desc:0 "New teachers and training places extend state education beyond the principal towns. The programme improves administrative skills without pretending that a single decree can erase local languages."
 OT1_R_national_service_spirit:0 "National Service Administration"
 OT1_R_national_service_spirit_desc:0 "Registration offices clarify obligations and the exemptions that have weakened confidence in military recruitment. Consistent procedures help the army draw on existing manpower."
 OT1_R_wartime_cabinet_spirit:0 "Wartime Cabinet Coordination"
 OT1_R_wartime_cabinet_spirit_desc:0 "Civil and military departments agree priorities for transport, contracts and supply. Emergency coordination improves deliveries while requiring the cabinet to account for its demands on the provinces."
 OT1_R_talat_cabinet_spirit:0 "Talat Pasha’s Cabinet"
 OT1_R_talat_cabinet_spirit_desc:0 "The grand vizier combines the Committee’s political authority with responsibility for an exhausted war administration. Ministries now face the task of sustaining supply while provincial confidence continues to erode."
 OT1_R_parliamentary_ministry_spirit:0 "Responsible Parliamentary Ministry"
 OT1_R_parliamentary_ministry_spirit_desc:0 "Ministers must defend their programme before a coalition of deputies rather than a single party network. Debate slows executive action but gives provincial interests a recognised place in the government."
 OT1_R_civil_courts_spirit:0 "Regular Commercial Courts"
 OT1_R_civil_courts_spirit_desc:0 "Commercial courts publish consistent rules for contracts and official obligations. Predictable legal practice encourages investment without granting ministries arbitrary powers over private property."
 OT1_R_labour_mediation_spirit:0 "Industrial Mediation Commissions"
 OT1_R_labour_mediation_spirit_desc:0 "Ministers invite employers and workers to negotiate disputes before essential workshops close. Mediation strengthens civilian production while leaving a public record of the agreements."
 OT1_R_civilian_oversight_spirit:0 "Civilian Oversight of the Army"
 OT1_R_civilian_oversight_spirit_desc:0 "The legislature reviews military appointments and appropriations through a regular committee. Professional officers retain command while ministers accept responsibility for the political direction of the army."
 OT1_R_palace_mediation_spirit:0 "Imperial Cabinet Mediation"
 OT1_R_palace_mediation_spirit_desc:0 "The palace brings rival ministers and parliamentary leaders into negotiations. Its influence provides a settlement mechanism without granting every royal intervention a permanent executive power."
 OT1_R_royal_inspection_spirit:0 "Royal Inspection Commissions"
 OT1_R_royal_inspection_spirit_desc:0 "Imperial commissions hear complaints about appointments and provincial administration. Their reports allow the government to replace ineffective officials before resentment becomes an open crisis."
 OT1_R_emergency_decrees_spirit:0 "Emergency Imperial Decrees"
 OT1_R_emergency_decrees_spirit_desc:0 "The government shortens the procedure for executing urgent administrative orders. The efficiency gained depends on accepting a greater risk to provincial confidence and constitutional scrutiny."
 OT1_R_imperial_council_spirit:0 "Council of the Crown and Porte"
 OT1_R_imperial_council_spirit_desc:0 "The sovereign and cabinet meet within agreed constitutional procedures. A defined division of responsibility helps prevent every ministerial disagreement from becoming a palace struggle."
 OT1_R_religious_endowments_spirit:0 "Supervision of Religious Endowments"
 OT1_R_religious_endowments_spirit_desc:0 "Officials and religious trustees examine how endowed funds support schools and public services. Regular supervision protects their use without turning a religious office into an unlimited source of military power."
 OT1_R_provincial_charter_spirit:0 "Provincial Administrative Charter"
 OT1_R_provincial_charter_spirit_desc:0 "Elected councils receive defined responsibilities for local works and public records. The centre retains defence and foreign policy while recognising that provincial consent cannot be commanded indefinitely."
 OT1_R_equal_citizenship_spirit:0 "Equal Imperial Citizenship"
 OT1_R_equal_citizenship_spirit_desc:0 "Courts and ministries apply common legal protections across the empire’s religious communities. The programme makes constitutional obligations more credible while confronting resistance from established interests."
 OT1_R_local_services_spirit:0 "Provincial Public Services"
 OT1_R_local_services_spirit_desc:0 "Local councils and ministries agree how to maintain roads, sanitation and district offices. Dependable public services give the new settlement a practical purpose beyond constitutional language."
 OT1_R_federal_convention_spirit:0 "Imperial Federal Convention"
 OT1_R_federal_convention_spirit_desc:0 "Delegates negotiate the distribution of administrative responsibilities between the Porte and the provinces. A convention can produce a working settlement only if military command and the cabinet accept its limits."
 OT1_R_veterans_relief_spirit:0 "Relief for Veterans and Refugees"
 OT1_R_veterans_relief_spirit_desc:0 "District offices coordinate medical assistance, housing records and employment for people displaced by war. A dependable relief programme addresses grievances that emergency policing cannot resolve."
 OT1_R_postwar_commission_spirit:0 "Postwar Administrative Commission"
 OT1_R_postwar_commission_spirit_desc:0 "Ministries review emergency appointments and military contracts as the war ends. A public programme helps restore ordinary administration while retaining the country’s permanent infrastructure."
 OT1_R_industrial_foundation_spirit:0 "An Imperial Workshop Programme"
 OT1_R_industrial_foundation_spirit_desc:0 "The empire needs a practical programme linking workshops, transport and public contracts. Construction preparation comes before another list of competing promises."
 OT1_R_harbiye_staff_spirit:0 "Harbiye Staff School"
 OT1_R_harbiye_staff_spirit_desc:0 "Harbiye officers study mobilisation, maps, and the failures of the Balkan campaigns. Their schooling turns imported manuals into Ottoman staff practice."
 OT1_R_mobilisation_tables_spirit:0 "Imperial Mobilisation Tables"
 OT1_R_mobilisation_tables_spirit_desc:0 "Mobilisation tables align railway capacity, depots, draft classes, and corps assignments. Their value is measured in days saved before a real front begins to move."
 OT1_R_limans_inspection_spirit:0 "Limans Inspection Tours"
 OT1_R_limans_inspection_spirit_desc:0 "Liman von Sanders inspects corps, railheads, and command procedures across the empire. His reports reveal where German templates meet Ottoman manpower and terrain limits."
 OT1_R_yildirim_command_spirit:0 "General Staff Liaison"
 OT1_R_yildirim_command_spirit_desc:0 "The Ottoman General Staff keeps German liaison officers, interpreters, and railway planners working before the Yildirim headquarters exists. This channel improves coordination while remaining constrained by Ottoman depots and transport."
 OT1_R_TUR_mauser_armament_spirit:0 "Mauser Armament Board"
 OT1_R_TUR_mauser_armament_spirit_desc:0 "The empire standardises Mauser rifles, ammunition, and inspection around the Tophane system. Procurement favours dependable patterns that provincial workshops can actually support."
 OT1_R_155mm_heavy_guns_spirit:0 "A Limited Heavy Gun Train"
 OT1_R_155mm_heavy_guns_spirit_desc:0 "A small heavy-gun train will use the standard arsenal and field-battery system. Artillery development and trained crews support major-war operations without creating an unlimited siege army."
 OT1_R_railway_corps_spirit:0 "An Army Railway Corps"
 OT1_R_railway_corps_spirit_desc:0 "Create trained detachments for loading, repairs and depot administration. The army can improve supply organisation without receiving railways in foreign territory."
 OT1_R_field_medicine_spirit:0 "Field Hospitals and Evacuation"
 OT1_R_field_medicine_spirit_desc:0 "Railway officers and medical services will agree on casualty collection and evacuation routes. Recovery and support equipment research improve the army's ability to retain trained men."
 OT1_R_caucasus_logistics_spirit:0 "Survey the Eastern Front"
 OT1_R_caucasus_logistics_spirit_desc:0 "The eastern command will prepare maps, cold-weather loads and depot reports. These preparations support the frontier without requiring the empire to enter a particular war."
 OT1_R_supply_columns_spirit:0 "Supply Columns"
 OT1_R_supply_columns_spirit_desc:0 "Supply columns organise carts, pack trains, and guarded road movement behind the front. Their discipline keeps isolated garrisons connected when rail transport ends."
 OT1_R_sarikamis_lessons_spirit:0 "The Sarikamis Lessons"
 OT1_R_sarikamis_lessons_spirit_desc:0 "War with Russia after December 1914 demands honest lessons about winter supply and replacement troops. The programme improves cold-weather preparation without rewarding an unplanned offensive."
 OT1_R_defend_palestine_spirit:0 "Prepare the Palestine Defence"
 OT1_R_defend_palestine_spirit_desc:0 "The regional staff will align reserves, batteries and fieldworks for the Palestine front. A temporary defensive programme supports the existing war with Britain."
 OT1_R_syria_supply_spirit:0 "Syria Supply Route"
 OT1_R_syria_supply_spirit_desc:0 "Syria's rail and road links are assigned food, water, medical stores, and replacement animals. Logistics becomes the foundation of a defence that cannot rely on European industry."
 OT1_R_dardanelles_defence_spirit:0 "Prepare the Dardanelles Defence"
 OT1_R_dardanelles_defence_spirit_desc:0 "The existing fortification programme will join staff plans, coastal guns and field positions. A temporary defensive programme prepares the army to protect the straits."
 OT1_R_gallipoli_field_lessons_spirit:0 "The Gallipoli Field Programme"
 OT1_R_gallipoli_field_lessons_spirit_desc:0 "During great war with Britain, the existing Gallipoli fortification programme will coordinate field positions and local reserves. Its lessons reinforce the army defending the peninsula."
 OT1_R_coastal_defence_programme_spirit:0 "The Straits Defence Priority"
 OT1_R_coastal_defence_programme_spirit_desc:0 "Give patrols, mine barriers and coastal coordination first claim on naval resources. The programme competes with a renewed capital-ship priority."
 OT1_R_dreadnought_procurement_spirit:0 "The Modest Battlefleet Priority"
 OT1_R_dreadnought_procurement_spirit_desc:0 "Concentrate design work and crew preparation on the capital ships the empire can afford. This priority competes with the full coastal-defence programme."
 OT1_R_destroyer_flotillas_spirit:0 "Destroyer Flotillas"
 OT1_R_destroyer_flotillas_spirit_desc:0 "Destroyers patrol the straits, escort transports, and screen larger ships. Their value lies in presence and torpedoes rather than in a dramatic fleet sortie."
 OT1_R_submarine_service_spirit:0 "Submarine Service"
 OT1_R_submarine_service_spirit_desc:0 "Ottoman submarines study patrol lines, batteries, and torpedo discipline in waters they can actually reach. Officers are trained to conserve scarce boats and report useful contacts."
 OT1_R_mine_barriers_spirit:0 "Prepare the Mine Barriers"
 OT1_R_mine_barriers_spirit_desc:0 "Mine crews and coastal observers will maintain common charts and laying schedules. The programme develops the existing naval mining system rather than creating another custom interface."
 OT1_R_dreadnought_yards_spirit:0 "The Naval Repair Ledger"
 OT1_R_dreadnought_yards_spirit_desc:0 "The staff will schedule repairs, spare parts and trained yard workers for the ships already in service. Repair capacity supports either naval priority without another free construction chain."
 OT1_R_destroyer_escorts_spirit:0 "Regular Escort Divisions"
 OT1_R_destroyer_escorts_spirit_desc:0 "Regular escort divisions and trained relief crews keep Ottoman transports moving along threatened coastal routes."
 OT1_R_convoy_escorts_spirit:0 "Convoy Relief Schedules"
 OT1_R_convoy_escorts_spirit_desc:0 "Relief escorts and departure schedules will connect merchant transport to the naval staff. A modest transport reserve and escort organisation sustain the service routes."
 OT1_R_dardanelles_mines_spirit:0 "The Wartime Dardanelles Barrier"
 OT1_R_dardanelles_mines_spirit_desc:0 "During great war, mine crews will coordinate the barrier with coastal observers and fleet movements. The mining programme supports straits defence through the existing naval mechanics."
 OT1_R_naval_fire_control_spirit:0 "Common Naval Fire Control"
 OT1_R_naval_fire_control_spirit_desc:0 "Plotting rooms, rangefinders and radio procedures will work from common data. Capital-ship research and fleet coordination support the chosen battlefleet programme."
 OT1_R_mediterranean_escorts_spirit:0 "Mediterranean Escorts"
 OT1_R_mediterranean_escorts_spirit_desc:0 "Escorts protect movement between Ottoman ports and the fronts that depend on them. Captains learn to withdraw from stronger forces while keeping the route open."
 OT1_R_anti_submarine_patrols_spirit:0 "Anti-Submarine Escort Practice"
 OT1_R_anti_submarine_patrols_spirit_desc:0 "Escorts will practise contact reports, searches and convoy recovery. Detection and trained screens protect merchant routes through the existing naval service mechanics."
 OT1_R_strait_defence_spirit:0 "An Integrated Straits Command"
 OT1_R_strait_defence_spirit_desc:0 "Coordinate mine crews, patrol flotillas and coastal observers under one wartime command. The coastal priority culminates in a service the empire can sustain."
 OT1_R_modest_battlefleet_spirit:0 "Modest Battle Fleet"
 OT1_R_modest_battlefleet_spirit_desc:0 "The battle fleet is kept small, fuelled, and tied to missions it can complete. Its officers understand that a guarded sortie may be more valuable than a lost grand fleet."
 OT1_R_ottoman_convoy_service_spirit:0 "The Ottoman Convoy Service"
 OT1_R_ottoman_convoy_service_spirit_desc:0 "Regular escorts and a repair ledger can support a lasting merchant service. Additional transports and temporary escort efficiency sustain wartime communications."
 OT1_R_san_stefano_aviation_spirit:0 "San Stefano Aviation School"
 OT1_R_san_stefano_aviation_spirit_desc:0 "San Stefano establishes an early aviation culture around pilots, mechanics, and coastal observation. The school gives the empire an institution before it has a modern air arm."
 OT1_R_bleriot_procurement_spirit:0 "Bleriot Procurement"
 OT1_R_bleriot_procurement_spirit_desc:0 "Bleriot aircraft provide a practical first generation for training and reconnaissance. Procurement follows available French designs rather than inventing a domestic industry overnight."
 OT1_R_pilot_training_spirit:0 "A Regular Pilot Course"
 OT1_R_pilot_training_spirit_desc:0 "A regular course will train replacement pilots and observers before the service expands its squadrons. Better air training supports every later mission."
 OT1_R_air_observation_spirit:0 "Observers for the Army Staff"
 OT1_R_air_observation_spirit_desc:0 "Observers will map roads, positions and artillery flashes in reports the staff can use. The service grows around reconnaissance before choosing combat aircraft priorities."
 OT1_R_bomber_detachments_spirit:0 "An Army Support Aircraft Programme"
 OT1_R_bomber_detachments_spirit_desc:0 "Prioritise maintained bombing and observation detachments for army operations. Medium-aircraft research competes with the defensive fighter programme."
 OT1_R_caucasus_observers_spirit:0 "Caucasus Observers"
 OT1_R_caucasus_observers_spirit_desc:0 "Caucasus observers fly over mountain roads, river crossings, and artillery positions in difficult weather. Their reports help commanders see the front before committing scarce columns."
 OT1_R_palestine_recon_spirit:0 "Palestine Reconnaissance"
 OT1_R_palestine_recon_spirit_desc:0 "Reconnaissance flights track railheads, roads, and water points in the Palestine campaign. Observers report what field commanders can act upon before British pressure moves again."
 OT1_R_air_defence_spirit:0 "Air Defence Posts"
 OT1_R_air_defence_spirit_desc:0 "Air defence posts combine lookouts, telephones, and light weapons around important bases. The network protects scarce aircraft without pretending to control every sky."
 OT1_R_close_support_spirit:0 "Close Support Flights"
 OT1_R_close_support_spirit_desc:0 "Close support flights test signals, target marking, and safe distances around infantry. Pilots are sent where the ground plan needs help, not where a map looks impressive."
 OT1_R_air_service_reorganisation_spirit:0 "Air Service Reorganisation"
 OT1_R_air_service_reorganisation_spirit_desc:0 "The air service aligns procurement, training, squadrons, and field headquarters after wartime expansion. Reorganisation makes Ottoman aviation a permanent arm rather than a temporary experiment."
 OT1_R_german_liaison_spirit:0 "German Liaison Mission"
 OT1_R_german_liaison_spirit_desc:0 "German officers compare Ottoman training schedules with the empire's own needs. The mission improves relations and readiness for a limited period."
 OT1_R_german_staff_spirit:0 "German Staff Exchange"
 OT1_R_german_staff_spirit_desc:0 "Staff officers exchange railway and artillery lessons across the Bosphorus. Planning improves while the mission remains temporary."
 OT1_R_central_logistics_spirit:0 "Central Logistics Board"
 OT1_R_central_logistics_spirit_desc:0 "A central logistics board aligns Ottoman rail movements with accepted German schedules. Recovering organisation and reinforcement improve by a measured amount."
 OT1_R_entente_liaison_spirit:0 "British Entente Liaison"
 OT1_R_entente_liaison_spirit_desc:0 "British and Ottoman officials keep a controlled channel for naval and commercial questions. Lower diplomatic costs reflect access without binding war entry."
 OT1_R_strait_guarantees_spirit:0 "Straits Guarantee Commission"
 OT1_R_strait_guarantees_spirit_desc:0 "The guarantee commission records inspections and coastal communications agreed by the governments. Naval coordination improves while the treaty remains in force."
 OT1_R_russian_consultation_spirit:0 "Russian Consultation Mission"
 OT1_R_russian_consultation_spirit_desc:0 "Ottoman and Russian representatives exchange mobilisation and frontier reports. Army experience grows slowly while the consultation remains active."
 OT1_R_neutral_diplomacy_spirit:0 "Neutral Diplomatic Service"
 OT1_R_neutral_diplomacy_spirit_desc:0 "Neutral envoys maintain trade contacts and publish the empire's obligations. Delaying costly justifications and improving trade opinions rewards the policy."
 OT1_R_neutral_ports_spirit:0 "Neutral Port Administration"
 OT1_R_neutral_ports_spirit_desc:0 "Port officials inspect military cargoes while keeping lawful merchants moving. Supply consumption falls slightly as manifests become predictable."
 OT1_R_balkan_mediation_spirit:0 "Balkan Mediation Office"
 OT1_R_balkan_mediation_spirit_desc:0 "Mediators track refugee routes and railway access during Balkan negotiations. Stability and political authority improve modestly while talks continue."
 OT1_R_italian_accommodation_spirit:0 "Italian Accommodation Mission"
 OT1_R_italian_accommodation_spirit_desc:0 "Commercial delegates record the Libyan and Mediterranean terms accepted by Italy. Better trade relations and lower domestic friction last for the negotiation period."
 OT1_R_regional_defence_spirit:0 "Regional Defence Secretariat"
 OT1_R_regional_defence_spirit_desc:0 "Regional officers share frontier reports and defensive timetables. Ottoman armies gain a small defensive and recovery benefit without an offensive mandate."
 OT1_R_persian_frontier_spirit:0 "Persian Frontier Commission"
 OT1_R_persian_frontier_spirit_desc:0 "Frontier commissioners coordinate customs and patrol notices with Persia and local authorities. Better reinforcement and supply discipline support the border dialogue."
 OT1_R_libyan_channels_spirit:0 "Libyan Liaison Channels"
 OT1_R_libyan_channels_spirit_desc:0 "Ottoman couriers and Senussi intermediaries keep local communications open after Ouchy. Local support improves army attack modestly without transferring territory."
 OT1_R_stability_council_spirit:0 "Imperial Stability Council"
 OT1_R_stability_council_spirit_desc:0 "The council records disputes between the Sultanate and Committee rather than hiding them. A modest stability and political-power gain lasts through the temporary session."
 OT1_R_naval_watch_spirit:0 "Dardanelles Naval Watch"
 OT1_R_naval_watch_spirit_desc:0 "Lookouts and harbour officers share reports on mines, straits traffic and foreign patrols. Naval coordination and detection improve for the watch's limited term."
 OT1_R_reforming_army:0 "An Army under Reorganisation"
 OT1_R_reforming_army_desc:0 "Inspection and revised administration have begun to address the army’s weaknesses. Officer shortages and unreliable supply still prevent the new regulations from reaching every formation."
 OT1_R_reorganised_army:0 "Uneven Military Modernisation"
 OT1_R_reorganised_army_desc:0 "Recruitment districts and staff procedures now give the army a stronger working organisation. Limited supply and uneven training remain obstacles that require continued practical reform."
 OT1_R_said_halim_ministry:0 "Grand Vizier: Said Halim Pasha"
 OT1_R_said_halim_ministry_desc:0 "Said Halim Pasha directs the cabinet while the Committee and military leaders retain substantial influence. Ministries bring their disputes to the Porte rather than issuing a succession of competing demands."
 OT1_R_talat_ministry:0 "Grand Vizier: Talat Pasha"
 OT1_R_talat_ministry_desc:0 "Talat Pasha holds the grand vizierate as prolonged war exhausts the administration. The cabinet faces the task of sustaining supply and authority amid mounting provincial discontent."
 OT1_R_governance_strained:0 "Strained Imperial Administration"
 OT1_R_governance_strained_desc:0 "One of the government’s institutions has fallen below 35. The resulting disputes raise civilian administrative costs until confidence and cooperation recover."
 OT1_R_governance_serious:0 "Serious Administrative Strain"
 OT1_R_governance_serious_desc:0 "One of the government’s institutions has fallen below 20. Administration and supply suffer while the cabinet restores a workable agreement with the affected representatives."
 OT1_R_governance_critical:0 "Critical Administrative Failure"
 OT1_R_governance_critical_desc:0 "One of the government’s institutions has fallen below 10. Restore cooperation between ministers, provinces and officers to recover the authority needed for ordinary administration."
 OT1_R_administration_aftermath:0 "Administration Crisis Aftermath"
 OT1_R_administration_aftermath_desc:0 "An institutional emergency has not been resolved within its deadline. Administrative disruption will affect confidence, infrastructure work and supply for 90 days while the government rebuilds cooperation."
 OT1_R_anatolian_rail_spirit:0 "Anatolian Rail Works"
 OT1_R_anatolian_rail_spirit_desc:0 "We coordinate anatolian rail works through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_customs_reform_spirit:0 "A Predictable Contract Administration"
 OT1_R_customs_reform_spirit_desc:0 "Regular accounts will make workshop contracts dependable. Better administration supports factory preparation without adding a separate debt or revenue simulation."
 OT1_R_zonguldak_coal_spirit:0 "Zonguldak Coal"
 OT1_R_zonguldak_coal_spirit_desc:0 "We coordinate zonguldak coal through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_tophane_procurement_spirit:0 "Ordnance Workshops First"
 OT1_R_tophane_procurement_spirit_desc:0 "Give Tophane and the Constantinople arsenals first claim on the industrial programme. An additional military line and production preparation compete with the civilian workshop priority."
 OT1_R_anatolian_textiles_spirit:0 "Civilian Workshops First"
 OT1_R_anatolian_textiles_spirit_desc:0 "Expand Bursa civilian production and give weaving and machinery firms the first major contracts. The programme chooses lasting civil capacity ahead of immediate ordnance expansion."
 OT1_R_istanbul_ports_spirit:0 "Constantinople Ports"
 OT1_R_istanbul_ports_spirit_desc:0 "We coordinate istanbul ports through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_baghdad_railway_spirit:0 "Baghdad Railway"
 OT1_R_baghdad_railway_spirit_desc:0 "We coordinate baghdad railway through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_ordnance_gauges_spirit:0 "Ordnance Gauges"
 OT1_R_ordnance_gauges_spirit_desc:0 "We coordinate ordnance gauges through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_bursa_looms_spirit:0 "Bursa Looms"
 OT1_R_bursa_looms_spirit_desc:0 "We coordinate bursa looms through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_hejaz_railway_spirit:0 "Hejaz Railway"
 OT1_R_hejaz_railway_spirit_desc:0 "We coordinate hejaz railway through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_aleppo_depots_spirit:0 "Aleppo Depots"
 OT1_R_aleppo_depots_spirit_desc:0 "We coordinate aleppo depots through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_mesopotamian_grain_spirit:0 "Mesopotamian Grain"
 OT1_R_mesopotamian_grain_spirit_desc:0 "We coordinate mesopotamian grain through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_coastal_repairs_spirit:0 "Coastal Repairs"
 OT1_R_coastal_repairs_spirit_desc:0 "We coordinate coastal repairs through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_war_procurement_spirit:0 "War Procurement"
 OT1_R_war_procurement_spirit_desc:0 "We coordinate war procurement through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_railway_priorities_spirit:0 "Railway Priorities"
 OT1_R_railway_priorities_spirit_desc:0 "We coordinate railway priorities through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_army_arsenals_spirit:0 "Army Arsenals"
 OT1_R_army_arsenals_spirit_desc:0 "We coordinate army arsenals through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_syrian_workshops_spirit:0 "Syrian Workshops"
 OT1_R_syrian_workshops_spirit_desc:0 "We coordinate syrian workshops through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_emergency_shipyards_spirit:0 "Emergency Shipyards"
 OT1_R_emergency_shipyards_spirit_desc:0 "We coordinate emergency shipyards through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_controlled_materials_spirit:0 "Controlled Materials"
 OT1_R_controlled_materials_spirit_desc:0 "We coordinate controlled materials through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_artillery_lines_spirit:0 "Artillery Lines"
 OT1_R_artillery_lines_spirit_desc:0 "We coordinate artillery lines through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_merchant_shipping_spirit:0 "Merchant Shipping"
 OT1_R_merchant_shipping_spirit_desc:0 "We coordinate merchant shipping through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_central_supply_spirit:0 "Central Supply"
 OT1_R_central_supply_spirit_desc:0 "We coordinate central supply through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_tophane_expansion_spirit:0 "Tophane Expansion"
 OT1_R_tophane_expansion_spirit_desc:0 "We coordinate tophane expansion through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_anatolian_school_spirit:0 "Industrial School"
 OT1_R_anatolian_school_spirit_desc:0 "We coordinate industrial school through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_industrial_mobilization_spirit:0 "Industrial Mobilization"
 OT1_R_industrial_mobilization_spirit_desc:0 "We coordinate industrial mobilization through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_postwar_conversion_spirit:0 "Postwar Conversion"
 OT1_R_postwar_conversion_spirit_desc:0 "We coordinate postwar conversion through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_imperial_logistics_spirit:0 "Imperial Logistics"
 OT1_R_imperial_logistics_spirit_desc:0 "We coordinate imperial logistics through measured Ottoman programmes. The effect supports practical capacity while the programme remains active."
 OT1_R_reserve_cadres_spirit:0 "Anatolian Reserve Cadres"
 OT1_R_reserve_cadres_spirit_desc:0 "Recruitment offices organise trained reserves around the existing population and district records. Consistent induction procedures help formations absorb replacements without treating a promise of manpower as an army already in the field."

 JP1_R_imperial_guard:0 "Imperial Guard Maneuvers"
 JP1_R_cabinet_procedure_spirit:0 "Cabinet Procedure"
 JP1_R_cabinet_procedure_spirit_desc:0 "Agreed procedures allow ministers to present a coherent programme to the Diet."
 JP1_R_prefectural_accounts_spirit:0 "Prefectural Records"
 JP1_R_prefectural_accounts_spirit_desc:0 "Consistent public records make local works easier to commission."
 JP1_R_genro_consultations_spirit:0 "Regular Genro Consultations"
 JP1_R_genro_consultations_spirit_desc:0 "The elder statesmen meet before cabinet appointments become public disputes. Their advice remains influential, but ministries receive a clear record of the programme they are expected to carry out."
 JP1_R_seiyukai_negotiation_spirit:0 "Negotiate with the Seiyukai"
 JP1_R_seiyukai_negotiation_spirit_desc:0 "The government seeks the support of party deputies for public works and appropriations. Agreements with the Seiyukai give the budget a parliamentary basis while preserving the sovereign’s role in choosing ministers."
 JP1_R_okuma_ministry_spirit:0 "Okuma’s Wartime Ministry"
 JP1_R_okuma_ministry_spirit_desc:0 "A broader parliamentary cabinet can direct the European war’s opportunities without handing every foreign question to the army. Give Okuma’s ministers the means to coordinate commercial and diplomatic policy."
 JP1_R_ministerial_liaisons_spirit:0 "Civil and Service Liaisons"
 JP1_R_ministerial_liaisons_spirit_desc:0 "Army and navy ministries exchange procurement schedules with the finance and foreign ministries. A shared account of resources prevents separate departments from promising the same ships and rail capacity."
 JP1_R_terauchi_coordination_spirit:0 "Terauchi’s Administrative Cabinet"
 JP1_R_terauchi_coordination_spirit_desc:0 "Officials coordinate wartime contracts and continental policy through a single ministry. Stronger administrative control demands more political effort as overseas commitments expand."
 JP1_R_civilian_transition_spirit:0 "Prepare a Party Cabinet"
 JP1_R_civilian_transition_spirit_desc:0 "A ministry cannot indefinitely govern through bureaucratic contacts alone. Open negotiations with party leaders and bring the administration’s commitments before deputies who will have to finance them."
 JP1_R_hara_ministry_spirit:0 "Hara’s Party Ministry"
 JP1_R_hara_ministry_spirit_desc:0 "The political centre moves toward a cabinet backed by the Seiyukai. Hara’s ministers inherit colonial obligations, strained public confidence and a budget enlarged by the war."
 JP1_R_diet_petitions_spirit:0 "Receive the Diet Petitions"
 JP1_R_diet_petitions_spirit_desc:0 "Public meetings insist that constitutional government cannot survive when ministries are dismissed through private service disputes. Bring those complaints into parliamentary committees before the streets become the only place to be heard."
 JP1_R_party_compacts_spirit:0 "Agree a Parliamentary Programme"
 JP1_R_party_compacts_spirit_desc:0 "Party leaders negotiate an appropriation programme and rules for cabinet support. The coalition gains a common agenda rather than depending on agreement over one disputed minister."
 JP1_R_civilian_appointments_spirit:0 "Civilian Control of Appointments"
 JP1_R_civilian_appointments_spirit_desc:0 "Ministerial vacancies must be filled according to an agreed procedure. The services retain professional command, but their refusal to nominate officers cannot automatically dissolve a civilian cabinet."
 JP1_R_electoral_registers_spirit:0 "Reconcile the Electoral Registers"
 JP1_R_electoral_registers_spirit_desc:0 "Officials review the tax and residence records used to determine voting rights. Broader, consistent registration gives a prospective electoral reform an administrative foundation."
 JP1_R_industrial_arbitration_spirit:0 "Industrial Arbitration Boards"
 JP1_R_industrial_arbitration_spirit_desc:0 "Employers and workers bring disputes before boards with published procedures. Arbitration protects important contracts while acknowledging that police action alone cannot resolve wages and working conditions."
 JP1_R_responsible_ministers_spirit:0 "Ministers Answer to the Diet"
 JP1_R_responsible_ministers_spirit_desc:0 "A cabinet presents regular reports on expenditure and foreign commitments. Parliamentary supervision makes expansion harder to conceal and strengthens the government’s authority to refuse unfunded adventures."
 JP1_R_party_government_spirit:0 "A Durable Party Government"
 JP1_R_party_government_spirit_desc:0 "The coalition establishes a working relationship between the imperial appointment of ministers and their responsibility to elected deputies. Foreign policy remains a national choice, but it must now be defended in public."
 JP1_R_service_ministers_spirit:0 "Secure the Service Ministries"
 JP1_R_service_ministers_spirit_desc:0 "Defence ministers receive a coordinated brief rather than separate promises from competing patrons. The army and navy must present their requirements against the resources the treasury can actually provide."
 JP1_R_mobilisation_board_spirit:0 "Establish a Mobilisation Board"
 JP1_R_mobilisation_board_spirit_desc:0 "A board records rail capacity, depots and industrial contracts for an overseas campaign. Civil administration supplies the figures that military planning has too often treated as unlimited."
 JP1_R_continental_staff_spirit:0 "A Continental Planning Staff"
 JP1_R_continental_staff_spirit_desc:0 "The staff studies the distance between Korean ports, Manchurian railways and prospective Russian battlefields. Planning for a second continental war begins with transport, replacement schedules and a realistic line of retreat."
 JP1_R_war_appropriations_spirit:0 "Vote the War Appropriations"
 JP1_R_war_appropriations_spirit_desc:0 "The ministry asks the Diet to finance an expanded campaign. New military contracts increase output while diverting civilian resources and political attention from domestic improvements."
 JP1_R_imperial_service_council_spirit:0 "An Imperial Service Council"
 JP1_R_imperial_service_council_spirit_desc:0 "The throne receives a joint account of army and naval commitments. A service council can coordinate strategy only if its members surrender the habit of arranging rival campaigns independently."
 JP1_R_civil_administrators_spirit:0 "Attach Civil Administrators"
 JP1_R_civil_administrators_spirit_desc:0 "An army can take territory without understanding how to govern it. Civil administrators accompany headquarters to organise local records, contracts and communication with provincial authorities."
 JP1_R_continental_mandate_spirit:0 "A Mandate for Continental War"
 JP1_R_continental_mandate_spirit_desc:0 "The cabinet accepts responsibility for the long campaign demanded by the continental staff. Authorise sustained preparations while keeping the civilian cost visible to the government that must maintain them."
 JP1_R_crown_and_diet_spirit:0 "Convene the Crown and Diet Council"
 JP1_R_crown_and_diet_spirit_desc:0 "Representatives of the chamber and the palace agree a regular channel for disputed appointments. A council reduces the temptation to resolve every disagreement through an abrupt cabinet resignation."
 JP1_R_joint_estimates_spirit:0 "Publish Joint Service Estimates"
 JP1_R_joint_estimates_spirit_desc:0 "The army and navy submit requirements in one budget document. Their programmes remain distinct, but the government can now compare them against a common industrial and financial account."
 JP1_R_arbitration_commission_spirit:0 "A Commission for Ministerial Disputes"
 JP1_R_arbitration_commission_spirit_desc:0 "A public procedure establishes who hears a dispute before it paralyses the government. The commission’s authority rests on consent from both the services and the parliamentary parties."
 JP1_R_prefectural_councils_spirit:0 "Hear the Prefectural Councils"
 JP1_R_prefectural_councils_spirit_desc:0 "Local officials and elected representatives explain how national contracts affect their districts. Ministries revise schedules before a distant policy becomes an intolerable local obligation."
 JP1_R_constitutional_charter_spirit:0 "Ratify a Cabinet Charter"
 JP1_R_constitutional_charter_spirit_desc:0 "The palace confirms the cabinet’s procedures, the Diet’s appropriation powers and the professional duties of the services. The settlement gives each institution a defined responsibility rather than an unlimited veto."
 JP1_R_review_overseas_commitments_spirit:0 "Review Overseas Commitments"
 JP1_R_review_overseas_commitments_spirit_desc:0 "Ministers compare occupied territory, naval stations and allied promises with the resources assigned to maintain them. The council can distinguish a useful foothold from a commitment that consumes the state."
 JP1_R_imperial_settlement_spirit:0 "An Imperial Constitutional Settlement"
 JP1_R_imperial_settlement_spirit_desc:0 "The compromise survives its first disputed appointments and becomes ordinary practice. National strategy now proceeds through a cabinet that can answer both the sovereign and the representatives of the country."
 JP1_R_public_services_spirit:0 "District Public Works"
 JP1_R_public_services_spirit_desc:0 "Ministries commission local works through established prefectural offices."
 JP1_R_labour_inspection_spirit:0 "Industrial Inspection"
 JP1_R_labour_inspection_spirit_desc:0 "Regular inspections reduce avoidable interruptions in growing industrial districts."
 JP1_R_rural_credit_spirit:0 "Rural Credit Associations"
 JP1_R_rural_credit_spirit_desc:0 "Local credit finances transport and public works outside the largest cities."
 JP1_R_price_relief_spirit:0 "Emergency Price Relief"
 JP1_R_price_relief_spirit_desc:0 "A temporary relief programme addresses the public consequences of wartime price rises."
 JP1_R_veterans_bureau_spirit:0 "Veterans’ Employment Bureau"
 JP1_R_veterans_bureau_spirit_desc:0 "The bureau supports the orderly return of trained men to civilian employment."
 JP1_R_postwar_delegation_spirit:0 "Postwar Delegation"
 JP1_R_postwar_delegation_spirit_desc:0 "The delegation coordinates the country’s claims and obligations in negotiations."
 JP1_R_civil_government_spirit:0 "Ordinary Ministerial Government"
 JP1_R_civil_government_spirit_desc:0 "Ministries resume their regular duties after the wartime emergency."
 JP1_R_rice_unrest_spirit:0 "Wartime Price Unrest"
 JP1_R_rice_unrest_spirit_desc:0 "Rapid price rises and speculative stockpiling have brought household grievances into the streets. Ministers face pressure to fund relief and explain the cost of overseas commitments."
 JP1_R_industrial_effort_spirit:0 "Coordinate the Industrial Ministries"
 JP1_R_industrial_effort_spirit_desc:0 "The ministries will establish one programme for tools, transport and naval orders. A short construction programme prepares private workshops to meet public contracts."
 JP1_R_kyushu_coal_spirit:0 "Open the Kyushu Coal Ledger"
 JP1_R_kyushu_coal_spirit_desc:0 "Kyushu pits feed the railways and furnaces; a national ledger will direct wagons to the works that can use them. This timed programme leaves a measurable gain while it lasts."
 JP1_R_yahata_iron_spirit:0 "Secure Yahata Iron"
 JP1_R_yahata_iron_spirit_desc:0 "Yahata connects imported ore to Japanese steel; coke, rolling stock and contracts will serve those furnaces. This timed programme leaves a measurable gain while it lasts."
 JP1_R_railway_bureau_spirit:0 "A National Freight Timetable"
 JP1_R_railway_bureau_spirit_desc:0 "Passenger traffic, coal trains and army wagons need a single timetable. The railway bureau will reduce supply waste while preparing the next round of infrastructure work."
 JP1_R_merchant_marine_spirit:0 "Register the Merchant Marine"
 JP1_R_merchant_marine_spirit_desc:0 "Register cargo capacity and reserve crews so commercial shipping can support overseas commitments. The programme adds transports and improves the organisation of merchant work."
 JP1_R_great_war_exports_spirit:0 "The Export Opportunity"
 JP1_R_great_war_exports_spirit_desc:0 "Foreign orders can finance new machine tools and reorganise production. The export programme brings faster industrial research, while committing the ministries to an outward-facing investment policy."
 JP1_R_wartime_munitions_bureau_spirit:0 "A Unified Munitions Bureau"
 JP1_R_wartime_munitions_bureau_spirit_desc:0 "Join the armament standard to the freight timetable. The bureau directs output toward service requirements while keeping the industrial and railway programmes under one set of priorities."
 JP1_R_shell_steel_quotas_spirit:0 "Set Shell Steel Quotas"
 JP1_R_shell_steel_quotas_spirit_desc:0 "Steel for guns cannot compete blindly with rails and ships, so quotas reserve a share for shells. This timed programme leaves a measurable gain while it lasts."
 JP1_R_wartime_rail_priority_spirit:0 "Give Railways Wartime Priority"
 JP1_R_wartime_rail_priority_spirit_desc:0 "Military cargo receives a priority code while civilian traffic continues where capacity allows. This timed programme leaves a measurable gain while it lasts."
 JP1_R_wartime_arms_call_spirit:0 "Call the Wartime Arms Register"
 JP1_R_wartime_arms_call_spirit_desc:0 "The state will record every available line, tool and trained crew. This timed programme leaves a measurable gain while it lasts."
 JP1_R_postwar_reconversion_spirit:0 "Plan Postwar Reconversion"
 JP1_R_postwar_reconversion_spirit_desc:0 "When guns fall silent, factories must return to civilian orders without losing skilled workers. This timed programme leaves a measurable gain while it lasts."
 JP1_R_demobilization_ledger_spirit:0 "Draft the Demobilization Ledger"
 JP1_R_demobilization_ledger_spirit_desc:0 "Ministries will record contracts, crews and stocks before emergency orders expire. This timed programme leaves a measurable gain while it lasts."
 JP1_R_final_demobilization_spirit:0 "Complete Final Demobilization"
 JP1_R_final_demobilization_spirit_desc:0 "Japan will close emergency offices, settle books and preserve productive skills for peace. This timed programme leaves a measurable gain while it lasts."
 JP1_R_overseas_administration_spirit:0 "Administer the Overseas Territories"
 JP1_R_overseas_administration_spirit_desc:0 "Tokyo will administer territories already under Japanese authority through records, roads and accountable offices; acquisitions belong to diplomacy. This timed programme leaves a measurable gain while it lasts."
 JP1_R_korea_investment_spirit:0 "Invest in Korean Workshops"
 JP1_R_korea_investment_spirit_desc:0 "Korean workshops can expand repair and light industry; capacity buys cooperation without free cores. This timed programme leaves a measurable gain while it lasts."
 JP1_R_korea_exploitation_spirit:0 "Exploit Korean Deliveries"
 JP1_R_korea_exploitation_spirit_desc:0 "Requisitioning grain, timber and rail capacity brings an immediate margin but hardens resistance. This timed programme leaves a measurable gain while it lasts."
 JP1_R_taiwan_investment_spirit:0 "Invest in Taiwan Ports"
 JP1_R_taiwan_investment_spirit_desc:0 "Taiwan's port workshops and agriculture can support a durable Pacific network where Japan controls the state. This timed programme leaves a measurable gain while it lasts."
 JP1_R_korea_compliance_spirit:0 "Build Korean Compliance Offices"
 JP1_R_korea_compliance_spirit_desc:0 "A named petition channel beside the garrisons can make orders more predictable. This timed programme leaves a measurable gain while it lasts."
 JP1_R_taiwan_compliance_spirit:0 "Extend Taiwan Civil Registers"
 JP1_R_taiwan_compliance_spirit_desc:0 "Predictable records, taxes and supplies can lower friction in Taiwan's established administration. This timed programme leaves a measurable gain while it lasts."
 JP1_R_overseas_reserve_spirit:0 "Create an Overseas Reserve"
 JP1_R_overseas_reserve_spirit_desc:0 "Engineers, police and shipping crews will support territories already held when war turns east. This timed programme leaves a measurable gain while it lasts."
 JP1_R_asian_war_program_spirit:0 "Coordinate the Asian War Programme"
 JP1_R_asian_war_program_spirit_desc:0 "In major war, cabinet will coordinate garrisons, railways and shipyards around territories it actually controls. This timed programme leaves a measurable gain while it lasts."
