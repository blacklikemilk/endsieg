    GE1_reichstag_compromise: "Reichstag Compromise"
    GE1_reichstag_compromise_desc: "The Imperial government accepts parliamentary cooperation to sustain the war effort. Political confidence improves, but concessions limit the government's room for maneuver."
    GE1_war_materials_board: "War Materials Board"
    GE1_war_materials_board_desc: "A central board coordinates scarce imports, domestic substitutes, and factory priorities. Resource purchases are more efficient, though the bureaucracy consumes part of civilian output."
    GE1_ersatz_industry: "Ersatz Industry"
    GE1_ersatz_industry_desc: "German firms are replacing blocked imports with domestic substitutes. Arms and construction output improve modestly while civilian consumption remains constrained."
    GE1_hindenburg_program_spirit: "Hindenburg Programme"
    GE1_hindenburg_program_spirit_desc: "The Hindenburg Programme concentrates labour and armaments under military direction. Production rises, but the programme strains civilian life and political cohesion."
    GE1_auxiliary_service_spirit: "Auxiliary Service"
    GE1_auxiliary_service_spirit_desc: "The Auxiliary Service Law organizes civilian labour for the war economy. Mobilization is faster and arms output improves, at the cost of domestic stability."
    GE1_civilian_cabinet: "Civilian Cabinet"
    GE1_civilian_cabinet_desc: "Civilian ministers and the Reichstag retain meaningful influence over wartime administration, preserving legitimacy while slowing military planning."
    GE1_military_cabinet: "Military Cabinet"
    GE1_military_cabinet_desc: "The High Command directs the war effort with fewer parliamentary restraints. Staff planning and army organization improve while political confidence suffers."
    GE1_rationing_system: "National Rationing System"
    GE1_rationing_system_desc: "Food and fuel are distributed by a national rationing system. It reduces consumer demand on the wartime economy, but the population bears the burden."
    GE1_blockade_relief: "Blockade Relief Measures"
    GE1_blockade_relief_desc: "Neutral channels and domestic substitutes soften the North Sea blockade. Imported resources are less costly and public confidence recovers slightly."
    GE1_stormtroop_training: "Stormtroop Training"
    GE1_stormtroop_training_desc: "Special assault detachments are trained for infiltration and shock action. Their attack power improves, but training demands and reduced cohesion limit sustained operations."
    GE1_offensive_preparations: "Offensive Preparations"
    GE1_offensive_preparations_desc: "Staffs and supply depots are prepared for a limited offensive. Planning and attack improve temporarily while the operation consumes more supplies and civilian capacity."
    GE1_turnip_winter: "Turnip Winter"
    GE1_turnip_winter_desc: "The 1916-17 food crisis has reached the cities. Scarcity damages public confidence and war support while forcing more of the economy into civilian consumption."
    GE1_strike_wave: "Strike Wave"
    GE1_strike_wave_desc: "Industrial strikes are disrupting arms production and weakening confidence in the Imperial government. Production, stability, and war support all suffer until a settlement is reached."
    GE1_war_bonds_drive: "War Bonds Drive"
    GE1_war_bonds_drive_desc: "A public loan campaign finances the war and strengthens resolve, but future political capital and civilian consumption are committed to servicing the debt."
    GE1_labor_compromise: "Labour Compromise"
    GE1_labor_compromise_desc: "Trade unions receive a formal voice in wartime production. The settlement improves stability while limiting the maximum pace of arms production."
    GE1_materials_recovery_drive: "Materials Recovery Drive"
    GE1_materials_recovery_drive_desc: "A short campaign recovers scarce materials and reorganizes factory inputs. Trade efficiency and production control improve, but civilian consumption rises."
    GE1_ersatz_contract_drive: "Ersatz Contract Drive"
    GE1_ersatz_contract_drive_desc: "Emergency contracts push firms toward domestic substitutes. Arms and construction output rise modestly while civilian goods are diverted."
    GE1_industrial_mobilisation_drive: "Industrial Mobilisation Drive"
    GE1_industrial_mobilisation_drive_desc: "A focused mobilisation campaign concentrates labour and machine time on armaments. Output improves, but civilian demand and stability suffer."
    GE1_blockade_supply_drive: "Blockade Supply Drive"
    GE1_blockade_supply_drive_desc: "A temporary campaign coordinates neutral purchases and domestic substitutes to relieve the blockade. Imports cost less and public confidence improves slightly."
    GE1_stormtroop_preparations: "Stormtroop Preparations"
    GE1_stormtroop_preparations_desc: "Short-term assault preparations improve shock attacks, but the extra training burden reduces organization and slows readiness."
