l_english:
 AUH_stab_ui_title:0 "The Multi-Ethnic Empire"
 AUH_stab_ui_summary:0 "Discontent: §Y[?AUH_stab_average|0]§!/100  |  Reform work: §Y[?AUH_stab_months|0]§! months"
 AUH_stab_ui_summary_tt:0 "§YThe Imperial Council§!\nThe discontent of the lands still governed from Vienna contributes to the burdens of the monarchy.\n\nActive programmes: §Y[?AUH_stab_active_programmes|0]§!/2\nConsolidation: §Y[?AUH_stab_consolidation_months|0]§!/12 consecutive peaceful months\n\nA lasting settlement requires a ratified constitution and completed local implementation in every directly governed region. Food security must be at least §Y50§!, and discontent in every region must remain below §Y25§!.\n\nAfter §Y48 months§! of reform work, uphold all of these conditions for §Y12 consecutive peaceful months§!.\n\nThe council must maintain the settlement once achieved. War, shortages and renewed unrest can still threaten the monarchy.\n\nA region leaves the discontent average only when none of its assigned states remain ours.\n\n§YTerritory and administration§!\nEach state is shown separately. Owned states carry the discontent colour of their region. Grey states are outside our rule and receive no regional penalties.\n\nHatching marks owned states that are not fully under our control, including contested territory. Military occupation alone does not restore ownership of a ceded state.\n\nA region remains in the discontent average while we own any of its assigned states. Select a numbered land or a row below to view its available measures."
 AUH_stab_ui_select_hint:0 "Grey: ceded  |  Hatched: occupied or contested"
