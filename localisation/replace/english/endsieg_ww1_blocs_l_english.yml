 GE1_ww1_russian_faction:0 "Berlin-Petrograd Pact"
 endsieg_ww1_bloc.1.t:0 "The German-Russian Pact"
 endsieg_ww1_bloc.1.d:0 "Germany has proposed a formal alliance following our earlier understanding. The government must decide whether a common military commitment serves Russia's interests or whether relations with Berlin should remain on a diplomatic footing."
 endsieg_ww1_bloc.1.a:0 "Ratify the alliance."
 endsieg_ww1_bloc.1.b:0 "Retain the diplomatic understanding alone."
