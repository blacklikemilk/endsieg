    INT_germany: "Germany: The Interwar Years"
    INT_GER_political_turmoil: "A Nation in Turmoil"
    INT_GER_political_turmoil_desc: "The armistice has ended the war, but hunger, demobilization and political violence threaten the peace at home."
    INT_GER_food_relief: "Emergency Food Relief"
    INT_GER_food_relief_desc: "Food imports and public works can ease the hardship left by blockade and demobilization."
    INT_GER_reichswehr_compromise: "The Reichswehr Compromise"
    INT_GER_reichswehr_compromise_desc: "A small professional army must remain loyal to the state while the new political order takes shape."
    INT_GER_reconstitute_civil_service: "Reconstitute the Civil Service"
    INT_GER_reconstitute_civil_service_desc: "Preserve the administrative machinery needed to govern after imperial collapse while bringing it under the new constitutional order."
    INT_GER_rebuild_economy: "Rebuild the Economy"
    INT_GER_rebuild_economy_desc: "Convert wartime capacity to civilian production and restore confidence in German industry."
    INT_GER_reparations_crisis: "Confront the Reparations Crisis"
    INT_GER_reparations_crisis_desc: "Phase II - Stabilization. Reparations demands strain the treasury while businesses struggle to plan ahead. Secure the authority to negotiate a path through the crisis and toward monetary stabilization."
    INT_GER_end_ruhr_resistance: "End Passive Resistance in the Ruhr"
    INT_GER_end_ruhr_resistance_desc: "The occupation and the costly policy of passive resistance have pushed the economy toward collapse. Ending the campaign makes monetary reform possible."
    INT_GER_retain_the_republic: "Retain the Republic"
    INT_GER_retain_the_republic_desc: "The parliamentary republic offers a peaceful way through the postwar crisis. Friedrich Ebert will lead the transition."
    INT_GER_hold_national_assembly_1919: "Adopt the Weimar Constitution"
    INT_GER_hold_national_assembly_1919_desc: "The National Assembly can secure civil rights and establish the institutions of the new republic."
    INT_GER_establish_the_reichstag: "Empower the Reichstag"
    INT_GER_establish_the_reichstag_desc: "Give parliament the means to govern through coalition and public debate."
    INT_GER_defeat_kapp_putsch: "Defeat the Kapp Putsch"
    INT_GER_defeat_kapp_putsch_desc: "A general strike and loyal institutions can resist the attempted coup of March 1920."
    INT_GER_stabilize_currency: "Stabilize the Mark"
    INT_GER_stabilize_currency_desc: "Phase II - Stabilization. End the inflationary spiral and restore confidence in wages, savings and commercial contracts. Monetary reform opens the way to the investment choices of the Roaring Twenties."
    INT_GER_modernize_industry: "Modernize German Industry"
    INT_GER_modernize_industry_desc: "Replace worn machinery and reorganize civilian production. Modernization opens a one-time machinery investment decision alongside the immediate expansion of industrial capacity."
    INT_GER_unemployment_insurance: "Establish Unemployment Insurance"
    INT_GER_unemployment_insurance_desc: "A national insurance system can soften the impact of job losses, though its benefits will place new demands on the budget."
    INT_GER_expand_exports: "Expand Export Markets"
    INT_GER_expand_exports_desc: "Rebuild commercial links for German machinery and manufactured goods. Export expansion can proceed independently of the unemployment insurance program, opening the way to an export guarantee scheme."
    INT_GER_dawes_plan: "Accept the Dawes Plan"
    INT_GER_dawes_plan_desc: "A revised reparations schedule and foreign credit can support German recovery."
    INT_GER_elect_hindenburg: "Hindenburg's Presidency"
    INT_GER_elect_hindenburg_desc: "The 1925 presidential election brings Paul von Hindenburg to the head of the republic."
    INT_GER_locarno_treaties: "Sign the Locarno Treaties"
    INT_GER_locarno_treaties_desc: "Accept the western borders and improve relations with France, Belgium and Britain."
    INT_GER_join_league_of_nations: "Join the League of Nations"
    INT_GER_join_league_of_nations_desc: "Germany's admission in 1926 restores a seat in international diplomacy after years of isolation."
    INT_GER_young_plan_focus: "Negotiate the Young Plan"
    INT_GER_young_plan_focus_desc: "Seek another revision of the reparations schedule to ease pressure on the German economy."
    INT_GER_presidential_cabinet_focus: "The Presidential Cabinets"
    INT_GER_presidential_cabinet_focus_desc: "The depression and collapsing coalitions have shifted power toward emergency presidential government."
    INT_GER_defend_democracy: "Defend Parliamentary Democracy"
    INT_GER_defend_democracy_desc: "Restore parliamentary legitimacy and resist those who would end the republic."
    INT_GER_appoint_hitler: "Appoint Hitler Chancellor"
    INT_GER_appoint_hitler_desc: "Hindenburg appoints Adolf Hitler chancellor in January 1933, opening the way to dictatorship."
    INT_GER_merge_presidency_chancellorship: "Unite the Offices"
    INT_GER_merge_presidency_chancellorship_desc: "President Hindenburg has died. The presidency and chancellorship are now combined under Hitler, ending the last formal division of power at the head of the Reich."
    INT_GER_reichswehr_oath: "The Reichswehr's Personal Oath"
    INT_GER_reichswehr_oath_desc: "Germany's soldiers swear loyalty to Hitler personally after he assumes the powers of president and chancellor."
    INT_GER_mefo_bills_focus: "Introduce MEFO Bills"
    INT_GER_mefo_bills_focus_desc: "Schacht's MEFO bills finance rearmament through a concealed system of promissory notes. Their payments will become a mounting obligation."
    INT_GER_republican_recovery: "A Republican Recovery"
    INT_GER_republican_recovery_desc: "A functioning parliament can pursue industrial recovery without surrendering democratic institutions."
    INT_GER_european_security_accord: "A European Security Accord"
    INT_GER_european_security_accord_desc: "Seek an agreed end to military restrictions with France and Britain while keeping the Rhineland demilitarized."
    INT_GER_european_security_accord_tt: "The Reichswehr division limit and reparations end. The Rhineland remains demilitarized."
    INT_GER_gleichschaltung: "Consolidate the Dictatorship"
    INT_GER_gleichschaltung_desc: "The new regime destroys political opposition and centralizes power."
    INT_GER_rearmament_1935: "Reintroduce Conscription"
    INT_GER_rearmament_1935_desc: "Open rearmament and conscription violate Versailles, while the Rhineland remains demilitarized until a separate decision."
    INT_GER_rearmament_1935_tt: "The Reichswehr division limit and reparations end. The Rhineland remains demilitarized."
    INT_GER_a_new_leaf: "A Socialist Republic"
    INT_GER_a_new_leaf_desc: "The revolutionary left replaces the Weimar government with a socialist state."
    INT_GER_workers_councils: "Organize Workers' Councils"
    INT_GER_workers_councils_desc: "Give workers' councils a place in the new government and secure support for the transition."
    INT_GER_socialize_industry: "Socialize Heavy Industry"
    INT_GER_socialize_industry_desc: "Bring key industries under public direction and reorganize production."
    INT_GER_red_reichswehr_focus: "A Red Reichswehr"
    INT_GER_red_reichswehr_focus_desc: "Rebuild the army around the new government's political and military priorities."
    INT_GER_peoples_republic: "Consolidate the People's Republic"
    INT_GER_peoples_republic_desc: "Stabilize the revolutionary government and define its long-term institutions."
    INT_GER_military_research_with_the_soviets: "The Rapallo Opening"
    INT_GER_military_research_with_the_soviets_desc: "The Rapallo treaty restores diplomatic relations with Soviet Russia and settles outstanding wartime claims. Cooperation can now grow without binding either country to a military alliance."
    INT_GER_eastern_trade_commissions: "Eastern Trade Commissions"
    INT_GER_eastern_trade_commissions_desc: "Joint commercial missions can reopen markets and exchange industrial expertise across the German-Soviet frontier."
    INT_GER_reichswehr_red_army_contacts: "Reichswehr–Red Army Contacts"
    INT_GER_reichswehr_red_army_contacts_desc: "Quiet staff contacts keep military knowledge moving between two armies constrained by different political and strategic pressures."
    INT_GER_berlin_treaty: "The Berlin Treaty"
    INT_GER_berlin_treaty_desc: "A friendship and neutrality treaty reassures Moscow that Germany’s western diplomacy has not ended the relationship begun at Rapallo."
    INT_GER_lipetsk_training: "The Lipetsk Flight School"
    INT_GER_lipetsk_training_desc: "A covert training and testing site in Soviet Russia helps German aviators preserve skills prohibited by the Versailles settlement."
    INT_GER_armored_trials_in_the_east: "Armored Trials in the East"
    INT_GER_armored_trials_in_the_east_desc: "Secret exercises and technical trials on Soviet soil allow the Reichswehr to study armored warfare without openly breaking its treaty limits."
    INT_GER_saar_plebiscite: "The Saar Plebiscite"
    INT_GER_saar_plebiscite_desc: "After the 1935 vote, bring the Saar back under German administration while maintaining its demilitarized status."
    INT_GER_dismantle_the_republic: "Dismantle the Republic"
    INT_GER_dismantle_the_republic_desc: "Conservative elites seize the postwar crisis as an opportunity to end parliamentary rule."
    INT_GER_rally_old_elites: "Rally the Old Elites"
    INT_GER_rally_old_elites_desc: "Draw on the support of monarchists, officers and the traditional administration."
    INT_GER_federal_compromise: "A Federal Compromise"
    INT_GER_federal_compromise_desc: "Negotiate the role of the German states in a restored monarchy."
    INT_GER_secure_officer_corps: "Secure the Officer Corps"
    INT_GER_secure_officer_corps_desc: "Win the army's support before deciding the crown's constitutional powers."
    INT_GER_state_of_the_nation: "State of the Nation"
    INT_GER_state_of_the_nation_desc: "Decide whether a restored crown will share power or rule without parliament."
    INT_GER_continuation_of_democracy: "A Constitutional Monarchy"
    INT_GER_continuation_of_democracy_desc: "Restore the Kaiser under a constitution and retain elections."
    INT_GER_instate_new_monarchy: "Restore the Monarchy"
    INT_GER_instate_new_monarchy_desc: "Return Wilhelm II to the throne and replace the republic with imperial rule."
    INT_GER_power_to_the_new_kaiser: "Imperial Authority"
    INT_GER_power_to_the_new_kaiser_desc: "Concentrate authority around the restored Kaiser and his government."
    INT_GER_undermine_versailles: "Undermine Versailles"
    INT_GER_undermine_versailles_desc: "Prepare to challenge the postwar settlement despite the diplomatic and domestic risks."
    INT_GER_clandestine_staff_training: "Clandestine Staff Exercises"
    INT_GER_clandestine_staff_training_desc: "Officers can preserve operational knowledge through restricted exercises and informal instruction despite the treaty's limits."
    INT_GER_secret_armaments: "Secret Armaments Contracts"
    INT_GER_secret_armaments_desc: "Dispersed industrial contracts give the army a small base for future production while the treaty still forbids open rearmament."
    INT_GER_prepare_treaty_revision: "Prepare to Renounce the Military Clauses"
    INT_GER_prepare_treaty_revision_desc: "Build political support and coordinate the officer corps before a public challenge to the treaty restrictions."
    INT_GER_repudiate_versailles: "Repudiate Versailles"
    INT_GER_repudiate_versailles_desc: "Reject the treaty's military and economic restrictions while postponing the remilitarization of the Rhineland."
    INT_GER_repudiate_versailles_tt: "The Reichswehr division limit and reparations end. The Rhineland remains demilitarized."
    INT_GER_reintegrate_veterans: "Reintegrate the Veterans"
    INT_GER_reintegrate_veterans_desc: "Millions of returning soldiers need work, housing and a place in civilian life. A deliberate demobilization program can prevent the army's collapse from becoming a lasting social crisis."

    INT_GER_restore_transport_links: "Restore the Transport Links"
    INT_GER_restore_transport_links_desc: "Repair the railways and freight networks disrupted by war and blockade so food and raw materials can reach the factories again."

    INT_GER_municipal_reconstruction: "Municipal Reconstruction"
    INT_GER_municipal_reconstruction_desc: "Town councils are best placed to reopen schools, utilities and local services after years of war."

    INT_GER_veterans_assistance: "Veterans' Assistance"
    INT_GER_veterans_assistance_desc: "Support disabled veterans and families of the fallen, while employment assistance helps able returning soldiers rejoin civilian life and the trained reserve."

    INT_GER_state_elections: "Elections in the German States"
    INT_GER_state_elections_desc: "The republic must take root beyond Berlin. Competitive state elections give the new order a local foundation."

    INT_GER_coalition_bargaining: "Build a Governing Coalition"
    INT_GER_coalition_bargaining_desc: "Agreement among the republican parties will keep ministries functioning while the Reichstag confronts postwar disorder."

    INT_GER_safeguard_civil_rights: "Safeguard Civil Rights"
    INT_GER_safeguard_civil_rights_desc: "The constitution's guarantees mean little unless courts and state governments protect them in practice."

    INT_GER_social_partnership: "A Social Partnership"
    INT_GER_social_partnership_desc: "Bring employers and trade unions to the bargaining table to settle disputes without paralysing reconstruction."

    INT_GER_expand_universities: "Rebuild the Universities"
    INT_GER_expand_universities_desc: "Scientific institutes and technical colleges can train a generation of engineers for a peaceful industrial recovery."

    INT_GER_public_broadcasting: "A National Radio Network"
    INT_GER_public_broadcasting_desc: "Radio broadcasting can connect distant regions and make public debate accessible beyond the printed press."

    INT_GER_reichsbahn_reform: "Reorganize the Reichsbahn"
    INT_GER_reichsbahn_reform_desc: "Modern freight administration can move Ruhr coal and industrial goods more efficiently across the republic."

    INT_GER_support_mittelstand: "Support the Mittelstand"
    INT_GER_support_mittelstand_desc: "Small workshops and family firms need access to credit and stable contracts after years of inflation."

    INT_GER_chemical_industry: "Renew the Chemical Industry"
    INT_GER_chemical_industry_desc: "Germany's chemical firms can again lead in industrial processes if research and production are rebuilt together."

    INT_GER_housing_construction: "Expand Workers' Housing"
    INT_GER_housing_construction_desc: "Housing shortages hold back urban recovery. Support municipal construction and open a one-time housing project that eases hardship while placing demands on current resources."

    INT_GER_rationalize_production: "Rationalize Production"
    INT_GER_rationalize_production_desc: "Standardized methods and new machinery can make the recovering factories competitive in foreign markets."

    INT_GER_industrial_safety: "Industrial Safety Standards"
    INT_GER_industrial_safety_desc: "Safer workplaces will protect the skilled workforce on which recovery depends."

    INT_GER_railway_workers_councils: "Railway Workers' Councils"
    INT_GER_railway_workers_councils_desc: "The councils will bring railway labor into the socialist administration without halting essential traffic."

    INT_GER_communal_relief: "Communal Relief Committees"
    INT_GER_communal_relief_desc: "Local councils can distribute food and fuel while the new government rebuilds its administrative reach."

    INT_GER_red_militias: "Organize the Red Militias"
    INT_GER_red_militias_desc: "Revolutionary volunteers need training and a clear chain of command if they are to defend the new republic."

    INT_GER_collectivize_transport: "Public Control of Transport"
    INT_GER_collectivize_transport_desc: "Coordinated rail and freight planning can keep coal, food and factory inputs moving during the transition."

    INT_GER_local_soviets: "Federal Councils of Workers"
    INT_GER_local_soviets_desc: "Regional councils can represent workers while a central government coordinates defense and trade."

    INT_GER_socialist_science: "Science for the People's Republic"
    INT_GER_socialist_science_desc: "Public research institutes can direct technical training toward civilian reconstruction."

    INT_GER_princes_congress: "Convene the German Princes"
    INT_GER_princes_congress_desc: "The old dynasties must decide whether a restored crown will govern through a federal compact or claim stronger royal prerogatives."

    INT_GER_imperial_civil_service: "Restore Imperial Administration"
    INT_GER_imperial_civil_service_desc: "Experienced officials can organize the crown's records, procurement and industrial administration, while defining their duties to the states and the Reich."

    INT_GER_joint_industrial_surveys: "Joint Industrial Surveys"
    INT_GER_joint_industrial_surveys_desc: "German and Soviet technical delegations can identify machinery and markets suited to reciprocal exchange."

    INT_GER_technical_missions: "Technical Missions to the East"
    INT_GER_technical_missions_desc: "Engineers and commercial representatives can deepen the practical relationship opened at Rapallo."

    INT_GER_eastern_grain_trade: "Eastern Grain Trade"
    INT_GER_eastern_grain_trade_desc: "Regular grain contracts can ease pressure on German food supplies while sustaining eastern commerce."

    INT_GER_kama_tank_school: "The Kama Tank School"
    INT_GER_kama_tank_school_desc: "Covert trials at Kama let German officers test armored doctrine beyond the reach of treaty inspectors."

    INT_GER_preserve_pilot_training: "Preserve Pilot Training"
    INT_GER_preserve_pilot_training_desc: "Lessons from the eastern training sites can be retained for a future air arm without openly reestablishing one."

    INT_GER_municipal_emergency_relief: "Municipal Emergency Relief"
    INT_GER_municipal_emergency_relief_desc: "City governments can keep soup kitchens and employment offices operating through the worst of the depression."

    INT_GER_vocational_retraining: "Retrain the Unemployed"
    INT_GER_vocational_retraining_desc: "Technical retraining can return displaced workers to factories as demand begins to recover."

    INT_GER_republican_public_works: "Republican Public Works"
    INT_GER_republican_public_works_desc: "An elected government can fund local construction while defending representative institutions."

    INT_GER_restore_civic_confidence: "Restore Civic Confidence"
    INT_GER_restore_civic_confidence_desc: "Visible recovery and open parliamentary government can win back voters alienated by the crisis."

    INT_GER_national_labor_service: "A National Labor Service"
    INT_GER_national_labor_service_desc: "The new regime directs public works and labor mobilization toward its political and economic goals."

    INT_GER_enter_1936: "A New Era: 1936"
    INT_GER_enter_1936_desc: "The interwar years are over. The German focus tree for the coming era replaces this one after the republic, council state, conservative settlement, restored monarchy, 1935 rearmament or treaty revision reaches its conclusion."
    SO2_INT_republics_council: "Council of Union Republics"
    SO2_INT_republics_council_desc: "The new union needs a forum where its republics can argue over budgets, administration and the meaning of federal autonomy."

    SO2_INT_party_secretariat: "Build the Party Secretariat"
    SO2_INT_party_secretariat_desc: "A permanent secretariat can coordinate appointments and policy across a rapidly growing party-state."

    SO2_INT_electrify_villages: "Electrify the Villages"
    SO2_INT_electrify_villages_desc: "Carry the GOELRO program beyond the major cities so rural industry and agriculture can use reliable power."

    SO2_INT_nep_market_towns: "The NEP Market Towns"
    SO2_INT_nep_market_towns_desc: "Regional markets can reconnect the countryside to urban workshops without abandoning state control of heavy industry."

    SO2_INT_union_constitution: "Codify the Union Constitution"
    SO2_INT_union_constitution_desc: "Define the institutions and rights of the union republics in a durable constitutional settlement."

    SO2_INT_lenins_legacy: "Lenin's Political Testament"
    SO2_INT_lenins_legacy_desc: "Lenin's death forces the party to decide how its leadership and revolutionary program will continue."

    SO2_INT_cooperative_credit: "Credit for the Cooperatives"
    SO2_INT_cooperative_credit_desc: "Loans to cooperatives can raise rural output while retaining the mixed economy of the NEP."

    SO2_INT_left_opposition: "The Left Opposition Prevails"
    SO2_INT_left_opposition_desc: "Trotsky's supporters defeat the party apparatus and put international revolution and internal debate back on the agenda."

    SO2_INT_general_secretary: "The General Secretary Prevails"
    SO2_INT_general_secretary_desc: "Stalin uses the party secretariat to build a governing majority and isolate his rivals."

    SO2_INT_right_opposition: "The Right Opposition Prevails"
    SO2_INT_right_opposition_desc: "Bukharin's coalition secures the party leadership and argues that the countryside needs time to prosper."

    SO2_INT_permanent_revolution: "Permanent Revolution"
    SO2_INT_permanent_revolution_desc: "The Left Opposition makes international revolutionary organization a central task of Soviet policy."

    SO2_INT_socialism_one_country: "Socialism in One Country"
    SO2_INT_socialism_one_country_desc: "The party concentrates on securing the Soviet state and building the material base for socialism at home."

    SO2_INT_preserve_nep: "Preserve the New Economic Policy"
    SO2_INT_preserve_nep_desc: "Retain small private trade and peasant incentives while the state directs strategic industry."

    SO2_INT_party_democracy: "Debate Within the Party"
    SO2_INT_party_democracy_desc: "The Left Opposition relaxes administrative discipline to let rival socialist programs compete inside the party."

    SO2_INT_grain_procurement: "The Grain Procurement Crisis"
    SO2_INT_grain_procurement_desc: "Shortages in the cities expose the limits of voluntary grain deliveries and push the government toward a new agricultural policy."

    SO2_INT_peasant_incentives: "Reward Agricultural Output"
    SO2_INT_peasant_incentives_desc: "Offer farmers stable prices and a reason to bring more grain to market instead of relying on forced requisition."

    SO2_INT_international_bureau: "An International Bureau"
    SO2_INT_international_bureau_desc: "Coordinate revolutionary parties abroad while keeping the Soviet government focused on its own reconstruction."

    SO2_INT_first_five_year_plan: "Launch the First Five-Year Plan"
    SO2_INT_first_five_year_plan_desc: "Replace the NEP's mixed economy with state targets for steel, machinery and electric power."

    SO2_INT_gradual_industrialization: "Gradual Industrialization"
    SO2_INT_gradual_industrialization_desc: "Use the proceeds of agriculture and trade to fund factories at a pace the economy can sustain."

    SO2_INT_industrial_democracy: "Workers' Industrial Councils"
    SO2_INT_industrial_democracy_desc: "Give factory councils a voice in production targets while the state coordinates investment."

    SO2_INT_collectivize_agriculture: "Collectivize Agriculture"
    SO2_INT_collectivize_agriculture_desc: "Rapid collectivization channels agriculture into the plan but brings severe disruption to the countryside."

    SO2_INT_build_magnitogorsk: "Build Magnitogorsk"
    SO2_INT_build_magnitogorsk_desc: "A new industrial city in the Urals will anchor the plan's steel and heavy-machinery targets."

    SO2_INT_cooperative_farms: "Expand Voluntary Cooperatives"
    SO2_INT_cooperative_farms_desc: "Voluntary farm cooperatives can share tools and credit without an abrupt campaign of forced collectivization."

    SO2_INT_left_industrial_plan: "The Left Industrial Plan"
    SO2_INT_left_industrial_plan_desc: "The opposition combines public ownership with worker oversight and targeted industrial investment."

    SO2_INT_stabilize_collective_farms: "Stabilize the Collective Farms"
    SO2_INT_stabilize_collective_farms_desc: "New equipment and more predictable procurement must restore output after the upheaval of collectivization."

    SO2_INT_second_five_year_plan: "Begin the Second Five-Year Plan"
    SO2_INT_second_five_year_plan_desc: "Shift from emergency construction toward transport, machinery and higher industrial productivity."

    SO2_INT_cooperative_industrialization: "Cooperative Industrialization"
    SO2_INT_cooperative_industrialization_desc: "State firms and cooperatives will expand together, with investment guided by demand rather than compulsory quotas."

    SO2_INT_workers_republic: "A Workers' Republic"
    SO2_INT_workers_republic_desc: "Consolidate the Left Opposition's institutions and prepare the Soviet state for a new European era."

    SO2_INT_heavy_industry_1935: "Heavy Industry by 1935"
    SO2_INT_heavy_industry_1935_desc: "The plans have transformed the industrial base; the next challenge is turning new capacity into reliable output."

    SO2_INT_nep_recovery_1935: "A Prosperous Soviet Market"
    SO2_INT_nep_recovery_1935_desc: "A longer NEP has built a steadier partnership between farmers, cooperatives and state industry."

    SO2_INT_enter_1936: "A New Era: 1936"
    SO2_INT_enter_1936_desc: "The interwar struggle has shaped the Soviet Union. The national focus tree for the coming era will now take its place."

    SO2_INT_rapallo_diplomacy: "The Rapallo Opening"
    SO2_INT_rapallo_diplomacy_desc: "Settle outstanding wartime claims with Germany and reopen diplomatic and commercial exchange."

    SO2_INT_berlin_treaty: "Renew the Berlin Treaty"
    SO2_INT_berlin_treaty_desc: "Assure Germany that western diplomacy will not erase the relationship forged at Rapallo."

    SO2_INT_comintern_schools: "Comintern Cadre Schools"
    SO2_INT_comintern_schools_desc: "Train organizers from abroad in the methods and lessons of the revolution."

    SO2_INT_pacific_border_commission: "A Pacific Border Commission"
    SO2_INT_pacific_border_commission_desc: "Clarify the frontier and maintain communications with neighboring governments in the Far East."

    SO2_INT_international_recognition: "Seek Wider Recognition"
    SO2_INT_international_recognition_desc: "Working embassies can help the Soviet Union trade even with states that reject its ideology."

    SO2_INT_armored_proving_grounds: "Armored Proving Grounds"
    SO2_INT_armored_proving_grounds_desc: "Testing grounds turn experimental vehicles into lessons for mobile warfare."

    SO2_INT_rifle_standardization: "Standardize Red Army Rifles"
    SO2_INT_rifle_standardization_desc: "Common specifications ease the supply burden of an army assembled from Civil War formations."

    SO2_INT_artillery_bureaus: "Artillery Design Bureaus"
    SO2_INT_artillery_bureaus_desc: "Specialized design teams improve guns and ammunition for a modern field army."

    SO2_INT_red_army_academies: "Reform the Red Army Academies"
    SO2_INT_red_army_academies_desc: "Professional education preserves Civil War experience while training officers in operational planning."

    SO2_INT_deep_operations: "Study Deep Operations"
    SO2_INT_deep_operations_desc: "Operational theorists propose striking through an enemy front and exploiting disruption at depth."

    SO2_INT_flight_schools: "Expand the Flight Schools"
    SO2_INT_flight_schools_desc: "A larger corps of trained pilots is essential before the air force can absorb new aircraft."

    SO2_INT_air_ground_cooperation: "Air-Ground Cooperation"
    SO2_INT_air_ground_cooperation_desc: "Linking aircraft to army headquarters makes reconnaissance and close support more useful."

    SO2_INT_ural_steel: "Expand Ural Steelworks"
    SO2_INT_ural_steel_desc: "Steelworks east of the old industrial heartland broaden the Soviet productive base."

    SO2_INT_machine_tool_plants: "Build Machine-Tool Plants"
    SO2_INT_machine_tool_plants_desc: "Machine tools bridge the gap between ambitious plans and working factories."

    SO2_INT_tractor_works: "Expand Tractor Works"
    SO2_INT_tractor_works_desc: "Tractor plants serve farms and teach techniques relevant to vehicle production."

    SO2_INT_ural_rail_links: "Connect the Ural Factories"
    SO2_INT_ural_rail_links_desc: "Rail capacity must grow with the factories if steel and machinery are to reach the rest of the country."

    SO2_INT_baltic_fleet_repairs: "Repair the Baltic Fleet"
    SO2_INT_baltic_fleet_repairs_desc: "Restore surviving ships and shore facilities after years of war and neglect."

    SO2_INT_black_sea_fleet_repairs: "Repair the Black Sea Fleet"
    SO2_INT_black_sea_fleet_repairs_desc: "Rebuild the Black Sea dockyards and train crews for the fleet's surviving vessels."
