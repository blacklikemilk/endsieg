l_english:
 FR3_R_reopen_fashoda: "Reopen the Fashoda Question"
 FR3_R_reopen_fashoda_desc: "The bargain of 1904 gave Paris a free hand in Morocco at the price of accepting Britain’s position in Egypt. Its critics now argue that the Republic has paid enough for an understanding London no longer honours."
 FR3_R_channel_staff: "Sound the Channel Ports"
 FR3_R_channel_staff_desc: "The Marine Nationale must know which ports can sustain a squadron and where British patrols are likely to concentrate."
 FR3_R_colonial_claims: "Recover Our Colonial Leverage"
 FR3_R_colonial_claims_desc: "The Quai d’Orsay will prepare a case for Mauritius and demand that the Channel Islands cease to serve as British outposts off the French coast."
 FR3_R_channel_ultimatum: "Send the Channel Ultimatum"
 FR3_R_channel_ultimatum_desc: "The cabinet will put its terms to London. A refusal will leave Parliament to decide whether the Republic’s claims are worth a war."
 WW1_alt_channel_threat: "Franco-British Crisis"
 ww1_alt_wars.10.t: "A French Ultimatum"
 ww1_alt_wars.10.d: "The French government has delivered an ultimatum demanding the Channel Islands and Mauritius insofar as they remain under our authority. Paris presents its demands as a settlement of old grievances. The cabinet must decide whether to yield, seek a compromise, or risk a confrontation."
 ww1_alt_wars.10.a: "Yield the possessions we hold."
 ww1_alt_wars.10.b: "We will make no concessions."
 ww1_alt_wars.11.t: "The British Reply"
 ww1_alt_wars.11.accepted: "London has accepted our demands and agreed to surrender the possessions it still holds. The diplomatic victory is ours, though it remains to be seen what relations with Britain will look like thereafter."
 ww1_alt_wars.11.refused: "London has rejected our terms. We now have grounds to pursue our claims by force, should the government choose to do so."
 ww1_alt_wars.11.a: "The cabinet has its answer."
 AUH_reopen_italian_question: "Reopen the Italian Question"
 AUH_reopen_italian_question_desc: "Vienna lost Lombardy in 1859 and Venetia in 1866. Officers and former crown officials argue that an empire on the defensive will never command respect in Rome."
 AUH_alpine_staff_talks: "Survey the Alpine Approaches"
 AUH_alpine_staff_talks_desc: "Staff officers will revisit the crossings into northern Italy and prepare supply plans for a campaign in the foothills."
 AUH_adriatic_muster: "Muster the Adriatic Squadron"
 AUH_adriatic_muster_desc: "The fleet at Pola will practise covering coastal traffic and holding the northern Adriatic while the army readies the frontier."
 AUH_lombardy_venetia_ultimatum: "Demand Lombardy and Venetia"
 AUH_lombardy_venetia_ultimatum_desc: "The Ballhausplatz will ask Rome to restore the old crownlands. The cabinet must be ready to enforce the demand if Italy refuses."
 WW1_alt_lombardy_threat: "Lombardy–Venetia Crisis"
 ww1_alt_wars.20.t: "The Question of Lombardy and Venetia"
 ww1_alt_wars.20.d: "Austria-Hungary has demanded the return of Lombardy and Venetia, invoking the rule of the Habsburgs before Italian unification. Yielding would undo part of that settlement; refusal risks a confrontation across the frontier."
 ww1_alt_wars.20.a: "Yield the territories we hold."
 ww1_alt_wars.20.b: "Italy will surrender nothing."
 ww1_alt_wars.21.t: "The Italian Reply"
 ww1_alt_wars.21.accepted: "Italy has accepted our demands and agreed to surrender the territories it still holds. The government in Vienna may count this a diplomatic victory, but governing the lands will be another matter."
 ww1_alt_wars.21.refused: "Italy has rejected our demands. We may now pursue our claims by force if diplomacy cannot settle the question."
 ww1_alt_wars.21.a: "The cabinet has its answer."
 RUS_amur_staff: "Prepare the Amur Staff"
 RUS_amur_staff_desc: "The General Staff will draw up timetables for moving reserves east and arrange supply for troops assembling beyond Lake Baikal."
 RUS_pacific_station: "Refit the Pacific Station"
 RUS_pacific_station_desc: "Vladivostok must be able to supply a squadron through an extended crisis. Repair crews and naval officers will prepare for operations in the Sea of Japan."
 RUS_portsmouth_ultimatum: "Demand the Return of Port Arthur"
 RUS_portsmouth_ultimatum_desc: "The Russian envoy will demand the return of Port Arthur and southern Sakhalin. Russian claims concern the Japanese lease and the island settlement agreed at Portsmouth."
 WW1_alt_portsmouth_threat: "Portsmouth Crisis"
 ww1_alt_wars.30.t: "A Challenge to Portsmouth"
 ww1_alt_wars.30.d: "Russia demands the return of the Port Arthur lease and southern Sakhalin. The Russian government seeks to revise the settlement that followed its defeat in the war. Giving way would surrender gains won at considerable cost; refusal may bring another conflict."
 ww1_alt_wars.30.a: "Yield the territories we hold."
 ww1_alt_wars.30.b: "We will defend the settlement."
 ww1_alt_wars.31.t: "The Japanese Reply"
 ww1_alt_wars.31.accepted: "Japan has accepted our demands and agreed to surrender the territories it still holds. The agreement offers an opportunity to recover ground lost in the settlement at Portsmouth."
 ww1_alt_wars.31.refused: "Japan has refused our demands. The government must now decide whether to press its claims by force."
 ww1_alt_wars.31.a: "The cabinet has its answer."
 EN1_R_imperial_atlantic: "Government by the Crown"
 EN1_R_imperial_atlantic_desc: "George V can use a cabinet crisis to force ministers to govern in his name. The Crown will assume direct control of the executive and suspend elections. Such a breach with constitutional practice will carry a price."
 EN1_R_canadian_staff: "Survey the Atlantic Approaches"
 EN1_R_canadian_staff_desc: "A royal expedition will need reserves and a staging plan. The army will survey the approaches from Canada and plan how to move troops through the North Atlantic."
 EN1_R_atlantic_stations: "Reinforce the Atlantic Stations"
 EN1_R_atlantic_stations_desc: "Bermuda can anchor a squadron between Halifax and the Caribbean. The Admiralty will bring the station up to strength and prepare to sustain a blockade."
 EN1_R_american_ultimatum: "Demand an American Dominion"
 EN1_R_american_ultimatum_desc: "London will ask Washington to accept dominion status under the Crown. America would retain its government, but its independence would end. The cabinet must expect refusal."
 EN1_R_danish_islands: "Bid for the Danish West Indies"
 EN1_R_danish_islands_desc: "The opening of the Panama Canal has made Saint Thomas more valuable. We can offer Copenhagen a purchase agreement before a rival secures the harbour."
 WW1_alt_atlantic_threat: "Anglo-American Crisis"
 ww1_alt_wars.40.t: "The British Demand"
 ww1_alt_wars.40.d: "The British government demands that the United States enter the Empire as a self-governing dominion. To accept would place our country under British authority; refusal may give London a pretext to use force."
 ww1_alt_wars.40.a: "Accept dominion status."
 ww1_alt_wars.40.b: "The United States will remain independent."
 ww1_alt_wars.41.t: "The American Reply"
 ww1_alt_wars.41.accepted: "Washington has accepted dominion status. The United States will enter a new relationship with Britain, though much remains to be settled between the two governments."
 ww1_alt_wars.41.refused: "Washington has rejected our demand. The cabinet now has grounds to pursue the matter by force, if it so chooses."
 ww1_alt_wars.41.a: "The cabinet has its answer."
 ww1_alt_wars.50.t: "A Bid for the Danish West Indies"
 ww1_alt_wars.50.d: "Britain offers to purchase the Danish West Indies. The islands lie on valuable routes through the Caribbean, but the offer may prove useful to our treasury. The decision now rests with our government."
 ww1_alt_wars.50.a: "Agree to the sale."
 ww1_alt_wars.50.b: "The islands will remain ours."
 ww1_alt_wars.51.t: "The Danish Reply"
 ww1_alt_wars.51.accepted: "Denmark has agreed to sell the Danish West Indies. The transfer gives us a foothold in the Caribbean and a harbour along the routes to the Panama Canal."
 ww1_alt_wars.51.refused: "Denmark has declined our offer for the islands. The funds set aside for the purchase can now be returned."
 ww1_alt_wars.51.a: "The cabinet has its answer."
 FR3_R_channel_war_staff: "The Channel War Staff"
 FR3_R_channel_war_staff_desc: "A war across the Channel will be decided by escorts, coastal patrols and the ability to keep our own ports open. The navy will form a single command for the northern approaches."
 FR3_R_administer_the_outposts: "Administer the Recovered Outposts"
 FR3_R_administer_the_outposts_desc: "We can reopen the harbours we now hold under French administration. The islanders will retain their municipal councils while Paris funds repairs."
 AUH_po_campaign: "The Campaign Beyond the Alps"
 AUH_po_campaign_desc: "The imperial armies must fight beyond their own railheads. A common staff will organise the movement of heavy guns and establish reserves for the descent towards the Po."
 AUH_lombardo_venetian_administration: "A Lombardo-Venetian Administration"
 AUH_lombardo_venetian_administration_desc: "Our new administration will retain local courts and employ Italian-speaking officials. Restoring the old crown’s authority will take money and restraint."
 RUS_transbaikal_command: "Unify the Transbaikal Command"
 RUS_transbaikal_command_desc: "Russia cannot fight another eastern war on improvised timetables. A single command will allocate rolling stock, coordinate the Pacific Fleet and keep the armies in the Far East supplied."
 RUS_restore_the_lease: "Restore the Pacific Concessions"
 RUS_restore_the_lease_desc: "The Pacific administration will restore the wharves and survey the railway approaches to any concessions returned to Russian control."
 EN1_R_atlantic_expedition: "Raise the Atlantic Expedition"
 EN1_R_atlantic_expedition_desc: "The Crown will prepare an expeditionary staff and requisition merchant shipping for the army’s crossing. The Treasury will bear the cost of assembling a force on the far side of the Atlantic."
 EN1_R_american_dominion_compact: "The American Dominion Compact"
 EN1_R_american_dominion_compact_desc: "An American government under the Crown will keep its legislature and civil administration. London will negotiate naval access and lower the cost of moving goods across the Atlantic."
 EN1_R_northern_station: "The Northern Approaches"
 EN1_R_northern_station_desc: "The northern sea lanes cannot be secured from Bermuda. The Admiralty will survey the passages past Iceland and Greenland and prepare a case for bringing them under British control."
 EN1_R_copenhagen_ultimatum: "The Copenhagen Ultimatum"
 EN1_R_copenhagen_ultimatum_desc: "London will demand Greenland and a British protectorate over Denmark. If Iceland remains under Danish authority, the demand will include Iceland. Other powers will have time to respond before Copenhagen answers."
 EN1_R_reykjavik_ultimatum: "The Reykjavik Ultimatum"
 EN1_R_reykjavik_ultimatum_desc: "An independent Iceland must answer for itself. London will demand control of the island and its harbours. The Nordic governments will see the demand as a challenge to their own security."
 EN1_R_northern_bases: "Fortify the Northern Stations"
 EN1_R_northern_bases_desc: "From Reykjavik and Nuuk, patrols can watch the northern sea lanes. We will enlarge any harbours under our control and give their garrisons permanent works."
 ww1_alt_wars.60.a: "The Crown will govern."
 ww1_alt_wars.60.t: "The Crown Takes the Reins"
 ww1_alt_wars.60.d: "George V has summoned his ministers to the Palace and declared his intention to govern through a ministry answerable to the Crown. Supporters believe stronger royal authority can restore the country’s standing. His opponents warn that the step sets aside the constitution and will deepen divisions at home."
 ww1_alt_wars.61.a: "Confine ourselves to protest."
 ww1_alt_wars.61.b: "Guarantee the threatened countries."
 ww1_alt_wars.61.c: "Confront Britain by force."
 ww1_alt_wars.61.t: "The Northern Crisis"
 ww1_alt_wars.61.d: "Britain is pressing its demands in the North Atlantic. The prospect of British control over the islands has alarmed governments throughout the region. We must decide whether to confine ourselves to protest or offer the threatened countries our protection."
 ww1_alt_wars.62.a: "Prepare for war."
 ww1_alt_wars.62.t: "The Northern Crisis Turns to War"
 ww1_alt_wars.62.d: "Our demands in the North Atlantic have met armed opposition. A foreign government has declared war on Britain, and the cabinet must now deal with the consequences."
 ww1_alt_wars.63.a: "Submit to British protection."
 ww1_alt_wars.63.b: "Offer the islands and retain independence."
 ww1_alt_wars.63.c: "Reject the demands."
 ww1_alt_wars.63.d: "Britain demands that Denmark accept its protection and yield the North Atlantic islands under Danish authority. To submit would place our independence in jeopardy. We must weigh the terms, the strength of our defences and whatever support we can expect from abroad."
 ww1_alt_wars.63.t: "The Copenhagen Ultimatum"
 ww1_alt_wars.64.a: "The cabinet has its answer."
 ww1_alt_wars.64.t: "Denmark Answers"
 ww1_alt_wars.64.d: "Copenhagen has delivered its answer. The Admiralty is waiting for instructions before it changes the disposition of the fleet."
 ww1_alt_wars.65.a: "Accept the islands."
 ww1_alt_wars.65.b: "Insist on the protectorate."
 ww1_alt_wars.65.t: "A Danish Compromise"
 ww1_alt_wars.65.d: "Denmark offers the North Atlantic islands under its authority if we withdraw the demand for a protectorate. Accepting would gain us the available islands while leaving Denmark independent."
 ww1_alt_wars.66.a: "Yield the island."
 ww1_alt_wars.66.b: "Reject the demand."
 ww1_alt_wars.66.t: "The Reykjavik Ultimatum"
 ww1_alt_wars.66.d: "Britain demands that Iceland come under British administration. Our government must decide whether to yield the island or reject the demand and risk the consequences."
 ww1_alt_wars.67.a: "The cabinet has its answer."
 ww1_alt_wars.67.t: "Iceland Answers"
 ww1_alt_wars.67.d: "The Alþingi has delivered its answer to the British demand. The Admiralty awaits instructions for the Iceland station."
 ENG_ww1_george_v: "George V"
 WW1_alt_northern_incursion: "British demands in the North Atlantic"
 WW1_alt_northern_threat: "The North Atlantic Crisis"
 WW1_alt_royal_readiness_tt: "Requires royal government, both Atlantic preparations, and 35% war support."
 ww1_alt_wars.10.c: "Offer Mauritius alone."
 ww1_alt_wars.12.t: "London Offers a Compromise"
 ww1_alt_wars.12.d: "Britain offers to cede Mauritius if we abandon our demand for the Channel Islands. The British government regards the islands near its coast as vital to its defence. We must decide whether the offer is enough."
 ww1_alt_wars.12.a: "Accept Mauritius."
 ww1_alt_wars.12.b: "The original demands stand."
 ww1_alt_wars.20.c: "Offer Venetia alone."
 ww1_alt_wars.22.t: "Rome Offers a Compromise"
 ww1_alt_wars.22.d: "Italy offers Venetia in return for abandoning our demand for Lombardy. The government in Rome hopes that a partial concession will avert a wider conflict. We must decide whether to accept."
 ww1_alt_wars.22.a: "Accept Venetia."
 ww1_alt_wars.22.b: "We demand both territories."
 ww1_alt_wars.30.c: "Offer Port Arthur alone."
 ww1_alt_wars.32.t: "Tokyo Offers a Compromise"
 ww1_alt_wars.32.d: "Japan proposes to return Port Arthur if we abandon our demand for southern Sakhalin. It is a partial revision of Portsmouth, but far less than the government originally sought."
 ww1_alt_wars.32.a: "Accept Port Arthur."
 ww1_alt_wars.32.b: "We demand both territories."
 ww1_alt_wars.64.accepted: "Copenhagen has accepted our terms. Denmark has agreed to British protection, and the authorities can proceed with the transfer of the islands still under Danish control."
 ww1_alt_wars.64.refused: "Copenhagen has rejected our demands. The government now has grounds to pursue a settlement by force."
 ww1_alt_wars.64.uncertain: "The Danish question has changed since our ultimatum was delivered. The government must consider the situation as it now stands."
 ww1_alt_wars.67.accepted: "The Icelandic government has accepted our demand. The island is now under British administration."
 ww1_alt_wars.67.refused: "The Icelandic government has rejected our demand. Britain can now pursue its claim by force if the cabinet so decides."
 ww1_alt_wars.67.uncertain: "The situation in Iceland has changed since our demand was delivered. The government must consider its next steps."
 ww1_alt_wars.63.war: "Reject the demand and strike first."
