l_english:
 TUR_abdulhamid_ii:0 "Abdülhamid II"
 OT1_P_old_sultan:0 "The Old Sultan"
 OT1_P_old_sultan_desc:0 "Long experience of the court and the machinery of government gives Abdülhamid considerable political skill. His suspicion of military reformers and independent centres of authority makes agreement with the officers more difficult."

 OT1_P_committee_clubs:0 "The Unionist Clubs"
 OT1_P_committee_clubs_desc:0 "$WW1_historical_header$The Committee of Union and Progress draws strength from clubs, newspapers and personal connections extending beyond the chamber. We will bring these organisations into closer contact with the government. Their support will strengthen the ministry, while leaving the question of who commands the movement unresolved."
 OT1_P_officer_cadres:0 "The Officer Cadres"
 OT1_P_officer_cadres_desc:0 "$WW1_historical_header$The officers who defended the constitutional movement expect a voice in its future. Regular meetings and staff work will connect sympathetic commands with the Committee. Their cooperation may protect the government, but it also brings military loyalties more deeply into politics."
 OT1_P_national_credit_focus:0 "Establish National Credit"
 OT1_P_national_credit_focus_desc:0 "$WW1_historical_header$An ambitious state requires manufacturers and merchants able to obtain reliable credit. The Committee will support domestic lending and coordinate orders placed with local firms. This programme offers a foundation for industrial expansion, though access to its benefits will also strengthen the party's economic influence."
 OT1_P_civilian_committee_focus:0 "Civilian Direction of the Committee"
 OT1_P_civilian_committee_focus_desc:0 "$WW1_historical_header$Talat and the civilian organisers argue that the Committee must govern through ministries, parliamentary business and its provincial organisations. The officers will retain their military responsibilities, while political direction rests with the civilian leadership. Keeping that distinction will require the government to answer the army's complaints."
 OT1_P_officer_directorate_focus:0 "An Officer Directorate"
 OT1_P_officer_directorate_focus_desc:0 "Enver's supporters seek a government capable of bringing military preparation and imperial policy under a single direction. An officer-led cabinet would give the army greater influence over the use of the country's resources. Its urgency appeals to those who fear another defeat, but civilian confidence will bear part of the cost."
 OT1_P_municipal_organisations:0 "The Committee in the Provinces"
 OT1_P_municipal_organisations_desc:0 "$WW1_historical_header$The civilian leadership needs more than orders sent from the capital. Municipal organisations and provincial correspondents will give the Committee a closer knowledge of local revenues and services. Their reports must reach the ministries before demands upon the provinces become impossible to meet."
 OT1_P_unified_war_ministry:0 "A Unified War Ministry"
 OT1_P_unified_war_ministry_desc:0 "Separate commands compete for trains, stores and replacements without a common account of what is available. The War Ministry will bring those requirements together and prepare a coordinated programme of operations. Giving the front priority will place a further burden on the country's food supplies."
 OT1_P_union_and_progress:0 "The Unionist State"
 OT1_P_union_and_progress_desc:0 "$WW1_historical_header$The Committee's organisations now reach from the ministries to provincial offices and military commands. We will use that network to sustain industrial production and carry the government's programme beyond the capital. A more capable central state may emerge, but its demands will still be judged by the people who must meet them."
 OT1_P_revisit_deposition:0 "Revisit the Deposition of 1909"
 OT1_P_revisit_deposition_desc:0 "Removing one sultan and recalling another cannot be treated as an ordinary change of ministry. The dynasty must agree upon Mehmed V's withdrawal and the legal basis of his brother's return. Only then can a delegation seek the provincial assurances upon which a restoration would depend."
 OT1_P_return_to_yildiz:0 "Return to Yıldız"
 OT1_P_return_to_yildiz_desc:0 "The dynasty has accepted the proposed settlement, and the necessary assurances have been obtained from officers, jurists and provincial representatives. We can now invite Abdülhamid II to return to Yıldız and resume the throne. The promises made to secure his return will follow him through the palace gates."
 OT1_P_crown_inspectors:0 "The Crown's Inspectors"
 OT1_P_crown_inspectors_desc:0 "The palace cannot govern distant provinces through petitions alone. Inspectors will examine local accounts and report upon the conduct of officials, giving the Porte a firmer basis for its decisions. Their authority must be used to correct abuses rather than simply silence complaints."
 OT1_P_schools_and_railways:0 "Schools and Railways"
 OT1_P_schools_and_railways_desc:0 "A restored throne will remain insecure if the state lacks trained officials, engineers and dependable communications. We will support technical education and the planning needed to improve the railway system. Scholarships will give promising students a place in this work and a reason to serve the Empire."
 OT1_P_cautious_diplomacy:0 "A Cautious Foreign Policy"
 OT1_P_cautious_diplomacy_desc:0 "The Empire cannot repair every defeat by assuming another foreign obligation. The palace and the Porte will examine military commitments alongside the country's ability to supply them. Better information and careful preparation should give our representatives room to negotiate without promising more than the state can sustain."

 OT1_P_contested_restoration:0 "The Restoration Question"
 OT1_P_contested_restoration_desc:0 "The proposal to recall Abdülhamid has divided the capital. Its supporters must obtain the dynasty's agreement and answer the fears of officers, jurists and provincial representatives before a return can be attempted."
 OT1_P_reserved_powers:0 "The Sultan's Reserved Powers"
 OT1_P_reserved_powers_desc:0 "The palace retains broad authority over ministers and the direction of the state. Decisions can be made with greater political confidence, but the concentration of power discourages independent advice and technical initiative."
 OT1_P_bound_crown:0 "A Crown Bound by Undertakings"
 OT1_P_bound_crown_desc:0 "The throne rests upon written undertakings made to those who supported the palace settlement. Respect for those limits gives officials and subjects greater confidence in the continuity of government."
 OT1_P_renewed_imperial_service:0 "A Renewed Imperial Service"
 OT1_P_renewed_imperial_service_desc:0 "Inspection, technical education and more careful planning have given the imperial administration a stronger foundation. The state can undertake improvements with a clearer account of the people and resources available to carry them out."
 OT1_P_officer_mistrust:0 "Mistrust in the Officer Corps"
 OT1_P_officer_mistrust_desc:0 "The officers question whether political promises will be honoured and whether professional advice can reach the government. Commands remain in service, but suspicion obstructs cooperation and the preparation of operations."
 OT1_P_cup_organisation:0 "The Unionist Organisation"
 OT1_P_cup_organisation_desc:0 "The Committee's clubs and secretariat give the government a dependable political network. Its growing influence also alarms opponents who fear that constitutional government is becoming inseparable from party control."
 OT1_P_national_credit:0 "National Credit"
 OT1_P_national_credit_desc:0 "Domestic lending and coordinated contracts support the expansion of local industry. Firms favoured by the programme gain a closer connection with the state and with the Committee's political organisations."
 OT1_P_civilian_committee:0 "Civilian Direction"
 OT1_P_civilian_committee_desc:0 "The civilian leadership directs the Committee through the ministries and its political organisations. This offers a steadier government, though consultation and the handling of military objections slow the preparation of operations."
 OT1_P_officer_directorate:0 "The Officer Directorate"
 OT1_P_officer_directorate_desc:0 "Military leaders have a greater part in the direction of imperial policy. Their command of preparations encourages an energetic war effort, while the authority of civilian institutions becomes less certain."
 OT1_P_unionist_state:0 "Union and Progress"
 OT1_P_unionist_state_desc:0 "The Committee has joined industrial orders, administrative appointments and provincial organisation into a common programme. Its centralising ambitions promise a stronger state while placing greater demands upon communities already wary of rule from the capital."

 OT1_P_imperial_settlement:0 "The Imperial Settlement"
 OT1_P_imperial_settlement_desc:0 "The future of the Empire depends upon agreements that can survive beyond a change of ministry. The palace and the Committee each seek the cooperation of institutions whose support cannot be taken for granted."
 OT1_P_sound_out_officers:0 "Seek the Officers' Assurances"
 OT1_P_sound_out_officers_desc:0 "A delegation will meet officers whose commands would be responsible for keeping order during a restoration. They must be given an account of the proposed settlement and an opportunity to state the safeguards they expect. Their reply will require a decision from the government."
 OT1_P_consult_the_ulema:0 "Consult the Ulema"
 OT1_P_consult_the_ulema_desc:0 "The proposed return must rest upon an answer to the legal arguments used in the deposition of 1909. Religious jurists will examine the dynasty's agreement and the authority under which a restoration might proceed. We must then decide how far the palace will be bound by their conclusions."
 OT1_P_notables_delegation:0 "Receive the Provincial Delegation"
 OT1_P_notables_delegation_desc:0 "Provincial representatives want to know whether a change at the palace will alter the obligations imposed upon their communities. Their delegation will discuss consultation, local administration and the handling of petitions. The terms we accept will shape confidence in the proposed restoration."
 OT1_P_renew_the_invitation:0 "Renew the Invitation to the Sultan"
 OT1_P_renew_the_invitation_desc:0 "The earlier invitation could not be carried through. With the required assurances in place and the position of the government more secure, we can send a renewed invitation to Abdülhamid. His return remains possible only while the dynastic settlement can still be fulfilled."
 OT1_P_imperial_scholarships:0 "Fund the Imperial Scholarships"
 OT1_P_imperial_scholarships_desc:0 "Technical schools require teachers, equipment and students able to remain in study. A sustained scholarship programme will prepare a new generation for engineering and public service. The expense comes before the benefits of their training can be felt."
 OT1_P_unionist_procurement:0 "Coordinate Unionist Procurement"
 OT1_P_unionist_procurement_desc:0 "Credit will be of limited use if manufacturers receive conflicting orders and deliveries cannot reach their destinations. The Committee will bring purchasing offices, firms and military representatives together to examine production and transport. Their work should leave the government with better methods as well as better records."

 OT1_P_procurement_unlocked_tt:0 "Unlocks §YCoordinate Unionist Procurement§!, a programme to improve purchasing, industrial methods and the delivery of military stores."
 OT1_P_ulema_unlocked_tt:0 "Unlocks §YConsult the Ulema§! to seek legal assurances for the proposed restoration."
 OT1_P_officers_unlocked_tt:0 "Unlocks §YSeek the Officers' Assurances§! to negotiate the army's position on a restoration."
 OT1_P_notables_unlocked_tt:0 "Unlocks §YReceive the Provincial Delegation§! to negotiate the support of provincial representatives."
 OT1_P_scholarships_unlocked_tt:0 "Unlocks §YFund the Imperial Scholarships§!, a sustained programme of technical education and public service."
 OT1_P_accession_ready_tt:0 "Abdülhamid II must still be alive, and the dynasty, officers, religious jurists and provincial representatives must have given their assurances. Requires §YStability§! above §Y34%§!, §YOfficer Loyalty§! of at least §Y45§!, and a capital under government control."
 OT1_P_unified_war_ministry_bonus:0 "Unified War Ministry"
 OT1_P_schools_and_railways_bonus:0 "Imperial Technical Education"
 OT1_P_cautious_diplomacy_bonus:0 "Imperial Staff Studies"
 OT1_P_imperial_arbitration_bonus:0 "Imperial Industrial Studies"
 OT1_P_imperial_scholarships_bonus:0 "Imperial Scholarships"
 OT1_P_unionist_procurement_bonus:0 "Unionist Procurement Studies"

 ww1_ottoman_politics.1.t:0 "The Dynasty and the Deposition"
 ww1_ottoman_politics.1.d:0 "The supporters of Abdülhamid II have brought the question of his return before the dynasty. Since the deposition of 1909, his name has remained a rallying point for those who distrust the Committee and the direction of constitutional politics. Yet recalling him would raise a question which enthusiasm alone cannot answer: by what authority may a reigning sultan surrender the throne to his deposed brother?\n\nMehmed V's representatives have insisted that no return can be attempted through a sudden proclamation or a march upon the palace. His withdrawal must be voluntary, its terms recorded, and the position of the dynasty preserved. Abdülhamid's household likewise seeks assurance that an invitation will not expose the former sultan to another humiliation or leave him dependent upon a ministry unable to keep its promises.\n\nThe proposed agreement provides a lawful course for Mehmed's withdrawal if the wider settlement can be secured. It does not settle the objections of the officers or the questions raised by religious jurists and provincial delegates. Those negotiations must still be undertaken. For the moment, the dynasty has agreed that the proposal may proceed, and the government must accept the restraint which that agreement places upon its own freedom of action."
 ww1_ottoman_politics.1.a:0 "A return must rest upon the dynasty's agreement."
 ww1_ottoman_politics.2.t:0 "Abdülhamid Returns to the Throne"
 ww1_ottoman_politics.2.d:0 "Abdülhamid II has returned to Yıldız and resumed the Ottoman throne. Mehmed V has withdrawn in accordance with the dynastic agreement, while ministers have received the officers' assurances and the undertakings of the jurists and provincial representatives. The ceremonies at the palace have given the settlement a public form. What began as petitions and guarded conversations has become the government of the Empire.\n\nThe return has stirred memories which cannot be separated from the new reign. Supporters recall the former sultan's experience and the authority he once exercised over a troubled state. Opponents remember censorship, surveillance and repression, and fear that the promises made during the negotiations will be discarded once the palace is secure. The officers are watching appointments closely, and provincial representatives expect their grievances to receive more than ceremonial acknowledgement.\n\nThe Empire that Abdülhamid now governs cannot be restored simply by recalling its former ruler. Its finances, schools, railways and public services require sustained work. The palace must also decide how its authority will relate to the constitution and to the ministers who carry out its orders. The throne has been recovered; the confidence needed to exercise its power remains a daily task."
 ww1_ottoman_politics.2.a:0 "The promises made for this return must endure."
 ww1_ottoman_politics.3.t:0 "The Officers State Their Terms"
 ww1_ottoman_politics.3.d:0 "The officers approached by our delegation have given a qualified answer. They are willing to cooperate with a lawful dynastic settlement, but they remember the struggles which brought the army into constitutional politics. They want a clear undertaking that professional appointments and advice will not be subordinated to personal suspicion at the palace.\n\nTheir representatives propose a written agreement and regular consultation with the ministry. Securing it will consume political influence and limit the cabinet's freedom to act. Others around the government favour a less binding declaration: the officers would accept the settlement as a patriotic duty, while the palace retained discretion over the promises made in its name. That course would leave the officer corps less reassured and deepen misgivings outside the capital."
 ww1_ottoman_politics.3.a:0 "Give the officers written professional guarantees."
 ww1_ottoman_politics.3.b:0 "Ask for their duty; retain the palace's discretion."
 ww1_ottoman_politics.4.t:0 "A Legal Foundation for the Return"
 ww1_ottoman_politics.4.d:0 "The jurists consulted by the government have examined the dynastic agreement and the arguments surrounding the deposition of 1909. They are prepared to recognise a course by which Abdülhamid may return, but they ask that the obligations undertaken by the palace be stated openly and observed in the conduct of government.\n\nAccepting their conclusions would give the proposed settlement a firmer public foundation. It would also require ministers to spend influence in reconciling the court with limits which some of its supporters regard as unnecessary. The alternative is to obtain a narrower declaration of legality while reserving a wider discretion to the sovereign. Such a declaration would strengthen the cabinet's immediate hand, but officers and constitutional opinion would see another reason to doubt the undertaking."
 ww1_ottoman_politics.4.a:0 "Accept a legal settlement that binds the palace."
 ww1_ottoman_politics.4.b:0 "Recognise the return without binding the sovereign."
 ww1_ottoman_politics.5.t:0 "The Provinces Ask for Assurances"
 ww1_ottoman_politics.5.d:0 "The provincial delegation has concluded its meetings with the ministers. Its members do not speak with one voice, but their central concern is clear: they fear that a change of sultan will leave local grievances unanswered while bringing new demands from the capital. They seek a dependable hearing for petitions and consultation before measures affecting provincial administration are imposed.\n\nWe can record those assurances and give the delegates a place in the settlement. Doing so would strengthen confidence beyond the capital, while limiting the cabinet and requiring further political concessions. We can instead ask them to acknowledge the dynasty's decision and leave the details to the restored government. This would preserve central authority, but their return home would carry fewer reasons for confidence in the palace."
 ww1_ottoman_politics.5.a:0 "Record the provinces' right to be heard."
 ww1_ottoman_politics.5.b:0 "The capital must retain authority over the settlement."
 ww1_ottoman_politics.6.t:0 "The First Test of the Restored Palace"
 ww1_ottoman_politics.6.d:0 "The ceremonies of the restoration have given way to disputes over how the palace will govern. Officers and officials who accepted Abdülhamid's return now ask whether the assurances obtained during the negotiations will guide appointments and the treatment of political disagreement. Reports of influence exercised through private audiences have made the question harder to postpone.\n\nThe ministers can answer by meeting the officers' representatives and recording how their professional advice is to reach the government. This would require fresh concessions and a difficult public acknowledgement that the restoration has not removed all mistrust. Some palace supporters regard another conference as an admission of weakness. They argue that ministers need a settled authority, rather than a succession of undertakings negotiated whenever an institution objects.\n\nA firmer declaration of the sovereign's discretion would strengthen the cabinet's immediate position. It would also leave the officer corps uncertain about the value of its earlier agreement and give provincial critics another example of promises narrowed after power has been secured. Abdülhamid's return has settled who occupies the throne. It has not settled how the throne will listen to those upon whose cooperation its government depends."
 ww1_ottoman_politics.6.a:0 "Meet the officers and honour the undertaking."
 ww1_ottoman_politics.6.b:0 "The restored government must govern on its own authority."
 ww1_ottoman_politics.7.t:0 "The Invitation Must Wait"
 ww1_ottoman_politics.7.d:0 "The arrangements for Abdülhamid's return cannot yet be carried through. The dynasty's agreement is only one part of the settlement: the government must also secure the required assurances and a position strong enough to uphold them. A journey to the capital undertaken before those conditions are met would risk another confrontation over the throne.\n\nThe palace's supporters will keep the question open while the former sultan lives. Ministers must now complete the negotiations and restore confidence before renewing the invitation."
 ww1_ottoman_politics.7.a:0 "Complete the arrangements before sending for him."
 ww1_ottoman_politics.8.t:0 "The Restoration That Did Not Come"
 ww1_ottoman_politics.8.d:0 "Abdülhamid II has died before the arrangements for his return could be completed. The former sultan's household has informed the government, and the invitation which occupied so much of the palace's political effort can no longer be fulfilled. The dynasty must now mourn a man whose long reign and contested deposition shaped every argument surrounding the proposed restoration.\n\nHis supporters had hoped that the authority of an experienced sovereign could hold together institutions weakened by distrust. Others feared that his return would revive practices which the constitutional movement had sought to end. Neither the hopes nor the fears were answered by a second accession. The negotiations have instead left a collection of undertakings, grievances and expectations which the present government must still address.\n\nThe reigning sovereign remains on the throne. The officers, jurists and provincial delegates approached during the restoration campaign cannot be expected to forget the promises made to them. Ministers may continue to build a palace government, determine the place of the constitution and pursue improvements in education and public service. They must do so under the reigning dynasty as it now stands. Abdülhamid's death closes the question of his personal return, while leaving the work of governing the Empire unfinished."
 ww1_ottoman_politics.8.a:0 "Continue the settlement under the reigning sultan."
 ww1_ottoman_politics.9.t:0 "The Death of Abdülhamid II"
 ww1_ottoman_politics.9.d:0 "Abdülhamid II has died. The palace has announced the end of the restored sultan's reign, and ministers have begun the observances required by the dynasty. His return had reopened a question which many believed the deposition of 1909 had settled. His death now places the future of that undertaking in the hands of those who will govern after him.\n\nThe restoration brought experienced royal authority back into the centre of politics, but it also revived disputes over the constitution, the army and the treatment of opposition. Its supporters will point to the work undertaken in the imperial service and to the prospect of a more dependable administration. Its critics will judge the reign by the limits observed upon power and the promises kept to the provinces. Those arguments will continue beyond the funeral.\n\nThe succession must proceed according to dynastic order and the agreement which allowed his return. Mehmed V's withdrawal had preserved his place in that order, with Mehmed VI following him. The identity of the sovereign cannot absolve the government of its obligations. The institutions built during the restored reign, and the grievances left unanswered, will pass with the throne to the next ruler."
 ww1_ottoman_politics.9.a:0 "Observe the succession and preserve the government."
 ww1_ottoman_politics.10.t:0 "The Committee Takes Root"
 ww1_ottoman_politics.10.d:0 "The Committee of Union and Progress is establishing a more regular organisation around the government. Clubs, correspondents and sympathetic officials which once served a movement against the old order are being drawn into a secretariat able to carry instructions between ministers and the provinces. The seizure of authority at the Sublime Porte has made the question of responsibility more urgent: the Committee can no longer act solely as a guardian standing outside the administration.\n\nIts leaders seek a state capable of training officials, directing credit and sustaining an army without depending upon improvised bargains. Inspectorates and schools have a place in that programme alongside military preparation. Civilian organisers insist that lasting authority must rest upon the daily work of government, while officers point to their own part in securing the Committee's position.\n\nThe same organisation which gives ministers a more dependable political base also strengthens their opponents' fears. Appointments made through party connections and pressure upon dissent can narrow public life while leaving local grievances unresolved. The government must decide how far the Committee will answer to civilian institutions and how far it will rely upon the officers. Its reach is growing; agreement over the use of that influence remains incomplete."
 ww1_ottoman_politics.10.a:0 "The Committee must answer for the government it directs."
 ww1_ottoman_politics.11.t:0 "The Civilian Committee and the Army"
 ww1_ottoman_politics.11.d:0 "The decision to place political direction with the civilian Committee has not removed the army from public life. Officers who helped secure the movement's authority expect their advice to carry weight, and some fear that appointments and military estimates will now be settled by party organisers with little knowledge of the commands they affect. Talat's supporters argue that an army can serve the state without directing every question brought before the cabinet.\n\nThe ministers have been asked to establish a regular channel through which the officers can submit complaints and obtain an answer. Accepting would require further negotiation and political effort, but it could make the distinction between military command and civilian government more dependable. The officers would gain a recognised hearing rather than an uncertain place in private discussions.\n\nOthers in the Committee believe that giving the army another formal claim upon the cabinet would weaken the settlement just adopted. They favour allowing ministers to make their decisions and requiring the commands to accept them. This would strengthen the cabinet's immediate authority, while risking a decline in the loyalty upon which its orders depend. Civilian direction has become the government's policy; the manner in which it is exercised is still a choice."
 ww1_ottoman_politics.11.a:0 "Give the officers a regular hearing before the cabinet."
 ww1_ottoman_politics.11.b:0 "Political direction belongs to the civilian ministers."
 ww1_ottoman_politics.12.t:0 "The Directorate's First Programme"
 ww1_ottoman_politics.12.d:0 "The officer directorate has brought military preparation closer to the centre of government. Enver's supporters present it as an answer to the delays and divided responsibilities which have frustrated the army. The ministries are now being asked to place their transport, purchasing and administrative work beside a common account of the operations the commands wish to undertake.\n\nOne proposal would establish a regular process of consultation between the War Ministry and the civil departments. The officers would gain better information, while ministers retained an opportunity to explain the limits of the country's resources. Its advocates consider this the soundest way to turn military authority into a government capable of sustaining its decisions.\n\nA more urgent proposal calls for the available stores and transport to be concentrated immediately upon military preparations. The commands would learn more quickly from the effort, but the provinces would face heavier demands and food distribution would suffer. Neither course removes the wider question of who will answer for the consequences. The directorate has promised an energetic state. It must now decide whether that energy will be disciplined by an account of what the country can provide."
 ww1_ottoman_politics.12.a:0 "Coordinate the commands with the civil ministries."
 ww1_ottoman_politics.12.b:0 "Give military preparation immediate priority."
 ww1_ottoman_politics.13.t:0 "The Committee and Its Officers"
 ww1_ottoman_politics.13.d:0 "The men who helped the Committee secure power continue to shape the government formed in its name. Their service has created loyalties which run through ministries, clubs and military commands. It has also made disagreements difficult to resolve: a complaint about an appointment can become a dispute over who has the right to speak for the constitutional movement.\n\nRepresentatives of the officers have asked the Committee's leadership for a clearer understanding of their place. They want assurance that professional objections will receive an answer and that political connections will not become the sole measure of confidence in a commander. Meeting those demands would require the civilian leadership to surrender some discretion and spend influence upon an agreement which its more determined supporters consider unnecessary.\n\nThe alternative is to affirm the authority of the central leadership and leave such complaints to be dealt with individually. That would give the cabinet a freer hand, but officers who distrust the party's intentions would have less reason to cooperate. The memory of the raid on the Sublime Porte gives both sides a claim upon the government's origins. It cannot by itself tell them how the government should now be conducted."
 ww1_ottoman_politics.13.a:0 "Negotiate a clear understanding with the officers."
 ww1_ottoman_politics.13.b:0 "The central leadership must retain its discretion."
 ww1_ottoman_politics.14.t:0 "A State of Union and Progress"
 ww1_ottoman_politics.14.d:0 "The Committee's programme has begun to assume the form of a settled system of government. Its organisations connect the ministries with provincial offices, industrial contracts and military commands. Education, domestic credit and a more capable administration are being presented as parts of the same undertaking: an Empire able to direct its resources and defend its continued existence.\n\nThere is substance in the changes. A common account of production and purchasing can sustain work which once depended upon conflicting orders. Trained officials and technical knowledge give ministers greater means to carry their decisions beyond the capital. Civilian organisers and officers alike can point to institutions which have outgrown the political clubs from which much of the movement emerged.\n\nThe costs of that concentration of authority remain visible. Provincial communities resent demands made without an adequate hearing, and opponents have reason to fear the use of party influence to exclude them from public life. A stronger central government does not make those grievances disappear. The Committee has claimed responsibility for the future of the Empire; it will be judged by the services it provides, the burdens it imposes and the limits it observes when its authority is challenged."
 ww1_ottoman_politics.14.a:0 "Our authority carries responsibility for the whole Empire."
 ww1_ottoman_politics.100.t:0 "Abdülhamid II Restored"
 ww1_ottoman_politics.100.d:0 "Abdülhamid II has resumed the Ottoman throne following an agreement within the dynasty and negotiations with military, religious and provincial representatives. Mehmed V has withdrawn in accordance with the settlement, bringing an extraordinary reversal to the succession established after the deposition of 1909.\n\nThe new government presents the restoration as a lawful means of recovering confidence in the imperial administration. Its supporters point to Abdülhamid's experience and argue that a respected throne can restrain the struggles which have divided the capital. Opponents recall the censorship and repression of his former reign, and question whether the undertakings made to secure his return will survive the recovery of royal power.\n\nForeign representatives are watching for signs of the policy that will follow. A change at the palace has not settled the Empire's financial difficulties, repaired its communications or answered the demands of its provinces. Nor has it restored territory lost in earlier wars. The government must still determine the relationship between sovereign and ministers, and the place of the constitution. The return of the old sultan has altered the political balance in Constantinople; the durability of the arrangement will depend upon what his restored authority is used to accomplish."
 ww1_ottoman_politics.100.a:0 "The Ottoman settlement enters a new chapter."
 ww1_ottoman_politics.101.t:0 "Abdülhamid II Dies"
 ww1_ottoman_politics.101.d:0 "The Ottoman government has announced the death of Abdülhamid II. Restored after his earlier deposition, the sultan leaves a reign whose meaning remains disputed among the institutions which made his return possible. Funeral observances have begun as ministers attend to the continuation of government and the dynastic succession.\n\nTo his supporters, the restoration offered a means of recovering authority after years of conflict within the capital. They credit the throne with giving renewed direction to administration and public service. Critics judge the same undertaking by its treatment of opposition and by the extent to which promises made to officers, jurists and provincial representatives were honoured. Those disagreements are unlikely to end with the sovereign's death.\n\nThe agreement which permitted the restoration preserved the established places of Mehmed V and Mehmed VI in the dynastic succession. Foreign governments have received assurances of continuity, but the questions surrounding the palace remain. The next sovereign will inherit the institutions of the restored government, its foreign obligations and the grievances it has not resolved. Abdülhamid's personal return is over; the political arrangements built around it must now endure without him."
 ww1_ottoman_politics.101.a:0 "The dynasty continues under a new sovereign."

 ww1_ottoman_politics.9.retired.d:0 "Abdülhamid II has died. The former sovereign's household has informed the government, bringing to an end a life which has left a deep mark upon the Empire. His deposition in 1909 did not silence the disputes surrounding his reign, and his later restoration gave those arguments a new place in Ottoman politics.\n\nThe government which now holds authority will not be changed by the announcement. The former sultan's supporters must nevertheless consider what remains of the institutions and undertakings associated with his return. His critics will remember the restrictions placed upon public life and the promises they believed were broken.\n\nPalace officials are arranging the observances due to a member of the dynasty. Beyond the household, the country continues to face the financial, administrative and political difficulties which no change of sovereign has been able to settle."
