    ww1_britain.50.d: ""
    ww1_britain.50.a: ""
#

# WW1 Bulgaria #
    ww1_bulgaria.1.t:0 "The Macedonian Dispute"
    ww1_bulgaria.1.d:0 "The division of Macedonia has brought Bulgaria into conflict with its former allies. Ministers must decide whether to enforce our claims by arms or accept the present settlement."
    ww1_bulgaria.1.a:0 "Press our claims by force."
    ww1_bulgaria.1.b:0 "Accept the settlement."
    ww1_bulgaria.101.t:0 "The Bulgarian War"
    ww1_bulgaria.101.d:0 "Bulgaria's struggle with Serbia and Greece offers an opportunity to press our claims in Southern Dobruja. Intervention would improve our bargaining position, but would also bring Romania into another Balkan war."
    ww1_bulgaria.101.a:0 "Intervene against Bulgaria."
    ww1_bulgaria.101.b:0 "Remain neutral."
    ww1_bulgaria.102.t:0 "The Adrianople Question"
    ww1_bulgaria.102.d:0 "Bulgaria is fighting its former allies, leaving its position around Adrianople exposed. The government must decide whether to recover the lost territory, remain outside the war or seek an understanding with Sofia."
    ww1_bulgaria.102.a:0 "Advance on Adrianople."
    ww1_bulgaria.102.b:0 "Remain neutral."
    ww1_bulgaria.102.c:0 "Seek an agreement with Bulgaria."
    ww1_bulgaria.2.t:0 "The Balkan Peace Settlements"
    ww1_bulgaria.2.d:0 "The peace settlements following Bulgaria's defeat have redistributed the disputed territories among its neighbours. Serbia and Greece retain much of Macedonia, Romania gains Southern Dobruja, and the Ottoman Empire recovers Adrianople, leaving Bulgaria to confront the cost of the war."
    ww1_bulgaria.2.a: "Damn!"
    ww1_bulgaria.3.t: "Armistice of Salonica"
    ww1_bulgaria.3.d:0 "The collapse of the Macedonian front has compelled Bulgaria to seek an armistice at Salonica. The terms call for demobilisation, evacuation of occupied Greek and Serbian territory, and access for the Entente, bringing our participation in the war to an end."
    ww1_bulgaria.3.a:0 "Accept the burden of the armistice."
    ww1_bulgaria.4.t: "Armistice of Salonica"
    ww1_bulgaria.4.d:0 "Bulgaria has signed an armistice at Salonica after the collapse of its front in Macedonia. Demobilisation and the evacuation of occupied Greek and Serbian territory leave its former allies exposed to a new strategic situation in the Balkans."
    ww1_bulgaria.4.a:0 "Bulgaria has left the war."
    ww1_bulgaria.5.t: ""
    ww1_bulgaria.5.d: ""
    ww1_bulgaria.5.a: ""
    ww1_bulgaria.6.t:0 "Victory in the Balkans"
    ww1_bulgaria.6.d:0 "The campaign has placed Bulgaria in a strong position to demand a new settlement. The government must decide how far to press its territorial claims and how much risk to accept in the search for a lasting peace."
    ww1_bulgaria.6.a:0 "Demand our claimed territories."
    ww1_bulgaria.6.b:0 "Seek a settlement that preserves stability."
#

# China events #
    ww1_china.1.t: "Gengxu New Army Uprising"
    ww1_china.1.d:0 "An uprising involving New Army troops has been defeated in Guangzhou. With the revolutionary leader Ni Yingdian killed, the authorities are restoring control, although the revolt has exposed the depth of hostility toward the government."
    ww1_china.1.a:0 "Restore control of the city."
    ww1_china.2.t:0 "The Guangzhou Uprising"
    ww1_china.2.d:0 "Another revolutionary attempt in Guangzhou has been defeated. The deaths of the insurgents have made them martyrs to their supporters and deepened opposition to the dynasty."
    ww1_china.2.a:0 "Unrest continues to spread."
    ww1_china.3.t:0 "The Wuchang Uprising"
    ww1_china.3.d:0 "Revolutionaries have seized Wuchang after the discovery of a conspiracy forced them to act. The government fears that the revolt will encourage further defections across the provinces."
    ww1_china.3.a:0 "Defend the dynasty."
    ww1_china.3.b:0 "Stand with the revolution."
    ww1_china.4.t:0 "The Uprising in Changsha"
    ww1_china.4.d:0 "Revolutionary forces have taken Changsha, extending the uprising beyond Wuchang. The collapse of local imperial authority threatens to draw more of Hunan into the revolt."
    ww1_china.4.a:0 "Reassess our position in Hunan."
    ww1_china.5.t: "Shaanxi Uprising"
    ww1_china.5.d:0 "Revolutionaries have seized Xi'an after fighting with the imperial forces. The uprising in Shaanxi has opened another breach in the dynasty's authority as the court struggles to contain the spreading revolt."
    ww1_china.5.a:0 "Another province slips away."
    ww1_china.6.t: "Jiujiang Uprising"
    ww1_china.6.d:0 "New Army units have risen in Jiujiang and established a revolutionary military government. The loss of the city weakens imperial authority in Jiangxi and adds another centre to the rebellion."
    ww1_china.6.a:0 "The revolt spreads."
    ww1_china.7.t:0 "The Uprising in Taiyuan"
    ww1_china.7.d:0 "New Army troops under Yan Xishan have seized Taiyuan and overthrown the provincial authorities. Shanxi now joins the revolt as the dynasty struggles to retain control beyond the capital."
    ww1_china.7.a:0 "The dynasty faces another defection."
    ww1_china.8.t: "Kunming Uprising"
    ww1_china.8.d:0 "Revolutionaries, supported by New Army officers, have taken Kunming. The uprising has brought Yunnan into the growing movement against the imperial government."
    ww1_china.8.a:0 "The revolution reaches Yunnan."
    ww1_china.9.t:0 "The Garrison Driven from Tibet"
    ww1_china.9.d:0 "Tibetan militia have attacked the imperial garrison and driven our forces from their positions. Local leaders are asserting their independence as the government's authority weakens across the empire."
    ww1_china.9.a:0 "Our authority has collapsed in Tibet."
    ww1_china.10.t: "Shanghai Uprising"
    ww1_china.10.d:0 "An armed uprising has taken control of Shanghai with support from elements of the local police. The loss of the city gives the revolution another important centre of influence and supply."
    ww1_china.10.a:0 "Shanghai is beyond our control."
    ww1_china.11.t:0 "Revolt in Guizhou and Zhejiang"
    ww1_china.11.d:0 "Revolutionary forces have taken Guiyang and Hangzhou as provincial authorities lose control in Guizhou and Zhejiang. Each new uprising makes it harder for the court to organise a common response."
    ww1_china.11.a:0 "The court must find a response."
    ww1_china.12.t:0 "Revolt in Jiangsu and Anhui"
    ww1_china.12.d:0 "Revolutionary movements in Jiangsu and Anhui have defeated the forces defending imperial authority. The spreading revolt is leaving the government with fewer provinces on which it can depend."
    ww1_china.12.a:0 "More provinces abandon the dynasty."
    ww1_china.13.t: "Guangxi Uprising"
    ww1_china.13.d:0 "Provincial leaders in Guangxi have broken with the Qing government and joined the revolution. The change of authority brings another province into the struggle over China's future."
    ww1_china.13.a:0 "Guangxi has broken with the court."
    ww1_china.14.t: "Fujian Uprising"
    ww1_china.14.d:0 "Fujian has declared its separation from the Qing government following an uprising by New Army troops. Imperial forces have been defeated, and revolutionary leaders are establishing control of the province."
    ww1_china.14.a:0 "Imperial authority gives way."
    ww1_china.15.t: "Guangdong Uprising"
    ww1_china.15.d:0 "Local militias have risen across Guangdong, and provincial representatives have declared their support for the revolution. The imperial government faces the loss of another major province as its officials retreat from their positions."
    ww1_china.15.a:0 "The revolution gains another province."
    ww1_china.16.t: "Shandong Uprising"
    ww1_china.16.d:0 "Officials and New Army officers in Shandong have agreed to break with the imperial government. Their declaration further isolates the court as the revolution gains the support of provincial authorities."
    ww1_china.16.a:0 "The court is increasingly isolated."
    ww1_china.17.t: "Ningxia Uprising"
    ww1_china.17.d:0 "An uprising in Ningxia has established a revolutionary military government. The new authority has declared its support for the wider revolt against the dynasty."
    ww1_china.17.a:0 "The uprising spreads to Ningxia."
    ww1_china.18.t: "Sichuan Independence"
    ww1_china.18.d:0 "Chengdu and the provincial authorities in Sichuan have declared their independence from the imperial government. The revolt has driven out Qing officials and opened another front in the struggle over the dynasty."
    ww1_china.18.a:0 "Sichuan has joined the revolt."
    ww1_china.19.t:0 "The Abdication of Puyi"
    ww1_china.19.d:0 "Empress Dowager Longyu has endorsed an edict ending Puyi's rule after negotiations brokered by Yuan Shikai. The dynasty relinquishes its claim to govern China as arrangements are made for the former emperor's household and the transfer of authority to the republic."
    ww1_china.19.a:0 "The dynasty relinquishes the throne."
    ww1_china.20.t: "The Second Revolution"
    ww1_china.20.d:0 "Opposition to Yuan Shikai has developed into a new revolutionary challenge. Sun Yat-sen and his supporters call for resistance as Yuan moves against the Kuomintang and the assemblies that could limit his authority."
    ww1_china.20.a:0 "The government must meet this challenge."
    ww1_china.21.t:0 "Yuan Shikai Becomes President"
    ww1_china.21.d:0 "Sun Yat-sen has agreed to yield the presidency to Yuan Shikai following the negotiated abdication of the Qing emperor. Yuan now takes responsibility for holding the new republic together amid rival military and provincial interests."
    ww1_china.21.a:0 "Yuan assumes the presidency."
    ww1_china.22.t:0 "Yuan Shikai Claims the Throne"
    ww1_china.22.d:0 "Yuan Shikai has accepted an invitation to assume the imperial throne under the reign name Hongxian. The declaration has provoked opposition at home and uncertainty abroad as critics prepare to resist the return of monarchy."
    ww1_china.22.a:0 "Proclaim the Hongxian reign."
    ww1_china.23.t:0 "The National Protection War"
    ww1_china.23.d:0 "Provincial leaders have risen against Yuan Shikai's imperial government and proclaimed a campaign to defend the republic. Forces from Yunnan are preparing to advance as other provinces consider whether to join them."
    ww1_china.23.a:0 "The republic has its defenders."
    ww1_china.24.t:0 "Yuan Shikai's Decision"
    ww1_china.24.d:0 "Opposition to the imperial restoration is spreading. Yuan Shikai must decide whether to abandon the throne and restore the republic or attempt to preserve the monarchy by force."
    ww1_china.24.a:0 "Abandon the imperial title."
    ww1_china.24.b:0 "Defend the throne."
    ww1_china.25.t: "Yuan Shikai Dies"
    ww1_china.25.d:0 "Yuan Shikai has died, removing the ruler whose imperial ambitions divided the republic. Provincial leaders are reassessing their positions as the government confronts the task of restoring unity after the National Protection War."
    ww1_china.25.a:0 "Rebuild the government after the crisis."
    ww1_china.26.t: "Revival of the Monarchy?"
    ww1_china.26.d:0 "Supporters of Yuan Shikai are urging a restoration of monarchy, arguing that a stronger throne could bring stability to the republic. Opponents warn that the proposal would betray the revolution and provoke another struggle over the country's government."
    ww1_china.26.a:0 "The proposal will divide the country."
    ww1_china.27.t:0 "The Provisional Government"
    ww1_china.27.d:0 "The provisional authorities are establishing their control over the ministries and military commands. Officers across the country await instructions as the new government takes shape."
    ww1_china.27.a:0 "Prepare the administration."
    ww1_china.28.t:0 "The Republican Administration"
    ww1_china.28.d:0 "The new authorities have issued orders to the army and the provincial administrations. Restoring a dependable chain of command is an urgent task after the upheaval."
    ww1_china.28.a:0 "The government must get to work."
#

# WW1 Ethiopia #
    ww1_ethiopia.1.t:0 "The Death of Menelik II"
    ww1_ethiopia.1.d:0 "Emperor Menelik II has died after years of failing health. The court must manage the succession while the regency and the great nobles seek to preserve their influence over the government."
    ww1_ethiopia.1.a:0 "The succession must be secured."
    ww1_ethiopia.2.t:0 "Zewditu Is Proclaimed Empress"
    ww1_ethiopia.2.d:0 "The nobles and the Church have moved against Lij Iyasu and proclaimed Zewditu empress. The change at court opens a new struggle over authority as the government seeks recognition and stability."
    ww1_ethiopia.2.a: "Interesting..."
#

# WW1 France
    ww1_france.1.t:0 "An Offer to Italy"
    ww1_france.1.d:0 "Our diplomats have offered support for Italian claims in Austria-Hungary in exchange for joining the Entente. The promise is intended to draw Rome away from its former partners."
    ww1_france.1.a:0 "Present the proposal."
    ww1_france.101.t:0 "The French Territorial Proposal"
    ww1_france.101.d:0 "France offers support for Italian claims within the Habsburg monarchy in exchange for joining the Entente. The cabinet must judge whether the promised settlement justifies abandoning our present position."
    ww1_france.101.a:0 "Accept the French terms."
    ww1_france.101.b:0 "Decline the proposal."
    ww1_france.102.t:0 "Italy Accepts the Treaty"
    ww1_france.102.d:0 "Rome has accepted our promise of territorial gains at Austria-Hungary's expense. The agreement brings Italian entry into the war closer."
    ww1_france.102.a:0 "Coordinate the preparations."
    ww1_france.103.t:0 "Italy Refuses the Treaty"
    ww1_france.103.d:0 "Rome has rejected our proposed territorial settlement. Our diplomats have failed to persuade the Italian government to join the Entente on the terms offered."
    ww1_france.103.a:0 "An unwelcome answer."
    ww1_france.2.t:0 "Concessions to Italy"
    ww1_france.2.d:0 "The government has offered Savoy and Corsica in an attempt to secure Italian cooperation. Such a bargain would carry a heavy cost for France, but its supporters believe Italian support could decide the war."
    ww1_france.2.a:0 "Proceed with the agreement."
    ww1_france.3.t:0 "The Italian Invitation"
    ww1_france.3.d:0 "Our representatives have formally invited Italy to join the alliance on the basis of the territorial agreement. Rome must now complete its military preparations and authorise intervention before Italian forces can enter the war."
    ww1_france.3.a:0 "Await Rome's decision."
    ww1_france.4.t:0 "French Assistance for Serbia"
    ww1_france.4.d:0 "French forces are being prepared to support the Serbian army. Their orders are to help resist the enemy advance and strengthen the position of our Balkan ally."
    ww1_france.4.a:0 "Send the expedition."
    ww1_france.5.t:0 "The Blockade of Greece"
    ww1_france.5.d:0 "Entente forces have begun restricting Greek shipping to pressure the royal government. Ministers hope that this measure will force a decision over Greek participation in the war."
    ww1_france.5.a:0 "Maintain the pressure."
    ww1_france.6.t:0 "Greece Joins the Entente"
    ww1_france.6.d:0 "Greece has joined the Entente following the change in its government. Cooperation with Athens will strengthen the allied position in the Balkans."
    ww1_france.6.a:0 "Coordinate our forces."
    ww1_france.7.t:0 "Equipment for Greece"
    ww1_france.7.d:0 "Military supplies are being sent to Greece to support its army. Our representatives hope that the deliveries will improve the allied position on the Balkan front."
    ww1_france.7.a:0 "Dispatch the equipment."
    ww1_france.8.t:0 "The Army of the Orient"
    ww1_france.8.d:0 "French troops are being committed to the Balkan campaign. They will reinforce the allied army and support operations alongside the Greek forces."
    ww1_france.8.a:0 "Prepare the expedition."
    ww1_france.9.t:0 "The Loss of Liberté"
    ww1_france.9.d:0 "An explosion has destroyed the battleship Liberté in Toulon harbour. Fire in the ammunition magazines tore through the ship and scattered wreckage across nearby vessels, causing heavy casualties."
    ww1_france.9.a:0 "Mourn the lost sailors."
    ww1_france.10.t:0 "The Russian Expedition"
    ww1_france.10.d:0 "Russian troops are being sent to serve alongside our army on the Western Front. The agreement also provides for French munitions to support the Russian war effort."
 ww1_france.10.a:0 "Coordinate the mission."
    ww1_france.11.t:0 "An Offer to Romania"
    ww1_france.11.d:0 "Our diplomats have offered support for Romanian claims in Transylvania and Bukovina. Bucharest must weigh the promised gains against the risks of entering the war and the position of the Russian army."
    ww1_france.11.a:0 "Present our terms."
    ww1_france.1101.t:0 "A French Offer to Romania"
    ww1_france.1101.d:0 "French diplomats have offered support for Romanian claims in Transylvania and Bukovina in return for joining the Entente. The promise opens a path to expansion, but would commit Romania to war against the Central Powers."
    ww1_france.1101.a:0 "Join the Entente."
    ww1_france.1101.b:0 "Preserve our neutrality."
    ww1_france.1102.t: "Romania Agrees to Proposal"
    ww1_france.1102.d: "The Kingdom of Romania has graciously agreed to our proposal offering Transylvania and Bucovina in return for their support in our war against the Central Powers, they shall join the war effort once they are ready"
    ww1_france.1102.a: "Great"
    ww1_france.1103.t: "Romania Declines Proposal, Claims Neutrality"
    ww1_france.1103.d: "The Kingdom if Romania has unfortunately declined our generous proposal offering Transylvania and Bucovina in return for their support in our war against the Central Powers, they cite Romanian neutrality as the main reason refusing to join the war, for now at least."
    ww1_france.1103.a: "What a shame..."
    ww1_france.12.t: "Romania Joins the Entente"
    ww1_france.12.d:0 "Romania has accepted the allied offer and entered the war. Its campaign against Austria-Hungary will open another front in the struggle."
    ww1_france.12.a:0 "Coordinate the campaign."
    ww1_france.13.t:0 "Britain Enters the Entente"
    ww1_france.13.d:0 "Britain has entered the war following the violation of Belgian neutrality. Our governments are arranging the military and diplomatic cooperation required for a common campaign."
    ww1_france.13.a:0 "France welcomes its new ally."
    ww1_france.14.t:0 "The British Expeditionary Force"
 ww1_france.14.d:0 "British and French officers are coordinating the arrival of the expeditionary forces. Ports, billets and supply routes must be prepared so that the armies can operate together."
    ww1_france.14.a:0 "Prepare for their arrival."
    ww1_france.15.t:0 "The Memory of 1871"
    ww1_france.15.d:0 "The loss of Alsace-Lorraine remains a powerful force in French politics. Newspapers and patriotic associations are renewing their appeals for national resolve in the face of Germany."
    ww1_france.15.a:0 "France has not forgotten."
    ww1_france.16.t:0 "The Russian Alliance"
    ww1_france.16.d:0 "Cooperation with Russia remains central to our security. The alliance forces Germany to consider threats on both its eastern and western frontiers."
    ww1_france.16.a:0 "Maintain close cooperation."
    ww1_france.17.t: "Agadir Crisis"
    ww1_france.17.d: "French forces are moving into the interior of Morocco. Germany is demanding colonial compensation and is sending a gunboat to Agadir, so Paris refers the dispute to Berlin before the crisis becomes a wider war."
    ww1_france.17.a: "Refer the dispute to Berlin"
 ww1_france.18.t:0 "The Three-Year Service Law"
 ww1_france.18.d:0 "Active military service has been extended to three years. Recruiting offices and depots must administer the longer commitment as Parliament debates its burden on the country."
 ww1_france.18.a:0 "Put the law into effect."
    ww1_france.19.t:0 "Strengthening the Frontier"
    ww1_france.19.d:0 "Further defensive works have been prepared along the German frontier. The army intends these positions to support its deployment and protect the approaches to the interior."
    ww1_france.19.a:0 "Prepare the positions."
    ww1_france.20.t:0 "The Sacred Union"
    ww1_france.20.d:0 "Political leaders have agreed to suspend their immediate disputes for the defence of France. The wartime truce will place the government's programme before a broad coalition of parties and labour representatives."
    ww1_france.20.a:0 "Stand together for France."
    ww1_france.21.t: "Defending the Colonies"
    ww1_france.21.d:0 "The government has authorised further defensive works in the African colonies. The local garrisons will use these positions to protect important routes and settlements."
    ww1_france.21.a:0 "Strengthen the colonial defences."
    ww1_france.22.t:0 "Troops from the Colonies"
    ww1_france.22.d:0 "Further colonial contingents are being sent to metropolitan France. The army will prepare them for service as the demands of the front continue to grow."
    ww1_france.22.a:0 "Prepare the contingents for service."
    ww1_france.23.t:0 "Troops from the Colonies"
    ww1_france.23.d:0 "Further colonial contingents are being sent to metropolitan France. The army will prepare them for service as the demands of the front continue to grow."
    ww1_france.23.a:0 "Prepare the contingents for service."
    ww1_france.24.t:0 "Troops from the Colonies"
    ww1_france.24.d:0 "Further colonial contingents are being sent to metropolitan France. The army will prepare them for service as the demands of the front continue to grow."
    ww1_france.24.a:0 "Prepare the contingents for service."
    ww1_france.25.t:0 "The Assassination of Jean Jaurès"
    ww1_france.25.d:0 "Jean Jaurès has been shot dead in a Paris café. The socialist leader's murder has shocked the country as Europe approaches war and deprived its opponents of one of their most prominent voices."
    ww1_france.25.a:0 "A grave loss for the Republic."
    ww1_france.26.t:0 "National Unity"
    ww1_france.26.d:0 "The government has appealed to political parties and civic organisations to place the defence of France ahead of their disputes. Ministers hope that a common effort will sustain the army and the population through the war."
    ww1_france.26.a:0 "For the defence of the Republic."
    ww1_france.27.t:0 "French Industry Mobilises"
    ww1_france.27.d:0 "Further industrial resources have been assigned to military production. The government is pressing factories and transport authorities to meet the army's requirements."
    ww1_france.27.a:0 "Keep the armies supplied."
    ww1_france.28.t: "Construction of New Defenses"
    ww1_france.28.d: "In an effort to provide more defenses across France with the outbreak of war with Germany we have begun to initiate construction which should hopefully stall the German Advance."
    ww1_france.28.a: "Lets hope we can build it in time"
    ww1_france.29.t: "Construction Effort"
    ww1_france.29.d: "In order to try and increase military productivity we have advocated for more construction of military factories which are key to winning this war."
    ww1_france.29.a: "Good"
    ww1_france.30.t:0 "Civilian Supply"
    ww1_france.30.d:0 "Ministers have reviewed the shortages created by mobilisation. New measures are intended to protect civilian supplies while the army continues its campaign."
    ww1_france.30.a:0 "Carry out the programme."
    ww1_france.31.t:0 "The Burden at Home"
    ww1_france.31.d:0 "The demands of the front are placing an increasing strain on households and essential services. The government has ordered further attention to civilian needs."
    ww1_france.31.a:0 "Carry out the programme."
    ww1_france.32.t:0 "Sustaining the Population"
    ww1_france.32.d:0 "Relief and supply officials are expanding their work as the war continues. Maintaining confidence at home is becoming as important as meeting the army's orders."
    ww1_france.32.a:0 "Carry out the programme."
    ww1_france.33.t:0 "Priority for the Armies"
    ww1_france.33.d:0 "The army has secured a greater share of France's industrial resources. Military deliveries will take precedence as commanders prepare for the next operations."
    ww1_france.33.a:0 "Carry out the programme."
    ww1_france.34.t:0 "Supplying the Offensive"
    ww1_france.34.d:0 "Factories and transport offices have received new military schedules. Ministers are giving priority to the material needed by the formations at the front."
    ww1_france.34.a:0 "Carry out the programme."
 ww1_france.35.t:0 "Front-Line Coordination"
    ww1_france.35.d:0 "Army headquarters and the supply services are coordinating their plans for the coming campaign. The government has instructed civilian departments to accommodate these military requirements."
    ww1_france.35.a:0 "Carry out the programme."
    ww1_france.36.t:0 "An Air Raid on Paris"
    ww1_france.36.d:0 "German airships have bombed Paris, bringing the war into the capital. Officials are assessing the damage and preparing further measures to protect the population from another attack."
    ww1_france.36.a:0 "Strengthen the city's defences."
    ww1_france.37.t:0 "A New Ministry"
    ww1_france.37.d:0 "Ernest Monis has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.37.a:0 "The ministry begins its work."
    ww1_france.38.t:0 "A New Ministry"
    ww1_france.38.d:0 "Joseph Caillaux has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.38.a:0 "The ministry begins its work."
    ww1_france.39.t:0 "A New Ministry"
    ww1_france.39.d:0 "Raymond Poincaré has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.39.a:0 "The ministry begins its work."
    ww1_france.40.t:0 "A New Ministry"
    ww1_france.40.d:0 "Aristide Briand has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.40.a:0 "The ministry begins its work."
    ww1_france.41.t:0 "A New Ministry"
    ww1_france.41.d:0 "Louis Barthou has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.41.a:0 "The ministry begins its work."
    ww1_france.42.t:0 "A New Ministry"
    ww1_france.42.d:0 "Gaston Doumergue has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.42.a:0 "The ministry begins its work."
    ww1_france.43.t:0 "A New Ministry"
    ww1_france.43.d:0 "Alexandre Ribot has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.43.a:0 "The ministry begins its work."
    ww1_france.44.t:0 "A New Ministry"
    ww1_france.44.d:0 "René Viviani has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.44.a:0 "The ministry begins its work."
    ww1_france.45.t:0 "A New Ministry"
    ww1_france.45.d:0 "Aristide Briand has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.45.a:0 "The ministry begins its work."
    ww1_france.46.t:0 "A New Ministry"
    ww1_france.46.d:0 "Alexandre Ribot has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.46.a:0 "The ministry begins its work."
    ww1_france.47.t:0 "A New Ministry"
    ww1_france.47.d:0 "Paul Painlevé has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.47.a:0 "The ministry begins its work."
    ww1_france.48.t:0 "A New Ministry"
    ww1_france.48.d:0 "Georges Clemenceau has formed a new government. The ministers are taking up their portfolios and preparing to secure parliamentary support."
    ww1_france.48.a:0 "The ministry begins its work."
    ww1_france.49.t:0 "General Mobilisation"
    ww1_france.49.d:0 "The government has ordered general mobilisation. Reservists are reporting to their depots as the railways begin carrying formations towards the frontier."
    ww1_france.49.a:0 "Carry out the mobilisation orders."
    ww1_france.50.t:0 "The Allied Counteroffensive"
    ww1_france.50.d:0 "The German offensive has lost its momentum, and the Allied armies are preparing a sustained counterattack. Commanders intend to exploit the enemy's weakened position and deny it time to rebuild its defences."
    ww1_france.50.a:0 "Take the offensive."
    ww1_france.51.t:0 "American Troops Arrive"
    ww1_france.51.d:0 "Further American contingents have arrived in France. Their deployment is strengthening the allied armies as the demands of the front continue to grow."
    ww1_france.51.a:0 "Coordinate their deployment."
#

# WW1 Germany #
    ww1_germany.1.t:0 "The Ottoman-German Alliance"
    ww1_germany.1.d:0 "Berlin and Constantinople have ratified their alliance. Military cooperation will strengthen Ottoman forces and extend German influence into the Near East."
    ww1_germany.1.a:0 "Confirm the agreement."
    ww1_germany.2.t:0 "Supplies for the Dervishes"
    ww1_germany.2.d:0 "Arms and supplies are being sent to the Dervish movement in Somaliland. Its resistance offers an opportunity to challenge British authority far from Europe."
    ww1_germany.2.a:0 "Dispatch the supplies."
    ww1_germany.3.t:0 "An Approach to Jabal Shammar"
    ww1_germany.3.d:0 "Our envoys report common interests with the Rashidi emirate. Its rivalry with Nejd and its ties to the Ottomans offer a basis for closer relations."
    ww1_germany.3.a:0 "Pursue the discussions."
    ww1_germany.4.t:0 "An Approach to the Dervishes"
    ww1_germany.4.d:0 "The Dervish struggle against British rule has attracted the attention of our diplomats. Cooperation could place further pressure on British possessions in East Africa."
    ww1_germany.4.a:0 "Establish contact."
    ww1_germany.5.t:0 "The Dervishes Join the Central Powers"
    ww1_germany.5.d:0 "The Dervish movement has joined our alliance. The struggle in Somaliland now forms part of the wider war against the Entente."
    ww1_germany.5.a:0 "Welcome our new ally."
    ww1_germany.6.t:0 "Jabal Shammar Joins the Central Powers"
    ww1_germany.6.d:0 "The Rashidi emirate has entered the war beside us. Our diplomats have promised support against Nejd in return for its cooperation against Britain and its partners."
    ww1_germany.6.a:0 "Welcome our new ally."
    ww1_germany.7.t:0 "Work on the Baghdad Railway"
    ww1_germany.7.d:0 "Construction continues on the railway linking the Ottoman interior with Baghdad. Engineers are extending the line through difficult country as Berlin and Constantinople seek a dependable commercial and military connection."
    ww1_germany.7.a:0 "Continue construction."
    ww1_germany.8.t:0 "Extending the Baghdad Railway"
    ww1_germany.8.d:0 "Further sections of the Baghdad Railway are being laid. Each completed stretch strengthens the connection between the Ottoman provinces and the European rail network."
    ww1_germany.8.a:0 "Keep the work moving."
    ww1_germany.9.t:0 "The Railway Reaches Further East"
    ww1_germany.9.d:0 "Work on the Baghdad Railway is approaching its final stages. Completing the remaining sections will improve access to Mesopotamia and its ports."
    ww1_germany.9.a:0 "Finish the remaining sections."
    ww1_germany.10.t:0 "The Baghdad Railway Completed"
    ww1_germany.10.d:0 "The final sections of the Baghdad Railway have been completed. The new connection strengthens trade with Mesopotamia and gives our Ottoman partners a more reliable route for men and supplies."
    ww1_germany.10.a:0 "A major undertaking completed."
    ww1_germany.11.t:0 "The Silesian Proposal"
    ww1_germany.11.d:0 "Ministers propose offering Silesia to Austria-Hungary in return for the cession of South Tyrol to Italy. They hope that a territorial bargain can preserve Italian neutrality."
    ww1_germany.11.a:0 "Present the proposal to Vienna."
    ww1_germany.1101.t:0 "The Silesian Bargain"
    ww1_germany.1101.d:0 "Berlin has offered us the industrial province of Silesia in exchange for South Tyrol. The Germans hope that ceding the latter to Italy will keep Rome out of the war, but the bargain would redraw the frontier of our own monarchy."
    ww1_germany.1101.a:0 "Accept the exchange."
    ww1_germany.1101.b:0 "South Tyrol is not for sale."
    ww1_germany.1102.t:0 "An Offer of South Tyrol"
    ww1_germany.1102.d:0 "Vienna is prepared to cede South Tyrol if Italy remains neutral. Accepting would secure a substantial territorial gain, while abandoning the prospect of greater concessions from the opposing coalition."
    ww1_germany.1102.a:0 "Accept the Austrian terms."
    ww1_germany.1102.b:0 "These concessions are insufficient."
    ww1_germany.12.t:0 "Negotiations with Sweden"
    ww1_germany.12.d:0 "Our envoys are seeking Swedish participation in the war against Russia. An agreement could threaten the Russian northern flank, but Stockholm remains wary of abandoning neutrality."
    ww1_germany.12.a:0 "Present our terms."
    ww1_germany.13.t:0 "The Zimmermann Telegram"
    ww1_germany.13.d:0 "British intelligence has intercepted our proposal for an alliance with Mexico. The promise of American territory has caused outrage in Washington, bringing the United States closer to our enemies."
    ww1_germany.13.a:0 "A grave diplomatic setback."
    ww1_germany.1301.t:0 "A German Offer"
    ww1_germany.1301.d:0 "Berlin proposes that Mexico enter the war if the United States takes up arms against Germany. In return, the Germans promise support for the recovery of Texas, Arizona and New Mexico. Such an alliance offers much, but would place us at war with our powerful northern neighbour."
    ww1_germany.1301.a:0 "Accept the German proposal."
    ww1_germany.1301.b:0 "We cannot risk another war."
    ww1_germany.14.t:0 "A German Approach to Stockholm"
    ww1_germany.14.d:0 "German envoys have offered support for Swedish ambitions in Finland in exchange for entering the war against Russia. The proposal appeals to those who wish to reverse Sweden's old losses, but victory is far from assured."
    ww1_germany.14.a:0 "Sweden will stand with Germany."
    ww1_germany.14.b:0 "Our interests are best served by peace."
    ww1_germany.15.t:0 "Romanian Neutrality"
    ww1_germany.15.d:0 "Our diplomats in Bucharest have proposed a settlement over Bessarabia in return for Romanian neutrality. The promise must compete with Romanian ambitions in Transylvania, which draw the government towards our enemies."
    ww1_germany.15.a:0 "Let Bucharest consider the terms."
    ww1_germany.1501.t:0 "The Bessarabian Proposal"
    ww1_germany.1501.d:0 "Germany offers support for the acquisition of Bessarabia after a victory over Russia, provided Romania remains neutral. The government must weigh this prospect against the claims in Transylvania and the promises of the Entente."
    ww1_germany.1501.a:0 "Accept the German terms."
    ww1_germany.1501.b:0 "Keep our freedom of action."
    ww1_germany.16.t:0 "Defences in East Africa"
    ww1_germany.16.d:0 "New defensive positions have been prepared in German East Africa. The colonial authorities hope to protect important approaches and make better use of the forces available."
    ww1_germany.16.a:0 "Strengthen the colonial defences."
    ww1_germany.17.t:0 "Defences in Southwest Africa"
    ww1_germany.17.d:0 "Construction crews have improved defensive positions in German Southwest Africa. The garrison is preparing to resist an attack on the colony."
    ww1_germany.17.a:0 "Prepare the garrison."
    ww1_germany.18.t:0 "Defences in Cameroon"
    ww1_germany.18.d:0 "The colonial administration has strengthened defensive positions in Cameroon. These works will support the garrison if the European conflict reaches the colony."
    ww1_germany.18.a:0 "Prepare the defences."
    ww1_germany.19.t: "Agadir Crisis"
    ww1_germany.19.d: "French forces are moving into the interior of Morocco. The Kaiser is demanding colonial compensation and is sending a gunboat to Agadir, putting Berlin and Paris on a dangerous diplomatic footing."
    ww1_germany.19.a: "Demand colonial compensation"
    ww1_germany.19.b: "Withdraw from the crisis"
    ww1_germany.260.t: "France Weighs the Agadir Demand"
    ww1_germany.260.d: "Berlin is demanding colonial compensation for France's move in Morocco. Paris can accept the proposed settlement and preserve the peace, or reject the demand and risk a further confrontation."
    ww1_germany.260.a: "Accept the settlement"
    ww1_germany.260.b: "Reject the demand"
    ww1_germany.261.t: "Confirm the Agadir Settlement"
    ww1_germany.261.d: "France accepts the colonial compensation proposed by Berlin. Germany can confirm the agreement and bring the crisis to a negotiated close."
    ww1_germany.261.a: "Confirm the agreement"
    ww1_germany.262.t:0 "The Agadir Negotiations Fail"
    ww1_germany.262.d:0 "Paris has rejected our demand for colonial compensation. The government must decide whether to withdraw the gunboat and end the confrontation or maintain a limited claim against French possessions."
    ww1_germany.262.a:0 "End the confrontation."
    ww1_germany.262.b:0 "Maintain our claim."
    ww1_germany.263.t: "The Agadir Settlement"
    ww1_germany.263.d: "The negotiated settlement is taking effect. Germany receives its colonial compensation, France consolidates its Moroccan position, and Spain receives the Rif."
    ww1_germany.263.a: "The agreement takes effect"
    ww1_germany.264.t: "The Agadir Crisis Closes"
    ww1_germany.264.d: "Germany closes the Agadir crisis after withdrawing or issuing a limited claim. The dispute remains bounded and does not automatically become a general war."
    ww1_germany.264.a: "Close the crisis"

    ww1_germany.265.t: "The Shape of the Reichstag"
    ww1_germany.265.d: "The constitutional question has returned to the centre of German politics. The crown can preserve the Prussian three class franchise and build a stronger Reichstag through federal compromise, or accept equal votes and allow the national parliament to speak with a broader mandate. The decision will define how the Empire governs the war."
    ww1_germany.265.a: "Preserve the Prussian franchise"
    ww1_germany.265.b: "Adopt equal votes for the Reichstag"
    ww1_germany.266.t: "The Zabern Question"
    ww1_germany.266.d: "The affair at Zabern has made the old boundary between military honour and civilian authority impossible to ignore. Deputies demand an inquiry into the conduct of officers, while the army warns that public criticism will weaken discipline. Berlin must decide whether accountability will strengthen the Empire or whether the matter should be shelved."
    ww1_germany.266.a: "Hold the officers accountable"
    ww1_germany.266.b: "Protect the army from parliamentary interference"
    ww1_germany.267.t: "War Credits and Civil Authority"
    ww1_germany.267.d: "The next war credit will decide more than the payment of shells and railway contracts. A civilian hearing can give the Reichstag a voice over the campaign, while an emergency command can place speed and secrecy above party debate. Both courses can sustain the front; only one will set the balance of power inside the Empire."
    ww1_germany.267.a: "Let the Reichstag review the credits"
    ww1_germany.267.b: "Give the emergency command priority"
    ww1_germany.268.t: "The Supreme Command Demands Power"
    ww1_germany.268.d: "The failures of the opening campaigns and the scale of the material war have brought Hindenburg and Ludendorff to the centre of government. They promise a unified direction of the front, but their authority would reach into procurement, labour and diplomacy. The chancellor may accept a Third OHL or insist that ministers remain responsible for the war."
    ww1_germany.268.a: "Entrust the war to the Third OHL"
    ww1_germany.268.b: "Keep the army under civilian authority"
    ww1_germany.269.t: "The Peace Resolution or the Fatherland"
    ww1_germany.269.d: "The Reichstag has drafted a peace resolution while nationalist associations organise around the Fatherland Party. One programme seeks a settlement without annexations that can reunite the parties; the other promises victory and a settlement imposed on Germany's enemies. The choice will reach every factory, newspaper and regiment."
    ww1_germany.269.a: "Stand behind the Peace Resolution"
    ww1_germany.269.b: "Rally behind the Fatherland Party"
    ww1_germany.270.t: "The Easter Message"
    ww1_germany.270.d: "The crown's Easter message can promise a constitutional reform after the emergency. A public commitment may preserve the parties' cooperation, yet the army and conservative estates fear that promises made under pressure will become concessions. Berlin must decide whether to speak now or defer the question."
    ww1_germany.270.a: "Promise constitutional reform"
    ww1_germany.270.b: "Defer the promise until victory"
    ww1_germany.271.t: "The October Reforms"
    ww1_germany.271.d: "With the war approaching its final crisis, the government can make the chancellor responsible to the Reichstag and allow parliamentary confidence to determine the ministry. Reform may preserve the Empire's legitimacy, while delay protects the old order at the cost of trust."
    ww1_germany.271.a: "Enact the October reforms"
    ww1_germany.271.b: "Delay the constitutional settlement"
    ww1_germany.272.t:0 "The Crown in Crisis"
    ww1_germany.272.d:0 "Unrest has spread from the ports to the cities, while the front offers little hope of recovery. Ministers fear that the monarchy can survive only through immediate reform. Others believe the Kaiser's abdication is now unavoidable."
    ww1_germany.272.a:0 "Preserve the crown through reform."
    ww1_germany.272.b:0 "Prepare for the Kaiser's abdication."
    ww1_germany.273.t: "A Republic in Berlin"
    ww1_germany.273.d: "Friedrich Ebert has accepted responsibility for the provisional government. The imperial ministries, railways and local administrations remain in place, but the new government must secure its authority through elections and a national assembly while demobilisation tests every institution."
    ww1_germany.273.a: "Entrust the republic to Ebert"
    ww1_germany.274.t: "A Constitution for Victory"
    ww1_germany.274.d: "A favourable settlement has given Germany time to decide what victory should mean at home. The crown can ratify a constitutional Empire with a responsible parliament, or seek a broader compromise among the federal states, veterans and the old parties. A stable peace requires more than a military triumph."
    ww1_germany.274.a: "Ratify the constitutional Empire"
    ww1_germany.274.b: "Build a wider imperial compromise"
    ww1_germany.275.t: "Reconciliation in the Empire"
    ww1_germany.275.d: "Veterans, parties and the federal governments have accepted that the war cannot be followed by another struggle over the constitution. A common settlement can restore public confidence and return the army to its constitutional role while the Reichstag takes responsibility for the new order."
    ww1_germany.275.a: "Sign the reconciliation"
    ww1_germany.276.t: "The Potsdam Memorandum"
    ww1_germany.276.d:0 "The Foreign Office proposes a new understanding with Russia. Regular consultations, closer trade and an agreement to avoid war could ease the danger on Germany's eastern frontier. The memorandum is ready for dispatch."
    ww1_germany.276.a:0 "Send the memorandum."
    ww1_germany.276.b:0 "Keep the proposal in reserve."
    ww1_germany.277.t:0 "The German Memorandum"
    ww1_germany.277.d:0 "Berlin has proposed closer trade, regular diplomatic consultations and an agreement to preserve peace between our empires. Supporters see a chance to secure the frontier; opponents distrust German intentions and fear the reaction of our existing partners."
    ww1_germany.277.a:0 "Accept the understanding."
    ww1_germany.277.b:0 "Reject the German proposal."
    ww1_germany.278.t: "Berlin Receives the Russian Reply"
    ww1_germany.278.d: "Petrograd has answered the Potsdam memorandum. Acceptance offers a practical understanding over trade and neutrality, while refusal leaves the eastern question open without forcing either empire into war. Berlin must set the policy that its diplomats will follow."
    ww1_germany.278.a: "Conclude the neutrality understanding"
    ww1_germany.278.b: "Accept the refusal and move on"
    ww1_germany.279.t: "An Invitation to Sofia"
    ww1_germany.279.d:0 "Bulgaria's grievances against Serbia offer an opportunity to strengthen the Central Powers. The Foreign Office proposes a formal invitation, hoping that common interests in the Balkans will persuade Sofia to accept."
    ww1_germany.279.a:0 "Send the invitation."
    ww1_germany.279.b:0 "Keep our distance."
    ww1_germany.280.t:0 "The German Invitation"
    ww1_germany.280.d:0 "A German delegation has offered Bulgaria membership of the Central Powers. The prospect of recovering our position in Macedonia appeals to many in government, but another Balkan war could prove costly."
    ww1_germany.280.a:0 "Bulgaria will join the Central Powers."
    ww1_germany.280.b:0 "Remain outside the alliance."
    ww1_germany.281.t:0 "Sofia's Reply"
    ww1_germany.281.d:0 "The Bulgarian government has delivered its answer to our invitation. The Foreign Office awaits instructions for its response."
    ww1_germany.281.a:0 "Welcome our new ally."
    ww1_germany.281.b:0 "We must respect their decision."
    ww1_germany.282.t: "Bulgaria Joins the Central Powers"
    ww1_germany.282.d: "Bulgaria has accepted Germany's invitation and entered the Central Powers. The new alignment changes the balance of the Balkans, but Sofia retains control over its own decision to enter the war."
    ww1_germany.282.a: "A new partner in the Balkans"
    ww1_germany.283.t: "A Constitutional Reconciliation in Germany"
    ww1_germany.283.d: "The German Empire has announced a constitutional reconciliation after the war. The settlement gives the Reichstag a durable role in public finance and ministry formation while preserving the federal crown and returning the army to its constitutional chain of command."
    ww1_germany.283.a: "A settlement for the new Germany"
    ww1_germany.20.t:0 "The Rupprecht Plan"
    ww1_germany.20.d:0 "The General Staff proposes an advance through Switzerland to turn the French defences. The mountains will make the operation difficult, and violating Swiss neutrality risks widening the war. Nevertheless, its supporters believe that an unexpected approach could break the deadlock."
    ww1_germany.20.a:0 "Issue the orders."
    ww1_germany.21.t:0 "The Schlieffen Plan"
    ww1_germany.21.d:0 "The General Staff proposes advancing through Belgium to turn the French frontier defences. A rapid march towards Paris might force a decisive battle, but violating Belgian neutrality would bring grave diplomatic consequences."
    ww1_germany.21.a:0 "Order the advance."
    ww1_germany.22.t:0 "The Kronprinz Plan"
    ww1_germany.22.d:0 "The General Staff proposes holding the French frontier while concentrating the main offensive in the east. A defensive campaign in the west would spare Belgium and Switzerland from invasion, but demands confidence that our fortifications can hold."
    ww1_germany.22.a:0 "Concentrate our strength in the east."
    ww1_germany.23.t:0 "Goeben and Breslau Reach Constantinople"
    ww1_germany.23.d:0 "Goeben and Breslau have evaded British pursuit and reached Constantinople through the Dardanelles. Their transfer to Ottoman service strengthens the fleet and draws the two governments closer together."
    ww1_germany.23.a:0 "The ships have reached safety."
    ww1_germany.24.t:0 "An Albanian Alliance"
    ww1_germany.24.d:0 "Prince William has agreed to align Albania with Germany after prolonged negotiations. Promises of support over Kosovo and pressure on his precarious finances helped overcome his earlier insistence on neutrality."
    ww1_germany.24.a:0 "A new partner in the Balkans."
    ww1_germany.25.t:0 "The Asia Corps"
    ww1_germany.25.d:0 "A German expedition has been dispatched to assist Ottoman operations. Its medical personnel, engineers and military detachments will support the campaign in the Near East."
    ww1_germany.25.a:0 "Support our Ottoman partners."
    ww1_germany.2501.t:0 "A German Expedition Arrives"
    ww1_germany.2501.d:0 "German troops, medical personnel and engineers have arrived to support our campaign. Their assistance will strengthen the army and help maintain the roads and services on which it depends."
    ww1_germany.2501.a:0 "Welcome the expedition."
    ww1_germany.26.t:0 "Advisers for the Ottoman Army"
    ww1_germany.26.d:0 "German officers are being sent to assist the Ottoman army. Their work will concentrate on training, staff organisation and the conduct of operations."
    ww1_germany.26.a:0 "Dispatch the mission."
    ww1_germany.2601.t:0 "German Military Advisers"
    ww1_germany.2601.d:0 "A new group of German military advisers has arrived. The officers will assist our commanders in training and organising the army."
    ww1_germany.2601.a:0 "Put their experience to use."
    ww1_germany.27.t:0 "The Maritz Rebellion"
    ww1_germany.27.d:0 "Manie Maritz has broken with the South African government and sought our support. His rebellion may divert forces that would otherwise threaten German Southwest Africa."
    ww1_germany.27.a:0 "Support the rebels."
    ww1_germany.28.t:0 "Negotiations with Bulgaria"
    ww1_germany.28.d:0 "Our diplomats are discussing Bulgarian claims in Macedonia. Sofia seeks redress for its losses in the Balkan wars, offering an opening for closer cooperation."
    ww1_germany.28.a:0 "Continue the negotiations."
    ww1_germany.2801.t:0 "German Promises"
    ww1_germany.2801.d:0 "German diplomats have offered support for our claims in Macedonia. The proposal brings us closer to Berlin as ministers consider the preparations required for war."
    ww1_germany.2801.a:0 "Prepare our position."
    ww1_germany.29.t:0 "Bulgaria Prepares for War"
    ww1_germany.29.d:0 "Bulgaria has joined the Central Powers and is preparing to take the field. Its position threatens Serbia and offers a land connection towards the Ottoman Empire."
    ww1_germany.29.a:0 "Coordinate the campaign."
    ww1_germany.2901.t:0 "Bulgaria Enters the War"
    ww1_germany.2901.d:0 "Our forces have received orders to enter the war beside the Central Powers. The campaign against Serbia offers an opportunity to recover territory lost in the Balkan wars."
    ww1_germany.2901.a:0 "Issue the orders."
    ww1_germany.30.t:0 "The September Programme"
    ww1_germany.30.d:0 "Officials have assembled proposals for a settlement after victory. Industrialists, ministers and military leaders are pressing competing demands for territorial gains and economic influence."
    ww1_germany.30.a:0 "Set out our war aims."
    ww1_germany.31.t:0 "A Kingdom of Poland"
    ww1_germany.31.d:0 "The army has pressed for the creation of a dependent Polish kingdom, hoping to draw recruits from the occupied territories. A provisional government is taking shape, but the future frontier and the extent of Polish sovereignty remain unsettled."
    ww1_germany.31.a:0 "Support the new kingdom."
    ww1_germany.31.b:0 "Reserve territory for the Empire."
    ww1_germany.32.t:0 "The Polish Army"
    ww1_germany.32.d:0 "The authorities are organising Polish formations under German supervision. Their oath to the Kaiser will test whether military recruitment can be reconciled with Polish national ambitions."
    ww1_germany.32.a:0 "Proceed with recruitment."
    ww1_germany.3201.t:0 "The Oath of Allegiance"
    ww1_germany.3201.d:0 "German authorities demand that the Polish Legions swear obedience to Kaiser Wilhelm II. Accepting would preserve their place in the German military system; refusing would challenge the authority on which the new Polish state depends."
    ww1_germany.3201.a:0 "Take the oath."
    ww1_germany.3201.b:0 "Polish soldiers must serve Poland."
    ww1_germany.3202.t:0 "The Oath Crisis"
    ww1_germany.3202.d:0 "Most of the Polish Legions have refused the oath of allegiance to the Kaiser. Józef Piłsudski's opposition has become the focus of the dispute, undermining German efforts to raise a dependable Polish army."
    ww1_germany.3202.a:0 "The Polish question remains unresolved."
    ww1_germany.3203.t:0 "The Polish Oath"
    ww1_germany.3203.d:0 "Polish formations have sworn allegiance to the Kaiser. The oath strengthens German authority over the new force and allows recruitment to continue."
    ww1_germany.3203.a:0 "Organise the formations."
    ww1_germany.33.t:0 "A Sealed Train for Lenin"
    ww1_germany.33.d:0 "Vladimir Lenin and his companions have been granted passage through Germany on their way to Russia. Our government hopes that their return will deepen the divisions within our eastern enemy."
    ww1_germany.33.a:0 "Permit the journey."
    #ww1_germany.34.t:0 ""
    #ww1_germany.34.d:0 ""
    #ww1_germany.34.a:0 ""
    ww1_germany.35.t:0 "The Authority of the Crown"
    ww1_germany.35.d:0 "The conduct of the war has raised doubts over the growing power of the generals. Supporters of the crown urge the Kaiser to retain control of the government and resist demands for a military administration."
    ww1_germany.35.a:0 "Authority rests with the Kaiser."
    ww1_germany.36.t:0 "Authority for the High Command"
    ww1_germany.36.d:0 "The Kaiser has agreed to give the military a stronger voice in government. The High Command will now exercise greater influence over the direction of the state and the war."
    ww1_germany.36.a:0 "Entrust the High Command."
    ww1_germany.37.t: "Rebuilding of the Navy"
    ww1_germany.37.d: "The navy is being rebuilt around a disciplined battle fleet, trained crews, and a clear answer to the blockade."
    ww1_germany.37.a: "Build a fleet worthy of the Empire"
    ww1_germany.38.t:0 "The Sinking of Lusitania"
    ww1_germany.38.d:0 "A German submarine has sunk the British liner Lusitania. The loss of civilian passengers, including Americans, has provoked outrage abroad and placed our relations with Washington under severe strain."
    ww1_germany.38.a:0 "Washington will demand an answer."
    ww1_germany.39.t: "Unrestricted Submarine Warfare"
    ww1_germany.39.d:0 "The navy has received authority to attack merchant shipping without observing the usual prize procedures. The Admiralty hopes to cut Britain off from overseas supplies, despite the risk of bringing neutral powers into the war."
    ww1_germany.39.a:0 "Begin the campaign."
    ww1_germany.40.t:0 "The Home Front"
    ww1_germany.40.d:0 "The demands of the army are straining civilian industry. Ministers are debating whether to protect the supply of everyday goods or release more resources to the armaments works."
    ww1_germany.40.a: "Support the home front"
    ww1_germany.40.b: "Demand more from the factories"
    ww1_germany.41.t:0 "Bread and Munitions"
    ww1_germany.41.d:0 "Civilian supplies are tightening as the army places further orders. The government faces renewed pressure to protect household consumption, even as the front calls for more equipment."
    ww1_germany.41.a: "Protect civilian supply"
    ww1_germany.41.b: "Prioritize the front"
    ww1_germany.42.t:0 "The Burden of War"
    ww1_germany.42.d:0 "Food shortages and the demands of mobilisation weigh heavily on the population. The cabinet must decide how much further sacrifice the home front can bear."
    ww1_germany.42.a: "Keep the population fed"
    ww1_germany.42.b: "Accept further sacrifices"
    ww1_germany.43.t:0 "Priority for the Front"
    ww1_germany.43.d:0 "The army has called for a greater share of Germany's industrial output. Meeting its demands will strengthen the front while placing further strain on civilian supplies."
    ww1_germany.43.a: "Sounds good"
    ww1_germany.44.t:0 "The Army's Requirements"
    ww1_germany.44.d:0 "The High Command seeks additional production for the fighting armies. Ministers have agreed to place military deliveries ahead of competing civilian demands."
    ww1_germany.44.a: "Sounds good"
    ww1_germany.45.t:0 "Sustaining the Offensive"
    ww1_germany.45.d:0 "Further allocations of labour and material are being directed to the front. The government hopes that stronger armies can bring the war to an end before the home front is exhausted."
    ww1_germany.45.a: "Sounds good"
    ww1_germany.46.t:0 "Grain from Ukraine"
    ww1_germany.46.d:0 "The government of Hetman Skoropadsky has promised more dependable grain deliveries. Officials hope that Ukrainian supplies will ease the shortages caused by the blockade."
    ww1_germany.46.a:0 "Bring the shipments west."
    ww1_germany.47.t:0 "Preparing for War"
    ww1_germany.47.d:0 "The European crisis is placing the army on alert. Ministries and military commands are reviewing mobilisation arrangements as the prospect of war draws closer."
    ww1_germany.47.a:0 "Complete the preparations."
    ww1_germany.48.t: "Home by Christmas"
    ww1_germany.48.d:0 "The opening of the war has been greeted with confidence. Recruits crowd the stations and newspapers predict a short campaign, while the army prepares for the first great battles."
    ww1_germany.48.a:0 "The armies are on the march."
    ww1_germany.49.t:0 "Shorter Training"
    ww1_germany.49.d:0 "The army is reducing training periods to replace its losses more quickly. New drafts will reach the front sooner, though commanders fear that their preparation will be inadequate."
    ww1_germany.49.a:0 "Send the replacements forward."
    ww1_germany.50.t:0 "The Mission to Kabul"
    ww1_germany.50.d:0 "An expedition has been sent to Afghanistan to seek cooperation against Britain. The envoys hope that shared interests can persuade the Emir to reconsider his neutrality."
    ww1_germany.50.a:0 "Open discussions in Kabul."
    ww1_germany.51.t:0 "Terms for Afghanistan"
    ww1_germany.51.d:0 "Our mission has proposed Afghan entry into the war in return for support against British India. The Emir must weigh these promises against the British subsidies and military pressure on which his position depends."
    ww1_germany.51.a:0 "Await the Emir's reply."
    ww1_germany.5101.t:0 "The German Mission in Kabul"
    ww1_germany.5101.d:0 "German envoys have proposed cooperation against Britain's position in India, holding out the prospect of territorial gains. Accepting would imperil the British subsidies on which our finances depend and expose Afghanistan to a much wider war."
    ww1_germany.5101.a:0 "Preserve our neutrality."
    ww1_germany.5101.b:0 "Accept the German proposal."
    ww1_germany.5102.t:0 "Afghanistan Refuses"
    ww1_germany.5102.d:0 "The Emir has rejected our proposal for entry into the war. Kabul is unwilling to risk its position in exchange for gains that depend on a distant German victory."
    ww1_germany.5102.a:0 "Our mission has failed."
    ww1_germany.5103.t:0 "Afghanistan Accepts"
    ww1_germany.5103.d:0 "The Emir has accepted our proposal and joined the Central Powers. Cooperation with Kabul opens another front against British influence in India."
    ww1_germany.5103.a:0 "Prepare the joint effort."
    ww1_germany.52.t:0 "The Indian Conspiracy"
    ww1_germany.52.d:0 "German agents and Indian revolutionaries are preparing an attempt to undermine British rule. The plan depends on clandestine supplies, contacts within the army and the support of nationalist organisations abroad."
    ww1_germany.52.a:0 "Support the operation."
    ww1_germany.5201.t: "The Hindu-German Conspiracy Unfolds"
    ww1_germany.5201.d: "The Hindu-German conspiracy is moving from planning to action. Intelligence reports indicate whether the network in British India is likely to succeed or has been uncovered."
    ww1_germany.5201.a: "Proceed with the operation"
    ww1_germany.5202.t:0 "Revolt in India"
    ww1_germany.5202.d:0 "Our contacts report that the planned uprising in India has begun. Revolutionaries are rallying around the provisional government as British authorities struggle to contain the rebellion."
    ww1_germany.5202.a:0 "Support the provisional government."
    ww1_germany.52021.t:0 "Revolt in Gujarat"
    ww1_germany.52021.d:0 "Armed revolutionaries have risen in Gujarat and declared for the independence movement. Local authorities are attempting to restore control before the rebellion spreads further."
    ww1_germany.52021.a:0 "Restore control of the province."
    ww1_germany.52022.t:0 "Revolt in Central India"
    ww1_germany.52022.d:0 "Revolutionary forces have risen in several central Indian provinces. The rebels are joining the wider movement against British rule and disrupting the local administration."
    ww1_germany.52022.a:0 "Contain the uprising."
    ww1_germany.52023.t:0 "The Rebellion Spreads"
    ww1_germany.52023.d:0 "Further uprisings have broken out across southern and eastern India. Local garrisons face mounting pressure as revolutionaries attempt to join the wider rebellion."
    ww1_germany.52023.a:0 "Reinforce the threatened districts."
    ww1_germany.5203.t:0 "The Indian Plot Exposed"
    ww1_germany.5203.d:0 "British intelligence has uncovered our plans for an uprising in India. Arrests and the interception of supplies have broken the network before it could organise a general revolt."
    ww1_germany.5203.a:0 "The operation has failed."
    ww1_germany.52031.t:0 "The Indian Plot Defeated"
    ww1_germany.52031.d:0 "Intelligence officers have exposed a conspiracy to organise mutinies and rebellion in India. The principal networks have been disrupted, allowing the authorities to contain the isolated outbreaks."
    ww1_germany.52031.a:0 "Maintain the watch."
    ww1_germany.53.t: "The Huerta Plot"
    ww1_germany.53.d: "Victoriano Huerta is in exile, but German intelligence is considering a final attempt to return him to power in Mexico. The operation may be foiled before he crosses the border, or it may put an armed and hostile government in place."
    ww1_germany.53.a: "Let the operation proceed"
    ww1_germany.5301.t:0 "Huerta Arrested"
    ww1_germany.5301.d:0 "American authorities have intercepted Victoriano Huerta before he could cross into Mexico. His arrest has frustrated the German-backed plan to return him to power."
    ww1_germany.5301.a:0 "The operation has failed."
    ww1_germany.5302.t:0 "Huerta Returns to Power"
    ww1_germany.5302.d:0 "Huerta has evaded American surveillance and crossed into Mexico with the support of Pascual Orozco. His return to power gives Berlin an opportunity to press the commitments made during their secret negotiations."
    ww1_germany.5302.a:0 "Remind him of our agreement."
    ww1_germany.5303.t:0 "The Huerta Plot Exposed"
    ww1_germany.5303.d:0 "American agents have arrested Huerta while he was attempting to return to Mexico. Evidence of German support has raised further concerns over Berlin's activities along the border."
    ww1_germany.5303.a:0 "Keep the border under watch."
    ww1_germany.54.t:0 "The Shadow Kaiser"
    ww1_germany.54.d:0 "Hindenburg and Ludendorff have come to dominate the direction of the war and much of government policy. Wilhelm retains the powers of the crown, but his influence over daily decisions has diminished."
    ww1_germany.54.a:0 "The High Command sets the course."
    ww1_germany.55.t:0 "War with Portugal"
    ww1_germany.55.d:0 "The seizure of German ships in Portuguese ports has brought relations to a breaking point. Our government has declared war, drawing Portugal openly into the conflict."
    ww1_germany.55.a:0 "Another front in the war."
    ww1_germany.56.t:0 "Manfred von Richthofen"
    ww1_germany.56.d:0 "A young fighter pilot, Manfred von Richthofen, is gaining recognition for his successes in the air. His red aircraft has become a familiar sight to the men below and a symbol for the flying service."
    ww1_germany.56.a:0 "Recognise his service."
    ww1_germany.57.t:0 "Unrestricted Submarine Warfare"
    ww1_germany.57.d:0 "The Admiralty argues that a renewed unrestricted submarine campaign can force Britain to terms. Ministers warn that attacks on neutral shipping may bring the United States into the war, but the naval command believes Britain can be defeated before American armies arrive."
    ww1_germany.57.a:0 "Resume the campaign."
    ww1_germany.58.t:0 "The Armistice at Compiègne"
    ww1_germany.58.d:0 "The Allied armies are advancing, and our representatives have received the terms of an armistice. They demand an end to the fighting, the evacuation of occupied territory and the surrender of much of our military equipment. Acceptance would halt the war, but leave Germany in a weak position at the peace conference."
    ww1_germany.58.a:0 "Accept the armistice."
    ww1_germany.58.b:0 "Continue the fighting."
    ww1_germany.59.t:0 "The Armistice at Compiègne"
    ww1_germany.59.d:0 "The Allied armies are advancing, and our representatives have received the terms of an armistice. They demand an end to the fighting, the evacuation of occupied territory and the surrender of much of our military equipment. Acceptance would halt the war, but leave Germany in a weak position at the peace conference."
    ww1_germany.59.a:0 "Accept the armistice."
    ww1_germany.59.b:0 "Continue the fighting."
    ww1_germany.60.t: "The Red Baron's Fate"
    ww1_germany.60.d: "Reports from the Somme leave the fate of Manfred von Richthofen uncertain. The next dispatch may bring news of a final sacrifice or another victory in the air."
    ww1_germany.60.a: "Await the next report"
    ww1_germany.61.t:0 "The Red Baron Falls"
    ww1_germany.61.d:0 "Manfred von Richthofen has been killed during an engagement over the Somme. His aircraft came down behind enemy lines after a pursuit at low altitude, depriving the flying service of its most celebrated pilot."
    ww1_germany.61.a:0 "Germany mourns its leading ace."
    ww1_germany.62.t:0 "Another Victory for Richthofen"
    ww1_germany.62.d:0 "Manfred von Richthofen has returned safely from another successful engagement. News of his latest victory has spread through the squadrons and reached the troops at the front."
    ww1_germany.62.a:0 "Honour his achievement."
    ww1_germany.63.t:0 "The Paris Gun"
    ww1_germany.63.d:0 "The long-range gun has opened fire on Paris. Its shells cause limited damage compared with a sustained bombardment, but the city can no longer count on its distance from the front for protection."
    ww1_germany.63.a:0 "Continue the bombardment."
    ww1_germany.64.t:0 "The Crimean Question"
    ww1_germany.64.d:0 "The Taurida Soviet government holds the Crimean peninsula and the approaches to the Black Sea. The army proposes an operation with Ukrainian assistance to secure the region and its ports, while others question the wisdom of another occupation."
    ww1_germany.64.a:0 "Secure the peninsula."
    ww1_germany.64.b:0 "We have other priorities."
    ww1_germany.65.t:0 "A Government for Crimea"
    ww1_germany.65.d:0 "German forces have established their position in Crimea. We must now decide whether to sponsor a regional administration, recognise Ukrainian claims on the mainland or retain direct military control."
    ww1_germany.65.a:0 "Separate the peninsula from the mainland."
    ww1_germany.65.b:0 "Support a larger Crimean government."
    ww1_germany.65.c:0 "Retain direct military administration."
    ww1_germany.66.t:0 "The Fall of Taurida"
    ww1_germany.66.d:0 "The Taurida Soviet government has been defeated, leaving its territory under German military control. Ukrainian representatives have renewed their claims, while the army argues that the ports should remain in our hands."
    ww1_germany.66.a:0 "Maintain the occupation."
    ww1_germany.66.b:0 "Recognise the Ukrainian claims."
    ww1_germany.67.t:0 "The Kaiser's Future"
    ww1_germany.67.d:0 "Defeat at the front and unrest at home have brought the monarchy into question. Ministers urge Wilhelm II to abdicate, while loyalists insist that the crown can still survive. The decision will shape the government that inherits the Empire's crisis."
    ww1_germany.67.a:0 "The Kaiser must abdicate."
    ww1_germany.67.b:0 "Retain the crown under parliamentary rule."
    ww1_germany.67.c:0 "The Kaiser will remain at the head of the state."
    ww1_germany.68.t:0 "General Mobilisation"
    ww1_germany.68.d:0 "The government has ordered general mobilisation. Reserve formations are assembling and troop trains are carrying the first contingents towards the frontier."
    ww1_germany.68.a:0 "Carry out the mobilisation orders."
    ww1_germany.69.t: "The Kaiser's Battle"
    ww1_germany.69.d:0 "The High Command has prepared a major offensive in the west, hoping to exploit the forces released from the eastern front. Ludendorff believes a decisive blow can secure victory before the enemy's strength grows further. At home, shortages and exhaustion leave little room for failure."
    ww1_germany.69.a:0 "Begin the offensive."

    ww1_germany.70.t:0 "The Opening Campaign"
    ww1_germany.70.d:0 "The General Staff has submitted three plans. An advance through Belgium offers a route around the French frontier defences, while an attack through Switzerland would seek another flank. A third plan proposes holding in the west and concentrating against Russia."
    ww1_germany.70.a:0 "Adopt the Schlieffen Plan."
    ww1_germany.70.b:0 "Adopt the Kronprinz Plan."
    ww1_germany.70.c:0 "Adopt the Rupprecht Plan."
#

# WW1 Italy #
    ww1_italy.1.t: "The Decision to Invade Libya"
    ww1_italy.1.d:0 "The ultimatum to Constantinople has expired, and the cabinet is preparing to act on its claims to Libya. Expeditionary troops and their naval escorts await orders, while diplomats urge a final attempt to secure an agreement before the first landings."
    ww1_italy.1.a:0 "Order the landings."
    ww1_italy.101.t: "The Treaty of Ouchy"
    ww1_italy.101.d:0 "Delegates at Ouchy have prepared terms to end the Libyan campaign, placing Libya and the Dodecanese under Italian rule. The cabinet must decide whether this settlement justifies ending the war or whether our demands should be pursued by force."
    ww1_italy.101.a: "Ratify the settlement."
    ww1_italy.101.b: "Continue the war despite the settlement."
    ww1_italy.102.t: "The Failure of the Libyan Expedition"
    ww1_italy.102.d:0 "The expedition's position has deteriorated, and the wider war offers little prospect of relief. Ministers must weigh the cost of continuing the campaign against a peace that preserves our Libyan administration."
    ww1_italy.102.a: "End the campaign and retain Libya."
    ww1_italy.102.b: "Continue the war."
    ww1_italy.2.t: "The Libyan Claims"
    ww1_italy.2.d:0 "The cabinet is preparing a formal statement of Italian claims to Tripolitania and Cyrenaica. Advocates of expansion argue that the Ottoman provinces are essential to our position in the Mediterranean, while diplomats warn that Constantinople will resist their loss."
    ww1_italy.2.a:0 "Present our claims."
    ww1_italy.3.t: "A Civil Administration for Libya"
    ww1_italy.3.d:0 "The proposed civil administration for Libya requires officials, reliable communications and a regular budget. Ministers must decide whether conditions in the colony will support the programme or whether it should wait until access can be secured."
    ww1_italy.3.a:0 "Establish the civil administration."
    ww1_italy.4.t: "The Senussi Question"
    ww1_italy.4.d:0 "Officials in Libya urge the cabinet to strengthen the colonial constabulary as resistance spreads beyond the coastal towns. Others propose talks with the Senussi authorities, whose influence in the interior cannot be overcome by proclamations from Rome."
    ww1_italy.4.a:0 "Strengthen the colonial constabulary."
    ww1_italy.5.t: "Mobilisation and Railway Planning"
    ww1_italy.5.d:0 "Army headquarters have revised the reserve call-ups, depot inventories and railway schedules. The new mobilisation plan is ready for approval, but its execution will require sustained attention from the ministries and the treasury."
    ww1_italy.5.a:0 "Approve the mobilisation plan."
    ww1_italy.6.t: "The German Diplomatic Channel"
    ww1_italy.6.d:0 "Our representatives in Berlin are reviewing Italy's position within the Triple Alliance. The talks may strengthen our bargaining position, although neither government is yet prepared to settle the terms of a closer commitment."
    ww1_italy.6.a: "Maintain the channel."
    ww1_italy.7.t: "Italy Remains Neutral"
    ww1_italy.7.d:0 "The government regards the Triple Alliance as a defensive undertaking and has declined to intervene immediately. Diplomats will continue their discussions with both camps while ministers consider the conditions under which Italy might enter the war."
    ww1_italy.7.a: "Maintain our freedom of action."
    ww1_italy.8.t: "An Entente Proposal"
    ww1_italy.8.d:0 "Our envoys have prepared an intervention proposal for Paris, linking Italian participation to support for our claims against Austria-Hungary. French ministers must now decide whether the agreement serves their war aims and whether they can sustain the promises it would entail."
    ww1_italy.8.a:0 "Present our terms to Paris."
    ww1_italy.9.t: "The Decision for Intervention"
    ww1_italy.9.d: "France has accepted our proposal. The cabinet can now honour the agreement by joining the Entente and declaring war on Austria-Hungary, or pay the political price of retaining neutrality. Parliament, the crown and the country must live with the consequences of this decision."
    ww1_italy.9.a: "Join the Entente and declare war on Austria-Hungary."
    ww1_italy.10.t: "Requesting Allied Equipment"
    ww1_italy.10.d:0 "Our army has requested 1,500 rifles from France to equip its formations. The shipment would ease the pressure on Italian depots, but Paris must weigh our request against the needs of its own troops."
    ww1_italy.10.a:0 "Ask Paris for the shipment."
    ww1_italy.11.t: "Financing a Greater War Effort"
    ww1_italy.11.d: "The cabinet is approving extra military expenditure and coordinated procurement. The benefit comes with a larger financing burden and pressure on civilian supplies."
    ww1_italy.11.a: "Authorise the appropriations."
    ww1_italy.12.t: "A Central Powers Proposal"
    ww1_italy.12.d:0 "Our envoys are asking Berlin to settle the terms of Italian admission to its alliance. German ministers will judge the proposal against their existing commitments before Rome can decide whether to ratify it."
    ww1_italy.12.a: "Submit the proposal to Berlin."
    ww1_italy.13.t: "Negotiating Tyrol with Vienna"
    ww1_italy.13.d:0 "The cabinet proposes an Italian neutrality undertaking in exchange for Tyrolean concessions from Austria-Hungary. Vienna may prefer a compromise to the risk of another enemy, but the districts remain central to a dispute neither government can easily abandon."
    ww1_italy.13.a:0 "Offer neutrality in return for concessions."
    ww1_italy.1301.t: "An Italian Neutrality Proposal"
    ww1_italy.1301.d:0 "Rome offers to remain neutral in exchange for Tyrolean concessions. We must decide whether a territorial compromise is worth securing Italy's abstention, or whether the monarchy should retain the districts and face the risk of intervention."
    ww1_italy.1301.a: "Decline the concessions."
    ww1_italy.1301.b:0 "Make the Tyrolean offer."
    ww1_italy.1302.t: "Vienna Declines the Tyrolean Proposal"
    ww1_italy.1302.d:0 "Vienna has rejected the proposed exchange of Tyrolean concessions for Italian neutrality. Our diplomats return without an agreement, leaving the cabinet to reconsider its position between the opposing alliances."
    ww1_italy.1302.a: "Review our diplomatic options."
    ww1_italy.1303.t: "Vienna Offers the Tyrolean Concession"
    ww1_italy.1303.d:0 "Vienna has offered a Tyrolean concession in return for a binding Italian neutrality agreement. Ratification would settle an immediate dispute, but it would also close the path to intervention for which other ministers have been preparing."
    ww1_italy.1303.a:0 "Accept the concession and pledge neutrality."
    ww1_italy.14.t: "Honouring the German War Pledge"
    ww1_italy.14.d:0 "Germany is now fighting its continental opponents, and Berlin expects Italy to honour the agreement between our governments. The cabinet is preparing the declarations and military orders that would turn the alliance into an active war commitment."
    ww1_italy.14.a: "Honour the agreed war pledge."
    ww1_italy.15.t: "Claims Against France"
    ww1_italy.15.d:0 "Nationalist circles urge the cabinet to assert Italy's claims to Corsica, Savoy and Nice. Registering these demands would give our diplomats a new bargaining position while deepening the dispute with France."
    ww1_italy.15.a:0 "Assert our claims."
    ww1_italy.16.t: "Common Procurement"
    ww1_italy.16.d: "The army and industrial offices are reviewing contract schedules. Better planning provides practical experience at a cost to the treasury."
    ww1_italy.16.a: "Fund the programme."
    ww1_italy.17.t: "Frontline Staff Review"
    ww1_italy.17.d:0 "Officers returning from the front have submitted reports on command liaison, reserves and the conduct of operations. Army headquarters propose a staff review to turn those lessons into revised training and planning."
    ww1_italy.17.a:0 "Put these lessons before the staff."
    ww1_italy.18.t: "Artillery and Infantry Liaison"
    ww1_italy.18.d:0 "Infantry and artillery commanders are preparing joint exercises to improve the coordination of fire and movement. Their proposals call for closer liaison between headquarters, batteries and the troops they support."
    ww1_italy.18.a:0 "Approve the joint exercises."
    ww1_italy.19.t: "Operational Reserve Planning"
    ww1_italy.19.d: "The army is improving reserve schedules and depot liaison. These arrangements may help the next operation, but civilian deliveries and the budget bear part of the cost."
    ww1_italy.19.a: "Fund the programme."
    ww1_italy.20.t: "Municipal Relief Coordination"
    ww1_italy.20.d:0 "Municipal officials are coordinating deliveries, public kitchens and assistance for families behind the lines. They ask the cabinet to support a common purchasing programme and give local services a more dependable supply of essential goods."
    ww1_italy.20.a:0 "Support the municipal programme."
    ww1_italy.21.t: "Negotiating with the Workforce"
    ww1_italy.21.d:0 "Worker representatives have presented demands for reliable deliveries and better conditions. Ministers hope that a negotiated agreement can ease the tension, but employers and the treasury must bear the costs of the settlement."
    ww1_italy.21.a:0 "Conclude an agreement with the workers."
    ww1_italy.22.t: "A Civilian Food Programme"
    ww1_italy.22.d: "The cabinet is funding ration administration and municipal relief. Better distribution can ease shortages for a time, but sustained imports and harvests remain necessary."
    ww1_italy.22.a:0 "Support the distribution programme."
    ww1_italy.23.t: "Patriotic Mobilisation"
    ww1_italy.23.d:0 "Patriotic associations and volunteer organisations are rallying support for the war effort. The cabinet proposes funding their liaison and assistance work to connect public enthusiasm with the needs of soldiers and their families."
    ww1_italy.23.a: "Fund the assistance organisations."
    ww1_italy.24.t: "Resistance in the Libyan Interior"
    ww1_italy.24.d:0 "Senussi authorities and local fighters are resisting the extension of Italian administration into the Libyan interior. The cabinet must choose between reinforcing the occupation and offering an accommodation that recognises local authority."
    ww1_italy.24.a:0 "Maintain the occupation."
    ww1_italy.25.t: "The Later Libyan Policy Review"
    ww1_italy.25.d:0 "The expense of administering Libya has prompted another review in Rome. Ministers are divided between strengthening the colonial constabulary and directing the available funds toward civilian services and local infrastructure."
    ww1_italy.25.a:0 "Strengthen the constabulary."
    ww1_italy.25.b:0 "Put civilian relief first."
#

# WW1 Japan #
    ww1_japan.1.t:0 "An Ultimatum for Germany"
    ww1_japan.1.d:0 "The cabinet is preparing an ultimatum demanding the surrender of German possessions in China and the Pacific. Ministers must decide whether to limit the demands or include Germany's remaining island territories, extending the reach of our intervention."
    ww1_japan.1.a:0 "Limit the demands."
    ww1_japan.1.b:0 "Demand every German possession."
    ww1_japan.101.t:0 "A Japanese Ultimatum"
    ww1_japan.101.d:0 "Tokyo has demanded the surrender of our Pacific possessions while excluding New Guinea, the Bismarck Archipelago and the Solomon Islands. Ministers must decide whether these concessions are worth the prospect of avoiding Japanese intervention in the war."
    ww1_japan.101.a:0 "Accept the concessions."
    ww1_japan.101.b:0 "We will not yield to the ultimatum."
    ww1_japan.102.t:0 "Germany Accepts the Ultimatum"
    ww1_japan.102.d:0 "Berlin has accepted the ultimatum and agreed to surrender the demanded territories. The cabinet must now decide whether to honour the understanding or enter the war alongside our allies despite the German concessions."
    ww1_japan.102.a:0 "Honour the agreement."
    ww1_japan.102.b:0 "Enter the war alongside our allies."
    ww1_japan.103.t:0 "No Answer from Berlin"
    ww1_japan.103.d:0 "Berlin has failed to provide an acceptable answer to the ultimatum. Ministers must decide whether to enforce our demands by war or withdraw them rather than commit Japan to a campaign."
    ww1_japan.103.a:0 "Enforce the demands by war."
    ww1_japan.103.b:0 "Withdraw the ultimatum."
    ww1_japan.104.t:0 "Japan Extends Its Demands"
    ww1_japan.104.d:0 "Tokyo has presented an extended ultimatum demanding all our Pacific possessions. Accepting would sacrifice our colonial position in the region, but refusal risks bringing another enemy into the war."
    ww1_japan.104.a:0 "Accept the extended ultimatum."
    ww1_japan.104.b: "Refuse to even respond"
    ww1_japan.105.t:0 "Germany Accepts the Extended Ultimatum"
    ww1_japan.105.d:0 "Berlin has accepted the extended ultimatum and agreed to surrender the territories demanded. The cabinet must decide whether to honour the agreement or enter the war alongside our allies regardless."
    ww1_japan.105.a:0 "Honour the agreement."
    ww1_japan.105.b:0 "Enter the war alongside our allies."
    ww1_japan.106.t:0 "Berlin Rejects the Extended Demands"
    ww1_japan.106.d:0 "Germany has failed to provide an acceptable answer to the extended ultimatum. Ministers must now choose between enforcing the demands by war and abandoning the confrontation."
    ww1_japan.106.a:0 "Enforce the demands by war."
    ww1_japan.106.b:0 "Withdraw the ultimatum."
    ww1_japan.2.t:0 "The Loss of Kawachi"
    ww1_japan.2.d:0 "An explosion has destroyed the battleship Kawachi, which sank within minutes with heavy loss of life. Investigators suspect a magazine fire, and the navy must establish the cause while accounting for the loss of the ship and her crew."
 ww1_japan.2.a:0 "Investigate the loss."
    ww1_japan.3.t:0 "The Rice Riots"
    ww1_japan.3.d:0 "The rising price of rice has provoked protests that are spreading into strikes and violent confrontations with the authorities. The cabinet faces mounting anger over the cost of living and demands for a response to the hardship affecting households across Japan."
 ww1_japan.3.a:0 "The cabinet must address the unrest."
    ww1_japan.4.t:0 "The March First Movement"
    ww1_japan.4.d:0 "Demonstrations demanding independence have spread through Korea, challenging Japanese colonial rule. The authorities face a broad protest movement amid public mourning for the former emperor Gojong and renewed calls for national self-determination."
 ww1_japan.4.a:0 "The colonial administration must respond."
    ww1_japan.5.t:0 "The Annexation of Korea"
    ww1_japan.5.d:0 "An annexation treaty has placed Korea under direct Japanese rule, ending the protectorate. Tokyo will govern the peninsula through a colonial administration as Korean opponents continue to contest the loss of sovereignty."
    ww1_japan.5.a:0 "The colonial administration assumes control."
    ww1_japan.6.t: "Death of Emperor Meiji"
    ww1_japan.6.d:0 "Emperor Meiji has died, bringing his long reign to an end. The court and government prepare for the succession as the country mourns the sovereign under whom Japan's modern state took shape."
    ww1_japan.6.a:0 "Prepare for the succession."
    ww1_japan.7.t: "Nogi Maresuke Commits Seppuku"
    ww1_japan.7.d:0 "General Nogi Maresuke has taken his own life on the day of Emperor Meiji's funeral. His death has provoked mourning and renewed debate over duty, sacrifice and loyalty to the throne."
    ww1_japan.7.a:0 "The country mourns another loss."
#

# Austria Hungary #
    ww1_kuk.1.t: "Bosnia in the Imperial Administration"
    ww1_kuk.1.d:0 "Bosnia and Herzegovina remain under imperial rule, outside the two principal halves of the monarchy. Provincial officials seek funds for public services and dependable appointments. A stronger administration may ease local grievances while the province's political future remains disputed."
    ww1_kuk.1.a: "Fund the provincial administration."
    ww1_kuk.2.t: "The Serbian Question"
    ww1_kuk.2.d: "Nationalist agitation across the frontier troubles the army and the civil administration. The cabinet can treat every dispute as a military challenge, or pursue police cooperation while containing inflammatory rhetoric. Neither course resolves the competing ambitions in the Balkans."
    ww1_kuk.2.a: "Maintain a firm diplomatic position."
    ww1_kuk.3.t: "A Balkan Diplomatic Service"
    ww1_kuk.3.d:0 "Our embassies receive conflicting instructions as tension rises in the Balkans. The foreign ministry proposes a common service to coordinate reports and maintain contact with neighbouring governments. Its work will give Vienna a clearer voice in the region."
    ww1_kuk.3.a: "Coordinate the embassies."
    ww1_kuk.4.t: "The German Alliance"
    ww1_kuk.4.d: "Berlin remains the monarchy's principal strategic partner. Staff consultations can improve cooperation without surrendering Vienna's responsibility for its own foreign policy. Our diplomats are arranging another round of talks."
    ww1_kuk.4.a: "Maintain the alliance."
    ww1_kuk.5.t: "Talks with Sofia"
    ww1_kuk.5.d: "Bulgarian ambitions offer a possible counterweight to Serbia, but Sofia expects tangible diplomatic support. Our envoys are discussing transport links and regional security; Bulgaria remains free to judge the risks of closer cooperation."
    ww1_kuk.5.a: "Keep the channel open."
    ww1_kuk.6.t: "Talks with Constantinople"
    ww1_kuk.6.d: "The Ottoman government shares several of our strategic concerns. Cooperation will require dependable railway connections and practical agreements rather than old assumptions about the interests of the two empires."
    ww1_kuk.6.a: "Arrange the consultations."
    ww1_kuk.7.t: "Mobilisation Planning"
    ww1_kuk.7.d:0 "The common army is revising its reserve call-ups, railway timetables and depot arrangements. Staff officers warn that confused orders could lose precious days in a crisis. The revised plan requires the cabinet's support and additional expenditure."
    ww1_kuk.7.a: "Pay for the revised mobilisation plan."
    ww1_kuk.8.t: "Albanian Liaison Service"
    ww1_kuk.8.d:0 "Albanian leaders have offered the services of interpreters and local guides familiar with the roads and rivalries of the region. The army proposes a liaison mission to train them and coordinate their reports. Their knowledge could prove valuable to our commanders."
    ww1_kuk.8.a: "Organise a paid liaison mission."
    ww1_kuk.9.t: "Grain from the Serbian Occupation"
    ww1_kuk.9.d: "The occupation authorities report grain available for collection. Requisitioning it may ease shortages in our cities, but uncontrolled seizures will deepen resistance and disrupt next year's harvest. Compensation requires funds and a functioning transport system."
    ww1_kuk.9.a: "Requisition grain under military supervision."
    ww1_kuk.10.t: "Honouring the Bulgarian Agreement"
    ww1_kuk.10.d:0 "Bulgaria asks us to honour the territorial understanding reached with Sofia. The cabinet must instruct the authorities to hand over the Macedonian districts covered by the agreement. The settlement will test our ally's confidence in Vienna's promises."
    ww1_kuk.10.a:0 "Honour the Macedonian agreement."
    ww1_kuk.11.t: "The Cost of Total Mobilisation"
    ww1_kuk.11.d:0 "The common ministries seek additional funds for military procurement and staff coordination. Army requirements are pressing ever more heavily on civilian deliveries. The cabinet must decide whether to approve another expansion of the war effort."
    ww1_kuk.11.a: "Authorise the additional expenditure."
    ww1_kuk.12.t: "A Separate Peace Channel"
    ww1_kuk.12.d: "Karl's government is considering a confidential approach to the Entente through Prince Sixtus. France must answer for itself, and the Italian claims and German alliance will remain obstacles even if Paris agrees to hear us."
    ww1_kuk.12.a: "Ask Sixtus to open the channel."
    ww1_kuk.12.b: "Keep this proposal in reserve."
    ww1_kuk.13.t: "Negotiating with Italy"
    ww1_kuk.13.d:0 "Rome continues to weigh its obligations under the Triple Alliance against its territorial ambitions. Our diplomats propose another round of discussions to preserve Italian cooperation. The outcome may decide whether the southern frontier remains quiet."
    ww1_kuk.13.a: "Continue the negotiations."
    ww1_kuk.14.t: "An Italian Neutrality Proposal"
    ww1_kuk.14.d:0 "Italian intervention would place a new burden on an army already stretched across several fronts. The cabinet is considering concessions to keep Rome out of the war. Our envoys require an offer that they can put before the Italian government."
    ww1_kuk.14.a: "Prepare an offer."
    ww1_kuk.15.t: "An Offer of South Tyrol"
    ww1_kuk.15.d:0 "The cabinet proposes offering South Tyrol in exchange for Italian neutrality. Such a concession would be painful, but another active frontier could prove more costly. The decision now rests with Rome."
    ww1_kuk.15.a: "Submit the limited offer."
    ww1_kuk_1501.t: "Offer from Austria"
    ww1_kuk_1501.d: "Sir, the Austro-Hungarian government has given us an offer, promising that should we stay neutral in the war they are willing to give South Tyrol with no bloodshed, we could take the offer however it is a little less than what the Entente has been promising us."
    ww1_kuk_1501.a: "We will take it"
    ww1_kuk.1501.b: "Decline the offer."
    ww1_kuk_1502.t: "Italy Accepts Our Offer"
    ww1_kuk_1502.d: "The Kingdom of Italy has graciously accepted our offer to cede the territory of South Tyrol in return for Italian neutrality in the war. We are glad more bloodshed could be prevented and this should permanently secure our Western Front."
    ww1_kuk_1502.a: "Great"
    ww1_kuk_1503.t: "Italy Declines Our Offer"
    ww1_kuk_1503.d: "The scum of the Kingdom of Italy have declined our fair offer in ceding South Tyrol in return for their neutrality, if more blood is to be spilled we will give them what they want and show those filthy Italians what are made of! "
    ww1_kuk_1503.a: "Death to Italy!"
    ww1_kuk.16.t: "A Wider Italian Settlement"
    ww1_kuk.16.d:0 "The cabinet is considering a wider offer of Tyrolean and Adriatic concessions to secure Italian neutrality. The loss would be bitterly contested within the monarchy. Our diplomats nevertheless argue that keeping Italy out of the war may justify the sacrifice."
    ww1_kuk.16.a: "Submit the wider settlement."
    ww1_kuk.1601.t: "Vienna Offers an Adriatic Settlement"
    ww1_kuk.1601.d:0 "Vienna offers Tyrolean and Adriatic concessions in exchange for Italian neutrality. Acceptance would bring substantial gains without a campaign. Refusal preserves our freedom to pursue a different settlement."
    ww1_kuk.1601.a: "Accept the wider settlement."
    ww1_kuk.17.t: "A Central Powers Offer to Rome"
    ww1_kuk.17.d:0 "Our envoys propose supporting Italian claims against France in return for cooperation with the Central Powers. The offer asks Rome to seek its ambitions westward rather than against the monarchy. Italy must decide whether the promised settlement warrants the risks of war."
    ww1_kuk.17.a: "Put the proposal to Rome."
    ww1_kuk.1701.t: "Italy Accepts the Alliance Proposal"
    ww1_kuk.1701.d:0 "Rome has accepted the political basis of our alliance proposal. Italian ministers are prepared to cooperate in pursuit of their claims against France. The foreign ministry can now prepare a formal invitation."
    ww1_kuk.1701.a: "Prepare the invitation."
    ww1_kuk.1702.t: "Italy Declines the Alliance Proposal"
    ww1_kuk.1702.d: "Rome has declined our proposal. Promises about French territory have not overcome Italy's concerns about the costs of intervention. Any existing neutrality arrangement stands on its own terms."
    ww1_kuk.1702.a: "Keep diplomatic contact."
    ww1_kuk.1703.t: "A Central Powers Proposal"
    ww1_kuk.1703.d: "Vienna proposes to support Italian claims to Savoy and Corsica if we join its alliance. These are promises about a future settlement rather than territory it can deliver now. Joining would commit us to the risks of a continental war."
    ww1_kuk.103.a: "Authorise a confidential approach to Paris."
    ww1_Kuk.1703.b: "Decline the Deal"
    ww1_kuk.18.t: "The Italian Alliance Invitation"
    ww1_kuk.18.d:0 "The negotiations with Rome have reached the stage of a formal alliance invitation. Ministers on both sides must now give effect to the understanding already reached. A successful agreement would transform the monarchy's position on its southern frontier."
    ww1_kuk.18.a:0 "Issue the formal invitation."
    ww1_kuk.19.t: "German Staff Advisers"
    ww1_kuk.19.d: "A German liaison mission is ready to work alongside the common army. The officers bring useful experience, while our own staff retains responsibility for training and operations."
    ww1_kuk.19.a: "Fund the liaison mission."
    ww1_kuk.20.t: "Requesting German Replacement Cadres"
    ww1_kuk.20.d:0 "The common army urgently needs experienced men to replace losses and instruct new recruits. Our staff proposes asking Berlin to release a cadre of trained replacements. Germany's commanders will have to judge what they can spare."
    ww1_kuk.20.a: "Send the request."
    ww1_kuk.21.t: "Equipment for Germany"
    ww1_kuk.21.d:0 "Berlin has requested a shipment of 1,000 rifles for the German army. Our depots can release the weapons, but doing so will reduce the reserve available to our own formations. The cabinet must decide how far to support our ally."
    ww1_kuk.21.a: "Dispatch 1,000 rifles."
    ww1_kuk.22.t: "A Replacement Mission for Our Ally"
    ww1_kuk.22.d:0 "The army proposes sending 3,000 replacements and instructors to support our German ally. The mission will draw on our own reserves and require transport and liaison arrangements. Our commanders must balance allied needs against losses at home."
    ww1_kuk.22.a:0 "Send 3,000 replacements and instructors."
    ww1_kuk.2201.t: "Austro-Hungarian Replacements Arrive"
    ww1_kuk.2201.d:0 "Austro-Hungarian replacements and instructors have arrived to support our army. The 3,000 men have been released from Vienna's reserve under the allied agreement. Our commanders are preparing their assignments."
    ww1_kuk.2201.a: "Welcome the mission."
    ww1_kuk.23.t: "Requesting Ottoman Replacement Cadres"
    ww1_kuk.23.d: "Constantinople is being asked to release a small replacement and liaison mission for the common army. Its government must weigh our request against the needs of its own fronts."
    ww1_kuk.23.a: "Send the request."
    ww1_kuk.24.t: "A Replacement Mission for Our Ally"
    ww1_kuk.24.d:0 "The army proposes sending 3,000 replacements and instructors to support the Ottoman forces. The mission will draw on our own reserves and require transport and liaison arrangements. Our commanders must balance allied needs against losses at home."
    ww1_kuk.24.a:0 "Send 3,000 replacements and instructors."
    ww1_kuk.25.t: "Equipment for the Ottoman Army"
    ww1_kuk.25.d:0 "Constantinople has requested a shipment of 1,000 rifles for the Ottoman army. Our depots can release the weapons, but doing so will reduce the reserve available to our own formations. The cabinet must decide how far to support our ally."
    ww1_kuk.25.a: "Dispatch 1,000 rifles."
    ww1_kuk.26.t: "An Imperial Administrative Programme"
    ww1_kuk.26.d:0 "Representatives of the common ministries and the two governments have agreed to regular provincial consultations. They hope clearer responsibilities will reduce the conflicting orders reaching local offices. The cabinet must provide the support needed to put the arrangement into practice."
    ww1_kuk.26.a: "Fund the common programme."
    ww1_kuk.27.t: "Military Appropriations"
    ww1_kuk.27.d:0 "The delegations are debating new military appropriations. Army headquarters seeks funds for staff training and closer coordination across the monarchy's forces. Civil departments warn that the war already absorbs a growing share of public resources."
    ww1_kuk.27.a: "Approve the appropriations."
    ww1_kuk.28.t: "The Civil Administration"
    ww1_kuk.28.d:0 "Civil departments struggle with overlapping responsibilities and inconsistent provincial reports. Ministers propose a common administrative programme to clarify appointments and coordinate services. The reform will require sustained political support."
    ww1_kuk.28.a: "Give the civil departments a budget."
    ww1_kuk.29.t: "Emergency Powers and the Nationalities"
    ww1_kuk.29.d: "The army demands stronger censorship and police powers. These can impose temporary order, but arbitrary interference with civilian administration will alienate the nationalities whose cooperation we need."
    ww1_kuk.29.a: "Approve temporary emergency powers."
    ww1_kuk.30.t: "The Constitutional Compromise"
    ww1_kuk.30.d: "The government is bringing together representatives of the two halves of the monarchy. Their first task is to agree on consultation and shared responsibilities; a trialist or federal constitution requires a further settlement."
    ww1_kuk.30.a: "Convene the council."
    ww1_kuk.31.t: "The Polish Legion Programme"
    ww1_kuk.31.d:0 "Polish volunteers seek an organised place in the monarchy's war effort. Their representatives propose a programme of training and liaison with the common army. Supporting the initiative may strengthen cooperation with Polish officers and political leaders."
    ww1_kuk.31.a: "Fund training and political liaison."
    ww1_kuk.32.t: "Agreement with the Hungarian Government"
    ww1_kuk.32.d:0 "Vienna and Budapest have agreed to regular consultations over appropriations and common services. The Hungarian government expects the ministries to respect the responsibilities set out in the agreement. Both sides hope a dependable working relationship will ease the strains of war."
    ww1_kuk.32.a: "Respect the agreed responsibilities."
    ww1_kuk.33.t: "The Hungarian Coronation of Karl"
    ww1_kuk.33.d: "Karl and Zita are being crowned in Budapest. The coronation oath affirms the Hungarian constitutional settlement, binding the new reign to obligations that will complicate any later trialist or federal reform. The monarchy welcomes a new sovereign, while its political arguments continue."
    ww1_kuk.33.a: "The crown carries obligations."
    ww1_kuk.34.t: "The First Production Programme"
    ww1_kuk.34.d:0 "Factories and depots have submitted a common schedule for maintenance and deliveries. Industrial officials believe closer coordination can reduce delays in supplying the army. The ministries now seek approval for the programme."
    ww1_kuk.34.a:0 "Approve the factory and depot schedule."
    ww1_kuk.35.t: "Railway Priorities"
    ww1_kuk.35.d:0 "Military trains and civilian deliveries compete for space on the same railway lines. Staff officers are revising timetables to prevent blocked junctions and empty depots. Giving the army priority will place further pressure on food distribution."
    ww1_kuk.35.a:0 "Give military trains priority."
    ww1_kuk.36.t: "Civilian Ration Planning"
    ww1_kuk.36.d:0 "Officials are revising ration cards and distribution procedures as shortages deepen. Municipal authorities ask for clear rules and dependable deliveries. A more orderly system may ease the strain on households during the months ahead."
    ww1_kuk.36.a:0 "Revise the ration system."
    ww1_kuk.37.t: "Reviewing Frontline Command"
    ww1_kuk.37.d:0 "Army headquarters is gathering reports from the front to review the conduct of operations. Commanders disagree over the lessons of recent fighting. A common review should give the next campaign a firmer foundation."
    ww1_kuk.37.a:0 "Gather the commanders' reports."
    ww1_kuk.38.t: "Artillery and Supply Coordination"
    ww1_kuk.38.d:0 "Artillery officers report delays between requests from the front and deliveries from the depots. Headquarters proposes exercises in liaison and supply to improve cooperation. Better coordination could make scarce ammunition go further."
    ww1_kuk.38.a:0 "Improve artillery liaison."
    ww1_kuk.39.t: "A Final Operational Reserve"
    ww1_kuk.39.d:0 "The command proposes further reserve training and a revised operational plan. Reinforcements must reach the threatened sectors in time to influence the fighting. The additional military traffic will impose another burden on civilian deliveries."
    ww1_kuk.39.a:0 "Prepare the operational reserve."
    ww1_kuk.40.t: "Municipal Food Coordination"
    ww1_kuk.40.d:0 "Municipal authorities are seeking a common arrangement for food transport and distribution. Conflicting priorities have left some cities short while deliveries wait elsewhere. The ministries propose funding closer cooperation between provincial offices and the railways."
    ww1_kuk.40.a:0 "Coordinate municipal deliveries."
    ww1_kuk.41.t: "Negotiating with the Workforce"
    ww1_kuk.41.d:0 "Worker representatives demand better conditions and more reliable deliveries to industrial towns. Ministers hope an agreement can prevent further disruption at the factories. Concessions will carry a cost, but a prolonged dispute could be more damaging."
    ww1_kuk.41.a:0 "Reach an agreement with the workforce."
    ww1_kuk.42.t: "Public Relief in the Cities"
    ww1_kuk.42.d:0 "Queues outside the food shops are growing, and municipal relief funds are running short. The government proposes supporting public kitchens and emergency deliveries. The programme may ease immediate distress while officials work to restore supplies."
    ww1_kuk.42.a:0 "Fund the relief kitchens."
    ww1_kuk.43.t: "The Death of Franz Joseph"
    ww1_kuk.43.d: "Franz Joseph has died at Schoenbrunn after a reign of almost sixty-eight years. Karl succeeds him in an empire strained by war and political division. The succession is secure, but the new emperor inherits questions that the long reign never settled."
    ww1_kuk.43.a: "A reign has ended."
    ww1_kuk.44.t: "The Sarajevo Assassination"
    ww1_kuk.44.d: "Archduke Franz Ferdinand and Sophie have been killed in Sarajevo. Ministers and commanders are demanding answers about the conspirators and their links across the frontier. The crime has opened a grave diplomatic crisis, but the cabinet must still decide how to respond."
    ww1_kuk.44.a: "Investigate the crime."
    ww1_kuk.45.t: "The Hoyos Mission"
    ww1_kuk.45.d: "The cabinet is considering a mission to Berlin to obtain German backing against Serbia. An unconditional pledge may embolden the army; a mediated investigation would demand restraint and a willingness to accept an imperfect diplomatic result."
    ww1_kuk.45.a: "Ask Berlin for its full support."
    ww1_kuk.4501.t: "Vienna Requests Unconditional Support"
    ww1_kuk.4501.d: "Count Hoyos asks whether Germany will stand behind Austria-Hungary if its confrontation with Serbia becomes a war. A promise of unconditional support could turn a Balkan crisis into a conflict involving Russia and its partners."
    ww1_kuk.4501.a: "Give Vienna our full backing."
    ww1_kuk.46.t: "German Backing Arrives"
    ww1_kuk.46.d: "Berlin has pledged its support. The cabinet can now prepare a demanding ultimatum, or use the pledge to seek a negotiated investigation. German support changes the balance of risk; it does not make the decision to start a war inevitable."
    ww1_kuk.46.a: "Prepare the ultimatum."
    ww1_kuk.47.t: "The Ultimatum to Serbia"
    ww1_kuk.47.d: "The cabinet has prepared demands for the suppression of hostile organisations and participation in the investigation inside Serbia. The latter demand challenges Serbian sovereignty and may be unacceptable even if Belgrade agrees to most of the other terms."
    ww1_kuk.47.a: "Deliver the demands to Belgrade."
    ww1_kuk.48.t: "The Reply to Vienna"
    ww1_kuk.48.d: "Austria-Hungary demands the suppression of hostile organisations and Austrian participation in an inquiry on Serbian soil. We can accept much of the ultimatum while rejecting foreign police authority, or accept the intrusive terms to avert this immediate confrontation."
    ww1_kuk.48.a: "Accept most terms, but preserve our sovereignty."
    ww1_kuk.49.t: "The Decision for War"
    ww1_kuk.49.d: "Serbia has accepted most of our demands but rejected Austrian participation in its internal inquiry. The army urges war; several ministers still fear a wider conflict. The cabinet must choose whether this remaining dispute warrants military action."
    ww1_kuk.49.a: "Declare war on Serbia."
    ww1_kuk.50.t: "Violence in Sarajevo"
    ww1_kuk.50.d: "Crowds have attacked Serb residents, shops and institutions following the assassination. The violence threatens people who had no part in the crime and makes provincial administration harder. The authorities must decide whether to restore order or allow reprisals to continue."
    ww1_kuk.50.a: "Tolerate the reprisals."
    ww1_kuk.51.t: "Armistice of Villa Giusti"
    ww1_kuk.51.d:0 "Army representatives have brought armistice terms from Villa Giusti. The retreat has shaken the common army, while national governments challenge the monarchy's authority across its remaining lands. Accepting the terms would end the fighting at the cost of sweeping concessions; refusal would demand further sacrifices from an exhausted country."
    ww1_kuk.51.a:0 "Accept the armistice terms."
    ww1_kuk.51.b:0 "Order the army to continue fighting."
    ww1_kuk.52.t: "Banat Republic Declares Independence"
    ww1_kuk.52.d:0 "Otto Roth and his supporters have proclaimed a republic in the Banat. The region's Romanian, Serb, Hungarian and German communities hold competing views of its future. Vienna must decide whether to accept the loss of authority or oppose the new government."
    ww1_kuk.52.a:0 "Accept the loss of the Banat."
    ww1_kuk.52.b:0 "Oppose the new republic."
    ww1_kuk.53.t:0 "Czech Independence Proclaimed"
    ww1_kuk.53.d:0 "Czech leaders have proclaimed an independent state and called for union with the Slovaks. Their declaration rejects the imperial government's offer of autonomy within the monarchy. Vienna faces another challenge to the survival of the common state."
    ww1_kuk.53.a:0 "Accept the declaration."
    ww1_kuk.53.b:0 "Defend the unity of the monarchy."
    ww1_kuk.54.t:0 "A West Ukrainian Republic Is Proclaimed"
    ww1_kuk.54.d:0 "A West Ukrainian republic has been proclaimed in eastern Galicia. Its leaders claim authority over districts also sought by Polish representatives, and conflict threatens the mixed population of Lviv. The imperial government must decide how to respond to the new claim of independence."
    ww1_kuk.54.a:0 "Accept the loss of eastern Galicia."
    ww1_kuk.54.b:0 "Oppose the secession."
    ww1_kuk.55.t:0 "The Martin Declaration"
    ww1_kuk.55.d:0 "Slovak representatives meeting at Martin have declared their support for a common state with the Czechs. The declaration rejects continued rule from Budapest and adds to the pressure on the Habsburg settlement. The form of the new union remains a question for its leaders."
    ww1_kuk.55.a:0 "Another crownland turns away from Vienna."
    ww1_kuk.56.t: "Aster Revolution in Hungary"
    ww1_kuk.56.d:0 "Soldiers and demonstrators wearing asters have joined the movement led by Mihály Károlyi in Budapest. Public buildings have fallen under the National Council's authority as the old government loses control. The revolution threatens to sever the Hungarian half of the monarchy from Vienna."
    ww1_kuk.56.a:0 "Accept Hungary's separation."
    ww1_kuk.56.b:0 "Oppose the National Council."
    ww1_kuk.57.t: "Question of the Banat Region"
    ww1_kuk.57.d:0 "The new Banat Republic has little support beyond its own provisional authorities. Romanian and South Slav claims divide the region, while its neighbours consider intervention. We must decide whether to occupy the disputed territory or leave the republic in place."
    ww1_kuk.57.a:0 "Occupy the Banat."
    ww1_kuk.57.b:0 "Leave the republic in place."
    ww1_kuk.58.t: "Division of Banat"
    ww1_kuk.58.d:0 "Our troops have secured the Banat, bringing its brief republican government to an end. Negotiators now propose dividing the occupied territory between Yugoslavia and Romania. The settlement will establish a new frontier across the region's mixed communities."
    ww1_kuk.58.a:0 "Approve the territorial division."
    ww1_kuk.59.t: "Armistice of Villa Giusti"
    ww1_kuk.59.d:0 "Army representatives have brought armistice terms from Villa Giusti. The retreat has shaken the common army, while demands for independence spread through the crownlands. Accepting the terms would end the fighting at the cost of sweeping concessions; refusal would demand further sacrifices from an exhausted country."
    ww1_kuk.59.a: "Everything Broken..."
    ww1_kuk.60.t: "Spring Offensive Begins"
    ww1_kuk.60.d:0 "The end of the eastern campaign has allowed Germany to concentrate troops in the west. Ludendorff has committed them to a major offensive intended to secure victory before the balance turns against the Central Powers. For our exhausted monarchy, the outcome may decide how long the war can continue."
    ww1_kuk.60.a:0 "Our hopes rest on the western offensive."
    ww1_kuk.61.t: "Tyrolean Volunteers!"
    ww1_kuk.61.d:0 "Italian activity along the Tyrolean frontier has alarmed the local population. Volunteers familiar with the mountain passes have formed defensive units in support of the regular army. Their arrival offers reassurance to districts that fear an Italian invasion."
    ww1_kuk.61.a:0 "Welcome the Tyrolean volunteers."
#

# WW1 Mexico #
    ww1_mexico.1.t:0 "The Death of Emiliano Zapata"
    ww1_mexico.1.d:0 "Emiliano Zapata has been killed. His struggle for land reform made him one of the best-known figures of the revolution, and his death will deepen the grievances that remain in the countryside."
    ww1_mexico.1.a:0 "Mexico has lost another revolutionary."
    ww1_mexico.2.t:0 "The Assassination of Pancho Villa"
    ww1_mexico.2.d:0 "Pancho Villa has been killed in an ambush in Parral. His retirement from military life had not erased the influence of his name or the enemies made during the revolution."
    ww1_mexico.2.a:0 "Another chapter ends in blood."
    ww1_mexico.3.t:0 "The Presidential Election"
    ww1_mexico.3.d:0 "The authorities have declared Porfirio Díaz the winner of the presidential election. Madero's supporters denounce the result, accusing the government of using repression and fraud to preserve its rule."
    ww1_mexico.3.a:0 "The result has been announced."
    ww1_mexico.4.t:0 "Madero's Campaign"
    ww1_mexico.4.d:0 "Francisco Madero's campaign is attracting large crowds and support for political reform. His challenge has unsettled the government and given opponents of Díaz a common cause."
    ww1_mexico.4.a:0 "The opposition is gathering strength."
    ww1_mexico.5.t:0 "Madero Escapes"
    ww1_mexico.5.d:0 "Francisco Madero has escaped imprisonment and crossed into the United States. Officials fear that he will use his refuge to organise opposition to the government."
    ww1_mexico.5.a:0 "Watch the northern frontier."
    ww1_mexico.6.t:0 "The Maderista Revolt"
    ww1_mexico.6.d:0 "Madero has returned across the Rio Grande and called for the overthrow of Díaz. Armed supporters are gathering under his banner, turning the dispute over the election into open rebellion."
    ww1_mexico.6.a:0 "The government must restore order."
    ww1_mexico.6.b:0 "I will stand with Madero."
    ww1_mexico.7.t:0 "Díaz Resigns"
    ww1_mexico.7.d:0 "Military defeats and mounting political pressure have brought the Díaz government to an end. Madero's supporters are preparing to assume power, but the promises made during the uprising remain to be fulfilled."
    ww1_mexico.7.a:0 "A new government for Mexico."
    ww1_mexico.8.t:0 "Madero's Government"
    ww1_mexico.8.d:0 "Madero has taken office with promises to restore constitutional government. His supporters expect change, while the institutions and officers inherited from the old regime remain a source of tension."
    ww1_mexico.8.a:0 "Begin the work of reform."
    ww1_mexico.9.t:0 "Zapata's Demands"
    ww1_mexico.9.d:0 "Emiliano Zapata has renewed his demands for land reform. His supporters in the south expect the government to honour the promises that helped unite the revolution against Díaz."
    ww1_mexico.9.a:0 "The land question cannot be ignored."
    ww1_mexico.10.t:0 "The Plan of Ayala"
    ww1_mexico.10.d:0 "Zapata and his followers have set out their demands for the return of land to rural communities. Their programme challenges the government's authority and exposes the widening divisions within the revolution."
    ww1_mexico.10.a:0 "The revolution remains divided."
    ww1_mexico.11.t:0 "Opposition to Madero"
    ww1_mexico.11.d:0 "Opponents of the government are organising against Madero. The army's loyalty and the strength of the constitutional authorities will determine whether the crisis can be contained."
    ww1_mexico.11.a:0 "Watch the conspirators closely."
    ww1_mexico.12.t:0 "The Crisis Deepens"
    ww1_mexico.12.d:0 "The government faces growing opposition from officers and political rivals. Confidence in the capital is faltering as rumours of another attempt to seize power spread."
    ww1_mexico.12.a:0 "The government must hold firm."
    ww1_mexico.13.t:0 "A Conspiracy in the Capital"
    ww1_mexico.13.d:0 "Reports suggest that Victoriano Huerta is in contact with opponents of President Madero. The involvement of senior officers has made the rumours particularly dangerous."
    ww1_mexico.13.a:0 "Investigate these reports."
    ww1_mexico.14.t: "The Ten Tragic Days"
    ww1_mexico.14.d:0 "Fighting and conspiracy in Mexico City have brought down Madero's government. Huerta has taken power, but his rule faces opposition from those who regard the coup as a betrayal of the revolution."
    ww1_mexico.14.a:0 "Huerta takes control."
    ww1_mexico.15.t:0 "The Land Reform Question"
    ww1_mexico.15.d:0 "Zapata has demanded that the government act on its promises to the rural communities. Accepting his programme would require a major break with powerful landowners; refusing it risks renewed rebellion in the south."
    ww1_mexico.15.a:0 "Accept the land reform programme."
    ww1_mexico.15.b:0 "Reject Zapata's demands."
    ww1_mexico.16.t:0 "Zapata Takes Up Arms"
    ww1_mexico.16.d:0 "Zapata has broken with the government and called his supporters to arms. The failure to settle the land question has brought renewed fighting to the south."
    ww1_mexico.16.a:0 "Another rebellion to confront."
    ww1_mexico.17.t:0 "The Constitutionalist Revolt"
    ww1_mexico.17.d:0 "Venustiano Carranza and his supporters have rejected Huerta's government. Their call to defend constitutional authority has gathered armed support in the north."
    ww1_mexico.17.a:0 "The opposition has become a revolt."
    ww1_mexico.18.t:0 "Villa's Forces Mobilise"
    ww1_mexico.18.d:0 "Pancho Villa's followers have entered the struggle against Huerta. Their forces strengthen the northern opposition and add another army to Mexico's civil war."
    ww1_mexico.18.a:0 "The northern war is widening."
    ww1_mexico.19.t:0 "The Zapatistas Rise"
    ww1_mexico.19.d:0 "Zapata's forces have taken up the struggle against Huerta. The southern movement remains committed to land reform and distrustful of the government in Mexico City."
    ww1_mexico.19.a:0 "The south is in revolt."
    ww1_mexico.20.t:0 "The Fall of Huerta"
    ww1_mexico.20.d:0 "Huerta's position has collapsed under the pressure of the revolutionary armies and his political opponents. Carranza is preparing to assume power, inheriting a country exhausted and divided by the fighting."
    ww1_mexico.20.a:0 "Establish the constitutional government."
#

# WW1 Portugal #
    ww1_portugal.1.t:0 "The Monarchy of the North"
    ww1_portugal.1.d:0 "Monarchist forces have proclaimed a restored kingdom in Porto. The republican government is preparing to resist them, while supporters of the crown hope that the movement will spread beyond the north."
    ww1_portugal.1.a:0 "Defend the Republic."
    ww1_portugal.1.b:0 "Stand with the restoration."
    ww1_portugal.2.t: "Bloody Night"
    ww1_portugal.2.d:0 "A military revolt in Lisbon has been accompanied by the murder of António Granjo and other republican figures. The killings have deepened the crisis of the republic as the authorities struggle to restore order and establish responsibility."
    ww1_portugal.2.a:0 "Restore order in Lisbon."
    ww1_portugal.3.t:0 "The Assassination of Sidónio Pais"
    ww1_portugal.3.d:0 "President Sidónio Pais has been shot at Lisbon's Rossio station and has died of his wounds. His assassination leaves the government facing an uncertain succession as its supporters and opponents mobilise around the crisis."
    ww1_portugal.3.a:0 "The succession cannot wait."
    ww1_portugal.4.t:0 "An Attempt on the President"
    ww1_portugal.4.d:0 "An attempt has been made on the life of President Sidónio Pais during a public ceremony. The president escaped injury, but the attack has sharpened concerns over political violence and the security of the government."
    ww1_portugal.4.a:0 "Strengthen the president's security."
    ww1_portugal.5.t:0 "The Military Coup"
    ww1_portugal.5.d:0 "The military has moved against the First Republic, bringing its government to an end. The leaders of the coup promise to restore order, but their intervention opens a new struggle over who will direct the state."
    ww1_portugal.5.a:0 "The military assumes control."
    ww1_portugal.6.t:0 "Cabeçadas Is Deposed"
    ww1_portugal.6.d:0 "Military rivals have forced José Mendes Cabeçadas to relinquish his offices in favour of Gomes da Costa. The change reveals the divisions within the new regime as its leaders contest the direction of the government."
    ww1_portugal.6.a:0 "Gomes da Costa takes office."
    ww1_portugal.7.t:0 "Gomes da Costa Is Overthrown"
    ww1_portugal.7.d:0 "Gomes da Costa has been overthrown by another military intervention, with Óscar Carmona emerging at the head of the government. The rapid succession of rulers has left the regime searching for a more durable basis of authority."
    ww1_portugal.7.a:0 "Carmona takes the presidency."
    ww1_portugal.8.t: "Salazar Comes to Power"
    ww1_portugal.8.d:0 "President Carmona has appointed António de Oliveira Salazar to head the government. His rise from the Finance Ministry gives him a central role in shaping the administration and the institutions of the regime."
    ww1_portugal.8.a:0 "A new head of government."
    ww1_portugal.9.t:0 "The Portuguese Revolution"
    ww1_portugal.9.d:0 "Republican soldiers and sailors have risen against the monarchy. A provisional government is taking shape as the royal authorities struggle to retain control of the capital."
    ww1_portugal.9.a:0 "Support the Republic."
    ww1_portugal.9.b:0 "Defend the crown."
    ww1_portugal.10.t:0 "The Portuguese Appeal"
    ww1_portugal.10.d:0 "Portuguese monarchists have requested assistance in their struggle against the republic. Supporting them could strengthen the position of the crown, but intervention would involve us in a neighbouring country's civil war."
    ww1_portugal.10.a:0 "Support the monarchists."
    ww1_portugal.10.b:0 "Remain outside the conflict."
    ww1_portugal.11.t:0 "The Monarchy Restored"
    ww1_portugal.11.d:0 "Monarchist forces have entered Lisbon, and republican resistance is collapsing. The restored government must now establish its authority and decide how to secure the crown against another revolution."
    ww1_portugal.11.a:0 "Consolidate the restored monarchy."
    ww1_portugal.12.t: "Attack on Chaves"
    ww1_portugal.12.d:0 "Government forces have defeated the royalist attack at Chaves. The failure has checked Paiva Couceiro's campaign, although the divisions between monarchists and republicans remain unresolved."
    ww1_portugal.12.a:0 "The attack has been defeated."
    ww1_portugal.13.t: "Spain Agrees to Give Aid"
    ww1_portugal.13.d:0 "Alfonso XIII has agreed to allow aid to reach our supporters through Spain. The assistance offers a welcome opportunity to strengthen the monarchist campaign against the republic."
    ww1_portugal.13.a:0 "Put the assistance to use."
    ww1_portugal.14.t: "National Assembly Dissolved!"
    ww1_portugal.14.d:0 "President Manuel de Arriaga has dissolved the National Assembly and appointed Pimenta de Castro to direct the government. Military officers now occupy key ministries as republicans challenge the legality of the new administration."
    ww1_portugal.14.a:0 "The republic faces another crisis."
    ww1_portugal.15.t:0 "The May Revolt"
    ww1_portugal.15.d:0 "Soldiers and sailors have risen in Lisbon against Pimenta de Castro's government. Fighting around the naval arsenal has brought the dispute over constitutional authority into the streets."
    ww1_portugal.15.a:0 "Restore constitutional government."
    ww1_portugal.16.t:0 "Sidónio Pais Takes Power"
    ww1_portugal.16.d:0 "Sidónio Pais has led a military revolt that has displaced the government and removed President Bernardino Machado. Parliament has been dissolved as the new authorities set out their programme for a reorganisation of the republic."
    ww1_portugal.16.a:0 "A new regime takes shape."
    ww1_portugal.17.t: "Law of Separation of Church and State"
    ww1_portugal.17.d:0 "The government has amended the law separating Church and state in an attempt to ease the conflict with the Catholic Church. The decision has won support among religious and moderate groups while provoking opposition from defenders of the earlier republican settlement."
    ww1_portugal.17.a:0 "Seek a more stable settlement."
    ww1_portugal.18.t: "Pais Proclaims 'Universal Suffrage'"
    ww1_portugal.18.d:0 "Sidónio Pais has decreed the direct election of the president, changing the constitutional arrangements of the republic. Supporters present the measure as an appeal to the nation, while opponents challenge the authority under which it has been introduced."
    ww1_portugal.18.a:0 "The constitution has been changed."
#

# WW1 Romania #
    ww1_romania.1.t: "Carol I Dies"
    ww1_romania.1.d:0 "King Carol I has died after a long reign. Ferdinand succeeds to the throne as Romania weighs its territorial ambitions and its obligations to the competing European alliances."
    ww1_romania.1.a:0 "Ferdinand inherits a difficult choice."
#

# WW1 Russia
    ww1_russia.1.t:0 "An Understanding with Romania"
    ww1_russia.1.d:0 "Our envoys report a warmer reception in Bucharest, but Romania remains reluctant to enter the war. Its ministers want evidence that the Russian armies can prevail before committing their country to our cause."
    ww1_russia.1.a:0 "Keep the negotiations open."
    ww1_russia.2.t:0 "The Slavic Connection"
    ww1_russia.2.d:0 "Russian diplomacy has strengthened our ties with Serbia and Montenegro. Their representatives look to us for support as the rival ambitions of the great powers press ever more heavily upon the Balkans."
    ww1_russia.2.a:0 "Our friendship must endure."
    ww1_russia.3.t:0 "The Defence of Serbia"
    ww1_russia.3.d:0 "The assassination at Sarajevo has brought relations between Vienna and Belgrade to a dangerous impasse. Our ministers urge a clear assurance that Serbia will not face Austrian pressure alone."
    ww1_russia.3.a:0 "Russia will stand by Serbia."
    ww1_russia.4.t:0 "Fortifying the Capital"
    ww1_russia.4.d:0 "The approaches to the capital remain vulnerable to attack from the Baltic. Naval engineers have prepared plans for coastal batteries and defensive positions to protect the city and its harbours."
    ww1_russia.4.a:0 "Strengthen the coastal defences."
    ww1_russia.5.t:0 "Foreign Investment in Russian Industry"
    ww1_russia.5.d:0 "Foreign banks and industrial firms are extending their interests in Russia's growing manufacturing sector. New contracts promise workshops, machinery and employment, although the pace of development still varies greatly across the empire."
    ww1_russia.5.a:0 "Welcome the new investment."
    ww1_russia.6.t:0 "The Last Links of the Trans-Siberian Railway"
    ww1_russia.6.d:0 "Railway engineers are preparing the remaining works needed to connect the heart of Russia with the Pacific coast. Completing this immense undertaking will bind distant provinces to the same transport network and bring Vladivostok within more dependable reach."
    ww1_russia.6.a:0 "Let the work continue."
    ww1_russia.7.t:0 "The Trans-Siberian Railway Completed"
    ww1_russia.7.d:0 "The final works on the Trans-Siberian route have been completed. Trains can now carry passengers and freight across the breadth of the country, giving the Far East a firmer connection to Russia's industrial centres."
    ww1_russia.7.a:0 "A railway across a continent."
    ww1_russia.8.t:0 "Preparing for War"
    ww1_russia.8.d:0 "The European crisis is drawing Russia towards a conflict whose scale remains uncertain. Military offices are gathering reservists and reviewing supplies as the government prepares for the possibility that diplomacy will fail."
    ww1_russia.8.a:0 "We must be ready."
    ww1_russia.9.t:0 "Russian Interests in Northern Persia"
 ww1_russia.9.d:0 "Our mission in Persia reports growing concern over the security of the northern provinces and the routes leading to the Caspian. The Foreign Ministry proposes a firmer assertion of Russian interests, giving our representatives a common position in their dealings with Tehran."
    ww1_russia.9.a:0 "Present our claims."
    ww1_russia.10.t:0 "The Needs of the Front"
    ww1_russia.10.d:0 "Reports from the army demand a greater share of the country's attention. Ministers and commanders are concentrating their efforts on sustaining the front, even as civilian offices warn of mounting pressures at home."
    ww1_russia.10.a:0 "The army must be sustained."
    ww1_russia.11.t:0 "Sustaining the Campaign"
    ww1_russia.11.d:0 "The fighting has renewed the army's demands for men, weapons and transport. The government is placing the needs of the campaign at the centre of its work while provincial officials struggle to keep ordinary services running."
    ww1_russia.11.a:0 "Keep the front supplied."
    ww1_russia.12.t:0 "An Unrelenting War Effort"
    ww1_russia.12.d:0 "The high command is pressing for another concentrated effort to bring the campaign to a decision. Across the country, public business is increasingly shaped by the demands arriving from headquarters."
    ww1_russia.12.a:0 "Carry the campaign forward."
    ww1_russia.13.t:0 "Brusilov Opens His Offensive"
    ww1_russia.13.d:0 "General Alexei Brusilov has begun a major assault against the Austro-Hungarian front. His commanders hope that coordinated attacks and careful preparation will break the enemy's positions and restore the initiative to the Russian army."
    ww1_russia.13.a:0 "Let the offensive begin."
    ww1_russia.14.t:0 "Russian Troops for France"
    ww1_russia.14.d:0 "France has appealed for Russian soldiers to serve beside its armies on the Western Front. The government has approved an expeditionary contingent as a visible expression of our common war effort."
    ww1_russia.14.a:0 "Our soldiers will stand beside France."
    ww1_russia.15.t:0 "Arms from the Allies"
    ww1_russia.15.d:0 "A new shipment of Allied weapons has reached Russia. The rifles are welcome news to commanders whose recruiting depots have been filling faster than the arsenals can equip their men."
    ww1_russia.15.a:0 "Send them to the troops."
    ww1_russia.16.t:0 "Further Allied Deliveries"
    ww1_russia.16.d:0 "Another consignment of Allied armaments has arrived for the Russian army. Supply officers are arranging its distribution among formations still struggling with shortages at the front."
    ww1_russia.16.a:0 "The deliveries are most welcome."
    ww1_russia.17.t:0 "An Understanding with Mongolia"
 ww1_russia.17.d:0 "Representatives of the Mongolian government are seeking a dependable relationship with Russia. Our diplomats favour closer ties with a recognised authority on the frontier, where uncertainty in China has unsettled older arrangements."
    ww1_russia.17.a:0 "Cultivate the relationship."
    ww1_russia.18.t:0 "Russia's Position in Asia"
    ww1_russia.18.d:0 "The upheaval in China has reopened questions of influence throughout the region. Russian diplomats see an opportunity to strengthen our standing in Asia while officials in the Far East urge a clearer statement of national ambitions."
    ww1_russia.18.a:0 "Assert Russia's interests."
 ww1_russia.19.t:0 "The Manchurian Question"
 ww1_russia.19.d:0 "Manchuria's railways and trading centres remain a focus of Russian attention. Commercial representatives favour closer economic ties, while others in the ministry demand that we press our claims to strategic concessions."
 ww1_russia.19.a:0 "Develop our commercial interests."
    ww1_russia.20.t:0 "A Campaign against the Revolutionaries"
    ww1_russia.20.d:0 "Police reports describe renewed activity among revolutionary organisations. The government is preparing a coordinated effort to break their networks, while its opponents warn that repression will deepen the estrangement between the state and its subjects."
    ww1_russia.20.a:0 "Authorise the crackdown."
    ww1_russia.21.t:0 "The Policy of Russification"
    ww1_russia.21.d:0 "The ministries are extending their efforts to make Russian language and institutions the common foundation of imperial administration. Schools and local authorities in the borderlands face renewed pressure, sharpening disputes over faith, language and loyalty."
    ww1_russia.21.a:0 "Enforce the government's policy."
    ww1_russia.22.t:0 "St Petersburg Becomes Petrograd"
    ww1_russia.22.d:0 "The government has ordered that St Petersburg be renamed Petrograd. At a time of war with Germany, officials consider the capital's German-sounding name an unwelcome reminder of foreign influence."
    ww1_russia.22.a:0 "Let the new name be proclaimed."
    ww1_russia.23.t:0 "Guarantees in the Balkans"
    ww1_russia.23.d:0 "Serbia and Montenegro continue to face the pressure of Austro-Hungarian ambitions. Our government is preparing formal assurances of their independence, making Russia's commitment to its Balkan partners unmistakable."
    ww1_russia.23.a:0 "Stand by Serbia and Montenegro."
    ww1_russia.24.t:0 "The February Revolution"
    ww1_russia.24.d:0 "Crowds demanding bread have filled the streets of Petrograd, and the unrest is spreading beyond the factories. As soldiers abandon their officers or refuse to fire on the demonstrators, the authorities are losing their hold on the capital."
    ww1_russia.24.a:0 "The government is losing control."
    ww1_russia.25.t:0 "Nicholas II Abdicates"
    ww1_russia.25.d:0 "Nicholas II has renounced the throne as support for his rule collapses. With Grand Duke Michael unwilling to accept the crown without a broader settlement, the future of the monarchy passes into the hands of the new authorities."
    ww1_russia.25.a:0 "The old order has fallen."
    ww1_russia.26.t:0 "A Polish Formation in the Russian Army"
    ww1_russia.26.d:0 "Plans have been approved for a distinct Polish formation within the Russian forces. Its organisers hope that service under Polish officers and emblems will reconcile national aspirations with the struggle against the Central Powers."
    ww1_russia.26.a:0 "Proceed with the formation."
    ww1_russia.27.t:0 "The Emperor Takes Command"
    ww1_russia.27.d:0 "Nicholas II has assumed supreme command of the Russian army and departed for headquarters. The decision places the prestige of the crown directly beside the fortunes of the front, while the business of government continues in the capital."
    ww1_russia.27.a:0 "The crown now shares the army's fortunes."
    ww1_russia.28.t:0 "The Burden of the Home Front"
    ww1_russia.28.d:0 "Civilian officials are warning that the demands of war cannot be met without attention to the country behind the armies. The government is renewing its concern for public order, supplies and the daily work of provincial administration."
    ww1_russia.28.a:0 "Attend to the home front."
    ww1_russia.29.t:0 "Keeping the Country Together"
    ww1_russia.29.d:0 "Reports from the provinces describe a public growing weary of shortages and uncertainty. Ministers are giving greater attention to domestic affairs as they seek to preserve confidence in the government."
    ww1_russia.29.a:0 "The country must hold together."
    ww1_russia.30.t:0 "A Renewed Domestic Effort"
    ww1_russia.30.d:0 "The government is reviewing the condition of the home front once more. Keeping the railways, local offices and public services functioning has become inseparable from sustaining the country through the crisis."
    ww1_russia.30.a:0 "Keep the civil administration at work."
    ww1_russia.31.t:0 "Lvov Resigns"
    ww1_russia.31.d:0 "Prince Georgy Lvov has resigned as head of the Provisional Government. Alexander Kerensky is taking his place amid continuing disputes over the war, the authority of the cabinet and the demands of the soviets."
    ww1_russia.31.a:0 "A new ministry inherits the crisis."
    ww1_russia.32.t: "The July Days"
    ww1_russia.32.d:0 "Armed soldiers, sailors and workers have taken to the streets of Petrograd in demonstrations against the Provisional Government. Ministers blame the Bolsheviks for the disorder and are moving against their organisations as the party's leaders face arrest or flight."
    ww1_russia.32.a:0 "Restore order in the capital."
    ww1_russia.33.t:0 "The Kornilov Affair"
    ww1_russia.33.d:0 "General Kornilov's advance towards Petrograd has brought the Provisional Government to the brink of a confrontation with its own army. Kerensky has turned to the soviets and armed workers for support, frustrating the advance while strengthening forces that also oppose his government."
    ww1_russia.33.a:0 "The immediate danger has passed."
    ww1_russia.34.t:0 "The October Revolution"
    ww1_russia.34.d:0 "Bolshevik support has become the dominant force in Russian political life, and armed detachments are moving to seize the centres of authority in the capital. The government can no longer rely on the garrison to defend it as Bolshevik leaders proclaim power in the name of the soviets."
    ww1_russia.34.a:0 "All power to the soviets!"
    ww1_russia.35.t:0 "The Constituent Assembly Elections"
    ww1_russia.35.d:0 "The returns from the Constituent Assembly elections have revealed the strength of the Socialist Revolutionaries, particularly in the countryside. The Bolsheviks command substantial support but have failed to secure a majority, leaving the assembly and the soviets with competing claims to speak for Russia."
    ww1_russia.35.a:0 "The electorate has spoken."
    ww1_russia.36.t:0 "The Constituent Assembly Dissolved"
    ww1_russia.36.d:0 "The Constituent Assembly has refused to recognise the authority asserted by the Soviet government. Armed guards have ended its sitting, bringing the long-awaited meeting of elected deputies to an abrupt close."
    ww1_russia.36.a:0 "The soviets will govern."
    ww1_russia.37.t:0 "Lenin Returns to Russia"
    ww1_russia.37.d:0 "Vladimir Lenin has returned from exile after travelling through Germany and Finland. His arrival in Petrograd gives the Bolsheviks a leader determined to turn the revolution against any further accommodation with the old political order."
    ww1_russia.37.a:0 "His return will be felt."
    ww1_russia.38.t:0 "The April Theses"
    ww1_russia.38.d:0 "Lenin has called for an end to cooperation with the Provisional Government and demanded that power pass to the soviets. His programme challenges both the moderate socialists and those within his own party who had expected a more cautious course."
    ww1_russia.38.a:0 "The revolution enters a new phase."
    ww1_russia.39.t: "The Milyukov Note"
    ww1_russia.39.d:0 "Foreign Minister Pavel Milyukov's assurances to the Allies have made clear that the government intends to continue the war. Publication of the note has provoked demonstrations and renewed accusations that the revolution has left Russia's foreign policy unchanged."
    ww1_russia.39.a:0 "The ministry must answer for this."
    ww1_russia.40.t:0 "Three Centuries of Romanov Rule"
    ww1_russia.40.d:0 "Russia is marking three hundred years since the accession of the Romanov dynasty. Ceremonies, religious services and imperial appearances celebrate the bond between the crown and its subjects, presenting an image of unity to a country still divided over its future."
    ww1_russia.40.a:0 "God save the Emperor."
    ww1_russia.41.t: "The Ice March"
    ww1_russia.41.d:0 "The Volunteer Army has withdrawn towards the Kuban under pressure from advancing Red forces. Officers, soldiers and refugees are crossing a harsh countryside in the hope of finding new support among the Cossacks."
    ww1_russia.41.a:0 "The struggle continues in the south."
    ww1_russia.42.t:0 "The Russian Civil War"
    ww1_russia.42.d:0 "Armed opposition to Soviet rule is gathering around White commanders and regional authorities across Russia. The Red government is organising its own forces as scattered confrontations widen into a struggle for the country; between the opposing armies, railways, towns and villages are becoming the frontiers of rival states."
    ww1_russia.42.a:0 "Rally to the White cause."
    ww1_russia.42.b:0 "Defend Soviet power."
    ww1_russia.43.t:0 "The Treaty of Brest-Litovsk"
    ww1_russia.43.d:0 "Russian negotiators have been presented with a settlement that will end the conflict with the Central Powers at an enormous territorial cost. The western borderlands will pass beyond Russian authority, while new governments and German influence take root across the lands surrendered. Acceptance will release Russia from the war, but the consequences of the peace will shape its future for years to come."
    ww1_russia.43.a:0 "Sign the treaty."
    ww1_russia.44.t:0 "General Mobilisation"
    ww1_russia.44.d:0 "Orders for general mobilisation are going out to military districts across Russia. Reservists are reporting to their depots as trains, horses and supplies are gathered for a war whose length few can yet imagine."
    ww1_russia.44.a: "To the front lines!"
    ww1_russia.45.t: "Finland Declares Independence"
    ww1_russia.45.d:0 "The Finnish parliament has declared Finland an independent state. The collapse of imperial authority has brought the question of its relationship with Russia to a decisive moment, while rival political movements within Finland dispute the country's future."
    ww1_russia.45.a:0 "We must face what follows."
    ww1_russia.45.b: "Play as Finland"
    ww1_russia.46.t:0 "The Finnish Civil War"
    ww1_russia.46.d:0 "Rival authorities have emerged in Finland as the labour movement and its opponents prepare to settle their struggle by force. Armed formations are gathering on both sides, dividing towns, railways and communities between competing visions of the new state."
    ww1_russia.46.a:0 "May White Finland prevail."
    ww1_russia.46.b:0 "May the Finnish workers prevail."
#

# WW1 Serbia #
    ww1_serbia.1.t: "The Balkan League"
    ww1_serbia.1.d:0 "The Ottoman Empire's difficulties have encouraged the Balkan governments to consider a common front. Our diplomats propose an alliance with neighbouring states to press their claims against Constantinople."
    ww1_serbia.1.a:0 "Send the invitations."
    ww1_serbia.101.t:0 "An Invitation to the Balkan League"
    ww1_serbia.101.d:0 "Serbia has proposed a common alliance to challenge Ottoman power in the Balkans. Joining would strengthen our position, but would also bind our government to the interests of the other members."
    ww1_serbia.101.a:0 "Join the Balkan League."
    ww1_serbia.101.b:0 "Remain outside the alliance."
    ww1_serbia.102.t:0 "Romania and the Balkan League"
    ww1_serbia.102.d:0 "Belgrade has invited Romania to support the proposed Balkan League. The government can send limited assistance, join the alliance or keep its distance from the confrontation."
    ww1_serbia.102.a:0 "Send limited assistance."
    ww1_serbia.102.b:0 "Join the League."
    ww1_serbia.102.c:0 "Decline to participate."
    ww1_serbia.2.t:0 "The First Balkan War"
    ww1_serbia.2.d:0 "The Balkan League is preparing to act against the Ottoman Empire. Its members hope that a common campaign can secure their claims before Constantinople recovers its strength."
    ww1_serbia.2.a:0 "Begin the campaign."
    ww1_serbia.3.t: "Treaty of London 1913"
    ww1_serbia.3.d:0 "The settlement following the Ottoman defeat has redrawn the Balkans and established an independent Albania. Denied the expected expansion toward the Adriatic, Serbia disputes the earlier division of Macedonia with Bulgaria, placing the former allies on a new collision course."
    ww1_serbia.3.a: "The map of Europe is redrawn once again."
    ww1_serbia.301.t:0 "Terms for Constantinople"
    ww1_serbia.301.d:0 "The Ottoman armies have lost ground across the Balkans. Our allies are considering a peace offer to secure their gains before the enemy can recover."
    ww1_serbia.301.a:0 "Send the peace proposal."
    ww1_serbia.301.b:0 "Continue the campaign."
    ww1_serbia.301.c: "We have avenged 1453!"
    ww1_serbia.301.w:0 "Let Bulgaria conduct the negotiations."
    ww1_serbia.301.x: "Delegate the decision to Greece"
    ww1_serbia.301.y: "Delegate the decision to Montenegro"
    ww1_seriba.301.z: "Delegate the decision to Romania"
    ww1_serbia.302.t:0 "The Balkan Peace Offer"
    ww1_serbia.302.d:0 "The Balkan allies have offered terms following the loss of much of our European territory. The cabinet must decide whether to accept these concessions or continue the war in the hope of recovering our position."
    ww1_serbia.302.a:0 "Accept the terms."
    ww1_serbia.302.b:0 "Continue the war."
#

# WW1 Siam #
    ww1_siam.1.t: "Death of Rama V"
    ww1_siam.1.d:0 "King Chulalongkorn has died, and his son Vajiravudh succeeds him as Rama VI. The court prepares for a new reign that inherits the reforms and obligations of the late king's government."
    ww1_siam.1.a:0 "Prepare for the new reign."
    ww1_siam.2.t: "Palace Revolt of 1912"
    ww1_siam.2.d:0 "Authorities have uncovered a conspiracy among army officers to overthrow the king. The plotters have been arrested, exposing resentment within the services and raising questions over the crown's relationship with the army."
    ww1_siam.2.a:0 "The crown must reckon with this warning."
#

# WW1 Turkey #
    ww1_turkey.1.t:0 "Closer Relations with Germany"
    ww1_turkey.1.d:0 "Our representatives have returned from talks with Berlin on military and commercial cooperation. German assistance with the army and the Baghdad Railway has already created close ties between the two empires. The Porte sees an opportunity to strengthen that relationship."
    ww1_turkey.1.a:0 "Continue cooperation with Berlin."
    ww1_turkey.2.t:0 "The Black Sea Raid"
    ww1_turkey.2.d:0 "Admiral Souchon's squadron has attacked Russian positions in the Black Sea. The raid has brought the empire into the European conflict and placed the fleet at the centre of a diplomatic crisis. The government must now commit itself to the war alongside Germany."
    ww1_turkey.2.a:0 "Commit the empire to the war."
    ww1_turkey.3.t:0 "Defending the Balkan Frontier"
    ww1_turkey.3.d:0 "The Balkan governments press their claims against our remaining European provinces. Ministers have decided to resist further concessions and maintain the frontier. The army must prepare for the consequences of that decision."
    ww1_turkey.3.a:0 "Hold the remaining provinces."
    ww1_turkey.4.t:0 "A Negotiated Balkan Withdrawal"
    ww1_turkey.4.d:0 "The cabinet proposes a negotiated withdrawal from disputed Balkan districts. Concessions may avert another costly campaign, but neighbouring governments must first agree on the division. Our envoys are preparing to submit the settlement."
    ww1_turkey.4.a:0 "Submit the withdrawal proposal."
    ww1_turkey.5.t:0 "Talks with Sofia"
    ww1_turkey.5.d:0 "Ottoman representatives have opened talks with Sofia on closer relations. Bulgaria's ambitions could provide a counterweight to Serbia and improve our strategic position in the Balkans. Both governments must weigh the value of cooperation against their unresolved disputes."
    ww1_turkey.5.a:0 "Maintain the Bulgarian connection."
    ww1_turkey.6.t:0 "Assistance for Bulgaria"
    ww1_turkey.6.d:0 "Our Bulgarian partners have requested support for their army. The cabinet proposes sending assistance to strengthen their position against their neighbours. The mission will also demonstrate the value of cooperation with the Porte."
    ww1_turkey.6.a:0 "Send the promised assistance."
    ww1_turkey.7.t:0 "An Understanding with Britain"
    ww1_turkey.7.d:0 "The Porte is seeking a closer understanding with Britain. Ministers hope cooperation can ease the disputes that have weakened relations between the two empires. The talks offer a different course for Ottoman diplomacy."
    ww1_turkey.7.a:0 "Pursue the British connection."
    ww1_turkey.8.t:0 "Preparations for War"
    ww1_turkey.8.d:0 "The European crisis has made the army's preparations increasingly urgent. Headquarters is reviewing training and mobilisation arrangements in case diplomacy fails. The empire must be ready to defend its position."
    ww1_turkey.8.a:0 "Continue the army preparations."
    ww1_turkey.9.t: "Joining the Entente"
    ww1_turkey.9.d:0 "The government has decided to commit itself to the Entente under the negotiated understanding. Ottoman representatives are preparing the arrangements required for military cooperation. The decision will place the empire in a new alignment in the European war."
    ww1_turkey.9.a:0 "Carry out the negotiated commitment."
    ww1_turkey.10.t:0 "The German Military Mission"
    ww1_turkey.10.d:0 "The German military mission has submitted its recommendations on training and army organisation. Ottoman officers have worked with the advisers to bring new methods into the service. The government is preparing to support the programme."
    ww1_turkey.10.a: "We are glad to learn"
    ww1_turkey.11.t:0 "Army Readiness"
    ww1_turkey.11.d:0 "Army headquarters has called for another review of mobilisation and training. Commanders want clearer arrangements before the international crisis becomes a war. Preparations must continue while ministers weigh the empire's diplomatic course."
    ww1_turkey.11.a:0 "Review mobilisation and training."
    ww1_turkey.12.t:0 "The Call to Jihad"
    ww1_turkey.12.d:0 "The sultan has issued a call to jihad in support of the imperial war effort. The proclamation appeals to Muslim subjects and communities beyond the frontier. Religious and civil authorities are preparing to carry the appeal throughout the empire."
    ww1_turkey.12.a:0 "Publish the proclamation."
    ww1_turkey.13.t:0 "Assistance for the Senussi"
    ww1_turkey.13.d:0 "Senussi resistance continues against Italian rule in Libya. Ottoman representatives propose assisting the movement to maintain pressure on Italy after the loss of our African provinces. The cabinet has been asked to approve the support."
    ww1_turkey.13.a:0 "Support the Libyan resistance."
    ww1_turkey.14.t:0 "Expanding the War Effort"
    ww1_turkey.14.d:0 "Ministers are pressing for closer coordination of production in support of the army. The demands of the fronts leave little room for delay or competing priorities. The cabinet is preparing a further expansion of the war effort."
    ww1_turkey.14.a:0 "Coordinate production for the fronts."
    ww1_turkey.15.t:0 "The Dardanelles Defences"
    ww1_turkey.15.d:0 "The naval command has warned of the danger posed by a hostile fleet at the Dardanelles. New coastal works would strengthen the approaches to Constantinople. Engineers are preparing the positions needed to defend the Straits."
    ww1_turkey.15.a:0 "Strengthen the Straits batteries."
    ww1_turkey.16.t:0 "The Gallipoli Defences"
    ww1_turkey.16.d:0 "Gallipoli's coast offers an enemy fleet possible landing grounds behind the Straits defences. The army proposes additional fieldworks to protect the peninsula. The government must authorise the preparations before an attack develops."
    ww1_turkey.16.a:0 "Prepare the coastal positions."
    ww1_turkey.17.t:0 "The German Mission Continues"
    ww1_turkey.17.d:0 "German advisers continue their work with the Ottoman army. Joint training and staff consultations have given our officers further experience in modern operations. The mission proposes extending the programme to meet the demands of the fronts."
    ww1_turkey.17.a:0 "Extend the training programme."
    ww1_turkey.18.t:0 "The Defence of Baghdad"
    ww1_turkey.18.d:0 "Army headquarters proposes new defensive works around Baghdad. Commanders hope to hold the city if the Mesopotamian front gives way. Engineers and local authorities have been asked to prepare the positions."
    ww1_turkey.18.a:0 "Prepare the Baghdad positions."
    ww1_turkey.19.t:0 "The Defence of Jerusalem"
    ww1_turkey.19.d:0 "The army is preparing defensive works around Jerusalem. Its commanders seek a position from which to resist an advance through Palestine. Protecting the city will require cooperation between the garrison and the civil authorities."
    ww1_turkey.19.a:0 "Prepare the Jerusalem positions."
    ww1_turkey.20.t:0 "The Defence of Damascus"
    ww1_turkey.20.d:0 "Commanders have selected Damascus as an important position behind the Palestinian front. Defensive preparations are intended to slow an enemy advance into Syria. The government is authorising construction around the city."
    ww1_turkey.20.a:0 "Prepare the Damascus positions."
    ww1_turkey.21.t:0 "The Rashidi Connection"
    ww1_turkey.21.d:0 "The Rashidi rulers of Jabal Shammar seek closer cooperation with the Porte. Their rivalry with the House of Saud gives both governments reason to maintain the relationship. Ottoman representatives hope the connection will strengthen our position in Arabia."
    ww1_turkey.21.a:0 "Maintain relations with Jabal Shammar."
    ww1_turkey.22.t:0 "Talks with Persia"
    ww1_turkey.22.d:0 "Our mission to Persia has opened discussions on common concerns over Russian and British influence. Ministers believe a better relationship could ease tension along the frontier. The Porte is preparing to continue the diplomatic approach."
    ww1_turkey.22.a:0 "Continue the diplomatic approach."
    ww1_turkey.23.t:0 "A Confrontation with Persia"
    ww1_turkey.23.d:0 "Ministers have adopted a more confrontational policy towards Persia. Advocates of expansion argue that Ottoman influence should extend farther east. The decision is likely to deepen mistrust between the neighbouring governments."
    ww1_turkey.23.a:0 "Adopt the confrontational policy."
    ww1_turkey.24.t:0 "A Mission to Afghanistan"
    ww1_turkey.24.d:0 "An Ottoman mission is preparing to ask Afghanistan for cooperation in the war. Its members hope the emir will see an opportunity to challenge British influence in the region. Kabul must decide whether the risks of intervention serve Afghan interests."
    ww1_turkey.24.a:0 "Send the envoys to Kabul."
    ww1_turkey.2401.t:0 "The Ottoman Mission to Kabul"
    ww1_turkey.2401.d:0 "Ottoman envoys have arrived with a request for Afghan support in the war. They appeal to religious solidarity and the prospect of challenging British power near India. The emir must weigh their promises against the danger of abandoning neutrality."
    ww1_turkey.2401.a:0 "Accept the Ottoman proposal."
    ww1_turkey.2401.b:0 "Maintain Afghan neutrality."
    ww1_turkey.2402.t:0 "Afghanistan Accepts the Proposal"
    ww1_turkey.2402.d:0 "The emir has accepted our mission's proposal for cooperation. Ottoman representatives report that Kabul is prepared to support the war effort. We can now inform Berlin of the favourable reply."
    ww1_turkey.2402.a:0 "Inform Berlin of the reply."
    ww1_turkey.2403.t:0 "Afghanistan Remains Neutral"
    ww1_turkey.2403.d:0 "The emir has declined our request for intervention. Kabul considers its present relationship with Britain and the dangers of war more important than the promises of our mission. Afghanistan will retain its neutral position."
    ww1_turkey.2403.a:0 "Recall the mission."
    ww1_turkey.25.t: "Backing Jabal Shammar"
    ww1_turkey.25.d:0 "The government proposes backing Jabal Shammar in its disputes with neighbouring rulers. The Rashidi relationship offers the Porte a means of preserving influence in Arabia. Our representatives have been instructed to convey the commitment."
    ww1_turkey.25.a:0 "Convey our support to the Rashidi government."
    ww1_turkey.26.t:0 "Jabal Shammar Requests Support"
    ww1_turkey.26.d:0 "Jabal Shammar has called for Ottoman support against the House of Saud in Nejd. Ministers propose standing beside the Rashidi government in the conflict. The decision would turn our political commitment into direct involvement."
    ww1_turkey.26.a:0 "Stand beside Jabal Shammar."
    ww1_turkey.27.t:0 "Libyan Militia Volunteers"
    ww1_turkey.27.d:0 "Libyan recruits are joining the resistance to the Italian invasion. Local leaders have offered men familiar with the desert routes and the conditions beyond the coastal towns. Ottoman officers are organising them into militia formations."
    ww1_turkey.27.a:0 "Organise the local recruits."
    ww1_turkey.28.t:0 "Renewing Support for the Senussi"
    ww1_turkey.28.d:0 "The Senussi Order continues to oppose Italian control beyond the Libyan coast. Ottoman representatives propose renewing assistance to the movement. Supporting the resistance would preserve a connection with the province and maintain pressure on Italy."
    ww1_turkey.28.a:0 "Maintain the connection with Libya."
    ww1_turkey.29.t:0 "Opposition to the Committee"
    ww1_turkey.29.d:0 "Opponents of the Committee of Union and Progress demand stronger authority for the sultan. They accuse the Committee of placing party control above the empire's institutions. Their campaign is gathering support among those who reject the direction of recent reforms."
    ww1_turkey.29.a:0 "Support the palace opposition."
    ww1_turkey.30.t:0 "The Palace Regains Authority"
    ww1_turkey.30.d:0 "The Committee's opponents have displaced its leadership and restored greater authority to the palace. Ministers must now rebuild cooperation between the government, provincial offices and the army. The change has reopened the struggle over how the empire should be governed."
    ww1_turkey.30.a:0 "Consolidate the new government."
    ww1_turkey.31.t:0 "Suspending the Constitution"
    ww1_turkey.31.d:0 "The palace is moving to suspend the constitutional settlement and strengthen the executive. Its supporters argue that the empire requires a single authority in the present crisis. Opponents fear the loss of the representative institutions established after the revolution."
    ww1_turkey.31.a:0 "Place executive authority with the palace."
    #ww1_turkey.32.t:0 ""
    #ww1_turkey.32.d:0 ""
    #ww1_turkey.32.a:0 ""
    ww1_turkey.33.t:0 "The Authority of the Caliph"
    ww1_turkey.33.d:0 "The government proposes strengthening the caliph's public and religious authority. Palace supporters hope the policy will renew loyalty across the empire's Muslim communities. Ministers must reconcile this appeal with the demands of civil administration and the army."
    ww1_turkey.33.a:0 "Strengthen the caliph's public authority."
    ww1_turkey.34.t:0 "The Unionist Programme"
    ww1_turkey.34.d:0 "The Committee of Union and Progress has set out a programme to strengthen the empire through reform. Its supporters call for renewed authority and closer coordination between the ministries. The government must now turn these promises into policy."
    ww1_turkey.34.a:0 "Support the Committee's reform programme."
 ww1_turkey.35.t:0 "The Raid on the Sublime Porte"
 ww1_turkey.35.d:0 "Unionist leaders move against the cabinet as defeat and dispute over the Balkan settlement expose its weakness. Control of the Porte promises the Committee closer authority over appointments and military policy, but provincial confidence cannot be secured by the seizure of a ministry alone. The government now faces the responsibility of turning that authority into a workable administration."
    ww1_turkey.35.a:0 "Consolidate Unionist authority."
    ww1_turkey.36.t:0 "Reforming the Administration"
    ww1_turkey.36.d:0 "The Committee has begun revising ministerial responsibilities and provincial administration. Its leaders expect clearer authority to strengthen the government's position. Local officials and officers will judge the reform by the orders that reach them."
    ww1_turkey.36.a:0 "Carry out the ministerial reforms."
    ww1_turkey.37.t:0 "Coordinating the Ministries"
    ww1_turkey.37.d:0 "Unionist ministers have prepared a further programme of administrative reform. They seek closer cooperation between departments carrying the demands of the war effort. The cabinet is ready to put the measures into practice."
    ww1_turkey.37.a:0 "Put the programme into effect."
    ww1_turkey.38.t:0 "Extending the Reforms"
    ww1_turkey.38.d:0 "The government is extending the reforms begun under Unionist leadership. Ministers hope a more consistent administration will strengthen the empire's capacity to act. The new measures now pass to the departments responsible for carrying them out."
    ww1_turkey.38.a:0 "Proceed with the new measures."
    ww1_turkey.39.t: "Turkish Nationalism"
    ww1_turkey.39.d:0 "Nationalist voices within the government press for a stronger Turkish identity at the centre of the empire. Supporters see a source of unity and resolve, while other communities fear further exclusion. The policy will affect relations between the Porte, the provinces and the army."
    ww1_turkey.39.a:0 "Endorse the nationalist policy."
    ww1_turkey.40.t:0 "A Common Ottoman Identity"
    ww1_turkey.40.d:0 "Supporters of Ottomanism call for a common civic identity across the empire's religious and national communities. They argue that equal standing before the law can preserve loyalty to the state. The cabinet is preparing to make that principle part of its administration."
    ww1_turkey.40.a:0 "Affirm equal standing under the law."
    ww1_turkey.41.t:0 "The Order to Disarm Armenian Servicemen"
    ww1_turkey.41.d:0 "The War Ministry has ordered Armenian servicemen removed from their posts and disarmed. The order applies suspicion to an entire community as fighting intensifies on the eastern frontier. Armenian civilians and soldiers face a growing threat from the government's wartime measures."
    ww1_turkey.41.a:0 "Implement the War Ministry's order."
    ww1_turkey.42.t:0 "The Anglo-Ottoman Convention"
    ww1_turkey.42.d:0 "Ottoman and British representatives have signed a convention addressing jurisdiction around the Persian Gulf. Its provisions concern Kuwait, Qatar, Bahrain and the Shatt al-Arab. The agreement awaits ratification amid continuing uncertainty over the region's future."
    ww1_turkey.42.a:0 "Record the signed convention."
    ww1_turkey.43.t:0 "The Burdur Earthquake"
    ww1_turkey.43.d:0 "A severe earthquake has struck Burdur and the surrounding districts. Buildings have collapsed, families have been left without shelter and local authorities report heavy losses. The disaster places another burden on an administration already strained by war."
    ww1_turkey.43.a:0 "Receive the reports from Burdur."
    ww1_turkey.44.t:0 "The Armenian Congress at Erzurum"
    ww1_turkey.44.d:0 "Unionist representatives have approached the Armenian congress at Erzurum with a proposal for action against Russia. They ask Armenian political leaders to encourage a rising across the frontier in the event of war. The congress has rejected the request."
    ww1_turkey.44.a:0 "The proposal has been refused."
    ww1_turkey.45.t:0 "Resistance at Zeitun"
    ww1_turkey.45.d:0 "Armed resistance has broken out at Zeitun as relations between the authorities and the Armenian population deteriorate. Officials have called for troops to reassert control. The confrontation threatens to deepen the insecurity in the district."
    ww1_turkey.45.a:0 "Dispatch the forces ordered to Zeitun."
    ww1_turkey.46.t:0 "Renewed Resistance at Zeitun"
    ww1_turkey.46.d:0 "Resistance has resumed at Zeitun after the earlier confrontation with the authorities. Troops are again being sent to suppress it. Renewed fighting places the local population in further danger."
    ww1_turkey.46.a:0 "The confrontation continues."
    ww1_turkey.47.t: "Urfa Resistance"
    ww1_turkey.47.d: "There has been reported Armenian resistance in Urfa, Armenians have put up quite a bit of resistance against our forces however are expected to ultimately be crushed as the Zeitun rebellion has been."
    ww1_turkey.47.a: "Death to them"
    ww1_turkey.48.t:0 "The Deportation Law"
    ww1_turkey.48.d:0 "The government has enacted a law authorising deportation under the pretext of military necessity. The measure gives the authorities sweeping powers over civilian communities already exposed to wartime persecution. Its implementation threatens the lives and security of the Armenian population."
    ww1_turkey.48.a:0 "Implement the deportation law."
    ww1_turkey.49.t:0 "The Siege of Van"
    ww1_turkey.49.d:0 "Armenian defenders in Van are resisting Ottoman forces. The confrontation has developed into a siege as the eastern frontier becomes more unstable. Fighting in the city places its inhabitants in grave danger."
    ww1_turkey.49.a:0 "The siege continues."
    ww1_turkey.50.t:0 "The Treaty of Daan"
    ww1_turkey.50.d:0 "Representatives of the sultan and Imam Yahya have concluded an agreement at Daan. The settlement recognises wider local authority in Yemen while preserving Ottoman sovereignty. Both parties hope the arrangement will end the dispute over provincial rule."
    ww1_turkey.50.a:0 "Recognise the agreed local authority."
    ww1_turkey.51.t:0 "The Disputed Ottoman Election"
    ww1_turkey.51.d:0 "The Committee of Union and Progress has secured an overwhelming majority in the Chamber of Deputies. The opposition disputes the conduct of an election marked by pressure and intimidation. The result has deepened the struggle over the government's legitimacy."
    ww1_turkey.51.a:0 "The result has deepened the political divide."
    ww1_turkey.52.t:0 "The Saviour Officers Intervene"
    ww1_turkey.52.d:0 "Officers calling themselves the Saviour Officers have forced a change of government against the Committee of Union and Progress. They claim to act against the abuses surrounding the recent election. The intervention has left the empire's constitutional order under renewed military pressure."
    ww1_turkey.52.a:0 "Another government has fallen."
    ww1_turkey.53.t:0 "The Albanian Revolt of 1912"
    ww1_turkey.53.d:0 "A new revolt has broken out among the Albanians. Resentment over taxation, conscription, disarmament and central control has brought armed resistance against the government. Ministers must respond as imperial authority weakens in the region."
    ww1_turkey.53.a:0 "Respond to the rising."
    ww1_turkey.54.t:0 "The Albanian Revolt of 1910"
    ww1_turkey.54.d:0 "Resistance to the government's centralising measures has spread through Albanian districts. Railway obstruction and attacks on Ottoman officials have prompted the authorities to impose martial law. The revolt threatens the security of the empire's remaining European provinces."
    ww1_turkey.54.a:0 "Maintain the authorities' response."
    ww1_turkey.55.t:0 "The Albanian Revolt of 1911"
    ww1_turkey.55.d:0 "Another Albanian revolt has challenged Ottoman authority in the north. Reports of arms and refuge supplied from Montenegro have sharpened the diplomatic dispute with Cetinje. The government faces both a local rising and a dangerous frontier crisis."
    ww1_turkey.55.a:0 "Confront the frontier crisis."
    ww1_turkey.56.t:0 "The Karak Revolt"
    ww1_turkey.56.d:0 "Al-Karak has risen against new demands for conscription, taxation and disarmament. Ottoman forces have suppressed the revolt with harsh reprisals and the execution of its leaders. Anger over the punishment continues to damage relations with the local population."
    ww1_turkey.56.a:0 "The reprisals leave a bitter legacy."
 ww1_turkey.57.t:0 "Montenegro Proclaims a Kingdom"
 ww1_turkey.57.d:0 "Nikola accepts a royal title as Montenegro proclaims itself a kingdom. The change concerns the form and dignity of an already independent state, rather than a new Ottoman grant of independence. Foreign governments now consider how the proclamation affects its standing among the neighbouring monarchies."
    ww1_turkey.57.a:0 "Note the royal proclamation."
    ww1_turkey.58.t:0 "The Mudros Armistice Terms"
    ww1_turkey.58.d:0 "Our representatives have received armistice terms at Mudros. The Entente demands demobilisation, access to strategic transport and the occupation of the Straits defences. The government must decide whether to accept the terms or continue a war that has exhausted the empire."
    ww1_turkey.58.a:0 "Accept the armistice."
    ww1_turkey.58.b:0 "Continue the war."
    ww1_turkey.59.t:0 "The Mudros Armistice Terms"
    ww1_turkey.59.d:0 "Our representatives have received armistice terms at Mudros. The Entente demands demobilisation, access to strategic transport and the occupation of the Straits defences. The government must decide whether to accept the terms or continue a war that has exhausted the empire."
    ww1_turkey.59.a:0 "Accept the armistice."
    ww1_turkey.60.t:0 "The Death of Mehmed V"
    ww1_turkey.60.d:0 "Sultan Mehmed V has died after a reign overshadowed by revolution and war. Mehmed VI succeeds him as the empire faces military exhaustion and political division. The new sovereign inherits an uncertain future."
    ww1_turkey.60.a:0 "A new sultan inherits the war."
    ww1_turkey.61.t:0 "The Treaty of Sèvres"
    ww1_turkey.61.d:0 "The government in Constantinople has signed the Treaty of Sèvres. Its terms concede territory, place the Straits under international supervision and grant Greece a position in western Anatolia and Thrace. The Grand National Assembly in Ankara rejects the settlement as an imposed partition."
    ww1_turkey.61.a: "Ankara will not accept partition."
    ww1_turkey.62.t: "War on the Western Front"
    ww1_turkey.62.d: "Ankara's reorganized forces face the Greek army across western Anatolia. The local resistance has become a war between armies, while the other Allied powers watch the fighting without joining the front directly."
    ww1_turkey.62.a: "Defend Anatolia."
    ww1_turkey.63.t: "Treaty of Moscow"
    ww1_turkey.63.d: "The government in Ankara and Soviet Russia have reached an agreement. Both reject the imposed postwar order; Moscow recognizes the national movement and the parties set out the principles of their northeastern frontier."
    ww1_turkey.63.a: "Secure the eastern border."
    ww1_turkey.64.t: "Greek Troops Land at Izmir"
    ww1_turkey.64.d: "Greek forces have landed at Izmir. The occupation alarms Anatolia and encourages local defense associations to coordinate their opposition to the postwar settlement."
    ww1_turkey.64.a: "The occupation will be resisted."
    ww1_turkey.65.t: "The Treaty of Batum"
    ww1_turkey.65.d:0 "Ottoman representatives and the Caucasian governments have reached a settlement at Batum. The agreement addresses wartime claims along a frontier transformed by the collapse of Russian authority. The government is preparing to record the terms."
    ww1_turkey.65.a:0 "Record the Caucasian settlement."
    ww1_turkey.66.t: "The Treaty of Lausanne"
    ww1_turkey.66.d:0 "The peace conference has signed a new treaty recognising Turkish sovereignty. The Treaty of Lausanne supersedes the rejected settlement at Sèvres. The frontiers won or negotiated by Ankara now form the basis of a new peace."
    ww1_turkey.66.a: "A sovereign peace."
    ww1_turkey.67.t: "Resistance in Cilicia"
    ww1_turkey.67.d: "Local resistance to French occupation continues in the southern towns and countryside. Ankara coordinates the movement while concentrating its regular army against Greece."
    ww1_turkey.67.a: "Support the southern front."
    ww1_turkey.68.t: "The Eastern Campaign"
    ww1_turkey.68.d: "The eastern army advances against Armenian forces while Ankara seeks a defensible Caucasian frontier. The campaign and its diplomacy will decide the fate of Kars."
    ww1_turkey.68.a: "Secure the east."
    ww1_turkey.69.t: "The Cilician Ceasefire"
    ww1_turkey.69.d: "Fighting in Cilicia slows as both sides explore a settlement. France must decide how long it will maintain a costly occupation while Ankara needs its resources on the western front."
    ww1_turkey.69.a: "Continue the talks."
    ww1_turkey.70.t: "The Franco-Turkish Agreement"
    ww1_turkey.70.d: "France and the government in Ankara agree on a southern boundary and the withdrawal of French troops from Cilicia. Hatay remains under French administration, leaving one question unsettled."
    ww1_turkey.70.a: "The southern front is settled."

    ww1_turkey.71.t:0 "The Haidar Pasha Explosion"
    ww1_turkey.71.d:0 "A major explosion has devastated the military stores at Haidar Pasha station. Ammunition and fuel have been lost, and transport through the important Bosporus railway terminal has been disrupted. Officials are still examining the cause of the disaster."
    ww1_turkey.71.a:0 "A serious loss for the war effort."
#

# WW1 Ukraine #
    ww1_ukraine.1.t:0 "The Hetman Takes Power"
    ww1_ukraine.1.d:0 "The Central Council has been dispersed, and Pavlo Skoropadsky has assumed power as hetman with German backing. His government promises order and a more dependable administration, while its opponents denounce the overthrow of the republic."
    ww1_ukraine.1.a:0 "A new government assumes authority."
    ww1_ukraine.2.t: "Ukranian-Polish War"
    ww1_ukraine.2.d: "The Polish-Ukrainian War started on the 1st of November 1918 lasting to the 17th of July the following year over the complicated issue of Galicia. Due to a complicated history in Galicia under the rule of the Habsburgs for many years, a national identity of Ukrainians was developed over time to counter Polish autonomy demands. After the de facto dissolution and collapse of the Austro-Hungarian government in October of 1918 two regiments consisting largely of Ukrop’s in an effort to unite the West Ukrainian lands within the former Austro-Hungarian Empire took control of the cities of Lviv proclaiming it as their capital. The Polaks which had been a majority in the city were shocked to be in a Ukrainian state and eventually fighting began between Ukrainian and Polish forces mainly concentrated around the city of Lviv."
    ww1_ukraine.2.a: "We will defend our rightful lands!"
    ww1_ukraine.3.t:0 "The Fall of the Hetmanate"
    ww1_ukraine.3.d:0 "The loss of German and Austrian support has undermined Skoropadsky's government. Forces of the Directory have entered Kyiv and restored the Ukrainian People's Republic, opening another struggle to secure authority across the country."
    ww1_ukraine.3.a:0 "The republic must be secured."
    ww1_ukraine.4.t:0 "The Act of Union"
    ww1_ukraine.4.d:0 "Representatives of the Ukrainian People's Republic and the West Ukrainian People's Republic have proclaimed their union. The declaration expresses a common national ambition, but separate armies and administrations still face the practical work of unification."
    ww1_ukraine.4.a:0 "Work toward a united Ukraine."
    ww1_ukraine.5.t:0 "The Future of Crimea"
    ww1_ukraine.5.d:0 "Germany has offered Ukraine control of the former territories of the Taurida Soviet Republic. The government must decide how to administer the peninsula and whether to recognise a separate measure of autonomy for the Crimean Tatars."
    ww1_ukraine.5.a:0 "Accept the transfer."
    ww1_ukraine.5.b:0 "Recognise Tatar autonomy."
#

# WW1 USA #
    ww1_usa.1.t:0 "Support for the Entente"
    ww1_usa.1.d:0 "The administration is moving towards closer cooperation with the Entente. Its supporters believe that American interests would be endangered by a German victory, even while the United States remains outside the fighting."
    ww1_usa.1.a:0 "Support closer cooperation."
    ww1_usa.2.t:0 "The Lafayette Escadrille"
    ww1_usa.2.d:0 "American volunteers are preparing to fly in French service. The new squadron will allow them to take part in the war while the United States remains formally neutral."
    ww1_usa.2.a:0 "Wish the volunteers well."
    ww1_usa.3.t:0 "Supplies for the Entente"
    ww1_usa.3.d:0 "Further American supplies are being prepared for shipment to the Entente. Commercial and financial support allows the United States to influence the war while remaining outside the fighting."
    ww1_usa.3.a:0 "Arrange the shipments."
    ww1_usa.4.t:0 "Supplies for the Entente"
    ww1_usa.4.d:0 "Further American supplies are being prepared for shipment to the Entente. Commercial and financial support allows the United States to influence the war while remaining outside the fighting."
    ww1_usa.4.a:0 "Arrange the shipments."
    ww1_usa.5.t:0 "Supplies for the Entente"
    ww1_usa.5.d:0 "Further American supplies are being prepared for shipment to the Entente. Commercial and financial support allows the United States to influence the war while remaining outside the fighting."
    ww1_usa.5.a:0 "Arrange the shipments."
    ww1_usa.6.t:0 "The Submarine Dispute"
    ww1_usa.6.d:0 "The sinking of passenger and merchant ships has caused outrage in the United States. Washington is demanding assurances for American lives and commerce, warning Berlin that further attacks will endanger relations between the two countries."
    ww1_usa.6.a:0 "Demand an end to these attacks."
    ww1_usa.601.t:0 "An American Protest"
    ww1_usa.601.d:0 "Washington has condemned the submarine campaign and demanded protection for neutral shipping. The Admiralty considers the campaign essential to the war against Britain, but ministers fear that ignoring the protest will bring the United States closer to our enemies."
    ww1_usa.601.a:0 "Offer the requested assurances."
    ww1_usa_601.b: "Continue with it"
    ww1_usa.601.b:0 "Continue the submarine campaign."
    ww1_usa.602.t:0 "Germany Yields"
    ww1_usa.602.d:0 "Berlin has agreed to restrict its submarine campaign following our protests. The concession eases the immediate crisis over attacks on shipping."
    ww1_usa.602.a:0 "Maintain the diplomatic pressure."
    ww1_usa.603.t:0 "Germany Rejects Our Demands"
    ww1_usa.603.d:0 "Berlin has refused to halt its unrestricted submarine campaign. The government must decide whether to preserve American neutrality or seek authority for a firmer response."
    ww1_usa.603.a:0 "Maintain our neutrality."
    ww1_usa.603.b:0 "Prepare for intervention."
    ww1_usa.7.t:0 "The Zimmermann Telegram"
    ww1_usa.7.d:0 "A German proposal for an alliance with Mexico has become public. Its promise of American territory has caused outrage and strengthened calls for intervention. The administration must now decide whether neutrality can still protect the United States."
    ww1_usa.7.a:0 "Keep the United States out of the war."
    ww1_usa.7.b:0 "This demands a response."
    ww1_usa.8.t:0 "The Question of War"
    ww1_usa.8.d:0 "Relations with Germany have reached a crisis over submarine warfare and the proposal for an alliance with Mexico. The administration has placed the question of war before Congress, whose decision will determine America's role in the conflict."
    ww1_usa.8.a:0 "Approve the declaration of war."
    ww1_usa.9.t:0 "The American Expeditionary Force"
    ww1_usa.9.d:0 "American troops are being transported across the Atlantic for service in France. The army and navy are coordinating a growing flow of men and supplies to the Western Front."
    ww1_usa.9.a:0 "Support the expedition."
    ww1_usa.10.t:0 "American Neutrality"
    ww1_usa.10.d:0 "The administration has reaffirmed its intention to remain outside the European war. American diplomacy will protect national interests without committing the country to either coalition."
    ww1_usa.10.a:0 "Maintain our neutrality."
    ww1_usa.11.t:0 "A Policy of Non-Intervention"
    ww1_usa.11.d:0 "The government has adopted a policy of avoiding foreign military commitments beyond the direct defence of American territory. Its supporters believe that the country should preserve its freedom of action."
    ww1_usa.11.a:0 "Keep clear of foreign commitments."
    ww1_usa.12.t:0 "Troops on the Mexican Border"
    ww1_usa.12.d:0 "The army is reinforcing the border as fighting in Mexico threatens American towns. Commanders have been ordered to prevent further incursions and protect the settlements along the frontier."
    ww1_usa.12.a:0 "Secure the border."
    ww1_usa.13.t:0 "Intervention in Mexico"
    ww1_usa.13.d:0 "Francisco Madero's supporters are challenging the Díaz government. Washington is considering intervention, but sending American forces would turn a dispute over Mexico's future into a wider confrontation."
    ww1_usa.13.a:0 "Intervene on Madero's side."
    ww1_usa.14.t:0 "Aid for the Maderistas"
    ww1_usa.14.d:0 "The administration has approved assistance for Francisco Madero's movement. Arms are to be supplied to his supporters in the hope that they can overcome the Díaz government."
    ww1_usa.14.a:0 "Arrange the deliveries."
    ww1_usa.15.t:0 "The Mexican Border"
    ww1_usa.15.d:0 "The fighting in Mexico has raised fears of violence spreading across the border. Army officers are strengthening key positions and preparing to protect American towns and transport routes."
    ww1_usa.15.a:0 "Secure the border."
    ww1_usa.16.t:0 "Opposition to Huerta"
    ww1_usa.16.d:0 "The administration has declared its support for the forces opposing Victoriano Huerta. Washington regards the overthrow of Madero and the military government that followed as an obstacle to constitutional rule in Mexico."
    ww1_usa.16.a:0 "Support the opposition."
    ww1_usa.17.t:0 "Withdrawal from Veracruz"
    ww1_usa.17.d:0 "American forces are withdrawing from Veracruz following the fall of Huerta. The administration hopes that returning the occupied territory will ease relations with Mexico."
    ww1_usa.17.a:0 "Bring the troops home."
    ww1_usa.18.t:0 "The Huerta Government"
    ww1_usa.18.d:0 "Washington has condemned Huerta's seizure of power. The administration is seeking a return to constitutional government and reviewing the pressure it can bring to bear on his regime."
    ww1_usa.18.a:0 "Press for constitutional government."
    ww1_usa.19.t:0 "Supplies for Huerta's Opponents"
    ww1_usa.19.d:0 "Military supplies are being sent to the forces opposing Huerta. The administration hopes that this assistance will help bring his government to an end."
    ww1_usa.19.a:0 "Dispatch the supplies."
    ww1_usa.20.t:0 "Relations with Villa"
    ww1_usa.20.d:0 "Villa's forces have attacked settlements along the American border. His break with Carranza and opposition to our policy have turned a former partner into an immediate security concern."
    ww1_usa.20.a:0 "Protect the border towns."
    ww1_usa.21.t:0 "Neutrality in Europe"
    ww1_usa.21.d:0 "President Wilson has reaffirmed American neutrality in the European conflict. The administration intends to avoid involvement while safeguarding American trade and citizens."
    ww1_usa.21.a:0 "Keep the country out of war."
    ww1_usa.22.t:0 "Liberty Bonds"
    ww1_usa.22.d:0 "The Treasury has launched a bond campaign to finance the war. Banks, public organisations and volunteers are urging citizens to subscribe."
    ww1_usa.22.a:0 "Support the bond drive."
    ww1_usa.23.t:0 "American War Production"
    ww1_usa.23.d:0 "The administration has ordered a further expansion of military production. Factories and transport services are being coordinated to meet the requirements of the armed forces."
    ww1_usa.23.a:0 "Keep the supplies moving."
    ww1_usa.24.t:0 "The Selective Service Act"
    ww1_usa.24.d:0 "Congress has authorised conscription to raise the army required for overseas service. Local boards are preparing to register men and organise the new drafts."
    ww1_usa.24.a:0 "Organise the draft."
    ww1_usa.25.t:0 "Relations with Soviet Russia"
    ww1_usa.25.d:0 "Washington has condemned the Bolshevik overthrow of the Provisional Government. The new authorities' position towards the war and their revolutionary programme have deepened American concern."
    ww1_usa.25.a:0 "Review our policy towards Russia."
    ww1_usa.26.t:0 "Assistance for the Whites"
    ww1_usa.26.d:0 "The administration has authorised assistance to the forces opposing the Bolsheviks. American representatives will coordinate supplies and the protection of important routes and stores."
    ww1_usa.26.a:0 "Support the mission."
    ww1_usa.27.t: "The Red Scare"
    ww1_usa.27.d:0 "Strikes, bomb attacks and news of revolution abroad have heightened fears of radical unrest. The authorities are increasing surveillance and arrests as public pressure for action grows."
    ww1_usa.27.a:0 "Review the security measures."
    ww1_usa.28.t:0 "The Veracruz Crisis"
    ww1_usa.28.d:0 "The dispute with Huerta's government has brought relations with Mexico close to war. Reports of an incoming arms shipment have intensified calls to seize Veracruz, while other advisers urge the President to respect Mexican sovereignty."
    ww1_usa.28.a:0 "Order the occupation."
 ww1_usa.29.t:0 "The Presidential Election of 1912"
 ww1_usa.29.d:0 "The presidential election reveals deep divisions over the future of American government. Democrats champion tariff and banking reform, Republicans defend their record, and the Progressive movement calls for stronger federal action. The successful candidate now prepares an administration, but the transfer of presidential authority must wait until the inauguration in March."
    ww1_usa.29.a: "We welcome the new president"
    ww1_usa.30.t:0 "The Panama Canal Opens"
    ww1_usa.30.d:0 "Construction of the Panama Canal has been completed. The new waterway links the Atlantic and Pacific, shortening the passage for commercial shipping and the navy."
    ww1_usa.30.a:0 "Open the canal to shipping."
    ww1_usa.31.t:0 "The Federal Reserve Act"
    ww1_usa.31.d:0 "The Federal Reserve Act has established a new central banking system. The administration expects the reserve banks to improve the supply of credit and strengthen the financial system."
    ww1_usa.31.a:0 "Establish the reserve banks."
    ww1_usa.32.t:0 "The Crisis in Haiti"
    ww1_usa.32.d:0 "The killing of Haiti's president has brought the country into renewed turmoil. American officials fear for lives and commercial interests, but the government must decide whether to send Marines or pursue a negotiated settlement."
    ww1_usa.32.a:0 "Send the Marines."
    ww1_usa.33.t:0 "The Raid on Columbus"
    ww1_usa.33.d:0 "Villa's troops have attacked Columbus, New Mexico. American soldiers repelled the raiders, but the damage and loss of life have intensified demands for action along the border."
    ww1_usa.33.a:0 "Secure the frontier."
    ww1_usa.34.t:0 "The Black Tom Explosion"
    ww1_usa.34.d:0 "A powerful explosion has destroyed munitions at Black Tom in New Jersey. The blast has caused extensive damage and alarmed communities across the region, while investigators are examining evidence of sabotage."
    ww1_usa.34.a:0 "Find those responsible."
    ww1_usa.35.t:0 "The Dominican Crisis"
    ww1_usa.35.d:0 "The struggle for power in the Dominican Republic has brought renewed pressure for American intervention. Naval officers are preparing to act, while civilian advisers seek an agreement over customs and public finances."
    ww1_usa.35.a:0 "Order the intervention."
    ww1_usa.36.t:0 "Peace Without Victory"
    ww1_usa.36.d:0 "President Wilson has appealed to the European governments for a negotiated peace without conquest or humiliation. The proposal faces deep resistance from belligerents whose losses and ambitions have grown with the war."
    ww1_usa.36.a:0 "Press the case for peace."

    ww1_greece.1.t:0 "The Assassination of George I"
    ww1_greece.1.d:0 "King George I has been assassinated during a walk in Thessaloniki. The court prepares for Constantine's accession as the country mourns the monarch and the authorities investigate the attack."
    ww1_greece.1.a:0 "Prepare for Constantine's accession."
    ww1_greece.2.t: "Constantine I Abdicates"
    ww1_greece.2.d: "Under Allied pressure and amid the National Schism, Constantine I has left the throne. His son Alexander has succeeded him, opening the way for Greece to join the Entente."
    ww1_greece.2.a: "Alexander takes the throne"
    ww1_greece.3.t: "Greece and the Entente"
    ww1_greece.3.d:0 "With Constantine no longer on the throne, the government must decide whether Greece should enter the war alongside the Entente. Intervention would commit the country against Germany and Bulgaria, while neutrality would preserve a different course."
    ww1_greece.3.a:0 "Enter the war alongside the Entente."
    ww1_greece.3.b:0 "Maintain our neutrality."

