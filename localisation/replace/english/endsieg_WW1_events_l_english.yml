# WW1 Bulgaria #
    ww1_bulgaria.1.t: "The Second Balkan War"
    ww1_bulgaria.1.d: "During the First Balkan War we together with the Balkan League succeeded in driving out the Ottoman Empire from most of its European holdings, however, due to the creation of an independent Albania which was supposed to go to Serbia the spoils in Macedonia which were promised to us via the secret agreement between us and Serbia had been denied with Serbia instead taking hold of our claims. It is now our duty to fight for what is ours!"
    ww1_bulgaria.1.a: "We will show them the might of Bulgaria!"
    ww1_bulgaria.1.b: "We are happy with what we got"
    ww1_bulgaria.101.t: "Invade Bulgaria?"
    ww1_bulgaria.101.d: "With Bulgaria at war with its former allies over the disputed territory of Vardar Macedonia perhaps we should take advantage of the situation and join Serbia and Greece in their fight against Bulgarian imperialism for the territory of Southern Dobruja."
    ww1_bulgaria.101.a: "Invade them!"
    ww1_bulgaria.101.b: "We'd rather stay neutral"
    ww1_bulgaria.102.t: "Invade Bulgaria?"
    ww1_bulgaria.102.d: "With Bulgaria at war with her former allies over the disputed territory of Vardar Macedonia perhaps we should take advtange of the situation and join Serbia and Greece in their fight against Bulgarian imperialism for our lost territory of Adrianople."
    ww1_bulgaria.102.a: "Invade Them!"
    ww1_bulgaria.102.b: "We'd rather stay neutral"
    ww1_bulgaria.102.c: "With them on our side we're unstoppable!"
    ww1_bulgaria.2.t: "Treaty of Bucharest/Constantinople 1913"
    ww1_bulgaria.2.d: "With Bulgaria defeated the Kingdom of Serbia's territory has increased from 38,300 to 87,780 km2 with the eastern frontiero f Serbia drawn from the summit of Patarika, on the old frontier and following the watershed between Vardar and the Struma rivers to the Greek-Bulgarian boundary thus embracing Central Vardar Macedonia. Greece's boundary was rawn from the crest of Belasica to the mouth of the Mesta on the Aegian sea, the territory annexed cinluded large parts of Macedonia, including Thessaloniki and restricted the Aegian seaboard of Bulgaria to a inconsiderable extent of 110km. Romania gained Southern Dobruja and in a seperate peace treaty with the Ottoman Turks the area of Adrianople was ceded back to the Turks."
    ww1_bulgaria.2.a: "Damn!"
    ww1_bulgaria.3.t: "Armistice of Salonica"
    ww1_bulgaria.3.d: "With the war turning against us, the front in Vardar Macedonia being pushed back by the allies whom have had little trouble dealing with our war exhausted demoralied troops we have had no choice but to sign an Armistice with the entente at Salonica whch had ended our participation in the First World War, the armistice has called for an immediate demobilization of all Bulgarian military activities and ordered the evacuation of Bulgarian-occupied Greek and Serbian territories placing. We have been forced to give the Entente full military access across Bulgaria and our former allies are being given a four week time limit to withdraw their troops from our borders."
    ww1_bulgaria.3.a: "Damn!"
    ww1_bulgaria.4.t: "Armistice of Salonica"
    ww1_bulgaria.4.d: "With the war turning against us, the front in Vardar Macedonia being pushed back by the allies whom have had little trouble dealing with our war exhausted demoralied troops we have had no choice but to sign an Armistice with the entente at Salonica whch had ended our participation in the First World War, the armistice has called for an immediate demobilization of all Bulgarian military activities and ordered the evacuation of Bulgarian-occupied Greek and Serbian territories placing. We have been forced to give the Entente full military access across Bulgaria and our former allies are being given a four week time limit to withdraw their troops from our borders."
    ww1_bulgaria.4.a: "Damn!"
    ww1_bulgaria.5.t: ""
    ww1_bulgaria.5.d: ""
    ww1_bulgaria.5.a: ""
    ww1_bulgaria.6.t: "Victory in the Second Balkan war!"
    ww1_bulgaria.6.d: "We have shown the entire world that we are the strongest nation in the Balkan region. Should we force the territories we should have owned already to be transferred, or do we deter from it to safeguard us from future conflict?"
    ww1_bulgaria.6.a: "It is Bulgarian clay!"
    ww1_bulgaria.6.b: "Stability in the Balkan region!"
#

# China events #
    ww1_china.1.t: "Gengxu New Army Uprising"
    ww1_china.1.d: "Recently a new uprising has popped up in Guangzuo involving a conflict between citizens and local police against the New Army. After the revolutionary leader Ni Yingdian was killed by our forces however the remaining revolutionaries were swiftly defeated with the uprising failing to gain any traction luckily."
    ww1_china.1.a: "Good handling..."
    ww1_china.2.t: "Second Guangzuo Uprising"
    ww1_china.2.d: "Recently another uprising has occured in Guangzuo which ended in another defeat of the revolutionaries however unfortunately the 72 revolutionaries who could be identified were then hailed as martyrs to the revolutionary causing increased dissent within the country!"
    ww1_china.2.a: "Darn"
    ww1_china.3.t: "Wuchang Uprising"
    ww1_china.3.d: "On October 9th, revolutionaries with the intent on overthrowing our dynasty had built bombs one of which had gone off causing them to start the uprising earlier than expected although the uprising proved harder to handle and ultimately ended up resulting in success for the revolutionaries capturing the entire city of Wuchang. If we dont crush this now the revolution will spread like wildfire!"
    ww1_china.3.a: "Damn!"
    ww1_china.3.b: "(Play as Revolutionaries)"
    ww1_china.4.t: "Changsha Restoration"
    ww1_china.4.d: "Following the successful uprising in Wuchang, in Changsha, Jian Dafend and Chen Zuoxin have headed an armed group of revolutionares in a campaign to try and extend the uprising even further down into Changsha and ended up capturing the city and killing the local imperial general."
    ww1_china.4.a: "They must be crushed!"
    ww1_china.5.t: "Shaanxi Uprising"
    ww1_china.5.d: "In Shaanxi another uprising was launched in an effort to capture Xi'an which was successful after a tough two day struggle between both sides proving the revolutionaries victorious."
    ww1_china.5.a: "We are doomed!"
    ww1_china.6.t: "Jiujiang Uprising"
    ww1_china.6.d: "On Octoer 23, Lin Sen, Jiang Qun, Cai Hui, and other members of the Tongmenghui in the province of Jiangxi plotted a revolt of New Army units and achieved victory establishing the Jiujang Military Government."
    ww1_china.6.a: "Damn!"
    ww1_china.7.t: "Shanxi Taiyuan Uprising"
    ww1_china.7.d: "On October 2, Yan Xishan of the New Army led an uprising in Taiyuan the capital of the Shanxi Province and managed to kill the Qing Governor and take control of Taiyuan."
    ww1_china.7.a: "This is the end of the Qing Dynasty"
    ww1_china.8.t: "Kunming Uprising"
    ww1_china.8.d: "On October 30th, in the Yunna province, several revolutionaries managed to capture Kunming with the help of the New Army officers."
    ww1_china.8.a: "Damn!"
    ww1_china.9.t: "Tibetan Militia Attack!"
    ww1_china.9.d: "Recently in Tibet a Tibetan formed militia has attacked our garrison and has therefore effectively ousted out of Tibet establishing an independent Tibetan state."
    ww1_china.9.a: "Damn!"
    ww1_china.10.t: "Shanghai Uprising"
    ww1_china.10.d: "On November 3rd, several revolutionaries in Shanghai have managed to organize an armed rebellion recieving support of the local police officers. The rebels swiftly captured the whole city of Shanghai from our men."
    ww1_china.10.a: "We are doomed!"
    ww1_china.11.t: "Guizhuo-Zhejiang Uprising"
    ww1_china.11.d: "On November 4th, Revolutionaries in Zhejiang and Guizhuo led successful uprisings capturing Guiyang in Guizhuo and Hangzhuo in Zhejiang."
    ww1_china.11.a: "Damn!"
    ww1_china.12.t: "Jiangsu-Ahui Uprising"
    ww1_china.12.d: "On November 5th, in the provinces of Jiangsu and Anhui uprisings were launched by revolutionaries proving successful with the defeat of our forces in the areas."
    ww1_china.12.a: "This is the end of the Qing Dynasty"
    ww1_china.13.t: "Guangxi Uprising"
    ww1_china.13.d: "On November 7, the Guangxi politics derpartment decided to secede from the Qing government with Lu Rongting said to become the new governor of the province to replace the former Qing governor Shen Bingkun."
    ww1_china.13.a: "Damn!"
    ww1_china.14.t: "Fujian Uprising"
    ww1_china.14.d: "On November 11, the entire Fujian province declared independence and the New Army launched an uprising against the Qing army which was shortly after swiftly defeated by the revolutionary forces."
    ww1_china.14.a: "Everyone is turning on us!"
    ww1_china.15.t: "Guangdong Uprising"
    ww1_china.15.d: "Several local militians in Guangdong have launched uprisings across the Guangdong province in an effort to oust our forcesand the local represetatives of Guangdong have decided to support the revolution."
    ww1_china.15.a: "Damn!"
    ww1_china.16.t: "Shandong Uprising"
    ww1_china.16.d: "On November 13, several officers of the New Army and Qing governor of Shandong, Sun Baoqi, have agreed to secede from or government announced Shandong's independence supporting the revolution."
    ww1_china.16.a: "We are doomed!"
    ww1_china.17.t: "Ningxia Uprising"
    ww1_china.17.d: "On November 23, an uprising was launched in the province of Ningxia with the Ningxia Revolutionary Military Government being established shortly after supporting the revolution."
    ww1_china.17.a: "Everyone is turning on us!"
    ww1_china.18.t: "Sichuan Independence"
    ww1_china.18.d: "On November 22 Chengdu and Sichuan declared independence and have agreed to support the revolution with Qing officals being murdered."
    ww1_china.18.a: "Damn!"
    ww1_china.19.t: "Emperor Puyi Abdicates!"
    ww1_china.19.d: "Following the start of the Wuhna Uprising our forces have been unable to contain the revolution which has spread like wildfire across the empire. Yuan Shikai, the strongman dispatched by our court to crush the revolution has himself failed and many ahave no wish to fight for a dynasty which is seen as having lost the Mandate of Heaven. \n\n Following a deal brokered by Yuan Shikai, Empress Dowager Longyu endorsed the 'Imperial Edict of the Abdication of the Qing Emperor' with the Qing Empire ceasing to therefore exist. Puyi is to to retain his imperial titles and remain in the northern half of the Frobidden City earning ah efty annual subsidy granted by the Republic."
    ww1_china.19.a: "The Qing Empire Falls..."
    ww1_china.20.t: "The Second Revolution"
    ww1_china.20.d: "With tension heating up between the KMT and Yuan over Yuan Shikai's dictatorial actions Sun Yat-sen has fled to Japan and called for a Secon Revolution but this time against our leader Yuan Shikai. In reaction to this call for a Second Revolution Yuan Shikai has taken action by dissolving the national and provincial assempings, and the House of Representatives and Senate which were replaced by the newly formed Council of State. \N\N Yuan Shikai has labeled the KMT a siditious organization and ordered the dissolution evicting all members from parliament."
    ww1_china.20.a: "We will crush them!"
    ww1_china.21.t: "Yuan Shikai the new President!"
    ww1_china.21.d: "Following Yuan's significant contribution to the revolution by convincing the Empress Dowager to sign the edict for the abdication of the emperor Yuan Shikai has rightfully asked for his position of president for his deed. Following some internal bickering Sun Yat-sen has agreed to Yuan's presidency."
    ww1_china.21.a: "Alright"
    ww1_china.22.t: "Yuan Shikai Declares Himself Emperor!"
    ww1_china.22.d: "Today on 20 November 1915, the president Yuan Shikai has held a specialyl convened 'Representative Assembly' which has unanimously voted offering Yuan the throne. Yuan has since accepted the invitation proclaiming himself Emperor of the Chinese Empire under the era name of Hongxian. \n\n The new Empire of China is set to formally begin on the 1 January 1916, when Emperor Yuan Shikai intends to conduct the accession rites and has placed an order for a 40,000 piece procelain set costing 1.4 million yuan, a large jade seal, and two imperial robes costing 400,000 yuan each. \n\n Although it must be said domestically and internationally there have been many open protests throughout China denouncing the Emperor, even Japan whom promised to support the accession of Yuan has grown indifferent or openly hostile not giving Yuan his anticipated recognition, and now rumours are going around that Sun Yat-sen who has fed to Tokyo is organizing another plot to overthrow Yuan."
    ww1_china.22.a: "Glory to the Emperor!"
    ww1_china.23.t: "National Protection War Begins!"
    ww1_china.23.d: "Following Yuan Shikai's revival of the monarchy and accession to the throne there has been significant unrest within China, something the government of Yuan Shikai has badly miscalculated with no international support or recognition either. In Yunnan provincial military leaders such as Tang Jiyao, Cae E., and Li Liejun, have declared their independence and have launched expeditions against Yuan."
    ww1_china.23.a: "Damn!"
    ww1_china.24.t: "Yuan Shikai Abdicates"
    ww1_china.24.d: "Faced with amounting pressure Yuan Shikai is now forced to choose one of two options either to completely abandon the monarchy in order to hopefully please the people and his enemies reinstating the Republic with himself as president still or to cling onto the throne and attempt to decisvely crush this large rebellion."
    ww1_china.24.a: "Abdicate the Throne"
    ww1_china.24.b: "Cling onto the Throne"
    ww1_china.25.t: "Yuan Shikai Dies"
    ww1_china.25.d: "With Yuan Shikai's death the National Protection has been proclaimed a sucess with the provinces whom have rebelled rescinding their declarations of independence. \n\n Yuan Shikai has died of Uremia at 10 a.m. at the age of fifty-six, his funeral procession is to take place in Beijingsoon where his remains will be placed in a large mausoleum."
    ww1_china.25.a: "Peace at last"
    ww1_china.26.t: "Revival of the Monarchy?"
    ww1_china.26.d: "Many of Yuan Shikais supporters have advocated for a revival of the monarchy saying that the Republic had only been effective as a transitional phase to end Manchu rule. Points were made such as that China's political situation demanded stability that only a monarchy could ensure and the Chinese masses have long been used to autocratic rule."
    ww1_china.26.a: "What will come of this?"
    ww1_china.27.t: "Intermission Between Governments Part I"
    ww1_china.27.d: "Hang in there you will get one more event after this which will load in the Republic of China OOB."
    ww1_china.27.a: "Okay"
    ww1_china.28.t: "Intermission Between Governments Part II"
    ww1_china.28.d: "Yay it is finally over!"
    ww1_china.28.a: "Happy Time!"
#

# WW1 Ethiopia #
    ww1_ethiopia.1.t: "Menelik II Dies"
    ww1_ethiopia.1.d: "The Emperor has already previously been a shadow of  his former self after suffering a masive stroke in 1909 after which it is said his mind and spirit died and in the early morning hours of today he died of natural causes. Following his death the council of regency which took over folowing his stroke has continued to rule the nation with Lij Iyasu taking up power as regent."
    ww1_ethiopia.1.a: "A tragic loss"
    ww1_ethiopia.2.t: "Ascension of Zewditu"
    ww1_ethiopia.2.d: "With Iyasu V never crowned due to being widely disliked by the nobility for his unstable behavior and the church holding him in suspicion for alleged Muslim sympathies he was forcefully removed from power today. Zewditu has been in turn summoned to the capital and the Church has deposed Iyasu in favourof Zewditu with her title now "Queen of Kings"."
    ww1_ethiopia.2.a: "Interesting..."
#

# WW1 France
    ww1_france.1.t: "Supporting Italian Claims"
    ww1_france.1.d: "In an effort to sway the Kingdom of Italy to our side we have presented to them a proposal supporting all of their claims within the Austro-Hungarian empire and giving it to them in the final treaty should they join the Entente."
    ww1_france.1.a: "Lets hope they agree"
    ww1_france.101.t: "France Proposes Secret Treaty"
    ww1_france.101.d: "The French Republic hs proposed a secret treaty that shoud we accept the French Republic will support all of our claims located within the Austro-Hungarian empire and give them to us in the final peace treaty with Austria after the war ends should we join the Entente."
    ww1_france.101.a: "Sounds Good"
    ww1_france.101.b: "We'll politely decline"
    ww1_france.102.t: "Italy Agrees to Secret Treaty"
    ww1_france.102.d: "The Kingdom of Italy has gladly to our proposal on supporting all of their claims within Austria and transfering it to them on wars end, they shall join the Entente soon."
    ww1_france.102.a: "Great"
    ww1_france.103.t: "Italy Declines Proposal"
    ww1_france.103.d: "The Kingdom of Italy has unfortunately declined our proposal in supporting all of their clais within Austria and transfering it to them on wars end, they have decided to rather remain neutral or perhaps they are plotting to join the Central Powers against us after all..."
    ww1_france.103.a: "Worrying"
    ww1_france.2.t: "Ceding Savoy and Corsica to Italy"
    ww1_france.2.d: "In a desperate attempt to get the Kingdom of Italy onto our side we have decided to cede their claims on our territory being Savoy and Corsica. Following this they will have no choice but to join us in our war against the Central Powers."
    ww1_france.2.a: "It has come to this..."
    ww1_france.3.t: "Italy Joins the Entente"
    ww1_france.3.d: "The Kingdom of Italy has finally gotten ready to join us in the war against the Central Powers."
    ww1_france.3.a: "Great"
    ww1_france.4.t: "Send Troops to Serbia"
    ww1_france.4.d: "In an effort to aid our Serbian allies against the full onslaught of the Austro-Hungarian army we have decided to send over several of our own divisions to aid in the defense of the country and anticipation of a counter-offensive eventually."
    ww1_france.4.a: "Lets hope it will make a difference"
    ww1_france.5.t: "Blockade of Greece"
    ww1_france.5.d: "In an effort to force Greece to join the war agaisnt the Central Powers on our side we have begun a blockade against Greece to try and force King Constantine I to step down or submit."
    ww1_france.5.a: "Greece is key to the Balkan Front"
    ww1_france.6.t: "Greece Joins Entente"
    ww1_france.6.d: "Following our successful blockade of Greece which led to the abdication of Constantine I and his pro-Entente son, Alexander I coming into power, Greece has officially joined the Entente against our fight versus the Central Powers."
    ww1_france.6.a: "Great!"
    ww1_france.7.t: "Military Aid to Greece"
    ww1_france.7.d: "In order to help out and increase effectiveness of our Greece on the Balkan Front we have taken actions to send a good chunk of military equipment over which should hopefully make a difference."
    ww1_france.7.a: "Ok"
    ww1_france.8.t: "Armée d'Orient"
    ww1_france.8.d: "In order to increase Greece's combat effectiveness on the Balkan Front we have gone in and sent several well-trained and well-equipped French divisions whom should sufficiently reinforce the Greek Army."
    ww1_france.8.a: "Good"
    ww1_france.9.t: "Battleship Liberté Explodes"
    ww1_france.9.d: "Our ship the Liberté, a pre-dreadnought battleship, has suffered an accidental explosion today on 25 September 1911 in one of her forward ammunition magazines for the secondary guns which destroyed the ship. This explosion of the secondary magazines spread and caused the main magazines to later blow up which caused a 37-metric-ton chunk of armor plate to hurdle towards the battleship Republique causing significant damage."
    ww1_france.9.a: "Tragic"
    ww1_france.10.t: "Russian Reinforcement"
    ww1_france.10.d: "Following our request that Russian troops be sent to fight alongside our army on the Western Front, the Russian Emperor Nicholas II agreed to send several units to France which will serve alongside ours. In return we are to grant a feasable sum of French munitions to the Russians."
    ww1_france.10.a: "Thanks"
    ww1_france.11.t: "Convincing Romania"
    ww1_france.11.d: "The Kingdom of Romania which has for now remained neutral in this war could be swayed by both sides at this point, it shouldn't take much to sway them to our side with us offering all of their territorial claims, being Bucovina and Tansylvania. However Romania's entrance is also key on the state of Russia, if Russia is in a bad state than they are not going to join our side."
    ww1_france.11.a: "Lets hope they will accept"
    ww1_france.1101.t: "France Offers Territorial Claims"
    ww1_france.1101.d: "The French Republic has sent us a secrret proposal that should we join the Entente on their side against the Central Powers they will on wars end force the Austrian government to cede all of our claims in Trarnsylvania and Bucovina."
    ww1_france.1101.a: "Join Entente"
    ww1_france.1101.b: "Remain Neutral"
    ww1_france.1102.t: "Romania Agrees to Proposal"
    ww1_france.1102.d: "The Kingdom of Romania has graciously agreed to our proposal offering Transylvania and Bucovina in return for their support in our war against the Central Powers, they shall join the war effort once they are ready"
    ww1_france.1102.a: "Great"
    ww1_france.1103.t: "Romania Declines Proposal, Claims Neutrality"
    ww1_france.1103.d: "The Kingdom if Romania has unfortunately declined our generous proposal offering Transylvania and Bucovina in return for their support in our war against the Central Powers, they cite Romanian neutrality as the main reason refusing to join the war, for now at least."
    ww1_france.1103.a: "What a shame..."
    ww1_france.12.t: "Romania Joins the Entente"
    ww1_france.12.d: "The Kingdom of Romania has agreed to our proposal offering them Bucovina, and all of Transylvania should they join the Entente and declare war on the Central Powers."
    ww1_france.12.a: "Great"
    ww1_france.13.t: "United Kingdom Joins Entente"
    ww1_france.13.d: "The United Kingdom has now been officially cemented within our faction joining our war effort against the Central Powers."
    ww1_france.13.a: "Great"
    ww1_france.14.t: "British Expeditionary Force"
    ww1_france.14.d: "Our nation which is in dire need of more men on the front has recieved plenty more from the United Kingdom whom is ready to take control of the Northern Half of the Western Front. This should thankfully put an end to German numerical superiority meaning we can start conducting our own counter-offensives."
    ww1_france.14.a: "Great!"
    ww1_france.15.t: "Anti-German Propaganda"
    ww1_france.15.d: "The Germans have long since been our enemies, most recently cruelly taking the territory of Alsace-Lorraine and utterly humiliating us in the Franco-Prussian war. The German beast will get his due!"
    ww1_france.15.a: "We do not forget or forgive.."
    ww1_france.16.t: "Our Friend the Russian Empire"
    ww1_france.16.d: "The Russian Empire and our country both share one man enemy between, the German Empire, which has rather isolated itself in between us. As long as Russia is on our side the Germans will forever be between two larger powers which should insure the safety of France."
    ww1_france.16.a: "Good"
    ww1_france.17.t: "Agadir Crisis"
    ww1_france.17.d: "We have sent substantial forces in the interior of Morocco, however Germany whilst not objecting to France's expansion has called for territorial compensation for Germany threatening warfare and sending a gunboat over. This has stirred up many angry German nationalists and negotiations have quickly goen underway between Berlin and Paris which have resolved the Crisis, we have taken over Morocco and in return have given Spain the Rif territory whilst giving Germany their requested concessions in Cameroon."
    ww1_france.17.a: "Oh well..."
    ww1_france.18.t: "Preparation for War"
    ww1_france.18.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_france.18.a: "Alright"
    ww1_france.19.t: "Defending the Border"
    ww1_france.19.d: "In an effort to defend our border further more against any German threat we have decided to increase fortifications along ours and Germany's border which should prove substantial enough to hold off any sort of German invasion should one happen to occur."
    ww1_france.19.a: "Sounds good"
    ww1_france.20.t: "Union sacrée"
    ww1_france.20.d: "The union sacrée has been formed today following the outbreak of the First World War being a political truce with the lef-wingagreeing not to oppose the government or call any strikes. Made in the name of patriotism, it will stand in opposition to the pledge made by the rench Section of the Workers' International and its former leader Jean Jaures, not to enter any 'bourgeois war'."
    ww1_france.20.a: "We will remain united"
    ww1_france.21.t: "Defending the Colonies"
    ww1_france.21.d: "In an effort to provide more defense to our colonies we have started construction of minor defenses throughout our colonies in Africa."
    ww1_france.21.a: "Alright"
    ww1_france.22.t: "Men From the Colonies"
    ww1_france.22.d: "In desperate need of more and more men on the Western Front we have decided to transfer more men from the colonies to mainland France where they will serve and hopefully somewhat solve our manpower issues."
    ww1_france.22.a: "Great"
    ww1_france.23.t: "Men From the Colonies"
    ww1_france.23.d: "In desperate need of more and more men on the Western Front we have decided to transfer more men from the colonies to mainland France where they will serve and hopefully somewhat solve our manpower issues."
    ww1_france.23.a: "Great"
    ww1_france.24.t: "Men From the Colonies"
    ww1_france.24.d: "In desperate need of more and more men on the Western Front we have decided to transfer more men from the colonies to mainland France where they will serve and hopefully somewhat solve our manpower issues."
    ww1_france.24.a: "Great"
    ww1_france.25.t: "Jean Jaures Assassinated"
    ww1_france.25.d: "Jean Jaures, a French Socialist leader was assassinated today on 31 July 1914, by a fanatic. After going to dine at the Cafe du Croissant, a Raoul Villain, a 29-year-old French young nationalist, walked into the restaurant window firing two shots into Jaure's back. This has caused shock waves through the streets of Paris with one of the most charistmatic and compelling orators being assasinated."
    ww1_france.25.a: "An unfortunate demise"
    ww1_france.26.t: "Unity Above All Else"
    ww1_france.26.d: "In an effort to focus and shift all attention toward the war effort against Germany we have called for unity across the nation above all else to aid in the war as an act of honor and patriotism."
    ww1_france.26.a: "Ok"
    ww1_france.27.t: "Massive War Effort"
    ww1_france.27.d: "In an effort to maximize our war effort even more we have taken even more actions shifting the focus of all production toward military production."
    ww1_france.27.a: "Keep it up"
    ww1_france.28.t: "Construction of New Defenses"
    ww1_france.28.d: "In an effort to provide more defenses across France with the outbreak of war with Germany we have begun to initiate construction which should hopefully stall the German Advance."
    ww1_france.28.a: "Lets hope we can build it in time"
    ww1_france.29.t: "Construction Effort"
    ww1_france.29.d: "In order to try and increase military productivity we have advocated for more construction of military factories which are key to winning this war."
    ww1_france.29.a: "Good"
    ww1_france.30.t: "Home Front Focus Part I"
    ww1_france.30.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_france.30.a: "Ok"
    ww1_france.31.t: "Home Front Focus Part II"
    ww1_france.31.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_france.31.a: "Ok"
    ww1_france.32.t: "Home Front Focus Part II"
    ww1_france.32.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_france.32.a: "Ok"
    ww1_france.33.t: "Frontline Focus Part I"
    ww1_france.33.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_france.33.a: "Ok"
    ww1_france.34.t: "Frontline Focus Part II"
    ww1_france.34.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_france.34.a: "Ok"
    ww1_france.35.t: "Frontline Focus Part III"
    ww1_france.35.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_france.35.a: "Ok"
    ww1_france.36.t: "Paris Bombed by German Zeppelins"
    ww1_france.36.d: "Today on 29 January 1916, for the first time our capital, the city of Paris has fallen victim to a German air raid were a group of Zeppelins have bombed the city. It is unfortunate that we could not prevent this, however we have assured the people this will be the last time something like this happens."
    ww1_france.36.a: "Damn!"
    ww1_france.37.t: "Ernest Monis Becomes Prime Minister"
    ww1_france.37.d: "Ernest Monis from the Radical-Socialist Party has taken over as the new Prime Minister of France."
    ww1_france.37.a: "Ok"
    ww1_france.38.t: "Joseph Caillaux Becomes Prime Minister"
    ww1_france.38.d: "Joseph Caillaux from the Radical-Socialist Party has taken over as Prime Minister."
    ww1_france.38.a: "Ok"
    ww1_france.39.t: "Raymond Poincare Becomes Prime Minister"
    ww1_france.39.d: "Raymond Poincare from the Republican Democratic Party has become the new Prime Minister of France"
    ww1_france.39.a: "Ok"
    ww1_france.40.t: "Aristide Briand Becomes Prime Minister Again"
    ww1_france.40.d: "Aristide Brinad from the Republican-Socialist Party has once again taken over as Prime Minister."
    ww1_france.40.a: "Ok"
    ww1_france.41.t: "Louis Barthou Becomes Prime Minister"
    ww1_france.41.d: "Louis Barthou of the Republican Democratic Party has become the new Prime Minister of France"
    ww1_france.41.a: "Ok"
    ww1_france.42.t: "Gaston Doumergue Becomes Prime Minister"
    ww1_france.42.d: "Gaston Doumergue from the Radical-Socialist Party has become the new Prime Minister of France"
    ww1_france.42.a: "Ok"
    ww1_france.43.t: "Alexandre Ribot becomes new Prime Minister"
    ww1_france.43.d: "Alexandre Ribot of the Republican Democratic Party has become the new Prime Minister of France"
    ww1_france.43.a: "Ok"
    ww1_france.44.t: "Rene Viviani Becomes New Prime Minister"
    ww1_france.44.d: "Rene Viviani of the Republican Socialist Party has become the new Prime Minister of France"
    ww1_france.44.a: "Ok"
    ww1_france.45.t: "Aristide Briand Becomes Prime Minister Again"
    ww1_france.45.d: "Aristide Briand of the Republican-Socialist Party has once again taken over to become the new PM"
    ww1_france.45.a: "Ok"
    ww1_france.46.t: "Alexandre Ribot Becomes Prime Minister Again"
    ww1_france.46.d: "Alexandre Ribot of the Republican Democratic Party has again taken over as the new Prime Minister of France"
    ww1_france.46.a: "Ok"
    ww1_france.47.t: "Paul Painleve Becomes New Prime Minister"
    ww1_france.47.d: "Paul Painleve of the Republican-Socialist Party has taken over as the new Prime Minsiter of France"
    ww1_france.47.a: "Ok"
    ww1_france.48.t: "Georges Clemenceau Becomes New Prime Minister"
    ww1_france.48.d: "Georges Clemenceau of the Inepdendent party has taken voer as the new Prime Minister of France."
    ww1_france.48.a: "Ok"
    ww1_france.49.t: "General Mobilization Begins"
    ww1_france.49.d: "With war imminent the government has called for general mobilization with reserve divisions across the country ready for action. The men are rather confident that the war will by over, at least but christmas."
    ww1_france.49.a: "To the front lines!"
    ww1_france.50.t: "Hundred Days Offensive Begins"
    ww1_france.50.d: "Following the stall of the German 'Kaiserschlacht' or Ludendorff Offensive in mid July and the German armies subsequent internal deterioation due to supply issues the Allies launched a series of counter offensives against Germany from the 8th of August till Armistice Day. This was known as the 'Hundred Days Offensive' which pushed the Germans out of France and forced them to retreat beyond the Hindenburg Line which ultimately led to the signing of the armistice on 11/11/18. \n\n If you're a player (well ai too but) you will get an idea called 'Hundred Days Offensive' which shall give you an edge over the Germans for 120 days, use it well!"
    ww1_france.50.a: "Kick in that rotten door and it will all come crashing down"
    ww1_france.51.t: "United States Expeditionary Forces Arrive!"
    ww1_france.51.d: "The United States only arrived in full force in Europe by Summer 1918, which was the main reason behind the German Spring Offensive 1918. The U.S. was able to deploy roughly 100,000 men per month to France which allowed the Allies to gain substantial numerical superiority over the German Empire which had by this point used up its reserves and struggled to keep up with its losses."
    ww1_france.51.a: "We greatly need this support!"
#

# WW1 Germany #
    ww1_germany.1.t: "Ottoman-German Alliance"
    ww1_germany.1.d: "Today an alliance between our great empire and that of the Ottoman Turks has been officially ratified. The alliance is part of a joint-cooperate effort which will strengthen and help modernize the Turkish military whilst provoding German troops safe passage into neighboing British Colonies."
    ww1_germany.1.a: "Great!"
    ww1_germany.2.t: "Germans Supply Dervish State"
    ww1_germany.2.d: "In an effort to fight British imperialism through other means than direct war between our two countries we have decided to supply the Dervish State which is currently fighting for freedom in the area of Somalia for almost two decades now."
    ww1_germany.2.a: "Hopefully it will help"
    ww1_germany.3.t: "Our Friends the Emirate of Jabal Shammar"
    ww1_germany.3.d: "We have recently sent diplomats to the Emirate of Jabal Shammar a close ally of the Ottoman Turks and perhaps us in the near future. Our diplomats have found out that we share many of the same interests and enemies, particularly Britain and their allies, specifically the Nejd Emirate pretaining the Emirate of Jabal Shammar."
    ww1_germany.3.a: "Great results!"
    ww1_germany.4.t: "Our Friends the Dervish State"
    ww1_germany.4.d: "The Dervish State is less a state more than it is an active rebellion however non-the-less we share many of the same interests when it comes to our enemies, the British Empire. In the future we may be direct allies with the Dervish State should a war break out between us and the British."
    ww1_germany.4.a: "Hopefully we can become allies!"
    ww1_germany.5.t: "Dervish State Joins Central Powers"
    ww1_germany.5.d: "The Dervish State has now officially joined us and our allies in the fight against the Entente. We share the same enemy, we share the same interests, and now we fight together in the same war."
    ww1_germany.5.a: "Great!"
    ww1_germany.6.t: "Jabal Shammar Joins Central Powers"
    ww1_germany.6.d: "The Emirate of Jabal Shammar hs now officially joined us and our allies in the fight against the Entente, with the entry of the Emirate of Jabal Shammar there shall now be even more resistance against the British in the Middle Eastern campaign. Additionally we have promised should the German Empire and our allies win the Great War we will help the Rashid family in an offensive war against the Saud family (Emirate of Nejd)."
    ww1_germany.6.a: "Hurrah!"
    ww1_germany.7.t: "Berlin-Baghdad Railway Construction Continues"
    ww1_germany.7.d: "Our effort to connect Berlin with the Ottoman city of Baghdad continues every so slowly, once it is complete we shall gain access to the suspected oilfields of Mesopotamia as well as the port of Basra on the Persian Gulf increasing our power."
    ww1_germany.7.a: "Lets hope it gets finished soon!"
    ww1_germany.8.t: "Berlin-Baghdad Railway Construction Continues"
    ww1_germany.8.d: "Our effort to connect Berlin with the Ottoman city of Baghdad continues every so slowly, once it is complete we shall gain access to the suspected oilfields of Mesopotamia as well as the port of Basra on the Persian Gulf increasing our power."
    ww1_germany.8.a: "Lets hope it gets finished soon!"
    ww1_germany.9.t: "Berlin-Baghdad Railway Construction Continues"
    ww1_germany.9.d: "Our effort to connect Berlin with the Ottoman city of Baghdad continues every so slowly, once it is complete we shall gain access to the suspected oilfields of Mesopotamia as well as the port of Basra on the Persian Gulf increasing our power."
    ww1_germany.9.a: "Lets hope it gets finished soon!"
    ww1_germany.10.t: "Berlin-Baghdad Railway Complete!"
    ww1_germany.10.d: "Now that the Berlin-Baghdad Railway is officially completed we should have not only more influence in the Middle East to threaten the British, but also the suspected oilfields of Mesopotamia giving us an edge over the British who have held their Persian Oil over our heads, additionally comes the Port of Basra which will provide useful in connecting with our colonies in East Africa."
    ww1_germany.10.a: "Three Hurrahs for the Completion!"
    ww1_germany.11.t: "Silesia to Austria-Hungary"
    ww1_germany.11.d: "In an effort to keep the Kingdom of Italy neutral in this war the Reichstag has come up with a plan to offer the territory of Silesia to Austria in return only if they cede South Tyrol to Italy, should they agree to stay Neutral on the terms they get it."
    ww1_germany.11.a: "Sound good, lets see how it goes!"
    ww1_germany.1101.t: "Germany Offers Silesia"
    ww1_germany.1101.d: "Our ally the German Empire has offered to cede us the territory of rich industrial territory of Silesia if we shall in return cede South Tyrol to the Kingdom of Italy shall they agree to stay neutral in the war on the terms they get it."
    ww1_germany.1101.a: "Sounds Good"
    ww1_germany.1101.b: "We will NOT agree"
    ww1_germany.1102.t: "Austria offers South Tyrol"
    ww1_germany.1102.d: "The Austro-Hungarian Empire has offered us the territory of South Tyrol only on the terms that we stay neutral in the conflict."
    ww1_germany.1102.a: "Hmmm...alright"
    ww1_germany.1102.b: "We will not be satisfied!"
    ww1_germany.12.t: "Negotiate with Sweden"
    ww1_germany.12.d: "Negotiations have gone underway with the Kingdom of Sweden, our diplomats are trying to push the Swedes to join the war on our side, however it will most likely be unlikely though if it should happen it will overextend the Russian Front which should ease up our situation on the Eastern Front."
    ww1_germany.12.a: "Lets hope they agree"
    ww1_germany.13.t: "Zimmerman Telegram"
    ww1_germany.13.d: "A supposedly secret diplomatic communication issued from our Foreign Office in January of 1917 has proposed a military alliance between Germany and Mexico in the event that the United States joins the First World War against Germany. We have offered Mmexico Texas, Arrizona, New Mexico shall the U.S. join the war against us. However unfortuantely it was intercepted and decoded by the British Intelligence and has thoroughly angered the United States to where they will probably now join the war..."
    ww1_germany.13.a: "That backfired quite awfully..."
    ww1_germany.1301.t: "Zimmerman Telegram"
    ww1_germany.1301.d: "A supposedly secret diplomatic communication issued from the German Foreign Office has offered us a deal which in the case that the United States joins the First World War against Germany we should Germany in the fight against the United States where if we end up victorious, which of course we will...we regain Arizona , New Mexico, and Texas."
    ww1_germany.1301.a: "Accept the Deal"
    ww1_germany.1301.b: "Sounds tempting but we'll have to decline"
    ww1_germany.14.t: "Negotiations with Germany"
    ww1_germany.14.d: "Recently several German diplomats have arrived in Stockholm to discuss a deal, that is if we the Kingdom of Sweden join Germany in her war against the Entente, particularly Russia, we will regain the area of Finland should we wish to take it."
    ww1_germany.14.a: "We'll accept the deal"
    ww1_germany.14.b: "War is not in our interests"
    ww1_germany.15.t: "Offer Bessarabia to Rumania"
    ww1_germany.15.d: "We have recently sent over diplomats to Bucharest offering the Rumanians Bessarabia in event of German victory agaisnt the Russian Empire, in return if the Rumanians agree to this deal they will have to remain neutral throughout the whole conflict. Though it maybe unlikely as they have more to gain through joining the Entente and taking back Austro-Hungarian Transylvania, but who knows right?"
    ww1_germany.15.a: "Hopefully they will agree"
    ww1_germany.1501.t: "Germany Offers Bessarabua"
    ww1_germany.1501.d: "In the event of German Victory against the Russian Empire the Germans have offered us the territory of Bessarabia, if we Rumania agree to remain neutral throughout the whole conflict. However as we see it we have more to gain joining the Entente should the right time come."
    ww1_germany.1501.a: "Accept the Deal"
    ww1_germany.1501.b: "Respectfully Decline"
    ww1_germany.16.t: "Colonial Defences in East Africa"
    ww1_germany.16.d: "We have built several defensive structures across German East Africa in the event of a war our colonies should be properly defended."
    ww1_germany.16.a: "Good"
    ww1_germany.17.t: "Colonial Defences in Southwest Africa"
    ww1_germany.17.d: "We have built several defensive structures across German Southwest Africa in the event of a war our colonies should be properly defended."
    ww1_germany.17.a: "Good"
    ww1_germany.18.t: "Colonial Defences in German Cameroon"
    ww1_germany.18.d: "We have built several defensive structures across German Cameroon in the event of a war our colonies should be properly defended."
    ww1_germany.18.a: "Good"
    ww1_germany.19.t: "Agadir Crisis"
    ww1_germany.19.d: "In news the French have sent substantial forces in the interior of Morocco, whilst not objecting to France's expansion the Kaiser has called for territorial compensation for Germany threatening warfare and sending a gunboat over. This has stirred up many angry German nationalists and negotiations have quickly goen underway between Berlin and Paris which have resolved the Crisis, France took over Morocco and in return have Spain the Rif territory whilst giving us concessions in Cameroon."
    ww1_germany.19.a: "Those filthy baguettes..."
    ww1_germany.20.t: "Rupprecht Plan"
    ww1_germany.20.d: "Unlike the Schlieffen Plan, following the Rupprecht plan we will instead of invading through Belgium invade through Switzerland, that ought to surprise those French baguettes! However it will most likely be very difficult traversing through the Swiss mountanous terrain and even so we will be quite a ways from Paris."
    ww1_germany.20.a: "Invasion Commence!"
    ww1_germany.21.t: "Schlieffen Plan"
    ww1_germany.21.d: "Created by the German Chief of Staff, Alfred von Schlieffen, the Schlieffen Plan was in short a plan to invade through Belgium thereby passing by the heavily defended Franco-German border and passing into meagerly defended French territory taking Paris and forcing a quick peace with the French Republic."
    ww1_germany.21.a: "Declare War!"
    ww1_germany.22.t: "Kronprinz Plan"
    ww1_germany.22.d: "The Kronprinz Plan was simple, instead of invading Beglium or Switzerland and risking British entry into the war Germany would just fight France along the Franco-German border and leave a smaller force needed to defend whilst taking the majority of our forces and letting them deal with the larger threat, the Russian Empire towards the east."
    ww1_germany.22.a: "Declare War!"
    ww1_germany.23.t: "Der Goeben und der Breslau"
    ww1_germany.23.d: "My Kaiser! In the Medditeranean sea our ships the SMS Goeben and the SMS Breslau part of the Mittelmeerdivision have been followed by the British Mediterranean Fleet who unsuccessfully have tried to intercept them, luckily the Goeben and the Breslau have managed to evade the British Mediterranean Fleet and passed throguh the Dardanelles reaching Constantinople where we handed them over to the Ottoman Empire. \n\n If all goes to plan we can bring the Ottomans into the war sooner or later..."
    ww1_germany.23.a: "Good news!"
    ww1_germany.24.t: "Albania Joins the Central Powers"
    ww1_germany.24.d: "Prince William of Albania has been quite stubborn with the outbreak of war refusing to pick a side calling for Albanian neutrality, however with the Austrians unable to convince the Prince we have sent our own diplomats over who have threatened to cut off his renumeration which will likely put the Prince out of power. We have also promised in event of German victory, which of course is very likely, Albania shall get the Kosovo region from Serbia. \n\n Realizing the true state of things the Prince reconsidered his former call for neutrality and has ratified an alliance between our two countries which shall be announced to the world soon."
    ww1_germany.24.a: "That will distract the Serbs"
    ww1_germany.25.t: "Asien Corps sent to Turkey"
    ww1_germany.25.d: "In an effort to assist the Ottoman Turks in their Middle East Campaign we have decided to send a detachment of the German Army, along with a medical expedition to help Ottoman sanitary units combat epidemics and treat soldiers we have also sent over some pioneers to assist in construction of roads in areas where it is needed. Hopefully out Ottoman allies can make use of this."
    ww1_germany.25.a: "Great!"
    ww1_germany.2501.t: "Germany sends us Support"
    ww1_germany.2501.d: "The German Empire has sent us a detachment of the German Army to assist us in our campaign, the expedition sent over also includes Medical units to help combat epidemics and treat the wounded along with Pioneers to assist us in construction of where roads are needed, particularly Sinai."
    ww1_germany.2501.a: "Much thanks to our German ally!"
    ww1_germany.26.t: "Advisors sent to Turkey"
    ww1_germany.26.d: "We have sent several German military commanders over to Turkey in an effort to strengthen and make Ottoman military forces more effective under German command."
    ww1_germany.26.a: "Good"
    ww1_germany.2601.t: "Germany Sends Advisors"
    ww1_germany.2601.d: "The German Empire has sent over several German military commanders/advisors in an effort to help us make our military a more effective force all-together."
    ww1_germany.2601.a: "Thanks Germany"
    ww1_germany.27.t: "Maritz Rebellion"
    ww1_germany.27.d: "We have successfully negotiated with Manie Maritz who has decided to cooperate with us and break off from South Africa's initiative to seize control of our colony, German South Africa, and instead take up arms against the South Africans themselves."
    ww1_germany.27.a: "Good"
    ww1_germany.28.t: "Our Friends the Tsardom of Bulgaria"
    ww1_germany.28.d: "The Bulgarians have previously in the Second Balkan War have lost much of their core territory and are eager for vengeance, our diplomats in Bulgaria have managed to work out a reasonable deal promising Bulgaria their share of Macedonia that the Serbs own should they invade, currently preparations are under way before Bulgaria officially joins the war."
    ww1_germany.28.a: "Great, lets hope they join soon."
    ww1_germany.2801.t: "Our Friends the German Empire"
    ww1_germany.2801.d: "Several German diplomats have recently made successful talks with us regarding our territorial claims on Serbia if we join the war on the side of the Central Powers, however it will be several more months before we can be ready to enter the war."
    ww1_germany.2801.a: "Those Serbs shall pay!"
    ww1_germany.29.t: "Bulgaria Joins the Central Powers"
    ww1_germany.29.d: "The Tsardom of Bulgaria has today officially joined the Central Powers declaring war on Serbia, hopefully with Bulgarian assistance the Serbian opposition will be crushed for good. In addition their entry will provide a geographical conduit for material assistance from Germany to Constantinople increasing the Turkish war effort."
    ww1_germany.29.a: "Bulgarien mit uns!"
    ww1_germany.2901.t: "Entry into the War"
    ww1_germany.2901.d: "Today we have officially joined the First World War on the side of the Central Powers by declaring war on Serbia, the Serb's surely were not expecting our sudden entry and their western border should be empty, something we should quickly take advantage of."
    ww1_germany.2901.a: "Payback is coming"
    ww1_germany.30.t: "Septemberprogramm"
    ww1_germany.30.d: "The Septemberprogramm has recently been drafted which contains our plan for territorial expansion should victory come soon. Largely the plan has been ordered to learn about the opinion of our economic, and military elites."
    ww1_germany.30.a: "Lets hope this plan can be somewhat realized"
    ww1_germany.31.t: "Formation of the Kingdom of Poland"
    ww1_germany.31.d: "Hoping to replace military losses, generals Hindenburg and Ludendorff who are the currennt supreme commanders of the German Military have insisted on establishing a polish state dependant on Germany and thus accelerated the process of creating a Polish State. \n\nA Provisional Council of State has been thereby established as the provisional government and hopefully soon we can start recruiting Poles into the army who shall celebrate us as liberators from their former Russian rulers."
    ww1_germany.31.a: "Good...good..."
    ww1_germany.31.b: "The Kaiser demands territory!"
    ww1_germany.32.t: "Polnische Wehrmacht"
    ww1_germany.32.d: "The assemblance of the Polish Legion into a German military force is going underway where the units are going to pledge an oath of loyalty to the Kaiser."
    ww1_germany.32.a: "We need these units"
    ww1_germany.3201.t: "German Empire Requests Oath"
    ww1_germany.3201.d: "The German Empire has demanded that our Polish Legions commanded by Jozef Pilsudski swear an oath oof allegiance and obedience to Kaiser Wilhelm II, however it appears that should Germany win the war Poland will become nothing more than a puppet buffer state of Germany."
    ww1_germany.3201.a: "Agree to make the Oath"
    ww1_germany.3201.b: "Decline to make the Oath"
    ww1_germany.3202.t: "Oath Crisis"
    ww1_germany.3202.d: "To much dismay the Polish Legions when asked to swear an oath of allegiance and obedience to our Emperor, Wilhelm II, have in majority declined which has supposedly been persuaded by Jozef Pilsudski, the commander of the Polish Leegions who as a result is now to be arrested. \n\n But non-the-less our efforts in Poland to form a Polnische Wehrmacht has been very dismal and largely a huge disaster...Austria-Hungary went ahead however and forcibly conscripted a force of 3,000 men from the Polish Legion."
    ww1_germany.3202.a: "How dare they?!"
    ww1_germany.3203.t: "Oath Pledged"
    ww1_germany.3203.d: "The Polish Legion went ahead and pledged an oath to the Kaiser, now their forces are officially under our full command our efforts to create Polnische Wehrmacht should draw several tens of thousands of men to be recruited in the Polish region."
    ww1_germany.3203.a: "Great!"
    ww1_germany.33.t: "Lenin on the Train to Russia"
    ww1_germany.33.d: "A prominant Communist Revolutionary, by the name of Vladimir Lenin, has negotiated a passage to Russia from Germany after helping us recognize how Lenin and his fellow dissidents could cause many internal problems for our Russian enemies. He was put aboard a sealed train carriage and should arrive in Petrograd in the coming days..."
    ww1_germany.33.a: "Hopefully he can do some real damage..."
    #ww1_germany.34.t:0 ""
    #ww1_germany.34.d:0 ""
    #ww1_germany.34.a:0 ""
    ww1_germany.35.t: "Power to the Kaiser"
    ww1_germany.35.d: "Instead of putting our faith so much into the military itself we have decided to put our faith rather in the Kaiser himself meaning that in the future should it come to it we will not allow any military commander to subsequently take over control."
    ww1_germany.35.a: "Good"
    ww1_germany.36.t: "Power to the Military"
    ww1_germany.36.d: "We have decided to put out faith into the military, the Kaiser himself puts his faith here saying "The soldiers and the army, not Parliamentary majorities and decisions, have welded the German Empire together. I put my trust in the army.""
    ww1_germany.36.a: "Good point"
    ww1_germany.37.t: "Rebuilding of the Navy"
    ww1_germany.37.d: ""
    ww1_germany.37.a: ""
    ww1_germany.38.t: "Sinking of the Lusitania"
    ww1_germany.38.d: "The RMS Lusitania had recently been torpedoed by one of our German U-boats the U-20, around 124 Americans were beleived to be onboard that had died, intotal 1,198 died with 761 survivors remaining. This will definately push the U.S. against us and perhaps push them to enter the war itself."
    ww1_germany.38.a: "Well it did contain munitions!"
    ww1_germany.39.t: "Unrestricted Submarine Warfare"
    ww1_germany.39.d: "Unlike abiding by Prize rules which require submarines to surface and search merchantmen placing the crews in a "place of safety" before sinking them, we have decided to disregard the law. This should starve the British of the supplies coming in and or out of their Island, however this may anger some nations, particularly the U.S..."
    ww1_germany.39.a: "We will starve them into submission"
    ww1_germany.40.t: "Home Front Focus I"
    ww1_germany.40.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_germany.40.a: "Sounds good"
    ww1_germany.41.t: "Home Front Focus II"
    ww1_germany.41.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_germany.41.a: "Sounds good"
    ww1_germany.42.t: "Home front Focus III"
    ww1_germany.42.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_germany.42.a: "Sounds good"
    ww1_germany.43.t: "Frontline Focus I"
    ww1_germany.43.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_germany.43.a: "Sounds good"
    ww1_germany.44.t: "Frontline Focus II"
    ww1_germany.44.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_germany.44.a: "Sounds good"
    ww1_germany.45.t: "Frontline Focus III"
    ww1_germany.45.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_germany.45.a: "Sounds good"
    ww1_germany.46.t: "Sufficient Grain Shipments from Ukraine"
    ww1_germany.46.d: "With the takeover of Pavlo Skoropadsky in Ukraine who is very much Pro-German we should be getting more sufficient shipments of grain from the Ukraine. Hopefully it will somewhat counter the Northsea Blockade that the British have been conducting for several years now."
    ww1_germany.46.a: "Grain for everyone!"
    ww1_germany.47.t: "Preparation for War"
    ww1_germany.47.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_germany.47.a: "Ok"
    ww1_germany.48.t: "Home by Christmas"
    ww1_germany.48.d: "With the war just now kicking off many believe it will be over quite quickly in a matter of days or weeks at most but definately by Christmas! The Kaiser himself has publicly stated to the soldiers that "They shall be home before the leaves have fallen from the trees.""
    ww1_germany.48.a: "Hopefully it shall be so"
    ww1_germany.49.t: "Shorter Training Periods"
    ww1_germany.49.d: "Due to extreme losses in the field of battle we need to replace those losses which leads us to shorten the training period and get those boys on the field as soon as possible. Although it will somewhat hamper their abilities to be true specialists it is better to have the holes in the ranks filled in as quickly as possible."
    ww1_germany.49.a: "Hopefully it helps"
    ww1_germany.50.t: "Our Friends Afgahnistan"
    ww1_germany.50.d: "With the Ottoman Turks declaring a jihad not being enough to drive the Afgahni's to join us in our war effort against the Entente we have decided to send over an expedition to Afgahnistan to discuss and share our interests which had turned out to be quite similar."
    ww1_germany.50.a: "Hopefully we can drag them into the war..."
    ww1_germany.51.t: "Negotiations with Afgahni Sultan"
    ww1_germany.51.d: "Our expedition which had previously been sent to Afgahnistan to increase relations between our two nations have discussed Afgahnistan's entry into the First World War on our side. It is critical for Afgahnistan to invade India in order for Britain to lose it, which would definately turn the war in our favor. The real issue is that the Afgahn sultan's main source of income is British subsidies which means he may be reluctant to accept our deal and join the war on our side."
    ww1_germany.51.a: "Lets hope he agrees"
    ww1_germany.5101.t: "Germany Offers Us a Deal"
    ww1_germany.5101.d: "The German diplomatic mission to Kabul has increased relations between our two nations recently however they have recently proposed us a deal offering us territory from India and perhaps also from Russia should we be victorious. However the issue is that the Sultan's main source of income comes from British subsidies given to him, and if we choose to put ourselves on the side of the Central Powers we would lose this thus getting rid of our main source of income, not to mention if we are to lose the results for our country would likely be disastrous..."
    ww1_germany.5101.a: "Decline their Offer"
    ww1_germany.5101.b: "Accept their Offer"
    ww1_germany.5102.t: "Afgahnistan Declines"
    ww1_germany.5102.d: "The Sultan of Afgahnistan has declined our offer of promising land from British Raj, and perhaps Russia, should we be victorious. More likely it is because the Afgahn sultan's main source of income is from the British making war something not in their interests."
    ww1_germany.5102.a: "Thats a shame"
    ww1_germany.5103.t: "Afgahnistan Accepts"
    ww1_germany.5103.d: "The Sultan of Afgahnistan has graciously accepted our offer and Afgahnistan is now an official member of the Central Powers, hopefully they will be able to do some real damage against British Raj and drive the Indians to rebellion."
    ww1_germany.5103.a: "Great news!"
    ww1_germany.52.t: "The Hindu-German Conspiracy"
    ww1_germany.52.d: "In an attempt to instigate a rebellion within British India we have brokered a deal with the President of the first Provisional Government of India led by Indian freedom fighter, Mahendra Pratap as President. If the plan works out there should be a successful revolt from the Indian revolutionary underground and exiled or self-exiled nationalists along with a Pan-Indian mutiny in the British Indian Army going from Punjab to Singapore. \n\n It will however, not be an easy task by any means and will easily be thwarted should the British intelligence catch on in any way."
    ww1_germany.52.a: "Lets hope it works out..."
    ww1_germany.5202.t: "Pan-Indian Revolt Successful!"
    ww1_germany.5202.d: "Against all odds our plot to incite a Pan-Indian revolt in British Raj has been largely successful and is within the few days due to spread all across India like a sweeping wildfire. The Provisional Government of India has been set up in northern India near Afgahnistan for now with Mahendra Pratap taking lead of the revolution and aligning the revolutionary state with the Central Powers. \n\n If all goes well and the revolution succeeds it is beyond a doubt that the end of the British Empire is near..."
    ww1_germany.5202.a: "Hurrah!"
    ww1_germany.52021.t: "Insurrection in Guharat"
    ww1_germany.52021.d: "Local revolutionaries in the state of Guharat have taken up arms and formed a local militia joining Mahendra Pratap in his revolution for Indian Independence against British hegemony over India."
    ww1_germany.52021.a: "Damn!"
    ww1_germany.52022.t: "Insurrection in Mumbai, Madhya Pradesh, and Jharkhand"
    ww1_germany.52022.d: "Local revolutionaries in the states of Mumba, Madya Pradesh, and Jharkhand have risen up taking up arms against us joining Mahendra Pratap's revolutionary forces to fight against British hegemony over India."
    ww1_germany.52022.a: "Is this the end of the British Raj?"
    ww1_germany.52023.t: "Insurrection in Mysore, Madras, Orissa, and Bihar"
    ww1_germany.52023.d: "Recently local revolutionaries in Mysore, Madras, Orissa, and Bihar have taken up arms against the British Raj joining Mahendra Prataps revolution against British hegemony over India."
    ww1_germany.52023.a: "Blood shall be spilled..."
    ww1_germany.5203.t: "Plot in India Foiled"
    ww1_germany.5203.d: "Unfortunately our plot to incite a Pan-Indian revolt in British Raj has been uncovered by British Intelligence and thus foiled, although a few garrisons across india have continued with the plan taking up arms anyway they have quickly been crushed by the British. \n\n Although, who knows, perhaps if we continue this war long enough there shouldn't be a need to incite a rebellion it may just happen by itself..."
    ww1_germany.5203.a: "What did we expect?"
    ww1_germany.52031.t: "Indian Revolution Thwarted"
    ww1_germany.52031.d: "Thanks to the success of British intelligence we have been able to thwart a planned Pan-Indian Mutiny in British Raj which would have likely saw us lose our grip over the colony had it gone to plan. Although some Indian garrisons have still risen up as mutineers these have been very limited cases which have been easily crushed with little to none resistance."
    ww1_germany.52031.a: "Those dastardly Germans..."
    ww1_germany.53.t: "The Huerta Plot"
    #ww1_germany.53.d:0 ""
    #ww1_germany.53.a:0 ""
    ww1_germany.5301.t: "Huerta Plot Foiled"
    ww1_germany.5301.d: "Following a negotiation with Captain Franz von Rintelen of the German Navy Intelligence and Victoriano Huerta over a purchase of weapons and a U-boat landing arangement to provide support for Huerta's return for which he promised as a bargaining ship to make war on the U.S. should he be successful, United States forces have who were observing the meetings between the two managed to intercept Huerta after his attempt to cross back into Mexico where he has supposedly been awaite dby Pascual Orozco and some well-armed Mexican supporters."
    ww1_germany.5301.a: "Damn!"
    ww1_germany.5302.t: "Huerta Plot Succcess"
    ww1_germany.5302.d: "Following a negotiation with Captain Franz von Rintelen of the German Navy Intelligence and Victoriano Huerta over a purchase of weapons and a U-boat landing arangement to provide support for Huerta's return for which he promised as a bargaining ship to make war on the U.S. should he be successful, Huerta has against all odds managed to evade United States forces waiting for him in Newman, New Mexico and has crossed the border into Mexico where he has been met with support of General Pascual Orozco and taken power again."
    ww1_germany.5302.a: "Now about that bargaining chip...."
    ww1_germany.5303.t: "Huerta Arrested; Plot to return FOILED"
    ww1_germany.5303.d: "According to U.S. intelligence, Captain Franz von Rintelen (German Navy Intelligence) was intercepted in his communication with Victoriano Huerta whom made a deal to declare war on the U.S. should Germany support him with weapons to return to Mexico where he would have made an attempt  to come back to power. Luckily however, on his way there to Mexico, Huerta was intercepted by United States forces in Newman, New Mexico and never managed to cross the border where he was awaited by General Pascual Orozco."
    ww1_germany.5303.a: "Good"
    ww1_germany.54.t: "Shadow-Kaiser"
    ww1_germany.54.d: "Wilhelm II's role in wartime has been lately of ever-decreasing power as he has now largely been only responsible for handling awards ceremonies and honorific duties with much of the power being in the hands of the powerful generals Hindenburg and Ludendorff. As a result of this the German Empire has now be de-facto turned into a military dictatorship under the control of Field Marshal Paul von Hindenburg and General Erich Ludendorff. \n\n The Kaiser has been increasingly cu off from reality and the political decision-making process, being vacillated between defeatism and large dreams of victory. Although nevertheless Wilhelm II still retains ultimate authority in matters of political appointment and his consent is needed for major changes to the high command."
    ww1_germany.54.a: "Interesting times indeed"
    ww1_germany.55.t: "Declaration of War on Portugal"
    ww1_germany.55.d: "Due to previosu actions earlier this year with Portugal honoring its de-facto alliance with Great Britain by seizing our ships which had been anchored in Lisbon's harbor and our previous hostility with Portuguese aid to the Entente forcing us to sink their convoys. At this pointwe might as well be at war, the lines have been drawn and the Portuguese have sided with the enemy."
    ww1_germany.55.a: "It was only a matter of time"
    ww1_germany.56.t: "New Ace: Manfred von Richtofen"
    ww1_germany.56.d: "There is a new ace in Germany going by the name of Manfred von Richtofen otherwise known by the pseudonym of 'The Red Baron' due to the unusual paintjob of his aircraft whom he says is meant to strike fear into the enemy."
    ww1_germany.56.a: "Glory to him!"
    ww1_germany.57.t: "Resumation of Unrestricted Submarine Warfare"
    ww1_germany.57.d: "Admiral Henning von Holtzendorff has made strong arguments that if we resume unrestricted submarine warfare attacks on the entente we will successfully starve the British and without it we will not have any chance of winning the war. Although this very likely means the entrance of America against us the high command has calculated that American mobilization would be too slow to stop our victory on the Western Front."
    ww1_germany.57.a: "A neccesary action"
    ww1_germany.58.t: "Armistice of Compiegne Signed"
    ww1_germany.58.d: "With the war turning heavily against us and the Entente making significant progress in the battlefield, we have reluctantly been forced to sign an Armistice which has ended all of the fighting. Amongst the terms, the entente demands an imediate cessation of hostilities, withdrawal of German troops to behind ther own borders, preservation of infrastructure, echange of prisoners, a promise of reparations, the disposition of German warships and submarines, and conditions for prolonging or terminating the armstice. \n\n We will just have to wait and see for what they come up for a treaty..."
    ww1_germany.58.a: "Disastrous"
    ww1_germany.58.b: "We can not give in!"
    ww1_germany.59.t: "Armistice of Compiegne Signed"
    ww1_germany.59.d: "With the war turning heavily against us and the Entente making significant progress in the battlefield, we have reluctantly been forced to sign an Armistice which has ended all of the fighting. Amongst the terms, the entente demands an imediate cessation of hostilities, withdrawal of German troops to behind ther own borders, preservation of infrastructure, echange of prisoners, a promise of reparations, the disposition of German warships and submarines, and conditions for prolonging or terminating the armstice. \n\n We will just have to wait and see for what they come up for a treaty..."
    ww1_germany.59.a: "Disastrous"
    #ww1_germany.60.t:0 ""
    #ww1_germany.60.d:0 ""
    #ww1_germany.60.a:0 ""
    ww1_germany.61.t: "Red Baron Dies Over The Somme"
    ww1_germany.61.d: "On the 21st of April 1918, after the fog has lifted over Cappy Airfield JG1 took off after reports of enemy air activity reports. Jasta 11 takes off led by Manfred von Richtofen (The Red Baron), with Hans Joachim-Wolff, and Richtofen's cousin Wolfram who is heading into battle for the first time. \n\n At 1150 hours, Mellersh spots a lone Triplane, half rolls and forces him down. May circles on the edge of the fight until he sights Richtofen's cousin Wolfram crossing his front, Richtofen sees his cousin under fire and closes in, opens fire. The inexperienced May, falls out of control probably saving his life. Richtofen breaks his own rule and follows him down as May plunges earthward but he regains control just over the Somme and follows the river West - and to the safety of his own lines. May's friend Roy Brown sees the pursuit and dives to help, a low level chase follows. With a strong easterly win, Richtofen is pushed further and further over enemy lines... alone... and under constant ground fire. Richtofen seems to become target fixated, unaware of Brown diving behind him; at this exact time Cedric Popkin, of the 24th Australian Machine Gun Company fires at the Red Triplane along with soldiers from the 53rd Battery, Royal Australian Artillery. As Brown fires a burst the Triplane rears up to the right, at 1200 hours near Vaux-sur-Somme, Richtofen receives a single, fatal, bullet wound to the chest. The Red Triplane Fokker falls vertically but pulls up at the last moment, most likely still under the control of Richtofen, but by the time the aircraft stops... Richtofen is dead. To this day nobody who knows who killed the Red Baron as the Sopwith and the ground fire both used the Vickers .303. However May, Mellersh, and LeBoutillier all claim to have seen the Triplane rear up as Roy Brown fired, though the shot that enetered the under right of his armpit exiting under his left nipple gave high credence to groundfire bringing him down."
    ww1_germany.61.a: "Alles Kaput..."
    ww1_germany.62.t: "Richtofen Claims 81st Kill!"
    ww1_germany.62.d: "The Ace of all Aces, Manfred von Richtofen alternatively known as 'The Red Baron' flying his Red Colored Fokker Tripline to envoke fear in the foul enemy has emerged from another successful air engagment with his 81st Kill after spotting Wilfred May eyeing his young cousin, Wolfram. Non-the-less both have emerged victiorious and alive and well, our troops look up to him in their trenches, he is their angel in the air."
    ww1_germany.62.a: "And to many more!"
    ww1_germany.63.t: "Kaiser Wilhelm Geschütz Bombards Paris"
    ww1_germany.63.d: "The Kaiser Wilhelm Geschütz otherwise known as the Paris Gun, our long range heavy howitzer has once again taken action in bombarding the city of Paris, although the gun's damage is pretty ineffective in terms of structure damage it serves a good demoralizer for the inhabitants of Paris whom are most likely terrified, knowing at any time a shell from that gun could wipe them out."
    ww1_germany.63.a: "Hit'em Hard!"
    ww1_germany.64.t: "The Crimean Operation"
    ww1_germany.64.d: "An illegitamate government, the Taurida Soviet Socialist Republic controls the territory of Crimea and Cherson. As such, we have decided to invade the Crimean Peninsula with Ukranian assistance to take the prized port of Sevastopol for the Kaiserreich!"
    ww1_germany.64.a: "A port in the Black Sea will be useful.."
    ww1_germany.64.b: "Let them be."
    ww1_germany.65.t: "Formation of the Crimean Regional Government"
    ww1_germany.65.d: "We have established the Crimean Regional Government which is to be under German Protection with the Lipka Tatar General Maciej Sulkiewicz as Prime Minister. Whilst there were some efforts by the Ukraine to exert control over Crimea we have quickly subdued these efforts ensring the separation between Crimea and Ukraine."
    ww1_germany.65.a: "Give Cherson to Ukraine, give the Tatars only the Crimean peninsula"
    ww1_germany.65.b: "Give the tatars all the former territories of the Taurida SSR!"
    ww1_germany.65.c: "Direct Rule from Berlin!"
    ww1_germany.66.t: "Taurida SSR Surrenders"
    ww1_germany.66.d: "After a successful offensive the Taurida SSR has surrendered and we have transfered all territory to be for now under direct German military control. However, there have been efforts from the Ukraine to try and get us to transfer the territory to them, if we accept we will lose the ability have a strong strategic position in the Black Sea later on..."
    ww1_germany.66.a: "Temporary German Military Occupation!"
    ww1_germany.66.b: "Transfer all territories to Ukraine!"
    ww1_germany.67.t: "Kaiser Wilhelm II Abdicates?"
    ww1_germany.67.d: "With the German Empire actively seeking an armistice with the allies and a revolution threatening the unstable political situation of Germany by the end of the war calls for the Kaiser to abdicate grew in intensity. Wilhelm II himself was deeply reluctant to make such a sacrifice. Whilst his military advisers insisted that the army could no longer be relied on Wilhelm still expressed a notion to lead the armies back into Germany from the Western Front. Following the Kiel mutiny however Wilhelm II lost all hope and the navy was his greatest joy and achievement for which once it rebelled he had realized that the war had indeed been lost and seeing the fate of the Russian Royal Family, his cousins, he had a tough decision to make. Does the Kaiser abdicate?"
    ww1_germany.67.a: "He was but a 'Shadow Kaiser' anyway"
    ww1_germany.67.b: "No! He is but a puppet but he shall remain!"
    ww1_germany.67.c: "No! Our loyal leader will lead us to victory!"
    ww1_germany.68.t: "General Mobilization Begins"
    ww1_germany.68.d: "With war imminent the government has called for general mobilization with reserve divisions across the country ready for action. The men are rather confident that the war will by over, at least but christmas."
    ww1_germany.68.a: "To the front lines!"
    ww1_germany.69.t: "The Kaiser's Battle"
    ww1_germany.69.d: "The war has now gone on for four long years, but not all is bad for us as we have recently have knocked out Russia, this means we can focus all of their eastern divisions on the Western Front giving us numerical superiority over the Entente. Erich Ludendorff has been planning this operation for a while now naming it the 'Kaiserschlacht' or the Kaiser's Battle claiming this operation if successful, will drive us to Paris and thus our final victory. On the inside our society is slowly falling apart however, desertion particularly with our allies Austria-Hungary and Turkey, the blockade, and war exhaustion is all taking its toll and we will either win quick or lose quick."
    ww1_germany.69.a: "The battle begins..."

    ww1_germany.70.t: "Choosing our Warplans"
    ww1_germany.70.d: "Now that we are at war, it is time to choose our warplan. Will we choose the Schlieffen plan, which goes through Belgium and Luxemburg to circumvent the heavily fortified French lines, or will we do the exact same but through Switzerland with the Rupprecht Plan. Finally we have the option to ignore other fronts, and force Russia out of the war first."
    ww1_germany.70.a: "Pick the Schlieffen Plan"
    ww1_germany.70.b: "Pick the Kronprinz Plan"
    ww1_germany.70.c: "Pick the Rupprecht Plan"
#

# WW1 Italy #
    ww1_italy.1.t: "The Decision to Invade Libya"
    ww1_italy.1.d: "The ultimatum to Constantinople has reached its deadline. The government proposes an invasion of Ottoman Libya, expecting a quick campaign. The fleet and army will have to secure actual landing grounds; Ottoman sovereignty does not disappear with our declaration. We can still choose negotiations instead."
    ww1_italy.1.a: "Declare war over our Libyan claims."
    ww1_italy.101.t: "The Treaty of Ouchy"
    ww1_italy.101.d: "The diplomats at Ouchy have agreed to end the Libyan campaign. Ottoman forces withdraw, and our settlement places the Libyan districts and the Dodecanese under Italian ownership. The coastal war ends, but local resistance and the costs of colonial administration remain."
    ww1_italy.101.a: "Ratify the settlement."
    ww1_italy.101.b: "Continue the war despite the settlement."
    ww1_italy.102.t: "The Failure of the Libyan Expedition"
    ww1_italy.102.d: "Italian forces have failed to retain a viable position in Libya while the wider war has turned against them. We can conclude a peace that retains our Libyan administration, or continue the conflict at further political cost."
    ww1_italy.102.a: "End the campaign and retain Libya."
    ww1_italy.102.b: "Continue the war."
    ww1_italy.2.t: "The Libyan Claims"
    ww1_italy.2.d: "The cabinet is setting out its claims to the Ottoman provinces of Tripolitania and Cyrenaica. Claims provide a diplomatic and military objective; they grant no ownership, and the population has not consented to Italian rule."
    ww1_italy.2.a: "Register the claims."
    ww1_italy.3.t: "A Civil Administration for Libya"
    ww1_italy.3.d: "A colonial office needs funds, personnel and access to the districts it is meant to govern. A paid administration programme can improve cooperation in territory we actually own and control. Military occupation alone does not settle the colony's future."
    ww1_italy.3.a: "Fund a local civil administration."
    ww1_italy.4.t: "The Senussi Question"
    ww1_italy.4.d: "Officials propose a stronger constabulary in the Libyan districts. Resistance has political and religious roots that cannot be removed by a proclamation. We may fund a limited security programme or seek a negotiated accommodation."
    ww1_italy.4.a: "Pay for a limited colonial constabulary."
    ww1_italy.5.t: "Mobilisation and Railway Planning"
    ww1_italy.5.d: "Army headquarters are revising reserve call-ups, depot inventories and railway schedules. Better preparation consumes political effort and treasury resources. The programme improves staff experience without producing new soldiers or fully equipped divisions."
    ww1_italy.5.a: "Fund the revised mobilisation plan."
    ww1_italy.6.t: "The German Diplomatic Channel"
    ww1_italy.6.d: "Our representatives are discussing the Triple Alliance with Berlin. Friendly relations preserve an option, but a binding alliance requires a German answer and an Italian decision. No government is committed to war by these consultations."
    ww1_italy.6.a: "Maintain the channel."
    ww1_italy.7.t: "Italy Remains Neutral"
    ww1_italy.7.d: "The government considers the Triple Alliance a defensive undertaking and is declining immediate intervention. Neutrality leaves room for negotiation with both camps. A lasting armed-neutrality pledge requires a separate political decision."
    ww1_italy.7.a: "Maintain our freedom of action."
    ww1_italy.8.t: "An Entente Proposal"
    ww1_italy.8.d: "Our envoys propose an agreement with France over intervention and the Austrian claims. Paris must accept the offer and possess authority to invite us into its alliance. Territorial promises are claims for a future settlement, not land that changes hands today."
    ww1_italy.8.a: "Submit the proposal to Paris."
    ww1_italy.9.t: "The Decision for Intervention"
    ww1_italy.9.d: "France has accepted our proposal. The cabinet can now honour the agreement by joining the Entente and declaring war on Austria-Hungary, or pay the political price of retaining neutrality. Parliament, the crown and the country must live with the consequences of this decision."
    ww1_italy.9.a: "Join the Entente and declare war on Austria-Hungary."
    ww1_italy.10.t: "Requesting Allied Equipment"
    ww1_italy.10.d: "Our staff is asking France for 1,500 rifles. Any shipment must come out of the donor's actual stockpile; France may decline if its own army needs the reserve. The request creates no foreign divisions."
    ww1_italy.10.a: "Send the equipment request."
    ww1_italy.11.t: "Financing a Greater War Effort"
    ww1_italy.11.d: "The cabinet is approving extra military expenditure and coordinated procurement. The benefit comes with a larger financing burden and pressure on civilian supplies."
    ww1_italy.11.a: "Authorise the appropriations."
    ww1_italy.12.t: "A Central Powers Proposal"
    ww1_italy.12.d: "The Triple Alliance does not oblige Berlin to accept every Italian proposal. Our envoys are requesting a negotiated place in the German alliance. Germany must answer, and Italian ministers must then decide whether to sign."
    ww1_italy.12.a: "Submit the proposal to Berlin."
    ww1_italy.13.t: "Negotiating Tyrol with Vienna"
    ww1_italy.13.d: "Italy can offer a binding neutrality undertaking in exchange for Tyrolean districts that Austria-Hungary actually owns. Vienna may refuse. A concession requires the agreement of both governments and cannot transfer another country's territory."
    ww1_italy.13.a: "Put the proposal to Vienna."
    ww1_italy.1301.t: "An Italian Neutrality Proposal"
    ww1_italy.1301.d: "Rome offers neutrality in exchange for Tyrolean concessions. We can offer the districts we still own, or retain them and risk Italian intervention. The Italian government must accept our counter-offer before any transfer takes effect."
    ww1_italy.1301.a: "Decline the concessions."
    ww1_italy.1301.b: "Offer the Tyrolean districts we own."
    ww1_italy.1302.t: "Vienna Declines the Tyrolean Proposal"
    ww1_italy.1302.d: "Austria-Hungary has rejected our proposed exchange. The districts remain under their current administration, and neither government has obtained a new guarantee."
    ww1_italy.1302.a: "Review our diplomatic options."
    ww1_italy.1303.t: "Vienna Offers the Tyrolean Concession"
    ww1_italy.1303.d: "Vienna will cede the Tyrolean districts it owns if we undertake to remain neutral. We can ratify the agreement and receive only those districts still under Austrian ownership, or decline and preserve freedom of action."
    ww1_italy.1303.a: "Ratify the concession and neutrality agreement."
    ww1_italy.14.t: "Honouring the German War Pledge"
    ww1_italy.14.d: "The negotiated alliance has been ratified, and Germany is fighting France or Russia. The cabinet can now honour its war pledge through a separate declaration against Germany's existing opponents. Italy will not declare war on a country merely because it once belonged to the Entente."
    ww1_italy.14.a: "Honour the agreed war pledge."
    ww1_italy.15.t: "Claims Against France"
    ww1_italy.15.d: "Nationalist circles are urging claims to Corsica, Savoy and Nice. The cabinet can register these demands, but a claim grants neither sovereignty nor an obligation to start a war."
    ww1_italy.15.a: "Register the limited claims."
    ww1_italy.16.t: "Common Procurement"
    ww1_italy.16.d: "The army and industrial offices are reviewing contract schedules. Better planning provides practical experience at a cost to the treasury."
    ww1_italy.16.a: "Fund the programme."
    ww1_italy.17.t: "Frontline Staff Review"
    ww1_italy.17.d: "Officers are comparing field reports and revising liaison procedures. The lessons belong in the army's planning and training rather than in free new formations."
    ww1_italy.17.a: "Fund the programme."
    ww1_italy.18.t: "Artillery and Infantry Liaison"
    ww1_italy.18.d: "Commands are coordinating artillery support and infantry movements. The programme pays for staff work and exercises using the army already available."
    ww1_italy.18.a: "Fund the programme."
    ww1_italy.19.t: "Operational Reserve Planning"
    ww1_italy.19.d: "The army is improving reserve schedules and depot liaison. These arrangements may help the next operation, but civilian deliveries and the budget bear part of the cost."
    ww1_italy.19.a: "Fund the programme."
    ww1_italy.20.t: "Municipal Relief Coordination"
    ww1_italy.20.d:0 "Municipalities are coordinating deliveries, kitchens and public services for families behind the lines. A supervised purchasing programme will improve the routines of civilian industry while reserving resources for the administration."
    ww1_italy.20.a: "Fund the programme."
    ww1_italy.21.t: "Negotiating with the Workforce"
    ww1_italy.21.d: "Worker representatives are asking for reliable deliveries and better conditions. A paid agreement imposes a temporary production cost while easing social pressure."
    ww1_italy.21.a: "Fund the programme."
    ww1_italy.22.t: "A Civilian Food Programme"
    ww1_italy.22.d: "The cabinet is funding ration administration and municipal relief. Better distribution can ease shortages for a time, but sustained imports and harvests remain necessary."
    ww1_italy.22.a: "Fund the programme."
    ww1_italy.23.t: "Patriotic Mobilisation"
    ww1_italy.23.d: "Public meetings and volunteer organisations are supporting the war effort. The cabinet is paying for liaison and assistance rather than promising that enthusiasm supplies equipment or creates a new army."
    ww1_italy.23.a: "Fund the assistance organisations."
    ww1_italy.24.t: "Resistance in the Libyan Interior"
    ww1_italy.24.d: "Senussi authorities and local fighters are rejecting the extension of Italian administration into the interior. A new armed confrontation would make the colonial settlement still more costly. We can hold the historical military course or offer a local accommodation."
    ww1_italy.24.a: "Maintain the military occupation."
    ww1_italy.25.t: "The Later Libyan Policy Review"
    ww1_italy.25.d:0 "The cabinet is reviewing the cost of maintaining its colonial administration. It can support a limited constabulary programme or fund local infrastructure and civilian services in the territories we govern."
    ww1_italy.25.a: "Fund a limited constabulary programme."
    ww1_italy.25.b: "Prioritise civilian relief."
#

# WW1 Japan #
    ww1_japan.1.t: "Ultimatum to Germany Sent"
    ww1_japan.1.d: "Honoring our 1902 alliance agreement with the United Kingdom we have served the German Empire wih an ultimatum demanding all of their pacific colonies excluding the Solomon Islands, Bismarck Archipeligo, and German New Guinea. This war will be a great opportunity for us to pursue our own interests in the far east!"
    ww1_japan.1.a: "Send Ultimatum"
    ww1_japan.1.b: "Send Extended Ultimatum"
    ww1_japan.101.t: "Japan Sends us Ultimatum"
    ww1_japan.101.d: "The Japanese Government has sent us an ultimatum demanding practically all our pacific colonies excluding New Guinea, the Bismarck Archipeligo, and the Solomon Islands. Whilst it may be somewhat hard to let go of our colonial possesions perhaps it would be ultimately better to agree with their ultimatum and possibly avoid their intervention in this war lessening the power of the enemy?"
    ww1_japan.101.a: "Accept the Ultimatum"
    ww1_japan.101.b: "Ignore it"
    ww1_japan.102.t: "Germany Accepts Ultimatum"
    ww1_japan.102.d: "The German Empire has accepted our Ultimatum and agreed to cede the territories demanded within the ultimatum immediately, whilst we could honor our promises we could always still side with our allies and declare war on Germany regardless."
    ww1_japan.102.a: "Honor our promise"
    ww1_japan.102.b: "Help our allies"
    ww1_japan.103.t: "Germany Doesn't Respond"
    ww1_japan.103.d: "The German Empire has not responded to our ultimatum which will be taken by our government as a complete rejection and therefore we shall take matters into our own hands and take thosee territories regardless!"
    ww1_japan.103.a: "Declare War!"
    ww1_japan.103.b: "Back Down"
    ww1_japan.104.t: "Japan Sends us Ultimatum"
    ww1_japan.104.d: "The Japanese Government has sennt us an absolutely unimaginable ultimate demanding ALL of our pacific colonies, such an ultimatum is absolutely absurd, however do we really want to add another enemy to the list?"
    ww1_japan.104.a: "Accept the Ultimatum Reluctantly"
    ww1_japan.104.b: "Refuse to even respond"
    ww1_japan.105.t: "Germany Accepts Exttended Ultimatum"
    ww1_japan.105.d: "The German Empire has accepted our Ultimatum and agreed to cede the territories demanded within the ultimatum immediately, whilst we could honor our promises we could always still side with our allies and declare war on Germany regardless."
    ww1_japan.105.a: "Honor our Promise"
    ww1_japan.105.b: "Help our allies"
    ww1_japan.106.t: "Germany Doesn't Respond"
    ww1_japan.106.d: "The German Empire has not responded to our ultimatum which will be taken by our government as a complete rejection and therefore we shall take matters into our own hands and take thosee territories regardless!"
    ww1_japan.106.a: "Declare War!"
    ww1_japan.106.b: "Back Down"
    ww1_japan.2.t: "Kawachi Explodes!"
    ww1_japan.2.d: "Today, on the 12th of July 1918, despite being inspected several months before with no problems being discovered the Kawachi has unexpectedly blew up, the ship has sunk within roughly four minutes after the explosion and led to the death of 600 sailors with 443 survivors. No plausible suspect or reason for the explosion could be found and it is reported the cordite in her magazine might have spontaneously ignored due to decomposition. In the end whilst the navy considered salvaging the ship they decided it would be expensive and would delay the construction of one battlecruiser by over a year and was stricken from the navy list."
    ww1_japan.2.a: "What a waste of steel!"
    ww1_japan.3.t: "Rice Riots of 1918"
    ww1_japan.3.d: "Recently a series of popular disturbances have erupted throughout Japan from July to September 1918 caused by a precipitous rise in the price of rice that has caused extreme economic hardship, particularly in rural areas where rice is the main staple of life. The rice riots are said to be unparalleled to any other sort of protest in the past on terms of scope, size, and violence. The initial protest was said to have started peacefully but the disturbance quickly escalated into full scale riots, strikes, looting, incendiary bombings of police stations, and government offices, as well as armed clashes. Some 25,000 people were arrested, with 8200 being convicted of various crimes. Prime Minister Terauchi took the responsibility for the incident which brought the collapse of the Terauchi Masatake Administration in Japan."
    ww1_japan.3.a: "We must put an end to this!"
    ww1_japan.4.t: "March 1st Movement"
    ww1_japan.4.d: "The March 1st Movement is a clear public display of Korean resistance over our rule on the Korean peninsula. Supposedly, following the hearing of Wilson’s Fourteen Points speech many Korean students studying in Tokyo who were inspired published a statement demanding freedom from colonial rule. This was also escalated by death of the former Korean Emperor Gojong in January which has been filled with controversy and suspicion that he was poisoned."
    ww1_japan.4.a: "Indepdence for Korea? Laughable"
    ww1_japan.5.t: "Korea Integrated!"
    ww1_japan.5.d: "Today the Emperor of Korea has graciously and willingly approved the Japan-Korea Annexation Treaty signing it with a sharp smile on his face, in this treaty our nation will formally integrate Korea following the earlier Japan-Korea Treaty of 1905 in which Korea became a protectorate of our nation and the later Japan-Korea Treaty of 1907 in which Korea graciously gave away their rights of adminstration and internal affairs handing them over to us. Many of our fellow Japanese commentators predict that the Koreans will easily assimilate into the Empire!"
    ww1_japan.5.a: "Great news!"
    ww1_japan.6.t: "Death of Emperor Meiji"
    ww1_japan.6.d: "The Emperor Meiji has unfortunately passed away today of uremia, not long after his death the Japanese Diet has passed a resolution commemorating his role in the glorious Meiji Restoration. An iris garden in an area of Tokyo where Emperor Meiji had been known to visit is chosen to be the buildings location for the Shinto shrine Meiji Jingū. What the Emperor did will never be forgotten, he has presided over a time of rapid change for the better in Japan where we quickly changed from an isolation feudal state to a capitalist and imperial world power following the industrial revolution."
    ww1_japan.6.a: "He will be mourned"
    ww1_japan.7.t: "Nogi Maresuke Commits Seppuku"
    ww1_japan.7.d: "The General Nogi Maresuke who has been for a long time a national hero in Japan, a model of feudal loyalty, and self sacrifice has commited the seppuku ritual suicide due to his desire not to outlive his master, Emperor Meiji, whose death motivated his suicide on the day of the Emperor's funeral."
    ww1_japan.7.a: "What a hero"
#

# Austria Hungary #
    ww1_kuk.1.t: "Bosnia in the Imperial Administration"
    ww1_kuk.1.d: "Bosnia and Herzegovina remain under imperial rule but outside the two principal halves of the monarchy. A paid provincial administration can establish services and accountable appointments; a proclamation alone cannot settle its political future."
    ww1_kuk.1.a: "Fund the provincial administration."
    ww1_kuk.2.t: "The Serbian Question"
    ww1_kuk.2.d: "Nationalist agitation across the frontier troubles the army and the civil administration. The cabinet can treat every dispute as a military challenge, or pursue police cooperation while containing inflammatory rhetoric. Neither course resolves the competing ambitions in the Balkans."
    ww1_kuk.2.a: "Maintain a firm diplomatic position."
    ww1_kuk.3.t: "A Balkan Diplomatic Service"
    ww1_kuk.3.d: "Our representatives need reliable channels to the Balkan capitals. A coordinated diplomatic service can make our policy clearer, but promises of territory and military protection must still be negotiated with the governments concerned."
    ww1_kuk.3.a: "Coordinate the embassies."
    ww1_kuk.4.t: "The German Alliance"
    ww1_kuk.4.d: "Berlin remains the monarchy's principal strategic partner. Staff consultations can improve cooperation without surrendering Vienna's responsibility for its own foreign policy. Our diplomats are arranging another round of talks."
    ww1_kuk.4.a: "Maintain the alliance."
    ww1_kuk.5.t: "Talks with Sofia"
    ww1_kuk.5.d: "Bulgarian ambitions offer a possible counterweight to Serbia, but Sofia expects tangible diplomatic support. Our envoys are discussing transport links and regional security; Bulgaria remains free to judge the risks of closer cooperation."
    ww1_kuk.5.a: "Keep the channel open."
    ww1_kuk.6.t: "Talks with Constantinople"
    ww1_kuk.6.d: "The Ottoman government shares several of our strategic concerns. Cooperation will require dependable railway connections and practical agreements rather than old assumptions about the interests of the two empires."
    ww1_kuk.6.a: "Arrange the consultations."
    ww1_kuk.7.t: "Mobilisation Planning"
    ww1_kuk.7.d: "The army is reviewing reserve call-ups, railway timetables and depots. Paying for the staff work improves readiness without pretending that trained formations can appear overnight."
    ww1_kuk.7.a: "Pay for the revised mobilisation plan."
    ww1_kuk.8.t: "Albanian Liaison Service"
    ww1_kuk.8.d: "Albanian local leaders can help us understand the roads, languages and rivalries of the occupied districts. We can pay for interpreters and liaison training, while leaving the recruitment and equipment of actual field units to the army."
    ww1_kuk.8.a: "Organise a paid liaison mission."
    ww1_kuk.9.t: "Grain from the Serbian Occupation"
    ww1_kuk.9.d: "The occupation authorities report grain available for collection. Requisitioning it may ease shortages in our cities, but uncontrolled seizures will deepen resistance and disrupt next year's harvest. Compensation requires funds and a functioning transport system."
    ww1_kuk.9.a: "Requisition grain under military supervision."
    ww1_kuk.10.t: "Honouring the Bulgarian Agreement"
    ww1_kuk.10.d: "The cabinet is reviewing the Macedonian districts covered by our understanding with Bulgaria. We can hand over districts that belong to us, but cannot dispose of territory held by another government."
    ww1_kuk.10.a: "Transfer the districts we actually own."
    ww1_kuk.11.t: "The Cost of Total Mobilisation"
    ww1_kuk.11.d: "The common ministries are authorising a paid military effort with stronger procurement and staff coordination. Civilian deliveries will face additional pressure."
    ww1_kuk.11.a: "Authorise the additional expenditure."
    ww1_kuk.12.t: "A Separate Peace Channel"
    ww1_kuk.12.d: "Karl's government is considering a confidential approach to the Entente through Prince Sixtus. France must answer for itself, and the Italian claims and German alliance will remain obstacles even if Paris agrees to hear us."
    ww1_kuk.12.a: "Ask Sixtus to open the channel."
    ww1_kuk.12.b: "Keep this proposal in reserve."
    ww1_kuk.13.t: "Negotiating with Italy"
    ww1_kuk.13.d: "Rome still weighs the Triple Alliance against its territorial ambitions. Our diplomats can improve the atmosphere, but Italian neutrality or intervention must follow a separate decision by its government."
    ww1_kuk.13.a: "Continue the negotiations."
    ww1_kuk.14.t: "An Italian Neutrality Proposal"
    ww1_kuk.14.d: "The cabinet is willing to discuss concessions to keep Italy outside the war. We must decide which claims can be negotiated and then obtain an answer from Rome. A diplomatic proposal is not an agreement."
    ww1_kuk.14.a: "Prepare an offer."
    ww1_kuk.15.t: "An Offer of South Tyrol"
    ww1_kuk.15.d: "We can offer Rome the Tyrolean districts we own in exchange for neutrality. Italian ministers may judge this insufficient or reject it outright. No territory changes hands until their government accepts the proposal."
    ww1_kuk.15.a: "Submit the limited offer."
    ww1_kuk_1501.t: "Offer from Austria"
    ww1_kuk_1501.d: "Sir, the Austro-Hungarian government has given us an offer, promising that should we stay neutral in the war they are willing to give South Tyrol with no bloodshed, we could take the offer however it is a little less than what the Entente has been promising us."
    ww1_kuk_1501.a: "We will take it"
    ww1_kuk.1501.b: "Decline the offer."
    ww1_kuk_1502.t: "Italy Accepts Our Offer"
    ww1_kuk_1502.d: "The Kingdom of Italy has graciously accepted our offer to cede the territory of South Tyrol in return for Italian neutrality in the war. We are glad more bloodshed could be prevented and this should permanently secure our Western Front."
    ww1_kuk_1502.a: "Great"
    ww1_kuk_1503.t: "Italy Declines Our Offer"
    ww1_kuk_1503.d: "The scum of the Kingdom of Italy have declined our fair offer in ceding South Tyrol in return for their neutrality, if more blood is to be spilled we will give them what they want and show those filthy Italians what are made of! "
    ww1_kuk_1503.a: "Death to Italy!"
    ww1_kuk.16.t: "A Wider Italian Settlement"
    ww1_kuk.16.d: "The cabinet is considering Tyrol and the Adriatic districts as the price of Italian neutrality. Such concessions would be painful and require an explicit answer from Rome. Only districts under our ownership can be offered."
    ww1_kuk.16.a: "Submit the wider settlement."
    ww1_kuk.1601.t: "Vienna Offers an Adriatic Settlement"
    ww1_kuk.1601.d: "Austria-Hungary is offering Tyrol and specified Adriatic districts it still owns. Acceptance would secure substantial concessions without intervention; refusal leaves the question to diplomacy and the battlefield."
    ww1_kuk.1601.a: "Accept the wider settlement."
    ww1_kuk.17.t: "A Central Powers Offer to Rome"
    ww1_kuk.17.d: "Our envoys can offer diplomatic support for Italian claims against France. We cannot transfer French territory that we do not own. Rome must still decide whether the prospect justifies joining the Central Powers."
    ww1_kuk.17.a: "Put the proposal to Rome."
    ww1_kuk.1701.t: "Italy Accepts the Alliance Proposal"
    ww1_kuk.1701.d: "Rome is prepared to cooperate with the Central Powers. The political agreement supports Italian claims against France, but a separate invitation and the Italian government's continuing consent are required for membership."
    ww1_kuk.1701.a: "Prepare the invitation."
    ww1_kuk.1702.t: "Italy Declines the Alliance Proposal"
    ww1_kuk.1702.d: "Rome has declined our proposal. Promises about French territory have not overcome Italy's concerns about the costs of intervention. Any existing neutrality arrangement stands on its own terms."
    ww1_kuk.1702.a: "Keep diplomatic contact."
    ww1_kuk.1703.t: "A Central Powers Proposal"
    ww1_kuk.1703.d: "Vienna proposes to support Italian claims to Savoy and Corsica if we join its alliance. These are promises about a future settlement rather than territory it can deliver now. Joining would commit us to the risks of a continental war."
    ww1_kuk.103.a: "Authorise a confidential approach to Paris."
    ww1_Kuk.1703.b: "Decline the Deal"
    ww1_kuk.18.t: "The Italian Alliance Invitation"
    ww1_kuk.18.d: "The alliance proposal has reached the point of a formal invitation. Italy can enter only if it has accepted our offer, remains outside another faction and is at peace with us."
    ww1_kuk.18.a: "Implement the accepted agreement."
    ww1_kuk.19.t: "German Staff Advisers"
    ww1_kuk.19.d: "A German liaison mission is ready to work alongside the common army. The officers bring useful experience, while our own staff retains responsibility for training and operations."
    ww1_kuk.19.a: "Fund the liaison mission."
    ww1_kuk.20.t: "Requesting German Replacement Cadres"
    ww1_kuk.20.d: "Our staff is asking Berlin to release a small trained replacement cadre. Germany must provide the men from its own reserve, and its government may refuse if the fronts leave it no room."
    ww1_kuk.20.a: "Send the request."
    ww1_kuk.21.t: "Equipment for Germany"
    ww1_kuk.21.d: "Our ally requests a shipment of 1,000 rifles from our stockpile. The same rifles will be removed from our stores before they are delivered. Sending them supports the alliance at the expense of our own reserves."
    ww1_kuk.21.a: "Dispatch 1,000 rifles."
    ww1_kuk.22.t: "A Replacement Mission for Our Ally"
    ww1_kuk.22.d: "Our staff proposes to release 3,000 replacements and instructors for an allied army. The men must come from our available reserve; transport and liaison arrangements will also consume political resources."
    ww1_kuk.22.a: "Send the paid replacement mission."
    ww1_kuk.2201.t: "Austro-Hungarian Replacements Arrive"
    ww1_kuk.2201.d: "Vienna has transferred 3,000 men from its reserve to support our army. They are replacements and instructors rather than an instantly equipped corps. Our commanders can now assign them where they are needed."
    ww1_kuk.2201.a: "Welcome the mission."
    ww1_kuk.23.t: "Requesting Ottoman Replacement Cadres"
    ww1_kuk.23.d: "Constantinople is being asked to release a small replacement and liaison mission for the common army. Its government must weigh our request against the needs of its own fronts."
    ww1_kuk.23.a: "Send the request."
    ww1_kuk.24.t: "A Replacement Mission for Our Ally"
    ww1_kuk.24.d: "Our staff proposes to release 3,000 replacements and instructors for an allied army. The men must come from our available reserve; transport and liaison arrangements will also consume political resources."
    ww1_kuk.24.a: "Send the paid replacement mission."
    ww1_kuk.25.t: "Equipment for the Ottoman Army"
    ww1_kuk.25.d: "Our ally requests a shipment of 1,000 rifles from our stockpile. The same rifles will be removed from our stores before they are delivered. Sending them supports the alliance at the expense of our own reserves."
    ww1_kuk.25.a: "Dispatch 1,000 rifles."
    ww1_kuk.26.t: "An Imperial Administrative Programme"
    ww1_kuk.26.d: "Representatives of the common ministries and the two governments are establishing regular provincial consultation. A modest administrative programme can improve cooperation, while constitutional changes require explicit regional agreements."
    ww1_kuk.26.a: "Fund the common programme."
    ww1_kuk.27.t: "Military Appropriations"
    ww1_kuk.27.d: "The delegations are authorising paid staff training and a temporary common-army programme. Military coordination improves through work with the existing army, while civilian departments still compete for political attention."
    ww1_kuk.27.a: "Approve the appropriations."
    ww1_kuk.28.t: "The Civil Administration"
    ww1_kuk.28.d: "Civil departments need political support to coordinate services across the monarchy. A paid administration programme can make appointments and reporting more reliable."
    ww1_kuk.28.a: "Give the civil departments a budget."
    ww1_kuk.29.t: "Emergency Powers and the Nationalities"
    ww1_kuk.29.d: "The army demands stronger censorship and police powers. These can impose temporary order, but arbitrary interference with civilian administration will alienate the nationalities whose cooperation we need."
    ww1_kuk.29.a: "Approve temporary emergency powers."
    ww1_kuk.30.t: "The Constitutional Compromise"
    ww1_kuk.30.d: "The government is bringing together representatives of the two halves of the monarchy. Their first task is to agree on consultation and shared responsibilities; a trialist or federal constitution requires a further settlement."
    ww1_kuk.30.a: "Convene the council."
    ww1_kuk.31.t: "The Polish Legion Programme"
    ww1_kuk.31.d: "Polish volunteers and officers are seeking an organised place in the war effort. Paying for liaison and training can improve cooperation, but field formations still need to be recruited and equipped through the army."
    ww1_kuk.31.a: "Fund training and political liaison."
    ww1_kuk.32.t: "Agreement with the Hungarian Government"
    ww1_kuk.32.d: "Budapest is agreeing to regular consultation over appropriations and common responsibilities. The programme provides a working administrative relationship without pretending that Hungary has already consented to a new constitution."
    ww1_kuk.32.a: "Respect the agreed responsibilities."
    ww1_kuk.33.t: "The Hungarian Coronation of Karl"
    ww1_kuk.33.d: "Karl and Zita are being crowned in Budapest. The coronation oath affirms the Hungarian constitutional settlement, binding the new reign to obligations that will complicate any later trialist or federal reform. The monarchy welcomes a new sovereign, while its political arguments continue."
    ww1_kuk.33.a: "The crown carries obligations."
    ww1_kuk.34.t: "The First Production Programme"
    ww1_kuk.34.d: "Factories and depots are receiving a common maintenance and delivery schedule. The paid programme supports work in the existing economy."
    ww1_kuk.34.a: "Authorise the programme."
    ww1_kuk.35.t: "Railway Priorities"
    ww1_kuk.35.d: "Army transport and civil deliveries are sharing the railway network. Staff work can reduce confusion, though military priority will still put pressure on food distribution."
    ww1_kuk.35.a: "Authorise the programme."
    ww1_kuk.36.t: "Civilian Ration Planning"
    ww1_kuk.36.d: "Officials are revising ration cards and distribution procedures. An orderly system can stretch deliveries for a time, though it cannot replace missing harvests."
    ww1_kuk.36.a: "Authorise the programme."
    ww1_kuk.37.t: "Reviewing Frontline Command"
    ww1_kuk.37.d: "Staff officers are collecting reports from the front and reviewing the next operational plan. The paid programme improves experience within the existing army."
    ww1_kuk.37.a: "Authorise the programme."
    ww1_kuk.38.t: "Artillery and Supply Coordination"
    ww1_kuk.38.d: "Commands are revising artillery liaison and depot procedures. Paying for exercises and the temporary artillery programme gives the responsible officers practical experience."
    ww1_kuk.38.a: "Authorise the programme."
    ww1_kuk.39.t: "A Final Operational Reserve"
    ww1_kuk.39.d: "The command is paying for reserve training and operational coordination. It improves the use of the existing army while heavier military traffic strains civilian deliveries."
    ww1_kuk.39.a: "Authorise the programme."
    ww1_kuk.40.t: "Municipal Food Coordination"
    ww1_kuk.40.d: "Municipal authorities are coordinating transport and food deliveries. The paid programme improves distribution and access without creating a grain stockpile from nothing."
    ww1_kuk.40.a: "Authorise the programme."
    ww1_kuk.41.t: "Negotiating with the Workforce"
    ww1_kuk.41.d: "Worker representatives are negotiating conditions and deliveries. Paid concessions impose a temporary production cost but can support civic confidence."
    ww1_kuk.41.a: "Authorise the programme."
    ww1_kuk.42.t: "Public Relief in the Cities"
    ww1_kuk.42.d: "The government is funding civilian kitchens and municipal relief. These measures ease immediate food pressure while sustained deliveries remain necessary."
    ww1_kuk.42.a: "Authorise the programme."
    ww1_kuk.43.t: "The Death of Franz Joseph"
    ww1_kuk.43.d: "Franz Joseph has died at Schoenbrunn after a reign of almost sixty-eight years. Karl succeeds him in an empire strained by war and political division. The succession is secure, but the new emperor inherits questions that the long reign never settled."
    ww1_kuk.43.a: "A reign has ended."
    ww1_kuk.44.t: "The Sarajevo Assassination"
    ww1_kuk.44.d: "Archduke Franz Ferdinand and Sophie have been killed in Sarajevo. Ministers and commanders are demanding answers about the conspirators and their links across the frontier. The crime has opened a grave diplomatic crisis, but the cabinet must still decide how to respond."
    ww1_kuk.44.a: "Investigate the crime."
    ww1_kuk.45.t: "The Hoyos Mission"
    ww1_kuk.45.d: "The cabinet is considering a mission to Berlin to obtain German backing against Serbia. An unconditional pledge may embolden the army; a mediated investigation would demand restraint and a willingness to accept an imperfect diplomatic result."
    ww1_kuk.45.a: "Ask Berlin for its full support."
    ww1_kuk.4501.t: "Vienna Requests Unconditional Support"
    ww1_kuk.4501.d: "Count Hoyos asks whether Germany will stand behind Austria-Hungary if its confrontation with Serbia becomes a war. A promise of unconditional support could turn a Balkan crisis into a conflict involving Russia and its partners."
    ww1_kuk.4501.a: "Give Vienna our full backing."
    ww1_kuk.46.t: "German Backing Arrives"
    ww1_kuk.46.d: "Berlin has pledged its support. The cabinet can now prepare a demanding ultimatum, or use the pledge to seek a negotiated investigation. German support changes the balance of risk; it does not make the decision to start a war inevitable."
    ww1_kuk.46.a: "Prepare the ultimatum."
    ww1_kuk.47.t: "The Ultimatum to Serbia"
    ww1_kuk.47.d: "The cabinet has prepared demands for the suppression of hostile organisations and participation in the investigation inside Serbia. The latter demand challenges Serbian sovereignty and may be unacceptable even if Belgrade agrees to most of the other terms."
    ww1_kuk.47.a: "Deliver the demands to Belgrade."
    ww1_kuk.48.t: "The Reply to Vienna"
    ww1_kuk.48.d: "Austria-Hungary demands the suppression of hostile organisations and Austrian participation in an inquiry on Serbian soil. We can accept much of the ultimatum while rejecting foreign police authority, or accept the intrusive terms to avert this immediate confrontation."
    ww1_kuk.48.a: "Accept most terms, but preserve our sovereignty."
    ww1_kuk.49.t: "The Decision for War"
    ww1_kuk.49.d: "Serbia has accepted most of our demands but rejected Austrian participation in its internal inquiry. The army urges war; several ministers still fear a wider conflict. The cabinet must choose whether this remaining dispute warrants military action."
    ww1_kuk.49.a: "Declare war on Serbia."
    ww1_kuk.50.t: "Violence in Sarajevo"
    ww1_kuk.50.d: "Crowds have attacked Serb residents, shops and institutions following the assassination. The violence threatens people who had no part in the crime and makes provincial administration harder. The authorities must decide whether to restore order or allow reprisals to continue."
    ww1_kuk.50.a: "Tolerate the reprisals."
    ww1_kuk.51.t: "Armistice of Villa Giusti"
    ww1_kuk.51.d: "As much as it is painful to admit, our troops have been defeated and have ceased to exist as a combat force resulting a chaotic withdrawal in these last weeks. Not only that but the nation itself has ceased to exist in more ways than one with the declaration of independence of several states including Hungary which is half of our name. With the army so weak our commanders have been forced to seek a ceasefire and have signed the Armistice of Villa Giusti signed outside of Padua in Veneto taking effect today with the Kingdom of Italy already annexing Southern Tyrol as well as Trieste and Austrian Littoral."
    ww1_kuk.51.a: "Everything broken..."
    ww1_kuk.51.b: "We must continue the fight for the good of our nation..."
    ww1_kuk.52.t: "Banat Republic Declares Independence"
    ww1_kuk.52.d: "Today in the Banat region the leading members of the Social Democartic Party have decided to proclaim independence establishing a republic headed by Social Democrat leader Otto Roth. Made up of several large ethnicities the Rumanians being the largest ethnic group have reportedly said they do not want autonomy but rather unification with the Kingdom of Romania."
    ww1_kuk.52.a: "It won't last long"
    ww1_kuk.52.b: "This nation will be kept together with blood and iron!"
    ww1_kuk.53.t: "Czech's Declare Independence"
    ww1_kuk.53.d: "Prompted by the imminent collapse of the Habsburg Austro-Hungarian Empire the declaration of independence of the Czech nation has been proclaimed by its provisional government. With a draft of declaration of independence based on Wilson's fourteen points proclaimed and presented th the United States the U.S. Secretary of State Robert Lansing has replied that the allies were now committed to the causes of the Czechs, Slovaks,and Sout Slavs saying that th tenth of the Fourteen Points (autonomy for the nationalities) - was no longer enough with Emperor Charles I attempting to keep the empire together on those terms."
    ww1_kuk.53.a: "This is the death certificate of the empire..."
    ww1_kuk.53.b: "Keep it together at all costs!"
    ww1_kuk.54.t: "West Ukranian People's Republic Calls for Independence"
    ww1_kuk.54.d: "Today the West Ukrainian People's Republic has been proclaimed taking the Poles by surprise with the Polish Liquidation Committee which wwas ready to transfer from Krakow to Lviv and there has been deep resent with the Polish citizens in Lviv whom do not wish to be apart of this Ukranian nation."
    ww1_kuk.54.a: "We will manage without those Ukrops"
    ww1_kuk.54.b: "Show them our might!"
    ww1_kuk.55.t: "Martin Declaration United Slovakia with Czechs"
    ww1_kuk.55.d: "The Martin Declaration has been proclaimed in Martin, Slovakia, as a declaration of independence from the Hapsburg monarchy roughly ten days following the declaration of the Czech independence. Although there were calls for Slovak independence completely including that from the Czech Republic, the Slovak's separatist ambitions were largely suspended by the Czechs who would not agree to an terms of Slovak independence. \n\n The Slovak people were mistaken however, they would not be equal partners in this state and with Edvard Benes the FM of the Provisional Czech Gov. declaring it would be a Swiss-style federated state the Slovak's quickly found themselves being relegated to the status of a national minority."
    ww1_kuk.55.a: "Those traitors!"
    ww1_kuk.56.t: "Aster Revolution in Hungary"
    ww1_kuk.56.d: "Led by the Social Democrat, Count Mihaly Karoly, who established the Social Democratic Hungarian National Council (HNC) Karolyi demanded secession of Hungary from the Hapsburg Empire today with support of soldiers fro the Hungarian Army. HNC Protesters have worn aster flowers whilst helping seize public buildings throughout Budapest with PM Sandor Wekerle resigning and the former PM Istvan Tisza murdered."
    ww1_kuk.56.a: "This means the dissoluation of the Empire"
    ww1_kuk.56.b: "I will not accept this coup!"
    ww1_kuk.57.t: "Question of the Banat Region"
    ww1_kuk.57.d: "With the Banat Region proclaiming independence as a Republc not more than two weeks ago it has been a troubled state so far. The ethnic majority in the country, the Rumanians have called for unification with the rest of the Rumanian nation and there are a fair chunk of Yugoslavs on the other half of Banat. Considering the fact that the only international support this state has gotten is from the defeated Hungary we could invade it and split it between ourselves and Rumania with no international backlash."
    ww1_kuk.57.a: "Take it!"
    ww1_kuk.57.b: "Spare them"
    ww1_kuk.58.t: "Division of Banat"
    ww1_kuk.58.d: "With our troops taking full control of the Banat Region it is time to split the state between us and the Kingdom of Rumania based on ethnic majorities for fairness."
    ww1_kuk.58.a: "Good"
    ww1_kuk.59.t: "Armistice of Villa Giusti"
    ww1_kuk.59.d: "As much as it might be painful to admit, our troops have been defeated and have ceased to exist as a combat force resulting a chaotic withdrawal in these last weeks. Not only that but the nation itself has ceased to exist in more ways than one with calls for independence from all corners of the country including the Kingdom of Hungary which is half of our name. With the army so weak our commanders have been forced to seek a ceasefire and have signed the Armistice of Villa Giusti signed outside of Padua in Veneto taking effect today with the Kingdom of Italy already annexing Southern Tyrol as well as Trieste and Austrian Littoral."
    ww1_kuk.59.a: "Everything Broken..."
    ww1_kuk.60.t: "Spring Offensive Begins"
    ww1_kuk.60.d: "The war has now gone on for four long years, but not all is bad for the Central Powers whom have knocked out Russia, this means they can focus all of their eastern divisions on the western front giving them numerical superiority. This has prompted Erich Ludendorff to plan the 'Kaiserschlacht' otherwise known as the Kaiser's Battle or Spring Offensive. But on the inside the Central Powers are slowly falling apart, desertion, war exhaustion, and the blockade is all taking its toll and they will either win quick or lose quick. "
    ww1_kuk.60.a: "This isn't exactly promising..."
    ww1_kuk.61.t: "Tyrolean Volunteers!"
    ww1_kuk.61.d: "Italy has had some very... Suspicious activities on the border as of late. With their forces massing on the border, one would think that they are preparing to betray us and invade us, despite the Triple Alliance. As such, our own citizens, living in the border regions, have formed well-trained mountaineer militias to defend against this potential Italian aggression."
    ww1_kuk.61.a: "Those Insolent Italians!"
#

# WW1 Mexico #
    ww1_mexico.1.t: "Zapata Killed!"
    ww1_mexico.1.d: "In early 1919 Gen. Pablo Gonzalez ordered his subordinate to commerce operations against the Zapatistas in the mountains, but when Gonzalez found his subordinate Guajardo carousing in a cantina he was arrested. On March 21st, Zapata attempted to smuggle a note to Guajardo and invited him to switch side but the note never reached Guajardo and wound up instead on Gen. Gonzalez’s desk. However Gonzalez used this to his advantage promising to pardon Guajardo if he would tell Zapata he would bring over his men and supplies with Zapata agreeing to all his terms. On April 10, 1919, Guajardo invited Zapata to a meeting, intimating that he intended to defect to the revolutionaries but when Zapata arrived Guajardo’s men riddled him with bullets as he was gunned down."
    ww1_mexico.1.a: "Our nation is closer to being united without him!"
    ww1_mexico.2.t: "Pancho Villa Assassinated"
    ww1_mexico.2.d: "On Friday, 20th of July 1923, Villa was killed while visiting Parral. He frequently made trips from his ranch to Parral for banking and other errands, where he generally felt secure. Villa was usually accompanied by his entourage of Dorados (his bodyguards), but had gone into the town without them on that day, taking only a few associates with him. He went to pick up a consignment of gold from the local bank with which to pay his Canutillo ranch staff. While driving back through the city in his black 1919 Dodge touring car, Villa passed by a school, and a pumpkinseed vendor ran toward his car and shouted Viva Villa!, a signal to a group of seven riflemen who then appeared in the middle of the road and fired more than 40 shots into the automobile. In the fusillade, nine dumdum bullets, normally used for hunting big game, hit Villa in the head and upper chest, killing him instantly."
    ww1_mexico.2.a: "Tragic"
    ww1_mexico.3.t: "1910 Election Over, Porforio hailed Winner!"
    ww1_mexico.3.d: "Our great leader Porfirio Diaz has no doubt won the elections, although there remains a huge controversy of whether or not the elections were rigged or not as the Madero campaign met fierce resistance from the Diaz regime. Shortly before the elections he was been arrested on the charges of inciting a rebellion and many have noted election fraud at the polls."
    ww1_mexico.3.a: "Those are false allegations"
    ww1_mexico.4.t: "Madero Campaign Highly Successful"
    ww1_mexico.4.d: "Francisco Madero who is running for president has been lately very successful in his campaign drawing large crowds and appeasing the people with his plans for reform and change in Mexico should he win the election, this man will be a huge obstacle should we plan to stay in power a little while longer..."
    ww1_mexico.4.a: "He will be an obstacle..."
    ww1_mexico.5.t: "Madero Escapes!"
    ww1_mexico.5.d: "Whilst Francisco Madero has been imprisoned shortly before the elections he none-the-less managed to slip between our fingers running away across the Mexican border into the United States on horseback where it is said he may be even planning a revolution to take us out of power..."
    ww1_mexico.5.a: "Damn!"
    ww1_mexico.6.t: "Madero Crosses Rio Grande"
    ww1_mexico.6.d: "Madero who has taken refuge in the United States has recently crossed the Rio Grande River with his followers and issued a manifesto declaring the 1910 Mexican Election null and void on claims of election fraud. He has claimed the office of President and Vice-President of Mexico vacant and proclaims himself as the provisional president of Mexico."
    ww1_mexico.6.a: "The revolution has begun!"
    ww1_mexico.6.b: "(Play as the Maderistas)"
    ww1_mexico.7.t: "Diaz Surrenders"
    ww1_mexico.7.d: "Porfirio Diaz, encouraged by his advisor Jose Yves Limantour has made a wise choice to step down from power following significant victories on the side of the Maderistas. All fighting has stopped and Diaz is to be exiled from Mexico. However Madero's planned social reforms which were vaguely promised never came to light and thus dissent in Mexico is still high...."
    ww1_mexico.7.a: "Peace at last!"
    ww1_mexico.8.t: "Liberation Army of the South"
    ww1_mexico.8.d: "Emiliano Zapata has joined the revolution with Madero after Madero has made some vague promises regarding land reforms which is the only issue Zapata cares about."
    ww1_mexico.8.a: "Diaz is doomed"
    ww1_mexico.9.t: "Emiliano Zapata Urges for Land Reform"
    ww1_mexico.9.d: "Regarding that vague promise Madero made to Zapata during the early stage of the revolution about taking Zapata's ideas for land reform into action which still has not been done has made Zapata quite angry if we dont do something about this we may face a rebellion..."
    ww1_mexico.9.a: "Hmm..."
    ww1_mexico.10.t: "Pascual Orozco Launches Rebellion"
    ww1_mexico.10.d: "One of Madero's former generals Pascual Orozco has recently launched a rebellion in Chihuahua with Madero reacting by dispatching troops under the command of Victoriano Huerta  following Jose Gonzelez Salas's defeat. The rebellion is very minimal and will unlikely gain any traction."
    ww1_mexico.10.a: "Traitor!"
    ww1_mexico.11.t: "Bernardo Reyes launches Rebellion"
    ww1_mexico.11.d: "Bernardo Reyes a former general under Porfirio Diaz has launched a rebellion in Nuevo Leon however it has met with limited usccess and been defeated after 11 days with Reyes being imprisoned in Mexico City."
    ww1_mexico.11.a: "There will be stability in Mexico!"
    ww1_mexico.12.t: "Felix Diaz Launches Rebellion"
    ww1_mexico.12.d: "The Nephew of Porfirio Diaz has launched a rebellio in Veracruz saying that he is to "reclaim honor of the army trampled by Madero." however luckily the rebellion was quickly crusehd within days and Diaz has been imprisoned in Mexico City"
    ww1_mexico.12.a: "What honor?!"
    ww1_mexico.13.t: "Rumors of Huerta Conspiring with Enemies"
    ww1_mexico.13.d: "Victorianoo Huerta the current commander of the armed forces is said to be conspiring with Felix Diaz, Bernardo Reyes, and the US Ambassador Henry Lane Wilson against the current president Francisco Madero. Two of those individuals have actively rebelled against Madero in the past..."
    ww1_mexico.13.a: "Something fishy is going on here..."
    ww1_mexico.14.t: "The Ten Tragic Days"
    ww1_mexico.14.d: "On the night of February 8, 1913 Felix Diaz has been freed after a brief parley which resulted in the death of the commander of the civilian pententiary retreating into the city arsenal were he took control of the armory. \n\n Madero had full and complete confidence this Rebellion would non-the-less be supressed as had the previous ones. With fighting in the capital going on for several days General Victoriano Huerta ended up forming an alliance with Felix Diaz betraying Madero and arresting his brother and murdering him and offering Madero protection from the Diaz/Reyez forces only to be betrayed by Huerta and arrested where he was shortly after forced to resign and subsequently assasinated."
    ww1_mexico.14.a: "What a tragedy..."
    ww1_mexico.15.t: "Accept Zapata's Land Reforms?"
    ww1_mexico.15.d: "If we accept Zapata's land reforms we won't have to worry about him rising up against us and the future of Mexico could still be peaceful however should we break our vague promise for reform we may face a rebellion from Zapata which could potentially dwelve Mexico into another revolution/civil war."
    ww1_mexico.15.a: "Implement Zapata's Land Reform"
    ww1_mexico.15.b: "Ignore Zapata"
    ww1_mexico.16.t: "Zapata Rises Up!"
    ww1_mexico.16.d: "Angry with Madero ignoring his vague promise to institute land reforms across Mexico Zapata has take up arms against us! Although his force is small and won't poise much of a danger for now it is better to put out the fire quickly..."
    ww1_mexico.16.a: "Damn"
    ww1_mexico.17.t: "Constitutionalistas Rise Up"
    ww1_mexico.17.d: "Following the rise of Victoriano Huerta who imposed a harsh military dictatorship on Mexico the forces of Venustiano Carranza have launched a rebellion against Huerta in order to force him out of power and restore democracy in Mexico."
    ww1_mexico.17.a: "Damn!"
    ww1_mexico.18.t: "Villistas Rise Up"
    ww1_mexico.18.d: "Following the rise of Victoriano Huerta who imposed a harsh military dictatorship on Mexico the forces of Pancho Villa have joined Venustiano Carranza's Constitutionalistas against Huerta in order to force him out of power and restore democracy in Mexico."
    ww1_mexico.18.a: "Damn!"
    ww1_mexico.19.t: "Zapatistas Rise Up"
    ww1_mexico.19.d: "Following the rise of Victoriano Huerta who imposed a harsh military dictatorship on Mexico the forces of Emiliano Zapata have joined Venustiano Carranza's Constitutionalistas and Pancho Villa's Villista's against Huerta in order to force him out of power and restore democracy in Mexico."
    ww1_mexico.19.a: "Damn!"
    ww1_mexico.20.t: "Fall of the Huerta Regime"
    ww1_mexico.20.d: "Following immense internal and external pressure along with repeated defeats in the field against the Villista-Constitutionalista-Zapatista alliance Victoriano Huerta has chosen to reluctantly resign from his position of 'president' today."
    ww1_mexico.20.a: "A New Era of Peace!"
#

# WW1 Portugal #
    ww1_portugal.1.t: "Monarchy of the North"
    ww1_portugal.1.d: "The Monarchy of the North, officially called the Kingdom of Portugal was a short-lived revolution and monarchist government that was proclaimed in Porto, North of Portugal on the 19 January 1919. The movement was led by Henrique Mitchell de Paiva Couceiro a prominent member of the Portuguese imperial government who said the revolution was necessary because “if the North does not agree with the South, I will be, until the end, on the side of the faithful to tradition.”. However the revolution failed to gain strong popular support throughout the country with a unorganized structure, this led to its quick demise and the re-establishment of the Portuguese Republican regime in Porto."
    ww1_portugal.1.a: "They will be crushed!"
    ww1_portugal.1.b: "Long live the King!"
    ww1_portugal.2.t: "Bloody Night"
    ww1_portugal.2.d: "Known in Portuguese as Noite Sangrenta, A radical revolt took place in lisbon on the night of October 19th 1921. During the Bloody Night, The head of Government, Antonio Granjo; Politicians Machado Santos and Jose Carlos da Maia who were involved with the October 1910 revolution that established the First Portuguese Republic, with others were murdered in cold blood. The insurrection took place on the night of October the 19th 1921 after the anniversary of the Proclamation of the Republic. When a group of soldiers rose up against the dismissal of the government headed by Liberato Pinto, protector of the Guarda Nacional Republicana."
    ww1_portugal.2.a: "How Terrible..."
    ww1_portugal.3.t: "Sidonio Pais Assasinated!"
    ww1_portugal.3.d: "After the president made his way to the Lisboa-Rossio Railway Station on the evening of 14 December 1914 previously enjoying dinner at the restaurant Silva, he was accompanied by his brother and son planning to take the train to Porto in order to confer with the NOrthern Military Juntas. However when he entered the station at around 11 PM, he was received by a Republican Guard ordered to protect the president, however, this couldn't ruin the mood as a band played a popular song when the President entered the station. Inside the station Jose Julio da Costa a left-wing activist was waiting for him concaeling a pistol in his cloak. As the president passed Da Costa penetrated the double police cordon surrounding the President and fired two shots into Pais who at first was still alive but died of his wounds en route to the hospital."
    ww1_portugal.3.a: "What will we do without him?"
    ww1_portugal.4.t: "Assassination Attempt on the President!"
    ww1_portugal.4.d: "On December 5, 1918, during an award ceremony for survivors of the navy trawler Augusto de Castilho there was an assassination attempt against the president-king, Sidonio Pais, however luckily nobody got hurt."
    ww1_portugal.4.a: "Good thing it didn't succeed!"
    ww1_portugal.5.t: "May 28 1926 coup d'etat"
    ww1_portugal.5.d: "The 28 May 1926 coup d'état, sometimes called 28 May Revolution or, during the period of the authoritarian Estado Novo, the National Revolution, was a military coup of a nationalist origin, that put an end to the unstable Portuguese First Republic and initiated the Ditadura Nacional. The chronic political instability and government's neglect of the army created opportunities for military plots. Already in 1925 there were two failed coup attempts on April 18th and July 19th. The plotters were acquitted by military court. During winter of 1925 and spring 1926 a group of junior officers planned a new coup and were looking for a senior officer to be the figurehead of their movement. They decided on General Manuel Gomes da Costa, who agreed to join the plotters on May 25th."
    ww1_portugal.5.a: "Down with the Republic!"
    ww1_portugal.6.t: "José Mendes Cabeçadas Deposed!"
    ww1_portugal.6.d: "Cabecadas served as the ninth President of the Republic, which was a military dictatorship. Other revolutionaries however Gomes da Costa and Oscar Carmona judged him as incapable and in am eeting in Sacavem on 17 June 1926 Mendes Cabecadas was forced to renounce posts of the President of the Republic in favour of Gomes da Costa. He then joined opposition to the regime and involved himslef in several revolutionary attempts and subcribed to many manifestos against the dictatorship."
    ww1_portugal.6.a: "We welcome Gomes da Costa!"
    ww1_portugal.7.t: "Gomes da Costa Overthrown!"
    ww1_portugal.7.d: "Gomes da Costa's government lasted nearly as little as his predecessor as it was overthrown in a new coup on July 9 the same year. This attempt was imitiated by Joao Jose Sinel de Cordes and OScar Carmona, after Gomes da Costa attempted to have Carmona removed as minister for foreign affairs. Carmona, the new president used the pretext that Gomes da Costa was "unfit for office" and sent him to exile in the Azores Islands whilst also making him Marshal of the Portuguese Army."
    ww1_portugal.7.a: "Carmona is a better choice!"
    ww1_portugal.8.t: "Salazar Comes to Power"
    ww1_portugal.8.d: "After President Carmona appointed Salazar as Minister of Finance he was very impressed by his charima and qualities and nominated him as Prime Minister in 1932 and effectively turned over control of the government to him."
    ww1_portugal.8.a: "Salazar will lead us to victory!"
    ww1_portugal.9.t: "5 October 1910 Revolution"
    ww1_portugal.9.d: "With the Kingdom of Portugal being highly destabilized in the rescent years by British pressure on Portugal's colonies, the royal family's expenses, and the regicide of King Carlos and the Heir Apparent, proponents of the republic have taken advantage of the situation proclaiming a republic on 3rd October 1910 with two thousand soldiers and sailors rebelling. A provisional government led by Teofilo Braga have deposed the constitional monarchy and have called for Manuel II to be exiled from Portugal."
    ww1_portugal.9.a: "Glory to the Republic!"
    ww1_portugal.9.b: "The Throne is Mine!"
    ww1_portugal.10.t: "Portuguese Monarchy Requests Aid"
    ww1_portugal.10.d: "The Portuguese Monarchist forces have requested aid in their current struggle within the Portuguese Civil War fighting the Republic forces, it would benefit us to have these Republicans rid of lest our own people start getting ideas in their mind about doing something similar in Spain..."
    ww1_portugal.10.a: "Support the Monarchists"
    ww1_portugal.10.b: "I'd rather not get involved"
    ww1_portugal.11.t: "Monarchist Victory, Civil War Over!"
    ww1_portugal.11.d: "With Monarchist forces once again entering the Republican capital of Lisbon, the Republic has largely started to collapse elsewhere leading to a decisive monarchist victory in Portugal. It will be time to ramp up the authoritarian powers of the King in order to thwart any more future revolutions from the Republicans should they arise once more."
    ww1_portugal.11.a: "Hurrah!"
    ww1_portugal.12.t: "Attack on Chaves"
    ww1_portugal.12.d: "An attack led by Royalist Leader, Henrique Paiva Couceiro has been thwarted in the town of Chaves, the royalists who have been supposedly descreetly armed by the Spanish king, Alfonso XIII, came in from Spanish Galicia but luckily their attack has ended with a deicisve defeat from which Paiva Couceiro has said has led him to abandon the monarchist cause."
    ww1_portugal.12.a: "They won't be coming back!"
    ww1_portugal.13.t: "Spain Agrees to Give Aid"
    ww1_portugal.13.d: "Alfonso XIII of the Kingdom of Spain has made the decision to grant aid to pass through from Spain into our hands for use against the Republic forces. Hopefully we will be able to make use of them, and we won't forget this act of generosity from the Spanish."
    ww1_portugal.13.a: "Great!"
    ww1_portugal.14.t: "National Assembly Dissolved!"
    ww1_portugal.14.d: "With political instability at an all time high with many of the parties in legislature opnely hostile to eachother and the Assembly largely unmanageable, the president Manuel de Arriaga wishing to reduce the influence of the Portuguese Republican Party has dissolved the National Assembly unilaterally. As a result of this he has also installed Joaquim Pimenta de Castro to run the government. \n\n Pimenta de Castro immediately appointed several military officers in various ministries, dissolved the National Assembly, and is running the government as a dictator."
    ww1_portugal.14.a: "They are traitors to the Republic..."
    ww1_portugal.15.t: "May 14th Revolt"
    ww1_portugal.15.d: "Today on May 14th, a political-military uprising has started in Lisbon, with the objective of taking power from the dictatorship of General Pimenta de Castro and returning the government to the principlesof the 1911 constitution. \n\n On the morning of May 14, a group of revolutionaries including naval marines and regular soldiers occupied the Naval Arsenal in Lisbon, immediately taking possession of arms. Pimenta de Castro's forces attempted to encircle the Naval Arsenal however were bombarded by Republican ships including the NRP Vasco da Gama. \N\N Although Pimenta de Castro's government managed to escape they had eventually surrendered due to disproportionate forces that were armed against them. Although a small and short event there have been according to some sources 200 people killed, 1000 injured."
    ww1_portugal.15.a: "Down with the dictatorship!"
    ww1_portugal.16.t: "Military Junta, Sidonio Pais Takes Power"
    ww1_portugal.16.d: "Today on 5 December, 1917, with Portugal's participation in the Great War leading to political, economic, and social conjuncture of the country, Sidonio Pais has led a triumphant military revolt resulting in the constitution of a Military Junta. The Parliament has been dissolved and the Afonso Costa government has been overthrown with the president Bernardino Machado removed. \n\n Pais has proposed the creation of a 'New Republic' and has suspended the 1911 Constitution. He has been elected by direct suffrage for the Presidency of the Republic creating a professional Senate."
    ww1_portugal.16.a: "The people welcome this change"
    ww1_portugal.17.t: "Law of Separation of Church and State"
    ww1_portugal.17.d: "In an attempt to normalize relations with te Roman Catholic Church, which has been at war with the Republican regime since 1911, the president has amended the Law of Separation of Church and State today. Although it has prompted an immediate and fierce reaction from the raditional Republicans and Freemasons it has garndered widespread support from Catholics, moderate Republicans and the rural population, in all the vast majority of the Portuguese population."
    ww1_portugal.17.a: "It is a step forward"
    ww1_portugal.18.t: "Pais Proclaims 'Universal Suffrage'"
    ww1_portugal.18.d: "Today on 11 March, Sidonio Pais has made another 'unconstitutional' move by decreeing the direct election of the President by plebiscite, through universal suffrage."
    ww1_portugal.18.a: "Suffrage for all!"
#

# WW1 Romania #
    ww1_romania.1.t: "Carol I Dies"
    ww1_romania.1.d: "Carol I has ruled the Rumanian nation for a long time and thus has helped with the quick development during his reign which the Rumanian people are surely thankful for. Although he was inclined to enter the war on the side of the Central Powers convinced entering the war in support of the German Empire to support his cousin Wilhelm II would be the honorable thing to do. But he has passed away and thus the future of Romania lies in the hand of his Ferdinand."
    ww1_romania.1.a: "What will be the destiny of Romania?"
#

# WW1 Russia
    ww1_russia.1.t: "Our Friend Romania"
    ww1_russia.1.d: "With the war still ongoing we have made successful talks with Romania regarding their neutrality, unless we can make significant progress on our front against the Central Powers Romania does not want to get involved."
    ww1_russia.1.a: "Alright"
    ww1_russia.2.t: "Slavic Brotherhood"
    ww1_russia.2.d: "We have greately improved our relations with our slavic bothers in the Balkans, particularly with Serbia and Montenegro."
    ww1_russia.2.a: "Good"
    ww1_russia.3.t: "Support Serbia"
    ww1_russia.3.d: "With Franz Ferdinand dead we must act fast before Austria makes a move and guarantee the independence of Serbia to protect them should Austria think about declaring war."
    ww1_russia.3.a: "We wont let Serbia become a victim!"
    ww1_russia.4.t: "Petrograd Defense"
    ww1_russia.4.d: "To protect the capital it would be wise to build several naval/coastal forts should the capital be threatened by an enemy navy."
    ww1_russia.4.a: "Good"
    ww1_russia.5.t: "Western Investments"
    ww1_russia.5.d: "A large amount of indsutrial investments have been coming in from the wests which have been encouraged during our recent era of industrialisation which has been somewhat successful."
    ww1_russia.5.a: "Great"
    ww1_russia.6.t: "Trans-Siberian Railway Construction"
    ww1_russia.6.d: "The Trans-Siberian railway which once finished will connect Moscow with he Far East (Vladivostok), so far it has been under construction for roughly two decades, once finished we will be able to participate in more trading opportunities in the far east improving our economic opportunities."
    ww1_russia.6.a: "Lets finish this"
    ww1_russia.7.t: "Trans-Siberian Railway Finished"
    ww1_russia.7.d: "The Trans-Siberian railway which once finished will connect Moscow with he Far East (Vladivostok), so far it has been under construction for roughly two decades, once finished we will be able to participate in more trading opportunities in the far east improving our economic opportunities."
    ww1_russia.7.a: "Hurrah!"
    ww1_russia.8.t: "Preparation for War"
    ww1_russia.8.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_russia.8.a: "Ok"
    ww1_russia.9.t: "Occupy North Persia"
    ww1_russia.9.d: "With the previous Anglo-Russian agreement promising us full influence of Northern Persia, we have decided to take the action of occupying the area based on security reasons with the Ottoman Empire now hostile with us."
    ww1_russia.9.a: "Alright"
    ww1_russia.10.t: "Frontline Focus I"
    ww1_russia.10.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_russia.10.a: "Sounds good"
    ww1_russia.11.t: "Frontline Focus II"
    ww1_russia.11.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_russia.11.a: "Sounds good"
    ww1_russia.12.t: "Frontline Focus III"
    ww1_russia.12.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_russia.12.a: "Sounds good"
    ww1_russia.13.t: "Brusilov Offensive Begins"
    ww1_russia.13.d: "With the cities of Lviv and Kovel being lost the previous year to the Central Powers, Tsar Nicholas who had previously taken personal command of the Army has approved for an offensive plan drawn up by Alexei Brusilov."
    ww1_russia.13.a: "We will push them back!"
    ww1_russia.14.t: "Expedtionary Forces to France"
    ww1_russia.14.d: "Our ally France has requested that Russian troops be sent to fight alongside their own army on the Western Front, whilst some have been opposed to sending any troops the Tsar approved sending several units over."
    ww1_russia.14.a: "Hopefully they can make use of this"
    ww1_russia.15.t: "Military Aid I"
    ww1_russia.15.d: "Due to our poor pre-war stocks we have not been able to produce enough weapons for the amount of soldiers we have in total, luckily however our allies have been able to send us limited arms too perhaps help us in some way at least."
    ww1_russia.15.a: "Thanks"
    ww1_russia.16.t: "Military Aid II"
    ww1_russia.16.d: "Due to our poor pre-war stocks we have not been able to produce enough weapons for the amount of soldiers we have in total, luckily however our allies have been able to send us limited arms too perhaps help us in some way at least."
    ww1_russia.16.a: "Thanks"
    ww1_russia.17.t: "Mongolian Buffer State"
    ww1_russia.17.d: "Due to the Xinhai revolution in China we have had the opportunity to seize some territory and establish a quasi-independent buffer state, that being Mongolia."
    ww1_russia.17.a: "Good"
    ww1_russia.18.t: "Russian Dominance in Asia"
    ww1_russia.18.d: "Taking advantage of the Xinhai revolution even more we can perhaps get away with even larger demands in the future and establish our own dominance in Asia after Japan."
    ww1_russia.18.a: "Sounds good"
    ww1_russia.19.t: "Occupation of Manchuria"
    ww1_russia.19.d: "Taking larger advantage of the Xinhai Revolution beyond establishing a quasi-independent Mongolian buffer state we have decided to go ahead and occupy all of Manchuria, of course this will most likely largely upset Japan."
    ww1_russia.19.a: "Good, but bad"
    ww1_russia.20.t: "Supress Revolutionaries"
    ww1_russia.20.d: "Since the 1905 Revolution, revolutionaries in Russia have largely been a threat to the our autocratic government and thus must be supressed to keep stability in the nation."
    ww1_russia.20.a: "It has to be done"
    ww1_russia.21.t: "Continue Russification"
    ww1_russia.21.d: "In an effort to establish russian culture amongst our non-russian populations we have taken actions to demolish catholic churches and attempt to eradicate foreign languages from the youth through means of education."
    ww1_russia.21.a: "Good"
    ww1_russia.22.t: "St. Petersburg Renamed"
    ww1_russia.22.d: "As a result of the outbreak of war between our country and Germany, the imperial government has taken actions to rename the city of St. Petersburg to Petrograd removing the German words 'Sankt' and 'Burg'."
    ww1_russia.22.a: "Not sure what good that'll do..."
    ww1_russia.23.t: "Defend our Slavic Brothers"
    ww1_russia.23.d: "In an effort to defend our slavic brothers in the balkans from Austro-Hungarian agression we have decided to guarantee the independence of Serbia and Montenegro who are currently under constant threat of Austrian ambitions in the Balkans."
    ww1_russia.23.a: "We will defend our brothers"
    ww1_russia.24.t: "February Revolution"
    ww1_russia.24.d: "The February Revolution has broken out in Petrograd following longstanding discontent with the monarchy which has resulted in an eruption of mass protest against the food rationing on 8 March. Revolutionary activity was largely confined to the capital and its vicinity lasting about eight days. It involved mass demonstrations and armed clashes with the police and gendarmes, the last royal forces of the Russian monarchy. Finally on the 12th of March mutinous Russian Army forces sided with the revolutionaries who have put the monarchy in jeopardy."
    ww1_russia.24.a: "This isn't good..."
    ww1_russia.25.t: "Tsar Nicholas II Abdicates"
    ww1_russia.25.d: "Following the end of the February Revolution, Nicholas II has chosen to abdicate the throne, first abdicating in favour of his son Alexi, but backtracking a few hours later after being given advice that the Tsarevich would not live long seperated from his parents whom are to be exiled. Nicholas thus abdicated on behalf of his son and drew up a new manifesto naming his brother, Grand Duke Michael, as the next Emperor of all the Russias whom has declined to accept the throne bringing three centuries of Romanov rule to an end."
    ww1_russia.25.a: "The end of autocracy!"
    ww1_russia.26.t: "Formation of Polish Legion"
    ww1_russia.26.d: "In an effort to appease the Poles to the same extent the Central Powers have we have decided to create a seperate Polish Legion within the army, it will be deployed in St. Petersburg."
    ww1_russia.26.a: "Good"
    ww1_russia.27.t: "Nicholas Takes Command of Army"
    ww1_russia.27.d: "The Tsar has recently assumed the role of commander-in-chief after dismissing his cousin, Nikolay Nikolayevich. Due to this he will be staying away at a remote HQ at Mogilev from the governance of the Empire. The move is largely symbolic as all important military decisions are made by his chief of staff."
    ww1_russia.27.a: "Alright"
    ww1_russia.28.t: "Homefront Focus I"
    ww1_russia.28.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_russia.28.a: "Sounds Good"
    ww1_russia.29.t: "Home Front Focus II"
    ww1_russia.29.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_russia.29.a: "Sounds Good"
    ww1_russia.30.t: "Home Front Focus III"
    ww1_russia.30.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_russia.30.a: "Sounds Good"
    ww1_russia.31.t: "Prince Lvov Resigns"
    ww1_russia.31.d: "The Head of the Russian provisional government, Prince Lvov has regretfully resigned today after being unable to rally enough sufficient support from the people. He has resigned in favor of his Minister of War, Alexander Kerensky who is now the new head of the provisional government."
    ww1_russia.31.a: "Alright"
    ww1_russia.32.t: "The July Days"
    ww1_russia.32.d: "On 16 July, soldiers, sailors, and industrial workers in Petrograd have engaged in spontaneous armed demonstrations against the Russian Provisional Government. Compared to the demonstrations of the February Revolution, the mood of the demonstrators was even angrier and darker, the Provisional Government has put blame on the Bolsheviks for the violence and in a subsequent crackdown on the Bolshevik Party, the party was dispersed, many of the leadership arrested. Vladimir Lenin is said to have fled to Finland, whilst Leon Trotsky is among those arrested."
    ww1_russia.32.a: "Crack down on those commie bastards!"
    ww1_russia.33.t: "Kornilov Affair"
    ww1_russia.33.d: "Lavr Kornilov has previously beem requested to move forces loyal to the provisional government intro Petrograd to counter the threat of the radical Petrograd army garrison under control of the Soviets. As a result, Kornilov then marched on Petrograd intent on allegedly 'purging' the Provisional Government of revolutionary elements, which were possibly with the intention of establishing a military dictatorship. Kerensy countered Kornilov by arming the Bolshevik-influenced Soviets including Leon Trotsky's Red Guards. As a result Kornilov's army failed to enter Petrograd and he and his closest advisers have been imprisoned at the cost of the Bolsheviks permanently being armed and empowered..."
    ww1_russia.33.a: "Good and bad...very bad"
    ww1_russia.34.t: "October Revolution"
    ww1_russia.34.d: "With the Kornilov Affair exposing the weakness of the Provisional Government the Bolsheviks gained much popularity with Kerensky's government losing popularity. Along with this the Bolsheviks have just recently won the majority in the Petrograd Soviet. As a result of this seeing a huge opportunity, Vladimir Lenin, who was still hiding out in Finland, disguised himself as an old drunk with a tooth ache and traveled unnoticed into Petrograd hiding out at the Smmolny Institute. In the darkness of the night Bolshevik troops started occupying strategic areas within Petrograd with no shots fired in the process, by the morning the Provisional Government located in the Winter Palace is completely surrounded and Kerensky flees. \n\n Only a day later is the Winter Palace garrisoned by the Junkers and containing remaining ministers of the Provisional Government is stormed and all the ministers arrested and imprisoned in the Peter and Paul Fortress."
    ww1_russia.34.a: "Glory to heroes!"
    ww1_russia.35.t: "Constituent Assembly Elections"
    ww1_russia.35.d: "The Constituent Assembly Elections has yielded the following results with the Sociliast-Revolutionary Party (going in coalition with the Bolsheviks) earning 40.4% of the vote, by far the majority. The Bolsheviks on the other hand coming in second, with only 24.0% of the vote. The Constitutoal Democrat arty also known as the Kadets have won only 4.7% of the vot with Mensheviks coming in last with 2.6% of the votes along with a 18.40% from various other minority parties."
    ww1_russia.35.a: "Alright"
    ww1_russia.36.t: "Constituent Asssembly Dissolved"
    ww1_russia.36.d: "The Constitutent assembly meeting today on 5 January, 1918, with the Bolsheviks, was the first and only day in session, on which the Constituent assembly has come into conflict with the Soviets rejecting Soviet decrees on peace and land which has ultimately resulted in the Constituent Assembly being dissolved by force by order of the Congress of Soviets."
    ww1_russia.36.a: "It must be done"
    ww1_russia.37.t: "Return of Lenin"
    ww1_russia.37.d: "The leader of the Bolsheviks, Vladimir Lenin, who has previously spent life outside the borders of Russia in exile has made a return from Switzerland with the help of the German government which allowed for him to travel to Petrograd by train via Germany and Finland."
    ww1_russia.37.a: "Lets hope he doesn't stir up trouble"
    ww1_russia.38.t: "April Theses"
    ww1_russia.38.d: "Upon his return to Petrograd from exile, Vladimir Lenin has issued a series of ten directives. The Theses were mostly aimed at fellow Bolsheviks in Russia and returning to Russia from exile. He has called for soviets to take power taking the slogan 'all power to the soviets', denouncing liberals and social revolutionaries in the Provisional Government, and calling for Bolsheviks to refuse cooperation with the Provisional Government and instead call for new commnist policies."
    ww1_russia.38.a: "Tough times ahead..."
    ww1_russia.39.t: "The Milyukov Note"
    ww1_russia.39.d: "Support for the Bolsheviks has suddenly bolstered following the incident with the Milyukov note with widespread mistrust of the Russian Provisional Government growing. The Bolsheviks who have for a while now believed the Provisional Government was continuing the war in the same fashion that the Tsarist Government had, had little proof of this and had been waiting for a time to take action in spreading mistrust of the Provisional Government. Forerign Minister Pavel Milyukov sent the Allied Powers a telegram, one which would prove to be a harmful, containing the statement that the Provisional Government would continue the war with the Tsarist war aims. \n\n The Telegram was leaked to the Bolsheviks by an insider and protests began against the Provisional Government which promised the people that the terror of Tsardom had ended."
    ww1_russia.39.a: "Damn!"
    ww1_russia.40.t: "Romanov Tercentenary"
    ww1_russia.40.d: "Today on 1 March 1913 we celebrate the 300th year of the Romanov Dynasty in power marking a country-wide celebration of the ruling Romanov Dynasty. After a grand display of wealth and power in St. Petersburg, and a week of receptions at the Winter Palace, the Imperial family embarked on a tour following Mikhail I Romanov's route after his election as king in 1613, with a sort of pilgrimage to the towns of ancient Muscovy. \n\n The celebrations have been described as an 'extravaganza of pageantry' and a tremendous propaganda exercise; but among its principal goals are to 'inspire reeverence and popular support for the principle of autocracy', and also a reinvention of the past, to 'recount the epic of the 'popular Tsar'. These celebrations have showed the 'true devotion' of the Russian peasant masses to the tsar."
    ww1_russia.40.a: "Glory to the Tsar"
    ww1_russia.41.t: "The Ice March"
    ww1_russia.41.d: "The Ice March otherwise known as the First Kuban Campaign was a military withdrawal lasting from February to May 1918, being one of the defining moments of the Russian Civil war with the Volunteer Army, under attack by the RedArmy advancing from the north retreating from the city of Rostov south twards the Kuban where they had hoped to gain the support of the Don Cossacks against the Bolshevik government."
    ww1_russia.41.a: "Interesting times..."
    ww1_russia.42.t: "Russian Civil War"
    ww1_russia.42.d: "A revolt of the Czechoslovak Legion has broken out with the legionaries taking control of Chelyabinsk, meanwhile Russian officers' organizaitons have overthrown the Bolshheviks in Petropavlovsk and in Omsk. Already the Whites are controlling most of the Trans-Siberian Railroad between Lake Baikal and the Urals with Bolshevik power in Sibera practically being eliminated. The Volunteer Army (Whites) howevver are spread far and thin with several leaders and are not connected between their Western and Eastern theatres, if the Bolsheviks are to win they should prevent both theatres from connecting by taking Tsaritsyn."
    ww1_russia.42.a: "Death to the Bolsheviks!"
    ww1_russia.42.b: "Power to the Soviets!"
    ww1_russia.43.t: "Treaty of Brest-Litovsk"
    ww1_russia.43.d: "After several months of brutal negotiations a final treaty has been agreed upon between our government in an effort to stop further advances by the Germanand Austro-Hungarian forces. According to the treaty, we will default on all of Imperial Russia's commitments ot the Triple Entente alliance. In the treaty we will cede all of the Baltic States to Germany meant to become German vassal states under German princelings, recognize the independence of Ukraine, cede Byelorussia, cede Kars Oblast in the South Caucasus to the Ottoman Turks. The terms are far above harsh and it is even said the German negotiator has been shocked by the harshness."
    ww1_russia.43.a: "We will get those lands back later!"
    ww1_russia.44.t: "General Mobilization Begins"
    ww1_russia.44.d: "With war imminent the government has called for general mobilization with reserve divisions across the country ready for action. The men are rather confident that the war will by over, at least but christmas."
    ww1_russia.44.a: "To the front lines!"
    ww1_russia.45.t: "Finland Declares Independence"
    ww1_russia.45.d: "The Finnish Declaration of Independence has been adopted by the Parliament of Finland today on 6 December, 1917. The declaration has declared Finland an independent nation, among nations ending its autonomy within Russi as its Grand Duchy of Finland, with reference to a simultaneously delivered bill to the Diet to make Finland an independent republic instead."
    ww1_russia.45.a: "We will not let this slide..."
    ww1_russia.45.b: "Play as Finland"
    ww1_russia.46.t: "Finnish Civil War Begins"
    ww1_russia.46.d: "Finnish society has experienced rapid population growth, industrialisation, urbanisation, and the rise of a labour movement in the years past, this combined with the collapse of the Russian Empire causing a power vacuum in Finland has led to a struggle for dominance between the left-leaning labour movement in the south whom live amongst the industrial regions and the conservatives whom are situated up north towards the most rural regions."
    ww1_russia.46.a: "Death to the Reds!"
    ww1_russia.46.b: "Power to the Soviets"
#

# WW1 Serbia #
    ww1_serbia.1.t: "The Balkan League"
    ww1_serbia.1.d: "With the Ottoman Turks weakened from their defeat in the recent Italo-Turkish war and considering they still hold a sizable amount of the Balkan Peninsula it would be a wise idea to take this situation to our advantage and form an alliance with the other Balkan states against the Ottoman turks. With this alliance we will finally be able to push the turks out of europe for good!"
    ww1_serbia.1.a: "The time has come to show our might!"
    ww1_serbia.101.t: "Join the Balkan League?"
    ww1_serbia.101.d: "Serbia has proposed an interesting idea - that the nations of the balkans band together and remove the Turkish yoke once and for all!"
    ww1_serbia.101.a: "Of course! We shall join the balkan league."
    ww1_serbia.101.b: "But I like my kebab..."
    ww1_serbia.102.t: "What shall we do with the Balkan League?"
    ww1_serbia.102.d: "Serbia has proposed the formation of a Balkan League, almost certainly to kick out the Turks from Europe. What shall we do?"
    ww1_serbia.102.a: "Send token help."
    ww1_serbia.102.b: "Join the league!"
    ww1_serbia.102.c: "Nothing."
    ww1_serbia.2.t: "First Balkan War"
    ww1_serbia.2.d: "With the Balkan League formed the Ottoman Turks will be strategically and numerically disadvantaged against all of us, with our combined armies we will hopefully overcome them and capture all the remaining European territories of the Ottoman Empire!"
    ww1_serbia.2.a: "God is with us!"
    ww1_serbia.3.t: "Treaty of London 1913"
    ww1_serbia.3.d: "With the First Balkan War concluded and the Ottoman Empire defeated the great powers of Europe have gathered to deal with the new territorial adjustments out of the conclusion of the war. Unlike our plans unfortunately, the great powers particularly Italy and Austria-Hungary have strongly pushed for the creation of an independent Albanian state which has forced us to break our to the Bulgarians to cede the territory of Vardar Macedonia since if we will not get Albania in this war we wouldn't get anything if we also ceded the Vardar region."
    ww1_serbia.3.a: "The map of Europe is redrawn once again."
    ww1_serbia.301.t: "Peace with the Turks?"
    ww1_serbia.301.d: "The Turks have lost control of most, if not all of their European posessions. Ideally, we sue for peace before they gather up their strength and strike back at us."
    ww1_serbia.301.a: "Send the peace offer."
    ww1_serbia.301.b: "It shall be total victory, or total defeat."
    ww1_serbia.301.c: "We have avenged 1453!"
    ww1_serbia.301.w: "Delegate the decision to Bulgaria"
    ww1_serbia.301.x: "Delegate the decision to Greece"
    ww1_serbia.301.y: "Delegate the decision to Montenegro"
    ww1_seriba.301.z: "Delegate the decision to Romania"
    ww1_serbia.302.t: "Peace?"
    ww1_serbia.302.d: "We have been driven out of Europe... The Serbians are offering us peace terms, and we are to surrender almost all of our European possessions to the Balkan nations as they desire."
    ww1_serbia.302.a: "So be it. The balkans are nothing but trouble."
    ww1_serbia.302.b: "No, we will push back the dirty giaours!"
#

# WW1 Siam #
    ww1_siam.1.t: "Death of Rama V"
    ww1_siam.1.d: "King Chulalongkorn has sadly passed away today at the Amphorn Sathan Residential Hall in the Dusit Palace being succeeded by his son Vahiravudh, otherwise known as Rama VI. Chulalongkorn's achievments and accomplishments for the nation he loved so much will not be forgotten, now we can only hope that our next ruler be more like our last."
    ww1_siam.1.a: "A sad day for Siam"
    ww1_siam.2.t: "Palace Revolt of 1912"
    ww1_siam.2.d: "Today a group of plotters who claim to have been dissatisfied with the new kings reign and his favourism towards the Wild Tiger Corps. Around seven army officers then decided to overthrow the king which later grew to 91 officers, but fortunately Captain Yut Khongyu who was selected by lottery by the plotters to assassinate the monarch, was filled with guilt and confessed to all the plans and named the conspirators who had there after swiftly been arrested and given their sentences at a subsequent military tribunal."
    ww1_siam.2.a: "This lesson should not be lost on the King..."
#

# WW1 Turkey #
    ww1_turkey.1.t: "Our Friend the German Empire"
    ww1_turkey.1.d: "During a recent diplomatic meeting we have realized that we and the German Empire have very much of the same views, including our particular distaste towards Britain which is largely using us as a tool. The Germans on the other hand have offered to help us with modernizing military and have for the past decade almost been helping construct the Berlin-Baghdad railway."
    ww1_turkey.1.a: "Such kind people"
    ww1_turkey.2.t: "Black Sea Raid"
    ww1_turkey.2.d: "Enver Pasha has previously called for Admiral Souchon to maneuver in the Black Sea attacking the Russian fleet should 'a suitable opportunity present itself'. This order was not passed thrrough the normal command-chain, Souchon has taken action today by taking his preffered warship, the Goeben, now flying under our flag, and several destroyers opening fire on the shore batteriees of Sevatopol sinking several small Russian vessels later. As a result of this action the Russian Empire has declared war on us and a state of war now exists between us and the Entente."
    ww1_turkey.2.a: "God wills it"
    ww1_turkey.3.t: "Holding onto the Balkans"
    ww1_turkey.3.d: "We have decided to hold on to all of our remaining territory in the Balkan's and should any of the minor nations want a piece of our territory they will have to fight for it!"
    ww1_turkey.3.a: "We won't go without a fight..."
    ww1_turkey.4.t: "Ceding Balkan Territory"
    ww1_turkey.4.d: "Instead of holding on to our territory within the Balkans and delaying the inevitable major war between us and the Balkan states over their core territory we have instead decided to cede our territory which will make us look weak, however, we wont be losing much than prestige."
    ww1_turkey.4.a: "Oh well..."
    ww1_turkey.5.t: "Our Friend the Tsardom of Bulgaria"
    ww1_turkey.5.d: "We have recently sent diplomats to the Sofia, Bulgaria in order to improve relations with Bulgaria whom we hope will counteract Serbia's dominance and strength in the Balkans as well as providing a larger front for the Serbians. Along with Bulgaria being secured on our side, we shouldn't worry about Constnatinople being threatened and we should be able to have a direct connection to our German allies once Serbia falls."
    ww1_turkey.5.a: "Great!"
    ww1_turkey.6.t: "Aid Bulgaria"
    ww1_turkey.6.d: "In an effort to support our Bulgarian allies against their Balkan neighbors we have decided to send equipment and troops for them to use against their enemies."
    ww1_turkey.6.a: "Hopefully they can make of it"
    ww1_turkey.7.t: "Our Friend the British Empire"
    ww1_turkey.7.d: "Besides the fact that the British Empire has rather taken advantage of us somewhat, we have come to see that any war against the British is destined to fail and we would benefit more from being on their side than on the losers."
    ww1_turkey.7.a: "Better to be on the winners side"
    ww1_turkey.8.t: "Preparation for War"
    ww1_turkey.8.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_turkey.8.a: "Ok"
    ww1_turkey.9.t: "Joining the Entente"
    ww1_turkey.9.d: "In order to further solidify our friendship with the British we haave decided to join the Entente."
    ww1_turkey.9.a: "Hurrah"
    ww1_turkey.10.t: "German Military Mission"
    ww1_turkey.10.d: "History of our both nations military relations go back into almost 30 years and the German military mission has proven to be very instrumental in the modernization of how our army works. The Germans have taught us many things and forced us to reform our army to work more efficiently."
    ww1_turkey.10.a: "We are glad to learn"
    ww1_turkey.11.t: "Preparation for War"
    ww1_turkey.11.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_turkey.11.a: "Ok"
    ww1_turkey.12.t: "Declaration of Jihad"
    ww1_turkey.12.d: "Sultan Mehmed V has today officially declared a Jihad saying 'Oh Muslims. Know that our Empire is at war with the mortal enemies of Islam: the governments of Muscovy, Britain, and France. The commander of the Faithful summons you to the Jihad'."
    ww1_turkey.12.a: "The call goes out for Jihad"
    ww1_turkey.13.t: "Aiding the Senussi"
    ww1_turkey.13.d: "In an effort to do harm against our former enemies, the Kingdom of Italy, which took vast territories in Africa from us we have in turn decided to aid their enemies the Senussi Order whom are still involved in guerilla war against the Italians across Libya."
    ww1_turkey.13.a: "Lets hope they can make us of it"
    ww1_turkey.14.t: "Massive War Effort"
    ww1_turkey.14.d: "In an effort to maximize our war effort even more we have taken even more actions shifting the focus of all production toward military production."
    ww1_turkey.14.a: "Good"
    ww1_turkey.15.t: "Fortification of the Dardanelles"
    ww1_turkey.15.d: "In an effort to protect Istanbul from a possible larger naval force, particularly that of a possible British/French united fleet, we have decided to increase fortification of the Dardanelles in order to protect our capital in case of such an operation."
    ww1_turkey.15.a: "Get to work!"
    ww1_turkey.16.t: "Fortification of Gallipoli"
    ww1_turkey.16.d: "The area of Gallipoli remains a vulnerable area where the allies could possibly launch a naval invasion, in prepartion we could built fortifications in the area to deter any possible attempts should they occur."
    ww1_turkey.16.a: "Sounds good"
    ww1_turkey.17.t: "German Military Mission Continues"
    ww1_turkey.17.d: "We have continued with the German military mission which has consistantly been aiding our army, several German commanders are now serving within the Ottoman military and general Liman von Sanders has taught us a great deal against our enemies the Russian Empire and how their forces work."
    ww1_turkey.17.a: "They are always welcome here"
    ww1_turkey.18.t: "Defense of Baghdad"
    ww1_turkey.18.d: "Should the possibility of a fall back on the Mesoptamian front happen we are starting construction of defenses in Baghdad to hold the city at all costs."
    ww1_turkey.18.a: "Good"
    ww1_turkey.19.t: "Defense of Jerusalem"
    ww1_turkey.19.d: "Should the possibility of a fall back on the Palestinian front occur we are starting construction of defenses in the important religious center of Jerusalem."
    ww1_turkey.19.a: "Good"
    ww1_turkey.20.t: "Defense of Damascus"
    ww1_turkey.20.d: "Should the possibility of a major fall back from Jerusalem occur we are starting construction of major defenses in Damascus in order to hold the city at all costs and prevent allied troops from spilling into Asia Minor."
    ww1_turkey.20.a: "Good"
    ww1_turkey.21.t: "Our Friends the Emirate of Jabal Shammar"
    ww1_turkey.21.d: "We have long remained friendly to the Emirate of Jabal Shammar, in fact we share many of the same interests and values. It has been long known that the Rashidi dynasty of the Emirate of Jabal Shammar have been long-time enemies of the Saud and vice-versa, perhaps we could somehow help them with this in the future..."
    ww1_turkey.21.a: "Friends forever"
    ww1_turkey.22.t: "Befriend Persia"
    ww1_turkey.22.d: "In a recent diplomatic mission to Persia we have realized both of our nations have shared common enemies, particularly Russia and the United Kingdom, to whom have been fighting over influence in Persia splitting it like a cake."
    ww1_turkey.22.a: "Great Results"
    ww1_turkey.23.t: "Our Enemy, Persia"
    ww1_turkey.23.d: "Persia is a relatively weak neighbor for which we should take advantage of and fulfill pan-turkism proceding to unite the rest of the Turks in Central Asia at a later date."
    ww1_turkey.23.a: "Glorious ideas"
    ww1_turkey.24.t: "Mission to Afgahnistan"
    ww1_turkey.24.d: "We have sent a mission to Afgahnistan in an attempt to create an alliance between our two nations, the entrance of Afgahnistan would be key to our war goals with a possible Afgahn invasion of British Raj."
    ww1_turkey.24.a: "Let's just hope they agree"
    ww1_turkey.2401.t: "Mission from Turkey"
    ww1_turkey.2401.d: "We have received a diplomatic mission from the Ottoman Empire which is trying to convince us to join the war on their side claiming that this is an important Jihad against their enemies of Britain calling us as loyal servants to allah to join in this fight the caliphate is involved in."
    ww1_turkey.2401.a: "Join War"
    ww1_turkey.2401.b: "We'll stay neutral"
    ww1_turkey.2402.t: "Afgahnistan Joins War"
    ww1_turkey.2402.d: "Our diplomatic mission to Afgahnistan has been a great success, the Emir of Afgahnistan has agreed to join the war and will invade India which should prove a very useful diversion and should relieve pressure on our front."
    ww1_turkey.2402.a: "Great"
    ww1_turkey.2403.t: "Afgahnistan Claims Neutrality"
    ww1_turkey.2403.d: "Our diplomatic mission to Afgahnistna has unfortunately been a failure, the Emir of Afgahnistan claims that he is payed by the British to remain neutral which is his main source of income which leaves him no choice but to remain neutral if he wants to keep the money coming."
    ww1_turkey.2403.a: "Darn"
    ww1_turkey.25.t: "Backing Jabal Shammar"
    ww1_turkey.25.d: "We have taken action and decided to back the Emirate of Jabal Shammar should they come into any conflict with their neighbors, perhaps in the future we can help them squash the Emirate of Nejd."
    ww1_turkey.25.a: "Sounds good"
    ww1_turkey.26.t: "Help Jabal Shammar Defeat Saud"
    ww1_turkey.26.d: "We have decided to back Jabal Shammar in a war against the Emirate of Nejd led by the evil House of Saud, concerning our military capabilities, Saud will certainly be squashed like a bug with us on the Rashidi's side."
    ww1_turkey.26.a: "We shall crush Saud like a bug!"
    ww1_turkey.27.t: "Working With Libyan Locals"
    ww1_turkey.27.d: "We have been working with Libyan locals in this recent war between us and Italy with many of the locals joining our defensive stature against the oncoming Italian forces."
    ww1_turkey.27.a: "We are glad to have their support"
    ww1_turkey.28.t: "Backing the Senussi Order"
    ww1_turkey.28.d: "Following our defeat in the Italo-Turkish war we may have gone home but there is still a large amount of armed forces hidden deep within Libya where the Senussi Order is continuing to operate against the Italian forces. We are going to back them in an effort to harm the Kingdom of Italy through subsersive means..."
    ww1_turkey.28.a: "The fight will go on"
    ww1_turkey.29.t: "Anti-CUP Stature"
    ww1_turkey.29.d: "The CUP is spreading dangerous reforms throughout the Empire and subjecting the Empire to westernization which should not be tolerated, the Sultan also no longer has any power. This must be changed, we must be brought back to good old days."
    ww1_turkey.29.a: "Ok"
    ww1_turkey.30.t: "Anti-CUP Coup"
    ww1_turkey.30.d: "The Young Turks have recently been overthrown by the masses whom have reinstalled the Sultan's ability to execute absolute rule which was removed by the Young Turks in 1908."
    ww1_turkey.30.a: "Glorious"
    ww1_turkey.31.t: "Abolishing the Constitution"
    ww1_turkey.31.d: "Going further along with purging what remains of the Young Turks we have any of their reforms."
    ww1_turkey.31.a: "Good"
    #ww1_turkey.32.t:0 ""
    #ww1_turkey.32.d:0 ""
    #ww1_turkey.32.a:0 ""
    ww1_turkey.33.t: "Restoring the Caliphate"
    ww1_turkey.33.d: "We have taken more action and reinstating true power to the Caliph making the Caliphate an influential part of the Muslim world rather than a figurehead with no true power."
    ww1_turkey.33.a: "Great"
    ww1_turkey.34.t: "Pro-CUP"
    ww1_turkey.34.d: "The Committee of Union and Progress has very progressive ideas for the Empire to follow with plans of reform which should hopefully return our country into its rightful place in the sun making it a great power once again."
    ww1_turkey.34.a: "The future is bright"
    ww1_turkey.35.t: "Raid on the Sublime Porte"
    ww1_turkey.35.d: "Today a coup d'état was carried out by a number of Committe of Union and Progess (Young Turks) members led by Enver Pasha and Tallat Pasha, whom made a surprise raid on the central Ottoman government buildings, the Sublime Porte. During the coup, the Minister of the Navy, Nazim Pasha was assassinated and the Grand Vizier, Kamil Pasha has been forced to resign. \N\N With the fall of the former government, the new government has fallen into the hands of the Young Turks who are now under the leadership of the triumvirate or the 'Three Pashas', made up of Enver, Talaat, and Djemal Pasha."
    ww1_turkey.35.a: "Changes will come"
    ww1_turkey.36.t: "Reforms Part I"
    ww1_turkey.36.d: "Going along with their promises the Committee of Union and Progress now in power has begun to perform reforms within the Empire which will hopefully make our country great again and worthy enough to be next to the rest of the great powers."
    ww1_turkey.36.a: "Good"
    ww1_turkey.37.t: "Reforms Part II"
    ww1_turkey.37.d: "Going along with their promises the Committee of Union and Progress now in power has begun to perform reforms within the Empire which will hopefully make our country great again and worthy enough to be next to the rest of the great powers."
    ww1_turkey.37.a: "Good"
    ww1_turkey.38.t: "Reforms Part III"
    ww1_turkey.38.d: "Going along with their promises the Committee of Union and Progress now in power has begun to perform reforms within the Empire which will hopefully make our country great again and worthy enough to be next to the rest of the great powers."
    ww1_turkey.38.a: "Good"
    ww1_turkey.39.t: "Turkish Nationalism"
    ww1_turkey.39.d: "With the Young Turks coming into power, the empire has officially adopted a more nationalistic ideology and leaders, mainly Enver Pasha, have been promoting ideas of Pan-Turkism with several pan-Turkic movements arising."
    ww1_turkey.39.a: "Great"
    ww1_turkey.40.t: "Ottoman Identity"
    ww1_turkey.40.d: "With the entrance of the CUP into power, Ottomanism which had previously remained dormant has enjoyed a revival. The idea promotes equality among all the ethnicities of the empire regardless of their religion making all subjects equal before the law."
    ww1_turkey.40.a: "United as one"
    ww1_turkey.41.t: "Armenians in the Ottoman Empire"
    ww1_turkey.41.d: "Tensions between Armenians and Turks have risen to a new level. Some Armenians in the region have actively been siding with the Russians, and Enver Pasha's has released 'Directive 8682' on 'Increased security and precautions' to all military units calling for a removal of all ethnic Armenians serving in Ottoman forces from their posts and for their demobilization. "
    ww1_turkey.41.a: "Quite drastic."
    ww1_turkey.42.t: "Anglo-Ottoman Convention of 1913"
    ww1_turkey.42.d: "The Anglo-Ottoman Convention of 1913 was an agreement between the Sublime Porte of the Ottoman Empire and the Government of the United Kingdom which defined the limits of the Ottoman jurisdiction in the area of the Persian Gulf with respect to Kuwait, Qatar, and Bahrain, and the Shatt al-'Arab. Signed, but never ratified, the long-lasting impact of the agreement was that of the status of Kuwait."
    ww1_turkey.42.a: "Alright"
    ww1_turkey.43.t: "Earth under Burdur Rumbles"
    ww1_turkey.43.d: "Today on 3rd October, 1914, an earthquake struck BUrdur at 00:007 local time. Appearing to be a 7. on the surface wave magniture scale, with a maximum intensity of a IX on the Mercalli intensity scale. The earthquake centered near Lake Burdur in southwestern Anatolia destroying more than 17,000 homes and causing 2,344 casualties. Nearly 100% of the homes in Burdur were destroyed."
    ww1_turkey.43.a: "How unfortunate"
    ww1_turkey.44.t: "Armenian congress at Erzurum"
    ww1_turkey.44.d: "The Armenian congress at Erzurum, held from the end of July to AUgust 2, 1914, was a watershed event where the representatives of the Committee of Union and Progress party requested the Armenian Revolutionary Federation incite a rebellion of Russian Armenians against the Tsarist regime in order to faciliate the conquest of Transcaucasia in the event of war with ww1_russia. However the Armenians declined to attempt to force their compatriots to incite a rebellion in the Russian Empire."
    ww1_turkey.44.a: "Those Armenians..."
    ww1_turkey.45.t: "1st Zeitun Resistance"
    ww1_turkey.45.d: "The Armenian militia of Hunchaks of the city of Zeitun have resisted with an armed conflict which has started today on 30 August. Reports say there are around 20,000 armed Armenian Militia, our troops are moving there right now and will crush these rebellious scum."
    ww1_turkey.45.a: "Rebellious Scum..."
    ww1_turkey.46.t: "2nd Zeitun Resistance"
    ww1_turkey.46.d: "The Armenian militia of the Hunchaks which had previously rebelled on 30 August and had been crushed have once again risen up in the city of Zeitun, none-the-less they shall be crushed once more like in the past."
    ww1_turkey.46.a: "They stand no chance"
    ww1_turkey.47.t: "Urfa Resistance"
    ww1_turkey.47.d: "There has been reported Armenian resistance in Urfa, Armenians have put up quite a bit of resistance against our forces however are expected to ultimately be crushed as the Zeitun rebellion has been."
    ww1_turkey.47.a: "Death to them"
    ww1_turkey.48.t: "Tehcir Law"
    ww1_turkey.48.d: "The Tehcir Law otherwise known as the Relocation and Resettlement Law has been passed by the Ottoman Parliament today on 27 May, 1915 authorizing the deportation of the Empire's rebellious and anne frankely scum population."
    ww1_turkey.48.a: "This will teach them a lesson!"
    ww1_turkey.49.t: "Siege of Van"
    ww1_turkey.49.d: "An group of Armenian militia has risen up today on 19 April, 1915, and taken control of the city of Van. There are around 2,000 miltia in the city which are currently under siege from our forces."
    ww1_turkey.49.a: "They shall be crushed"
    ww1_turkey.50.t: "Treaty of Daan"
    ww1_turkey.50.d: "Today on 9 October, 1911, at Daan in the Yemen Vilayet, the Treaty of Daan has been signed by a representative of the Sultan and Imam Yahya Muhammad Hamid ed-Din, the Zaydi Imam of Yemen which is supposed to expand Yemen's autonomy in the Ottoman Empire. According to the treaty, the imamate was to be governed by sharia law and the imam is to be given the power to appoint governors and judges as well as collect taxes, while remaining under Ottoman authority."
    ww1_turkey.50.a: "Alright"
    ww1_turkey.51.t: "Ottoman general election, 1912"
    ww1_turkey.51.d: "The early general elections have been held in April 1912, with the ruling Committee of the Union and Progress winning a stunning 2269 of the 275 seats in the Chamber of Deputes whilst the opposition party, the Liberal Entente, won only the remaining six seats."
    ww1_turkey.51.a: "What a sweeping victory."
    ww1_turkey.52.t: "1912 coup d'état"
    ww1_turkey.52.d: "Today on 17 July, 1912, there has been a reported military coup in the country against the Committee of Union and Progress (CUP) government which has recently been elected. The coup has been carried out by a group of military officers calling themselves the 'Saviour Officers' who are the military wing of the Liberal Entente becoming the main opposition party following the 1912 election."
    ww1_turkey.52.a: "What a politically volatile environment"
    ww1_turkey.53.t: "Albanian Revolt of 1912"
    ww1_turkey.53.d: "Reported today was yet another Albanian revolt in a series of numerous revolts during the recent years, apparently this time due to changes for the Albanians introduced by the Young Turks who have increases taxes, conscription for Albanians, and have become disarming the Albanian civil population."
    ww1_turkey.53.a: "Those damn Albanians!"
    ww1_turkey.54.t: "Albanian Revolt of 1910"
    ww1_turkey.54.d: "There has been a revolt today in Albania in reaction to the new centralization policies of the Young Turk Otoman government situated in Albania. Rebels have been supposedly supported by the Kingdom of Serbia. Martial law has been declared in the area following the killing of an Ottoman commander, insurgents blocking the railway, and Albanian attaacks on Ottomans in Pristine and Ferizovik."
    ww1_turkey.54.a: "How rude"
    ww1_turkey.55.t: "Albanian Revolt of 1911"
    ww1_turkey.55.d: "There has been another revolt in Albania this year which has started today on 24 March, 1911. It is said the Kingdom of Montenegro has supported the rebellion with the main headquarters of the rebels in Montenegro and Montenegro providing weapons for the insurgents. It is also said the King of Montenegro has promised to support them with arms and to provide a shelter to their families. All the while telling us that they were observing 'the strictest neutrality' while being clearly involved! \n\n It is likely King Nikola's strategy is to stimulate unrest in Northern Albania to intervene and annex more territory for Montenegro."
    ww1_turkey.55.a: "They shall pay"
    ww1_turkey.56.t: "Karak Revolt"
    ww1_turkey.56.d: "The Karak revolt was an uprising against Ottoman authority in the tranasjordanian town of Al-Karak which erupted on 4 December, 1910. The revolt came after Sami Pasha, the governor of Damascus, wanted to apply the same measures of conscription, taxation, and disarmament to the inhabitants of Al-Karak that previously provoked the Hauran Druze Rebellion. Luckily the rebellion has been brutally supressed after a random massacre and ten revolt leaders being executed, although it has greately angered the Karaki's."
    ww1_turkey.56.a: "Damn"
    ww1_turkey.57.t: "Montenegrin Independence Proclaimed"
    ww1_turkey.57.d: "Today on 28 August 1910, during the celebration of Prince Nicolas's jubilee, Prince Nicholas assumed the title of king, in accordance with a petition from the Skupstina officially making the Montenegro and independent entity seperate from the Ottoman Empire for good."
    ww1_turkey.57.a: "Damn!"
    ww1_turkey.58.t: "Treaty of Mudros Signed"
    ww1_turkey.58.d: "With the war turning against the side of the Central Powers and our troops largely in rags demoralized retreating more every day we have had no choice but to sign an armistice with the Entente. The armistice was signed today by the Minister of Marine Affairs, Rauf Bey and the British Admiral, Somerset Arthur Gough-Calthorpe, on board the HMS Agamemnon in Moudros harbor on the Greek island of Lembnos. As part of the several conditions we have had to surrender remaining garrisons outside of Anatolia and grant the Entente the right to occupy forts controlling the Straits of the Dardanelles and the Bosporus; and the right to occupy the same 'in case of disorder' any Otoman territory in the event of a threat to the Entente's security. We have had to forcibly demobilize the air force and army and make all ports, railways, and other strategic points made available for use by the allies."
    ww1_turkey.58.a: "We are broken!"
    ww1_turkey.58.b: "We must continue the fight"
    ww1_turkey.59.t: "Treaty of Mudros Signed"
    ww1_turkey.59.d: "With the war turning against the side of the Central Powers and our troops largely in rags demoralized retreating more every day we have had no choice but to sign an armistice with the Entente. The armistice was signed today by the Minister of Marine Affairs, Rauf Bey and the British Admiral, Somerset Arthur Gough-Calthorpe, on board the HMS Agamemnon in Moudros harbor on the Greek island of Lembnos. As part of the several conditions we have had to surrender remaining garrisons outside of Anatolia and grant the Entente the right to occupy forts controlling the Straits of the Dardanelles and the Bosporus; and the right to occupy the same 'in case of disorder' any Otoman territory in the event of a threat to the Entente's security. We have had to forcibly demobilize the air force and army and make all ports, railways, and other strategic points made available for use by the allies."
    ww1_turkey.59.a: "We are broken!"
    ww1_turkey.60.t: "Mehmed V Dies"
    ww1_turkey.60.d: "The Sultan Mehmed V tragically passed away today on the 3rd of July 1918 at the age of 73. During his Reign since the forced abdication of his Brother Abdulhamid II by the Young Turk Revolution in 1908, Mehmed V has had no 'real power' he has been mainly a figure head. His main political actions was declaring a Jihad, agaisnt the Entente Powers on November 14th 1914 follwing the Ottoman Empire's decision ot join the war on the side of the Central Powers. None-the-less he will be mourned."
    ww1_turkey.60.a: "A tragic loss for the nation"
    ww1_turkey.61.t: "The Treaty of Sèvres"
    ww1_turkey.61.d: "The Istanbul government has signed the Treaty of Sèvres. Its terms concede territory, place the Straits under international supervision, and grant Greece a position in western Anatolia and Thrace. The Grand National Assembly in Ankara rejects the treaty as a settlement imposed without the nation's consent."
    ww1_turkey.61.a: "Ankara will not accept partition."
    ww1_turkey.62.t: "War on the Western Front"
    ww1_turkey.62.d: "Ankara's reorganized forces face the Greek army across western Anatolia. The local resistance has become a war between armies, while the other Allied powers watch the fighting without joining the front directly."
    ww1_turkey.62.a: "Defend Anatolia."
    ww1_turkey.63.t: "Treaty of Moscow"
    ww1_turkey.63.d: "The government in Ankara and Soviet Russia have reached an agreement. Both reject the imposed postwar order; Moscow recognizes the national movement and the parties set out the principles of their northeastern frontier."
    ww1_turkey.63.a: "Secure the eastern border."
    ww1_turkey.64.t: "Greek Troops Land at Izmir"
    ww1_turkey.64.d: "Greek forces have landed at Izmir. The occupation alarms Anatolia and encourages local defense associations to coordinate their opposition to the postwar settlement."
    ww1_turkey.64.a: "The occupation will be resisted."
    ww1_turkey.65.t: "The Treaty of Batum"
    ww1_turkey.65.d: "Ottoman representatives and the Caucasian governments settle their wartime claims around Batum. The agreement belongs to the final months of the Great War, before the later national movement and its frontier treaties."
    ww1_turkey.65.a: "Record the settlement."
    ww1_turkey.66.t: "The Treaty of Lausanne"
    ww1_turkey.66.d: "The peace conference has signed a new treaty recognizing Turkish sovereignty. The rejected Treaty of Sèvres is superseded, and the frontiers won or negotiated by Ankara become the basis of a durable postwar settlement."
    ww1_turkey.66.a: "A sovereign peace."
    ww1_turkey.67.t: "Resistance in Cilicia"
    ww1_turkey.67.d: "Local resistance to French occupation continues in the southern towns and countryside. Ankara coordinates the movement while concentrating its regular army against Greece."
    ww1_turkey.67.a: "Support the southern front."
    ww1_turkey.68.t: "The Eastern Campaign"
    ww1_turkey.68.d: "The eastern army advances against Armenian forces while Ankara seeks a defensible Caucasian frontier. The campaign and its diplomacy will decide the fate of Kars."
    ww1_turkey.68.a: "Secure the east."
    ww1_turkey.69.t: "The Cilician Ceasefire"
    ww1_turkey.69.d: "Fighting in Cilicia slows as both sides explore a settlement. France must decide how long it will maintain a costly occupation while Ankara needs its resources on the western front."
    ww1_turkey.69.a: "Continue the talks."
    ww1_turkey.70.t: "The Franco-Turkish Agreement"
    ww1_turkey.70.d: "France and the government in Ankara agree on a southern boundary and the withdrawal of French troops from Cilicia. Hatay remains under French administration, leaving one question unsettled."
    ww1_turkey.70.a: "The southern front is settled."

    ww1_turkey.71.t: "Explosion at Haidar Pasha Station"
    ww1_turkey.71.d: "Constantinople's principle train station at Haidar Pasha on the Bosporus has been rocked by a huge explosion, caused either by the hasty handling of ordnance or the efforts of British agents. Considerable amounts of ammunition and oil have been unfortunately lost in the inferno, this has severely hampered the war effort in the process."
    ww1_turkey.71.a: "A catastrophe for the Ottoman war effort"
