    aidumb.5.t:0 "Command in the Middle East"
    aidumb.5.d:0 "The War Office is considering bringing the Palestinian and Mesopotamian commands directly under British administration. This would place their territories and forces under a common authority, while the alternative is to retain the present arrangement."
    aidumb.5.a:0 "Assume direct administration."
    aidumb.5.b:0 "Retain the existing commands."
