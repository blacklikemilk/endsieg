l_english:

#

# WW1 Britain #
    ww1_britain.1.t:0 "Rivalry with Germany"
    ww1_britain.1.d:0 "German naval expansion has deepened concern over the security of British waters. Ministers are reviewing relations with Berlin as public suspicion of German ambitions grows."
    ww1_britain.1.a:0 "Protect our position at sea."
    ww1_britain.2.t:0 "Preparations for War"
    ww1_britain.2.d:0 "The European crisis is forcing the government to prepare for a wider conflict. The services are reviewing mobilisation and supply arrangements while ministers consider Britain's obligations."
    ww1_britain.2.a:0 "Complete the preparations."
    ww1_britain.3.t: "British Neutrality"
    ww1_britain.3.d:0 "The government has declared that Britain will remain outside the present conflict. Ministers will continue to watch the fighting and defend British interests as the situation develops."
    ww1_britain.3.a:0 "Maintain our neutrality."
    ww1_britain.4.t:0 "Britain Enters the War"
    ww1_britain.4.d:0 "The government has ordered British forces into the war against Germany. Preparations are under way to support France and defend the interests for which Britain has taken up arms."
    ww1_britain.4.a:0 "Carry out the war plans."
    ww1_britain.5.t:0 "The Belgian Guarantee"
    ww1_britain.5.d:0 "German action against Belgium has brought the question of intervention before the cabinet. Ministers argue that Britain's treaty obligations and the security of the Channel require a response. Our forces are preparing for war."
    ww1_britain.5.a:0 "Honour the guarantee."
    ww1_britain.6.t:0 "The North Sea Blockade"
    ww1_britain.6.d:0 "The navy is restricting shipping bound for Germany and its partners. By cutting imports of food and raw materials, the Admiralty hopes to weaken the enemy's ability to continue the war."
    ww1_britain.6.a:0 "Enforce the blockade."
    ww1_britain.7.t:0 "Conscription in Ireland"
    ww1_britain.7.d:0 "The government has extended its recruitment efforts to Ireland despite strong opposition. The army's need for men has brought ministers into renewed conflict with Irish political and religious leaders."
    ww1_britain.7.a:0 "The army needs reinforcements."
    ww1_britain.8.t:0 "The Irish Conscription Dispute"
    ww1_britain.8.d:0 "Opposition to conscription has united much of Irish public life against the government. Ministers have decided to abandon the measure, hoping to prevent another confrontation while Britain remains at war."
    ww1_britain.8.a:0 "We cannot afford a new crisis."
    ww1_britain.9.t:0 "An Appeal to Scandinavia"
    ww1_britain.9.d:0 "Our diplomats have asked the Scandinavian governments to restrict their dealings with Germany. Their cooperation would strengthen the blockade, though each must consider its own security and trade."
    ww1_britain.9.a:0 "Seek their cooperation."
    ww1_britain.901.t: "Scandinavia Refuses to Break with Germany"
    ww1_britain.901.d: "The Scandinavian monarchs have recently held a conference in Copenhagen and have ultimately declined to break off diplomatic and trade relations with Germany because of the 'ruthless' submarine warfare."
    ww1_britain.901.a: "Damn!"
    ww1_britain.902.t: "Scandinavia Agrees to Break with Germany"
    ww1_britain.902.d: "The Scandinavian monarchs have recently held a conference in COpenhagen and have ultimately agreed to break off diplomatic and trade relations with Germany because of the ruthless submarine warfare."
    ww1_britain.902.a: "Great"
    ww1_britain.10.t:0 "Relations with Portugal"
    ww1_britain.10.d:0 "The government is strengthening its contacts with Portugal. The longstanding alliance and growing disputes over German shipping may provide a basis for closer wartime cooperation."
    ww1_britain.10.a:0 "Consult Lisbon."
    ww1_britain.11.t:0 "Portugal Joins the Entente"
    ww1_britain.11.d:0 "Portugal has entered the war beside the Entente. The decision follows mounting disputes with Germany and closer cooperation with Britain."
    ww1_britain.11.a:0 "Welcome our Portuguese ally."
    ww1_britain.12.t:0 "An Offer to Bulgaria"
    ww1_britain.12.d:0 "Our envoys have proposed territorial concessions to secure Bulgarian support. Ministers hope to protect Serbia and threaten the Ottoman position, but Sofia must weigh our offer against the promises made by Berlin."
    ww1_britain.12.a:0 "Present the terms to Sofia."
    ww1_britain.1201.t:0 "A British Offer"
    ww1_britain.1201.d:0 "British envoys have offered support for Bulgarian claims in Serbia and around Edirne in return for joining their alliance. The terms must be weighed against the rival promises from Germany and the risks of another Balkan campaign."
    ww1_britain.1201.a:0 "Accept the British terms."
    ww1_britain.1201.b:0 "Decline the offer."
    ww1_britain.1202.t:0 "Bulgaria Accepts"
    ww1_britain.1202.d:0 "Sofia has accepted our offer of territorial concessions. The agreement brings Bulgaria closer to the Entente and improves our position in the Balkans."
    ww1_britain.1202.a:0 "Prepare further cooperation."
    ww1_britain.1203.t:0 "Bulgaria Refuses"
    ww1_britain.1203.d:0 "The Bulgarian government has rejected our proposal. Our diplomats have been unable to reconcile Sofia's territorial ambitions with the concessions our partners are willing to make."
    ww1_britain.1203.a:0 "Consider our remaining options."
    ww1_britain.13.t:0 "Bulgaria Joins the Entente"
    ww1_britain.13.d:0 "Bulgaria has entered the war beside the Entente. Its forces will strengthen the Balkan front and place further pressure on the Ottoman Empire."
    ww1_britain.13.a:0 "Coordinate the Balkan campaign."
    ww1_britain.14.t:0 "An Approach to Washington"
    ww1_britain.14.d:0 "Our representatives are seeking closer cooperation with the United States. American trade and financial support are valuable to the war effort, though Washington remains cautious about direct involvement."
    ww1_britain.14.a:0 "Continue the discussions."
    ww1_britain.15.t:0 "America Enters the War"
    ww1_britain.15.d:0 "The United States has entered the conflict beside the Entente. American resources and manpower promise to strengthen the alliance, though transporting and preparing its armies will take time."
    ww1_britain.15.a:0 "Welcome our American partners."
    ww1_britain.16.t:0 "Defences for the Suez Canal"
    ww1_britain.16.d:0 "New defensive works have been prepared around the Suez Canal. Protecting this route is essential to communications with India and the movement of imperial supplies."
    ww1_britain.16.a:0 "Secure the canal."
    ww1_britain.17.t:0 "The Persian Oilfields"
    ww1_britain.17.d:0 "British forces are securing the approaches to the southern Persian oilfields. The government considers these supplies and the route to India essential to its position in the region."
    ww1_britain.17.a:0 "Protect the oilfields."
    ww1_britain.18.t:0 "The Ottoman Battleships"
    ww1_britain.18.d:0 "The Admiralty has requisitioned the battleships being built for the Ottoman navy. They will strengthen the Royal Navy, but their seizure has caused anger in Constantinople, where public subscriptions helped pay for the ships."
    ww1_britain.18.a:0 "The fleet must come first."
    ww1_britain.19.t:0 "The Arab Revolt"
    ww1_britain.19.d:0 "Sharif Hussein of Mecca has raised a revolt against Ottoman rule. British representatives have offered support, hoping to divert Ottoman forces and strengthen their position in the Arab provinces."
    ww1_britain.19.a:0 "Support the revolt."
    ww1_britain.20.t:0 "Industrial Investment in India"
    ww1_britain.20.d:0 "British-backed investment is supporting industrial development in India. The programme will expand productive capacity and strengthen the supply network of the Empire."
    ww1_britain.20.a:0 "Proceed with the investment."
    ww1_britain.21.t:0 "Industrial Investment in South Africa"
    ww1_britain.21.d:0 "British-backed investment is supporting industrial development in South Africa. The programme will expand productive capacity and strengthen the supply network of the Empire."
    ww1_britain.21.a:0 "Proceed with the investment."
    ww1_britain.22.t:0 "Industrial Investment in Australia"
    ww1_britain.22.d:0 "British-backed investment is supporting industrial development in Australia. The programme will expand productive capacity and strengthen the supply network of the Empire."
    ww1_britain.22.a:0 "Proceed with the investment."
    ww1_britain.23.t:0 "Industrial Investment in Canada"
    ww1_britain.23.d:0 "British-backed investment is supporting industrial development in Canada. The programme will expand productive capacity and strengthen the supply network of the Empire."
    ww1_britain.23.a:0 "Proceed with the investment."
    ww1_britain.24.t:0 "Troops from India"
    ww1_britain.24.d:0 "Indian recruiting offices and military authorities have assembled further contingents for overseas service. Their deployment will strengthen the forces available for the wider war."
    ww1_britain.24.a:0 "Prepare the contingents for service."
    ww1_britain.25.t:0 "The Dardanelles Proposal"
    ww1_britain.25.d:0 "The Admiralty has proposed an operation against the Dardanelles. Its supporters hope that forcing the straits and threatening Constantinople can weaken the Ottoman war effort and open a route to Russia."
    ww1_britain.25.a:0 "Prepare the operation."
    ww1_britain.26.t:0 "The Gallipoli Landings"
    ww1_britain.26.d:0 "Our troops have landed on the Gallipoli peninsula. Difficult terrain and Ottoman resistance are hampering the advance as commanders attempt to secure the beaches and reach their objectives."
    ww1_britain.26.a:0 "Support the landing force."
    ww1_britain.2601.t:0 "Reinforcements for Gallipoli"
    ww1_britain.2601.d:0 "Fresh troops and supplies have reached the forces at Gallipoli. Commanders hope that these reinforcements will allow them to improve their position against the Ottoman defenders."
    ww1_britain.2601.a:0 "Bring the reinforcements ashore."
    ww1_britain.27.t:0 "The Canadian Expeditionary Force"
    ww1_britain.27.d:0 "Canadian troops have arrived for service on the Western Front. Their formations will join the growing imperial effort in France."
    ww1_britain.27.a:0 "Welcome the Canadian contingent."
    ww1_britain.28.t: "The Baltic Project"
    ww1_britain.28.d:0 "Admiral Fisher proposes landing an army on Germany's Baltic coast. The operation could threaten Berlin directly, but would require a specialised fleet and secure command of the approaches."
    ww1_britain.28.a:0 "Examine the proposal."
    ww1_britain.29.t:0 "Preparing the Baltic Expedition"
    ww1_britain.29.d:0 "The Admiralty is assembling the ships required for a Baltic landing. Landing craft, minesweepers and supporting warships must be prepared before the army can attempt the operation."
    ww1_britain.29.a:0 "Assemble the expedition."
    ww1_britain.30.t:0 "The Pomeranian Landings"
    ww1_britain.30.d:0 "The expedition has begun landing on the Pomeranian coast. Commanders must secure the beachhead and bring supplies ashore before attempting an advance into the German interior."
    ww1_britain.30.a:0 "Secure the landing grounds."
    ww1_britain.301.t:0 "Reinforcements in Pomerania"
    ww1_britain.301.d:0 "The first reinforcements have reached the Pomeranian beachhead. Russian formations are joining the expedition as commanders prepare for further operations."
    ww1_britain.301.a:0 "Strengthen the beachhead."
    ww1_britain.302.t:0 "The Baltic Expedition Reinforced"
    ww1_britain.302.d:0 "The remaining reinforcements have arrived in Pomerania. The expedition must now turn its foothold on the coast into a sustainable campaign."
    ww1_britain.302.a:0 "Prepare the advance."
    ww1_britain.31.t:0 "The Union of South Africa"
    ww1_britain.31.d:0 "The Union of South Africa has been established, bringing the Cape, Natal, Transvaal and Orange River colonies under a common government. The new dominion begins its work within the British Empire."
    ww1_britain.31.a:0 "Recognise the Union."
    ww1_britain.32.t:0 "Unity in Wartime"
    ww1_britain.32.d:0 "The outbreak of war has brought a broad show of support for the government. Political and social divisions remain, but the immediate defence of the country has drawn many opponents together."
    ww1_britain.32.a:0 "Organise the national effort."
    ww1_britain.33.t:0 "The Military Service Act"
    ww1_britain.33.d:0 "Parliament has extended compulsory military service to meet the army's growing requirements. Recruitment offices across Great Britain are preparing to call up the men covered by the new law, while Ireland remains outside its provisions."
    ww1_britain.33.a:0 "Reinforce the armies."
    ww1_britain.34.t:0 "The Defence of the Realm Act"
    ww1_britain.34.d:0 "Parliament has granted the government wider powers for the conduct of the war. Ministers can requisition property, regulate essential activity and restrict information considered harmful to national defence."
    ww1_britain.34.a:0 "Put the emergency measures into effect."
    ww1_britain.35.t:0 "Industry for the War"
    ww1_britain.35.d:0 "The government has ordered a further concentration of industrial resources on military production. Factories and shipyards face new demands as the services seek the material needed to sustain the war."
    ww1_britain.35.a:0 "Maintain the flow of supplies."
    ww1_britain.36.t:0 "The Army Takes Priority"
    ww1_britain.36.d:0 "Army requirements have been given priority in the allocation of labour and material. Ministers hope that stronger forces can bring the campaign to a decision."
    ww1_britain.36.a:0 "Carry out the programme."
    ww1_britain.37.t:0 "Supplying the Campaign"
    ww1_britain.37.d:0 "Further deliveries are being directed to the fighting armies. Civilian departments have been instructed to accommodate the latest military demands."
    ww1_britain.37.a:0 "Carry out the programme."
    ww1_britain.38.t:0 "Sustaining the Front"
    ww1_britain.38.d:0 "The services have secured another allocation of industrial resources. The strain on civilian life is growing, but the government considers the needs of the front paramount."
    ww1_britain.38.a:0 "Carry out the programme."
    ww1_britain.39.t:0 "Civilian Supplies"
    ww1_britain.39.d:0 "The cabinet has reviewed shortages at home and the competing requirements of the services. Measures to protect civilian supply are being put into effect."
    ww1_britain.39.a:0 "Carry out the programme."
    ww1_britain.40.t:0 "The Civilian War Effort"
    ww1_britain.40.d:0 "Ministers are strengthening the organisation of civilian supplies and essential services. Maintaining public confidence has become an urgent part of sustaining the war."
    ww1_britain.40.a:0 "Carry out the programme."
    ww1_britain.41.t:0 "Relief at Home"
    ww1_britain.41.d:0 "The government is directing further attention to the burden carried by civilian households. Officials hope that more dependable supplies will ease the tensions created by mobilisation."
    ww1_britain.41.a:0 "Carry out the programme."
    ww1_britain.42.t:0 "The Death of Edward VII"
    ww1_britain.42.d:0 "King Edward VII has died. His son succeeds him as George V while preparations begin for the late king's funeral."
    ww1_britain.42.a:0 "The King is dead. Long live the King."
    ww1_britain.43.t:0 "The Loss of Kitchener"
    ww1_britain.43.d:0 "HMS Hampshire has struck a mine while carrying Lord Kitchener and his staff to Russia. The ship has sunk off Orkney, and the loss of the Secretary of State for War has shocked the country."
    ww1_britain.43.a:0 "Mourn the dead."
    ww1_britain.44.t:0 "The Easter Rising"
    ww1_britain.44.d:0 "Armed republicans have seized positions in Dublin and proclaimed an Irish Republic. British forces are being assembled to retake the city as ministers assess the extent of the uprising."
    ww1_britain.44.a:0 "Restore control of Dublin."
    ww1_britain.45.t: "The Dervish War"
    ww1_britain.45.d:0 "The struggle against Mohammed Abdullah Hassan and the Dervish movement continues in Somaliland. The campaign has proved difficult to conclude, tying down forces far from the centres of imperial power."
    ww1_britain.45.a:0 "Review the Somaliland campaign."
    ww1_britain.46.t:0 "The Senussi Challenge"
    ww1_britain.46.d:0 "Senussi forces have asserted control over the territory claimed by our administration in Libya. With few troops available, local officials ask whether to withdraw or commit the resources needed to hold the area."
    ww1_britain.46.a:0 "Withdraw from the exposed positions."
    ww1_britain.46.b:0 "Reinforce the administration."
    ww1_britain.47.t: ""
    ww1_britain.47.d: ""
    ww1_britain.47.a: ""
