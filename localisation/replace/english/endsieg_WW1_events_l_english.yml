l_english:

# Industrialisation #
    industrialisation.1.t: "Traditionalists Argue Against Industrialisation"
    industrialisation.1.d: "Traditionalists in the government have argued against our move towards a industrial society arguing that we have lived for hundreds of years on an agrarian based economy and that there is no need to move towards an industrial society now. \n\n None-the-less the reform will be going through but the traditionalists will keep the government somewhat divided for the time being..."
    industrialisation.1.a: "Oh well"
    industrialisation.2.t: "Unrest Amongst the Workers"
    industrialisation.2.d: "With Industrialisation in our country moving forward ever so slowly it has not come without its troubles as many factory owners have started instead of searching for skilled workers, taken the unskilled workers for cheaper labor. Due to this there has been growing unrest in the new working class, whilst not quite serious yet the bubble will burst eventually..."
    industrialisation.2.a: "We are good for now!"
    industrialisation.3.t: "Pre-Industrial Society"
    industrialisation.3.d: "We are now considered by the world to be a Pre-Industrial Society and have effectively moved away from being the Agrarian Society we once were. Of course our path to this stage has not come without its troubles but the path ahead of us is still long and windy."
    industrialisation.3.a: "One Hurrah for Industrialisation!"
    industrialisation.4.t: "Railway Construction"
    industrialisation.4.d: "In order to increase the efficiency of goods being transported across the country our government has taken the initiative to start construction of a major railway, this alone should employ many workers however the costs will be quite high though worth it in the end if we plan to move further."
    industrialisation.4.a: "Start working!"
    industrialisation.5.t: "People's Mentality"
    industrialisation.5.d: "Despite our efforts to start industrialisation reforms many of our people still have a backwards mentality toward industrialisation. Many of our rich capitalists still prefer to invest in land rather than buisnesses, they see investments in industry risky making land purchases much more appealing."
    industrialisation.5.a: "This is a bad mentality for the long run!"
    industrialisation.6.t: "Early Industrial Society"
    industrialisation.6.d: "We are now considered by the world to be an Early Industrial Society, effectively moving away from our former status as a Pre-Industrial Society. Now we can be considered to be  more like some of the European nations that have progressed somewhat significantly in terms of industry."
    industrialisation.6.a: "Two Hurrahs for Industrialisation!"
    industrialisation.7.t: "Major Workers Strike"
    industrialisation.7.d: "Issues from the past with unskilled workers being employed for cheap wages over the skilled have not been forgotten. A major workers strike has been held in one of our major industrial areas where workers have been protesting for higher wages and less work hours which have put a strain on our production output, if this isn't resolved quick it will turn into a problem."
    industrialisation.7.a: "Give them what they want..."
    industrialisation.8.t: "Protests from Traditionalists"
    industrialisation.8.d: "As we start to move forward even further the traditionalists have not gone away by any means, there is still a large struggle not only with some backwards politcians but the people themselves that have the same tradtionalist mentaility refusing change!"
    industrialisation.8.a: "Darn"
    industrialisation.9.t: "Population Through the Years"
    industrialisation.9.d: "Due to the fact that our nation does not have enough land suited for farming required to feed our growing population is making things quite difficult, many say that if we continue going forward we will have to continually rely on other nations for food products."
    industrialisation.9.a: "They have a point..."
    industrialisation.10.t: "Basic Industrial Society"
    industrialisation.10.d: "We are now considered by the world to be a Basic Industrial Society, like most European nations, we are just below the major countries."
    industrialisation.10.a: "Three Hurrahs for Industrialisation!"
    industrialisation.11.t: "Workers Strike Spirals Out of Control!"
    industrialisation.11.d: "Workers in our most industrialised region have started a strike for higher wages, less work hours, better working conditions, and universal suffrage. Whilst the strike started off small it quickly grew in size to thousands of people protesting, the local government in turn sent out an army unit to keep control of the protest where it quickly turned into a blood bath as shots were fired onto the crowd."
    industrialisation.11.a: "Not good..."
    industrialisation.12.t: "Resources Issue"
    industrialisation.12.d: "As we push even further in terms of industrialisation it is getting rather difficult as much of the resources required do not currently have or produce enough of which means our progress will be significantly slowed down for now."
    industrialisation.12.a: "Darn"
    industrialisation.13.t: "New Rising Social Class"
    industrialisation.13.d: "With our industrial growth promoting large immigration towards our cities/industrial centers we have found ourselves unequipped to handle this large urban population growth where not enough residences can be constructed in time to house enough people. Many are forced to live together in horrible conditions and then go to work in such conditions giving birth to a new social class that may be very well susceptible to revolutionary ideas...."
    industrialisation.13.a: "Frightening"
    industrialisation.14.t: "Industrial Society"
    industrialisation.14.d: "We have reached the top of the ladder and are now considered to officialy be an Industrial Society, we are now largely ahead of most countries in the world."
    industrialisation.14.a: "Four Hurrahs for Industrialisation!"
#

# WW1 Britain #
    ww1_britain.1.t: "Anti-German Sentiment"
    ww1_britain.1.d: "Ever since the death of Queen Victoria and Kaiser Wilhelm II's imperialistic and naval ambitions which threaten our nation there has been a great schism between Germany and the United Kingdom."
    ww1_britain.1.a: "Those Huns won't get ahead of us!"
    ww1_britain.2.t: "Preparation for War"
    ww1_britain.2.d: "The fuse leading to the Powder Keg has been lit, it is only a matter of time before the war breaks out for which we must prepare for the better or the worst of what it may turn into."
    ww1_britain.2.a: "Alright"
    ww1_britain.3.t: "British Neutrality"
    ww1_britain.3.d: "Although we have heavily aligned ourselves with the Entente we have declared neutrality in this conflict for the time being, whilst it doesnt mean we will remain neutral for the whole of the war, we will for now keep a watchful eye on how the war goes and may enter later."
    ww1_britain.3.a: "We will keep a safe distance for now..."
    ww1_britain.4.t: "Backing of France!"
    ww1_britain.4.d: "With the Germans violating Beglian Neutrality and going against any sort of British Interests we have taken neccesary steps to join the Entente in the war against them."
    ww1_britain.4.a: "We won't let our allies down!"
    ww1_britain.5.t: "Britain Declares War on Central Powers"
    ww1_britain.5.d: "Whilst we have previously proclaimed temporary neutrality, we have spectated the war and have now taken actions to get involved ourselves on the side of the Entente whom ultimately protects British interests."
    ww1_britain.5.a: "We will not accept German hegemony over Europe!"
    ww1_britain.6.t: "North Sea Blockade"
    ww1_britain.6.d: "In an effort to restrict the maritime supply of goods to the Central Powers, we have taken actions to blockade any convoys heading to Germany or any other Central Powers members. The German Empire heaily relies on imports to feed their population and supply their war industry, thus this should have a serious affect on their internal stability and war efficiency."
    ww1_britain.6.a: "Good"
    ww1_britain.7.t: "Conscription in Ireland Begins"
    ww1_britain.7.d: "Whilst our attempts to conscript the Irish populous have been met with serious protest and we have been on shakey terms following the Easter Rising, it is none the less neccesary as we are in dire need of more manpower to fill the ranks."
    ww1_britain.7.a: "A neccesary action"
    ww1_britain.8.t: "Irish Conscription Crisis"
    ww1_britain.8.d: "Calls for conscription in Ireland have been met with serious protest and opposition and thus we have decided to not go through with instating conscription in Ireland. Whilst it may deprive us of neccesary manpower it will be none-the-less more worthwhile and keep the nation more stable in a time where stability is neccesary to avoid revolution."
    ww1_britain.8.a: "Dissent is the last thing we need"
    ww1_britain.9.t: "Call for Scandinavia to Break with Germany"
    ww1_britain.9.d: "Like the United States has decided to break with Germany we have asked the Scandinavian monarchs, Haakon VII of Norway, Gustav V of Sweden, and Christian X of Denmark, to consider breaking with Germany. Whilst the North Sea Blockade is effective, it will never be 100% efficient if the Scandinavian nations continue to trade with Germany."
    ww1_britain.9.a: "Hopefully they will follow Americas lead"
    ww1_britain.901.t: "Scandinavia Refuses to Break with Germany"
    ww1_britain.901.d: "The Scandinavian monarchs have recently held a conference in Copenhagen and have ultimately declined to break off diplomatic and trade relations with Germany because of the 'ruthless' submarine warfare."
    ww1_britain.901.a: "Damn!"
    ww1_britain.902.t: "Scandinavia Agrees to Break with Germany"
    ww1_britain.902.d: "The Scandinavian monarchs have recently held a conference in COpenhagen and have ultimately agreed to break off diplomatic and trade relations with Germany because of the ruthless submarine warfare."
    ww1_britain.902.a: "Great"
    ww1_britain.10.t: "Our Friends Portugal"
    ww1_britain.10.d: "The Portuguese have long since remained close with us, it is well known that the Portuguese and Germany are not on good terms with some serious tension between the two when it comes to submarine warfare."
    ww1_britain.10.a: "Ok"
    ww1_britain.11.t: "Portugal Joins Entente"
    ww1_britain.11.d: "With the Portuguese and Germany facing serious tension due to Germany's decision to enact unrestricted submarine warfare, which has as a result sank many Portuguese ships, the Portuguese have ultimately decided to join the Entente."
    ww1_britain.11.a: "Great"
    ww1_britain.12.t: "Negotiations with Bulgaria"
    ww1_britain.12.d: "Bulgaria is key to success in the Balkans, should the Central Powers get Bulgaria to join them our ally Serbia will likely fall and thus Germany will be able to directly send supplies to Turkey. However, should Bulgaria join us Turkey's capital Constantinople will be severely threatened and Serbia's position furthermore reinforced. The thing is, we have unlike the Central Powers, little to offer to Bulgaria. However, we have urged Serbia to cede some of its territory to Bulgaria in hopes of getting Bulgaria to join us. However, it is not as much as the Central Powers are offering, the Bulgarians will likely not consider our offer but there is still a chance they will."
    ww1_britain.12.a: "Lets hope they will consider it"
    ww1_britain.1201.t: "Britain Offers us Deal"
    ww1_britain.1201.d: "The British have attempted to sway us to their side, they have offered some of our claims in Serbia and Edirne from the Ottoman Turks. Although it isn't as much as the Central Powers are willing to offer, would it be likely that Germany will win this war given their inability to control the seas?"
    ww1_britain.1201.a: "Accept British Deal"
    ww1_britain.1201.b: "We are not interested"
    ww1_britain.1202.t: "Bulgaria Accepts Our Offer"
    ww1_britain.1202.d: "The Bulgarians have thankfully accepted our generous offer of territorial gains, although it isn't as much as what the Central Powers were likely offering it seems they have come to their senses that we will ultimately win this war in the end."
    ww1_britain.1202.a: "Great!"
    ww1_britain.1203.t: "Bulgaria Rejects Our Offer"
    ww1_britain.1203.d: "As we have predicted, the Bulgarians have unfortunately rejected our offer of territorial gains, it is very much likely due to the fact that the Central Powers have promised far more than we could offer. As unfortunate as it is that we could not sway Bulgaria to our side we will ultimately win this war, with them or not."
    ww1_britain.1203.a: "Quite unfortunate indeed"
    ww1_britain.13.t: "Bulgaria Joins Entente"
    ww1_britain.13.d: "The Bulgarians have finally finished preparing to join the conflict and have officially declared their entrance into the Entente. With their help we will keep Turkey and Germany divided and threaten Constantinople as well as reinforcing Serbia's position for good."
    ww1_britain.13.a: "Great!"
    ww1_britain.14.t: "Our Friends America"
    ww1_britain.14.d: "Whilst the United States has declared neutrality in the European conflict they ultimately favor us far more than the Central Powers given our democratic status."
    ww1_britain.14.a: "Hopefully we can get them to join"
    ww1_britain.15.t: "USA Joins Entente"
    ww1_britain.15.d: "The United States has long since been aiding the Entente throughout the war and it ultimately any sort of neutrality they have declared has withered away over time and they have ultimately decided to join the European conflict formally."
    ww1_britain.15.a: "The tide has turned"
    ww1_britain.16.t: "Fortification of the Suez Canal"
    ww1_britain.16.d: "The Suez Canal is a critical strategic point, and thus we have taken neccesary actions to fortify the canal in case of a future war."
    ww1_britain.16.a: "It is of strategic importance"
    ww1_britain.17.t: "Securing Southern Persia"
    ww1_britain.17.d: "Given Turkey's likely entrance on the side of the Central Powers we have taken actions to secure the South Persian oilfields and the route to India."
    ww1_britain.17.a: "Good"
    ww1_britain.18.t: "Turkish Ships Incorporated into Royal Navy"
    ww1_britain.18.d: "The Turkish Ships 'Osmân-ı Evvel' and 'Reşadiye' have been incporated into the Royal Navy on the orders of Winston Churchill who does not want to risk the ships being used against us. However, given the fact that the pay for the ships was funded by public subscriptions partially, by taverns, cafes, schools, and market, this action has caused considerable ill will in the Ottoman Empire. The seizure of the ships has influenced the Ottoman public opinion of us in a seriously negative way."
    ww1_britain.18.a: "Damn"
    ww1_britain.19.t: "Arab Revolt"
    ww1_britain.19.d: "Hussein bin Ali, the Sharif of Mecca, has initiated the Arab Rebellion with the aim of securing independence from the ruling Ottoman Turks in hopes of creating a single unified Arab State. The Sharif claims that the Young Turks have violated the sacred tenets of Islam and has called upon Arab Muslims to the sacred Rebellion against the ostensibly 'impious' Ottoman Government. \n\n Whilst the revolt is being assisted by our government it is none-the-less not as popular as we could have hoped it would become with the majority of Arabs still staying loyal to the Ottoman Empire."
    ww1_britain.19.a: "Great news"
    ww1_britain.20.t: "British Raj Sees Industrial Growth"
    ww1_britain.20.d: "With support of the British Government we have allocated enough funds to the British Raj, giving it a significant boost of industrial growth which should hopefully strengthen the colony and provide more jobs."
    ww1_britain.20.a: "Great"
    ww1_britain.21.t: "Support South Africa"
    ww1_britain.21.d: "With support of the British Government we have allocated enough funds to South Africa, giving it a significant boost of industrial growth which should hopefully strengthen the state and provide more jobs."
    ww1_britain.21.a: "Good"
    ww1_britain.22.t: "Australia Sees Industrial Growth"
    ww1_britain.22.d: "With support of the British Government we have allocated enough funds to Australia, giving it a significant boost of industrial growth which should hopefully strengthen the colony and provide more jobs."
    ww1_britain.22.a: "Great"
    ww1_britain.23.t: "Canada Sees Industrial Growth"
    ww1_britain.23.d: "With support of the British Government we have allocated enough funds to Canada, giving it a significant boost of industrial growth which should hopefully strengthen the colony and provide more jobs."
    ww1_britain.23.a: "Good"
    ww1_britain.24.t: "Soldiers from British Raj"
    ww1_britain.24.d: "Although the recruits from British Raj are arguably not the best, usually suffering in terms of quality training and performance, we have none-the-less managed to gain an huge chunk of manpower to use on the European Theatre."
    ww1_britain.24.a: "Good"
    ww1_britain.25.t: "Planning the Gallipoli Campaign"
    ww1_britain.25.d: "A daring plan has been proposed by the British Admiralty to land troops on the Gallipoli Peninsula and from there to head up and to hopefully eventually seize the capital of the Ottoman Empire, Constantinople which means a great deal to the Turks. Should we take it we would likely force them out of the war."
    ww1_britain.25.a: "It can work"
    ww1_britain.26.t: "Gallipoli Landings Begin"
    ww1_britain.26.d: "The landings in Gallipoli have begun, however unfortunately our troops have landed in the wrong area leaving them somewhat strategically weakened, but oh well. Within two months more reinforcements should arrive, hopefully we can take advantage of the invasion whilst we still can and have the power to force the turks out taking Constantinople."
    ww1_britain.26.a: "We must force the Turks out!"
    ww1_britain.2601.t: "Reinforcements Arrive at Gallipoli"
    ww1_britain.2601.d: "Reinforcements to aid the initial Gallipoli landing have finally arrived, hopefully we will be able to use them to their full effectiveness and beat the Turks back."
    ww1_britain.2601.a: "Great"
    ww1_britain.27.t: "Canadian Expeditionary Force"
    ww1_britain.27.d: "The Canadian Expeditionary force has arrived in France ready to fight with a total of around 300,000 men from the Dominion of Canada enlisting to fight on the Western Front as of yet."
    ww1_britain.27.a: "Great"
    ww1_britain.28.t: "The Baltic Project"
    ww1_britain.28.d: "Admiral Lord Fisher has promoted this 'Baltic Project', he assures a speedy victory over Germany. The plan involves landing a substantial force, either of British or Russian soldiers, or both, on the flat beaches of Pomerania on the North German Coast which happens to be a bit less than 100 miles from Berlin. \n\n However, of course such a plan would require a huge specialist fleet with submarines and extensive mining to keep the landing force safe from the German Navy. It could be done but will it be ultiamtely worth it?"
    ww1_britain.28.a: "Hmmm, should we shelve it?"
    ww1_britain.29.t: "Gathering Resources for the Baltic Project"
    ww1_britain.29.d: "We have decided to go along with the Baltic Project and have started to put together the fleet required to keep the landing force safe from the German Navy, it will require some 600 vessels which includes landing craft, minesweepers, destroyers, light cruisers, monitors, and some heavy shallow draft support ships."
    ww1_britain.29.a: "Lets put that force together!"
    ww1_britain.30.t: "Invasion of Pomerania Begins"
    ww1_britain.30.d: "Our ships have arrived off the coast of Pomerania and the landings have begun with the German Imperial Navy unable to do anything about it, if we are to take advantage of this we must deliver a final knockout blow to Germany by attacking Berlin and forcing them to surrender."
    ww1_britain.30.a: "Bet they weren't expecting this"
    ww1_britain.301.t: "First Reinforcements Wave Arrives at Pommerania"
    ww1_britain.301.d: "The first wave of reinforcements have arrived at Pomerania with several Russian divisions getting involved in the struggle."
    ww1_britain.301.a: "Good"
    ww1_britain.302.t: "Second Reinforcements Wave Arrives at Pommerania"
    ww1_britain.302.d: "The second and last wave of reinforcements has finally arrived at Pomerania, hopefully we this will be enough to take a strategic position and beat back the Germans forcing them to surrender."
    ww1_britain.302.a: "Lets hope so"
    ww1_britain.31.t: "South Africa Gains Independence"
    ww1_britain.31.d: "Following eight years after the end of the Second Boer War and after four years of negotiation, the act of the British Parliament in 1909 granted nominal independence finally the Union of South Africa being formed today containing former territories of the Cape, the Natal Colonies, Transvaal, and the Orange Free State."
    ww1_britain.31.a: "It must be"
    ww1_britain.32.t: "United in the Face of Agression"
    ww1_britain.32.d: "With the German Empire forcing our hand to join this largely unneccesary war by violating Belgian neutrality our people have largely decided to set aside their differences or oppositions towards the government and unite in the face of German aggression."
    ww1_britain.32.a: "Good"
    ww1_britain.33.t: "Military Service Act"
    ww1_britain.33.d: "The Military Service Act has been passed specifying that single men aged from 18 to 40 years old are now liable to be called up for military srvice unless they are widowed with children or are ministers of a religion. Due to the political situation, conscription will only be applied in England, Scotland, and Whales ignoring Ireland."
    ww1_britain.33.a: "Fill up the ranks!"
    ww1_britain.34.t: "Defense of the Realm Act Passed"
    ww1_britain.34.d: "The Defense of the Realm Act (DORA) has been passed, giving the government wide-ranging powers such as the power to requisition buildings or land needed for the war effort, or to make regulations creating criminal offences. DORA has also given the government power of censorship and other authoritarian social control mechanisms."
    ww1_britain.34.a: "A much needed change in this time of war"
    ww1_britain.35.t: "Massive War Effort"
    ww1_britain.35.d: "In an effort to maximize our war effort even more we have taken even more actions shifting the focus of all production toward military production."
    ww1_britain.35.a: "Keep it up"
    ww1_britain.36.t: "Frontline Focus Part I"
    ww1_britain.36.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_britain.36.a: "Ok"
    ww1_britain.37.t: "Frontline Focus Part II"
    ww1_britain.37.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_britain.37.a: "Ok"
    ww1_britain.38.t: "Frontline Focus Part III"
    ww1_britain.38.d: "In an effort to put an end to this war as soon as possible we have decided to put our full focus on the front line to give us an edge over our enemies, however this will mean somewhat neglecting the home front which can cause issues later on."
    ww1_britain.38.a: "Ok"
    ww1_britain.39.t: "Home Front Focus Part I"
    ww1_britain.39.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_britain.39.a: "Ok"
    ww1_britain.40.t: "Home Front Focus Part II"
    ww1_britain.40.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_britain.40.a: "Ok"
    ww1_britain.41.t: "Home Front Focus Part III"
    ww1_britain.41.d: "We have decided to focus on our home front, whilst still heavily focused on the frontline itself we will refrain from neglecting the home front completely and still put a significant focus on keeping things at home stable."
    ww1_britain.41.a: "Ok"
    ww1_britain.42.t: "Edward VII Dies"
    ww1_britain.42.d: "Our King, Edward VII has unfortunately passed away today, with his son George V succeeding as the next King of the United Kingdom. The Kings funeral was the greatest assemblage of royalty and rank every gathered in on place so far."
    ww1_britain.42.a: "Tragic"
    ww1_britain.43.t: "Kitchener and Staff Drown!"
    ww1_britain.43.d: "Lord Kitchener and his staff have unfortunately drowned today after boarding the HMS Hampshire for an expected diplomatic mission to Russia. Shortly before 19:30 hrs the same day, steaming towards the Russian port of Arkhangelsk, the HMS Hampshire struck a mine laid by a German U-boat and sank off the west coast of the Orkney Islands. Of the 749 on board, only twelve have managed to survive. \n\n The news of Kitcheners death is definately a shock to the people of the Commonwealth, many held firm beliefs that Britain's victory was assured if Kitchener was to live, but now there is not even the slightest of glimmer of hope in these dark times, he will be mourned."
    ww1_britain.43.a: "Oh no not Kitchener!"
    ww1_britain.44.t: "Easter Rising"
    ww1_britain.44.d: "An armed insurrection has begun in Ireland during Easterweek! According to reports, the Rising has been launched by Irish Republics who intend to 'end British rule in Ireland and establish an independent Irish Republic'. They have taken a jab at us while we are heavily engaged elsewhere dealing with German Imperialism. This is arguably the most significant uprising in Ireland in the last hundred years and we must deal with it quick before it gets out of hand!"
    ww1_britain.44.a: "Oh Those Fawkin Tater 'aters"
    ww1_britain.45.t: "The Dervish War"
    ww1_britain.45.d: "The Dervish War lasting for roughly ten years now has been a fairly long and drawn out conflict with Mohammed Abdullah Hassan (nicknamed the "Mad Mullah" by our men) and his Dervish Troops who have as of yet remained undefeated. Although this 'Mad Mullah' certainly does not pose all that much of a threat it would be non-the-less best to wipe these rebels out of existance."
    ww1_britain.45.a: "We are coming for you Mad Mullah!"
    ww1_britain.46.t: "Uprising in Libya"
    ww1_britain.46.d: "Recently, the resistance in our share of Libya has increased hundredfold. The Senussi religious group has claimed control over the area, and with the limited amount of operatives in the area we can hardly contest them. What should we do?"
    ww1_britain.46.a: "Let them have that piece of dust!"
    ww1_britain.46.b: "Giving up now is giving up forever!"
