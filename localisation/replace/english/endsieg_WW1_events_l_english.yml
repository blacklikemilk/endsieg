    ww1_germany.52032.t: "Armistice Failed"
    ww1_germany.52032.d: "The final peace settlement has not been accepted within the stipulated time. The Armistice of Compiègne has collapsed, and the Entente resumes the war against Germany."
    ww1_germany.52032.a: "Armistice failed. Back to the Arms!"
    ww1_kuk.2.b: "Seek cooperation across the frontier."
    ww1_kuk.9.b: "Pay for deliveries and leave seed grain."
    ww1_kuk.9.c: "We cannot collect grain we do not control."
    ww1_kuk.1501.a: "Accept the concession and remain neutral."
    ww1_kuk.1501.t: "Vienna Offers South Tyrol"
    ww1_kuk.1501.d: "Vienna proposes to cede its remaining Tyrolean districts in return for our neutrality. Acceptance brings an immediate concession, while rejection preserves our diplomatic freedom and any further claims. We must consider whether Austria-Hungary can deliver what it offers."
    ww1_kuk.1502.a: "Record the agreement."
    ww1_kuk.1502.t: "Italy Accepts the Tyrolean Offer"
    ww1_kuk.1502.d: "Rome has accepted the limited concession. The agreed districts have been transferred where we owned them, and Italy has undertaken to remain neutral. This agreement may ease one frontier, but our wider diplomatic problems remain."
    ww1_kuk.1503.a: "Reassess our position."
    ww1_kuk.1503.t: "Italy Rejects the Tyrolean Offer"
    ww1_kuk.1503.d: "Rome has declined our offer. The districts remain under their present administration, and Italy has given us no undertaking about the war. The diplomatic channel remains open, but a new offer would require a fresh decision."
    ww1_kuk.1601.b: "Our demands remain unmet."
    ww1_kuk.1703.a: "Accept the political agreement."
    ww1_kuk.1703.b: "Decline the proposal."
    ww1_kuk.2001.a: "Release 3,000 men from our reserve."
    ww1_kuk.2001.b: "We need the replacements ourselves."
    ww1_kuk.2001.t: "Vienna Requests Replacement Cadres"
    ww1_kuk.2001.d: "Austria-Hungary asks us for 3,000 trained replacements and staff instructors. Releasing them will reduce our own available manpower. The request does not transfer whole divisions or their equipment."
    ww1_kuk.21.b: "Keep the rifles for our own formations."
    ww1_kuk.2101.a: "Acknowledge the shipment."
    ww1_kuk.2101.t: "Austro-Hungarian Equipment Arrives"
    ww1_kuk.2101.d: "Vienna has released 1,000 rifles from its own stores for our army. The shipment is available for issue, and our liaison officers are recording the delivery."
    ww1_kuk.25.b: "Keep the rifles for our own formations."
    ww1_kuk.2501.a: "Acknowledge the shipment."
    ww1_kuk.2501.t: "Austro-Hungarian Equipment Arrives"
    ww1_kuk.2501.d: "Vienna has released 1,000 rifles from its own stores for our army. The shipment is available for issue, and our liaison officers are recording the delivery."
    ww1_kuk.22.b: "Retain the replacements at home."
    ww1_kuk.24.b: "Retain the replacements at home."
    ww1_kuk.2401.a: "Welcome the mission."
    ww1_kuk.2401.t: "Austro-Hungarian Replacements Arrive"
    ww1_kuk.2401.d: "Vienna has transferred 3,000 men from its reserve to support our army. They are replacements and instructors rather than an instantly equipped corps. Our commanders can now assign them where they are needed."
    ww1_kuk.2301.a: "Release 3,000 men from the reserve."
    ww1_kuk.2301.b: "Our fronts need them here."
    ww1_kuk.2301.t: "Vienna Requests Ottoman Replacements"
    ww1_kuk.2301.d: "Austria-Hungary requests 3,000 replacements and instructors. Sending them will reduce our available manpower, and creates no new divisions or equipment."
    ww1_kuk.29.b: "Limit the powers and retain civilian oversight."
    ww1_kuk.45.b: "Seek mediation and a joint investigation."
    ww1_kuk.4501.b: "Make our support conditional on mediation."
    ww1_kuk.46.b: "Use this position to seek mediation."
    ww1_kuk.47.b: "Offer a mediated inquiry instead."
    ww1_kuk.48.b: "Accept the inquiry to avert an immediate war."
    ww1_kuk.49.b: "Accept the reply as a basis for negotiation."
    ww1_kuk.50.b: "Protect residents and restore civil order."
    ww1_kuk.100.a: "Establish a paid common consultation programme."
    ww1_kuk.100.b: "Maintain the authority of the common ministries."
    ww1_kuk.100.t: "The Common Council"
    ww1_kuk.100.d: "Ministers from Vienna and Budapest are meeting under the crown. Regular consultation can make appointments and common services accountable, but it cannot settle the status of the nationalities. Constitutional changes will require their representatives' consent."
    ww1_kuk.101.a: "Open the trialist constitutional negotiations."
    ww1_kuk.101.b: "Keep discussion within the existing dual structure."
    ww1_kuk.101.t: "A Trialist Initiative"
    ww1_kuk.101.d: "South Slav representatives propose a third political partner beside Austria and Hungary. The cabinet can open negotiations on the crown, services and minority rights. A proposal grants no completed constitution; Croatian, Bosnian and Hungarian agreement will be required before ratification."
    ww1_kuk.102.a: "Send the draft to a convention of the crownlands."
    ww1_kuk.102.b: "Pursue narrower administrative concessions."
    ww1_kuk.102.t: "A Federal Initiative"
    ww1_kuk.102.d: "A federal draft proposes national representation within a shared state. Its proponents draw on prewar proposals, but the monarchy's competing institutions and mixed populations remain real obstacles. The draft must pass through regional negotiations before it can become a binding settlement."
    ww1_kuk.103.b: "Keep our diplomacy within the alliance."
    ww1_kuk.103.t: "The Sixtus Initiative"
    ww1_kuk.103.d: "Prince Sixtus of Bourbon-Parma offers a confidential channel to France. Karl can authorise an approach concerning Belgium, Serbia and the French claims against Germany. Paris may refuse, and Vienna cannot promise German territory or compel Italy to accept a settlement."
    ww1_kuk.104.a: "State our conditions and hear a concrete proposal."
    ww1_kuk.104.b: "The alliance obligations prevent a separate agreement."
    ww1_kuk.104.t: "Karl's Confidential Peace Approach"
    ww1_kuk.104.d: "Prince Sixtus has conveyed an Austro-Hungarian approach. Karl wishes to explore a separate settlement, but the German war aims and our allies' obligations remain obstacles. We may hear a concrete proposal or decline to jeopardise the Entente's common position."
    ww1_kuk.105.a: "Offer a bilateral Austro-French settlement."
    ww1_kuk.105.b: "We cannot meet the conditions while tied to Germany."
    ww1_kuk.105.t: "The Entente Conditions"
    ww1_kuk.105.d: "Paris will discuss a limited Austro-French settlement if Vienna leaves the German alliance and makes concrete concessions. Its reply creates no agreement with Britain, Italy, Russia or Serbia. A bilateral peace requires both governments to be outside factions. A limited humanitarian protocol may ease civilian distress while leaving all fronts at war."
    ww1_kuk.106.a: "Close the talks and contain the damage."
    ww1_kuk.106.t: "The Failure of the Sixtus Channel"
    ww1_kuk.106.d: "The confidential approach has failed to produce an agreement. The Entente governments will not set aside their allies' demands, and Vienna cannot deliver the concessions required from Germany. The war continues, while the letters remain a dangerous secret."
    ww1_kuk.107.a: "Fund independent parliamentary scrutiny."
    ww1_kuk.107.t: "Scrutiny of the Common Administration"
    ww1_kuk.107.d: "The delegations are standardising reports, inspections and appointments in the common ministries. Parliamentary scrutiny can reduce conflicting orders, but it takes political effort and does not create a new financial resource or factory."
    ww1_kuk.108.a: "Pay for the agreed deliveries."
    ww1_kuk.108.t: "The Hungarian Grain Agreement"
    ww1_kuk.108.d: "Budapest has agreed to a negotiated schedule of grain deliveries and railway priorities. Political compensation and supervision improve food access across the monarchy. The food-security index measures distribution, not tonnes of grain."
    ww1_kuk.109.a: "Implement the staff arrangements."
    ww1_kuk.109.t: "Reforming the Common Army Command"
    ww1_kuk.109.d: "Army headquarters are revising responsibilities and liaison procedures across the common army, Landwehr and Honved. The reform gives staff officers practical experience without creating troops or equipment."
    ww1_kuk.110.a: "Adopt the naval programme."
    ww1_kuk.110.t: "Priorities for the Imperial Navy"
    ww1_kuk.110.d: "The naval command is reviewing training, maintenance and Adriatic operations. It can improve the use of existing ships, while construction and replacement still depend on the dockyards and treasury."
    ww1_kuk.111.a: "Give the conference a common remit."
    ww1_kuk.111.t: "A Civilian Relief Conference"
    ww1_kuk.111.d: "Municipalities, provincial authorities and worker representatives are agreeing on kitchens and deliveries. The paid programme improves food access and common civil administration."
    ww1_kuk.112.a: "Authorise negotiations with the worker committees."
    ww1_kuk.112.b: "Rely on emergency censorship."
    ww1_kuk.112.t: "The January Strikes"
    ww1_kuk.112.d: "Workers are striking over reduced rations, conditions and the prospect of continued war. Factory committees demand reliable food and a political hearing. The government faces a choice between negotiated concessions and coercion; paid measures in the administration decisions can settle the immediate dispute."
    ww1_kuk.113.a: "Hear the sailors and arrange relief."
    ww1_kuk.113.b: "Restore order under naval discipline."
    ww1_kuk.113.t: "Unrest at Cattaro"
    ww1_kuk.113.d: "Sailors at Cattaro have raised demands over food, leave, conditions and the war. Naval commanders must restore cooperation without ignoring the shortages that helped provoke the unrest. Administration decisions offer paid concessions or discipline; this event does not destroy or create ships."
    AUH_ww1_crisis_decisions_tt: "The imperial administration decisions can settle this crisis through paid relief or discipline. The crisis remains active until a measure is completed."
    ww1_kuk.105.c: "Conclude a limited humanitarian protocol."
    ww1_italy.1.b: "Offer a negotiated commercial accommodation."
    ww1_italy.3.b: "We need access before funding an administration."
    ww1_italy.4.b: "Open talks with the Senussi authorities."
    ww1_italy.9.b: "Retain neutrality despite the agreement."
    ww1_italy.1303.b: "Decline the neutrality obligation."
    ww1_italy.24.b: "Recognise local autonomy within our administration."
    ww1_italy.200.a: "Bind the crown to regular parliamentary consultation."
    ww1_italy.200.b: "Affirm the royal prerogative."
    ww1_italy.200.t: "The Crown and the Constitution"
    ww1_italy.200.d: "The government is negotiating the division of authority between parliament and the crown. A settlement under the statute can strengthen consultation; reserving more discretion to the king gives the executive greater freedom while increasing opposition. Neither proposal creates an automatic right to overturn parliament later."
    ww1_italy.201.a: "Ratify the republic and appoint Bonomi."
    ww1_italy.201.b: "Keep the monarchy under parliamentary restraints."
    ww1_italy.201.t: "An Italian Republican Constitution"
    ww1_italy.201.d: "A constituent agreement proposes to replace the monarchy with an elected republic. Reformists nominate Ivanoe Bonomi as the provisional head of government. This is an alternative political settlement, requiring a costly break with the crown and a sustained parliamentary programme."
    ww1_italy.202.a: "Accept a socialist republican coalition."
    ww1_italy.202.b: "Negotiate a labor pact within parliament."
    ww1_italy.202.t: "A Socialist Coalition"
    ww1_italy.202.d: "Worker committees and socialist representatives propose a coalition led by Antonio Gramsci. Establishing a socialist republic would overturn the monarchy and redistribute authority, without automatically ending wars or transferring foreign territory. This alternative belongs to the political struggles of 1917 and later."
    ww1_italy.203.a: "Pledge neutrality and dispatch the mission."
    ww1_italy.203.b: "Retain freedom to negotiate intervention."
    ww1_italy.203.t: "Armed Neutrality and Mediation"
    ww1_italy.203.d: "Italy can pledge armed neutrality and offer a paid diplomatic mission to the belligerents. France and Germany must decide whether to hear the proposal. A mission creates no automatic peace and cannot compel another government to change its alliance."
    ww1_italy.204.a: "Submit the commercial proposal."
    ww1_italy.204.t: "An Ottoman Commercial Accommodation"
    ww1_italy.204.d: "We can ask Constantinople for a commercial agreement concerning Libya and the Mediterranean. Ottoman ministers retain the right to refuse. This proposal gives Italy trading opportunities rather than ownership of Libya and does not end a war between other powers."
    ww1_italy.205.a: "Negotiate directly with the Senussi government."
    ww1_italy.205.b: "Fund local autonomy in the districts we govern."
    ww1_italy.205.c: "Maintain the existing policy."
    ww1_italy.205.t: "Seeking a Senussi Accommodation"
    ww1_italy.205.d: "Italian officials can offer autonomy and negotiated access to local authorities. If a Senussi government exists, it must answer for itself. In districts under Italian ownership, the cabinet can fund an administrative agreement without releasing a new state."
    ww1_italy.206.a: "Put the compact to Vienna."
    ww1_italy.206.t: "An Adriatic Compact"
    ww1_italy.206.d: "Rome can propose an Adriatic agreement with Vienna covering access, consultation and the recognition of current borders. Austria-Hungary must consent, and the compact will grant no ownership of Fiume, Dalmatia or Albania."
    ww1_italy.207.a: "Ask France to negotiate a continental compact."
    ww1_italy.207.b: "Found an Italian-led neutral Mediterranean compact."
    ww1_italy.207.c: "Continue bilateral consultations."
    ww1_italy.207.t: "A Mediterranean Counterweight"
    ww1_italy.207.d: "The cabinet is considering a continental compact with France and Russia as a counterweight to the German and British blocs. France must decide whether its present alliance permits such a proposal. Alternatively, Italy can organise a neutral Mediterranean compact and issue voluntary invitations. Neither course dissolves another country's alliance."
    ww1_italy.208.a: "Fund demobilisation and a veterans' reform programme."
 ww1_italy.208.b:0 "Prioritise civilian services and public order."
    ww1_italy.208.t: "The Postwar Settlement at Home"
    ww1_italy.208.d: "The cabinet is preparing to convert contracts, demobilise services and address veterans' claims. A paid reform programme can ease food and social pressures; a hard line can conserve political effort while deepening resentment. Our domestic programme cannot dictate a foreign peace conference."
    ww1_italy.209.a: "Restore order through the existing authorities."
    ww1_italy.209.b: "Offer a negotiated labor and municipal settlement."
    ww1_italy.209.t: "Red Week"
    ww1_italy.209.d: "The deaths of demonstrators in Ancona have helped ignite strikes and unrest. Protesters, socialists and republican organisers are challenging the authorities. The government can negotiate a paid settlement or use force, with lasting consequences for public confidence."
    ww1_italy.210.a: "Support Diaz and a revised command system."
    ww1_italy.210.b: "Retain the command under civilian supervision."
    ww1_italy.210.t: "A Command Debate After the Retreat"
    ww1_italy.210.d: "The loss of ground has exposed serious weaknesses in command, reserves and the treatment of soldiers. Ministers are considering a new system associated with Armando Diaz, or retaining the existing command with stronger oversight. This debate follows an actual setback; it creates no predetermined defeat or free replacement army."
    ww1_italy.211.a: "Fund the paid relief agreement."
    ww1_italy.211.b: "Keep spending within the existing budget."
    ww1_italy.211.t: "A Home Front Conference"
    ww1_italy.211.d:0 "Municipalities, workers' representatives and suppliers propose a common relief programme. Public works and reserve courses can help families and returning servicemen, while the government must decide whether to fund the programme or preserve its budget."
 ww1_italy.220.a:0 "Commit the men and rifles to the expedition."
 ww1_italy.220.t:0 "Mobilize the Expeditionary Brigades"
 ww1_italy.220.d:0 "The Libyan campaign requires a dedicated reserve. Two infantry brigades and two cavalry groups are assembling at Genoa and La Spezia. The treasury and army must provide 20,000 men,2,160 rifles and the political authority to mobilize them. These formations begin at our own ports; naval transport and an actual landing are still required."
    ww1_italy.300.a: "Accept the intervention agreement."
    ww1_italy.300.b: "Decline the proposed commitment."
    ww1_italy.300.t: "An Italian Intervention Proposal"
    ww1_italy.300.d: "Rome proposes intervention against Austria-Hungary in exchange for our support for its territorial claims. We can accept a future alliance commitment, or decline if our diplomacy cannot sustain the promised settlement. Acceptance transfers no Austrian territory."
    ww1_italy.301.a: "Prepare the parliamentary decision."
    ww1_italy.301.t: "The Entente Accepts Our Proposal"
    ww1_italy.301.d: "Paris has accepted the intervention agreement. The cabinet may proceed through the intervention decision once its conditions are met. Until then we have a diplomatic commitment, not membership or a declaration of war."
    ww1_italy.302.a: "Review the alternatives."
    ww1_italy.302.t: "The Entente Declines Our Proposal"
    ww1_italy.302.d: "Paris has declined the offer or lacks authority to admit us under the proposed terms. Italy remains free to reassess neutrality and its other diplomatic channels."
    ww1_italy.310.a: "Accept the alliance proposal."
    ww1_italy.310.b: "Decline the proposal."
    ww1_italy.310.t: "Italy Proposes a Central Powers Agreement"
    ww1_italy.310.d: "Rome is asking for a negotiated place in the German alliance. We can support its admission or decline the offer. Membership will require a separate Italian ratification, and no Austrian territory can be promised away by Berlin."
    ww1_italy.311.a: "Ratify membership in the German alliance."
    ww1_italy.311.b: "Preserve our diplomatic freedom."
    ww1_italy.311.t: "Berlin Accepts the Alliance Proposal"
    ww1_italy.311.d: "Germany has accepted our negotiated alliance proposal. We can ratify it if Berlin still leads its faction and we remain outside another alliance. Membership does not automatically declare war on every German enemy."
    ww1_italy.312.a: "Review our position."
    ww1_italy.312.t: "Berlin Declines the Alliance Proposal"
    ww1_italy.312.d: "Germany has declined our proposal. No faction membership or territorial agreement follows from the talks. Our diplomats can review the remaining options."
    ww1_italy.320.a: "Release 1,500 rifles from our reserve."
    ww1_italy.320.b: "Our army needs the reserve."
    ww1_italy.320.t: "An Italian Equipment Request"
    ww1_italy.320.d: "The Italian army asks for 1,500 rifles. Sending them will remove that equipment from our actual stockpile before delivery; the request creates no new French divisions or free equipment."
    ww1_italy.321.a: "Acknowledge the delivery."
    ww1_italy.321.t: "The French Shipment Arrives"
    ww1_italy.321.d: "France has released 1,500 rifles from its own stockpile. Our depots are recording the shipment for use by existing formations. No allied corps has appeared with it."
    ww1_italy.322.a: "Revise the procurement schedule."
    ww1_italy.322.t: "France Retains Its Reserve"
    ww1_italy.322.d: "Paris has declined the equipment request. Our staff will have to procure replacements from Italian production and any other available suppliers."
    ww1_italy.330.a: "Accept the commercial accommodation."
    ww1_italy.330.b: "Decline the proposed agreement."
    ww1_italy.330.t: "An Italian Commercial Proposal"
    ww1_italy.330.d: "Rome proposes commercial access and diplomatic accommodation in place of a confrontation over Libya. Acceptance will support trade without surrendering our sovereignty or ceding colonial territory."
    ww1_italy.331.a: "Ratify the commercial agreement."
    ww1_italy.331.t: "Constantinople Accepts the Accommodation"
    ww1_italy.331.d: "The Ottoman government accepts commercial access and consultation while retaining sovereignty over its territories. We can now build a relationship through trade and local investment, without an automatic Libyan annexation."
    ww1_italy.332.a: "Review our policy."
    ww1_italy.332.t: "Constantinople Declines the Accommodation"
    ww1_italy.332.d: "Ottoman ministers have declined our commercial proposal. This refusal grants no new territory and does not automatically begin a war. The cabinet must decide its next policy through the available diplomatic and military paths."
    ww1_italy.340.a: "Accept the negotiated accommodation."
    ww1_italy.340.b: "Decline the offer."
    ww1_italy.340.t: "An Italian Accommodation Offer"
    ww1_italy.340.d: "Rome proposes to recognise local authorities and establish negotiated access rather than continue the colonial conflict. We may accept a bilateral settlement with Italy or refuse. The agreement grants no Italian ownership of the districts under our administration."
    ww1_italy.341.a: "Ratify the agreement."
    ww1_italy.341.t: "The Senussi Agreement"
    ww1_italy.341.d: "The Senussi authorities have accepted a negotiated accommodation. The agreement recognises local administration and allows cooperation while leaving existing ownership in place. Our government is committing resources to the civil programme."
    ww1_italy.342.a: "Review the colonial programme."
    ww1_italy.342.t: "The Senussi Authorities Decline"
    ww1_italy.342.d: "The Senussi authorities have rejected our proposal. Any existing conflict continues on its own terms. Officials will need another policy for the districts we actually administer."
    ww1_italy.350.a: "Accept the Adriatic compact."
    ww1_italy.350.b: "Decline the compact."
    ww1_italy.350.t: "Rome Proposes an Adriatic Compact"
    ww1_italy.350.d: "Italy offers consultation and access arrangements while recognising the current Adriatic borders. Accepting the compact does not transfer Fiume, Dalmatia or Albania. It may help settle diplomatic disputes without forcing either government into a new faction."
    ww1_italy.351.a: "Ratify the compact."
    ww1_italy.351.t: "Vienna Accepts the Adriatic Compact"
    ww1_italy.351.d: "Austria-Hungary has accepted consultation and access arrangements in the Adriatic. The compact recognises existing borders and grants military access by mutual consent. It gives Italy no new states or automatic faction membership."
    ww1_italy.352.a: "Continue bilateral diplomacy."
    ww1_italy.352.t: "Vienna Declines the Adriatic Compact"
    ww1_italy.352.d: "Austria-Hungary has declined our proposed compact. No border or alliance change follows from the talks."
    ww1_italy.360.a: "Accept a new continental compact."
    ww1_italy.360.b: "Decline because our commitments lie elsewhere."
    ww1_italy.360.t: "An Italian Continental Compact Proposal"
    ww1_italy.360.d: "Rome proposes a voluntary continental alliance involving France, Italy and Russia as a counterweight to rival blocs. We can take up the proposal only if our present commitments permit it. We will not abandon an existing faction through this invitation."
    ww1_italy.361.a: "Ratify the continental compact."
    ww1_italy.361.b: "Remain outside the compact."
    ww1_italy.361.t: "France Accepts the Continental Compact"
    ww1_italy.361.d: "France has formed a new continental faction and accepted our proposal. We may ratify membership only while France remains its leader and Italy is free of other commitments. Russia will answer its separate invitation."
    ww1_italy.362.a: "Preserve diplomatic contact."
    ww1_italy.362.t: "France Declines the Continental Compact"
    ww1_italy.362.d: "France has declined the new alliance proposal. Its existing commitments remain intact. Italy can still pursue bilateral talks or a neutral compact through a later political decision."
    ww1_italy.363.a: "Accept the Italian-led compact."
    ww1_italy.363.b: "Retain our current diplomatic independence."
    ww1_italy.363.t: "An Italian Mediterranean Invitation"
    ww1_italy.363.d: "Rome invites us to a voluntary neutral Mediterranean compact. Membership is available only if we remain outside other factions and at peace. Italy has promised no automatic transfer of foreign territory."
    ww1_italy.364.a: "Accept the continental invitation."
    ww1_italy.364.b: "Keep our present diplomatic course."
    ww1_italy.364.t: "A French Continental Invitation"
    ww1_italy.364.d: "France invites Russia to a continental compact negotiated with Italy. We may accept only while outside another faction and at peace with the prospective leader. Our existing commitments cannot be dissolved by the invitation."
    ww1_italy.370.a: "Receive the Italian mediators."
    ww1_italy.370.b: "Decline the mission for now."
    ww1_italy.370.t: "An Italian Mediation Mission"
    ww1_italy.370.d: "Italy offers a confidential diplomatic mission to discuss humanitarian measures and possible negotiating principles. Hearing the mission creates no ceasefire and commits us to no territorial concessions."
    ww1_italy.371.a: "Receive the Italian mediators."
    ww1_italy.371.b: "Decline the mission for now."
    ww1_italy.371.t: "An Italian Mediation Mission"
    ww1_italy.371.d: "Italy offers a confidential diplomatic mission to discuss humanitarian measures and possible negotiating principles. Hearing the mission creates no ceasefire and commits us to no territorial concessions."
    ww1_italy.372.a: "Continue the paid diplomatic mission."
    ww1_italy.372.t: "A Government Receives Our Mediators"
    ww1_italy.372.d: "One of the governments approached has agreed to hear the mission. Our diplomats can maintain the channel, but the reply settles no war and imposes no conditions on other belligerents."
    IT1_ww1_mediterranean_compact_name: "Mediterranean Compact"
    IT1_ww1_continental_compact_name: "Continental Compact"
    ww1_kuk.200.a: "Provide a mandate for the regional negotiations."
    ww1_kuk.200.b: "Restrict the convention to an advisory role."
    ww1_kuk.200.t: "A Convention of the Crownlands"
    ww1_kuk.200.d: "Delegates have arrived to discuss the monarchy's future. No delegation has given up its rights merely by attending. The convention must negotiate regional representation and shared services before choosing dualism, trialism, federation, autonomous crownlands or an orderly separation."
    ww1_kuk.201.a: "Accept representation and the written safeguards."
    ww1_kuk.201.b: "Defer consent and retain the current arrangements."
    ww1_kuk.201.t: "The Bohemian Delegation"
    ww1_kuk.201.d: "The Bohemian delegation asks for an elected diet, language rights and an enforceable place in common affairs. Its consent will cover the Bohemian and Moravian crownlands, not another country's territory. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.202.a: "Accept representation and the written safeguards."
    ww1_kuk.202.b: "Defer consent and retain the current arrangements."
    ww1_kuk.202.t: "The Hungarian Delegation"
    ww1_kuk.202.d: "Budapest demands a written constitutional settlement and protection for its authority. A workable compromise must also recognise Slovak institutions and the rights of the mixed populations of the historic Hungarian crownlands. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.203.a: "Accept representation and the written safeguards."
    ww1_kuk.203.b: "Defer consent and retain the current arrangements."
    ww1_kuk.203.t: "The Croatian Delegation"
    ww1_kuk.203.d: "Croatian representatives want a recognised political unit and an equal voice in the monarchy. The settlement must protect local institutions and minorities, rather than assume that every Adriatic district has the same national aspirations. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.204.a: "Accept representation and the written safeguards."
    ww1_kuk.204.b: "Defer consent and retain the current arrangements."
    ww1_kuk.204.t: "The Galician Delegation"
    ww1_kuk.204.d: "Polish and Ruthenian representatives demand regional institutions and protection against domination by either group. The proposed Galician settlement covers the historic crownland districts that we control; Russian Kielce is outside this agreement. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.205.a: "Accept representation and the written safeguards."
    ww1_kuk.205.b: "Defer consent and retain the current arrangements."
    ww1_kuk.205.t: "The Bosnian Delegation"
    ww1_kuk.205.d: "The Bosnian delegation requires equal civic protection and a clear position in the common state. Religious communities and local authorities must be represented before the convention can treat the province as a consenting partner. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.206.a: "Accept representation and the written safeguards."
    ww1_kuk.206.b: "Defer consent and retain the current arrangements."
    ww1_kuk.206.t: "The Slovenian Delegation"
    ww1_kuk.206.d: "Slovenian representatives ask for local administration, language services and an elected regional body. Consent covers the Slovenian crownland districts, with safeguards for their mixed populations. A separate independent government cannot be compelled into our reform by this convention."
    ww1_kuk.207.a: "Ratify the three-part crown settlement."
    ww1_kuk.207.b: "Return the settlement for further negotiation."
    ww1_kuk.207.t: "Ratifying the Trialist Settlement"
    ww1_kuk.207.d: "The Hungarian, Croatian and Bosnian delegations have negotiated a third partner under the crown. Ratification binds the government to the new institutions and language services. The monarchy retains its territory, while the nationality question moves into a negotiated constitutional framework."
    ww1_kuk.208.a: "Ratify the common federal state."
    ww1_kuk.208.b: "Return the settlement for further negotiation."
    ww1_kuk.208.t: "Ratifying an Integrated Danubian Federation"
    ww1_kuk.208.d: "The regional delegations have accepted elected institutions inside a common Danubian state. Ratification preserves common territory, defence and services, while replacing the old nationality arrangements with a federal chamber and army. This is a negotiated alternative, not the historical fate of the empire."
    ww1_kuk.209.a: "Ratify autonomous crownland government."
    ww1_kuk.209.b: "Return the settlement for further negotiation."
    ww1_kuk.209.t: "The Crownland Confederation"
    ww1_kuk.209.d: "The convention has accepted autonomous crownland governments under the common crown. Ratification transfers only territory we own and control to eligible regional governments, gives them dominion autonomy, common technology and military access, and leaves the Austrian heartland under Vienna. Existing independent states outside our authority cannot be made subjects by this settlement."
    ww1_kuk.210.a: "Ratify the peaceful separation."
    ww1_kuk.210.b: "Return the settlement for further negotiation."
    ww1_kuk.210.t: "An Orderly Partition of the Monarchy"
 ww1_kuk.210.d:0 "The convention has negotiated a voluntary separation while the country is at peace. Consenting regional governments receive independence and imperial districts that we own and control. An Austrian republic under Karl Renner retains the heartland. This constitutional settlement is distinct from military defeat or the Villa Giusti armistice."
    ww1_kuk.211.a: "Ratify the republic and appoint Renner."
    ww1_kuk.211.b: "Return the settlement for further negotiation."
    ww1_kuk.211.t: "A Danubian Republic"
    ww1_kuk.211.d: "Delegates propose a republican federation headed by Karl Renner. Ratification retires the imperial political leadership and creates an elected common government while preserving the territory of the consenting federation. It changes the constitution rather than pretending that every foreign dispute has ended."
    ww1_kuk.212.a: "Affirm the common executive and its obligations."
    ww1_kuk.212.b: "Return the settlement for further negotiation."
    ww1_kuk.212.t: "The Centralist Settlement"
    ww1_kuk.212.d: "The convention is being asked to reaffirm common ministerial authority and uniform executive administration. Centralism may ease decisions at headquarters, but it preserves the nationality problem and imposes a political cost. The government will retain the responsibility for food, civic order and parliamentary opposition."
    ww1_kuk.213.a: "Ratify the renewed common agreement."
    ww1_kuk.213.b: "Return the settlement for further negotiation."
    ww1_kuk.213.t: "Renewing the Dual Monarchy"
    ww1_kuk.213.d: "Vienna and Budapest have agreed to renew the two-government settlement with written consultation and shared responsibilities. Ratification binds the common ministries to the agreement. It preserves dualism and the remaining nationality questions, instead of claiming that administrative cooperation has completed a federation."
    ww1_kuk.214.a: "Pay for the charter and its local administration."
    ww1_kuk.214.t: "A Nationality Charter"
    ww1_kuk.214.d: "Representatives have drafted common guarantees for local institutions, worship and language. The charter gives minorities an enforceable place in administration without drawing new frontiers or promising a completed federal settlement."
    ww1_kuk.215.a: "Fund the army language service."
    ww1_kuk.215.t: "The Regimental Language Service"
    ww1_kuk.215.d: "The common army is establishing interpreters and a formal language service for its regiments. The programme improves command and liaison while leaving recruitment and equipment to existing army institutions."
    ww1_kuk.216.a: "Grant the reviewed amnesty."
    ww1_kuk.216.b: "Maintain restrictions pending further review."
    ww1_kuk.216.t: "An Imperial Amnesty"
    ww1_kuk.216.d: "The government can release selected political detainees and review wartime restrictions. A carefully administered amnesty may restore public confidence, but it needs civil oversight and does not erase the reasons for protest."
    ww1_kuk.217.a: "Fund the compromise administration."
    ww1_kuk.217.t: "A Limited Reform Compromise"
    ww1_kuk.217.d: "The convention is reconciling disputed reports and establishing a schedule for further talks. A narrower compromise can improve consultation and common services without claiming consent from a delegation that has withheld it."
    ww1_kuk.218.a: "Fund maintenance and naval training."
    ww1_kuk.218.b: "Give priority to civilian distribution."
    ww1_kuk.218.t: "The Fleet Appropriations"
    ww1_kuk.218.d: "The navy and civil delegates are reviewing maintenance, training and dockyard priorities. They can pay for a focused operational programme or conserve the appropriation for civilian needs. The choice creates no ships."
    ww1_kuk.219.a: "Fund the common railway service."
    ww1_kuk.219.t: "A Common Railway Board"
    ww1_kuk.219.d: "The provincial authorities and common ministries are agreeing on railway priorities. Civil deliveries and army transport must share the network. A paid board can coordinate schedules and maintenance in territory already under our control, without annexing another country's railways."
