    ww1_germany.52032.t:0 "The Armistice Collapses"
    ww1_germany.52032.d:0 "Negotiations have failed to produce a final settlement. The Armistice of Compiègne has collapsed, and the Entente is resuming hostilities against Germany."
    ww1_germany.52032.a:0 "Return to arms."
    ww1_kuk.2.b: "Seek cooperation across the frontier."
    ww1_kuk.9.b: "Pay for deliveries and leave seed grain."
    ww1_kuk.9.c:0 "Abandon the requisition."
    ww1_kuk.1501.a: "Accept the concession and remain neutral."
    ww1_kuk.1501.t: "Vienna Offers South Tyrol"
    ww1_kuk.1501.d:0 "Vienna offers its Tyrolean districts in return for an undertaking to remain neutral. The proposal would secure a substantial concession without the losses of a campaign. Ministers must weigh this immediate gain against Italy's wider ambitions."
    ww1_kuk.1502.a: "Record the agreement."
    ww1_kuk.1502.t: "Italy Accepts the Tyrolean Offer"
    ww1_kuk.1502.d:0 "Rome has accepted the Tyrolean concession and undertaken to remain neutral. The authorities have received instructions to carry out the agreed transfer. The agreement relieves the southern frontier, though it has come at a heavy political price."
    ww1_kuk.1503.a: "Reassess our position."
    ww1_kuk.1503.t: "Italy Rejects the Tyrolean Offer"
    ww1_kuk.1503.d:0 "Rome has rejected the Tyrolean offer. Italian ministers remain unwilling to exchange their freedom of action for the proposed concession. Vienna must reassess its position on the southern frontier."
    ww1_kuk.1601.b: "Our demands remain unmet."
    ww1_kuk.1703.a: "Accept the political agreement."
    ww1_kuk.1703.b: "Decline the proposal."
    ww1_kuk.2001.a: "Release 3,000 men from our reserve."
    ww1_kuk.2001.b: "We need the replacements ourselves."
    ww1_kuk.2001.t: "Vienna Requests Replacement Cadres"
    ww1_kuk.2001.d:0 "Vienna asks us to release 3,000 trained replacements and instructors for the common army. Its officers report an urgent need for experienced men at the front and in the training depots. Meeting the request would reduce the reserve available to our own commanders."
    ww1_kuk.21.b: "Keep the rifles for our own formations."
    ww1_kuk.2101.a: "Acknowledge the shipment."
    ww1_kuk.2101.t: "Austro-Hungarian Equipment Arrives"
    ww1_kuk.2101.d: "Vienna has released 1,000 rifles from its own stores for our army. The shipment is available for issue, and our liaison officers are recording the delivery."
    ww1_kuk.25.b: "Keep the rifles for our own formations."
    ww1_kuk.2501.a: "Acknowledge the shipment."
    ww1_kuk.2501.t: "Austro-Hungarian Equipment Arrives"
    ww1_kuk.2501.d: "Vienna has released 1,000 rifles from its own stores for our army. The shipment is available for issue, and our liaison officers are recording the delivery."
    ww1_kuk.22.b: "Retain the replacements at home."
    ww1_kuk.24.b: "Retain the replacements at home."
    ww1_kuk.2401.a: "Welcome the mission."
    ww1_kuk.2401.t: "Austro-Hungarian Replacements Arrive"
    ww1_kuk.2401.d:0 "Austro-Hungarian replacements and instructors have arrived to support our army. The 3,000 men have been released from Vienna's reserve under the allied agreement. Our commanders are preparing their assignments."
    ww1_kuk.2301.a: "Release 3,000 men from the reserve."
    ww1_kuk.2301.b: "Our fronts need them here."
    ww1_kuk.2301.t: "Vienna Requests Ottoman Replacements"
    ww1_kuk.2301.d:0 "Vienna requests 3,000 replacements and instructors for the common army. Our commanders must weigh this appeal against the demands of the Ottoman fronts. The cabinet's answer will show how much support we can offer our ally."
    ww1_kuk.29.b: "Limit the powers and retain civilian oversight."
    ww1_kuk.45.b: "Seek mediation and a joint investigation."
    ww1_kuk.4501.b: "Make our support conditional on mediation."
    ww1_kuk.46.b: "Use this position to seek mediation."
    ww1_kuk.47.b: "Offer a mediated inquiry instead."
    ww1_kuk.48.b: "Accept the inquiry to avert an immediate war."
    ww1_kuk.49.b: "Accept the reply as a basis for negotiation."
    ww1_kuk.50.b: "Protect residents and restore civil order."
    ww1_kuk.100.a:0 "Establish the common consultation programme."
    ww1_kuk.100.b: "Maintain the authority of the common ministries."
    ww1_kuk.100.t: "The Common Council"
    ww1_kuk.100.d:0 "Ministers from Vienna and Budapest have gathered under the crown to settle the conduct of common affairs. Their proposals cover appointments, public services and regular consultation. Agreement may improve cooperation while leaving the larger nationality disputes before the monarchy."
    ww1_kuk.101.a: "Open the trialist constitutional negotiations."
    ww1_kuk.101.b: "Keep discussion within the existing dual structure."
    ww1_kuk.101.t: "A Trialist Initiative"
    ww1_kuk.101.d:0 "South Slav representatives propose a third political partner beside Austria and Hungary. Negotiations would have to settle the authority of the crown, common services and minority rights. Croatian, Bosnian and Hungarian consent will be essential to a lasting compromise."
    ww1_kuk.102.a: "Send the draft to a convention of the crownlands."
    ww1_kuk.102.b: "Pursue narrower administrative concessions."
    ww1_kuk.102.t: "A Federal Initiative"
    ww1_kuk.102.d:0 "A federal draft offers the nationalities elected representation within a common state. Its supporters hope to reconcile loyalty to the crown with stronger regional institutions. Crownland delegations must now negotiate the terms on which they could accept the proposal."
    ww1_kuk.103.b: "Keep our diplomacy within the alliance."
    ww1_kuk.103.t: "The Sixtus Initiative"
    ww1_kuk.103.d: "Prince Sixtus of Bourbon-Parma offers a confidential channel to France. Karl can authorise an approach concerning Belgium, Serbia and the French claims against Germany. Paris may refuse, and Vienna cannot promise German territory or compel Italy to accept a settlement."
    ww1_kuk.104.a: "State our conditions and hear a concrete proposal."
    ww1_kuk.104.b: "The alliance obligations prevent a separate agreement."
    ww1_kuk.104.t: "Karl's Confidential Peace Approach"
    ww1_kuk.104.d: "Prince Sixtus has conveyed an Austro-Hungarian approach. Karl wishes to explore a separate settlement, but the German war aims and our allies' obligations remain obstacles. We may hear a concrete proposal or decline to jeopardise the Entente's common position."
    ww1_kuk.105.a: "Offer a bilateral Austro-French settlement."
    ww1_kuk.105.b: "We cannot meet the conditions while tied to Germany."
    ww1_kuk.105.t: "The Entente Conditions"
    ww1_kuk.105.d:0 "Paris is prepared to discuss a separate settlement, but expects Vienna to free itself from its obligations to Germany. The cabinet must weigh that break against the prospect of ending the war with France. A more limited humanitarian agreement may still be possible if full peace remains beyond reach."
    ww1_kuk.106.a: "Close the talks and contain the damage."
    ww1_kuk.106.t: "The Failure of the Sixtus Channel"
    ww1_kuk.106.d: "The confidential approach has failed to produce an agreement. The Entente governments will not set aside their allies' demands, and Vienna cannot deliver the concessions required from Germany. The war continues, while the letters remain a dangerous secret."
    ww1_kuk.107.a: "Fund independent parliamentary scrutiny."
    ww1_kuk.107.t: "Scrutiny of the Common Administration"
    ww1_kuk.107.d:0 "The delegations propose common standards for ministerial reports, inspections and appointments. Parliamentary scrutiny would give them a clearer account of how the common services are run. Ministers must decide whether to accept the oversight and provide the necessary staff."
    ww1_kuk.108.a: "Pay for the agreed deliveries."
    ww1_kuk.108.t: "The Hungarian Grain Agreement"
    ww1_kuk.108.d:0 "Budapest has agreed to a schedule of grain deliveries and railway priorities. Compensation and supervision are intended to make the arrangement acceptable on both sides of the Leitha. The government hopes it will ease shortages in the monarchy's cities."
    ww1_kuk.109.a: "Implement the staff arrangements."
    ww1_kuk.109.t: "Reforming the Common Army Command"
    ww1_kuk.109.d:0 "Army headquarters has prepared new arrangements for liaison between the common army, Landwehr and Honvéd. Officers seek clearer responsibilities and fewer conflicting instructions. The reform offers an opportunity to bring the lessons of the front into daily command."
    ww1_kuk.110.a: "Adopt the naval programme."
    ww1_kuk.110.t: "Priorities for the Imperial Navy"
    ww1_kuk.110.d:0 "The naval command proposes revised training, maintenance and operational priorities in the Adriatic. Its officers want to make better use of the fleet amid growing wartime demands. The cabinet has been asked to endorse the programme."
    ww1_kuk.111.a: "Give the conference a common remit."
    ww1_kuk.111.t: "A Civilian Relief Conference"
    ww1_kuk.111.d:0 "Municipal officials and worker representatives have gathered to agree on public kitchens and food deliveries. Provincial authorities seek a common remit for relief work rather than competing demands on the railways. Funding the agreement may ease distress in the industrial cities."
    ww1_kuk.112.a: "Authorise negotiations with the worker committees."
    ww1_kuk.112.b: "Rely on emergency censorship."
    ww1_kuk.112.t: "The January Strikes"
    ww1_kuk.112.d:0 "Workers have walked out over reduced rations, poor conditions and the prospect of continued war. Factory committees demand reliable food deliveries and a political hearing. Ministers must choose between opening negotiations and imposing tighter emergency restrictions."
    ww1_kuk.113.a: "Hear the sailors and arrange relief."
    ww1_kuk.113.b: "Restore order under naval discipline."
    ww1_kuk.113.t: "Unrest at Cattaro"
    ww1_kuk.113.d:0 "Sailors at Cattaro have raised demands over food, leave and conditions aboard the fleet. Anger at the prolonged war has turned routine grievances into a challenge to naval authority. Commanders must decide whether to hear the demands or restore order through discipline."
    AUH_ww1_crisis_decisions_tt: "The Imperial Council can organize provincial relief. Relief in the Austrian or Bohemian lands settles the January strikes if food security is at least 30; relief in Croatia resolves the Cattaro crew dispute."
    ww1_kuk.105.c: "Conclude a limited humanitarian protocol."
    ww1_italy.1.b:0 "Seek an agreement with Constantinople."
    ww1_italy.3.b:0 "The programme must wait."
    ww1_italy.4.b:0 "Seek an accommodation."
    ww1_italy.9.b: "Retain neutrality despite the agreement."
    ww1_italy.1303.b: "Decline the neutrality obligation."
    ww1_italy.24.b:0 "Recognise local autonomy."
    ww1_italy.200.a: "Bind the crown to regular parliamentary consultation."
    ww1_italy.200.b: "Affirm the royal prerogative."
    ww1_italy.200.t: "The Crown and the Constitution"
    ww1_italy.200.d: "The government is negotiating the division of authority between parliament and the crown. A settlement under the statute can strengthen consultation; reserving more discretion to the king gives the executive greater freedom while increasing opposition. Neither proposal creates an automatic right to overturn parliament later."
    ww1_italy.201.a:0 "Proclaim the republic under Bonomi."
    ww1_italy.201.b: "Keep the monarchy under parliamentary restraints."
    ww1_italy.201.t: "An Italian Republican Constitution"
    ww1_italy.201.d:0 "A constituent agreement proposes replacing the monarchy with an elected republic, with Ivanoe Bonomi at the head of a provisional government. Its supporters call this the foundation of a broader political settlement, while moderates argue that parliamentary restraints could secure reform without deposing the crown."
    ww1_italy.202.a: "Accept a socialist republican coalition."
    ww1_italy.202.b:0 "Seek a labour agreement in parliament."
    ww1_italy.202.t: "A Socialist Coalition"
    ww1_italy.202.d:0 "Socialist representatives and worker committees propose a republican coalition led by Antonio Gramsci. Ministers must decide whether to accept this break with the monarchy or negotiate a labour agreement within the existing parliamentary order."
    ww1_italy.203.a:0 "Pledge neutrality and send the mission."
    ww1_italy.203.b: "Retain freedom to negotiate intervention."
    ww1_italy.203.t: "Armed Neutrality and Mediation"
    ww1_italy.203.d:0 "Advocates of armed neutrality propose a pledge to remain outside the war and a mediation mission to the belligerents. Others argue that Italy should preserve its freedom to negotiate intervention rather than bind itself to a neutral course."
    ww1_italy.204.a: "Submit the commercial proposal."
    ww1_italy.204.t: "An Ottoman Commercial Accommodation"
    ww1_italy.204.d:0 "Our diplomats propose approaching Constantinople with a commercial agreement concerning Libya and the Mediterranean. Ministers hope that negotiated access and consultation could protect Italian interests without another confrontation over sovereignty."
    ww1_italy.205.a: "Negotiate directly with the Senussi government."
    ww1_italy.205.b:0 "Support an agreement with local authorities."
    ww1_italy.205.c: "Maintain the existing policy."
    ww1_italy.205.t: "Seeking a Senussi Accommodation"
    ww1_italy.205.d:0 "Officials propose recognising local authority and negotiating access with Senussi representatives. The cabinet can seek a direct agreement, fund an accommodation in the districts it administers, or retain the present colonial policy."
    ww1_italy.206.a: "Put the compact to Vienna."
    ww1_italy.206.t: "An Adriatic Compact"
    ww1_italy.206.d:0 "Our diplomats have prepared an Adriatic compact covering consultation, access and recognition of the present borders. They hope that agreement with Vienna can reduce the risk of confrontation over the coast and give both governments a more dependable channel for negotiation."
    ww1_italy.207.a: "Ask France to negotiate a continental compact."
    ww1_italy.207.b: "Found an Italian-led neutral Mediterranean compact."
    ww1_italy.207.c: "Continue bilateral consultations."
    ww1_italy.207.t: "A Mediterranean Counterweight"
    ww1_italy.207.d:0 "Ministers are considering a continental compact with France and Russia as a counterweight to the German and British blocs. A neutral Mediterranean association under Italian leadership offers another course, while cautious voices prefer to continue bilateral talks."
    ww1_italy.208.a:0 "Fund demobilisation and veterans' reform."
 ww1_italy.208.b:0 "Prioritise civilian services and public order."
    ww1_italy.208.t: "The Postwar Settlement at Home"
    ww1_italy.208.d:0 "The cabinet must now prepare for demobilisation, the conversion of contracts and the claims of returning veterans. Ministers are divided over how much to devote to a reform programme and how much should remain available for civilian services and public order."
    ww1_italy.209.a: "Restore order through the existing authorities."
    ww1_italy.209.b:0 "Negotiate with workers and municipalities."
    ww1_italy.209.t: "Red Week"
    ww1_italy.209.d:0 "The deaths of demonstrators in Ancona have ignited strikes and unrest. Socialists, republicans and worker organisations challenge the authorities as ministers weigh a negotiated settlement against the use of force."
    ww1_italy.210.a: "Support Diaz and a revised command system."
    ww1_italy.210.b: "Retain the command under civilian supervision."
    ww1_italy.210.t: "A Command Debate After the Retreat"
    ww1_italy.210.d:0 "The retreat has exposed serious weaknesses in command, reserves and the treatment of soldiers. Ministers must decide whether to support the reforms associated with Armando Diaz or retain the existing command under closer civilian supervision."
    ww1_italy.211.a:0 "Finance the relief agreement."
    ww1_italy.211.b: "Keep spending within the existing budget."
    ww1_italy.211.t: "A Home Front Conference"
    ww1_italy.211.d:0 "Municipalities, workers' representatives and suppliers have proposed a common relief programme for families and returning servicemen. The cabinet must decide whether to finance the agreement or keep expenditure within the present budget."
 ww1_italy.220.a:0 "Send the expedition ashore."
 ww1_italy.220.t:0 "The Libyan Expedition"
 ww1_italy.220.d:0 "The expeditionary infantry is ready for the landings at Tripoli and Benghazi. Naval officers await the order to escort the transports, while Ottoman troops and local forces prepare to contest the campaign beyond the harbours."
    ww1_italy.300.a: "Accept the intervention agreement."
    ww1_italy.300.b: "Decline the proposed commitment."
    ww1_italy.300.t: "An Italian Intervention Proposal"
    ww1_italy.300.d:0 "Rome offers intervention against Austria-Hungary in return for our support for Italian territorial claims. Accepting could open a valuable new front, but it would also bind our diplomacy to promises that must be carried into a future settlement."
    ww1_italy.301.a: "Prepare the parliamentary decision."
    ww1_italy.301.t: "The Entente Accepts Our Proposal"
    ww1_italy.301.d:0 "Paris has accepted the proposed intervention agreement. Ministers must now prepare the parliamentary decision that would bring Italy into the alliance and the war against Austria-Hungary."
    ww1_italy.302.a: "Review the alternatives."
    ww1_italy.302.t: "The Entente Declines Our Proposal"
    ww1_italy.302.d:0 "Paris has declined the proposed intervention agreement. Our envoys will return to Rome, where the cabinet must reconsider neutrality and the other diplomatic approaches still open to Italy."
    ww1_italy.310.a: "Accept the alliance proposal."
    ww1_italy.310.b: "Decline the proposal."
    ww1_italy.310.t: "Italy Proposes a Central Powers Agreement"
    ww1_italy.310.d:0 "Rome seeks a negotiated place in the German alliance. Italian participation could strengthen our position, but ministers must weigh that advantage against the obligations of admitting another partner."
    ww1_italy.311.a: "Ratify membership in the German alliance."
    ww1_italy.311.b: "Preserve our diplomatic freedom."
    ww1_italy.311.t: "Berlin Accepts the Alliance Proposal"
    ww1_italy.311.d:0 "Berlin has accepted our proposed alliance agreement. The cabinet must decide whether to ratify membership or preserve Italy's diplomatic freedom as the conflict develops."
    ww1_italy.312.a: "Review our position."
    ww1_italy.312.t: "Berlin Declines the Alliance Proposal"
    ww1_italy.312.d:0 "Berlin has declined our alliance proposal. The talks have produced no agreement, leaving the cabinet to reconsider its diplomatic position."
    ww1_italy.320.a:0 "Send the 1,500 rifles."
    ww1_italy.320.b: "Our army needs the reserve."
    ww1_italy.320.t: "An Italian Equipment Request"
    ww1_italy.320.d:0 "The Italian army has asked France to provide 1,500 rifles for its formations. The request has reached our supply officers, who must decide whether the reserve can support the shipment without endangering our own preparations."
    ww1_italy.321.a:0 "Distribute the rifles to our formations."
    ww1_italy.321.t: "The French Shipment Arrives"
    ww1_italy.321.d:0 "The French shipment of 1,500 rifles has reached our depots. Supply officers are arranging their distribution to the formations awaiting replacements."
    ww1_italy.322.a: "Revise the procurement schedule."
    ww1_italy.322.t: "France Retains Its Reserve"
    ww1_italy.322.d: "Paris has declined the equipment request. Our staff will have to procure replacements from Italian production and any other available suppliers."
    ww1_italy.330.a: "Accept the commercial accommodation."
    ww1_italy.330.b: "Decline the proposed agreement."
    ww1_italy.330.t: "An Italian Commercial Proposal"
    ww1_italy.330.d:0 "Rome proposes commercial access and diplomatic consultation in place of a confrontation over Libya. Ministers must decide whether the agreement offers a useful accommodation or concedes too much to Italian pressure."
    ww1_italy.331.a: "Ratify the commercial agreement."
    ww1_italy.331.t: "Constantinople Accepts the Accommodation"
    ww1_italy.331.d:0 "Constantinople has accepted the proposed commercial agreement. Our representatives can now develop the arrangements for access and consultation while Ottoman sovereignty over Libya remains intact."
    ww1_italy.332.a: "Review our policy."
    ww1_italy.332.t: "Constantinople Declines the Accommodation"
    ww1_italy.332.d:0 "Ottoman ministers have declined our commercial proposal. The cabinet must reconsider how to protect Italian interests in Libya and the Mediterranean without an agreement with Constantinople."
    ww1_italy.340.a: "Accept the negotiated accommodation."
    ww1_italy.340.b: "Decline the offer."
    ww1_italy.340.t: "An Italian Accommodation Offer"
    ww1_italy.340.d:0 "Rome proposes recognising local authorities and securing access by negotiation instead of continuing the colonial confrontation. We must decide whether the offered accommodation provides a basis for cooperation or leaves our position too exposed."
    ww1_italy.341.a: "Ratify the agreement."
    ww1_italy.341.t: "The Senussi Agreement"
    ww1_italy.341.d:0 "Senussi representatives have accepted the proposed accommodation. Officials will now put the arrangements for local administration, access and cooperation into practice."
    ww1_italy.342.a: "Review the colonial programme."
    ww1_italy.342.t: "The Senussi Authorities Decline"
    ww1_italy.342.d:0 "The Senussi authorities have rejected our proposal. The cabinet must review its colonial policy as officials struggle to establish a workable relationship with the interior."
    ww1_italy.350.a: "Accept the Adriatic compact."
    ww1_italy.350.b: "Decline the compact."
    ww1_italy.350.t: "Rome Proposes an Adriatic Compact"
    ww1_italy.350.d:0 "Italy offers an Adriatic compact recognising the present borders and establishing consultation and access arrangements. Ministers must decide whether this understanding would ease the rivalry with Rome or limit our freedom to act along the coast."
    ww1_italy.351.a: "Ratify the compact."
    ww1_italy.351.t: "Vienna Accepts the Adriatic Compact"
    ww1_italy.351.d:0 "Vienna has accepted the proposed Adriatic compact. Officials from both governments will establish the consultation and access arrangements intended to reduce the risk of further disputes."
    ww1_italy.352.a: "Continue bilateral diplomacy."
    ww1_italy.352.t: "Vienna Declines the Adriatic Compact"
    ww1_italy.352.d:0 "Vienna has declined our proposed Adriatic compact. The disputes that prompted the talks remain unsettled, and our diplomats must continue their work through bilateral channels."
    ww1_italy.360.a: "Accept a new continental compact."
    ww1_italy.360.b:0 "Our commitments lie elsewhere."
    ww1_italy.360.t: "An Italian Continental Compact Proposal"
    ww1_italy.360.d:0 "Rome proposes a continental alliance with France, Italy and Russia to counter the rival blocs. Ministers must weigh the benefits of a new association against France's existing commitments and the obligations such a compact would bring."
    ww1_italy.361.a: "Ratify the continental compact."
    ww1_italy.361.b: "Remain outside the compact."
    ww1_italy.361.t: "France Accepts the Continental Compact"
    ww1_italy.361.d:0 "France has accepted the proposed continental compact and taken the lead in forming the alliance. The cabinet must now decide whether Italy should ratify membership or remain outside the association."
    ww1_italy.362.a: "Preserve diplomatic contact."
    ww1_italy.362.t: "France Declines the Continental Compact"
    ww1_italy.362.d:0 "France has declined our continental alliance proposal. Rome must reconsider whether bilateral negotiations or a neutral association can better serve Italian interests."
    ww1_italy.363.a: "Accept the Italian-led compact."
    ww1_italy.363.b: "Retain our current diplomatic independence."
    ww1_italy.363.t: "An Italian Mediterranean Invitation"
    ww1_italy.363.d:0 "Rome invites us to join a neutral Mediterranean compact under Italian leadership. Membership could strengthen our position against external pressure, but it would also bind our diplomacy more closely to Italy."
    ww1_italy.364.a: "Accept the continental invitation."
    ww1_italy.364.b: "Keep our present diplomatic course."
    ww1_italy.364.t: "A French Continental Invitation"
    ww1_italy.364.d:0 "France invites Russia to join the continental compact negotiated with Italy. Ministers must judge whether this association offers a sound basis for cooperation or whether our present diplomatic course should be maintained."
    ww1_italy.370.a: "Receive the Italian mediators."
    ww1_italy.370.b: "Decline the mission for now."
    ww1_italy.370.t: "An Italian Mediation Mission"
    ww1_italy.370.d:0 "Italian envoys offer confidential talks on humanitarian measures and possible principles for negotiation. Receiving the mission could open a useful channel, although the government must decide whether the moment is right for such discussions."
    ww1_italy.371.a: "Receive the Italian mediators."
    ww1_italy.371.b: "Decline the mission for now."
    ww1_italy.371.t: "An Italian Mediation Mission"
    ww1_italy.371.d:0 "Italian envoys offer confidential talks on humanitarian measures and possible principles for negotiation. Receiving the mission could open a useful channel, although the government must decide whether the moment is right for such discussions."
    ww1_italy.372.a:0 "Continue the negotiations."
    ww1_italy.372.t: "A Government Receives Our Mediators"
    ww1_italy.372.d:0 "One of the governments approached has agreed to receive our mediators. The mission can now begin confidential discussions and report whether there is any basis for further negotiation."
    IT1_ww1_mediterranean_compact_name: "Mediterranean Compact"
    IT1_ww1_continental_compact_name: "Continental Compact"
    ww1_kuk.200.a:0 "Give the delegates a negotiating mandate."
    ww1_kuk.200.b:0 "Keep the convention advisory."
    ww1_kuk.200.t: "A Convention of the Crownlands"
    ww1_kuk.200.d:0 "Delegates from the crownlands have arrived to discuss the monarchy's future. They bring competing demands for national representation, local authority and common services. The government must decide whether to give them a mandate to negotiate a constitutional settlement."
    ww1_kuk.201.a: "Accept representation and the written safeguards."
    ww1_kuk.201.b: "Defer consent and retain the current arrangements."
    ww1_kuk.201.t: "The Bohemian Delegation"
    ww1_kuk.201.d:0 "The Bohemian delegation asks for an elected diet, language rights and an enforceable voice in common affairs. Czech and German representatives dispute how those guarantees should work in practice. Their consent will depend on the government's willingness to put the safeguards in writing."
    ww1_kuk.202.a: "Accept representation and the written safeguards."
    ww1_kuk.202.b: "Defer consent and retain the current arrangements."
    ww1_kuk.202.t: "The Hungarian Delegation"
    ww1_kuk.202.d:0 "Budapest demands a written guarantee of its constitutional authority. Slovak institutions and the rights of the crownlands' mixed populations remain central to the dispute. A lasting settlement requires concessions that the Hungarian delegation can defend at home."
    ww1_kuk.203.a: "Accept representation and the written safeguards."
    ww1_kuk.203.b: "Defer consent and retain the current arrangements."
    ww1_kuk.203.t: "The Croatian Delegation"
    ww1_kuk.203.d:0 "Croatian representatives seek a recognised political unit and an equal voice under the crown. They also ask for guarantees for local institutions and minority communities. Their answer will help determine whether a third partner can join the constitutional settlement."
    ww1_kuk.204.a: "Accept representation and the written safeguards."
    ww1_kuk.204.b: "Defer consent and retain the current arrangements."
    ww1_kuk.204.t: "The Galician Delegation"
    ww1_kuk.204.d:0 "Polish and Ruthenian representatives demand regional institutions and protection against domination by either group. The Galician delegation seeks a settlement for the crownland's mixed population. Ministers must decide whether to accept the proposed safeguards."
    ww1_kuk.205.a: "Accept representation and the written safeguards."
    ww1_kuk.205.b: "Defer consent and retain the current arrangements."
    ww1_kuk.205.t: "The Bosnian Delegation"
    ww1_kuk.205.d:0 "The Bosnian delegation asks for equal civic protection and a clear place in the common state. Religious communities and local authorities seek representation in the new arrangements. Their consent depends on guarantees that can be enforced beyond the conference chamber."
    ww1_kuk.206.a: "Accept representation and the written safeguards."
    ww1_kuk.206.b: "Defer consent and retain the current arrangements."
    ww1_kuk.206.t: "The Slovenian Delegation"
    ww1_kuk.206.d:0 "Slovenian representatives ask for local administration, language services and an elected regional body. The delegation also seeks safeguards for the crownlands' mixed communities. The government must decide whether to recognise these demands in the settlement."
    ww1_kuk.207.a: "Ratify the three-part crown settlement."
    ww1_kuk.207.b: "Return the settlement for further negotiation."
    ww1_kuk.207.t: "Ratifying the Trialist Settlement"
    ww1_kuk.207.d: "The Hungarian, Croatian and Bosnian delegations have negotiated a third partner under the crown. Ratification binds the government to the new institutions and language services. The monarchy retains its territory, while the nationality question moves into a negotiated constitutional framework."
    ww1_kuk.208.a: "Ratify the common federal state."
    ww1_kuk.208.b: "Return the settlement for further negotiation."
    ww1_kuk.208.t: "Ratifying an Integrated Danubian Federation"
    ww1_kuk.208.d:0 "The crownland delegations have accepted a federal chamber and elected regional institutions within a common Danubian state. The proposed constitution preserves shared defence and public services. Ratification would replace the old settlement with a new basis for the monarchy."
    ww1_kuk.209.a: "Ratify autonomous crownland government."
    ww1_kuk.209.b: "Return the settlement for further negotiation."
    ww1_kuk.209.t: "The Crownland Confederation"
    ww1_kuk.209.d:0 "The convention proposes autonomous crownland governments under the common crown. Regional administrations would take responsibility for their territories while retaining common military and technical ties. Vienna must decide whether this looser union offers a durable future for the monarchy."
    ww1_kuk.210.a: "Ratify the peaceful separation."
    ww1_kuk.210.b: "Return the settlement for further negotiation."
    ww1_kuk.210.t: "An Orderly Partition of the Monarchy"
 ww1_kuk.210.d:0 "The convention has negotiated a peaceful separation of the consenting crownlands. Regional governments would assume independence, while an Austrian republic under Karl Renner retains the heartland. Ratification would bring the Habsburg common state to an orderly end."
    ww1_kuk.211.a: "Ratify the republic and appoint Renner."
    ww1_kuk.211.b: "Return the settlement for further negotiation."
    ww1_kuk.211.t: "A Danubian Republic"
    ww1_kuk.211.d:0 "Delegates propose replacing the imperial constitution with a republican federation headed by Karl Renner. An elected common government would inherit responsibility for administration and defence across the consenting regions. The convention must now decide whether to ratify the new republic."
    ww1_kuk.212.a: "Affirm the common executive and its obligations."
    ww1_kuk.212.b: "Return the settlement for further negotiation."
    ww1_kuk.212.t: "The Centralist Settlement"
    ww1_kuk.212.d: "The convention is being asked to reaffirm common ministerial authority and uniform executive administration. Centralism may ease decisions at headquarters, but it preserves the nationality problem and imposes a political cost. The government will retain the responsibility for food, civic order and parliamentary opposition."
    ww1_kuk.213.a: "Ratify the renewed common agreement."
    ww1_kuk.213.b: "Return the settlement for further negotiation."
    ww1_kuk.213.t: "Renewing the Dual Monarchy"
    ww1_kuk.213.d:0 "Vienna and Budapest have agreed to renew the dual settlement with written guarantees of consultation and common responsibility. The ministries would remain accountable to the two principal governments. Ratification offers continuity while leaving the wider nationality demands before the crown."
    ww1_kuk.214.a:0 "Fund the charter and its administration."
    ww1_kuk.214.t: "A Nationality Charter"
    ww1_kuk.214.d:0 "Representatives have drafted common guarantees for local institutions, worship and language. The charter would give minority communities a firmer place in provincial administration. The government must now provide the officials and funds needed to uphold it."
    ww1_kuk.215.a: "Fund the army language service."
    ww1_kuk.215.t: "The Regimental Language Service"
    ww1_kuk.215.d:0 "Regimental officers have proposed a formal language service for the common army. Interpreters and agreed procedures would help men from different crownlands understand their orders and communicate with headquarters. The cabinet has been asked to fund the programme."
    ww1_kuk.216.a: "Grant the reviewed amnesty."
    ww1_kuk.216.b: "Maintain restrictions pending further review."
    ww1_kuk.216.t: "An Imperial Amnesty"
    ww1_kuk.216.d: "The government can release selected political detainees and review wartime restrictions. A carefully administered amnesty may restore public confidence, but it needs civil oversight and does not erase the reasons for protest."
    ww1_kuk.217.a:0 "Fund the agreed common services."
    ww1_kuk.217.t: "A Limited Reform Compromise"
    ww1_kuk.217.d:0 "The convention has reached a narrower compromise on consultation and common services. Several constitutional questions remain disputed, and further talks will be needed. Ministers propose funding the arrangements on which the delegations have been able to agree."
    ww1_kuk.218.a: "Fund maintenance and naval training."
    ww1_kuk.218.b:0 "Reserve the funds for civilian deliveries."
    ww1_kuk.218.t: "The Fleet Appropriations"
    ww1_kuk.218.d:0 "Naval officers seek an appropriation for maintenance, training and dockyard priorities. Civil delegates argue that food deliveries and relief should receive the available funds. The cabinet must choose which need is more urgent."
    ww1_kuk.219.a: "Fund the common railway service."
    ww1_kuk.219.t: "A Common Railway Board"
    ww1_kuk.219.d:0 "Provincial authorities and the common ministries propose a railway board to coordinate schedules and maintenance. Army transport must share the network with civilian deliveries. A common service could reduce the disputes that leave trains waiting at the junctions."


    ww1_germany.74.a: "The armistice takes effect"
    ww1_germany.112.t: "The Greater Poland Uprising"
    ww1_germany.112.d:0 "An uprising has broken out in Greater Poland as Polish forces seek to establish control of the province. The collapse of imperial authority has left the frontier uncertain, adding another dispute to the coming peace settlement."
    ww1_germany.112.a:0 "Another frontier in dispute."
    ww1_germany.100.t: "The 1912 Reichstag Election"
    ww1_germany.100.d: "The Reichstag election is reshaping the balance between the conservative parties, the Centre, and the Social Democrats. The government must decide whether to accommodate a broader parliamentary mandate or rely on the authority of the state."
    ww1_germany.100.a: "Respect the parliamentary mandate"
    ww1_germany.100.b: "Stand behind imperial authority"
    ww1_germany.101.t: "The Army Bill of 1913"
    ww1_germany.101.d: "The new army bill is before the Reichstag. Expanding the force strengthens the Empire in a dangerous Europe, but the measure also deepens the argument over taxation and parliamentary control."
    ww1_germany.101.a: "Pass the army bill"
    ww1_germany.101.b: "Seek a parliamentary compromise"
    ww1_germany.102.t: "The Auxiliary Service Law"
    ww1_germany.102.d: "The Auxiliary Service Law is bringing civilian labour under the direction of the war economy. Berlin can enforce broad mobilisation or preserve a measure of cooperation with organised labour."
    ww1_germany.102.a: "Mobilise the labour force"
    ww1_germany.102.b: "Secure a labour compromise"
    ww1_germany.103.t: "The Turnip Winter"
    ww1_germany.103.d: "The blockade and the failed harvest are tightening the supply of food. The turnip winter is testing the confidence of civilians and soldiers alike, and rationing now competes with local relief."
    ww1_germany.103.a: "Hold the line through rationing"
    ww1_germany.103.b: "Protect civilian relief"
    ww1_germany.104.t: "The Peace Resolution"
    ww1_germany.104.d: "A Reichstag peace resolution is calling for a negotiated settlement without annexations. The government can use the resolution to build a civilian cabinet or reject it in favour of another military effort."
    ww1_germany.104.a: "Accept a civilian cabinet"
    ww1_germany.104.b: "Reject the resolution"
    ww1_germany.105.t: "The January Strikes"
    ww1_germany.105.d: "Workers in Berlin and other industrial centres are striking over food shortages and the conduct of the war. The government must decide whether to negotiate or impose order."
    ww1_germany.105.a: "Negotiate with the workers"
    ww1_germany.105.b: "Suppress the strikes"
    ww1_germany.106.t: "The October Reforms"
    ww1_germany.106.d: "The October reforms are transferring responsibility to a parliamentary government as military defeat becomes unavoidable. Germany can accept parliamentary control or try to preserve military authority."
    ww1_germany.106.a: "Accept parliamentary control"
    ww1_germany.106.b: "Preserve military authority"
    ww1_germany.107.t: "Naval Unrest"
    ww1_germany.107.d: "Sailors are refusing orders as the fleet is called to a final operation. The naval command can negotiate with the crews or attempt to enforce discipline while the political order is already failing."
    ww1_germany.107.a: "Negotiate with the crews"
    ww1_germany.107.b: "Enforce naval discipline"
    ww1_germany.108.t: "The Burgfrieden and War Credits"
    ww1_germany.108.d: "The Reichstag is voting on war credits. The Burgfrieden has suspended open party conflict for the national emergency, but the decision binds the Empire to a long and costly war."
    ww1_germany.108.a: "Approve the war credits"
    ww1_germany.108.b: "Refuse the credits"
    ww1_germany.109.t: "The Naval Law of 1912"
    ww1_germany.109.d: "On 21 May 1912 the Reichstag approves another naval law. A larger battle fleet promises prestige and deterrence, while a smaller programme leaves more resources for the army and commerce protection."
    ww1_germany.109.a: "Expand the battle fleet"
    ww1_germany.109.b: "Concentrate on the army"
    ww1_germany.110.t: "The Hindenburg Programme"
    ww1_germany.110.d: "Hindenburg and Ludendorff are demanding central control of armaments and transport. The programme promises a greater flow of matériel, at the cost of civilian autonomy and political strain."
    ww1_germany.110.a: "Adopt the programme"
    ww1_germany.110.b: "Keep civilian controls"
    ww1_germany.1100.t: "German Empire: The 1912 Reichstag Election"
    ww1_germany.1100.d: "The Reichstag election is changing the balance between the conservative parties, the Centre, and the Social Democrats. Berlin is deciding how much parliamentary pressure the Empire can absorb while it preserves imperial authority."
    ww1_germany.1100.a: "A significant development"
    ww1_germany.1103.t: "German Empire: The Army Bill of 1913"
    ww1_germany.1103.d: "The army bill is expanding Germany's forces as the European powers compete for security. The measure is also deepening the dispute over taxation, military command, and parliamentary control."
    ww1_germany.1103.a: "A significant development"
    ww1_germany.1104.t: "German Empire: The Auxiliary Service Law"
    ww1_germany.1104.d: "The Auxiliary Service Law is placing civilian labour under the direction of the war economy. The government is choosing between broad mobilisation and a negotiated relationship with organised labour."
    ww1_germany.1104.a: "A significant development"
    ww1_germany.1105.t: "German Empire: The Turnip Winter"
    ww1_germany.1105.d: "The blockade and the failed harvest are tightening the supply of food. The turnip winter is testing civilian confidence and forcing Germany to weigh rationing against local relief."
    ww1_germany.1105.a: "A significant development"
    ww1_germany.1106.t: "German Empire: The Peace Resolution"
    ww1_germany.1106.d: "A Reichstag peace resolution is calling for a negotiated settlement without annexations. The government is deciding whether to build a civilian cabinet around it or reject it for another military effort."
    ww1_germany.1106.a: "A significant development"
    ww1_germany.1107.t: "German Empire: The January Strikes"
    ww1_germany.1107.d: "Workers in Berlin and other industrial centres are striking over food shortages and the conduct of the war. The government is choosing between negotiation and coercion as the home front strains."
    ww1_germany.1107.a: "A significant development"
    ww1_germany.1108.t: "German Empire: The October Reforms"
    ww1_germany.1108.d: "The October reforms are transferring responsibility to a parliamentary government as military defeat becomes unavoidable. Germany is deciding whether parliamentary control or military authority will guide the transition."
    ww1_germany.1108.a: "A significant development"
    ww1_germany.1109.t: "German Empire: Naval Unrest"
    ww1_germany.1109.d: "Sailors are refusing orders as the fleet is called to a final operation. The naval command is choosing between negotiations with the crews and an attempt to impose discipline."
    ww1_germany.1109.a: "A significant development"
    ww1_germany.1110.t: "German Empire: The Burgfrieden and War Credits"
    ww1_germany.1110.d: "The Reichstag is voting on war credits. The Burgfrieden suspends open party conflict for the emergency, but approval binds the Empire to a long and costly war."
    ww1_germany.1110.a: "A significant development"
    ww1_germany.200.t: "The Imperial Constitutional Settlement"
    ww1_germany.200.d: "The government is clarifying how the Crown, the Bundesrat, and the elected Reichstag share responsibility. The decision shapes the political language of the Empire without deciding its eventual postwar regime."
    ww1_germany.200.a: "Clarify constitutional responsibility"
    ww1_germany.200.b: "Preserve imperial prerogative"
    ww1_germany.201.t: "The Franchise Question"
    ww1_germany.201.d: "The Reichstag is debating whether Prussian political weight should remain distinct from the Empire's universal male suffrage. The choice gives one constitutional tradition greater room to shape wartime policy."
    ww1_germany.201.a: "Recognise the universal mandate"
    ww1_germany.201.b: "Preserve the Prussian franchise"
    ww1_germany.202.t: "The 1912 SPD Mandate"
    ww1_germany.202.d: "The Social Democrats hold the largest Reichstag delegation after the 1912 election. The government can negotiate practical cooperation or keep the party outside the imperial governing circle."
    ww1_germany.202.a: "Open a channel to the SPD"
    ww1_germany.202.b: "Contain the parliamentary challenge"
    ww1_germany.203.t: "A Cross-Class Burgfrieden"
    ww1_germany.203.d: "The wartime truce asks parties, unions, churches, and employers to suspend open conflict. It can preserve political capacity, but it also makes every later sacrifice a shared responsibility."
    ww1_germany.203.a: "Maintain the Burgfrieden"
    ww1_germany.203.b: "Return to open political contest"
    ww1_germany.204.t: "Civilian Chancellery or OHL Partnership"
    ww1_germany.204.d: "The conduct of the war is forcing a decision about the relationship between the chancellor and the Supreme Army Command. Germany can strengthen cabinet responsibility or give the military a formal policy partnership."
    ww1_germany.204.a: "Strengthen the civilian chancellery"
    ww1_germany.204.b: "Formalise the OHL partnership"
    ww1_germany.205.t: "The Press Bureau"
    ww1_germany.205.d: "Wartime censorship is being organised into a central press bureau. The government can pair controls with legal review or rely on direct military direction."
    ww1_germany.205.a: "Keep censorship under legal review"
    ww1_germany.205.b: "Let the command set the line"
    ww1_germany.206.t: "The War Finance Office"
    ww1_germany.206.d: "The Reich must fund an expanding war while imports and tax receipts are under pressure. Bonds offer immediate credit; taxation offers a slower but more accountable path."
    ww1_germany.206.a: "Prioritise war bonds"
    ww1_germany.206.b: "Rely on taxation and restraint"
    ww1_germany.207.t: "Food Supply Administration"
    ww1_germany.207.d: "The blockade and failed harvests are tightening the food supply. Berlin must balance central rationing against municipal relief as the winter tests civilian patience."
    ww1_germany.207.a: "Centralise rationing"
    ww1_germany.207.b: "Fund municipal relief"
    ww1_germany.208.t: "The 1917 Peace Resolution"
    ww1_germany.208.d: "The Reichstag is calling for a negotiated peace without annexations. The government can build a civilian policy around the resolution or reject it as an obstacle to military aims."
    ww1_germany.208.a: "Support a negotiated peace"
    ww1_germany.208.b: "Reject the resolution"
    ww1_germany.209.t: "Implement Cabinet Accountability"
    ww1_germany.209.d: "After parliamentary control is established, the wartime cabinet is deciding how to administer the state through the last weeks of the conflict. Administrative accountability can strengthen the constitutional handover without deciding the postwar settlement."
    ww1_germany.209.a: "Implement cabinet accountability"
    ww1_germany.209.b: "Retain imperial administrative control"
    ww1_germany.210.t: "The Haldane Conversations"
    ww1_germany.210.d: "Lord Haldane has arrived to discuss the question that now overshadows relations with Britain: the growth of the German fleet. London seeks reassurance that its naval predominance will not be challenged without limit, while our ministers seek confidence that Britain will not join a hostile continental coalition.\n\nThe conversations can open a path to an understanding. A naval convention and a formal coalition will require further agreements."
    ww1_germany.210.a: "Receive the British mission."
    ww1_germany.211.t: "The Mission to Berlin"
    ww1_germany.211.d: "Our mission has been received in Berlin. German ministers are prepared to continue the naval conversations, but expect the discussions to address the danger of British intervention in a continental war.\n\nAccepting further talks would settle neither our alliances nor the strength of the fleets. It would authorise the mission to seek terms that both governments could put before their cabinets."
    ww1_germany.211.a: "Continue the conversations on this basis."
    ww1_germany.211.b: "These proposals offer no sufficient basis."
    ww1_germany.212.t: "The Haldane Mission Returns"
    ww1_germany.212.d: "London has answered Berlin's naval approach. The result affects diplomatic confidence and the room available for future commerce, without guaranteeing British neutrality."
    ww1_germany.212.a: "Prepare a definite naval proposal."
    ww1_germany.212.b: "We must reckon with the failure."
    ww1_germany.213.t: "A Convention for the Fleets"
    ww1_germany.213.d: "The Admiralty and Foreign Office have completed the German proposal. Our combat fleet would be limited to six vessels for every ten in the Royal Navy, recognising Britain's predominance in exchange for an end to the uncontrolled naval competition.\n\nAcceptance will require the removal of surplus German warships. It will not by itself create a coalition or bring the proposed Belgian protocol into force."
    ww1_germany.213.a: "Submit the naval convention to London."
    ww1_germany.214.t: "The German Naval Convention"
    ww1_germany.214.d: "Germany has offered a definite limit to its combat fleet: six vessels for every ten in the Royal Navy. Berlin will be responsible for removing vessels above the agreed strength, while merchant shipping and auxiliaries remain outside the convention.\n\nThe proposal recognises our naval predominance. A continental coalition and a guarantee of Belgian neutrality would remain questions for a further agreement."
    ww1_germany.214.a: "Accept the six-to-ten convention."
    ww1_germany.214.b: "The offered limit is insufficient."
    ww1_germany.215.t: "The Naval Restraint Reply"
    ww1_germany.215.d: "Britain has answered Germany's proposal. Acceptance creates a narrow confidence measure; refusal leaves the existing fleet programme and diplomatic suspicion in place."
    ww1_germany.215.a: "Carry out the ratified convention."
    ww1_germany.215.b: "Close the negotiations on these terms."
    ww1_germany.216.t: "A Dutch Trade Proposal"
    ww1_germany.216.d:0 "Our diplomats have proposed closer commercial cooperation with the Netherlands. A dependable shipping arrangement could strengthen trade, but Dutch ministers must weigh its effect on relations with the other powers."
    ww1_germany.216.a: "Send the trade proposal"
    ww1_germany.217.t: "The Netherlands Considers German Trade"
    ww1_germany.217.d: "Berlin is offering a controlled trade arrangement with the Netherlands. Dutch ministers can accept practical commerce or refuse to risk closer association with Germany."
    ww1_germany.217.a: "Permit the commercial channel"
    ww1_germany.217.b: "Refuse the arrangement"
    ww1_germany.218.t:0 "The Dutch Reply"
    ww1_germany.218.d:0 "The Dutch government has answered our commercial proposal. The reply will shape the next stage of negotiations over trade and shipping."
    ww1_germany.218.a: "Use the accepted trade channel"
    ww1_germany.218.b: "Record the refusal"
    ww1_germany.219.t: "Consultation with Vienna"
    ww1_germany.219.d: "Berlin is asking Austria-Hungary to discuss war aims and Balkan risks before commitments harden. Vienna must decide whether consultation strengthens the alliance or constrains it."
    ww1_germany.219.a: "Request a formal consultation"
    ww1_germany.220.t: "Vienna Answers Berlin"
    ww1_germany.220.d: "Germany is asking for a direct exchange on Balkan policy and war aims. Austria-Hungary can accept the consultation or refuse to let Berlin qualify its freedom of action."
    ww1_germany.220.a: "Accept the consultation"
    ww1_germany.220.b: "Refuse German conditions"
    ww1_germany.221.t:0 "The Austrian Reply"
    ww1_germany.221.d:0 "Vienna has answered our request for consultation. The reply will determine how closely the two governments can coordinate their policy in the Balkans."
    ww1_germany.221.a: "Coordinate with Vienna"
    ww1_germany.221.b: "Proceed without the consultation"
    ww1_germany.222.t: "Restrain Balkan Escalation"
    ww1_germany.222.d: "Berlin is asking Vienna to consider a restrained Balkan policy and to answer before a local dispute becomes a general war. The initiative depends on Austria-Hungary's decision."
    ww1_germany.222.a: "Ask Vienna to consider restraint"
    ww1_germany.223.t: "Vienna Considers Balkan Restraint"
    ww1_germany.223.d: "Germany is proposing a limited Balkan consultation. Austria-Hungary may accept a slower diplomatic process or insist on preserving its full freedom of action."
    ww1_germany.223.a: "Accept the restrained approach"
    ww1_germany.223.b: "Reject the restrained approach"
    ww1_germany.224.t: "The Balkan Restraint Reply"
    ww1_germany.224.d: "Vienna has answered the Balkan initiative. Acceptance improves the chance of coordinated diplomacy; refusal leaves the older security logic in place."
    ww1_germany.224.a: "Coordinate the next steps"
    ww1_germany.224.b: "Prepare for escalation"
    ww1_germany.225.t:0 "An Economic Mission to Constantinople"
    ww1_germany.225.d:0 "The Foreign Office proposes a permanent economic mission to Constantinople. Its officials would negotiate railway finance, procurement contracts and access to Ottoman ports, strengthening German influence through trade."
    ww1_germany.225.a:0 "Dispatch the mission."
    ww1_germany.226.t: "Constantinople Considers the Mission"
    ww1_germany.226.d: "German officials are proposing practical coordination for railways, credit, and procurement. The Ottoman government can accept the mission or refuse a closer economic relationship."
    ww1_germany.226.a: "Accept German economic coordination"
    ww1_germany.226.b: "Refuse the mission"
    ww1_germany.227.t: "The Ottoman Mission Reply"
    ww1_germany.227.d: "Constantinople has answered the economic mission. Acceptance improves coordination and supply planning; refusal leaves the existing relationship unchanged."
    ww1_germany.227.a: "Implement the accepted mission"
    ww1_germany.227.b: "Record the refusal"
    ww1_germany.228.t: "Scandinavian Shipping Talks"
    ww1_germany.228.d: "Berlin is asking Sweden to protect lawful shipping and information channels. Stockholm must decide whether the proposal fits its neutrality."
    ww1_germany.228.a: "Send the shipping proposal"
    ww1_germany.229.t: "Sweden Considers Shipping Terms"
    ww1_germany.229.d: "German envoys are offering a limited shipping arrangement. Sweden can accept the commercial channel or refuse to risk association with Germany's wartime policy."
    ww1_germany.229.a: "Permit the shipping channel"
    ww1_germany.229.b: "Refuse the terms"
    ww1_germany.230.t:0 "The Swedish Reply"
    ww1_germany.230.d:0 "Stockholm has answered our proposal for closer cooperation. Our diplomats are considering the reply as they prepare the next stage of relations with Sweden."
    ww1_germany.230.a: "Use the accepted channel"
    ww1_germany.230.b: "Proceed without Swedish cooperation"
    ww1_germany.231.t: "Italian Neutrality Terms"
    ww1_germany.231.d: "Germany is asking Italy to consider a restrained settlement and a commercial relationship. Rome must decide whether the terms outweigh the risks of association."
    ww1_germany.231.a: "Transmit the Italian terms"
    ww1_germany.232.t: "Rome Considers German Terms"
    ww1_germany.232.d: "German diplomats are offering Italy a limited understanding. Rome can accept a more cordial channel or reject the proposal and preserve its freedom of action."
    ww1_germany.232.a: "Accept the limited understanding"
    ww1_germany.232.b: "Reject the German terms"
    ww1_germany.233.t: "The Italian Reply"
    ww1_germany.233.d: "Rome has answered the German initiative. Acceptance improves diplomatic access without guaranteeing Italian neutrality; refusal closes the proposed channel."
    ww1_germany.233.a: "Develop the accepted relationship"
    ww1_germany.233.b: "Prepare for Italian opposition"
    ww1_germany.234.t:0 "Talks over the Eastern War"
    ww1_germany.234.d:0 "The Foreign Office proposes opening negotiations with Russia. A preliminary exchange could establish the terms on which a wider peace might be discussed, though the two governments remain far apart."
    ww1_germany.234.a:0 "Send the proposal."
    ww1_germany.235.t: "Russia Considers an Eastern Framework"
    ww1_germany.235.d: "Germany is offering Russia a process for discussing an eastern peace. The Russian government can accept the opening or refuse to negotiate while the war continues."
    ww1_germany.235.a: "Enter the peace framework"
    ww1_germany.235.b: "Refuse the German opening"
    ww1_germany.236.t:0 "The Russian Reply"
    ww1_germany.236.d:0 "The Russian government has answered our diplomatic proposal. Its response will shape the prospects for a broader understanding between the two powers."
    ww1_germany.236.a: "Prepare the accepted talks"
    ww1_germany.236.b: "Return to wartime planning"
    ww1_germany.237.t: "American Commercial Outreach"
    ww1_germany.237.d: "Berlin is seeking commercial access and clearer maritime conduct with Washington while the United States remains outside the war. America must decide whether to answer."
    ww1_germany.237.a: "Send the commercial proposal"
    ww1_germany.238.t: "Washington Considers German Commerce"
    ww1_germany.238.d: "German diplomats are offering a limited commercial channel and clearer maritime communication. The United States can accept the opening or refuse it without any promise of neutrality."
    ww1_germany.238.a: "Permit the commercial channel"
    ww1_germany.238.b: "Refuse the proposal"
    ww1_germany.239.t: "The American Commercial Reply"
    ww1_germany.239.d: "Washington has answered Germany's proposal. Acceptance gives merchants a narrow diplomatic opening; refusal leaves American suspicion and policy unchanged."
    ww1_germany.239.a: "Use the accepted opening"
    ww1_germany.239.b: "Continue without American cooperation"
    ww1_germany.1111.t: "German Empire: The Naval Law of 1912"
    ww1_germany.1111.d: "On 21 May 1912 the Reichstag approves another naval law. A larger battle fleet promises prestige and deterrence, while a restrained programme leaves more resources for the army and commerce protection."
    ww1_germany.1111.a: "A significant development"
    ww1_germany.1112.t: "German Empire: The Hindenburg Programme"
    ww1_germany.1112.d: "Hindenburg and Ludendorff are demanding central control of armaments and transport. The programme promises more matériel while reducing civilian autonomy and increasing political strain."
    ww1_germany.1112.a: "A significant development"
 GE1_anglo_german_faction:0 "Anglo-German Compact"
 GE1_continental_faction:0 "Continental Alliance"
 ww1_germany.240.t:0 "The Coalition Offer to Britain"
 ww1_germany.240.d:0 "Our representatives have assembled the articles for a coalition with Britain. The naval convention is joined by a Belgian protocol under which Germany will recognise and guarantee Belgian neutrality.\n\nLondon must accept the agreement before that protocol enters into force. A ratified coalition will replace Germany's Austrian alignment and bind our operational plans to the Belgian undertaking."
 ww1_germany.240.a:0 "Present the treaty to the British cabinet."
 ww1_germany.240.b:0 "Withhold the final offer."
 ww1_germany.241.t:0 "A Coalition with Germany"
 ww1_germany.241.d:0 "Berlin has submitted a formal coalition treaty. It recognises the naval convention and includes a protocol guaranteeing Belgian neutrality, which would become binding upon acceptance of the coalition.\n\nThe agreement would draw Britain into a new European partnership and end Germany's former Austrian alignment. The cabinet must decide whether the obligations and assurances justify that change."
 ww1_germany.241.a:0 "Accept the coalition and the Belgian protocol."
 ww1_germany.241.b:0 "Britain cannot accept these obligations."
 ww1_germany.242.t:0 "The British Answer"
 ww1_germany.242.d:0 "Britain has answered Germany's complete proposal. Berlin now determines whether the two governments will organise their partnership."
 ww1_germany.242.a:0 "Ratify the coalition and issue the protocol."
 ww1_germany.242.b:0 "Record the British refusal."
 ww1_germany.243.t:0 "The Continental Balance"
 ww1_germany.243.d:0 "The Anglo-German agreement has unsettled the balance of Europe. A separate understanding between France and Russia could secure their interests on the continent, but both governments must decide whether such an arrangement is acceptable."
 ww1_germany.243.a:0 "Open talks with France."
 ww1_germany.243.b:0 "Pursue the continental agreement."
 ww1_germany.243.c:0 "Reject the proposed arrangement."
 ww1_germany.244.t:0 "Russia Considers the Arrangement"
 ww1_germany.244.d:0 "France has accepted a continental framework. Russia must decide whether to join the new French-led faction before the crisis turns into war."
 ww1_germany.244.a:0 "Join the continental arrangement"
 ww1_germany.244.b:0 "Remain outside it"
 ww1_germany.245.t:0 "The Continental Negotiations"
 ww1_germany.245.d:0 "The governments concerned have delivered their replies to the proposed continental agreement. Their decisions will determine whether France and Russia can establish a common alliance."
 ww1_germany.245.a:0 "Conclude the agreement."
 ww1_germany.245.b:0 "The negotiations are at an end."
 ww1_germany.246.t:0 "An Italian Invitation"
 ww1_germany.246.d:0 "The new continental faction exists. Italy may be invited to join it, while its neutrality and existing diplomatic choices remain respected."
 ww1_germany.246.a:0 "Send the invitation"
 ww1_germany.247.t:0 "Italy Chooses"
 ww1_germany.247.d:0 "France has offered Italy a place in the continental faction. Rome must decide whether membership serves its interests."
 ww1_germany.247.a:0 "Join the continental faction"
 ww1_germany.247.b:0 "Remain independent"
 ww1_germany.248.t:0 "Italy's Answer"
 ww1_germany.248.d:0 "Italy has answered the invitation. The continental faction keeps its membership decision separate from the coming question of war."
 ww1_germany.248.a:0 "Record the accession"
 ww1_germany.248.b:0 "Accept Italian neutrality"
 ww1_germany.249.t:0 "The Kronprinz Plan"
 ww1_germany.249.d:0 "The Kronprinz plan can now be presented to the two alliances. Britain, France, Russia, and any participating Italy must each agree before Germany opens the war."
 ww1_germany.249.a:0 "Ask every partner for approval"
 ww1_germany.250.t:0 "Britain and the Continental Crisis"
 ww1_germany.250.d:0 "Germany has asked Britain to support its plans for war on the continent. An alliance has brought the two governments together, but the cabinet must now decide whether to commit British forces."
 ww1_germany.250.a:0 "Stand beside Germany."
 ww1_germany.250.b:0 "Britain will not enter this war."
 ww1_germany.251.t:0 "The British War Answer"
 ww1_germany.251.d:0 "Britain has answered the request for coordinated war entry. Germany records the decision before hearing from the continental partners."
 ww1_germany.251.a:0 "Continue the coordination"
 ww1_germany.251.b:0 "Suspend the plan"
 ww1_germany.252.t:0 "Russia and the Continental Crisis"
 ww1_germany.252.d:0 "France has requested Russian support in the coming confrontation with Germany. Our ministers must weigh the obligations of the alliance against the cost of another continental war."
 ww1_germany.252.a:0 "Stand beside France."
 ww1_germany.252.b:0 "Russia will not enter this war."
 ww1_germany.253.t:0 "Russia's War Answer"
 ww1_germany.253.d:0 "Russia has answered the coordinated war request. Germany records the decision before the French and Italian replies arrive."
 ww1_germany.253.a:0 "Continue the coordination"
 ww1_germany.253.b:0 "Suspend the plan"
 ww1_germany.254.t:0 "France and the Continental Crisis"
 ww1_germany.254.d:0 "The continental crisis has reached the point at which diplomacy must give way to a decision. Our partners seek a common declaration of war against Germany, placing the responsibility for opening hostilities before the French government."
 ww1_germany.254.a:0 "Commit France to the war."
 ww1_germany.254.b:0 "Refuse a declaration of war."
 ww1_germany.255.t:0 "Italy and the Continental Crisis"
 ww1_germany.255.d:0 "Our allies have asked Italy to enter the war against Germany. The cabinet must decide whether the obligations of the alliance justify committing the army and fleet."
 ww1_germany.255.a:0 "Italy will enter the war."
 ww1_germany.255.b:0 "We cannot make this commitment."
 ww1_germany.256.t:0 "Italy's War Answer"
 ww1_germany.256.d:0 "Italy has answered the final war-entry request. Germany records the decision with the other alliance replies."
 ww1_germany.256.a:0 "Continue the coordination"
 ww1_germany.256.b:0 "Suspend the plan"
 ww1_germany.257.t:0 "France's War Answer"
 ww1_germany.257.d:0 "France has answered the final war-entry request. Germany records the decision and waits for the remaining partner approvals."
 ww1_germany.257.a:0 "Continue the coordination"
 ww1_germany.257.b:0 "Suspend the plan"
 ww1_germany.258.t:0 "The Final Consultations"
 ww1_germany.258.d:0 "The rival alliances are completing their military preparations. Before the armies move, our diplomats must confirm that the governments concerned are prepared to honour the proposed commitments."
 ww1_germany.258.a:0 "Continue the consultations."
 ww1_germany.258.b:0 "Issue the final orders."
 ww1_russia.200.t:0 "A Renewed Imperial Government"
 ww1_russia.200.d:0 "The Council of Ministers has prepared a programme to restore coherence to imperial government. Nicholas will retain the crown and executive authority, while ministers and provincial officials work under a common set of administrative responsibilities."
 ww1_russia.200.a:0 "Establish the renewed imperial cabinet."
 ww1_russia.250.t:0 "Russia Renews Its Imperial Government"
 ww1_russia.250.d:0 "The Russian court has announced a new programme of imperial government under Nicholas II. Ministers are to work within a common administrative framework, retaining the monarchy's executive authority while promising a more effective state."
 ww1_russia.250.a:0 "The dynasty has chosen reform."
 ww1_russia.201.t:0 "A Ministry Responsible to the Duma"
 ww1_russia.201.d:0 "The crown and the moderate parties have reached an understanding on ministerial responsibility. Nicholas will remain sovereign, but the cabinet must defend its conduct and finances before the State Duma."
 ww1_russia.201.a:0 "Accept the constitutional settlement."
 ww1_russia.251.t:0 "Russia Adopts a Responsible Ministry"
 ww1_russia.251.d:0 "Russia's crown has accepted a ministry answerable to the State Duma. The agreement preserves the monarchy while giving parliamentary confidence a recognised place in the conduct of government."
 ww1_russia.251.a:0 "A compromise between crown and parliament."
 ww1_russia.202.t:0 "A Republic before the Assembly"
 ww1_russia.202.d:0 "The national assembly is preparing to place executive authority in the hands of a civilian cabinet led by Georgy Lvov. The proposed republic will rest on elected institutions, with ministers facing the task of turning the assembly's authority into a functioning government."
 ww1_russia.202.a:0 "Establish the republic."
 ww1_russia.252.t:0 "A Russian Republic Proclaimed"
 ww1_russia.252.d:0 "Russia's national assembly has established a republic under a civilian government led by Georgy Lvov. Elected institutions are to replace dynastic authority as the foundation of the state, bringing a profound change to the country's political life."
 ww1_russia.252.a:0 "A new order in Russia."
 ww1_russia.203.t:0 "A Coalition of Labour and the Countryside"
 ww1_russia.203.d:0 "Alexander Kerensky is assembling a coalition of democratic parties, workers' representatives and peasant interests. The proposed ministry promises a broader social settlement, though agreement on its programme has yet to settle the competing demands placed upon the republic."
 ww1_russia.203.a:0 "Form the coalition."
 ww1_russia.253.t:0 "Kerensky Forms a Social Coalition"
 ww1_russia.253.d:0 "Alexander Kerensky has formed a government seeking support among workers, peasant representatives and the democratic parties. Its programme links elected civilian authority with commitments to public works and social cooperation."
 ww1_russia.253.a:0 "The republic seeks a broader foundation."
 ww1_russia.204.t:0 "Alekseev's National Directorate"
 ww1_russia.204.d:0 "General Mikhail Alekseev is preparing to assume executive authority with the backing of a council of officers. His supporters promise coordinated administration and dependable mobilisation, while civilian critics question the place left for representative government."
 ww1_russia.204.a:0 "Entrust the directorate to Alekseev."
 ww1_russia.254.t:0 "Alekseev Takes Power in Russia"
 ww1_russia.254.d:0 "Mikhail Alekseev has assumed the national executive at the head of a military directorate. Civil ministries will continue their work under a government whose authority rests upon the officer corps and its promise to restore effective administration."
 ww1_russia.254.a:0 "The officers have taken responsibility."
 ww1_russia.205.t:0 "Kornilov's Emergency Government"
 ww1_russia.205.d:0 "Lavr Kornilov is demanding the powers of an emergency executive to restore discipline and political order. His programme places military priorities at the centre of government, drawing support from those who believe the state can no longer endure divided authority."
 ww1_russia.205.a:0 "Establish Kornilov's executive."
 ww1_russia.255.t:0 "Kornilov Assumes the Executive"
 ww1_russia.255.d:0 "Lavr Kornilov has taken control of Russia's emergency administration. The new government promises discipline and national recovery, placing the civil service under the supervision of a military executive."
 ww1_russia.255.a:0 "Russia comes under military rule."
 ww1_russia.206.t:0 "Kolchak's National Government"
 ww1_russia.206.d:0 "Alexander Kolchak is preparing to lead a national military government. His programme gives immediate attention to ports, supplies and the machinery of administration, presenting dependable services as the foundation of restored state authority."
 ww1_russia.206.a:0 "Place Kolchak at the head of government."
 ww1_russia.256.t:0 "Kolchak Heads the Russian Government"
 ww1_russia.256.d:0 "Alexander Kolchak has assumed leadership of a national military government in Russia. Its ministers have been ordered to coordinate transport, maritime affairs and public administration under a common executive programme."
 ww1_russia.256.a:0 "An admiral at the helm of the state."
 ww1_russia.207.t:0 "A Charter for the Common State"
 ww1_russia.207.d:0 "The nationalities commission has presented a charter defining the responsibilities shared across the country. Defence, the treasury and major transport links will remain common concerns, while regional administration is to rest on a clearer division of authority."
 ww1_russia.207.a:0 "Approve the charter."
 ww1_russia.208.t:0 "A Union of Self-Governing Provinces"
 ww1_russia.208.d:0 "Regional representatives have negotiated a federal division of powers with the government. The proposed settlement gives local institutions responsibility for schools and public services while preserving a common army, treasury and internal market."
 ww1_russia.208.a:0 "Ratify the federal settlement."
 ww1_russia.257.t:0 "Russia Adopts a Federal Settlement"
 ww1_russia.257.d:0 "Russia's government and regional representatives have agreed on a federal settlement. The provinces will administer local affairs within a common state, replacing disputed lines of authority with a negotiated division of responsibilities."
 ww1_russia.257.a:0 "A new compact holds the country together."
 ww1_russia.210.t:0 "An Approach to Berlin"
 ww1_russia.210.d:0 "The Foreign Ministry has prepared a proposal for a Russian-German convention on non-aggression and commerce. Its supporters hope to ease continental tensions and open a new course for Russian diplomacy, but Berlin's answer remains uncertain."
 ww1_russia.210.a:0 "Send the proposal to Berlin."
 ww1_russia.211.t:0 "An Approach to Tokyo"
 ww1_russia.211.d:0 "Russian representatives have drawn up a commercial understanding covering port work and industrial purchasing with Japan. The ministry hopes that practical cooperation can build confidence between two powers whose interests meet across the Far East."
 ww1_russia.211.a:0 "Present the proposal to Japan."
 ww1_russia.212.t:0 "A Policy of Armed Neutrality"
 ww1_russia.212.d:0 "The government is preparing to pursue an independent course between Europe's rival alliances. Its declaration of armed neutrality places national defence and freedom of diplomatic action at the centre of Russian policy."
 ww1_russia.212.a:0 "Proclaim armed neutrality."
 ww1_russia.258.t:0 "Russia Announces Armed Neutrality"
 ww1_russia.258.d:0 "The Russian government has announced a policy of armed neutrality. Its ministers intend to withdraw from competing alliance commitments and rely upon an independent programme of national defence."
 ww1_russia.258.a:0 "Europe must reckon with Russia's new course."
 ww1_russia.213.t:0 "A Russian Proposal for a Convention"
 ww1_russia.213.d:0 "Russian envoys have offered a convention on non-aggression and commercial cooperation. They present it as the beginning of a new relationship with Germany and a departure from the diplomatic arrangements that have divided the two countries."
 ww1_russia.213.a:0 "Accept the Russian proposal."
 ww1_russia.213.b:0 "Decline the proposed convention."
 ww1_russia.214.t:0 "Berlin Accepts the Convention"
 ww1_russia.214.d:0 "The German government has accepted our proposed convention. The agreement provides a foundation for non-aggression and commerce as Russia moves towards a more independent diplomatic position."
 ww1_russia.214.a:0 "Conclude the convention."
 ww1_russia.216.t:0 "Berlin Declines the Convention"
 ww1_russia.216.d:0 "Berlin has rejected our proposal for a new convention. The ministry must now reconsider its approach to Germany, with the hopes attached to this diplomatic opening left unfulfilled."
 ww1_russia.216.a:0 "We shall consider our next approach."
 ww1_russia.259.t:0 "A Russian-German Convention"
 ww1_russia.259.d:0 "Russia and Germany have announced a convention on non-aggression and commercial cooperation. The agreement marks a departure in their relations as the Russian government moves away from its former alliance commitments."
 ww1_russia.259.a:0 "The continental balance is shifting."
 ww1_russia.215.t:0 "A Russian Commercial Proposal"
 ww1_russia.215.d:0 "Russian envoys have proposed a programme of port cooperation and industrial purchasing. Their government hopes that regular commercial work can provide a steadier foundation for relations between Russia and Japan."
 ww1_russia.215.a:0 "Accept the commercial understanding."
 ww1_russia.215.b:0 "Decline the Russian proposal."
 ww1_russia.217.t:0 "Tokyo Accepts the Understanding"
 ww1_russia.217.d:0 "Japan has accepted our proposed commercial programme. Officials from both countries can now begin the work of coordinating port arrangements and industrial purchasing under a continuing diplomatic understanding."
 ww1_russia.217.a:0 "Begin the joint programme."
 ww1_russia.218.t:0 "Tokyo Declines the Understanding"
 ww1_russia.218.d:0 "The Japanese government has declined our commercial proposal. Our representatives are returning without an agreement, leaving the ministry to reconsider how best to approach Tokyo."
 ww1_russia.218.a:0 "Another opening must be found."

 ww1_germany.284.t:0 "A Danubian Opening"
 ww1_germany.284.d:0 "The British understanding gives Berlin room to reshape its eastern partnership. Commercial access and diplomatic missions can draw Vienna into a negotiated reorganization, but the process must proceed in stages."
 ww1_germany.284.a:0 "Begin the pressure campaign."
 ww1_germany.284.b:0 "Leave Vienna independent for now."
 ww1_germany.285.t:0 "German Commercial Pressure"
 ww1_germany.285.d:0 "German ministries are offering trade and credit in return for a closer say in the monarchy's administration. Accepting the arrangement may stabilize the economy while exposing the imperial government to further demands."
 ww1_germany.285.a:0 "Hear the German mission."
 ww1_germany.285.b:0 "Reject the pressure."
 ww1_germany.286.t:0 "The Crownlands and Berlin"
 ww1_germany.286.d:0 "Representatives of the Czech and Hungarian lands seek a greater voice in the future of the Habsburg monarchy. Supporting them could strengthen our influence, but would further strain relations with the imperial court."
 ww1_germany.286.a:0 "Support the crownland representatives."
 ww1_germany.286.b:0 "Continue negotiations with Vienna."
 ww1_germany.287.t:0 "Crownland Demands"
 ww1_germany.287.d:0 "Local leaders are asking for durable representation and authority over their own affairs. Vienna can recognize the demand, or risk turning German encouragement into an open constitutional crisis."
 ww1_germany.287.a:0 "Recognize their representation."
 ww1_germany.287.b:0 "Defend imperial prerogatives."
 ww1_germany.288.t:0 "The Austrian Settlement"
 ww1_germany.288.d:0 "The negotiations over the Habsburg monarchy have reached a decisive stage. A negotiated separation remains possible, but an ultimatum would place the future of the crownlands at risk of war."
 ww1_germany.288.a:0 "Offer a negotiated separation."
 ww1_germany.288.b:0 "Deliver the ultimatum."
 ww1_germany.289.t:0 "Vienna's Conditions"
 ww1_germany.289.d:0 "German demands have forced the future of the common state before the court. Separate governments in Prague, Budapest, Kraków and Zagreb may bring the constitutional struggle to an end. Our ministers insist, however, that separation must preserve those governments as subjects of the Austrian crown.\n\nVienna will consider a settlement on that basis. The surrender of Austria itself would require a new agreement."
 ww1_germany.289.a:0 "Separation, under the Austrian crown."
 ww1_germany.289.b:0 "Refuse the ultimatum."
 ww1_germany.290.t:0 "The Danubian Settlement"
 ww1_germany.290.d:0 "The delegates can now draw up a settlement for the Habsburg lands. One proposal preserves an Austrian crown with four subject governments; another would bring Austria into Germany and transfer those governments to Berlin. The charters must settle who will exercise the authority once held by the common ministries."
 ww1_germany.290.a:0 "Prepare the final settlement."
 ww1_germany.291.a:0 "Prepare the wargoal."
 ww1_germany.293.t:0 "A Separate Peace with Britain"
 ww1_germany.293.d:0 "With Britain at war against us, Berlin can offer a costly separate peace and a new basis for Anglo-German cooperation."
 ww1_germany.293.a:0 "Offer the London truce."
 ww1_germany.294.t:0 "The German Wartime Offer"
 ww1_germany.294.d:0 "Germany offers to end the war between our two countries, guarantee Belgian neutrality, and restrain its navy."
 ww1_germany.294.a:0 "Accept the separate peace."
 ww1_germany.294.b:0 "Reject the German offer."
 ww1_germany.295.t:0 "Britain's Reply"
 ww1_germany.295.d:0 "London has delivered its answer to the proposed separate peace. The reply will determine whether an agreement over Belgium and the naval question can bring our governments together."
 ww1_germany.295.a:0 "Conclude the British agreement."
 ww1_germany.295.b:0 "The negotiations have failed."
 ww1_russia.260.t:0 "A Russian-Japanese Commercial Understanding"
 ww1_russia.260.d:0 "Russia and Japan have announced a new commercial understanding. Permanent missions will coordinate port work and industrial purchasing as the two governments seek more dependable relations in the Far East."
 ww1_russia.260.a:0 "Commerce opens a new channel."
 ww1_russia.19.b:0 "Press our territorial claims."
 ww1_britain.200.t:0 "The Home Rule Question"
 ww1_britain.200.d:0 "Ministers face a choice that cannot be postponed indefinitely. The Irish parliamentary delegation seeks an elected administration, while Ulster Unionists fear that their rights will disappear under a Dublin majority. Constitutional reform has opened a legislative route, but passage of a bill alone will not settle finance, policing or local representation. A negotiated compact offers a chance to keep the dispute within Parliament."
 ww1_britain.200.a:0 "Bring the representatives to the table."
 ww1_britain.201.t:0 "An Irish Constitutional Compact"
 ww1_britain.201.d:0 "An elected Irish administration is to assume responsibility for local affairs. Defence and foreign policy will remain with the United Kingdom, while guarantees for minorities form part of the settlement. Ministers are preparing to put the agreement into effect."
 ww1_britain.201.a:0 "Implement the compact."
 ww1_britain.202.t:0 "The Irish Convention"
 ww1_britain.202.d:0 "Representatives have gathered to discuss Irish self-government, public finances and the position of Ulster. The cabinet must decide whether to support a constitutional compact or maintain the wartime suspension."
 ww1_britain.202.a:0 "Support the constitutional compact."
 ww1_britain.202.b:0 "Maintain the suspension."
 ww1_britain.203.t:0 "A Government of National Coalition"
 ww1_britain.203.d:0 "The demands of war have outgrown a narrow ministry. Opposition leaders and labour representatives enter negotiations over a common government, while the shell crisis exposes the need for clearer procurement authority. Asquith remains prime minister, but the coalition must reconcile party interests, military recruitment and the factories that keep the armies supplied."
 ww1_britain.203.a:0 "Share responsibility for the war."
 ww1_britain.204.t:0 "Asquith Remains Prime Minister"
 ww1_britain.204.d:0 "The cabinet has agreed to continue under Asquith. Departmental committees will receive clearer responsibilities, while the full cabinet retains authority over the conduct of the war."
 ww1_britain.204.a:0 "Strengthen the cabinet committees."
 ww1_britain.205.t:0 "Lloyd George's War Cabinet"
 ww1_britain.205.d:0 "David Lloyd George has formed a smaller cabinet to direct the war. A permanent secretariat will carry its decisions to the departments, with manpower, shipping and production among its immediate priorities."
 ww1_britain.205.a:0 "Give the War Cabinet its mandate."
 ww1_britain.206.t:0 "The Military Service Act"
 ww1_britain.206.d:0 "Parliament has introduced compulsory service as voluntary recruitment falls short of the army's needs. Local tribunals are preparing to hear claims for exemption and preserve workers in essential occupations."
 ww1_britain.206.a:0 "Organise the recruiting offices."
 ww1_britain.207.t:0 "A British Approach to Berlin"
 ww1_britain.207.d:0 "British representatives have proposed renewed talks over the naval rivalry and Belgian neutrality. An agreement could ease tensions between our governments, but London is seeking firm assurances before considering a wider treaty."
 ww1_britain.207.a:0 "Discuss the British proposals."
 ww1_britain.207.b:0 "Retain our present commitments."
 ww1_britain.208.t:0 "British Mediation"
 ww1_britain.208.d:0 "British diplomats are offering to carry proposals between the belligerents. The government hopes that its position outside the continental war can provide an opening for negotiations."
 ww1_britain.208.a:0 "Keep the diplomatic channels open."
 ww1_britain.209.t:0 "The British Invitation"
 ww1_britain.209.d:0 "London has invited Portugal to join its alliance. The cabinet must weigh the obligations of our relationship with Britain against the demands that membership would place on our armed forces and finances."
 ww1_britain.209.a:0 "Accept the invitation."
 ww1_britain.209.b:0 "Remain outside the alliance."
 ww1_britain.210.t:0 "Britain Approaches Sofia"
 ww1_britain.210.d:0 "British representatives have invited Bulgaria to join their alliance. Their proposal offers a chance to influence the Balkan settlement, but would bind our government to Britain's partners and their commitments."
 ww1_britain.210.a:0 "Accept the British invitation."
 ww1_britain.210.b:0 "Decline the proposal."
 ww1_britain.211.t:0 "A Constitutional Settlement in Ireland"
 ww1_britain.211.d:0 "London announces an agreement on Irish local self-government with parliamentary oversight and minority guarantees. Defence and foreign policy remain shared, while an elected administration receives responsibility for ordinary local affairs. Supporters present the compact as an alternative to armed confrontation. Its survival will depend on whether the participating governments honour the terms they have just accepted."
 ww1_britain.211.a:0 "A difficult compromise."
 ww1_britain.212.t:0 "A New British War Cabinet"
 ww1_britain.212.d:0 "David Lloyd George assumes the British premiership and forms a smaller cabinet dedicated to the war. A permanent secretariat is to carry its decisions to the ministries, while Dominion consultation gives the overseas war effort a stronger voice. The reorganisation promises more forceful direction of shipping, production and military strategy; the scale of the conflict will test that promise immediately."
 ww1_britain.212.a:0 "Britain changes the machinery of war."
 ww1_britain.213.t:0 "A Coalition Government"
 ww1_britain.213.d:0 "Political leaders have agreed to share responsibility for the war under Asquith. The broader ministry faces urgent disputes over recruitment, military contracts and the supply of munitions."
 ww1_britain.213.a:0 "The coalition must get to work."
 ww1_turkey.32.t:0 "The Imperial Settlement"
 ww1_turkey.32.d:0 "The government has announced a further settlement of imperial authority. Ministers present it as a foundation for more dependable rule. The task of securing cooperation across the empire remains before them."
 ww1_turkey.32.a:0 "Record the government's settlement."
 ww1_turkey.72.t:0 "The Damage at Haidar Pasha"
 ww1_turkey.72.d:0 "Reports from Haidar Pasha confirm serious damage to the station and its military stores. Supply officers must find other arrangements while repairs begin. The loss has shaken confidence in the conduct of the war effort."
 ww1_turkey.72.a:0 "The supply service must recover."
 ww1_turkey.1701.t:0 "German Military Training"
 ww1_turkey.1701.d:0 "Our cooperation with Germany has brought new military methods to the Ottoman army."
 ww1_turkey.1701.a:0 "Adopt the new training"
 ww1_turkey.1702.t:0 "The German Mission Ends"
 ww1_turkey.1702.d:0 "With Germany now our enemy, its military mission and training programme can no longer continue."
 ww1_turkey.1702.a:0 "Dismiss the German mission"
 ww1_france.200.t:0 "A Ministry of Social Reform"
 ww1_france.200.d:0 "A parliamentary coalition has agreed to support a programme of labour representation and social reform. The new ministry must turn that agreement into legislation while maintaining support across the governing parties."
 ww1_france.200.a:0 "Give the ministry a mandate."
 ww1_france.201.t:0 "An Exceptional Presidential Mandate"
 ww1_france.201.d:0 "Parliament considers giving President Poincaré exceptional authority over national defence. A permanent secretariat will connect the ministries and record the orders issued under this mandate. Critics fear that the presidency is acquiring powers normally exercised by a responsible cabinet; supporters argue that departmental rivalries have made a stronger executive necessary. The new arrangement must define its limits if the Republic is to retain a civilian constitution."
 ww1_france.201.a:0 "Approve the exceptional mandate."
 ww1_france.202.t:0 "The Sacred Union"
 ww1_france.202.d:0 "Parties and labour representatives have agreed to share responsibility for national defence. Their common programme covers recruitment, essential production and civilian relief under parliamentary authority."
 ww1_france.202.a:0 "Organise the common effort."
 ww1_france.203.t:0 "Briand's Coalition Ministry"
 ww1_france.203.d:0 "Aristide Briand has brought the coalition partners together around a common programme. Recruitment, finance and relations with our allies demand closer cooperation between the ministries."
 ww1_france.203.a:0 "Coordinate the government's work."
 ww1_france.204.t:0 "Briand Remains in Office"
 ww1_france.204.d:0 "The governing parties have agreed to retain Briand as prime minister. The cabinet will strengthen coordination between the ministries as it seeks to preserve support for its diplomatic and domestic programme."
 ww1_france.204.a:0 "Support the ministry."
 ww1_france.205.t:0 "Clemenceau's War Government"
 ww1_france.205.d:0 "Georges Clemenceau has formed a ministry committed to prosecuting the war. The new government promises firmer direction of supply and command while seeking the confidence of Parliament."
 ww1_france.205.a:0 "Give the ministry its mandate."
 ww1_france.206.t:0 "Confidence in the Ranks"
 ww1_france.206.d:0 "The government and army command have reviewed the conditions facing the troops. More dependable leave, improved supply and carefully prepared operations are intended to restore confidence at the front."
 ww1_france.206.a:0 "Put the measures into effect."
 ww1_france.207.t:0 "A Continental Counterweight"
 ww1_france.207.d:0 "The Anglo-German alliance has overturned the assumptions on which French security rested. Paris is seeking a new understanding with Russia to preserve the continental balance, with Italy also to be approached."
 ww1_france.207.a:0 "Open the negotiations."
 ww1_france.208.t:0 "An Approach to Berlin"
 ww1_france.208.d:0 "French representatives are seeking a non-aggression agreement with Germany. A settlement would require a German pledge to respect Belgian neutrality and changes to France's military commitments."
 ww1_france.208.a:0 "Send the proposal."
 ww1_france.209.t:0 "A Bargain with Rome"
 ww1_france.209.d:0 "Paris has offered Savoy and Corsica in return for Italian cooperation. The proposed concessions have provoked a difficult debate, while the government awaits Rome's answer."
 ww1_france.209.a:0 "Present the bargain."
 ww1_france.210.t:0 "A Mission to Athens"
 ww1_france.210.d:0 "French representatives are seeking Greek cooperation over ports, supplies and access to the eastern Mediterranean. The mission must contend with the divisions within Greek politics and secure an agreement from the government in Athens."
 ww1_france.210.a:0 "Dispatch the mission."
 ww1_france.211.t:0 "A Common Allied Command"
 ww1_france.211.d:0 "France has proposed closer coordination of allied reserves, transport and operations. The experience of the front has exposed the cost of conflicting national plans and uncertain responsibilities."
 ww1_france.211.a:0 "Agree the command arrangements."
 ww1_france.212.t:0 "Confidence Breaks after the Offensive"
 ww1_france.212.d:0 "The promised rapid breakthrough has failed to settle the war. Reports from the formations describe exhaustion, disrupted leave and growing distrust of operations whose objectives are unclear. The army remains capable of defending its sectors, but confidence in the command's promises has suffered. Rest, dependable supply and a more limited operational programme are needed before another great effort can be demanded."
 ww1_france.212.a:0 "The army needs a restoration programme."
 ww1_france.213.t:0 "The French Non-Aggression Proposal"
 ww1_france.213.d:0 "Paris has proposed a non-aggression agreement linked to Belgian neutrality and the withdrawal of France from continental military commitments. Accepting would ease the danger on our western frontier, but requires a firm German pledge over Belgium."
 ww1_france.213.a:0 "Accept the proposal and guarantee Belgium."
 ww1_france.213.b:0 "Retain our present commitments."
 ww1_france.214.t:0 "The French Territorial Offer"
 ww1_france.214.d:0 "France has offered Savoy and Corsica in return for Italian cooperation. The cabinet must weigh the proposed territorial gains against the obligations Paris seeks in exchange."
 ww1_france.214.a:0 "Accept the bargain."
 ww1_france.214.b:0 "Reject the French terms."
 ww1_france.215.t:0 "Rome's Reply"
 ww1_france.215.d:0 "The Italian government has answered our territorial proposal. The Foreign Ministry is preparing its response to Rome."
 ww1_france.215.a:0 "Conclude the agreement."
 ww1_france.215.b:0 "The proposal has failed."
 ww1_france.216.t:0 "A French Approach to Athens"
 ww1_france.216.d:0 "A French mission has requested Greek cooperation over ports and supplies, together with closer ties to its alliance. The cabinet must consider the proposal alongside our existing commitments and the divisions within the country."
 ww1_france.216.a:0 "Accept cooperation with France."
 ww1_france.216.b:0 "Keep Greece outside the arrangement."
 ww1_france.217.t:0 "Berlin's Reply"
 ww1_france.217.d:0 "Berlin has delivered its answer to the proposed non-aggression agreement. The cabinet will now decide how to proceed with the negotiations."
 ww1_france.217.a:0 "Prepare to ratify the agreement."
 ww1_france.217.b:0 "Retain our present commitments."
 ww1_france.220.t:0 "The Union Sacrée"
 ww1_france.220.d:0 "Political parties and labour representatives have agreed to support the defence of the Republic. The government hopes that this common effort will strengthen recruitment, production and civilian relief through the war."
 ww1_france.220.a:0 "France must stand together."
 ww1_france.221.t:0 "Clemenceau's Ministry"
 ww1_france.221.d:0 "Georges Clemenceau has formed a government committed to directing the war with renewed determination. Parliament has given the ministry a mandate that will be tested immediately by the demands of the front."
 ww1_france.221.a:0 "Carry the war effort forward."
 ww1_france.222.t:0 "Allied Command Consultations"
 ww1_france.222.d:0 "The French government has proposed a common system for coordinating allied reserves and operations. Its supporters argue that a single direction of planning will prevent costly delays and conflicting attacks."
 ww1_france.222.a:0 "Strengthen allied cooperation."
 ww1_france.223.t:0 "The Three-Year Service Law"
 ww1_france.223.d:0 "The government has extended the period of active military service. Supporters regard the measure as essential to France's security, while opponents warn of the burden it places on families and public finances."
 ww1_france.223.a:0 "Implement the law."
 ww1_france.224.t:0 "Strain in the French Army"
 ww1_france.224.d:0 "Reports of exhausted formations and lost confidence follow a French offensive that has failed to settle the war. The army still holds its sectors, but commanders face resistance to further operations whose objectives appear uncertain. Leave, supplies and the limits placed on new attacks have become urgent questions of command. A restoration programme is needed before another great offensive can be attempted."
 ww1_france.224.a:0 "The situation develops."
 ww1_usa.8.b:0 "Congress will preserve our neutrality."
 ww1_usa.13.b:0 "Seek congressional authority first."
 ww1_usa.28.b:0 "Respect Mexican sovereignty."
 ww1_usa.32.b:0 "Send mediators."
 ww1_usa.35.b:0 "Negotiate a civilian agreement."
 ww1_usa.200.t:0 "The Progressive Challenge"
 ww1_usa.200.d:0 "The parties confront a public impatient with trusts, rising prices and the power of financial interests. Taft defends the Republican programme, Wilson calls for a New Freedom, and Roosevelt demands a stronger federal role in national welfare. The election will determine which programme can command a mandate in Washington."
 ww1_usa.200.a:0 "Let the voters decide."
 ww1_usa.201.t:0 "The Presidential Inauguration"
 ww1_usa.201.d:0 "The elected president takes the oath and assumes responsibility for the executive departments. Campaign promises now face the practical demands of party organisation, congressional votes and competing regional interests. The new cabinet prepares its first measures while foreign governments look for signs of the administration’s intentions."
 ww1_usa.201.a:0 "Begin the work of the new administration."
 ww1_usa.202.t:0 "A Programme of National Reform"
 ww1_usa.202.d:0 "Committee rooms fill with arguments over the relationship between federal authority and private enterprise. Supporters insist that banking, tariffs and competition must be considered together; opponents warn against passing sweeping measures before their consequences are understood. The administration chooses to organise its legislative effort around a clear programme rather than a succession of emergency demands."
 ww1_usa.202.a:0 "Put the programme before Congress."
 ww1_usa.203.t:0 "The National Defence Debate"
 ww1_usa.203.d:0 "The war overseas exposes the limits of a small regular army and a fleet divided between two oceans. Preparedness organisations call for larger forces, while opponents fear that military expansion will make participation in Europe inevitable. Congress can strengthen training and procurement while retaining authority over any decision to declare war."
 ww1_usa.203.a:0 "Prepare the country without surrendering congressional oversight."
 ww1_usa.204.t:0 "The Liberty Loan"
 ww1_usa.204.d:0 "The Treasury has opened a public subscription to finance the war. Banks, civic associations and local committees are organising bond sales across the country."
 ww1_usa.204.a:0 "Open the subscription books."
 ww1_usa.205.t:0 "The Fourteen Points"
 ww1_usa.205.d:0 "The president places a programme for peace before Congress. Open diplomacy, safer commerce and a settlement that recognises national claims are presented as alternatives to a war ending solely in conquest. Allied governments welcome American support while examining which of these principles can be reconciled with their own commitments and security demands."
 ww1_usa.205.a:0 "A peace settlement must have a public foundation."
 ww1_usa.206.t:0 "Pershing and the American Command"
 ww1_usa.206.d:0 "American divisions arrive in France with their own headquarters, supply requirements and expectations about how they will fight. Allied commanders ask for immediate reinforcements, but Pershing argues that American formations must develop into an army capable of operating under its own command. Liaison officers begin the difficult work of sharing experience without losing the organisation of the expeditionary force."
 ww1_usa.206.a:0 "Maintain an American army with Allied liaison."
 ww1_usa.207.t:0 "Germany Renews Unrestricted Submarine Warfare"
 ww1_usa.207.d:0 "Berlin announces that submarines will again attack shipping in the declared war zones without the assurances previously offered to Washington. The State Department examines the danger to American passengers, crews and commerce as naval officers prepare advice on protecting merchant vessels. A diplomatic break is now possible, but Congress still holds the decision over entering the European war."
 ww1_usa.207.a:0 "Prepare the merchant fleet and place the evidence before Congress."
 ww1_usa.207.b:0 "We will continue armed neutrality."
 ww1_usa.208.t:0 "The Election of 1916"
 ww1_usa.208.d:0 "The election has been fought over peace, preparedness and the direction of domestic reform. The returned administration faces renewed pressure to define America's place in the European conflict."
 ww1_usa.208.a:0 "The administration has its mandate."
 ww1_usa.209.t:0 "An American Approach to Berlin"
 ww1_usa.209.d:0 "Washington has proposed assurances for American shipping and a closer diplomatic understanding. The German government must decide whether the maritime guarantees sought by the Americans are compatible with its own policy."
 ww1_usa.209.a:0 "Accept the American terms."
 ww1_usa.209.b:0 "We cannot offer these assurances."
 ww1_usa.210.t:0 "Berlin's Answer"
 ww1_usa.210.d:0 "The German government has delivered its reply to our proposal. The administration is reviewing what the answer means for American shipping and future relations with Berlin."
 ww1_usa.210.a:0 "Consider the German reply."
 ww1_usa.211.t:0 "An Alliance with Germany"
 ww1_usa.211.d:0 "Our understanding with Berlin has brought the question of a military alliance before Congress. Entering Germany's coalition would commit the United States to its war, with far-reaching consequences for the army, navy and American commerce."
 ww1_usa.211.a:0 "Approve the military commitment."
 ww1_usa.211.b:0 "Preserve the diplomatic understanding alone."
 ww1_usa.212.t:0 "An American Approach to Paris"
 ww1_usa.212.d:0 "American representatives have approached France as the Anglo-German alliance changes the balance of power. Washington seeks assurances over maritime interests in return for closer cooperation with the continental powers."
 ww1_usa.212.a:0 "Welcome an American partner."
 ww1_usa.212.b:0 "Decline the American proposal."
 ww1_usa.213.t:0 "The Continental Reply"
 ww1_usa.213.d:0 "Paris has answered our proposal for an understanding with the continental powers. The administration is considering the reply and its consequences for American policy."
 ww1_usa.213.a:0 "Consider the French reply."
 ww1_usa.214.t:0 "The Continental Commitment"
 ww1_usa.214.d:0 "The continental powers have asked the United States to turn its diplomatic understanding into a military alliance. Congress must decide whether the threat to Atlantic commerce justifies entering their war against the German-British coalition."
 ww1_usa.214.a:0 "Approve the military commitment."
 ww1_usa.214.b:0 "Continue diplomatic cooperation alone."
 ww1_usa.215.t:0 "War with Austria-Hungary"
 ww1_usa.215.d:0 "The administration has asked Congress to consider a declaration of war against Austria-Hungary. Supporters argue that the cooperation between Vienna and Berlin makes it necessary, while opponents wish to confine the conflict to Germany."
 ww1_usa.215.a:0 "Approve the declaration against Austria-Hungary."
 ww1_usa.215.b:0 "Limit the war to Germany."
 ww1_usa.216.t:0 "A Border Settlement with Mexico"
 ww1_usa.216.d:0 "American and Mexican representatives examine border security, recognition and the conditions for withdrawing armed patrols. Both governments have reason to avoid turning local raids and revolutionary rivalries into a general war. An agreement can protect the frontier while leaving the political future of Mexico to its own institutions."
 ww1_usa.216.a:0 "Recognise sovereignty and end the emergency patrols."
 ww1_usa.217.t:0 "The End of Emergency Administration"
 ww1_usa.217.d:0 "Peace changes the purpose of the departments and contracts created to supply the war. Treasury, labour and military representatives begin closing emergency arrangements and returning temporary arms plants to civilian use. The country keeps its permanent industrial base while preparing to meet the demands of an unsettled postwar economy."
 ww1_usa.217.a:0 "Close the emergency programmes."
 ww1_usa.220.t:0 "America Debates Preparedness"
 ww1_usa.220.d:0 "American legislators confront the question of military preparedness as fighting overseas places new demands on modern armies and fleets. Advocates call for training camps, improved procurement and stronger reserves; opponents insist that defence measures must not become a substitute for a public decision on war. The resulting programme leaves the declaration of war in congressional hands."
 ww1_usa.220.a:0 "The course of the war is changing."
 ww1_usa.221.t:0 "America Mobilises Its Workshops"
 ww1_usa.221.d:0 "American manufacturers receive orders on a scale that requires coordinated standards, transport and purchasing. Federal boards seek to reconcile the needs of the army with civilian production as labour representatives press for predictable conditions. Emergency arms capacity grows under contracts that are intended to end with the war."
 ww1_usa.221.a:0 "The course of the war is changing."
 ww1_usa.222.t:0 "An American Army in France"
 ww1_usa.222.d:0 "The arrival of American forces brings a new headquarters, new supply demands and a new argument about command. Pershing seeks an army capable of fighting as an American formation, while Allied commanders request reinforcements for hard-pressed sectors. Training and liaison begin turning the expeditionary force into a partner on the Western Front."
 ww1_usa.222.a:0 "The course of the war is changing."
 ww1_usa.223.t:0 "Wilson Presents the Fourteen Points"
 ww1_usa.223.d:0 "President Wilson presents an American programme for the peace settlement, linking security to public diplomacy, commerce and national claims. Governments at war examine how the proposals fit their military aims and promises already made to their partners. The principles establish a negotiating position, but a settlement still depends on the course of the war and the consent of the belligerents."
 ww1_usa.223.a:0 "The course of the war is changing."
 ww1_usa.224.t:0 "A New American Diplomatic Alignment"
 ww1_usa.224.d:0 "Washington announces a negotiated understanding with the German government. Guarantees concerning shipping and diplomatic relations establish the immediate terms, while any American military commitment remains subject to a separate decision. Other governments now assess how this arrangement changes the balance across the Atlantic."
 ww1_usa.224.a:0 "The course of the war is changing."
 ww1_usa.225.t:0 "America and the Continental Coalition"
 ww1_usa.225.d:0 "The United States reaches an understanding with the coalition centred on France and Russia. Negotiated assurances define the relationship as the German-British alignment reshapes the European struggle. Military participation remains a distinct commitment, and the belligerents await Washington’s decision about entering the war."
 ww1_usa.225.a:0 "The course of the war is changing."
 ww1_usa.226.t:0 "An American Border Agreement"
 ww1_usa.226.d:0 "Negotiators from Washington and Mexico seek to remove the immediate grounds for further armed incidents. Border safeguards and recognition are set beside a commitment to avoid treating the Mexican civil struggle as a general American war. Both governments must now show that the agreement can hold beyond the negotiating table."
 ww1_usa.226.a:0 "The course of the war is changing."
 ww1_usa.218.t:0 "An Allied Partnership"
 ww1_usa.218.d:0 "Britain has invited the United States to join its alliance against Germany. Membership would place military cooperation on a firmer basis, but the administration must consider how far American commitments should extend."
 ww1_usa.218.a:0 "Accept the Allied partnership."
 ww1_usa.218.b:0 "Continue as an independent belligerent."
 ww1_turkey.330.t:0 "A Cabinet Confidence Crisis"
 ww1_turkey.330.desc:0 "Cabinet authority has fallen below 20 while the Ottoman administration is active. A 60-day administrative mission is now available; reaching 35 resolves it at no political power cost."
 ww1_turkey.331.t:0 "Provincial Confidence Breaks Down"
 ww1_turkey.331.desc:0 "Provincial confidence has fallen below 20 while the Ottoman administration is active. A 60-day administrative mission is now available; reaching 35 resolves it at no political power cost."
 ww1_turkey.332.t:0 "The Officer Corps Demands a Settlement"
 ww1_turkey.332.desc:0 "Officer loyalty has fallen below 20 while the Ottoman administration is active. A 60-day administrative mission is now available; reaching 35 resolves it at no political power cost."
 ww1_turkey.333.t:0 "The Failure of Emergency Administration"
 ww1_turkey.333.desc:0 "The Ottoman administrative crisis timed out. Emergency measures preserve the state, but stability, industrial output, and supply are impaired for 90 days. No civil war or release is forced."
 ww1_turkey.300.t:0 "A Ministry of Freedom and Accord"
 ww1_turkey.300.d:0 "Freedom and Accord deputies have formed a ministry responsible to a parliamentary coalition. Provincial representatives seek guarantees for local rights, while officers demand dependable command. The new government must hold together groups with different expectations of reform."
 ww1_turkey.300.a:0 "Put ministerial responsibility before the chamber."
 ww1_turkey.301.t:0 "Said Halim Pasha Forms the Ministry"
 ww1_turkey.301.d:0 "Said Halim Pasha has accepted the task of directing the cabinet under strong Unionist influence. Civil ministries face competing demands from party leaders and the army. The new grand vizier seeks a regular procedure for settling their disputes at the Porte."
 ww1_turkey.301.a:0 "Give the Porte a regular cabinet procedure."
 ww1_turkey.302.t:0 "Talat Pasha Becomes Grand Vizier"
 ww1_turkey.302.d:0 "Talat Pasha has taken the grand vizierate as the strain of war deepens. Departments demand clear authority over supplies and appointments, while provincial officials report exhaustion and discontent. His cabinet must coordinate the war administration with dwindling resources."
 ww1_turkey.302.a:0 "Coordinate the ministries under Talat."
 ww1_turkey.303.t:0 "A Constitutional Coalition Agreement"
 ww1_turkey.303.d:0 "The coalition has reached an agreement on confidence votes, ministerial accounts and provincial consultation. Deputies seek a dependable voice in government, while officials ask for continuity in their daily work. The settlement gives the cabinet and chamber a procedure for resolving their disputes."
 ww1_turkey.303.a:0 "Record the responsibilities of ministers and deputies."
 ww1_turkey.304.t:0 "An Arab Provincial Compact"
 ww1_turkey.304.d:0 "Representatives of the Arab provinces seek defined responsibilities for local administration, appointments and education. The Porte proposes retaining common defence and diplomacy under a written compact. Ministers must decide whether to accept the terms and honour them under the pressures of war."
 ww1_turkey.304.a:0 "Accept the compact and its limits."
 ww1_turkey.305.t:0 "A Charter for Albanian Administration"
 ww1_turkey.305.d:0 "Albanian delegates seek guarantees for schools, public appointments and local administration. They argue that a written charter could repair the distrust caused by earlier disputes. The Porte must decide whether to establish the proposed institutions in the provinces that remain under its authority."
 ww1_turkey.305.a:0 "Give the charter an administrative foundation."
 ww1_turkey.306.t:0 "An Eastern Provincial Reform Commission"
 ww1_turkey.306.d:0 "Eastern provincial representatives have called for impartial officials and protection for their communities. The government proposes a commission to inspect appointments and hear local petitions. Its reports will test whether the authorities can uphold the constitution's guarantees in the provinces."
 ww1_turkey.306.a:0 "Require impartial reports and enforce their findings."
 ww1_turkey.307.t:0 "The Imperial Convention Opens"
 ww1_turkey.307.d:0 "Delegates have assembled to negotiate a division of responsibilities between the Porte and provincial councils. The army seeks a common command, ministers require dependable revenue and local representatives demand lasting authority. The proposed convention must bring these claims into a single settlement."
 ww1_turkey.307.a:0 "Record a settlement of common and provincial responsibilities."
 ww1_turkey.308.t:0 "An Imperial Government Settlement"
 ww1_turkey.308.d:0 "Ministers, provincial representatives and army officers have reviewed the agreement governing their responsibilities. They propose maintaining the procedures that have allowed the different institutions to work together. The cabinet is preparing to reaffirm the settlement."
 ww1_turkey.308.a:0 "Keep the agreed responsibilities in force."
 ww1_turkey.310.t:0 "The Porte Proposes a German Alliance"
 ww1_turkey.310.d:0 "Ottoman envoys ask Berlin to formalise the military and commercial understanding between the two empires. Their proposal seeks guarantees for Ottoman sovereignty in return for closer cooperation. Germany must decide whether the agreement serves its wider strategic position."
 ww1_turkey.310.a:0 "Accept the negotiated alliance."
 ww1_turkey.310.b:0 "Decline the proposed terms."
 ww1_turkey.311.t:0 "Berlin Replies to the Porte"
 ww1_turkey.311.d:0 "Berlin has returned its answer to our proposed understanding. The foreign ministry is reviewing the reply and its implications for Ottoman policy. The cabinet must now decide how to proceed with the negotiations."
 ww1_turkey.311.a:0 "Review the German answer."
 ww1_turkey.312.t:0 "The Porte Requests an Entente Partnership"
 ww1_turkey.312.d:0 "Ottoman diplomats propose a partnership under the maritime and sovereignty guarantees already discussed with the Entente. They ask France to recognise the agreement as a basis for closer cooperation. Paris must weigh the value of an Ottoman partner against its existing commitments."
 ww1_turkey.312.a:0 "Accept the Ottoman partnership."
 ww1_turkey.312.b:0 "The coalition cannot accept these terms."
 ww1_turkey.313.t:0 "Paris Replies to the Porte"
 ww1_turkey.313.d:0 "Paris has returned its answer to the proposed Ottoman partnership. Our representatives are reviewing the reply with the guarantees discussed in the earlier negotiations. The cabinet must consider what it means for the empire's diplomatic course."
 ww1_turkey.313.a:0 "Review the French answer."
 ww1_turkey.315.t:0 "British Guarantees for the Ottoman Straits"
 ww1_turkey.315.d:0 "The Porte asks Britain to support a guarantee of Ottoman sovereignty over the Straits. London must weigh secure maritime access and closer Ottoman cooperation against the claims of its partners. Russian and French consent will also be needed for the convention."
 ww1_turkey.315.a:0 "Support a negotiated guarantee."
 ww1_turkey.315.b:0 "Our existing commitments prevent this guarantee."
 ww1_turkey.316.t:0 "Russia Considers a Straits Convention"
 ww1_turkey.316.d:0 "Britain has forwarded an Ottoman proposal on sovereignty and passage through the Straits. Russian ministers must weigh secure commercial access against the empire's strategic claims. Their answer will determine whether negotiations can proceed to France."
 ww1_turkey.316.a:0 "Accept secure passage within Ottoman sovereignty."
 ww1_turkey.316.b:0 "We cannot abandon our strategic claims."
 ww1_turkey.317.t:0 "France Reviews the Ottoman Convention"
 ww1_turkey.317.d:0 "British and Russian consent has brought the Ottoman maritime convention before the French government. The proposal recognises Ottoman sovereignty while establishing an agreed basis for passage through the Straits. Paris must decide whether the terms satisfy the coalition's interests."
 ww1_turkey.317.a:0 "Approve the common guarantees."
 ww1_turkey.317.b:0 "Decline the proposed framework."
 ww1_turkey.318.t:0 "The Straits Negotiations Conclude"
 ww1_turkey.318.d:0 "Our representatives have received the final replies on the Straits convention. The foreign ministry is reviewing whether the negotiations have secured the common guarantees sought by the Porte. The result will shape the next stage of Ottoman diplomacy."
 ww1_turkey.318.a:0 "Record the diplomatic result."
 ww1_turkey.319.t:0 "An Ottoman Commercial Accommodation"
 ww1_turkey.319.d:0 "The Porte offers commercial guarantees to Italy as an alternative to conflict over Libya. Italian ministers must weigh the proposed access against colonial ambitions and the cost of a campaign. Their answer will decide whether the dispute can be settled through negotiation."
 ww1_turkey.319.a:0 "Accept commercial guarantees in place of a campaign."
 ww1_turkey.319.b:0 "The proposed access does not settle our demands."
 ww1_turkey.320.t:0 "Rome Replies to the Porte"
 ww1_turkey.320.d:0 "Rome has returned its answer to the proposed commercial accommodation. Our representatives are reviewing the reply and its consequences for the Libyan dispute. The cabinet must now determine its next diplomatic step."
 ww1_turkey.320.a:0 "Record the Italian answer."
 ww1_turkey.321.t:0 "Bulgaria Reviews an Ottoman Withdrawal"
 ww1_turkey.321.d:0 "Sofia is considering the territorial terms of a negotiated Ottoman withdrawal. Bulgaria seeks agreement over the proposed Thracian and Macedonian districts before committing itself to the settlement. Acceptance would send the proposal on to Serbia."
 ww1_turkey.321.a:0 "Accept the defined settlement."
 ww1_turkey.321.b:0 "Reject this distribution."
 ww1_turkey.322.t:0 "Serbia Considers the Balkan Settlement"
 ww1_turkey.322.d:0 "Belgrade has received the proposed division of the Ottoman Balkan districts. Ministers must weigh Serbia's territorial ambitions against the value of an agreement with Bulgaria and Greece. Their answer will decide whether the negotiations can continue."
 ww1_turkey.322.a:0 "Accept the defined settlement."
 ww1_turkey.322.b:0 "Reject this distribution."
 ww1_turkey.323.t:0 "Greece Answers the Balkan Proposal"
 ww1_turkey.323.d:0 "Athens is reviewing the Ottoman withdrawal proposal after the Bulgarian and Serbian replies. The government must decide whether the offered districts and guarantees meet Greek interests. Its consent is the final requirement for a common settlement."
 ww1_turkey.323.a:0 "Accept the defined settlement."
 ww1_turkey.323.b:0 "Reject this distribution."
 ww1_turkey.324.t:0 "The Balkan Negotiations Conclude"
 ww1_turkey.324.d:0 "The Balkan governments have returned their final answers to our withdrawal proposal. The foreign ministry is reviewing the prospects for the agreed division and recognition of Albania. The cabinet must now respond to the outcome of the negotiations."
 ww1_turkey.324.a:0 "Record the governments' replies."
 ww1_turkey.330.d:0 "Ministers have failed to secure dependable support over appointments and expenditure. Deputies question the cabinet's authority, while civil departments wait for clear instructions. The government faces an urgent need to restore confidence before the dispute paralyses its work."
 ww1_turkey.330.a:0 "The cabinet must regain its authority."
 ww1_turkey.331.d:0 "Provincial representatives no longer trust the assurances they receive from Constantinople. Officials report growing resistance to ordinary obligations as military requisitions and local grievances mount. The cabinet must reach a practical settlement before the estrangement deepens."
 ww1_turkey.331.a:0 "The provinces must be heard."
 ww1_turkey.332.d:0 "Officers have challenged political interference in appointments and command. Their dispute with the cabinet threatens cooperation at a time when the fronts require dependable leadership. Ministers must restore working relations with the army."
 ww1_turkey.332.a:0 "Restore cooperation with the commanders."
 ww1_turkey.333.d:0 "The government's effort to settle the institutional crisis has failed. Departments struggle to carry out their work as confidence and cooperation deteriorate. Ministers must begin a new effort to restore authority and rebuild the damaged relationships."
 ww1_turkey.333.a:0 "Begin the work of recovery."
 ww1_turkey.340.t:0 "The Unionists Seize the Sublime Porte"
 ww1_turkey.340.d:0 "Unionist leaders take the political initiative amid military defeat and dispute over the cabinet’s policy. The Committee now seeks closer control of appointments and executive business, while opponents warn that constitutional procedures are being subordinated to party power. The change concentrates authority, but the government still faces the same shortage of resources and the distrust of provinces asked to carry new obligations."
 ww1_turkey.340.a:0 "Power has shifted at the Porte."
 ww1_turkey.341.t:0 "Said Halim Pasha Forms the Cabinet"
 ww1_turkey.341.d:0 "Said Halim Pasha forms a ministry charged with coordinating departments under strong Unionist and military influence. The Porte seeks a routine for settling competing demands as foreign governments examine the direction of Ottoman policy. A more regular cabinet offers an administrative framework, but it does not remove the divisions between ministers, party leaders and officers."
 ww1_turkey.341.a:0 "A new ministry takes office."
 ww1_turkey.342.t:0 "Talat Pasha Becomes Grand Vizier"
 ww1_turkey.342.d:0 "Talat Pasha assumes the direction of the Ottoman cabinet as the costs of prolonged war continue to rise. Ministers press for coordinated authority over supplies and public appointments while provincial officials report deepening exhaustion. The new ministry inherits the responsibility of keeping an imperial war administration functioning under increasingly difficult conditions."
 ww1_turkey.342.a:0 "The wartime cabinet has a new head."
 ww1_turkey.343.t:0 "An Ottoman Parliamentary Settlement"
 ww1_turkey.343.d:0 "A coalition ministry announces an agreement on confidence votes, accounts and provincial consultation. The programme seeks to make ministerial responsibility an ordinary part of administration rather than an emergency concession. Its success will depend on whether deputies, officers and district officials accept these procedures when the next political dispute arises."
 ww1_turkey.343.a:0 "A new agreement between cabinet and chamber."
 ww1_turkey.344.t:0 "An Arab Provincial Compact"
 ww1_turkey.344.d:0 "The Ottoman government agrees defined responsibilities with representatives of its Arab provinces. Local administration and education receive a recognised place, while the centre retains common defence and diplomacy. The compact presents a different course from treating each provincial demand solely as a challenge that can be answered by another military requisition."
 ww1_turkey.344.a:0 "The agreement must now be honoured."
 ww1_turkey.345.t:0 "An Imperial Federal Convention"
 ww1_turkey.345.d:0 "Delegates negotiate a division of responsibilities between the Ottoman government and provincial councils. The proposed settlement reserves common military command and foreign affairs to the centre while giving local administration a constitutional foundation. Governments abroad now examine whether this agreement can produce a working empire of consent rather than a succession of temporary concessions."
 ww1_turkey.345.a:0 "A new settlement for the provinces."
 ww1_turkey.346.t:0 "The Ottoman Empire Enters the War"
 ww1_turkey.346.d:0 "The Ottoman government has announced its commitment to the European war under the diplomatic understanding reached with its partners. Military cooperation now takes priority over the earlier liaison talks. The decision places new demands on an empire already facing difficult disputes at home."
 ww1_turkey.346.a:0 "The empire has made its commitment."
 ww1_turkey.347.t:0 "A Negotiated Balkan Withdrawal"
 ww1_turkey.347.d:0 "The Ottoman government and its Balkan neighbours have agreed to a negotiated withdrawal. The settlement distributes the specified districts and recognises an Albanian state. Its supporters hope the agreement will avert another regional war."
 ww1_turkey.347.a:0 "A regional settlement has been reached."

 ww1_japan.300.t:0 "Government through the Elder Statesmen"
 ww1_japan.300.d:0 "The cabinet continues to seek the counsel of the genro while negotiating its appropriations with parliamentary parties. The arrangement preserves familiar channels to the throne, but responsibility for a foreign commitment must still be accepted by the ministers who present it. Officials prepare a regular account of those commitments so that private advice does not become a substitute for a national programme."
 ww1_japan.300.a:0 "Present the cabinet programme."
 ww1_japan.360.t:0 "Government through the Elder Statesmen"
 ww1_japan.360.d:0 "The cabinet continues to seek the counsel of the genro while negotiating its appropriations with parliamentary parties. The arrangement preserves familiar channels to the throne, but responsibility for a foreign commitment must still be accepted by the ministers who present it. Officials prepare a regular account of those commitments so that private advice does not become a substitute for a national programme."
 ww1_japan.360.a:0 "Tokyo defines its next course."
 ww1_japan.301.t:0 "The Constitutional Coalition"
 ww1_japan.301.d:0 "The movement to protect constitutional government now has a cabinet programme. Its supporters demand more than the fall of one ministry: they want appointments, budgets and overseas commitments to survive open scrutiny in the Diet. The services retain command of their forces, but ministers intend to prevent a disagreement over nominations from determining the lifetime of the whole government."
 ww1_japan.301.a:0 "Present the cabinet programme."
 ww1_japan.361.t:0 "The Constitutional Coalition"
 ww1_japan.361.d:0 "The movement to protect constitutional government now has a cabinet programme. Its supporters demand more than the fall of one ministry: they want appointments, budgets and overseas commitments to survive open scrutiny in the Diet. The services retain command of their forces, but ministers intend to prevent a disagreement over nominations from determining the lifetime of the whole government."
 ww1_japan.361.a:0 "Tokyo defines its next course."
 ww1_japan.302.t:0 "A Cabinet of National Defence"
 ww1_japan.302.d:0 "Defence officials take a central place in the cabinet. They promise coordinated preparations for continental operations, yet their programme places a considerable burden on the treasury and on civilian administration. The government must now decide which campaigns it can sustain. A new council is expected to keep army and naval requests within a common account of transport, labour and industry."
 ww1_japan.302.a:0 "Present the cabinet programme."
 ww1_japan.362.t:0 "A Cabinet of National Defence"
 ww1_japan.362.d:0 "Defence officials take a central place in the cabinet. They promise coordinated preparations for continental operations, yet their programme places a considerable burden on the treasury and on civilian administration. The government must now decide which campaigns it can sustain. A new council is expected to keep army and naval requests within a common account of transport, labour and industry."
 ww1_japan.362.a:0 "Tokyo defines its next course."
 ww1_japan.303.t:0 "The Imperial Constitutional Council"
 ww1_japan.303.d:0 "Representatives of the palace, parliamentary parties and armed services agree to refer their disputes to an imperial constitutional council. The settlement leaves the throne in place and gives the Diet an acknowledged role in appropriations. Whether it survives depends on the willingness of each institution to accept a decision that limits its own freedom of action."
 ww1_japan.303.a:0 "Present the cabinet programme."
 ww1_japan.363.t:0 "The Imperial Constitutional Council"
 ww1_japan.363.d:0 "Representatives of the palace, parliamentary parties and armed services agree to refer their disputes to an imperial constitutional council. The settlement leaves the throne in place and gives the Diet an acknowledged role in appropriations. Whether it survives depends on the willingness of each institution to accept a decision that limits its own freedom of action."
 ww1_japan.363.a:0 "Tokyo defines its next course."
 ww1_japan.304.t:0 "A Constitutional Crisis"
 ww1_japan.304.d:0 "The army’s demand for new divisions has exposed the fragile relationship between ministerial appointments and parliamentary support. Public meetings defend constitutional government while senior officers insist that national defence cannot wait on party negotiation. The cabinet faces a choice: establish a procedure that keeps ministers accountable to the Diet, or accept the services’ power to determine who may govern. The crisis cannot be settled by changing one name at the head of the ministry."
 ww1_japan.304.a:0 "Hear the constitutional petition."
 ww1_japan.304.b:0 "Give the service ministers priority."
 ww1_japan.305.t:0 "The Naval Ministry under Scrutiny"
 ww1_japan.305.d:0 "Evidence of irregular naval procurement has become a public crisis. Deputies demand accounts of contracts and payments while the ministry’s defenders warn against interrupting the fleet programme. The cabinet cannot ask the country to pay for new ships without explaining how existing appropriations are used. An inquiry can restore a dependable procurement procedure, but it requires ministers to accept scrutiny and delays."
 ww1_japan.305.a:0 "Open the procurement inquiry."
 ww1_japan.306.t:0 "Okuma Forms a Ministry"
 ww1_japan.306.d:0 "A new ministry assembles parliamentary support around Okuma. Ministers inherit a cabinet system still shaped by the genro, but the coming European crisis gives foreign policy unusual importance. Commercial representatives see openings for Japanese exports while the services study the German position in China and the Pacific. The government must decide which opportunities fit the alliance with Britain and which would create commitments it cannot justify at home."
 ww1_japan.306.a:0 "Coordinate the ministries."
 ww1_japan.307.t:0 "A Party Cabinet under Hara"
 ww1_japan.307.d:0 "Hara brings the Seiyukai into a cabinet with a stronger basis in party support. The ministry receives the war’s commercial gains alongside price unrest, military expenditure and controversial continental commitments. Deputies expect those obligations to be accounted for in ordinary government. The change opens a new phase in parliamentary politics without removing the emperor or erasing the armed services’ considerable influence."
 ww1_japan.307.a:0 "A party programme must carry the budget."
 ww1_japan.308.t:0 "Terauchi’s Administrative Ministry"
 ww1_japan.308.d:0 "The new ministry seeks to coordinate the government’s wartime policy through senior administrators. Continental agreements, industrial contracts and the management of the services now pass through a more central cabinet programme. Officials expect firmer execution, but wider commitments also make the government responsible for the strain they place on households and public accounts. Expansion abroad brings no exemption from explaining its cost at home."
 ww1_japan.308.a:0 "Put the departments on a common schedule."
 ww1_japan.310.t:0 "Tokyo Seeks an Alliance Renewal"
 ww1_japan.310.d:0 "Tokyo asks Britain to renew the practical obligations of the Anglo-Japanese alliance, offering naval cooperation and a common policy toward German positions in East Asia. Ministers must decide whether Japan's expectations can be reconciled with Britain's wider diplomatic commitments."
 ww1_japan.310.a:0 "Renew the understanding."
 ww1_japan.310.b:0 "Our policies cannot be reconciled."
 ww1_japan.311.t:0 "Britain Replies to Tokyo"
 ww1_japan.311.d:0 "London's reply to the proposed renewal has reached Tokyo. The cabinet must consider what the answer means for Japan's next diplomatic and military decisions."
 ww1_japan.311.a:0 "Record the answer."
 ww1_japan.312.t:0 "A Japanese Approach to Berlin"
 ww1_japan.312.d:0 "Tokyo proposes a strategic understanding with Germany, departing from its established relationship with Britain. Its envoys offer to preserve German Pacific holdings and discuss common interests against Russia, leaving Berlin to judge the value of the proposed alignment."
 ww1_japan.312.a:0 "A Pacific understanding serves our interests."
 ww1_japan.312.b:0 "We cannot accept these terms."
 ww1_japan.313.t:0 "Berlin Answers the Proposal"
 ww1_japan.313.d:0 "Berlin's reply to the proposed strategic understanding has reached Tokyo. Ministers must now decide how the answer affects Japan's position between the European powers and its plans in the Pacific."
 ww1_japan.313.a:0 "Consider Berlin's reply."
 ww1_japan.314.t:0 "Japan Proposes an Asian League"
 ww1_japan.314.d:0 "Japan invites Siam to join a regional league under its leadership. Ministers must weigh the protection offered by the association against the influence it would give Tokyo over Siam's strategic position."
 ww1_japan.314.a:0 "Accept the invitation."
 ww1_japan.314.b:0 "Our independence comes first."
 ww1_japan.320.t:0 "Japan Presents the Twenty-One Demands"
 ww1_japan.320.d:0 "Japanese diplomats have presented a programme of railway, industrial and security concessions while the European powers are occupied by war. Ministers must decide whether a limited economic agreement can contain the pressure from Tokyo or whether the demands should be rejected outright."
 ww1_japan.320.a:0 "Accept a limited concession agreement."
 ww1_japan.320.b:0 "Reject this interference in Chinese affairs."
 ww1_japan.322.t:0 "A Demand for Chinese Submission"
 ww1_japan.322.d:0 "Japan demands a political submission extending far beyond the question of railway concessions. The proposed protectorate would subordinate our foreign and military policy to Tokyo, forcing ministers to choose between resistance and the loss of independence."
 ww1_japan.322.a:0 "Resist the demand."
 ww1_japan.322.b:0 "Accept the protectorate to preserve the government."
 ww1_japan.324.t:0 "A Japanese Expedition to Siberia"
 ww1_japan.324.d:0 "Tokyo proposes an expedition through the Russian Far East, describing it as assistance against the Bolsheviks. Russian representatives must weigh the value of that support against the risk that a temporary military presence could become a lasting foothold."
 ww1_japan.324.a:0 "Permit the limited expedition."
 ww1_japan.324.b:0 "An expedition threatens our sovereignty."
 ww1_japan.330.t:0 "Tokyo Proposes a Far Eastern Settlement"
 ww1_japan.330.d:0 "Japanese troops hold the principal positions named in Tokyo's proposed settlement. The government must decide whether to concede the occupied coastal districts and northern Sakhalin in return for peace or continue the campaign to recover them."
 ww1_japan.330.a:0 "Accept the limited settlement."
 ww1_japan.330.b:0 "The occupied districts remain Russian."
 ww1_japan.350.t:0 "A New Imperial Reign in Japan"
 ww1_japan.350.d:0 "Japan mourns Emperor Meiji as the throne passes to his successor. The new reign inherits the constitution, the parliamentary parties and the armed services that shaped the late emperor’s state. Foreign governments watch for a change of policy, but the immediate task in Tokyo is to preserve an orderly government through the succession."
 ww1_japan.350.a:0 "A new reign begins."
 ww1_japan.351.t:0 "Constitutional Protest in Japan"
 ww1_japan.351.d:0 "Public meetings and parliamentary opposition challenge the way Japan’s ministries are formed. The struggle brings the relationship between the Diet, the elder statesmen and the armed services into open debate. Ministers face demands for constitutional accountability while defence officials insist that their requirements cannot depend on shifting party coalitions."
 ww1_japan.351.a:0 "Tokyo faces a constitutional test."
 ww1_japan.352.t:0 "Japan Establishes an Asian League"
 ww1_japan.352.d:0 "Tokyo has announced a regional league under Japanese leadership. Neighbouring governments must decide whether the association offers protection from outside pressure or a new means for Japan to direct their affairs."
 ww1_japan.352.a:0 "A new association takes shape in Asia."
 ww1_japan.353.t:0 "A New Ministry in Tokyo"
 ww1_japan.353.d:0 "Okuma’s cabinet takes responsibility for Japanese policy as Europe approaches a widening crisis. Ministers seek parliamentary support for a programme that joins commercial opportunity with the alliance relationship. Japan’s fleet and continental forces remain ready, but foreign governments await a concrete statement of what Tokyo intends to do with them."
 ww1_japan.353.a:0 "A new cabinet assumes responsibility."
 ww1_japan.354.t:0 "China and Japan Conclude Concessions"
 ww1_japan.354.d:0 "Chinese and Japanese representatives agree defined economic concessions after a difficult exchange of demands. The settlement concerns railway and industrial interests rather than the surrender of all Chinese territory. Its supporters present it as a way to avoid war; its opponents warn that the pressure behind the negotiations will remain a source of grievance."
 ww1_japan.354.a:0 "An uneasy agreement has been reached."
 ww1_japan.355.t:0 "Terauchi Forms an Administrative Cabinet"
 ww1_japan.355.d:0 "The new Japanese ministry promises tighter coordination of wartime policy through senior officials. Expanding contracts and continental agreements give the administration substantial influence, but also leave it responsible for their cost. Commercial gains abroad do not remove the pressure that rising prices and military commitments place on households."
 ww1_japan.355.a:0 "Tokyo centralises its wartime administration."
 ww1_japan.356.t:0 "Japan Prepares a Siberian Expedition"
 ww1_japan.356.d:0 "Russian representatives have agreed to receive a limited Japanese expedition in the Far East. Tokyo presents the operation as assistance against the Bolsheviks, while Russian officials remain wary of the duration and intentions of the foreign presence."
 ww1_japan.356.a:0 "The expedition gains a foothold."
 ww1_japan.357.t:0 "Hara Heads a Party Cabinet"
 ww1_japan.357.d:0 "Hara forms a Japanese cabinet grounded in Seiyukai support. The ministry faces price unrest and the burden of wartime commitments alongside an enlarged commercial position. Parliamentary leaders now have a greater role in carrying those obligations through ordinary government, although the services and elder statesmen retain considerable influence."
 ww1_japan.357.a:0 "Party government enters a new phase."
 IT1_ww1_libyan_expedition_tt:0 "Deploys two expeditionary infantry divisions once at the secured harbours of Tripoli and Benghazi. Only these landing provinces change controller; state ownership is unchanged."
