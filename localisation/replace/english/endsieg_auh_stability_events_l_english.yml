l_english:
 ww1_auh_stability.1.a:0 "We must begin with the work at hand."
 ww1_auh_stability.1.t:0 "The Affairs of the Monarchy"
 ww1_auh_stability.1.d:0 "The administration in Vienna receives petitions from every corner of the monarchy. Some concern schools and public appointments; others demand a greater share of taxes, offices, and political authority. The governments in Vienna and Budapest must also find the means to maintain their common institutions.\n\nA declaration from the capital will settle none of these questions on its own. Agreements must be negotiated, officials appointed, and money found before the provinces will have reason to trust our promises. War would place all of this under a far greater strain."
 AUH_stab_event_introduction_tt:0 "The crownlands must be brought into a lasting settlement through sustained regional programmes. Focuses open further negotiations and reforms. Discontent will continue to respond to wartime shortages and the treatment of each region."
 AUH_stab_event_hungary_relief_4_tt:0 "Discontent in §YHungary§!: §G-4§! points."
 AUH_stab_event_slovakia_unrest_1_tt:0 "Discontent in §YSlovakia§!: §R+1§! points."
 AUH_stab_event_transylvania_unrest_1_tt:0 "Discontent in §YTransylvania§!: §R+1§! points."
 ww1_auh_stability.10.a:0 "Secure an agreement with the Hungarian delegation."
 AUH_stab_event_hungary_unrest_5_tt:0 "Discontent in §YHungary§!: §R+5§! points."
 AUH_stab_event_austria_relief_2_tt:0 "Discontent in §Ythe Austrian lands§!: §G-2§! points."
 ww1_auh_stability.10.b:0 "The common services cannot wait for another debate."
 AUH_stab_event_hungary_unrest_3_tt:0 "Discontent in §YHungary§!: §R+3§! points."
 ww1_auh_stability.10.c:0 "Postpone the disputed appropriations."
 ww1_auh_stability.10.t:0 "A Budget Dispute in Budapest"
 ww1_auh_stability.10.d:0 "The latest accounts for the common ministries have met with opposition in Budapest. Hungarian representatives insist that assurances over expenditure and appointments must precede any further contribution. Officials in Vienna warn that reopening every disputed item will leave necessary work unfinished.\n\nA separate understanding with the Hungarian leadership could keep the machinery of government running. It would also remind the other nationalities that access to power still depends on which capital speaks for them."
 AUH_stab_event_bohemia_relief_5_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-5§! points."
 AUH_stab_event_austria_unrest_1_tt:0 "Discontent in §Ythe Austrian lands§!: §R+1§! points."
 ww1_auh_stability.11.a:0 "Fund bilingual offices and a provincial review."
 AUH_stab_event_bohemia_unrest_4_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+4§! points."
 AUH_stab_event_austria_relief_1_tt:0 "Discontent in §Ythe Austrian lands§!: §G-1§! points."
 ww1_auh_stability.11.b:0 "Stand by the existing appointments."
 AUH_stab_event_bohemia_unrest_3_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+3§! points."
 ww1_auh_stability.11.c:0 "Let the provincial authorities settle it."
 ww1_auh_stability.11.t:0 "The Language of the Administration"
 ww1_auh_stability.11.d:0 "A dispute over appointments in the Bohemian lands has spread from the provincial offices to the newspapers. Czech representatives complain that promised access to public service has not reached the ordinary applicant. German associations warn that new language requirements will displace experienced officials.\n\nThere are precedents for a local agreement, but neither side will accept a settlement that appears to surrender its position. Recruiting and training enough clerks to serve both communities will require money and continued supervision."
 AUH_stab_event_austria_relief_4_tt:0 "Discontent in §Ythe Austrian lands§!: §G-4§! points."
 AUH_stab_event_bohemia_relief_2_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-2§! points."
 AUH_stab_event_hungary_unrest_2_tt:0 "Discontent in §YHungary§!: §R+2§! points."
 ww1_auh_stability.12.a:0 "Finance civilian deliveries and public kitchens."
 AUH_stab_event_austria_unrest_4_tt:0 "Discontent in §Ythe Austrian lands§!: §R+4§! points."
 ww1_auh_stability.12.b:0 "Maintain the army's priority."
 AUH_stab_event_austria_unrest_3_tt:0 "Discontent in §Ythe Austrian lands§!: §R+3§! points."
 AUH_stab_event_bohemia_unrest_2_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+2§! points."
 ww1_auh_stability.12.c:0 "There is nothing left to advance."
 ww1_auh_stability.12.t:0 "Grain for the Army, Bread for the Cities"
 ww1_auh_stability.12.d:0 "The latest grain returns fall short of the demands placed upon them. Army buyers insist that the front must be supplied first, while municipal authorities report longer queues and deliveries that fail to meet the ration. The Hungarian administration points to its own obligations and the shortage of farm labour.\n\nThe dispute cannot be settled by another requisition order alone. A new delivery agreement and an expansion of public kitchens would provide some relief, but the cost would fall upon a treasury and countryside already stretched by the war."
 AUH_stab_event_food_relief_tt:0 "Food security: §G+4§! points."
 AUH_stab_event_food_shortfall_tt:0 "Food security: §R-3§! points."
 AUH_stab_event_bohemia_relief_4_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-4§! points."
 ww1_auh_stability.13.a:0 "Negotiate a return to work."
 ww1_auh_stability.13.b:0 "The armaments programme must be maintained."
 AUH_stab_event_austria_unrest_5_tt:0 "Discontent in §Ythe Austrian lands§!: §R+5§! points."
 AUH_stab_event_bohemia_unrest_5_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+5§! points."
 ww1_auh_stability.13.c:0 "Wait for the stoppage to exhaust itself."
 ww1_auh_stability.13.t:0 "The Workshops Fall Silent"
 ww1_auh_stability.13.d:0 "A stoppage in the industrial districts has brought fresh demands for bread and relief from the pressure of war production. Factory representatives warn of missed deliveries, but the workers insist that longer shifts cannot feed their families. Their grievances are spreading along the same railway lines that carry the army's supplies.\n\nThe authorities could seek an agreement with the workers' representatives or place the workshops under tighter supervision. Either course will leave demands upon the government long after the machinery starts again."
 AUH_stab_event_bosnia_relief_4_tt:0 "Discontent in §YBosnia-Herzegovina§!: §G-4§! points."
 AUH_stab_event_croatia_relief_3_tt:0 "Discontent in §YCroatia-Slavonia§!: §G-3§! points."
 ww1_auh_stability.14.a:0 "Order a civil review of the investigations."
 AUH_stab_event_bosnia_relief_3_tt:0 "Discontent in §YBosnia-Herzegovina§!: §G-3§! points."
 ww1_auh_stability.14.b:0 "Give the security authorities their support."
 AUH_stab_event_bosnia_unrest_5_tt:0 "Discontent in §YBosnia-Herzegovina§!: §R+5§! points."
 AUH_stab_event_croatia_unrest_3_tt:0 "Discontent in §YCroatia-Slavonia§!: §R+3§! points."
 ww1_auh_stability.14.c:0 "Leave the matter to the provincial commands."
 ww1_auh_stability.14.t:0 "Security and Loyalty in the South"
 ww1_auh_stability.14.d:0 "Provincial representatives have protested the conduct of security investigations in the southern lands. They report that arrests and restrictions have fallen upon people whose loyalty was never in question. The military authorities reply that they cannot wait for civil proceedings while enemy agents are at work.\n\nA review could restore some confidence, but would invite accusations that the government is interfering with the war effort. Giving the security authorities a freer hand might silence the protests for now. It would leave a deep grievance among those expected to remain loyal."
 AUH_stab_event_security_backlash_tt:0 "Discontent in §YBosnia-Herzegovina§! and §YCroatia-Slavonia§! will rise by §R0.35§! points each month for §Yone year§! while those regions remain under our administration."
 ww1_auh_stability.20.a:0 "Now we must make it last."
 ww1_auh_stability.20.t:0 "An Agreement That Endures"
 ww1_auh_stability.20.d:0 "For a year, the provincial returns have recorded something more valuable than another promise of reform. Appropriations have reached their intended offices, local agreements have survived their first disputes, and essential supplies have continued to arrive. The settlement is becoming part of ordinary government.\n\nThe provinces still contain rival ambitions. What has changed is that these ambitions can increasingly be pursued without bringing our common institutions to a halt. Years of bargaining and administration have given us a position worth defending."
 AUH_stab_event_settlement_maintained_tt:0 "The effects of regional discontent have already eased with the settlement. Continued administration and adequate supplies are required to maintain it; war and renewed grievances can still undo this progress."
 ww1_auh_stability.21.a:0 "We cannot govern on past assurances."
 ww1_auh_stability.21.t:0 "The Settlement Under Strain"
 ww1_auh_stability.21.d_war:0 "The agreements which held the provinces together in peace are being tested by the war. Officials report new disputes over requisitions, labour, and the reach of the military authorities. Representatives who once defended the settlement now ask whether its guarantees will be honoured when they are most needed.\n\nThe work of earlier years has not vanished, but confidence can no longer be taken for granted. Unless the grievances are answered, each emergency order will make the next agreement harder to secure."
 ww1_auh_stability.21.d_peace:0 "The latest provincial reports show that the settlement is losing ground. Unfulfilled appropriations and renewed disputes over local authority have given its opponents an opening. Representatives who had accepted the common arrangements are once again withholding their cooperation.\n\nThe institutions built over earlier years remain in place. Restoring confidence will require them to deliver the guarantees upon which they were founded."
 AUH_stab_event_settlement_relapse_tt:0 "Renewed discontent has ended the period of sustained settlement. Existing reforms remain in place, but the crownlands must again be brought below the settlement thresholds and kept there before confidence is restored."
