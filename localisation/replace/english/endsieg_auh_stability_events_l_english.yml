l_english:
 ww1_auh_stability.1.a:0 "There is much work to be done."
 ww1_auh_stability.1.t:0 "The Provincial Question"
 ww1_auh_stability.1.d:0 "Petitions from the provinces fill the offices of government. Some demand schools and officials who speak the local language; others seek a greater share of public funds and political authority. Each concession has its supporters, and each has opponents who fear what it may cost them.\n\nA proclamation alone will not settle these disputes. We must negotiate, provide the means to carry out our agreements, and persuade the provinces that their interests can be secured through the common administration."
 AUH_stab_event_introduction_tt:0 "The crownlands must be brought into a lasting settlement through sustained regional programmes. Focuses open further negotiations and reforms. Discontent will continue to respond to wartime shortages and the treatment of each region."
 AUH_stab_event_hungary_relief_4_tt:0 "Discontent in §YHungary§!: §G-4§! points."
 AUH_stab_event_slovakia_unrest_1_tt:0 "Discontent in §YSlovakia§!: §R+1§! points."
 AUH_stab_event_transylvania_unrest_1_tt:0 "Discontent in §YTransylvania§!: §R+1§! points."
 ww1_auh_stability.10.a:0 "Reach an understanding with the delegation."
 AUH_stab_event_hungary_unrest_5_tt:0 "Discontent in §YHungary§!: §R+5§! points."
 AUH_stab_event_austria_relief_2_tt:0 "Discontent in §Ythe Austrian lands§!: §G-2§! points."
 ww1_auh_stability.10.b:0 "The common services will be funded by decree."
 AUH_stab_event_hungary_unrest_3_tt:0 "Discontent in §YHungary§!: §R+3§! points."
 ww1_auh_stability.10.c:0 "Leave the question for another day."
 ww1_auh_stability.10.t:0 "The Hungarian Budget Dispute"
 ww1_auh_stability.10.d:0 "The Hungarian delegation has challenged the latest appropriations for the common administration. Its members demand a stronger say over how the money is raised and spent, while officials responsible for the wider budget warn that essential services cannot wait.\n\nAn agreement with the Hungarian leadership may secure its cooperation, but other nationalities are unlikely to welcome a settlement in which their own claims receive less attention."
 AUH_stab_event_bohemia_relief_5_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-5§! points."
 AUH_stab_event_austria_unrest_1_tt:0 "Discontent in §Ythe Austrian lands§!: §R+1§! points."
 ww1_auh_stability.11.a:0 "Provide for bilingual administration."
 AUH_stab_event_bohemia_unrest_4_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+4§! points."
 AUH_stab_event_austria_relief_1_tt:0 "Discontent in §Ythe Austrian lands§!: §G-1§! points."
 ww1_auh_stability.11.b:0 "Keep the existing appointments."
 AUH_stab_event_bohemia_unrest_3_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+3§! points."
 ww1_auh_stability.11.c:0 "The provincial authorities must decide."
 ww1_auh_stability.11.t:0 "A Question of Language"
 ww1_auh_stability.11.d:0 "Appointments to public office in Bohemia have become the subject of a bitter dispute. Czech representatives demand that their language be given a proper place in the administration; German associations fear that the proposed requirements will drive experienced officials from their posts.\n\nAn administration able to serve both communities may ease the dispute, but finding and training the necessary clerks will take money and time. Defending the present arrangements would be easier, though hardly more popular with their critics."
 AUH_stab_event_austria_relief_4_tt:0 "Discontent in §Ythe Austrian lands§!: §G-4§! points."
 AUH_stab_event_bohemia_relief_2_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-2§! points."
 AUH_stab_event_hungary_unrest_2_tt:0 "Discontent in §YHungary§!: §R+2§! points."
 ww1_auh_stability.12.a:0 "Fund deliveries and public kitchens."
 AUH_stab_event_austria_unrest_4_tt:0 "Discontent in §Ythe Austrian lands§!: §R+4§! points."
 ww1_auh_stability.12.b:0 "The army must have priority."
 AUH_stab_event_austria_unrest_3_tt:0 "Discontent in §Ythe Austrian lands§!: §R+3§! points."
 AUH_stab_event_bohemia_unrest_2_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+2§! points."
 ww1_auh_stability.12.c:0 "We have no supplies to spare."
 ww1_auh_stability.12.t:0 "Bread for the Cities"
 ww1_auh_stability.12.d:0 "Grain is in short supply, and the demands of the army compete with those of the towns. Municipal authorities report that deliveries are falling behind and queues outside the shops are growing longer. The loss of farm labour and the strain on transport have made the shortage harder to remedy.\n\nA programme of civilian deliveries and public kitchens could offer some relief, but the army will not welcome the diversion of supplies from the front."
 AUH_stab_event_food_relief_tt:0 "Food security: §G+4§! points."
 AUH_stab_event_food_shortfall_tt:0 "Food security: §R-3§! points."
 AUH_stab_event_bohemia_relief_4_tt:0 "Discontent in §Ythe Bohemian lands§!: §G-4§! points."
 ww1_auh_stability.13.a:0 "Negotiate with the workers."
 ww1_auh_stability.13.b:0 "Keep the workshops under close supervision."
 AUH_stab_event_austria_unrest_5_tt:0 "Discontent in §Ythe Austrian lands§!: §R+5§! points."
 AUH_stab_event_bohemia_unrest_5_tt:0 "Discontent in §Ythe Bohemian lands§!: §R+5§! points."
 ww1_auh_stability.13.c:0 "The stoppage will run its course."
 ww1_auh_stability.13.t:0 "A Strike in the Workshops"
 ww1_auh_stability.13.d:0 "Workers in the industrial districts have laid down their tools, demanding bread and relief from the pressures of wartime production. Factory managers warn that further delays will interrupt deliveries to the army, but the men at the benches insist that their families cannot live on promises.\n\nWe may negotiate with their representatives or tighten our control over the workshops. Either course will carry a price."
 AUH_stab_event_bosnia_relief_4_tt:0 "Discontent in §YBosnia-Herzegovina§!: §G-4§! points."
 AUH_stab_event_croatia_relief_3_tt:0 "Discontent in §YCroatia-Slavonia§!: §G-3§! points."
 ww1_auh_stability.14.a:0 "Order a civil review."
 AUH_stab_event_bosnia_relief_3_tt:0 "Discontent in §YBosnia-Herzegovina§!: §G-3§! points."
 ww1_auh_stability.14.b:0 "Support the security authorities."
 AUH_stab_event_bosnia_unrest_5_tt:0 "Discontent in §YBosnia-Herzegovina§!: §R+5§! points."
 AUH_stab_event_croatia_unrest_3_tt:0 "Discontent in §YCroatia-Slavonia§!: §R+3§! points."
 ww1_auh_stability.14.c:0 "Leave the matter to the provincial commands."
 ww1_auh_stability.14.t:0 "Investigations in the Southern Lands"
 ww1_auh_stability.14.d:0 "Provincial representatives have protested against the conduct of wartime security investigations in the southern lands. Arrests and restrictions, they say, have fallen upon people whose loyalty should not be in doubt. The military authorities insist that they need freedom to act against threats to the war effort.\n\nA civil review may restore some confidence, but it risks a dispute with the army. Giving the investigators our backing may quieten opposition for now, at the cost of grievances that will be harder to settle later."
 AUH_stab_event_security_backlash_tt:0 "Discontent in §YBosnia-Herzegovina§! and §YCroatia-Slavonia§! will rise by §R0.35§! points each month for §Yone year§! while those regions remain under our administration."
 ww1_auh_stability.20.a:0 "We must ensure that it endures."
 ww1_auh_stability.20.t:0 "A Settlement Takes Root"
 ww1_auh_stability.20.d:0 "The latest reports from the provinces offer cause for cautious satisfaction. The arrangements reached after long negotiation have held, and the common administration is beginning to earn confidence through its work rather than its promises.\n\nDifferences of language, interest and ambition remain. For now, at least, there is a stronger foundation on which to resolve them."
 AUH_stab_event_settlement_maintained_tt:0 "The effects of regional discontent have already eased with the settlement. Continued administration and adequate supplies are required to maintain it; war and renewed grievances can still undo this progress."
 ww1_auh_stability.21.a:0 "We must restore their confidence."
 ww1_auh_stability.21.t:0 "Confidence in the Settlement Falters"
 ww1_auh_stability.21.d_war:0 "The war has placed heavy demands upon the provinces, and confidence in the settlement has begun to falter. Disputes over supplies, labour and the authority of the military have brought old grievances back to the surface. Even those who once defended the agreements now question whether their guarantees will be honoured.\n\nThe work already done need not be lost, but the government must answer these concerns if it is to preserve the settlement."
 ww1_auh_stability.21.d_peace:0 "Reports from the provinces suggest that confidence in the settlement is ebbing. Old disputes have returned, and representatives who once cooperated with the common administration are again pressing their demands. Its opponents have seized upon the growing dissatisfaction.\n\nThe agreements remain, but the government must show that they can address the grievances of the people they were meant to serve."
 AUH_stab_event_settlement_relapse_tt:0 "Renewed discontent has ended the period of sustained settlement. Existing reforms remain in place, but the crownlands must again be brought below the settlement thresholds and kept there before confidence is restored."
