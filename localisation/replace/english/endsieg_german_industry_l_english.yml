l_english:
  INT_GER_industry: "German Industrial Development"
  INT_GER_industry_desc:0 "The war has left Germany with damaged infrastructure, strained public finances and an uncertain place in world trade. New investment must restore production without exposing the economy to obligations it cannot sustain."
  INT_GER_industry_reconstruction_projects: "Commission Reconstruction Projects"
  INT_GER_industry_reconstruction_projects_desc:0 "Damaged workshops and disrupted supply lines still hold back civilian production. Reconstruction contracts will allow an industrial district to resume its work."
  INT_GER_industry_roaring_investment: "Invest in the Roaring Twenties"
  INT_GER_industry_roaring_investment_desc:0 "Expanding markets have created an opportunity for new industrial investment. Public backing can bring another factory into production, though the obligations accepted now will weigh on future budgets."
  INT_GER_industry_electrification_grid: "Extend the Electrical Grid"
  INT_GER_industry_electrification_grid_desc:0 "Factories cannot modernise while their power supply remains unreliable. Extending the electrical network will connect more industrial districts to dependable generating capacity."
  INT_GER_industry_housing_program: "Fund Municipal Housing"
  INT_GER_industry_housing_program_desc:0 "Overcrowded housing and high rents have become a source of growing resentment. Municipal construction will improve workers' living conditions, though the necessary funds must be drawn from other public needs."
  INT_GER_industry_modernize_machinery: "Modernize Factory Machinery"
  INT_GER_industry_modernize_machinery_desc:0 "Much of our machinery has been worked beyond its intended life. New equipment and technical instruction will help manufacturers improve their methods and compete abroad."
  INT_GER_industry_domestic_savings: "Mobilize Domestic Savings"
  INT_GER_industry_domestic_savings_desc:0 "A reserve built from domestic savings will give the treasury greater freedom in a future emergency. Setting it aside requires restraint while demands for public spending remain strong."
  INT_GER_industry_export_guarantees: "Guarantee Industrial Exports"
  INT_GER_industry_export_guarantees_desc:0 "Foreign buyers are reluctant to place orders without dependable credit. Limited export guarantees can help German firms secure contracts and maintain confidence in their markets."
  INT_GER_industry_bank_restructuring: "Reassure Bank Depositors"
  INT_GER_industry_bank_restructuring_desc:0 "Reorganising the banks will achieve little while depositors fear for their savings. A public campaign must explain the settlement and persuade households that the institutions can be trusted again."
  INT_GER_industry_recovery_program: "Fund the Recovery Programme"
  INT_GER_industry_recovery_program_desc: "A final industrial investment can turn recovery into durable productive capacity."
  INT_GER_industry_reconstruction: "Reconstruction Drive"
  INT_GER_industry_reconstruction_desc: "State coordination is rebuilding productive capacity after war and inflation."
  INT_GER_industry_reconstruction_cautious: "Cautious Reconstruction"
  INT_GER_industry_reconstruction_cautious_desc: "Reconstruction is proceeding slowly, with an emphasis on monetary confidence."
  INT_GER_industry_credit_boom: "Credit-Fuelled Expansion"
  INT_GER_industry_credit_boom_desc: "Foreign credit is financing a remarkable industrial expansion, but it leaves Germany exposed to an external shock."
  INT_GER_industry_savings_path: "Domestic Capital Drive"
  INT_GER_industry_savings_path_desc: "Savings and retained earnings provide a steadier foundation for industrial growth."
  INT_GER_industry_electrification: "Electrified Industry"
  INT_GER_industry_electrification_desc: "A broader electrical grid is raising productivity across the industrial economy."
  INT_GER_industry_export_support: "Export Guarantees"
  INT_GER_industry_export_support_desc: "Public guarantees support German exporters and keep orders flowing."
  INT_GER_industry_public_works_burden: "Public Works Burden"
  INT_GER_industry_public_works_burden_desc: "Recent investment has created a temporary fiscal burden."
  INT_GER_industry_austerity_burden: "Austerity Burden"
  INT_GER_industry_austerity_burden_desc: "A savings drive is limiting public spending while its benefits accumulate."
  INT_GER_industry_credit_crash: "Unprotected Credit Exposure"
  INT_GER_industry_credit_crash_desc: "The collapse of foreign lending has hit German production and confidence hard."
  INT_GER_industry_credit_crash_buffered: "Buffered Credit Shock"
  INT_GER_industry_credit_crash_buffered_desc: "Reserves are cushioning the industrial economy from the collapse of foreign lending."
  INT_GER_industry_recovery: "Industrial Recovery"
  INT_GER_industry_recovery_desc: "Recovery policy is restoring orders, employment and confidence after the depression."
  INT_GER_industry_bank_reform: "Bank Restructuring"
  INT_GER_industry_bank_reform_desc: "Reorganized banks are once again able to support productive investment."
  INT_GER_industry_reserve_fund: "Industrial Reserve Fund"
  INT_GER_industry_reserve_fund_desc: "Liquidity set aside before the crash can cushion foreign-credit exposure. The fund is deployed when the crash arrives."
  INT_ger_industry.1.t: "The Direction of German Growth"
  INT_ger_industry.1.d: "Investment committees are considering a renewed expansion of German industry. Foreign lending promises rapid growth, while savings and retained earnings offer a slower and less exposed foundation. The policy chosen here shapes our gains during the boom and our vulnerability when international lending contracts."
  INT_ger_industry.1.a: "Favor international investment"
  INT_ger_industry.1.b: "Build on domestic savings"
  INT_ger_industry.2.t: "The Reconstruction Commission"
  INT_ger_industry.2.d: "The Reconstruction Commission has submitted two approaches to rebuilding civilian production. State coordination can restore capacity quickly, while a cautious program puts greater emphasis on household confidence. These emergency programs are useful during reconstruction; once monetary stabilization or a later crisis has overtaken them, the recommendations instead strengthen the government's planning authority."
  INT_ger_industry.2.a: "Coordinate a bold reconstruction drive"
  INT_ger_industry.2.b: "Rebuild cautiously"
  INT_ger_industry.3.t: "The Credit Shock"
  INT_ger_industry.3.d: "The global crisis has ended the investment boom. Firms reliant on foreign credit face an additional contraction; reserves prepared before the crash can soften this blow. An economy built on domestic savings avoids that extra exposure, but it still suffers the wider Depression. Bank reform and a sustained recovery program are now essential."
  INT_ger_industry.3.a: "We must weather the contraction"
  INT_ger_industry.4.t: "Industry Begins to Recover"
  INT_ger_industry.4.d: "The worst of the depression has passed. Orders are returning and a more durable industrial policy can now replace emergency measures."
  INT_ger_industry.4.a: "Set the recovery in motion"
  INT_GER_industry_recovery_project: "Reopen Civilian Production Lines"
  INT_GER_industry_recovery_project_desc:0 "Banking reform and employment measures have laid the foundations for recovery. A new industrial project will turn those preparations into productive work."
  INT_GER_industry_housing_support: "Municipal Housing Program"
  INT_GER_industry_housing_support_desc: "Public housing supports working households while drawing resources into civilian consumption."
  INT_GER_industry_modern_machinery: "Modern Factory Machinery"
  INT_GER_industry_modern_machinery_desc: "Recent investment in machinery lets existing production lines operate more efficiently."
  INT_GER_industry_machinery_bonus: "Industrial Machinery Modernization"
  INT_GER_industry_credit_risk_tt: "Foreign-credit exposure adds an extra economic penalty when the 1929 crash arrives. Completing reserves before the crash reduces this penalty; neither choice prevents the worldwide Depression."
  INT_ger_industry.1.d_late:0 "The years of easy expansion have passed, leaving our investment committees to reconsider their earlier recommendations. They can still prepare useful plans, but the government must now work within a far less forgiving financial climate."
