l_english:
 ww1_britain.5.b:0 "Britain must remain outside this war."
 ww1_britain.5.late.d:0 "The war on the continent shows no sign of ending. Our ministers must decide whether continued neutrality still serves Britain's interests, or whether the fleet and army should take their place against Germany. Intervention would strengthen the coalition, but it would also bring losses and commitments that no cabinet can easily foresee."
 WW1_HIST_CHOICE_ww1_britain.5.a:0 "$WW1_historical_choice_note$ $ww1_britain.5.a$"
 ww1_british_entry.1.t:0 "Britain Enters the War"
 ww1_british_entry.1.d:0 "The British government has declared war on Germany. Following deliberations in London, orders have gone to the fleet and the army as Britain prepares to commit its strength against the German war effort."
 ww1_british_entry.1.a:0 "The war has widened."
 ww1_british_entry.2.t:0 "Britain Declines Intervention"
 ww1_british_entry.2.d:0 "The British cabinet has decided against entering the war with Germany. Ministers maintain that Britain must preserve its freedom of action; their opponents argue that the government has failed to meet its obligations on the continent."
 ww1_british_entry.2.a:0 "London has made its decision."
