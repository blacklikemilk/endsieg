l_english:
 ww1_britain.5.b:0 "Britain must remain outside this war."
 ww1_britain.5.late.d:0 "The war on the continent shows no sign of ending. Our ministers must decide whether continued neutrality still serves Britain's interests, or whether the fleet and army should take their place against Germany. Intervention would strengthen the coalition, but it would also bring losses and commitments that no cabinet can easily foresee."
 WW1_HIST_CHOICE_ww1_britain.5.a:0 "$WW1_historical_choice_note$ $ww1_britain.5.a$"
 ww1_british_entry.1.t:0 "Britain Declares War on Germany"
 ww1_british_entry.1.d:0 "The British government has declared war on Germany. After a final cabinet meeting, ministers concluded that Britain could no longer remain outside the continental struggle. Orders have gone to the fleet and army as London prepares to commit its strength to the war."
 ww1_british_entry.1.a:0 "The war has reached Britain."
 ww1_british_entry.2.t:0 "Britain Remains Neutral"
 ww1_british_entry.2.d:0 "The British cabinet has declined to enter the war against Germany. Ministers insist that the country must preserve its freedom of action rather than commit the fleet and army to an uncertain struggle. The decision has brought relief to some in Parliament and bitter accusations of abandoned obligations from others."
 ww1_british_entry.2.a:0 "London has chosen to stand aside."
