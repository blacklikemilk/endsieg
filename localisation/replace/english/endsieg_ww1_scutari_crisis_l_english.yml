l_english:
 ww1_scutari.1.t:0 "The Capture of Scutari"
 ww1_scutari.1.d:0 "Our troops have entered Scutari. The victory has been greeted with celebrations at home, where the city is regarded as the reward for a bitter campaign.\n\nThe ambassadors in London have reached a different conclusion. They intend Scutari to form part of Albania, and Vienna has warned that our occupation must end. To keep the city would be to challenge the settlement of the Great Powers."
 ww1_scutari.1.a:0 "Our sacrifices cannot simply be cast aside."
 ww1_scutari.1.b:0 "We cannot stand against all of Europe."
 ww1_scutari.2.t:0 "Montenegro Defies the Powers"
 ww1_scutari.2.d:0 "The government in Cetinje intends to keep Scutari despite the frontier agreed by the ambassadors in London. An Albanian state deprived of its northern centre would be weaker from the outset, while another retreat by Vienna would encourage further challenges to the settlement.\n\nA naval demonstration could isolate Montenegro without committing our army. Whether the pressure is sufficient will depend upon our resolve and the support of the other Powers."
 ww1_scutari.2.a:0 "The London frontier must be respected."
 ww1_scutari.2.b:0 "Scutari is not worth a European war."
 ww1_scutari.3.t:0 "The Price of Scutari"
 ww1_scutari.3.d:0 "The pressure upon Montenegro is mounting. Our ports are vulnerable, the army has suffered heavily, and no Power has offered to defend our claim to Scutari. Vienna insists that the city must be handed over for Albania.\n\nWe can entrust its future to the Powers and arrange the departure of our troops, or hold our ground and force Austria-Hungary to decide whether it is prepared to fight."
 ww1_scutari.3.a:0 "Entrust the city to the Powers."
 ww1_scutari.3.b:0 "Our troops will remain."
 ww1_scutari.4.t:0 "The London Frontier"
 ww1_scutari.4.d:0 "Austria-Hungary has called for a common stand against Montenegro's occupation of Scutari. The frontier drawn in London assigns the city to Albania, but Cetinje argues that its army has earned the right to remain.\n\nBacking the demand for withdrawal would strengthen the diplomatic pressure upon Montenegro. It need not bind us to an Austrian war."
 ww1_scutari.4.a:0 "Stand by the agreement reached in London."
 ww1_scutari.4.b:0 "Vienna must settle this without us."
 ww1_scutari.5.t:0 "The Limit of Our Patience"
 ww1_scutari.5.d:0 "Montenegro has refused to leave Scutari. The diplomatic warning has failed, and the city remains in Montenegrin hands despite its assignment to Albania.\n\nOur government must now decide whether to enforce the frontier by arms or accept that Cetinje has defied us. An intervention could recover Scutari, but even a limited Balkan war carries dangers beyond the frontier."
 ww1_scutari.5.d2:0 "Montenegro has refused to leave Scutari, although the city still stands under Ottoman sovereignty. The ambassadors' settlement has not yet been put into effect.\n\nWe may maintain our objection and demand enforcement when the peace establishes the new frontier. Alternatively, we can leave Montenegro in possession and end our part in the dispute."
 ww1_scutari.5.a:0 "Enforce the Albanian frontier."
 ww1_scutari.5.b:0 "Maintain our demand through the peace conference."
 ww1_scutari.5.c:0 "We must accept the fait accompli."
 ww1_scutari.10.t:0 "Montenegro Leaves Scutari"
 ww1_scutari.10.d:0 "Montenegrin troops have left Scutari, ending a dispute that threatened to widen the Balkan conflict. The city is to be administered for Albania under the frontier agreed by the Great Powers.\n\nThe withdrawal has caused bitter disappointment in Montenegro, where the capture of Scutari was celebrated as the crowning victory of the war. For the ambassadors in London, it is a test of their settlement that has at last been resolved."
 ww1_scutari.10.a:0 "The frontier has been upheld."
 ww1_scutari.11.t:0 "Montenegro Holds Scutari"
 ww1_scutari.11.d:0 "Austria-Hungary has abandoned its demand that Montenegro withdraw from Scutari. With the threat of immediate intervention receding, Cetinje remains in possession of the city claimed for Albania by the ambassadors in London.\n\nThe decision has been welcomed in Montenegro and condemned by the Albanian government. The Powers have avoided another war, but the authority of their Balkan settlement has suffered."
 ww1_scutari.11.a:0 "A dangerous precedent."
 WW1_SCUTARI_category:0 "The Scutari Crisis"
 WW1_SCUTARI_category_desc:0 "The capture of Scutari has brought Montenegro into conflict with the settlement of the Great Powers. What our army has won may prove difficult to hold against the will of Europe."
 WW1_SCUTARI_blockade_review:0 "The Naval Demonstration"
 WW1_SCUTARI_blockade_review_desc:0 "Foreign warships are restricting our access to the Adriatic. The Powers will review their demand for Scutari as the pressure upon our government grows."
 WW1_SCUTARI_handover:0 "Evacuate Scutari"
 WW1_SCUTARI_handover_desc:0 "Our commanders are arranging the departure of the garrison and the handover of the city."
 WW1_SCUTARI_reopen_negotiations:0 "Offer to Leave Scutari"
 WW1_SCUTARI_reopen_negotiations_desc:0 "We can still withdraw our claim and hand the city over for Albania. An agreement would end a lasting source of tension with the Powers."
 WW1_SCUTARI_international_blockade:0 "International Naval Demonstration"
 WW1_SCUTARI_international_blockade_desc:0 "Foreign warships off our coast have disrupted supplies and shaken confidence in the government's determination to hold Scutari."
 ww1_scutari_intervention_wargoal:0 "Enforce the Albanian Frontier"
 ww1_scutari_intervention_wargoal_short_desc:0 "Enforce the Albanian Frontier"
 ww1_scutari_intervention_wargoal_desc:0 "Compel Montenegro to leave Scutari and uphold the Albanian frontier."
 WW1_SCUTARI_refusal_tt:0 "Austria-Hungary may seek to enforce the Albanian frontier."
 WW1_SCUTARI_support_tt:0 "Our support will strengthen the diplomatic pressure upon Montenegro."
 WW1_SCUTARI_reservation_tt:0 "Withholding our support may encourage Montenegro to maintain its claim."
 WW1_SCUTARI_wait_for_london_tt:0 "We will maintain our objection to Montenegro's claim when the peace settlement is put into effect."
