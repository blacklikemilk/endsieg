l_english:
 ww1_scutari.1.t:0 "The Fate of Scutari"
 ww1_scutari.1.d:0 "Our soldiers have entered Scutari after a costly campaign. At home the city is hailed as the prize of victory, but the powers meeting in London intend it for Albania. Vienna demands our withdrawal. To stay would mean defying governments far stronger than our own."
 ww1_scutari.1.a:0 "Montenegro has paid dearly for this city."
 ww1_scutari.1.b:0 "We cannot hold it against the powers."
 ww1_scutari.2.t:0 "Cetinje Holds Scutari"
 ww1_scutari.2.d:0 "Montenegro intends to keep Scutari, despite the frontier proposed for Albania. A retreat now would leave the Albanian settlement weakened and invite further challenges. A demonstration off the Montenegrin coast may persuade Cetinje to yield without an immediate march to war."
 ww1_scutari.2.a:0 "Bring the fleet to bear."
 ww1_scutari.2.b:0 "We cannot make this a cause for war."
 ww1_scutari.3.t:0 "The Powers Demand Scutari"
 ww1_scutari.3.d:0 "The diplomatic pressure on Cetinje has grown. Our army has borne the cost of taking Scutari, but the powers insist that the city must pass to Albania. We can arrange a withdrawal, or leave Vienna to decide whether it will enforce its demand."
 ww1_scutari.3.a:0 "We must withdraw the garrison."
 ww1_scutari.3.b:0 "Our soldiers will stay."
 ww1_scutari.4.t:0 "The Powers and Scutari"
 ww1_scutari.4.d:0 "Austria-Hungary seeks support for its demand that Montenegro leave Scutari. The city lies within the frontier proposed for Albania, though Cetinje insists on keeping what its army has won. We must decide whether to lend our diplomatic weight to Vienna."
 ww1_scutari.4.a:0 "Support the demand for withdrawal."
 ww1_scutari.4.b:0 "We will not endorse further pressure."
 ww1_scutari.5.t:0 "The Scutari Question Remains"
 ww1_scutari.5.d:0 "The Montenegrin government has refused to yield Scutari, which it now holds as its own. Our diplomatic pressure has not secured the frontier we sought for Albania. We must decide whether to enforce the demand or accept the position created on the ground."
 ww1_scutari.5.d2:0 "Montenegro has refused to withdraw from Scutari, though its sovereignty over the city has not been established. The final settlement is still pending. We may press the demand when peace is concluded or abandon our objection to the Montenegrin position."
 ww1_scutari.5.a:0 "Use force to uphold the frontier."
 ww1_scutari.5.b:0 "Press our demand at the peace talks."
 ww1_scutari.5.c:0 "We must accept the position."
 ww1_scutari.10.t:0 "Montenegro Withdraws from Scutari"
 ww1_scutari.10.d:0 "Montenegrin forces have withdrawn from Scutari under pressure from the powers. The city is to pass to Albanian administration, ending a dispute that threatened another confrontation in the Balkans. The decision has caused bitter disappointment in Montenegro after the costly capture of the city."
 ww1_scutari.10.a:0 "The frontier has been upheld."
 ww1_scutari.11.t:0 "Montenegro Retains Scutari"
 ww1_scutari.11.d:0 "Austria-Hungary has abandoned its demand that Montenegro withdraw from Scutari. With immediate intervention averted, Cetinje retains its claim to the city. The decision has relieved Montenegro but left the powers’ proposed Albanian frontier in question."
 ww1_scutari.11.a:0 "The dispute has taken another course."
 WW1_SCUTARI_category:0 "The Scutari Crisis"
 WW1_SCUTARI_category_desc:0 "The capture of Scutari has brought Montenegro into conflict with the settlement of the Great Powers. What our army has won may prove difficult to hold against the will of Europe."
 WW1_SCUTARI_blockade_review:0 "The Naval Demonstration"
 WW1_SCUTARI_blockade_review_desc:0 "Foreign warships are restricting our access to the Adriatic. The Powers will review their demand for Scutari as the pressure upon our government grows."
 WW1_SCUTARI_handover:0 "Evacuate Scutari"
 WW1_SCUTARI_handover_desc:0 "Our commanders are arranging the departure of the garrison and the handover of the city."
 WW1_SCUTARI_reopen_negotiations:0 "Offer to Leave Scutari"
 WW1_SCUTARI_reopen_negotiations_desc:0 "We can still withdraw our claim and hand the city over for Albania. An agreement would end a lasting source of tension with the Powers."
 WW1_SCUTARI_international_blockade:0 "International Naval Demonstration"
 WW1_SCUTARI_international_blockade_desc:0 "Foreign warships off our coast have disrupted supplies and shaken confidence in the government's determination to hold Scutari."
 ww1_scutari_intervention_wargoal:0 "Enforce the Albanian Frontier"
 ww1_scutari_intervention_wargoal_short_desc:0 "Enforce the Albanian Frontier"
 ww1_scutari_intervention_wargoal_desc:0 "Compel Montenegro to leave Scutari and uphold the Albanian frontier."
 WW1_SCUTARI_refusal_tt:0 "Austria-Hungary may seek to enforce the Albanian frontier."
 WW1_SCUTARI_support_tt:0 "Our support will strengthen the diplomatic pressure upon Montenegro."
 WW1_SCUTARI_reservation_tt:0 "Withholding our support may encourage Montenegro to maintain its claim."
 WW1_SCUTARI_wait_for_london_tt:0 "We will maintain our objection to Montenegro's claim when the peace settlement is put into effect."
