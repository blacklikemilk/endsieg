l_english:
 WW1_western_plan_category: "The General Staff's Timetable"
 WW1_western_plan_category_desc: "[GetWW1WesternPlanStatus]"
 WW1_western_plan_attack_opening: "Preparations for the Opening Offensive"
 WW1_western_plan_attack_advance: "Offensive Momentum"
 WW1_western_plan_attack_final: "The Last Push on Paris"
 WW1_western_plan_schlieffen_meuse: "Open the Belgian Corridor"
 WW1_western_plan_schlieffen_meuse_desc: "Secure Liège and Brussels so the right wing can keep its railheads close to the advancing armies. Before Christmas, German forces gain §G+12%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_schlieffen_meuse_objective_tt: "Germany or its faction allies control Liège and Brussels, or have already taken Paris."
 WW1_western_plan_schlieffen_somme: "Turn the French Left"
 WW1_western_plan_schlieffen_somme_desc: "Take Lille and Amiens. The junctions on the Somme will keep the right wing supplied for the march on Paris. Before Christmas, German forces gain §G+10%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_schlieffen_somme_objective_tt: "Germany or its faction allies control Lille and Amiens, or have already taken Paris."
 WW1_western_plan_rupprecht_switzerland: "Open the Swiss Corridor"
 WW1_western_plan_rupprecht_switzerland_desc: "Take Bern to secure the railway across the Swiss plateau and bring the French frontier within reach. Before Christmas, German forces gain §G+12%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_rupprecht_switzerland_objective_tt: "Germany or a faction ally controls Bern or Paris."
 WW1_western_plan_rupprecht_jura: "Break Through the Jura"
 WW1_western_plan_rupprecht_jura_desc: "Secure Besançon and Dijon before the French can reinforce the approaches from the southeast. Before Christmas, German forces gain §G+10%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_rupprecht_jura_objective_tt: "Germany or its faction allies control Besançon and Dijon, or have already taken Paris."
 WW1_western_plan_kronprinz_warsaw: "Secure the Eastern Flank"
 WW1_western_plan_kronprinz_warsaw_desc: "Take Łódź or Warsaw, or end the war with Russia before transferring reserves to the French frontier. Before Christmas, German forces gain §G+12%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_kronprinz_warsaw_objective_tt: "Germany or a faction ally controls Łódź or Warsaw, or Germany is at peace with Russia. Taking Paris also ends the operation."
 WW1_western_plan_kronprinz_lorraine: "Counterattack in Lorraine"
 WW1_western_plan_kronprinz_lorraine_desc: "Take Nancy and Verdun to open the road west from the fortified frontier. Before Christmas, German forces gain §G+12%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_kronprinz_lorraine_objective_tt: "Germany or its faction allies control Nancy and Verdun, or have already taken Paris."
 WW1_western_plan_kronprinz_champagne: "Break Through Champagne"
 WW1_western_plan_kronprinz_champagne_desc: "Seize Reims and bring the railway through Champagne into use for the advance on Paris. Before Christmas, German forces gain §G+10%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_kronprinz_champagne_objective_tt: "Germany or a faction ally controls Reims or Paris."
 WW1_western_plan_paris: "Take Paris"
 WW1_western_plan_paris_desc: "Take Paris before the offensive exhausts its reserves and the French can reorganise behind the Seine. Before Christmas, German forces gain §G+8%§! attack in battles for the marked states while this phase is active."
 WW1_western_plan_paris_objective_tt: "Germany or a faction ally controls Paris."
 ww1_western_plans.1.t: "The Schlieffen Plan in Motion"
 ww1_western_plans.1.d: "The First and Second Armies have their orders. Liège and Brussels must fall quickly if the right wing is to reach the French frontier with its supply columns intact. The General Staff has issued the first timetable to the army commands."
 ww1_western_plans.1.a: "Keep the columns moving."
 ww1_western_plans.2.t: "Orders for the Swiss Frontier"
 ww1_western_plans.2.d: "Rupprecht's armies will cross into Switzerland and make for Bern. If the railways can be secured before the Swiss destroy the junctions, the army can bring its heavy guns up to the Jura and approach France from the southeast."
 ww1_western_plans.2.a: "Issue the marching orders."
 ww1_western_plans.3.t: "The General Staff's Reserves"
 ww1_western_plans.3.d: "The western armies will hold their line while the General Staff secures the eastern flank. Once reserves can be spared, the first counterattack will fall on Nancy and Verdun. The next orders will depend on the ground we gain."
 ww1_western_plans.3.a: "Notify the army commands."
 ww1_western_plans.4.t: "Paris Is Taken"
 ww1_western_plans.4.d: "Reports from the capital confirm that Paris is in friendly hands. The offensive timetable has served its purpose. The army must now consolidate its positions and prepare for whatever orders come next."
 ww1_western_plans.4.a: "The General Staff has its answer."
 ww1_western_plans.5.t: "The Offensive Loses Its Momentum"
 ww1_western_plans.5.d: "The army has missed the timetable set by the General Staff. The special allocations of ammunition and transport have been exhausted, and the remaining objectives must be pursued under ordinary field orders."
 ww1_western_plans.5.a: "Consolidate what we have gained."
 WW1_western_plan_status_success: "Paris has fallen. The General Staff's opening timetable has achieved its final objective."
 WW1_western_plan_status_failed: "The armies have failed to reach their objective within the allotted time. The opening timetable has been abandoned, and the army commands must prepare for a longer campaign."
 WW1_western_plan_status_active: "The armies have been given a timetable for each phase of the offensive. Their preparations give them a temporary attack bonus in the states marked on the map. This support ends on §Y25 December [?WW1_western_plan_bonus_deadline_year|0]§!. Taking Paris ahead of schedule completes the operation."
 WW1_western_plan_status_late: "The General Staff has issued objectives for the advance. The opening preparations have expired, and the armies must now rely on their own strength to carry out the orders."
 WW1_western_plan_status_closed: "The opening timetable has ended. Further operations rest with the army commands and the government's wider war policy."
