 INT_whr_news.1.t: "An Elected Government in Russia"
 INT_whr_news.1.d: "The White coalition has held constituent elections. Alexander Kerensky now heads a civilian government, marking a break with the provisional military arrangements of the civil war."
 INT_whr_news.1.a: "The settlement takes shape."
 INT_whr_news.2.t: "Russia's Monarchy Consolidated"
 INT_whr_news.2.d: "The restored royal government has brought its cabinet and industry under a lasting constitutional settlement."
 INT_whr_news.2.a: "A crown remains in power."
 INT_whr_news.3.t: "Kolchak's Directorate Endures"
 INT_whr_news.3.d: "Years after the civil war, Admiral Kolchak's directorate remains the center of political authority in White Russia."
 INT_whr_news.3.a: "The admiral retains control."
 INT_whr_news.4.t: "Russia Reports Economic Recovery"
 INT_whr_news.4.d: "The White Russian government says its railways, banks and factories have recovered from years of war and the global slump."
 INT_whr_news.4.a: "Reconstruction bears fruit."
