 WW1WO.1001.a:0 "Accept the proposed convention."
 WW1WO.1001.b:0 "Offer narrower terms."
 WW1WO.1001.c:0 "We cannot accept these terms."
 WW1WO.1001.d:0 "The Soviet government has asked Sweden to discuss medical stores and railway supplies. The proposed commercial mission would deal with purchasing and delivery, without an undertaking concerning Russia's internal government."
 WW1WO.1001.t:0 "A Neutral Commercial Mission"
 WW1WO.101.a:0 "Accept the proposed convention."
 WW1WO.101.b:0 "Offer narrower terms."
 WW1WO.101.c:0 "We cannot accept these terms."
 WW1WO.101.d:0 "France proposes a joint commission to examine frontier guarantees and the rebuilding of the districts damaged by the war. The note records French demands for the peace settlement, while offering an exchange of engineers and regular frontier reports."
 WW1WO.101.t:0 "The French Settlement Note"
 WW1WO.1020.a:0 "The ministries have their answer."
 WW1WO.1020.accepted:0 "The other government has accepted the convention. The ministries will now appoint their representatives and begin the agreed exchange of reports and technical experience."
 WW1WO.1020.b:0 "Accept the revised terms."
 WW1WO.1020.c:0 "The revised terms are unacceptable."
 WW1WO.1020.counter:0 "Stockholm will permit a shorter commercial mission if the Soviet government assumes the cost of organising it. The revised terms will remain open for the remainder of the original reply period."
 WW1WO.1020.lapsed:0 "The proposed exchange has ended without a convention. The circumstances under which the note was sent no longer permit the two governments to proceed on the terms proposed."
 WW1WO.1020.refused:0 "The other government has declined the proposed convention. The delegation will return without an agreement, and the ministries must continue their work within the means already available."
 WW1WO.1020.t:0 "A Neutral Commercial Mission: The Reply"
 WW1WO.1101.a:0 "Accept the proposed convention."
 WW1WO.1101.b:0 "Offer narrower terms."
 WW1WO.1101.c:0 "We cannot accept these terms."
 WW1WO.1101.d:0 "The anti-Bolshevik command requests British technical representatives to examine its repair and supply arrangements. The mission would share practical experience without assuming command of the Russian forces."
 WW1WO.1101.t:0 "An Allied Technical Mission"
