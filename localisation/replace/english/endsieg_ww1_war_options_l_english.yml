 WW1WO.301.d:0 "Vienna proposes a joint commission to hear frontier complaints and improve navigation on the Danube. The note also sets out the Monarchy's security concerns, which Belgrade must consider before agreeing to a permanent arrangement."
 WW1WO.301.t:0 "The Vienna-Belgrade Exchange"
