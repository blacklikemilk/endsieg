 WW1_WO_AUH_belgrade_exchange:0 "An Exchange with Belgrade"
 WW1_WO_AUH_belgrade_exchange_desc:0 "Vienna will submit its terms to the Serbian government and request a definite reply. A convention freely accepted by both parties would give substance to the settlement; a refusal cannot be treated as consent."
 WW1_WO_AUH_belgrade_security_demands:0 "The Belgrade Security Demands"
 WW1_WO_AUH_belgrade_security_demands_desc:0 "The army considers the exposed frontier around Belgrade a danger that the peace must answer. Our demands will concern inspection and frontier security, with any territorial question reserved for the general settlement."
 WW1_WO_AUH_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_AUH_common_delegations_review:0 "Submit the Terms to the Delegations"
 WW1_WO_AUH_common_delegations_review_desc:0 "The common ministries cannot promise an expensive frontier settlement without accounting for its upkeep. The Austrian and Hungarian delegations will examine what the proposed obligations would demand of the shared budget."
 WW1_WO_AUH_convention_research:0 "The Vienna-Belgrade Exchange Research"
 WW1_WO_AUH_danube_counterproposal:0 "The Danube Counterproposal"
 WW1_WO_AUH_danube_counterproposal_desc:0 "Belgrade proposes a mixed commission for frontier complaints and navigation, but rejects a permanent foreign security mission. We can accept this narrower safeguard without surrendering our right to bring future disputes before the commission."
 WW1_WO_AUH_grain_trains_for_the_cities:0 "Grain Trains for the Cities"
 WW1_WO_AUH_grain_trains_for_the_cities_desc:0 "The endurance of the monarchy depends on bread reaching its towns. Grain trains will receive protected routes and handling crews even when the army demands those same wagons for the front."
 WW1_WO_AUH_heavy_stores_to_the_front:0 "Heavy Stores to the Front"
 WW1_WO_AUH_heavy_stores_to_the_front_desc:0 "The guns cannot hold the Carpathian passes without ammunition and engineering stores. Military trains will receive priority for the coming campaign, while the food office prepares for the pressure this places on civilian supplies."
 WW1_WO_AUH_insist_on_inspection:0 "Insist on Inspection"
 WW1_WO_AUH_insist_on_inspection_desc:0 "A mixed commission alone will not satisfy the common army's demands. We will decline the Serbian revision and keep our original programme before the peace conference, without pretending that a convention has been signed."
 WW1_WO_AUH_military_credit_for_guarantees:0 "Military Credit for the Guarantees"
 WW1_WO_AUH_military_credit_for_guarantees_desc:0 "A stronger frontier convention will require stores, engineers and a continuing military establishment. The government will reserve common resources for that commitment, even where provincial recovery must wait."
 WW1_WO_AUH_mixed_frontier_commission:0 "A Mixed Frontier Commission"
 WW1_WO_AUH_mixed_frontier_commission_desc:0 "An accepted convention will give border incidents a forum outside the general staffs. Delegates from both governments will investigate complaints and keep navigation disputes from becoming another crisis."
 WW1_WO_AUH_prepare_convention:0 "Prepare: The Vienna-Belgrade Exchange"
 WW1_WO_AUH_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_AUH_reciprocal_balkan_assurances:0 "Reciprocal Balkan Assurances"
 WW1_WO_AUH_reciprocal_balkan_assurances_desc:0 "A secure southern frontier requires restraints on both sides. We will offer Serbia an agreement against cross-border agitation and seek a settlement that leaves the neighboring state intact."
 WW1_WO_AUH_restore_crownland_connections:0 "Restore the Crownland Connections"
 WW1_WO_AUH_restore_crownland_connections_desc:0 "Railways and public services must again connect the lands that remain bound by the monarchy's settlement. The work will follow the institutions and obligations already agreed by the crowns, rather than reopen their status."
 WW1_WO_AUH_southern_inspection_convention:0 "The Southern Inspection Convention"
 WW1_WO_AUH_southern_inspection_convention_desc:0 "Serbia has accepted the inspection duties specified in our agreement. Their execution will remain confined to those duties; neither the army nor the common ministries may treat the convention as an annexation."
 WW1_WO_AUH_war_council:0 "The Common War Council"
 WW1_WO_AUH_war_council_desc:0 "The ministers of the Monarchy must reconcile the demands of the army with the survival of its peoples and institutions. Their programme will determine the terms put before neighbours and partners."
 WW1_WO_AUH_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_AUH_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_ENG_belgian_dossier:0 "The Belgian Reconstruction Dossier"
 WW1_WO_ENG_belgian_dossier_desc:0 "The restoration of Belgium will require the reopening of workshops and railways as well as the return of its government. Our departments will assemble the records and material estimates which the Belgian authorities will need."
 WW1_WO_ENG_belgian_dossier_research:0 "The Belgian Reconstruction Dossier Research"
 WW1_WO_ENG_civilian_contracts:0 "Reopen Civilian Contracts"
 WW1_WO_ENG_civilian_contracts_desc:0 "The return to peace requires more than cancelling military orders. Manufacturers and public departments will agree how transport, repairs and ordinary commerce are to resume."
 WW1_WO_ENG_coalition_board:0 "A Common Purchasing Board"
 WW1_WO_ENG_coalition_board_desc:0 "Our partners compete for many of the same stores and cargoes. A common purchasing arrangement could reduce that competition, provided that the other government accepts the proposed terms."
 WW1_WO_ENG_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_ENG_credits:0 "Emergency War Credits"
 WW1_WO_ENG_credits_desc:0 "The military authorities cannot wait for ordinary estimates to be approved. Emergency contracts will increase immediate output, at the price of a heavier claim on civilian goods."
 WW1_WO_ENG_imperial_terms:0 "Security of the Imperial Routes"
 WW1_WO_ENG_imperial_terms_desc:0 "A settlement must protect the ports and communications upon which the Empire depends. Our delegation will seek guarantees for those routes while the services prepare the evidence needed to sustain that demand."
 WW1_WO_ENG_limited_terms:0 "A Settlement without European Annexations"
 WW1_WO_ENG_limited_terms_desc:0 "The restoration of invaded states and a durable balance of power are sufficient objects for the war. We will instruct our delegates to resist new continental annexations and concentrate the national effort on a defensible settlement."
 WW1_WO_ENG_naval_pressure:0 "Sustain the Economic Blockade"
 WW1_WO_ENG_naval_pressure_desc:0 "Sea power must make the enemy feel the cost of continuing the war. The fleet will devote more attention to intercepting hostile trade, while accepting fewer resources for escort work."
 WW1_WO_ENG_peripheral_strategy:0 "A War on the Enemy's Communications"
 WW1_WO_ENG_peripheral_strategy_desc:0 "The enemy must be made to defend the sea approaches as well as the main front. Staffs will prepare limited operations against its communications, accepting the additional demand on stores and shipping."
 WW1_WO_ENG_prepare_convention:0 "Prepare: A Common Purchasing Board"
 WW1_WO_ENG_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_ENG_savings:0 "A National Savings Campaign"
 WW1_WO_ENG_savings_desc:0 "The cost of the war must be met without exhausting the workshops on which the army depends. Voluntary subscriptions and careful purchasing will spread the burden, though economies will slow the introduction of new production methods."
 WW1_WO_ENG_service_economies:0 "Review the Service Contracts"
 WW1_WO_ENG_service_economies_desc:0 "Large orders placed in haste have produced competing demands upon the same factories. The departments will compare their contracts and release stores which can be used more effectively elsewhere."
 WW1_WO_ENG_service_economies_research:0 "Review the Service Contracts Research"
 WW1_WO_ENG_shipping_rules:0 "Protect the Merchant Convoys"
 WW1_WO_ENG_shipping_rules_desc:0 "Merchant shipping is a national resource which cannot be replaced without cost. Escort schedules will take precedence over operations against enemy commerce."
 WW1_WO_ENG_war_council:0 "The Cabinet and the War"
 WW1_WO_ENG_war_council_desc:0 "The cabinet must choose between competing commitments on land, at sea and beyond Europe. Its decisions will give the services a common account of the purposes they are expected to serve."
 WW1_WO_ENG_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_ENG_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_ENG_western_concentration:0 "Concentrate the Expeditionary Effort"
 WW1_WO_ENG_western_concentration_desc:0 "The army cannot be strong at every landing place and on every frontier. Its reserves and transport will be concentrated for the principal continental campaign, while secondary projects wait."
 WW1_WO_FRA_accounts_of_the_devastated_regions:0 "Accounts of the Devastated Regions"
 WW1_WO_FRA_accounts_of_the_devastated_regions_desc:0 "The claims of northern towns must be measured against the work that can actually be done. A common register of damaged homes, pits and railway lines will direct the first reconstruction contracts to the places that suffered most."
 WW1_WO_FRA_coal_and_rails:0 "Coal and Rails for Reconstruction"
 WW1_WO_FRA_coal_and_rails_desc:0 "Money alone cannot replace ruined pits and railway yards. We will place deliveries of coal, rails and industrial machinery at the centre of our reparation demands, leaving ownership of the works to their present proprietors."
 WW1_WO_FRA_coal_and_rails_preparations_research:0 "Coal and Rails for Reconstruction"
 WW1_WO_FRA_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_FRA_convention_research:0 "The French Settlement Note Research"
 WW1_WO_FRA_frontier_guarantors:0 "Guarantors of the Frontier"
 WW1_WO_FRA_frontier_guarantors_desc:0 "A restored frontier will be safer if its observance concerns more than France alone. We will submit the accepted convention to friendly governments and establish the liaison needed to report a breach before it becomes another invasion."
 WW1_WO_FRA_frontier_of_1871:0 "The Frontier of 1871"
 WW1_WO_FRA_frontier_of_1871_desc:0 "The return of Alsace-Lorraine would redress the defeat of 1871 without committing France to an endless occupation beyond it. Our negotiators will concentrate on restoration and an enforceable guarantee of the frontier."
 WW1_WO_FRA_indemnity_schedule:0 "A Schedule of Indemnities"
 WW1_WO_FRA_indemnity_schedule_desc:0 "The devastated departments will need funds long after the armies leave. A defined schedule of payments would put the cost before the German government without tying French recovery to the administration of German mines."
 WW1_WO_FRA_indemnity_schedule_preparations_research:0 "A Schedule of Indemnities"
 WW1_WO_FRA_military_rail_programme:0 "Shells before Stations Research"
 WW1_WO_FRA_note_to_berlin:0 "A French Note to Berlin"
 WW1_WO_FRA_note_to_berlin_desc:0 "France will set out the frontier guarantees and reparations it is prepared to defend. Berlin must be given a definite statement to accept, amend or refuse; no settlement can rest on an unanswered memorandum."
 WW1_WO_FRA_prepare_convention:0 "Prepare: The French Settlement Note"
 WW1_WO_FRA_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_FRA_relief_rail_programme:0 "Trains for the Displaced Research"
 WW1_WO_FRA_retain_rhenish_demands:0 "Stand by the Rhenish Demands"
 WW1_WO_FRA_retain_rhenish_demands_desc:0 "The German offer does not provide the security our delegation was sent to obtain. We will retain our original demands for a future conference, accepting that this exchange has produced no agreement."
 WW1_WO_FRA_rhenish_barrier:0 "A Barrier on the Rhine"
 WW1_WO_FRA_rhenish_barrier_desc:0 "The recovery of the lost provinces may leave France exposed to another invasion. We will seek restrictions on German forces west of the Rhine and reserve the question of a temporary occupation for the peace conference."
 WW1_WO_FRA_rhenish_inspection_staff:0 "A Rhenish Inspection Staff"
 WW1_WO_FRA_rhenish_inspection_staff_desc:0 "If Germany accepts restrictions on its western forces, their observance must be verified. A small international staff will inspect agreed sites and report violations; it will have no authority to redraw the frontier."
 WW1_WO_FRA_saar_commercial_offer:0 "The Saar Commercial Offer"
 WW1_WO_FRA_saar_commercial_offer_desc:0 "Berlin proposes commercial deliveries and inspection of the Saar accounts in place of a wider French security regime. Accepting the offer would put reconstruction before a prolonged occupation, while leaving sovereignty unchanged."
 WW1_WO_FRA_shells_before_stations:0 "Shells before Stations"
 WW1_WO_FRA_shells_before_stations_desc:0 "Every wagon carrying shells is a wagon that cannot return a displaced family to its town. The army will receive priority on the northern railways for the next campaign, despite the strain this places on the recovering departments."
 WW1_WO_FRA_trains_for_the_displaced:0 "Trains for the Displaced"
 WW1_WO_FRA_trains_for_the_displaced_desc:0 "The inhabitants of the invaded districts cannot wait indefinitely for military traffic to subside. Civilian trains, repair crews and relief depots will receive a protected share of the railway programme."
 WW1_WO_FRA_war_council:0 "The Republic and the Peace"
 WW1_WO_FRA_war_council_desc:0 "The government must weigh the country's demands against the means available to uphold them. The ministers will bring the military, financial and diplomatic questions before a common council."
 WW1_WO_FRA_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_FRA_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_GEN_albanian_independence_civil_commission:0 "An Albanian Administrative Commission"
 WW1_WO_GEN_albanian_independence_civil_commission_desc:0 "Independence requires offices able to carry out the decisions of the government beyond the military headquarters. The civil departments will prepare accounts and transport arrangements for the districts they administer."
 WW1_WO_GEN_albanian_independence_civil_commission_research:0 "An Albanian Administrative Commission Research"
 WW1_WO_GEN_albanian_independence_mountain_supply:0 "Supply the Mountain Districts"
 WW1_WO_GEN_albanian_independence_mountain_supply_desc:0 "The defence of the mountain districts requires a dependable movement of modest quantities of stores. The commands will agree routes and reserve depots before another campaign begins."
 WW1_WO_GEN_albanian_independence_mountain_supply_research:0 "Supply the Mountain Districts Research"
 WW1_WO_GEN_belgian_restoration_field_supplies:0 "Keep the Field Army Supplied"
 WW1_WO_GEN_belgian_restoration_field_supplies_desc:0 "The field army must remain capable of serving while civil administration is restored behind it. Replacement stores and transport schedules will receive the attention of a common staff."
 WW1_WO_GEN_belgian_restoration_field_supplies_research:0 "Keep the Field Army Supplied Research"
 WW1_WO_GEN_belgian_restoration_refugee_return:0 "The Refugee Return Commission"
 WW1_WO_GEN_belgian_restoration_refugee_return_desc:0 "The restoration of the country requires preparation for the return of displaced families. Civil departments will assemble the transport and supply estimates needed to reopen ordinary life."
 WW1_WO_GEN_belgian_restoration_refugee_return_research:0 "The Refugee Return Commission Research"
 WW1_WO_GEN_bulgarian_revision_claims_commission:0 "The Macedonian Claims Commission"
 WW1_WO_GEN_bulgarian_revision_claims_commission_desc:0 "The claims advanced by the government must distinguish districts actually disputed with the enemy from wider ambitions. A commission will prepare the maps and records which a settlement requires."
 WW1_WO_GEN_bulgarian_revision_claims_commission_research:0 "The Macedonian Claims Commission Research"
 WW1_WO_GEN_bulgarian_revision_mountain_supply:0 "Supply the Mountain Frontier"
 WW1_WO_GEN_bulgarian_revision_mountain_supply_desc:0 "The frontier formations must be sustained over roads which can carry only limited traffic. Their transport requirements will be coordinated before a further advance is attempted."
 WW1_WO_GEN_bulgarian_revision_mountain_supply_research:0 "Supply the Mountain Frontier Research"
 WW1_WO_GEN_chinese_shandong_northern_trade:0 "Reopen the Northern Trade Routes"
 WW1_WO_GEN_chinese_shandong_northern_trade_desc:0 "The fighting has disrupted the movement of goods through the northern ports. The departments will prepare arrangements for restoring that traffic wherever Chinese administration has been re-established."
 WW1_WO_GEN_chinese_shandong_northern_trade_research:0 "Reopen the Northern Trade Routes Research"
 WW1_WO_GEN_chinese_shandong_shandong_dossier:0 "The Shandong Conference Dossier"
 WW1_WO_GEN_chinese_shandong_shandong_dossier_desc:0 "The future of the leased port must be discussed on the basis of Chinese sovereignty and the rights actually exercised there. Our representatives will assemble their case without promising concessions elsewhere."
 WW1_WO_GEN_chinese_shandong_shandong_dossier_research:0 "The Shandong Conference Dossier Research"
 WW1_WO_GEN_credits:0 "Emergency War Credits"
 WW1_WO_GEN_credits_desc:0 "The military authorities cannot wait for ordinary estimates to be approved. Emergency contracts will increase immediate output, at the price of a heavier claim on civilian goods."
 WW1_WO_GEN_decisive_campaign:0 "Seek a Decisive Campaign"
 WW1_WO_GEN_decisive_campaign_desc:0 "A prolonged struggle may impose a greater burden than a concentrated effort. The military authorities will prepare for a decisive campaign, accepting the additional demand upon supplies."
 WW1_WO_GEN_defensive_mandate:0 "A War for National Security"
 WW1_WO_GEN_defensive_mandate_desc:0 "The government will define the defence of the country as the purpose of its military effort. The staff will prepare operations which can be sustained without committing the army to every possible objective."
 WW1_WO_GEN_dervish_resistance_political_delegation:0 "Prepare the Political Delegation"
 WW1_WO_GEN_dervish_resistance_political_delegation_desc:0 "The claims of the resistance must be stated consistently wherever they are heard abroad. A delegation will assemble its case without assuming that a foreign government has already accepted it."
 WW1_WO_GEN_dervish_resistance_political_delegation_research:0 "Prepare the Political Delegation Research"
 WW1_WO_GEN_dervish_resistance_resistance_routes:0 "Keep the Resistance Supplied"
 WW1_WO_GEN_dervish_resistance_resistance_routes_desc:0 "The survival of the resistance depends upon the regular movement of arms and stores. The commands will coordinate the routes upon which their next campaign depends."
 WW1_WO_GEN_dervish_resistance_resistance_routes_research:0 "Keep the Resistance Supplied Research"
 WW1_WO_GEN_greek_frontiers_aegean_patrols:0 "Coordinate the Aegean Patrols"
 WW1_WO_GEN_greek_frontiers_aegean_patrols_desc:0 "Scattered islands and narrow sea approaches demand regular naval reports. The service will coordinate its patrol schedules without extending the political objects of the war."
 WW1_WO_GEN_greek_frontiers_aegean_patrols_research:0 "Coordinate the Aegean Patrols Research"
 WW1_WO_GEN_greek_frontiers_island_commission:0 "The Island Administration Commission"
 WW1_WO_GEN_greek_frontiers_island_commission_desc:0 "The government must prepare a civil administration for any islands restored by the settlement. Harbour accounts and transport requirements will be examined before new obligations are assumed."
 WW1_WO_GEN_greek_frontiers_island_commission_research:0 "The Island Administration Commission Research"
 WW1_WO_GEN_mexican_republic_civil_offices:0 "A Civil Administration behind the Front"
 WW1_WO_GEN_mexican_republic_civil_offices_desc:0 "The survival of a government depends upon more than the success of its armies. Civil offices will account for stores and prepare the return of ordinary administration behind the front."
 WW1_WO_GEN_mexican_republic_civil_offices_research:0 "A Civil Administration behind the Front Research"
 WW1_WO_GEN_mexican_republic_supply_routes:0 "Restore the Revolutionary Supply Routes"
 WW1_WO_GEN_mexican_republic_supply_routes_desc:0 "The struggle has left stores divided among commands and transport badly disrupted. The authorities will coordinate deliveries without changing the political settlement adopted by the movement."
 WW1_WO_GEN_mexican_republic_supply_routes_research:0 "Restore the Revolutionary Supply Routes Research"
 WW1_WO_GEN_national_settlement_national_dossier:0 "The National Conference Dossier"
 WW1_WO_GEN_national_settlement_national_dossier_desc:0 "A settlement will require reliable records of the country's claims and obligations. The departments will prepare those records before delegates are asked to negotiate abroad."
 WW1_WO_GEN_national_settlement_national_dossier_research:0 "The National Conference Dossier Research"
 WW1_WO_GEN_national_settlement_national_supply:0 "Coordinate the National Supply Routes"
 WW1_WO_GEN_national_settlement_national_supply_desc:0 "The army must be sustained by routes which remain under the government's authority. The military and civil departments will prepare a common account of those requirements."
 WW1_WO_GEN_national_settlement_national_supply_research:0 "Coordinate the National Supply Routes Research"
 WW1_WO_GEN_overseas_service_contribution_records:0 "Record the Dominion Contribution"
 WW1_WO_GEN_overseas_service_contribution_records_desc:0 "The country must have a clear account of the obligations undertaken on its behalf. The departments will prepare those records for discussion with their partners when the campaign is over."
 WW1_WO_GEN_overseas_service_contribution_records_research:0 "Record the Dominion Contribution Research"
 WW1_WO_GEN_overseas_service_expeditionary_transport:0 "The Expeditionary Transport Office"
 WW1_WO_GEN_overseas_service_expeditionary_transport_desc:0 "Service overseas requires a dependable connection between the home ports and the forces abroad. A common office will coordinate replacement stores and the shipping which carries them."
 WW1_WO_GEN_overseas_service_expeditionary_transport_research:0 "The Expeditionary Transport Office Research"
 WW1_WO_GEN_persian_sovereignty_occupation_records:0 "Document the Foreign Occupations"
 WW1_WO_GEN_persian_sovereignty_occupation_records_desc:0 "The government must be able to state where foreign forces have displaced its authority. The departments will assemble records for a settlement without recognising occupation as a permanent title."
 WW1_WO_GEN_persian_sovereignty_occupation_records_research:0 "Document the Foreign Occupations Research"
 WW1_WO_GEN_persian_sovereignty_provincial_supply:0 "Maintain the Provincial Supply Routes"
 WW1_WO_GEN_persian_sovereignty_provincial_supply_desc:0 "The provinces cannot be defended through orders which ignore the distances between them. Their supply requirements will be coordinated before further formations are committed."
 WW1_WO_GEN_persian_sovereignty_provincial_supply_research:0 "Maintain the Provincial Supply Routes Research"
 WW1_WO_GEN_portuguese_overseas_colonial_supply:0 "A Common Colonial Supply Office"
 WW1_WO_GEN_portuguese_overseas_colonial_supply_desc:0 "Distant garrisons cannot be supplied through competing orders placed without a common record. The departments will coordinate the cargoes needed to keep their stations in service."
 WW1_WO_GEN_portuguese_overseas_colonial_supply_research:0 "A Common Colonial Supply Office Research"
 WW1_WO_GEN_portuguese_overseas_overseas_dossier:0 "The Overseas Claims Dossier"
 WW1_WO_GEN_portuguese_overseas_overseas_dossier_desc:0 "The government must distinguish the defence of its existing possessions from demands which would create new obligations. Our delegates will prepare a record of the claims to be discussed after the war."
 WW1_WO_GEN_portuguese_overseas_overseas_dossier_research:0 "The Overseas Claims Dossier Research"
 WW1_WO_GEN_romanian_union_carpathian_dossier:0 "The Carpathian Conference Dossier"
 WW1_WO_GEN_romanian_union_carpathian_dossier_desc:0 "The future of the Romanian communities beyond the frontier must be supported by more than a declaration. Our delegates will prepare the administrative and transport records needed for a settlement."
 WW1_WO_GEN_romanian_union_carpathian_dossier_research:0 "The Carpathian Conference Dossier Research"
 WW1_WO_GEN_romanian_union_western_railways:0 "A Programme for the Western Railways"
 WW1_WO_GEN_romanian_union_western_railways_desc:0 "The movement of stores beyond the Carpathians will require a common railway programme. Engineers and transport officers will prepare their schedules for districts actually under our administration."
 WW1_WO_GEN_romanian_union_western_railways_research:0 "A Programme for the Western Railways Research"
 WW1_WO_GEN_savings:0 "A National Savings Campaign"
 WW1_WO_GEN_savings_desc:0 "The cost of the war must be met without exhausting the workshops on which the army depends. Voluntary subscriptions and careful purchasing will spread the burden, though economies will slow the introduction of new production methods."
 WW1_WO_GEN_serbian_unity_rehabilitation:0 "A Serbian Rehabilitation Office"
 WW1_WO_GEN_serbian_unity_rehabilitation_desc:0 "The departments must prepare for the return of government to the districts restored after the fighting. Railway records and supply estimates will be assembled before the army stands down."
 WW1_WO_GEN_serbian_unity_rehabilitation_research:0 "A Serbian Rehabilitation Office Research"
 WW1_WO_GEN_serbian_unity_slav_dossier:0 "A Common South Slav Dossier"
 WW1_WO_GEN_serbian_unity_slav_dossier_desc:0 "The future of neighbouring South Slav communities cannot be settled by a military proclamation. Our delegates will assemble their case for a conference while leaving friendly governments free to answer."
 WW1_WO_GEN_serbian_unity_slav_dossier_research:0 "A Common South Slav Dossier Research"
 WW1_WO_GEN_war_council:0 "The National War Council"
 WW1_WO_GEN_war_council_desc:0 "The government will bring together the questions of military effort, national objectives and the terms of a future settlement. The council must decide which commitments the country is able to sustain."
 WW1_WO_GEN_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_GEN_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_GER_antwerp_commercial_access:0 "Commercial Access to Antwerp"
 WW1_WO_GER_antwerp_commercial_access_desc:0 "Belgian prosperity may serve Germany better than an unpayable bill. We will seek equal commercial access and agreed freight arrangements at Antwerp in exchange for foregoing a punitive indemnity. Unless the Meuse programme has already been adopted, our delegation will seek a limited settlement with Belgium."
 WW1_WO_GER_antwerp_commercial_access_preparations_research:0 "Commercial Access to Antwerp"
 WW1_WO_GER_brussels_convention:0 "A Convention for Brussels"
 WW1_WO_GER_brussels_convention_desc:0 "We will place our proposals before the Belgian government as a convention rather than a decree. Independence, security and commerce must be stated plainly if Brussels is to give a reply that can endure beyond the war."
 WW1_WO_GER_civilian_conversion:0 "Release the Civilian Orders Research"
 WW1_WO_GER_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_GER_contracts_for_the_last_campaign:0 "Contracts for the Last Campaign"
 WW1_WO_GER_contracts_for_the_last_campaign_desc:0 "The war industries argue that one more concentrated effort will strengthen Germany's hand at the conference. Priority contracts will keep military orders ahead of civilian conversion, at the cost of further strain in the towns."
 WW1_WO_GER_convention_research:0 "The Brussels Convention Research"
 WW1_WO_GER_convert_the_war_contracts:0 "Convert the War Contracts"
 WW1_WO_GER_convert_the_war_contracts_desc:0 "The factories built to sustain the front cannot all continue on military orders. A negotiated schedule of conversion will retain skilled workers and reopen civilian production without pretending that the war debt has disappeared."
 WW1_WO_GER_final_contracts:0 "Contracts for the Last Campaign Research"
 WW1_WO_GER_indemnities_and_debt:0 "Indemnities and the War Debt"
 WW1_WO_GER_indemnities_and_debt_desc:0 "The treasury expects a victorious settlement to meet part of the cost of the war. We will ask for a fixed and limited indemnity, accepting the risk that an exhausted neighbor may be unable to pay it promptly. Unless the Meuse programme has already been adopted, our delegation will seek a limited settlement with Belgium."
 WW1_WO_GER_indemnities_and_debt_preparations_research:0 "Indemnities and the War Debt"
 WW1_WO_GER_limited_settlement_tt:0 "Adopts limited terms for a settlement with Belgium. The Meuse Security System will no longer be available."
 WW1_WO_GER_low_countries_charter:0 "A Low Countries Commercial Charter"
 WW1_WO_GER_low_countries_charter_desc:0 "An accepted agreement with Belgium can become a practical framework for ports, freight and trade. The charter will rest on independent governments and reciprocal undertakings, with no new military alliance."
 WW1_WO_GER_meuse_inspection_mission:0 "The Meuse Inspection Mission"
 WW1_WO_GER_meuse_inspection_mission_desc:0 "Belgium has accepted the proposed security convention. Its application will be confined to the sites and duties named in the agreement; the mission is not a title to Belgian territory."
 WW1_WO_GER_meuse_security_system:0 "A Meuse Security System"
 WW1_WO_GER_meuse_security_system_desc:0 "Belgium commands approaches on which the western armies depend. Our delegation will demand a convention governing fortifications and military transit, while leaving the question of Belgian consent to the negotiation itself."
 WW1_WO_GER_neutral_transit_counteroffer:0 "Accept a Neutral Transit Convention"
 WW1_WO_GER_neutral_transit_counteroffer_desc:0 "Brussels will discuss commercial passage and reciprocal inspections, but refuses a German military privilege. We can obtain a useful agreement by accepting that distinction and leaving Belgian defenses under Belgian authority."
 WW1_WO_GER_port_convention:0 "A Low Countries Commercial Charter Research"
 WW1_WO_GER_prepare_convention:0 "Prepare: The Brussels Convention"
 WW1_WO_GER_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_GER_release_the_civilian_orders:0 "Release the Civilian Orders"
 WW1_WO_GER_release_the_civilian_orders_desc:0 "Merchants and workers require evidence that peace will restore ordinary production. We will reserve part of the industrial order book for civilian goods rather than promise every remaining machine to the army."
 WW1_WO_GER_retain_meuse_conditions:0 "Retain the Meuse Conditions"
 WW1_WO_GER_retain_meuse_conditions_desc:0 "Commercial concessions do not answer the army's objections to an unsecured western approach. We will decline the Belgian revision and reserve our demands for the general settlement, gaining no convention from the present exchange."
 WW1_WO_GER_war_council:0 "The Aims of the Reich"
 WW1_WO_GER_war_council_desc:0 "The government must decide what it seeks from the struggle and what obligations a settlement will impose. The ministries and the army will submit their proposals to a common conference."
 WW1_WO_GER_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_GER_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_ITA_adriatic_commercial_council:0 "An Adriatic Commercial Council"
 WW1_WO_ITA_adriatic_commercial_council_desc:0 "An accepted convention can give shipowners and port officials a common forum for disputes. The council will administer agreed commercial duties without placing neighboring states under Italian control."
 WW1_WO_ITA_adriatic_convention:0 "An Adriatic Convention"
 WW1_WO_ITA_adriatic_convention_desc:0 "Rome will put its proposed arrangements for navigation, ports and frontier safeguards before Vienna. The exchange will concern only matters the participating governments can lawfully undertake, leaving third-party territory outside the bargain."
 WW1_WO_ITA_adriatic_customs_receipts:0 "Adriatic Customs Receipts"
 WW1_WO_ITA_adriatic_customs_receipts_desc:0 "Commercial agreements can provide resources for the ports without placing the whole burden on Italian taxpayers. We will seek a defined share in the receipts of agreed services, with foreign participation requiring the port authority's consent."
 WW1_WO_ITA_adriatic_customs_receipts_preparations_research:0 "Adriatic Customs Receipts"
 WW1_WO_ITA_adriatic_nationalities:0 "The Peoples of the Adriatic"
 WW1_WO_ITA_adriatic_nationalities_desc:0 "Italy can seek the security of its coast without claiming every shore across the sea. We will distinguish the recovery of Italian communities from the rights of the neighboring peoples and pursue a settlement that both can defend."
 WW1_WO_ITA_civic_life_in_the_redeemed_cities:0 "Civic Life in the Redeemed Cities"
 WW1_WO_ITA_civic_life_in_the_redeemed_cities_desc:0 "A city brought within Italy must retain more than a working harbor. Schools, local records and municipal institutions will be restored in the towns actually entrusted to Italian administration, with the rights of their inhabitants respected."
 WW1_WO_ITA_civilian_quays:0 "Harbors and Returning Families Research"
 WW1_WO_ITA_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_ITA_convention_research:0 "The Adriatic Convention Research"
 WW1_WO_ITA_full_london_programme:0 "The Full London Programme"
 WW1_WO_ITA_full_london_programme_desc:0 "The sacrifices of the war have made the promises given to Italy a matter of national honor. Our delegation will maintain the agreed territorial programme, while leaving each award to the peace conference and the parties concerned."
 WW1_WO_ITA_guns_for_the_karst:0 "Guns for the Karst"
 WW1_WO_ITA_guns_for_the_karst_desc:0 "The positions above the Adriatic demand guns, ammunition and the roads to carry them. The army will receive the stores earmarked for the coming campaign, even where this delays work in the coastal towns."
 WW1_WO_ITA_harbors_and_returning_families:0 "Harbors and Returning Families"
 WW1_WO_ITA_harbors_and_returning_families_desc:0 "The coastal towns must be able to receive food, trade and the families displaced by fighting. Civilian quay repairs and municipal services will take priority over further military preparations."
 WW1_WO_ITA_italian_reconstruction_levy:0 "An Italian Reconstruction Levy"
 WW1_WO_ITA_italian_reconstruction_levy_desc:0 "Foreign receipts may prove uncertain and costly to bargain for. Italy will meet the first costs of its frontier programme at home, retaining fiscal independence while asking the country to bear a heavier immediate burden."
 WW1_WO_ITA_karst_stores:0 "Guns for the Karst Research"
 WW1_WO_ITA_port_services:0 "An Adriatic Commercial Council Research"
 WW1_WO_ITA_prepare_convention:0 "Prepare: The Adriatic Convention"
 WW1_WO_ITA_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_ITA_register_the_london_reservations:0 "Register the London Reservations"
 WW1_WO_ITA_register_the_london_reservations_desc:0 "Italy will place its remaining treaty reservations on record while applying the commercial clauses that Vienna has accepted. A register preserves the distinction between an agreed service and a territorial demand still awaiting settlement."
 WW1_WO_ITA_reserve_the_adriatic_claims:0 "Reserve the Adriatic Claims"
 WW1_WO_ITA_reserve_the_adriatic_claims_desc:0 "The proposed port arrangement does not meet the terms entrusted to our delegation. We will decline it and reserve our claims for the general conference, accepting that no special convention has been obtained."
 WW1_WO_ITA_trieste_port_compromise:0 "The Trieste Port Compromise"
 WW1_WO_ITA_trieste_port_compromise_desc:0 "Vienna proposes commercial access and equal treatment in the port in place of the wider privileges Italy sought. Accepting would give Italian shipping a practical settlement while leaving the territorial question to the lawful peace arrangements."
 WW1_WO_ITA_war_council:0 "Italy and the European Settlement"
 WW1_WO_ITA_war_council_desc:0 "National ambitions, the needs of the army and the resources of the country cannot be considered separately. The government will examine the possible settlements before committing to further demands."
 WW1_WO_ITA_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_ITA_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_JAP_commercial_assurances:0 "Assurances for Chinese Commerce"
 WW1_WO_JAP_commercial_assurances_desc:0 "Our campaign must not leave Chinese merchants uncertain about the rules governing their trade. We will propose written assurances to the government responsible for the northern ports and await its answer."
 WW1_WO_JAP_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_JAP_continental_commitment:0 "A Continental Commitment"
 WW1_WO_JAP_continental_commitment_desc:0 "Our position in East Asia cannot be secured by naval operations alone. The cabinet will prepare for a sustained continental commitment, while leaving existing treaties and the independence of friendly governments intact."
 WW1_WO_JAP_credits:0 "Emergency War Credits"
 WW1_WO_JAP_credits_desc:0 "The military authorities cannot wait for ordinary estimates to be approved. Emergency contracts will increase immediate output, at the price of a heavier claim on civilian goods."
 WW1_WO_JAP_cruiser_pressure:0 "Pressure the Enemy's Shipping"
 WW1_WO_JAP_cruiser_pressure_desc:0 "Enemy commerce offers the fleet an opportunity to influence a distant war. Cruiser operations will receive priority, with fewer resources available for escorting our own traffic."
 WW1_WO_JAP_escort_priority:0 "Escort the Overseas Traffic"
 WW1_WO_JAP_escort_priority_desc:0 "The stations and armies overseas cannot be sustained without regular merchant traffic. The fleet will give priority to escorts and the movement of replacement stores."
 WW1_WO_JAP_frontier_records:0 "Record the Continental Commitments"
 WW1_WO_JAP_frontier_records_desc:0 "Every undertaking on the continent creates a claim upon ships, railways and military stores. The cabinet will review those commitments before approving further operations."
 WW1_WO_JAP_frontier_records_research:0 "Record the Continental Commitments Research"
 WW1_WO_JAP_island_administration:0 "A Civil Administration for the Stations"
 WW1_WO_JAP_island_administration_desc:0 "Naval occupation must be followed by a dependable civil administration. Harbour offices and supply records will be organised in the stations actually held by Japan."
 WW1_WO_JAP_island_administration_research:0 "A Civil Administration for the Stations Research"
 WW1_WO_JAP_landing_schedule:0 "Coordinate the Continental Landing"
 WW1_WO_JAP_landing_schedule_desc:0 "The army and navy must agree how stores are to reach the troops ashore. A common landing schedule will reduce competing demands, while accepting the expense of a more ambitious campaign."
 WW1_WO_JAP_naval_mandate:0 "A Limited Naval Mandate"
 WW1_WO_JAP_naval_mandate_desc:0 "Japan can protect its position without assuming every obligation proposed on the continent. The government will define a limited purpose for the fleet and resist commitments which require a large continental army."
 WW1_WO_JAP_postwar_accounts:0 "Settle the Overseas Accounts"
 WW1_WO_JAP_postwar_accounts_desc:0 "The end of the campaign leaves transport bills and stores scattered among distant stations. The civil departments will settle those accounts before the armed services undertake new commitments."
 WW1_WO_JAP_prepare_convention:0 "Prepare: Assurances for Chinese Commerce"
 WW1_WO_JAP_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_JAP_savings:0 "A National Savings Campaign"
 WW1_WO_JAP_savings_desc:0 "The cost of the war must be met without exhausting the workshops on which the army depends. Voluntary subscriptions and careful purchasing will spread the burden, though economies will slow the introduction of new production methods."
 WW1_WO_JAP_war_council:0 "Japan and the New Balance"
 WW1_WO_JAP_war_council_desc:0 "The European conflict has altered the balance in Asia and the Pacific. The government must decide which opportunities to pursue and which obligations to accept."
 WW1_WO_JAP_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_JAP_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_JAP_yard_contracts:0 "Review the Naval Contracts"
 WW1_WO_JAP_yard_contracts_desc:0 "The yards must repair existing ships while meeting demands for new construction. A review of orders will reduce conflicting schedules and preserve work already begun."
 WW1_WO_JAP_yard_contracts_research:0 "Review the Naval Contracts Research"
 WW1_WO_RIE_allied_shipping_credit:0 "Allied Shipping Credit"
 WW1_WO_RIE_allied_shipping_credit_desc:0 "Allied shipping and purchases may reopen the Black Sea economy sooner than domestic resources alone. We will seek an agreed credit for transport and supplies, accepting that its terms will have to be settled with the lenders."
 WW1_WO_RIE_allied_straits_consultations:0 "Allied Consultations on the Straits"
 WW1_WO_RIE_allied_straits_consultations_desc:0 "The Allies must distinguish the convention the Porte has accepted from territorial promises still awaiting a peace settlement. Our delegation will seek confirmation of those remaining obligations without treating an allied note as a deed to Constantinople."
 WW1_WO_RIE_black_sea_navigation_board:0 "A Black Sea Navigation Board"
 WW1_WO_RIE_black_sea_navigation_board_desc:0 "An accepted convention will need regular charts, notices and a forum for complaints. Russian and Ottoman representatives will supervise the duties each has undertaken, preserving passage without placing either state's ports under foreign rule."
 WW1_WO_RIE_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_RIE_constantinople_programme:0 "The Constantinople Programme"
 WW1_WO_RIE_constantinople_programme_desc:0 "The government will maintain the territorial programme discussed with the Allies in 1915. Its fulfillment remains dependent on their assent, the outcome of the war and a lawful settlement with the present holder of the Straits."
 WW1_WO_RIE_convention_research:0 "The Straits Convention Research"
 WW1_WO_RIE_duma_credit_for_recovery:0 "Duma Credit for Recovery"
 WW1_WO_RIE_duma_credit_for_recovery_desc:0 "A lasting settlement will need resources as well as claims. The government will place the cost of frontier recovery before the Duma, seeking an accountable credit that does not mortgage the administration of the western provinces."
 WW1_WO_RIE_international_straits_convention:0 "An International Straits Convention"
 WW1_WO_RIE_international_straits_convention_desc:0 "Russia's grain trade and Black Sea ports require reliable passage to the Mediterranean. An international convention could secure that passage without demanding sovereignty over the Ottoman capital."
 WW1_WO_RIE_navigation_staff:0 "Allied Consultations on the Straits Research"
 WW1_WO_RIE_note_to_the_porte:0 "A Note to the Porte"
 WW1_WO_RIE_note_to_the_porte_desc:0 "Russia will lay its proposed navigation and security convention before the Ottoman government. Territorial demands will remain questions for a lawful peace; the present exchange must establish what practical terms the Porte is prepared to accept."
 WW1_WO_RIE_ottoman_navigation_offer:0 "The Ottoman Navigation Offer"
 WW1_WO_RIE_ottoman_navigation_offer_desc:0 "The Porte will guarantee commercial passage and discuss reciprocal inspections, but will not surrender the capital. Russia can secure a useful result by accepting this limited convention and leaving sovereignty untouched."
 WW1_WO_RIE_prepare_convention:0 "Prepare: The Straits Convention"
 WW1_WO_RIE_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_RIE_relief_transport:0 "Zemgor Relief Corridors Research"
 WW1_WO_RIE_retain_the_straits_claim:0 "Retain Our Original Terms"
 WW1_WO_RIE_retain_the_straits_claim_desc:0 "The proposed timetable and guarantees do not meet the programme submitted by our delegation. We will decline the Ottoman revision and retain our original terms for the peace conference, gaining no navigation convention from this exchange."
 WW1_WO_RIE_stavka_railway:0 "Stavka Railway Priority Research"
 WW1_WO_RIE_stavka_railway_priority:0 "Stavka Railway Priority"
 WW1_WO_RIE_stavka_railway_priority_desc:0 "The front commands demand a firm share of the railway network for ammunition, replacements and the next offensive. Those movements will take precedence even where provincial relief organizations ask for the same trains."
 WW1_WO_RIE_war_council:0 "The Imperial Conference"
 WW1_WO_RIE_war_council_desc:0 "The future of the frontiers, the passages to the sea and the government's promises to its partners must be considered together. Ministers will set out the alternatives before the next round of negotiations."
 WW1_WO_RIE_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_RIE_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_RIE_western_provincial_recovery:0 "Western Provincial Recovery"
 WW1_WO_RIE_western_provincial_recovery_desc:0 "The western provinces require reopened courts, local records and working railway offices. The administration will rebuild these services where Russian authority has actually returned, without revoking the constitutional or national agreements already made."
 WW1_WO_RIE_zemgor_relief_corridors:0 "Zemgor Relief Corridors"
 WW1_WO_RIE_zemgor_relief_corridors_desc:0 "Hospitals and displaced families cannot live by the army's timetable alone. Zemgor will receive protected routes for medical stores and relief, requiring the commands to accommodate civilian needs in their railway plans."
 WW1_WO_SOV_civilian_railways:0 "Return the Railways to Civilian Traffic"
 WW1_WO_SOV_civilian_railways_desc:0 "The end of organised resistance makes it possible to restore ordinary traffic behind the fronts. The railway authorities will give civilian distribution a place beside the remaining military requirements."
 WW1_WO_SOV_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_SOV_front_priority:0 "Priority for the Front Depots"
 WW1_WO_SOV_front_priority_desc:0 "The military authorities will concentrate the available contracts upon the stores needed at the fronts. Immediate output will improve, while civilian demand must wait."
 WW1_WO_SOV_mobile_columns:0 "Dispatch the Mobile Columns"
 WW1_WO_SOV_mobile_columns_desc:0 "Separated enemy commands may be defeated before they can combine. The fronts will prepare mobile operations, accepting the greater demand for transport and replacement stores."
 WW1_WO_SOV_neutral_supplies:0 "Seek Neutral Medical Supplies"
 WW1_WO_SOV_neutral_supplies_desc:0 "Medical stores and railway spares are needed whatever the course of the fighting. A neutral commercial mission will be invited to discuss deliveries without any undertaking concerning Russia's internal government."
 WW1_WO_SOV_prepare_convention:0 "Prepare: A Neutral Commercial Mission"
 WW1_WO_SOV_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_SOV_procurement_receipts:0 "Issue Receipts for Military Purchases"
 WW1_WO_SOV_procurement_receipts_desc:0 "The army cannot depend indefinitely upon taking supplies without a record of what has been taken. Local purchasing offices will account for deliveries, though payment and administration will impose a burden upon the government."
 WW1_WO_SOV_railway_concentration:0 "Concentrate upon the Railway Fronts"
 WW1_WO_SOV_railway_concentration_desc:0 "The fronts depend upon a small number of junctions and the trains which connect them. The military authorities will concentrate stores along those routes rather than attempt an advance in every district."
 WW1_WO_SOV_trade_research:0 "Commercial Railway Research"
 WW1_WO_SOV_war_council:0 "The Soviet Military Council"
 WW1_WO_SOV_war_council_desc:0 "The fronts require a common programme, but the demands of the army must be weighed against the survival of the districts that sustain it. The council will decide how the struggle is to be continued."
 WW1_WO_SOV_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_SOV_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_TUR_anatolian_shield:0 "Hold the Anatolian Approaches"
 WW1_WO_TUR_anatolian_shield_desc:0 "The mountains and the long roads behind them favour a deliberate defence. Supplies and engineering work will be concentrated on keeping the approaches to Anatolia in Ottoman hands."
 WW1_WO_TUR_canal_expedition:0 "Concentrate for the Canal Campaign"
 WW1_WO_TUR_canal_expedition_desc:0 "An advance towards the canal must be prepared as a deliberate undertaking. Water, transport and engineering stores will receive priority, at the expense of other fronts."
 WW1_WO_TUR_caucasian_dossier:0 "Prepare the Caucasian Frontier Dossier"
 WW1_WO_TUR_caucasian_dossier_desc:0 "Our representatives must distinguish the districts claimed on the Caucasian frontier from wider ambitions in the region. Maps and administrative records will support the position taken at any eventual conference."
 WW1_WO_TUR_caucasian_dossier_research:0 "Prepare the Caucasian Frontier Dossier Research"
 WW1_WO_TUR_civilian_supply:0 "Return the Depots to Civilian Use"
 WW1_WO_TUR_civilian_supply_desc:0 "Peace leaves the provinces in need of transport and ordinary supplies. The stores released by the army will be accounted for and the depots prepared for civilian distribution."
 WW1_WO_TUR_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_TUR_defend_frontiers:0 "Preserve the Remaining Empire"
 WW1_WO_TUR_defend_frontiers_desc:0 "The government must secure the territory it can still administer and supply. The restoration of communications and the defence of the remaining frontiers will take precedence over distant claims."
 WW1_WO_TUR_desert_columns:0 "Water and Transport Columns"
 WW1_WO_TUR_desert_columns_desc:0 "The endurance of the desert columns depends upon the movement of water and stores. The staff will prepare a transport schedule before assigning further troops to the canal approach."
 WW1_WO_TUR_desert_columns_research:0 "Water and Transport Columns Research"
 WW1_WO_TUR_mountain_depots:0 "Supply the Mountain Garrisons"
 WW1_WO_TUR_mountain_depots_desc:0 "The garrisons cannot depend upon roads which are passable only in favourable weather. Reserve stores and transport arrangements will be established before another campaign is attempted."
 WW1_WO_TUR_mountain_depots_research:0 "Supply the Mountain Garrisons Research"
 WW1_WO_TUR_neutral_inspection:0 "Invite a Neutral Shipping Inspection"
 WW1_WO_TUR_neutral_inspection_desc:0 "Neutral carriers will hesitate while the rules governing Ottoman ports remain uncertain. We will invite an inspection of the arrangements for civilian cargoes, provided that a neutral government is willing to send representatives."
 WW1_WO_TUR_paid_commissariat:0 "Pay the Provincial Contractors"
 WW1_WO_TUR_paid_commissariat_desc:0 "The army must obtain supplies without destroying the markets on which the provinces depend. Regular payment will improve confidence in the commissariat, though the Treasury must bear the expense."
 WW1_WO_TUR_prepare_convention:0 "Prepare: An Inspection of Civilian Shipping"
 WW1_WO_TUR_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_TUR_requisition_schedule:0 "An Emergency Requisition Schedule"
 WW1_WO_TUR_requisition_schedule_desc:0 "The front requires stores faster than ordinary purchasing can provide them. The ministries will organise emergency contracts and requisitions, accepting the resentment and civilian shortages which follow."
 WW1_WO_TUR_revise_settlements:0 "Reopen the Lost Provinces Question"
 WW1_WO_TUR_revise_settlements_desc:0 "Past settlements have left grievances on more than one frontier. Our delegation will record the claims which can be pursued against the powers now at war with us, without promising conquests the army cannot sustain."
 WW1_WO_TUR_straits_administration:0 "Administer the Accepted Straits Convention"
 WW1_WO_TUR_straits_administration_desc:0 "A convention can endure only if its provisions are applied consistently. Harbour offices and the naval authorities will establish the notices and procedures required by the agreement already accepted abroad."
 WW1_WO_TUR_war_council:0 "The Imperial War Programme"
 WW1_WO_TUR_war_council_desc:0 "The Empire must choose where to commit its limited resources and what terms it is prepared to defend. The cabinet will weigh the claims of the fronts against the needs of the population."
 WW1_WO_TUR_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_TUR_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_USA_accounts_review:0 "Review the Wartime Accounts"
 WW1_WO_USA_accounts_review_desc:0 "The scale of wartime purchasing requires a common account of contracts and deliveries. The departments will identify duplicate orders and prepare their records for civilian examination."
 WW1_WO_USA_accounts_review_research:0 "Review the Wartime Accounts Research"
 WW1_WO_USA_associated_mandate:0 "Support the Common War Effort"
 WW1_WO_USA_associated_mandate_desc:0 "Cooperation with the other belligerents must be based upon a clear American undertaking. Our departments will coordinate the material effort while preserving national command and the authority of Congress."
 WW1_WO_USA_civilian_release:0 "Release the Civilian Orders"
 WW1_WO_USA_civilian_release_desc:0 "The return to peace will leave factories and carriers with contracts drawn for a different purpose. The government will publish a timetable for releasing those resources to ordinary trade."
 WW1_WO_USA_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_USA_declaration_records:0 "Prepare the Conference Records"
 WW1_WO_USA_declaration_records_desc:0 "The principles advanced by the government must be supported by accurate records. Our delegates will prepare the material needed to discuss the restoration of invaded countries and the resumption of commerce."
 WW1_WO_USA_declaration_records_research:0 "Prepare the Conference Records Research"
 WW1_WO_USA_defined_conditions:0 "State the Conditions of American Service"
 WW1_WO_USA_defined_conditions_desc:0 "The country must understand the conditions attached to service abroad. The departments will publish a common statement of those obligations before seeking further commitments."
 WW1_WO_USA_emergency_contracts:0 "Give Priority to Emergency Contracts"
 WW1_WO_USA_emergency_contracts_desc:0 "The military departments require immediate deliveries on a scale which ordinary purchasing cannot meet. Emergency contracts will raise output, though civilian production must absorb part of the cost."
 WW1_WO_USA_escort_stations:0 "Coordinate the Atlantic Escort Stations"
 WW1_WO_USA_escort_stations_desc:0 "The passage across the Atlantic requires regular reports from the ports and escort stations. The navy will organise that traffic without extending the political undertaking approved for the war."
 WW1_WO_USA_integrated_staff:0 "An Integrated Operational Staff"
 WW1_WO_USA_integrated_staff_desc:0 "An offensive conducted by several armies requires common reports and timetables. Liaison officers will help coordinate operations, accepting the extra demand placed upon the supply services."
 WW1_WO_USA_limited_mandate:0 "A Limited National Mandate"
 WW1_WO_USA_limited_mandate_desc:0 "Congress must be able to state the obligations for which it is asking the country to prepare. The government will define those obligations narrowly and retain authority over any extension of the undertaking."
 WW1_WO_USA_national_command:0 "Preserve National Command"
 WW1_WO_USA_national_command_desc:0 "Cooperation does not require the abandonment of American responsibility for American troops. The expeditionary staff will retain a national timetable for training and supply."
 WW1_WO_USA_prepare_convention:0 "Prepare: An Allied Purchasing Convention"
 WW1_WO_USA_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_USA_purchasing_convention:0 "Negotiate an Allied Purchasing Convention"
 WW1_WO_USA_purchasing_convention_desc:0 "American factories receive competing orders from governments engaged in the same war. A purchasing convention could establish a common schedule without placing American policy under foreign direction."
 WW1_WO_USA_subscription_limits:0 "Finance the War by Subscription"
 WW1_WO_USA_subscription_limits_desc:0 "Voluntary subscriptions can provide resources without giving every purchasing department a claim to unlimited credit. The Treasury will establish a common schedule for the subscriptions and the orders they support."
 WW1_WO_USA_war_council:0 "The American Commitment"
 WW1_WO_USA_war_council_desc:0 "The Republic must define the limits of its commitments abroad and the means by which it will uphold them. Congress and the departments will examine the alternatives before further obligations are assumed."
 WW1_WO_USA_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_USA_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_WHR_civilian_distribution:0 "Restore Civilian Distribution"
 WW1_WO_WHR_civilian_distribution_desc:0 "The return of civil authority requires markets and transport to function beyond the military depots. The surviving administration will prepare the release of stores and the reopening of ordinary traffic."
 WW1_WO_WHR_commission_unlock_tt:0 "Unlocks a diplomatic commission. Preparing the proposal takes §Y20 days§! and costs §Y25 Political Power§!. The other government may accept, amend or refuse the terms."
 WW1_WO_WHR_concentrated_advance:0 "Concentrate against the Red Centres"
 WW1_WO_WHR_concentrated_advance_desc:0 "The anti-Bolshevik commands cannot pursue every objective at once. The available transport and stores will be concentrated upon the principal advance against the Soviet centres."
 WW1_WO_WHR_consented_mission_research:0 "Allied Logistics Mission"
 WW1_WO_WHR_contracted_stores:0 "Purchase the Army's Stores"
 WW1_WO_WHR_contracted_stores_desc:0 "The forces require regular deliveries from districts already strained by the war. The administration will favour recorded purchases, accepting the expense and delay involved."
 WW1_WO_WHR_emergency_depots:0 "Concentrate the Emergency Depots"
 WW1_WO_WHR_emergency_depots_desc:0 "The separate commands must receive supplies according to a common military priority. Emergency contracts will favour the active fronts, while civilian requirements bear the cost."
 WW1_WO_WHR_prepare_convention:0 "Prepare: An Allied Technical Mission"
 WW1_WO_WHR_prepare_convention_desc:0 "The ministries will assemble the schedules and appoint a delegation before the proposal is submitted. The other government must give its own answer to the terms."
 WW1_WO_WHR_secure_rear:0 "Secure the Rear before Advancing"
 WW1_WO_WHR_secure_rear_desc:0 "An army cannot advance indefinitely through districts without dependable transport and civil administration. The commands will first secure the routes and depots which sustain the front."
 WW1_WO_WHR_technical_mission:0 "Request an Allied Technical Mission"
 WW1_WO_WHR_technical_mission_desc:0 "Foreign stores are of limited use without an agreed system for repair and delivery. We will ask an allied government to send technical representatives, without promising territory or accepting foreign control of the army."
 WW1_WO_WHR_war_council:0 "The Anti-Bolshevik Conference"
 WW1_WO_WHR_war_council_desc:0 "The commands fighting Soviet power must agree upon the use of their forces, their foreign support and the civil authority that follows them. The conference will consider the choices that divide the movement."
 WW1_WO_WHR_war_council_programme_tt:0 "Opens the national war programme."
 WW1_WO_WHR_war_council_shortcut:0 "War Aims and Settlement"
 WW1_WO_careful_staff:0 "A Deliberate Campaign Schedule"
 WW1_WO_careful_staff_desc:0 "The staff gives priority to supply arrangements before approving further operations. Preparations proceed more slowly, but place fewer demands upon the transport service."
 WW1_WO_civilian_repair:0 "The Release of Wartime Contracts"
 WW1_WO_civilian_repair_desc:0 "Wartime contracts are being released so that workshops can repair civilian property. Military output will fall while the transition continues."
 WW1_WO_consented_procurement:0 "A Ratified Purchasing Schedule"
 WW1_WO_consented_procurement_desc:0 "A purchasing schedule agreed with a foreign government allows orders to be coordinated. Maintaining the programme requires resources from the civilian economy."
 WW1_WO_consented_shipping:0 "Civilian Shipping Assurances"
 WW1_WO_consented_shipping_desc:0 "Agreed procedures for civilian cargoes give merchants greater confidence in the treatment their vessels will receive."
 WW1_WO_conventions:0 "Diplomatic Commissions"
 WW1_WO_conventions_desc:0 "The government can appoint commissions to prepare the conventions proposed by the council. A written proposal will be submitted once the delegation has completed its work."
 WW1_WO_emergency_contracts:0 "Emergency War Contracts"
 WW1_WO_emergency_contracts_desc:0 "Factories have received emergency military orders. Greater output comes at the expense of the civilian economy."
 WW1_WO_naval_escorts:0 "Priority for Merchant Escorts"
 WW1_WO_naval_escorts_desc:0 "The navy gives the protection of merchant traffic precedence over the interception of enemy trade."
 WW1_WO_naval_pressure:0 "Priority for Commerce Interception"
 WW1_WO_naval_pressure_desc:0 "The navy concentrates on the interception of enemy trade, leaving fewer resources for the protection of merchant convoys."
 WW1_WO_offensive_staff:0 "A Concentrated Offensive Effort"
 WW1_WO_offensive_staff_desc:0 "The staff is accelerating preparations for a concentrated offensive. The pace of work places additional demands upon the supply service."
 WW1_WO_war_savings:0 "Economies in Wartime Purchasing"
 WW1_WO_war_savings_desc:0 "Tighter purchasing rules release resources for civilian needs, but slow the expansion of military production."
