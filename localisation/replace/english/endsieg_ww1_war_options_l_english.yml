 WW1WO.201.b:0 "Offer narrower terms."
 WW1WO.201.c:0 "We cannot accept these terms."
 WW1WO.201.d:0 "Berlin proposes a convention covering Belgian independence, frontier inquiries and commercial traffic. The German note asks for regular meetings between the authorities responsible for transport and the frontier."
 WW1WO.201.t:0 "The Brussels Convention"
 WW1WO.220.a:0 "The ministries have their answer."
 WW1WO.220.accepted:0 "The other government has accepted the convention. The ministries will now appoint their representatives and begin the agreed exchange of reports and technical experience."
