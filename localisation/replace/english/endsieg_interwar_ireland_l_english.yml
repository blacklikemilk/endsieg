l_english:
 INT_ENG_irish_guerrilla_war:0 "Irish War of Independence"
 INT_ENG_irish_guerrilla_war_desc:0 "Republican flying columns attack police barracks and patrols while the Dáil builds a rival administration. Britain's military presence cannot resolve a struggle fought through intelligence, local loyalties and political legitimacy."
 INT_IRE_treaty_divisions:0 "The Treaty Split"
 INT_IRE_treaty_divisions_desc:0 "The Anglo-Irish Treaty offers self-government, but the oath to the Crown and the continued partition of Ireland divide the movement which fought for a republic. The army and parliament disagree over what independence means."
 INT_IRE_dominion_settlement:0 "The Dominion Settlement"
 INT_IRE_dominion_settlement_desc:0 "The Free State governs itself within the Commonwealth. The oath, the Crown's constitutional position and Britain's retained treaty ports remain sources of controversy. Dominion status is represented by this constitutional settlement; Ireland conducts its own affairs."
 INT_IRE_civil_war_damage:0 "Legacy of the Civil War"
 INT_IRE_civil_war_damage_desc:0 "Destroyed communications, exhausted finances and bitter political divisions hinder reconstruction. Peace ends the fighting, but rebuilding public confidence will take longer."
 INT_uk_interwar.2.b:0 "Reject the agreement and resume coercion."

 INT_ireland.1.t:0 "Sinn Féin's Electoral Victory"
 INT_ireland.1.d:0 "The results of December's general election transform Irish politics. Sinn Féin wins an overwhelming majority of the Irish seats, and its elected representatives intend to refuse Westminster. They propose an assembly in Dublin, claiming that the electorate has given them a mandate for an independent republic. Unionist victories in the north-east reveal a very different political allegiance. The government must now confront an organized challenge to its authority, rather than an isolated rising."
 INT_ireland.1.a:0 "Westminster faces a new challenge."
 INT_ireland.2.t:0 "The First Dáil Declares Independence"
 INT_ireland.2.d:0 "Sinn Féin representatives gather at Dublin's Mansion House and proclaim an Irish Republic. Their Dáil Éireann claims the right to govern Ireland and appeals for international recognition. On the same day, an ambush at Soloheadbeg kills two policemen. Republican volunteers and British security forces now face each other across a country with competing administrations. Police barracks, intelligence networks and local government become the ground on which the struggle develops."
 INT_ireland.2.a:0 "Maintain the British administration."
 INT_ireland.3.t:0 "Bloody Sunday in Dublin"
 INT_ireland.3.d:0 "Dublin is shaken by killings and reprisals. Republican gunmen strike at suspected British intelligence officers, and security forces open fire on spectators at Croke Park. Further deaths in custody deepen the outrage. Reports of the day's violence cross the Irish Sea and reach foreign newspapers. Ministers face mounting criticism of a campaign in which distinguishing combatants from civilians grows increasingly difficult."
 INT_ireland.3.a:0 "The political cost is mounting."
 INT_ireland.4.t:0 "A Truce in Ireland"
 INT_ireland.4.d:0 "A cessation of hostilities is proposed for 11 July. Republican leaders and British officials recognize that continuing the campaign offers no easy settlement. A truce would stop attacks and reprisals while negotiations address Ireland's constitutional position. The republicans demand recognition of their independence; London must also consider the Crown, imperial security and the unionist government in Belfast. Ending the shooting will open the talks, without settling these questions."
 INT_ireland.4.a:0 "Agree to the truce and begin negotiations."
 INT_ireland.4.b:0 "Continue the campaign."
 INT_ireland.5.t:0 "The Dáil Ratifies the Treaty"
 INT_ireland.5.d:0 "After bitter debate, the Dáil approves the Anglo-Irish Treaty by 64 votes to 57. Supporters argue that it provides the institutions and freedom from which Ireland can build its future. Opponents reject the oath to the Crown and insist that a dominion cannot fulfill the republic's mandate. The vote permits a provisional government to take over the administration, but it leaves a dangerous division among the men who fought the war."
 INT_ireland.5.a:0 "Prepare the transfer of government."
 INT_ireland.6.t:0 "Dublin Castle Changes Hands"
 INT_ireland.6.d:0 "Michael Collins arrives at Dublin Castle to receive the authority of the provisional government. The machinery of British rule in the twenty-six counties begins passing into Irish hands, and British troops prepare to leave. Northern Ireland retains its separate government within the United Kingdom. The new administration must organize public services and an army while drafting the constitution which will establish the Free State."
 INT_ireland.6.a:0 "Transfer the administration."
 INT_ireland.7.t:0 "The Irish Provisional Government"
 INT_ireland.7.d:0 "Our provisional government takes responsibility for the twenty-six counties under Michael Collins. The Dáil and Arthur Griffith's government remain part of the political settlement while new institutions are assembled. An Irish National Army must replace the old security apparatus and maintain order. The Treaty has opened the road to self-government, but republican opponents still reject its constitutional limits."
 INT_ireland.7.a:0 "Build the institutions of self-government."
 INT_ireland.8.t:0 "The Republican Army Splits"
 INT_ireland.8.d:0 "Army leaders opposed to the Treaty reject the authority of the provisional government. They claim that the republic proclaimed by the Dáil cannot be dissolved through an agreement with Britain. Treaty supporters insist that the elected parliament has decided and that an army cannot overrule it. Rival commands emerge, and the occupation of public buildings threatens to turn this constitutional dispute into armed conflict."
 INT_ireland.8.a:0 "Defend the Dáil's decision."
 INT_ireland.8.b:0 "Spend our political capital on a joint settlement."
 INT_ireland.9.t:0 "The Four Courts and Civil War"
 INT_ireland.9.d:0 "The National Army moves against the anti-Treaty garrison in Dublin's Four Courts. Negotiations have failed to reconcile two claims to legitimate authority, and artillery fire now replaces them. Republican forces in the south and west mobilize against the provisional government. Ireland enters a war between former comrades, with Dublin held by the government and substantial republican strongholds beyond the capital."
 INT_ireland.9.a:0 "Secure the country for the elected government."
 INT_ireland.12.t:0 "Griffith and Collins Are Dead"
 INT_ireland.12.d:0 "Arthur Griffith's sudden death on 12 August has already shaken the government. Now Michael Collins is killed in an ambush at Béal na Bláth on 22 August. Ireland loses two leading figures of the Treaty settlement while the civil war continues. W. T. Cosgrave and the surviving ministers must preserve the administration and complete the constitution without the men who led the negotiations and the transfer of power."
 INT_ireland.12.a:0 "Cosgrave must keep the government together."
 INT_ireland.13.t:0 "The Irish Free State Is Established"
 INT_ireland.13.d:0 "The constitution comes into force on 6 December and the provisional administration gives way to the Irish Free State. An executive council, parliament and courts now operate within the dominion settlement. Northern Ireland exercises its right to remain in the United Kingdom. The new state's institutions face the task of securing peace, rebuilding public finances and establishing Ireland's position abroad."
 INT_ireland.13.a:0 "A state of our own."
 INT_ireland.14.t:0 "The Republicans Dump Arms"
 INT_ireland.14.d:0 "The anti-Treaty command orders its remaining forces to stop fighting and dump arms. Its military campaign can no longer dislodge the government from Dublin or overturn the Treaty settlement. The Free State can restore administration throughout the south and west, but prisoners, damaged property and the memory of executions will remain urgent political questions. Reconstruction begins amid a deeply divided society."
 INT_ireland.14.a:0 "Restore civil administration throughout Ireland."
 INT_ireland.15.t:0 "The Boundary Agreement"
 INT_ireland.15.d:0 "Dublin, London and Belfast agree to retain the existing border. The Boundary Commission has not produced the territorial revision many nationalists expected, and the governments settle outstanding financial questions instead. Partition remains a painful reality. Our administration must decide how to improve relations and secure the state's finances while preserving its political claim to national unity."
 INT_ireland.15.a:0 "Accept the settlement and stabilize relations."
 INT_ireland.16.t:0 "The Statute of Westminster"
 INT_ireland.16.d:0 "The Statute of Westminster removes the legal subordination of the dominions' legislation to British Acts. The Free State gains a clearer basis for its constitutional autonomy within the Commonwealth. The Treaty and the Crown remain subjects of disagreement, but London can no longer treat Irish law as a simple extension of its own. Our government can now pursue constitutional reform on a different legal footing."
 INT_ireland.16.a:0 "Irish law is our own responsibility."
 INT_ireland.17.t:0 "De Valera Returns to Government"
 INT_ireland.17.d:0 "Fianna Fáil's electoral victory brings Éamon de Valera to the head of the executive council. The transfer of power proceeds through parliament, bringing former opponents of the Treaty into government by constitutional means. The new ministry intends to revise the oath and the remaining restrictions of the settlement. Cosgrave leaves office as Ireland tests whether its institutions can sustain a peaceful change between the camps formed during the civil war."
 INT_ireland.17.a:0 "A peaceful transfer of power."
 INT_ireland.18.t:0 "The Oath Is Abolished"
 INT_ireland.18.d:0 "The legislature abolishes the oath required by the Treaty settlement. De Valera's government presents the measure as a further assertion of Irish constitutional independence, while critics warn of fresh conflict with Britain over the agreement. The Crown's remaining position and the wider relationship with the Commonwealth are still unsettled. Ireland continues to reshape the institutions inherited from the revolutionary years."
 INT_ireland.18.a:0 "Remove the oath from our constitution."

 INT_ireland_news.a:0 "The world takes notice."
 INT_ireland_news.1.t:0 "Sinn Féin Wins the Irish Election"
 INT_ireland_news.1.d:0 "Sinn Féin wins a sweeping majority of the Irish seats in Britain's general election. Its representatives intend to boycott Westminster and establish an assembly in Dublin claiming an independent republic. Unionist support remains concentrated in the north-east. The result places Ireland's constitutional future at the center of British politics."
 INT_ireland_news.2.t:0 "Bloody Sunday in Dublin"
 INT_ireland_news.2.d:0 "Killings and reprisals shake Dublin. Republican attacks on suspected intelligence officers are followed by security forces firing on spectators at Croke Park. Further deaths in custody deepen public outrage. Foreign correspondents report an escalating struggle between the Irish republican movement and the British administration."
 INT_ireland_news.3.t:0 "A Truce Ends the Fighting in Ireland"
 INT_ireland_news.3.d:0 "British forces and Irish republicans agree to cease hostilities. Negotiators now face the questions which military operations have failed to settle: Irish independence, allegiance to the Crown and the position of Northern Ireland. The truce opens a diplomatic path while leaving the rival claims unresolved."
 INT_ireland_news.4.t:0 "The Irish Free State Comes into Being"
 INT_ireland_news.4.d:0 "The Irish Free State's constitution takes effect. The twenty-six counties obtain their own parliamentary government within the Commonwealth, while Northern Ireland remains in the United Kingdom. Dublin's provisional administration becomes a constitutional state, carrying the divisions of the Treaty settlement into its new institutions."
 INT_ireland_news.5.t:0 "The Irish Civil War Ends"
 INT_ireland_news.5.d:0 "The Free State government brings the anti-Treaty military resistance to an end and restores its administration throughout the south and west. Republican forces lay down their arms. The fighting has left damaged communications and bitter political divisions, and Ireland now faces the work of reconstruction."
 INT_ireland_news.6.t:0 "The Irish Border Is Confirmed"
 INT_ireland_news.6.d:0 "The governments in Dublin, London and Belfast agree to preserve the existing boundary between the Free State and Northern Ireland. A financial settlement accompanies the decision. Hopes that the Boundary Commission would substantially change the frontier give way to a settlement which confirms partition."
 INT_ireland_news.7.t:0 "Ireland Gains Legislative Autonomy"
 INT_ireland_news.7.d:0 "The Statute of Westminster provides the Irish Free State with a new legal basis for legislative independence. British legislation no longer automatically overrides dominion law. The political disputes over the Treaty and the Crown remain, but the constitutional relationship between Dublin and London has changed."
 INT_ireland_news.8.t:0 "Ireland Abolishes the Treaty Oath"
 INT_ireland_news.8.d:0 "De Valera's government abolishes the oath imposed by the Anglo-Irish Treaty. Supporters present the change as an assertion of national independence; critics question its implications for relations with Britain. Ireland's government continues to revise the constitutional settlement from which the Free State emerged."
 INT_ireland_news.9.t:0 "The Irish Republicans Defeat the Free State"
 INT_ireland_news.9.d:0 "Anti-Treaty forces defeat the Free State government and restore a republican administration in Dublin. The dominion settlement is overturned by force. Britain and other governments must now decide how to respond to an Ireland whose independence rests on rejection of the negotiated Treaty."
 INT_ireland_news.10.t:0 "Michael Collins Is Killed"
 INT_ireland_news.10.d:0 "Michael Collins is killed in an ambush at Béal na Bláth. His death follows that of Arthur Griffith and deprives the Irish government of two leading figures while the civil war continues. W. T. Cosgrave and the surviving ministers take responsibility for preserving the administration and completing the constitutional settlement."
 INT_ireland_news.11.t:0 "De Valera Forms an Irish Government"
 INT_ireland_news.11.d:0 "Éamon de Valera takes office at the head of a Fianna Fáil government after a parliamentary transfer of power. Former opponents of the Anglo-Irish Treaty now lead the institutions established under it. The new administration intends to remove the oath and revise Ireland's relationship with Britain, opening a new phase in the struggle over the constitutional settlement."

