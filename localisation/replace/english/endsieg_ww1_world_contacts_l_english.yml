l_english:
 ww1_world_contacts.1.t:0 "The German Mission in Mexico"
 ww1_world_contacts.1.d:0 "The German envoy has returned to the question of cooperation between our armies. Berlin now offers a limited exchange of instructors, technical reports and small arms. Such assistance could serve our forces, but accepting it would expose the government to renewed scrutiny from Washington. The cabinet must decide how far a useful military connection can be pursued."
 ww1_world_contacts.1.a:0 "Approve the exchange of instructors and arms."
 ww1_world_contacts.1.b:0 "Our army must follow its own course."
 ww1_world_contacts.2.t:0 "Mexico's Reply"
 ww1_world_contacts.2.accepted.d:0 "Mexico has agreed to receive a small German military mission. Its officers will share their experience while our instructors and arms specialists assist selected units. The agreement gives both armies a practical connection, though the Mexican government has undertaken no wider political obligation."
 ww1_world_contacts.2.refused.d:0 "The Mexican government has declined the proposed military exchange. Its ministers consider the diplomatic costs too great and will make their own arrangements for instructors and arms. Our envoy advises that further pressure would only close the remaining channels between the two governments."
 ww1_world_contacts.2.withdrawn.d:0 "The proposed military exchange with Mexico has broken down before it could be concluded. Our envoy can no longer secure the conditions needed to receive instructors and deliver arms. The mission will remain in Germany while the Foreign Office reviews its position."
 ww1_world_contacts.2.a:0 "Send the instructors and arrange the arms shipment."
 ww1_world_contacts.2.b:0 "Acknowledge the Mexican decision."
 ww1_world_contacts.2.c:0 "The mission must remain at home."
 ww1_world_contacts.3.t:0 "A German Request for Transit"
 ww1_world_contacts.3.d:0 "The German mission has requested permission to move personnel and supplies through Persian territory. Its representatives offer to coordinate movements with our officials and respect the authority of the government. Access could strengthen our position in negotiations, but it would also draw Persia further into the struggles of the great powers."
 ww1_world_contacts.3.a:0 "Authorise German passage under our supervision."
 ww1_world_contacts.3.b:0 "Persian territory will remain closed to the mission."
 ww1_world_contacts.4.t:0 "Persia's Answer"
 ww1_world_contacts.4.accepted.d:0 "The Persian government has approved passage for German forces and supplies. Our mission will work through the local authorities to arrange routes and movements. The agreement gives our representatives a useful connection across the region, whose value will depend on continued cooperation with Tehran."
 ww1_world_contacts.4.refused.d:0 "Tehran has refused the request for German military transit. Persian ministers fear that foreign movements would weaken their authority and invite fresh intervention. Our mission will continue its diplomatic work without the freedom of passage it sought."
 ww1_world_contacts.4.withdrawn.d:0 "The proposed Persian transit convention can no longer be concluded. The circumstances under which permission was discussed have changed, and the Foreign Office cannot put the arrangement into effect. Our representatives must seek another way to maintain their communications."
 ww1_world_contacts.4.a:0 "Put the transit convention into effect."
 ww1_world_contacts.4.b:0 "Respect Tehran's refusal."
 ww1_world_contacts.4.c:0 "Suspend the proposed convention."
 ww1_world_contacts.5.t:0 "A German Grain Purchasing Mission"
 ww1_world_contacts.5.d:0 "German representatives have offered railway and supply equipment to help move grain from the Ukrainian countryside. In return, they seek dependable deliveries for the German market. The proposal could restore valuable transport links, but the government must balance export commitments against the needs of its own towns and villages."
 ww1_world_contacts.5.a:0 "Conclude the grain agreement."
 ww1_world_contacts.5.b:0 "Our harvest must serve domestic needs first."
 ww1_world_contacts.6.t:0 "The Ukrainian Grain Negotiations"
 ww1_world_contacts.6.accepted.d:0 "The Ukrainian government has accepted the purchasing mission's proposals. Grain deliveries will be supported by German railway and supply equipment, helping both sides turn a diplomatic promise into regular traffic. The ministries can now coordinate the movement of produce and the dispatch of the promised equipment."
 ww1_world_contacts.6.refused.d:0 "Ukraine has declined the proposed grain agreement. Its ministers will give priority to domestic supplies and cannot undertake the deliveries sought by our purchasing mission. The promised equipment will remain in Germany, and the Foreign Office must look elsewhere for a dependable commercial arrangement."
 ww1_world_contacts.6.withdrawn.d:0 "The Ukrainian grain agreement has stalled before deliveries could begin. Our representatives can no longer guarantee the conditions on which the exchange was negotiated. The ministries will withhold the promised equipment until a workable commercial relationship can be established."
 ww1_world_contacts.6.a:0 "Dispatch the railway equipment and receive the grain."
 ww1_world_contacts.6.b:0 "Accept the limits of the harvest."
 ww1_world_contacts.6.c:0 "Withhold the proposed exchange."
 ww1_world_contacts.7.t:0 "The Baltic Transit Convention"
 ww1_world_contacts.7.d:0 "Berlin has proposed a convention governing the passage of German troops and supplies through Lithuania. Railway officials would coordinate traffic with German transport officers, while our government retains responsibility for the routes. The cabinet must weigh the value of these connections against the pressure that foreign military movements could place upon the country."
 ww1_world_contacts.7.a:0 "Approve the transit convention."
 ww1_world_contacts.7.b:0 "Keep control of the routes without this agreement."
 ww1_world_contacts.8.t:0 "The Lithuanian Transit Reply"
 ww1_world_contacts.8.accepted.d:0 "Lithuania has approved the Baltic transit convention. German transport officers can now work with the local authorities to plan movements and compare railway procedures. The agreement opens the routes our mission requested and provides practical experience for the army's supply services."
 ww1_world_contacts.8.refused.d:0 "The Lithuanian government has refused the proposed transit convention. Its ministers will retain full discretion over foreign military movements and have declined the arrangements offered by our mission. Our transport officers must plan without assured passage through Lithuania."
 ww1_world_contacts.8.withdrawn.d:0 "The Baltic transit convention cannot be put into effect. The conditions on which the two missions negotiated have changed, leaving the proposed movements and railway arrangements without a dependable basis. Our staff will suspend its preparations."
 ww1_world_contacts.8.a:0 "Open the routes and coordinate the railway services."
 ww1_world_contacts.8.b:0 "Our staff must plan another route."
 ww1_world_contacts.8.c:0 "Suspend the transit preparations."
 GW_D_baltic_transit_research:0 "Baltic Railway Coordination"
