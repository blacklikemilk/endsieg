l_english:
 ww1_world_contacts.1.t:0 "A German Military Mission"
 ww1_world_contacts.1.d:0 "The German minister has offered instructors and a modest shipment of arms for our army. His government hopes that an exchange of officers and experience will bring our countries closer. The proposal could strengthen our forces, but Washington will watch any German presence in Mexico with suspicion."
 ww1_world_contacts.1.a:0 "The mission may come to Mexico."
 ww1_world_contacts.1.b:0 "We will find our instructors elsewhere."
 ww1_world_contacts.2.t:0 "An Answer from Mexico"
 ww1_world_contacts.2.accepted.d:0 "The Mexican government is prepared to receive our instructors and discuss the arms shipment. Its answer offers a useful opening for cooperation between the two armies, though Mexico has made no promise of a wider alliance."
 ww1_world_contacts.2.refused.d:0 "The Mexican government has declined our offer. Its ministers have decided against receiving the mission and will make their own arrangements for the army’s instruction and equipment."
 ww1_world_contacts.2.withdrawn.d:0 "The arrangements for a military mission to Mexico have fallen through. With the circumstances of the offer changed or an answer no longer forthcoming, the Foreign Office can no longer put the exchange into effect."
 ww1_world_contacts.2.a:0 "Make the arrangements for the mission."
 ww1_world_contacts.2.b:0 "We must accept their answer."
 ww1_world_contacts.2.c:0 "The proposal has been overtaken."
 ww1_world_contacts.3.t:0 "The Germans Request Passage"
 ww1_world_contacts.3.d:0 "German representatives seek permission for their personnel and supplies to pass through Persian territory. They propose to coordinate the movements with our officials. The arrangement could give us a useful connection to Berlin, but foreign troops on our roads may invite demands from other powers."
 ww1_world_contacts.3.a:0 "Permit passage through Persia."
 ww1_world_contacts.3.b:0 "We cannot grant the request."
 ww1_world_contacts.4.t:0 "An Answer from Persia"
 ww1_world_contacts.4.accepted.d:0 "Tehran is willing to permit German military passage. Our officers can now make arrangements with the Persian authorities for the routes and the movement of supplies."
 ww1_world_contacts.4.refused.d:0 "The Persian government has refused the passage requested by our mission. Tehran is unwilling to accept the consequences of a foreign military presence on its roads."
 ww1_world_contacts.4.withdrawn.d:0 "The proposed agreement on passage through Persia cannot be concluded. With the circumstances of the negotiations changed or no answer received, our officers must make other arrangements."
 ww1_world_contacts.4.a:0 "Instruct the mission to arrange passage."
 ww1_world_contacts.4.b:0 "Our officers must find another route."
 ww1_world_contacts.4.c:0 "The arrangements must be set aside."
 ww1_world_contacts.5.t:0 "German Buyers Seek Ukrainian Grain"
 ww1_world_contacts.5.d:0 "German representatives wish to purchase grain for their home market. They offer railway equipment and supplies to help bring the harvest to the depots. The offer promises badly needed transport, but every shipment abroad will have to be weighed against demand at home."
 ww1_world_contacts.5.a:0 "We can supply grain under these terms."
 ww1_world_contacts.5.b:0 "The harvest is needed at home."
 ww1_world_contacts.6.t:0 "The Grain Negotiations"
 ww1_world_contacts.6.accepted.d:0 "The Ukrainian government has accepted our purchasing proposal. The ministries can now arrange the promised railway equipment and supplies in return for deliveries from the Ukrainian harvest."
 ww1_world_contacts.6.refused.d:0 "Ukraine has declined to supply grain under our proposed agreement. Its government will give priority to the demands of its own population, and our buyers must look elsewhere."
 ww1_world_contacts.6.withdrawn.d:0 "The proposed grain agreement with Ukraine has lapsed before the exchange could be arranged. The ministries will hold the equipment intended for the mission while they consider another source of supply."
 ww1_world_contacts.6.a:0 "Dispatch the equipment."
 ww1_world_contacts.6.b:0 "We must seek another supplier."
 ww1_world_contacts.6.c:0 "The exchange cannot proceed."
 ww1_world_contacts.7.t:0 "A German Request for Transit"
 ww1_world_contacts.7.d:0 "Berlin seeks permission to move German forces and supplies across Lithuania. Its officers propose to coordinate traffic with our railway authorities. Better connections may bring advantages, but allowing foreign troops passage will place demands on a government determined to protect its own authority."
 ww1_world_contacts.7.a:0 "Approve the transit arrangements."
 ww1_world_contacts.7.b:0 "Our roads must remain under our control."
 ww1_world_contacts.8.t:0 "An Answer from Lithuania"
 ww1_world_contacts.8.accepted.d:0 "Lithuania is prepared to grant the military access our mission requested. German transport officers can now coordinate movements and railway procedures with the Lithuanian authorities."
 ww1_world_contacts.8.refused.d:0 "The Lithuanian government has declined our request for military passage. Its ministers are unwilling to make the proposed arrangements, and our staff will have to plan without them."
 ww1_world_contacts.8.withdrawn.d:0 "The proposed transit agreement with Lithuania has lapsed before it could take effect. With the circumstances of the offer changed or an answer no longer forthcoming, the staff must suspend its preparations."
 ww1_world_contacts.8.a:0 "The routes can be arranged."
 ww1_world_contacts.8.b:0 "The staff must plan accordingly."
 ww1_world_contacts.8.c:0 "Set the proposal aside."
 GW_D_baltic_transit_research:0 "Baltic Railway Coordination"
