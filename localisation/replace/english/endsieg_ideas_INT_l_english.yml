l_english:
    INT_UKR_fragmented_army: "Disintegrating Ukrainian Army"
    INT_UKR_fragmented_army_desc: "Rival commands struggle to coordinate the front as exhausted formations lack weapons and trained replacements. Disrupted arsenals cannot keep pace with losses, weakening both offensive operations and the defense of our territory. These penalties last through the civil-war period until 1923."
    INT_eastern_fragmented_army: "Fragmented Army Command"
    INT_eastern_fragmented_army_desc: "Regional formations answer to competing authorities, while disrupted arsenals struggle to supply a unified army. Training and production suffer, and units have difficulty sustaining coordinated operations. These penalties last through the civil-war period until 1923."
    INT_SOV_red_army_mobilization: "Red Army Mobilisation"
    INT_SOV_red_army_mobilization_desc: "The struggle against the White armies demands a coordinated military effort. Central arsenals supply replacement weapons, recruits reinforce the front, and commissars organize training and supply. This mobilisation lasts for the Russian Civil War."
    INT_reckless_progress: "Reckless Progress"
    INT_reckless_progress_desc: "Pushing our borders will result in quick process."

    INT_steady_progress: "Steady Progress"
    INT_steady_progress_desc: "To achieve a thriving economy, we must focus on steady progress."

    INT_war_economy_to_consumer_goods_war_economy: "War Economy Transformed into Consumer Goods"
    INT_war_economy_to_consumer_goods_war_economy_desc: "We have succeeded in reforming our wartime productions into consumer goods. This will severly heighten our ability to produce for the people."

    INT_war_economy_to_consumer_goods_civilian_economy: "Consumer Goods Efforts"
    INT_war_economy_to_consumer_goods_civilian_economy_desc: "Although we did not have a war economy in the period of WW1, we have still thrived to improve the situation for the consumers."

    INT_war_economy_to_resource_extraction_war_economy: "War Economy Transformed into Resource Extraction"
    INT_war_economy_to_resource_extraction_war_economy_desc: "We have succeeded in reforming our wartime productions into resource extraction. This will severly heighten our ability to produce more equipment for the people."

    INT_war_economy_to_resource_extraction_civilian_economy: "Resource Extraction Efforts"
    INT_war_economy_to_resource_extraction_civilian_economy_desc: "Although we did not have a war economy in the period of WW1, we have still thrived to improve the situation of our resource extraction."

