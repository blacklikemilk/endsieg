    INT_GER_postwar_unrest: "Postwar Unrest"
    INT_GER_postwar_unrest_desc: "Defeat, shortages and political violence continue to unsettle Germany."
    INT_GER_reichswehr_arrangement: "The Reichswehr Compromise"
    INT_GER_reichswehr_arrangement_desc: "A professional army remains available to the government, though its loyalties cannot be taken for granted."
    INT_GER_weimar_constitution: "The Weimar Constitution"
    INT_GER_weimar_constitution_desc: "The republic is founded on constitutional government and civil rights."
    INT_GER_currency_stabilized: "Stabilized Currency"
    INT_GER_currency_stabilized_desc: "Monetary reform has ended the worst of the inflation crisis."
    INT_GER_unemployment_insurance_idea: "Unemployment Insurance"
    INT_GER_unemployment_insurance_idea_desc: "The national insurance system cushions job losses but requires continuing public spending."
    INT_GER_dawes_credit: "Dawes Plan Credit"
    INT_GER_dawes_credit_desc: "Foreign loans and a revised payment schedule support reconstruction."
    INT_GER_young_plan: "Young Plan"
    INT_GER_young_plan_desc: "Reparations have been rescheduled again, easing some immediate economic pressure."
    INT_GER_presidential_cabinet: "Presidential Cabinets"
    INT_GER_presidential_cabinet_desc: "Emergency decrees have displaced ordinary parliamentary coalitions."
    INT_GER_democratic_resilience: "Democratic Resilience"
    INT_GER_democratic_resilience_desc: "Republican institutions have survived their gravest political test."
    INT_GER_revolutionary_transition: "Revolutionary Transition"
    INT_GER_revolutionary_transition_desc: "The new socialist order is still consolidating its authority."
    INT_GER_socialist_planning: "Socialist Planning"
    INT_GER_socialist_planning_desc: "Heavy industry is reorganized under public direction."
    INT_GER_red_reichswehr: "Red Reichswehr"
    INT_GER_red_reichswehr_desc: "The armed forces have been reorganized for the socialist government."
    INT_GER_constitutional_monarchy: "Constitutional Monarchy"
    INT_GER_constitutional_monarchy_desc: "The Kaiser reigns under a constitution and an elected parliament."
    INT_GER_imperial_restoration: "Imperial Restoration"
    INT_GER_imperial_restoration_desc: "The restored imperial government places authority in the hands of the crown."
    INT_GER_clandestine_rearmament: "Clandestine Rearmament"
    INT_GER_clandestine_rearmament_desc: "Military research and organization continue despite treaty restrictions."
    INT_GER_balanced_budget: "Emergency Austerity"
    INT_GER_balanced_budget_desc: "Spending restraint eases pressure on the treasury but deepens social hardship."

    INT_GER_locarno_accord: "Locarno Accord"
    INT_GER_rapallo_cooperation: "Rapallo Cooperation"
    INT_GER_eastern_trade_relations: "Eastern Trade Commissions"
    INT_GER_berlin_treaty_relations: "Berlin Treaty"
    INT_SOV_left_opposition: "The Left Opposition"
    INT_SOV_left_opposition_desc: "The party leadership is contested by advocates of international revolution."
    INT_SOV_party_center: "Party Secretariat"
    INT_SOV_party_center_desc: "Centralized appointments strengthen the governing party apparatus."
    INT_SOV_nep_compromise: "The NEP Compromise"
    INT_SOV_nep_compromise_desc: "A mixed economy balances state industry with peasant trade and cooperatives."
    INT_SOV_party_democracy: "Internal Party Debate"
    INT_SOV_party_democracy_desc: "Competing socialist programs can be argued within the party."
    INT_SOV_first_plan: "First Five-Year Plan"
    INT_SOV_first_plan_desc: "Heavy industry grows quickly, but the new targets strain consumption."
    INT_SOV_collectivization_crisis: "Collectivization Disruption"
    INT_SOV_collectivization_crisis_desc: "Rapid changes in the countryside depress stability and supply."
    INT_SOV_collective_farms: "Stabilized Collective Farms"
    INT_SOV_collective_farms_desc: "Equipment and stable procurement restore some agricultural output."
    INT_SOV_second_plan: "Second Five-Year Plan"
    INT_SOV_second_plan_desc: "The industrial drive now emphasizes machinery, transport and productivity."
    INT_SOV_cooperative_industry: "Cooperative Industrialization"
    INT_SOV_cooperative_industry_desc: "State investment and cooperative production grow together."
    INT_SOV_left_industry: "Workers' Industrial Plan"
    INT_SOV_left_industry_desc: "Public investment is guided by worker councils and technical institutes."

    fascist_propaganda_surrender: "Fascist Propaganda Influence"
    fascist_propaganda_surrender_desc: "The recent propaganda of the fascist regime has thoroughly ensured our people that our country will fight to the end, and that their support is necessary."
