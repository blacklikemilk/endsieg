l_english:
 TUR_stab_ui_title:0 "The Sick Man of Europe"
 TUR_stab_ui_summary:0 "Discontent: §Y[?TUR_stab_average|0]§!/100  |  Reform: §Y[?TUR_stab_months|0]§! months  |  Food: §Y[?TUR_stab_food_security|0]§!/100"
 TUR_stab_ui_summary_tt:0 "§YThe Sublime Porte§!\nDiscontent in the provinces strains the authority of the government.\n\nActive programmes: §Y[?TUR_stab_active_programmes|0]§!/2\nConsolidation: §Y[?TUR_stab_consolidation_months|0]§!/12 consecutive peaceful months\n\nA lasting settlement requires a completed local compact in every directly governed region. Food security must be at least §Y50§!, and discontent in every region must remain below §Y25§!.\n\nAfter §Y48 months§! of reform work, uphold all of these conditions for §Y12 consecutive peaceful months§!.\n\nThe government must maintain the settlement once achieved. War, shortages and renewed unrest can still threaten the empire.\n\nGrey regions lie outside our administration and do not contribute to discontent.\n\n§YTerritory and administration§!\nEach state is shown separately. Owned states carry the discontent colour of their region. Grey states are outside our rule and receive no regional penalties.\n\nHatching marks owned states that are not fully under our control, including contested territory. Military occupation alone does not restore ownership of a ceded state.\n\nA region remains in the discontent average while we own any of its assigned states. Select a numbered land or a row below to view its available measures."
 TUR_stab_ui_select_hint:0 "Grey: ceded  |  Hatched: occupied or contested"
