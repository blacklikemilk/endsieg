 TUR_stab_ui_ownership_tt:0 "§YTerritory and administration§!\nEach state is shown separately. Owned states carry the discontent colour of their region. Grey states are outside our rule and receive no regional penalties.\n\nHatching marks owned states that are not fully under our control, including contested territory. Military occupation alone does not restore ownership of a ceded state.\n\nA region remains in the discontent average while we own any of its assigned states. Select a numbered land or a row below to view its available measures."
