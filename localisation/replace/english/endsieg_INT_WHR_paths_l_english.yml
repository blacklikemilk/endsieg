l_english:
 WHR_INT_reconstruction_cabinet: "Reconstruction Cabinet"
 WHR_INT_reconstruction_cabinet_desc: "A wartime coalition cannot administer peacetime recovery without a common budget and clear authority."
 WHR_INT_white_coalition: "The White Coalition"
 WHR_INT_white_coalition_desc: "Civilian ministers and former front commanders must learn to govern together."
 WHR_INT_civic_ministries: "Civilian Ministries"
 WHR_INT_civic_ministries_desc: "Transfer routine administration from headquarters to accountable ministries."
 WHR_INT_constituent_elections: "Constituent Elections"
 WHR_INT_constituent_elections_desc: "The restored assembly can give the republic a government with an electoral mandate."
 WHR_INT_republic_1935: "A Constitutional Republic"
 WHR_INT_republic_1935_desc: "A stable civilian government now speaks for the whole country."
 WHR_INT_dynastic_council: "A Dynastic Council"
 WHR_INT_dynastic_council_desc: "The restored court needs a council that can mediate between the crown and the former White armies."
 WHR_INT_crown_and_cabinet: "Crown and Cabinet"
 WHR_INT_crown_and_cabinet_desc: "The monarch must decide how much authority to entrust to ministers."
 WHR_INT_royal_industry: "Royal Industrial Charters"
 WHR_INT_royal_industry_desc: "Chartered firms will rebuild workshops and rail links under the crown's patronage."
 WHR_INT_monarchy_1935: "A Restored Monarchy"
 WHR_INT_monarchy_1935_desc: "The crown has weathered the turmoil of reconstruction and established a durable state."
 WHR_INT_admiralty_cabinet: "The Admiralty Cabinet"
 WHR_INT_admiralty_cabinet_desc: "Kolchak's government will bring civilian administration under a central wartime command."
 WHR_INT_officer_government: "An Officer Government"
 WHR_INT_officer_government_desc: "Experienced officers will reorganize the provinces and train a loyal administrative corps."
 WHR_INT_emergency_statutes: "Emergency Statutes"
 WHR_INT_emergency_statutes_desc: "The government must decide when exceptional security measures should give way to normal law."
 WHR_INT_kolchak_1935: "An Established Directorate"
 WHR_INT_kolchak_1935_desc: "The admiral's directorate has survived its provisional years and can now set a longer course."
 WHR_INT_village_land_titles: "Village Land Titles"
 WHR_INT_village_land_titles_desc: "Clear title to small holdings will settle years of rural uncertainty."
 WHR_INT_cossack_compact: "The Cossack Compact"
 WHR_INT_cossack_compact_desc: "Regional autonomy and military service can be negotiated together."
 WHR_INT_university_reopening: "Reopen the Universities"
