 WHR_INT_artillery_school: "Artillery School"
 WHR_INT_artillery_school_desc: "Standardized fire plans can make the existing guns more effective."
 WHR_INT_mobile_reserve: "A Mobile Reserve"
 WHR_INT_mobile_reserve_desc: "The reconstituted army will keep trained formations ready for rapid deployment."
 WHR_INT_aircraft_bureaus: "Aircraft Design Bureaus"
