l_english:
    endsieg_news.1.t:0 "Sultan Mehmed V Dies"
    endsieg_news.1.d:0 "Sultan Mehmed V has died, leaving the Ottoman throne to his successor amid the strain of war. His reign saw the palace's political authority overshadowed by the leaders of the Young Turk movement, even as the sultan remained a symbol of the empire and the caliphate."
    endsieg_news.1.a:0 "A reign has ended."
    endsieg_news.2.t: "Turkey Surrenders! Armistice Signed at Mudros"
    endsieg_news.2.d: "The Armistice of Mudros, concluded on the 30th of October 1918 officially ended hostilities in the Middle East between the Ottoman Empire and the Allies. The Armistice was signed by the Ottoman Minister of Marine Affairs Rauf Bey and British Admiral Somerset Arthur Gough-Calthorpe on board the HMS Agamemnon in the Moudrous harbor on the Greek island of Lemnos. \n\n As part of the conditions, the Ottomans surrendered their garrisons outside Anatolia and allowed the allies to occupy the forts controlling the starits of the Dardanelles and the Bosporus. The Ottoman air force was demobilized and all ports, railways, etc were made available for use by allies. In the Caucasus Ottomans had to retreat to Pre-WWI Russo-Turkish borders."
    endsieg_news.2.a: "It has long passed its time"
    endsieg_news.3.t: "Turkish War of Independence"
    endsieg_news.3.d: "The Turkish War of Independence alternatively known as the War of Liberation was fought between the Turkish National Movement led by Mustafa Kemal 'Ataturk' and the Allies, primarily Greece and Armenia with small intervention from the French, Italians, and British. Very few of the British, French, and Italian troops had been deployed or engaged in combat."
    endsieg_news.3.a: "The bloodshed continues"
    endsieg_news.4.t:0 "The Red Baron Killed"
    endsieg_news.4.d:0 "Manfred von Richthofen has been killed after his aircraft came down near the Allied lines. The loss of Germany's celebrated fighter pilot has drawn attention on both sides of the front, while accounts of the final engagement remain disputed."
    endsieg_news.4.a:0 "Even the most famous are not spared."
    endsieg_news.5.t:0 "The Treaty of Bucharest"
    endsieg_news.5.d:0 "Romania has signed a peace settlement with the Central Powers after finding itself isolated on the eastern front. Territorial concessions and far-reaching economic demands leave the kingdom with a diminished frontier and its principal resources exposed to German influence."
    endsieg_news.5.a:0 "A costly peace for Romania."
    endsieg_news.6.t: "Bulgaria Surrenders! Armistice of Salonica Signed!"
    endsieg_news.6.d: "The Armistice of Salonica was signed 29th September 1918 between Bulgaria and the Allied Powers in Thessaloniki following a request for ceasefire five days earlier on the 24th of September. The Request followed successful allied Vardar Offensive that penetrated through the Bulgarian defenses in Macedonia from which the Central Powers never recovered from. The armistice called for the immediate demobilization of all Bulgarian military activities, the evacuation of Bulgarian-occupied Greek and Serbian territories as well as Bulgaria allowing the Allies to pass through Bulgarian territory."
    endsieg_news.6.a: "Soon the whole house will come crashing down"
    endsieg_news.7.t: "Austria Surrenders!"
    endsieg_news.7.d: "The Armistice of Villa Giusti signed 3 November 1918 officially ended the war between Austria-Hungary and Italy. By the end of October 1918 the Austro-Hungarian Army was utterfly defeated following the great defeat at the Battle of Vittorio Veneto where Austro-Hungarian troops made a chaotic withdrawal to the point as to where the Austro-Hungarian army ceased to exist. Whilst the Austro-Hungarian Government sought to negotiate a truce due to being hesistant of signing a text of armistice they signed the Armistice after a threat to break off the negotiations by the Italians on the 3rd of November. The cease-fire started at 3.00 pm on the 4th of November, though the army officially stopped fighting on the 3rd of November. Follwing this the Kingdom of Italy annexed Southern Tirol, Trieste, and Austrian Littoral."
    endsieg_news.7.a: "It is all over from here"
    endsieg_news.8.t:0 "A German Gun Bombards Paris"
    endsieg_news.8.d:0 "Shells from a German long-range gun have begun falling on Paris. The bombardment has brought the war to the city's streets from beyond the range of ordinary artillery, spreading alarm among its inhabitants."
    endsieg_news.8.a:0 "The capital is under fire."
    endsieg_news.9.t: "Attempted Assasination on Vladimir Lenin!"
    endsieg_news.9.d: "On the 30th of August 1918 after Vladimir Lenin spoke at the Hammer and Sickle, a factory in Moscow following his speech when he left the building Fanny Kaplan a radical revolutionary whom viewed Lenin as a 'traitor to the revolution' called out to Lenin and as he turned towards her she fired three shots using a Browning pistol. \n\n One of the bullets managed to pass through Lenin's coat the other two struck him, one passed through his necl and the others puncturing a part of his left lung and loding in his left shoulder. Lenin was taken back to his living quarters at the Kremlim and due to his fear of other plotters he refused to seek immediate medical attention. Doctors later were brought in to treat him and were uanble to remove the bullets immediately however Lenin remarkably managed to survive though his health never fully recovered."
    endsieg_news.9.a: "He dodged a bullet there"
    endsieg_news.10.t:0 "The Campaign in Crimea"
    endsieg_news.10.d:0 "German forces have opened operations against the Taurida Soviet authorities in Crimea. The advance towards Sevastopol brings another contest for control of the peninsula and its naval installations."
    endsieg_news.10.a:0 "Crimea faces another campaign."
    endsieg_news.11.t:0 "A Regional Government in Crimea"
    endsieg_news.11.d:0 "A new regional government has been established in Crimea following the defeat of the Taurida Soviet authorities. Backed by the German presence, it is attempting to restore administration over the peninsula and the port of Sevastopol."
    endsieg_news.11.a:0 "A new authority on the Black Sea."
    endsieg_news.12.t: "Flight over Vienna"
    endsieg_news.12.d: "On August 9th 1918, Gabriele D’Annuzio with 11 Ansaldo SVA in his squadron flew 1,2000 km from their airfield based in Due Carrare, Italy to Vienna where they dropped a total of around 50,000 leaflets over the city which were tri-colored green white and red the represent the Italian flag. The leaflets were written by D’Annuzio himself and not translated into German which spurred criticism against him such as “He writes, but he can’t act!” and his text was considered ineffectual and not translatable into German. In addition they also dropped 350,000 leaflets written by Ugo Ojetti."
    endsieg_news.12.a: "The people are tired"
    endsieg_news.13.t:0 "Skoropadsky Becomes Hetman"
    endsieg_news.13.d:0 "Pavlo Skoropadsky has taken power in Ukraine after a coup against the government of the People's Republic. The new hetman promises order and a stronger administration, while his opponents question the foundations of a regime sustained by foreign military support."
    endsieg_news.13.a:0 "Ukraine has a new government."
    endsieg_news.14.t: "Hungarian-Romanian War"
    endsieg_news.14.d: "The Hungarian-Romanian war took place between November 1918 until March 1920 fought between the First Hungarian Republic, and later from the 21st March 1919 the Hungarian Soviet Republic. After the collapse of Austria-Hungary the Union of Transylvania with Rumania was declared to which the Rumanians had moved to occupy the land, but the Hungarian Crown Council in Bucharest declined to which the Rumanians responded with an offensive in 1919 along the Hungarian-Romanian demarcation line. In march of 1919 however the First Hungarian Republic collapsed and a Communist Government took power led by Bela Kun who made a promise to protect Hungary's borders from the Entente's demand of territorial concessions. However in the end the Hungarian Soviet Republic failed and collapsed once the Romanians occupied Budapest which ended the war once and for all."
    endsieg_news.14.a: "Alright"
    endsieg_news.15.t: "Treaty of Trianon Signed!"
    endsieg_news.15.d: "The Treaty of Trianon was a final peace agreement to formally end WWI between the allies and Hungary, a successor to the Austro-Hungarian Empire. The treaty left Hungary as a landlocked state, 3.3 million ethnic Hungarians were left displaced outside of Hungary and five of ten of Hungary's largest cities fell outside of its borders. The army was limited to a measly 35,000 men and additionally the Hungarians had to pay war reparations to its neighbours. The treaty was largely an outrage to the Hungarians and the Hungarian delegation signed it under protest on the 4 June 1920."
    endsieg_news.15.a: "Peace in our lifetime"
    endsieg_news.16.t: "Royal Family Murdered"
    endsieg_news.16.d: "On 17 July 1918 the Tsar and his family while being held prisoner in Yekaterinburg were killed by Bolshevik troops led by Yakov Yurovsky under the orders of the Ural Regional Soviet due to the advance of the White Army which threatened to take the city. If Nicholas fell into the hands of the Whites it was feared he would be used as a beacon to rally support to the White cause and if the Tsar was on the side of the Whites it would mean greater foreign intervention from the Allies for which would see the Tsar as the most legitimate ruler of russia. After the family was killed the White Army captured the city within a week."
    endsieg_news.16.a: "How Horrible!"
    endsieg_news.17.t: "RMS Carpathia Sunk"
    endsieg_news.17.d: "On the 15th of July 1918, the Carpathia departing from Liverpool in a convoy bound for Boston was sunk in the Celtic Sea by a German submarine U-55. Six years earlier the Carpathia was the first to arrive to rescue the crew of the Titanic. There were a total of 218 survivors out of the 223 on the ship."
    endsieg_news.17.a: "Ok"
    endsieg_news.18.t:0 "Bessarabia Joins Romania"
    endsieg_news.18.d:0 "Bessarabia's assembly has proclaimed union with Romania. Bucharest welcomes the decision as the fulfilment of a national claim, while the region's uncertain political situation leaves the new settlement open to dispute."
    endsieg_news.18.a:0 "The eastern frontier has changed."
    endsieg_news.19.t:0 "Wilhelm II Abdicates"
    endsieg_news.19.d:0 "Wilhelm II has relinquished the German throne as revolutionary unrest and military defeat undermine the monarchy. The emperor's departure leaves a new government to seek an end to the war and establish its authority over a country in upheaval."
    endsieg_news.19.a:0 "The German monarchy has fallen."
    endsieg_news.20.t: "Treaty of Versaille"
    endsieg_news.20.d: "The Treaty of Versaille, signed on 28 June 1919, exactly five years after the assassination of Archduke Franz Ferdinand officially ended the state of war between Germany and the Allied Powers. Within the Treaty of Versaille Germany was to accept responsibility of 'Germany and her allies for causing all loss and damage during the war'. This was one of the most important and controversial things required which became later known as the 'War Guilt caluse'. In whole the treaty forced Germany to disarm, make territorial concessions to France, Belgium, and Poland, pay reparations assessed at 132 billion marks equivalent to 442 Billion USD in 2017. Many people at the time viewed the treaty as "too harsh" whilst others such as Ferdinand Foch the French Field Marshal saw it as too lenient saying "This is not a peace. It is an armistice for 20 years" for which he was all but a 3 months off."
    endsieg_news.20.a: "Give it to those Huns!"
    endsieg_news.21.t:0 "The Armistice of Compiègne"
    endsieg_news.21.d:0 "German representatives have agreed to an armistice with the Allied powers. The guns on the western front are to fall silent under terms requiring German withdrawal and the surrender of military equipment, while the wider peace remains to be negotiated."
    endsieg_news.21.a:0 "The fighting has stopped."
    endsieg_news.22.t:0 "A Monarchy Proclaimed in Northern Portugal"
    endsieg_news.22.d:0 "Portuguese monarchists have proclaimed the restoration of the crown in Porto under the leadership of Paiva Couceiro. Their challenge to the republic has opened a new struggle for authority, with the extent of support beyond the north still uncertain."
    endsieg_news.22.a:0 "Portugal faces another political struggle."
    endsieg_news.23.t: ""
    endsieg_news.23.d: ""
    endsieg_news.23.a: ""
    endsieg_news.24.t: "Banat Republic Proclaimed"
    endsieg_news.24.d: " The Banat Republuc was a short-lived state proclaimed in Timişoara on November 1, 1918, the day after the dissolution of the Austro-Hungarian Empire. Recognized only by Hungary, the republic was invaded by the army of neighboring Serbia on November 15. The next year, its territory was divided primarily between the Kingdom of Serbs, Croats and Slovenes and Romania."
    endsieg_news.24.a: "Interesting"
    endsieg_news.25.t: "Czechoslovakia Declares Independence"
    endsieg_news.25.d: "As the Austro-Hungarian monarchy was slowly collapsing, the Foreign Minister Baron Istvan Bruain von Rajecz asked for an armistice that was based on the Fourteen Points to which Woodrow Wilson demanded the nationalities of the empire have the “freest opportunity to autonomous development”. Whilst Emperor Charles I issued a proclamation two days later which would alter the structure of the monarchy drastically and turn the Empire into a federal union, on the same day, the Czechoslovak provisional government joined the allies and began drafting a Declaration of Independence on October 13 which was completed on 16 October and finally publically published in Paris on 18 October when Czechoslovak independence was declared."
    endsieg_news.25.a: "The Empire falls apart"
    endsieg_news.26.t: "Martin Declaration"
    endsieg_news.26.d: "The Martin Declaration was proclaimed in Martin, Slovakia on 30 October, 1918. It was a declaration of independence from the Kingdom of Hungary and unified Slovakia with the Bohemian Crownlands which made Czechoslovakia. Although some Slovak representatives argued for autonomy for Slovakia and for the country to have its own devolved assembly it was rejected by the Czech government. The Slovaks soon found themselves being rather relegated to the status of a national minority."
    endsieg_news.26.a: "Interesting"
    endsieg_news.27.t: "Aster Revolution"
    endsieg_news.27.d: "Led by Count Mihaly Karolyi who established the social democratic Hungarian National Council which demanded the secession of Hungry from the Austro-Hungarian Empire. With the support of soldiers of the Honved in the early morning of 31 October, 1918, HNC protesters wore aster flowers and helped seize public buildings throughout Budapest. By the end of the day King Charles IV  (I of Austria) reluctantly accepted the coup and the First Hungarian Republic was founded with the Austro-Hungarian Empire being de facto dissolved."
    endsieg_news.27.a: "The Empire falls apart"
    endsieg_news.28.t: "Romania Advances up to Demarcation Line"
    endsieg_news.28.d: "Following the Romanian request, the Allied Command in the East under leadership of the French allowed the Romanian Army to advance up to the line of the Western Carpathians and in the direction of Cluj where they arrived by December 24. By January 22, 1919, the Romanian Army controlled the entire territory up to this demarcation line."
    endsieg_news.28.a: "Hopefully this Transylvanian ordeal ends peacefully..."
    endsieg_news.29.t: "Proclomation of Western Ukranian Republic"
    endsieg_news.29.d: "The West Ukranian People's Republic was proclaimed on NOvember 1, 1918, shortly following the proclomation of the republic a popular uprising took place in the city of Dezarus (Now Lviv), where most residents were Polish and did were surprised to find themselves in a non-Polish state whilst the rural region was majority Ukrop."
    endsieg_news.29.a: "Ok"
    endsieg_news.30.t: "Proclomation of Hutsul Republic"
    endsieg_news.30.d: "The Hutsul Republic was declared on January 8, 1919 when the local population of Rakhiv rose against the Hungarian gendarme battalion and took in custody 500 Hungarian policemen. The region was classified as a de facto breakaway state from the Czechoslovakian Carpathian Ruthenia."
    endsieg_news.30.a: "Ok"
    endsieg_news.31.t: "Proclomation of Komancza Republic"
    endsieg_news.31.d: "The Komancza Republic was an association of thirty Lemko villages that were based around Komancza in eastern Lemkivshchyna formed on November 4, 1918. It was a pro-Ukranian state and planned to eventually unite with the West Ukranian People's Republic but was supressed by the Polish government."
    endsieg_news.31.a: "Ok"
    endsieg_news.32.t: "Declaration of Lemko Republic"
    endsieg_news.32.d: "On December 5, 1918, the Lemko Rusyn Republic declared independence, it was centered on Florynka, a village in the south-east of present-day Poland and was highly Russophile and opposed a union with the West Ukranian People's Republic and instead sought unification with a democratic russia."
    endsieg_news.32.a: "Ok"
    endsieg_news.33.t: "Polish-Ukranian War"
    endsieg_news.33.d: "The Polish Ukrainian war started on the 1st of November 1918 lasting to the 17th of July the following year over the complicated issue of Galicia. Due to a complicated history in Galicia under the rule of the Habsburgs for many years, a national identity of Ukrainians was developed over time to counter Polish autonomy demands. After the de facto dissolution and collapse of the Austro-Hungarian government in October of 1918 two regiments consisting largely of Ukrop’s in an effort to unite the West Ukrainian lands within the former Austro-Hungarian Empire took control of the cities of Lviv proclaiming it as their capital. The Polaks which had been a majority in the city were shocked to be in a Ukrainian state and eventually fighting began between Ukrainian and Polish forces mainly concentrated around the city of Lviv."
    endsieg_news.33.a: "Ok"
    endsieg_news.34.t:0 "The Ukrainian Hetmanate Falls"
    endsieg_news.34.d:0 "Pavlo Skoropadsky's government has collapsed as forces supporting the Directory take control in Kyiv. The loss of foreign support and the defection of troops have left the hetman's regime unable to resist its opponents."
    endsieg_news.34.a:0 "Ukraine changes hands once more."
    endsieg_news.35.t: "Soviet Forces Enter Ukraine"
    endsieg_news.35.d: "Soviet troops are advancing into Ukraine as German forces withdraw. The Ukrainian government rejects Moscow's claim to direct the region's future and is mobilizing to resist. Fighting is spreading across a country already divided by revolution and war."
    endsieg_news.35.a: "Ok"
    endsieg_news.36.t: "Soviet Westward Offensive"
    endsieg_news.36.d: "German troops are leaving the former imperial borderlands, and Red Army formations are moving west into the resulting power vacuum. In Belarus and the Baltic region, newly formed governments are trying to hold territory and organize their armies. The frontier remains unsettled."
    endsieg_news.36.a: "Ok"
    endsieg_news.37.t: "Polish-Soviet War"
    endsieg_news.37.d: "Polish and Soviet forces are clashing along a frontier that neither government recognizes as settled. The Red Army is pushing west while Poland moves to secure the territories between Warsaw and the former Russian heartland. Both sides are sending reinforcements as the border fighting grows."
    endsieg_news.37.a: "Ok"
    endsieg_news.38.t: "Lithuanian-Soviet War"
    endsieg_news.38.d: "The Red Army is advancing into Lithuania behind withdrawing German garrisons. Lithuania's provisional government is assembling troops to defend its independence, while Soviet commanders seek control of the eastern approaches to Kaunas and Vilnius."
    endsieg_news.38.a: "Ok"
    endsieg_news.39.t: "Estonian War of Independence"
    endsieg_news.39.d: "Soviet forces have crossed into Estonia near Narva. The Estonian provisional government is calling volunteers to defend the republic as German occupation troops withdraw. The fighting threatens the routes toward Tallinn and Tartu."
    endsieg_news.39.a: "Ok"
    endsieg_news.40.t: "Latvian War of Independence"
    endsieg_news.40.d: "Soviet troops are moving into Latvia as German forces pull back. Latvia's provisional government is raising an army to hold Riga and the western provinces, while rival armed groups contest control of the country."
    endsieg_news.40.a: "Ok"
    endsieg_news.41.t:0 "The Division of the Banat"
    endsieg_news.41.d:0 "Romania and Yugoslavia are dividing the Banat between them. Their settlement ends the region's brief attempt to establish a separate authority, leaving communities of several nationalities within the new frontiers."
    endsieg_news.41.a:0 "Another border emerges from the war."
    endsieg_news.42.t:0 "Bloodshed in Buenos Aires"
    endsieg_news.42.d:0 "A labour dispute in Buenos Aires has escalated into street fighting and a violent crackdown. Police, troops and armed civilian groups have become involved as workers' demonstrations spread through the city, leaving many dead and wounded."
    endsieg_news.42.a:0 "A terrible week for the city."
    endsieg_news.43.t: "Kronstadt Rebellion"
    endsieg_news.43.d: "The Kronstadt rebellion which started on March 7th, 1921, was a major uprising on Kotlin Island, Kronstadt a naval fortress, against the Bolsheviks in March 1921. It consisted mainly of Russian sailors, soldiers, and civilians, and was caused by Lenin’s reason to loosen control of the Russian economy (New Economic Policy). However the rebellion was largely unsuccessful and crushed after a 12 day military campaign that resulted in roughly 3-4 thousand deaths total."
    endsieg_news.43.a: "Ok"
    endsieg_news.44.t: "Whites Win"
    endsieg_news.44.d: "After a long and brutal civil war in Russia, it has finally ended with the defeat of the Bolshevik Red Movment. However the fight is still far from over, the white movement is very divided amongst itself and there is much yet to do to before Russia can be considered stable again."
    endsieg_news.44.a: "Ok"
    endsieg_news.46.t:0 "The Reds Prevail in Russia"
    endsieg_news.46.d:0 "The White movement's organised resistance has collapsed, leaving the Soviet government victorious in the struggle for Russia. The intervention and assistance of foreign powers have failed to overturn the revolution, and a devastated country now confronts the work of reconstruction."
    endsieg_news.46.a:0 "A new order has survived."
    endsieg_news.45.t: "Far Eastern Republic Declared"
    endsieg_news.45.d: "The Far Eastern Republic (FAR) was established following the aftermath of the Russian Civil War. Whilst the area was under the control of the White Siberian government led by Kolchak, following the evacuation of Japanese and white forces a political vacuum ensued in the region. A new central authority was established at Chita to govern the FAR. It was viewed as a temporary buffer state between the Russian SFSR and the territories still occupied by Japan and the allies. However by April 1920 American forces evacuated Siberia leaving Japan the sole occupying power. The Bolsheviks viewed the FAR as a sort of Treaty of Brest-Litovsk in the east with the FAR providing the regime breathing space to allow it to recover economically and militarily acting as a buffer state with Japan. Japan eventually recognized the new buffer state in a truce with the Red Army signed 15 July 1920."
    endsieg_news.45.a: "Ok"
    endsieg_news.47.t: "Coup in Far Eastern Republic"
    endsieg_news.47.d: "On 26 May, 1921, a white coup backed by Japanese occupying forces took place in Vladivostok in which a provisional government was proclaimed. It prevented unsuccessfully to rally anti-Bolshevik forces and following the Japanese evacuation starting June 1922 the Whites found themselves isolated."
    endsieg_news.47.a: "Ok"
    endsieg_news.48.t: "Japanese Evacuate Siberia"
    endsieg_news.48.d: "The Japanese hoped for a while to establish a buffer state/puppet between the Russian SFSR and themselves from fear of communism and personal interests. However after all of the allies evacuated and left Japan was left alone and was soon after pressured by the Allied Powers to evacuate as well which they did following June 1922. Communists take over FAR \n\nAs the Japanese Forces evacuated the Far Eastern Republic, the Red Army disguised as the Army of the FAR approached and re-established the communist regime and retook Vladivostok on 25 October 1922 which effectively brought the Russian Civil War to a close."
    endsieg_news.48.a: "Ok"
    endsieg_news.49.t: "Far Eastern Republic Reintegrated into RSFSR"
    endsieg_news.49.d: "With the Civil War finally over the Russian SFSR absorbed the FAR on 15 November 1922. The government of the Far Eastern Republic dissolved itself and transferred all its authority and territory to the Bolshevik government in Moscow. However Japan still retained the northern half of Sakhalin Island until 1925."
    endsieg_news.49.a: "Ok"
    endsieg_news.50.t: "First Congress of the Comintern"
    endsieg_news.50.d: "The First Congress of the Comintern was an international gathering of communist, revolutionary, and syndicalist delegates which was held in Moscow and officially established the Communist International, also known as the COmintern. The gathering held from March 2 to 6, 1919, was attended by 51 representatives of more than two dozen countries from around Europe, North America, and Asia."
    endsieg_news.50.a: "Ok"
    endsieg_news.51.t: "Alexander I of Greece Dies"
    endsieg_news.51.d: "On October 2, 1920, King Alexander while trying to separate a barbary macaque monkey attacking his German Shepherd Dog got in the process bit deeply in the leg and torso by another monkey. The king did not consider the incident serious and his wounds were promptly cleaned and dressed. However in the evening his wounds became infected and he gained a strong fever and septicemia set it. His doctors considered amputating his leg but nobody wanted to take responsibility for such a drastic act. 23 days later on October 25, 1920, Alexander died of sepsis and his body was conveyed to Athens Cathedral."
    endsieg_news.51.a: "May he rest in peace..."
    endsieg_news.52.t: "Constantine I Returns to Power"
    endsieg_news.52.d: "A Referendum on the return of King Constantine I was held in Greece on the 22nd of November 1920, it followed the death of his son, King Alexander. The Proposal was happily approved by 99.0% of the voters. The result ensured and affirmed the dominance of the Anti-Venizelist camp in the country."
    endsieg_news.52.a:0 "The frontier is being contested by force."
    endsieg_news.53.t:0 "An Uprising in Greater Poland"
    endsieg_news.53.d:0 "Polish insurgents have risen against German authority in Greater Poland. Their advance has made control of the region an immediate question for the governments attempting to settle the postwar frontier."
    endsieg_news.53.a: "Ok"
    endsieg_news.54.t: "German's Scuttle Fleet at Scapa Flow!"
    endsieg_news.54.d: "The Scuttling of the German fleet took place at the Royal Navy's base at Scapa Flow, Scotland. Following the end of the First World War the German High Seas Fleet was interned tehre under the terms of Compiegne Armistice whilst negotiations took place over the fate of the ships. Fearing that all of the ships would be seized and divded amongst the allied powers, the German Admiral, Ludwig von Reuter, decided to make the ultimate decision and scuttle the whole fleet which was carried out on June 21 1919 just ast he decision was made in Versaille on their fate. 52 of the 74 vessels sank and ultimately it was a last German victory over the allies."
    endsieg_news.54.a: "Waste of good steel!"
    endsieg_news.55.t:0 "A Bloody Night in Lisbon"
    endsieg_news.55.d:0 "Armed revolt in Lisbon has been accompanied by the murder of leading political figures, including António Granjo. The killings have deepened the republic's crisis and left the capital struggling to restore order."
    endsieg_news.55.a:0 "Portugal mourns another night of violence."
    endsieg_news.56.t: "Prohibition Comes Into Effect"
    endsieg_news.56.d: "The U.S. Senate proposed the Eighteenth Amendment on December 18, 1917. On November 18, 1918, prior to ratification of the Eighteenth Amendment, the U.S. Congress passed the temporary Wartime Prohibition Act, which banned the sale of alcoholic beverages having an alcohol content of greater than 1.28%. (This act, which had been intended to save grain for the war effort, was passed after the armistice ending World War I was signed on November 11, 1918.) Upon being approved by a 36th state on January 16, 1919, the amendment was ratified as a part of the Constitution."
    endsieg_news.56.a: "Ok"
    endsieg_news.57.t: "U.S. Senate Refuses to Ratify Versaille Treaty"
    endsieg_news.57.d: "The United States Congress refused to ratify the treaty and opposed it specifically regarding the League of Nations section as it was argued that the U.S. would be giving up too much power under the League of Nations and Senate Majority Leader Henry Cabot Lodge in turn drafted 14 reservations-to match Wilson’s 14 points-that reduced the ctron the league would have over the U.S. There was also a faction within the Senate that opposed the Treaty with or without reservations. Whilst the Senate continued to consider the treaty, a two-hour passionate speech was given by Henry Borah in which he declared that by agreeing to the treaty, “We have forfeited and surrendered, once and for all, the great policy of ‘no entangling alliances’ upon which the strength of this Republic has been founded for one hundred fifty years.”"
    endsieg_news.57.a: "Ok"
    endsieg_news.58.t:0 "Kolchak Executed at Irkutsk"
    endsieg_news.58.d:0 "Admiral Alexander Kolchak has been executed by the revolutionary authorities at Irkutsk alongside Viktor Pepelyayev. The former Supreme Ruler's death leaves the eastern White movement without its most prominent political leader as its forces continue to retreat."
    endsieg_news.58.a:0 "The eastern Whites have lost their leader."
    endsieg_news.59.t:0 "The White Retreat across Siberia"
    endsieg_news.59.d:0 "The remnants of the eastern White armies are retreating through Siberia with refugees and their families. Severe cold, exhaustion and failing supplies are taking a heavy toll on the columns pursued by the Red Army."
    endsieg_news.59.a:0 "A desperate march through the winter."
    endsieg_news.60.t: "Irish War of Independence"
    endsieg_news.60.d: "The Irish War of independence starting on January 21, 1919 was fought between the Irish Republican Army and the British security forces in Ireland and was an escalation of the Irish revolutionary period into armed conflict. After Sinn Fein won a landslide victory in Ireland in december of 1918 they formed a breakaway government on January 21st 1919 and declared independence from Britain. Later that day two members of the armed police force were shot dead in County Tipperary by IRA members acting on their own initiative which was the beginning of the conflict. The conflict later intensified about the British government outlawed the Dail and Sinn Fein. The IRA began ambushing RIC and British Army patrols, attacking their barracks and forcing isolated barracks to be abandoned."
    endsieg_news.60.a: "Ok"
    endsieg_news.61.t: "Anglo-Irish Treaty"
    endsieg_news.61.d: "The Anglo-Irish Treaty was an agreement between Britain and Ireland that concluded the Irish War of Independence establishing the Irish Free State as a self-governing dominion. It also provided Northern Ireland an option to opt out of the Irish Free State which was exercised. Required by the terms the agreement was ratified by ‘a meeting’ of the members elected to sit in the House of Commons of Southern Ireland. However in Reality Dail Eireann first debated then ratified the treaty; members then went ahead with the ‘meeting’. However the treaty was narrowly ratified which caused a split and led to the Irish Civil War."
    endsieg_news.61.a: "Peace at last"
    endsieg_news.62.t: "Irish Civil War"
    endsieg_news.62.d: "The Irish Civil War followed the Irish War of Independence after a split was created between those who wanted the Anglo-Irish treaty ratified and those who did not or the Irish republicans and Irish nationalists. The Republican opposition saw it as a betrayal of the Irish Republic and many who fought in the conflict were members of the IRA during the war of independence. The Pro-Treaty forces were supplied by the British Government and in the end the conflict claimed more lives than the war of independence and left the Irish society divided and embittered for generations."
    endsieg_news.62.a: "The struggle continues"
    endsieg_news.63.t: "Egyptian Revolution"
    endsieg_news.63.d: "The Egyptian Revolution (1919) was a countrywide revolution in Egypt against British occupation of Egypt and Sudan. It was carried out by Egyptians Sudanese in the wake of British-ordered exile of revolutionary leader Saad Zaghlul and other members of the Wafd Party in 1919. The revolution eventually led to Britain’s recognition of Egyptian independence in 1922 and implementation of a new constitution in 1923 but it refused to recognise full Egyptian sovereignty over Sudan and to withdraw its forces from the Suez Canal Zone. Although it did not grand Egypt full independence and sovereignty was greatly restricted by the ‘reserved points’ clause."
    endsieg_news.63.a: "Ok"
    endsieg_news.64.t:0 "The United Baltic Duchy Dissolved"
    endsieg_news.64.d:0 "The United Baltic Duchy has ceased to function as German support withdraws from the region. Estonian and Latvian authorities are asserting their independence in its place, while rival forces continue to contest the Baltic settlement."
    endsieg_news.64.a:0 "The German-backed settlement unravels."
    endsieg_news.65.t:0 "The Latvian-Soviet Treaty of Riga"
    endsieg_news.65.d:0 "Latvian and Soviet representatives have signed a peace treaty in Riga. Soviet Russia recognises Latvia's independence, bringing their armed struggle to a formal end and giving the new republic a diplomatic foundation for its sovereignty."
    endsieg_news.65.a:0 "Latvia has secured a peace."
    endsieg_news.66.t:0 "Estonia and Soviet Russia Sign at Tartu"
    endsieg_news.66.d:0 "Estonia and Soviet Russia have concluded a peace treaty at Tartu. The agreement recognises Estonian independence and settles outstanding claims, marking an important step for a republic seeking security after its war of independence."
    endsieg_news.66.a:0 "Estonia has won recognition."
    endsieg_news.67.t:0 "Lithuania and Soviet Russia Conclude a Treaty"
    endsieg_news.67.d:0 "Lithuania and Soviet Russia have signed an agreement in Moscow. Soviet recognition of Lithuanian independence accompanies arrangements concerning neutrality and military passage, bringing another diplomatic settlement to the unsettled eastern frontier."
    endsieg_news.67.a:0 "Another state secures recognition."
    endsieg_news.68.t: "Assasination of Amir Haabibullah"
    endsieg_news.68.d: "Emir Habibullah was assasinated while on a hunting trip at the Laghman Province on February 20, 1919. His brother Nasrullah Khan who was behind the assasination briefly succeeded him as the Emir of Afghanistan and held power for a week between February 21 and February 28, 1919, before being ousted and imprisoned by Habibullah's third son, Amanullah Khan."
    endsieg_news.68.a: "Tragic"
    endsieg_news.69.t: "Third Anglo-Afghan War"
    endsieg_news.69.d: "The Third Anglo-Afghan war began on May 6, 1919, following Amir Habibullah’s assassination and his son’s subsequent rise to power whom needed a way to placate the conservatives in Afghanistan to hold on to power. Looking for a diversion from the internal strife and sending civil unrest in India, Amanullah decided to invade British India."
    endsieg_news.69.a: "Ok"
    endsieg_news.70.t: "Anglo-Afghan Treaty"
    endsieg_news.70.d: "The Anglo-Afghan Treaty of 1919 was an armistice between the UK and Afghanistan following the end of the Third Anglo-Afghan war. In the document the United Kingdom recognised Afghanistan's independence and agreed that British India would not extend past the Khyber Pass and stopped British subsidies to Afghanistan."
    endsieg_news.70.a: "Ok"
    endsieg_news.71.t: "League of Nations Founded"
    endsieg_news.71.d: "The League of Nations founded on the 10 January, 1920 as a result of the Paris Peace Conference following the end of WWI. The diplomatic philosophy behind the League was a fundamental shift from the previous hundred years, however the League lacked its own armed forces and depended heavily on the Great Powers to enforce its resolutions whom were usually reluctant to do so. In the end the League as Mussolini put it “is very well when sparrows shout, but no good at all when the eagles fall out.”, being largely useless in maintaining world peace. Though it had some notable successes it was ultimately proved incapable of preventing aggression by the Axis powers in the 30’s and once WWII started the League failed its primary purpose to prevent any future World War."
    endsieg_news.71.a: "A great foundation for eternal peace!"
    endsieg_news.72.t: "First Non-Stop Transatlantic Flight"
    endsieg_news.72.d: "British aviators John Alcock and Arthur Brown made the first non-stop transatlantic flight in June of 1919 flying a modified WWI Vickers Vimy bomber from St. John’s, Newfoundland to Clifden, Connemara, County Galway, Ireland. A small amount of mail was additionally carried on the flight making it also the first transatlantic airmail flight, following their success the two aviators were awarded the honour of Knight Commander of the Most Excellent Order of the British Empire a week later by King George V at Windsor Castle."
    endsieg_news.72.a: "A new record!"
    endsieg_news.73.t: "Faisal-Weizmann Agreement"
    endsieg_news.73.d: "The Faisal-Weizmann Agreement was signed on 3 January 1919, by Emir Faisal who was for a short time the King of Syria in 1920 and Chaim Weizmann the president of the World Zionist Organization. It was a short-lived agreement for Arab-Jewish cooperation on the development of a Jewish homeland in Palestine and an Arab nation in a large part of the Middle East."
    endsieg_news.73.a: "Ok"
    endsieg_news.74.t: "Covenant of the League of Nations"
    endsieg_news.74.d: "The Covenant of the League of nations was signed 28, June 1919 and was the charter of the League of Nations. Eraly drafts for the possible LoN began even before WWI and proposals were adopted by the British LoN society in 1915. A commission was appointed during the Paris Peace Conference to agree on a covenant however many of the nations were split on how the League would exactly work, the U.S. in general was objected as they did not want to be obligated to defend another league member internationally and whilst France wanted the league to form an international Army Britain worried it would be dominated by the French."
    endsieg_news.74.a: "For world peace!"
    endsieg_news.75.t: "1920 Palestine Riots"
    endsieg_news.75.d: "The 1920 Palestine Riots took place between Sunday 4, Wednesday 7, April 1920 around the Old City of Jerusalem. In total five Jews and four Arabs were killed in the process with several hundred being injured. The riots came shortly after the battle of Tel Hai and increasing pressure on Arab nationalists in Syria in the course of the Franco-Syrian war."
    endsieg_news.75.a: "Unfortunate"
    endsieg_news.76.t: "Smyrna in Flames!"
    endsieg_news.76.d: "A great fire has reduced much of the port city of Smyrna to ashes as a result of the Greco-Turkish war. Eyewitness reports state that the fire had begun on September 13th (1922) and has since been extinguished on the 22nd. The city had been controlled for three years by the Greek national army until it was taken back recently by the Turkish army on the 9th of September 1922 effectively ending the war. Reports of Greek and Armenian refugees crammed into the waterfront under harsh conditions were abound, it has also been reported that atrocities have been committed by the Turkish armed forces, including but not limited to the rape of women and massacres of the refugees."
    endsieg_news.76.a: "Grab a bucket!"
    endsieg_news.77.t: "Treaty of Rapallo"
    endsieg_news.77.d: "The Treaty of Rapallo has been signed to solve a dispute over territories of the former Austrian Littoral, Upper Adriatic, and Dalmatian regions. The treaty was signed on the 12 of November 1920 in Rapallo near Genoa, Italy. Tension between Italy and Yugoslavia rose to a high at the end of The Great War, when the Austro-Hungarian Empire dissolved and Italy claimed the territories assigned to it by the secret London pact of 1915. According to the pact, signed in London on the 26th of April 1915, by the Kingdom of Italy, The United Kingdom, France and the Russian Empire, in case of victory at the end of The Great War, Italy was to obtain several territorial gains including Zara and Sebenico."
    endsieg_news.77.a: "Alright"
    endsieg_news.78.t: "English Archeologists Find Entrance to Tutankhamun's Tomb"
    endsieg_news.78.d: "In 1915, George Herbert, 5th Earl of Carnarvon, the financial backer of the search for and the excavation of Tutankhamun's tomb in the Valley of the Kings, employed English archaeologist Howard Carter to explore it. After a systematic search, Carter discovered the actual tomb of Tutankhamun (KV62) in November 1922."
    endsieg_news.78.a: "Great Discovery!"
    endsieg_news.79.t: "Dawes Plan"
    endsieg_news.79.d: "The Dawes Plan was an attempt in 1924 to solve the reparations problem Germany had to pay after WWI, which was bedeviled in international politics and the Treaty of Versaille. The occupation of the Ruhr industrial area by France and Belgium contributed to the hyperinflation crisis in Germany because it disabled the German economy effectively. The plan provided for an end to Allied occupation and a staggered payment plan for Germany’s payment of war reparations. Because the plan resolved a serious international crisis, Dawes shared the Nobel Peace Prize in 1925 for his work. However it was only an interim measure and was eventually proved unworkable and was later replaced by the Young Plan in 1929."
    endsieg_news.79.a: "Good idea"
    endsieg_news.80.t: "First Aerial Circumnavigation"
    endsieg_news.80.d: "The first aerial circumnavigation of the world was conducted in 1924 by a team of aviators of the United States Army Air Service (precursor to the U.S. Air Force). The trip took 175 days, covering over 44,342 kilometers. "
    endsieg_news.80.a: "Another record broken!"
    endsieg_news.81.t: "Etna Erupts!"
    endsieg_news.81.d: "For the first time since 1669, a population centre has been destroyed due to a recent eruption by the sicilian volcano Mount Etna. The eruption started high on the volcano’s northeast flank on November 2nd. Then new eruptive fissures opened at decreasing elevations down the flank of the volcano. The third and most vigorous of these fissures opened late on the 4th of November at an unusually low elevation, approximately 1,200 meters above sea-level according to local geologists, the village of Mascali was almost completely destroyed except for a church and a few surrounding buildings in the north part of the village."
    endsieg_news.81.a: "Lets hope for minimal destruction"
    endsieg_news.82.t: "Great Kanto Earthquake"
    endsieg_news.82.d: "A large earthquake has struck the Japanese main island devastating Tokyo, the port city of Yokohama, and the surrounding prefectures of chiba, kanagawa, and shizuoka. Widespread damage has been reported throughout the region. Its force was so great that the Great Buddha statue weighing 93 short tons moved almost two feet. Information on casualties are still being reported, the current estimate being around 142,800 dead."
    endsieg_news.82.a: "The earth rumbles beneath Tokyo"
    endsieg_news.83.t: "Abdulmecid II Elected as Caliph"
    endsieg_news.83.d: "Although the Ottoman Sultanate was abolished officially on November 1, 1922, the Caliphate still remained intact for the time being and the Crown Prince, Abdulmecid, was elected Caliph by the Turkish National Assembly based in Ankara. He established himself later in Constantinople of November 24, 1922."
    endsieg_news.83.a: "Ok"
    endsieg_news.84.t: "Haiyuan Earthquake"
    endsieg_news.84.d: "The Haiyuan earthquake occurred on December 16, 1920, in Haiyuan County, Ningxia Province, Republic of China. The quake hit at a magnitude of 7.8 and by reports caused “total destruction (XII (Extreme)”. Over 73,000 were killed in Haiyuan County and a landslide buried the village of Suhiaje in Xiji County. More than 30,000 people were killed in Guyuan County and almost all houses collapsed in the cities of Longde and Huining. The quake was felt from the Yellow Sea to Tsinghai and even more Inner Mongolia."
    endsieg_news.84.a: "Lets hope for minimal damage"
    endsieg_news.85.t: "First Meeting of the League of Nations"
    endsieg_news.85.d: "The Plenary Meetings of the First Assembly of the League of Nations were held from the 15th of November to the 18th of December in Geneva, Switzerland. At the opening of the session, there were 41 states (out of 42 member states). Six states were admitted during the meetings and consequently were represented during the session (Albania, Austria, Bulgaria, Costa Rica, Finland and Luxembourg). In total, thirty one plenary meetings were held. The principal questions during the first session regarded such things as: the organization of the Secretariat, the admission of new member states, relations between the Council and the Assembly and the Issues of the Polish-Soviet war and the repatriation of prisoners of war."
    endsieg_news.85.a: "A path for a peaceful future!"
    endsieg_news.86.t: "Geneva Protocol"
    endsieg_news.86.d: "The Geneva Protocol, drafted and signed June 17, 1925 was a protocol for the prohibition of the use of war of asphyxiating, poisonous or other gases, and of bacteriological methods of warfare. It effectively prohibited the use of chemical and biological weapons in international armed conflicts and was eventually registered in the League of Nations Treaty Series on 7 September, 1929. However whilst it prohibits the use of in general chemical and or biological weapons it had nothing to say about the production, storage, or transfer of this which was only covered in later treaties."
    endsieg_news.86.a: "No more chemicals warfare!"
    endsieg_news.87.t: "Flooding of the Rhine"
    endsieg_news.87.d: "Flooding of the Rhine river struck Cologne; 50,000 were forced to evacuate their homes. The river overflowed its naturla banks as far as two miles on each side and the entire country side has been turned into waste as thoroughly as by the years of war. Dozens of villages bordering on the stream are completely submerged not even their roofs showing above surface."
    endsieg_news.87.a: "Lets hope the water lowers soon!"
    endsieg_news.88.t: "Mussolini Assassination Attempt Failed"
    endsieg_news.88.d: "On 7 April 1926, Mussolini survived a first assassination attempt by Violet Gibson who shot him in the head but Mussolini managed to turn just in time and it passed through his nose. She faced no charges and was deported on charges of being mentally ill."
    endsieg_news.88.a: "We are glad he is okay! (Maybe)"
    endsieg_news.89.t: "Mussolini Second Assassination Attempt"
    endsieg_news.89.d: "On 31 October 1926, 15-year-old Anteo Zamboni attempted to shoot Mussolini in Bologna. Zamboni was lynched on the spot. Mussolini also survived a failed assassination attempt in Rome by anarchist Gino Lucetti, and a planned attempt by the Italian anarchist Michele Schirru, which ended with Schirru's capture and execution."
    endsieg_news.89.a: "You alright Musso?"
    endsieg_news.90.t: "Roald Amundsen flies over North Pole"
    endsieg_news.90.d: "Accompanied by Lincoln Ellsworth, pilot Hjalmar Riiser-Larsen, and three other team members, Amundsen took two Dornier Do J flying boats, the N-24 and N-25, to 87° 44′ north. It was the northernmost latitude reached by plane up to that time. The aircraft landed a few miles apart without radio contact, yet the crews managed to reunite. The N-24 was damaged. Amundsen and his crew worked for more than three weeks to clean up an airstrip to take off from ice. They shovelled 600 tons of ice while consuming only one pound (400 g) of daily food rations. In the end, six crew members were packed into the N-25. In a remarkable feat, Riiser-Larsen took off, and they barely became airborne over the cracking ice. They returned triumphant when everyone thought they had been lost forever."
    endsieg_news.90.a: "Great accomplishment!"
    endsieg_news.91.t: "Sidney Reilly Executed"
    endsieg_news.91.d: "Sidney Reilly, commonly known as the 'Ace of Spies' was a British secret agent and allegedly spied for at least four different powers. He was involved ina thwarted operation to overthrow the Bolshevik regime in 1918 by attempting to assassinate Vladimir Lenin before the splot was uncovered (and was also later an inspiration for James Bond). In September 1925, undercover agents of the OGPU, successor to the Cheka, lured Reilly into Bolshevik Russia to meet with a supposed anti-Communist organization, Alexander Yakushev, an undercover Soviet agent recalled "The first impression of [Sidney Reilly] is unpleasant. His dark eyes expressed something biting and cruel; his lower lip drooped deeply and was too slick—the neat black hair, the demonstratively elegant suit.". Later after Reilly croseed the Finnish border the Soviets captured, transported, and interrogated him at Lubyanka Prison. While he was being interrogated the Soviets publicly claimed he was shot trying to cross the Finnish border. Later after the interrogation the order to kill Reilly came from Stalin directly and he was executed in a forest near Moscow."
    endsieg_news.91.a: "We can't get away with everything"
    endsieg_news.92.t: ""
    endsieg_news.92.d: ""
    endsieg_news.92.a: ""
    endsieg_news.93.t: "July 22 Athens Protest"
    endsieg_news.93.d: "On July 22, 1943, a massive protest took place in Axis-occupied Athens-Greece against the German plans to expand the Bulgarian occupation zone in Greek Macedonia which were needed due to the withdrawal of Italian troops from the Balkans which had forced the Germans to engage more Axis troops in garrison duties replacing the Italians which prompted Adolf Hitler to ask the Bulgarian government to extend its occupation zone to encompass additional territory in Serbia and Macedonia. Upon recieving the Greeks were infuriated and a protest strike began on July 13th which were very successful, some 400,000 people were involved and caused the extention of the occupation zone to be forever postponed."
    endsieg_news.93.a: "Interesting developments"
    endsieg_news.94.t: "Boris III dead!"
    endsieg_news.94.d: "Shortly after returning to Sofia from a meeting with Hitler, Boris III died of an apparently Heart failure on 28 August, 1943. It is believed the King was poisoned by the two German doctors who had attended him, one of them Hans Eppinger believe he found the same poison he had allegedly found two years prior in a postmortem examination of Ioannis Metaxas, a slow poison which takes week to do its work. Boris will be succeeded by his six-year-old son Simeon II under a regency council headed by Prince Kiril of Bulgaria."
    endsieg_news.94.a: "May he rest in peace"
    endsieg_news.95.t: "Gran Sasso Raid"
    endsieg_news.95.d: "On 12 September, 1943, Benito Mussolini who was being held at the Campo Imperatore Hotel 'secretely', was rescued in a daring operation led by Otto Skorzeny in which not even one shot was fired by either side and there were no casualties. Skorzeny was reported to have said after formally greeting Mussolini 'Il Duce, the Führer has sent me to set you free!' to which Mussolini replied 'I knew my friend would not forsake me!'. Mussolini was then flown safely to Vienna. It is safe to say Otto Skorzeny is the most dangerous man in europe..."
    endsieg_news.95.a: "A daring raid indeed!"
    endsieg_news.96.t: "Italian Social Republic Founded!"
    endsieg_news.96.d: "After the Gran Sasso Raid with the rescue of Mussolini, Hitler forced the reluctant Mussolini into setting up a new Fascist state in Northern Italy called the Italian Social Republic. It claimed Rome as its capital but the de facto capital became the small town of Salo between Milan and Venice. The Italian Social Republic is little more than a puppet state dependent entirely upon Germany, anyone can see that now."
    endsieg_news.96.a: "The war shall go on"
    endsieg_news.97.t: "Italy Surrenders!"
    endsieg_news.97.d: "After the successful invasion of Sicily and the ousting of Benito Mussolini with the new government headed by Pietro Badoglio and Vitorio Emmanuel taking over, following secret negotiations with the allies to a secret armistice was signed on 3 September in Sicily and is now being officially announced. It is only a matter of time before the Italians who have publicly declared they would keep fighting alongside the Germans come into conflict with the Axis. But due to the time it has taken for the new Italian government to negotiate the armistice it should be assumed the Germans may be prepared to for this widespread defection that shall take place soon."
    endsieg_news.97.a: "They were weak from the start"
    endsieg_news.98.t: "Lebanon gains Independence"
    endsieg_news.98.d: "After the augmenting pressure of the Lebanese people the French government had finally yielded to their demands and has given Lebanon independence this morning of Monday NOvember 22, 1943. The first Lebanese flag was raised on 11 November 1943 in the residence of Hussein El Halabi."
    endsieg_news.98.a: "Alright"
    endsieg_news.99.t: "Moscow Delcarations"
    endsieg_news.99.d: "The Third Moscow Conference between the major allies of WWII took place on October 18 to November 11, 1943 at the Moscow Kremlin and Spiridnovka Palace. It was composed of major diplomats, ministers, and generals who had opnely discussed cooperation in the war effort and issued the four Moscow Declarations, a Declaration of the Four Nations on General Security, a Declaration on Italy, Declaration on Austria, and a Declaration on Atrocities."
    endsieg_news.99.a: "Ok"
    endsieg_news.100.t: "Mussolini Falls from Power!"
    endsieg_news.100.d: "On 25 July, 1943, Benito Mussolini has been voted out of power by his own Grand Council and arrested upon leaving a meeting with King Vittorio Emanuele who has told the Il Duce that the war is lost and has removed him as prime minister. The Il Duce has been reported to have barely reacted and have been groggy and unshaven objecting no nothing he is now to be moved to a secret area where he will be held prisoner until wars end"
    endsieg_news.100.a: "What a surprising turn of events!"
    endsieg_news.101.t: "Ploesti Bombed"
    endsieg_news.101.d: "Part of the oil campaign to deny petroleum-based fuel to the Axis powers the United States Army Air Forces based in Libya and South Italy had took part in a strategic bombing mission attempting to severely diminish the output of oil in Ploesti used to fuel the German forces. It ended up being one of the most costliest for the USAAF European Theatre and was the second-worst loss ever suffered by the USAAF on a single mission with the date reffered to as 'Black Sunday'."
    endsieg_news.101.a: "What horrible turnout"
    endsieg_news.102.t: "Rome Bombed!"
    endsieg_news.102.d: "The Bombing of Rome took place on 19 July, 1943 by 500 American bombers which had dropped roughly 1,168 tons of bombs. The bombing raid had destroyed nothing much of relevance with only a few military targets, however this bombing has been a wake up call for the Italians who are starting to slowly turn against the Il Duce."
    endsieg_news.102.a: "The Duce is done for!"
    endsieg_news.103.t: "Vatican Bombed!"
    endsieg_news.103.d: "The bombing of Vatican City occured on the evening of 5 November, 1943, when plains dropped bombs on the south-west sector of Saint Peter's Basilica causing considerable damage but no casualties."
    endsieg_news.103.a: "Oops"
    endsieg_news.104.t:0 "France Seeks an Armistice"
    endsieg_news.104.d:0 "German advances have brought the French government to seek an armistice after the fall of Paris. The news marks a decisive reversal on the western front, leaving France's allies to consider their position in a war transformed by German victory."
    endsieg_news.104.a:0 "The balance of the war has changed."
    endsieg_news.105.t:0 "White Victory in Finland"
    endsieg_news.105.d:0 "The White Finnish forces have prevailed in the civil war and established their authority over the country. The end of organised fighting leaves Finland to confront the divisions, losses and reprisals of a bitter internal struggle."
    endsieg_news.105.a:0 "Peace will not heal every wound."
    endsieg_news.106.t: "Siege of Leningrad Lifted!"
    endsieg_news.106.d: "The Siege of Leningrad which has lasted almost 2 and a half years was possibly one of the longest and most destructive sieges so far in history and the most costliest in terms of casualties with close to two million dead on the Soviet side. It is reported as the German armies have started to retreat they have taken their time to loot and destroy historical Palaces of the Tsars with their valuable art collections being moved to the heart of the Reich."
    endsieg_news.106.a: "The Soviet Steamroller pushes onwards"
    endsieg_news.107.t: "Operation Margarethe Carried Out!"
    endsieg_news.107.d: "After Hitler had found out about the discussions Miklos Horthy was having with the allies regarding an armistice, the German Führer, feeling betrayed by the Hungarians, ordered German troops to implement Operation Margarethe to capture critical Hungarian Fascilities on March 12, 1944. Hitler had invited Horthy to the palace of Klessheim in Austria and while they conducted their negotiations German forces quietly slipped into Hungary with the meeting being a mere ruse to keep Horthy out of the country and leave the army without orders."
    endsieg_news.107.a: "Quick and bloodless"
    endsieg_news.108.t: "East Prussia Falls"
    endsieg_news.108.d: "The Soviet Steamroller moves forward again taking East Prussia this time, finally in the German Heartland itself. The German people who had been living in East Prussia were unaware of the rapidly advancing Red Army due to the Endsieg Nazi propaganda which has hid the real state of military affairs."
    endsieg_news.108.a: "There is no hiding from defeat now!"
    endsieg_news.109.t: "Plot on Hitler Fails!"
    endsieg_news.109.d: "Today on July 20, 1944 a plot against the German Führer, Adolf Hitler which has took place inside his Wolf's Lair Headquarters has failed to kill him resulting in the failure of the attempted military coup which was aiming to make peace with the western Allies as soon as possible. It is without a doubt those who have conspired will pay a hefty price but we admire their bravery."
    endsieg_news.109.a: "The end is near for Germany"
    endsieg_news.110.t: "Hitler Dead!"
    endsieg_news.110.d: "The German Führer, Adolf Hitler has killed himself today in his Führerbunker. People around the world are celebrating at the news of this tyrant biting the dust at last, it is a shame to not see him go to trial and suffer the true humiliation however. \n\n With Hitler dead Admiral Donitz has officially taken over control of Germany and has made it clear that the war is perhaps far from over saying 'We fight on'."
    endsieg_news.110.a: "A Greek Tragedy"
    endsieg_news.111.t:0 "Red Victory in Finland"
    endsieg_news.111.d:0 "The Finnish Reds have defeated their opponents and taken control of the country. Their victory establishes a socialist government on Russia's northern frontier, while the memory of the civil war continues to divide Finnish society."
    endsieg_news.111.a:0 "Finland takes a revolutionary course."
    endsieg_news.112.t: "Mussolini's Latest Speech"
    endsieg_news.112.d: "Benito Mussolini has given a speech at the Teatro Lirico in Milan today on December 16, 1944 that may very well be his last. Although he maintains that new German weapons would turn the tide of the war, it seems to be clearly a political last will and testament as he tried to defend himself in the eyes of history and presented a dark picture of a Bolshevik Europe in the event of Allied victory as Allied forces enroach around the last remenants of the Axis."
    endsieg_news.112.a: "A powerful speech..."
    endsieg_news.113.t: "Horthy Negotiates With Allies!"
    endsieg_news.113.d: "The Regent of Hungary, Admiral Miklos Horthy has made it public through a radio broadcast today that he had already made a seperate peace with the Soviet Union which should officially withdraw Hungary from the war. It is not known as of yet how this will effect the German occupation of Hungary where fighting still continues."
    endsieg_news.113.a: "The Axis is falling apart"
    endsieg_news.114.t: "Warsaw Uprising!"
    endsieg_news.114.d: "Today the Poles in Warsaw with the ever so approaching Soviet Army have taken part in a nationwide plan with the main objectives of driving the Germans from the city and from there help the allies in the larger fight against the Nazi's. The second objective is to liberate Warsaw before the Soviets to underscore Polish sovereignty before the Soviet-backed communist government can assume control."
    endsieg_news.114.a: "Good luck to them"
    endsieg_news.115.t: "Horthy Removed From Power!"
    endsieg_news.115.d: "Hungary's leader, Regent Miklos Horthy has been removed from power by force after a group of special forces led by Otto Skorzeny have captured Horthy and his son taking them into custody and Horthy was forced to give up power at the threat of his sons life being taken. The Arrow Cross leader Ferenc Szalasi has taken over in Horthy's place and is to be continuing the war until the very end."
    endsieg_news.115.a: "Hungary fights on!"
    endsieg_news.116.t: "Black Baron Dead!"
    endsieg_news.116.d: "On 8 August 1944, Anglo-Canadian forces launched Operation Totalize. Under the cover of darkness, British and Canadian tanks accompanied by soldiers seized tactically important high ground near the town of Saint-Aignan-de-Cramesnil. Here they paused waiting for an aerial bombardment that would signal the next phase of the attack. unaware of the reason the Allied forces had halted, Kurt Meyer, of the 12th SS Hitlerjugend Division ordered elements of his command to counterattack and recapture the high ground. \n\n Panzer Ace Michael Wittmann, also known as the 'Black Baron' who had 135 confirmed tank kills, would lead a group of seven Tiger tanks supported by additional tanks and infantry. His group of tigers crossing an open terrain towards the high ground was ambushed by tanks from A Squadron 1st Northamptonshire Yeomanry, A Squadron Sherbrooke Fusilier Regiment, and B Squadron 144th Regiment Royal Armoured Corps. During the ambush, anti-tank shells - fired from either the British or Canadian tanks managed to penetrate the upper hull of Wittmann's tank igniting the ammunition. The resulting fire engulfed the tank and blew off the turret. The crew of the destroyed tank were then buried in an unmarked grave."
    endsieg_news.116.a: "May he rest in peace"
    endsieg_news.117.t: "Il Duce no more..."
    endsieg_news.117.d: "Benito Mussolini, the formerly feared fascist dictator of Italy has finally succumbed to his own ambitions and has been rightfully executed by partisans along with his lover Clara Petacci, both have been hanged publically for the Italian people to express their anger towards their former opressor by peeing or spitting on the corpses as they hang by their toes in the summer heat. Mussolini was apparently trying to escape death a second time, but luck was not on his decide and justice took its course."
    endsieg_news.117.a: "One less dictator"
    endsieg_news.118.t: "Tannu Tuva joins USSR"
    endsieg_news.118.d: "Tannu Tuva's parliament the Tuva's Small People's Khural, has recently made the decision to officially become part of the Soviet Union as the Tuvan Autonomous Oblast. The annexation will be officially formalized on 1st November, 1944."
    endsieg_news.118.a: "Alright"
    endsieg_news.119.t: "Risto Ryti Resigns"
    endsieg_news.119.d: "The Finnish president Risto Ryti has just today resigned and left office following a disastrous turn of events on the Finnish Front with the new Soviet Offensive breaking through to the Karelian Isthmus and much of the gains made in the previous years lost, his successor will be the popular general Carl Gustaf Emil (C.G.E) Mannerheim who very likely has an alternative plan than to continue this war."
    endsieg_news.119.a: "Alright"
    endsieg_news.120.t: "Lappland War Begins"
    endsieg_news.120.d: "Today Finland, shortly following their signing of the Moscow Armistice has started fighting German divisions in their country in an effort to push out the frantically fleeing German divisions from northern Finland."
    endsieg_news.120.a: "Interesting turn of events"
    endsieg_news.121.t: "Finland agrees to Armistice!"
    endsieg_news.121.d: "Today Finland has signed an Armistice with the Soviet Union and United Kingdom officially ending the Continuation War with the treaty restoring the Moscow Peace Treaty of 1940 with several modifications. It is not surprising seeing the turn of events with the new Soviet offensive pushing and breaking through into the Karelian isthmus earlier this year."
    endsieg_news.121.a: "The Axis is no more"
    endsieg_news.122.t: "Hitler Escapes!"
    endsieg_news.122.d: "The Third Soviet Shock Army's fears have come true, it appears the plane seen flying out of Berlin just before its capture had indeed had Hitler aboard who had escaped with the German Ace Pilot, Hannah Rietsch to continue the fight."
    endsieg_news.122.a: "Damn!"
    endsieg_news.123.t: "FDR Dies"
    endsieg_news.123.d: "The American president Franklin Delano Roosevelt has died today suffering from a cereberal hemorrhage, he will not see the war end perhaps but his contributions have been great. He will be succeeded by Vice President Truman."
    endsieg_news.123.a: "Tragic"
    endsieg_news.124.t: "Romania Declares War on Germany!"
    endsieg_news.124.d: "Following the collapse of the northeastern Romanian front in the face of a successful Soviet offensive King Michael daringly removed the government of Ion Antonescu which had previously been alligned with the Axis with the support of the army. This was quite unexpected from the Antonescu government which had previously considered the King not much more than a "figurehead"."
    endsieg_news.124.a: "The Axis is falling apart"
    endsieg_news.125.t:0 "A King Elected for Finland"
    endsieg_news.125.d:0 "Finland has elected Prince Frederick Charles of Hesse as its king. Supporters of the monarchy hope that a German prince will strengthen the new state's position, while opponents question the wisdom of placing its future so closely beside Germany."
    endsieg_news.125.a:0 "Finland has chosen a crown."
    endsieg_news.126.t:0 "Frederick Charles Renounces the Finnish Crown"
    endsieg_news.126.d:0 "Frederick Charles has renounced the Finnish throne without securing his position as king. His decision leaves Finland to reconsider the constitutional settlement adopted in the aftermath of its civil war."
    endsieg_news.126.a:0 "The crown has proved short-lived."
    #endsieg_news.127.t:0 "Titanic Sinks Four Hours After Hitting Iceburg"
    #endsieg_news.127.d:0 "The first news of the disaster to the Titanic was recieved by the Marconi wireless station at Cape Race 22:25 o'clock last night. The Titanic was first heard giving the distress signal 'C.Q.D.,' which was answered by a number of ships including Carpathia, the Baltic, and Olympic. The Titanic said she had struck and iceberg and was in immediate need of assitance. By 22:55 o'clock the Titanic reported she was sinking by the head. By 23:36 o'clock the Titanic informed the Olympic they were putting women off in boats and instructed the Olympic to have her boats ready to transfer passengers. The Titanic, during all this time, continued to give distress signals announcing her position. The last signals heard from the Titanic were received at 0:27 when the Virginian reported having heard a few blrred signals which ended abruptly. \n\n The Titanic foundered at about 2:20, so far 655 souls have been saved of the crew and passengers, most of the latter presumably women and children. Sources say 1,500 to 1,800 were still aboard the ship when it went down. J.J. Astor one of the richest men in the world and the richest on board is presumed to be dead with a many other notable elite figures. Captain Smith said to have gone down with the ship in her final moments along with ship designer Thomas Andrews while J. Bruce Ismay also called 'J. Brute Ismay' or the 'Coward of the Titanic' had deserted the ship while women and children were on board with many negative cartoons being published depicting him deserting the ship."
    #endsieg_news.127.a:0 "What an unimaginable disaster..."
    #endsieg_news.128.t:0 "Largest Ship in the World Launched"
    #endsieg_news.128.d:0 "The RMS Olympic, the first in a new class of superliners has started her Maiden Voyage gaining considerable worldwide attention from the press and public, it is said that as many as up to 10,000 are waiting spectate her arrival in New York. Whilst not a particularly fast ship traveling at most 22 knots the Olympic is mainly designed as a luxury ship with a swimming pool, gymnasum, turkish bath, a Veranda Cafe decorated with palm trees, and more."
    #endsieg_news.128.a:0 "Interesting"
    #endsieg_news.129.t:0 "Germany Surrenders, Victory in Europe!"
    #endsieg_news.129.d:0 "Today the definitive text for the German surrender of all forces was signed in Karlshorst, Berlin, the representatives of three armed services of the Oberkommando der Wehrmacht (OKW) and the Allied Expeditionary Force together with the Supreme High Command of the Red Army, with further French and U.S. representatives signing as witnesses. The first instrument of surrender was signed at Reis by Alfred Jodl who had unfortunately failed to negotiate better terms of surrender. However a few hours later the Soviet Union called for a unique surrender in Berlin were the seat of the German agression first sprung from, also making a point the surrender at Reims did not explicitly require German soldiers to law down their arms and give themselves up. Eisenhower then agreed and the definitive act of unconditional surrender for the German military was signed in berlin by Field-Marshal Wilhelm Keitl."
    #endsieg_news.129.a:0 "Hurrah!"
    endsieg_news.127.t: "Sweden Joins the Central Powers"
    endsieg_news.127.d: "The Kingdom of Sweden has officially joined the Central Powers today with Gustav V calling for a declaration of war on Russia and the Entente soon after. Although the inside deal that has swayed Sweden to Germany's side is rather unknown it is not far off from reality that the semi-autonomous Kingdom of Finland, a former region of the Swedish Empire is on the table."
    endsieg_news.127.a: "Interesting developments..."
    endsieg_news.128.t:0 "Romania Joins the Central Powers"
    endsieg_news.128.d:0 "Romania has entered the camp of the Central Powers. The decision brings a new partner to Berlin and Vienna and changes the strategic balance on the eastern approaches to the Balkans."
    endsieg_news.128.a:0 "A new alignment in the east."
    endsieg_news.129.t:0 "The Agadir Crisis"
    endsieg_news.129.d:0 "The dispatch of a German gunboat to Agadir has intensified the dispute over French influence in Morocco. Berlin is seeking compensation for France's expansion, bringing colonial ambitions and the rivalry of the European powers into a dangerous confrontation."
    endsieg_news.129.a:0 "Diplomats face another test."
    endsieg_news.130.t:0 "Germany Opens a Campaign through Switzerland"
    endsieg_news.130.d:0 "German forces are putting the Rupprecht Plan into effect with operations through Switzerland. The decision challenges Swiss neutrality and opens a new route towards France, carrying the European war into another country."
    endsieg_news.130.a:0 "Another neutral frontier is crossed."
    endsieg_news.131.t:0 "The Goeben and Breslau Reach Ottoman Waters"
    endsieg_news.131.d:0 "The German warships Goeben and Breslau have reached the Dardanelles after evading British pursuit in the Mediterranean. Their transfer to Ottoman service has become a diplomatic crisis, drawing Constantinople closer to Germany while the Entente demands explanations."
    endsieg_news.131.a:0 "The naval escape has political consequences."
    endsieg_news.132.t:0 "Germany Concentrates on the Eastern Front"
    endsieg_news.132.d:0 "The German high command has adopted the Kronprinz Plan, holding a defensive position against France while concentrating its principal effort against Russia. The strategy wagers the outcome of the wider war on a rapid decision in the east."
    endsieg_news.132.a:0 "The main blow falls eastward."
    endsieg_news.133.t:0 "German Forces Advance through Belgium"
    endsieg_news.133.d:0 "Germany has begun the campaign associated with the Schlieffen Plan, advancing through Belgium towards France. The violation of Belgian neutrality has brought condemnation abroad and sharpened the crisis facing the British government."
    endsieg_news.133.a:0 "The western offensive has begun."
    endsieg_news.134.t: "Albania Joins the Central Powers"
    endsieg_news.134.d:0 "Albania has aligned itself with Germany and Austria-Hungary. The agreement brings the Balkan state into the Central Powers' diplomatic camp, adding another uncertainty to a region already divided by rival claims."
    endsieg_news.134.a:0 "The war has taken another turn."
    endsieg_news.135.t:0 "The Maritz Rebellion"
    endsieg_news.135.d:0 "Manie Maritz and his supporters have taken up arms against the South African government. Their opposition to the campaign against German South West Africa has developed into open rebellion, reviving divisions left by the struggle between Boer republics and British rule."
    endsieg_news.135.a:0 "South Africa faces an internal conflict."
    endsieg_news.136.t: "Bulgaria Joins the Central Powers"
    endsieg_news.136.d:0 "Bulgaria has joined the Central Powers, bringing its territorial ambitions into alignment with Germany and Austria-Hungary. The decision threatens Serbia with pressure from another frontier and widens the conflict in the Balkans."
    endsieg_news.136.a:0 "The Balkan balance has changed."
    endsieg_news.137.t:0 "A Kingdom of Poland Proclaimed"
    endsieg_news.137.d:0 "Germany and Austria-Hungary have proclaimed a Polish kingdom in the territories taken from Russia. The promise of statehood offers a new political arrangement under their influence, while questions of borders, authority and military recruitment remain unresolved."
    endsieg_news.137.a:0 "A Polish state under wartime occupation."
    endsieg_news.138.t:0 "The Polish Oath Crisis"
    endsieg_news.138.d:0 "Large numbers of Polish legionaries have refused the oath required by the Central Powers. The dispute has brought Józef Piłsudski into confrontation with the authorities and exposed the limits of their promise to build a loyal Polish army."
    endsieg_news.138.a:0 "The promise of cooperation is breaking down."
    endsieg_news.139.t: "Lenin Sent to Russia on Armored Train"
    endsieg_news.139.d: "The Russian Revolutionary going by the name Vladimir Lenin has reportedly been allowed to pass into Germany from Switzerland to board an armored train where he is to be transfered through Sweden then through Russian Finland to Petrograd. Although quite odd for the Germans to do it seems their efforts more or less aim at destabilizng the Russian government rather than an act of kindness or sympathy for the Revolutionary..."
    endsieg_news.139.a: "Who is this Lenin?"
    endsieg_news.140.t:0 "The Lusitania Sunk"
    endsieg_news.140.d:0 "The passenger liner Lusitania has been sunk by a German submarine off the Irish coast, with heavy loss of life. The deaths of civilians, including American citizens, have provoked outrage and renewed demands that Germany restrict its submarine campaign."
    endsieg_news.140.a:0 "A tragedy with consequences beyond the sea."
    endsieg_news.141.t:0 "Unrestricted Submarine Warfare"
    endsieg_news.141.d:0 "Germany has announced a submarine campaign permitting attacks on shipping without the usual restrictions of prize law. Its naval leaders hope to cut Britain's overseas lifelines, while neutral governments warn of the danger to their vessels and citizens."
    endsieg_news.141.a:0 "Neutral shipping is no longer secure."
    endsieg_news.142.t:0 "Afghanistan Aligns with the Central Powers"
    endsieg_news.142.d:0 "The Afghan government has joined the Central Powers' camp following negotiations with their representatives. The agreement raises new concerns for British India, where the frontier and the prospect of wider unrest already demand close attention."
    endsieg_news.142.a:0 "The war reaches towards India."
    endsieg_news.143.t: "Civil War in India"
    endsieg_news.143.d: "Today, seemingly against all odds a German plot to incite a Pan-Indian revolt in British Raj has been largely successful and is within the few days likely to spread all across India like a sweeping wildfire. The Provisional Government of India has been set up in northern India near Afgahnistan for now with Mahendra Pratap taking lead of the revolution and aligning the revolutionary state with the Central Powers."
    endsieg_news.143.a: "Bad news for Britain"
    endsieg_news.144.t:0 "A Conspiracy Uncovered in India"
    endsieg_news.144.d:0 "British authorities report that a conspiracy to organise an uprising in India has been uncovered. Arrests and military precautions have disrupted plans linked to revolutionary networks and German assistance, though the extent of the movement remains uncertain."
    endsieg_news.144.a:0 "The authorities have moved against the plot."
    endsieg_news.145.t: "Huerta Returns to Power"
    endsieg_news.145.d:0 "Victoriano Huerta has returned to power in Mexico after securing support for another attempt against the revolutionary governments. Reports of contacts with German representatives have drawn particular attention in Washington, where officials fear the consequences of his restoration."
    endsieg_news.145.a:0 "Mexico faces another reversal."
    endsieg_news.146.t:0 "Huerta Detained"
    endsieg_news.146.d:0 "American authorities have detained Victoriano Huerta as he attempted to return to Mexico. His contacts with German representatives and plans to gather armed supporters have raised fears of another intervention in the Mexican struggle."
    endsieg_news.146.a:0 "His return has been stopped."
    endsieg_news.147.t:0 "The German High Command Ascendant"
    endsieg_news.147.d:0 "Hindenburg and Ludendorff have become the dominant figures in Germany's wartime government. Wilhelm II retains the crown and its formal powers, but military leaders increasingly determine the decisions that shape the country's war effort."
    endsieg_news.147.a:0 "The generals command more than the army."
    endsieg_news.148.t: "Germany Declares War on Portugal"
    endsieg_news.148.d:0 "Germany has declared war on Portugal after mounting disputes over shipping and Portuguese support for the Entente. The decision brings open hostilities to a relationship already strained by maritime seizures and fighting around the colonial frontiers."
    endsieg_news.148.a:0 "Another country enters the war."
    endsieg_news.149.t:0 "The Rise of the Red Baron"
    endsieg_news.149.d:0 "Manfred von Richthofen has become one of Germany's most celebrated fighter pilots. Reports of his victories and the distinctive red aircraft associated with him are making the baron a prominent symbol of the air war."
    endsieg_news.149.a:0 "The war has found another famous name."
    endsieg_news.150.t:0 "Germany Resumes Its Unrestricted Submarine Campaign"
    endsieg_news.150.d:0 "Germany has renewed unrestricted submarine warfare in an effort to sever Britain's overseas supplies. The decision accepts the risk of a confrontation with neutral powers, whose shipping will again be exposed to attack."
    endsieg_news.150.a: "Interesting decision"
    endsieg_news.151.t:0 "General Mobilisation Ordered"
    endsieg_news.151.d:0 "The military authorities have issued orders for general mobilisation as the European crisis deepens. Reservists are reporting to their depots and railway schedules are giving way to the movement of troops, leaving diplomacy little time to avert a wider conflict."
    endsieg_news.151.a:0 "Europe's armies are gathering."
    endsieg_news.152.t:0 "Sidónio Pais Assassinated"
    endsieg_news.152.d:0 "Portuguese president Sidónio Pais has been shot at Lisbon's Rossio railway station and has died of his wounds. His assassination leaves a government already marked by political conflict facing the sudden loss of its central figure."
    endsieg_news.152.a:0 "Portugal confronts another crisis."
    endsieg_news.153.t:0 "A Republic Proclaimed in Portugal"
    endsieg_news.153.d:0 "Republican soldiers and sailors have risen against the Portuguese monarchy. A provisional government under Teófilo Braga has proclaimed a republic as the crown's authority collapses in the capital."
    endsieg_news.153.a:0 "The monarchy has been challenged."
    endsieg_news.154.t:0 "Civil War in Portugal"
    endsieg_news.154.d:0 "Portugal's monarchists have refused to accept the republican seizure of power and are gathering their forces in the north. The dispute over the crown has become an armed struggle, dividing the country between rival claims to legitimate government."
    endsieg_news.154.a:0 "The constitutional crisis has become a war."
    endsieg_news.155.t:0 "The Portuguese Monarchy Restored"
    endsieg_news.155.d:0 "Monarchist forces have prevailed over their republican opponents in Portugal. Manuel II has resumed authority over the country, while the defeated movement faces an uncertain future under the restored crown."
    endsieg_news.155.a:0 "The monarchy has survived its challengers."
    endsieg_news.156.t:0 "Pimenta de Castro Takes Control"
    endsieg_news.156.d:0 "General Pimenta de Castro has assumed control of Portugal's government with the support of President Manuel de Arriaga. Military officers are taking ministerial posts as parliamentary authority gives way to an administration ruling outside the ordinary constitutional settlement."
    endsieg_news.156.a:0 "The republic comes under military authority."
    endsieg_news.157.t:0 "An Uprising in Lisbon"
    endsieg_news.157.d:0 "Soldiers, sailors and republican opponents of Pimenta de Castro have risen in Lisbon. Fighting around the capital and intervention by warships have broken the government's resistance, leaving its leaders unable to retain power."
    endsieg_news.157.a:0 "Another government falls in Portugal."
    endsieg_news.158.t:0 "Sidónio Pais Seizes Power"
    endsieg_news.158.d:0 "Sidónio Pais has led a successful military revolt against the Portuguese government. Parliament has been dissolved and the constitution suspended as the new leadership promises a different political order for a country exhausted by conflict."
    endsieg_news.158.a:0 "Portugal is promised a new republic."
    endsieg_news.159.t: "Italy Joins the Central Powers"
    endsieg_news.159.d:0 "Italy has entered the Central Powers' alliance, committing itself beside Germany and Austria-Hungary. Its decision changes the balance in the Mediterranean and along the southern approaches to the European war."
    endsieg_news.159.a:0 "Italy has chosen its side."
    endsieg_news.160.t:0 "Charles Crowned King of Hungary"
    endsieg_news.160.d:0 "Charles has taken the Hungarian coronation oath following his accession to the Habsburg thrones. The ceremony renews the crown's constitutional obligations at a time when the monarchy's peoples and leaders are debating its future."
    endsieg_news.160.a:0 "A new sovereign inherits old divisions."
    endsieg_news.161.t:0 "Emperor Franz Joseph Dies"
    endsieg_news.161.d:0 "Emperor Franz Joseph has died at Schönbrunn after a reign of nearly seven decades. His successor, Charles, inherits a monarchy bound together by a dynasty whose longest-serving figure is now gone."
    endsieg_news.161.a:0 "An era closes in Vienna."
    endsieg_news.162.t:0 "Franz Ferdinand Assassinated at Sarajevo"
    endsieg_news.162.d:0 "Archduke Franz Ferdinand and his wife Sophie have been killed in Sarajevo by Gavrilo Princip. The assassination of the Habsburg heir has shocked Europe and brought Austria-Hungary's relations with Serbia under immediate strain."
    endsieg_news.162.a:0 "Europe waits upon Vienna's response."
    endsieg_news.163.t:0 "An Austro-Hungarian Ultimatum to Serbia"
    endsieg_news.163.d:0 "Vienna has delivered a far-reaching ultimatum to Serbia following the assassination at Sarajevo. Its demands for action against hostile organisations and Austrian involvement in the investigation leave Belgrade facing a decision with consequences far beyond the Balkans."
    endsieg_news.163.a:0 "The deadline is approaching."
    endsieg_news.164.t:0 "Serbia Rejects Part of the Ultimatum"
    endsieg_news.164.d:0 "Serbia has answered the Austro-Hungarian ultimatum, accepting much of its substance but refusing provisions it considers a violation of sovereignty. Vienna regards the response as insufficient, and the rupture in relations has brought the two states closer to war."
    endsieg_news.164.a:0 "The crisis has deepened."
    endsieg_news.165.t: "Austria Chooses War!"
    endsieg_news.165.d: "Following the refusal to accept all terms of the Ultimatum sent to Serbia Franz Josef has gone ahead and issued a manifesto 'To my people's' - 'An meine Volker', in BadIschl on 28 July 1914. The text was a typical headline of war manifestoes printed following the Empire's declaration of war on Serbia. The document has been distributed all over the empire and is being widely published by news sources. The text has presented the agressiveness of Serbia as the reason for war, claiming that the Empire has tried all ways to avoid the conflict."
    endsieg_news.165.a: "Lets just hope it stays a local conflict"
    endsieg_news.166.t:0 "The Armistice of Villa Giusti"
    endsieg_news.166.d:0 "Austro-Hungarian representatives have signed an armistice at Villa Giusti. The agreement comes as the imperial army retreats and the monarchy's authority disintegrates, bringing its struggle against Italy towards an end."
    endsieg_news.166.a:0 "The Habsburg war effort has collapsed."
    endsieg_news.167.t:0 "A Republic Proclaimed in the Banat"
    endsieg_news.167.d:0 "Political leaders in the Banat have proclaimed a republic under Otto Roth. The new administration seeks to hold together a region claimed by neighbouring states and inhabited by several large national communities."
    endsieg_news.167.a:0 "A fragile authority amid competing claims."
    endsieg_news.168.t:0 "Czechoslovak Independence Proclaimed"
    endsieg_news.168.d:0 "Czechoslovak representatives have proclaimed an independent state as Habsburg authority weakens. Their declaration presents a new claim to sovereignty in the Czech lands and Slovakia, challenging efforts to preserve the monarchy through reform."
    endsieg_news.168.a:0 "A new state emerges from the monarchy."
    endsieg_news.169.t:0 "West Ukrainian Independence Proclaimed"
    endsieg_news.169.d:0 "A West Ukrainian republic has been proclaimed in the former Habsburg territories. Its claim to Lviv and the surrounding region meets immediate opposition from Polish representatives, leaving the new state's borders deeply contested."
    endsieg_news.169.a:0 "Independence brings a dispute over borders."
    endsieg_news.170.t:0 "The Martin Declaration"
    endsieg_news.170.d:0 "Slovak representatives meeting at Martin have declared their break with Habsburg rule and their support for a common state with the Czechs. The declaration strengthens the Czechoslovak claim while leaving the future distribution of authority to be settled."
    endsieg_news.170.a:0 "A declaration for a common state."
    endsieg_news.171.t:0 "The Aster Revolution"
    endsieg_news.171.d:0 "Demonstrators and soldiers wearing aster flowers have taken control of key buildings in Budapest. Mihály Károlyi and the Hungarian National Council are assuming authority as the old government's hold over Hungary collapses."
    endsieg_news.171.a:0 "Hungary enters a new political order."
    endsieg_news.172.t:0 "Yugoslav Forces Enter the Banat"
    endsieg_news.172.d:0 "Yugoslav forces have moved into the Banat, challenging the authority of its recently proclaimed republic. The advance brings the region's disputed future into the hands of armies and governments with competing territorial claims."
    endsieg_news.172.a:0 "The Banat's future is being decided by force."
    endsieg_news.173.t: "Division of Banat"
    endsieg_news.173.d: "With the Banat Republic conquered by Yugoslavian forces the nation has been split between East and West Banat between Yugoslavia and Rumania on ethnic boundaries."
    endsieg_news.173.a: "Alright"
    endsieg_news.174.t:0 "Britain Declares Its Neutrality"
    endsieg_news.174.d:0 "The British government has announced that it will remain outside the present European conflict. The declaration gives no assurance that neutrality will endure, as ministers continue to weigh Britain's commitments and the course of the war."
    endsieg_news.174.a:0 "London remains watchful."
    endsieg_news.175.t:0 "Britain Enters the War beside France"
    endsieg_news.175.d:0 "Britain has committed itself to the struggle against Germany alongside France. The decision brings British military and naval power into the continental conflict and turns a European crisis into a still wider war."
    endsieg_news.175.a:0 "Britain has entered the struggle."
    endsieg_news.176.t:0 "A Blockade in the North Sea"
    endsieg_news.176.d:0 "Britain has begun a blockade intended to restrict maritime trade with Germany and its partners. The Royal Navy's control of the sea routes threatens supplies needed by industry and civilians, while neutral merchants face new obstacles to their trade."
    endsieg_news.176.a:0 "The pressure will reach beyond the front."
    endsieg_news.177.t:0 "Portugal Joins the Entente"
    endsieg_news.177.d:0 "Portugal has aligned itself with the Entente amid growing tension with Germany. The decision draws upon its longstanding relationship with Britain and brings the country's ports and colonial interests more directly into the war."
    endsieg_news.177.a:0 "Portugal joins the Allied camp."
    endsieg_news.178.t:0 "Bulgaria Joins the Entente"
    endsieg_news.178.d:0 "Bulgaria has accepted an alignment with the Entente following negotiations over its position in the Balkans. Sofia's decision changes the regional balance and gives the Allied governments a new partner against the Central Powers."
    endsieg_news.178.a:0 "A new agreement reshapes the Balkans."
    endsieg_news.179.t:0 "The United States Declares War on Germany"
    endsieg_news.179.d:0 "The United States has declared war on Germany after relations deteriorated over the submarine campaign and German diplomatic actions. Washington's decision ends its neutrality and commits American resources to the struggle across the Atlantic."
    endsieg_news.179.a:0 "The war has crossed another ocean."
    endsieg_news.180.t: "The Arab Revolt"
    endsieg_news.180.d:0 "Sharif Hussein of Mecca has raised a revolt against Ottoman rule. His supporters seek an independent Arab state, opening another challenge to Constantinople's authority in territories already strained by the war."
    endsieg_news.180.a:0 "The empire faces a revolt in Arabia."
    endsieg_news.181.t:0 "Allied Troops Land at Gallipoli"
    endsieg_news.181.d:0 "Allied troops have begun landings on the Gallipoli peninsula. The operation seeks to force a passage through the Dardanelles, confronting Ottoman defenders on ground commanding one of the empire's most important waterways."
    endsieg_news.181.a:0 "The struggle for the straits has begun."
    endsieg_news.182.t:0 "Allied Landings in Pomerania"
    endsieg_news.182.d:0 "Allied forces have begun landing on the Pomeranian coast. The operation opens a threat to Germany from the Baltic, placing the approaches to Berlin under pressure from a new direction."
    endsieg_news.182.a:0 "The war reaches Germany's northern coast."
    endsieg_news.183.t:0 "The Union of South Africa Established"
    endsieg_news.183.d:0 "The Union of South Africa has been established from the Cape, Natal, Transvaal and Orange River colonies. The new dominion unites their administrations under a common government while retaining its place within the British Empire."
    endsieg_news.183.a:0 "A new union under the crown."
    endsieg_news.184.t:0 "King Edward VII Dies"
    endsieg_news.184.d:0 "King Edward VII has died, and his son has succeeded him as George V. Mourning in Britain is being joined by courts and governments abroad, whose relations with the late king gave his reign a prominent place in European diplomacy."
    endsieg_news.184.a:0 "A new reign begins in Britain."
    endsieg_news.185.t:0 "Kitchener Lost with the Hampshire"
    endsieg_news.185.d:0 "Lord Kitchener and members of his staff have been lost after HMS Hampshire struck a mine off the Orkney Islands. The warship had been carrying the British war secretary towards Russia, and news of his death has brought a profound shock at home."
    endsieg_news.185.a:0 "Britain has lost a leading figure of the war."
    endsieg_news.186.t: "Easter Rising"
    endsieg_news.186.d: "An armed insurrection has begun in Ireland during Easterweek! According to reports, the Rising has been launched by Irish Republics who intend to 'end British rule in Ireland and establish an independent Irish Republic'. They have taken a jab at the British government while they are heavily engaged elsewhere dealing with German Imperialism. This is arguably the most significant uprising in Ireland in the last hundred years and it must be dealt with before it gets out of hand!"
    endsieg_news.186.a: "An interesting turn of events"
    endsieg_news.187.t: "Italy Joins the Entente"
    endsieg_news.187.d:0 "Italy has entered the Entente's camp and committed itself against the Central Powers. The decision turns its frontier with Austria-Hungary into a theatre of war and gives new force to Italian territorial ambitions."
    endsieg_news.187.a:0 "A new front opens in the south."
    endsieg_news.188.t:0 "A Second Balkan War"
    endsieg_news.188.d:0 "The division of the territories taken from the Ottoman Empire has brought the former Balkan allies into conflict. Bulgaria and its neighbours are turning their armies against one another as rival claims in Macedonia defeat attempts at compromise."
    endsieg_news.188.a:0 "The victors have become enemies."
    endsieg_news.189.t: "Blockade of Greece"
    endsieg_news.189.d: "In an effort to force Greece to join their war agaisnt the Central Powers the French Republic have begun a blockade against Greece to try and force King Constantine I to step down in favor of his son Alexander I who is pro-entente or submit."
    endsieg_news.189.a: "Talk about peer pressure"
    endsieg_news.190.t:0 "The Liberté Explodes at Toulon"
    endsieg_news.190.d:0 "The French battleship Liberté has been destroyed by an explosion in Toulon harbour. Fire in the ship's ammunition stores caused a catastrophic blast, with heavy casualties and damage extending to nearby vessels."
    endsieg_news.190.a:0 "A disaster in the French fleet."
    endsieg_news.191.t: "Romania Joins the Entente"
    endsieg_news.191.d:0 "Romania has joined the Entente after negotiations over the territories it seeks from Austria-Hungary. Its intervention brings a new army into the war and opens pressure against the Central Powers along the Carpathian frontier."
    endsieg_news.191.a:0 "Another front opens in the east."
    endsieg_news.192.t:0 "Jean Jaurès Assassinated"
    endsieg_news.192.d:0 "Jean Jaurès has been shot dead in a Paris café. The murder of the socialist leader removes one of France's most prominent opponents of war at the moment when the European crisis is approaching its decision."
    endsieg_news.192.a:0 "A voice for peace has been silenced."
    endsieg_news.193.t:0 "Zeppelins Bomb Paris"
    endsieg_news.193.d:0 "German airships have bombed Paris, bringing explosions to the streets of the French capital. The raid has renewed alarm over the vulnerability of cities to attacks from the air and placed their defences under scrutiny."
    endsieg_news.193.a:0 "The sky offers no refuge."
    endsieg_news.194.t: "Italo-Turkish War Begins"
    endsieg_news.194.d: "Italian claims on Libya have dated back to the defeat of the Ottomans in the Russo-Turkish War (1877) and now the Kingdom of Italy wishes realize those dreams and take what they claim is theirs, they claim the Turks aren't making use of that land and that it would be better in their hands with what they could do over there!"
    endsieg_news.194.a: "The sick man of europe is doomed"
    endsieg_news.195.t:0 "The Treaty of Ouchy"
    endsieg_news.195.d:0 "Italy and the Ottoman Empire have concluded a peace settlement at Ouchy. The agreement ends their struggle over Libya and places the disputed Mediterranean territories under new arrangements, marking a further retreat of Ottoman authority."
    endsieg_news.195.a:0 "A new settlement in the Mediterranean."
    endsieg_news.196.t: "Italy Honors Triple Alliance"
    endsieg_news.196.d: "With Europe now at war the Central Powers the seemingly semi-skeptical Kingdom of Italy has in the end decided to honor the Triple Alliance instead of remaining neutral."
    endsieg_news.196.a: "Interesting"
    endsieg_news.197.t:0 "Japan Delivers an Ultimatum to Germany"
    endsieg_news.197.d:0 "Japan has demanded that Germany surrender its positions in East Asia and the Pacific. The ultimatum brings Tokyo's regional ambitions into the wider war and leaves Berlin to decide whether to yield its distant possessions."
    endsieg_news.197.a:0 "Berlin must answer Tokyo."
    endsieg_news.198.t:0 "Germany Accepts Japan's Ultimatum"
    endsieg_news.198.d:0 "Germany has accepted the Japanese demands and agreed to surrender the territories specified in the ultimatum. The concession expands Tokyo's position in East Asia and the Pacific without a campaign to seize them."
    endsieg_news.198.a:0 "Japan has secured its demands."
    endsieg_news.199.t:0 "Germany Rejects Japan's Demands"
    endsieg_news.199.d:0 "Germany has refused to accept the terms of Japan's ultimatum. Tokyo has announced that it will act to secure its demands, bringing the German possessions in the region under immediate threat."
    endsieg_news.199.a:0 "Diplomacy has given way to confrontation."
    endsieg_news.200.t:0 "Emiliano Zapata Killed"
    endsieg_news.200.d:0 "Emiliano Zapata has been killed after being lured to a meeting with forces claiming they intended to join his cause. His death deprives the peasant movement in southern Mexico of its best-known leader, though the demands associated with his struggle remain unresolved."
    endsieg_news.200.a:0 "The struggle outlives its leader."
    endsieg_news.201.t:0 "Díaz Claims Victory in Mexico"
    endsieg_news.201.d:0 "Porfirio Díaz has been declared the victor in Mexico's presidential election. The result follows the arrest of Francisco Madero and widespread accusations of fraud, leaving the government facing challenges to both its conduct and its right to remain in power."
    endsieg_news.201.a:0 "The result has settled little."
    endsieg_news.202.t:0 "The Maderista Revolt"
    endsieg_news.202.d:0 "Francisco Madero has challenged the Mexican election result and called for the overthrow of Porfirio Díaz. His supporters are taking up arms as demands for political change turn into a revolutionary campaign."
    endsieg_news.202.a:0 "The dispute has become a revolution."
    endsieg_news.203.t:0 "Porfirio Díaz Relinquishes Power"
    endsieg_news.203.d:0 "Porfirio Díaz has agreed to leave office after the advance of revolutionary forces undermined his government. His departure ends a long period of personal rule, while the victors must still reconcile their competing expectations for Mexico's future."
    endsieg_news.203.a:0 "An old regime has come to an end."
    endsieg_news.204.t: "The Ten Tragic Days"
    endsieg_news.204.d:0 "Fighting in Mexico City has ended with the overthrow of Francisco Madero's government. Victoriano Huerta has turned against the president he was entrusted to defend, bringing military betrayal and repression to the centre of Mexico's revolution."
    endsieg_news.204.a:0 "The capital has witnessed another overthrow."
    endsieg_news.205.t:0 "The Constitutionalists Rise"
    endsieg_news.205.d:0 "Venustiano Carranza and his supporters have raised a movement against Victoriano Huerta's government. Claiming to defend constitutional rule, they are gathering forces for another campaign in a country already divided by revolution."
    endsieg_news.205.a:0 "Mexico faces a new struggle for power."
    endsieg_news.206.t:0 "Huerta Falls from Power"
    endsieg_news.206.d:0 "Victoriano Huerta has resigned after military defeats and mounting pressure destroyed his government's position. His departure removes a common enemy of the revolutionary factions, leaving their rival claims to determine what follows."
    endsieg_news.206.a:0 "Victory leaves new questions unanswered."
    endsieg_news.207.t:0 "The Ottoman Raid in the Black Sea"
    endsieg_news.207.d:0 "Warships under Ottoman colours have attacked Russian ports and shipping in the Black Sea. The raid has turned the crisis between the two empires into open hostilities and placed Constantinople firmly within the widening conflict."
    endsieg_news.207.a:0 "The Black Sea has become a theatre of war."
    endsieg_news.208.t:0 "An Ottoman Call to Jihad"
    endsieg_news.208.d:0 "Ottoman religious authorities have proclaimed a jihad against the empire's wartime enemies. The appeal invokes the authority of the caliphate in an effort to rally support beyond the Ottoman frontiers and unsettle the Muslim subjects of opposing powers."
    endsieg_news.208.a:0 "A religious appeal across imperial borders."
    endsieg_news.209.t:0 "A German Military Mission to the Ottoman Empire"
    endsieg_news.209.d:0 "A German military mission has arrived to advise and reorganise parts of the Ottoman army. The appointment strengthens a longstanding military relationship and has drawn close attention from governments concerned by Berlin's influence at Constantinople."
    endsieg_news.209.a:0 "Military cooperation carries diplomatic weight."
    endsieg_news.210.t: "Raid on the Sublime Porte"
    endsieg_news.210.d: "Today a coup d'état was carried out by a number of Committe of Union and Progess (Young Turks) members led by Enver Pasha and Tallat Pasha, whom made a surprise raid on the central Ottoman government buildings, the Sublime Porte. During the coup, the Minister of the Navy, Nazim Pasha was assassinated and the Grand Vizier, Kamil Pasha has been forced to resign. With the fall of the former government, the new government has fallen into the hands of the Young Turks who are now under the leadership of the triumvirate or the 'Three Pashas', made up of Enver, Talaat, and Djemal Pasha."
    endsieg_news.210.a: "Interesting..."
    endsieg_news.211.t:0 "A New Albanian Revolt"
    endsieg_news.211.d:0 "Albanian insurgents have risen against Ottoman authority amid opposition to taxation, conscription and disarmament. The renewed revolt places further pressure on a government attempting to impose closer control over the region."
    endsieg_news.211.a:0 "The western provinces are unsettled again."
    endsieg_news.212.t:0 "Revolt in Northern Albania"
    endsieg_news.212.d:0 "An uprising has broken out among Albanian communities near the Montenegrin frontier. Reports of weapons and shelter reaching the insurgents from across the border have added an international dimension to the confrontation with Ottoman forces."
    endsieg_news.212.a:0 "The unrest crosses a frontier."
    endsieg_news.213.t:0 "Albanian Resistance to Centralisation"
    endsieg_news.213.d:0 "Albanian insurgents have taken up arms against the Ottoman government's centralising policies. Attacks on officials and disruption of the railways have brought martial law and preparations for a military response."
    endsieg_news.213.a:0 "The government faces an armed challenge."
    endsieg_news.2131.t:0 "Montenegro Proclaimed a Kingdom"
    endsieg_news.2131.d:0 "Prince Nikola has assumed the title of king with the support of Montenegro's assembly. The proclamation elevates the independent principality to a kingdom and gives its ruler a new title among the dynasties of Europe."
    endsieg_news.2131.a:0 "A new royal title in the Balkans."
    endsieg_news.214.t:0 "An Explosion at Haydarpaşa"
    endsieg_news.214.d:0 "A major explosion has struck the railway installations at Haydarpaşa on the Bosporus. Stores of ammunition and fuel have been destroyed, disrupting a vital transport centre while the cause of the disaster remains uncertain."
    endsieg_news.214.a:0 "A severe blow to the Ottoman supply system."
    endsieg_news.215.t:0 "Brusilov Opens a Major Offensive"
    endsieg_news.215.d:0 "Russian forces under General Alexei Brusilov have begun a major offensive against the Austro-Hungarian front. Carefully prepared attacks are intended to break the defensive lines and restore the initiative to the Russian armies."
    endsieg_news.215.a:0 "The eastern front is moving again."
    endsieg_news.216.t:0 "St Petersburg Renamed Petrograd"
    endsieg_news.216.d:0 "The Russian government has renamed St Petersburg as Petrograd. Officials intend the change to remove the capital's German-sounding name at a time when the two empires are enemies."
    endsieg_news.216.a:0 "War reaches even the names of cities."
    endsieg_news.217.t:0 "Revolution in Petrograd"
    endsieg_news.217.d:0 "Demonstrations over food and the government have spread through Petrograd, drawing workers and soldiers into the streets. The defection of military units has undermined the authorities' ability to suppress the unrest and placed the monarchy in immediate danger."
    endsieg_news.217.a:0 "The capital is slipping from imperial control."
    endsieg_news.218.t: "Nicholas II Abdicates"
    endsieg_news.218.d:0 "Nicholas II has abdicated as resistance to his rule overwhelms the monarchy's remaining support. The refusal of Grand Duke Michael to assume the crown without a wider settlement leaves Russia facing a profound break with its dynastic past."
    endsieg_news.218.a:0 "Three centuries of Romanov rule have ended."
    endsieg_news.219.t:0 "Lvov Resigns from the Provisional Government"
    endsieg_news.219.d:0 "Prince Georgy Lvov has resigned as head of Russia's Provisional Government. Alexander Kerensky is succeeding him amid continuing disputes over the war and the competing authority of ministers and soviets."
    endsieg_news.219.a:0 "Another ministry inherits the revolution."
    endsieg_news.220.t:0 "The July Days in Petrograd"
    endsieg_news.220.d:0 "Armed demonstrations by soldiers, sailors and workers have shaken Petrograd. The Provisional Government is moving against the Bolsheviks, whom it holds responsible for the unrest, while the disorder exposes the depth of opposition to its authority."
    endsieg_news.220.a:0 "Russia's revolution remains unsettled."
    endsieg_news.221.t:0 "The Kornilov Affair"
    endsieg_news.221.d:0 "General Kornilov's advance towards Petrograd has ended in failure after Kerensky appealed to the soviets and armed workers for support. The confrontation has weakened the Provisional Government and strengthened revolutionary organisations it had recently attempted to suppress."
    endsieg_news.221.a:0 "The government has survived at a price."
    endsieg_news.222.t:0 "The October Revolution"
    endsieg_news.222.d:0 "Bolshevik forces have seized the centres of authority in the Russian capital and proclaimed power in the name of the soviets. The government's collapse follows the growth of a revolutionary movement that can now command the support of the garrison and the streets. Russia's new rulers inherit a country divided over its future."
    endsieg_news.222.a:0 "Soviet power has been proclaimed."
    endsieg_news.223.t:0 "The Romanov Tercentenary"
    endsieg_news.223.d:0 "Russia is celebrating three hundred years of Romanov rule with ceremonies, religious services and imperial appearances. The court presents the festivities as a display of unity between sovereign and people, even as disputes over the country's political future remain unresolved."
    endsieg_news.223.a:0 "The dynasty celebrates its long reign."
    endsieg_news.224.t:0 "Civil War in Russia"
    endsieg_news.224.d:0 "Armed opponents of Soviet rule are gathering around White commanders and regional governments across Russia. The Red authorities are organising their own armies as scattered confrontations widen into a struggle for the country's towns, railways and provinces."
    endsieg_news.224.a:0 "The revolution has become a civil war."
    endsieg_news.225.t:0 "The Treaty of Brest-Litovsk Signed"
    endsieg_news.225.d:0 "Russia and the Central Powers have concluded the Treaty of Brest-Litovsk. The settlement ends their war at a severe territorial cost to Russia, placing the western borderlands beyond its authority and extending German influence across the new political order."
    endsieg_news.225.a:0 "A harsh peace in the east."
    endsieg_news.226.t:0 "The Lafayette Escadrille"
    endsieg_news.226.d:0 "American volunteers are taking to the air in French service with the Lafayette Escadrille. Their presence gives a visible expression to support for France among Americans even while their own government remains outside the war."
    endsieg_news.226.a:0 "Volunteers have crossed the Atlantic."
    endsieg_news.227.t:0 "Washington Condemns the Submarine Campaign"
    endsieg_news.227.d:0 "The United States has protested Germany's unrestricted submarine warfare after attacks on merchant and passenger shipping. Washington is demanding protection for neutral citizens and vessels, warning that further sinkings threaten relations between the two governments."
    endsieg_news.227.a:0 "Berlin faces an American warning."
    endsieg_news.228.t: "U.S. Declares War on Germany!"
    endsieg_news.228.d: "The United States congress and President Wilson have declared that for too long have they sat back and done nothing in the face of German agression against their own country! They have sent a telegram to Mexico offering their land, and have broken their promise restarting unrestricted submarine warfare despite earlier saying they would stop. The American people have at the start of this war wanted neutrality, but with recent actions it is clear they have been forced into this war themselves."
    endsieg_news.228.a: "The tide has turned"
    endsieg_news.229.t:0 "American Forces Arrive for the Western Front"
    endsieg_news.229.d:0 "The United States is sending an expeditionary army to France. The movement of troops across the Atlantic promises fresh strength for the Allied armies, although training, transport and supply will determine how quickly it can be brought to bear."
    endsieg_news.229.a:0 "American intervention takes military form."
    endsieg_news.230.t:0 "American Forces Leave Veracruz"
    endsieg_news.230.d:0 "American troops are withdrawing from Veracruz and returning control of the port to Mexican authorities. The evacuation ends an occupation that brought the two countries close to open war, while leaving their wider relationship unsettled."
    endsieg_news.230.a:0 "The occupation has ended."
    endsieg_news.231.t: "U.S. Condemns Huerta Regime"
    endsieg_news.231.d: "The U.S. government heavily dissaproves of the rise of Victoriano Huerta in Mexico, his actions of a brutal dictator have rippled across Mexico scheming and bringing down the previous president, Francisco Madero who was rightfully elected."
    endsieg_news.231.a: "No question about it, he is a dictator"
    endsieg_news.232.t:0 "American Troops Occupy Veracruz"
    endsieg_news.232.d:0 "American forces have seized the Mexican port of Veracruz following disputes with the Huerta government and concern over an incoming arms shipment. The intervention has provoked anger in Mexico and raised the danger of a wider conflict with the United States."
    endsieg_news.232.a:0 "Relations have reached a dangerous point."
    endsieg_news.233.t:0 "Woodrow Wilson Elected President"
    endsieg_news.233.d:0 "Woodrow Wilson has won the United States presidential election. The Democratic candidate's victory follows a divided contest against William Howard Taft and Theodore Roosevelt, bringing a new administration to Washington."
    endsieg_news.233.a:0 "A new presidency begins."
    endsieg_news.234.t:0 "The Panama Canal Opens"
    endsieg_news.234.d:0 "The Panama Canal has been completed, linking the Atlantic and Pacific oceans through Central America. Its opening gives merchant vessels and warships a route that avoids the long passage around South America and strengthens the United States' strategic position."
    endsieg_news.234.a:0 "A new passage between the oceans."
    endsieg_news.235.t: "U.S. Occupies Haiti"
    endsieg_news.235.d: "On the authority of President Woodrow WIlson around 330 US Marines have landed in Port-au-Prince, Haiti, taking control of the country following the murder of dictator President Vilbrun Guillaume Sam by insurgents who were angered by his political executions of elite opposition. The United States has regarded the revolt against Sam a threat to American business interests in the country prompting the invasion following Rosalvo Bobo's emergence as the next president who was increasingly anti-American."
    endsieg_news.235.a: "Haiti? That place is a shithole!"
    endsieg_news.236.t: "Black Tom Explosion"
    endsieg_news.236.d: "Today on July 30, 1916, in Jersey City, an explosion took place on Black Tom island were many American-made munitions which were to be supplied to the allies were ultimately destroyed. The explosion was equivalent to an earthquake between 5.0 and 5.5 on the Richter scaleand has been reportedly felt as far away as Philadelphia and windows as far as 25 miles away being broken. Upon investigation this explosion waas by far no means an accident but the work of German agents!"
    endsieg_news.236.a: "Hmmm..."
    endsieg_news.237.t:0 "American Forces Occupy the Dominican Republic"
    endsieg_news.237.d:0 "American troops have occupied the Dominican Republic following a confrontation over its government. Naval pressure and military landings have brought much of the country under American control, while resistance continues in parts of the interior."
    endsieg_news.237.a:0 "Another intervention in the Caribbean."
    endsieg_news.238.t:0 "Wilson Calls for Peace without Victory"
    endsieg_news.238.d:0 "President Woodrow Wilson has urged the European belligerents to seek a peace without victory. His appeal challenges both sides to abandon a settlement imposed by force, but their losses and conflicting ambitions leave little common ground."
    endsieg_news.238.a:0 "A difficult appeal to exhausted powers."
    endsieg_news.239.t:0 "The Dervish Struggle in Somaliland"
    endsieg_news.239.d:0 "The Dervish movement led by Mohammed Abdullah Hassan continues its struggle against colonial authority in Somaliland. Successive expeditions have failed to secure a lasting settlement, leaving the British coastal positions facing resistance from the interior."
    endsieg_news.239.a:0 "The conflict endures beyond the coast."
    endsieg_news.240.t:0 "King George I of Greece Assassinated"
    endsieg_news.240.d:0 "King George I of Greece has been shot dead during a walk in Thessaloniki. The assassination has shocked a country already undergoing a period of military and political change and leaves the crown to his successor."
    endsieg_news.240.a:0 "Greece mourns its king."
    endsieg_news.241.t:0 "The Kawachi Destroyed by Explosion"
    endsieg_news.241.d:0 "The Japanese battleship Kawachi has been destroyed by a sudden explosion in its ammunition stores. The ship sank rapidly with heavy loss of life, leaving naval investigators to establish the cause of the disaster."
    endsieg_news.241.a:0 "A catastrophe in the Japanese fleet."
    endsieg_news.242.t:0 "Rice Riots Spread across Japan"
    endsieg_news.242.d:0 "Sharp increases in the price of rice have provoked demonstrations and riots across Japan. The disturbances have spread from local protests into a national political crisis as police and troops confront crowds angered by the cost of food."
    endsieg_news.242.a:0 "Public anger is shaking the government."
    endsieg_news.243.t:0 "The March First Movement in Korea"
    endsieg_news.243.d:0 "Demonstrations demanding Korean independence have spread under Japanese rule. Appeals to national self-determination and public gatherings are confronting the colonial authorities with a broad movement of resistance."
    endsieg_news.243.a:0 "Korea's demand for independence is heard."
    endsieg_news.244.t:0 "Zewditu Takes the Ethiopian Throne"
    endsieg_news.244.d:0 "Ethiopian nobles and church leaders have deposed Iyasu and called Zewditu to the throne. The change brings a new sovereign to Addis Ababa after a confrontation over the legitimacy and direction of the imperial government."
    endsieg_news.244.a:0 "Ethiopia has a new sovereign."
    endsieg_news.245.t:0 "King Chulalongkorn Dies"
    endsieg_news.245.d:0 "King Chulalongkorn of Siam has died, and his son Vajiravudh has succeeded him. The new ruler inherits a kingdom shaped by decades of administrative reform and the effort to preserve its independence amid colonial expansion."
    endsieg_news.245.a:0 "A new reign begins in Siam."
    endsieg_news.246.t:0 "King Carol I of Romania Dies"
    endsieg_news.246.d:0 "King Carol I of Romania has died after a long reign, leaving the throne to Ferdinand. His successor must confront the difficult foreign-policy choices facing the kingdom as rival powers seek its support."
    endsieg_news.246.a:0 "Romania enters a new reign."
    endsieg_news.247.t: ""
    endsieg_news.247.d: ""
    endsieg_news.247.a: ""
    endsieg_news.248.t: ""
    endsieg_news.248.d: ""
    endsieg_news.248.a: ""
    endsieg_news.249.t: ""
    endsieg_news.249.d: ""
    endsieg_news.249.a: ""
    endsieg_news.250.t: ""
    endsieg_news.250.d: ""
    endsieg_news.250.a: ""
    endsieg_news.261.t:0 "Wilhelm II Refuses to Abdicate"
    endsieg_news.261.d:0 "Wilhelm II has rejected calls to relinquish the German throne despite unrest and the mounting pressure upon his government. The emperor is attempting to hold the crown together with the support of the army, leaving the struggle over Germany's political future unresolved."
    endsieg_news.261.a:0 "The crown will attempt to endure."
    endsieg_news.262.t:0 "Wilhelm II Reaffirms His Rule"
    endsieg_news.262.d:0 "Wilhelm II has reaffirmed his authority with the backing of those who regard the crown as the centre of Germany's political order. His decision to remain on the throne leaves the emperor responsible for leading the country through the crisis ahead."
    endsieg_news.262.a:0 "The monarchy stands behind its sovereign."
    ww1_kuk.120.t: "Mediation in the July Crisis"
    ww1_kuk.120.d:0 "Vienna has agreed to pursue mediation in its confrontation with Serbia. Diplomats are preparing talks on the investigation and the demands exchanged between the two governments. The decision has eased the immediate danger of war, though Europe remains divided."
    ww1_kuk.120.a: "Diplomacy has gained time."
    ww1_kuk.121.t: "A Trialist Initiative in Vienna"
    ww1_kuk.121.d: "The Habsburg government has opened discussion of a third South Slav partner beside Austria and Hungary. Regional delegations must negotiate representation, common services and minority safeguards before any constitutional ratification."
    ww1_kuk.121.a: "A new compromise within the monarchy."
    ww1_kuk.122.t: "A Federal Initiative in the Monarchy"
    ww1_kuk.122.d:0 "Vienna has circulated a federal proposal among the crownland representatives. Delegates will negotiate regional institutions, common services and the authority of the crown. The initiative opens a new stage in the struggle over the monarchy's constitution."
    ww1_kuk.122.a: "The constitutional experiment begins."
    ww1_kuk.123.t: "A Limited Austro-French Settlement"
    ww1_kuk.123.d:0 "Austria-Hungary and France have concluded a separate settlement after confidential talks through Prince Sixtus. The agreement marks a breach in the wartime alliances and brings their bilateral conflict to an end. The other belligerents must still settle their own disputes."
    ww1_kuk.123.a:0 "The other belligerents must find their own peace."
    ww1_kuk.124.t: "The Sixtus Letters Become Public"
    ww1_kuk.124.d: "The publication of Karl's correspondence through Prince Sixtus has exposed the failed confidential peace approach. The letters contradict public accounts of the negotiations and place the Austro-Hungarian government under renewed pressure from both its ally and the Entente."
    ww1_kuk.124.a: "Secret diplomacy has become a public crisis."
    ww1_kuk.125.t: "Strikes in Austria-Hungary"
    ww1_kuk.125.d: "Workers in Austria-Hungary are striking amid food shortages and weakening civic order. Demands for reliable deliveries, conditions and a political hearing confront a government stretched by the fronts. Ministers are deciding how to respond to the committees."
    ww1_kuk.125.a: "The home front demands an answer."
    ww1_kuk.126.t: "Naval Unrest at Cattaro"
    ww1_kuk.126.d: "Unrest has broken out among Austro-Hungarian sailors at Cattaro. Food, leave and conditions have become inseparable from anger over the prolonged war. Naval authorities face demands for relief while seeking to restore cooperation in the fleet."
    ww1_kuk.126.a: "The war reaches the anchorage."
    ww1_kuk.127.t: "A Humanitarian Agreement Through Sixtus"
    ww1_kuk.127.d: "France and Austria-Hungary have agreed to a limited humanitarian protocol through the confidential Sixtus channel. Civilian relief and cooperation gain a diplomatic framework, but the protocol settles no territorial claims and leaves the war in progress."
    ww1_kuk.127.a: "A limited opening amid the war."
    ww1_italy.400.t: "Italy Declares War on the Ottoman Empire"
    ww1_italy.400.d:0 "Italy has declared war on the Ottoman Empire over its claims to Libya. Italian transports and warships move toward the coast as Ottoman troops and local forces prepare to resist the campaign."
    ww1_italy.400.a: "The colonial campaign begins."
    ww1_italy.401.t: "Italy Enters the Entente War"
    ww1_italy.401.d: "Following an accepted intervention agreement and a decision in Rome, Italy has joined the Entente and declared war on Austria-Hungary. Territorial promises will still depend on the battlefield and the eventual settlement."
    ww1_italy.401.a: "A new front opens."
    ww1_italy.402.t: "Italy Ratifies a German Alliance"
    ww1_italy.402.d:0 "Italy has ratified its negotiated agreement with Berlin and entered the German-led alliance. The decision marks a diplomatic realignment in Rome as ministers consider the military obligations it may bring."
    ww1_italy.402.a: "Rome chooses the German connection."
    ww1_italy.403.t: "A Tyrolean Neutrality Agreement"
    ww1_italy.403.d:0 "Italy and Austria-Hungary have agreed to exchange Tyrolean concessions for an Italian neutrality undertaking. The compromise settles an immediate territorial dispute while keeping Italy outside the war."
    ww1_italy.403.a: "A territorial compromise preserves neutrality."
    ww1_italy.404.t: "Resistance in the Libyan Interior"
    ww1_italy.404.d: "Senussi authorities have rejected the extension of Italian occupation in Libya and an armed confrontation has begun. The colonial settlement has left questions of local authority and cooperation unresolved."
    ww1_italy.404.a: "The colonial war has another front."
    ww1_italy.405.t: "An Italian-Ottoman Commercial Agreement"
    ww1_italy.405.d:0 "Italy and the Ottoman Empire have concluded an agreement on commercial access and diplomatic consultation. The settlement preserves Ottoman sovereignty in Libya while opening a new channel for Italian interests in the Mediterranean."
    ww1_italy.405.a:0 "A Mediterranean accommodation."
    ww1_italy.406.t: "A Parliamentary Settlement in Italy"
    ww1_italy.406.d: "The Italian government has accepted a constitutional arrangement strengthening regular consultation between the crown and parliament. The settlement seeks broader cooperation while preserving the monarchy."
    ww1_italy.406.a: "The monarchy accepts parliamentary restraints."
    ww1_italy.407.t: "Italy Affirms the Royal Prerogative"
    ww1_italy.407.d: "The Italian government has adopted a settlement reserving greater discretion to the crown. Supporters expect firmer administration, while opponents fear weaker parliamentary authority."
    ww1_italy.407.a: "Royal authority takes a larger role."
    ww1_italy.408.t: "An Italian Republic Is Proclaimed"
    ww1_italy.408.d:0 "A constituent settlement has replaced the Italian monarchy with an elected republic. Ivanoe Bonomi heads the provisional government as it takes responsibility for the country's unresolved domestic and foreign questions."
    ww1_italy.408.a:0 "A republic takes its place among the powers."
    ww1_italy.409.t: "A Socialist Republic in Italy"
    ww1_italy.409.d:0 "A socialist coalition led by Antonio Gramsci has proclaimed a republic in Italy. The new government seeks to rebuild its relationship with worker organisations and local authorities while confronting the obligations inherited from its predecessors."
    ww1_italy.409.a: "The coalition faces the tasks of government."
    ww1_italy.410.t: "Italy Pledges Armed Neutrality"
    ww1_italy.410.d:0 "Rome has pledged armed neutrality and dispatched a mediation mission to the belligerents. Italian diplomats now seek an audience for their proposals as the government turns neutrality into an active foreign policy."
    ww1_italy.410.a: "Neutrality becomes an active policy."
    ww1_italy.411.t: "A Senussi Accommodation"
    ww1_italy.411.d:0 "Italy and Senussi representatives have concluded an accommodation recognising local administration and negotiated access. Officials on both sides are now expected to sustain the cooperation promised at the talks."
    ww1_italy.411.a: "Negotiation changes the colonial relationship."
    ww1_italy.412.t: "A Mediterranean or Continental Compact"
    ww1_italy.412.d:0 "Rome has announced a new diplomatic compact intended to strengthen Italy's position amid the rival alliances. Its influence will depend on the partners willing to support it and the commitments they are prepared to accept."
    ww1_italy.412.a:0 "Rome seeks new partners."
    ww1_italy.413.t: "Italy Funds a Postwar Reform Programme"
    ww1_italy.413.d:0 "The Italian cabinet has approved spending on demobilisation, veterans' reform and civilian relief. Ministers hope the programme can ease shortages and social tension while the country adjusts to peace."
    ww1_italy.413.a: "The tasks of peace reach the budget."
    ww1_italy.414.t: "Red Week in Italy"
    ww1_italy.414.d: "Deaths during demonstrations in Ancona have helped provoke strikes and unrest in Italy. Worker, socialist and republican organisers challenge the authorities as the cabinet weighs repression against negotiated concessions."
    ww1_italy.414.a: "The political conflict reaches the streets."
    ww1_italy.415.t: "Italian Command Debates Follow a Retreat"
    ww1_italy.415.d:0 "A retreat on the Italian front has provoked a debate over command, reserves and the treatment of soldiers. Ministers face demands for reform as the army seeks to restore its position and confidence."
    ww1_italy.415.a: "The retreat forces a command decision."
    ww1_italy.416.t: "Rome and Vienna Sign an Adriatic Compact"
    ww1_italy.416.d:0 "Italy and Austria-Hungary have ratified an Adriatic compact recognising the present borders. Consultation and access arrangements are intended to replace immediate confrontation with regular diplomatic cooperation."
    ww1_italy.416.a: "Cooperation settles an immediate dispute."
    ww1_italy.417.t: "Italy Honours Its German War Pledge"
    ww1_italy.417.d:0 "Italy has honoured its negotiated agreement with Germany by entering the war against Berlin's continental opponents. Rome's decision gives the alliance a new military commitment and changes the balance along Italy's frontiers."
    ww1_italy.417.a:0 "Rome has entered the continental struggle."
    ww1_kuk.250.t: "A Convention of the Habsburg Crownlands"
    ww1_kuk.250.d:0 "Delegates from the Habsburg crownlands have gathered to negotiate the relationship between regional institutions and the common government. They bring competing demands for representation, public services and authority. The convention opens a new effort to settle the monarchy's future."
    ww1_kuk.250.a: "The negotiations begin."
    ww1_kuk.251.t: "A Trialist Settlement Is Ratified"
    ww1_kuk.251.d: "Vienna has ratified a three-part crown settlement after Hungarian, Croatian and Bosnian consent. Common territory remains intact while new representation and language services begin work."
    ww1_kuk.251.a: "A negotiated third partner enters the constitution."
    ww1_kuk.252.t: "A Danubian Federation Is Ratified"
    ww1_kuk.252.d: "The consenting crownland delegations have ratified an integrated federal state. The common government retains territory and defence while a federal chamber, army and service institutions replace the old nationality arrangements."
    ww1_kuk.252.a: "The common state adopts a federal constitution."
    ww1_kuk.253.t: "Autonomous Crownlands Under the Habsburg Crown"
    ww1_kuk.253.d:0 "Vienna has ratified a confederation of autonomous crownland governments. Regional administrations assume responsibility for their territories while retaining ties to the common crown. The Austrian heartland remains under Vienna's direct administration."
    ww1_kuk.253.a: "Autonomy becomes territorial government."
    ww1_kuk.254.t: "The Monarchy Concludes an Orderly Partition"
    ww1_kuk.254.d:0 "The crownland governments have concluded a negotiated separation from the Habsburg common state. They will assume independence under the settlement, while an Austrian government retains the heartland. The agreement ends the union through negotiation rather than another campaign."
    ww1_kuk.254.a: "A negotiated separation replaces the common state."
    ww1_kuk.255.t: "A Danubian Republic Is Proclaimed"
    ww1_kuk.255.d: "A consenting federal convention has replaced the imperial constitution with an elected Danubian republic. Karl Renner heads the common government, which retains the agreed territory and inherits the tasks of administration and defence."
    ww1_kuk.255.a: "A republican federation takes office."
    ww1_kuk.256.t: "Vienna Ratifies a Centralist Settlement"
    ww1_kuk.256.d: "The common government has ratified an executive settlement reaffirming central authority. It improves common administration while leaving nationality demands and opposition unresolved."
    ww1_kuk.256.a: "The cabinet assumes the cost of central authority."
    ww1_kuk.257.t: "The Dual Monarchy Agreement Is Renewed"
    ww1_kuk.257.d: "Vienna and Budapest have ratified a renewed agreement on consultation and common responsibilities. The monarchy retains two principal governments and the remaining nationality questions."
    ww1_kuk.257.a: "The dual arrangement receives a new mandate."
    ww1_kuk.258.t: "An Amnesty in the Habsburg Monarchy"
    ww1_kuk.258.d:0 "The Habsburg government has authorised an amnesty for selected political detainees and a review of wartime restrictions. Civil officials will oversee the release programme. Ministers hope the measure will begin to restore trust between the authorities and the population."
    ww1_kuk.258.a:0 "An opening for reconciliation."
