 TUR_balkans:0 "Diplomacy in the Balkans"
 TUR_balkans_desc:0 "We ask our Balkan neighbours to state their demands before the next crisis. A settlement can reduce danger without making Ottoman borders untouchable."
 TUR_hold_on_to_land:0 "Defend the Balkan Frontier"
 TUR_hold_on_to_land_desc:0 "We order the cabinet to defend the remaining Balkan frontier. The policy risks a new war when neighbours believe the border can be revised by force."
 TUR_let_go_of_land:0 "Offer a Balkan Settlement"
 TUR_let_go_of_land_desc:0 "We offer limited territorial concessions to prevent another coalition forming against us. The settlement buys time while preserving the empire's right to defend itself."
 TUR_befriend_bulgaria: "Befriend Bulgaria"
 TUR_befriend_bulgaria_desc: "Bulgaria would make a good ally in the Balkans seeing as we would be their only friend in the area."
 TUR_send_aid: "Aid Bulgaria"
 TUR_send_aid_desc: "We should aid our Bulgarian allies in their war effort on the Balkan Front."
 TUR_befriend_britain:0 "A British Naval Liaison"
 TUR_befriend_britain_desc:0 "We keep a channel open to British naval advisers and merchants. Cooperation remains a diplomatic option rather than a pledge to join the Entente."
 TUR_prepare_for_war: "Prepare for War"
 TUR_prepare_for_war_desc: ""
 TUR_join_entente: "Join the Entente"
 TUR_join_entente_desc: ""
 TUR_european:0 "Diplomacy in Europe"
 TUR_european_desc:0 "We reopen European channels while the empire still has room to bargain. Berlin, London and Paris must be approached as separate governments."
 TUR_befriend_germany:0 "A German Military Liaison"
 TUR_befriend_germany_desc:0 "We invite German officers to discuss training and procurement. The mission improves practical cooperation without signing a binding alliance."
 TUR_german_reform:0 "The German Training Mission"
 TUR_german_reform_desc:0 "From December 1913, a German mission can inspect training and infantry practice. The technical programme requires peace with Germany and competes with the French mission."
 TUR_army_reform_II: "German Reform of the Military II"
 TUR_army_reform_II_desc: "The Turkish army has seen much better days, however with German training we could probably learn a great deal and in turn improve the performance of our army."
 TUR_fortify_dardanelles:0 "Prepare the Dardanelles Defence"
 TUR_fortify_dardanelles_desc:0 "The existing fortification programme will join staff plans, coastal guns and field positions. A temporary defensive programme prepares the army to protect the straits."
 TUR_fortify_gallipoli:0 "The Gallipoli Field Programme"
 TUR_fortify_gallipoli_desc:0 "During great war with Britain, the existing Gallipoli fortification programme will coordinate field positions and local reserves. Its lessons reinforce the army defending the peninsula."
 TUR_prepare_for_war_2: "Prepare for War"
 TUR_prepare_for_war_2_desc: ""
 TUR_strike_russian_port:0 "The Black Sea Raid"
 TUR_strike_russian_port_desc:0 "We authorize the historic Black Sea raid only after Berlin has accepted the Ottoman alignment. The old event retains its Russian target and does not manufacture a war with Britain."
 TUR_senussi_revolt: "Aid Senussi Revolt"
 TUR_senussi_revolt_desc: "Ever since we have left North Africa there has been a lot of dissent and guerilla fighters, perhaps we should aid the largest group, the Senussi Order into an all out revolt."
 TUR_war_effort: "Massive War Effort"
 TUR_war_effort_desc: ""
 TUR_defense_of_baghdad:0 "Prepare the Baghdad Defence"
 TUR_defense_of_baghdad_desc:0 "The Mesopotamian command will train infantry to hold river approaches and prepared positions. This wartime programme develops defensive practice rather than granting a city the empire no longer controls."
 TUR_defense_jerusalem: "Defense of Jerusalem"
 TUR_defense_jerusalem_desc: ""
 TUR_defense_damascus:0 "Keep the Syrian Supply Line Working"
 TUR_defense_damascus_desc:0 "Damascus staff reports will connect the regional command to its remaining supply routes. Logistics research and recovery organisation help existing formations endure the campaign."
 TUR_middle_east:0 "Diplomacy in the Middle East"
 TUR_middle_east_desc:0 "We place the Arab provinces, Persia and the Red Sea on one diplomatic map. Local cooperation must carry the burden that distant armies cannot."
 TUR_befriend_jabal_shammar: "Befriend Jabal Shammar"
 TUR_befriend_jabal_shammar_desc: "The Emirate of Jabal Shammar has long been close with us with their mortal enemies being the Nejd Emirate ruled by the Saudi's whom we are by no means friends either..."
 TUR_befriend_persia: "Befriend Persia"
 TUR_befriend_persia_desc: "Persia like us is being fought over by the Great Powers of europe particularly Britain and RUssia whom seek to control it, we should befriend them and fight against this european imperialism together."
 TUR_anti_persia: "Anti-Persian Sentiment"
 TUR_anti_persia_desc: "All of Pesia belongs into the greater Ottoman Empire, soon they will become a part of it."
 TUR_mission_afgahnistan: "Mission to Afgahnistan"
 TUR_mission_afgahnistan_desc: "If we could get Afgahnistan on our side they could be of great use in distracting the British and stirring up dissent in India with their invasion."
 TUR_back_shammar: "Back the Emirate of Jabal Shammar"
 TUR_back_shammar_desc: ""
 TUR_help_shammar_defeat_saud: "Help the Emirate Defeat Saud"
 TUR_help_shammar_defeat_saud_desc: "If we help the House of Rashid eliminate the Saudi's once and for all we could have a powerful and controllable ally in Arabia with us."
 TUR_libya_work_locals:0 "Organise Libyan Local Support"
 TUR_libya_work_locals_desc:0 "We rely on Libyan volunteers and local knowledge after the Italian campaign. Their network keeps Ottoman influence alive without inventing new colonial claims."
 TuR_back_senussi: "Back the Senussi Order"
 TUR_back_senussi_desc:0 "We continue a limited Senussi supply channel after the Treaty of Ouchy. It is a time-bound pressure on Italian positions, not a duplicate naval or army order of battle."
 TUR_anti_young_turk:0 "A Cabinet above the Parties"
 TUR_anti_young_turk_desc:0 "Party rivalries threaten to make every ministry a temporary instrument of a faction. Ask the palace to mediate a cabinet that can operate beyond the Committee’s exclusive network."
 TUR_anti_YT_coup:0 "A Royal Commission of Arbitration"
 TUR_anti_YT_coup_desc:0 "The sovereign calls ministers and officers into a commission to settle the struggle over appointments. Royal mediation offers a route out of party deadlock without automatically abandoning the constitution."
 TUR_abolish_constitution:0 "Rule by Emergency Imperial Decree"
 TUR_abolish_constitution_desc:0 "A government frustrated by parliamentary disputes considers concentrating authority in the sovereign’s ministers. Accept the constitutional and provincial cost before authorising rule through emergency decrees."
 TUR_restore_caliphate:0 "Reaffirm the Caliphate’s Public Duties"
 TUR_restore_caliphate_desc:0 "The sultan already holds the caliphate, but its public institutions still require a practical programme. Concentrate on charitable services and religious endowments rather than claiming unlimited political authority abroad."
 TUR_pro_young_turk:0 "The Unionist Parliamentary Network"
 TUR_pro_young_turk_desc:0 "The Committee of Union and Progress seeks to turn its influence into a coherent administrative programme. Organise its deputies and officials while accepting the hostility that partisan appointments can create."
 TUR_1913_coup:0 "The Raid on the Sublime Porte"
 TUR_1913_coup_desc:0 "Defeat and cabinet negotiations give the Committee an opportunity to seize the political initiative. Decide whether the Unionist leadership will place the government under its own direct control."
 TUR_reforms_1:0 "Reform the Civil Administration"
 TUR_reforms_1_desc:0 "Provincial administration has become a source of both waste and resentment. Apply a first programme of appointments and records that officials can actually carry into the districts."
 TUR_reforms_2: "Young Turks Reforms II"
 TUR_reforms_2_desc: ""
 TUR_reforms_3: "Young Turks Reforms III"
 TUR_reforms_3_desc: ""
 TUR_turkish_nationalism:0 "A Unionist Programme of National Service"
 TUR_turkish_nationalism_desc:0 "Unionist ministers link education and military service to the strength of the state. Apply registration and training rules while confronting the distrust that a partisan definition of national duty can create."
 TUR_ottoman_identity:0 "An Empire of Equal Citizens"
 TUR_ottoman_identity_desc:0 "The empire needs a political bond that reaches beyond one language or community. Make equal citizenship and negotiated provincial administration the basis of a new imperial settlement."
 TUR_bad_armenians: "Armenian Genocide"
 TUR_armenian_genocide: ""
