 US2_european_diplomacy:0 "Observe the European Balance"
 US2_european_diplomacy_desc:0 "European alliances can disrupt American commerce long before the United States enters a war. Maintain diplomatic reporting without treating a foreign crisis as an automatic commitment."
 US2_neutrality:0 "Choose Enduring Armed Neutrality"
 US2_neutrality_desc:0 "An enduring neutrality policy places American security ahead of participation in either European bloc. Maintain defences while declining offers that would turn commercial relations into alliance obligations."
 US2_isolationism:0 "Defend the Neutral Republic"
 US2_isolationism_desc:0 "Neutrality must be supported by coast defence and a credible ability to protect commerce. Strengthen that position without offering military partnership to either European coalition."
 US2_support_entente:0 "Support Entente Commerce"
 US2_support_entente_desc:0 "French and British purchasers place large orders in American markets. Facilitate lawful supply while retaining a separate congressional decision over entry into their war."
 US2_condemn_unrestricted_sub:0 "Defend Neutral Shipping"
 US2_condemn_unrestricted_sub_desc:0 "Submarine attacks place American passengers and merchant crews at risk. Demand guarantees from Berlin and make the reply a matter for further congressional consideration."
 US2_send_munitions_1:0 "Atlantic Purchasing Missions"
 US2_send_munitions_1_desc:0 "Allied purchasing missions compete for American small arms and shipping space. Release a limited consignment from existing stocks when the buyers remain at war with Germany."
 US2_send_munitions_2:0 "Coordinate the Export Orders"
 US2_send_munitions_2_desc:0 "Purchasers need predictable standards as manufacturers expand their orders. Coordinate a second consignment without assuming that procurement itself makes America a belligerent."
 US2_send_munitions_3:0 "Sustain the Atlantic Supply Route"
 US2_send_munitions_3_desc:0 "Merchant routes must carry equipment that is available in American stores. Provide a further shipment while retaining enough stocks for American defence and training."
 US2_condemn_zimmerman: "Condemn the Zimmerman Telegram"
 US2_condemn_zimmerman_desc: "The Germans are lucky we haven't declared war yet! Their recent actions trying to get Mexico to join them in a war against us is absolutely traitorous! We just can't be left in peace it seems..."
 US2_declare_war_on_germany:0 "Ask Congress for a Declaration"
 US2_declare_war_on_germany_desc:0 "Continued submarine attacks or a German proposal against America can make neutrality untenable. Ask Congress to decide on war rather than allowing an alliance invitation to make that decision."
 US2_send_expeditionary_force_france: "Send UEF to France"
 US2_send_expeditionary_force_france_desc: "In order to aid our French allies with badly needed fresh manpower on the front we need to send in the American Expeditionary Force."
 US2_mexican_revolution_actions:0 "The Mexican Revolution"
 US2_mexican_revolution_actions_desc:0 "Reports from Mexico describe rival governments and growing insecurity near the frontier. Separate recognition, border defence and military intervention before choosing a response."
 US2_send_army_to_border:0 "Reinforce the Frontier Posts"
 US2_send_army_to_border_desc:0 "Raids and revolutionary fighting can cross a border without creating a general interstate war. Coordinate existing frontier posts and patrols while reviewing diplomatic reports."
 US2_support_revolution:0 "Recognise the Maderista Challenge"
 US2_support_revolution_desc:0 "The Maderistas seek international recognition while contesting the old Mexican government. Consider limited diplomatic and material support without declaring an American civil war against Mexico."
 US2_intervention_in_mexico:0 "Debate a Mexican Intervention"
 US2_intervention_in_mexico_desc:0 "An intervention would require a purpose beyond protecting the frontier. Debate a limited response separately from any congressional authority for a general campaign."
 US2_fortify_border:0 "Improve the Frontier Positions"
 US2_fortify_border_desc:0 "Selected crossings require better cover for the men watching them. Improve a few positions on American soil instead of constructing a continuous fortress line."
 US2_withdraw_from_veracruz:0 "Withdraw from Veracruz"
 US2_withdraw_from_veracruz_desc:0 "Occupation of a Mexican port cannot become a permanent territorial settlement by inertia. Return the limited occupation to Mexican control once the immediate dispute has passed."
 US2_condemn_huerta:0 "Withhold Recognition from Huerta"
 US2_condemn_huerta_desc:0 "Huerta’s seizure of power raises a diplomatic question distinct from a declaration of war. Reject recognition of the coup government while preparing for negotiations with its successors."
 US2_back_revolutionaries_2:0 "Recognise the Constitutionalists"
 US2_back_revolutionaries_2_desc:0 "The fall of Huerta leaves recognition contested among the revolutionary coalitions. Support a constitutional settlement with a limited shipment rather than committing the United States to each subsequent factional war."
 US2_condemn_villa:0 "Respond to the Columbus Raid"
 US2_condemn_villa_desc:0 "A raid on American soil requires a response even while recognition negotiations continue. Define border protection as a separate responsibility from conquest of Mexico."
 US2_democracy:0 "Reform within the Constitution"
 US2_democracy_desc:0 "Progressive voters demand action against privilege without abandoning representative government. Define how new federal powers will remain answerable to elected institutions."
 US2_free_speech:0 "Protect Public Debate"
 US2_free_speech_desc:0 "Newspapers, unions and civic organisations contest the direction of national reform. Protect the constitutional space in which that debate can continue."
 US2_neutrality_in_conflict:0 "Congress Retains the War Power"
 US2_neutrality_in_conflict_desc:0 "Defence planning and foreign commerce do not themselves authorise a war. Preserve a clear congressional decision between preparing the country and sending it into the European conflict."
 US2_denounce_communist: "Denounce Soviet RUssia"
 US2_denounce_communist_desc: ""
 US2_liberty_bonds:0 "Subscribe to the Liberty Loan"
 US2_liberty_bonds_desc:0 "The Treasury seeks funds for a war whose costs exceed ordinary revenues. Organise a public subscription while keeping emergency borrowing separate from the normal budget."
 US2_universal_military_service:0 "The Selective Service Act"
 US2_universal_military_service_desc:0 "The expeditionary army cannot be raised by voluntary enlistment alone. Establish a selective registration system with civilian boards and defined military obligations."
 US2_send_aid:0 "Consider Supply to White Russia"
 US2_send_aid_desc:0 "The Russian civil conflict raises questions about Allied stores and the fate of opposing governments. Offer limited existing equipment only to a surviving White Russian recipient."
 US2_red_scare:0 "Investigate Revolutionary Agitation"
 US2_red_scare_desc:0 "Officials fear that foreign revolutionary organisations may exploit industrial conflict at home. Define an investigation programme while acknowledging its cost to civil liberties."
 US2_war_effort:0 "Congressional War Appropriations"
 US2_war_effort_desc:0 "Military departments require reliable authority for purchases, transport and training. Place their requests before congressional committees that can examine contracts and priorities."

  # Ottoman Empire Focus Tree
