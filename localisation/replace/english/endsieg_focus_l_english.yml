 RUS_slavic_brotherhood_desc: "Improving relations will all slavic nations in the Balkans"
 RUS_support_serbia: "Support Serbia"
 RUS_support_serbia_desc: "We need to show our support for Serbia in order to scare the Austrians from trying to use the Franz Ferdinand excuse to invade them!"
 RUS_befriend_romania: "Befriend Romania"
 RUS_befriend_romania_desc: "As far as Romania should be concerned we share on common rival, the Austrians."
