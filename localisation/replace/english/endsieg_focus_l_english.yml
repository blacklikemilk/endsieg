    shared_GEN_political_correctness:0 "A Workers' Government"
    shared_GEN_political_correctness_desc:0 "The workers' movement has built the organisation needed to claim power. Its representatives will establish a government committed to the revolutionary programme."
    shared_GEN_indoctrination: "Indoctrination"
