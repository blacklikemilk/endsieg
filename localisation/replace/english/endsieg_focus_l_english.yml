    JAP_a_new_dawn: "A New Dawn"
    GER_a_new_dawn: "A New Dawn"



#Shared WW2
    shared_army_effort: "Army Effort"
    shared_army_effort_desc: "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
    shared_equipment_effort: "Equipment Effort"
    shared_equipment_effort_desc: "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
    shared_motorization_effort: "Motorization Effort"
    shared_motorization_effort_desc: "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
    shared_doctrine_effort: "Doctrine Effort"
    shared_doctrine_effort_desc: "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
    shared_equipment_effort_2: "Equipment Effort II"
    shared_equipment_effort_2_desc: "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
    shared_mechanization_effort: "Mechanization Effort"
    shared_mechanization_effort_desc: "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
    shared_doctrine_effort_2: "Doctrine Effort II"
    shared_doctrine_effort_2_desc: "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
    shared_equipment_effort_3: "Equipment Effort III"
    shared_equipment_effort_3_desc: "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
    shared_armor_effort: "Armor Effort"
    shared_armor_effort_desc: "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
    shared_special_forces: "Special Forces"
    shared_special_forces_desc: "We have need of elite forces; mountain troops and paratroopers should be our priority."
    shared_aviation_effort: "Aviation Effort"
    shared_aviation_effort_tt: "Not enough building slots for §YAir Base§!"
    shared_aviation_effort_desc: "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
    shared_fighter_focus: "Fighter Focus"
    shared_fighter_focus_desc: "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
    shared_bomber_focus: "Bomber Focus"
    shared_bomber_focus_desc: "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
    shared_aviation_effort_2: "Aviation Effort II"
    shared_aviation_effort_2_desc: "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
    shared_CAS_effort: "CAS Effort"
    shared_CAS_effort_desc: "A modern army needs support from vehicles not only on the ground, but also in the air."
    shared_rocket_effort: "Rocket Effort"
    shared_rocket_effort_desc: "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
    shared_NAV_effort: "NAV Effort"
    shared_NAV_effort_desc: "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
    shared_naval_effort: "Naval Effort"
    shared_naval_effort_tt: "Not enough building slots for §YNaval Dockyards§!"
    shared_naval_effort_desc: "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
    shared_flexible_navy: "Flexible Navy"
    shared_flexible_navy_desc: "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
    shared_large_navy: "Large Navy"
    shared_large_navy_desc: "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
    shared_submarine_effort: "Submarine Effort"
    shared_submarine_effort_desc: "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
    shared_cruiser_effort: "Cruiser Effort"
    shared_cruiser_effort_desc: "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
    shared_destroyer_effort: "Destroyer Effort"
    shared_destroyer_effort_desc: "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
    shared_capital_ships_effort: "Capital Ship Effort"
    shared_capital_ships_effort_desc: "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
    shared_industrial_effort: "Industrial Effort"
    shared_industrial_effort_desc: "Focus all our political efforts on building up the civilian industry in a great leap forward."
    shared_industrial_effort_2: "Industrial Effort II"
    shared_industrial_effort_2_desc: "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
    shared_construction_effort: "Construction Effort"
    shared_construction_effort_tt: "Not enough building slots for §YCivilian Factories§!"
    shared_construction_effort_desc: "Civilian industrial capacity must not be underestimated even when war looms over the world."
    shared_production_effort: "Armament Effort"
    shared_production_effort_tt: "Not enough building slots for §YMilitary Factory§!"
    shared_production_effort_desc: "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
    shared_construction_effort_2: "Construction Effort II"
    shared_construction_effort_2_desc: "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
    shared_production_effort_2: "Armament Effort II"
    shared_production_effort_2_desc: "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
    shared_production_effort_3: "Armament Effort III"
    shared_production_effort_3_desc: "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
    shared_infrastructure_effort: "Infrastructure Effort"
    shared_infrastructure_effort_desc: "A country without proper infrastructure cannot pursue advanced projects or constructions."
    shared_infrastructure_effort_tt: "Not enough building slots for §YInfrastructure§!"
    shared_synth_oil_effort_tt: "Not enough building slots for $YSynthetic Refinery$!"
    shared_infrastructure_effort_2: "Infrastructure Effort II"
    shared_infrastructure_effort_2_desc: "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
    shared_construction_effort_3: "Construction Effort III"
    shared_construction_effort_3_desc: "Expansion of our infrastructure network has significantly improved our capacity for construction."
    shared_nuclear_effort: "Nuclear Effort"
    shared_nuclear_effort_desc: "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
    shared_extra_tech_slot: "Extra Research Slot"
    shared_extra_tech_slot_desc: "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
    shared_extra_tech_slot_2: "Extra Research Slot II"
    shared_extra_tech_slot_2_desc: "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
    shared_technology_sharing: "Technology Sharing"
    shared_technology_sharing_desc: "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
    shared_secret_weapons: "Secret Weapons"
    shared_secret_weapons_desc: "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
    shared_political_effort: "Political Effort"
    shared_political_effort_desc: "To bring about change in the world, we need to be able to bring about change in our own country. Strengthening our political position should come first."
    shared_collectivist_ethos: "Collectivist Ethos"
    shared_collectivist_ethos_desc: "Our enemies may divide and conquer lesser nations, but our people will stand united. All for one and one for all."
    shared_liberty_ethos: "Liberty Ethos"
    shared_liberty_ethos_desc: "In this time of ideological fanatics who seek to suffocate the human spirit, we will safeguard individual liberties and freedom."
    shared_militarism: "Militarism"
    shared_militarism_desc: "Those who view the military as a necessary evil are doomed to hesitate in the face of war. We will ingrain militarism into our culture to become a people of soldiers."
    shared_political_correctness: "Political Correctness"
    shared_political_correctness_desc: "People holding mildly controversial or otherwise embarrassing opinions appear to be concerned that there is a wide-reaching conspiracy against them. This seems like an excellent idea."
    shared_neutrality_focus: "Neutrality Focus"
    shared_neutrality_focus_desc: "While others may claim it takes bravery and wisdom to take sides in a global conflict, we know it takes more to refuse."
    shared_interventionism_focus: "Interventionism Focus"
    shared_interventionism_focus_desc: "We value the freedom of all people, not only our own citizens. If preventing tyranny means war, then so be it."
    shared_military_youth: "Military Youth"
    shared_military_youth_desc: "Organizations to promote discipline and political education of young people in our nation will foster loyalty and self-sacrifice early."
    shared_deterrence: "Deterrence"
    shared_deterrence_desc: "Standing alone, we rarely benefit from war. Fortunately, we know that the best defense is one so well-known you never have to put it to use."
    shared_volunteer_corps: "Volunteer Corps"
    shared_volunteer_corps_desc: "Forcing our people to die for ideals of freedom would be an exercise in irony, but establishing means for those who wish to aid people abroad is not."
    shared_paramilitarism: "Paramilitarism"
    shared_paramilitarism_desc: "Military principles have applications outside of the military. With the development of semi-militarized units to complement our armed forces, more people will have military training."
    shared_indoctrination_focus: "Indoctrination"
    shared_indoctrination_focus_desc: "Having established our ideology as based on the truth, it may be taught as truth. Education and media must reflect this lesson."
    shared_foreign_expeditions: "Foreign Expeditions"
    shared_foreign_expeditions_desc: "With our enemies prepared to intervene in distant conflicts on behalf of their ideals, we must be ready to do the same for ours."
    shared_why_we_fight: "Why We Fight"
    shared_why_we_fight_desc: "The world is growing increasingly unsafe. Our people need to see the atrocities being committed by those who crave power. It is time we rally the people to our cause and ensure everyone is ready to fight for our freedom."
    shared_political_commissars: "Political Commissars"
    shared_political_commissars_desc: "To ensure that our policies are followed in military practice, we will introduce politically appointed officials into military ranks."
    shared_internationalism_focus: "Internationalism Focus"
    shared_internationalism_focus_desc: "Ideology knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
    shared_nationalism_focus: "Nationalism Focus"
    shared_nationalism_focus_desc: "Our nation is unique, and our political achievements could only have happened here. We must fight for it at any cost."
    shared_ideological_fanaticism: "Ideological Fanaticism"
    shared_ideological_fanaticism_desc: "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
    shared_air_innovation: "Air Innovations"
    shared_air_innovation_desc: "Modern wars cannot be won without dominating the skies. We must do everything in our power to develop the air force!"
    shared_air_innovation_2: "Air Innovations II"
    shared_air_innovation_2_desc: "Every advantage we can gain in the skies is precious. We should focus all of our efforts on developing our fighters."
    shared_naval_air_effort: "Naval Air Effort"
    shared_naval_air_effort_desc: "The efficacy of air strikes against naval targets was demonstrated by the Americans already back in 1921. We should not neglect this branch of the Air Force if we intend to wage war on a naval power."
# Shared WW1
    shared_a_new_dawn: "A New Dawn"
    shared_a_new_dawn_desc: ""
    shared_GEN_internal_politics: "Internal Politics"
    shared_GEN_internal_politics_desc: ""
    shared_GEN_powered_flight:0 "Create a Flying Service"
    shared_GEN_powered_flight_desc:0 "Experimental flying will become a government service with mechanics, officers and a defined budget. Organisation must come before mass production."
    shared_GEN_20_cent_military:0 "Reorganise the General Staff"
    shared_GEN_20_cent_military_desc:0 "A permanent planning staff must turn mobilisation tables into workable operations. We will first establish common standards for the whole army."
    shared_GEN_naval_effort:0 "A Naval Development Board"
    shared_GEN_naval_effort_desc:0 "The navy will draw up a programme our yards and treasury can support. Training and repairs must accompany every new ship order."
    shared_GEN_political_effort: "Political Effort"
    shared_GEN_political_effort_desc: ""
    shared_GEN_industrial_effort:0 "A National Development Plan"
    shared_GEN_build_engine: "Construct Engine"
    shared_GEN_build_engine_desc: ""
    shared_GEN_build_fuselage: "Construct Fuselage"
    shared_GEN_build_fuselage_desc: ""
    shared_GEN_build_airframe: "Construct Airframe"
    shared_GEN_build_airframe_desc: ""
    shared_GEN_scout_plane:0 "The Reconnaissance Squadron"
    shared_GEN_scout_plane_desc:0 "The first squadron will provide observations and maps for the army. Useful reconnaissance is a more immediate goal than spectacular aerial combat."
    shared_GEN_establish_airforce:0 "Establish the Air Headquarters"
    shared_GEN_establish_airforce_desc:0 "The flying service will receive a permanent headquarters and a system for allocating aircraft. Common reporting and supply arrangements will unite its squadrons."
    shared_GEN_air_armament:0 "Equip the Fighter Squadrons"
    shared_GEN_air_armament_desc:0 "Armed aircraft will protect observers and challenge enemy machines. A dedicated fighter programme will serve this practical purpose."
    shared_GEN_fighter_1:0 "Synchronised Armaments"
    shared_GEN_fighter_1_desc:0 "Improved armament installations will allow pilots to aim the whole aircraft at the enemy. Our designers will adapt the fighter to its growing task."
    shared_GEN_fighter_2:0 "Fighter Squadron Tactics"
    shared_GEN_fighter_2_desc:0 "Pilots will practise formation work, escorts and coordinated attacks. These lessons must improve the flying service without a leap to a future doctrine."
    shared_GEN_fighter_3:0 "A Standard Fighter Model"
    shared_GEN_fighter_3_desc:0 "The flying service needs interchangeable machines and parts. We will concentrate the next fighter order on a standard design."
    shared_GEN_cas_effort:0 "Support the Infantry from the Air"
    shared_GEN_cas_effort_desc:0 "Pilots and ground commanders will develop signals and target procedures for direct support. Aircraft must be useful to the troops rather than operate in isolation."
    shared_GEN_engine_1: "Improved Engine"
    shared_GEN_engine_1_desc: ""
    shared_GEN_interwar_cas:0 "The Ground-Attack School"
    shared_GEN_interwar_cas_desc:0 "A permanent school will preserve the lessons of direct air support. It will prepare the next aircraft generation through measured training and design work."
    shared_GEN_interwar_naval_aircraft:0 "The Maritime Aviation School"
    shared_GEN_interwar_naval_aircraft_desc:0 "A specialist school will coordinate air patrols with the fleet. It will improve our knowledge of the coastal approaches while training the next generation of crews."
    shared_GEN_interwar_tac_bomber:0 "Lessons for the Next Bomber"
    shared_GEN_interwar_tac_bomber_desc:0 "The next bomber programme will reflect the experience of crews and mechanics. Development will advance through practical lessons rather than prestige alone."
    shared_GEN_early_strategic_bomber:0 "Long-Range Bombing Experiments"
    shared_GEN_early_strategic_bomber_desc:0 "Long-range bombing remains an experimental task. We will investigate large aircraft without claiming an immediate ability to decide a war from the air."
    shared_GEN_fighter_engine: "Fighter Engine Effort"
    shared_GEN_fighter_engine_desc: ""
    shared_GEN_fighter_airframe: "Fighter Airframe Effort"
    shared_GEN_fighter_airframe_desc: ""
    shared_GEN_heavy_fighter:0 "Long-Range Fighter Trials"
    shared_GEN_heavy_fighter_desc:0 "An escort aircraft needs endurance as well as armament. Designers will test the compromises required to protect operations farther from our bases."
    shared_GEN_pilot_training_1:0 "A Central Flying School"
    shared_GEN_pilot_training_1_desc:0 "Qualified instructors and a common syllabus will expand the pool of pilots safely. Training is an independent requirement for every aircraft programme."
    shared_GEN_pilot_training_2:0 "Artillery Observation Training"
    shared_GEN_pilot_training_2_desc:0 "Observers will learn to report positions and corrections accurately. This links the aviation service to the army without making the aircraft a substitute for ground artillery."
    shared_GEN_pilot_training_3:0 "Squadron Maintenance Sections"
    shared_GEN_pilot_training_3_desc:0 "Each squadron will receive mechanics and a stock of standard spares. Ground organisation will keep our small flying force available for operations."
    shared_GEN_pilot_training_4:0 "Coordinate the Air Service"
    shared_GEN_pilot_training_4_desc:0 "Squadron maintenance and operational training must follow a common plan. Coordinating these services will make better use of the aircraft and crews already available to us."
    shared_GEN_pilot_training_5: "Pilot Training V"
    shared_GEN_pilot_training_5_desc: ""
    shared_GEN_naval_air_research:0 "Develop Naval Aviation"
    shared_GEN_naval_air_research_desc:0 "Coastal patrol experiments must be supported by trained crews and close cooperation with the navy. A common programme will turn promising aircraft into a useful maritime service."
    shared_GEN_naval_aircraft_1:0 "Train the Maritime Crews"
    shared_GEN_naval_aircraft_1_desc:0 "Navigation over water and recognition of ships require a specialist syllabus. Patrol crews will train alongside the coastal defence service."
    shared_GEN_naval_aircraft_2: "Naval Aircraft Effort II"
    shared_GEN_naval_aircraft_2_desc: ""
    shared_GEN_naval_aircraft_3:0 "A Maritime Aircraft Order"
    shared_GEN_naval_aircraft_3_desc:0 "The service will place a limited order for machines adapted to naval patrol. Range and dependable engines take priority over grand claims for air power."
    shared_GEN_bomber_research:0 "The Bomber Trials"
    shared_GEN_bomber_research_I: ""
    shared_GEN_bomber_1:0 "A Medium Bomber Programme"
    shared_GEN_bomber_1_desc:0 "A practical bomber must combine payload with range and reliability. Manufacturers will develop a machine the service can maintain in the field."
    shared_GEN_bomber_2:0 "Operational Bombing Exercises"
    shared_GEN_bomber_2_desc:0 "Navigators and crews will practise attacking depots and transport links. Experience and preparation must guide our bombing effort."
    shared_GEN_bomber_3:0 "Expand the Bomber Wings"
    shared_GEN_bomber_3_desc:0 "The bomber programme now has trained crews and a maintainable design. A measured expansion will add capacity to the aircraft industry."
    shared_GEN_heavy_bomb: "Construct Heavy Bomb"
    shared_GEN_heavy_bomb_desc: ""
    shared_GEN_medium_bomb: "Construct Medium Bomb"
    shared_GEN_medium_bomb_desc: ""
    shared_GEN_engine_2: "Upgraded Tactical Bomber Engine"
    shared_GEN_engine_2_desc: ""
    shared_GEN_equipment_effort_1:0 "A Standard Service Rifle"
    shared_GEN_equipment_effort_1_desc:0 "One dependable service rifle is worth more than several incompatible arsenals. The army will adopt a common specification and place a limited modernisation order."
    shared_GEN_equipment_effort_2:0 "Regimental Repair Sections"
    shared_GEN_equipment_effort_2_desc:0 "Weapons are only useful while they remain serviceable. Dedicated armourers will keep rifles and machine guns in action with the parts already at hand."
    shared_GEN_equipment_effort_3:0 "The Reserve Training System"
    shared_GEN_equipment_effort_3_desc:0 "Reservists will receive organised refresher courses before mobilisation. Shorter induction must come from preparation, rather than accepting untrained soldiers."
    shared_GEN_equipment_effort_4:0 "Reequip the Field Army"
    shared_GEN_equipment_effort_4_desc:0 "An active army requires reliable replacements and standardised weapon issues. Inspectors will concentrate procurement on formations serving at the front."
    shared_GEN_equipment_effort_5: "Equipment Effort V"
    shared_GEN_equipment_effort_5_desc: ""
    shared_GEN_support_weapons_1:0 "Organise the Field Batteries"
    shared_GEN_support_weapons_1_desc:0 "Artillery must be trained and supplied as part of a field formation. Common battery establishments will give the infantry dependable support."
    shared_GEN_support_weapons_2:0 "Survey the Fire Plans"
    shared_GEN_support_weapons_2_desc:0 "Accurate maps, observers and consistent reporting improve fire more than ammunition alone. The staff will develop a common artillery planning method."
    shared_GEN_support_weapons_3:0 "Combat Engineers and Field Hospitals"
    shared_GEN_support_weapons_3_desc:0 "Bridges, shelters and medical posts keep an army moving and fighting. Specialist support units will receive priority alongside the combat battalions."
    shared_GEN_support_weapons_4:0 "Coordinate the Barrage"
    shared_GEN_support_weapons_4_desc:0 "Infantry and artillery will rehearse their objectives together. A temporary programme of joint preparation will support the next offensive."
    shared_GEN_support_weapons_5: "Support Weapons V"
    shared_GEN_support_weapons_5_desc: ""
    shared_GEN_doctrine_effort_1:0 "The Staff College"
    shared_GEN_doctrine_effort_1_desc:0 "Officers must study the recent wars and test their conclusions in exercises. We will build a common foundation before choosing how the army will fight."
    shared_GEN_doctrine_effort_2:0 "Defence in Depth"
    shared_GEN_doctrine_effort_2_desc:0 "Fieldworks, reserves and local counterattacks will protect our limited manpower. The army will prepare to hold ground rather than seek a rapid war of movement."
    shared_GEN_doctrine_effort_3:0 "Mobile Field Exercises"
    shared_GEN_doctrine_effort_3_desc:0 "The army will practise concentration, marching and manoeuvre. Mobile reserves offer opportunity, but they demand more from our supply services."
    shared_GEN_doctrine_effort_4:0 "Learn from the Front"
    shared_GEN_doctrine_effort_4_desc:0 "Combat reports will feed directly into staff exercises. The chosen approach must evolve with experience rather than repeat the failures of the opening battles."
    shared_GEN_doctrine_effort_5: "Doctrine Effort V"
    shared_GEN_doctrine_effort_5_desc: ""
    shared_GEN_gas_mask_1:0 "Protect the Soldier"
    shared_GEN_gas_mask_1_desc:0 "Chemical threats require practical protection and instruction. The army will improve its masks and train soldiers to use them under fire."
    shared_GEN_gas_mask_2: "Gas Mask II"
    shared_GEN_gas_mask_2_desc: ""
    shared_GEN_gas_mask_3:0 "An Integrated Field Army"
    shared_GEN_gas_mask_3_desc:0 "The infantry, batteries, engineers and staff now have a common operating method. A final series of exercises will turn these reforms into a coherent force."
    shared_GEN_armored_cars_1:0 "Motor Patrols"
    shared_GEN_armored_cars_1_desc:0 "Armoured patrols can scout roads and secure communications without the expense of a tank army. We will begin with vehicles suited to this limited task."
    shared_GEN_armored_cars_2:0 "Mobile Reconnaissance Sections"
    shared_GEN_armored_cars_2_desc:0 "Motor patrols need trained crews, maintenance teams and reliable reports. The army will organise them as useful reconnaissance units."
    shared_GEN_armored_cars_3:0 "Motorised Supply Columns"
    shared_GEN_armored_cars_3_desc:0 "Vehicles must serve the transport service as well as the combat arms. A temporary priority for motor transport will help supplies reach the front."
    shared_GEN_armored_cars_4: "Armored Cars Effort IV"
    shared_GEN_armored_cars_4_desc: ""
    shared_GEN_armored_cars_5: "Armored Cars Effort V"
    shared_GEN_armored_cars_5_desc: ""
    shared_GEN_tank_engine:0 "Experimental Tracked Vehicles"
    shared_GEN_tank_engine_desc:0 "Tracked vehicles may carry armour and weapons over damaged ground. A small engineering programme will establish what can be built with our resources."
    shared_GEN_tank_armor: "Construct Tank Armor"
    shared_GEN_tank_armor_desc: ""
    shared_GEN_tank_gun:0 "The Assault Vehicle Trials"
    shared_GEN_tank_gun_desc:0 "The first machines must be tested with infantry and artillery before they receive operational orders. Trials will concentrate on reliable support of an assault."
    shared_GEN_early_tank:0 "A Trained Armoured Detachment"
    shared_GEN_early_tank_desc:0 "A modest trained detachment is a realistic beginning for mechanisation. We will issue standards for crews and recovery teams rather than promise an immediate armoured army."
    shared_GEN_defensive_navy:0 "Guard the Coastal Approaches"
    shared_GEN_defensive_navy_desc:0 "A small fleet can protect ports and shipping with patrol vessels and local knowledge. This practical programme takes priority over a battle fleet."
    shared_GEN_destroyer_effort:0 "The Torpedo-Boat Programme"
    shared_GEN_destroyer_effort_desc:0 "Small torpedo craft and destroyers are realistic building projects for our yards. They will protect the fleet and the coastal approaches."
    shared_GEN_cruiser_effort:0 "Light Cruiser Scouts"
    shared_GEN_cruiser_effort_desc:0 "A light cruiser force will extend the fleet's reconnaissance and protect distant shipping. The programme will concentrate on useful scouting vessels."
    shared_GEN_large_navy_effort:0 "Commit to a Battle Fleet"
    shared_GEN_large_navy_effort_desc:0 "An ocean-going fleet requires an expensive, sustained programme. The navy will accept a larger supply burden in exchange for coordinated fleet training."
    shared_GEN_experimental_submarine:0 "The Submarine Trials"
    shared_GEN_experimental_submarine_desc:0 "Underwater vessels offer an alternative to costly surface construction. Crews and yards will test their usefulness before a wider order is placed."
    shared_GEN_submarine_research:0 "Train the Submarine Flotilla"
    shared_GEN_submarine_research_desc:0 "The submarine service needs trained crews, shore maintenance and practical tactics. A limited programme will turn experiments into an operational flotilla."
    shared_GEN_capital_effort:0 "Modernise the Battle Line"
    shared_GEN_capital_effort_desc:0 "The navy will prepare a capital-ship programme supported by the yards. Designs must reflect the limits of our industry and the role of the fleet."
    shared_GEN_battle_cruiser_effort:0 "Fast Squadron Studies"
    shared_GEN_battle_cruiser_effort_desc:0 "Fast capital ships may support reconnaissance and distant operations. Designers will investigate the balance between speed, protection and cost."
    shared_GEN_modern_navy:0 "Exercise a Balanced Fleet"
    shared_GEN_take_position: "Take a Stance"
    shared_GEN_take_position_desc: ""
    shared_GEN_support_central_powers: "Support Central Powers"
    shared_GEN_state_claims:0 "State Our War Aims"
    shared_GEN_state_claims_desc:0 "Our prospective partners must understand what we expect from a common victory. A clear statement of war aims will give our diplomats a firmer negotiating position."
    shared_GEN_send_aid:0 "Seek German Military Supplies"
    shared_GEN_send_aid_desc:0 "Our army needs rifles that domestic workshops cannot yet provide. Procurement through Germany can equip a useful contingent and strengthen relations with Berlin."
    shared_GEN_send_volunteers_1: "Send Volunteers"
    shared_GEN_send_volunteers_1_desc: ""
    shared_GEN_join_cp: "Join the Central Powers"
    shared_GEN_join_cp_desc: ""
    shared_GEN_support_entente: "Support Entente"
    shared_GEN_support_entente_desc: ""
    shared_GEN_state_claims_2:0 "State Our War Aims"
    shared_GEN_send_aid_2:0 "Seek French Military Supplies"
    shared_GEN_send_aid_2_desc:0 "French arsenals can supply rifles while our own industry expands. A limited procurement programme will equip our troops and demonstrate the value of cooperation with Paris."
    shared_GEN_send_volunteers_2: "Send Volunteers"
    shared_GEN_send_volunteers_2_desc: ""
    shared_GEN_join_entente: "Join Entente"
