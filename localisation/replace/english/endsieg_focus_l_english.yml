 GE1_fighter_1_desc:0 "The Fliegertruppen organise fokker eindecker workshops around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_fighter_2:0 "Spandau Synchronized Guns"
 GE1_fighter_2_desc:0 "The Fliegertruppen organise spandau synchronized guns around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_fighter_3:0 "Albatros Scout Squadrons"
 GE1_fighter_3_desc:0 "The Fliegertruppen organise albatros scout squadrons around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_improved_fighter_1:0 "Mercedes Engine Trials"
 GE1_improved_fighter_1_desc:0 "The Fliegertruppen organise mercedes engine trials around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_improved_fighter_2:0 "Equip the Jagdstaffeln"
 GE1_improved_fighter_2_desc:0 "More reliable engines and a common squadron organisation will allow our fighters to operate as a coordinated force. Aircraft trials must serve the needs of the men who fly them."
 GE1_cas_research:0 "Infantry Contact Flights"
 GE1_cas_research_desc:0 "Fighter or bomber procurement can provide suitable aircraft for infantry liaison. Contact flights must also learn the demands of the front-line troops they support."
 GE1_cas_2:0 "Infantry-Air Liaison"
 GE1_cas_2_desc:0 "The Fliegertruppen organise infantry-air liaison around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_airfield_construction_1:0 "Doberitz Landing Grounds"
 GE1_airfield_construction_1_desc:0 "Training grounds in Brandenburg will provide a dependable base for the flying schools and reserve aircraft."
 GE1_airfield_construction_2:0 "Rhineland Aircraft Trial Fields"
 GE1_airfield_construction_2_desc:0 "Rhineland industry will support landing grounds for aircraft acceptance and maintenance trials."
 GE1_airfield_construction_3:0 "Silesian Squadron Stations"
 GE1_airfield_construction_3_desc:0 "Protected stations in Lower Silesia will train and service reserve formations before they move to the front."
 GE1_airfield_construction_4:0 "Dispersed Reserve Airfields"
 GE1_airfield_construction_4_desc:0 "Additional Silesian fields will disperse the air reserve and its ground crews. Reliable home facilities must support the operational flying service."
 GE1_anglo_german: "Anglo-German Naval Race"
 GE1_anglo_german_desc: "The naval race becomes a central imperial programme and gives the fleet a clear strategic purpose."
 GE1_fleet_law:0 "The 1912 Fleet Law"
 GE1_fleet_law_desc:0 "The Kaiserliche Marine centres its programme on 1912 fleet law. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_tirpitz_expands_fleet:0 "Tirpitz's Naval Programme"
 GE1_tirpitz_expands_fleet_desc:0 "The Kaiserliche Marine centres its programme on tirpitz's naval programme. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_kaiser_expands_fleet:0 "König-Class Battle Squadron"
 GE1_kaiser_expands_fleet_desc:0 "The Kaiserliche Marine centres its programme on könig-class battle squadron. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_cruiser_warfare:0 "Commerce Raider Cruisers"
 GE1_cruiser_warfare_desc:0 "The Kaiserliche Marine centres its programme on commerce raider cruisers. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_submarine_theory:0 "U-Boot Patrol Doctrine"
 GE1_submarine_theory_desc:0 "The Kaiserliche Marine centres its programme on u-boot patrol doctrine. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_BB_effort:0 "Nassau-Class Dreadnoughts"
 GE1_BB_effort_desc:0 "The Kaiserliche Marine centres its programme on nassau-class dreadnoughts. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_unrestricted_sub:0 "Resume Unrestricted U-Boot Warfare"
 GE1_unrestricted_sub_desc:0 "The Kaiserliche Marine centres its programme on resume unrestricted u-boot warfare. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_u_boat_campaign:0 "Launch the U-Boot Campaign"
 GE1_u_boat_campaign_desc:0 "The Kaiserliche Marine centres its programme on launch the u-boot campaign. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_continue_unrestricted_sub:0 "Continue Unrestricted Warfare"
 GE1_continue_unrestricted_sub_desc:0 "The Kaiserliche Marine centres its programme on continue unrestricted warfare. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_destroyer_effort:0 "Destroyer Escort Flotillas"
 GE1_destroyer_effort_desc:0 "The Kaiserliche Marine centres its programme on destroyer escort flotillas. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_cruiser_effort:0 "German Light Cruiser Slipways"
 GE1_cruiser_effort_desc:0 "The Kaiserliche Marine centres its programme on german light cruiser slipways. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_battle_cruiser_effort: "Battlecruiser Construction"
 GE1_battle_cruiser_effort_desc: "Battlecruisers combine speed and heavy guns for concentrated operations against vulnerable enemy squadrons."
 GE1_dockyard_1:0 "Kiel Slipway Programme"
 GE1_dockyard_1_desc:0 "The Kaiserliche Marine centres its programme on Kiel slipway expansion. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_dockyard_2:0 "Wilhelmshaven Slipway Programme"
 GE1_dockyard_2_desc:0 "The Kaiserliche Marine centres its programme on Wilhelmshaven slipway expansion. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_dockyard_3:0 "Emden Wartime Slipways"
 GE1_dockyard_3_desc:0 "The Kaiserliche Marine centres its programme on Emden wartime slipways. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_dockyard_4:0 "Wartime Slipway Shifts"
 GE1_dockyard_4_desc:0 "The Kaiserliche Marine centres its programme on wartime slipway shifts. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_industrial_effort: "Industrial Effort"
 GE1_industrial_effort_desc: "Germany organizes industrial growth around existing core capacity and current construction technology."
 GE1_war_materials:0 "The War Materials Board"
 GE1_war_materials_desc:0 "A central War Materials Board will reconcile military orders with raw materials and transport capacity. Its contracts create a real administrative tradeoff: more shells mean fewer civilian deliveries unless allocation becomes more precise."
 GE1_ersatz_program:0 "The Ersatz Programme"
 GE1_ersatz_program_desc:0 "Imported rubber, fibres and chemicals become harder to obtain as the sea routes close. Chemists and manufacturers must find workable substitutes, accepting additional processing costs and rejecting materials that cannot stand up to service at the front."
 GE1_blockade_adaptation:0 "Adapt to the Blockade"
 GE1_blockade_adaptation_desc:0 "Import controls, neutral channels and domestic substitutes must work as a single response to the blockade. Coordinated purchasing and transport can stretch our remaining access to overseas supplies, but cannot make the British patrols disappear."
 GE1_hindenburg_program:0 "The Hindenburg Programme"
 GE1_hindenburg_program_desc:0 "Hindenburg and Ludendorff demand a dramatic expansion of munitions, machine-gun and artillery production. The railway system, labour force and civilian economy must carry these orders; ambitious quotas will achieve little unless the government confronts the resources they consume."
 GE1_infrastructure_effort_1: "Infrastructure Effort I"
 GE1_infrastructure_effort_1_desc: "Core states receive targeted infrastructure work that improves movement and construction capacity."
 GE1_construction_effort_1: "Civilian Construction I"
 GE1_construction_effort_1_desc: "Civilian factories expand within owned core states where building slots are available."
 GE1_armament_effort_1: "Armament Construction I"
 GE1_armament_effort_1_desc: "Germany adds arms production in owned core states and keeps the investment on the map."
 GE1_infrastructure_effort_2: "Infrastructure Effort II"
 GE1_infrastructure_effort_2_desc: "A second infrastructure programme links industrial regions and front-line transport routes."
 GE1_construction_effort_2: "Civilian Construction II"
 GE1_construction_effort_2_desc: "Civilian construction expands again without creating factories outside the state system."
 GE1_armament_effort_2: "Armament Construction II"
 GE1_armament_effort_2_desc: "A second arms programme supports the growing demand for guns, shells and replacement equipment."
 GE1_infrastructure_effort_3: "Infrastructure Effort III"
 GE1_infrastructure_effort_3_desc: "Late-war infrastructure work focuses on bottlenecks that limit the national production network."
 GE1_armament_effort_3: "Armament Construction III"
 GE1_armament_effort_3_desc: "The armaments programme directs the last available capacity toward the war economy."
 GE1_construction_effort_3: "Civilian Construction III"
 GE1_construction_effort_3_desc: "Germany completes a final civilian construction wave where its core states still have room."
 # Austro-Hungarian Focus Tree

 AUH_naval_effort:0 "The Imperial and Royal Kriegsmarine"
 AUH_naval_effort_desc:0 "The fleet at Pola guards the Monarchy's Adriatic approaches and gives Vienna and Budapest a shared maritime service. Clear command arrangements and disciplined training must turn its limited strength into a force whose presence shapes enemy decisions."
 AUH_dreadnought: "Dreadnought Research"
 AUH_dreasnought_desc: ""
 AUH_better_weaponry:0 "Skoda Naval Gunnery"
 AUH_better_weaponry_desc:0 "Naval guns demand more than a powerful barrel: mounts, ammunition handling and fire control must function together at sea. Cooperation with Skoda and the fleet's gunnery officers will refine the battery systems fitted to our ships."
 AUH_submarine_theory:0 "Develop the U-Boat Arm"
 AUH_submarine_theory_desc:0 "Our small submarine arm offers a way to threaten hostile traffic without matching enemy battleships. Trials and specialized instruction will examine hull design, endurance and torpedo practice before further scarce yard capacity is committed."
 AUH_submarine_effort:0 "Pola U-Boat School"
 AUH_submarine_effort_desc:0 "Submarine crews must master navigation, machinery and torpedo attack in a cramped vessel with little margin for error. A permanent school at Pola will turn the experience of early patrols into instruction for new commanding officers and crews."
 AUH_destroyer_effort:0 "Tatra-Class Light Forces"
 AUH_destroyer_effort_desc:0 "Fast destroyers such as the Tatra class give the fleet scouts, escorts and a torpedo striking force suited to the Adriatic. Development work will emphasize seaworthiness, machinery reliability and the coordination needed for night operations."
 AUH_BB_effort:0 "The Tegetthoff Programme"
 AUH_BB_effort_desc:0 "The Tegetthoff-class dreadnoughts embody the Monarchy's ambitions at sea, but their construction commits immense sums and scarce industrial effort. The technical programme will consolidate hull and battery experience while headquarters reckon with the cost of maintaining capital ships."
 AUH_cruiser_effort:0 "Novara-Class Scout Cruisers"
 AUH_cruiser_effort_desc:0 "The Novara-class scouts can concentrate quickly and operate where battleships are too costly to risk. Improved cruiser development will give the fleet more effective reconnaissance and a suitable force for attacks on isolated enemy patrols."
 AUH_battle_cruiser_effort:0 "Fast Squadron Coordination"
 AUH_industrial_effort:0 "A Common Industrial Programme"
 AUH_industrial_effort_desc:0 "The industrial provinces possess complementary skills. Customs cooperation, transport investment and coordinated purchasing will connect them without changing the constitutional settlement."
 AUH_infrastructure_effort_1:0 "The Vienna-Budapest Artery"
 AUH_infrastructure_effort_1_desc:0 "Our central railway carries Hungarian grain and mobilization stores. Better approaches to both capitals will serve the common economy."
 AUH_infrastructure_effort_2:0 "Galician Supply Railways"
 AUH_infrastructure_effort_2_desc:0 "Galicia is far from our industrial centers. Improving transport around Krakow and Lwow will reduce the provincial bottlenecks."
 AUH_infrastructure_effort_3:0 "Carpathian Transport Services"
 AUH_infrastructure_effort_3_desc:0 "Poor mountain roads delay replacements and evacuations. Provincial transport services will improve access to the eastern front."
 AUH_construction_effort_1:0 "Viennese Engineering Workshops"
 AUH_construction_effort_1_desc:0 "New machine shops around Vienna will supply tools to smaller manufacturers. Expanding their facilities broadens civilian production."
 AUH_construction_effort_2:0 "Ganz and Hungarian Industry"
 AUH_construction_effort_2_desc:0 "Budapest needs machinery as much as Vienna does. Hungarian engineering must become a tangible partner in common development."
 AUH_construction_effort_3:0 "Moravian Machine Tools"
 AUH_construction_effort_3_desc:0 "Moravian workshops can supply the lathes and fittings needed throughout the monarchy. Expansion gives civilian industry a deeper base."
 AUH_armament_effort_1:0 "The Skoda Armament Works"
 AUH_armament_effort_1_desc:0 "Pilsen is indispensable to our artillery programme. The treasury will finance an additional production hall and its supply contracts."
 AUH_armament_effort_2:0 "Wollersdorf Ammunition Contracts"
 AUH_armament_effort_2_desc:0 "Our artillery requires a steady supply of shells. New ammunition contracts will expand output through paid procurement."
 AUH_armament_effort_3:0 "Emergency Armament Contracts"
 AUH_armament_effort_3_desc:0 "The army cannot wait for peacetime purchasing procedures. Additional Hungarian armament contracts will increase output through supervised procurement."
 AUH_airfield_construction_1:0 "Vienna Military Aerodromes"
 AUH_airfield_construction_1_desc:0 "The flying service needs prepared fields near its schools and technical workshops. Enlarging the military aerodrome facilities around Vienna will support training, acceptance flights and the dispatch of replacement aircraft."
 AUH_airfield_construction_2:0 "Styrian Aviation Facilities"
 AUH_airfield_construction_2_desc:0 "Styria and Carinthia offer rear-area space for aviation close enough to support southern operations. Prepared landing grounds and service accommodation will strengthen the link between the factories, flying schools and squadrons at the front."
 AUH_airfield_construction_3:0 "The Trieste Flying Stations"
 AUH_airfield_construction_3_desc:0 "Trieste connects the army's southern front to the Adriatic. Better flying facilities will support reconnaissance, coastal observation and maintenance without requiring crews to depend on improvised fields far from their assigned sector."
 AUH_airfield_construction_4:0 "Pola Naval Aviation Facilities"
 AUH_airfield_construction_4_desc:0 "Pola's naval stations need room for aircraft maintenance and coastal patrol preparation. Investment in aviation facilities will improve cooperation with the fleet and keep more reconnaissance sorties close to the approaches they must observe."
 AUH_dockyard_construction_1: "Dockyard Construction I"
 AUH_dockyard_construction_1_desc: ""
 AUH_dockyard_construction_2: "Dockyard Construction II"
 AUH_dockyard_construction_2_desc: ""
 AUH_dockyard_construction_3: "Dockyard Construction III"
 AUH_dockyard_construction_3_desc: ""
 AUH_dockyard_construction_4: "Dockyard Construction IV"
 AUH_dockyard_construction_4_desc: ""
 AUH_build_yards:0 "Agree the Naval Programme"
 AUH_build_yards_desc:0 "The navy cannot pursue every design while the army demands money, recruits and steel. A joint conference will establish practical naval priorities and relate shipyard orders to the force which the Monarchy can sustain."
 AUH_home_front_1:0 "Organize the Municipal Home Front"
 AUH_home_front_1_desc:0 "The towns must manage food, fuel and housing while the army absorbs resources. Municipal relief can prevent shortage from becoming administrative collapse."
 AUH_home_front_2:0 "Provincial Relief Boards"
 AUH_home_front_2_desc:0 "Relief must reach towns beyond Vienna. Provincial boards will coordinate funds and deliveries while recording unmet needs."
 AUH_home_front_3:0 "Protect Civilian Distribution"
 AUH_home_front_3_desc:0 "A minimum civilian ration is a military and social necessity. The home front will fund deliveries and inspect allocations despite the budgetary cost."
 AUH_war_front_1:0 "Reserve Battalions for the Carpathians"
 AUH_war_front_1_desc:0 "A winter campaign in the Carpathians demands trained replacement drafts and a clear rotation system. Rear-area schools will prepare reserve battalions for the conditions at the front while headquarters schedule relief before exhaustion destroys cohesion."
 AUH_war_front_2:0 "Organise the Isonzo Front"
 AUH_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 AUH_war_front_3:0 "Prepare the Caporetto Staff Plan"
 AUH_war_front_3_desc:0 "An offensive through the upper Isonzo requires secrecy, concentrated artillery and close coordination between assault formations. Staff officers will study the routes and objectives needed for a limited breakthrough, with supply plans setting the extent of the advance."
 AUH_army_effort:0 "The Imperial and Royal Army"
 AUH_army_effort_desc:0 "The Common Army binds the two halves of the Monarchy to one sovereign. Its regiments bring many languages and traditions into the same ranks; dependable training and supply must give that diversity a common military purpose."
 AUH_trench_warfare:0 "Fieldworks of the Pioneer Corps"
 AUH_trench_warfare_desc:0 "The engineers must prepare communications trenches, protected dugouts and drainage before prolonged fighting exposes the weakness of improvised positions. A fieldwork manual can carry practical lessons from fortress service into every infantry regiment."
 AUH_gas_mask_1:0 "Issue Respirators to the Front"
 AUH_gas_mask_1_desc:0 "Chemical warfare makes a dependable respirator part of the ordinary soldier's kit. Medical officers and company commanders must supervise fitting, storage and elementary gas alarms before unfamiliar equipment reaches the trenches."
 AUH_gas_mask_2:0 "Regimental Gas Defence Schools"
 AUH_gas_mask_2_desc:0 "Respirators alone cannot protect a regiment which does not recognize a gas attack. Dedicated instructors will rehearse alarm signals, relief procedures and the rapid replacement of damaged filters under field conditions."
 AUH_gas_mask_3:0 "Inspect the Respirator Supply"
 AUH_gas_mask_3_desc:0 "Long service and difficult transport wear out masks and filters. The army medical service must inspect reserve equipment and organize replacement batches so that veteran units retain reliable protection during another campaigning season."
 AUH_equipment_effort_1:0 "Standardise the Mannlicher Rifle"
 AUH_equipment_effort_1_desc:0 "The Mannlicher straight-pull rifle is already familiar to the ranks. Clear inspection standards, compatible ammunition batches and well stocked regimental armouries will make the existing weapon system easier to maintain through mobilization."
 AUH_equipment_effort_2:0 "Schwarzlose Machine-Gun Sections"
 AUH_equipment_effort_2_desc:0 "The water-cooled Schwarzlose gives infantry a dependable base of fire when crews understand its ammunition, cooling and transport requirements. Regimental training will place these guns where they can cover an advance or secure a threatened flank."
 AUH_equipment_effort_3:0 "Steyr Wartime Production Standards"
 AUH_equipment_effort_3_desc:0 "Rising orders at Steyr require consistent gauges, interchangeable parts and trained inspectors. Coordinating rifle and machine-gun specifications will reduce rejection rates without sacrificing the durability demanded by service in Galicia and the mountains."
 AUH_equipment_effort_4:0 "Carbines and Grenades for Assault Sections"
 AUH_equipment_effort_4_desc:0 "Compact weapons and plentiful grenades suit the close fighting around dugouts and mountain positions. Procurement officers will adapt infantry equipment to assault sections while retaining the Mannlicher system already supported by our workshops."
 AUH_artillery_effort_1:0 "Skoda Field-Gun Contracts"
 AUH_artillery_effort_1_desc:0 "The Skoda works at Pilsen are central to the army's artillery supply. Long-term contracts and consistent ammunition standards will let field batteries receive modern pieces and spares without dividing scarce industrial effort among incompatible orders."
 AUH_artillery_effort_2:0 "The Skoda 30.5 cm Mortar"
 AUH_artillery_effort_2_desc:0 "The heavy Skoda mortar can reduce positions which ordinary field artillery cannot reach. Its specialized batteries require transport, survey teams and carefully planned ammunition columns; investment in those services will make siege artillery usable beyond the fortress parks."
 AUH_artillery_effort_3:0 "Modernise the Howitzer Batteries"
 AUH_artillery_effort_3_desc:0 "High-angle fire is essential against protected trenches and mountain positions. Improved howitzer designs, trained gun layers and standardized ammunition tables will make our batteries more responsive to the infantry they support."
 AUH_artillery_effort_4:0 "Surveyed Fire and Battery Signals"
 AUH_artillery_effort_4_desc:0 "Accurate survey work and reliable signals allow guns to support an attack without wasteful ranging. Artillery schools will teach a common system of observation reports, fire tables and communications between batteries and forward officers."
 AUH_tactics_1:0 "Staff Rides and War Games"
 AUH_tactics_1_desc:0 "Map exercises should expose assumptions before mobilization makes them costly. The general staff will test deployment timetables, march routes and reserve commitments against the terrain and railway capacity of the Monarchy."
 AUH_tactics_2:0 "Lessons of Galicia"
 AUH_tactics_2_desc:0 "The opening campaigns show how rapidly an offensive can exhaust trained officers and outrun its artillery. Staff reports from Galicia will revise reconnaissance, march security and the commitment of reserves rather than treating every setback as a failure of courage."
 AUH_tactics_3:0 "Organise Defence in Depth"
 AUH_tactics_3_desc:0 "Regional formations will learn to hold successive positions and use local reserves. This programme gives priority to sustained defence rather than a specialised assault force."
 AUH_tactics_4:0 "Unify the Operational Lessons"
 AUH_tactics_4_desc:0 "The common staff will draw on either the defensive or assault programme. The resulting operational standards must be usable by the army as a whole."
 AUH_form_airforce:0 "The Luftfahrtruppen"
 AUH_form_airforce_desc:0 "The Monarchy's air service grows from balloon detachments and the first military flying experiments. A permanent organization must train pilots and observers, maintain aircraft and turn reconnaissance reports into information useful to the armies."
 AUH_bomber_focus:0 "Arm the Observation Aircraft"
 AUH_bomber_focus_desc:0 "Observation aircraft can defend themselves and carry a small bomb load without abandoning their main work over the front. Trials will determine practical armament arrangements for the two-seaters already entering squadron service."
 AUH_fighter_focus:0 "Create Dedicated Fighter Flights"
 AUH_fighter_focus_desc:0 "Reconnaissance will become increasingly hazardous unless specialist aircraft can challenge enemy patrols. Dedicated fighter flights will develop interception and escort methods while the technical service evaluates synchronized armament and suitable airframes."
 AUH_fighter_1:0 "Oeffag Albatros Production"
 AUH_fighter_1_desc:0 "Oeffag at Wiener Neustadt combines licensed Albatros designs with domestic manufacturing experience. Acceptance officers will test airframe strength, engine installation and armament so that the factory's machines can reach operational units with fewer modifications."
 AUH_fighter_2:0 "The Aviatik Berg Fighter"
 AUH_fighter_2_desc:0 "The Aviatik Berg offers a domestic approach to the single-seat fighter. Its development requires close contact between designers and combat pilots, with cooling, visibility and handling assessed alongside speed and armament."
 AUH_fighter_3:0 "Phonix Fighter Trials"
 AUH_fighter_3_desc:0 "The Phonix works can turn experience with earlier aircraft into a new fighter series. Service trials will judge reliability and maneuverability under operational loads before the air service commits its limited engines and skilled labour to larger orders."
 AUH_aviation_effort_1:0 "Wiener Neustadt Flying Instruction"
 AUH_aviation_effort_1_desc:0 "The military flying school at Wiener Neustadt can give new crews a common foundation. Carefully sequenced instruction, dual-control practice and experienced instructors will connect elementary flying to the demands of military service."
 AUH_pilot_training_1:0 "Pilot and Observer Partnerships"
 AUH_pilot_training_1_desc:0 "The pilot must bring the aircraft home while the observer completes the mission. Crew training will rehearse navigation, signal procedures and reconnaissance reporting together, creating partnerships before men reach an unfamiliar front squadron."
 AUH_aviation_effort_2:0 "Front Squadron Administration"
 AUH_aviation_effort_2_desc:0 "Front-line air companies need clear reporting channels, assigned patrol areas and dependable liaison with army headquarters. A revised squadron administration will extend the reach of our air service for the next year."
 AUH_pilot_training_2:0 "Combat Schools Behind the Front"
 AUH_pilot_training_2_desc:0 "Veteran crews can teach the lessons which elementary schools cannot reproduce. Rear-area combat courses will pass on formation discipline, evasive flying and observation techniques before inexperienced pilots encounter enemy aircraft."
 AUH_tactical_bomber_1:0 "Lohner and Lloyd Two-Seaters"
 AUH_tactical_bomber_1_desc:0 "Lohner and the Hungarian Lloyd works offer domestic experience in practical two-seat aircraft. The air service will compare their machines under field conditions, with particular attention to visibility, handling and the needs of the observer."
 AUH_tactical_bomber_2:0 "Aviatik C-Type Contracts"
 AUH_tactical_bomber_2_desc:0 "The Aviatik works can supply armed reconnaissance aircraft for the growing front squadrons. Standard contracts and acceptance tests will concentrate orders on machines able to carry an observer, ammunition and useful equipment over difficult terrain."
 AUH_tactical_bomber_3:0 "Phonix and UFAG Reconnaissance Types"
 AUH_tactical_bomber_3_desc:0 "The latest Phonix and UFAG two-seaters promise a more capable replacement for tired front-line machines. Evaluation teams will emphasize reliability, defensive armament and the ability to complete reconnaissance missions despite increasingly effective enemy fighters."
 AUH_strategic_bomber_research: "Strategic Bomber Research"
 AUH_strategic_bomber_research_desc: ""
 AUH_strat_bomber_1:0 "Trials of Heavy Bomb Loads"
 AUH_strat_bomber_1_desc:0 "A controlled series of loading and release trials will show what larger bombs demand of structure, stability and ground handling. The findings can guide a future heavy-aircraft programme without diverting whole squadrons from immediate reconnaissance work."
 AUH_improved_tac_1:0 "Observer Gunnery and Bomb Sights"
 AUH_improved_tac_1_desc:0 "A two-seater's observer must divide attention between reconnaissance, defence and bomb release. Common gunnery courses and calibrated sights will help crews perform those duties with the aircraft and equipment already in service."
 AUH_improved_tac_2:0 "Standardise Two-Seater Bomb Racks"
 AUH_improved_tac_2_desc:0 "Improvised bomb fittings make maintenance difficult and loading unsafe. The technical service will establish standard racks and release procedures for the domestic two-seater fleet, allowing workshops to prepare aircraft consistently for their assigned missions."
 AUH_improved_fighter_1:0 "Austro-Daimler Engine Workshops"
 AUH_improved_fighter_1_desc:0 "A fighter programme depends on engines which field mechanics can keep running. Specialist workshop teams will improve inspection, cooling-system maintenance and repair routines around the Austro-Daimler engines used by the domestic aircraft industry."
 AUH_improved_fighter_2:0 "Common Fighter Acceptance Standards"
 AUH_improved_fighter_2_desc:0 "Pilots should receive aircraft whose fittings and flying characteristics match the factory specification. A common acceptance system for Oeffag, Aviatik and Phonix will make the expanding fighter force easier to supply and maintain."
 AUH_cas_research:0 "Infantry Contact Patrols"
 AUH_cas_research_desc:0 "Infantry operations create demands which ordinary reconnaissance reports answer too slowly. Contact patrols will practice locating our forward troops, reporting their progress and carrying messages between threatened sectors and army headquarters."
 AUH_cas_2:0 "Low-Level Support Trials"
 AUH_cas_2_desc:0 "Flying close to the battlefield exposes aircraft to ground fire as well as enemy fighters. Limited trials will develop methods for supporting infantry with small bomb loads while retaining realistic objectives and routes back to protected airfields."
 AUH_entente_diplomacy:0 "Contact the Entente"
 AUH_entente_diplomacy_desc:0 "A confidential channel lets the emperor explore peace terms. Our enemies remain free to reject them and our allies will expect an explanation."
 AUH_seperate_peace:0 "Pursue a Negotiated Peace"
 AUH_seperate_peace_desc:0 "A separate settlement cannot be imposed by a focus alone. France must reply and alliance obligations remain relevant; humanitarian relief may be the only possible agreement."
 AUH_befriend_italy:0 "Repair the Triple Alliance"
 AUH_befriend_italy_desc:0 "Italy is a treaty partner with territorial ambitions of its own. Reopened talks will test whether consultation can keep Rome out of an opposing camp."
 AUH_subdue_italy:0 "Hold the Italian Front"
 AUH_subdue_italy_desc:0 "If Italy chooses war, the army must secure the passes and coast. The ministry will close its failed negotiations and support a sustained frontier campaign."
 AUH_cede_tyrol:0 "Offer Trentino and South Tyrol"
 AUH_cede_tyrol_desc:0 "Territorial concessions might keep Italy neutral. Trentino and South Tyrol will be transferred only if Rome accepts the offer."
 AUH_cede_tyrol_and_istria:0 "Extend the Italian Concessions"
 AUH_cede_tyrol_and_istria_desc:0 "Trieste and the Istrian coast can be added to the bargaining table. This grave sacrifice of imperial territory still requires Italian consent."
 AUH_promise_italy:0 "Promise an Allied Settlement"
 AUH_promise_italy_desc:0 "Diplomatic support for Italian ambitions elsewhere offers an alternative to territorial concessions. Rome must explicitly accept before receiving an alliance invitation."
 AUH_italy_central_power:0 "Bring Italy into the Alliance"
 AUH_italy_central_power_desc:0 "An accepted offer opens a different future for the Triple Alliance. Italy can join only with its consent and an existing German-led faction."
 AUH_diplomatic_effort:0 "The Ballhausplatz"
 AUH_diplomatic_effort_desc:0 "The foreign ministry must defend a multinational empire in a hostile Europe. Clear embassy instructions preserve room for negotiation alongside the German alliance."
 AUH_annex_bosnia:0 "Consolidate Bosnia-Herzegovina"
 AUH_annex_bosnia_desc:0 "Annexation has changed our Balkan position. Civil administration must now replace the uncertainty of occupation and justify its demands on the treasury."
 AUH_anti_serb_rhetoric:0 "Confront Serbian Nationalism"
 AUH_anti_serb_rhetoric_desc:0 "Serbian nationalism threatens our South Slav provinces. The ministry must decide whether confrontation or restraint best serves the monarchy."
 AUH_dominate_balkan_SOI:0 "Defend the Balkan Position"
 AUH_dominate_balkan_SOI_desc:0 "Our western Balkan influence depends on reliable commitments. The ministry will consolidate its diplomatic position before making further demands."
 AUH_pro_germany:0 "The German Alliance"
 AUH_pro_germany_desc:0 "Berlin is the foundation of our security. Joint planning strengthens the alliance without surrendering every diplomatic decision to Germany."
 AUH_bulgaria_friend:0 "Negotiate with Sofia"
 AUH_bulgaria_friend_desc:0 "Bulgaria seeks a revision of the Balkan settlement. Its territorial aspirations must be negotiated if it is to become a dependable ally."
 AUH_prepare_for_war:0 "Approve Mobilization Planning"
 AUH_prepare_for_war_desc:0 "A Balkan war makes immediate demands on railways and finance. Concrete mobilization plans must be agreed before the common army can execute them."
 AUH_ottoman_friends:0 "The Ottoman Connection"
 AUH_ottoman_friends_desc:0 "The Ottoman Empire faces similar strategic pressures. Diplomatic and military liaison can turn a distant partner into a useful ally."
 AUH_confiscate_serb_grain:0 "Serbian Occupation Supplies"
 AUH_confiscate_serb_grain_desc:0 "We must choose between requisitions and paid grain purchases in occupied Serbia. Coercion improves supply at a cost to confidence at home."
 AUH_volunteer_albania:0 "The Albanian Liaison Mission"
 AUH_volunteer_albania_desc:0 "Albanian recruits and local knowledge can support Balkan operations. Officers and liaison services must be funded rather than producing an unexplained army."
 AUH_cede_macedonia_bulgaria:0 "Settle Bulgarian Claims"
 AUH_cede_macedonia_bulgaria_desc:0 "Bulgaria expects a voice in the Macedonian settlement. We can transfer only territory we actually own to a partner in the same alliance."
 AUH_massive_war_effort:0 "The Final Wartime Commitment"
 AUH_massive_war_effort_desc:0 "The ministries can coordinate a final effort, but new obligations strain credit and food supplies. Its costs must be acknowledged rather than conjuring men and material."
 AUH_central_powers_diplomacy:0 "The Allied War Council"
 AUH_central_powers_diplomacy_desc:0 "Our allies do not share identical aims. A standing liaison network must translate common interests into practical cooperation."
 AUH_german_advisors:0 "German Staff Liaison"
 AUH_german_advisors_desc:0 "A limited German advisory mission can exchange operational experience with our staff. It will improve coordination without replacing common army command."
 AUH_german_troops:0 "Request German Replacement Cadres"
 AUH_german_troops_desc:0 "Berlin can be asked for a limited replacement contingent. The German government pays the manpower cost and retains the right to decline."
 AUH_send_germany_aid:0 "Supply German Units"
 AUH_send_germany_aid_desc:0 "Equipment support must come from our stockpile. A thousand infantry weapons can be offered to Germany or retained for our own front."
 AUH_send_germany_troops:0 "Replacements for the German Front"
 AUH_send_germany_troops_desc:0 "The alliance must share burdens as well as advice. A limited replacement contingent will come from our own manpower."
 AUH_turkish_reinforcements:0 "Request Ottoman Replacement Cadres"
 AUH_turkish_reinforcements_desc:0 "Our Ottoman ally may release a small reserve for common service. The request imposes a real manpower cost on the donor."
 AUH_send_turkey_troops:0 "Personnel for Ottoman Service"
 AUH_send_turkey_troops_desc:0 "A small contingent can support the Ottoman front. The final decision draws three thousand men from our own reserve."
 AUH_send_turkey_weapons:0 "An Ottoman Equipment Mission"
 AUH_send_turkey_weapons_desc:0 "Reliable weapons must come with a supply chain. The mission will transfer actual stockpiled equipment, subject to our final approval."
 AUH_political_effort:0 "The Dual Monarchy"
 AUH_political_effort_desc:0 "Two governments and several common ministries hold the empire together. Effective administration needs cooperation between Vienna and Budapest within the limits of the 1867 settlement."
 AUH_imperial_stability:0 "A Working Common Government"
 AUH_imperial_stability_desc:0 "Vienna and Budapest must keep the common ministries working despite competing interests. Reliable public services and a functioning cabinet are the foundations of the monarchy; neglect at home will undermine every effort at the front."
 AUH_focus_military:0 "Reorganise the Army High Command"
 AUH_focus_military_desc:0 "The Armeeoberkommando must connect front-line reports to realistic orders and available transport. A command conference will clarify responsibilities between the general staff, army headquarters and the ministries which supply them."
 AUH_focus_internal_issues:0 "Negotiate with the Nationalities"
 AUH_focus_internal_issues_desc:0 "Ministers must hear provincial grievances rather than treat every demand as disloyalty. Practical concessions remain possible within the existing constitution."
 AUH_supress_minorities:0 "Wartime Press and Police Powers"
 AUH_supress_minorities_desc:0 "Censorship can coordinate the wartime press, but restrictions alienate provincial representatives and cost public confidence. The cabinet must weigh immediate control against a broader constitutional settlement."
 AUH_polish_legions:0 "Recognise the Polish Legions"
 AUH_polish_legions_desc:0 "Polish volunteers can serve alongside the Common Army while pursuing hopes of a restored homeland. Formal liaison, reliable equipment accounting and respect for their officers will establish a workable military relationship with these formations."
 AUH_war_effort_1:0 "The War Services Law"
 AUH_war_effort_1_desc:0 "Mobilization requires legal arrangements for labor, transport and army orders. The ministries will coordinate the effort and record its liabilities."
 AUH_war_effort_2:0 "Coordinate Army Purchasing"
 AUH_war_effort_2_desc:0 "Military buyers compete for the same wagons, labor and raw materials. Central purchasing improves coordination while increasing common liabilities."
 AUH_war_effort_3:0 "Reserve Civilian Food Allocations"
 AUH_war_effort_3_desc:0 "The army cannot requisition every remaining stock. Distribution rules must preserve a minimum civilian allocation and keep the towns working."
 AUH_hungarian_support:0 "Secure the Hungarian Compromise"
 AUH_hungarian_support_desc:0 "Budapest controls indispensable revenue and agricultural supplies. Common government must negotiate cooperation instead of assuming Hungarian support."
 AUH_coronation:0 "Karl Takes the Hungarian Oath"
 AUH_coronation_desc:0 "Karl has succeeded Franz Joseph and must confirm the constitutional relationship with Hungary. His crown oath belongs to the accession settlement of late 1916."
 AUH_strategic_bomber_research_1:0 "Study the Heavy Aircraft Proposals"
 AUH_strategic_bomber_research_1_desc:0 "Heavy aircraft promise longer missions and larger bomb loads, but our workshops and engines impose strict limits. A technical commission will review proposals, test their assumptions and identify which elements deserve further development."
 AUH_dockyard_1:0 "Modernise the Pola Arsenal"
 AUH_dockyard_1_desc:0 "Pola is the fleet's principal arsenal, with the workshops and personnel needed to support its heaviest ships. Enlarging productive capacity there will improve maintenance and construction at the center of the naval establishment."
 AUH_dockyard_2:0 "Trieste Shipyard Contracts"
 AUH_dockyard_2_desc:0 "The yards of Trieste bring industrial skill and merchant experience to naval construction. Carefully specified contracts will expand the capacity available to the fleet while maintaining the fittings and standards expected by its technical officers."
 AUH_dockyard_3:0 "The Fiume Naval Workshops"
 AUH_dockyard_3_desc:0 "Fiume connects Hungarian industrial interests to the common fleet. Investment in its shipbuilding workshops will spread naval work across both halves of the Monarchy and strengthen a port already associated with torpedoes and marine engineering."
 AUH_dockyard_4:0 "Repair Facilities at Cattaro"
 AUH_dockyard_4_desc:0 "The southern base at Cattaro allows light forces and submarines to operate closer to the entrance of the Adriatic. Local repair facilities will reduce the need to return every damaged or worn vessel to Pola."
  # French Republic Focus Tree (WWI)

 FR3_tank_research_1:0 "Armoured Tractor Trials"
 FR3_tank_research_1_desc:0 "French workshops test armoured tractors as a way to cross wire and shell craters. The trials establish the mechanical questions that later tank crews must answer."
 FR3_tank_research_2:0 "Schneider and Saint-Chamond Boards"
 FR3_tank_research_2_desc:0 "The Schneider and Saint-Chamond projects receive boards to record armour, engines, and crew visibility. Their reports expose the difference between a steel prototype and a useful assault vehicle."
 FR3_tank_research_3:0 "Saint-Chamond Mobility Lessons"
 FR3_tank_research_3_desc:0 "Saint-Chamond crews report how long hulls and weak tracks behave on broken ground. Engineers use the failures to prioritise steering, traction, and practical field repair."
 FR3_tank_research_4:0 "Renault FT Development"
 FR3_tank_research_4_desc:0 "The Renault FT places its turret, engine, and crew around a compact battlefield role. Production trials focus on reliability and numbers so armour can support infantry in 1918."
 FR3_naval_effort:0 "French Naval Reorganisation"
 FR3_naval_effort_desc:0 "The Marine Nationale reorganises yards, staffs, and overseas stations around the demands of a long war. Mediterranean routes and troop movements receive priority over prestige alone."
 FR3_dreadnought:0 "Dreadnought Programme"
 FR3_dreasnought_desc: ""
 FR3_better_weaponry: "Improved Naval Weaponry"
 FR3_better_weaponry_desc: ""
 FR3_submarine_theory:0 "Submarine Theory"
 FR3_submarine_theory_desc:0 "Submarine officers study patrol lines, battery endurance, and the limits of torpedo attacks. Their theory favours disciplined reconnaissance and careful use of scarce boats."
 FR3_submarine_effort:0 "Submarine Flotillas"
 FR3_submarine_effort_desc:0 "Submarine flotillas receive crews, torpedoes, and maintenance cycles suited to Mediterranean patrols. Boats are assigned to useful approaches instead of scattered across an impossible search area."
 FR3_destroyer_effort:0 "Destroyer Flotillas"
 FR3_destroyer_effort_desc:0 "Destroyer flotillas are drilled to screen heavier ships, hunt submarines, and escort troop convoys. Their value lies in persistent presence rather than a single dramatic fleet sortie."
 FR3_BB_effort:0 "Courbet Battleship Line"
 FR3_BB_effort_desc:0 "The Courbet battleship line keeps French capital ships ready for guarded fleet action. Gunnery practice is matched to fuel management and the narrow waters around the Italian and Adriatic routes."
 FR3_cruiser_effort:0 "Mediterranean Cruiser Squadrons"
 FR3_cruiser_effort_desc:0 "Mediterranean cruisers combine scouting, commerce protection, and rapid reinforcement between French bases. Captains learn to report contact without exposing the squadron to a stronger enemy."
 FR3_battle_cruiser_effort:0 "Fast Capital Ships"
 FR3_industrial_effort:0 "France's Industrial Base"
 FR3_industrial_effort_desc:0 "Coal, steel, railways and skilled workshops form the basis of French industry. Coordinate their development before military orders and a continental war put that system under strain."
 FR3_infrastructure_effort_1: "Infrastructure Effort I"
 FR3_infrastructure_effort_1_desc: ""
 FR3_infrastructure_effort_2: "Infrastructure Effort II"
 FR3_infrastructure_effort_2_desc: ""
 FR3_infrastructure_effort_3: "Infrastructure Effort III"
 FR3_infrastructure_effort_3_desc: ""
 FR3_construction_effort_1: "Construction Effort I"
 FR3_construction_effort_1_desc: ""
 FR3_construction_effort_2: "Construction Effort II"
 FR3_construction_effort_2_desc: ""
 FR3_construction_effort_3: "Construction Effort III"
 FR3_construction_effort_3_desc: ""
 FR3_armament_effort_1: "Armament Effort I"
 FR3_armament_effort_1_desc: ""
 FR3_armament_effort_2: "Armament Effort II"
 FR3_armament_effort_2_desc: ""
 FR3_armament_effort_3: "Armament Effort III"
 FR3_armament_effort_3_desc: ""
 FR3_airfield_construction_1:0 "Forward Landing Grounds I"
 FR3_airfield_construction_1_desc:0 "The first forward landing grounds mark safe strips, fuel points, and simple shelters near the army. Their placement shortens observation cycles without exposing every aircraft to one raid."
 FR3_airfield_construction_2:0 "Forward Landing Grounds II"
 FR3_airfield_construction_2_desc:0 "Expanded landing grounds add repair space, telephones, and camouflage for operating escadrilles. A dispersed network keeps one cratered field from silencing an entire sector."
 FR3_airfield_construction_3:0 "Forward Landing Grounds III"
 FR3_airfield_construction_3_desc:0 "Third-line airfields organise reserve aircraft and weather reporting behind the front. Squadrons can rotate worn machines while observers keep flying from nearer strips."
 FR3_airfield_construction_4:0 "Forward Landing Grounds IV"
 FR3_airfield_construction_4_desc:0 "The final field programme links roads, fuel stores, and anti-aircraft sentries around the aviation network. More resilient bases preserve sortie rates during a major offensive."
 FR3_dockyard_1:0 "Toulon Dockyard Expansion"
 FR3_dockyard_1_desc:0 "Toulon adds slips, cranes, and trained artificers to keep warships moving through refit. Early improvements remove bottlenecks that turn a minor defect into a lost patrol."
 FR3_dockyard_2:0 "Brest Yard Workshops"
 FR3_dockyard_2_desc:0 "Brest workshops standardise hull repairs, boilers, and gun maintenance for the Atlantic fleet. Their records help crews return to sea with fewer delays between patrols."
 FR3_dockyard_3:0 "Mediterranean Yard Rotation"
 FR3_dockyard_3_desc:0 "Mediterranean yards rotate repair teams and critical spares between Toulon and Bizerte. The practice spreads workload without abandoning ships tied to convoy duty."
 FR3_dockyard_4:0 "Emergency Dockyard Stores"
 FR3_dockyard_4_desc:0 "Emergency stores hold plates, shells, cables, and engineering tools close to the fleet bases. A prepared magazine gives damaged ships a chance to return before a threat moves on."
 FR3_homefront: "Homefront Focus I"
 FR3_homefront_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 FR3_homefront_2: "Homefront Focus II"
 FR3_homefront_2_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 FR3_homefront_3: "Homefront Focus III"
 FR3_homefront_3_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 FR3_war_front: "Frontline Focus I"
 FR3_war_front_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 FR3_war_front_2: "Frontline Focus II"
 FR3_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 FR3_war_front_3: "Frontline Focus III"
 FR3_war_front_3_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 FR3_army_effort:0 "Army Modernisation"
 FR3_army_effort_desc:0 "Paris commissions a permanent programme for infantry, gunnery, engineers, and staff work. The aim is a trained republican field army that can mobilise before the next crisis."
 FR3_trench_warfare:0 "Trench Engineering Corps"
 FR3_trench_warfare_desc:0 "Sapeur-pionniers standardise wire, shelters, and communication trenches before the front hardens. Their manuals give infantry a defensive craft grounded in pre-war engineering."
 FR3_gas_mask_1:0 "Chemical Warning Section"
 FR3_gas_mask_1_desc:0 "A chemical warning section links sentries, weather reports, and medical posts along the front. Early alarms buy infantry the minutes needed to fit masks and close dugouts."
 FR3_gas_mask_2:0 "Improved Respirators"
 FR3_gas_mask_2_desc:0 "Improved respirators are tested against persistent gas and issued with drills for rapid fitting. Medical officers turn protection from a personal improvisation into a unit routine."
 FR3_gas_mask_3:0 "Gas Discipline"
 FR3_gas_mask_3_desc:0 "Gas discipline joins sentry drills, decontamination parties, and medical reporting. Units that master the routine can keep their weapons and communications working after a cloud attack."
 FR3_equipment_effort_1:0 "Lebel and Hotchkiss Stocks"
 FR3_equipment_effort_1_desc:0 "Lebel rifles and Hotchkiss machine guns are counted, inspected, and issued through reserve depots. The board treats ammunition and spare parts as part of the weapon system."
 FR3_equipment_effort_2:0 "Berthier Reserve Rifles"
 FR3_equipment_effort_2_desc:0 "Berthier rifles and reserve armouries close the gap between mobilisation tables and field issue. Regional workshops learn to repair mixed stocks without waiting for Paris."
 FR3_equipment_effort_3:0 "Chauchat Section Fire"
 FR3_equipment_effort_3_desc:0 "The Chauchat gives rifle sections more automatic fire, but its faults demand careful maintenance and ammunition control. Instructors teach gunners how to keep the weapon working under mud and heat."
 FR3_equipment_effort_4:0 "Rifle Grenades and VB Launchers"
 FR3_equipment_effort_4_desc:0 "Rifle grenades and Viven-Bessière launchers give platoons a local answer to wire and firing points. Their issue is paired with range cards so small units can act before heavy guns arrive."
 FR3_artillery_effort_1:0 "75 mm Mle 1897 Batteries"
 FR3_artillery_effort_1_desc:0 "The 75 mm Mle 1897 remains France’s rapid-fire workhorse. Batteries practise observation and short concentrations instead of relying on parade-ground gunnery."
 FR3_artillery_effort_2:0 "105 mm and 155 mm Howitzers"
 FR3_artillery_effort_2_desc:0 "105 mm and 155 mm pieces enter the artillery programme as trench depth defeats the 75. Heavy batteries learn to exchange range tables with forward observers."
 FR3_artillery_effort_3:0 "Counter-Battery Service"
 FR3_artillery_effort_3_desc:0 "A counter-battery service compares sound ranging, flash spotting, and aerial photographs. Its purpose is to suppress hostile guns before they can break an infantry assault."
 FR3_artillery_effort_4:0 "Railway Guns and Heavy Shells"
 FR3_artillery_effort_4_desc:0 "Railway guns and heavy shell stocks extend the reach of French fire plans beyond the field battery. Rail officers coordinate movement, concealment, and ammunition at scarce junctions."
 FR3_tactics_1:0 "General Staff Manoeuvres"
 FR3_tactics_1_desc:0 "The General Staff turns peacetime manoeuvres into studies of mobilisation, maps, and artillery timing. Staff officers learn where a plan breaks when railways and roads are under fire."
 FR3_tactics_2:0 "Open-Order Infantry"
 FR3_tactics_2_desc:0 "Infantry schools teach smaller bounds, fire teams, and movement behind covering fire. The lesson replaces dense parade formations with formations that can survive machine guns."
 FR3_tactics_3:0 "Battalion Battle Schools"
 FR3_tactics_3_desc:0 "Battalion schools rehearse platoon objectives, reserve timings, and liaison with guns. Experienced non-commissioned officers carry those rehearsals back to exhausted front units."
 FR3_tactics_4:0 "All-Arms Fire Planning"
 FR3_tactics_4_desc:0 "All-arms planning puts infantry objectives, artillery lifts, engineers, and signals on one timetable. The staff measures success by sustained movement after the first barrage rather than by the opening bombardment."
 FR3_form_airforce:0 "French Military Aviation"
 FR3_form_airforce_desc:0 "France establishes a unified military aviation service from scattered army experiments. Its first duty is to see the battlefield clearly and return that information to commanders."
 FR3_bomber_focus:0 "Aerial Bombardment"
 FR3_bomber_focus_desc:0 "Aerial bombardment units study target selection, weather, and the limits of small wartime loads. Their reports favour repeatable attacks on railheads and batteries over theatrical destruction."
 FR3_fighter_focus:0 "Fighter Protection"
 FR3_fighter_focus_desc:0 "Fighter protection assigns patrols to shield observation aircraft and vulnerable formations. Pilots learn that denying the enemy a view can matter as much as claiming the sky."
 FR3_fighter_1:0 "SPAD Fighter Trials"
 FR3_fighter_1_desc:0 "SPAD fighter trials compare climbing power, armament, and serviceability under field conditions. The results favour machines that can reach a fight quickly and return for another sortie."
 FR3_fighter_2:0 "Nieuport and SPAD Escadrilles"
 FR3_fighter_2_desc:0 "Nieuport and SPAD escadrilles divide interception, escort, and reconnaissance duties. Clear assignments keep experienced pilots from being wasted on every possible mission."
 FR3_fighter_3:0 "Final Fighter Standardisation"
 FR3_fighter_3_desc:0 "Final fighter standardisation reduces the number of patterns crews must maintain at forward fields. Mechanics and pilots gain reliability when parts, ammunition, and procedures match."
 FR3_aviation_effort_1:0 "Aerial Reconnaissance"
 FR3_aviation_effort_1_desc:0 "Aerial reconnaissance maps trenches, roads, and artillery flashes before an attack. Observers turn photographs into practical corrections for army headquarters and gun batteries."
 FR3_pilot_training_1:0 "Pilot Training Schools"
 FR3_pilot_training_1_desc:0 "Pilot training schools teach navigation, observation, and emergency landings alongside flying skill. Graduates reach the front with habits that preserve both aircraft and information."
 FR3_aviation_effort_2:0 "Forward Observation Flights"
 FR3_aviation_effort_2_desc:0 "Forward observation flights keep aircraft close enough to correct artillery yet high enough to survive rifle fire. Their reports connect a moving barrage to the ground it is meant to cover."
 FR3_pilot_training_2:0 "Advanced Flight Training"
 FR3_pilot_training_2_desc:0 "Advanced flight training adds formation work, reconnaissance discipline, and recovery from damaged engines. Veteran instructors turn hard lessons into procedures new pilots can repeat."
 FR3_tactical_bomber_1:0 "Develop Tactical Bombers"
 FR3_tactical_bomber_1_desc:0 "Aircraft trials and operational exercises must inform one another. A common programme for bomber development will turn promising designs into an effective force over the battlefield."
 FR3_tactical_bomber_2:0 "Tactical Bombing II"
 FR3_tactical_bomber_2_desc:0 "Tactical bombing expands into scheduled attacks on reserves and artillery parks. Better navigation gives commanders a chance to disrupt a battle before reinforcements arrive."
 FR3_tactical_bomber_3:0 "Expand the Bomber Force"
 FR3_tactical_bomber_3_desc:0 "The experience gained by our first bomber formations must be put to use. Better aircraft and trained crews will allow us to strike more effectively beyond the enemy front."
 FR3_strategic_bomber_research_1:0 "Long-Range Bombing Studies"
 FR3_strategic_bomber_research_1_desc:0 "Long-range bombing studies examine engines, navigation, and the reach of French aircraft. Planners keep the project tied to available airframes and real targets beyond the front."
 FR3_strat_bomber_1:0 "Independent Bombing Force"
 FR3_strat_bomber_1_desc:0 "An independent bombing force receives staff procedures for target lists, weather, and escort requests. Its autonomy improves concentration while keeping missions connected to national war aims."
 FR3_improved_tac_1: "Improved TAC Bomber Modication I"
 FR3_improved_tac_1_desc: ""
 FR3_improved_tac_2: "Improved TAC Bomber Modification II"
 FR3_improved_tac_2_desc: ""
 FR3_improved_fighter_1:0 "Improved Fighter Engines"
 FR3_improved_fighter_1_desc:0 "Improved fighter engines are tested for altitude, acceleration, and endurance rather than paper speed alone. The service selects gains that help a pilot break contact or reach an observer in time."
 FR3_improved_fighter_2: "Improved Fighter Modification II"
 FR3_improved_fighter_2_desc: ""
 FR3_cas_research:0 "Close Support Studies"
 FR3_cas_research_desc:0 "Close support studies test signals, target marking, and safe distances between bombs and friendly troops. The aim is timely help at the decisive point, with pilots accountable to the ground plan."
 FR3_cas_2: "Early CAS Effort"
 FR3_cas_2_desc: ""
 FR3_support_italian_claim:0 "Negotiate Italian War Aims"
 FR3_support_italian_claim_desc:0 "Discuss limited war aims with an Italy that has not committed itself to an opposing alignment. An accepted negotiation is a prerequisite for accession, not a transfer of land we do not own."
 FR3_give_ita_savoy_corsica:0 "Offer an Exceptional Territorial Bargain"
 FR3_give_ita_savoy_corsica_desc:0 "Offer Rome a costly concession of French-held Savoy and Corsica in exchange for cooperation. Italy must independently accept before either state can be transferred."
 FR3_invite_britain:0 "Confirm the British Understanding"
 FR3_invite_britain_desc:0 "Ask London to confirm a military understanding only if it has chosen the Entente. An armed-neutral or German-aligned Britain cannot be recruited through a French decree."
 FR3_britain_reinforcement:0 "British Expeditionary Liaison"
 FR3_britain_reinforcement_desc:0 "Coordinate embarkation, unloading and billeting with our British partner. A reliable liaison gives the expeditionary forces the supply arrangements needed to fight alongside the French armies."
 FR3_invite_italy:0 "Conclude the Italian Accession"
 FR3_invite_italy_desc:0 "The territorial negotiations have opened a path to cooperation with Italy. We should extend a formal invitation and await the Italian government's decision to intervene."
 FR3_send_troops_serbia:0 "The Serbian Supply Mission"
 FR3_send_troops_serbia_desc:0 "Coordinate supplies and instructors with a Serbia sharing our war. French formations will not be created inside another country by a diplomatic focus."
 FR3_allied_blockade_greece:0 "Seek Greek Political Guarantees"
 FR3_allied_blockade_greece_desc:0 "Negotiate port access and political guarantees with a divided Greek government. The focus now seeks consent instead of treating a neutral Greece as an automatic target for a blockade."
 FR3_invite_greece:0 "Confirm Greek Accession"
 FR3_invite_greece_desc:0 "Confirm accession after the Greek government agrees to cooperate. Military support and war entry follow its decision, rather than preceding it."
 FR3_support_greece:0 "The Greek Equipment Mission"
 FR3_support_greece_desc:0 "Send a bounded equipment mission to a Greek ally. Supplies and instructors assist existing formations rather than turning Greek territory into a free French recruiting ground."
 FR3_troops_greece:0 "The Armée d'Orient Staff"
 FR3_troops_greece_desc:0 "Organise the Balkan expedition through allied ports and a permanent staff mission. Troops, escorts and supplies must be prepared for operations under the conditions faced by the armies in the field."
 FR3_russian_reinforcement:0 "The Russian Expeditionary Liaison"
 FR3_russian_reinforcement_desc:0 "Organise instructors, transport and liaison with a willing Russian ally. The agreement will respect Russia's decisions about neutrality and will not create a second army without cost."
 FR3_entente_diplomacy:0 "Maintain the Entente"
 FR3_entente_diplomacy_desc:0 "Preserve the Russian military connection and the understanding with Britain where their governments accept it. The Entente is a strategic programme, not permission to move unwilling countries into a faction."
 FR3_convince_romania:0 "The Romanian Negotiations"
 FR3_convince_romania_desc:0 "Negotiate assistance and limited commitments with Bucharest. Romania will accept or refuse the proposal before an accession can be concluded."
 FR3_invite_romania:0 "Conclude the Romanian Accession"
 FR3_invite_romania_desc:0 "Bring an accepting Romania into our actual coalition. Its existing treaties and the current war decide the agreement's obligations."
 FR3_diplomatic_effort:0 "The Quai d'Orsay"
 FR3_diplomatic_effort_desc:0 "France's diplomats balance military security, imperial commitments and the costs of continental rivalry. A new policy must correspond to actual treaties and willing partners."
 FR3_european_diplomacy:0 "The European Balance"
 FR3_european_diplomacy_desc:0 "Review the Russian alliance, British understanding and possible channels to Berlin. Consultation precedes a binding commitment to any of these arrangements."
 FR3_anti_german_propaganda:0 "Assess the German Threat"
 FR3_anti_german_proapganda_desc: "With our humiliating defeat in the 1871 Franco-Prussian war and Germany's forceful annexation of the rightful French territory of Elsass-Lothringen we have nothing left for them but Anti-German sentiment..."
 FR3_pro_russia:0 "Review the Russian Alliance"
 FR3_pro_russia_desc:0 "Coordinate defence with an aligned Russian government and acknowledge any decision it makes to remain neutral. Economic contact can continue without manufacturing a military commitment."
 FR3_agadir_crisis:0 "The Agadir Crisis"
 FR3_agadir_crisis_desc:0 "France opens the colonial dispute with Berlin through the existing Agadir negotiation chain. In historical mode, France initiates the crisis on 1 July 1911 even if this focus has not yet been reached; the focus then bypasses so that the exchange of New Cameroon, South Cameroon and Entenschnabel cannot be repeated."
 FR3_prepare_for_war:0 "Mobilisation and Railway Notices"
 FR3_prepare_for_war_desc:0 "Connect civilian railways, reservist notices and supply depots into a mobilisation schedule. Preparation provides trained administrative capacity rather than conjuring hundreds of thousands of recruits."
 FR3_defend_border:0 "The Eastern Fortified Frontier"
 FR3_defend_border_desc:0 "Strengthen the French-held positions in Lorraine, Nancy and Briey. Engineers and garrisons will build on the fortified frontier rather than assuming that a single great offensive can defend every threatened district."
 FR3_sacred_union:0 "The Union Sacrée"
 FR3_sacred_union_desc:0 "Invite the republican parties and labour representatives to share responsibility for an actual continental war. National cooperation will be organised through institutions rather than repeated declarations of public enthusiasm."
 FR3_defend_colonies: "Colonial Defenses"
 FR3_defend_colonies_desc: "It wouldn't hurt to fortify our colonial strongholds."
 FR3_volunteers_1: "Manpower from the Colonies"
 FR3_volunteers_1_desc: "Since mainland France lacks as much manpower as the Germans can field we could always compensate with recruiting men from the colonies."
 FR3_volunteers_2: "Manpower from the Colonies"
 FR3_volunteers_2_desc: "Since mainland France lacks as much manpower as the Germans can field we could always compensate with recruiting men from the colonies."
 FR3_volunteers_3: "Manpower from the Colonies"
 FR3_volunteers_3_desc: "Since mainland France lacks as much manpower as the Germans can field we could always compensate with recruiting men from the colonies."
 FR3_political_effort:0 "The Third Republic"
 FR3_political_effort_desc:0 "Parliamentary coalitions, an established civil service and a politically divided electorate sustain the Republic. Defence and reform must be financed without surrendering the authority of civilian government."
 FR3_democratism:0 "The Republican Majority"
 FR3_democratism_desc:0 "Build a workable majority among republican parties. A government needs a programme that can survive a confidence vote rather than a collection of incompatible promises."
 FR3_free_speech:0 "Defend Republican Liberties"
 FR3_free_speech_desc:0 "Protect political debate while setting clear limits on the publication of military information. The Republic should not confuse criticism with disloyalty."
 FR3_unity:0 "A Common Government Programme"
 FR3_unity_desc:0 "Translate coalition promises into a shared programme for supply, recruitment and public information. Cooperation should make departments work together rather than erase every political disagreement."
 FR3_war_effort:0 "Coordinate the National War Effort"
 FR3_war_effort_desc:0 "Connect procurement committees to recruitment and transport authorities. A coordinated state can direct scarce resources more reliably than competing emergency offices."
 FR3_defense_construction_effort: "Defense Construction Effort"
 FR3_defense_construction_effort_desc: "Build defensive structures faster"
 FR3_construction_effort: "Construction Effort"
 FR3_construction_effort_desc: "Build civilian factories quicker"


 FR3_home_front_1:0 "The Civilian Relief Services"
 FR3_home_front_1_desc:0 "Coordinate billets, compensation and municipal assistance for families affected by war. Administrative relief supports the population without turning the focus into a permanent political bonus."
 FR3_home_front_2:0 "Essential Worker Exemptions"
 FR3_home_front_2_desc:0 "Protect indispensable miners, railway workers and machinists from contradictory recruitment orders. The army must receive recruits without stopping the supply chain that equips them."
 FR3_home_front_3:0 "Women in Wartime Administration"
 FR3_home_front_3_desc:0 "Organise training and employment for women entering workshops and public services. Safe working conditions and reliable pay are practical requirements for sustaining the new workforce."

 FR3_front_line_1:0 "A Leave and Rotation System"
 FR3_front_line_1_desc:0 "Build predictable leave rotas and reserve schedules for formations at the front. Rest is a component of operational readiness, not an excuse to abandon a threatened sector."
 FR3_front_line_2:0 "Front-Line Medical Services"
 FR3_front_line_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 FR3_front_line_3:0 "Restore Confidence in the Ranks"
 FR3_front_line_3_desc:0 "Listen to the problems of exhausted units and improve the arrangements that commanders can actually control. Sound planning, dependable supplies and limited objectives offer a path back to confidence."
  # Russian Empire Focus Tree

 RUS_tank_research_1: "Tank Research I"
 RUS_tank_research_1_desc: ""
 RUS_tank_research_2: "Tank Research II"
 RUS_tank_research_2_desc: ""
 RUS_tank_research_3: "Tank Research III"
 RUS_tank_research_3_desc: ""
 RUS_tank_research_4: "Tank Research IV"
 RUS_tank_research_4_desc: ""
 RUS_naval_effort:0 "Rebuild the Imperial Navy Office"
 RUS_naval_effort_desc:0 "The Naval Ministry consolidates ship orders, crews, and harbour works after the disasters of the Russo-Japanese War. A coherent programme gives Russia a fleet plan, though the treasury cannot fund every sea at once."
 RUS_dreadnought:0 "Gangut-Class Trials"
 RUS_dreasnought_desc: ""
 RUS_better_weaponry:0 "Obukhov Naval Guns"
 RUS_better_weaponry_desc:0 "Obukhov produces heavy naval guns and ammunition for the newest Russian capital ships. Better range strengthens the fleet's deterrence, while the foundry's complex work competes with army artillery."
 RUS_submarine_theory:0 "Bars-Class Submarine School"
 RUS_submarine_theory_desc:0 "The Bars-class boats become a school for patrol tactics, torpedoes, and Baltic navigation. Submariners gain a weapon suited to narrow seas, though the boats offer little comfort or margin for error."
 RUS_submarine_effort:0 "Baltic Submarine Flotilla"
 RUS_submarine_effort_desc:0 "The Baltic submarine flotilla receives patrol sectors, tenders, and crews trained to lay in wait beyond the mine lines. Small boats deny routes cheaply, though every patrol risks a crew and irreplaceable hull."
 RUS_destroyer_effort:0 "Novik Destroyer Flotilla"
 RUS_destroyer_effort_desc:0 "The Novik class sets a Russian standard for fast destroyers, torpedoes, and fleet scouting. Its speed protects capital ships, but turbines and fuel demand the best technicians in the navy."
 RUS_BB_effort:0 "Sevastopol Battleship Squadron"
 RUS_BB_effort_desc:0 "The Sevastopol-class battleships form a disciplined squadron for Baltic defence and fleet exercises. Heavy guns protect the capital, but fuel, crews, and dock time make the squadron expensive to keep ready."
 RUS_cruiser_effort:0 "Svetlana Cruiser Contracts"
 RUS_cruiser_effort_desc:0 "Svetlana-class cruisers receive contracts for scouting, raiding, and fleet screening duties. Their speed extends Russian reach, while the shipyards must master complicated armour and turbine work."
 RUS_battle_cruiser_effort:0 "The Izmail Battlecruiser Programme"
 RUS_industrial_effort:0 "The Empire's Industrial Base"
 RUS_industrial_effort_desc:0 "The government must connect its workshops, mines and transport network through a practical industrial programme. Recorded contracts will give each investment a clear purpose and a responsible administration."
 RUS_infrastructure_effort_1:0 "Zemstvo Roads to the Railheads"
 RUS_infrastructure_effort_1_desc:0 "Zemstvo engineers repair the roads feeding the Moscow and Warsaw railheads before the autumn rains arrive. Their gravel and bridge work keeps requisition columns moving, though provincial budgets lose room for schools and clinics."
 RUS_infrastructure_effort_2:0 "Reinforce the Great Siberian Route"
 RUS_infrastructure_effort_2_desc:0 "Railway officials reinforce bridges from Omsk to Irkutsk and stockpile coal at the Trans-Siberian stations. The long route becomes a strategic reserve, even as every train east competes with the western front."
 RUS_infrastructure_effort_3:0 "Donbas Rail and Mine Link"
 RUS_infrastructure_effort_3_desc:0 "A single timetable joins Donbas pits, coke ovens, and the rail yards around Yuzovka. Coal reaches the furnaces more reliably, while miners endure longer shifts beneath wartime inspections."
 RUS_construction_effort_1:0 "Moscow-Kazan Railway Contracts"
 RUS_construction_effort_1_desc:0 "The Moscow-Kazan Railway receives state contracts to expand sidings, workshops, and water towers along the Volga. Civilian builders gain steady work while the army claims the best steel and surveyors."
 RUS_construction_effort_2:0 "Kolomna Locomotive Expansion"
 RUS_construction_effort_2_desc:0 "Kolomna engineers enlarge their locomotive shops and add a second shift for freight engines. The programme strengthens the state railway while drawing skilled mechanics from smaller Moscow factories."
 RUS_construction_effort_3:0 "Moscow Industrial Building Code"
 RUS_construction_effort_3_desc:0 "The Moscow city authorities adopt a common plan for factory foundations, worker housing, and fire water. Construction accelerates in the capital, but scarce brick and timber are pulled from provincial projects."
 RUS_armament_effort_1:0 "Putilov Works Mobilization"
 RUS_armament_effort_1_desc:0 "The Putilov Works in Petrograd turns its presses toward guns, shells, and armoured plate. The choice delivers weapons quickly, but ship orders and city tram machinery wait behind the army schedule."
 RUS_armament_effort_2:0 "Tula Arms Deliveries"
 RUS_armament_effort_2_desc:0 "Tula armourers extend the Mosin-Nagant lines and standardise gauges for parts made in private workshops. Rifles reach reserve regiments sooner, but the old arsenal must work beyond its peacetime capacity."
 RUS_armament_effort_3:0 "Obukhov Gun Foundry Orders"
 RUS_armament_effort_3_desc:0 "Obukhov receives orders for heavy guns and armour plate that match its furnaces to the Stavka supply table. The foundry raises Russia's firepower, though its complex work consumes the best imported machine tools."
 RUS_airfield_construction_1:0 "Forward Fields Near Riga"
 RUS_airfield_construction_1_desc:0 "Engineers prepare grass strips, fuel pits, and canvas shelters near Riga and the northern front. Aircraft spend less time travelling to the fight, though forward fields must be abandoned when the line moves."
 RUS_airfield_construction_2:0 "Minsk Air Service Depots"
 RUS_airfield_construction_2_desc:0 "Minsk receives repair sheds and stores for engines, fabric, and bombs serving the central front. The depots keep squadrons in the air, while rail congestion threatens every replacement part."
 RUS_airfield_construction_3:0 "Caucasus Mountain Airstrips"
 RUS_airfield_construction_3_desc:0 "Surveyors cut rough airstrips near Kars and the Caucasus passes for reconnaissance over difficult ground. Aircraft extend the army's reach, but thin air and mountain weather test every pilot."
 RUS_airfield_construction_4:0 "Camouflaged Air Parks"
 RUS_airfield_construction_4_desc:0 "Airfield crews disperse hangars, fuel, and aircraft beneath camouflage nets and tree lines. The park survives enemy observation more often, though dispersal slows repairs and launches."
 RUS_dockyard_construction_1: "Dockyard Construction I"
 RUS_dockyard_construction_1_desc: ""
 RUS_dockyard_construction_2: "Dockyard Construction II"
 RUS_dockyard_construction_2_desc: ""
 RUS_dockyard_construction_3: "Dockyard Construction III"
 RUS_dockyard_construction_3_desc: ""
 RUS_dockyard_construction_4: "Dockyard Construction IV"
 RUS_dockyard_construction_4_desc: ""
 RUS_home_front_1:0 "The Zemgor Service Network"
 RUS_home_front_1_desc:0 "Municipal and zemstvo organisations will coordinate medical supplies and public contracts. Their network will reduce waste in military supply and support the repair services."
 RUS_home_front_2:0 "Register and Assist the Refugees"
 RUS_home_front_2_desc:0 "Families displaced by the fighting need registration, housing and transport. Civilian offices will support infrastructure work while setting aside the resources required by those services."
 RUS_home_front_3:0 "Preserve Civilian Contracts"
 RUS_home_front_3_desc:0 "The emergency programme must still keep civilian workshops functioning. Service agreements and industrial insurance will support production routines behind the front."
 RUS_shorter_training: "Shorter Training"
 RUS_shorter_training_desc: "With the war dragging on and taking more and more lives we need more men to refill the casualties so shortening training would help with that."
 RUS_war_front_1:0 "Coordinate the Front Headquarters"
 RUS_war_front_1_desc:0 "Front headquarters must compare intelligence, artillery needs and reserve schedules. A common cycle of staff work will improve planning for the coming campaign."
 RUS_war_front_2:0 "An Operational Reserve"
 RUS_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 RUS_war_front_3:0 "Prepare a Sustained Campaign"
 RUS_war_front_3_desc:0 "The army must reconcile its plans with the artillery and transport it can sustain. A review of campaign practice will support the next stage of operational doctrine."
 RUS_army_effort:0 "Reform the Imperial Army Office"
 RUS_army_effort_desc:0 "The Imperial Army Office gathers lessons from Manchuria, Galicia, and the first months of war. Its clerks promise a modern field army without abandoning the reserve system that keeps Russia's numbers vast."
 RUS_trench_warfare:0 "Dig In Along the Dvina"
 RUS_trench_warfare_desc:0 "Sappers trace traverses, dugouts, and wire belts along the Dvina and the western frontier. The trenches preserve manpower under fire, but their timber and labour come from villages already short of both."
 RUS_gas_mask_1:0 "Zelinsky Charcoal Masks"
 RUS_gas_mask_1_desc:0 "Nikolay Zelinsky's activated-charcoal mask gives Russian infantry a practical answer to chlorine clouds. The device protects a soldier's lungs, though its filters require careful manufacture and replacement."
 RUS_gas_mask_2:0 "Chemical Defence Laboratories"
 RUS_gas_mask_2_desc:0 "Laboratories in Moscow and Kazan test filters, warning flags, and decontamination mixtures for the front. Medical officers gain a doctrine for survival, while chemists confront the grim logic of chemical war."
 RUS_gas_mask_3:0 "Frontline Decontamination Teams"
 RUS_gas_mask_3_desc:0 "Dedicated teams mark contaminated ground, wash equipment, and guide frightened battalions through gas alarms. Their discipline saves formations from panic, but every team reduces the number of men available with rifles."
 RUS_equipment_effort_1:0 "Mosin Rifles for the Line"
 RUS_equipment_effort_1_desc:0 "Tula and Izhevsk expand production of the three-line Mosin rifle for newly raised divisions. The rifle is sturdy and familiar, yet its factories cannot erase the wartime shortage overnight."
 RUS_equipment_effort_2:0 "Berdan Reserve Stocks"
 RUS_equipment_effort_2_desc:0 "The reserve establishment will inspect and issue the older rifle stocks held in its depots. One thousand rifles will support replacement and training requirements."
 RUS_equipment_effort_3:0 "Maxim Gun Contracts"
 RUS_equipment_effort_3_desc:0 "Private workshops receive contracts for Maxim guns, tripods, belts, and spare water jackets. More automatic fire strengthens a thin line, but the weapons burden the supply columns with parts and trained crews."
 RUS_equipment_effort_4:0 "Uniform and Boot Standardization"
 RUS_equipment_effort_4_desc:0 "Quartermasters publish one pattern for greatcoats, boots, pouches, and entrenching tools across the Imperial army. Uniform kit simplifies replacement, while factories must abandon profitable civilian patterns."
 RUS_artillery_effort_1:0 "The Three-Inch Gun Park"
 RUS_artillery_effort_1_desc:0 "Russian batteries organise around the dependable Model 1902 three-inch field gun. Its common ammunition simplifies supply, but every gun lost to mud or shortage is felt across the infantry line."
 RUS_artillery_effort_2:0 "Mikhailov Artillery School"
 RUS_artillery_effort_2_desc:0 "The Mikhailov Artillery School sends instructors to teach observation, fuze setting, and measured fire. Better gunnery rewards preparation, while the school pulls experienced officers from active batteries."
 RUS_artillery_effort_3:0 "Counterbattery Sound Ranging"
 RUS_artillery_effort_3_desc:0 "Observers combine sound ranging, map grids, and reports from forward aeroplanes to hunt enemy batteries. Russian guns answer more deliberately, though accurate maps and telephones remain rare commodities."
 RUS_artillery_effort_4:0 "Howitzer Reserve Columns"
 RUS_artillery_effort_4_desc:0 "The army gathers heavy howitzers and ammunition columns for deliberate attacks against wire and concrete. The guns can break a position, but their slow roads and voracious shells make surprise impossible."
 RUS_tactics_1:0 "Lessons of the Russo-Japanese War"
 RUS_tactics_1_desc:0 "Staff officers must examine the failure of coordination in the earlier war. Written lessons and field exercises will give the army a basis for reform."
 RUS_tactics_2:0 "Alexeyev Staff Tables"
 RUS_tactics_2_desc:0 "Alexeyev's headquarters replaces improvised orders with tables for reserves, ammunition, and reliefs. The paperwork steadies command, though a rigid schedule can still fail when the front changes in an hour."
 RUS_tactics_3:0 "Brusilov Shock Groups"
 RUS_tactics_3_desc:0 "Brusilov's staff experiments with short bombardments, assault parties, and multiple breaches instead of one grand rupture. The method gives Russian infantry a sharper edge, at the cost of careful preparation and casualties among specialists."
 RUS_tactics_4:0 "Combined Arms Directives"
 RUS_tactics_4_desc:0 "New directives bind infantry, guns, engineers, and aeroplanes to one attack plan. The doctrine rewards commanders who share reports, while traditional arms chiefs must accept unfamiliar partners."
 RUS_form_airforce: "Create Airforce"
 RUS_form_airforce_desc: ""
 RUS_bomber_focus:0 "Ilya Muromets Bombing Detachment"
 RUS_bomber_focus_desc:0 "Sikorsky's Ilya Muromets becomes a dedicated long-range detachment for rail junctions and headquarters. The giant aircraft reaches beyond the trenches, yet each airframe monopolises engines, mechanics, and hangar space."
 RUS_fighter_focus:0 "Defend the Front in the Air"
 RUS_fighter_focus_desc:0 "Fighter commanders concentrate scarce machines on protecting reconnaissance and the railheads behind the front. The choice shields the army from enemy eyes, but leaves fewer aircraft for deep attacks."
 RUS_fighter_1:0 "Sikorsky Fighter Trials"
 RUS_fighter_1_desc:0 "The air service will test dedicated fighter designs and establish acceptance procedures. Technical work will support the first specialised fighter programme."
 RUS_fighter_2:0 "Morane-Saulnier Squadrons"
 RUS_fighter_2_desc:0 "The fighter squadrons need reliable aircraft and common maintenance standards. Development work will support the next generation of front-line fighters."
 RUS_fighter_3:0 "Duks Interceptor Line"
 RUS_fighter_3_desc:0 "Duks will compare operational reports with its production methods. The programme will support more advanced fighter airframes and their service equipment."
 RUS_aviation_effort_1:0 "Kovanko's Aviation Administration"
 RUS_aviation_effort_1_desc:0 "Alexander Kovanko's administration sets common maintenance books and pilot reports for the scattered air detachments. The new paperwork creates a professional service without hiding the shortage of trained mechanics."
 RUS_pilot_training_1:0 "Gatchina Flight School"
 RUS_pilot_training_1_desc:0 "The Gatchina school expands flight hours on trainers before sending pilots to the front. Safer instruction preserves lives, though every hour in the air consumes fuel and engines that could support a combat squadron."
 RUS_aviation_effort_2:0 "Moscow Aircraft Assembly"
 RUS_aviation_effort_2_desc:0 "Moscow workshops will receive regular aircraft orders and the tools needed to fulfil them. A dependable assembly industry will support the flying service through replacement machines and spare parts."
 RUS_pilot_training_2:0 "Observer and Pilot Courses"
 RUS_pilot_training_2_desc:0 "Pilots and observers learn to navigate together, mark batteries, and report in a common format. The crew becomes a team above the front, although the course delays replacements reaching urgent units."
 RUS_tactical_bomber_1:0 "Muromets Engine Workshops"
 RUS_tactical_bomber_1_desc:0 "Engine workshops will inspect and standardise the power plants used by our bombing aircraft. Technical studies support the next stage of engine development."
 RUS_tactical_bomber_2:0 "Frontline Bomb-Rack Standards"
 RUS_tactical_bomber_2_desc:0 "The air service will agree bomb-rack and release standards for its front squadrons. Technical trials will support the armament used by the bombing force."
 RUS_tactical_bomber_3:0 "Daylight Reconnaissance Bombing"
 RUS_tactical_bomber_3_desc:0 "Observer reports must guide the next generation of bombing aircraft. Development work will support improved two-seater airframes and their operational equipment."
 RUS_strategic_bomber_research: "Strategic Bomber Research"
 RUS_strategic_bomber_research_desc: ""
 RUS_strat_bomber_1:0 "Deep Raids on Railway Junctions"
 RUS_strat_bomber_1_desc:0 "Muromets crews plan deep raids against railway junctions feeding the enemy armies. The strikes promise strategic reach, while the long return flight exposes the crews to weather and pursuit."
 RUS_improved_tac_1:0 "Sikorsky Bomb-Sight Trials"
 RUS_improved_tac_1_desc:0 "Sikorsky's engineers test bomb sights and release procedures from the Muromets cabin. Accuracy rises over fixed targets, while crews learn that a clever sight cannot replace a clear sky."
 RUS_improved_tac_2:0 "Armoured Bomber Crew Stations"
 RUS_improved_tac_2_desc:0 "Workshop crews protect fuel lines, crew seats, and control runs against rifle fire and fragments. The reinforcement saves airmen, but extra weight steals range from the already heavy bomber."
 RUS_improved_fighter_1:0 "Synchronized Gun Experiments"
 RUS_improved_fighter_1_desc:0 "Armament engineers will test the installation and operation of fighter guns. Technical trials will support the air weapons used by the squadrons."
 RUS_improved_fighter_2:0 "Frontline Fighter Maintenance"
 RUS_improved_fighter_2_desc:0 "Field workshops sort engines, fabric, and propellers into repair pools close to the airfields. Serviceable fighters return sooner, although the pool consumes mechanics from the training schools."
 RUS_cas_research:0 "Low-Level Army Cooperation"
 RUS_cas_research_desc:0 "Army observers and pilots practise low-level attacks against marked trenches and gun parks. The work brings aircraft close to the infantry, where rifles and weather punish every mistake."
 RUS_cas_2:0 "Grigorovich Attack Seaplanes"
 RUS_cas_2_desc:0 "Army liaison flights will test aircraft for low-level support work. The programme supports a new airframe or, without modular aircraft, the existing early close-support design."
 RUS_balkan_diplomacy:0 "The Balkan Commitments"
 RUS_balkan_diplomacy_desc:0 "Balkan governments must understand which commitments Russia will honour. Our representatives will establish a practical programme of liaison and guarantees."
 RUS_slavic_brotherhood:0 "Work with the Slavic Governments"
 RUS_slavic_brotherhood_desc:0 "Shared diplomatic interests must be translated into direct conversations among governments. Existing missions will improve relations without automatically reorganising their alliances."
 RUS_support_serbia:0 "Support Serbia's Independence"
 RUS_support_serbia_desc:0 "Russian representatives will maintain the existing arrangements supporting Serbia. Admission to the allied faction requires a functioning Serbian government and a French-led alliance."
 RUS_befriend_romania:0 "A Mission to Bucharest"
 RUS_befriend_romania_desc:0 "The ministry will maintain a permanent channel to Romania. Its government must be able to negotiate military and political commitments on its own terms."
 RUS_diplomatic_effort:0 "The Ministry of Foreign Affairs"
 RUS_diplomatic_effort_desc:0 "Our representatives must bring the European alliances, Balkan commitments and Asian frontiers into one policy. A clear ministerial mandate will guide the negotiations ahead."
 RUS_european_diplomacy:0 "The European Alliance System"
 RUS_european_diplomacy_desc:0 "The ministry will review the guarantees and conventions which shape our European position. Permanent diplomatic missions will support the work of the government."
 RUS_investments_from_west:0 "Western Engineering Investments"
 RUS_investments_from_west_desc:0 "Investment missions will bring industrial contracts into the capital region. Civilian workshops will receive the machinery and public orders needed to expand production."
 RUS_railway_construction:0 "The Trans-Siberian Railway Programme"
 RUS_railway_construction_desc:0 "The government will complete the transport programme serving its eastern commitments. Railway construction will follow the existing province route and must remain within territory we control."
 RUS_prepare_for_war:0 "Prepare the Mobilisation Programme"
 RUS_prepare_for_war_desc:0 "The ministries will coordinate reserve notices and the public business required by mobilisation. A limited personnel reserve will support the programme without replacing the army's recruiting laws."
 RUS_railway_construction_2:0 "Finish the Eastern Railway Links"
 RUS_railway_construction_2_desc:0 "The remaining railway links must connect the programme to the national transport network. Construction will proceed along the existing route only where every province is securely controlled."
 RUS_occupy_northern_persia:0 "The Northern Persian Question"
 RUS_occupy_northern_persia_desc:0 "The ministry will define its claims and seek a mandate for a military or diplomatic settlement in northern Persia. The programme creates explicit claims and a war goal instead of transferring independent territory for free."
 RUS_brusilov_offensive:0 "Prepare the Brusilov Offensive"
 RUS_brusilov_offensive_desc:0 "The front will rehearse coordinated artillery preparation and attacks against several sectors. The existing offensive programme will support a limited period of operational concentration."
 RUS_petrograd_defense:0 "Defend the Approaches to Petrograd"
 RUS_petrograd_defense_desc:0 "The capital's approaches need permanent defensive works. Existing fortification plans will be carried out only while the relevant province remains under our control."
 RUS_asian_diplomacy:0 "The Asian Frontiers"
 RUS_asian_diplomacy_desc:0 "The Far East, Mongolia and Persia require different diplomatic arrangements. Regional missions will place those questions before the government without assuming that every frontier must lead to annexation."
 RUS_mongolian_bufferstate:0 "The Mongolian Understanding"
 RUS_mongolian_bufferstate_desc:0 "A recognised Mongolian government can serve as a diplomatic partner between competing regional interests. The existing mission will negotiate an understanding with that government."
 RUS_russian_dominance:0 "A Far Eastern Diplomatic Position"
 RUS_russian_dominance_desc:0 "The ministry will define Russia's commitments in the Far East. Our representatives must turn strategic ambitions into an explicit negotiating programme."
 RUS_take_manchuria:0 "The Manchurian Question"
 RUS_take_manchuria_desc:0 "The government will choose between a negotiated commercial policy and a claim to strategic concessions. Territory will not change hands merely because the ministry has discussed it."
 RUS_entente_diplomacy:0 "Maintain the Entente"
 RUS_entente_diplomacy_desc:0 "Russia's European partners must keep their military and purchasing missions in contact. The existing alliance will remain the basis of our historical diplomatic programme."
 RUS_send_troops_france:0 "The Russian Expeditionary Mission"
 RUS_send_troops_france_desc:0 "An expeditionary mission will place Russian forces alongside the French army. Personnel commitments must be supported by actual equipment and secure access to the allied ports."
 RUS_request_aid:0 "The First Allied Purchasing Mission"
 RUS_request_aid_desc:0 "The army's purchasing mission will present its immediate requirements to our partners. Existing equipment-support arrangements will determine the aid which arrives."
 RUS_request_aid_2:0 "A Second Allied Purchasing Mission"
 RUS_request_aid_2_desc:0 "The ministry will renew the purchasing mission after the first deliveries. Contracts must match the equipment and transport which the allied governments can provide."
 RUS_political_effort:0 "The Fundamental Laws of 1906"
 RUS_political_effort_desc:0 "The crown, the State Council and the Duma share an uneasy constitutional framework. We must decide whether its institutions will govern together or confront one another."
 RUS_supress_revolutionaries:0 "Review the Security Apparatus"
 RUS_supress_revolutionaries_desc:0 "Police reports must distinguish organised threats from provincial grievances. The government will review its security apparatus and decide how its powers are exercised."
 RUS_continue_russification:0 "Uniform Provincial Regulations"
 RUS_continue_russification_desc:0 "The ministries will standardise records and service regulations across the governorates. Direct administration will strengthen political coordination at the cost of the resources required by a larger common bureaucracy."
 RUS_pan_slavism:0 "Defend the Balkan Guarantees"
 RUS_pan_slavism_desc:0 "The government will reaffirm its guarantees to Serbia and Montenegro. These commitments strengthen the diplomatic programme without creating a claim to the partners' territory."
 RUS_reinforce_tsars_authority:0 "Reaffirm the Emperor's Authority"
 RUS_reinforce_tsars_authority_desc:0 "The ministries will continue to act in the emperor's name. The government seeks political authority for its existing programme without resolving the dispute over parliamentary responsibility."
 RUS_nicholas_on_front:0 "Nicholas Takes Supreme Command"
 RUS_nicholas_on_front_desc:0 "The emperor will assume personal responsibility for the direction of the army. This historic decision ties the authority of the dynasty more closely to the fortunes of the front."
 RUS_form_polish_legion:0 "The Polish Volunteer Legion"
 RUS_form_polish_legion_desc:0 "Polish volunteers will enter a formation organised for service with the Russian army. Recruitment requires secure access to the Polish districts used by the existing legion deployment."
  # British Empire Focus Tree (WWI)

 EN1_diplomatic_effort:0 "The Foreign Office"
 EN1_diplomatic_effort_desc:0 "Britain's security rests on sea power and a continental balance. The Foreign Office must decide whether old understandings still serve those interests."
 EN1_tank_research_1:0 "Landship Experiments"
 EN1_tank_research_1_desc:0 "Fund early armoured vehicle trials."
 EN1_tank_research_2:0 "Experimental Tanks"
 EN1_tank_research_2_desc:0 "Develop tracked vehicles able to cross wire and trenches."
 EN1_tank_research_3:0 "Tank Mark I"
 EN1_tank_research_3_desc:0 "Turn prototypes into a practical Somme battlefield arm."
 EN1_tank_research_4:0 "Tank Mark V Studies"
 EN1_tank_research_4_desc:0 "Prepare a more reliable armoured arm from Cambrai lessons."
 EN1_naval_effort:0 "Naval Reorganisation"
 EN1_naval_effort_desc:0 "Reaffirm the Royal Navy’s place in imperial defence and maritime trade."
 EN1_dreadnought:0 "Dreadnought Programme"
 EN1_dreasnought_desc: ""
 EN1_better_weaponry: "Improved Naval Weaponry"
 EN1_better_weaponry_desc: ""
 EN1_submarine_theory:0 "Submarine Theory"
 EN1_submarine_theory_desc:0 "Study undersea warfare while preserving protection of sea lanes."
 EN1_submarine_effort:0 "Submarine Flotillas"
 EN1_submarine_effort_desc:0 "Develop submarines for reconnaissance and coastal defence."
 EN1_destroyer_effort:0 "Destroyer Screens"
 EN1_destroyer_effort_desc:0 "Expand destroyer flotillas for screening and anti-submarine work."
 EN1_BB_effort:0 "Battleship Line"
 EN1_BB_effort_desc:0 "Commit the budget to a concentrated battle line."
 EN1_cruiser_effort:0 "Cruiser Squadrons"
 EN1_cruiser_effort_desc:0 "Build fast cruisers for scouting and imperial station duty."
 EN1_battle_cruiser_effort:0 "Battlecruiser Force"
 EN1_industrial_effort:0 "The Industrial Foundation"
 EN1_industrial_effort_desc:0 "Britain enters the crisis with coal, railways, shipyards and finance already in place; coordination makes that foundation serve a continental war."
 EN1_infrastructure_effort_1: "Infrastructure Effort I"
 EN1_infrastructure_effort_1_desc: ""
 EN1_infrastructure_effort_2: "Infrastructure Effort II"
 EN1_infrastructure_effort_2_desc: ""
 EN1_infrastructure_effort_3: "Infrastructure Effort III"
 EN1_infrastructure_effort_3_desc: ""
 EN1_construction_effort_1: "Construction Effort I"
 EN1_construction_effort_1_desc: ""
 EN1_construction_effort_2: "Construction Effort II"
 EN1_construction_effort_2_desc: ""
 EN1_construction_effort_3: "Construction Effort III"
 EN1_construction_effort_3_desc: ""
 EN1_armament_effort_1: "Armament Effort I"
 EN1_armament_effort_1_desc: ""
 EN1_armament_effort_2: "Armament Effort II"
 EN1_armament_effort_2_desc: ""
 EN1_armament_effort_3: "Armament Effort III"
 EN1_armament_effort_3_desc: ""
 EN1_airfield_construction_1:0 "Forward Landing Grounds I"
 EN1_airfield_construction_1_desc:0 "Prepare landing grounds and stores near the front."
 EN1_airfield_construction_2:0 "Forward Landing Grounds II"
 EN1_airfield_construction_2_desc:0 "Expand airfields as the front moves."
 EN1_airfield_construction_3:0 "Forward Landing Grounds III"
 EN1_airfield_construction_3_desc:0 "Add workshops, fuel stores, and dispersal sites."
 EN1_airfield_construction_4:0 "Forward Landing Grounds IV"
 EN1_airfield_construction_4_desc:0 "Build permanent infrastructure for the Hundred Days."
 EN1_dockyard_1:0 "Dockyard Expansion I"
 EN1_dockyard_1_desc:0 "Expand home dockyards for modern fleet construction and repairs."
 EN1_dockyard_2:0 "Dockyard Expansion II"
 EN1_dockyard_2_desc:0 "Increase slipways and fitting-out capacity."
 EN1_dockyard_3:0 "Dockyard Expansion III"
 EN1_dockyard_3_desc:0 "Mobilise private yards for wartime construction and refits."
 EN1_dockyard_4:0 "Dockyard Expansion IV"
 EN1_dockyard_4_desc:0 "Keep repair yards ahead of submarine damage."
 EN1_homefront_focus_1: "Homefront Focus I"
 EN1_homefront_focus_1_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 EN1_homefront_focus_2: "Homefront Focus II"
 EN1_homefront_focus_2_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 EN1_homefront_focus_3: "Homefront Focus III"
 EN1_homefront_focus_3_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 EN1_shorter_training: "Shorter Training"
 EN1_shorter_training_desc: "With the war dragging on and taking more and more lives we need more men to refill the casualties so shortening training would help with that."
 EN1_frontline_focus_1:0 "Expeditionary Force Command"
 EN1_frontline_focus_1_desc:0 "Build a durable BEF command and staff system."
 EN1_frontline_focus_2:0 "Corps-Level Coordination"
 EN1_frontline_focus_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 EN1_frontline_focus_3:0 "Hundred Days Staff Work"
 EN1_frontline_focus_3_desc:0 "Turn 1917 lessons into a coherent offensive method."
 EN1_army_effort:0 "Army Reform"
 EN1_army_effort_desc:0 "South African War lessons and the Haldane reforms guide a modern expeditionary army."
 EN1_trench_warfare:0 "Field Fortification Doctrine"
 EN1_trench_warfare_desc:0 "Professional field engineering prepares the BEF for entrenchment and firepower."
 EN1_gas_mask_1:0 "Chemical Defence Section"
 EN1_gas_mask_1_desc:0 "Create a respirator and chemical-warning service."
 EN1_gas_mask_2:0 "Improved Respirators"
 EN1_gas_mask_2_desc:0 "Drill every division in chemical alarm procedures."
 EN1_gas_mask_3:0 "Anti-Gas Discipline"
 EN1_gas_mask_3_desc:0 "Make chemical protection and decontamination routine."
 EN1_equipment_effort_1:0 "SMLE and Service Rifles"
 EN1_equipment_effort_1_desc:0 "Standardise modern rifles, machine guns, and small-arms inspection."
 EN1_equipment_effort_2:0 "War Office Small-Arms Board"
 EN1_equipment_effort_2_desc:0 "Repair procurement and bring reserve formations up to service standard."
 EN1_equipment_effort_3:0 "Lewis Gun Production"
 EN1_equipment_effort_3_desc:0 "Scale up light machine-gun production and distribute automatic fire to the section."
 EN1_equipment_effort_4:0 "Rifle Grenades and Mortars"
 EN1_equipment_effort_4_desc:0 "Give infantry organic trench-clearing firepower."
 EN1_artillery_effort_1:0 "Modern Field Artillery"
 EN1_artillery_effort_1_desc:0 "Expand the Royal Artillery and update the field-gun park."
 EN1_artillery_effort_2:0 "Heavy Howitzer Programme"
 EN1_artillery_effort_2_desc:0 "Convert industry to heavy guns, shells, and counter-battery fire."
 EN1_artillery_effort_3:0 "Shells for Victory"
 EN1_artillery_effort_3_desc:0 "Stabilise supply of propellant, fuzes, and high-explosive shells."
 EN1_artillery_effort_4:0 "Counter-Battery Office"
 EN1_artillery_effort_4_desc:0 "Coordinate sound-ranging, aerial observation, and heavy artillery."
 EN1_tactics_1:0 "Staff College Exercises"
 EN1_tactics_1_desc:0 "Restore operational skill through staff rides and manoeuvres."
 EN1_tactics_2:0 "Open Order Training"
 EN1_tactics_2_desc:0 "Disperse under machine-gun fire while retaining control."
 EN1_tactics_3:0 "Battalion Battle Schools"
 EN1_tactics_3_desc:0 "Make lessons from Neuve Chapelle and Loos routine."
 EN1_tactics_4:0 "All-Arms Planning"
 EN1_tactics_4_desc:0 "Link infantry, artillery, engineers, and signals in deliberate operations."
 EN1_form_airforce:0 "Form a British Air Arm"
 EN1_form_airforce_desc:0 "Unify early military aviation for reconnaissance and liaison."
 EN1_bomber_focus:0 "Aerial Bombardment"
 EN1_bomber_focus_desc:0 "Explore bombing and tactical support."
 EN1_fighter_focus:0 "Fighter Defence"
 EN1_fighter_focus_desc:0 "Choose fighter defence and air superiority."
 EN1_fighter_1:0 "Fighter Development I"
 EN1_fighter_1_desc:0 "Develop scouts and fighters for reconnaissance protection."
 EN1_fighter_2:0 "Fighter Development II"
 EN1_fighter_2_desc:0 "Improve armament, engines, and formations."
 EN1_fighter_3:0 "Fighter Development III"
 EN1_fighter_3_desc:0 "Make fighter cover part of BEF planning."
 EN1_aviation_effort_1:0 "Aerial Reconnaissance"
 EN1_aviation_effort_1_desc:0 "Expand observation flights for artillery direction."
 EN1_pilot_training_1:0 "Pilot Training Schools"
 EN1_pilot_training_1_desc:0 "Create a steady pipeline of trained pilots."
 EN1_aviation_effort_2:0 "Forward Observation Flights"
 EN1_aviation_effort_2_desc:0 "Link aircraft, wireless, and artillery observers."
 EN1_pilot_training_2:0 "Advanced Flight Training"
 EN1_pilot_training_2_desc:0 "Train for formation flying and high-intensity operations."
 EN1_tactical_bomber_1:0 "Tactical Bombing I"
 EN1_tactical_bomber_1_desc:0 "Equip bombers for battlefield interdiction and close support."
 EN1_tactical_bomber_2:0 "Tactical Bombing II"
 EN1_tactical_bomber_2_desc:0 "Improve sights, engines, and formations."
 EN1_tactical_bomber_3:0 "Tactical Bombing III"
 EN1_tactical_bomber_3_desc:0 "Make bombing part of the army fire plan."
 EN1_strategic_bomber_research_1:0 "Long-Range Bombing Studies"
 EN1_strategic_bomber_research_1_desc:0 "Study range, payload, and navigation beyond the front."
 EN1_strat_bomber_1:0 "Independent Bombing Force"
 EN1_strat_bomber_1_desc:0 "Prepare an independent bombing command."
 EN1_improved_tac_1: "Improved TAC Bomber Modication I"
 EN1_improved_tac_1_desc: ""
 EN1_improved_tac_2: "Improved TAC Bomber Modification II"
 EN1_improved_tac_2_desc: ""
 EN1_improved_fighter_1:0 "Improved Fighter Engines"
 EN1_improved_fighter_1_desc:0 "Push engine reliability and climb performance."
 EN1_improved_fighter_2:0 "Standardised Fighter Squadrons"
 EN1_improved_fighter_2_desc:0 "Standardise maintenance for the final offensives."
 EN1_cas_research: "CAS Research"
 EN1_cas_research_desc: ""
 EN1_cas_2: "Early CAS Effort"
 EN1_cas_2_desc: ""
 EN1_join_war:0 "Honour the Belgian Guarantee"
 EN1_join_war_desc:0 "If Germany attacks Belgium or France, Britain must decide whether to honour its commitment. The army and fleet will enter an existing conflict, not manufacture one."
 EN1_western_diplomacy:0 "The European Balance"
 EN1_western_diplomacy_desc:0 "French entente, German accommodation and guarded neutrality all impose different obligations. Consultation must precede a binding commitment."
 EN1_befriend_US:0 "Cultivate Washington"
 EN1_befriend_US_desc:0 "Trade and diplomatic contact give Britain a channel to the United States. American decisions about neutrality and war remain American decisions."
 EN1_bring_america_in:0 "Coordinate with American Belligerents"
 EN1_bring_america_in_desc:0 "If America has independently entered our war, establish military and naval liaison. Diplomatic friendship alone cannot compel a neutral republic to fight."
 EN1_anti_german_sentiment:0 "Review the German Naval Threat"
 EN1_anti_german_sentiment_desc:0 "Assess the German fleet through intelligence and naval planning. Alarm alone is no substitute for a credible deployment plan."
 EN1_prepare_for_war:0 "Prepare the Wartime State"
 EN1_stay_neutral:0 "Armed Neutrality"
 EN1_stay_neutral_desc:0 "Keep Britain outside a continental war while retaining a fleet and an expeditionary reserve. Neutrality is a policy to defend, not an invitation to neglect security."
 EN1_back_france:0 "Maintain the Entente"
 EN1_back_france_desc:0 "The understanding with France protects the Channel and restrains a single continental hegemon. Honour that policy while retaining control over the decision to go to war."
 EN1_north_sea_blockade:0 "The North Sea Blockade"
 EN1_north_sea_blockade_desc:0 "Implement a maritime blockade against a Germany with which we are at war. The blockade ends when that war ends and cannot target a treaty partner."
 EN1_cosncript_irish:0 "Extend Service to Ireland"
 EN1_cosncript_irish_desc:0 "Extending compulsory service to Ireland promises recruits but risks shattering an already fragile constitutional settlement. Parliament must accept the political cost."
 EN1_dont_conscript_irish:0 "Exclude Ireland from Conscription"
 EN1_dont_conscript_irish_desc:0 "Recognise the distinct Irish political situation and retain voluntary recruitment there. The army must meet its requirements without another constitutional crisis."
 EN1_nordic_country_trading:0 "Negotiate Neutral Trade Controls"
 EN1_nordic_country_trading_desc:0 "Ask Scandinavian governments to limit trade that sustains the enemy war effort. Diplomatic requests may be refused; neutral commerce cannot simply be switched off."
 EN1_portugal_friend:0 "The Portuguese Alliance"
 EN1_portugal_friend_desc:0 "Britain's longstanding Portuguese connection offers ports and diplomatic support. Renew consultation before asking Lisbon to assume wartime obligations."
 EN1_invite_portugal:0 "Request Portuguese Cooperation"
 EN1_invite_portugal_desc:0 "Ask Lisbon for support through the leader of our actual alliance. Portugal may decline rather than be moved into a faction by decree."
 EN1_bulgaria_talks:0 "Talks with Sofia"
 EN1_bulgaria_talks_desc:0 "Explore whether guarantees and limited promises can keep Bulgaria from joining an opposing coalition. Allied commitments cannot be promised a second time."
 EN1_invite_bulgaria:0 "An Invitation to Bulgaria"
 EN1_invite_bulgaria_desc:0 "Present a formal invitation only after the Bulgarian government accepts the talks. The offer follows our actual faction rather than an assumed French leadership."
 EN1_baltic_project_part_1:0 "Study the Baltic Project"
 EN1_baltic_project_part_1_desc:0 "Review whether the fleet can support an expedition in the Baltic. Mines, narrow approaches and winter supply impose costs that cannot be wished away."
 EN1_baltic_project_part_2:0 "Prepare Baltic Logistics"
 EN1_baltic_project_part_2_desc:0 "Allocate escorts, transport and staff maps before committing troops to the Baltic. Neutral Scandinavian ports require agreement rather than automatic access."
 EN1_baltic_project_part_3:0 "The Baltic Expeditionary Plan"
 EN1_baltic_project_part_3_desc:0 "Produce an operational plan that commanders can execute if naval conditions permit. No force will be created behind the enemy front."
 EN1_middle_east_diplomacy:0 "The Mediterranean and Near East"
 EN1_middle_east_diplomacy_desc:0 "Suez, Persia and the Ottoman Empire require policies consistent with our European alignment. Plans for military intervention must follow a real war."
 EN1_fortify_suez:0 "Secure the Suez Canal"
 EN1_fortify_suez_desc:0 "Coordinate the canal garrison and its supply depots. Fortifications will be placed only in friendly-controlled canal territory."
 EN1_secure_southern_persia:0 "Negotiate Persian Transit"
 EN1_secure_southern_persia_desc:0 "Seek commercial access and transit arrangements rather than annexing southern Persia without consent. Our mission must respect the government with which it negotiates."
 EN1_hold_back_turk_ships:0 "Requisition Ottoman Battleships"
 EN1_hold_back_turk_ships_desc:0 "Requisition ships under construction only when an Ottoman war is already a reality. This exceptional measure closes the door to a negotiated delivery."
 EN1_arab_revolt:0 "Support the Arab Revolt"
 EN1_arab_revolt_desc:0 "Support Arab partners against an Ottoman Empire with which we are actually at war. Intelligence and limited equipment aid should not count their volunteers as British manpower."
 EN1_colonial_focus:0 "The Colonial Question"
 EN1_colonial_focus_desc:0 "London must decide whether the empire is renewed through self-government and partnership or through closer direct administration."
 EN1_british_raj: "Developing British Raj"
 EN1_british_raj_desc: ""
 EN1_south_africa: "Developing South Africa"
 EN1_south_africa_desc: ""
 EN1_australia: "Developing Australia"
 EN1_australia_desc: ""
 EN1_canada: "Developing Canada"
 EN1_canada_desc: ""
 EN1_indian_manpower: "Manpower from India"
 EN1_indian_manpower_desc: "The British Raj contains millions of men ready for military service, these reserves will be of great help to our cause."
 EN1_plan_gallipoli_campaign:0 "Plan the Dardanelles Campaign"
 EN1_plan_gallipoli_campaign_desc:0 "Study the straits, coastal artillery and the logistical limits of an amphibious campaign. Ottoman belligerency is a prerequisite for an invasion plan."
 EN1_execute_gallipoli:0 "Prepare the Landing Force"
 EN1_execute_gallipoli_desc:0 "Train assault troops, rehearse unloading and assign naval support. The landing remains an operation that the player or military command must carry out."
 EN1_canadian_troops: "Reinforcements from Canada"
 EN1_canadian_troops_desc: "If we wish, we could request several Canadian divisions over to the Western Front where they are most certainly needed."
 EN1_political_effort:0 "The Liberal Government"
 EN1_political_effort_desc:0 "The election leaves ministers dependent on a difficult parliamentary majority. Constitutional reform, social insurance and imperial responsibilities compete for time and money."
 EN1_grant_south_african_indep: "Grant South Africa Independence"
 EN1_grant_south_african_indep_desc: "The cries for South African independence have not been drowned, we shall do as our people ask."
 EN1_democracy:0 "Responsible Government"
 EN1_democracy_desc:0 "Reform secures the authority of Parliament without abolishing the monarchy. Ministers remain answerable to the Commons and the electorate."
 EN1_free_speech:0 "Protect Public Debate"
 EN1_free_speech_desc:0 "Dissent is not automatically disloyalty. Keep public debate open while protecting information whose disclosure would put troops and ships in danger."
 EN1_united_people:0 "A National Recruiting Appeal"
 EN1_united_people_desc:0 "Local committees invite volunteers to serve without treating every skilled industrial worker as an expendable recruit. Medical and occupational screening must keep pace."
 EN1_defence_of_realm_act:0 "Defence of the Realm Act"
 EN1_defence_of_realm_act_desc:0 "Emergency regulations permit ministers to safeguard ports, communications and military supply. Parliament must define their scope and their eventual expiry."
 EN1_combined_war_effort_1: "War Effort"
 EN1_combined_war_effort_1_desc: ""
 EN1_military_service_act:0 "The Military Service Act"
 EN1_military_service_act_desc:0 "Voluntary recruitment no longer meets the army's requirements. Tribunals and occupational exemptions must make compulsory service compatible with essential production."

ENG_tank_focus: "Armour Focus"
royal_ordinance_focus: "Royal Ordinance"

# WW1 focus keys restored for the separated Russian and Turkish trees.
 RUS_dockyard_1:0 "Putilov Shipyard Expansion"
 RUS_dockyard_1_desc:0 "Putilov's Petrograd yard receives cranes, slips, and skilled contracts for wartime repairs. The Baltic fleet gains capacity, but the yard's labour and steel are claimed by army orders as well."
 RUS_dockyard_2:0 "Nikolayev Slipway Programme"
 RUS_dockyard_2_desc:0 "Nikolayev shipyards expand their slipways for Black Sea hulls and refits. The southern fleet grows away from the Baltic, while coal and armour plate must travel across the Empire."
 RUS_dockyard_3:0 "Kronstadt Repair Basin"
 RUS_dockyard_3_desc:0 "Kronstadt engineers deepen repair basins and organise stores for the Baltic squadron. Damaged ships return to service faster, though every dredging project competes with fortress work."
 RUS_dockyard_4:0 "Vladivostok Fleet Workshops"
 RUS_dockyard_4_desc:0 "Vladivostok workshops receive machine tools for repairs arriving through the Pacific. The distant fleet gains independence, but its supply chain depends on the long Siberian route."
 RUS_establish_airforce:0 "Create the Imperial Air Fleet"
 RUS_establish_airforce_desc:0 "The Imperial Air Fleet brings army detachments, naval pilots, and civilian constructors under a common command. Russia starts with fragile machines, but it now has an institution able to learn from every sortie."
 RUS_strategic_bomber_research_1:0 "Long-Range Air Navigation"
 RUS_strategic_bomber_research_1_desc:0 "Navigators plot distances across the forests between Petrograd and the front with compass, clock, and landmarks. Longer sorties become possible, though a cloud bank can erase every familiar reference."
 TUR_back_senussi:0 "Support the Senussi Channels"
TUR_strategic_bomber_research_1: "Strategic Bomber Research"
TUR_strategic_bomber_research_1_desc: ""
TUR_submarine_effort: "Submarine Effort"
TUR_submarine_effort_desc: ""
 AUH_ww1_common_customs_market:0 "The Common Customs Market"
 AUH_ww1_common_customs_market_desc:0 "Common contracts and technical standards will bind Austrian industry and Hungarian agriculture together. Neither treasury can afford another barrier to internal trade."
 AUH_ww1_coal_and_steel:0 "Coal and Steel Committees"
 AUH_ww1_coal_and_steel_desc:0 "Mines and foundries compete for transport with food and military stores. Joint purchasing committees must secure their inputs."
 AUH_ww1_joint_industry_board:0 "The Joint Industrial Board"
 AUH_ww1_joint_industry_board_desc:0 "Vienna, Budapest and the armament firms must reconcile competing orders. A standing board will coordinate expansion and record its obligations."
 AUH_ww1_women_in_war_industry:0 "Mobilise the Provincial Workshops"
 AUH_ww1_women_in_war_industry_desc:0 "Provincial firms will recruit and train a larger skilled workforce. Flexible production and civilian workshops take priority over a rigid common armament specification."
 AUH_ww1_wartime_standardization:0 "Standardise Common Armament Orders"
 AUH_ww1_wartime_standardization_desc:0 "The common ministries will place uniform artillery and equipment orders. Central procurement favours military output over a flexible programme of provincial workshop expansion."
 AUH_ww1_war_transition_commission:0 "Plan the Industrial Transition"
 AUH_ww1_war_transition_commission_desc:0 "The chosen mobilisation policy and common procurement accounts must be reviewed together. A practical conversion plan will keep useful machinery and skilled labour in employment."
 AUH_ww1_postwar_conversion:0 "Convert the War Economy"
 AUH_ww1_postwar_conversion_desc:0 "Peace must end permanent emergency production. We will redirect surviving industry to civilian reconstruction and close the temporary war plants."
 AUH_ww1_treasury_coordination:0 "The Common Civil Administration"
 AUH_ww1_treasury_coordination_desc:0 "The common ministries need consistent reporting, appointments and inspections. Regular parliamentary scrutiny will serve the two governments without a separate debt system."
 AUH_ww1_war_bond_market:0 "Municipal Service Contracts"
 AUH_ww1_war_bond_market_desc:0 "Municipalities require reliable water, housing and relief services. Reserve political effort for public works instead of launching another borrowing programme."
 AUH_ww1_hungarian_grain_agreement:0 "The Hungarian Grain Agreement"
 AUH_ww1_hungarian_grain_agreement_desc:0 "Hungarian food deliveries must be negotiated and paid for. A durable agreement will halve the monthly wartime decline in food security."
 AUH_ww1_revenue_reform:0 "Provincial Civil Registers"
 AUH_ww1_revenue_reform_desc:0 "A common set of permits and civil registers will improve procurement and appointments while provincial officials retain local knowledge."
 AUH_ww1_emergency_credit:0 "Technical College Partnerships"
 AUH_ww1_emergency_credit_desc:0 "Vienna, Prague and Budapest can exchange technical curricula and trained instructors. Better engineering instruction supports construction research."
 AUH_ww1_food_office:0 "A Common Food Office"
 AUH_ww1_food_office_desc:0 "Municipalities, army buyers and provincial authorities compete for the same supplies. A common office will record stocks and organize distribution."
 AUH_ww1_sinking_fund:0 "Municipal Housing Boards"
 AUH_ww1_sinking_fund_desc:0 "Housing boards will coordinate building sites and tenders in Vienna. The programme creates civilian workshops in territory we control."
 AUH_ww1_price_statistics:0 "Price and Delivery Statistics"
 AUH_ww1_price_statistics_desc:0 "Railway returns and municipal price registers reveal where deliveries disappear between the countryside and the cities. A common reporting office will reconcile contracts, trace missing food and reduce waste in public purchasing."
 AUH_ww1_civilian_kitchens:0 "Municipal Civilian Kitchens"
 AUH_ww1_civilian_kitchens_desc:0 "Public kitchens give urban families an alternative to an unreliable market. Their expansion consumes resources but helps preserve the home front."
 AUH_ww1_rationing_board:0 "The Rationing Board"
 AUH_ww1_rationing_board_desc:0 "Ration cards require actual deliveries. A joint board will coordinate provincial distribution and protect a minimum civilian share of supplies."
 AUH_ww1_accountable_war_budget:0 "Inspect Common Procurement"
 AUH_ww1_accountable_war_budget_desc:0 "Parliamentary inspectors will compare army purchases with civilian contracts, investigate excessive prices and publish common procurement standards. Better oversight will improve production routines and make the available supplies easier to allocate."
 AUH_ww1_postwar_debt_settlement:0 "Restore Provincial Public Services"
 AUH_ww1_postwar_debt_settlement_desc:0 "Peace allows the provincial administrations to reopen schools, repair municipal services and return officials to civilian work. A year of reconstruction contracts will ease household demands and revive local industry."
 AUH_ww1_july_mediation:0 "A Concert for Balkan Mediation"
 AUH_ww1_july_mediation_desc:0 "A permanent diplomatic channel can contain the next Balkan crisis. We will commit to negotiation before another assassination turns a regional dispute into general war."
 AUH_ww1_sixtus_channel:0 "The Sixtus Channel"
 AUH_ww1_sixtus_channel_desc:0 "Karl can use Prince Sixtus as an intermediary with France. The initiative exposes the court to diplomatic risk and does not guarantee an accepted settlement."
 AUH_ww1_diplomatic_reconstruction:0 "Rebuild the Diplomatic Service"
 AUH_ww1_diplomatic_reconstruction_desc:0 "A surviving monarchy needs treaties that reflect the end of the war. Reopened channels will defend reconstruction through negotiation."
 AUH_ww1_trialist_compromise:0 "A South Slav Crownland"
 AUH_ww1_trialist_compromise_desc:0 "A third political partner could give the South Slavs a place inside the dynasty. It challenges entrenched interests and needs sustained confidence to withstand wartime strain."
 AUH_ww1_federal_compact:0 "A Federal Nationalities Compact"
 AUH_ww1_federal_compact_desc:0 "The empire can attempt a federation of its national communities. Constitutional guarantees improve cooperation but create political and administrative costs."
 AUH_ww1_provincial_rights:0 "Hear the Provincial Diets"
 AUH_ww1_provincial_rights_desc:0 "Local diets will receive a regular channel to the common ministries. Funding their representatives changes consultation, without granting a new constitution."
 AUH_ww1_reopen_reichsrat:0 "Reopen the Reichsrat"
 AUH_ww1_reopen_reichsrat_desc:0 "The representatives of the Austrian half of the monarchy must return to parliamentary business. Provincial consultation and constitutional proposals can justify an early session; the chamber will give the nationalities a public forum and restore scrutiny of the common administration."
 AUH_ww1_worker_representation:0 "Recognize Worker Delegations"
 AUH_ww1_worker_representation_desc:0 "Factories cannot sustain the war through commands alone. Formal representation trades civilian resources for more dependable production."
 AUH_ww1_constitutional_commission:0 "A Constitutional Commission"
 AUH_ww1_constitutional_commission_desc:0 "Karl will commission concrete proposals for the empire future. Negotiated guarantees offer cooperation while the military situation remains decisive."
 AUH_ww1_nationalities_conference:0 "A Conference of the Nationalities"
 AUH_ww1_nationalities_conference_desc:0 "The crown will hear provincial representatives before another emergency measure. Agreement can improve confidence but cannot undo military collapse."
 AUH_ww1_peaceful_reconstruction:0 "Preserve the Common Institutions"
 AUH_ww1_peaceful_reconstruction_desc:0 "Joint administration must restore civilian services, workshops and reliable food deliveries after the war. Reconstruction will serve the territories which remain under the common government."
 AUH_ww1_army_bill_1912:0 "The Army Bill of 1912"
 AUH_ww1_army_bill_1912_desc:0 "The new army law offers a chance to repair years of restricted recruiting and expenditure. Vienna and Budapest must agree on establishments, reserve instruction and the equipment needed to turn the enlarged paper army into a usable force."
 AUH_ww1_fieldworks_bonus:0 "Fieldworks of the Pioneer Corps Research"
 AUH_ww1_respirator_bonus:0 "Issue Respirators to the Front Research"
 AUH_ww1_gas_school_bonus:0 "Regimental Gas Defence Schools Research"
 AUH_ww1_filter_bonus:0 "Inspect the Respirator Supply Research"
 AUH_ww1_mannlicher_bonus:0 "Standardise the Mannlicher Rifle Research"
 AUH_ww1_schwarzlose_bonus:0 "Schwarzlose Machine-Gun Sections Research"
 AUH_ww1_steyr_bonus:0 "Steyr Wartime Production Standards Research"
 AUH_ww1_assault_equipment_bonus:0 "Carbines and Grenades for Assault Sections Research"
 AUH_ww1_regimental_languages:0 "Regimental Language Instruction"
 AUH_ww1_regimental_languages_desc:0 "Orders must be understood before they can be obeyed. Officers and non-commissioned officers will strengthen instruction in the languages used by their own men while retaining a common vocabulary for drill, communications and command."
 AUH_ww1_landwehr_honved_coordination:0 "Coordinate Landwehr and Honved"
 AUH_ww1_landwehr_honved_coordination_desc:0 "The common army, Austrian Landwehr and Hungarian Honved maintain separate recruiting and training establishments. Shared reserve schedules and liaison officers will speed training and move replacements to the formations that need them."
 AUH_ww1_skoda_field_bonus:0 "Skoda Field-Gun Contracts Research"
 AUH_ww1_howitzer_bonus:0 "Modernise the Howitzer Batteries Research"
 AUH_ww1_surveyed_fire_bonus:0 "Surveyed Fire and Battery Signals Research"
 AUH_ww1_artillery_reconnaissance:0 "Artillery Reconnaissance Sections"
 AUH_ww1_artillery_reconnaissance_desc:0 "Survey parties and observers must work as an organized service rather than isolated specialists. Reconnaissance sections will compare patrol reports, photographs and battery observations before targets are entered into the fire plan."
 AUH_ww1_artillery_recon_bonus:0 "Artillery Reconnaissance Sections Research"
 AUH_ww1_mountain_warfare:0 "Train for Mountain Warfare"
 AUH_ww1_mountain_warfare_desc:0 "The Kaiserjager and other experienced mountain formations possess knowledge which the wider army needs. Specialist courses in movement, climbing, dispersed fire and casualty evacuation will prepare units for the Carpathians and the Alpine frontier."
 AUH_ww1_tyrolean_depots:0 "Tyrolean Supply Depots"
 AUH_ww1_tyrolean_depots_desc:0 "Mountain positions cannot be sustained from distant stores alone. Improving the routes and depots of Tyrol will shorten the last stage of the supply journey and support the pack columns which carry food and ammunition above the railheads."
 AUH_ww1_alpine_logistics:0 "Pack Columns and Cableways"
 AUH_ww1_alpine_logistics_desc:0 "Roads narrow and horses tire long before they reach the highest positions. Better organized pack columns, cableways and protected stores will help the Alpine army maintain regular deliveries through weather which defeats ordinary transport."
 AUH_ww1_alpine_supply_bonus:0 "Pack Columns and Cableways Research"
 AUH_war_front_2_desc:0 "The Isonzo sector combines exposed approaches, rock-cut positions and narrow supply routes. A permanent front headquarters will coordinate artillery, relief and reserves so that the defence can endure repeated enemy preparations."
 AUH_ww1_stosstruppen:0 "A Common Assault Programme"
 AUH_ww1_stosstruppen_desc:0 "Selected regiments will train for coordinated attacks with grenades and supporting fire. This programme gives priority to assault formations rather than a general reform of positional defence."
 AUH_ww1_common_operational_plan:0 "A Common Campaign Plan"
 AUH_ww1_common_operational_plan_desc:0 "General staff standards, mountain supply and the front command will be brought into one campaign plan. Either tactical programme can supply its trained formations."
 AUH_ww1_observation_armament_bonus:0 "Arm the Observation Aircraft Research"
 AUH_ww1_lohner_lloyd_bonus:0 "Lohner and Lloyd Two-Seaters Research"
 AUH_ww1_aviatik_two_seater_bonus:0 "Aviatik C-Type Contracts Research"
 AUH_ww1_phonix_ufag_bonus:0 "Phonix and UFAG Reconnaissance Types Research"
 AUH_ww1_bomb_rack_bonus:0 "Standardise Two-Seater Bomb Racks Research"
 AUH_ww1_bomber_program_review:0 "Concentrate the Bomber Programme"
 AUH_ww1_bomber_program_review_desc:0 "The Knoller and two-seater proposals will be judged as part of a concentrated bombing programme. Independent bombing takes priority over permanent artillery-contact detachments."
 AUH_ww1_aerial_artillery_liaison:0 "Aircraft for the Field Armies"
 AUH_ww1_aerial_artillery_liaison_desc:0 "Trained observers and infantry contact aircraft will support the field armies. Aerial observation takes priority over the concentration of an independent bombing force."
 AUH_ww1_aviation_spares:0 "A Common Aviation Supply Pool"
 AUH_ww1_aviation_spares_desc:0 "Either bombing or army cooperation requires dependable parts and ground workshops. The flying stations will supply a common reserve for the chosen operational programme."
 AUH_ww1_fighter_armament_bonus:0 "Create Dedicated Fighter Flights Research"
 AUH_ww1_oeffag_bonus:0 "Oeffag Albatros Production Research"
 AUH_ww1_aviatik_berg_bonus:0 "The Aviatik Berg Fighter Research"
 AUH_ww1_phonix_fighter_bonus:0 "Phonix Fighter Trials Research"
 AUH_ww1_contact_aircraft_bonus:0 "Low-Level Support Trials Research"
 AUH_ww1_joint_air_operations:0 "Coordinate the Air Companies"
 AUH_ww1_joint_air_operations_desc:0 "Fighter patrols, reconnaissance flights and infantry contact aircraft must follow one operational schedule. A joint air command will coordinate their missions and make air support more effective during the next year."
 AUH_ww1_naval_gunnery_bonus:0 "Skoda Naval Gunnery Research"
 AUH_ww1_adriatic_patrols:0 "Adriatic Patrol Stations"
 AUH_ww1_adriatic_patrols_desc:0 "A limited fleet needs reliable information about its own sea. Coastal observation posts, patrol schedules and liaison with naval aviation will help light forces cover the approaches to Pola, Trieste and the southern bases."
 AUH_ww1_submarine_design_bonus:0 "Develop the U-Boat Arm Research"
 AUH_ww1_u_boat_training_bonus:0 "Pola U-Boat School Research"
 AUH_ww1_tatra_bonus:0 "Tatra-Class Light Forces Research"
 AUH_ww1_tegetthoff_bonus:0 "The Tegetthoff Programme Research"
 AUH_ww1_novara_bonus:0 "Novara-Class Scout Cruisers Research"
 AUH_battle_cruiser_effort_desc:0 "The Adriatic rewards speed and concentration more often than another heavy hull. Cruiser and destroyer commanders will practice rendezvous, mutual support and planned withdrawal so that fast squadrons can attack without becoming trapped by superior enemy forces."
 AUH_ww1_cattaro_support:0 "Support the Cattaro Flotillas"
 AUH_ww1_cattaro_support_desc:0 "The southern flotillas need workshops close to their patrol grounds. A dedicated repair service at Cattaro will turn damaged ships around more quickly and reduce wear during a year of Adriatic operations."
 AUH_ww1_preserve_battle_fleet:0 "Preserve the Battle Fleet"
 AUH_ww1_preserve_battle_fleet_desc:0 "Trained capital-ship crews and reliable machinery will preserve the fleet as a force in being. Routine maintenance takes priority over a programme of frequent light-force raids."
 AUH_ww1_battle_fleet_preservation_bonus:0 "Preserve the Battle Fleet Research"
 AUH_ww1_adriatic_sorties:0 "An Adriatic Raiding Programme"
 AUH_ww1_adriatic_sorties_desc:0 "Cruisers, submarines and light forces will train for limited sorties against the Adriatic blockade. Active operations take priority over preserving the battle fleet in harbour."
 AUH_ww1_otranto_operation:0 "The Adriatic Operational Staff"
 AUH_ww1_otranto_operation_desc:0 "The chosen fleet strategy and the Cattaro repair service will inform a common operational plan. The staff will prepare a limited action that the navy can supply and sustain."
 IT1_ww1_national_industrial_survey:0 "Survey National Industry"
 IT1_ww1_national_industrial_survey_desc:0 "A reliable account of machinery and skilled workers will expose the gaps between northern factories and southern districts. Public contracts must follow actual capacity."
 IT1_ww1_hydroelectric_consortium:0 "The Hydroelectric Consortium"
 IT1_ww1_hydroelectric_consortium_desc:0 "Domestic hydroelectric power can reduce the vulnerability of workshops dependent on imported coal. Engineers and investors will coordinate surveys and equipment standards."
 IT1_ww1_industrial_mobilization:0 "Dallolio's Industrial Mobilisation"
 IT1_ww1_industrial_mobilization_desc:0 "Military orders must reach factories through one coordinated programme. Central supervision will increase armament output, with additional civilian demands as labour and materials move into wartime production."
 IT1_ww1_southern_development:0 "Develop the Mezzogiorno"
 IT1_ww1_southern_development_desc:0 "Southern development must produce more than promises. A new civilian workshop in Campania will connect local skills to public purchasing."
 IT1_ww1_women_in_workshops:0 "Recruit the Industrial Workforce"
 IT1_ww1_women_in_workshops_desc:0 "The chosen arsenal or consortium programme requires a trained workforce. Women entering the workshops will receive organised instruction and dependable employment contracts."
 IT1_ww1_state_arsenal_model:0 "The State Arsenal Programme"
 IT1_ww1_state_arsenal_model_desc:0 "Dallolio will concentrate contracts on the state arsenals and guaranteed military orders. Immediate armament output takes priority over expansion of private civilian consortia."
 IT1_ww1_private_consortia:0 "The Industrial Consortium Programme"
 IT1_ww1_private_consortia_desc:0 "Private firms will coordinate their contracts and invest in flexible machinery. Production efficiency and civilian expansion take priority over the immediate output of state arsenals."
 IT1_ww1_precision_standardization:0 "Common Precision Standards"
 IT1_ww1_precision_standardization_desc:0 "Technical purchasing bureaux will compare the output of the mobilisation programme. Uniform machine tools and equipment standards will improve the reliability of both civilian and military contracts."
 IT1_ww1_reconstruction_contracts:0 "Convert the Emergency Workshops"
 IT1_ww1_reconstruction_contracts_desc:0 "Emergency armament contracts have served their purpose. A planned conversion will demobilise the temporary war factories, accelerate civilian construction and ease consumer demands, while military output suffers during the transition."
 IT1_ww1_banking_committee:0 "Feed and Supply the Nation"
 IT1_ww1_banking_committee_desc:0 "Italian industry depends on imported raw materials and reliable food deliveries. A national economic programme will coordinate grain cargoes, public contracts and technical purchasing alongside the expansion of our factories."
 IT1_ww1_national_loan_market:0 "Secure Merchant Tonnage"
 IT1_ww1_national_loan_market_desc:0 "Regular deliveries begin with ships that can be assigned to our contracts. Ten newly commissioned merchant convoys will expand the transport available to carry grain and raw materials."
 IT1_ww1_grain_imports:0 "Secure Grain Import Contracts"
 IT1_ww1_grain_imports_desc:0 "Merchant contracts will secure additional shipping and imported machinery. Five commissioned convoys expand our transport capacity, while a year of foreign purchasing support accelerates civilian factory construction."
 IT1_ww1_progressive_taxation:0 "Expand Municipal Services"
 IT1_ww1_progressive_taxation_desc:0 "Growing towns need schools, housing and dependable public utilities. Common technical standards will make civilian construction faster and help municipalities obtain the materials their projects require."
 IT1_ww1_central_bank_facility:0 "Technical Purchasing Bureaux"
 IT1_ww1_central_bank_facility_desc:0 "Industrial buyers must understand the machinery they order. Specialist purchasing bureaux will compare specifications and give Italian firms access to better engineering and production techniques."
 IT1_ww1_national_food_commission:0 "The National Food Commission"
 IT1_ww1_national_food_commission_desc:0 "Army buyers and municipal authorities must stop bidding blindly against one another. A joint commission will record stocks and organize distribution."
 IT1_ww1_audit_military_contracts:0 "Inspect the Armament Contracts"
 IT1_ww1_audit_military_contracts_desc:0 "Inspectors will compare factory deliveries with army specifications and expose wasted material. The programme supports domestic output while retaining a modest civilian cost for the extra administration."
 IT1_ww1_protect_small_savers:0 "Protect Household Savings"
 IT1_ww1_protect_small_savers_desc:0 "Industrial development needs public confidence as well as machinery. Transparent savings guarantees will keep households involved in recovery and reduce the share of production needed to meet immediate civilian demands."
 IT1_ww1_municipal_relief:0 "Municipal Food Relief"
 IT1_ww1_municipal_relief_desc:0 "Public kitchens and local relief offices will support urban families. Their expansion needs paid deliveries and resources from the civilian economy."
 IT1_ww1_shipping_insurance:0 "Insure Essential Shipping"
 IT1_ww1_shipping_insurance_desc:0 "Essential grain and raw materials must continue to reach Italian ports. Government-backed contracts will commission ten merchant convoys and insure priority deliveries, strengthening the shipping network that supplies our home front."
 IT1_ww1_budget_discipline:0 "Publish the Public Accounts"
 IT1_ww1_budget_discipline_desc:0 "Open accounts give parliament and factory managers a common record of public orders. A year of inspections and published tenders will improve production routines at a modest cost to civilian capacity."
 IT1_ww1_domestic_credit_strategy:0 "Develop Domestic Suppliers"
 IT1_ww1_domestic_credit_strategy_desc:0 "Italian firms can supply a greater share of the army's requirements if orders are predictable and technical standards are shared. This policy favours factory output and gradual improvements in production efficiency."
 IT1_ww1_trade_finance:0 "Open Foreign Purchasing Offices"
 IT1_ww1_trade_finance_desc:0 "International purchasing offices will bring machinery and industrial designs into Italy. Their contracts favour civilian construction and reduce the burden of shortages on our expanding industrial base."
 IT1_ww1_debt_conversion:0 "Return to Civilian Production"
 IT1_ww1_debt_conversion_desc:0 "The emergency armament programme must contract once peace returns. Converting the surviving plants will accelerate civilian construction and ease consumer demands, while military output suffers during the transition."
 IT1_ww1_veterans_pensions:0 "A Pension for Returning Soldiers"
 IT1_ww1_veterans_pensions_desc:0 "Returning soldiers need an income and a place in civilian society. A year of pensions, reserve courses and public works will improve military training and infrastructure construction while requiring civilian resources."
 IT1_ww1_balanced_reconstruction:0 "An Integrated Civilian Recovery"
 IT1_ww1_balanced_reconstruction_desc:0 "Converted workshops and returning skilled soldiers will support one civilian development plan. Regional industry must remain useful after military orders decline."
 IT1_ww1_colonial_office:0 "A Professional Colonial Office"
 IT1_ww1_colonial_office_desc:0 "A permanent colonial office will coordinate district officials, legal procedure and relations with local communities. Consistent civil administration will support compliance and restrain the growth of resistance throughout our overseas territories."
 IT1_ww1_ottoman_accommodation:0 "An Understanding with the Porte"
 IT1_ww1_ottoman_accommodation_desc:0 "Commercial concessions and a negotiated sphere offer an alternative to invasion. Ottoman acceptance is required and no Libyan state changes hands by decree."
 IT1_ww1_eritrean_civil_service:0 "The Eritrean Civil Service"
 IT1_ww1_eritrean_civil_service_desc:0 "The Eritrean administration needs roads and reliable connections between its district offices. Improved infrastructure will support local services and regular deliveries."
 IT1_ww1_ottoman_trade_mission:0 "Commercial Missions to Ottoman Ports"
 IT1_ww1_ottoman_trade_mission_desc:0 "Accepted accommodation permits a different colonial policy. Paid merchant missions will improve food supply and support civilian trade while preserving Ottoman sovereignty."
 IT1_ww1_somali_coastal_services:0 "Somali Coastal Services"
 IT1_ww1_somali_coastal_services_desc:0 "Our Somali ports need roads and basic supply facilities. The investment remains inside territory already owned and controlled by Italy."
 IT1_ww1_consular_network:0 "Expand the Consular Network"
 IT1_ww1_consular_network_desc:0 "Consuls can support trade and obtain reliable local information without claiming ownership. The diplomatic network will provide a foundation for future Mediterranean agreements."
 IT1_ww1_red_sea_supply:0 "The Red Sea Supply Network"
 IT1_ww1_red_sea_supply_desc:0 "Eritrean and Somali services must coordinate shipments rather than competing for them. Funded contracts will protect supply at both ends of the route."
 IT1_ww1_senussi_accommodation:0 "Negotiate with the Senussi"
 IT1_ww1_senussi_accommodation_desc:0 "Local leaders may accept an agreement on civil administration and security. Negotiation requires resources and a reply; it offers an alternative to a permanent punitive campaign."
 IT1_ww1_colonial_sanitation:0 "Hospitals and Sanitation Overseas"
 IT1_ww1_colonial_sanitation_desc:0 "Medical services need clean water, usable roads and regular shipments. A year of infrastructure support will strengthen the colonial administration and improve food deliveries."
 IT1_ww1_tripolitanian_road_services:0 "Tripolitanian Road Services"
 IT1_ww1_tripolitanian_road_services_desc:0 "Roads near the Tripoli district can support the coast and its market. Construction proceeds only where Italy owns and controls the state."
 IT1_ww1_dodecanese_administration:0 "Administer the Dodecanese"
 IT1_ww1_dodecanese_administration_desc:0 "The islands require a permanent civil service and respect for local communities. The programme applies only if Italy already owns and controls the Dodecanese."
 IT1_ww1_colonial_trade_board:0 "The Colonial Trade Board"
 IT1_ww1_colonial_trade_board_desc:0 "A permanent trade board will coordinate ports, storage and civilian orders across our overseas holdings. Common contracts will support infrastructure investment and reliable commercial deliveries."
 IT1_ww1_mediterranean_commerce:0 "Mediterranean Commercial Cooperation"
 IT1_ww1_mediterranean_commerce_desc:0 "Consuls, merchants and the foreign ministry will support negotiated access to regional markets. Trade can strengthen influence without requiring another war."
 IT1_ww1_colonial_autonomy_charters:0 "Local Administrative Charters"
 IT1_ww1_colonial_autonomy_charters_desc:0 "Local councils will receive written responsibilities and a regular channel to the colonial administration. Their charters will improve cooperation and reduce the level of resistance in the territories we govern."
 IT1_ww1_permanent_colonial_budget:0 "Permanent Colonial Service Offices"
 IT1_ww1_permanent_colonial_budget_desc:0 "Recurring colonial services need reliable local offices and purchasing schedules. Supervised administration replaces emergency borrowing."
 IT1_ww1_peaceful_colonial_order:0 "A Lasting Overseas Settlement"
 IT1_ww1_peaceful_colonial_order_desc:0 "Permanent services and negotiated agreements must replace emergency rule. A functioning commercial network and local institutions will give Italy the political support needed to sustain its overseas policy."
 IT1_ww1_continental_concert:0 "A Continental Understanding"
 IT1_ww1_continental_concert_desc:0 "Italy can approach France with a proposal for continental cooperation. The French government must accept the offer before the agreement can become a faction, and Russia may be invited to take part."
 IT1_ww1_london_supply_guarantees:0 "Clarify Allied Supply Guarantees"
 IT1_ww1_london_supply_guarantees_desc:0 "Italian intervention will require a dependable flow of materials. Our ministry will coordinate purchasing plans without assuming that foreign stocks belong to Italy."
 IT1_ww1_armed_neutrality:0 "Permanent Armed Neutrality"
 IT1_ww1_armed_neutrality_desc:0 "Italy will refuse participation in the continental war and defend its independence. Neutral trade and mediation require a firm pledge which also blocks automatic Entente entry."
 IT1_ww1_neutral_trade_conventions:0 "Neutral Trade Conventions"
 IT1_ww1_neutral_trade_conventions_desc:0 "Clear shipping and customs conventions will protect civilian commerce. The treasury must fund the guarantees while Italy remains outside the great-power factions."
 IT1_ww1_adriatic_compact:0 "A Negotiated Adriatic Compact"
 IT1_ww1_adriatic_compact_desc:0 "Italy and Austria-Hungary can seek guarantees for the Adriatic rather than another territorial war. Vienna must accept before the arrangement takes effect."
 IT1_ww1_central_staff_mission:0 "A Joint Central Powers Staff Mission"
 IT1_ww1_central_staff_mission_desc:0 "Italian and German commanders will coordinate plans while preserving their national chains of command. The mission requires political effort and real allied cooperation."
 IT1_ww1_mediation_conference:0 "Sponsor a Mediation Conference"
 IT1_ww1_mediation_conference_desc:0 "Italy will offer a diplomatic channel between the opposing powers. A conference can establish regular mediation while our government follows a policy of armed neutrality."
 IT1_ww1_albanian_guarantee:0 "Guarantee Albanian Independence"
 IT1_ww1_albanian_guarantee_desc:0 "Albanian independence can be defended without annexing its territory. Italy will guarantee an existing Albanian state which is neither a subject nor an enemy."
 IT1_ww1_common_frontier_commission:0 "The Common Frontier Commission"
 IT1_ww1_common_frontier_commission_desc:0 "Representatives will review the frontier arrangements agreed with Austria-Hungary. A year of diplomatic liaison will support their work and strengthen the government's ability to carry the settlement through."
 IT1_ww1_mediterranean_security:0 "The Mediterranean Council"
 IT1_ww1_mediterranean_security_desc:0 "The accepted continental agreement needs regular naval consultation and diplomatic meetings. A permanent council will coordinate policy among its members."
 IT1_ww1_western_campaign_plans:0 "Plans for the Western Front"
 IT1_ww1_western_campaign_plans_desc:0 "A German-aligned Italy must prepare for the French frontier rather than repeat an Austrian campaign. Joint planning will improve staff experience without preempting actual operations."
 IT1_ww1_allied_purchase_controls:0 "Supervise Allied Purchases"
 IT1_ww1_allied_purchase_controls_desc:0 "Our purchasing missions must account for the equipment ordered abroad. A year of published contracts and inspections will improve industrial routines and keep allied deliveries under review."
 IT1_ww1_war_aims_conference:0 "The Italian War Aims Conference"
 IT1_ww1_war_aims_conference_desc:0 "The government will bring military plans and diplomatic demands before one conference. A clear statement of Italy's aims will give our representatives the political authority to negotiate the eventual peace."
 IT1_ww1_postwar_diplomatic_settlement:0 "Review the Postwar Settlement"
 IT1_ww1_postwar_diplomatic_settlement_desc:0 "Italy must review its wartime agreements and the settlement that follows. The government will decide whether to consolidate its commitments or take a more independent diplomatic position."
 IT1_ww1_independent_great_power:0 "Italy among the Great Powers"
 IT1_ww1_independent_great_power_desc:0 "Italy must emerge from the settlement with an independent voice and a navy ready to protect its position. Consolidating our agreements will strengthen the diplomatic mandate and the experience of the fleet."
 IT1_ww1_catholic_understanding:0 "The Catholic Electoral Agreement"
 IT1_ww1_catholic_understanding_desc:0 "Catholic associations can broaden the parliamentary coalition. Negotiated social commitments will bring their representatives into political life and provide a more dependable majority."
 IT1_ww1_labor_pact:0 "A Compact with Organised Labour"
 IT1_ww1_labor_pact_desc:0 "Union representatives and industrial employers will negotiate wages, hours and factory conditions. Their agreement will make concessions to labour while factories adapt to the new arrangements."
 IT1_ww1_suffrage_implementation:0 "Put the Suffrage Reform into Practice"
 IT1_ww1_suffrage_implementation_desc:0 "The expanded electorate needs registers, polling arrangements and officials who can apply the law consistently. Implementing the reform will give the parliamentary system a stronger political mandate."
 IT1_ww1_constitutional_settlement:0 "The Future of the Statuto"
 IT1_ww1_constitutional_settlement_desc:0 "The crown and parliament cannot postpone the question of executive authority. We must decide how Italy is governed and prepare either a responsible ministry, a strengthened royal cabinet, or a new republican constitution."
 IT1_ww1_liberal_cabinet:0 "A Responsible Parliamentary Ministry"
 IT1_ww1_liberal_cabinet_desc:0 "The government will answer to parliament while the monarchy remains within the constitution. A responsible ministry will strengthen civilian construction and provide a clear framework for political business."
 IT1_ww1_royal_cabinet:0 "The King's Government"
 IT1_ww1_royal_cabinet_desc:0 "The crown will direct a stronger executive and appoint its ministers. Faster political decisions and military administration will come with a larger civilian commitment to the royal government."
 IT1_ww1_republican_convention:0 "Proclaim the Italian Republic"
 IT1_ww1_republican_convention_desc:0 "An elected assembly will replace dynastic authority with a republican constitution. Choosing this programme commits the convention to forming the republic and places the common services under civilian government."
 IT1_ww1_socialist_congress:0 "A Republic of the Workers"
 IT1_ww1_socialist_congress_desc:0 "The socialist congress will seek a new state governed by the labour movement. Choosing this programme commits Italy to a socialist republic and prepares the factories for a system of elected councils."
 IT1_ww1_civil_service_professionalization:0 "Professionalize the Civil Service"
 IT1_ww1_civil_service_professionalization_desc:0 "Reliable accounts and trained officials are indispensable to civilian government. A paid programme will support accountable administration without altering the military command."
 IT1_ww1_republican_guarantees:0 "Civil Guarantees of the Republic"
 IT1_ww1_republican_guarantees_desc:0 "Written guarantees will define the rights of citizens and the responsibilities of public officials. The republic will combine an accountable administration with support for education and research."
 IT1_ww1_royal_inspection_services:0 "Inspect the Crown's Administration"
 IT1_ww1_royal_inspection_services_desc:0 "The royal cabinet must know how its orders are carried out. Inspection services will review military and civilian contracts and improve the routines of public purchasing."
 IT1_ww1_workers_councils:0 "Factories under Workers' Councils"
 IT1_ww1_workers_councils_desc:0 "Factory councils will coordinate production and share practical experience among workshops. Their system favours armament output and industrial learning, while supporting the workers requires additional civilian resources."
 IT1_ww1_agrarian_cooperatives:0 "Organise the Agricultural Cooperatives"
 IT1_ww1_agrarian_cooperatives_desc:0 "Cooperatives will coordinate storage, transport and distribution in the countryside. A year of rationing arrangements will reduce the supplies consumed by the national services."
 IT1_ww1_land_settlement_commission:0 "Workshops for the Mezzogiorno"
 IT1_ww1_land_settlement_commission_desc:0 "Land settlement and rural development need local employment. A civilian workshop in Campania will provide tools and work for the surrounding communities, provided the state remains securely in Italian hands."
 IT1_ww1_reintegration_of_veterans:0 "Work for the Returning Soldiers"
 IT1_ww1_reintegration_of_veterans_desc:0 "A year of public works and reserve courses will help demobilised soldiers return to civilian life. The programme will improve infrastructure construction and retain a trained reserve at a modest civilian cost."
 IT1_ww1_constitutional_continuity:0 "Secure the New Settlement"
 IT1_ww1_constitutional_continuity_desc:0 "The chosen government must turn its constitution into dependable practice. Public services, civilian recovery and the support of returning soldiers will give the settlement a lasting political mandate."
 IT1_ww1_staff_coordination:0 "A Permanent Mobilization Bureau"
 IT1_ww1_staff_coordination_desc:0 "Railway schedules and reserve call-ups cannot be improvised when the frontier is threatened. A permanent staff bureau will reconcile mobilization plans with the men, rolling stock and depots actually available."
 IT1_ww1_fieldworks_bonus:0 "Engineer the Field Positions Research"
 IT1_ww1_respirator_bonus:0 "Issue Protective Respirators Research"
 IT1_ww1_gas_school_bonus:0 "Regimental Gas-Defence Schools Research"
 IT1_ww1_filter_bonus:0 "Inspect the Filter Reserves Research"
 IT1_ww1_carcano_bonus:0 "The Carcano Rifle System Research"
 IT1_ww1_fiat_revelli_bonus:0 "Fiat-Revelli Machine-Gun Teams Research"
 IT1_ww1_villar_perosa_bonus:0 "Villar Perosa Field Trials Research"
 IT1_ww1_assault_equipment_bonus:0 "Carbines and Assault Equipment Research"
 IT1_ww1_field_gun_bonus:0 "Cannone da 75 Contracts Research"
 IT1_ww1_heavy_howitzer_bonus:0 "The Heavy Howitzer Parks Research"
 IT1_ww1_bombarde_bonus:0 "Bombarde for the Wire Research"
 IT1_ww1_alpini_schools:0 "The Alpini Training Schools"
 IT1_ww1_alpini_schools_desc:0 "The Alpini know the frontier valleys and the habits of mountain service. Specialist schools will spread their climbing, reconnaissance and marksmanship experience while preserving the local knowledge on which their battalions depend."
 IT1_ww1_alpine_cableways:0 "Cableways Above the Railheads"
 IT1_ww1_alpine_cableways_desc:0 "High positions depend on supplies carried beyond the reach of roads. Engineers will organize cableways, pack columns and protected stores, reducing the time soldiers spend hauling ammunition instead of preparing their positions."
 IT1_ww1_mountain_guns:0 "Artillery for the Alpine Batteries"
 IT1_ww1_mountain_guns_desc:0 "Mountain batteries must carry their guns where ordinary artillery cannot travel. Trials will combine lighter equipment, trained pack animals and reliable ammunition tables for high-angle fire across ridges and valleys."
 IT1_ww1_mountain_gun_bonus:0 "Artillery for the Alpine Batteries Research"
 IT1_ww1_winter_positions:0 "Prepare the White War Positions"
 IT1_ww1_winter_positions_desc:0 "Snow, avalanches and cold can destroy a mountain unit without an enemy attack. Winter-service courses and shelter inspections will pass on the practical lessons needed to sustain the Alpine front through another season."
 IT1_ww1_rear_services:0 "Coordinate the Rear Services"
 IT1_ww1_rear_services_desc:0 "Transport, ammunition parks and replacement depots must answer to a common picture of the army. A rear-services bureau will reconcile competing requests before shortages arrive at the same exhausted front-line formations."
 IT1_ww1_rail_transport_bonus:0 "Coordinate the Rear Services Research"
 IT1_ww1_field_hospitals:0 "Field Hospitals and Evacuation Routes"
 IT1_ww1_field_hospitals_desc:0 "The army will organise evacuation routes and standard medical procedures behind the front. Research teams will improve field hospitals while staffs practise the movement of casualties."
 IT1_ww1_replacement_rotations:0 "Rotate the Replacement Drafts"
 IT1_ww1_replacement_rotations_desc:0 "Trained replacements should reach formations before exhaustion empties them of experienced men. Better draft schedules and periods of rear-area instruction will improve continuity while reducing the strain of uninterrupted front-line service."
 IT1_ww1_arditi:0 "Organise the Reparti d'Assalto"
 IT1_ww1_arditi_desc:0 "Selected assault troops will practice grenade fighting, rapid movement and attacks against isolated strongpoints. The new Reparti d'Assalto require instructors and support arrangements as carefully prepared as the men chosen for their ranks."
 IT1_ww1_assault_support:0 "Artillery Support for the Arditi"
 IT1_ww1_assault_support_desc:0 "Assault formations need surveyed targets and artillery that can follow their movement. A year of coordinated battery work will improve attack preparation and reduce supply waste."
 IT1_ww1_cadorna_offensives:0 "Concentrate the Frontier Offensives"
 IT1_ww1_cadorna_offensives_desc:0 "A determined offensive policy demands concentrated artillery and tightly controlled preparations. The staff will commit its effort to breaking fortified frontier positions, accepting additional expense and strain in exchange for a stronger assault programme."
 IT1_ww1_early_command_reform:0 "Reform Command Before the Crisis"
 IT1_ww1_early_command_reform_desc:0 "The army can give subordinate commanders clearer objectives and more room to adapt before a disaster forces change. This alternative programme will emphasize maintained reserves and shorter operations, with less strain on the men and rear services."
 IT1_ww1_shell_concentration:0 "Concentrate the Ammunition Parks"
 IT1_ww1_shell_concentration_desc:0 "A sustained attack needs ammunition delivered to one timetable. We will prioritise artillery supply and transport for selected sectors."
 IT1_ww1_shell_concentration_bonus:0 "Concentrate the Ammunition Parks Research"
 IT1_ww1_defence_in_depth:0 "A Defence with Local Reserves"
 IT1_ww1_defence_in_depth_desc:0 "A penetrated forward trench need not cost an entire sector. Commanders will establish fallback positions and local reserves, allowing the army to absorb attacks while preserving the strength needed for a limited counterstroke."
 IT1_ww1_officer_replacements:0 "Rebuild the Officer Cadres"
 IT1_ww1_officer_replacements_desc:0 "Heavy fighting consumes the junior officers who keep units functioning under fire. Accelerated courses and supervised front-line attachments will rebuild the cadres, while commanders receive more accurate reports of their the actual strength of their formations."
 IT1_ww1_soldier_welfare:0 "Leave and Front-Line Welfare"
 IT1_ww1_soldier_welfare_desc:0 "Leave, reserve courses and work programmes will give soldiers a more dependable connection to life behind the lines. A year of support will improve training and infrastructure construction."
 IT1_ww1_caporetto_command_review:0 "Review the Supreme Command"
 IT1_ww1_caporetto_command_review_desc:0 "The crisis on the northern front demands an honest examination of command and communications. A military council will consider who should direct the army and how headquarters must change before another campaign."
 IT1_ww1_diaz_reforms:0 "Diaz and the Restored Army"
 IT1_ww1_diaz_reforms_desc:0 "A new command can give the army a steadier relationship between objectives, reserves and the condition of its men. the reform programme of Diaz will strengthen staff coordination and relief arrangements as the formations regain confidence."
 IT1_ww1_retain_old_command:0 "Retain the Offensive Command"
 IT1_ww1_retain_old_command_desc:0 "The government can choose to retain the existing command after its review. This alternative commits the army to renewed concentration and assault preparation, but the decision will place additional strain on an already weary society."
 IT1_ww1_army_campaign_plan:0 "A Sustainable Campaign Plan"
 IT1_ww1_army_campaign_plan_desc:0 "The restored command and prepared reserve positions will support the next campaign. Either Diaz or the retained offensive command must work with the army that Italy can actually supply."
 IT1_ww1_air_bomb_trials_bonus:0 "Bombs from Observation Aircraft Research"
 IT1_ww1_caproni_trimotor_bonus:0 "Caproni Trimotor Contracts Research"
 IT1_ww1_caproni_ca3_bonus:0 "The Caproni Ca.3 Squadrons Research"
 IT1_ww1_caproni_standardisation_bonus:0 "Standardise the Caproni Bombing Force Research"
 IT1_ww1_bomb_sight_bonus:0 "Caproni Bomb Sights and Loading Research"
 IT1_ww1_fighter_armament_bonus:0 "Create the Fighter Squadrons Research"
 IT1_ww1_macchi_nieuport_bonus:0 "Macchi-Nieuport Licence Production Research"
 IT1_ww1_spad_bonus:0 "SPAD Service and Maintenance Research"
 IT1_ww1_ansaldo_sva_bonus:0 "Develop the Ansaldo SVA Research"
 IT1_ww1_synchronised_armament_bonus:0 "Synchronised Armament Workshops Research"
 IT1_ww1_contact_aircraft_bonus:0 "Battlefield Support Experiments Research"
 IT1_ww1_photographic_reconnaissance:0 "Photographic Sections for the Armies"
 IT1_ww1_photographic_reconnaissance_desc:0 "Photographs become useful intelligence only when trained officers interpret and distribute them. Dedicated sections will compare aerial images with maps and patrol reports, improving the information available to artillery and army headquarters."
 IT1_ww1_fiat_aero_engines:0 "Fiat Aviation Engine Contracts"
 IT1_ww1_fiat_aero_engines_desc:0 "A reliable engine supply underpins every aircraft programme. Coordinated Fiat contracts and specialist inspection will support the workshops and repair depots which must keep the expanding aviation service in the air."
 IT1_ww1_fiat_aero_engine_bonus:0 "Fiat Aviation Engine Contracts Research"
 IT1_ww1_independent_bombing:0 "An Independent Caproni Command"
 IT1_ww1_independent_bombing_desc:0 "Caproni crews and the bombing schools will prepare an independent bombing programme. Long-range bombing takes priority over permanent air companies for the field armies."
 IT1_ww1_army_air_cooperation:0 "Air Companies for the Armies"
 IT1_ww1_army_air_cooperation_desc:0 "Photographic sections and contact aircraft will serve the field armies directly. This programme gives priority to cooperation over an independent strategic bombing command."
 IT1_ww1_air_campaign_plan:0 "An Italian Air Campaign Staff"
 IT1_ww1_air_campaign_plan_desc:0 "Engine contracts, fighter acceptance and the chosen operational programme will support a common campaign staff. The service will concentrate its trained crews on achievable objectives."
 IT1_ww1_dante_alighieri_bonus:0 "The Dante Alighieri Programme Research"
 IT1_ww1_naval_gunnery_bonus:0 "Naval Gunnery and Fire Control Research"
 IT1_ww1_laurenti_bonus:0 "The Laurenti Submarine Designs Research"
 IT1_ww1_f_class_bonus:0 "The F-Class Submarine Service Research"
 IT1_ww1_indomito_pilo_bonus:0 "Indomito and Pilo Destroyers Research"
 IT1_ww1_cavour_duilio_bonus:0 "The Cavour and Duilio Squadrons Research"
 IT1_ww1_esploratori_bonus:0 "Esploratori for the Fleet Research"
 IT1_ww1_adriatic_observation:0 "Adriatic Observation Stations"
 IT1_ww1_adriatic_observation_desc:0 "Coastal observers and regular patrols can warn the fleet before an enemy sortie reaches its objective. The navy will coordinate reports from shore stations and light forces into a clearer picture of the Adriatic approaches."
 IT1_ww1_naval_staff:0 "A Permanent Naval Operations Staff"
 IT1_ww1_naval_staff_desc:0 "The battle fleet, light forces and shore services need a common operational picture. A permanent staff will reconcile their readiness reports, maintenance schedules and objectives before an emergency forces hurried coordination."
 IT1_ww1_torpedo_depots:0 "Torpedo Depots and Inspection"
 IT1_ww1_torpedo_depots_desc:0 "A flotilla cannot rely on weapons which have been stored or adjusted inconsistently. Specialized depot teams will inspect torpedoes and standardize handling procedures, giving commanders more confidence in the weapons already issued."
 IT1_ww1_torpedo_depot_bonus:0 "Torpedo Depots and Inspection Research"
 IT1_ww1_mas_flotillas:0 "Develop the MAS Flotillas"
 IT1_ww1_mas_flotillas_desc:0 "Small motor torpedo craft can operate in confined coastal waters where larger ships are too costly to risk. Trials will refine engines, torpedo fittings and crew training before an expanded flotilla programme is approved."
 IT1_ww1_otranto_patrols:0 "Patrol the Strait of Otranto"
 IT1_ww1_otranto_patrols_desc:0 "The entrance to the Adriatic concentrates traffic into waters which light forces can watch. Patrol plans will coordinate observation, escorts and reserve units while avoiding the assumption that a line on a map can seal the sea."
 IT1_ww1_adriatic_minefields:0 "Chart the Adriatic Minefields"
 IT1_ww1_adriatic_minefields_desc:0 "Patrol and convoy officers will share mine charts and navigation practices. Either maritime commitment can provide the experience needed to secure the approaches."
 IT1_ww1_adriatic_mines_bonus:0 "Chart the Adriatic Minefields Research"
 IT1_ww1_port_approaches:0 "Secure the Port Approaches"
 IT1_ww1_port_approaches_desc:0 "Our harbours need disciplined observation and traffic control as much as permanent defences. Local commands will rehearse patrol handovers and warning procedures around the principal naval bases."
 IT1_ww1_merchant_convoys:0 "Ships for the Merchant Marine"
 IT1_ww1_merchant_convoys_desc:0 "Fifteen commissioned merchant convoys will carry grain, raw materials and military stores. Their addition will give our commercial and supply routes the shipping they need."
 IT1_ww1_antisubmarine_sections:0 "Train the Escort Sections"
 IT1_ww1_antisubmarine_sections_desc:0 "Either merchant convoys or Otranto patrols require trained escorts. Common anti-submarine instruction will support the chosen maritime commitment."
 IT1_ww1_escort_depth_charge_bonus:0 "Anti-Submarine Escort Sections Research"
 IT1_ww1_macchi_patrol_aircraft:0 "Macchi Coastal Patrol Aircraft"
 IT1_ww1_macchi_patrol_aircraft_desc:0 "Naval aircraft can extend observation beyond shore stations and warn patrols of suspicious movements. Cooperation with the Macchi works and flying schools will develop the service routines needed for regular coastal reconnaissance."
 IT1_ww1_decisive_battle_policy:0 "A Mediterranean Battle Fleet"
 IT1_ww1_decisive_battle_policy_desc:0 "The navy will commit its capital-ship training and future construction to a Mediterranean battle fleet. This programme competes with the development of an Adriatic light-force strategy."
 IT1_ww1_revel_light_strategy:0 "Revels Adriatic Strategy"
 IT1_ww1_revel_light_strategy_desc:0 "Revel will favour cruisers, submarines and torpedo craft for limited Adriatic operations. Specialist light forces take priority over another expensive capital-ship programme."
 IT1_ww1_caracciolo_priority:0 "Prioritise the Caracciolo Programme"
 IT1_ww1_caracciolo_priority_desc:0 "The Caracciolo designs offer a stronger future battle squadron, but construction competes with the army and existing fleet for steel and skilled labour. Our alternative policy will maintain the technical programme and allocate further borrowed resources to its development."
 IT1_ww1_caracciolo_bonus:0 "Prioritise the Caracciolo Programme Research"
 IT1_ww1_mas_raid_schools:0 "Schools for the MAS Raids"
 IT1_ww1_mas_raid_schools_desc:0 "Coastal raids demand precise navigation, reconnaissance and an agreed route of withdrawal. Experienced MAS crews will turn those requirements into a training programme for selected flotillas, without assuming that audacity can replace preparation."
 IT1_ww1_sicilian_fleet_support:0 "Sicilian Support for the Battle Fleet"
 IT1_ww1_sicilian_fleet_support_desc:0 "An ambitious Mediterranean strategy requires maintenance farther south than the main northern arsenals. Additional productive capacity in Sicily will support repairs and construction while acknowledging the further cost of the chosen fleet policy."
 IT1_ww1_premuda_reconnaissance:0 "Prepare the Premuda Patrol Routes"
 IT1_ww1_premuda_reconnaissance_desc:0 "The island approaches require close reconnaissance and careful night navigation before a patrol can find an opportunity. Selected light-force crews will study routes and rendezvous points, preparing a limited operation without assuming its outcome."
 IT1_ww1_arsenal_repair_network:0 "Connect the Arsenal Repair Network"
 IT1_ww1_arsenal_repair_network_desc:0 "The naval arsenals will share inspection reports, spare parts and workshop schedules. A year of coordinated repair work will return damaged ships to service more quickly and reduce attrition."
 IT1_ww1_naval_repair_bonus:0 "Connect the Arsenal Repair Network Research"
 AUH_ww1_coal_steel_bonus:0 "Coal and Steel Committees Research"
 AUH_ww1_conversion_planning_bonus:0 "The War and Transition Commission Research"
 AUH_ww1_technical_colleges_bonus:0 "Technical College Partnerships Research"
 AUH_ww1_civil_statistics_bonus:0 "Price and Delivery Statistics Research"
 AUH_ww1_reserve_rifles_bonus:0 "The Army Bill of 1912 Research"
 AUH_ww1_operational_reports_bonus:0 "Defence in Depth Research"
 AUH_ww1_front_coordination_bonus:0 "Prepare the Caporetto Staff Plan Research"
 AUH_ww1_combined_staff_bonus:0 "A Common Operational Plan Research"
 AUH_ww1_bohemian_negotiations:0 "Bohemian Diets"
 AUH_ww1_bohemian_negotiations_desc:0 "Bohemian and Moravian delegates need elected institutions, language guarantees and an agreed share in common affairs."
 AUH_ww1_hungarian_negotiations:0 "The Hungarian Settlement"
 AUH_ww1_hungarian_negotiations_desc:0 "Budapest must agree to the new framework and protect Slovak institutions and minority rights."
 AUH_ww1_croatian_negotiations:0 "The Croatian Sabor"
 AUH_ww1_croatian_negotiations_desc:0 "The Sabor can negotiate a recognised South Slav partner with written safeguards for the Adriatic districts."
 AUH_ww1_galician_negotiations:0 "Galician and Ruthenian Delegations"
 AUH_ww1_galician_negotiations_desc:0 "Polish and Ruthenian representatives must agree on local institutions, shared services and minority protection."
 AUH_ww1_bosnian_negotiations:0 "A Bosnian Provincial Council"
 AUH_ww1_bosnian_negotiations_desc:0 "Bosnia requires representation for its communities and a defined place under the common institutions."
 AUH_ww1_slovenian_negotiations:0 "Slovenian Regional Representation"
 AUH_ww1_slovenian_negotiations_desc:0 "Slovenian local administration and language rights need a binding agreement with the crownlands."
 AUH_ww1_nationality_charter:0 "The Nationality Charter"
 AUH_ww1_nationality_charter_desc:0 "Protect worship, language and provincial institutions without drawing arbitrary frontiers. The charter is a binding administrative obligation."
 AUH_ww1_civilian_amnesty:0 "A Reviewed Imperial Amnesty"
 AUH_ww1_civilian_amnesty_desc:0 "Review political detention through civil oversight. A measured amnesty can restore trust without abolishing the courts."
 AUH_ww1_railway_federal_board:0 "The Common Railway Board"
 AUH_ww1_railway_federal_board_desc:0 "Crownland authorities must coordinate civilian deliveries and mobilisation schedules through a paid common transport service."
 AUH_ww1_constitutional_compromise:0 "Resolve the Disputed Drafts"
 AUH_ww1_constitutional_compromise_desc:0 "The commission has competing drafts on its table. We must establish a common procedure for voting, ministerial responsibility and regional consultation before committing the monarchy to a new constitution."
 AUH_ww1_renew_dualism:0 "Renew the Dual Monarchy"
 AUH_ww1_renew_dualism_desc:0 "Vienna and Budapest can renew the compromise without dissolving their separate governments. We will preserve the two parliaments and revise the common delegations, provided Hungary accepts the agreement."
 AUH_ww1_renew_dualism_institutions:0 "Separate Ministerial Responsibility"
 AUH_ww1_renew_dualism_institutions_desc:0 "The Austrian and Hungarian ministries will answer to their own parliaments while common affairs remain subject to joint scrutiny. Written responsibilities must replace disputes over which cabinet may issue an order."
 AUH_ww1_renew_dualism_services:0 "The Joint Delegations"
 AUH_ww1_renew_dualism_services_desc:0 "The two parliamentary delegations must exchange army estimates, railway timetables and replacement schedules. Joint liaison exercises will prepare the services for the renewed compromise."
 AUH_ww1_renew_dualism_ratification:0 "The Renewed Ausgleich"
 AUH_ww1_renew_dualism_ratification_desc:0 "The Hungarian representatives and the crown must now approve the renewed compromise. Ratification preserves the Dual Monarchy and establishes a common cabinet procedure without creating independent crownland states."
 AUH_ww1_renew_dualism_settlement_1:0 "Common Cabinet Procedure"
 AUH_ww1_renew_dualism_settlement_1_desc:0 "The cabinet will divide common responsibilities between Vienna and Budapest through a written procedure."
 AUH_ww1_renew_dualism_settlement_2:0 "Honved and Landwehr Liaison"
 AUH_ww1_renew_dualism_settlement_2_desc:0 "Honved, Landwehr and common-army staffs will hold joint liaison exercises and exchange railway plans."
 AUH_ww1_renew_dualism_settlement_3:0 "The Renewed Customs Agreement"
 AUH_ww1_renew_dualism_settlement_3_desc:0 "The renewed governments will use a common customs charter to support industry and internal commerce."
 AUH_ww1_common_executive:0 "A Common Executive"
 AUH_ww1_common_executive_desc:0 "Two competing cabinets cannot direct a common state indefinitely. We will propose a single imperial executive with a professional civil service and a uniform chain of authority, accepting the political costs of centralisation."
 AUH_ww1_common_executive_institutions:0 "Uniform Executive Appointments"
 AUH_ww1_common_executive_institutions_desc:0 "The common executive needs appointments based on administrative qualifications and a clear hierarchy of responsibility. Provincial offices will receive the same service regulations and reporting schedules."
 AUH_ww1_common_executive_services:0 "The Imperial Inspectorate"
 AUH_ww1_common_executive_services_desc:0 "An imperial inspectorate will supervise police reports, supply contracts and provincial administration. Its first assignment is to enforce common standards without surrendering control to the regional diets."
 AUH_ww1_common_executive_ratification:0 "An Imperial Executive"
 AUH_ww1_common_executive_ratification_desc:0 "A functioning government and secure control of the central provinces are essential before the executive can assume its new powers. Ratification concentrates authority in the common cabinet and ends the constitutional dispute."
 AUH_ww1_common_executive_settlement_1:0 "A Professional Civil Service"
 AUH_ww1_common_executive_settlement_1_desc:0 "Professional appointments will replace overlapping civil orders and improve local construction administration."
 AUH_ww1_common_executive_settlement_2:0 "The Inspectorate of Supply"
 AUH_ww1_common_executive_settlement_2_desc:0 "The supply inspectorate will organise depots and food deliveries under common ministerial supervision."
 AUH_ww1_common_executive_settlement_3:0 "Reaffirm the Common Army"
 AUH_ww1_common_executive_settlement_3_desc:0 "Common-army headquarters will reaffirm its command structure and reserve operational authority."
 AUH_ww1_three_crowns:0 "Three Partners under the Crown"
 AUH_ww1_three_crowns_desc:0 "The South Slav lands seek a recognised place beside Austria and Hungary. A third crown offers a dynastic settlement, but Croatian, Bosnian and Hungarian representatives must agree on its institutions and obligations."
 AUH_ww1_three_crowns_institutions:0 "Recognise the South Slav Diets"
 AUH_ww1_three_crowns_institutions_desc:0 "The Croatian and South Slav diets will receive defined legislative responsibilities under the dynasty. Their representation must be guaranteed before the new crown can claim legitimacy."
 AUH_ww1_three_crowns_services:0 "A Three-Part Military Service"
 AUH_ww1_three_crowns_services_desc:0 "Three crown governments need one system for reserve training and military replacements. Shared officer instructions and mobilisation schedules will prepare the army for the trialist settlement."
 AUH_ww1_three_crowns_ratification:0 "The Third Crown"
 AUH_ww1_three_crowns_ratification_desc:0 "Hungarian, Croatian and Bosnian consent must accompany secure control of the participating lands. Ratification creates a trialist monarchy under the dynasty and recognises the South Slav crown without releasing separate states."
 AUH_ww1_three_crowns_settlement_1:0 "The South Slav Public Works Board"
 AUH_ww1_three_crowns_settlement_1_desc:0 "The South Slav works board will establish civilian workshops in Croatia, where the crown retains control."
 AUH_ww1_three_crowns_settlement_2:0 "A Three-Part Officer College"
 AUH_ww1_three_crowns_settlement_2_desc:0 "The three political partners will share officer instruction at the common staff college."
 AUH_ww1_three_crowns_settlement_3:0 "The Trialist Customs Charter"
 AUH_ww1_three_crowns_settlement_3_desc:0 "A trialist commercial charter will retain an internal market across the three partners."
 AUH_ww1_united_federation:0 "The United Danubian Federation"
 AUH_ww1_united_federation_desc:0 "The monarchy can survive as a federation of represented nationalities. Elected regional institutions will share a federal chamber, common defence and a single internal market, while the Danubian state remains united."
 AUH_ww1_united_federation_institutions:0 "Elected Federal Representation"
 AUH_ww1_united_federation_institutions_desc:0 "Regional representation must rest on elections and written federal powers. A chamber representing the nationalities will oversee common legislation while provincial assemblies handle local affairs."
 AUH_ww1_united_federation_services:0 "Common Federal Services"
 AUH_ww1_united_federation_services_desc:0 "A federation requires civil servants who can operate across regional boundaries. Shared service standards and a common administrative school will prepare officials for their new duties."
 AUH_ww1_united_federation_ratification:0 "A Federal Constitution"
 AUH_ww1_united_federation_ratification_desc:0 "The regional delegations must consent to the constitution, and the government must retain the crownlands taking part. Ratification establishes the united federation; the army, market and international position remain common."
 AUH_ww1_united_federation_settlement_1:0 "The Federal Construction Board"
 AUH_ww1_united_federation_settlement_1_desc:0 "Federal construction contracts will expand civilian machine workshops in Moravia."
 AUH_ww1_united_federation_settlement_2:0 "Federal Officer Service"
 AUH_ww1_united_federation_settlement_2_desc:0 "A federal army will replace contested provincial command arrangements with common language and recruitment services."
 AUH_ww1_united_federation_settlement_3:0 "The Danubian Market Charter"
 AUH_ww1_united_federation_settlement_3_desc:0 "The federal chamber will adopt common industrial and commercial standards."
 AUH_ww1_autonomous_crowns:0 "Autonomous Crownland Governments"
 AUH_ww1_autonomous_crowns_desc:0 "The crownlands can receive their own governments while preserving a common defence convention and customs union. This confederate solution trades direct imperial control for cooperation among autonomous partners."
 AUH_ww1_autonomous_crowns_institutions:0 "Define Crownland Autonomy"
 AUH_ww1_autonomous_crowns_institutions_desc:0 "Each crownland government needs an agreed division of powers and a place in the common council. We will define its legislative responsibilities before transferring administration from the imperial ministries."
 AUH_ww1_autonomous_crowns_services:0 "The Common Defence Convention"
 AUH_ww1_autonomous_crowns_services_desc:0 "Separate governments must still provide compatible military organisation, railway access and replacement services. A common defence convention will establish those obligations before autonomy takes effect."
 AUH_ww1_autonomous_crowns_ratification:0 "A Crownland Confederation"
 AUH_ww1_autonomous_crowns_ratification_desc:0 "All participating delegations must agree, and their territories must remain under our control. Ratification creates autonomous crownland governments under the common crown, with shared defence and a continuing customs agreement."
 AUH_ww1_autonomous_crowns_settlement_1:0 "Crownland Reconstruction Contracts"
 AUH_ww1_autonomous_crowns_settlement_1_desc:0 "Pay for one civilian workshop in each autonomous member government; construction stays inside its controlled territory."
 AUH_ww1_autonomous_crowns_settlement_2:0 "Exchange Crownland Technical Standards"
 AUH_ww1_autonomous_crowns_settlement_2_desc:0 "Exchange the common state's current technology with its autonomous member governments."
 AUH_ww1_autonomous_crowns_settlement_3:0 "The Confederate Customs Agreement"
 AUH_ww1_autonomous_crowns_settlement_3_desc:0 "The crownland governments and common council will adopt the same customs and industrial standards."
 AUH_ww1_republican_convention:0 "A Republican Convention"
 AUH_ww1_republican_convention_desc:0 "A democratic Danubian republic offers an alternative to dynastic authority. A constituent assembly must obtain the regions' consent and keep their shared economy and defence intact through the transition."
 AUH_ww1_republican_convention_institutions:0 "An Elected Constituent Assembly"
 AUH_ww1_republican_convention_institutions_desc:0 "Representatives chosen by the public must draft the republican constitution in an open assembly. Parliamentary scrutiny will govern the process and prevent the common institutions from becoming the property of one party."
 AUH_ww1_republican_convention_services:0 "Civil Control of Common Services"
 AUH_ww1_republican_convention_services_desc:0 "The army and common ministries must answer to elected civilian authorities. Liaison training and parliamentary review will prepare the services for a constitutional transfer of power."
 AUH_ww1_republican_convention_ratification:0 "The Danubian Republic"
 AUH_ww1_republican_convention_ratification_desc:0 "The elected convention must secure the participating regions and their agreement before the monarchy can become a republic. Ratification transfers the common state to republican leadership and preserves its integrated territory."
 AUH_ww1_republican_convention_settlement_1:0 "Municipal Social Administration"
 AUH_ww1_republican_convention_settlement_1_desc:0 "The republican municipalities must provide housing, schooling and reliable food distribution. Reconstruction contracts will strengthen civilian industry and ease demands on households during the coming year."
 AUH_ww1_republican_convention_settlement_2:0 "The Republican Defence Charter"
 AUH_ww1_republican_convention_settlement_2_desc:0 "An elected government will give the common federal army a republican constitutional basis."
 AUH_ww1_republican_convention_settlement_3:0 "The Republican Reconstruction Board"
 AUH_ww1_republican_convention_settlement_3_desc:0 "Civilian engineering workshops in Vienna will support reconstruction under the republican government."
 AUH_ww1_negotiated_separation:0 "Negotiate an Orderly Separation"
 AUH_ww1_negotiated_separation_desc:0 "The common ministries no longer command the confidence of the crownlands. Separate national administrations may preserve peace, provided they remain bound to the Austrian crown."
 AUH_ww1_negotiated_separation_institutions:0 "Agree the National Boundaries"
 AUH_ww1_negotiated_separation_institutions_desc:0 "Regional representatives must agree which administration serves each territory. Existing provincial offices and legal guarantees will provide a framework for a peaceful division of the state."
 AUH_ww1_negotiated_separation_services:0 "Divide the Common Services"
 AUH_ww1_negotiated_separation_services_desc:0 "Archives, railway schedules and public services cannot be abandoned when governments separate. A transitional administrative commission will prepare their orderly division and keep essential work running."
 AUH_ww1_negotiated_separation_ratification:0 "Ratify the Crownland Charters"
 AUH_ww1_negotiated_separation_ratification_desc:0 "The diets have agreed to the division of the common administration. Bohemia, Hungary, Galicia-Lodomeria and Illyria will receive their own governments while remaining subjects of the Empire of Austria."
 AUH_ww1_negotiated_separation_settlement_1:0 "The Austrian Reconstruction Office"
 AUH_ww1_negotiated_separation_settlement_1_desc:0 "The Austrian remnant will establish civilian workshops around Linz."
 AUH_ww1_negotiated_separation_settlement_2:0 "An Austrian Defence Force"
 AUH_ww1_negotiated_separation_settlement_2_desc:0 "A territorial defence force will organise the Austrian heartland without claiming the separated crownlands."
 AUH_ww1_negotiated_separation_settlement_3:0 "Reopen Civilian Workshops"
 AUH_ww1_negotiated_separation_settlement_3_desc:0 "The remaining ministries will support civilian industrial research and improve food distribution."
 AUH_ww1_austrian_reconstruction_bonus:0 "Reopen Civilian Workshops Research"
 IT1_ww1_procurement_bonus:0 "Common Procurement Research"
 IT1_ww1_public_services_bonus:0 "Common Procurement Research"
 IT1_ww1_technical_purchasing_bonus:0 "Common Procurement Research"
 AUH_ww1_bohemian_schools_bonus:0 "Bohemian Technical Schools"
