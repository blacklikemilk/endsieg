 WHR_battle_of_the_chiefs: "Battle of the Chiefs"
 WHR_battle_of_the_chiefs_desc: "In the summer of 1918, the Southern Whites had two historical options. The first is Pyotr Krasnov, who is ready to ally with Ukraine and the new independent states from the former Russian Empire to fight the Bolsheviks. His priority is to attack Tsaritsyn and connect with the Eastern Whites before attacking Moscow with them.\n The second option was supported by Anton Denikin, who refuses to give up control of the Russian Empire territories. Denikin's priority is to free the Kuban and North- Caucasus before attacking Moscow from the South through the Ukraine."
