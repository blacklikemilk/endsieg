 TUR_political_effort:0 "The Second Constitutional Era"
 TUR_political_effort_desc:0 "The restored constitution has opened a struggle over the authority of ministers, deputies and the palace. Establish a programme that gives those institutions a dependable working relationship."
 TUR_diplomatic_effort:0 "The Ottoman Foreign Office"
 TUR_diplomatic_effort_desc:0 "We restore a disciplined foreign office before choosing a wartime alignment. Its clerks will separate useful liaison from promises that commit the empire to a war."
 TUR_industrial_effort:0 "An Imperial Workshop Programme"
 TUR_industrial_effort_desc:0 "The empire needs a practical programme linking workshops, transport and public contracts. Construction preparation comes before another list of competing promises."
