 IT1_industrial_path_4: "Heavy Industry Effort IV"
 IT1_industrial_path_4_desc: ""
 IT1_industrial_effort:0 "The Industrial Triangle"
 IT1_industrial_effort_desc:0 "Turin, Milan and Genoa form the industrial core of the kingdom. Investment must connect their workshops to transport, energy and the broader national economy."
 IT1_infrastructure_effort_1:0 "The Turin-Genoa Rail Corridor"
 IT1_infrastructure_effort_1_desc:0 "The port and factories around Genoa must connect securely to Turin. Improved regional transport will carry machinery, imported coal and military stores."
 IT1_infrastructure_effort_2:0 "Connect the Southern Provinces"
 IT1_infrastructure_effort_2_desc:0 "Transport improvements in Campania and Puglia will give the south better access to national markets and army supply contracts."
 IT1_infrastructure_effort_3:0 "The Adriatic Supply Corridor"
 IT1_infrastructure_effort_3_desc:0 "Puglia and Veneto serve important naval bases and army routes. Their transport links must carry military stores without consuming every civilian delivery."
 IT1_construction_effort_1:0 "Milan Machine Shops"
 IT1_construction_effort_1_desc:0 "New machine shops in Lombardy will provide tools and fittings to smaller firms. Their expansion gives civilian industry a broader foundation."
 IT1_construction_effort_2:0 "Turinese Vehicle Workshops"
 IT1_construction_effort_2_desc:0 "The workshops of Turin can produce engines and transport equipment. A civilian expansion will support national development without depending entirely on military orders."
 IT1_construction_effort_3:0 "Tuscan Engineering Cooperatives"
 IT1_construction_effort_3_desc:0 "A network of Tuscan workshops can supply precision parts and civilian tools. We will support a regional industrial complex beyond the northern triangle."
 IT1_armament_effort_1:0 "Ansaldo Procurement Contracts"
 IT1_armament_effort_1_desc:0 "Ansaldo can supply artillery and engineering equipment, but expanded production requires funded contracts. We will finance an additional armament hall in Piedmont."
 IT1_armament_effort_2:0 "Brescia Weapons Production"
 IT1_armament_effort_2_desc:0 "The armament firms around Brescia need machine tools, inspectors and labor. Additional production in Lombardy will ease the pressure on infantry procurement."
 IT1_armament_effort_3:0 "The National Ammunition Programme"
 IT1_armament_effort_3_desc:0 "A prolonged war demands reliable shell contracts and inspection. New workshops in Emilia-Romagna will broaden the ammunition supply at a fiscal cost."
 IT1_diplomatic_effort:0 "The Palazzo della Consulta"
 IT1_diplomatic_effort_desc:0 "The foreign ministry must reconcile the Triple Alliance, British sea power and Italian claims. Consultation will give our embassies a common negotiating position."
 IT1_airfield_construction_1:0 "Rome Flying-School Facilities"
 IT1_airfield_construction_1_desc:0 "Prepared fields near Rome will support elementary flying and the acceptance of training aircraft. Additional facilities will provide a more dependable base for the instructors and mechanics on whom the service expansion depends."
 IT1_airfield_construction_2:0 "Piedmont Aircraft Trial Fields"
 IT1_airfield_construction_2_desc:0 "The workshops and technical staff of Piedmont need nearby fields for testing and dispatch. Enlarged aviation facilities will connect acceptance flights, repairs and training without drawing every new aircraft immediately into front-line service."
 IT1_airfield_construction_3:0 "Lombardy Aviation Workshops"
 IT1_airfield_construction_3_desc:0 "The northern aviation industry depends on fields able to support maintenance and delivery flights. Improved facilities in Lombardy will help the technical service inspect aircraft and return repaired machines to their squadrons."
 IT1_airfield_construction_4:0 "Veneto Squadron Stations"
 IT1_airfield_construction_4_desc:0 "Squadrons serving the northern front need suitable landing grounds close to their assigned sectors. Additional Veneto facilities will support maintenance, dispersal and the coordination of reconnaissance with nearby army headquarters."
