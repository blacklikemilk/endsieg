    GER_ussr_war_goal: "Operation Barbarossa"
    GER_danzig_or_war: "Fall Weiss"
    GER_war_with_france: "Fall Rot"
    GER_around_maginot: "Fall Gelb"
    GER_fall_of_france: "Fall Of France"
    GER_fall_of_france_desc: "We have succeeded in conquering France!"
    GER_fall_of_uk: "Fall Of The United Kingdom"
    GER_fall_of_uk_desc: "We have succeeded in conquering the United Kingdom!"
    GER_fall_of_soviet_union: "Fall Of The Soviet Union"
    GER_fall_of_soviet_union_desc: "We have succeeded in conquering the Soviet Union!"
    GER_operation_seelowe: "Operation Seelöwe"
    GER_operation_seelowe_desc: "Operation Seelöwe, or Operation Sealion was the codename for the invasion of Britain. Following the Fall of France, we had hoped the English would seek an armistice, but seeing as they declined we will have to resort to more definitive measures. To dare this operation, we would need an immense amount of vessels and air support."
    GER_fall_grun: "Fall Grün"
    GER_fall_grun_desc: "Fall Grün, or Case Green, was a full-scale operations plan for the invasion of Ireland in support of Operation Sea Lion. It was mostly a divisionary plan, but we could of course put the plan to actual action."
    GER_operation_wacht_am_rhein: "Operation Wacht Am Rhein"
    GER_operation_wacht_am_rhein_desc: "Also known as the Battle of the Bulge, this is our final chance to pull off an incredible victory against the Allies. We can recreate our initial victory against the French through the Ardennes, and they should have no time to respond. We should be able to encircle huge amounts of divisions, which will free up our men to defend in the east."
    GER_operation_nordwind: "Operation Nordwind"
    GER_operation_nordwind_desc: "In order to support Operation Wacht Am Rhein, we must provide support the attack through the Ardennes and break through the American lines. If this were to succeed, we should be able to destroy the entire army stationed there."
    GER_operation_typhoon: "Operation Typhoon"
    GER_operation_typhoon_desc: "Our plans to attack the Soviet capital can finally be put to use. Our attack will consist of two pincer offensives, one from the north of Moscow against the Kalinin Front, and the other to the south of Moscow Oblast against the Western Front. This operation will have a huge part in determining the outcome of this war."
    GER_operation_isabella: "Operation Isabella"
    GER_operation_isabella_desc: "Operation Isabella was a plan to continue pressuring the United Kingdom, after the fall of the Soviet Union. The plan called for an invasion through Spain, and we will have to see whether this invasion will go peacefully, or if they will resist us. It would also provide us better protection in the Mediterranean, by capturing Gibraltar."
    GER_fall_anton: "Fall Anton"
    GER_fall_anton_desc: "With the attack of the Allies on the Vichy Regime, it is time to act to protect our interests."
    GER_operation_citadel: "Operation Citadel"
    GER_operation_citadel_desc: "We've lost the battle for the oil fields and the Caucuses, however the war is not lost. We still control large portions of the Soviet union, enough to fight a staggered retreat across the front to wear down the Soviets, but before we can begin defensive operations we must make one more offensive to stabalize the frontline."
    GER_fall_blau: "Fall Blau"
    GER_fall_blau_desc: "We failed to capture our objectives of the last year, however we have not yet lost the innitiative on the Eastern front. The majority of the Soviet forces are situated in and around Moscow and along our central front. We have the option to strike south and capture the vital baku oil fields, along with the City of Stalins name, which would be a striking blow to the Bolsheviks."

