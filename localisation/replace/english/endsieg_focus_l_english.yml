 TUR_submarine_theory_desc:0 "Study submarine equipment and maintenance requirements before committing to a large flotilla. The programme opens a small technical route alongside the surface service."
 TUR_BB_effort:0 "Battlefleet Budget"
 TUR_BB_effort_desc:0 "Budget officers compare fuel, shells, crews, and dock time before approving capital-ship operations. The navy grows by sustainable readiness rather than free hulls."
