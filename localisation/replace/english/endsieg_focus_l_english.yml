 IT1_homefront: "Homefront Focus I"
 IT1_homefront_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_homefront_2: "Homefront Focus II"
 IT1_homefront_2_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_homefront_3: "Homefront Focus III"
 IT1_homefront_3_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_shorter_training: "Shorter Training"
 IT1_shorter_training_desc: "With the war dragging on and taking more and more lives we need more men to refill the casualties so shortening training would help with that."
 IT1_war_front: "Frontline Focus I"
 IT1_war_front_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_war_front_2: "Frontline Focus II"
 IT1_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_war_front_3: "Frontline Focus III"
 IT1_war_front_3_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_army_effort:0 "The Regio Esercito"
 IT1_army_effort_desc:0 "The Royal Army draws recruits from every region of a still young kingdom. Its training, reserve system and supply arrangements must make those men a dependable field army before a European crisis puts mobilization to the test."
 IT1_trench_warfare:0 "Engineer the Field Positions"
 IT1_trench_warfare_desc:0 "Rocky slopes and exposed valleys punish hastily dug positions. Army engineers will standardize drainage, covered communications and protected shelters so that divisions can hold ground through bombardment and bad weather."
 IT1_gas_mask_1:0 "Issue Protective Respirators"
 IT1_gas_mask_1_desc:0 "Chemical warfare makes reliable protective equipment an urgent requirement. Medical officers will supervise fitting and inspection while regimental instructors teach the alarms and procedures needed to use it."
 IT1_gas_mask_2:0 "Regimental Gas-Defence Schools"
 IT1_gas_mask_2_desc:0 "A respirator is useful only when a soldier recognizes the danger in time. Specialist instructors will rehearse gas alarms, filter changes and the evacuation of casualties under the conditions found at the front."
 IT1_gas_mask_3:0 "Inspect the Filter Reserves"
 IT1_gas_mask_3_desc:0 "Long service damages masks and exhausts filters. A regular inspection system will maintain replacement stocks and prevent worn equipment from leaving veteran units exposed during another campaigning season."
 IT1_equipment_effort_1:0 "The Carcano Rifle System"
 IT1_equipment_effort_1_desc:0 "The Carcano rifle is familiar to our infantry and armourers. Consistent inspection, ammunition standards and repair tools will make the existing system easier to support as reserve formations expand."
 IT1_equipment_effort_2:0 "Fiat-Revelli Machine-Gun Teams"
 IT1_equipment_effort_2_desc:0 "The Fiat-Revelli gun demands trained crews and careful maintenance. Regimental machine-gun sections will practice ammunition supply, transport and interlocking fire before the weapon is asked to support an advance."
 IT1_equipment_effort_3:0 "Villar Perosa Field Trials"
 IT1_equipment_effort_3_desc:0 "The Villar Perosa offers a high volume of close-range fire, but its tactical role requires practical trials. Infantry instructors will evaluate portable mountings and suitable employment without treating it as a substitute for every heavier gun."
 IT1_equipment_effort_4:0 "Carbines and Assault Equipment"
 IT1_equipment_effort_4_desc:0 "Assault sections need compact carbines, grenades and reliable field repairs. Procurement officers will adapt existing arms and compare new designs, directing orders toward equipment which small teams can carry through broken positions."
 IT1_artillery_effort_1:0 "Cannone da 75 Contracts"
 IT1_artillery_effort_1_desc:0 "Modern field guns need dependable ammunition as much as dependable barrels. Coordinated contracts for the 75 mm batteries will improve maintenance and supply while the army prepares a larger mobilized artillery establishment."
 IT1_artillery_effort_2:0 "The Heavy Howitzer Parks"
 IT1_artillery_effort_2_desc:0 "Fortified ridges and protected trenches require high-angle fire beyond the reach of ordinary field pieces. The army will organize heavy howitzer parks with the transport, survey teams and ammunition columns needed to bring their fire to the right sector."
 IT1_artillery_effort_3:0 "Bombarde for the Wire"
 IT1_artillery_effort_3_desc:0 "Short-range bombarde can open obstacles which shelter enemy infantry from direct fire. Specialized crews will learn to concentrate their bombardment and move the weapons forward without abandoning their ammunition supply."
 IT1_artillery_effort_4:0 "Surveyed Battery Fire"
 IT1_artillery_effort_4_desc:0 "Accurate survey work allows batteries to join a fire plan without revealing every position through repeated ranging. Observation teams and artillery schools will establish common target reporting and fire tables for the whole front."
 IT1_tactics_1:0 "Staff Rides Along the Frontier"
 IT1_tactics_1_desc:0 "Maps do not show every obstruction to a marching column or supply train. Staff rides will test mobilization assumptions against the roads, valleys and railheads which an army must actually use."
 IT1_tactics_2:0 "Learn from the Libyan Campaign"
 IT1_tactics_2_desc:0 "The Libyan fighting exposes the distance between a landing plan and sustained operations inland. Staff officers will collect lessons on reconnaissance, communications and supply, applying them to future expeditions without assuming the same enemy or terrain."
 IT1_tactics_3:0 "Combined Arms on Broken Ground"
 IT1_tactics_3_desc:0 "Infantry, engineers and artillery must prepare one plan rather than arrive at separate timetables. Battalion exercises will practice liaison and limited objectives on terrain which denies commanders an easy view of the whole battle."
 IT1_tactics_4:0 "An Army Lessons Bureau"
 IT1_tactics_4_desc:0 "Experience disappears when casualties and transfers scatter the officers who earned it. A permanent lessons bureau will turn reports from the front into practical instructions for schools, replacement drafts and serving formations."
 IT1_form_airforce:0 "The Military Air Service"
 IT1_form_airforce_desc:0 "Our military balloon detachments and early flying experiments need a permanent foundation. The air service will connect pilots, observers and mechanics to the the information requirements of the army as powered aircraft enter military use."
 IT1_bomber_focus:0 "Bombs from Observation Aircraft"
 IT1_bomber_focus_desc:0 "Aircraft can strike small targets beyond the reach of a patrol, but improvised bomb loads create practical hazards. Controlled trials will develop release procedures and mounts while observation remains the the principal task of the crews."
 IT1_fighter_focus:0 "Create the Fighter Squadrons"
 IT1_fighter_focus_desc:0 "Observation aircraft need protection against increasingly capable enemy patrols. Dedicated fighter squadrons will develop interception and escort methods while the technical service evaluates suitable weapons and airframes."
 IT1_fighter_1:0 "Macchi-Nieuport Licence Production"
 IT1_fighter_1_desc:0 "Licensed Nieuport production gives the Macchi works a tested fighter design. Common acceptance procedures will connect factory output to the needs of squadron mechanics, reducing delays caused by unsuitable fittings or inconsistent parts."
 IT1_fighter_2:0 "SPAD Service and Maintenance"
 IT1_fighter_2_desc:0 "The SPAD brings new demands on engines, handling and field repair. Training and workshop preparation will allow fighter units to exploit its capabilities without leaving serviceable aircraft grounded for lack of familiar mechanics."
 IT1_fighter_3:0 "Develop the Ansaldo SVA"
 IT1_fighter_3_desc:0 "The fast Ansaldo SVA offers particular promise for reconnaissance over long routes. Service trials will assess visibility, navigation and handling under operational loads, allowing the air service to develop its role from practical results."
 IT1_aviation_effort_1:0 "Lessons from the Libyan Air Detachment"
 IT1_aviation_effort_1_desc:0 "The first wartime air detachments demonstrate both the promise and limitations of aircraft. Their reports will guide reconnaissance procedures, field maintenance and the communication of observations to commanders on the ground."
 IT1_pilot_training_1:0 "The Italian Military Flying Schools"
 IT1_pilot_training_1_desc:0 "Elementary flying instruction must provide a safe and common foundation for new pilots. A coordinated school programme will connect navigation, aircraft handling and mechanic training before crews are sent to operational units."
 IT1_aviation_effort_2:0 "Organise the Corpo Aeronautico"
 IT1_aviation_effort_2_desc:0 "A permanent aviation corps will give the growing service clear establishments and technical responsibilities. Headquarters must distinguish shortages of aircraft from shortages of engines, mechanics or trained crews before allocating its orders."
 IT1_pilot_training_2:0 "Combat Instruction at the Rear Schools"
 IT1_pilot_training_2_desc:0 "Experienced pilots can teach lessons which elementary training cannot reproduce. Rear schools will develop formation discipline, gunnery and evasive flying, passing practical knowledge to crews before their first front-line mission."
 IT1_tactical_bomber_1:0 "Caproni Trimotor Contracts"
 IT1_tactical_bomber_1_desc:0 "The Caproni trimotor offers a practical foundation for a dedicated bombing force. Acceptance tests will examine engine reliability, load handling and crew coordination before expanding orders place further demands on the aircraft workshops."
 IT1_tactical_bomber_2:0 "The Caproni Ca.3 Squadrons"
 IT1_tactical_bomber_2_desc:0 "The latest Caproni machines need trained crews and a dependable ground organization. Technical officers will refine their fittings and service routines while the squadrons develop formation bombing and mutual support."
 IT1_tactical_bomber_3:0 "Standardise the Caproni Bombing Force"
 IT1_tactical_bomber_3_desc:0 "A larger bombing establishment cannot depend on individual workshop improvisation. Common acceptance standards and spare-part records will help the Caproni squadrons sustain their missions as crews and aircraft wear out."
 IT1_strategic_bomber_research: "Strategic Bomber Research"
 IT1_strategic_bomber_research_desc: ""
 IT1_strat_bomber_1:0 "Heavy Bomber Crew Trials"
 IT1_strat_bomber_1_desc:0 "Large aircraft require crews able to coordinate engines, navigation, defensive fire and bomb release. An experimental training detachment will develop those procedures before headquarters expands the heavy-bomber programme."
 IT1_improved_tac_1:0 "Caproni Bomb Sights and Loading"
 IT1_improved_tac_1_desc:0 "Bombing crews need consistent sights, racks and loading instructions. Technical officers will compare field results with test flights, improving release accuracy and reducing the maintenance burden imposed by improvised fittings."
 IT1_improved_tac_2:0 "The Night Navigation Courses"
 IT1_improved_tac_2_desc:0 "Night missions demand preparation beyond ordinary daylight flying. Dedicated courses will practice navigation, rendezvous and safe landing procedures, giving the bombing force a more reliable method for operating over long routes."
 IT1_improved_fighter_1:0 "Synchronised Armament Workshops"
 IT1_improved_fighter_1_desc:0 "Reliable gun synchronization requires exact workshop practice and careful inspection. Specialist armament teams will standardize adjustment and testing across the licensed and domestic fighters entering Italian service."
 IT1_improved_fighter_2:0 "Ansaldo Fighter Acceptance Trials"
 IT1_improved_fighter_2_desc:0 "Domestic fighter proposals must prove themselves under squadron conditions. Acceptance teams will compare armament, cooling and handling, identifying useful improvements without promising formations a machine before it is ready."
 IT1_cas_research:0 "Infantry Contact Flights"
 IT1_cas_research_desc:0 "The army needs prompt information on the progress of its own troops as well as distant reconnaissance. Contact flights will rehearse signals, message delivery and the identification of forward positions in confused fighting."
 IT1_cas_2:0 "Battlefield Support Experiments"
 IT1_cas_2_desc:0 "Flying low over the battlefield brings aircraft within range of ground weapons. Limited trials will test small bomb loads and attack routes while commanders establish realistic objectives for supporting infantry in close combat."
 IT1_anglo_german: "Anglo-German Naval Race"
 IT1_anglo_german_desc: ""
 IT1_tirpitz_expands_fleet: "Tirpitz Expansion"
 IT1_tirpitz_expands_fleet_desc: ""
 IT1_kaiser_expands_fleet: "Kaiser Expansion"
 IT1_kaiser_expands_fleet_desc: ""
 IT1_submarine_theory:0 "The Laurenti Submarine Designs"
 IT1_submarine_theory_desc:0 "Italian submarine development offers ways to challenge enemy traffic without matching every surface squadron. Trials will examine endurance, machinery reliability and safe operation before the navy expands orders for these specialized vessels."
 IT1_submarine_effort:0 "The F-Class Submarine Service"
 IT1_submarine_effort_desc:0 "The next submarine series needs crews and workshops prepared for sustained operations. A common technical programme will connect design improvements to patrol experience and the maintenance demands of the submarine flotillas."
 IT1_naval_effort:0 "The Regia Marina"
 IT1_naval_effort_desc:0 "The Royal Navy guards a long coastline and the sea routes on which Italy depends. Training and command arrangements must turn its varied squadrons into a fleet able to protect trade and respond to a Mediterranean crisis."
 IT1_dreadnought:0 "The Dante Alighieri Programme"
 IT1_dreadnought_desc:0 "Dante Alighieri marks our entry into the dreadnought era. The fleet technical service will consolidate experience with a uniform heavy battery, machinery and hull arrangements before larger orders consume still more of the naval budget."
 IT1_better_weaponry:0 "Naval Gunnery and Fire Control"
 IT1_better_weaponry_desc:0 "A heavy battery is effective only when range finding, ammunition handling and fire orders work together. Gunnery schools and technical workshops will refine common procedures for the modern ships entering service."
 IT1_BB_effort:0 "The Cavour and Duilio Squadrons"
 IT1_BB_effort_desc:0 "The Cavour and Duilio classes commit large sums and skilled labour to our battle fleet. Technical officers will compare their service experience, refining heavy-hull arrangements while headquarters reckon with the costs of keeping capital ships ready."
 IT1_cruiser_effort:0 "Esploratori for the Fleet"
 IT1_cruiser_effort_desc:0 "Fast scouts give the battle fleet information and a force suited to limited operations. Cruiser development will emphasize reliable machinery, scouting endurance and the coordination needed to return with useful reports."
 IT1_unrestricted_sub: "Unrestricted Submarine Warfare"
 IT1_unrestricted_sub_desc: ""
 IT1_destroyer_effort:0 "Indomito and Pilo Destroyers"
 IT1_destroyer_effort_desc:0 "Destroyers must combine reconnaissance, escort and torpedo attack in crowded coastal waters. Development work will emphasize dependable engines and coordinated flotilla tactics for the Indomito and Pilo generation of light forces."
 IT1_battle_cruiser_effort:0 "Fast Squadron Exercises"
 IT1_battle_cruiser_effort_desc:0 "Speed is useful only when squadrons can concentrate and withdraw in good order. Cruiser and destroyer commanders will practice rendezvous, mutual support and screened approaches before the fleet commits them to a hazardous operation."
 IT1_european_diplomacy:0 "The European Balance"
 IT1_european_diplomacy_desc:0 "Italy cannot treat continental and maritime security as separate questions. Our diplomats will examine the terms offered by competing great powers."
 IT1_imperial_ambitions:0 "The Ministry of Colonial Affairs"
 IT1_imperial_ambitions_desc:0 "Libya, Eritrea and Somalia confront the kingdom with different needs. Colonial policy must be supported by shipping, civil administration and a budget."
 IT1_dockyard_1:0 "The Genoa Shipbuilding Contracts"
 IT1_dockyard_1_desc:0 "The yards around Genoa combine skilled labour with an established marine engineering industry. Additional naval contracts will expand useful construction capacity while technical officers enforce the standards required by the fleet."
 IT1_dockyard_2:0 "Modernise the La Spezia Arsenal"
 IT1_dockyard_2_desc:0 "La Spezia is central to naval construction and maintenance. Investment in its arsenal workshops will support major repairs and improve the capacity available for ships already committed to the naval programme."
 IT1_dockyard_3:0 "Castellammare Naval Workshops"
 IT1_dockyard_3_desc:0 "The yards near Naples bring valuable construction and repair experience to the fleet. Enlarged workshop capacity will spread naval orders across the kingdom and shorten the maintenance burden carried by the northern arsenals."
 IT1_dockyard_4:0 "The Taranto Arsenal"
 IT1_dockyard_4_desc:0 "Taranto offers a major base close to the lower Adriatic and the central Mediterranean. Expanded arsenal capacity will help sustain the fleet and its light forces without requiring every repair to be undertaken on the northern coast."
 IT1_claims_libya:0 "The Libyan Question"
 IT1_claims_libya_desc:0 "Italy claims a sphere of influence across Tripolitania and Cyrenaica. Formal claims strengthen a diplomatic demand but do not transfer Ottoman territory."
 IT1_italo_turkish_war:0 "The Italo-Turkish Expedition"
 IT1_italo_turkish_war_desc:0 "The government will commit to a limited Libyan expedition. A declaration of war opens the campaign; occupation and a negotiated treaty must settle its outcome."
 IT1_supress_senussi:0 "The Senussi Security Campaign"
 IT1_supress_senussi_desc:0 "The government can attempt to suppress armed resistance through a funded security programme. This does not annex an independent Senussi state or erase local opposition by decree."
 IT1_establish_italian_presence:0 "Administer the Libyan Coast"
 IT1_establish_italian_presence_desc:0 "The treaty leaves Italy responsible for governing its coastal holdings. Civil staff and local services must replace an administration based only on military occupation."
 IT1_prepare_for_war:0 "Approve Military Preparations"
 IT1_prepare_for_war_desc:0 "Diplomacy needs a credible military foundation. Mobilization planning will coordinate transport and procurement without producing an army from nothing."
 IT1_support_germany:0 "Talks with Berlin"
 IT1_support_germany_desc:0 "The German alliance remains a possible foundation for our security. Diplomatic contacts will test its value without committing Italy to war."
 IT1_claim_france:0 "The French Irredentist Programme"
 IT1_claim_france_desc:0 "A Central Powers Italy can claim Corsica, Savoy and the French Alpine frontier. Claims strengthen a war aim; they do not establish cores or transfer foreign land."
 IT1_demand_tyrol:0 "Negotiate the Trentino Compensation"
 IT1_demand_tyrol_desc:0 "Territorial compensation may make continued cooperation with Vienna acceptable. The Austrian government must consent and actually own the provinces concerned."
 IT1_honor_alliance:0 "Negotiate the Triple Alliance Commitment"
 IT1_honor_alliance_desc:0 "Berlin must reply to an Italian offer of cooperation. An accepted agreement brings actual faction membership, while refusal leaves other diplomatic options open."
 IT1_honor_alliance_2:0 "Execute the Alliance War Pledge"
 IT1_honor_alliance_2_desc:0 "After Berlin accepts our membership, the government can enter Germany's existing wars against France and Imperial Russia. This is a military commitment, not another invitation."
 IT1_neutral_stance:0 "The Defensive Alliance Argument"
 IT1_neutral_stance_desc:0 "The Triple Alliance does not oblige Italy to join every offensive war. A neutral stance allows consultation while the government examines its choices."
 IT1_deal_with_france:0 "Negotiate the Treaty of London"
 IT1_deal_with_france_desc:0 "Territorial promises and access to supplies can bring Italy closer to the Entente. France must accept the offer before Italy can make its military commitment."
 IT1_join_war:0 "Enter the War against Austria-Hungary"
 IT1_join_war_desc:0 "An accepted Entente agreement permits Italy to enter the war on the Austrian frontier. Existing neutrality pledges and a Central Powers commitment block this choice."
 IT1_entente_diplomacy:0 "Permanent Entente Liaison"
 IT1_entente_diplomacy_desc:0 "The ministries must organize contact with allies once Italy has entered their faction. Liaison will support paid supply requests and common operational planning."
 IT1_request_allied_support:0 "Request Allied Equipment Support"
 IT1_request_allied_support_desc:0 "A request to France asks for equipment from an actual stockpile. The donor may decline; acceptance carries a real material cost instead of spawning duplicate divisions."

 # German Empire Hocus Pocus

 GE1_diplomatic_effort: "Diplomatic Effort"
 GE1_diplomatic_effort_desc: "Germany opens a deliberate diplomatic programme that protects its continental position and creates room for later choices."
 GE1_imperial_agenda: "Imperial Agenda"
 GE1_imperial_agenda_desc: "The imperial government aligns colonial, commercial and European priorities before the crisis hardens into war."
 GE1_mittelafrika_plan: "Mittelafrika Plan"
 GE1_mittelafrika_plan_desc: "Berlin advances its established Mittelafrika programme while preserving the custom claims and later colonial outcomes."
 GE1_reinforce_colonies: "Reinforce the Colonies"
 GE1_reinforce_colonies_desc: "Colonial garrisons receive the staff, supplies and fortification plans needed to resist an Entente campaign."
 GE1_colonial_logistics: "Colonial Logistics"
 GE1_colonial_logistics_desc: "A practical supply network links German colonial ports and keeps isolated formations supported for longer."
 GE1_colonial_defense: "Colonial Defense"
 GE1_colonial_defense_desc: "German authorities organize the colonies for defense and coordinate local forces with the imperial command."
 GE1_colonial_defense_2: "Colonial Defense in Depth"
 GE1_colonial_defense_2_desc: "The colonial defense system gains depth through reserve positions, signals and prepared fallback routes."
 GE1_alternative_diplomacy: "Alternative Diplomacy"
 GE1_alternative_diplomacy_desc: "Germany tests agreements that can delay enemies, preserve neutrality or open another route to strategic resources."
 GE1_silesia_to_austria: "Offer Silesia for Italian Neutrality"
 GE1_silesia_to_austria_desc: "Berlin uses a costly territorial bargain to seek Italian neutrality while keeping the Central Powers together."
 GE1_offer_bessarabia: "Offer Bessarabia for Romanian Neutrality"
 GE1_offer_bessarabia_desc: "Germany offers a post-Russian settlement that gives Romania a reason to remain outside the war."
 GE1_negotiate_sweden: "Negotiate with Sweden"
 GE1_negotiate_sweden_desc: "Diplomats explore Swedish interests and seek a northern counterweight to Russia without assuming Swedish compliance."
 GE1_invite_sweden: "Invite Sweden to the Central Powers"
 GE1_invite_sweden_desc: "Sweden enters the Central Powers only after its own terms are secured and the diplomatic opening remains credible."
 GE1_befriend_afgahnistan: "Approach Afghanistan"
 GE1_befriend_afgahnistan_desc: "German envoys cultivate Afghanistan as a distant partner against British India and Russian influence."
 GE1_negotiate_afgahnistan: "Negotiate with Afghanistan"
 GE1_negotiate_afgahnistan_desc: "Berlin turns its Afghan contacts into a concrete offer of support, territory and coordinated pressure."
 GE1_huerta_power: "Restore Huerta"
 GE1_huerta_power_desc: "German agents work with Victoriano Huerta to create a Mexican option if the United States enters the conflict."
 GE1_agadir_crisis:0 "The Agadir Crisis"
 GE1_agadir_crisis_desc:0 "Germany answers the Moroccan crisis with a calculated diplomatic move, testing whether pressure can win recognition without turning the colonial dispute into a general war."
 GE1_prepare_for_war:0 "Prepare for War"
 GE1_prepare_for_war_desc:0 "Berlin prepares the diplomatic and military instruments required for a continental emergency while leaving the final decision about war to the actors and events that follow."
 GE1_central_powers_coordination:0 "Central Powers Coordination"
 GE1_central_powers_coordination_desc:0 "German officials align planning with Austria-Hungary and other willing partners, retaining the existing Central Powers relationship without forcing new members into it."
 GE1_rupprecht_plan:0 "The Rupprecht Plan"
 GE1_rupprecht_plan_desc:0 "The army considers a western operation shaped around the Rupprecht proposal. A later alliance preserving Belgium makes this plan unavailable."
 GE1_schlieffen_plan:0 "The Schlieffen Plan"
 GE1_schlieffen_plan_desc:0 "The General Staff prepares the Schlieffen concept for a rapid western decision. A formal Belgian neutrality pledge blocks the plan from being selected."
 GE1_kronprinz_plan:0 "The Kronprinz Plan"
 GE1_kronprinz_plan_desc:0 "Germany selects a continental programme built around France and Russia rather than a Belgian violation, giving the Anglo-German route its compatible military plan."
 GE1_goeben_breslau:0 "Goeben and Breslau"
 GE1_goeben_breslau_desc:0 "The Mediterranean squadron receives its orders as the crisis becomes a general European war, preserving the existing naval escape and Ottoman chain."
 GE1_asien_corps: "Asian Corps"
 GE1_asien_corps_desc: "German specialists support Ottoman communications, roads and medical services across the Middle Eastern fronts."
 GE1_advisors_turkey: "Advisors to the Ottoman Army"
 GE1_advisors_turkey_desc: "German officers advise Ottoman commands and translate imperial operational experience into usable local plans."
 GE1_albania_negotiations: "Negotiate with Albania"
 GE1_albania_negotiations_desc: "Berlin tries to turn Prince Wilhelm's connection to Albania into a limited Balkan opening."
 GE1_boer_revolt: "Support the Boer Revolt"
 GE1_boer_revolt_desc: "German support gives Boer insurgents money, arms and political encouragement against British control."
 GE1_befriend_bulgaria: "Befriend Bulgaria"
 GE1_befriend_bulgaria_desc: "Germany makes Bulgaria a serious partner whose position can decide the Balkan balance."
 GE1_invite_bulgaria: "Invite Bulgaria to the Central Powers"
 GE1_invite_bulgaria_desc: "Bulgaria joins the Central Powers when the military timetable and territorial promises make the risk acceptable."
 GE1_septemberprogramme:0 "The September Programme"
 GE1_septemberprogramme_desc:0 "German war aims are written into a programme for the western and eastern settlements, providing the existing foundation for later Polish and eastern decisions."
 GE1_polish_puppet:0 "A Polish Regency"
 GE1_polish_puppet_desc:0 "With the required territory and eastern conditions present, Germany establishes the existing Polish regency path rather than inventing a new transfer or annexation."
 GE1_polish_volunteers:0 "Polish Volunteers"
 GE1_polish_volunteers_desc:0 "The Polish administration recruits volunteers through the established event chain, linking local participation to Germany's continuing eastern policy."
 GE1_send_lenin:0 "Send Lenin East"
 GE1_send_lenin_desc:0 "Germany uses the existing revolutionary transit decision after the Russian crisis opens a route, leaving the later eastern peace chain authoritative."
 GE1_grain_ukraine: "Secure Ukrainian Grain"
 GE1_grain_ukraine_desc: "German authorities secure Ukrainian grain and maintain the custom ration supply link when Ukraine exists."
 GE1_zimmerman:0 "The Zimmermann Telegram"
 GE1_zimmerman_desc:0 "Berlin transmits the existing proposal to Mexico while unrestricted submarine warfare and American diplomacy remain active, preserving the established event outcome."
 GE1_befriend_turkey:0 "Befriend Turkey"
 GE1_befriend_turkey_desc:0 "Berlin cultivates Constantinople through practical commercial and military contacts, leaving the Ottoman government free to decide how far cooperation should proceed."
 GE1_ottoman_german_alliance:0 "The Ottoman-German Alliance"
 GE1_ottoman_german_alliance_desc:0 "Germany completes the existing Ottoman alliance process through a formal decision in Constantinople, preserving its established event and war-entry consequences."
 GE1_berlin_baghdad_1: "Berlin-Baghdad Railway I"
 GE1_berlin_baghdad_1_desc: "The first railway works connect German capital and Ottoman transport planning."
 GE1_berlin_baghdad_2: "Berlin-Baghdad Railway II"
 GE1_berlin_baghdad_2_desc: "The railway programme extends the supply corridor and gives Ottoman commands better access to German material."
 GE1_berlin_baghdad_3: "Berlin-Baghdad Railway III"
 GE1_berlin_baghdad_3_desc: "The corridor reaches deeper into the Middle East as wartime priorities compete for its limited capacity."
 GE1_berlin_baghdad_4: "Berlin-Baghdad Railway IV"
 GE1_berlin_baghdad_4_desc: "The final railway stage turns the Berlin-Baghdad project into a durable strategic link."
 GE1_befriend_jabal_shammar: "Support Jabal Shammar"
 GE1_befriend_jabal_shammar_desc: "German diplomacy supports Jabal Shammar as a local counterweight to British influence in Arabia."
 GE1_invite_jabal_shammar: "Invite Jabal Shammar"
 GE1_invite_jabal_shammar_desc: "Jabal Shammar receives a formal invitation to cooperate with the Central Powers and the Ottoman war effort."
 GE1_supply_dervish_state: "Supply the Dervish State"
 GE1_supply_dervish_state_desc: "Germany supplies the Dervish State so British forces must divide attention across another frontier."
 GE1_befriend_dervish: "Build Dervish Cooperation"
 GE1_befriend_dervish_desc: "Berlin converts shared opposition to Britain into a more reliable relationship with the Dervish leadership."
 GE1_invite_dervish: "Invite the Dervish State"
 GE1_invite_dervish_desc: "The Dervish State joins the Central Powers network as far as its local position allows."
 GE1_political_effort: "Political Effort"
 GE1_political_effort_desc: "The imperial government establishes a political programme that balances the Kaiser, the Reichstag and the army."
 GE1_reichstag_war_credits:0 "Reichstag War Credits"
 GE1_reichstag_war_credits_desc:0 "The Reichstag votes the credits that sustain the emergency war budget, binding the government to parliamentary approval of the conflict's continuing cost."
 GE1_constitutional_compromise:0 "A Constitutional Compromise"
 GE1_constitutional_compromise_desc:0 "The Crown, Bundesrat, and Reichstag negotiate a workable division of responsibility that keeps the imperial constitution functioning under wartime pressure."
 GE1_parliamentary_control:0 "Parliamentary Control"
 GE1_parliamentary_control_desc:0 "The government accepts parliamentary responsibility as military defeat approaches, preserving an orderly constitutional handover before the existing armistice settlement."
 GE1_power_to_kaiser:0 "Power to the Kaiser"
 GE1_power_to_kaiser_desc:0 "The Imperial Court keeps the chancellery aligned with the Crown and preserves prerogative authority while the prewar constitutional balance remains contested."
 GE1_power_to_military:0 "Power to the Military"
 GE1_power_to_military_desc:0 "The Supreme Army Command receives greater influence over wartime policy, improving administrative unity while narrowing civilian room for independent decisions."
 GE1_wartime_administration:0 "Wartime Administration"
 GE1_wartime_administration_desc:0 "The chosen imperial authority coordinates the emergency state, linking civil administration and military supply without erasing the Reichstag's constitutional role."
 GE1_home_by_christmas: "Home by Christmas"
 GE1_home_by_christmas_desc: "The government presents a rapid western victory as the war's political objective and commits to the first campaign."
 GE1_homefront: "Organize the Home Front"
 GE1_homefront_desc: "Civilian ministries protect food, employment and public order while the army fights at the front."
 GE1_homefront_2: "Sustain the Home Front"
 GE1_homefront_2_desc: "The home front sustains production and public confidence through war bonds and organized relief."
 GE1_homefront_3: "Reform the Home Front"
 GE1_homefront_3_desc: "The government reforms labor and relief policy as exhaustion and political pressure grow in 1917."
 GE1_war_front: "Prioritize the Front"
 GE1_war_front_desc: "The state prioritizes battlefield strength and accepts a larger political burden at home."
 GE1_war_front_2: "Mobilize the Front"
 GE1_war_front_2_desc: "Germany expands front-line supply, training and replacement systems as the war becomes industrial."
 GE1_war_front_3: "Hold the Front in 1917"
 GE1_war_front_3_desc: "The army holds the front in 1917 while the government prepares for the consequences of Russia's collapse."
 GE1_shorter_training: "Accelerate Training"
 GE1_shorter_training_desc: "Training cycles become shorter and more focused so exhausted divisions can return to the line sooner."
 GE1_auxiliary_service:0 "Auxiliary Service"
 GE1_auxiliary_service_desc:0 "The Auxiliary Service Law directs labour and industry toward the war effort while forcing the government to balance mobilisation against social consent."
 GE1_army_effort: "Army Effort"
 GE1_army_effort_desc: "The army receives a coherent modernization programme built around mobilization, firepower and field command."
 GE1_staff_reforms: "Reform the General Staff"
 GE1_staff_reforms_desc: "The General Staff studies recent wars and gives commanders a stronger basis for operational planning."
 GE1_trench_warfare: "Prepare for Trench Warfare"
 GE1_trench_warfare_desc: "The army prepares for permanent field fortifications and makes trench warfare a planned capability."
 GE1_gas_mask_1: "Protective Masks I"
 GE1_gas_mask_1_desc: "Units receive reliable gas protection and learn the drills needed to survive chemical attacks."
 GE1_gas_mask_2: "Protective Masks II"
 GE1_gas_mask_2_desc: "Improved filters and issue procedures extend chemical protection across more formations."
 GE1_gas_mask_3: "Protective Masks III"
 GE1_gas_mask_3_desc: "The army standardizes advanced protection for the longest and most exposed sectors of the front."
 GE1_equipment_effort_1: "Standardize Small Arms I"
 GE1_equipment_effort_1_desc: "Factories standardize small arms so mobilized formations receive interchangeable equipment."
 GE1_equipment_effort_2: "Standardize Small Arms II"
 GE1_equipment_effort_2_desc: "Production methods reduce supply gaps and keep infantry weapons available during prolonged fighting."
 GE1_equipment_effort_3: "Standardize Small Arms III"
 GE1_equipment_effort_3_desc: "German industry improves quality control while expanding the output of replacement weapons."
 GE1_equipment_effort_4: "Standardize Small Arms IV"
 GE1_equipment_effort_4_desc: "The army adopts a mature small-arms supply system that can support the final campaigns."
 GE1_artillery_effort_1: "Modern Artillery I"
 GE1_artillery_effort_1_desc: "Artillery planners establish a modern fire-support programme for the opening campaigns."
 GE1_artillery_effort_2: "Modern Artillery II"
 GE1_artillery_effort_2_desc: "Improved production and ammunition planning give German batteries more consistent support."
 GE1_artillery_effort_3: "Modern Artillery III"
 GE1_artillery_effort_3_desc: "The army combines heavier guns with deliberate counter-battery work and coordinated observation."
 GE1_artillery_effort_4: "Modern Artillery IV"
 GE1_artillery_effort_4_desc: "German artillery doctrine reaches a late-war standard built for short, violent bombardments."
 GE1_tactics_1: "Develop Field Tactics I"
 GE1_tactics_1_desc: "Staff officers codify field tactics that connect infantry movement, artillery and reconnaissance."
 GE1_tactics_2: "Develop Field Tactics II"
 GE1_tactics_2_desc: "Commanders practice flexible defense and local counterattacks instead of relying on rigid lines."
 GE1_tactics_3: "Develop Field Tactics III"
 GE1_tactics_3_desc: "The army refines infiltration and fire planning for battles where massed assaults stall."
 GE1_tactics_4: "Develop Field Tactics IV"
 GE1_tactics_4_desc: "German formations prepare the command methods that later support stormtroop operations."
 GE1_fortify_the_west: "Fortify the Western Front"
 GE1_fortify_the_west_desc: "Germany prepares the western frontier and rear areas to absorb an Entente offensive."
 GE1_stormtroop_tactics:0 "Institutionalise Stormtroop Tactics"
 GE1_stormtroop_tactics_desc:0 "The army adopts stormtroop training as a formal programme and carries its lessons into every assault formation."
 GE1_eastern_victory:0 "Secure Victory in the East"
 GE1_eastern_victory_desc:0 "Only after Russia is defeated or the eastern settlement is signed can Germany plan a responsible transfer of forces west."
 GE1_eastern_redeployment:0 "Redeploy from the East"
 GE1_eastern_redeployment_desc:0 "The eastern army moves west in an organised sequence, giving the High Command a trained reserve for the final campaigns."
 GE1_spring_offensive:0 "Prepare the Spring Offensive"
 GE1_spring_offensive_desc:0 "With the western war still active, the army converts its eastern gains and assault methods into a carefully timed offensive plan."
 GE1_kaiserschlacht:0 "Commit to the Kaiserschlacht"
 GE1_kaiserschlacht_desc:0 "Germany commits its best formations to the 1918 offensive and accepts the operational risk of seeking a decision before American strength matures."
 GE1_form_airforce: "Form the Air Service"
 GE1_form_airforce_desc: "Germany forms an organized air service instead of leaving aviation to scattered army experiments."
 GE1_fliegertruppen: "Organize the Fliegertruppen"
 GE1_fliegertruppen_desc: "The Fliegertruppen receive a unified command structure, training system and reconnaissance role."
 GE1_reconnaissance_wings: "Reconnaissance Wings"
 GE1_reconnaissance_wings_desc: "Air crews map enemy positions and improve the artillery intelligence that makes German firepower effective."
 GE1_bomber_focus: "Bomber Doctrine"
 GE1_bomber_focus_desc: "The air service prioritizes bombers and accepts a slower fighter expansion in exchange for operational reach."
 GE1_tactical_bomber_1: "Tactical Bombers I"
 GE1_tactical_bomber_1_desc: "Tactical bombers begin regular support missions against railheads and rear positions."
 GE1_tactical_bomber_2: "Tactical Bombers II"
 GE1_tactical_bomber_2_desc: "Improved crews and aircraft make battlefield bombing more reliable."
 GE1_tactical_bomber_3: "Tactical Bombers III"
 GE1_tactical_bomber_3_desc: "German tactical bombers coordinate closely with artillery and advancing infantry."
 GE1_strategic_bomber_research_1: "Strategic Bomber Research"
 GE1_strategic_bomber_research_1_desc: "Engineers study heavy aircraft and the logistics required for long-range operations."
 GE1_strat_bomber_1: "Strategic Bombers"
 GE1_strat_bomber_1_desc: "The air service fields a small strategic bombing capability for enemy industry and transport."
 GE1_improved_tac_1: "Improved Tactical Bombers I"
 GE1_improved_tac_1_desc: "Technical work improves tactical bomber payloads and battlefield endurance."
 GE1_improved_tac_2: "Improved Tactical Bombers II"
 GE1_improved_tac_2_desc: "Engineers refine tactical bomber engines so aircraft can operate farther from prepared bases."
 GE1_zeppelin_service: "Zeppelin Service"
 GE1_zeppelin_service_desc: "Zeppelin crews support reconnaissance and strategic pressure while the air service learns the limits of airships."
 GE1_aviation_effort_1: "Aviation Effort I"
 GE1_aviation_effort_1_desc: "Germany expands aviation schools and workshops to support a professional air arm."
 GE1_pilot_training_1: "Pilot Training I"
 GE1_pilot_training_1_desc: "Pilot schools establish a repeatable training pipeline before combat losses become severe."
 GE1_aviation_effort_2: "Aviation Effort II"
 GE1_aviation_effort_2_desc: "The air service expands maintenance, fuel handling and forward basing for sustained operations."
 GE1_pilot_training_2: "Pilot Training II"
 GE1_pilot_training_2_desc: "Veteran instructors preserve combat lessons and produce pilots able to operate in difficult weather."
 GE1_fighter_focus: "Fighter Doctrine"
 GE1_fighter_focus_desc: "The air service prioritizes fighters and accepts fewer heavy bombers in exchange for control of the front."
 GE1_fighter_1: "Fighter Development I"
 GE1_fighter_1_desc: "Germany develops fighters suited to escort, interception and reconnaissance protection."
 GE1_fighter_2: "Fighter Development II"
 GE1_fighter_2_desc: "Improved armament and airframes give German pilots a stronger chance over contested sectors."
 GE1_fighter_3: "Fighter Development III"
 GE1_fighter_3_desc: "The fighter arm adopts mature formations and maintenance practices for continuous sorties."
 GE1_improved_fighter_1: "Improved Fighter Engines"
 GE1_improved_fighter_1_desc: "Engine improvements extend fighter speed and climb performance in the demanding front-line role."
 GE1_improved_fighter_2: "Improved Fighter Airframes"
 GE1_improved_fighter_2_desc: "The air service refines fighter airframes for reliability and sustained production."
 GE1_cas_research: "Close Air Support Research"
 GE1_cas_research_desc: "German officers study direct air support and its coordination with breakthrough forces."
 GE1_cas_2: "Early Close Air Support"
 GE1_cas_2_desc: "Early close-support aircraft attack targets immediately beyond the trench line."
 GE1_airfield_construction_1: "Airfield Construction I"
 GE1_airfield_construction_1_desc: "Germany builds a first network of usable airfields in owned core states with available capacity."
 GE1_airfield_construction_2: "Airfield Construction II"
 GE1_airfield_construction_2_desc: "Additional airfields reduce transfer times and keep aircraft near the active fronts."
 GE1_airfield_construction_3: "Airfield Construction III"
 GE1_airfield_construction_3_desc: "The air network gains depth so losses or damaged runways do not halt operations."
 GE1_airfield_construction_4: "Airfield Construction IV"
 GE1_airfield_construction_4_desc: "Late-war airfields support concentrated operations without creating off-map industry."
 GE1_anglo_german: "Anglo-German Naval Race"
 GE1_anglo_german_desc: "The naval race becomes a central imperial programme and gives the fleet a clear strategic purpose."
 GE1_fleet_law:0 "Pass the Fleet Law"
 GE1_fleet_law_desc:0 "The Reich commits to a modern fleet programme while parliamentary and naval leaders debate the risks of challenging British sea power."
 GE1_tirpitz_expands_fleet: "Tirpitz Expands the Fleet"
 GE1_tirpitz_expands_fleet_desc: "Tirpitz expands the fleet around battle squadrons intended to challenge British command of the North Sea."
 GE1_kaiser_expands_fleet: "The Kaiser Expands the Fleet"
 GE1_kaiser_expands_fleet_desc: "The Kaiser backs a larger fleet and accepts the diplomatic cost of challenging British supremacy."
 GE1_cruiser_warfare: "Cruiser Warfare"
 GE1_cruiser_warfare_desc: "Cruisers receive a distinct raiding and scouting role between the battle fleet and submarine arm."
 GE1_submarine_theory: "Submarine Theory"
 GE1_submarine_theory_desc: "Naval planners develop submarines as a deliberate commerce-war instrument."
 GE1_BB_effort: "Battleship Effort"
 GE1_BB_effort_desc: "The surface fleet prioritizes battleships and keeps Germany committed to a decisive fleet action."
 GE1_unrestricted_sub:0 "Resume Unrestricted Submarine Warfare"
 GE1_unrestricted_sub_desc:0 "After the political decision is made, Germany resumes unrestricted submarine warfare and accepts its diplomatic and operational risks."
 GE1_u_boat_campaign:0 "Launch the U-Boat Campaign"
 GE1_u_boat_campaign_desc:0 "The submarine fleet carries the commerce war into a sustained campaign built on patrol endurance and coordinated targeting."
 GE1_continue_unrestricted_sub:0 "Continue Unrestricted Warfare"
 GE1_continue_unrestricted_sub_desc:0 "Germany continues the submarine campaign after 1917 while its leaders weigh shipping losses against the widening coalition response."
 GE1_destroyer_effort: "Destroyer Escorts"
 GE1_destroyer_effort_desc: "Destroyers protect the fleet and improve Germany's ability to screen submarines and convoys."
 GE1_cruiser_effort: "Cruiser Construction"
 GE1_cruiser_effort_desc: "Cruiser yards expand the scouting and raiding force that supports the surface doctrine."
 GE1_battle_cruiser_effort: "Battlecruiser Construction"
 GE1_battle_cruiser_effort_desc: "Battlecruisers combine speed and heavy guns for concentrated operations against vulnerable enemy squadrons."
 GE1_dockyard_1: "Dockyard Expansion I"
 GE1_dockyard_1_desc: "Core coastal states begin a measured dockyard expansion for the fleet programme."
 GE1_dockyard_2: "Dockyard Expansion II"
 GE1_dockyard_2_desc: "Additional dockyards shorten construction queues while respecting owned-state capacity."
 GE1_dockyard_3: "Dockyard Expansion III"
 GE1_dockyard_3_desc: "German yards expand their trained workforce and sustain wartime replacement output."
 GE1_dockyard_4: "Dockyard Expansion IV"
 GE1_dockyard_4_desc: "The final dockyard programme supports late-war naval priorities without free off-map factories."
 GE1_industrial_effort: "Industrial Effort"
 GE1_industrial_effort_desc: "Germany organizes industrial growth around existing core capacity and current construction technology."
 GE1_war_materials:0 "Establish the War Materials Board"
 GE1_war_materials_desc:0 "A central War Materials Board allocates scarce inputs and turns Germany's industrial strength toward the war effort."
 GE1_ersatz_program:0 "Direct the Ersatz Programme"
 GE1_ersatz_program_desc:0 "German firms replace blocked imports with domestic substitutes while accepting the cost imposed on civilian consumption."
 GE1_blockade_adaptation:0 "Adapt to the Blockade"
 GE1_blockade_adaptation_desc:0 "Germany reorganizes trade, food supply, and domestic production around the North Sea blockade."
 GE1_hindenburg_program:0 "Launch the Hindenburg Programme"
 GE1_hindenburg_program_desc:0 "The Supreme Army Command proposes a concentrated output programme that promises more weapons while exposing the limits of labour and coal."
 GE1_infrastructure_effort_1: "Infrastructure Effort I"
 GE1_infrastructure_effort_1_desc: "Core states receive targeted infrastructure work that improves movement and construction capacity."
 GE1_construction_effort_1: "Civilian Construction I"
 GE1_construction_effort_1_desc: "Civilian factories expand within owned core states where building slots are available."
 GE1_armament_effort_1: "Armament Construction I"
 GE1_armament_effort_1_desc: "Germany adds arms production in owned core states and keeps the investment on the map."
 GE1_infrastructure_effort_2: "Infrastructure Effort II"
 GE1_infrastructure_effort_2_desc: "A second infrastructure programme links industrial regions and front-line transport routes."
 GE1_construction_effort_2: "Civilian Construction II"
 GE1_construction_effort_2_desc: "Civilian construction expands again without creating factories outside the state system."
 GE1_armament_effort_2: "Armament Construction II"
 GE1_armament_effort_2_desc: "A second arms programme supports the growing demand for guns, shells and replacement equipment."
 GE1_infrastructure_effort_3: "Infrastructure Effort III"
 GE1_infrastructure_effort_3_desc: "Late-war infrastructure work focuses on bottlenecks that limit the national production network."
 GE1_armament_effort_3: "Armament Construction III"
 GE1_armament_effort_3_desc: "The armaments programme directs the last available capacity toward the war economy."
 GE1_construction_effort_3: "Civilian Construction III"
 GE1_construction_effort_3_desc: "Germany completes a final civilian construction wave where its core states still have room."
 # Austro-Hungarian Focus Tree

 AUH_naval_effort:0 "The Imperial and Royal Kriegsmarine"
 AUH_naval_effort_desc:0 "The fleet at Pola guards the Monarchy's Adriatic approaches and gives Vienna and Budapest a shared maritime service. Clear command arrangements and disciplined training must turn its limited strength into a force whose presence shapes enemy decisions."
 AUH_dreadnought: "Dreadnought Research"
 AUH_dreasnought_desc: ""
 AUH_better_weaponry:0 "Skoda Naval Gunnery"
 AUH_better_weaponry_desc:0 "Naval guns demand more than a powerful barrel: mounts, ammunition handling and fire control must function together at sea. Cooperation with Skoda and the fleet's gunnery officers will refine the battery systems fitted to our ships."
 AUH_submarine_theory:0 "Develop the U-Boat Arm"
 AUH_submarine_theory_desc:0 "Our small submarine arm offers a way to threaten hostile traffic without matching enemy battleships. Trials and specialized instruction will examine hull design, endurance and torpedo practice before further scarce yard capacity is committed."
 AUH_submarine_effort:0 "Pola U-Boat School"
 AUH_submarine_effort_desc:0 "Submarine crews must master navigation, machinery and torpedo attack in a cramped vessel with little margin for error. A permanent school at Pola will turn the experience of early patrols into instruction for new commanding officers and crews."
 AUH_destroyer_effort:0 "Tatra-Class Light Forces"
 AUH_destroyer_effort_desc:0 "Fast destroyers such as the Tatra class give the fleet scouts, escorts and a torpedo striking force suited to the Adriatic. Development work will emphasize seaworthiness, machinery reliability and the coordination needed for night operations."
 AUH_BB_effort:0 "The Tegetthoff Programme"
 AUH_BB_effort_desc:0 "The Tegetthoff-class dreadnoughts embody the Monarchy's ambitions at sea, but their construction commits immense sums and scarce industrial effort. The technical programme will consolidate hull and battery experience while headquarters reckon with the cost of maintaining capital ships."
 AUH_cruiser_effort:0 "Novara-Class Scout Cruisers"
 AUH_cruiser_effort_desc:0 "The Novara-class scouts can concentrate quickly and operate where battleships are too costly to risk. Improved cruiser development will give the fleet more effective reconnaissance and a suitable force for attacks on isolated enemy patrols."
 AUH_battle_cruiser_effort:0 "Fast Squadron Coordination"
 AUH_industrial_effort:0 "The Imperial Industrial Base"
 AUH_industrial_effort_desc:0 "Bohemian engineering, Viennese finance and Hungarian agriculture sustain our common market. We must coordinate these unequal strengths while respecting the two governments."
 AUH_infrastructure_effort_1:0 "The Vienna-Budapest Artery"
 AUH_infrastructure_effort_1_desc:0 "Our central railway carries Hungarian grain and mobilization stores. Better approaches to both capitals will serve the common economy."
 AUH_infrastructure_effort_2:0 "Galician Supply Railways"
 AUH_infrastructure_effort_2_desc:0 "Galicia is far from our industrial centers. Improving transport around Krakow and Lwow will reduce the provincial bottlenecks."
 AUH_infrastructure_effort_3:0 "Carpathian Transport Services"
 AUH_infrastructure_effort_3_desc:0 "Poor mountain roads delay replacements and evacuations. Provincial transport services will improve access to the eastern front."
 AUH_construction_effort_1:0 "Viennese Engineering Workshops"
 AUH_construction_effort_1_desc:0 "New machine shops around Vienna will supply tools to smaller manufacturers. Expanding their facilities broadens civilian production."
 AUH_construction_effort_2:0 "Ganz and Hungarian Industry"
 AUH_construction_effort_2_desc:0 "Budapest needs machinery as much as Vienna does. Hungarian engineering must become a tangible partner in common development."
 AUH_construction_effort_3:0 "Moravian Machine Tools"
 AUH_construction_effort_3_desc:0 "Moravian workshops can supply the lathes and fittings needed throughout the monarchy. Expansion gives civilian industry a deeper base."
 AUH_armament_effort_1:0 "The Skoda Armament Works"
 AUH_armament_effort_1_desc:0 "Pilsen is indispensable to our artillery programme. The treasury will finance an additional production hall and its supply contracts."
 AUH_armament_effort_2:0 "Wollersdorf Ammunition Contracts"
 AUH_armament_effort_2_desc:0 "Our artillery requires a steady supply of shells. New ammunition contracts will expand output through paid procurement."
 AUH_armament_effort_3:0 "Emergency Armament Contracts"
 AUH_armament_effort_3_desc:0 "The army cannot wait for peacetime purchasing procedures. Additional Hungarian armament contracts will increase output through supervised procurement."
 AUH_airfield_construction_1:0 "Vienna Military Aerodromes"
 AUH_airfield_construction_1_desc:0 "The flying service needs prepared fields near its schools and technical workshops. Enlarging the military aerodrome facilities around Vienna will support training, acceptance flights and the dispatch of replacement aircraft."
 AUH_airfield_construction_2:0 "Styrian Aviation Facilities"
 AUH_airfield_construction_2_desc:0 "Styria and Carinthia offer rear-area space for aviation close enough to support southern operations. Prepared landing grounds and service accommodation will strengthen the link between the factories, flying schools and squadrons at the front."
 AUH_airfield_construction_3:0 "The Trieste Flying Stations"
 AUH_airfield_construction_3_desc:0 "Trieste connects the army's southern front to the Adriatic. Better flying facilities will support reconnaissance, coastal observation and maintenance without requiring crews to depend on improvised fields far from their assigned sector."
 AUH_airfield_construction_4:0 "Pola Naval Aviation Facilities"
 AUH_airfield_construction_4_desc:0 "Pola's naval stations need room for aircraft maintenance and coastal patrol preparation. Investment in aviation facilities will improve cooperation with the fleet and keep more reconnaissance sorties close to the approaches they must observe."
 AUH_dockyard_construction_1: "Dockyard Construction I"
 AUH_dockyard_construction_1_desc: ""
 AUH_dockyard_construction_2: "Dockyard Construction II"
 AUH_dockyard_construction_2_desc: ""
 AUH_dockyard_construction_3: "Dockyard Construction III"
 AUH_dockyard_construction_3_desc: ""
 AUH_dockyard_construction_4: "Dockyard Construction IV"
 AUH_dockyard_construction_4_desc: ""
 AUH_build_yards:0 "Agree the Naval Programme"
 AUH_build_yards_desc:0 "The navy cannot pursue every design while the army demands money, recruits and steel. A joint conference will establish practical naval priorities and relate shipyard orders to the force which the Monarchy can sustain."
 AUH_home_front_1:0 "Organize the Municipal Home Front"
 AUH_home_front_1_desc:0 "The towns must manage food, fuel and housing while the army absorbs resources. Municipal relief can prevent shortage from becoming administrative collapse."
 AUH_home_front_2:0 "Provincial Relief Boards"
 AUH_home_front_2_desc:0 "Relief must reach towns beyond Vienna. Provincial boards will coordinate funds and deliveries while recording unmet needs."
 AUH_home_front_3:0 "Protect Civilian Distribution"
 AUH_home_front_3_desc:0 "A minimum civilian ration is a military and social necessity. The home front will fund deliveries and inspect allocations despite the budgetary cost."
 AUH_war_front_1:0 "Reserve Battalions for the Carpathians"
 AUH_war_front_1_desc:0 "A winter campaign in the Carpathians demands trained replacement drafts and a clear rotation system. Rear-area schools will prepare reserve battalions for the conditions at the front while headquarters schedule relief before exhaustion destroys cohesion."
 AUH_war_front_2:0 "Organise the Isonzo Front"
 AUH_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 AUH_war_front_3:0 "Prepare the Caporetto Staff Plan"
 AUH_war_front_3_desc:0 "An offensive through the upper Isonzo requires secrecy, concentrated artillery and close coordination between assault formations. Staff officers will study the routes and objectives needed for a limited breakthrough, with supply plans setting the extent of the advance."
 AUH_army_effort:0 "The Imperial and Royal Army"
 AUH_army_effort_desc:0 "The Common Army binds the two halves of the Monarchy to one sovereign. Its regiments bring many languages and traditions into the same ranks; dependable training and supply must give that diversity a common military purpose."
 AUH_trench_warfare:0 "Fieldworks of the Pioneer Corps"
 AUH_trench_warfare_desc:0 "The engineers must prepare communications trenches, protected dugouts and drainage before prolonged fighting exposes the weakness of improvised positions. A fieldwork manual can carry practical lessons from fortress service into every infantry regiment."
 AUH_gas_mask_1:0 "Issue Respirators to the Front"
 AUH_gas_mask_1_desc:0 "Chemical warfare makes a dependable respirator part of the ordinary soldier's kit. Medical officers and company commanders must supervise fitting, storage and elementary gas alarms before unfamiliar equipment reaches the trenches."
 AUH_gas_mask_2:0 "Regimental Gas Defence Schools"
 AUH_gas_mask_2_desc:0 "Respirators alone cannot protect a regiment which does not recognize a gas attack. Dedicated instructors will rehearse alarm signals, relief procedures and the rapid replacement of damaged filters under field conditions."
 AUH_gas_mask_3:0 "Inspect the Respirator Supply"
 AUH_gas_mask_3_desc:0 "Long service and difficult transport wear out masks and filters. The army medical service must inspect reserve equipment and organize replacement batches so that veteran units retain reliable protection during another campaigning season."
 AUH_equipment_effort_1:0 "Standardise the Mannlicher Rifle"
 AUH_equipment_effort_1_desc:0 "The Mannlicher straight-pull rifle is already familiar to the ranks. Clear inspection standards, compatible ammunition batches and well stocked regimental armouries will make the existing weapon system easier to maintain through mobilization."
 AUH_equipment_effort_2:0 "Schwarzlose Machine-Gun Sections"
 AUH_equipment_effort_2_desc:0 "The water-cooled Schwarzlose gives infantry a dependable base of fire when crews understand its ammunition, cooling and transport requirements. Regimental training will place these guns where they can cover an advance or secure a threatened flank."
 AUH_equipment_effort_3:0 "Steyr Wartime Production Standards"
 AUH_equipment_effort_3_desc:0 "Rising orders at Steyr require consistent gauges, interchangeable parts and trained inspectors. Coordinating rifle and machine-gun specifications will reduce rejection rates without sacrificing the durability demanded by service in Galicia and the mountains."
 AUH_equipment_effort_4:0 "Carbines and Grenades for Assault Sections"
 AUH_equipment_effort_4_desc:0 "Compact weapons and plentiful grenades suit the close fighting around dugouts and mountain positions. Procurement officers will adapt infantry equipment to assault sections while retaining the Mannlicher system already supported by our workshops."
 AUH_artillery_effort_1:0 "Skoda Field-Gun Contracts"
 AUH_artillery_effort_1_desc:0 "The Skoda works at Pilsen are central to the army's artillery supply. Long-term contracts and consistent ammunition standards will let field batteries receive modern pieces and spares without dividing scarce industrial effort among incompatible orders."
 AUH_artillery_effort_2:0 "The Skoda 30.5 cm Mortar"
 AUH_artillery_effort_2_desc:0 "The heavy Skoda mortar can reduce positions which ordinary field artillery cannot reach. Its specialized batteries require transport, survey teams and carefully planned ammunition columns; investment in those services will make siege artillery usable beyond the fortress parks."
 AUH_artillery_effort_3:0 "Modernise the Howitzer Batteries"
 AUH_artillery_effort_3_desc:0 "High-angle fire is essential against protected trenches and mountain positions. Improved howitzer designs, trained gun layers and standardized ammunition tables will make our batteries more responsive to the infantry they support."
 AUH_artillery_effort_4:0 "Surveyed Fire and Battery Signals"
 AUH_artillery_effort_4_desc:0 "Accurate survey work and reliable signals allow guns to support an attack without wasteful ranging. Artillery schools will teach a common system of observation reports, fire tables and communications between batteries and forward officers."
 AUH_tactics_1:0 "Staff Rides and War Games"
 AUH_tactics_1_desc:0 "Map exercises should expose assumptions before mobilization makes them costly. The general staff will test deployment timetables, march routes and reserve commitments against the terrain and railway capacity of the Monarchy."
 AUH_tactics_2:0 "Lessons of Galicia"
 AUH_tactics_2_desc:0 "The opening campaigns show how rapidly an offensive can exhaust trained officers and outrun its artillery. Staff reports from Galicia will revise reconnaissance, march security and the commitment of reserves rather than treating every setback as a failure of courage."
 AUH_tactics_3:0 "Defence in Depth"
 AUH_tactics_3_desc:0 "Repeated bombardments punish crowded forward trenches. Commanders will prepare covered reserves, fallback positions and planned counterattacks so that a penetrated front line does not immediately become the collapse of an entire sector."
 AUH_tactics_4:0 "A General Staff for a Long War"
 AUH_tactics_4_desc:0 "The general staff needs continuity, trained replacements and a sober picture of the army's strength. Standard reporting and a permanent lessons bureau will carry experience between the eastern, Balkan and Alpine theatres."
 AUH_form_airforce:0 "The Luftfahrtruppen"
 AUH_form_airforce_desc:0 "The Monarchy's air service grows from balloon detachments and the first military flying experiments. A permanent organization must train pilots and observers, maintain aircraft and turn reconnaissance reports into information useful to the armies."
 AUH_bomber_focus:0 "Arm the Observation Aircraft"
 AUH_bomber_focus_desc:0 "Observation aircraft can defend themselves and carry a small bomb load without abandoning their main work over the front. Trials will determine practical armament arrangements for the two-seaters already entering squadron service."
 AUH_fighter_focus:0 "Create Dedicated Fighter Flights"
 AUH_fighter_focus_desc:0 "Reconnaissance will become increasingly hazardous unless specialist aircraft can challenge enemy patrols. Dedicated fighter flights will develop interception and escort methods while the technical service evaluates synchronized armament and suitable airframes."
 AUH_fighter_1:0 "Oeffag Albatros Production"
 AUH_fighter_1_desc:0 "Oeffag at Wiener Neustadt combines licensed Albatros designs with domestic manufacturing experience. Acceptance officers will test airframe strength, engine installation and armament so that the factory's machines can reach operational units with fewer modifications."
 AUH_fighter_2:0 "The Aviatik Berg Fighter"
 AUH_fighter_2_desc:0 "The Aviatik Berg offers a domestic approach to the single-seat fighter. Its development requires close contact between designers and combat pilots, with cooling, visibility and handling assessed alongside speed and armament."
 AUH_fighter_3:0 "Phonix Fighter Trials"
 AUH_fighter_3_desc:0 "The Phonix works can turn experience with earlier aircraft into a new fighter series. Service trials will judge reliability and maneuverability under operational loads before the air service commits its limited engines and skilled labour to larger orders."
 AUH_aviation_effort_1:0 "Wiener Neustadt Flying Instruction"
 AUH_aviation_effort_1_desc:0 "The military flying school at Wiener Neustadt can give new crews a common foundation. Carefully sequenced instruction, dual-control practice and experienced instructors will connect elementary flying to the demands of military service."
 AUH_pilot_training_1:0 "Pilot and Observer Partnerships"
 AUH_pilot_training_1_desc:0 "The pilot must bring the aircraft home while the observer completes the mission. Crew training will rehearse navigation, signal procedures and reconnaissance reporting together, creating partnerships before men reach an unfamiliar front squadron."
 AUH_aviation_effort_2:0 "Front Squadron Administration"
 AUH_aviation_effort_2_desc:0 "Front-line air companies need clear reporting channels, assigned patrol areas and dependable liaison with army headquarters. A revised squadron administration will extend the reach of our air service for the next year."
 AUH_pilot_training_2:0 "Combat Schools Behind the Front"
 AUH_pilot_training_2_desc:0 "Veteran crews can teach the lessons which elementary schools cannot reproduce. Rear-area combat courses will pass on formation discipline, evasive flying and observation techniques before inexperienced pilots encounter enemy aircraft."
 AUH_tactical_bomber_1:0 "Lohner and Lloyd Two-Seaters"
 AUH_tactical_bomber_1_desc:0 "Lohner and the Hungarian Lloyd works offer domestic experience in practical two-seat aircraft. The air service will compare their machines under field conditions, with particular attention to visibility, handling and the needs of the observer."
 AUH_tactical_bomber_2:0 "Aviatik C-Type Contracts"
 AUH_tactical_bomber_2_desc:0 "The Aviatik works can supply armed reconnaissance aircraft for the growing front squadrons. Standard contracts and acceptance tests will concentrate orders on machines able to carry an observer, ammunition and useful equipment over difficult terrain."
 AUH_tactical_bomber_3:0 "Phonix and UFAG Reconnaissance Types"
 AUH_tactical_bomber_3_desc:0 "The latest Phonix and UFAG two-seaters promise a more capable replacement for tired front-line machines. Evaluation teams will emphasize reliability, defensive armament and the ability to complete reconnaissance missions despite increasingly effective enemy fighters."
 AUH_strategic_bomber_research: "Strategic Bomber Research"
 AUH_strategic_bomber_research_desc: ""
 AUH_strat_bomber_1:0 "Trials of Heavy Bomb Loads"
 AUH_strat_bomber_1_desc:0 "A controlled series of loading and release trials will show what larger bombs demand of structure, stability and ground handling. The findings can guide a future heavy-aircraft programme without diverting whole squadrons from immediate reconnaissance work."
 AUH_improved_tac_1:0 "Observer Gunnery and Bomb Sights"
 AUH_improved_tac_1_desc:0 "A two-seater's observer must divide attention between reconnaissance, defence and bomb release. Common gunnery courses and calibrated sights will help crews perform those duties with the aircraft and equipment already in service."
 AUH_improved_tac_2:0 "Standardise Two-Seater Bomb Racks"
 AUH_improved_tac_2_desc:0 "Improvised bomb fittings make maintenance difficult and loading unsafe. The technical service will establish standard racks and release procedures for the domestic two-seater fleet, allowing workshops to prepare aircraft consistently for their assigned missions."
 AUH_improved_fighter_1:0 "Austro-Daimler Engine Workshops"
 AUH_improved_fighter_1_desc:0 "A fighter programme depends on engines which field mechanics can keep running. Specialist workshop teams will improve inspection, cooling-system maintenance and repair routines around the Austro-Daimler engines used by the domestic aircraft industry."
 AUH_improved_fighter_2:0 "Common Fighter Acceptance Standards"
 AUH_improved_fighter_2_desc:0 "Pilots should receive aircraft whose fittings and flying characteristics match the factory specification. A common acceptance system for Oeffag, Aviatik and Phonix will make the expanding fighter force easier to supply and maintain."
 AUH_cas_research:0 "Infantry Contact Patrols"
 AUH_cas_research_desc:0 "Infantry operations create demands which ordinary reconnaissance reports answer too slowly. Contact patrols will practice locating our forward troops, reporting their progress and carrying messages between threatened sectors and army headquarters."
 AUH_cas_2:0 "Low-Level Support Trials"
 AUH_cas_2_desc:0 "Flying close to the battlefield exposes aircraft to ground fire as well as enemy fighters. Limited trials will develop methods for supporting infantry with small bomb loads while retaining realistic objectives and routes back to protected airfields."
 AUH_entente_diplomacy:0 "Contact the Entente"
 AUH_entente_diplomacy_desc:0 "A confidential channel lets the emperor explore peace terms. Our enemies remain free to reject them and our allies will expect an explanation."
 AUH_seperate_peace:0 "Pursue a Negotiated Peace"
 AUH_seperate_peace_desc:0 "A separate settlement cannot be imposed by a focus alone. France must reply and alliance obligations remain relevant; humanitarian relief may be the only possible agreement."
 AUH_befriend_italy:0 "Repair the Triple Alliance"
 AUH_befriend_italy_desc:0 "Italy is a treaty partner with territorial ambitions of its own. Reopened talks will test whether consultation can keep Rome out of an opposing camp."
 AUH_subdue_italy:0 "Hold the Italian Front"
 AUH_subdue_italy_desc:0 "If Italy chooses war, the army must secure the passes and coast. The ministry will close its failed negotiations and support a sustained frontier campaign."
 AUH_cede_tyrol:0 "Offer Trentino and South Tyrol"
 AUH_cede_tyrol_desc:0 "Territorial concessions might keep Italy neutral. Trentino and South Tyrol will be transferred only if Rome accepts the offer."
 AUH_cede_tyrol_and_istria:0 "Extend the Italian Concessions"
 AUH_cede_tyrol_and_istria_desc:0 "Trieste and the Istrian coast can be added to the bargaining table. This grave sacrifice of imperial territory still requires Italian consent."
 AUH_promise_italy:0 "Promise an Allied Settlement"
 AUH_promise_italy_desc:0 "Diplomatic support for Italian ambitions elsewhere offers an alternative to territorial concessions. Rome must explicitly accept before receiving an alliance invitation."
 AUH_italy_central_power:0 "Bring Italy into the Alliance"
 AUH_italy_central_power_desc:0 "An accepted offer opens a different future for the Triple Alliance. Italy can join only with its consent and an existing German-led faction."
 AUH_diplomatic_effort:0 "The Ballhausplatz"
 AUH_diplomatic_effort_desc:0 "The foreign ministry must defend a multinational empire in a hostile Europe. Clear embassy instructions preserve room for negotiation alongside the German alliance."
 AUH_annex_bosnia:0 "Consolidate Bosnia-Herzegovina"
 AUH_annex_bosnia_desc:0 "Annexation has changed our Balkan position. Civil administration must now replace the uncertainty of occupation and justify its demands on the treasury."
 AUH_anti_serb_rhetoric:0 "Confront Serbian Nationalism"
 AUH_anti_serb_rhetoric_desc:0 "Serbian nationalism threatens our South Slav provinces. The ministry must decide whether confrontation or restraint best serves the monarchy."
 AUH_dominate_balkan_SOI:0 "Defend the Balkan Position"
 AUH_dominate_balkan_SOI_desc:0 "Our western Balkan influence depends on reliable commitments. The ministry will consolidate its diplomatic position before making further demands."
 AUH_pro_germany:0 "The German Alliance"
 AUH_pro_germany_desc:0 "Berlin is the foundation of our security. Joint planning strengthens the alliance without surrendering every diplomatic decision to Germany."
 AUH_bulgaria_friend:0 "Negotiate with Sofia"
 AUH_bulgaria_friend_desc:0 "Bulgaria seeks a revision of the Balkan settlement. Its territorial aspirations must be negotiated if it is to become a dependable ally."
 AUH_prepare_for_war:0 "Approve Mobilization Planning"
 AUH_prepare_for_war_desc:0 "A Balkan war makes immediate demands on railways and finance. Concrete mobilization plans must be agreed before the common army can execute them."
 AUH_ottoman_friends:0 "The Ottoman Connection"
 AUH_ottoman_friends_desc:0 "The Ottoman Empire faces similar strategic pressures. Diplomatic and military liaison can turn a distant partner into a useful ally."
 AUH_confiscate_serb_grain:0 "Serbian Occupation Supplies"
 AUH_confiscate_serb_grain_desc:0 "We must choose between requisitions and paid grain purchases in occupied Serbia. Coercion improves supply at a cost to confidence at home."
 AUH_volunteer_albania:0 "The Albanian Liaison Mission"
 AUH_volunteer_albania_desc:0 "Albanian recruits and local knowledge can support Balkan operations. Officers and liaison services must be funded rather than producing an unexplained army."
 AUH_cede_macedonia_bulgaria:0 "Settle Bulgarian Claims"
 AUH_cede_macedonia_bulgaria_desc:0 "Bulgaria expects a voice in the Macedonian settlement. We can transfer only territory we actually own to a partner in the same alliance."
 AUH_massive_war_effort:0 "The Final Wartime Commitment"
 AUH_massive_war_effort_desc:0 "The ministries can coordinate a final effort, but new obligations strain credit and food supplies. Its costs must be acknowledged rather than conjuring men and material."
 AUH_central_powers_diplomacy:0 "The Allied War Council"
 AUH_central_powers_diplomacy_desc:0 "Our allies do not share identical aims. A standing liaison network must translate common interests into practical cooperation."
 AUH_german_advisors:0 "German Staff Liaison"
 AUH_german_advisors_desc:0 "A limited German advisory mission can exchange operational experience with our staff. It will improve coordination without replacing common army command."
 AUH_german_troops:0 "Request German Replacement Cadres"
 AUH_german_troops_desc:0 "Berlin can be asked for a limited replacement contingent. The German government pays the manpower cost and retains the right to decline."
 AUH_send_germany_aid:0 "Supply German Units"
 AUH_send_germany_aid_desc:0 "Equipment support must come from our stockpile. A thousand infantry weapons can be offered to Germany or retained for our own front."
 AUH_send_germany_troops:0 "Replacements for the German Front"
 AUH_send_germany_troops_desc:0 "The alliance must share burdens as well as advice. A limited replacement contingent will come from our own manpower."
 AUH_turkish_reinforcements:0 "Request Ottoman Replacement Cadres"
 AUH_turkish_reinforcements_desc:0 "Our Ottoman ally may release a small reserve for common service. The request imposes a real manpower cost on the donor."
 AUH_send_turkey_troops:0 "Personnel for Ottoman Service"
 AUH_send_turkey_troops_desc:0 "A small contingent can support the Ottoman front. The final decision draws three thousand men from our own reserve."
 AUH_send_turkey_weapons:0 "An Ottoman Equipment Mission"
 AUH_send_turkey_weapons_desc:0 "Reliable weapons must come with a supply chain. The mission will transfer actual stockpiled equipment, subject to our final approval."
 AUH_political_effort:0 "The Dual Monarchy"
 AUH_political_effort_desc:0 "Two governments and several common ministries hold the empire together. Effective administration needs cooperation between Vienna and Budapest within the limits of the 1867 settlement."
 AUH_imperial_stability:0 "A Working Common Government"
 AUH_imperial_stability_desc:0 "Vienna and Budapest must keep the common ministries working despite competing interests. Reliable public services and a functioning cabinet are the foundations of the monarchy; neglect at home will undermine every effort at the front."
 AUH_focus_military:0 "Reorganise the Army High Command"
 AUH_focus_military_desc:0 "The Armeeoberkommando must connect front-line reports to realistic orders and available transport. A command conference will clarify responsibilities between the general staff, army headquarters and the ministries which supply them."
 AUH_focus_internal_issues:0 "Negotiate with the Nationalities"
 AUH_focus_internal_issues_desc:0 "Ministers must hear provincial grievances rather than treat every demand as disloyalty. Practical concessions remain possible within the existing constitution."
 AUH_supress_minorities:0 "Wartime Press and Police Powers"
 AUH_supress_minorities_desc:0 "Censorship can coordinate the wartime press, but restrictions alienate provincial representatives and cost public confidence. The cabinet must weigh immediate control against a broader constitutional settlement."
 AUH_polish_legions:0 "Recognise the Polish Legions"
 AUH_polish_legions_desc:0 "Polish volunteers can serve alongside the Common Army while pursuing hopes of a restored homeland. Formal liaison, reliable equipment accounting and respect for their officers will establish a workable military relationship with these formations."
 AUH_war_effort_1:0 "The War Services Law"
 AUH_war_effort_1_desc:0 "Mobilization requires legal arrangements for labor, transport and army orders. The ministries will coordinate the effort and record its liabilities."
 AUH_war_effort_2:0 "Coordinate Army Purchasing"
 AUH_war_effort_2_desc:0 "Military buyers compete for the same wagons, labor and raw materials. Central purchasing improves coordination while increasing common liabilities."
 AUH_war_effort_3:0 "Reserve Civilian Food Allocations"
 AUH_war_effort_3_desc:0 "The army cannot requisition every remaining stock. Distribution rules must preserve a minimum civilian allocation and keep the towns working."
 AUH_hungarian_support:0 "Secure the Hungarian Compromise"
 AUH_hungarian_support_desc:0 "Budapest controls indispensable revenue and agricultural supplies. Common government must negotiate cooperation instead of assuming Hungarian support."
 AUH_coronation:0 "Karl Takes the Hungarian Oath"
 AUH_coronation_desc:0 "Karl has succeeded Franz Joseph and must confirm the constitutional relationship with Hungary. His crown oath belongs to the accession settlement of late 1916."
 AUH_strategic_bomber_research_1:0 "Study the Heavy Aircraft Proposals"
 AUH_strategic_bomber_research_1_desc:0 "Heavy aircraft promise longer missions and larger bomb loads, but our workshops and engines impose strict limits. A technical commission will review proposals, test their assumptions and identify which elements deserve further development."
 AUH_dockyard_1:0 "Modernise the Pola Arsenal"
 AUH_dockyard_1_desc:0 "Pola is the fleet's principal arsenal, with the workshops and personnel needed to support its heaviest ships. Enlarging productive capacity there will improve maintenance and construction at the center of the naval establishment."
 AUH_dockyard_2:0 "Trieste Shipyard Contracts"
 AUH_dockyard_2_desc:0 "The yards of Trieste bring industrial skill and merchant experience to naval construction. Carefully specified contracts will expand the capacity available to the fleet while maintaining the fittings and standards expected by its technical officers."
 AUH_dockyard_3:0 "The Fiume Naval Workshops"
 AUH_dockyard_3_desc:0 "Fiume connects Hungarian industrial interests to the common fleet. Investment in its shipbuilding workshops will spread naval work across both halves of the Monarchy and strengthen a port already associated with torpedoes and marine engineering."
 AUH_dockyard_4:0 "Repair Facilities at Cattaro"
 AUH_dockyard_4_desc:0 "The southern base at Cattaro allows light forces and submarines to operate closer to the entrance of the Adriatic. Local repair facilities will reduce the need to return every damaged or worn vessel to Pola."
