    shared_GEN_why_we_fight:0 "Defend the Constitution"
    shared_GEN_why_we_fight_desc:0 "The cause of political liberty must be secured in the institutions of the state. An elected government will answer to the nation and defend the constitutional settlement."
    shared_GEN_airfield_construction_1:0 "An Aviation Workshop"
    shared_GEN_airfield_construction_1_desc:0 "A central airfield will provide workshops, storage and a safe base for experimental flying. An aircraft industry cannot grow without ground facilities."
    shared_GEN_airfield_construction_2:0 "Aircraft Assembly Contracts"
    shared_GEN_airfield_construction_2_desc:0 "Small manufacturers will pool their skills to fulfil the first aircraft orders. Assembly facilities must expand with the flying service."
    shared_GEN_airfield_construction_3:0 "A Network of Landing Grounds"
    shared_GEN_airfield_construction_3_desc:0 "Forward landing grounds will give aircraft room to operate beyond the capital. Maintenance teams will accompany the expansion."
    shared_GEN_airfield_construction_4: "Airfield Construction IV"
    shared_GEN_airfield_construction_4_desc: ""
    shared_GEN_infrastructure_effort_1:0 "Connect the Provincial Markets"
    shared_GEN_infrastructure_effort_1_desc:0 "Roads and railheads will connect producers to the national market. Improved transport is the foundation of both civilian investment and military supply."
    shared_GEN_infrastructure_effort_2:0 "National Freight Coordination"
    shared_GEN_infrastructure_effort_2_desc:0 "Shared timetables and uniform freight contracts will reduce the delays that hold back industry. Either investment policy can support this practical reform."
    shared_GEN_infrastructure_effort_3:0 "Improve the Freight Corridors"
    shared_GEN_infrastructure_effort_3_desc:0 "The busiest routes need larger depots and dependable road access. We will concentrate investment where it serves both factories and the army."
    shared_GEN_infrastructure_effort_4:0 "An Integrated War Economy"
    shared_GEN_infrastructure_effort_4_desc:0 "Factories, transport agencies and quartermasters will work to one production schedule. This is an emergency programme for an active war, not a permanent expansion of the state."
    shared_GEN_armament_effort_1:0 "Fund a State Arsenal"
    shared_GEN_armament_effort_1_desc:0 "The treasury will establish a dependable source of rifles and ammunition. Direct military investment takes priority over private expansion."
    shared_GEN_armament_effort_2:0 "Standardise Ammunition Contracts"
    shared_GEN_armament_effort_2_desc:0 "Common gauges and inspection standards will reduce waste. The arsenal must deliver interchangeable ammunition rather than a catalogue of incompatible designs."
    shared_GEN_armament_effort_3:0 "The Wartime Procurement Board"
    shared_GEN_armament_effort_3_desc:0 "The armed forces will coordinate contracts through one procurement board. A new factory and shared purchasing arrangements will support sustained mobilisation."
    shared_GEN_armament_effort_4: "Armament Effort IV"
    shared_GEN_armament_effort_4_desc: ""
    shared_GEN_construction_effort_1:0 "Mobilise Private Investment"
    shared_GEN_construction_effort_1_desc:0 "Credit guarantees will encourage workshops and exporters to expand. This programme favours civilian capacity over a government arsenal."
    shared_GEN_construction_effort_2:0 "Expand the Machine Shops"
    shared_GEN_construction_effort_2_desc:0 "Domestic machine shops can supply tools and spare parts to other manufacturers. They will become the centre of the next round of civilian investment."
    shared_GEN_construction_effort_3:0 "Electric Power for Industry"
    shared_GEN_construction_effort_3_desc:0 "Reliable electrical power allows workshops to operate modern machinery. Engineers will develop the industrial districts rather than scatter investment across the country."
    shared_GEN_construction_effort_4: "Construction Effort IV"
    shared_GEN_construction_effort_4_desc: ""
    shared_GEN_dockyard_1:0 "Expand the Commercial Yards"
    shared_GEN_dockyard_1_desc:0 "Existing ship repair workshops will be enlarged to build and maintain vessels at home. The first step is a working yard, not a battleship programme."
    shared_GEN_dockyard_2:0 "Merchant Shipping Contracts"
    shared_GEN_dockyard_2_desc:0 "A reliable merchant marine carries our supplies even when foreign freight becomes scarce. Domestic yards will place a modest order for cargo ships."
    shared_GEN_dockyard_3:0 "Coordinate Shipbuilding Orders"
    shared_GEN_dockyard_3_desc:0 "Standard repair parts and long-term orders will make better use of our limited dockyard capacity. Naval ambitions must be supported by an industrial programme."
    shared_GEN_dockyard_4: "Dockyard Construction IV"
    shared_GEN_dockyard_4_desc: ""
