 EN1_join_war: "Join War"
 EN1_join_war_desc: "Join the war on the side of the Entente."
 EN1_western_diplomacy: "Western Diplomacy"
 EN1_western_diplomacy_desc: "Diplomacy in the West"
 EN1_befriend_US: "Befriend the United States"
 EN1_befriend_US_desc: "We need the United States support in a major european war, so it would be wise to befriend them as much as we can in hopes they can someday assist us."
 EN1_bring_america_in: "Invite the U.S"
 EN1_bring_america_in_desc: "The United States has for long enough retained its neutral stance, it is time for them to join the conflict"
 EN1_anti_german_sentiment: "Anti-German Sentiment"
 EN1_anti_german_sentiment_desc: "Over the past decade there has been an increasing amount of tension between Britain and Germany over the issue of the Naval Race which the Kaiser refuses to back down on theatening our naval superiorty and with that the Island of Britain."
 EN1_prepare_for_war: "Prepare for War"
 EN1_stay_neutral: "Stay Neutral"
 EN1_stay_neutral_desc: "Perhaps it would be wise to sit it out for a year, if anything we can always join later."
 EN1_back_france: "Back France"1
 EN1_back_france_desc: "With Belgium neutrality violated it is our duty to show that our words will not be walked over by some filthy kraut!"
 EN1_north_sea_blockade: "Implement North Sea Blockade"
 EN1_north_sea_blockade_desc: "In order to hopefully starve the Germans out and cut them off from the resources of the world it would be a great idea to implement a blockade."
 EN1_cosncript_irish: "Conscript Irish"
 EN1_cosncript_irish_desc: "Whilst it would be a bad idea to conscript the Irish seeing as how things went, previously with the Easter Rising, we need more men on the front and this will be plenty enough."
 EN1_dont_conscript_irish: "Don't Conscript Irish"
 EN1_dont_conscript_irish_desc: "The Irish will not be conscripted, no matter if we need more men."
 EN1_nordic_country_trading: "Call on Scandinavia to Break off Relations with Germany"
 EN1_nordic_country_trading_desc: "The Nordic countries, particularly Sweden provide the Germans with war supply which cannot be blocked off seeing as the Germans have control over the Baltic Sea, however we could always ask them to stop and break off relations with Germany."
 EN1_portugal_friend: "Align Portugal with us"
 EN1_portugal_friend_desc: "The Portuguese and Germans have faced a significant amount of tension with the Germans sinking a fair amount of Portuguese ships and colonial tensions in Africa, we could benefit off of this and align Portugal with us hopefully eventually getting them to join the Entente."
 EN1_invite_portugal: "Invite Portugal"
 EN1_invite_portugal_desc: "The Portuguese have just about had enough of the Germans sinking their convoys and the tensions on their colonial borders and are ready to join the Entente."
 EN1_bulgaria_talks: "Negotiate with Bulgaria"
 EN1_bulgaria_talks_desc: "Whilst we cannot offer all that the Central Powers probably can in terms of territory, we must do as much as we can to get Bulgaria on our side, it would mean the imminent collapse of Turkey seeing how close the border is to Constantinople, offering territorial concessions to Bulgaria means pissing off the Serbs however it will just have to do."
 EN1_invite_bulgaria: "Invite Bulgaria"
 EN1_invite_bulgaria_desc: "Bulgaria has agreed to our negotiations and is ready to join the Entente"
 EN1_baltic_project_part_1: "Baltic Project Part I"
 EN1_baltic_project_part_1_desc: "A plan has been proposed by Admiral Lord Fisher who insures a speedy victory, his plan is to land a substantial force of British and or Russian soldiers on the flat beaches of Pomerania on the Northern German coast, less than 100 miles from Berlin. A substantial fleet would be required to keep the invasion safe from the Imperial German Navy, but Lord Fisher assures it will be completely worth it."
 EN1_baltic_project_part_2: "Baltic Project Part II"
 EN1_baltic_project_part_2_desc: "As we go from the planning phase into the preparation phase, we have started putting together the large specialist fleet which will contain more than 600 special vessels."
 EN1_baltic_project_part_3: "Baltic Project Part III"
 EN1_baltic_project_part_3_desc: "Let the invasion begin!"
 EN1_middle_east_diplomacy: "Middle East Diplomacy"
 EN1_middle_east_diplomacy_desc: "Diplomacy in the Middle East"
 EN1_fortify_suez: "Fortify Suez Canal"
 EN1_fortify_suez_desc: "It would be wise to fortify the Suez Canal in case of war."
 EN1_secure_southern_persia: "Secure Southern Persia"
 EN1_secure_southern_persia_desc: "In order to secure the Persian Oilfields in the South and the path to India we must put Southern Persia under British occupation for the time being seeing Turkish involvment is likely."
 EN1_hold_back_turk_ships: "Confiscate Turkish Vessels"
 EN1_hold_back_turk_ships_desc: "The Ottoman Empire has bought two vessels which have been completed, however seeing as how Turkish involvement in the war is very likely it would be wise to confiscate them to make sure it doesn't get into the hands of the enemy."
 EN1_arab_revolt: "Arab Revolt"
 EN1_arab_revolt_desc: "If we support Arab Nationalism in Hedjaz we could open up another front for the Turks to worry about, these Arabs will work closely with us to put an end to the Ottoman Empire."
 EN1_colonial_focus: "Colonial Focus"
 EN1_colonial_focus_desc: "Focusing on our colonies means helping them develop an industry"
 EN1_british_raj: "Developing British Raj"
 EN1_british_raj_desc: ""
 EN1_south_africa: "Developing South Africa"
 EN1_south_africa_desc: ""
 EN1_australia: "Developing Australia"
 EN1_australia_desc: ""
 EN1_canada: "Developing Canada"
 EN1_canada_desc: ""
 EN1_indian_manpower: "Manpower from India"
 EN1_indian_manpower_desc: "The British Raj contains millions of men ready for military service, these reserves will be of great help to our cause."
 EN1_plan_gallipoli_campaign: "Plan Gallipoli Campaign"
 EN1_plan_gallipoli_campaign_desc: "If we are to quickly knock out the Turks from the war, one way to do it would be to launch a naval invasion onto the Gallipoli peninsula taking hold and then moving onto Constantinople, a seriously important symbol of the Empire."
 EN1_execute_gallipoli: "Execute Gallipoli Invasion"
 EN1_execute_gallipoli_desc: "The time has come to launch the Gallipoli naval invasion, may God be with us!"
 EN1_canadian_troops: "Reinforcements from Canada"
 EN1_canadian_troops_desc: "If we wish, we could request several Canadian divisions over to the Western Front where they are most certainly needed."
 EN1_political_effort: "Political Effort"
 EN1_political_effort_desc: ""
 EN1_grant_south_african_indep: "Grant South Africa Independence"
 EN1_grant_south_african_indep_desc: "The cries for South African independence have not been drowned, we shall do as our people ask."
 EN1_democracy: "Democratism"
 EN1_democracy_desc: ""
 EN1_free_speech: "Free Speech"
 EN1_free_speech_desc: ""
 EN1_united_people: "United against our Enemies"
 EN1_united_people_desc: "With war approaching we must stay united against our enemies."
 EN1_defence_of_realm_act: "Defence of the Realm Act"
 EN1_defence_of_realm_act_desc: "The Defence of the Realm Act (DORA) will give the government wide-ranging powers such as requisitioning buildings or land needed for the war effort, or making regulations creating criminal offenses and authoritarian social control mechanisms, such as censorship."
 EN1_combined_war_effort_1: "War Effort"
 EN1_combined_war_effort_1_desc: ""
 EN1_military_service_act: "Military Service Act"
 EN1_military_service_act_desc: "Whilst it would be nice if conscription was not needed, we are not getting enough men through our current recruitment methods which calls for universal conscription."

