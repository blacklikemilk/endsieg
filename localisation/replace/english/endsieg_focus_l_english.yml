 GE1_A_heavy_artillery:0 "42 cm Gamma Batteries"
 GE1_A_heavy_artillery_desc:0 "German Army planners place 42 cm gamma batteries in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
 GE1_A_counter_battery:0 "Sound Ranging Sections"
 GE1_A_counter_battery_desc:0 "German Army planners place sound ranging sections in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
 GE1_A_engineer_parks:0 "Pioneer and Medical Columns"
 GE1_A_engineer_parks_desc:0 "Pioneer stores and medical columns must keep pace with the army. A common programme for field engineering and casualty evacuation will strengthen the services behind the front."
 GE1_A_medical_service:0 "Sanitätskompanien"
 GE1_A_medical_service_desc:0 "German Army planners place sanitätskompanien in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
 GE1_A_ammunition_columns:0 "Shell Train Organisation"
 GE1_A_ammunition_columns_desc:0 "German Army planners place shell train organisation in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
 GE1_A_combined_arms:0 "Infantry and Gun Liaison"
 GE1_A_combined_arms_desc:0 "German Army planners place infantry and gun liaison in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
 GE1_A_armored_support:0 "Experimental Armoured Detachments"
 GE1_A_armored_support_desc:0 "The staff will test armoured support as an alternative to massed assault infantry. Experimental vehicles will support limited attacks rather than dictate the organisation of the entire army."
 GE1_A_fire_and_movement:0 "The Assault Infantry Programme"
 GE1_A_fire_and_movement_desc:0 "Infantry and artillery will rehearse short bombardments and rapid advances. The programme gives priority to trained assault detachments rather than experimental armoured formations."
 GE1_A_trench_system:0 "Shelters and Communication Trenches"
 GE1_A_trench_system_desc:0 "German Army planners place shelters and communication trenches in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
