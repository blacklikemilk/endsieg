 TUR_befriend_germany_desc: "The British are our enemeis, they have been using us establishing their colonies from what used to be our land, exploiting our economy, there is only one way out and that is with the new order!"
 TUR_german_reform: "German Reform of the Military I"
 TUR_german_reform_desc: "The Turkish army has seen much better days, however with German training we could probably learn a great deal and in turn improve the performance of our army."
