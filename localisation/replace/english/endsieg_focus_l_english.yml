 GE1_N_naval_staff:0 "Kiel Naval School"
 GE1_N_naval_staff_desc:0 "The Kaiserliche Marine centres its programme on kiel naval school. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_coastal_yards:0 "Kiel and Wilhelmshaven Yards"
 GE1_N_coastal_yards_desc:0 "The Kaiserliche Marine centres its programme on kiel and wilhelmshaven yards. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_dockyard_training:0 "Trained Yard Artisans"
 GE1_N_dockyard_training_desc:0 "The Kaiserliche Marine centres its programme on trained yard artisans. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_reserve_crews:0 "Reserve Crews of the Hochseeflotte"
