 GE1_R_industry_shortcut:0 "Industry and Science"
 GE1_R_politics_shortcut:0 "The Imperial Constitution"
 GE1_R_diplomacy_shortcut:0 "Germany in the World"
 GE1_R_army_shortcut:0 "The Deutsches Heer"
 GE1_R_air_shortcut:0 "The Air Service"
 GE1_R_navy_shortcut:0 "The Kaiserliche Marine"
 GE1_R_berlin_industrial_court:0 "The Imperial Industrial Court"
 GE1_R_berlin_industrial_court_desc:0 "A civilian office in Berlin will arbitrate between ministries, banks and firms while leaving day-to-day management to the companies that know their trades. Its first gain is administrative coordination, not a free factory."
 GE1_R_state_railway_works:0 "State Railway Workshops"
 GE1_R_state_railway_works_desc:0 "State railway workshops can repair locomotives and rolling stock close to the eastern coalfields. The infrastructure order applies only to a controlled German core state, so the programme follows the map rather than assuming every province is available."
 GE1_R_export_capital:0 "Export Capital at Home"
 GE1_R_export_capital_desc:0 "Export houses can redirect a portion of their foreign credit network toward domestic machine tools and electrical works. Their reward is cheaper access to trade and influence, while the industrial base itself still has to be built."
 GE1_R_electrical_apparatus:0 "Electrical Apparatus Firms"
 GE1_R_electrical_apparatus_desc:0 "A few electrical firms can standardise motors, generators and control equipment for municipal and industrial customers. The research bonus represents shared engineering knowledge rather than an instant plant."
 GE1_R_university_network:0 "Link the Universities and Industry"
 GE1_R_university_network_desc:0 "The universities will cooperate with the chemical and electrical firms. Laboratory research and factory trials belong in the same programme, rather than competing for the attention of the state."
 GE1_R_technical_colleges:0 "Technical Colleges"
 GE1_R_technical_colleges_desc:0 "Technical colleges train draftsmen, chemists and foremen for the machine shops operating across the Reich. Expanding practical laboratories and links with employers gives the workshops skills that another recruitment decree cannot supply."
 GE1_R_chemical_engineering:0 "Chemical Engineering Offices"
 GE1_R_chemical_engineering_desc:0 "The chemical cartels need engineers who can move laboratory methods into safe, repeatable plant operations. This bridge turns Haber-Bosch research into practical industrial expertise before wartime substitutes are ordered."
 GE1_R_steel_cartels:0 "Steel Purchasing Cartels"
 GE1_R_steel_cartels_desc:0 "A purchasing cartel can pool orders for iron and coke, making the empire's steel works less vulnerable to fragmented procurement. The guarded addition belongs to the Saarland core and remains modest even when the state is unavailable."
 GE1_R_railway_standardisation:0 "Railway Standardisation"
 GE1_R_railway_standardisation_desc:0 "Common repair schedules and interchangeable rolling stock allow civilian and military freight to share the network more efficiently. Railway directors will coordinate workshops and operating standards so that a damaged wagon need not wait for its home district to repair it."
 GE1_R_labour_bureaux:0 "Labour Bureaux"
 GE1_R_labour_bureaux_desc:0 "A national labour register can direct volunteers, exemptions and retraining toward plants whose skilled trades are scarce. It improves factory efficiency and modestly steadies the home front without adding manpower from nowhere."
 GE1_R_war_bonds:0 "A Disciplined War Bond Market"
 GE1_R_war_bonds_desc:0 "War bonds will tap private savings for contracts, but their terms must be tied to production and future repayment. The focus gives a small political and finance benefit only once Germany is actually at war."
 GE1_R_kra_directorate:0 "Raw Materials Directorate"
 GE1_R_kra_directorate_desc:0 "Rathenaus War Raw Materials Department must establish which stocks of metals, chemicals and industrial inputs remain within the Reich. Central purchasing and allocation can direct scarce material to essential orders before rival firms consume it in competition with one another."
 GE1_R_munitions_ledger:0 "The Munitions Ledger"
 GE1_R_munitions_ledger_desc:0 "Standardized contracts and delivery ledgers expose shortages early enough for the army to change specifications. Support-equipment research gives the accounting office a concrete industrial purpose."
 GE1_R_war_finance_office:0 "War Finance Office"
 GE1_R_war_finance_office_desc:0 "A finance office coordinates bond issues, taxes and industrial contracts so the war effort does not depend on untracked advances. Its political return is small because the debt and consumer burden remain real."
 GE1_R_ersatz_agriculture:0 "Agricultural Substitutes"
 GE1_R_ersatz_agriculture_desc:0 "The blockade and army recruitment place growing pressure on the farms as well as the factories. Fertilisers, improved fodder and careful purchasing can support domestic yields, though they require scarce chemicals and a realistic division of labour with armaments production."
 GE1_R_national_research_council:0 "National Research Council"
 GE1_R_national_research_council_desc:0 "The universities, chemical firms and military offices will share priorities while leaving discoveries to the researchers who make them. The council gives electronics and industry separate, modest research bonuses that complement the established chemistry ideas."
 GE1_R_hindenburg_contracts:0 "Hindenburg Contract Offices"
 GE1_R_hindenburg_contracts_desc:0 "The new armaments quotas require offices that can audit deliveries and coordinate contracts between competing producers. Reliable accounts will expose orders that exceed available labour or railway capacity before the high command mistakes them for finished weapons."
 GE1_R_substitute_materials:0 "Domestic Material Standards"
 GE1_R_substitute_materials_desc:0 "The blockade response needs reliable standards for substitute rubber, fibres and metals. Industrial laboratories will test these products under service conditions so that emergency production strengthens the army rather than filling its depots with unusable goods."
 GE1_R_corporate_training:0 "Corporate Training Schools"
 GE1_R_corporate_training_desc:0 "War corporations can train fitters and inspectors inside their plants so expansion does not consume the entire skilled-labour reserve. Training improves efficiency through a modest idea and a single industry research bonus."
 GE1_R_worker_welfare:0 "Worker Rights in Wartime"
 GE1_R_worker_welfare_desc:0 "Safe shifts, wage arbitration and limited representation can keep critical plants operating without turning every labour dispute into a political crisis. This route grants a small welfare idea and stays mutually exclusive with output acceleration."
 GE1_R_reconstruction_credit:0 "Reconstruction Credit"
 GE1_R_reconstruction_credit_desc:0 "The treasury prepares civilian orders and railway repairs as wartime contracts approach their end. Reconstruction credit redirects investment towards employment and transport instead of allowing every armaments firm to compete for another emergency contract."
 GE1_R_demobilisation_conversion:0 "Convert the War Economy"
 GE1_R_demobilisation_conversion_desc:0 "Peace releases labour and railway capacity from the needs of the front. The government must wind down emergency armament contracts and redirect surviving workshops to civilian orders, giving the returning soldiers work instead of another mobilisation notice."
 GE1_P_prussian_franchise_tt:0 "Preserves the Prussian three-class franchise and opens conservative Reichstag hearings."
 GE1_P_universal_reichstag_franchise_tt:0 "Replaces the Prussian three-class franchise and opens the parliamentary monarchy route."
 GE1_R_federal_council:0 "Consult the Federal Princes"
 GE1_R_federal_council_desc:0 "Bavaria, Saxony and Wuerttemberg retain armies, courts and distinct interests. Consultation through the Bundesrat can secure support for a common policy without erasing the federal bargain."
 GE1_R_landowners_compromise:0 "The Conservative Agrarian Compact"
 GE1_R_landowners_compromise_desc:0 "The eastern estates supply officers and food, but their political influence meets growing resistance from industry and organised labour. A limited compact secures rural recruitment while accepting the cost of protection."
 GE1_R_kaiser_cabinet:0 "A Cabinet Answerable to the Crown"
 GE1_R_kaiser_cabinet_desc:0 "The chancellor receives his office from the emperor. Clear chains of responsibility can prevent competing advisers from turning every crisis into a struggle for access to Wilhelm."
 GE1_R_civil_service:0 "Professional State Secretaries"
 GE1_R_civil_service_desc:0 "The growing state needs administrators who can carry out policy without waiting for every court faction to agree. Professional secretaries will connect the ministries to the provinces and the industrial firms."
 GE1_R_interior_concordat:0 "A Concordat of the Federal States"
 GE1_R_interior_concordat_desc:0 "The Reich can demand common standards without treating its members as conquered provinces. An agreed division of responsibility will keep the federal governments invested in the imperial system."
 GE1_R_zabern_accountability:0 "Civilian Authority at Zabern"
 GE1_R_zabern_accountability_desc:0 "Military arrests and contempt for civilian authority in Alsace expose a constitutional fault line. The government must decide whether the officer corps stands above the courts or answers to them like any other servant of the Reich."
 GE1_R_parliamentary_chancellor:0 "The Confidence of the Reichstag"
 GE1_R_parliamentary_chancellor_desc:0 "The chancellor cannot govern indefinitely against the representatives who approve his budget. Requiring the confidence of the Reichstag will preserve the monarchy while making ministers answerable to an elected majority."
 GE1_R_collective_bargaining:0 "Recognise Collective Bargaining"
 GE1_R_collective_bargaining_desc:0 "Organised labour can help keep the workshops running if its agreements are enforceable. Recognition gives unions a legal place in negotiations and trades some recruiting freedom for reliable industrial experience."
 GE1_R_municipal_autonomy:0 "Empower the Municipal Councils"
 GE1_R_municipal_autonomy_desc:0 "The industrial cities need authority over housing, transport and public services. Elected municipal councils can administer these duties more closely than a central ministry, provided their budgets remain accountable."
 GE1_R_liberal_monarchy:0 "A Modern Constitutional Monarchy"
 GE1_R_liberal_monarchy_desc:0 "A crown that accepts parliamentary government need not disappear. Germany can retain its imperial continuity while changing who makes the decisions that carry the nation into war."
 GE1_P_war_credit_discipline_tt:0 "Opens Reichstag hearings over emergency war credits."
 GE1_R_soldiers_dependants:0 "Support Soldiers Families"
 GE1_R_soldiers_dependants_desc:0 "A man at the front leaves rent, children and lost wages behind him. Dependants relief will help households withstand the war, though the treasury and local authorities must meet the expense."
 GE1_R_womens_war_work:0 "Women in the War Workshops"
 GE1_R_womens_war_work_desc:0 "As men leave for the army, workshops must recruit women and train them for unfamiliar industrial tasks. Better organisation and safety allow the state to draw on this labour without pretending that machinery removes the need for skill."
 GE1_P_civilian_chancellery_tt:0 "Opens civilian supply coordination decisions."
 GE1_P_ohl_partnership_tt:0 "Opens army logistics decisions under the Third OHL."
 GE1_R_bethmann_authority:0 "Defend Bethmann Hollwegs Authority"
 GE1_R_bethmann_authority_desc:0 "The chancellors attempts at compromise anger the annexationists without satisfying the opposition. Supporting his office protects a civilian channel for reform and negotiation against demands that every question become a military order."
 GE1_R_reichstag_coalition:0 "An Inter-Party Committee"
 GE1_R_reichstag_coalition_desc:0 "The Centre, progressives and majority Social Democrats can coordinate their proposals through an inter-party committee. It can give the Reichstag a common position on reform and war aims despite their differences."
 GE1_R_fatherland_party:0 "The German Fatherland Party"
 GE1_R_fatherland_party_desc:0 "Tirpitz, Kapp and the annexationists rally supporters against a negotiated peace. Their movement promises that a final victory will justify the sacrifices, while opponents warn that maximal war aims leave Germany no way out of exhaustion."
 GE1_R_fatherland_party_tt:0 "Opens Fatherland Party mobilisation decisions."
 GE1_R_ohl_public_instruction:0 "Patriotic Instruction at the Front"
 GE1_R_ohl_public_instruction_desc:0 "Commanders want soldiers and workers to understand the purpose of continued sacrifice. Instruction can sustain morale, but its credibility depends on claims that survive contact with the conditions at the front."
 GE1_R_ohl_victory_mandate:0 "A Mandate for a Victorious Peace"
 GE1_R_ohl_victory_mandate_desc:0 "A strategy built on victory must concentrate resources where victory can still be won. The army will receive priority over civilian reconstruction, and the government accepts the political risk of further failure."
 GE1_R_republican_transition:0 "A Peaceful Transfer to the Republic"
 GE1_R_republican_transition_desc:0 "If the crown can no longer command confidence, an orderly transfer of authority offers an alternative to competing armed movements. Ebert and the majority Social Democrats seek a republic governed through an elected national assembly."
 GE1_R_republican_transition_tt:0 "Transfers leadership from Wilhelm II to Friedrich Ebert and establishes a parliamentary republic."
 GE1_R_victorious_settlement:0 "An Imperial Constitutional Settlement"
 GE1_R_victorious_settlement_desc:0 "Victory can vindicate the state without freezing every wartime emergency into permanent government. Crown, parliament and federal states must decide whether the victorious Reich will keep military authority or renew its constitutional bargain."
 GE1_R_social_insurance:0 "Extend Imperial Social Insurance"
 GE1_R_social_insurance_desc:0 "The Reichs social insurance system can protect industrial families against injuries and lost wages. Extending its administration gives workers a practical reason to trust the state, but employers and public funds must carry the expense."
 GE1_R_military_courts:0 "Civil Law and Military Discipline"
 GE1_R_military_courts_desc:0 "Discipline within the army must not erase civilian rights outside it. A clear jurisdiction for courts protects professional military authority from the scandal of officers deciding which laws apply to themselves."
 GE1_R_cultural_autonomy:0 "Provincial Cultural Guarantees"
 GE1_R_cultural_autonomy_desc:0 "The Reich governs communities whose loyalty cannot be reduced to a language decree. Provincial guarantees can recognise local institutions while retaining common civil obligations and the unity of the state."
 GE1_R_skilled_returnees:0 "Return Skilled Workers from the Army"
 GE1_R_skilled_returnees_desc:0 "The army and the factories compete for the same trained men. Releasing selected specialists back to industry can raise productive capacity without shortening the training of the soldiers who remain."
 GE1_R_january_strikes:0 "Negotiate over the January Strikes"
 GE1_R_january_strikes_desc:0 "The strike movement brings war weariness and demands for representation into the workshops. Negotiation costs the government authority in the short term, but offers a way to keep experienced workers at their posts."
 GE1_R_potsdam_conversations:0 "The Potsdam Conversations"
 GE1_R_potsdam_conversations_desc:0 "German and Russian interests in Persia need not turn every commercial concession into a confrontation. Negotiations over railways and regional influence can open a channel between Berlin and St Petersburg before a continental crisis tests their intentions."
 GE1_R_eastern_neutrality:0 "Seek a Russian Understanding"
 GE1_R_eastern_neutrality_desc:0 "Choose a Russian partnership instead of the Central Powers or a British alliance. Negotiate an understanding with Petrograd before ratifying a common faction."
 GE1_R_eastern_neutrality_tt:0 "Commits Germany to the Russian diplomatic path. Russian consent is required before the Berlin-Petrograd Pact can be ratified."
 GE1_R_colonial_surveys:0 "Survey the Colonial Railways"
 GE1_R_colonial_surveys_desc:0 "Railways and port approaches are the foundations of colonial administration. Surveying them identifies practical investment priorities instead of promising that every remote concession will become an industrial province."
 GE1_R_colonial_constabulary:0 "A Trained Colonial Constabulary"
 GE1_R_colonial_constabulary_desc:0 "A small locally recruited force must cover territory far larger than a European army district. Training and reliable administration offer more lasting security than ambitious claims unsupported by men and supplies."
 GE1_R_blank_cheque:0 "The July Commitment"
 GE1_R_blank_cheque_desc:0 "Vienna asks whether Berlin will stand behind it in the confrontation with Serbia. An unconditional commitment offers strength and removes restraint at the moment when mobilisation plans can outrun diplomatic choices."
 GE1_D_belgian_neutrality_guarantee_tt:0 "Prepares the Belgian protocol. The German guarantee and its obligations enter into force only after Britain accepts the coalition."
 GE1_R_persian_rail_agreement:0 "Railway Interests in Persia"
 GE1_R_persian_rail_agreement_desc:0 "German railway projects and Russian regional influence need a negotiated boundary. A commercial agreement can preserve access without pretending that Persia belongs to either power."
 GE1_R_renewed_reinsurance:0 "Ratify the Berlin-Petrograd Pact"
 GE1_R_renewed_reinsurance_desc:0 "Ratify a formal alliance built on the accepted Russian understanding. Russia must also ratify the faction; it can retain the non-aggression agreement while refusing an alliance. A ratified pact places Germany and Russia in one faction, outside the Central Powers and British bloc."
 GE1_R_balkan_guarantees:0 "A Concert of Balkan Guarantees"
 GE1_R_balkan_guarantees_desc:0 "Berlin offers a framework in which recognised frontiers and limited security guarantees take the place of annexation plans. Its success will depend on maintaining the confidence of rivals as well as friends."
 GE1_D_anglo_german_alliance_tt:0 "Britain decides whether to accept the coalition. Acceptance activates the Belgian protocol and replaces the Austrian partnership. Refusal creates no coalition or Belgian guarantee."
 GE1_R_balance_of_europe:0 "A Balance without Encirclement"
 GE1_R_balance_of_europe_desc:0 "Security does not require a client on every frontier. A balance built on agreed limits and commercial access can offer Germany room to prosper while preserving the independence of its neighbours."
 GE1_R_north_sea_convention:0 "Joint North Sea Planning"
 GE1_R_north_sea_convention_desc:0 "An alliance requires the Admiralty and our naval staff to stop planning against each other. Joint communications and patrol responsibilities will turn a diplomatic agreement into practical cooperation."
 GE1_R_continental_response:0 "Face the Continental Alliance"
 GE1_R_continental_response_desc:0 "France and Russia may answer the Anglo-German agreement with a closer continental bloc. We must prepare for that possibility while respecting the Belgian pledge on which our British partnership rests."
 GE1_R_ostasien_garrison:0 "The Tsingtao Garrison"
 GE1_R_ostasien_garrison_desc:0 "Tsingtao is a naval station with a small garrison, surrounded by the interests of stronger regional powers. Coastal preparations can protect the port, but we must not mistake a fortified concession for command of East Asia."
 GE1_R_joint_war_council:0 "An Anglo-German War Council"
 GE1_R_joint_war_council_desc:0 "The allies must agree how British maritime power and German land forces support one another. A common council will define priorities against the continental coalition rather than leave each staff fighting its old imagined war."
 GE1_mittelafrika_plan_tt:0 "Prepares African administration. Mittelafrika is formed through its existing decision after the Fate of the Colonial Empires settlement."
 GE1_R_pacific_administration:0 "Prepare an East Asian Administration"
 GE1_R_pacific_administration_desc:0 "Our Pacific possessions and any holdings obtained at the peace table require a naval and civil administration suited to the region. Preparations for a German East Asian government bring together port management, commercial offices and the needs of distant island garrisons."
 GE1_R_pacific_administration_tt:0 "Prepares Pacific administration. Territorial transfers remain in the existing Pacific Question peace event chain."
 GE1_R_peace_conference:0 "A Programme for the Peace Conference"
 GE1_R_peace_conference_desc:0 "The Foreign Office brings military, commercial and colonial demands into one negotiating programme. Victory does not remove the need to choose priorities or to build a settlement our partners can sustain."
 GE1_R_allied_procurement:0 "Coordinate Allied Procurement"
 GE1_R_allied_procurement_desc:0 "Coalition armies cannot all procure ammunition and spare parts as though they were alone. Common purchasing agreements let allied workshops meet compatible requirements without promising equipment that Germany cannot deliver."
 GE1_R_austrian_staff:0 "A Joint Staff with Vienna"
 GE1_R_austrian_staff_desc:0 "Joint staff work connects German planning to the realities of the Austro-Hungarian fronts. Liaison officers can coordinate transport and reserves while acknowledging that Vienna retains its own command responsibilities."
 GE1_R_swiss_channel:0 "The Swiss Diplomatic Channel"
 GE1_R_swiss_channel_desc:0 "Neutral Switzerland offers a place for unofficial contacts and humanitarian negotiations. Maintaining the channel gives Berlin access to messages that cannot travel through the armies facing one another."
 GE1_R_finnish_expedition:0 "A Limited Finnish Expedition"
 GE1_R_finnish_expedition_desc:0 "The Finnish conflict offers a chance to support a friendly state on the Baltic flank. A limited equipment mission helps its army while avoiding the claim that Finland can be secured by diplomacy alone."
 GE1_R_eastern_customs:0 "Customs Agreements with the Eastern States"
 GE1_R_eastern_customs_desc:0 "Customs agreements turn political influence into rules for trade and revenue. Negotiating them separately gives the eastern governments obligations they can administer instead of an economic bloc that exists only in Berlin."
 GE1_R_baltic_transit:0 "Baltic Transit Conventions"
 GE1_R_baltic_transit_desc:0 "We will propose a transit convention to the Lithuanian authorities. An accepted agreement will open the routes to German movements and allow our transport officers to exchange railway procedures."
 GE1_R_british_liaison:0 "Liaison with the British Expeditionary Staff"
 GE1_R_british_liaison_desc:0 "British officers and our general staff must learn to exchange useful information rather than the assumptions of former adversaries. Liaison arrangements align deployment, communications and support for a shared continental campaign."
 GE1_R_italian_continental_choice:0 "Assess Italys Continental Choice"
 GE1_R_italian_continental_choice_desc:0 "Italy may regard the Franco-Russian coalition as a means to settle its claims against Austria-Hungary. We must prepare for Italian participation without assuming that Rome has already accepted the opposing alliance."
 GE1_R_british_neutral_markets:0 "Trade under Allied Convoy Protection"
 GE1_R_british_neutral_markets_desc:0 "A British alliance changes the security of our sea routes. Coordinated convoy protection and chartered shipping can sustain commerce that an antagonistic Britain would instead interrupt."
 GE1_R_air_command:0 "A Unified Air Campaign Staff"
 GE1_R_air_command_desc:0 "Ground facilities, trained crews and either fighter or bomber formations are ready to operate under one campaign staff. Infantry contact flights will link the service to the field armies."
 GE1_R_AUH_reassess_alliance_tt:0 "Reviews alternatives before an exclusive alignment has been chosen. Austria-Hungary remains in the Central Powers until a new coalition is accepted."
 GE1_R_AUH_reassess_alliance:0 "Reassess the Dual Alliance"
 GE1_R_AUH_reassess_alliance_desc:0 "The Foreign Office will examine Germany's Austrian commitments before we make an exclusive diplomatic choice. The review alone changes no faction membership; Vienna remains our partner until another government accepts a new coalition."
 GE1_R_AUH_london_peace_tt:0 "Britain decides whether to accept a separate peace. Acceptance respects Belgian neutrality and replaces our Austrian alignment with the British partnership."
 GE1_R_AUH_london_peace:0 "Seek a Separate Peace with Britain"
 GE1_R_AUH_london_peace_desc:0 "A settlement with London must offer more than a pause in the naval war. We propose Belgian neutrality and naval restraint in exchange for a separate peace and a partnership that Britain can accept or reject."
 GE1_R_AUH_diplomatic_opening:0 "Review Our Austrian Interests"
 GE1_R_AUH_diplomatic_opening_desc:0 "Our British partnership leaves Austria-Hungary outside the German coalition. The Foreign Office reviews the railways, commercial ties and national movements through which Berlin can influence the future of the Danube."
 GE1_R_AUH_commercial_mission:0 "A Commercial Mission to Vienna"
 GE1_R_AUH_commercial_mission_desc:0 "Industrial firms and banks provide an opening that a military threat would close. A commercial mission tests whether Vienna will accept German concessions and the influence attached to them."
 GE1_R_AUH_trade_commission:0 "Audit the Danubian Trade Routes"
 GE1_R_AUH_trade_commission_desc:0 "Railways, customs offices and industrial supply chains connect the crownlands to Germany. A temporary trade commission identifies which links can support pressure and which would simply damage our own commerce."
 GE1_R_AUH_credit_guarantees:0 "Conditional Credit Guarantees"
 GE1_R_AUH_credit_guarantees_desc:0 "Berlin offers credit on terms that give its lenders an enduring voice in the recipient economy. The guarantees carry a real civilian cost; they must strengthen our negotiating position rather than become unconditional support for Vienna."
 GE1_R_AUH_crownland_pressure:0 "Open Contacts in the Crownlands"
 GE1_R_AUH_crownland_pressure_desc:0 "Czech, Hungarian and South Slav representatives have their own aims. Opening contacts gives them an alternative to the imperial court without pretending that German sponsorship has already created independent governments."
 GE1_R_AUH_support_czech_leaders:0 "Back Czech Constitutional Leaders"
 GE1_R_AUH_support_czech_leaders_desc:0 "Czech leaders can press for recognised political authority within their historic crownlands. German sponsorship lends weight to their demands, while Vienna must decide whether concessions or resistance better protect the empire."
 GE1_R_AUH_support_hungarian_leaders:0 "Support Hungarian Sovereignty"
 GE1_R_AUH_support_hungarian_leaders_desc:0 "Hungarian politicians insist that the crown of Saint Stephen cannot remain a subordinate instrument of a common imperial policy. Berlin supports their constitutional demands, accepting that a sovereign Hungary will retain ambitions of its own."
 GE1_R_AUH_local_leadership:0 "Agree a Crownland Programme"
 GE1_R_AUH_local_leadership_desc:0 "The national committees need a workable division of administration, transport and revenue. A common programme gives our diplomacy proposals that can be carried into a settlement rather than a collection of incompatible promises."
 GE1_R_AUH_cultural_missions:0 "Academic and Cultural Missions"
 GE1_R_AUH_cultural_missions_desc:0 "A permanent exchange between universities and technical institutes will support research across the Danube. We will establish a standing commission to organise the scholars, reports and laboratories participating in the programme."
 GE1_R_AUH_prepare_ultimatum:0 "Prepare the Danubian Settlement"
 GE1_R_AUH_prepare_ultimatum_desc:0 "The proposals now require definite terms on sovereignty, frontiers and the armed forces. Berlin and its British partner prepare a settlement that Vienna may negotiate, or that Germany may seek to enforce if the imperial court refuses."
 GE1_R_AUH_issue_ultimatum_tt:0 "Austria-Hungary may accept negotiations or refuse. Refusal provides a war goal; a military settlement requires victory."
 GE1_R_AUH_issue_ultimatum:0 "Deliver an Ultimatum to Vienna"
 GE1_R_AUH_issue_ultimatum_desc:0 "The court receives a final demand for a negotiated division of imperial authority. Refusal gives Germany a case for military enforcement; it does not grant ownership of territories our armies have not conquered."
 GE1_R_AUH_offer_settlement:0 "Offer a Negotiated Separation"
 GE1_R_AUH_offer_settlement_desc:0 "A negotiated separation offers the crown an Austrian future in exchange for recognising the sovereignty of its other lands. Vienna must consent to the proposal before Germany can impose the agreed settlement."
 GE1_R_AUH_danubian_congress:0 "Convene the Danubian Congress"
 GE1_R_AUH_danubian_congress_desc:0 "The confrontation with Vienna has reached the point where a final settlement can be concluded. Our delegates will prepare the charters, frontiers and obligations that will govern the lands of the former common state."
 GE1_R_AUH_settlement_legitimacy:0 "Ratify the Settlement Mandate"
 GE1_R_AUH_settlement_legitimacy_desc:0 "The settlement must specify who administers the provinces, who commands the armed forces, and which guarantees survive the peace. Ratification gives Berlin the mandate to choose one coherent arrangement for the former empire."
 GE1_R_AUH_independent_states_tt:0 "Austria remains independent and establishes four crownland puppets: Bohemia, Hungary, Galicia-Lodomeria and Illyria."
 GE1_R_AUH_independent_states:0 "Preserve the Austrian Crown"
 GE1_R_AUH_independent_states_desc:0 "Separate governments can give the crownlands room to govern without breaking their allegiance to Vienna. Austria will remain the seat of the dynasty, with Bohemia, Hungary, Galicia-Lodomeria and Illyria under its protection."
 GE1_R_AUH_german_protected_states_tt:0 "Austria establishes the four crownland puppets and receives a German guarantee."
 GE1_R_AUH_german_protected_states:0 "Guarantee the Crownland Settlement"
 GE1_R_AUH_german_protected_states_desc:0 "Germany will guarantee the Austrian crown and support the separate governments established under it. Vienna will retain authority over its crownland subjects, while German recognition gives the settlement a firmer foundation abroad."
 GE1_R_AUH_greater_german_austria_tt:0 "Proposes Austrian integration and German overlordship of the four crownlands. Austria may accept, offer a settlement under Vienna, or refuse. A defeated Austria must accept the imposed terms."
 GE1_R_AUH_greater_german_austria:0 "The Austrian Union Treaty"
 GE1_R_AUH_greater_german_austria_desc:0 "Union with Austria would bring Vienna and its remaining provinces into the German Empire. We must secure Austrian consent to transfer the four crownland protectorates to Berlin, or impose the settlement after victory."
 GE1_R_AUH_austrian_remnant:0 "Recognise the Empire of Austria"
 GE1_R_AUH_austrian_remnant_desc:0 "A surviving Austrian crown can give the new governments an accepted place in the Danubian order. Berlin will recognise the settlement and establish relations with the ministries in Vienna."
 GE1_R_AUH_border_guarantees:0 "Guarantee the New Frontiers"
 GE1_R_AUH_border_guarantees_desc:0 "The settlement will fail if its neighbours expect every dispute to reopen the partition. Guarantees for the independent states give Germany an obligation to uphold the frontiers it has helped establish."
 GE1_R_AUH_czech_client:0 "The Bohemian Economic Convention"
 GE1_R_AUH_czech_client_desc:0 "Bohemia's factories depend on railways linking Prague with the surrounding markets. A commercial convention will restore these connections and support the transport routes serving the new ministry."
 GE1_R_AUH_hungarian_client:0 "Reorganise Hungarian Defence"
 GE1_R_AUH_hungarian_client_desc:0 "Hungary needs a functioning defence establishment after the division of the common army. An equipment mission will help the royal ministry organise its forces and supply its regiments."
 GE1_R_AUH_south_slav_clients:0 "Cooperate with the Illyrian Government"
 GE1_R_AUH_south_slav_clients_desc:0 "The government at Zagreb must organise forces drawn from several former imperial administrations. Staff exchanges and specialist training will help Illyria defend its long frontier and Adriatic coast."
 EN1_R_peoples_budget:0 "The People's Budget"
 EN1_R_peoples_budget_desc:0 "Land valuation and progressive taxation promise the revenue required by a modern state. The Treasury must defend the settlement against vested interests."
 EN1_R_lords_veto:0 "Limit the Lords' Veto"
 EN1_R_lords_veto_desc:0 "The elected chamber cannot govern while every financial bill risks indefinite obstruction. A Parliament Act will define the limits of the upper house."
 EN1_R_national_insurance:0 "National Insurance"
 EN1_R_national_insurance_desc:0 "Insurance against sickness and unemployment gives workers a practical stake in the constitutional settlement. Administration must be built before benefits can reach them."
 EN1_R_labour_arbitration:0 "Industrial Arbitration"
 EN1_R_labour_arbitration_desc:0 "Bring employers and trade unions to a common table. Negotiated standards preserve skilled labour without handing factories unconditional privileges."
 EN1_R_labour_representation:0 "Labour at the Cabinet Table"
 EN1_R_labour_representation_desc:0 "The labour movement is too important to consult only after a strike begins. A formal channel of representation gives its leaders responsibility as well as influence."
 EN1_R_welfare_inspection:0 "Inspect Factory Conditions"
 EN1_R_welfare_inspection_desc:0 "Long shifts cannot be sustained if accidents and illness consume the skilled workforce. Factory inspectors enforce minimum conditions while keeping essential production moving."
 EN1_R_press_bureau:0 "A Responsible Press Bureau"
 EN1_R_press_bureau_desc:0 "A central bureau releases verified information and distinguishes military secrecy from embarrassing political criticism."
 EN1_R_civilian_committees:0 "Parliamentary Supply Committees"
 EN1_R_civilian_committees_desc:0 "Committees review contracts and transport bottlenecks before shortages become scandals. Civilian scrutiny and operational secrecy require carefully separated responsibilities."
 EN1_R_irish_question:0 "The Home Rule Question"
 EN1_R_irish_question_desc:0 "Ireland's parliamentary party demands self-government. Unionist opposition, the position of Ulster and the authority of the Crown make a simple proclamation impossible."
 EN1_R_home_rule:0 "Pass the Home Rule Bill"
 EN1_R_home_rule_desc:0 "Use the new parliamentary settlement to legislate an Irish administration. The bill must address local government, finance and the place of minority communities."
 EN1_R_unionist_guarantees:0 "Negotiate Unionist Guarantees"
 EN1_R_unionist_guarantees_desc:0 "Seek agreement with Unionist representatives before delegating powers. Negotiation preserves an alternative to imposing a settlement by force."
 EN1_R_ulster_conference:0 "The Ulster Conference"
 EN1_R_ulster_conference_desc:0 "Local security, representation and the limits of delegated authority must be agreed openly. A conference offers a chance to prevent armed camps from defining the future."
 EN1_R_implement_home_rule:0 "Implement the Irish Compact"
 EN1_R_implement_home_rule_desc:0 "Transfer ordinary local administration to an elected Irish body with minority safeguards. A settled constitutional question deprives revolutionary organisations of their strongest argument."
 EN1_R_suspend_home_rule:0 "Suspend Implementation for the War"
 EN1_R_suspend_home_rule_desc:0 "Postpone implementation while the country is at war. The delay must remain a declared emergency measure rather than a silent abandonment of the promise."
 EN1_R_irish_convention:0 "An Irish Convention"
 EN1_R_irish_convention_desc:0 "Invite constitutional representatives to propose a workable settlement. Renewed discussion may succeed where wartime postponement and coercion have failed."
 EN1_R_local_guarantees:0 "Local Government Guarantees"
 EN1_R_local_guarantees_desc:0 "A settlement must safeguard schools, local taxation and representation. Credible guarantees are more durable than a temporary police operation."
 EN1_prepare_for_war_desc:0 "A continental crisis requires reliable cabinet procedures, mobilization notices and parliamentary authority. Preparing them is a political responsibility as much as a military one."
 EN1_R_civilian_war_control:0 "Retain Civilian War Controls"
 EN1_R_civilian_war_control_desc:0 "Keep exceptional orders subject to parliamentary review. The government accepts slower approval in exchange for a firmer basis of public consent."
 EN1_R_coalition_1915:0 "The Coalition Government"
 EN1_R_coalition_1915_desc:0 "The burdens of war expose the limits of a narrow ministry. Invite opposition and labour representatives to share responsibility without suspending parliamentary government."
 EN1_R_asquith_continuity:0 "Keep Asquith at the Helm"
 EN1_R_asquith_continuity_desc:0 "The prime minister will remain the arbiter of departmental disputes. Strengthen cabinet committees rather than replacing parliamentary government with a narrow executive."
 EN1_R_lloyd_george_cabinet:0 "Lloyd George's War Cabinet"
 EN1_R_lloyd_george_cabinet_desc:0 "A smaller war cabinet takes continuous charge of operations and supply. Lloyd George offers relentless direction, but the new machinery will face scrutiny of its own."
 EN1_R_departmental_coordination:0 "Coordinate the Departments"
 EN1_R_departmental_coordination_desc:0 "Give the Treasury, War Office and Admiralty a shared schedule for procurement. Departmental independence need not mean incompatible priorities."
 EN1_R_unionist_committee:0 "A Unionist Working Agreement"
 EN1_R_unionist_committee_desc:0 "Secure opposition support through a negotiated programme. No party should be expected to surrender its principles without influence over the conduct of the war."
 EN1_R_war_secretariat:0 "The Cabinet Secretariat"
 EN1_R_war_secretariat_desc:0 "Permanent records and a disciplined secretariat turn a small cabinet into an effective executive. Decisions must reach departments as clear orders rather than recollections."
 EN1_R_imperial_war_cabinet:0 "The Imperial War Cabinet"
 EN1_R_imperial_war_cabinet_desc:0 "Dominion leaders must have a voice in the strategy for which their soldiers fight. Convene a common council while recognising that consultation does not erase national interests."
 EN1_R_reserved_occupations:0 "Reserve Essential Occupations"
 EN1_R_reserved_occupations_desc:0 "Coal miners, railway workers and skilled machinists cannot simply be replaced at the factory gate. Formal exemptions keep military recruitment from paralysing supply."
 EN1_R_service_tribunals:0 "Civilian Exemption Tribunals"
 EN1_R_service_tribunals_desc:0 "Local tribunals assess claims consistently and protect essential workers from arbitrary call-up. Better administration shortens delays without promising unlimited manpower."
 EN1_R_women_in_service:0 "Women in National Service"
 EN1_R_women_in_service_desc:0 "Organise civilian and auxiliary services so trained soldiers can return to the front. Recruitment and accommodation must be planned as carefully as factory substitution."
 EN1_R_franchise_reform:0 "Representation of the People"
 EN1_R_franchise_reform_desc:0 "An electorate transformed by war cannot be governed under the old franchise. Reform representation and registration while preserving constitutional continuity."
 EN1_R_reconstruction_committee:0 "The Reconstruction Committee"
 EN1_R_reconstruction_committee_desc:0 "Prepare housing, employment and demobilization plans before the armies return. Peace will require its own administrative machinery."
 EN1_R_close_emergency_powers:0 "Close the Emergency Departments"
 EN1_R_close_emergency_powers_desc:0 "End exceptional wartime administration in an orderly fashion. Civilian government must recover the responsibilities temporarily delegated to emergency bodies."
 EN1_R_parliamentary_settlement:0 "A Parliamentary Settlement"
 EN1_R_parliamentary_settlement_desc:0 "Make the postwar settlement the product of Parliament and public negotiation. Military victory alone cannot determine the constitution of the coming peace."
 EN1_R_haldane_mission:0 "Haldane's Mission to Berlin"
 EN1_R_haldane_mission_desc:0 "Test whether a negotiated naval understanding can arrest the arms race. Talks cannot settle Belgian neutrality or continental obligations without explicit concessions from Berlin."
 EN1_R_naval_convention:0 "Negotiate a Naval Convention"
 EN1_R_naval_convention_desc:0 "Offer practical limits on rivalry. Ratification requires Germany to complete its naval-restraint programme and publicly pledge Belgian neutrality."
 EN1_R_german_offer:0 "Request a German Treaty Offer"
 EN1_R_german_offer_desc:0 "A British initiative is insufficient on its own. Ask Berlin to submit a formal treaty only after its naval and Belgian commitments are in place."
 EN1_R_belgian_guarantee:0 "Affirm Belgian Neutrality"
 EN1_R_belgian_guarantee_desc:0 "The treaty guarantee must be explicit before a crisis arrives. Belgium's security will not be traded away in a private understanding with a great power."
 EN1_R_allied_war_council:0 "An Allied War Council"
 EN1_R_allied_war_council_desc:0 "Agree a common sequence of offensives and supply priorities. Britain contributes an independent voice without abandoning the war it has chosen to fight."
 EN1_R_ratify_berlin:0 "Ratify the Berlin Understanding"
 EN1_R_ratify_berlin_desc:0 "The naval convention and Belgian guarantee have produced a real alliance. Ratify its machinery after both governments accept, then build a strategy together."
 EN1_R_channel_agreement:0 "The Channel Agreement"
 EN1_R_channel_agreement_desc:0 "Coordinate sea lanes and coastal security without ceding British ports to a foreign army. Clear responsibilities will prevent misunderstandings."
 EN1_R_german_staff:0 "A Joint Staff Secretariat"
 EN1_R_german_staff_desc:0 "Germany's army and Britain's navy need common planning calendars. Joint staff officers will translate promises into compatible operational preparations."
 EN1_R_continental_containment:0 "Contain the Continental Coalition"
 EN1_R_continental_containment_desc:0 "France and Russia may answer our agreement with a continental coalition. Prepare against an actual hostile alignment while leaving neutral governments outside our war plans."
 EN1_R_belgian_treaty:0 "Enforce the Belgian Treaty"
 EN1_R_belgian_treaty_desc:0 "Our alliance rests on respect for Belgian neutrality. Keep liaison missions and guarantees visible so strategic cooperation cannot quietly override the treaty."
 EN1_R_danubian_observers:0 "Observers on the Danube"
 EN1_R_danubian_observers_desc:0 "Send observers to the German negotiations over the Habsburg lands. Britain supports negotiated frontiers and protected minorities rather than automatic annexation."
 EN1_R_neutral_inspection:0 "Neutral Shipping Inspections"
 EN1_R_neutral_inspection_desc:0 "Publish inspection procedures that apply consistently to belligerents. Predictable rules keep merchant vessels moving without secretly committing us to one alliance."
 EN1_R_neutral_mediation:0 "Offer European Mediation"
 EN1_R_neutral_mediation_desc:0 "Offer a channel for negotiations between the belligerents. A conference can be proposed, but foreign governments will decide whether they are ready to use it."
 EN1_R_neutral_ports:0 "Defend Neutral Ports"
 EN1_R_neutral_ports_desc:0 "Coastal garrisons and port inspection teams protect neutrality in practice. Neither side may treat British harbours as a convenient military base."
 EN1_R_american_purchasing:0 "The American Purchasing Mission"
 EN1_R_american_purchasing_desc:0 "Coordinate contracts and shipping for American supplies. A purchasing mission avoids competing departments bidding against one another."
 EN1_R_greek_guarantees:0 "Guarantees for Greece"
 EN1_R_greek_guarantees_desc:0 "Coordinate with a willing Greek government and protect its front. A divided court and parliament cannot be treated as an unlimited reservoir of allied troops."
 EN1_R_romanian_mission:0 "The Romanian Military Mission"
 EN1_R_romanian_mission_desc:0 "Offer planning and equipment to a Romania already sharing our war. Assistance supports its chosen alignment without forcing a declaration against a neutral Russia."
 EN1_R_ottoman_accommodation:0 "An Ottoman Accommodation"
 EN1_R_ottoman_accommodation_desc:0 "Keep negotiations open with Constantinople and honour commercial contracts. Cooperation offers an alternative to turning every Near Eastern dispute into a British war."
 EN1_R_levant_mission:0 "The Levant Liaison Mission"
 EN1_R_levant_mission_desc:0 "Keep liaison officers and supply columns in contact with local forces. Political promises must be recorded before the fighting ends."
 EN1_R_ottoman_trade:0 "Eastern Mediterranean Trade"
 EN1_R_ottoman_trade_desc:0 "Commercial representatives coordinate trade and port inspection with a neutral Ottoman government. The arrangement ends if the two countries go to war."
 EN1_R_peace_terms:0 "Prepare British Peace Terms"
 EN1_R_peace_terms_desc:0 "Assemble a negotiating position consistent with the war Britain has actually fought. No foreign colony will change hands simply because a memorandum has been written."
 EN1_R_demobilisation:0 "Return to Civilian Administration"
 EN1_R_demobilisation_desc:0 "Close temporary war departments and apply the existing demobilization ledger to wartime factories. Permanent industry and player-built factories must remain."
 EN1_R_expeditionary_planning:0 "Expeditionary Planning Board"
 EN1_R_expeditionary_planning_desc:0 "Review ports, escorts and supply before proposing a landing. A theatre plan grants preparation, not divisions teleported into enemy territory."
 EN1_R_western_concentration:0 "Concentrate on the Western Front"
 EN1_R_western_concentration_desc:0 "Commit shipping and staff work to the main allied front. A deliberate concentration avoids dissipating strength in poorly supplied peripheral campaigns."
 EN1_R_salonika_supply:0 "The Salonika Supply Mission"
 EN1_R_salonika_supply_desc:0 "Supply a friendly Greek front through ports held by our partners. The mission supports Greece without ignoring a neutral or hostile government."
 EN1_I_railway_coordination:0 "Railway Coordination"
 EN1_I_railway_coordination_desc:0 "Railway companies receive a common wartime timetable so coal, food, shells and civilian freight are moved in an accountable order."
 EN1_I_steel_contracts:0 "Steel Contracts"
 EN1_I_steel_contracts_desc:0 "Long contracts for steel, coke and plates let British works plan production before emergency shell orders overwhelm them."
 EN1_I_treasury_preparation:0 "Treasury Preparation"
 EN1_I_treasury_preparation_desc:0 "The Treasury aligns tax receipts, short credit and procurement schedules before the state commits to open ended wartime finance."
 EN1_I_munitions_committee:0 "Munitions Committee"
 EN1_I_munitions_committee_desc:0 "Give the coal and steel boards a permanent forum to schedule shells before the front asks for them."
 EN1_I_empire_materials:0 "Imperial Materials Office"
 EN1_I_empire_materials_desc:0 "Colonial producers can supplement copper, rubber, food and other inputs when London provides contracts and shipping rather than slogans."
 EN1_I_ministry_of_munitions:0 "Ministry of Munitions"
 EN1_I_ministry_of_munitions_desc:0 "The Ministry of Munitions gives emergency procurement a single ledger and a clear chain of responsibility."
 EN1_I_shell_factories:0 "Shell Filling Plants"
 EN1_I_shell_factories_desc:0 "New filling plants are placed in British core states with free capacity, so the shell programme expands real workshops without creating off map factories."
 EN1_I_rail_freight_priority:0 "Rail Freight Priorities"
 EN1_I_rail_freight_priority_desc:0 "The railway directorate gives mines, ports and shell plants priority schedules that can be measured in wagons and repair capacity."
 EN1_I_steel_standardisation:0 "Steel Standardisation"
 EN1_I_steel_standardisation_desc:0 "Common gauges and grades let steel mills exchange orders without rebuilding every rolling line for each ministry."
 EN1_I_mobilisation_credit:0 "Mobilisation Credit"
 EN1_I_mobilisation_credit_desc:0 "Bank credit is tied to signed orders, available materials and Treasury oversight so wartime borrowing remains connected to output."
 EN1_I_shipyard_program:0 "Shipyard Expansion Programme"
 EN1_I_shipyard_program_desc:0 "A timed yard programme coordinates hull orders and repair work at British core ports with existing dockyard capacity."
 EN1_I_engineering_research:0 "Industrial Engineering Offices"
 EN1_I_engineering_research_desc:0 "Universities and works share practical engineering problems in metallurgy, chemistry and machine tools."
 EN1_I_liberal_welfare:0 "The 1911 Social Insurance Settlement"
 EN1_I_liberal_welfare_desc:0 "Liberal welfare and social insurance already exist before the war; maintaining them carries an administrative cost instead of granting a free stability windfall."
 EN1_I_training_schools:0 "Factory Training Schools"
 EN1_I_training_schools_desc:0 "Training schools replace skilled workers lost to the army and prepare apprentices for munitions, rail and shipyard work."
 EN1_I_technical_offices:0 "Technical Standards Offices"
 EN1_I_technical_offices_desc:0 "Standards offices make civilian tooling, fuses and vehicle parts interchangeable across firms taking emergency orders."
 EN1_I_dockyard_organisation:0 "Dockyard Organisation"
 EN1_I_dockyard_organisation_desc:0 "Dockyard managers coordinate steel deliveries, slips and repairs so naval orders do not strand merchant construction."
 EN1_I_controlled_labour:0 "Controlled Labour Exchanges"
 EN1_I_controlled_labour_desc:0 "Labour exchanges direct volunteers and exemptions to plants whose output chain is most exposed to shortages."
 EN1_I_steel_reserves:0 "Steel Reserve Contracts"
 EN1_I_steel_reserves_desc:0 "Reserve contracts for steel and coke smooth the peaks in shell and ship production without inventing new resource deposits."
 EN1_I_munitions_standard:0 "Munitions Standardisation"
 EN1_I_munitions_standard_desc:0 "Common shell gauges and inspection standards let smaller works join the munitions chain without wasteful retooling."
 EN1_I_treasury_oversight:0 "Treasury Oversight"
 EN1_I_treasury_oversight_desc:0 "Treasury auditors connect war loans, imports and contracts so procurement can be expanded without pretending debt has vanished."
 EN1_I_us_supply:0 "American Supply Contracts"
 EN1_I_us_supply_desc:0 "American credit and supply contracts widen Britain's import margin while keeping the financial and shipping commitment visible."
 EN1_I_war_production:0 "War Production Schedule"
 EN1_I_war_production_desc:0 "Tie standard shells, controlled labour and treasury oversight to a single British output plan."
 EN1_I_demobilisation_planning:0 "Plan Demobilisation"
 EN1_I_demobilisation_planning_desc:0 "The government prepares to release wartime labour and remove only the arms capacity this branch marked, alongside the established Endsieg demobilisation helpers."
 EN1_I_reconversion:0 "Managed Reconversion"
 EN1_I_reconversion_desc:0 "Prepare factories and dockyards to return to civilian orders without losing the skills built during the war."
 EN1_I_peacetime_orders:0 "Peacetime Orders"
 EN1_I_peacetime_orders_desc:0 "Civilian rail, housing and machine orders absorb returning labour without granting factories outside the state map."
 EN1_I_industry_legacy:0 "The Industrial Legacy"
 EN1_I_industry_legacy_desc:0 "The wartime state leaves behind engineering schools, standards and contracts that can support measured civilian research."
 EN1_E_direct_administration:0 "Direct Administration"
 EN1_E_direct_administration_desc:0 "Governors and the Colonial Office retain tighter control over taxation, appointments and wartime requisition."
 EN1_E_imperial_conference:0 "Imperial Conference"
 EN1_E_imperial_conference_desc:0 "Dominion ministers receive a standing forum where defence, trade and constitutional changes can be negotiated."
 EN1_E_colonial_office:0 "Strengthen the Colonial Office"
 EN1_E_colonial_office_desc:0 "A stronger Colonial Office coordinates governors and wartime requisitions through a single administrative chain."
 EN1_E_dominion_trade:0 "Dominion Trade Agreements"
 EN1_E_dominion_trade_desc:0 "Dominion producers receive predictable contracts and preferential access in return for reliable wartime deliveries."
 EN1_E_crown_revenue:0 "Crown Colony Revenue"
 EN1_E_crown_revenue_desc:0 "Directly administered colonies contribute through negotiated revenue and infrastructure contracts rather than arbitrary extraction."
 EN1_E_imperial_federation:0 "Imperial Federation Debate"
 EN1_E_imperial_federation_desc:0 "A federation offers a constitutional future for self-governing partners, with representation carrying real obligations as well as prestige."
 EN1_E_governors:0 "Imperial Governors"
 EN1_E_governors_desc:0 "The governor system is tightened to ensure Colonial Office instructions reach ports, railways and wartime stores."
 EN1_E_indian_reform_link:0 "Indian Constitutional Link"
 EN1_E_indian_reform_link_desc:0 "London offers a credible constitutional path while leaving the main Indian dominion and autonomy decisions to the political branch."
 EN1_E_african_development:0 "African Development Boards"
 EN1_E_african_development_desc:0 "Development boards coordinate rail, port and agricultural investment through local priorities and available imperial contracts."
 EN1_E_canadian_procurement:0 "Canadian Procurement"
 EN1_E_canadian_procurement_desc:0 "Canadian factories receive long contracts for food, shells and vehicles, giving the dominion a practical voice in imperial supply."
 EN1_E_australian_shipyards:0 "Australian Shipyards"
 EN1_E_australian_shipyards_desc:0 "Australian yards and repair stations join the imperial shipping programme under negotiated orders and shared standards."
 EN1_E_overseas_volunteers:0 "Overseas Volunteer Bureaux"
 EN1_E_overseas_volunteers_desc:0 "Recruitment bureaux coordinate volunteers from the dominions and colonies while respecting their governments' authority."
 EN1_E_colonial_materials:0 "Colonial Materials Contracts"
 EN1_E_colonial_materials_desc:0 "Imperial contracts secure food, fibres and metals through prices and shipping schedules that can actually be audited."
 EN1_E_commonwealth_council:0 "Commonwealth Council"
 EN1_E_commonwealth_council_desc:0 "A permanent council lets dominions and colonies review defence and procurement commitments before each new programme."
 EN1_E_imperial_defence:0 "Imperial Defence Council"
 EN1_E_imperial_defence_desc:0 "Defence planning joins naval stations, dominion forces and colonial logistics without erasing their political choices."
 EN1_E_respect_alliance:0 "Respect the Alliance"
 EN1_E_respect_alliance_desc:0 "Britain recognises partner governments as allies with their own mandates, making cooperation durable even when London cannot dictate terms."
 EN1_E_imperial_contracts:0 "Imperial Contracts"
 EN1_E_imperial_contracts_desc:0 "London keeps the empire together through binding procurement contracts and central standards, accepting the political cost of closer control."
 EN1_frontline_focus_2_desc:0 "Coordinate artillery, engineers, and reserves across the line."
 EN1_haldane_professional_army:0 "Haldane’s Professional Army"
 EN1_haldane_professional_army_desc:0 "Preserve the General Staff, expeditionary planning, and regular standards."
 EN1_territorial_force:0 "Territorial Force"
 EN1_territorial_force_desc:0 "Make the Territorial Army a credible second line through annual training."
 EN1_kitchener_volunteers:0 "Kitchener’s Volunteers"
 EN1_kitchener_volunteers_desc:0 "Answer the 1914 emergency with voluntary recruitment and New Armies."
 EN1_shell_committee:0 "Ministry of Munitions"
 EN1_shell_committee_desc:0 "Put shells, labour, and industrial contracts under wartime direction."
 EN1_creeping_barrage:0 "Creeping Barrage"
 EN1_creeping_barrage_desc:0 "Develop timed artillery lifts behind which infantry can advance."
 EN1_combined_arms:0 "All Arms Planning"
 EN1_combined_arms_desc:0 "Let infantry, artillery and the new tank formations train against one shared battle plan."
 EN1_tank_corps:0 "Form the Tank Corps"
 EN1_tank_corps_desc:0 "Give the new armoured arm dedicated training and maintenance."
 EN1_western_front_logistics:0 "Western Front Logistics"
 EN1_western_front_logistics_desc:0 "Improve railheads, motor transport, and depot organisation."
 EN1_mesopotamia_expedition:0 "Mesopotamian Expedition"
 EN1_mesopotamia_expedition_desc:0 "Treat Iraq as a separate theatre with river transport and command."
 EN1_gallipoli_lessons:0 "Gallipoli Lessons"
 EN1_gallipoli_lessons_desc:0 "Turn the failed Dardanelles expedition into an amphibious planning school."
 EN1_egypt_expeditionary_force:0 "Egypt Expeditionary Force"
 EN1_egypt_expeditionary_force_desc:0 "Build a mobile imperial army around Egypt and the Suez base."
 EN1_indian_expeditionary_force:0 "Indian Expeditionary Force"
 EN1_indian_expeditionary_force_desc:0 "Coordinate Indian Army formations across the imperial theatres."
 EN1_dreadnought_desc:0 "Build all-big-gun battleships for the German naval challenge."
 EN1_battle_cruiser_effort_desc:0 "Maintain fast capital ships for raiders and distant stations."
 EN1_admiralty_reform:0 "Admiralty Reform"
 EN1_admiralty_reform_desc:0 "Clarify civilian and naval responsibilities during a global war."
 EN1_naval_budget:0 "Dreadnought Budget"
 EN1_naval_budget_desc:0 "Protect naval appropriations through the naval race."
 EN1_grand_fleet:0 "The Grand Fleet"
 EN1_grand_fleet_desc:0 "Concentrate the battle fleet at Scapa Flow."
 EN1_limited_naval_agreement:0 "Limited Naval Agreement"
 EN1_limited_naval_agreement_desc:0 "Pursue a negotiated limit if British security is preserved."
 EN1_north_sea_patrols:0 "North Sea Patrols"
 EN1_north_sea_patrols_desc:0 "Close the approaches with destroyers, cruisers, and observation."
 EN1_naval_gunnery:0 "Jellicoe’s Gunnery Standards"
 EN1_naval_gunnery_desc:0 "Raise fire-control and salvo discipline."
 EN1_mine_warfare:0 "Mine Warfare"
 EN1_mine_warfare_desc:0 "Lay defensive minefields and clear enemy mines."
 EN1_destroyer_flotillas:0 "Destroyer Flotillas"
 EN1_destroyer_flotillas_desc:0 "Mass small combatants into permanent escort groups."
 EN1_submarine_defence:0 "Anti-Submarine Defence"
 EN1_submarine_defence_desc:0 "Coordinate hydrophones, patrol craft, and intelligence."
 EN1_convoy_system:0 "Organised Convoy System"
 EN1_convoy_system_desc:0 "Make escort allocation and merchant routing a standing naval responsibility."
 EN1_hunter_killer_groups:0 "Hunter-Killer Groups"
 EN1_hunter_killer_groups_desc:0 "Combine destroyers, trawlers, and intelligence."
 EN1_merchant_shipping:0 "Merchant Shipping Board"
 EN1_merchant_shipping_desc:0 "Coordinate requisition, repair, and loading of merchantmen."
 EN1_armed_trawlers:0 "Armed Trawlers"
 EN1_armed_trawlers_desc:0 "Use civilian fishing craft for minesweeping and harbour defence."
 EN1_naval_aviation:0 "Naval Air Service"
 EN1_naval_aviation_desc:0 "Put seaplanes and coastal reconnaissance under Admiralty direction."
 EN1_royal_marines:0 "Royal Marines Expansion"
 EN1_royal_marines_desc:0 "Expand Marines for raids, ship security, and landings."
 EN1_dardanelles_support:0 "Dardanelles Support"
 EN1_dardanelles_support_desc:0 "Commit naval fire support and mine-clearing to Gallipoli."
 EN1_aegean_landing_force:0 "Aegean Landing Force"
 EN1_aegean_landing_force_desc:0 "Retain an eastern Mediterranean landing capability."
 EN1_egypt_naval_support:0 "Suez Naval Support"
 EN1_egypt_naval_support_desc:0 "Use the fleet to sustain Egypt and the Suez route."
 EN1_admiralty_air_service:0 "Admiralty Air Service"
 EN1_admiralty_air_service_desc:0 "Give naval aviation reconnaissance and coastal patrol capacity."
 EN1_royal_flying_corps:0 "Royal Flying Corps"
 EN1_royal_flying_corps_desc:0 "Expand army aviation for observation and spotting."
 EN1_raf_merger_1918:0 "The Independent Air Force"
 EN1_raf_merger_1918_desc:0 "Bring the Royal Flying Corps and naval air arm into an operational service with its own command."
 EN1_I_import_control:0 "Import Control Office"
 EN1_I_import_control_desc:0 "The Import Control Office allocates shipping space to food and strategic materials while accepting that blockade pressure cannot be wished away."
 EN1_E_economic_cooperation:0 "Economic Cooperation"
 EN1_E_economic_cooperation_desc:0 "The empire's future is negotiated through reciprocal trade, credit and technical exchange rather than a single imperial command."
 EN1_I_skilled_labour:0 "Protect Skilled Labour"
 EN1_I_skilled_labour_desc:0 "Exemptions and training preserve the fitters, boilermakers and electricians who cannot be replaced by a hurried draft."
 EN1_I_controlled_mobilisation:0 "Controlled Mobilisation"
 EN1_I_controlled_mobilisation_desc:0 "Mobilisation must raise output without stripping every skilled worker from the mines, railways and shipyards that sustain it."
 EN1_I_war_loans:0 "War Loans"
 EN1_I_war_loans_desc:0 "War loans tap private savings for procurement while their cost and repayment remain visible to the government."
 EN1_I_us_credit:0 "Seek American Credit"
 EN1_I_us_credit_desc:0 "American credit can sustain imports and orders after 1917, but it is a diplomatic and financial commitment rather than free production."
 EN1_I_coal_board:0 "The Coal Board"
 EN1_I_coal_board_desc:0 "A coal board keeps mines, rail sidings and power stations supplied while military traffic begins to compete for every wagon."
 EN1_I_merchant_shipping:0 "Merchant Shipping Priority"
 EN1_I_merchant_shipping_desc:0 "Merchant hulls and repair berths receive a common priority because imported food and materials are part of British industry."
 EN1_I_export_board:0 "The Export Board"
 EN1_I_export_board_desc:0 "The Export Board preserves foreign orders and exchange earnings that can be redirected toward British imports and machine tools."
 EN1_I_import_dependence:0 "Plan for Import Dependence"
 EN1_I_import_dependence_desc:0 "Britain's coal and factories are powerful, but food, nitrates and strategic materials still arrive by sea and must be budgeted honestly."
 EN1_E_self_government:0 "Colonial Self-Government"
 EN1_E_self_government_desc:0 "Responsible institutions and local legislatures can bind the empire through consent and practical cooperation."
 EN1_I_aircraft_workshops:0 "Aircraft Workshops"
 EN1_I_aircraft_workshops_desc:0 "Aircraft workshops standardise engines and airframes through the existing industrial base instead of promising an unsupported air research leap."
 EN1_I_timed_works:0 "Timed Works Programme"
 EN1_I_timed_works_desc:0 "A short works programme repairs transport bottlenecks and plant utilities before the next procurement season."
 EN1_I_shipbuilding_board:0 "The Shipbuilding Board"
 EN1_I_shipbuilding_board_desc:0 "A central board links Admiralty orders to merchant yards, hull standards and scarce skilled shipwrights."
 INT_GER_officer_corps_bonus:0 "Secure the Officer Corps — Mastery Programme"
 INT_GER_clandestine_staff_bonus:0 "Clandestine Staff Exercises — Mastery Programme"
 INT_GER_rapallo_doctrine_bonus:0 "Reichswehr–Red Army Contacts — Mastery Programme"
 doctrine_bonus_1:0 "Improved Tactics IV — Mastery Programme"
 SO2_INT_left_doctrine_bonus:0 "An International Bureau — Mastery Programme"
 SO2_INT_comintern_doctrine_bonus:0 "Comintern Cadre Schools — Mastery Programme"
 SO2_INT_academy_bonus:0 "Reform the Red Army Academies — Mastery Programme"
 SO2_INT_deep_operations_bonus:0 "Study Deep Operations — Mastery Programme"
 WHR_INT_siberian_doctrine_bonus:0 "Siberian Command School — Mastery Programme"
 GE1_A_general_staff_bonus:0 "Reform the Großer Generalstab — Mastery Programme"
 GE1_A_railway_mobilisation_bonus:0 "Railway Mobilisation Tables — Mastery Programme"
 GE1_A_combined_arms_bonus:0 "Infantry and Gun Liaison — Mastery Programme"
 GE1_A_fire_and_movement_bonus:0 "Feuerwalze and Movement — Mastery Programme"
 GE1_A_elastic_defence_bonus:0 "Flexible Forward Zones — Mastery Programme"
 GE1_A_depth_defence_bonus:0 "Defence in Depth — Mastery Programme"
 GE1_A_infiltration_groups_bonus:0 "Stoßtrupp Infiltration — Mastery Programme"
 GE1_A_assault_reserves_bonus:0 "Storm Reserve Battalions — Mastery Programme"
 GE1_A_eastern_command_bonus:0 "Ober Ost Field Command — Mastery Programme"
 GE1_A_railway_redeployment_bonus:0 "East-West Rail Transfer — Mastery Programme"
 GE1_A_eastern_redeployment_bonus:0 "Westward Army Group Transfer — Mastery Programme"
 GE1_A_kaiserschlacht_bonus:0 "The Kaiserschlacht — Mastery Programme"
 endsieg_land_mastery_programme:0 "Land Doctrine Mastery"
 WHR_INT_winter_bonus:0 "Winter — Mastery Programme"
 INT_SOV_staff_bonus:0 "Staff — Mastery Programme"
 INT_SOV_logistics_doctrine_bonus:0 "Logistics — Mastery Programme"
 FR3_R_industry_shortcut:0 "Industry"
 FR3_R_empire_shortcut:0 "Empire"
 FR3_R_politics_shortcut:0 "Politics"
 FR3_R_diplomacy_shortcut:0 "Diplomacy"
 FR3_R_army_shortcut:0 "Army"
 FR3_R_navy_shortcut:0 "Navy"
 FR3_R_air_shortcut:0 "Air Service"
 FR3_R_civil_service:0 "The Prefects and Ministries"
 FR3_R_civil_service_desc:0 "Give the prefectures a common register for labour, transport and emergency accommodation. Local administration must be prepared before national orders begin to arrive."
 FR3_R_parliamentary_scrutiny:0 "Parliamentary Scrutiny"
 FR3_R_parliamentary_scrutiny_desc:0 "Armaments contracts require scrutiny as well as speed. Parliamentary commissions will compare specifications, prices and deliveries before shortages become a scandal."
 FR3_R_workers_insurance:0 "Workers' and Farmers' Pensions"
 FR3_R_workers_insurance_desc:0 "Administer the new social-insurance settlement through reliable local records. Reform must deliver services rather than simply adding another declaration to the statute book."
 FR3_R_labour_compact:0 "A Compact with Organised Labour"
 FR3_R_labour_compact_desc:0 "Bring representatives of essential trades into regular negotiations. Workers receive a voice in conditions and exemptions while accepting responsibility for maintaining critical services."
 FR3_R_social_republic:0 "A Social Republic"
 FR3_R_social_republic_desc:0 "Strengthen parliamentary social reform through labour representation and practical public services. A broader republican coalition offers an alternative to treating every industrial dispute as a security crisis."
 FR3_R_civic_order:0 "Civic Order and Local Compromise"
 FR3_R_civic_order_desc:0 "Preserve the existing balance between ministries, municipalities and employers. Resolve industrial disputes through defined procedures while avoiding an unlimited transfer of power to either side."
 FR3_R_local_reform:0 "Municipal Reform Commissions"
 FR3_R_local_reform_desc:0 "Let municipalities propose improvements to housing, inspections and transport. The government will coordinate practical services instead of promising a universal political cure."
 FR3_R_sfio_consultation:0 "The SFIO Delegation"
 FR3_R_sfio_consultation_desc:0 "Consult socialist deputies on the army, public services and labour conditions. Parliamentary participation gives the delegation responsibility without assuming that a revolutionary takeover is inevitable."
 FR3_R_protect_jaures:0 "Protect the Peace Delegation"
 FR3_R_protect_jaures_desc:0 "Threats against advocates of negotiation demand a clear response from the police and courts. Protect the delegation before violence closes the parliamentary route to de-escalation."
 FR3_R_social_cabinet:0 "A Cabinet of Social Reform"
 FR3_R_social_cabinet_desc:0 "Give a reforming ministry authority to pursue labour legislation and a less confrontational foreign policy. Its survival will depend on an explicit parliamentary mandate."
 FR3_R_responsible_budget:0 "An Accountable Budget"
 FR3_R_responsible_budget_desc:0 "Separate ordinary expenditure from exceptional defence appropriations. Parliament can authorise urgent purchases without abandoning scrutiny of how public money is used."
 FR3_R_reserve_administration:0 "Civilian Mobilisation Records"
 FR3_R_reserve_administration_desc:0 "Update reservist records, railway notices and depot assignments. Correct paperwork cannot replace training, but it can keep trained men from being sent to the wrong place."
 FR3_R_constitutional_debate:0 "The Constitutional Debate"
 FR3_R_constitutional_debate_desc:0 "Critics demand a more forceful executive while republican leaders defend parliamentary control. Any change must define who can issue exceptional orders and how those powers will end."
 FR3_R_parliamentary_executive:0 "Retain Parliamentary Direction"
 FR3_R_parliamentary_executive_desc:0 "Keep responsibility for the government with a majority in the Chamber. Stronger administration will come through cabinet machinery and committees rather than an exceptional presidency."
 FR3_R_presidential_authority:0 "An Exceptional Presidential Mandate"
 FR3_R_presidential_authority_desc:0 "Seek a constitutional mandate for President Poincaré to coordinate national defence. This counterfactual concentration of authority carries a political cost and must preserve the civilian character of the state."
 FR3_R_executive_secretariat:0 "The Executive Secretariat"
 FR3_R_executive_secretariat_desc:0 "A permanent secretariat records the president's decisions and assigns responsibility for carrying them out. Ministers remain responsible for their departments rather than receiving overlapping verbal instructions."
 FR3_R_presidential_limits:0 "Define the Mandate's Limits"
 FR3_R_presidential_limits_desc:0 "Give the courts and Parliament a timetable for reviewing exceptional authority. A mandate intended for a crisis must not become an undefined permanent constitution."
 FR3_R_confidence_procedures:0 "Confidence and Cabinet Procedures"
 FR3_R_confidence_procedures_desc:0 "Set common procedures for interdepartmental decisions and confidence votes. The cabinet can coordinate its programme without pretending that parliamentary disagreement has disappeared."
 FR3_R_public_information:0 "A Public Information Bureau"
 FR3_R_public_information_desc:0 "Release verified information through a common bureau and keep military secrecy separate from political censorship. Clear rules reduce confusion when the public most needs reliable reports."
 FR3_R_prepared_administration:0 "Prepare the Wartime Administration"
 FR3_R_prepared_administration_desc:0 "Connect civilian departments to the mobilisation machinery before a continental crisis. Preparation creates procedures and communications rather than an instant army of new men."
 FR3_R_wartime_committees:0 "The Wartime Parliamentary Commissions"
 FR3_R_wartime_committees_desc:0 "Keep procurement, exemptions and civilian relief under regular review. The commissions will have information with which to question ministers, not simply applaud them."
 FR3_R_briand_ministry:0 "Briand's Coalition Ministry"
 FR3_R_briand_ministry_desc:0 "A broader coalition connects the army, Treasury and Foreign Office under Briand. Cabinet cooperation must accommodate the real partners France has chosen."
 FR3_R_briand_continuity:0 "Continue Briand's Coalition"
 FR3_R_briand_continuity_desc:0 "Retain a broad cabinet and continue negotiations among its political partners. This alternative preserves Briand's leadership through the coming crises instead of accepting the historical cabinet succession."
 FR3_R_clemenceau_government:0 "Clemenceau's War Government"
 FR3_R_clemenceau_government_desc:0 "Concentrate the government on the conduct of the war under Clemenceau. Parliament retains authority, while ministers face a clear demand to decide priorities and carry them through."
 FR3_R_allied_cabinet:0 "An Allied Cabinet Secretariat"
 FR3_R_allied_cabinet_desc:0 "Keep political representatives in contact with allied missions and procurement officers. Operational cooperation should follow an agreed policy rather than forcing a new alliance by administrative decree."
 FR3_R_war_secretariat:0 "The War Secretariat"
 FR3_R_war_secretariat_desc:0 "Record decisions on manpower, transport and command in a single secretariat. The government must be able to distinguish an approved plan from a competing departmental proposal."
 FR3_front_line_2_desc:0 "Coordinate dressing stations, evacuation routes and replacement personnel. Better organisation reduces friction between medical services and the formations they support."
 FR3_R_refugee_reconstruction:0 "Prepare the Return to the Departments"
 FR3_R_refugee_reconstruction_desc:0 "Register damaged property, transport needs and displaced workers before the occupied districts are recovered. Reconstruction will require accurate local plans rather than factories outside the map."
 FR3_R_franchise_reform:0 "Representation and Civil Rights"
 FR3_R_franchise_reform_desc:0 "Review the representation and legal protections of those whose work sustains the country. The reforms remain a parliamentary choice, not a universal claim that the political crisis is over."
 FR3_R_peace_commission:0 "The Reconstruction Commission"
 FR3_R_peace_commission_desc:0 "Prepare a common position on reconstruction, returning soldiers and emergency contracts. The government will distinguish temporary war capacity from the permanent industrial base."
 FR3_R_demobilisation:0 "Close the War Departments"
 FR3_R_demobilisation_desc:0 "Close the emergency war departments and release temporary munitions plants from their military contracts. Permanent factories and the industry built by the country remain available for civilian recovery."
 FR3_R_republican_settlement:0 "A Civilian Republican Settlement"
 FR3_R_republican_settlement_desc:0 "Return exceptional powers to ordinary civilian institutions and preserve the political programme the country has chosen. Peace will not be used to restore a different faction or an unwanted government."
 FR3_R_russian_staff:0 "The Franco-Russian Staff Convention"
 FR3_R_russian_staff_desc:0 "Exchange railway and mobilisation schedules with a Russia that shares our alignment. Neutrality or an accepted separate agreement excludes compulsory operational coordination."
 FR3_R_russian_credit:0 "Russian Industrial Missions"
 FR3_R_russian_credit_desc:0 "Connect commercial and technical representatives to agreed supply plans. Assistance supports the existing partner without granting either country an unlimited industry or an instant army."
 FR3_R_channel_convention:0 "The Channel Transport Convention"
 FR3_R_channel_convention_desc:0 "Give ports and shipping representatives a common timetable for reinforcement and unloading. Cooperation follows the current alliance and the wars its members actually share."
 FR3_R_continental_proposal:0 "A Continental Counterweight"
 FR3_R_continental_proposal_desc:0 "The Anglo-German agreement changes the continental balance and demands a response from Paris. Invite a willing Russia into a French-led coalition, with Italy to receive a separate offer once the arrangement is accepted."
 FR3_R_continental_staff:0 "The Continental Secretariat"
 FR3_R_continental_staff_desc:0 "Organise staff work after France and Russia have actually formed their coalition. The agreement remains separate from each government's decision to enter a war."
 FR3_R_continental_italy:0 "Seek an Italian Partner"
 FR3_R_continental_italy_desc:0 "Invite Rome to take a place in the continental coalition. Italy must decide independently whether the offer is compatible with its neutrality programme and existing treaties."
 FR3_R_continental_defence:0 "Plan for Continental Defence"
 FR3_R_continental_defence_desc:0 "Prepare reserves and supply plans for an actual coalition facing the Anglo-German partnership. Defensive preparations alone do not authorise a war against a neutral neighbour."
 FR3_R_continental_war_conference:0 "A Conference on War Entry"
 FR3_R_continental_war_conference_desc:0 "Ask the coalition governments to decide whether they will enter a war and under what obligations. A refusal ends the proposed war programme while preserving the alliances that have already been accepted."
 FR3_R_caillaux_outreach:0 "Caillaux's Commercial Diplomacy"
 FR3_R_caillaux_outreach_desc:0 "Explore whether economic negotiations can reduce the risk of a continental war. Berlin must accept the proposal; French commercial contact cannot decide German policy for it."
 FR3_R_border_guarantees:0 "Request Border and Belgian Guarantees"
 FR3_R_border_guarantees_desc:0 "A commercial dialogue is insufficient without guarantees for the frontier and Belgian neutrality. Ask Berlin to place concrete limits on its military options before ratification."
 FR3_R_ratify_accommodation:0 "Ratify a Franco-German Accommodation"
 FR3_R_ratify_accommodation_desc:0 "Ratify the German non-aggression proposal once Berlin accepts the required guarantees. France will withdraw from incompatible military commitments and preserve diplomatic channels with its former partners."
 FR3_R_frontier_commission:0 "The Joint Frontier Commission"
 FR3_R_frontier_commission_desc:0 "Record incidents and review frontier complaints through a permanent diplomatic channel. The commission neither remilitarises the Rhineland nor transfers territory without a separate settlement."
 FR3_R_neutral_trade:0 "Neutral Commercial Agreements"
 FR3_R_neutral_trade_desc:0 "Keep port inspections and commercial contracts predictable for all belligerents. France's accommodation is a policy to maintain rather than a hidden licence to join another coalition."
 FR3_R_neutrality:0 "A Republic of Armed Neutrality"
 FR3_R_neutrality_desc:0 "Withdraw from continental military commitments and preserve a defensive army. France will leave its own alliance while allowing a remaining partner to take its leadership."
 FR3_R_neutral_inspection:0 "Neutral Port Inspections"
 FR3_R_neutral_inspection_desc:0 "Publish procedures for inspecting merchant traffic without treating a trading partner as a military ally. Neutrality requires consistent administration in ports as well as declarations in Paris."
 FR3_R_mediation:0 "Offer a European Conference"
 FR3_R_mediation_desc:0 "Offer a channel through which the belligerents can discuss terms. France can propose mediation without forcing either side to end its war."
 FR3_R_no_secret_obligations:0 "Publish Our Military Obligations"
 FR3_R_no_secret_obligations_desc:0 "Make the limits of France's commitments visible to Parliament and foreign governments. An independent policy should not be undermined by undisclosed promises of war entry."
 FR3_anti_german_propaganda_desc:0 "Compare military preparations with intelligence and diplomatic reports. Preparing against a real threat is more useful than turning every commercial dispute into a reason for immediate war."
 FR3_R_belgian_guarantee:0 "Affirm Belgian Independence"
 FR3_R_belgian_guarantee_desc:0 "Give Belgian independence an explicit guarantee before a continental crisis arrives. France must uphold the same neutrality it expects its partners to respect."
 FR3_R_balkan_diplomacy:0 "The Balkan Diplomatic Mission"
 FR3_R_balkan_diplomacy_desc:0 "Consult Balkan governments about security, transport and the risks of escalation. Military cooperation will follow willing governments rather than nationality-based assumptions."
 FR3_R_italian_dialogue:0 "Consult Rome"
 FR3_R_italian_dialogue_desc:0 "Ask the Italian government how it intends to defend its interests. Its neutral, Austrian or Entente programme determines which offers remain meaningful."
 FR3_R_romanian_assistance:0 "Assist a Romanian Co-Belligerent"
 FR3_R_romanian_assistance_desc:0 "Coordinate supply priorities with a Romania that actually shares our alignment. Aid does not decide new territorial ownership or bring an unwilling government into a separate war."
 FR3_R_washington_mission:0 "A Mission to Washington"
 FR3_R_washington_mission_desc:0 "Maintain commercial and diplomatic contact with the United States. Procurement talks cannot force a neutral American government to enter our war."
 FR3_R_american_contracts:0 "American Procurement Contracts"
 FR3_R_american_contracts_desc:0 "Coordinate orders, finance and shipping through a purchasing mission. The benefit supports contracted supply rather than granting French ownership of American soldiers."
 FR3_R_american_liaison:0 "The American Expeditionary Liaison"
 FR3_R_american_liaison_desc:0 "Create a common liaison machinery only after the United States becomes a co-belligerent. American troops and equipment remain tied to actual alliance and war conditions."
 FR3_R_allied_command:0 "A Common Allied Command"
 FR3_R_allied_command_desc:0 "Agree a common operational calendar with the governments sharing our coalition. The command arrangement must accommodate the current alliance instead of assuming that Britain is always a partner."
 FR3_R_doullens:0 "The Doullens Principle"
 FR3_R_doullens_desc:0 "Give the allied command a clear mandate to coordinate reserves and successive attacks. The arrangement follows willing co-belligerents and does not invite a hostile country into the secretariat."
 FR3_R_final_offensives:0 "Prepare the Final Offensives"
 FR3_R_final_offensives_desc:0 "Combine reserves, artillery and transport for a sequence of limited attacks. Successful operations must be conducted by the armies on the map, not supplied by automatic territorial transfers."
 FR3_R_peace_terms:0 "The French Peace Delegation"
 FR3_R_peace_terms_desc:0 "Assemble a peace delegation representing the government, army and recovered departments. Its negotiating position must reflect the war France has fought and the commitments accepted by its allies."
 FR3_R_border_restoration:0 "Record the Recovered Departments"
 FR3_R_border_restoration_desc:0 "Record damage, transport bottlenecks and public-service needs in the recovered departments. Reconstruction must begin with the towns and industries France is able to administer."
 FR3_R_treaty_review:0 "Review the Armistice Settlement"
 FR3_R_treaty_review_desc:0 "Bring the accepted armistice and its obligations before Parliament. The government must distinguish the settlement it has negotiated from new commitments it has not agreed to undertake."
 FR3_R_moroccan_policy:0 "Review the Moroccan Commitment"
 FR3_R_moroccan_policy_desc:0 "Review the protectorate question and our commitments to the Moroccan government. European negotiation and colonial administration must be coordinated before the next crisis."
 FR3_R_moroccan_settlement:0 "Administer the Colonial Settlement"
 FR3_R_moroccan_settlement_desc:0 "Apply the administrative arrangements after the colonial negotiation has actually ended. The focus records the settlement without running its state transfers a second time."
 FR3_R_algeciras_channels:0 "Keep the Conference Channels Open"
 FR3_R_algeciras_channels_desc:0 "Maintain a diplomatic channel with the other powers concerned with Morocco. Consultation offers a less confrontational alternative without annexing a neutral government."
 FR3_WW1I_continental_survey:0 "Continental Production Survey"
 FR3_WW1I_continental_survey_desc:0 "Map the railheads, workshops and displaced capacity that can sustain a continental war economy."
 FR3_WW1I_railway_board:0 "Create a Railway Board"
 FR3_WW1I_railway_board_desc:0 "We will give the railway companies a common wartime timetable. Priority freight will connect mines, arsenals and the front without wasting scarce rolling stock."
 FR3_WW1I_coal_commission:0 "Organize the Coal Commission"
 FR3_WW1I_coal_commission_desc:0 "We will direct coal toward steel furnaces and railway depots. A clear allocation board can keep civilian fuel needs from starving the war effort."
 FR3_WW1I_steel_requisitions:0 "Secure Lorraine Steel"
 FR3_WW1I_steel_requisitions_desc:0 "We will protect Lorraine's furnaces and contract their output for France. Steel from a restored homeland must feed both railways and guns."
 FR3_WW1I_explosives_bureau:0 "Found an Explosives Bureau"
 FR3_WW1I_explosives_bureau_desc:0 "We will bring powder makers under one safety and supply authority. Standardized chemistry will make shells safer to fill and easier to transport."
 FR3_WW1I_munition_workshops:0 "Expand the Munition Workshops"
 FR3_WW1I_munition_workshops_desc:0 "We will turn dispersed workshops into dependable arsenals. Their contracts will favor useful shells, rifles and tools instead of ceremonial projects."
 FR3_WW1I_lorraine_recovery:0 "Reopen Lorraine's Furnaces"
 FR3_WW1I_lorraine_recovery_desc:0 "We will reopen the furnaces that war and occupation disrupted. Guarded state investment can restore a core province without assuming ownership after every campaign."
 FR3_WW1I_briey_retooling:0 "Expand the Briey Works"
 FR3_WW1I_briey_retooling_desc:0 "The Briey works can make a greater contribution to national defence. Retooling the existing plant and expanding armaments production will put its industrial strength at the service of the army."
 FR3_WW1I_northern_relocation:0 "Relocate Northern Workshops"
 FR3_WW1I_northern_relocation_desc:0 "We will move vulnerable machine tools away from the occupied frontier. Picardy and the northern ports can receive production as territory becomes secure."
 FR3_WW1I_rail_freight:0 "Schedule Rail Freight"
 FR3_WW1I_rail_freight_desc:0 "We will reserve trains for coal, steel and ammunition. Better schedules are cheaper than building a second railway for every emergency."
 FR3_WW1I_coal_transport:0 "Link the Coal Depots"
 FR3_WW1I_coal_transport_desc:0 "We will link coal depots to the rail network and steel belt. Local managers will receive a clear order of priority when supply trains arrive."
 FR3_WW1I_powder_inputs:0 "Guarantee Powder Inputs"
 FR3_WW1I_powder_inputs_desc:0 "We will reserve nitrates and chemicals for French shell production. The Explosives Bureau will receive the contracts early enough to plan safely."
 FR3_WW1I_albert_thomas:0 "Empower Albert Thomas"
 FR3_WW1I_albert_thomas_desc:0 "We will give the armaments ministry authority to match orders with capacity. Albert Thomas's system will make industrial supervision a practical wartime tool."
 FR3_WW1I_shell_filling:0 "Standardize Shell Filling"
 FR3_WW1I_shell_filling_desc:0 "We will standardize shell filling across civilian and military workshops. This reduces dangerous improvisation while sending more usable ammunition to the army."
 FR3_WW1I_controlled_orders:0 "Control Strategic Orders"
 FR3_WW1I_controlled_orders_desc:0 "We will audit every large contract against rail and steel capacity. Controlled orders keep the state from promising more shells than its factories can deliver."
 FR3_WW1I_women_workshops:0 "Organize Women's Workshops"
 FR3_WW1I_women_workshops_desc:0 "We will train women for skilled workshop jobs while protecting essential civilian trades. Their contribution will be measured by output and safety rather than slogans."
 FR3_WW1I_american_orders:0 "Accept American Orders"
 FR3_WW1I_american_orders_desc:0 "We will use United States orders to keep French lines busy and solvent. Foreign contracts will supplement domestic supply without surrendering control of our arsenals."
 FR3_WW1I_national_bonds:0 "Issue National War Bonds"
 FR3_WW1I_national_bonds_desc:0 "We will ask households to finance dependable ammunition and railway work. Public credit will support supplies while leaving the factories in French hands."
 FR3_WW1I_labor_directorate:0 "Create a Labor Directorate"
 FR3_WW1I_labor_directorate_desc:0 "We will coordinate exemptions, training and workshop transfers through one labor directorate. This keeps controlled mobilization from becoming a chaotic hunt for workers."
 FR3_WW1I_plant_safety:0 "Fund Plant Safety"
 FR3_WW1I_plant_safety_desc:0 "We will make powder magazines and shell lines safer for workers. Fewer accidents mean more trained hands remain available for the front's needs."
 FR3_WW1I_engine_repair:0 "Open Engine Repair Shops"
 FR3_WW1I_engine_repair_desc:0 "We will return locomotives and lorries to service before buying replacements. Repair crews will use the same depots as the railway board."
 FR3_WW1I_freight_priority:0 "Coordinate Wartime Transport"
 FR3_WW1I_freight_priority_desc:0 "Railway schedules and motor columns must serve the same plan. Coordinating their work will keep supplies moving from the depots to the front."
 FR3_WW1I_allied_supply:0 "Coordinate Allied Supply"
 FR3_WW1I_allied_supply_desc:0 "We will coordinate allied deliveries through French depots. Shared manifests turn imported material into predictable support for our divisions."
 FR3_WW1I_army_depots:0 "Expand Army Depots"
 FR3_WW1I_army_depots_desc:0 "We will place reserve stores behind the rail heads. Proper depots make supplies available when the fighting moves faster than factories can react."
 FR3_WW1I_civilian_rail:0 "Repair Civilian Rail"
 FR3_WW1I_civilian_rail_desc:0 "We will repair the lines that carry workers and food as well as shells. Guarded improvements in the Paris core keep the home front connected."
 FR3_WW1I_artillery_line:0 "Build an Artillery Line"
 FR3_WW1I_artillery_line_desc:0 "We will dedicate a secure line to field guns and their carriages. Its output will answer shortages without creating a new resource system."
 FR3_WW1I_motor_transport:0 "Expand Motor Transport"
 FR3_WW1I_motor_transport_desc:0 "We will standardize spare parts for trucks and workshop lorries. Better transport lets ammunition reach the front before it becomes obsolete."
 FR3_WW1I_repair_crews:0 "Train Repair Crews"
 FR3_WW1I_repair_crews_desc:0 "We will train mobile crews to repair weapons near the rail heads. Their experience is worth more than a symbolic factory bonus."
 FR3_WW1I_victory_loans:0 "Back Victory Loans"
 FR3_WW1I_victory_loans_desc:0 "We will link bond issues to visible arsenal and railway work. Public confidence will pay for the supplies the army actually consumes."
 FR3_WW1I_agricultural_supply:0 "Protect Agricultural Supply"
 FR3_WW1I_agricultural_supply_desc:0 "We will reserve rail capacity for seed, food and army rations. Industrial mobilization cannot last if farms lose their wagons."
 FR3_WW1I_northern_reconstruction:0 "Rebuild Northern France"
 FR3_WW1I_northern_reconstruction_desc:0 "We will restore workshops in the northern core as the front recedes. The grant applies only where France owns, controls and cores the verified Picardy state."
 FR3_WW1I_briey_expansion:0 "Expand Briey Steel"
 FR3_WW1I_briey_expansion_desc:0 "We will add a second industrial stage to Briey's verified state. The ownership and control guard protects the investment when borders change."
 FR3_WW1I_state_arsenals:0 "Link State Arsenals"
 FR3_WW1I_state_arsenals_desc:0 "We will link state arsenals to a common French production schedule. Paris receives the first guarded expansion because it is the verified national core."
 FR3_WW1I_munitions_reserve:0 "Maintain a Munitions Reserve"
 FR3_WW1I_munitions_reserve_desc:0 "We will keep a measured reserve for the next offensive. The existing state ledger records only real temporary arms factories and can later demobilize them."
 FR3_WW1I_southern_relocation:0 "Relocate Southern Work"
 FR3_WW1I_southern_relocation_desc:0 "We will place overflow contracts in secure southern cores. Guarded investment in Centre gives workshops a refuge when northern railways are under fire."
 FR3_WW1I_rail_integration:0 "Integrate the Rail Network"
 FR3_WW1I_rail_integration_desc:0 "We will connect the northern and southern timetables into one network. The construction bonus rewards planning rather than an off-map factory."
 FR3_WW1I_demobilization_offices:0 "Prepare Demobilization Offices"
 FR3_WW1I_demobilization_offices_desc:0 "We will prepare an orderly return from wartime production. The existing ledger helper will close only temporary munitions plants after peace."
 FR3_WW1I_postwar_conversion:0 "Plan Postwar Conversion"
 FR3_WW1I_postwar_conversion_desc:0 "We will convert arsenals toward civilian machinery when the guns fall silent. Timed coordination keeps the transition from freezing useful capacity."
 FR3_WW1I_national_chemistry:0 "Advance National Chemistry"
 FR3_WW1I_national_chemistry_desc:0 "We will keep wartime chemical expertise in French laboratories. Research support improves industry without adding a custom resource or permanent ledger."
 FR3_WW1I_workers_charter:0 "Sign a Workers' Charter"
 FR3_WW1I_workers_charter_desc:0 "We will pair controlled mobilization with safer hours and clear contracts. A durable labor agreement protects output after emergency orders end."
 FR3_WW1I_national_industry_program:0 "National Industry Programme"
 FR3_WW1I_national_industry_program_desc:0 "Bind the regional surveys, rail priorities and chemical works into one wartime production schedule."
 FR3_WW1I_armament_credit:0 "Armament Credit Union"
 FR3_WW1I_armament_credit_desc:0 "Direct reconstruction credit toward the arsenals that can turn recovered capacity into shells and guns."
 FR3_WW1C_colonial_charter:0 "Write a Colonial Charter"
 FR3_WW1C_colonial_charter_desc:0 "We will ask the empire for cooperation, service and investment under a common charter. Local institutions gain a voice while France secures dependable supplies."
 FR3_WW1C_algerian_reform:0 "Reform Algerian Administration"
 FR3_WW1C_algerian_reform_desc:0 "We will expand councils and technical schools in Algeria. Cooperation must make service and investment visible to Algerian communities."
 FR3_WW1C_moroccan_cooperation:0 "Cooperate with Morocco"
 FR3_WW1C_moroccan_cooperation_desc:0 "We will negotiate practical Moroccan cooperation around ports and roads. French contracts will reward reliable service instead of coercive expansion."
 FR3_WW1C_tunisian_councils:0 "Support Tunisian Councils"
 FR3_WW1C_tunisian_councils_desc:0 "We will support Tunisian councils that keep rail and harbor work accountable. Their cooperation earns equipment and administrative training."
 FR3_WW1C_saharan_routes:0 "Build Saharan Routes"
 FR3_WW1C_saharan_routes_desc:0 "We will improve routes across the Sahara for mail, medicine and supplies. Construction proceeds only in a state France owns and fully controls."
 FR3_WW1C_algerian_service:0 "Recognize Algerian Service"
 FR3_WW1C_algerian_service_desc:0 "We will recognize Algerian soldiers and technicians with training and equipment. Their service strengthens a cooperative defense of North Africa."
 FR3_WW1C_tunisian_trade:0 "Open Tunisian Trade"
 FR3_WW1C_tunisian_trade_desc:0 "We will give Tunisian merchants predictable access to French contracts. Trade links turn harbor capacity into useful wartime supply."
 FR3_WW1C_indochina_schooling:0 "Build Indochinese Schools"
 FR3_WW1C_indochina_schooling_desc:0 "We will fund technical schooling in Indochina for clerks, engineers and medical staff. Knowledge travels farther than a coercive decree."
 FR3_WW1C_west_africa_service:0 "Organize West African Service"
 FR3_WW1C_west_africa_service_desc:0 "We will support West African service units with fair contracts and equipment. Their contribution will be recorded in supplies and training."
 FR3_WW1C_indochina_ports:0 "Improve Indochinese Ports"
 FR3_WW1C_indochina_ports_desc:0 "We will improve port works that connect Indochina to allied shipping. The state investment is guarded by ownership and full control so it cannot appear in a lost port."
 FR3_WW1C_west_africa_rail:0 "Lay West African Rail"
 FR3_WW1C_west_africa_rail_desc:0 "We will lay short rail links where West African authorities can maintain them. The goal is dependable supply, not a paper empire."
 FR3_WW1C_central_africa_medicine:0 "Send Central African Medicine"
 FR3_WW1C_central_africa_medicine_desc:0 "We will send medical stores and instructors to Central Africa. Better care protects both local communities and the soldiers serving there."
 FR3_WW1C_colonial_labor_board:0 "Create a Colonial Labor Board"
 FR3_WW1C_colonial_labor_board_desc:0 "We will set transparent contracts for workers moving between colonial projects. A labor board can prevent emergency requisitions from destroying local capacity."
 FR3_WW1C_indochina_trade:0 "Open Indochinese Trade"
 FR3_WW1C_indochina_trade_desc:0 "We will let Indochinese ports trade more directly with French arsenals. Predictable trade funds repairs and gives local firms a stake in cooperation."
 FR3_WW1C_federated_supply:0 "Coordinate Imperial Supply"
 FR3_WW1C_federated_supply_desc:0 "We will coordinate supply offices across the empire while keeping local administrations involved. Shared equipment and logistics are a practical reward for cooperation."
 FR3_WW1C_colonial_equipment_offices:0 "Open Colonial Equipment Offices"
 FR3_WW1C_colonial_equipment_offices_desc:0 "We will place equipment offices near the communities supplying our armies. Their work rewards service with tools, rifles and predictable maintenance."
 FR3_WW1C_reform_association:0 "Form an Imperial Association"
 FR3_WW1C_reform_association_desc:0 "We will give cooperating territories a continuing forum for reforms and investment. France gains reliable partners when rewards follow service rather than coercive expansion."
 FR3_general_staff:0 "General Staff Reorganisation"
 FR3_general_staff_desc:0 "The General Staff separates strategic assumptions from reports coming back from the trenches. A clearer chain of work lets France revise plans without discarding hard-won local knowledge."
 FR3_three_year_law:0 "The Three-Year Law"
 FR3_three_year_law_desc:0 "The 1913 Three-Year Law expands conscription and keeps trained classes available for mobilisation. Its political cost is accepted because France expects a short warning before a continental war."
 FR3_plan_xvii:0 "Plan XVII"
 FR3_plan_xvii_desc:0 "Plan XVII concentrates French armies for an offensive recovery of Alsace-Lorraine. Its study also exposes how rail timetables, artillery weight, and German operational choices can defeat an elegant pre-war plan."
 FR3_deep_defence:0 "Defence in Depth Studies"
 FR3_deep_defence_desc:0 "Defence in depth places outposts, battle positions, and reserves behind one another. The arrangement trades ground for time while preserving artillery and counterattack forces."
 FR3_railway_coordination:0 "Railway Mobilisation Staff"
 FR3_railway_coordination_desc:0 "Railway mobilisation staff synchronise troop trains, ammunition columns, and civilian traffic. Their tables turn a national rail network into a military instrument under emergency conditions."
 FR3_front_reserve:0 "Army Group Reserves"
 FR3_front_reserve_desc:0 "Army group reserves are held far enough back to answer a breakthrough yet close enough to move before a sector collapses. Commanders practise committing them by information rather than panic."
 FR3_signal_service:0 "Field Telephone Service"
 FR3_signal_service_desc:0 "Field telephone sections bury cable, carry portable exchanges, and maintain runners when lines fail. Reliable reports let batteries shift fire while infantry still have time to warn one another."
 FR3_colonial_reserves:0 "Colonial Reserve Depots"
 FR3_colonial_reserves_desc:0 "Colonial reserve depots organise men, uniforms, and language support before overseas formations reach France. The system preserves useful experience without treating colonial troops as an afterthought."
 FR3_artillery_observation:0 "Aerial Artillery Observation"
 FR3_artillery_observation_desc:0 "Observation aircraft plot hostile batteries and correct French fire from above the trenches. Pilots and gunners learn a shared language of grids, landmarks, and rapid corrections."
 FR3_offensive_fire_plan:0 "Nivelle Fire Plan"
 FR3_offensive_fire_plan_desc:0 "The Nivelle fire plan concentrates ammunition before an assault and schedules lifts behind advancing infantry. Its promise is a carefully opened path through wire, trenches, and machine-gun nests."
 FR3_counterattack_doctrine:0 "Local Counterattack Doctrine"
 FR3_counterattack_doctrine_desc:0 "Local counterattack doctrine gives reserve companies a defined moment and objective after an enemy penetration. It restores a position before confusion can become an operational retreat."
 FR3_fortified_sector:0 "Fortified Sectors"
 FR3_fortified_sector_desc:0 "Fortified sectors combine concrete shelters, wire belts, observation posts, and covered routes. Engineers build a defence that can absorb bombardment while keeping the command network alive."
 FR3_storm_detachments:0 "Assault Detachments"
 FR3_storm_detachments_desc:0 "Assault detachments carry grenades, cutters, and light machine guns into the first trench line. Their task is to clear a narrow lane for the larger battalion, then hand it over to reserves."
 FR3_moroccan_divisions:0 "Moroccan Divisions"
 FR3_moroccan_divisions_desc:0 "Moroccan divisions bring hard-earned field experience and disciplined manoeuvre to the French front. Their staff work pairs veteran cadres with careful replacement and supply arrangements."
 FR3_anti_gas_service:0 "Anti-Gas Service"
 FR3_anti_gas_service_desc:0 "The anti-gas service combines detection, respirator maintenance, medical treatment, and decontamination. It reduces the tactical shock of chemical attacks without promising immunity from them."
 FR3_creeping_barrage:0 "Creeping Barrage"
 FR3_creeping_barrage_desc:0 "A creeping barrage advances by a measured schedule just ahead of the assault waves. Infantry liaison officers teach companies to follow the shells closely enough to deny defenders time to recover."
 FR3_rolling_barrage:0 "Rolling Barrage"
 FR3_rolling_barrage_desc:0 "A rolling barrage shifts from the first objective to the depth positions as the attack moves forward. The method makes artillery a moving shield rather than a single opening blow."
 FR3_counterbattery_office:0 "Counter-Battery Office"
 FR3_counterbattery_office_desc:0 "The counter-battery office centralises survey data, sound ranging, flash reports, and aerial plates. It directs scarce heavy shells toward guns that threaten the next infantry movement."
 FR3_combined_arms_1918:0 "1918 Combined Arms"
 FR3_combined_arms_1918_desc:0 "The 1918 method links tanks, infantry, aircraft, engineers, and artillery at the point of decision. Commanders use short objectives and flexible fire to exploit a breach before it closes."
 FR3_overseas_logistics:0 "Colonial Supply Depots"
 FR3_overseas_logistics_desc:0 "Colonial supply depots sort food, ammunition, uniforms, and spare parts at Mediterranean ports. Their schedules keep overseas formations fed while reducing the strain on the metropolitan railways."
 FR3_front_artillery_school:0 "Front Artillery School"
 FR3_front_artillery_school_desc:0 "The front artillery school turns battle reports into instruction on maps, fuzes, observation, and ammunition economy. Battery commanders leave with procedures that can survive broken communications."
 FR3_army_standardization:0 "Army Standardisation Board"
 FR3_army_standardization_desc:0 "The standardisation board compares rifles, machine guns, shells, tools, and field repairs across formations. Fewer incompatible patterns make mobilisation and battlefield replacement less wasteful."
 FR3_engineer_companies:0 "Sapeur-Pionnier Companies"
 FR3_engineer_companies_desc:0 "Sapeur-pionnier companies bridge shell craters, cut wire, drain trenches, and restore roads under fire. Their specialised tools give infantry a route through obstacles that maps alone cannot solve."
 FR3_algerian_regiments:0 "Algerian Regiments"
 FR3_algerian_regiments_desc:0 "Algerian regiments receive dependable cadres, interpreters, and replacement channels before entering major battles. Their organisation respects both combat strength and the practical needs of long-distance deployment."
 FR3_nivelle_offensive:0 "Nivelle Offensive"
 FR3_nivelle_offensive_desc:0 "Nivelle’s 1917 offensive stakes French recovery on a rapid rupture of the Chemin des Dames. The plan rewards concentrated artillery and bold movement, but it can exhaust an army if the breach does not appear."
 FR3_petain_rest:0 "Pétain’s Army Rest"
 FR3_petain_rest_desc:0 "Pétain restores worn divisions through rotation, leave, food, and limits on futile mass assaults. Rested units return with clearer objectives and a command more attentive to morale."
 FR3_ft17_tanks:0 "Renault FT-17"
 FR3_ft17_tanks_desc:0 "The Renault FT-17 enters service as a small tank that can cross the same ground as the infantry it supports. Its turret and production discipline make armoured cooperation more practical than grand prototypes."
 FR3_army_reorganisation:0 "Army Reorganisation"
 FR3_army_reorganisation_desc:0 "Army reorganisation aligns divisions, depots, transport, and replacement streams after years of attrition. The reforms seek a force that can hold a sector while still generating a reserve for the next operation."
 FR3_army_command_1918:0 "The 1918 Army Command"
 FR3_army_command_1918_desc:0 "Unite fire planning, armour lessons and reserve administration into a mature French field command."
 FR3_operational_learning:0 "Operational Learning"
 FR3_operational_learning_desc:0 "Operational learning turns the Somme, Verdun, and Chemin des Dames into written corrections to doctrine. Staff officers are rewarded for identifying failures that can be fixed before the next battle."
 FR3_1918_methods:0 "The 1918 Method"
 FR3_1918_methods_desc:0 "The 1918 method joins short preparatory fires to tanks, storm groups, and flexible reserves. France applies the lesson as a repeatable system for breaking a defended position and exploiting its depth."
 FR3_dreadnought_desc:0 "France completes a dreadnought programme centred on battleships that can cover the western Mediterranean. The design board weighs armour, range, and dockyard limits against the Adriatic threat."
 FR3_battle_cruiser_effort_desc:0 "Fast capital ships are studied for reconnaissance and limited action against an exposed enemy. French planners keep their speed useful without pretending that thin armour can absorb a line-of-battle exchange."
 FR3_bizerte_fleet:0 "Bizerte Fleet Station"
 FR3_bizerte_fleet_desc:0 "Make Bizerte the repair and escort hinge between the western approaches and the Mediterranean."
 FR3_mediterranean_command:0 "Mediterranean Fleet Command"
 FR3_mediterranean_command_desc:0 "Mediterranean Fleet Command assigns patrol zones, refuelling priorities, and rules for guarded action. The staff protects the sea lanes while avoiding a reckless sortie against the Austro-Hungarian fleet."
 FR3_naval_gunnery:0 "Naval Gunnery School"
 FR3_naval_gunnery_desc:0 "The naval gunnery school compares rangefinding, spotting, and salvo discipline under Mediterranean light. Crews learn to make a first useful hit without wasting their ammunition reserve."
 FR3_escort_destroyers:0 "Escort Destroyers"
 FR3_escort_destroyers_desc:0 "Escort destroyers pair depth charges, lookouts, and convoy station keeping. They turn troop and supply movements into a protected schedule rather than a series of isolated crossings."
 FR3_cruiser_squadrons:0 "Cruiser Squadron Doctrine"
 FR3_cruiser_squadrons_desc:0 "Cruiser squadrons practise scouting lines and controlled withdrawals around the Adriatic. Their reports let the fleet choose when information is worth more than an engagement."
 FR3_fleet_battle_plan:0 "Fleet Battle Planning"
 FR3_fleet_battle_plan_desc:0 "Fleet battle planning fixes signals, rendezvous points, and fallback routes before a sortie. The plan gives France a guarded answer to an enemy who chooses the time and place of contact."
 FR3_adriatic_support:0 "Adriatic Support"
 FR3_adriatic_support_desc:0 "French ships support the guarded Adriatic campaign with observation, shore fire, and convoy cover. The mission aids Italy and the Balkans without inventing an unrestricted naval offensive."
 FR3_algeria_escorts:0 "Algerian Convoy Escorts"
 FR3_algeria_escorts_desc:0 "Algerian convoy escorts link Marseille, Oran, Algiers, and Bizerte with regular patrols. Their schedules protect men and matériel moving from North Africa to the European front."
 FR3_naval_fire_control:0 "Improved Fire Control"
 FR3_naval_fire_control_desc:0 "Improved fire control joins rangefinders, plotting rooms, and signal discipline aboard French warships. Better data lets a squadron concentrate fire while keeping formation in poor visibility."
 FR3_submarine_patrols:0 "Mediterranean Submarine Patrols"
 FR3_submarine_patrols_desc:0 "Mediterranean submarine patrols focus on likely approaches and the traffic that sustains an enemy fleet. Boat commanders are taught to conserve batteries and break contact when the hunt turns cold."
 FR3_convoy_escort_service:0 "Convoy Escort Service"
 FR3_convoy_escort_service_desc:0 "The convoy escort service assigns destroyers, patrol craft, and lookouts to a common sailing plan. Merchant masters receive predictable routes while escorts gain the information needed to react to a sighting."
 FR3_marine_transport:0 "Marine Transport Service"
 FR3_marine_transport_desc:0 "The Marine Transport Service schedules troopships, coalers, and hospital ships around naval protection. Its ledgers keep embarkation and unloading from becoming a second battlefield."
 FR3_gallipoli_preparations:0 "Gallipoli Lessons"
 FR3_gallipoli_preparations_desc:0 "Gallipoli reports expose the cost of weak reconnaissance, difficult beaches, and uncoordinated naval fire. French planners turn those failures into guarded preparations for any future eastern operation."
 FR3_adriatic_blockade:0 "Adriatic Blockade Support"
 FR3_adriatic_blockade_desc:0 "The Adriatic blockade uses patrol lines, minesweeping, and observation to restrict enemy movement. Commanders keep the cordon focused on real Austro-Hungarian sorties and supply routes."
 FR3_gallipoli_support:0 "Guarded Dardanelles Support"
 FR3_gallipoli_support_desc:0 "French support for the Dardanelles is tied to reconnaissance, minesweeping, and protection of the landing force. The navy assists the real Ottoman war while respecting the hazards that stopped earlier attacks."
 FR3_bizerte_repair_docks:0 "Bizerte Repair Docks"
 FR3_bizerte_repair_docks_desc:0 "Bizerte repair docks stock plates, boilers, and ordnance for ships returning from hard patrols. Faster work keeps the Mediterranean fleet present without requiring unsafe overextension."
 FR3_aeronavale:0 "Aéronavale Patrols"
 FR3_aeronavale_desc:0 "Aéronavale patrols watch the approaches to French ports and Mediterranean convoys. Naval observers report submarines and surface contacts before they threaten troop movements."
 FR3_aeronautique_militaire:0 "Aéronautique Militaire"
 FR3_aeronautique_militaire_desc:0 "The Aéronautique Militaire consolidates army aircraft, observers, and maintenance under a common service culture. Its strength comes from useful reports reaching the right headquarters quickly."
 FR3_escadrilles:0 "Escadrille Organisation"
 FR3_escadrilles_desc:0 "Escadrille organisation fixes staff tables for pilots, mechanics, observers, and replacement aircraft. Squadrons become durable units instead of temporary collections assembled for one battle."
 FR3_air_observation_service:0 "Integrated Observation Service"
 FR3_air_observation_service_desc:0 "Place artillery observers, reconnaissance crews and operational reporting under one air service."
 FR3_WW1_construction_foundation:0 "France's Industrial Base - Research Programme"
 FR3_WW1_industry_survey:0 "Survey the Continental Industry - Research Programme"
 FR3_WW1_rail_coordination:0 "Create a Railway Board - Research Programme"
 FR3_WW1_coal_processing:0 "Organize the Coal Commission - Research Programme"
 FR3_WW1_steel_methods:0 "Secure Lorraine Steel - Research Programme"
 FR3_WW1_explosive_process:0 "Found an Explosives Bureau - Research Programme"
 FR3_WW1_munition_methods:0 "Expand the Munition Workshops - Research Programme"
 FR3_WW1_rail_freight:0 "Schedule Rail Freight - Research Programme"
 FR3_WW1_powder_inputs:0 "Guarantee Powder Inputs - Research Programme"
 FR3_WW1_contract_audits:0 "Control Strategic Orders - Research Programme"
 FR3_WW1_us_orders:0 "Accept American Orders - Research Programme"
 FR3_WW1_labor_training:0 "Create a Labor Directorate - Research Programme"
 FR3_WW1_engine_repair:0 "Open Engine Repair Shops - Research Programme"
 FR3_WW1_freight_priority:0 "Set Freight Priority - Research Programme"
 FR3_WW1_rail_integration:0 "Integrate the Rail Network - Research Programme"
 FR3_WW1_postwar_tools:0 "Plan Postwar Conversion - Research Programme"
 FR3_WW1_national_chemistry:0 "Advance National Chemistry - Research Programme"
 FR3_WW1_national_program:0 "Adopt a National Industry Program - Research Programme"
 FR3_WW1_colonial_administration:0 "Write a Colonial Charter - Research Programme"
 FR3_WW1_imperial_administration:0 "Form an Imperial Association - Research Programme"
 US2_R_industry_shortcut:0 "Industry"
 US2_R_territories_shortcut:0 "Territories"
 US2_R_politics_shortcut:0 "Politics"
 US2_R_diplomacy_shortcut:0 "Diplomacy"
 US2_R_army_shortcut:0 "Army"
 US2_R_navy_shortcut:0 "Navy"
 US2_R_air_shortcut:0 "Air Service"
 US2_R_merit_service:0 "Professional Federal Departments"
 US2_R_merit_service_desc:0 "Patronage complicates the work of departments that now manage a continental economy. Competitive appointments can make records, inspection and administration more dependable."
 US2_R_congressional_scrutiny:0 "Congressional Scrutiny"
 US2_R_congressional_scrutiny_desc:0 "Federal programmes depend on appropriations and oversight from Congress. Establish reporting procedures that expose waste before departments expand their commitments."
 US2_R_election_1912:0 "The Campaign of 1912"
 US2_R_election_1912_desc:0 "Taft, Wilson and Roosevelt present competing answers to the power of trusts and the role of government. Organise a presidential campaign before the voters determine the next administration."
 US2_R_wilson_presidency:0 "Wilson and the New Freedom"
 US2_R_wilson_presidency_desc:0 "Wilson offers tariff revision, banking reform and stronger competition law. Give the Democratic programme an electoral mandate that takes effect at the March inauguration."
 US2_R_roosevelt_presidency:0 "Roosevelt and New Nationalism"
 US2_R_roosevelt_presidency_desc:0 "Roosevelt argues that industrial concentration demands a stronger federal responsibility. A Progressive victory can turn conservation and social protection into the programme of a returning president."
 US2_R_taft_presidency:0 "Return a Republican Administration"
 US2_R_taft_presidency_desc:0 "Taft defends constitutional restraint and a record of enforcement through the courts. A Republican victory preserves that approach while confronting demands for further reform."
 US2_R_new_freedom:0 "Legislate the New Freedom"
 US2_R_new_freedom_desc:0 "Wilson links tariff reform, banking legislation and competition policy into a single programme. Begin the work of persuading congressional Democrats to carry it through."
 US2_R_underwood_tariff:0 "The Underwood Tariff"
 US2_R_underwood_tariff_desc:0 "Protected producers face a proposal to reduce tariff schedules on a broad range of imports. Combine the revision with a revenue system that can support federal responsibilities."
 US2_R_reserve_legislation:0 "Pass the Federal Reserve Act"
 US2_R_reserve_legislation_desc:0 "Recurring financial panics reveal the limits of the existing banking structure. Establish reserve institutions that can respond to a shortage of credit without leaving the decision to a private rescue committee."
 US2_R_clayton_act:0 "The Clayton Antitrust Act"
 US2_R_clayton_act_desc:0 "Businesses need clearer limits on practices that suppress competition. Frame legislation that addresses those practices while recognising the position of labour organisations."
 US2_R_federal_trade_commission:0 "A Federal Trade Commission"
 US2_R_federal_trade_commission_desc:0 "Courts cannot investigate every commercial practice before it damages competition. Give a commission the staff and authority to examine unfair methods of business."
 US2_R_rural_credits:0 "The Federal Farm Loan System"
 US2_R_rural_credits_desc:0 "Rural borrowers face costly loans whose terms rarely match the life of a productive farm. Cooperative land banks can provide a more suitable channel for agricultural investment."
 US2_R_adamson_act:0 "Eight Hours on the Railroads"
 US2_R_adamson_act_desc:0 "A threatened railway stoppage puts interstate commerce and essential transport at risk. Use federal legislation to settle the immediate dispute over hours while maintaining negotiations on pay."
 US2_R_wilson_cabinet:0 "Coordinate the Reform Cabinet"
 US2_R_wilson_cabinet_desc:0 "Separate departments must turn the administration’s legislation into consistent practice. Coordinate their work so that competing offices do not undermine the same programme."
 US2_R_new_nationalism:0 "A Stronger National Executive"
 US2_R_new_nationalism_desc:0 "Large corporations and national markets have outgrown local supervision alone. Adopt federal oversight that accepts industrial scale while placing obligations on its use."
 US2_R_conservation_republic:0 "The Conservation Republic"
 US2_R_conservation_republic_desc:0 "Forests, rivers and public lands face pressure from rapid development. Expand scientific administration so that economic growth does not exhaust the national estate."
 US2_R_industrial_compensation:0 "Industrial Accident Compensation"
 US2_R_industrial_compensation_desc:0 "An injured worker can lose an income long before litigation offers a remedy. Establish compensation standards that make industrial safety a practical responsibility."
 US2_R_health_bureau:0 "Coordinate Public Health"
 US2_R_health_bureau_desc:0 "Disease ignores state boundaries and follows crowded workplaces and transport routes. A federal coordinating office can support local health authorities without displacing them."
 US2_R_regulated_trusts:0 "Regulate the Great Combinations"
 US2_R_regulated_trusts_desc:0 "Some industrial combinations are too large to treat solely as isolated court cases. Require regular disclosure and supervision of their conduct while preserving productive capacity."
 US2_R_progressive_cabinet:0 "A Progressive Cabinet"
 US2_R_progressive_cabinet_desc:0 "A broader federal programme needs departments capable of carrying its responsibilities. Bring conservation, labour and competition offices into a common executive plan."
 US2_R_republican_continuity:0 "Constitutional Republicanism"
 US2_R_republican_continuity_desc:0 "The returned administration grounds its authority in statutes and the courts. Build further reform around enforceable responsibilities rather than an unrestricted executive mandate."
 US2_R_judicial_antitrust:0 "Enforce Antitrust through the Courts"
 US2_R_judicial_antitrust_desc:0 "Existing antitrust law offers a means to challenge unlawful combinations. Strengthen investigation and prosecution while leaving disputed cases to judicial review."
 US2_R_commercial_rules:0 "Predictable Commercial Rules"
 US2_R_commercial_rules_desc:0 "Investors hesitate when administrative decisions change without clear explanation. Publish consistent commercial procedures while retaining the power to enforce competition law."
 US2_R_republican_conciliation:0 "Negotiate Industrial Disputes"
 US2_R_republican_conciliation_desc:0 "Strikes and lockouts expose costs that cannot be settled by commercial litigation alone. Offer mediation that preserves lawful bargaining and protects essential services."
 US2_R_taft_cabinet:0 "A Cabinet of Constitutional Administration"
 US2_R_taft_cabinet_desc:0 "Departments require legal authority as well as trained personnel to carry out a reform programme. Coordinate their responsibilities through legislation and the established civil service."
 US2_R_federal_mandate:0 "A Programme for the Whole Republic"
 US2_R_federal_mandate_desc:0 "The administration must work beyond the coalition that won the election. Translate its programme into responsibilities that federal departments and state governments can share."
 US2_R_civil_liberties:0 "Protect Constitutional Dissent"
 US2_R_civil_liberties_desc:0 "A national emergency can turn criticism into a target for administrative punishment. Require judicial scrutiny before restrictions silence lawful political opposition."
 US2_R_information_committee:0 "The Committee on Public Information"
 US2_R_information_committee_desc:0 "A wartime administration must explain why it asks for extraordinary service and expenditure. Create a public information bureau while accepting the controversy its campaigns will provoke."
 US2_R_women_war_work:0 "Open War Work to Women"
 US2_R_women_war_work_desc:0 "Army recruitment and military orders place new pressure on civilian labour. Organise training and employment for women entering essential workshops and offices."
 US2_R_suffrage_petitions:0 "Hear the Suffrage Petitions"
 US2_R_suffrage_petitions_desc:0 "Campaigners demand that national service and political citizenship be considered together. Bring their petitions before the legislature without pretending that a wartime focus has already ratified a constitutional amendment."
 US2_R_veterans_hospitals:0 "Prepare the Veterans Hospitals"
 US2_R_veterans_hospitals_desc:0 "Wounded men need more than a transport home from the front. Coordinate medical records, hospitals and rehabilitation before returning soldiers overwhelm civilian services."
 US2_R_war_contract_review:0 "Review Emergency Contracts"
 US2_R_war_contract_review_desc:0 "Emergency orders create opportunities for delay and profiteering as well as rapid expansion. Audit the contracts so that military departments can distinguish useful suppliers from costly promises."
 US2_R_constitutional_limits:0 "Set Limits on Emergency Government"
 US2_R_constitutional_limits_desc:0 "Wartime authority must have a purpose and an end. Require departments to prepare the return of temporary powers and contracts to normal constitutional administration."
 US2_R_demobilisation:0 "Close the Emergency Departments"
 US2_R_demobilisation_desc:0 "The army and industry must move from emergency demand to a peacetime footing. Close temporary programmes while keeping the country’s permanent factories and trained institutions."
 US2_diplomatic_effort_desc:0 "Atlantic commerce, Pacific possessions and the Mexican frontier require different instruments of policy. Give the State Department a framework that distinguishes trade, mediation and military commitments."
 US2_R_neutral_commerce:0 "Trade under Neutral Rights"
 US2_R_neutral_commerce_desc:0 "American merchants ask to continue lawful commerce with governments at war. Publish cargo rules and defend neutral rights while refusing to confuse private orders with a declaration of war."
 US2_R_diplomatic_choice:0 "Define the Atlantic Commitment"
 US2_R_diplomatic_choice_desc:0 "The cabinet must decide whether maritime disputes justify commercial preference, mediation or a negotiated alignment. Make that choice openly before the defence departments assume a military obligation."
 US2_R_german_alignment:0 "Seek a Berlin Understanding"
 US2_R_german_alignment_desc:0 "A negotiated agreement with Berlin could protect shipping without accepting Entente commitments. Request explicit German guarantees before treating cooperation as an accepted relationship."
 US2_R_continental_alignment:0 "Approach the Continental Powers"
 US2_R_continental_alignment_desc:0 "A German-British alliance creates a different balance from the historical Entente struggle. Ask France and its continental partners whether they will accept an American understanding on negotiated terms."
 US2_R_sussex_pledge:0 "Test the German Pledge"
 US2_R_sussex_pledge_desc:0 "German assurances offer a possible way to preserve neutrality while protecting merchant lives. Examine whether naval policy follows the pledge before deciding on a diplomatic break."
 US2_R_armed_merchantmen:0 "Arm the Merchant Ships"
 US2_R_armed_merchantmen_desc:0 "Renewed submarine attacks challenge the distinction between lawful commerce and unprotected passage. Prepare armed merchant defence while the administration gathers evidence for Congress."
 US2_R_allied_staff:0 "American and Allied Staff Talks"
 US2_R_allied_staff_desc:0 "The Allied armies need to understand the strength and limits of arriving American formations. Use staff exchanges to coordinate operations without simply merging the expeditionary army into another command."
 US2_R_fourteen_points:0 "A Public Programme for Peace"
 US2_R_fourteen_points_desc:0 "Military victory requires a statement of what the United States seeks from the settlement. Present principles of diplomacy and security without imposing automatic transfers on every belligerent."
 US2_R_austria_declaration:0 "Consider War with Austria-Hungary"
 US2_R_austria_declaration_desc:0 "Austria-Hungary remains an active partner of Germany in the continental war. Put a separate declaration before Congress instead of extending American war automatically to every Central Power."
 US2_R_peace_delegation:0 "Prepare the American Peace Delegation"
 US2_R_peace_delegation_desc:0 "The United States needs diplomats who can translate its declared principles into a negotiated settlement. Assemble the delegation while acknowledging that Allied governments retain their own demands."
 US2_R_mediation_mission:0 "Offer Neutral Mediation"
 US2_R_mediation_mission_desc:0 "American diplomats can maintain channels that the belligerents have lost. Offer mediation without claiming that a proposal alone can end their war."
 US2_R_neutral_ports:0 "Apply Equal Rules in American Ports"
 US2_R_neutral_ports_desc:0 "Belligerent ships and cargoes test the consistency of American neutrality. Give customs officers uniform instructions that can be defended in public."
 US2_R_coastal_watch:0 "Maintain the Coastal Watch"
 US2_R_coastal_watch_desc:0 "A neutral coast still requires patrols and reliable reports of foreign naval movements. Improve the naval watch without authorising attacks beyond American commitments."
 US2_R_hemisphere_neutrality:0 "Consult the American Republics"
 US2_R_hemisphere_neutrality_desc:0 "The European war creates commercial and political pressure across the western hemisphere. Seek a common diplomatic discussion while respecting the independence of neighbouring governments."
 US2_R_berlin_guarantees:0 "Record the Berlin Guarantees"
 US2_R_berlin_guarantees_desc:0 "A favourable German reply sets the limits of cooperation over shipping and diplomacy. Record those assurances before any military department treats them as an alliance."
 US2_R_german_trade_channels:0 "Reopen German Commercial Channels"
 US2_R_german_trade_channels_desc:0 "American exporters seek predictable access under the accepted understanding. Develop commercial liaison while keeping the separate decision about war in congressional hands."
 US2_R_ratify_german_alignment:0 "Approve the German Bloc Commitment"
 US2_R_ratify_german_alignment_desc:0 "Germany asks that cooperation become an explicit military commitment to its current continental struggle. Submit that request for approval while preserving the option of peaceful cooperation."
 US2_R_german_staff_liaison:0 "Liaison with the Consenting German Bloc"
 US2_R_german_staff_liaison_desc:0 "American officers now require a practical working relationship with their chosen allies. Develop liaison only after the United States has joined the accepted bloc."
 US2_R_continental_guarantees:0 "Define the Continental Guarantees"
 US2_R_continental_guarantees_desc:0 "Paris and its partners must accept the terms of American cooperation. Establish a diplomatic office only after the continental governments have given a favourable reply."
 US2_R_continental_shipping:0 "Coordinate Continental Shipping"
 US2_R_continental_shipping_desc:0 "The German-British alignment places unusual pressure on Atlantic routes. Share maritime information with the consenting continental powers before undertaking a military obligation."
 US2_R_ratify_continental_alignment:0 "Approve the Continental Commitment"
 US2_R_ratify_continental_alignment_desc:0 "A diplomatic understanding is no substitute for approval to enter a war. Put the existing continental struggle before Congress with its current opponents clearly identified."
 US2_R_continental_staff:0 "An American Continental Liaison"
 US2_R_continental_staff_desc:0 "American formations must cooperate with France and its continental partners under the negotiated commitment. Establish liaison after the country has actually entered their alliance."
 US2_R_mexican_sovereignty:0 "Respect Mexican Sovereignty"
 US2_R_mexican_sovereignty_desc:0 "Mexican governments must settle the constitutional struggle within their own country. Limit American policy to recognition and border protection rather than entering every revolutionary conflict."
 US2_R_pershing_border_lessons:0 "Assess Pershing’s Border Expedition"
 US2_R_pershing_border_lessons_desc:0 "Long patrols expose the difficulties of communication and supply across the southwestern frontier. Study those operations without making further intervention a condition for learning from them."
 US2_R_mexican_settlement:0 "Negotiate a Border Settlement"
 US2_R_mexican_settlement_desc:0 "Border safeguards can be negotiated without granting a permanent American claim over Mexican territory. Open talks that separate local security from the country’s internal political settlement."
 US2_R_caribbean_consultation:0 "Consult the Caribbean Governments"
 US2_R_caribbean_consultation_desc:0 "Customs disputes and unrest create calls for military supervision in the Caribbean. Seek civilian agreements first and define the limits of any intervention."
 US2_R_pan_american_conference:0 "Convene a Pan-American Conference"
 US2_R_pan_american_conference_desc:0 "American republics need a forum in which commercial disputes do not immediately become military demands. Invite consultation while leaving each government responsible for its own alignment."
 US2_R_pacific_diplomacy:0 "Consult the Pacific Powers"
 US2_R_pacific_diplomacy_desc:0 "American possessions and commerce require steady relations with Japan and the other Pacific powers. Maintain negotiations while the navy assesses the demands of defending distant stations."
 US2_R_open_door:0 "Restate the Open Door Policy"
 US2_R_open_door_desc:0 "Commercial competition in China can tempt outside powers to establish exclusive zones. Defend access through diplomacy without creating an automatic American war over every Chinese dispute."
 US2_R_philippine_policy:0 "A Philippine Civilian Programme"
 US2_R_philippine_policy_desc:0 "Administration in the Philippines requires a political purpose beyond a chain of naval stations. Support civilian development while considering the islands’ future relationship with the United States."
 US2_R_pacific_nonaggression:0 "Keep Pacific Disputes Diplomatic"
 US2_R_pacific_nonaggression_desc:0 "Naval competition does not require an immediate American-Japanese war. Preserve consultation while preparing the country to defend the commitments it actually holds."
 US2_R_industry_survey:0 "National Industry Survey"
 US2_R_industry_survey_desc:0 "Count machine tools, rail junctions and shipyard capacity before federal contracts are issued."
 US2_R_federal_reserve:0 "Use Federal Reserve Credit"
 US2_R_federal_reserve_desc:0 "We will steady long term industrial credit. Predictable finance lets factories expand without a panic driven rush for capital."
 US2_R_railroad_board:0 "Create a Railroad Board"
 US2_R_railroad_board_desc:0 "We will give railroads a common freight timetable. Priority movement joins mines, arsenals and ports while preserving scarce rolling stock."
 US2_R_steel_districts:0 "Coordinate the Steel Districts"
 US2_R_steel_districts_desc:0 "We will align Pennsylvania and Illinois furnaces with national orders. Steel output serves rails, tools and armaments through contracts that reward delivery."
 US2_R_machine_tools:0 "Expand Machine Tools"
 US2_R_machine_tools_desc:0 "We will treat precision lathes as a strategic foundation. Shared standards let small shops produce parts for larger contracts."
 US2_R_agricultural_logistics:0 "Organize Agricultural Logistics"
 US2_R_agricultural_logistics_desc:0 "We will connect grain elevators, refrigerated cars and army depots. Better movement keeps soldiers supplied without creating a separate food mechanic."
 US2_R_shipyards:0 "Modernize the Shipyards"
 US2_R_shipyards_desc:0 "We will coordinate Atlantic yards around repeatable hull designs. American dockworkers deliver merchant tonnage and naval auxiliaries on a dependable schedule."
 US2_R_mining_bureau:0 "Create a Mining Bureau"
 US2_R_mining_bureau_desc:0 "We will catalogue coal and iron seams for an expanding industrial base. Survey teams guide investment toward mines with reliable rail access."
 US2_R_reserve_discount:0 "Lower the Reserve Discount"
 US2_R_reserve_discount_desc:0 "We will make seasonal credit available to manufacturers and carriers. The measure keeps productive capacity running when foreign orders fluctuate."
 US2_R_standard_gauge:0 "Standardise Freight Car Fittings"
 US2_R_standard_gauge_desc:0 "Freight cars must move between private railways without delays over incompatible fittings. Agree common inspection and interchange standards that suit an already connected national network."
 US2_R_carnegie_steel:0 "Secure Carnegie Steel Contracts"
 US2_R_carnegie_steel_desc:0 "We will turn Pittsburgh furnace capacity toward predictable government orders. Contracts bind steel output to rails, armor and tools without nationalizing private works."
 US2_R_tool_standardization:0 "Standardize Tooling"
 US2_R_tool_standardization_desc:0 "We will publish interchangeable dimensions for machine tools. American workshops shorten repairs by sharing the same gauges and drawings."
 US2_R_grain_elevators:0 "Build Grain Elevators"
 US2_R_grain_elevators_desc:0 "We will expand storage around interior rail junctions. Reserve capacity keeps harvests moving when shipping is tight."
 US2_R_merchant_shipyards:0 "Back Merchant Shipyards"
 US2_R_merchant_shipyards_desc:0 "We will place merchant construction on a repeatable schedule. Coastal yards receive steel and engines in the order that keeps hulls moving."
 US2_R_coal_committee:0 "Direct Coal Allocation"
 US2_R_coal_committee_desc:0 "We will give coal consumers a common allocation board. Furnaces, railways and depots receive fuel before shortages slow production."
 US2_R_national_clearinghouse:0 "Open a National Clearinghouse"
 US2_R_national_clearinghouse_desc:0 "We will share orders and inventories across federal departments. A single ledger exposes shortages early and matches unused capacity to urgent work."
 US2_R_motor_rail:0 "Motor Lorries at Freight Terminals"
 US2_R_motor_rail_desc:0 "Rail terminals need dependable local delivery to factories and supply depots. Test motor lorries for that work while keeping long distance heavy freight on the railways."
 US2_R_armor_plate:0 "Produce Armor Plate"
 US2_R_armor_plate_desc:0 "We will reserve heavy rolling capacity for armor plate. American mills learn to meet naval and artillery specifications on schedule."
 US2_R_interchangeable_parts:0 "Adopt Interchangeable Parts"
 US2_R_interchangeable_parts_desc:0 "We will train inspectors around common gauges and tolerances. Interchangeability makes arms repair faster from an Ohio plant to a field depot."
 US2_R_army_supply:0 "Reform Army Supply"
 US2_R_army_supply_desc:0 "We will tie quartermaster orders to rail schedules and depot capacity. Better planning turns American manufacturing into reliable field supply."
 US2_R_navy_yards:0 "Expand Navy Yards"
 US2_R_navy_yards_desc:0 "We will add covered work space around established naval yards. Dockworkers gain capacity to repair escorts while new hulls continue through the slips."
 US2_R_war_industries_board:0 "War Industries Board"
 US2_R_war_industries_board_desc:0 "Standardise federal contracts and ration scarce steel so the American programme can scale quickly."
 US2_R_federal_procurement:0 "Centralize Federal Procurement"
 US2_R_federal_procurement_desc:0 "We will publish common specifications for every department. Central orders reduce duplicate designs and give firms confidence to add shifts."
 US2_R_inland_waterway:0 "Use Inland Waterways"
 US2_R_inland_waterway_desc:0 "We will move bulk freight by river where rails are under pressure. Barges complement the network and lower the distance coal travels to furnaces."
 US2_R_ordnance_contracts:0 "Issue Ordnance Contracts"
 US2_R_ordnance_contracts_desc:0 "We will place artillery orders with plants meeting measured tolerances. Inspectors and advance payments turn capacity into dependable field pieces."
 US2_R_aircraft_materials:0 "Secure Aircraft Materials"
 US2_R_aircraft_materials_desc:0 "We will reserve aluminum, engines and fabric for the new air arm. Materials research lets American factories learn aircraft production safely."
 US2_R_meatpacking_board:0 "Coordinate Meatpacking"
 US2_R_meatpacking_board_desc:0 "We will align inspection, cold storage and army contracts. Predictable deliveries protect soldiers' rations without adding a new resource system."
 US2_R_emergency_shipbuilding:0 "Begin Emergency Shipbuilding"
 US2_R_emergency_shipbuilding_desc:0 "We will put emergency hull orders beside merchant yards. Standardized construction replaces lost tonnage and keeps American exports moving."
 US2_R_controlled_materials:0 "Control Critical Materials"
 US2_R_controlled_materials_desc:0 "We will allocate copper, rubber and steel by delivery priority. Transparent schedules keep armament plants working while civilian needs remain visible."
 US2_R_liberty_loans:0 "Finance Liberty Orders"
 US2_R_liberty_loans_desc:0 "We will connect public subscriptions to contracts with workers and materials. Treasury finance sustains production without creating a debt counter."
 US2_R_rail_priorities:0 "Set Rail Priorities"
 US2_R_rail_priorities_desc:0 "We will give military freight a published place in the timetable. Clear priorities prevent one emergency order from paralyzing the network."
 US2_R_artillery_expansion:0 "Expand Artillery Production"
 US2_R_artillery_expansion_desc:0 "We will add inspected artillery lines to the national order book. American crews receive dependable guns and a trained maintenance chain."
 US2_R_airplane_contracts:0 "Award Airplane Contracts"
 US2_R_airplane_contracts_desc:0 "We will give aircraft makers stable specifications and milestones. Early American aviation grows through measured procurement."
 US2_R_cold_storage:0 "Expand Cold Storage"
 US2_R_cold_storage_desc:0 "We will place cold rooms at rail and port junctions. Stored provisions travel farther while inspectors keep the army supplied."
 US2_R_merchant_fleet:0 "Build a Merchant Fleet"
 US2_R_merchant_fleet_desc:0 "We will commission standardized freighters for Atlantic service. A larger merchant fleet carries American production without a new stockpile mechanic."
 US2_R_standard_contracts:0 "Publish Standard Contracts"
 US2_R_standard_contracts_desc:0 "We will make delivery clauses and inspection rules identical. Firms expand with less uncertainty when every bureau measures the same result."
 US2_R_treasury_procurement:0 "Link Treasury to Procurement"
 US2_R_treasury_procurement_desc:0 "We will place Treasury schedules beside the production calendar. Predictable payments keep emergency factories supplied with labor and materials."
 US2_R_transcontinental_freight:0 "Prioritize Transcontinental Freight"
 US2_R_transcontinental_freight_desc:0 "We will reserve long haul paths for western grain, minerals and engines. The timetable makes distance a manageable planning problem."
 US2_R_army_arsenals:0 "Strengthen Army Arsenals"
 US2_R_army_arsenals_desc:0 "We will modernize federal arsenals around repeatable small arms work. Skilled inspectors turn contracts into equipment that field units can repair."
 US2_R_convoy_shipbuilding:0 "Protect Convoy Shipbuilding"
 US2_R_convoy_shipbuilding_desc:0 "We will dedicate slips and engines to escortable merchant hulls. Standard work keeps the ocean route open as American output reaches the Allies."
 US2_R_industrial_mobilization:0 "Industrial Mobilisation"
 US2_R_industrial_mobilization_desc:0 "Link the treasury, arsenals and freight priorities into a national war production timetable."
 US2_R_national_highways:0 "Build National Highways"
 US2_R_national_highways_desc:0 "We will connect factories to railheads and ports with all weather roads. Shorter local hauls release trains for strategic freight."
 US2_R_federal_arsenals:0 "Coordinate Federal Arsenals"
 US2_R_federal_arsenals_desc:0 "We will share drawings, gauges and maintenance methods among plants. Common practice makes American weapons easier to replace in the field."
 US2_R_postwar_merchant_conversion:0 "Convert Emergency Yards"
 US2_R_postwar_merchant_conversion_desc:0 "We will convert emergency hull lines after the armistice. Demobilization releases wartime capacity while preserving yards and skills."
 US2_R_territorial_program:0 "Open the Territorial Works Program"
 US2_R_territorial_program_desc:0 "We will connect the canal, island stations and northern territories to the continental supply system. Investment follows local conditions under accountable administration."
 US2_R_panama_canal_works:0 "Improve Canal Works"
 US2_R_panama_canal_works_desc:0 "We will maintain the Canal Zone's roads and service corridors. Reliable movement through Panama shortens the route between American oceans."
 US2_R_alaska_logistics:0 "Organize Alaskan Logistics"
 US2_R_alaska_logistics_desc:0 "We will improve routes linking Alaskan settlements, ports and depots. A measured program supports the territory without off map industry."
 US2_R_hawaii_yards:0 "Support Hawaiian Stations"
 US2_R_hawaii_yards_desc:0 "We will reinforce infrastructure around Hawaii's naval station. Better services keep the Pacific fleet supplied within existing administration."
 US2_R_puerto_rico_works:0 "Expand Puerto Rico Works"
 US2_R_puerto_rico_works_desc:0 "We will improve roads and depots around established facilities. Local construction strengthens Caribbean routes without adding factories outside cores."
 US2_R_philippine_administration:0 "Coordinate Philippine Procurement"
 US2_R_philippine_administration_desc:0 "We will align procurement with the Philippine government's administration. Equipment and training improve defense while local institutions remain intact."
 US2_R_canal_rail:0 "Link Canal Railheads"
 US2_R_canal_rail_desc:0 "We will connect Canal Zone depots to the docks with a single timetable. Short inland hauls keep transoceanic traffic moving through the locks."
 US2_R_alaska_mining:0 "Survey Alaskan Minerals"
 US2_R_alaska_mining_desc:0 "We will map mineral deposits that can support northern construction. Survey work guides later investment without granting an instant factory."
 US2_R_pearl_harbor_logistics:0 "Supply Pearl Harbor"
 US2_R_pearl_harbor_logistics_desc:0 "We will coordinate fuel, repair stores and harbor access around Pearl Harbor. The station serves the Pacific fleet through practical logistics."
 US2_R_puerto_rico_ports:0 "Connect Puerto Rican Ports"
 US2_R_puerto_rico_ports_desc:0 "We will improve roads joining Puerto Rican ports to storage and repair sites. Better links support Caribbean shipping through existing facilities."
 US2_R_philippine_procurement:0 "Fund Philippine Workshops"
 US2_R_philippine_procurement_desc:0 "We will place American orders with workshops serving the Philippine garrison. Equipment contracts reward production without forcing annexation or puppeting."
 US2_R_caribbean_stations:0 "Link Caribbean Stations"
 US2_R_caribbean_stations_desc:0 "We will coordinate signals and supplies between the canal and island routes. Shared schedules make the Caribbean a dependable transit region."
 US2_R_alaska_communications:0 "Extend Alaskan Communications"
 US2_R_alaska_communications_desc:0 "We will connect northern posts with reliable communications equipment. Better information makes seasonal logistics easier to plan."
 US2_R_pacific_telegraph:0 "Build Pacific Telegraph Links"
 US2_R_pacific_telegraph_desc:0 "We will improve telegraph links between Hawaii and continental offices. Faster reports help fleets and depots respond to changing conditions."
 US2_R_antilles_shipping:0 "Schedule Antilles Shipping"
 US2_R_antilles_shipping_desc:0 "We will publish a regular schedule for Caribbean cargo and repair calls. Reliable shipping supports the islands without a custom resource or stockpile."
 US2_R_philippine_constabulary:0 "Train the Philippine Constabulary"
 US2_R_philippine_constabulary_desc:0 "We will provide measured training and small arms for local security forces. Cooperation strengthens defense while preserving the Philippine chain of administration."
 US2_R_territorial_roads:0 "Build Territorial Roads"
 US2_R_territorial_roads_desc:0 "We will join island and northern roads to the depots that serve them. Practical connections improve supply without off map factories."
 US2_R_pacific_fleet_support:0 "Support the Pacific Fleet"
 US2_R_pacific_fleet_support_desc:0 "We will coordinate station services from Hawaii to the canal. Prepared repairs and fuel keep the fleet active over long distances."
 US2_R_territorial_supply_offices:0 "Open Territorial Supply Offices"
 US2_R_territorial_supply_offices_desc:0 "We will place accountable supply officers at the main territorial routes. Their ledgers match equipment to local needs before shortages become crises."
 US2_R_integrated_territorial_logistics:0 "Integrate Territorial Logistics"
 US2_R_integrated_territorial_logistics_desc:0 "We will connect the canal, Pacific stations, Caribbean routes and northern depots. A practical network supports defense without coercive territorial expansion."
 US2_R_selective_service:0 "Organise the Recruiting Districts"
 US2_R_selective_service_desc:0 "County boards turn the Selective Service Act into a national manpower register. Their work makes expansion possible while leaving the pre-war republic formally at peace."
 US2_R_springfield_rifles:0 "Springfield Armory Output"
 US2_R_springfield_rifles_desc:0 "Springfield Armory expands inspection, tooling, and rifle output for a mass army. Production planners treat gauges and spare parts as combat equipment."
 US2_R_browning_automatic_rifles:0 "Browning Automatic Rifles"
 US2_R_browning_automatic_rifles_desc:0 "John Browning’s automatic rifle gives infantry a mobile source of covering fire. Trials focus on carrying ammunition and keeping the weapon reliable in mud."
 US2_R_american_artillery:0 "American Field Artillery"
 US2_R_american_artillery_desc:0 "American batteries expand beyond parade-ground drill toward observed fire and rapid displacement. The branch makes the 75 mm gun useful beside a larger allied artillery system."
 US2_R_trench_engineering:0 "Trench Engineering"
 US2_R_trench_engineering_desc:0 "Engineers standardise wire, shelters, dugouts, and communication trenches for the Western Front. Their designs give new divisions a defensive craft before they meet German artillery."
 US2_R_general_staff:0 "General Staff Studies"
 US2_R_general_staff_desc:0 "The General Staff turns European reports into maps, mobilisation tables, and operational estimates. Officers learn to revise assumptions when railways and machine guns change the problem."
 US2_R_army_medical:0 "Army Medical Corps"
 US2_R_army_medical_desc:0 "Army surgeons organise evacuation, field hospitals, sanitation, and replacement medical stores. Preventing disease becomes part of keeping a division in the line."
 US2_R_signal_corps:0 "Signal Corps Expansion"
 US2_R_signal_corps_desc:0 "The Signal Corps expands field telephones, radio sets, wire teams, and trained operators. Reliable reports help American commanders coordinate guns and infantry over broken ground."
 US2_R_railway_board:0 "Military Railway Board"
 US2_R_railway_board_desc:0 "A military railway board reserves locomotives, timetables, and repair crews for mobilisation. Its schedules connect inland depots to Atlantic embarkation points while keeping inland transport dependable."
 US2_R_national_guard:0 "National Guard Integration"
 US2_R_national_guard_desc:0 "National Guard units receive common tables, officers, and mobilisation procedures. Integration preserves local identity while giving federal command a usable reserve."
 US2_R_pershing_command:0 "Pershing Command"
 US2_R_pershing_command_desc:0 "John Pershing receives a command structure prepared to train and direct a national expeditionary force. The arrangement leaves operational decisions with American headquarters once divisions arrive."
 US2_R_pancho_villa_lessons:0 "Pancho Villa Lessons"
 US2_R_pancho_villa_lessons_desc:0 "The Columbus raid and the Punitive Expedition expose the cost of long supply lines and uncertain intelligence. Officers record those lessons without creating an automatic Mexican intervention."
 US2_R_army_aviation_link:0 "Army Aviation Liaison"
 US2_R_army_aviation_link_desc:0 "Army aviators are attached to staffs that can request observation and report results. The arrangement connects a young air service to artillery rather than treating it as a separate spectacle."
 US2_R_supply_corps:0 "Quartermaster Supply Corps"
 US2_R_supply_corps_desc:0 "Quartermasters establish contracts, depots, and packing standards for an army preparing to cross the Atlantic. Supply planning starts with ledgers and freight capacity rather than free equipment."
 US2_R_m1917_rifle:0 "M1917 Rifle Conversion"
 US2_R_m1917_rifle_desc:0 "Springfield tooling alone cannot equip the expanding force, so arsenals adapt the M1917 pattern. Standardised manufacture closes the gap between American ambition and available rifles."
 US2_R_browning_m1917:0 "Browning M1917 Machine Guns"
 US2_R_browning_m1917_desc:0 "The water-cooled Browning M1917 gives battalions sustained fire from prepared positions. Crews train in belts, cooling, and traverses so the gun supports movement instead of merely guarding a trench."
 US2_R_75mm_guns:0 "75 mm Field Batteries"
 US2_R_75mm_guns_desc:0 "French 75 mm batteries teach American gunners rapid laying and observed concentrations. The lesson makes a familiar calibre useful in the coordinated fires of the AEF."
 US2_R_155mm_heavy_artillery:0 "155 mm Heavy Artillery"
 US2_R_155mm_heavy_artillery_desc:0 "American heavy artillery adopts 155 mm pieces for counter-battery work and trench depth. Fire planners learn that weight and ammunition supply must arrive together."
 US2_R_trench_battalions:0 "Trench Battalions"
 US2_R_trench_battalions_desc:0 "Engineer and infantry battalions rehearse wire cutting, dugout clearance, and consolidation. The method turns the first captured trench into a position that can survive the reply."
 US2_R_staff_college:0 "Command and General Staff School"
 US2_R_staff_college_desc:0 "Staff officers study allied operations, map exercises, and the limits of telephone control. Graduates carry a common vocabulary into divisions assembled from state units."
 US2_R_field_hospitals:0 "Forward Field Hospitals"
 US2_R_field_hospitals_desc:0 "Forward hospitals combine triage, surgery, sanitation, and evacuation routes near the line. Faster treatment protects experienced soldiers without pretending casualties can be removed from war."
 US2_R_wireless_sets:0 "Wireless Sets"
 US2_R_wireless_sets_desc:0 "Wireless sets give headquarters a second path when shellfire cuts telephone cable. Operators practise brevity and encryption so information reaches the guns before it becomes stale."
 US2_R_railway_mobilization:0 "Railway Mobilisation Tables"
 US2_R_railway_mobilization_desc:0 "Railway mobilisation tables match troop trains to ports, depots, and rolling-stock repairs. The board reduces idle formations without assuming that Europe can be reached instantly."
 US2_R_guard_divisions:0 "Guard Division Tables"
 US2_R_guard_divisions_desc:0 "National Guard divisions receive regular officers, artillery allocations, and replacement schedules. Their tables turn a political reserve into formations that Pershing can actually command."
 US2_R_pershing_planning:0 "Pershing’s Expeditionary Plan"
 US2_R_pershing_planning_desc:0 "Pershing’s headquarters sets standards for training, American command, and the commitment of divisions overseas. The plan keeps the AEF from becoming a collection of borrowed battalions."
 US2_R_border_maneuvers:0 "Border Maneuver Lessons"
 US2_R_border_maneuvers_desc:0 "Border manoeuvres against irregular forces expose weak reconnaissance, pack transport, and dispersed command. The army keeps the lesson as preparation rather than an automatic return to Mexico."
 US2_R_curtiss_observation:0 "Curtiss Observation Flights"
 US2_R_curtiss_observation_desc:0 "Curtiss aircraft and observers practise mapping columns, roads, and artillery positions. Their reports give commanders a practical bridge between cavalry reconnaissance and modern fire control."
 US2_R_supply_depots:0 "Organise Expeditionary Supplies"
 US2_R_supply_depots_desc:0 "Overseas depots and the troops protecting our supply routes must be prepared together. A dependable system of supply will allow the expeditionary force to sustain its operations."
 US2_R_aef_planning:0 "AEF Planning Staff"
 US2_R_aef_planning_desc:0 "The AEF planning staff combines American objectives with the fire and logistics lessons of France. Its maps set attainable phases instead of promising a parade-ground breakthrough."
 US2_R_aef_replacements:0 "AEF Replacement System"
 US2_R_aef_replacements_desc:0 "Replacement depots track trained men, specialists, and medical categories before divisions enter battle. A steady stream of reinforcements protects formations from being rebuilt from strangers overnight."
 US2_R_convoy_infantry:0 "Convoy Infantry Training"
 US2_R_convoy_infantry_desc:0 "Infantry trains for embarkation, disembarkation, and movement under submarine threat. The programme links the convoy timetable to the division’s readiness on shore."
 US2_R_combined_arms:0 "American Combined Arms"
 US2_R_combined_arms_desc:0 "American staffs combine infantry, tanks, aircraft, engineers, and artillery for a single assault plan. The AEF learns to preserve tempo after the first German position falls."
 US2_R_creeping_barrage:0 "Creeping Barrage School"
 US2_R_creeping_barrage_desc:0 "Gunners and infantry rehearse a barrage that moves by clock and map reference. Close liaison keeps assault waves behind the shells while limiting friendly fire."
 US2_R_deep_defence:0 "Depth Defence Lessons"
 US2_R_deep_defence_desc:0 "American officers study layered positions, reverse slopes, and reserves behind the first line. The result is a defence that buys time without abandoning the counterattack."
 US2_R_storm_sections:0 "Storm Sections"
 US2_R_storm_sections_desc:0 "Small assault sections carry grenades, Browning guns, and wire cutters into the first trench. Their narrow task clears a lane for battalions that follow with heavier equipment."
 US2_R_chemical_defence:0 "Chemical Defence Service"
 US2_R_chemical_defence_desc:0 "The Chemical Warfare Service combines warning, respirators, decontamination, and medical treatment. Units practise surviving gas without mistaking protective routine for immunity."
 US2_R_army_tanks:0 "American Tank Detachments"
 US2_R_army_tanks_desc:0 "American tank detachments compare Renault machines with domestic designs and infantry needs. Crews learn that maintenance, signals, and recovery matter as much as armour."
 US2_R_motor_transport:0 "Motor Transport Corps"
 US2_R_motor_transport_desc:0 "Motor Transport Corps units organise trucks, workshops, fuel, and traffic control for the AEF. Reliable movement lets reserves and ammunition keep pace with an attack."
 US2_R_selective_training:0 "Selective Training Camps"
 US2_R_selective_training_desc:0 "Selective Service camps standardise drill, marksmanship, and non-commissioned officer instruction. Their graduates arrive less raw when the United States finally enters a major war."
 US2_R_artillery_observers:0 "Artillery Observation School"
 US2_R_artillery_observers_desc:0 "Observers learn map grids, sound reports, and aircraft corrections beside the gun line. Their work turns artillery from a stockpile into a coordinated battlefield arm."
 US2_R_american_expeditionary_force:0 "American Expeditionary Force"
 US2_R_american_expeditionary_force_desc:0 "The United States commits a national expeditionary force under Pershing’s command. Training, transport, and American formations now answer one wartime headquarters."
 US2_R_front_rotation:0 "Front Rotation System"
 US2_R_front_rotation_desc:0 "Division rotation balances leave, rest, replacements, and time under bombardment. PÃ©tain’s lessons abroad are adapted to keep American morale from being spent in one battle."
 US2_R_renault_ft_lessons:0 "Renault FT Lessons"
 US2_R_renault_ft_lessons_desc:0 "American crews study the Renault FT as a small tank that can cross ground with infantry. The lesson favours reliable cooperation over unsupported armoured spectacle."
 US2_R_meuse_argonne_lessons:0 "Meuse-Argonne Lessons"
 US2_R_meuse_argonne_lessons_desc:0 "The Meuse-Argonne offensive becomes a school in forests, artillery congestion, and stubborn German positions. Reports identify how to rotate units and keep objectives attainable."
 US2_R_army_reorganisation:0 "Army Reorganisation"
 US2_R_army_reorganisation_desc:0 "The wartime army aligns divisions, depots, transport, and replacements after the first campaigns. Reorganisation turns emergency expansion into a force that can learn between offensives."
 US2_R_general_offensive:0 "General Offensive Doctrine"
 US2_R_general_offensive_desc:0 "American commanders combine short objectives, rolling fires, and fresh reserves for a general offensive. The doctrine values sustained pressure rather than one irreversible gamble."
 US2_R_pershing_reserves:0 "Pershing’s Reserves"
 US2_R_pershing_reserves_desc:0 "Pershing holds trained formations and transport ready to reinforce the decisive sector. Reserve commitment becomes a deliberate operational choice supported by current reports."
 US2_R_1918_methods:0 "The 1918 American Method"
 US2_R_1918_methods_desc:0 "The 1918 method links tanks, aircraft, storm sections, and artillery to a measured advance. American formations apply the war’s lessons without erasing the cost of learning them."
 US2_R_army_command_1918:0 "The 1918 Army Command"
 US2_R_army_command_1918_desc:0 "Consolidate AEF replacements, artillery observers and combined arms into an American field command."
 US2_R_1916_naval_programme:0 "The 1916 Naval Programme"
 US2_R_1916_naval_programme_desc:0 "The 1916 programme funds battleships, destroyers, submarines, and supporting yards. Congress treats a modern navy as insurance while neutrality still shapes policy."
 US2_R_battleship_line:0 "American Battleship Line"
 US2_R_battleship_line_desc:0 "American dreadnoughts practise formation steaming, range finding, and guarded fleet action. The line is built to deter and cover sea lanes rather than seek a reckless decisive sortie."
 US2_R_destroyer_squadrons:0 "Destroyer Squadrons"
 US2_R_destroyer_squadrons_desc:0 "Destroyer squadrons train for screens, patrols, rescue work, and submarine hunts. Their dispersed presence gives the fleet eyes and escorts where capital ships cannot be everywhere."
 US2_R_submarine_theory:0 "Submarine Theory"
 US2_R_submarine_theory_desc:0 "Submarine officers study patrol lines, battery endurance, and the limits of torpedo attacks. The theory values disciplined reconnaissance over an impossible search for every enemy ship."
 US2_R_naval_aviation:0 "Naval Aviation"
 US2_R_naval_aviation_desc:0 "The Navy links seaplanes, coastal stations, and shipborne observers to the fleet. Early naval aviation exists to find submarines and surface contacts before they threaten convoys."
 US2_R_navy_gunnery:0 "Navy Gunnery School"
 US2_R_navy_gunnery_desc:0 "Navy gunnery schools practise range finding, spotting, and salvo discipline under changing Atlantic light. Crews learn to make ammunition count when a target appears briefly."
 US2_R_brooklyn_yards:0 "Brooklyn Navy Yard"
 US2_R_brooklyn_yards_desc:0 "Brooklyn expands cranes, slips, and trained artificers for the 1916 construction surge. Yard records reduce time lost to routine refit and unfinished fittings."
 US2_R_newport_news_yards:0 "Newport News Yards"
 US2_R_newport_news_yards_desc:0 "Newport News coordinates steel, turbines, and hull construction for the expanding fleet. Production planning connects shipbuilding to the parts and dock space that sustain it."
 US2_R_mare_island_yard:0 "Mare Island Support"
 US2_R_mare_island_yard_desc:0 "Mare Island supports Pacific fleet maintenance while Atlantic demands grow. A maintained reserve gives Washington options without teleporting ships into a theatre."
 US2_R_naval_reserves:0 "Naval Reserve Organisation"
 US2_R_naval_reserves_desc:0 "Naval reservists receive common signals, engineering, and deck training before mobilisation. The system makes civilian maritime skill useful without pretending every sailor is a veteran."
 US2_R_dreadnoughts:0 "Dreadnought Construction"
 US2_R_dreadnoughts_desc:0 "American dreadnought construction expands the battle line around New York and Virginia yards. The programme weighs armour, range, and fuel against the practical limits of wartime dockyards."
 US2_R_standard_destroyers:0 "Standard Destroyers"
 US2_R_standard_destroyers_desc:0 "The Navy standardises destroyer machinery, torpedoes, and repair parts for large orders. Common patterns make escort flotillas easier to train and keep at sea."
 US2_R_convoy_escorts:0 "Convoy Escorts"
 US2_R_convoy_escorts_desc:0 "Destroyers practise convoy station keeping, depth-charge attacks, and rescue procedures. Escort work becomes a repeatable service for troops and supplies moving through submarine waters."
 US2_R_submarine_patrols:0 "Submarine Patrols"
 US2_R_submarine_patrols_desc:0 "American boats receive patrol sectors, torpedo allocations, and maintenance cycles suited to the Atlantic. Commanders conserve batteries and break contact when a hunt turns cold."
 US2_R_curtiss_navy_aircraft:0 "Curtiss Naval Aircraft"
 US2_R_curtiss_navy_aircraft_desc:0 "Curtiss aircraft are adapted for ship spotting, coastal patrols, and seaplane operations. Naval observers learn to turn a sighting into a usable fleet report."
 US2_R_fleet_gunnery:0 "Fleet Gunnery Practice"
 US2_R_fleet_gunnery_desc:0 "Fleet exercises link rangefinders, plotting rooms, and signal flags across a battle line. Better fire control lets ships concentrate without losing formation."
 US2_R_destroyer_bases:0 "Destroyer Bases"
 US2_R_destroyer_bases_desc:0 "Forward destroyer bases hold fuel, torpedoes, depth charges, and repair crews near convoy routes. Their stores shorten the time between patrols without building off-map facilities."
 US2_R_torpedo_school:0 "Torpedo School"
 US2_R_torpedo_school_desc:0 "Torpedo officers study approach angles, spreads, and the discipline needed to wait for a real target. The school improves the use of scarce weapons instead of promising automatic sinkings."
 US2_R_naval_radio:0 "Naval Radio Service"
 US2_R_naval_radio_desc:0 "Naval radio stations coordinate escorts, aircraft, and fleet headquarters across long distances. Operators practise concise reports so the fleet can act before a contact disappears."
 US2_R_atlantic_fleet:0 "Atlantic Fleet Readiness"
 US2_R_atlantic_fleet_desc:0 "The Atlantic fleet rotates fuel, ammunition, and crews through a common readiness schedule. A ship that is available on paper must also be ready to sail."
 US2_R_ocean_convoys:0 "Ocean Convoy System"
 US2_R_ocean_convoys_desc:0 "The United States adopts escorted sailing schedules for troops, coal, and munitions. Regular routes give destroyers useful information and deny submarines isolated targets."
 US2_R_anti_submarine_warfare:0 "Anti-Submarine Warfare"
 US2_R_anti_submarine_warfare_desc:0 "Lookouts, hydrophones, aircraft, and depth-charge crews train as one hunting system. The fleet learns to force submarines down and protect the convoy’s timetable."
 US2_R_battle_fleet_readiness:0 "Battle Fleet Readiness"
 US2_R_battle_fleet_readiness_desc:0 "Battle squadrons rehearse sortie orders, refuelling, and protected withdrawal. Readiness is measured by a complete fleet movement rather than a single ship’s gunnery score."
 US2_R_naval_repair:0 "Fleet Repair Service"
 US2_R_naval_repair_desc:0 "Repair ships and base workshops share priority lists for boilers, hull plates, and weapons. Faster return to duty keeps escort and fleet plans from collapsing after one damaged vessel."
 US2_R_azores_patrols:0 "Azores Patrols"
 US2_R_azores_patrols_desc:0 "American patrols watch the Atlantic approaches around the Azores and support the convoy routes. Cooperation with the Portuguese authorities allows crews to service their aircraft and ships without altering island sovereignty."
 US2_R_naval_air_patrol:0 "Naval Air Patrols"
 US2_R_naval_air_patrol_desc:0 "Naval aircraft extend the fleet’s search around ports and convoy lanes. Observers report submarines early enough for destroyers to choose a useful intercept."
 US2_R_escort_command:0 "Atlantic Escort Command"
 US2_R_escort_command_desc:0 "Give destroyer flotillas, convoy routes and naval radio one operational escort headquarters."
 US2_R_battleship_logistics:0 "Battleship Logistics"
 US2_R_battleship_logistics_desc:0 "Fuel, shells, and dock time are planned around the battle fleet’s actual endurance. Logistics keeps dreadnoughts useful without forcing an unsafe search for a decisive fight."
 US2_R_hampton_roads_output:0 "Hampton Roads Output"
 US2_R_hampton_roads_output_desc:0 "Hampton Roads coordinates construction, repair, and ammunition flow for the Atlantic fleet. Industrial output becomes a dependable stream of hulls and readiness work."
 US2_R_air_service_act:0 "The Aviation Section"
 US2_R_air_service_act_desc:0 "The Air Service Act gives aviation a legal structure, instructors, and procurement authority. Organisation matters because aircraft without mechanics and observers cannot serve an army."
 US2_R_curtiss_jn4:0 "Curtiss JN-4 Trainers"
 US2_R_curtiss_jn4_desc:0 "Curtiss JN-4 trainers give new pilots a forgiving machine for navigation and observation practice. Training records make flight hours a military resource rather than a private hobby."
 US2_R_air_observation:0 "Air Observation"
 US2_R_air_observation_desc:0 "Observation crews map roads, trenches, and artillery flashes for commanders below. Their reports connect aviation to the decisions made by guns and infantry."
 US2_R_pilot_training:0 "Pilot Training Schools"
 US2_R_pilot_training_desc:0 "Pilot schools teach navigation, emergency landings, and disciplined observation alongside flying. Graduates reach the front with habits that preserve both aircraft and information."
 US2_R_fighter_experiments:0 "Fighter Experiments"
 US2_R_fighter_experiments_desc:0 "American pilots study European fighter reports while domestic workshops test armament and engines. The experiments favour machines that can protect observers and return for another sortie."
 US2_R_bomber_experiments:0 "Bomber Experiments"
 US2_R_bomber_experiments_desc:0 "Bomber crews test target selection, weather judgement, and the limits of early aircraft loads. Their reports favour repeatable battlefield work over spectacular claims."
 US2_R_airfields:0 "Forward Airfields"
 US2_R_airfields_desc:0 "Forward landing grounds add fuel, telephones, camouflage, and simple repair space near the army. Dispersal keeps one cratered strip from silencing every squadron in a sector."
 US2_R_air_mechanics:0 "Air Mechanics Corps"
 US2_R_air_mechanics_desc:0 "Mechanics standardise engines, fabric, propellers, and field inspections for American aircraft. A reliable ground crew gives pilots more useful sorties than a paper fleet of machines."
 US2_R_aef_observation:0 "AEF Observation Squadrons"
 US2_R_aef_observation_desc:0 "AEF observation squadrons fly grids, photographs, and artillery corrections over the Western Front. Pilots and observers learn a common routine for turning a sighting into action."
 US2_R_aef_fighters:0 "AEF Fighter Protection"
 US2_R_aef_fighters_desc:0 "Fighter squadrons protect observation aircraft and deny the enemy an easy view of American movements. Patrols are assigned to the mission rather than chasing every distant contact."
 US2_R_aef_bombers:0 "AEF Tactical Bombers"
 US2_R_aef_bombers_desc:0 "Tactical bombers strike railheads, batteries, and reserves in support of an operation on the ground. Crews coordinate target lists and weather instead of treating bombing as an independent war."
 US2_R_escadrille_staff:0 "Coordinate AEF Reconnaissance"
 US2_R_escadrille_staff_desc:0 "Experienced liaison officers and trained reconnaissance crews will help the expeditionary force see beyond its own lines. Their reports must reach the staff while there is still time to act."
 US2_R_daylight_sorties:0 "Daylight Sorties"
 US2_R_daylight_sorties_desc:0 "Daylight sortie planning accounts for visibility, enemy fighters, and the changing front. Mission officers prefer timely reports and survivable flights to empty sortie counts."
 US2_R_aircraft_production:0 "Aircraft Production"
 US2_R_aircraft_production_desc:0 "American factories standardise airframes, engines, and spares for a growing service. Production planning joins delivery schedules to the mechanics who must keep each type flying."
 US2_R_air_service_logistics:0 "Air Service Logistics"
 US2_R_air_service_logistics_desc:0 "Fuel, cameras, ammunition, and replacement engines move through a dedicated aviation supply system. The service protects sortie rates without creating off-map resources."
 US2_R_interception_doctrine:0 "Interception Doctrine"
 US2_R_interception_doctrine_desc:0 "American fighters combine lookout reports, patrol lines, and quick reaction over key sectors. The doctrine values denying enemy observation as much as claiming airspace."
 US2_R_close_support:0 "Close Support Studies"
 US2_R_close_support_desc:0 "Close support studies signals, target marking, and safe distances between bombs and friendly troops. Pilots are taught to arrive where the ground plan needs them, not where the map looks impressive."
 US2_R_long_range_recon:0 "Long-Range Reconnaissance"
 US2_R_long_range_recon_desc:0 "Long-range reconnaissance tests engines, navigation, and the endurance needed beyond the front. Reports are valued for changing a decision, not for accumulating photographs."
 US2_R_air_service_reorganisation:0 "Air Service Reorganisation"
 US2_R_air_service_reorganisation_desc:0 "Turn the wartime air programme into a service that can supply, train and deploy squadrons together."
 US2_R_construction_foundation:0 "America’s Industrial Base — Research Programme"
 US2_R_mining_methods:0 "Create a Mining Bureau — Research Programme"
 US2_R_reserve_credit:0 "Lower the Reserve Discount — Research Programme"
 US2_R_motor_freight:0 "Motor Lorries at Freight Terminals — Research Programme"
 US2_R_canal_works:0 "Improve Canal Works — Research Programme"
 US2_R_philippine_workshops:0 "Fund Philippine Workshops — Research Programme"
 OT1_R_industry_shortcut:0 "Industry"
 OT1_R_provinces_shortcut:0 "Provinces"
 OT1_R_politics_shortcut:0 "Politics"
 OT1_R_diplomacy_shortcut:0 "Diplomacy"
 OT1_R_army_shortcut:0 "Army"
 OT1_R_navy_shortcut:0 "Navy"
 OT1_R_air_shortcut:0 "Aviation"
 OT1_R_constitutional_procedures:0 "A Working Constitutional Council"
 OT1_R_constitutional_procedures_desc:0 "Parliamentary rights require more than a proclamation and a series of emergency meetings. Agree procedures for legislation, expenditure and ministerial responsibility."
 OT1_R_imperial_registers:0 "Reconcile the Imperial Registers"
 OT1_R_imperial_registers_desc:0 "Taxation and recruitment depend on records that differ widely between districts. Begin reconciling those registers before the state asks the provinces for new obligations."
 OT1_R_cabinet_accounts:0 "Publish the Cabinet Accounts"
 OT1_R_cabinet_accounts_desc:0 "Deputies and provincial representatives ask how emergency appropriations are being used. Give them a regular account while acknowledging that publication constrains ministerial discretion."
 OT1_R_liberal_government:0 "A Freedom and Accord Coalition"
 OT1_R_liberal_government_desc:0 "Opposition deputies propose a coalition that restores ministerial responsibility and recognises provincial interests. Give that coalition a chance to govern without promising that every rival will accept its programme."
 OT1_R_unionist_secretariat:0 "Organise the Unionist Secretariat"
 OT1_R_unionist_secretariat_desc:0 "The Committee needs a routine for directing officials rather than a succession of private interventions. Establish a secretariat that strengthens coordination while exposing the cost of partisan government."
 OT1_R_said_halim_cabinet:0 "Said Halim Pasha’s Ministry"
 OT1_R_said_halim_cabinet_desc:0 "The grand vizier must reconcile the Committee’s influence with the responsibilities of ordinary ministries. Establish a cabinet procedure that prevents military and civilian offices from issuing conflicting demands."
 OT1_R_school_inspectorates:0 "Extend the School Inspectorates"
 OT1_R_school_inspectorates_desc:0 "Schools require trained teachers and consistent supervision if they are to serve a national programme. Expand the inspectorates while respecting the practical limits of district administration."
 OT1_R_wartime_directorate:0 "Coordinate the Wartime Ministries"
 OT1_R_wartime_directorate_desc:0 "Transport, procurement and recruitment offices compete for resources already stretched by war. A cabinet directorate can settle their priorities without pretending that administrative orders create new supplies."
 OT1_R_talat_cabinet:0 "Talat Pasha Becomes Grand Vizier"
 OT1_R_talat_cabinet_desc:0 "The Unionist leadership seeks closer control of a cabinet facing prolonged war and mounting discontent. Transfer the ministry to Talat while keeping the sovereign distinct from the government that administers the conflict."
 OT1_R_ministerial_review:0 "Review Unionist Appointments"
 OT1_R_ministerial_review_desc:0 "Provincial complaints reveal where party loyalty has displaced practical competence. Review the appointments even when doing so reduces the Committee’s immediate hold over the cabinet."
 OT1_R_unionist_responsibility:0 "Answer for the Emergency Government"
 OT1_R_unionist_responsibility_desc:0 "The cabinet must give a public account of the extraordinary obligations imposed during war. Establish a review that makes responsibility part of the Unionist programme rather than a threat that can simply be suppressed."
 OT1_R_parliamentary_ministry:0 "Restore Ministerial Responsibility"
 OT1_R_parliamentary_ministry_desc:0 "A coalition government must retain the confidence of deputies who do not all share one programme. Place responsibility for expenditure and appointments before a regular parliamentary ministry."
 OT1_R_provincial_elections:0 "Consult the Provincial Councils"
 OT1_R_provincial_elections_desc:0 "Provincial representatives ask for influence over the officials and works closest to their communities. Define a consultative procedure without surrendering the centre’s responsibility for defence and foreign affairs."
 OT1_R_commercial_courts:0 "Regularise the Commercial Courts"
 OT1_R_commercial_courts_desc:0 "Uncertain official practice discourages commercial investment and fuels disputes over contracts. Give the courts consistent procedures while keeping ministerial appointments subject to review."
 OT1_R_deputies_rights:0 "Protect the Rights of Deputies"
 OT1_R_deputies_rights_desc:0 "A parliamentary coalition cannot survive if dissenting deputies are treated as enemies of the state. Give debate a protected place while accepting that it constrains the cabinet’s freedom of action."
 OT1_R_civilian_oversight:0 "Negotiate Civilian Military Oversight"
 OT1_R_civilian_oversight_desc:0 "Military leaders fear that party competition will interfere with command and promotion. Establish oversight that separates professional appointments from the political responsibility of ministers."
 OT1_R_labour_arbitration:0 "Create Industrial Arbitration Boards"
 OT1_R_labour_arbitration_desc:0 "Disputes in essential workshops require a procedure more dependable than emergency policing. Invite employers and workers into negotiations recorded by civilian commissions."
 OT1_R_coalition_budget:0 "Agree a Coalition Budget"
 OT1_R_coalition_budget_desc:0 "The coalition needs an agreed budget that gives provincial commitments and military requests a clear place. Publish the priorities rather than promising every department a share that cannot be financed."
 OT1_R_civil_service_pact:0 "A Civil Service beyond the Parties"
 OT1_R_civil_service_pact_desc:0 "The government depends on officials able to continue their work when the cabinet changes. Establish appointment standards that prevent every coalition negotiation from becoming a purge of the departments."
 OT1_R_constitutional_coalition:0 "A Durable Constitutional Coalition"
 OT1_R_constitutional_coalition_desc:0 "The coalition must turn its procedures into a settlement that survives a ministerial dispute. Secure an agreement on confidence votes and provincial consultation before the next emergency tests it."
 OT1_R_palace_petitions:0 "Hear Petitions at the Imperial Court"
 OT1_R_palace_petitions_desc:0 "Provincial delegations bring complaints that ordinary ministerial correspondence has failed to resolve. Give those petitions a hearing while avoiding the creation of a second administration at the palace."
 OT1_R_inspection_commissions:0 "Send Royal Inspection Commissions"
 OT1_R_inspection_commissions_desc:0 "The palace needs reports that do not merely repeat the claims of rival ministers. Send inspectors to review official conduct and the condition of district services."
 OT1_R_constitutional_crown:0 "Keep the Crown within the Constitution"
 OT1_R_constitutional_crown_desc:0 "Royal influence can settle a cabinet dispute without replacing parliamentary government. Define limits on the palace’s intervention so that a settlement does not become another source of uncertainty."
 OT1_R_religious_services:0 "Inspect the Religious Endowments"
 OT1_R_religious_services_desc:0 "Schools and charitable services rely on endowments whose administration varies between districts. Bring trustees and officials into a review that protects their purpose without confiscating every local responsibility."
 OT1_R_crown_porte_council:0 "Convene the Crown and Porte Council"
 OT1_R_crown_porte_council_desc:0 "The sovereign and ministers require a forum that clarifies who decides each class of public business. Establish a council whose procedures can outlast the personal rivalry of the current office holders."
 OT1_R_imperial_arbitration:0 "Make Imperial Arbitration Predictable"
 OT1_R_imperial_arbitration_desc:0 "The authority of the crown weakens when every delegation expects a different private settlement. Publish the procedure for imperial arbitration and leave ordinary administration to responsible ministries."
 OT1_R_equal_protection:0 "Guarantee Equal Legal Protection"
 OT1_R_equal_protection_desc:0 "Common citizenship requires courts to protect subjects without treating their communities as separate standards of justice. Establish an administrative obligation that gives the constitutional promise a practical test."
 OT1_R_provincial_charters:0 "Negotiate Provincial Charters"
 OT1_R_provincial_charters_desc:0 "Local councils ask for defined powers rather than assurances dependent on the next cabinet. Negotiate charters that reserve defence and diplomacy to the centre while assigning ordinary services to the provinces."
 OT1_R_millet_consultation:0 "Consult the Empire’s Communities"
 OT1_R_millet_consultation_desc:0 "Religious and civic representatives seek safeguards for schools and public appointments. Bring them into negotiations that recognise existing communities without turning each into a foreign protectorate."
 OT1_R_arab_councils:0 "Agree an Arab Provincial Compact"
 OT1_R_arab_councils_desc:0 "Arab provincial leaders ask that local administration and representation be settled before new wartime obligations are imposed. Offer a compact with stated responsibilities rather than a promise that disappears when military demand rises."
 OT1_R_albanian_councils:0 "Recognise Albanian Civic Administration"
 OT1_R_albanian_councils_desc:0 "Albanian representatives demand control over local schools and public administration. Negotiate a charter while the empire still holds Albanian districts and can offer terms that have practical meaning."
 OT1_R_armenian_reform_commission:0 "Implement an Armenian Reform Commission"
 OT1_R_armenian_reform_commission_desc:0 "Eastern provincial representatives demand dependable protection and impartial official appointments. Establish an inspection commission whose work addresses those grievances before military emergency becomes an excuse to abandon them."
 OT1_R_shared_revenue:0 "Agree a Shared Revenue Schedule"
 OT1_R_shared_revenue_desc:0 "The centre and provincial councils cannot carry out their responsibilities without an agreed share of revenue. Publish a schedule that allows services to operate while preserving funds for common defence."
 OT1_R_federal_convention:0 "Summon the Imperial Convention"
 OT1_R_federal_convention_desc:0 "A lasting settlement needs delegates able to negotiate responsibilities across the empire. Convene them only when the cabinet and army are prepared to accept that provincial consent is part of governing."
 OT1_R_imperial_federation:0 "Ratify the Sublime Federation"
 OT1_R_imperial_federation_desc:0 "Delegates have agreed a division of public responsibilities that gives the provinces a recognised place in the state. Ratify the settlement as an imperial federation while retaining the common army and foreign policy."
 OT1_R_imperial_public_services:0 "Public Services beyond the Capital"
 OT1_R_imperial_public_services_desc:0 "The chosen government needs services that people encounter outside the capital’s political disputes. Coordinate district offices, sanitation and communications as a common responsibility of the state."
 OT1_R_refugee_commissions:0 "Commission Relief for Displaced Families"
 OT1_R_refugee_commissions_desc:0 "War and lost districts leave families dependent on uncertain local assistance. Give relief offices consistent records and responsibilities before grievances become another political emergency."
 OT1_R_war_obligations:0 "Account for the War’s Obligations"
 OT1_R_war_obligations_desc:0 "Military and civil offices ask the provinces for repeated contributions to a prolonged conflict. Publish the obligations and their limits rather than allowing every requisition to appear as a private demand."
 OT1_R_government_settlement:0 "A Government that Can Endure"
 OT1_R_government_settlement_desc:0 "A constitution or decree survives only when the cabinet, provinces and officers accept practical responsibilities under it. Consolidate the chosen settlement after restoring a workable balance among those institutions."
 OT1_R_postwar_commission:0 "Close the Emergency Administration"
 OT1_R_postwar_commission_desc:0 "Peace requires the government to end exceptional military contracts and appointments. Retain permanent industry while returning temporary programmes to ordinary administrative responsibility."
 OT1_R_industry_survey:0 "Survey the Imperial Workshops"
 OT1_R_industry_survey_desc:0 "Survey the machines and skilled workers that the Porte can actually employ. The resulting programme places scarce orders where the workshops can fulfil them."
 OT1_R_anatolian_rail:0 "An Anatolian Freight Spine"
 OT1_R_anatolian_rail_desc:0 "The Ankara freight network will link mobilisation areas and workshops. Local infrastructure and a transport programme improve routes the empire owns and controls."
 OT1_R_customs_reform:0 "A Predictable Contract Administration"
 OT1_R_customs_reform_desc:0 "Regular accounts will make workshop contracts dependable. Better administration supports factory preparation without adding a separate debt or revenue simulation."
 OT1_R_zonguldak_coal:0 "The Zonguldak Supply Programme"
 OT1_R_zonguldak_coal_desc:0 "Improve extraction methods and arrange dependable deliveries to the workshops. The programme supports existing resources and production rather than introducing a new resource system."
 OT1_R_tophane_procurement:0 "Ordnance Workshops First"
 OT1_R_tophane_procurement_desc:0 "Give Tophane and the Constantinople arsenals first claim on the industrial programme. An additional military line and production preparation compete with the civilian workshop priority."
 OT1_R_anatolian_textiles:0 "Civilian Workshops First"
 OT1_R_anatolian_textiles_desc:0 "Expand Bursa civilian production and give weaving and machinery firms the first major contracts. The programme chooses lasting civil capacity ahead of immediate ordnance expansion."
 OT1_R_istanbul_ports:0 "Constantinople Service Yards"
 OT1_R_istanbul_ports_desc:0 "The port programme will expand repair and construction capacity at Constantinople. Its additional dockyard supports the merchant fleet and naval service without promising a great-power battlefleet."
 OT1_R_baghdad_railway:0 "Prepare the Baghdad Route"
 OT1_R_baghdad_railway_desc:0 "Survey unloading points, rolling-stock requirements and depot schedules for the Baghdad route. The programme improves logistics knowledge without building in provinces the empire has lost."
 OT1_R_tariff_bureau:0 "Create a Tariff Bureau"
 OT1_R_tariff_bureau_desc:0 "We will organize create a tariff bureau through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_coal_rail:0 "Link Coal to the Railways"
 OT1_R_coal_rail_desc:0 "We will organize link coal to the railways through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_ordnance_gauges:0 "Common Ordnance Gauges"
 OT1_R_ordnance_gauges_desc:0 "Arsenal inspectors will use common tolerances for weapons and spares. Infantry equipment research now follows a production system that can maintain the result."
 OT1_R_bursa_looms:0 "Bursa Machinery and Looms"
 OT1_R_bursa_looms_desc:0 "Civilian workshops will adopt common machinery and maintenance standards. More efficient industrial research makes the weaving programme a foundation for later national workshops."
 OT1_R_istanbul_arsenal:0 "The Constantinople Arsenal Board"
 OT1_R_istanbul_arsenal_desc:0 "Arsenal officers and engineers will coordinate guns, ammunition and repair contracts. Artillery development becomes part of the same workshop programme as infantry weapons."
 OT1_R_anatolian_roads:0 "Roads behind the Railheads"
 OT1_R_anatolian_roads_desc:0 "Bursa roads will connect local workshops to the main freight network. Construction research helps the provincial programme extend improvements where they are still possible."
 OT1_R_hejaz_railway:0 "Maintain the Hejaz Service"
 OT1_R_hejaz_railway_desc:0 "Railway officers will coordinate maintenance teams, spare parts and depot schedules. Better supply organisation carries the Hejaz lessons into imperial transport without granting new territory."
 OT1_R_aleppo_depots:0 "Regional Depot Schedules"
 OT1_R_aleppo_depots_desc:0 "Regional depots will maintain common records for ammunition and transport needs. The Aleppo model helps the Porte coordinate supply without replacing provincial administration."
 OT1_R_rural_tax_ledgers:0 "Modernize Rural Tax Ledgers"
 OT1_R_rural_tax_ledgers_desc:0 "We will organize modernize rural tax ledgers through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_mesopotamian_grain:0 "Coordinate Mesopotamian Grain"
 OT1_R_mesopotamian_grain_desc:0 "We will organize coordinate mesopotamian grain through Ottoman workshops and provincial offices. Garrisons will receive provisions without creating a food system."
 OT1_R_coastal_repairs:0 "Coastal Repair Contracts"
 OT1_R_coastal_repairs_desc:0 "Schedule ship repairs and standardise stores between the remaining ports. A repair programme and naval equipment research support the modest fleet the empire can maintain."
 OT1_R_damascus_workshops:0 "Organize Damascus Workshops"
 OT1_R_damascus_workshops_desc:0 "We will organize organize damascus workshops through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_baghdad_roads:0 "Repair Baghdad Approaches"
 OT1_R_baghdad_roads_desc:0 "We will organize repair baghdad approaches through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_war_procurement:0 "Open the War Procurement Office"
 OT1_R_war_procurement_desc:0 "We will organize open the war procurement office through Ottoman workshops and provincial offices. A small office will match emergency contracts to available materials."
 OT1_R_railway_priorities:0 "Set Wartime Railway Priorities"
 OT1_R_railway_priorities_desc:0 "We will organize set wartime railway priorities through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_baghdad_logistics:0 "The Baghdad Supply Schedule"
 OT1_R_baghdad_logistics_desc:0 "Coordinate rolling stock and unloading capacity before demanding longer supply lines. The resulting schedule prepares provincial logistics for wartime pressure."
 OT1_R_army_arsenals:0 "The Army Arsenal Network"
 OT1_R_army_arsenals_desc:0 "The Constantinople programme will coordinate maintenance and support equipment across army workshops. Temporary production preparation gives the army a dependable service network."
 OT1_R_syrian_workshops:0 "Regional Repair Workshops"
 OT1_R_syrian_workshops_desc:0 "Regional workshops will concentrate on repair contracts and spare parts for the freight service. Their lessons support industrial research without assuming that Syria remains under imperial control."
 OT1_R_mesopotamia_canals:0 "Repair Mesopotamian Canals"
 OT1_R_mesopotamia_canals_desc:0 "We will organize repair mesopotamian canals through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_emergency_shipyards:0 "Commission Emergency Shipyards"
 OT1_R_emergency_shipyards_desc:0 "We will organize commission emergency shipyards through Ottoman workshops and provincial offices. The navy will gain repair capacity without an oversized dockyard programme."
 OT1_R_controlled_materials:0 "Allocate the Available Materials"
 OT1_R_controlled_materials_desc:0 "Either industrial priority can supply a common materials office. Production efficiency improves when the Porte allocates existing contracts instead of making every workshop compete for the same stock."
 OT1_R_army_contracts:0 "Standardize Army Contracts"
 OT1_R_army_contracts_desc:0 "We will organize standardize army contracts through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_customs_revenue:0 "Use Customs Revenue Well"
 OT1_R_customs_revenue_desc:0 "We will organize use customs revenue well through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_mosul_rail:0 "Extend the Mosul Supply Line"
 OT1_R_mosul_rail_desc:0 "We will organize extend the mosul supply line through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_artillery_lines:0 "Scheduled Artillery Production"
 OT1_R_artillery_lines_desc:0 "Gun and ammunition lines will work from a common order schedule. Better artillery research and production efficiency make scarce workshop capacity count."
 OT1_R_textile_contracts:0 "Secure Textile Contracts"
 OT1_R_textile_contracts_desc:0 "We will organize secure textile contracts through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_merchant_shipping:0 "The Merchant Shipping Register"
 OT1_R_merchant_shipping_desc:0 "Register serviceable ships and reserve crews for regular transport work. A modest transport reserve supports the imperial network without a new naval arms race."
 OT1_R_central_supply:0 "A Central Supply Ledger"
 OT1_R_central_supply_desc:0 "The central ledger connects provincial roads to the national freight programme. Reduced supply consumption reflects fewer lost and duplicated orders."
 OT1_R_rail_standardization:0 "Standardize Repair Parts"
 OT1_R_rail_standardization_desc:0 "We will organize standardize repair parts through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_tophane_expansion:0 "Expand Tophane Output"
 OT1_R_tophane_expansion_desc:0 "We will organize expand tophane output through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_anatolian_school:0 "Open an Industrial School"
 OT1_R_anatolian_school_desc:0 "We will organize open an industrial school through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_basra_port:0 "Service the Basra Port"
 OT1_R_basra_port_desc:0 "We will organize service the basra port through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_industrial_mobilization:0 "Coordinate Industrial Mobilisation"
 OT1_R_industrial_mobilization_desc:0 "Join workshop allocation to the supply ledger. A temporary national production programme improves the capacity the empire has built and can still control."
 OT1_R_baghdad_completion:0 "Integrate the Long-Distance Service"
 OT1_R_baghdad_completion_desc:0 "A railway timetable is also an operational constraint. Staff officers will plan movements around the capacity of the Baghdad line, keeping troop trains from blocking ammunition and supplies."
 OT1_R_national_workshops:0 "National Workshop Schools"
 OT1_R_national_workshops_desc:0 "A civilian production line in Ankara will train workers and manufacture tools for the workshop network. Industrial research preserves the practical gains from mobilisation."
 OT1_R_postwar_conversion:0 "Convert the Emergency Contracts"
 OT1_R_postwar_conversion_desc:0 "After October 1918 and the end of great war, release emergency production through the existing demobilisation system. Civilian construction and research keep useful workshop capacity in service."
 OT1_R_provincial_program:0 "Open Provincial Development Offices"
 OT1_R_provincial_program_desc:0 "We will organize open provincial development offices through Ottoman workshops and provincial offices. Investment will follow actual ownership, roads and workshop capacity."
 OT1_R_istanbul_municipal:0 "Improve Constantinople Services"
 OT1_R_istanbul_municipal_desc:0 "We will organize improve istanbul services through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_prov_anatolian_roads:0 "Build Ankara Roads"
 OT1_R_prov_anatolian_roads_desc:0 "We will organize build ankara roads through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_hejaz_stations:0 "Repair Hejaz Stations"
 OT1_R_hejaz_stations_desc:0 "We will organize repair hejaz stations through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_syria_depots:0 "Expand Syrian Depots"
 OT1_R_syria_depots_desc:0 "We will organize expand syrian depots through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_meso_provincial:0 "Develop Mesopotamian Canals"
 OT1_R_meso_provincial_desc:0 "We will organize develop mesopotamian canals through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_izmit_road:0 "Repair the Izmit Road"
 OT1_R_izmit_road_desc:0 "We will organize repair the izmit road through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_prov_ankara:0 "Support Ankara Workshops"
 OT1_R_prov_ankara_desc:0 "We will organize support ankara workshops through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_aleppo_markets:0 "Reopen Aleppo Markets"
 OT1_R_aleppo_markets_desc:0 "We will organize reopen aleppo markets through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_mosul_service:0 "Service Mosul Oil Fields"
 OT1_R_mosul_service_desc:0 "We will organize service mosul oil fields through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_basra_landing:0 "Improve the Basra Landing"
 OT1_R_basra_landing_desc:0 "We will organize improve the basra landing through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_adana_cotton:0 "Organize Adana Cotton"
 OT1_R_adana_cotton_desc:0 "We will organize organize adana cotton through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_konya_grain:0 "Store Konya Grain"
 OT1_R_konya_grain_desc:0 "We will organize store konya grain through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_erzurum_roads:0 "Maintain Erzurum Roads"
 OT1_R_erzurum_roads_desc:0 "We will organize maintain erzurum roads through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_damascus_rail:0 "Connect Damascus Railheads"
 OT1_R_damascus_rail_desc:0 "We will organize connect damascus railheads through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_baghdad_telegraph:0 "Extend Baghdad Telegraph"
 OT1_R_baghdad_telegraph_desc:0 "We will organize extend baghdad telegraph through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_zonguldak_mine:0 "Equip Zonguldak Mines"
 OT1_R_zonguldak_mine_desc:0 "We will organize equip zonguldak mines through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_samsun_coast:0 "Maintain Samsun Coast"
 OT1_R_samsun_coast_desc:0 "We will organize maintain samsun coast through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_adana_harbor:0 "Service Adana Harbor"
 OT1_R_adana_harbor_desc:0 "We will organize service adana harbor through Ottoman workshops and provincial offices. This programme directs labour and contracts toward practical transport and supply needs."
 OT1_R_imperial_logistics:0 "Integrate Provincial Logistics"
 OT1_R_imperial_logistics_desc:0 "Provincial stores and transport offices work to different schedules. A common freight ledger will connect their workshops, reduce delays and bring supplies to the corps that need them."
 OT1_R_1908_reorganisation:0 "The 1908 Reorganisation"
 OT1_R_1908_reorganisation_desc:0 "Establish a workable corps administration and begin the existing staged army reform. The first reorganisation reduces the old structural penalty without pretending the army is already modern."
 OT1_R_harbiye_staff:0 "The Harbiye Staff School"
 OT1_R_harbiye_staff_desc:0 "Train Ottoman staff officers to read mobilisation tables and issue usable orders. Domestic staff work remains available regardless of the empire's diplomatic alignment."
 OT1_R_french_mission_1909:0 "The French Training Mission"
 OT1_R_french_mission_1909_desc:0 "French instructors can help the staff school standardise equipment and training. This technical mission competes with the German programme and does not choose a diplomatic faction."
 OT1_R_army_command:0 "An Ottoman Corps Command"
 OT1_R_army_command_desc:0 "A corps must be able to march, supply its troops and act on clear orders. The staff school will establish common command procedures, while foreign missions remain advisers to an Ottoman service."
 OT1_R_field_regulations:0 "Field Regulations"
 OT1_R_field_regulations_desc:0 "New field regulations cover entrenching, march discipline, ammunition, and liaison. They replace improvisation with a common baseline that conscripts can actually follow."
 OT1_R_anatolian_reserves:0 "Anatolian Reserve Cadres"
 OT1_R_anatolian_reserves_desc:0 "Reserve cadres in Anatolia prepare men, horses, and officers before mobilisation. The programme strengthens depth without creating divisions from nowhere."
 OT1_R_officer_replacements:0 "Officer Replacement Lists"
 OT1_R_officer_replacements_desc:0 "The army records trained officers who can replace losses in distant corps. A maintained list protects command continuity when campaigns consume experienced leaders."
 OT1_R_mobilisation_tables:0 "Mobilisation by Corps District"
 OT1_R_mobilisation_tables_desc:0 "Corps districts will align draft classes, rolling stock and depot schedules. The tables prepare the second stage of army reform without simply increasing the manpower pool."
 OT1_R_ottoman_reorganisation_1914:0 "Complete the 1914 Corps Reorganisation"
 OT1_R_ottoman_reorganisation_1914_desc:0 "The corps mobilisation tables will complete the next stage of the existing national army reform. Structural penalties improve in steps while operational training supports the new organisation."
 OT1_R_german_mission:0 "German Military Mission"
 OT1_R_german_mission_desc:0 "The German mission is formalised through officers, interpreters, and training visits. Its focus remains conditional on the agreement that permits cooperation, whether inherited or newly accepted."
 OT1_R_limans_inspection:0 "Limans Inspection Tours"
 OT1_R_limans_inspection_desc:0 "Liman von Sanders inspects corps, railheads, and command procedures across the empire. His reports reveal where German templates meet Ottoman manpower and terrain limits."
 OT1_R_moltkes_limit:0 "Moltke's Limitations"
 OT1_R_moltkes_limit_desc:0 "Older German advice is weighed against the empire's roads, languages, and shortage of heavy guns. Ottoman officers learn to borrow doctrine without pretending they possess Prussian resources."
 OT1_R_staff_translation:0 "Staff Translation Bureau"
 OT1_R_staff_translation_desc:0 "Translators turn German regulations into orders understood by Ottoman corps and divisions. The bureau makes cooperation practical at the point where language can decide timing."
 OT1_R_german_agreement_focus:0 "An Agreed German Service Programme"
 OT1_R_german_agreement_focus_desc:0 "Agree on equipment support and staff liaison after the German training mission. The existing agreement flag remains available to the later joint command."
 OT1_R_assault_training:0 "Mission Assault Training"
 OT1_R_assault_training_desc:0 "German and Ottoman instructors adapt assault drills to trenches, grenades, and local officers. Training produces disciplined small-unit action rather than a free elite army."
 OT1_R_mobile_reserves:0 "Mobile Imperial Reserves"
 OT1_R_mobile_reserves_desc:0 "Motor and rail detachments hold a mobile reserve behind the threatened sector. The staff keeps it ready for counterattack without promising that every front can be reinforced."
 OT1_R_yildirim_command:0 "General Staff Liaison"
 OT1_R_yildirim_command_desc:0 "The Ottoman General Staff keeps German liaison officers, interpreters, and railway planners working before the Yildirim headquarters exists. This channel improves coordination while remaining constrained by Ottoman depots and transport."
 OT1_R_TUR_mauser_armament:0 "A Standard Infantry Armament"
 OT1_R_TUR_mauser_armament_desc:0 "Common weapons, ammunition and repair routines will give infantry formations dependable equipment. The programme improves production knowledge before extending the gun line."
 OT1_R_mauser_rifles:0 "Maintain the Mauser System"
 OT1_R_mauser_rifles_desc:0 "Arsenal inspectors will standardise spares, ammunition lots and weapon repairs. Infantry research builds on a maintained rifle system rather than another equipment promise."
 OT1_R_tophane_workshops:0 "Tophane Workshops"
 OT1_R_tophane_workshops_desc:0 "Tophane workshops repair rifles, machine guns, and field tools close to the capital. Local work reduces the delay between a breakdown and a soldier's replacement weapon."
 OT1_R_machine_guns:0 "Machine-Gun Sections"
 OT1_R_machine_guns_desc:0 "Machine-gun sections practise fields of fire, ammunition carrying, and concealment. A few well-served weapons can anchor an Ottoman position against a larger assault."
 OT1_R_artillery_foundry:0 "The Tophane Gun Programme"
 OT1_R_artillery_foundry_desc:0 "Join gun design and ammunition standards to the infantry armament programme. Artillery research gains a foundation in existing arsenal practice."
 OT1_R_75mm_batteries:0 "The 75 mm Field Batteries"
 OT1_R_75mm_batteries_desc:0 "Field batteries and infantry will practise observed fire and ammunition discipline together. The guns must be ready to support a movement when it begins, rather than answer after the opportunity has passed."
 OT1_R_105mm_howitzers:0 "105 mm Howitzers"
 OT1_R_105mm_howitzers_desc:0 "105 mm howitzers reach trenches and reverse slopes beyond the direct-fire battery. Their crews coordinate range tables with observers who may be days from the capital."
 OT1_R_155mm_heavy_guns:0 "A Limited Heavy Gun Train"
 OT1_R_155mm_heavy_guns_desc:0 "A small heavy-gun train will use the standard arsenal and field-battery system. Artillery development and trained crews support major-war operations without creating an unlimited siege army."
 OT1_R_railway_corps:0 "An Army Railway Corps"
 OT1_R_railway_corps_desc:0 "Create trained detachments for loading, repairs and depot administration. The army can improve supply organisation without receiving railways in foreign territory."
 OT1_R_anatolian_railway:0 "Anatolian Railway Links"
 OT1_R_anatolian_railway_desc:0 "The Anatolian railway receives priority for depots, water, and repair crews. A functioning line gives the empire a chance to move men between fronts before winter closes roads."
 OT1_R_field_medicine:0 "Field Hospitals and Evacuation"
 OT1_R_field_medicine_desc:0 "Railway officers and medical services will agree on casualty collection and evacuation routes. Recovery and support equipment research improve the army's ability to retain trained men."
 OT1_R_caucasus_logistics:0 "Caucasus Logistics"
 OT1_R_caucasus_logistics_desc:0 "Caucasus columns prepare winter clothing, pack animals, food, and guides for mountain campaigning. Logistics is written as a constraint so Sarikamis is never an unconditional victory."
 OT1_R_depot_accounting:0 "Depot Accounting"
 OT1_R_depot_accounting_desc:0 "Depot officers count shells, rifles, medicines, and animal feed at each railhead. Honest ledgers let commanders choose an achievable operation instead of ordering supplies that do not exist."
 OT1_R_supply_columns:0 "Supply Columns behind the Corps"
 OT1_R_supply_columns_desc:0 "Stores, transport crews and medical evacuation must move as organised corps columns. Clear priorities and regular depots will reduce the losses caused by scattered requisitioning."
 OT1_R_telegraph_service:0 "Telegraph Service"
 OT1_R_telegraph_service_desc:0 "Telegraphers protect cables, exchanges, and relay stations between corps headquarters. Communications that survive shelling let an army react before a local defeat spreads."
 OT1_R_transport_reform:0 "Reform the Transport Service"
 OT1_R_transport_reform_desc:0 "The supply columns will work from regular loading tables and dispatch records. Logistics research and staff practice turn separate railway and medical programmes into a transport service."
 OT1_R_caucasus_front:0 "Survey the Eastern Front"
 OT1_R_caucasus_front_desc:0 "The eastern command will prepare maps, cold-weather loads and depot reports. These preparations support the frontier without requiring the empire to enter a particular war."
 OT1_R_sarikamis_lessons:0 "The Sarikamis Lessons"
 OT1_R_sarikamis_lessons_desc:0 "War with Russia after December 1914 demands honest lessons about winter supply and replacement troops. The programme improves cold-weather preparation without rewarding an unplanned offensive."
 OT1_R_mesopotamia_command:0 "A Mesopotamian Field Command"
 OT1_R_mesopotamia_command_desc:0 "Great war with Britain calls for a separate staff for river routes, replacement units and regional supplies. The command programme is tied to that real conflict."
 OT1_R_defend_palestine:0 "Prepare the Palestine Defence"
 OT1_R_defend_palestine_desc:0 "The regional staff will align reserves, batteries and fieldworks for the Palestine front. A temporary defensive programme supports the existing war with Britain."
 OT1_R_iraq_field_command:0 "Iraq Field Command"
 OT1_R_iraq_field_command_desc:0 "Iraq field command coordinates river transport, garrisons, and a limited counterattack reserve. Commanders learn to hold useful ground instead of defending every mile equally."
 OT1_R_caucasus_defence:0 "A Sustainable Caucasus Defence"
 OT1_R_caucasus_defence_desc:0 "Turn the winter reports into depot schedules and defensive training. The eastern programme prioritises a line that can be supplied throughout the ongoing Russian war."
 OT1_R_coastal_forts:0 "Coastal Fort Batteries"
 OT1_R_coastal_forts_desc:0 "Coastal forts coordinate range finding, ammunition, and infantry positions along the straits. Their purpose is to make a guarded passage expensive, not to create a free fleet."
 OT1_R_storm_battalions:0 "Train Assault and Counterattack Units"
 OT1_R_storm_battalions_desc:0 "Selected units will rehearse clearing trenches, crossing obstacles and restoring a broken defensive line. These battalions will give commanders a trained reserve for difficult local tasks."
 OT1_R_gallipoli_artillery:0 "Observed Defensive Artillery"
 OT1_R_gallipoli_artillery_desc:0 "Counterattack units need batteries that can shift fire before local reserves move. Artillery research and a temporary gun programme carry the defensive lessons beyond the straits."
 OT1_R_yildirim_army_group:0 "The Yildirim Army Group"
 OT1_R_yildirim_army_group_desc:0 "After July 1917, an existing German agreement allows a joint army-group staff built on Ottoman corps and transport reform. The command remains constrained by the supply service it has prepared."
 OT1_R_defence_in_depth:0 "A Defence the Empire Can Sustain"
 OT1_R_defence_in_depth_desc:0 "The reformed corps command, field batteries and transport service will prepare reserves behind the first line. This wartime culmination is available across diplomatic alignments and does not require a specific enemy."
 OT1_R_ottoman_navy_reform:0 "Reform the Naval Staff"
 OT1_R_ottoman_navy_reform_desc:0 "Charts, signals and repair schedules must serve one naval command. A small fleet cannot afford to lose the use of its ships through confused orders or neglected maintenance."
 OT1_R_coastal_defence_programme:0 "The Straits Defence Priority"
 OT1_R_coastal_defence_programme_desc:0 "Give patrols, mine barriers and coastal coordination first claim on naval resources. The programme competes with a renewed capital-ship priority."
 OT1_R_naval_aviation:0 "Study Naval Observation Aircraft"
 OT1_R_naval_aviation_desc:0 "A small naval observation service can support the fleet with charts and reports. Research and a few trained officers prepare the programme without claiming an operational carrier force."
 OT1_R_bosphorus_forts:0 "Bosphorus Forts"
 OT1_R_bosphorus_forts_desc:0 "Bosphorus forts combine searchlights, range finding, and batteries around the capital's sea approaches. Their protection is local and concrete, not an excuse for off-map construction."
 OT1_R_mine_barriers:0 "Prepare the Mine Barriers"
 OT1_R_mine_barriers_desc:0 "Mine crews and coastal observers will maintain common charts and laying schedules. The programme develops the existing naval mining system rather than creating another custom interface."
 OT1_R_dreadnought_yards:0 "Capital Ship Yard Work"
 OT1_R_dreadnought_yards_desc:0 "Dockyards prepare slips, boilers, and trained artificers for the ships the budget can actually support. Yard work increases readiness gradually rather than spawning hulls."
 OT1_R_battleship_gunnery:0 "Battlefleet Gunnery Training"
 OT1_R_battleship_gunnery_desc:0 "Capital-ship crews will practise ranging and salvo control from common tables. Regular exercises will help the navy obtain the best service from the heavy ships it can maintain."
 OT1_R_destroyer_escorts:0 "Regular Escort Divisions"
 OT1_R_destroyer_escorts_desc:0 "Destroyers will serve in regular escort divisions with trained relief crews. Coastal shipping and troop transports need a dependable screen, even when the heavier ships remain in port."
 OT1_R_convoy_escorts:0 "Convoy Relief Schedules"
 OT1_R_convoy_escorts_desc:0 "Relief escorts and departure schedules will connect merchant transport to the naval staff. A modest transport reserve and escort organisation sustain the service routes."
 OT1_R_black_sea_patrols:0 "Black Sea Patrol Training"
 OT1_R_black_sea_patrols_desc:0 "Submarine crews will learn the approaches, weather and traffic of the Black Sea. Shore workshops and clear patrol orders will support a small operational flotilla."
 OT1_R_naval_radio:0 "Fleet Radio Procedures"
 OT1_R_naval_radio_desc:0 "Signals officers will standardise reports and relief instructions for patrols and escorts. Better coordination reduces the burden on the small naval staff."
 OT1_R_dardanelles_mines:0 "The Wartime Dardanelles Barrier"
 OT1_R_dardanelles_mines_desc:0 "During great war, mine crews will coordinate the barrier with coastal observers and fleet movements. The mining programme supports straits defence through the existing naval mechanics."
 OT1_R_torpedo_boats:0 "Torpedo Boat Stations"
 OT1_R_torpedo_boats_desc:0 "Torpedo boats operate from prepared anchorages with fuel, signals, and withdrawal routes. They defend narrow waters without pretending to challenge a battle line in open sea."
 OT1_R_naval_fire_control:0 "Common Naval Fire Control"
 OT1_R_naval_fire_control_desc:0 "Plotting rooms, rangefinders and radio procedures will work from common data. Capital-ship research and fleet coordination support the chosen battlefleet programme."
 OT1_R_mediterranean_escorts:0 "Mediterranean Escorts"
 OT1_R_mediterranean_escorts_desc:0 "Escorts protect movement between Ottoman ports and the fronts that depend on them. Captains learn to withdraw from stronger forces while keeping the route open."
 OT1_R_anti_submarine_patrols:0 "Anti-Submarine Escort Practice"
 OT1_R_anti_submarine_patrols_desc:0 "Escorts will practise contact reports, searches and convoy recovery. Detection and trained screens protect merchant routes through the existing naval service mechanics."
 OT1_R_seaplane_observers:0 "Wartime Seaplane Observers"
 OT1_R_seaplane_observers_desc:0 "A trained observation detachment will report coastal movements to the naval staff. Mechanics and shore stations will keep these fragile machines ready for the next patrol."
 OT1_R_strait_defence:0 "An Integrated Straits Command"
 OT1_R_strait_defence_desc:0 "Coordinate mine crews, patrol flotillas and coastal observers under one wartime command. The coastal priority culminates in a service the empire can sustain."
 OT1_R_bosporus_patrols:0 "Bosphorus Patrols"
 OT1_R_bosporus_patrols_desc:0 "Bosphorus patrols enforce marked channels, watch neutral shipping, and report hostile craft. Their routine protects the capital's waters with limited fuel and crews."
 OT1_R_modest_battlefleet:0 "A Ready Ottoman Battle Squadron"
 OT1_R_modest_battlefleet_desc:0 "Concentrate the capital ships, trained crews and fire-control programme into one ready squadron. The battlefleet priority culminates in sustained wartime service."
 OT1_R_ottoman_convoy_service:0 "The Ottoman Convoy Service"
 OT1_R_ottoman_convoy_service_desc:0 "Regular escorts and a repair ledger can support a lasting merchant service. Additional transports and temporary escort efficiency sustain wartime communications."
 OT1_R_naval_repair:0 "The Naval Repair Ledger"
 OT1_R_naval_repair_desc:0 "The staff will schedule repairs, spare parts and trained yard workers for the ships already in service. Repair capacity supports either naval priority without another free construction chain."
 OT1_R_aegean_watch:0 "Aegean Watch"
 OT1_R_aegean_watch_desc:0 "Aegean lookouts track enemy movement near islands, straits, and supply crossings. The watch improves information while respecting the naval balance around the empire."
 OT1_R_mersin_logistics:0 "Mersin Naval Logistics"
 OT1_R_mersin_logistics_desc:0 "Mersin logistics stages fuel, ammunition, and repair materials for the southern coast. Its work supports Palestine and Mesopotamia without promising an unlimited Mediterranean fleet."
 OT1_R_navy_wartime_command:0 "Coordinate the Wartime Fleet"
 OT1_R_navy_wartime_command_desc:0 "A developed coastal, battlefleet or convoy programme can supply the basis for wartime naval command. The staff will apply its service lessons across the remaining fleet."
 OT1_R_san_stefano_aviation:0 "The San Stefano Aviation School"
 OT1_R_san_stefano_aviation_desc:0 "Improve the Constantinople training field and establish common records for pilots and machines. The school provides the foundation for domestic training and foreign technical missions."
 OT1_R_bleriot_procurement:0 "Bleriot Procurement"
 OT1_R_bleriot_procurement_desc:0 "Bleriot aircraft provide a practical first generation for training and reconnaissance. Procurement follows available French designs rather than inventing a domestic industry overnight."
 OT1_R_pilot_training:0 "A Regular Pilot Course"
 OT1_R_pilot_training_desc:0 "A regular course will train replacement pilots and observers before the service expands its squadrons. Better air training supports every later mission."
 OT1_R_air_observation:0 "Observers for the Army Staff"
 OT1_R_air_observation_desc:0 "Observers will map roads, positions and artillery flashes in reports the staff can use. The service grows around reconnaissance before choosing combat aircraft priorities."
 OT1_R_air_mechanics:0 "Train the Ground Crews"
 OT1_R_air_mechanics_desc:0 "Mechanics will learn inspection routines and the manufacture of simple replacement parts. Aircraft research and a maintained service become possible without requiring a foreign mission."
 OT1_R_french_air_mission:0 "French Aviation Instruction"
 OT1_R_french_air_mission_desc:0 "French instructors and aircraft practice can supply the first technical programme. This choice competes with German aviation assistance while remaining distinct from diplomatic alignment."
 OT1_R_german_air_mission:0 "German Aviation Instruction"
 OT1_R_german_air_mission_desc:0 "From December 1913, German assistance can train pilots and maintain imported aircraft. The technical programme competes with French instruction and requires peace with Germany."
 OT1_R_escadrille_tables:0 "Squadrons with Replacement Tables"
 OT1_R_escadrille_tables_desc:0 "A squadron needs mechanics, observers and replacement crews as much as pilots. Regular establishments will turn scattered flying detachments into a service that can sustain operations."
 OT1_R_caucasus_observers:0 "Caucasus Observation Routes"
 OT1_R_caucasus_observers_desc:0 "War with Russia after December 1914 requires dependable mountain routes and cold-weather servicing. The squadron programme remains tied to that actual campaign."
 OT1_R_palestine_recon:0 "Palestine Reconnaissance Routes"
 OT1_R_palestine_recon_desc:0 "Great war with Britain calls for reconnaissance reports suited to the Palestine staff. The service supports forces committed to that real conflict."
 OT1_R_naval_air_patrol:0 "Naval Air Patrols"
 OT1_R_naval_air_patrol_desc:0 "Naval aircraft watch ports, minefields, and troop routes along Ottoman coasts. Observers give destroyers and forts warning enough to choose patrol or shelter."
 OT1_R_air_defence:0 "A Wartime Air Defence Service"
 OT1_R_air_defence_desc:0 "Fighter crews will coordinate patrol sectors and relief rotations. A limited flying service must protect its bases and observation aircraft without wasting machines on unplanned sorties."
 OT1_R_close_support:0 "Aircraft over the Army Front"
 OT1_R_close_support_desc:0 "Pilots and forward observers will agree on signals before entering battle. Clear reports and marked targets will allow the flying service to support the troops where it matters."
 OT1_R_long_range_recon:0 "A Long-Range Observation Service"
 OT1_R_long_range_recon_desc:0 "A maintained field network and regular crews can sustain longer routes. Aircraft development supports observation without requiring one particular foreign front."
 OT1_R_air_service_reorganisation:0 "The Wartime Aviation Establishment"
 OT1_R_air_service_reorganisation_desc:0 "Combine regular squadron tables with a developed defence, army support or observation programme. The wartime establishment improves the maintained service instead of granting a modern air force by decree."
 OT1_R_german_liaison:0 "Formalise the German Mission"
 OT1_R_german_liaison_desc:0 "We turn the German liaison into a regular military mission with named duties. Its reports improve readiness while the government still retains the right to refuse a pact."
 OT1_R_military_diplomacy:0 "Coordinate Ottoman Staff Work"
 OT1_R_military_diplomacy_desc:0 "We compare rail timetables, artillery lessons and mobilisation plans with German advisers. The arrangement supplies expertise without declaring a common war."
 OT1_R_secret_alliance:0 "Draft the August Alliance Protocol"
 OT1_R_secret_alliance_desc:0 "The Porte prepares the terms on which military liaison could become a secret alliance. Draft sovereignty guarantees and obligations before asking Berlin to accept them."
 OT1_R_german_alignment:0 "Request German Alignment"
 OT1_R_german_alignment_desc:0 "We request an actual German agreement with clear Ottoman consent and a defined military obligation. The choice closes the Entente, neutrality and regional compact routes."
 OT1_R_german_agreement_review:0 "Review the German Agreement"
 OT1_R_german_agreement_review_desc:0 "We verify Berlin's consent before committing ships or armies to the eastern war. The review keeps the August understanding distinct from a casual friendship."
 OT1_R_central_staff:0 "A Central Powers Staff Secretariat"
 OT1_R_central_staff_desc:0 "We establish a joint secretariat after the German agreement is accepted. It coordinates war aims while leaving every declaration to the existing country contracts."
 OT1_R_central_war:0 "Join the Central War"
 OT1_R_central_war_desc:0 "We enter the Central war only when Germany has accepted the Ottoman request and a real eastern conflict exists. The helper respects the current German war list and never adds an automatic Anglo-German war."
 OT1_R_british_guarantees:0 "Seek British Guarantees"
 OT1_R_british_guarantees_desc:0 "We ask Britain to discuss the Straits and Ottoman sovereignty before the European crisis becomes a general war. The conversation is a liaison and carries no faction obligation."
 OT1_R_strait_guarantees:0 "Negotiate the Straits Guarantees"
 OT1_R_strait_guarantees_desc:0 "We put the Straits and coastal security at the centre of talks with Britain and France. Acceptance gives the Ottoman government a defined diplomatic return for its cooperation."
 OT1_R_entente_alignment:0 "Request Entente Alignment"
 OT1_R_entente_alignment_desc:0 "We request an actual British and French agreement, including the negotiated Straits guarantees. The choice closes the German, neutrality and regional compact routes."
 OT1_R_russian_consultation:0 "Open a Russian Consultation"
 OT1_R_russian_consultation_desc:0 "We ask Russia to recognise the agreed Straits formula before war entry. The consultation makes the Entente route a three-party contract rather than a blank cheque."
 OT1_R_entente_staff:0 "Coordinate Entente Staff Work"
 OT1_R_entente_staff_desc:0 "We exchange mobilisation schedules with French, British and Russian officers. Staff work improves planning while the Ottoman government keeps its own command."
 OT1_R_entente_war:0 "Join the Entente War"
 OT1_R_entente_war_desc:0 "We enter the Entente war only after the agreement and the Russian consultation are in place. The helper follows the current faction and enemy state instead of inventing a new opponent."
 OT1_R_dardanelles_convention:0 "The Dardanelles Convention"
 OT1_R_dardanelles_convention_desc:0 "We publish the peacetime rules for the Dardanelles and its garrisons. The convention strengthens a negotiated guarantee without granting foreign claims on Ottoman land."
 OT1_R_neutral_conference:0 "Convene a Neutrality Conference"
 OT1_R_neutral_conference_desc:0 "We bring the cabinet, army and merchants together before any alliance is signed. Their mandate keeps the empire outside a bloc while preserving freedom to resist attack."
 OT1_R_neutral_alignment:0 "Adopt Lasting Neutrality"
 OT1_R_neutral_alignment_desc:0 "We adopt a lasting neutrality policy with armed borders and open commercial channels. The policy is a diplomatic commitment, not immunity from Italian, Balkan or Russian aggression."
 OT1_R_lasting_neutrality:0 "Publish the Neutrality Note"
 OT1_R_lasting_neutrality_desc:0 "We publish the same neutrality terms to every great power and accept the diplomatic cost of refusing secret obligations. The note keeps the government free to negotiate when an attack occurs."
 OT1_R_neutral_ports:0 "Keep Neutral Ports Open"
 OT1_R_neutral_ports_desc:0 "We keep Ottoman ports open to lawful trade while inspecting military cargoes. Commerce supports the treasury without becoming a disguised faction commitment."
 OT1_R_armed_watch:0 "Maintain an Armed Watch"
 OT1_R_armed_watch_desc:0 "We keep coastal and frontier formations alert while the diplomats work. Readiness deters opportunists but cannot stop a determined power from declaring war."
 OT1_R_neutral_mediation:0 "Offer a Neutral Mediation"
 OT1_R_neutral_mediation_desc:0 "We offer Constantinople as a venue for a limited European conference. Mediation earns influence only while the empire remains outside the competing blocs."
 OT1_R_sovereign_trade:0 "Protect Sovereign Trade"
 OT1_R_sovereign_trade_desc:0 "We record commercial access as a sovereign Ottoman interest in every treaty draft. No clause transfers Egypt, the Suez route, Persia or Afghanistan to another power."
 OT1_R_balkan_settlement:0 "Draft a Balkan Settlement"
 OT1_R_balkan_settlement_desc:0 "We offer a conference on borders, refugees and railway access before another Balkan war begins. The proposal aims to avert war through negotiated terms rather than permanent guarantees."
 OT1_R_italian_accommodation:0 "Negotiate an Italian Accommodation"
 OT1_R_italian_accommodation_desc:0 "We offer Italy commercial access and consultation around Libya while retaining Ottoman sovereignty. A negotiated accommodation can avert the next crisis without making a neutral Turkey invulnerable."
 OT1_R_thrace_settlement:0 "Settle the Thracian Question"
 OT1_R_thrace_settlement_desc:0 "We separate Thracian security from wider imperial claims and invite Bulgaria, Greece and Serbia to negotiate. The border remains contestable if diplomacy fails."
 OT1_R_regional_alignment:0 "Request a Regional Defensive Compact"
 OT1_R_regional_alignment_desc:0 "We propose a limited Balkan and Aegean defensive compact with defined territorial respect. It is a fourth alignment choice and closes the German, Entente and neutrality routes."
 OT1_R_regional_defence:0 "Plan Regional Defence"
 OT1_R_regional_defence_desc:0 "We coordinate border railways and coastal signals with willing regional partners. The compact improves defence while leaving each government free to reject an offensive war."
 OT1_R_balkan_staff:0 "Open a Balkan Staff College"
 OT1_R_balkan_staff_desc:0 "We invite regional officers to compare mobilisation and field medicine. Shared practice helps the frontier without creating duplicate divisions or an automatic war."
 OT1_R_aegean_security:0 "Secure the Aegean Passage"
 OT1_R_aegean_security_desc:0 "We coordinate Aegean patrol information with the regional partners who accepted the compact. The arrangement protects shipping while preserving every state's sovereignty."
 OT1_R_persian_frontier:0 "Open a Persian Frontier Dialogue"
 OT1_R_persian_frontier_desc:0 "We ask Persia to clarify customs, patrols and tribal movement along the frontier. The dialogue prevents an unnecessary border war without annexing Persian territory."
 OT1_R_afghan_mission:0 "Send an Afghan Mission"
 OT1_R_afghan_mission_desc:0 "We send advisers to Afghanistan with a narrow diplomatic and training brief. Kabul receives cooperation while retaining its own sovereignty and borders."
 OT1_R_arabian_cooperation:0 "Coordinate Arabian Relief"
 OT1_R_arabian_cooperation_desc:0 "We coordinate local relief and transport with communities around the Arabian routes. The programme builds cooperation without claiming Persia, Afghanistan or independent Arab states."
 OT1_R_benghazi_reserve:0 "Maintain the Benghazi Reserve"
 OT1_R_benghazi_reserve_desc:0 "We retain a small Benghazi reserve for the historic sixty-day Ouchy fallback window. It supports the existing Libya chain and never creates a second Ottoman naval order of battle."
 OT1_R_senussi_channels:0 "Keep Senussi Channels Open"
 OT1_R_senussi_channels_desc:0 "We maintain the existing Senussi supply channel while Italy holds the Libyan coast. The policy applies pressure through local partners instead of free annexations or duplicate units."
 OT1_R_red_sea_consultation:0 "Consult on Red Sea Shipping"
 OT1_R_red_sea_consultation_desc:0 "We ask local authorities and merchants to coordinate Red Sea shipping notices. Better information protects commerce while the empire's territorial claims remain unchanged."
 OT1_R_stability_council:0 "Convene the Imperial Stability Council"
 OT1_R_stability_council_desc:0 "We bring the Sultanate and Committee representatives into a recorded council. The balance can shift with decisions, while this focus offers only a modest temporary administrative gain."
 OT1_R_constitutional_balance:0 "Set Rules for Constitutional Balance"
 OT1_R_constitutional_balance_desc:0 "We write procedures for the Sultanate and Committee to contest policy without paralysing the state. The rules support the stability mini-game and do not grant a permanent stability boost."
 OT1_R_naval_requisition:0 "Audit the Naval Requisition"
 OT1_R_naval_requisition_desc:0 "We audit ships and crews already present before approving any requisition. This focus grants coordination expertise and leaves existing naval OOB ownership untouched."
 OT1_R_dardanelles_watch:0 "Organise a Dardanelles Watch"
 OT1_R_dardanelles_watch_desc:0 "We assign a small standing watch to report minefields and foreign movements. Its temporary doctrine bonus supports the Straits without adding duplicate ships or forts."
 OT1_R_wartime_neutrality_review:0 "Review Wartime Neutrality"
 OT1_R_wartime_neutrality_review_desc:0 "We review neutrality after the first mobilisation orders and record which obligations remain active. The review can guide a later agreement without bypassing the mutually exclusive alignment choices."
 OT1_R_cabinet_authority:0 "Cabinet Authority"
 OT1_R_provincial_confidence:0 "Provincial Confidence"
 OT1_R_officer_loyalty:0 "Officer Loyalty"
 OT1_R_reform_capacity:0 "Available Reform Capacity"
 OT1_R_industrial_foundation:0 "Ottoman Industrial Effort — Research Programme"
 OT1_R_defend_baghdad:0 "Defend Baghdad — Mastery Programme"

 JP1_R_imperial_inheritance:0 "The Meiji Inheritance"
 JP1_R_imperial_inheritance_desc:0 "The victories of the last decade have made Japan a great power, but ministers still bargain with elder statesmen, party leaders and separate military commands. Decide how this machinery will govern the next crisis."
 JP1_R_cabinet_procedure:0 "Define Cabinet Responsibility"
 JP1_R_cabinet_procedure_desc:0 "Cabinet papers move between the palace, ministries and Diet without a clear division of responsibility. Establish a regular procedure for appropriations and appointments before foreign commitments multiply."
 JP1_R_appropriation_accounts:0 "Audit the Appropriations"
 JP1_R_appropriation_accounts_desc:0 "The cost of battleships, colonial offices and the army now competes with domestic investment. Publish departmental accounts so that new obligations have a visible price."
 JP1_R_naval_estimates:0 "Hear the Naval Estimates"
 JP1_R_naval_estimates_desc:0 "The Admiralty must explain which ships can be maintained and which yards can build them. Scrutiny of the estimates improves procurement without committing Japan to an unlimited building race."
 JP1_R_prefectural_accounts:0 "Review Prefectural Administration"
 JP1_R_prefectural_accounts_desc:0 "Prefectural officials carry national orders into rural districts. Standardise their records and give ministers a dependable account of the roads, taxes and labour available outside Tokyo."
 JP1_R_elder_statesmen:0 "A Cabinet of Elder Statesmen"
 JP1_R_elder_statesmen_desc:0 "The genro retain influence over the choice of prime minister. Work within that system while allowing party support to develop through negotiation rather than an immediate break with the throne."
 JP1_R_constitutional_movement:0 "Protect Constitutional Government"
 JP1_R_constitutional_movement_desc:0 "Deputies and public meetings demand a ministry accountable to the Diet. Build a durable party coalition that can confront military pressure without discarding the imperial constitution."
 JP1_R_military_cabinet:0 "A Ministry of National Defence"
 JP1_R_military_cabinet_desc:0 "Army leaders argue that parliamentary bargaining leaves strategic preparations unfinished. Accept a ministry built around defence priorities, with the political and financial burdens this imposes on civilian government."
 JP1_R_imperial_compromise:0 "An Imperial Constitutional Compromise"
 JP1_R_imperial_compromise_desc:0 "The palace can summon elder statesmen, deputies and service ministers to agree the limits of their powers. A compromise needs enforceable procedures if it is to survive the next disputed appointment."
 JP1_R_genro_consultations:0 "Regular Genro Consultations"
 JP1_R_genro_consultations_desc:0 "The elder statesmen meet before cabinet appointments become public disputes. Their advice remains influential, but ministries receive a clear record of the programme they are expected to carry out."
 JP1_R_seiyukai_negotiation:0 "Negotiate with the Seiyukai"
 JP1_R_seiyukai_negotiation_desc:0 "The government seeks the support of party deputies for public works and appropriations. Agreements with the Seiyukai give the budget a parliamentary basis while preserving the sovereign’s role in choosing ministers."
 JP1_R_okuma_ministry:0 "Okuma’s Wartime Ministry"
 JP1_R_okuma_ministry_desc:0 "A broader parliamentary cabinet can direct the European war’s opportunities without handing every foreign question to the army. Give Okuma’s ministers the means to coordinate commercial and diplomatic policy."
 JP1_R_ministerial_liaisons:0 "Civil and Service Liaisons"
 JP1_R_ministerial_liaisons_desc:0 "Army and navy ministries exchange procurement schedules with the finance and foreign ministries. A shared account of resources prevents separate departments from promising the same ships and rail capacity."
 JP1_R_terauchi_coordination:0 "Terauchi’s Administrative Cabinet"
 JP1_R_terauchi_coordination_desc:0 "Officials coordinate wartime contracts and continental policy through a single ministry. Stronger administrative control demands more political effort as overseas commitments expand."
 JP1_R_civilian_transition:0 "Prepare a Party Cabinet"
 JP1_R_civilian_transition_desc:0 "A ministry cannot indefinitely govern through bureaucratic contacts alone. Open negotiations with party leaders and bring the administration’s commitments before deputies who will have to finance them."
 JP1_R_hara_ministry:0 "Hara’s Party Ministry"
 JP1_R_hara_ministry_desc:0 "The political centre moves toward a cabinet backed by the Seiyukai. Hara’s ministers inherit colonial obligations, strained public confidence and a budget enlarged by the war."
 JP1_R_diet_petitions:0 "Receive the Diet Petitions"
 JP1_R_diet_petitions_desc:0 "Public meetings insist that constitutional government cannot survive when ministries are dismissed through private service disputes. Bring those complaints into parliamentary committees before the streets become the only place to be heard."
 JP1_R_party_compacts:0 "Agree a Parliamentary Programme"
 JP1_R_party_compacts_desc:0 "Party leaders negotiate an appropriation programme and rules for cabinet support. The coalition gains a common agenda rather than depending on agreement over one disputed minister."
 JP1_R_civilian_appointments:0 "Civilian Control of Appointments"
 JP1_R_civilian_appointments_desc:0 "Ministerial vacancies must be filled according to an agreed procedure. The services retain professional command, but their refusal to nominate officers cannot automatically dissolve a civilian cabinet."
 JP1_R_electoral_registers:0 "Reconcile the Electoral Registers"
 JP1_R_electoral_registers_desc:0 "Officials review the tax and residence records used to determine voting rights. Broader, consistent registration gives a prospective electoral reform an administrative foundation."
 JP1_R_industrial_arbitration:0 "Industrial Arbitration Boards"
 JP1_R_industrial_arbitration_desc:0 "Employers and workers bring disputes before boards with published procedures. Arbitration protects important contracts while acknowledging that police action alone cannot resolve wages and working conditions."
 JP1_R_responsible_ministers:0 "Ministers Answer to the Diet"
 JP1_R_responsible_ministers_desc:0 "A cabinet presents regular reports on expenditure and foreign commitments. Parliamentary supervision makes expansion harder to conceal and strengthens the government’s authority to refuse unfunded adventures."
 JP1_R_party_government:0 "A Durable Party Government"
 JP1_R_party_government_desc:0 "The coalition establishes a working relationship between the imperial appointment of ministers and their responsibility to elected deputies. Foreign policy remains a national choice, but it must now be defended in public."
 JP1_R_service_ministers:0 "Secure the Service Ministries"
 JP1_R_service_ministers_desc:0 "Defence ministers receive a coordinated brief rather than separate promises from competing patrons. The army and navy must present their requirements against the resources the treasury can actually provide."
 JP1_R_mobilisation_board:0 "Establish a Mobilisation Board"
 JP1_R_mobilisation_board_desc:0 "A board records rail capacity, depots and industrial contracts for an overseas campaign. Civil administration supplies the figures that military planning has too often treated as unlimited."
 JP1_R_continental_staff:0 "A Continental Planning Staff"
 JP1_R_continental_staff_desc:0 "The staff studies the distance between Korean ports, Manchurian railways and prospective Russian battlefields. Planning for a second continental war begins with transport, replacement schedules and a realistic line of retreat."
 JP1_R_war_appropriations:0 "Vote the War Appropriations"
 JP1_R_war_appropriations_desc:0 "The ministry asks the Diet to finance an expanded campaign. New military contracts increase output while diverting civilian resources and political attention from domestic improvements."
 JP1_R_imperial_service_council:0 "An Imperial Service Council"
 JP1_R_imperial_service_council_desc:0 "The throne receives a joint account of army and naval commitments. A service council can coordinate strategy only if its members surrender the habit of arranging rival campaigns independently."
 JP1_R_civil_administrators:0 "Attach Civil Administrators"
 JP1_R_civil_administrators_desc:0 "An army can take territory without understanding how to govern it. Civil administrators accompany headquarters to organise local records, contracts and communication with provincial authorities."
 JP1_R_continental_mandate:0 "A Mandate for Continental War"
 JP1_R_continental_mandate_desc:0 "The cabinet accepts responsibility for the long campaign demanded by the continental staff. Authorise sustained preparations while keeping the civilian cost visible to the government that must maintain them."
 JP1_R_crown_and_diet:0 "Convene the Crown and Diet Council"
 JP1_R_crown_and_diet_desc:0 "Representatives of the chamber and the palace agree a regular channel for disputed appointments. A council reduces the temptation to resolve every disagreement through an abrupt cabinet resignation."
 JP1_R_joint_estimates:0 "Publish Joint Service Estimates"
 JP1_R_joint_estimates_desc:0 "The army and navy submit requirements in one budget document. Their programmes remain distinct, but the government can now compare them against a common industrial and financial account."
 JP1_R_arbitration_commission:0 "A Commission for Ministerial Disputes"
 JP1_R_arbitration_commission_desc:0 "A public procedure establishes who hears a dispute before it paralyses the government. The commission’s authority rests on consent from both the services and the parliamentary parties."
 JP1_R_prefectural_councils:0 "Hear the Prefectural Councils"
 JP1_R_prefectural_councils_desc:0 "Local officials and elected representatives explain how national contracts affect their districts. Ministries revise schedules before a distant policy becomes an intolerable local obligation."
 JP1_R_constitutional_charter:0 "Ratify a Cabinet Charter"
 JP1_R_constitutional_charter_desc:0 "The palace confirms the cabinet’s procedures, the Diet’s appropriation powers and the professional duties of the services. The settlement gives each institution a defined responsibility rather than an unlimited veto."
 JP1_R_review_overseas_commitments:0 "Review Overseas Commitments"
 JP1_R_review_overseas_commitments_desc:0 "Ministers compare occupied territory, naval stations and allied promises with the resources assigned to maintain them. The council can distinguish a useful foothold from a commitment that consumes the state."
 JP1_R_imperial_settlement:0 "An Imperial Constitutional Settlement"
 JP1_R_imperial_settlement_desc:0 "The compromise survives its first disputed appointments and becomes ordinary practice. National strategy now proceeds through a cabinet that can answer both the sovereign and the representatives of the country."
 JP1_R_public_services:0 "Public Services beyond Tokyo"
 JP1_R_public_services_desc:0 "The government tests its settlement through roads, schools and district offices. Public works should serve the communities asked to carry the state’s military and commercial obligations."
 JP1_R_labour_inspection:0 "Inspect Industrial Employment"
 JP1_R_labour_inspection_desc:0 "Factories have expanded faster than the offices charged with inspecting them. Appoint inspectors and publish standards that can be enforced without closing every important workshop."
 JP1_R_rural_credit:0 "Rural Credit Associations"
 JP1_R_rural_credit_desc:0 "Village borrowers need a dependable alternative to short-term obligations that consume the harvest. Local credit associations tie investment to repayment schedules that the prefectural authorities can supervise."
 JP1_R_price_relief:0 "Emergency Price Relief"
 JP1_R_price_relief_desc:0 "Rapid wartime price rises threaten households while speculative stores remain full. Commission an emergency relief programme and investigate hoarding without creating a permanent food accounting system."
 JP1_R_veterans_bureau:0 "A Veterans’ Employment Bureau"
 JP1_R_veterans_bureau_desc:0 "Returning soldiers require medical care, records of service and routes back into employment. A dedicated bureau coordinates those duties instead of leaving every unit to make its own arrangements."
 JP1_R_reconstruction_accounts:0 "Close the Emergency Accounts"
 JP1_R_reconstruction_accounts_desc:0 "The cabinet reviews contracts signed during the emergency and identifies temporary appropriations. Closing those accounts preserves permanent workshops while ending exceptional wartime obligations."
 JP1_R_postwar_delegation:0 "Prepare the Postwar Delegation"
 JP1_R_postwar_delegation_desc:0 "Delegates require an agreed account of Japan’s campaigns and foreign promises. Set out the position they will defend at the peace conference rather than allowing every ministry to pursue separate demands."
 JP1_R_civil_government:0 "Return to Ordinary Government"
 JP1_R_civil_government_desc:0 "Extraordinary committees surrender responsibilities to regular ministries. The government carries its political settlement into the coming period without retaining a permanent wartime subsidy."
 JP1_R_industrial_effort:0 "Coordinate the Industrial Ministries"
 JP1_R_industrial_effort_desc:0 "The ministries will establish one programme for tools, transport and naval orders. A short construction programme prepares private workshops to meet public contracts."
 JP1_R_industrial_effort_tech:0 "Japanese Industrial Foundation"
 JP1_R_kyushu_coal:0 "Connect the Kyushu Coalfields"
 JP1_R_kyushu_coal_desc:0 "Coal reaches furnaces only when the mines and their freight connections work together. Improve Kyushu transport and adapt extraction methods without inventing a new resource economy."
 JP1_R_kyushu_coal_tech:0 "Open the Kyushu Coal Ledger"
 JP1_R_yahata_iron:0 "Yahata Armament Steel"
 JP1_R_yahata_iron_desc:0 "The Yahata works will supply consistent steel for armament contracts. A military production line in Kyushu and better artillery metallurgy make the industrial programme useful to the services."
 JP1_R_yahata_iron_tech:0 "Secure Yahata Iron"
 JP1_R_railway_bureau:0 "A National Freight Timetable"
 JP1_R_railway_bureau_desc:0 "Passenger traffic, coal trains and army wagons need a single timetable. The railway bureau will reduce supply waste while preparing the next round of infrastructure work."
 JP1_R_railway_bureau_tech:0 "Unify the Railway Bureau"
 JP1_R_zaibatsu_contracts:0 "Binding Zaibatsu Contracts"
 JP1_R_zaibatsu_contracts_desc:0 "Private firms will receive predictable contracts in exchange for common production standards. The arrangement improves factory output without transferring control of national policy to the conglomerates."
 JP1_R_merchant_marine:0 "Register the Merchant Marine"
 JP1_R_merchant_marine_desc:0 "Register cargo capacity and reserve crews so commercial shipping can support overseas commitments. The programme adds transports and improves the organisation of merchant work."
 JP1_R_merchant_marine_tech:0 "Build the Merchant Marine"
 JP1_R_steel_standards:0 "Publish Steel Standards"
 JP1_R_steel_standards_desc:0 "Common gauges and heat treatments will let Yahata exchange billets with Osaka machine shops."
 JP1_R_machine_tool_guilds:0 "Standardise Machine Tools"
 JP1_R_machine_tool_guilds_desc:0 "Common gauges and interchangeable tools will let Osaka workshops accept larger orders. Both funding programmes require this practical foundation."
 JP1_R_osaka_rail_junction:0 "Expand the Osaka Rail Junction"
 JP1_R_osaka_rail_junction_desc:0 "Osaka factories need predictable coal and steel deliveries, so the existing junction will be strengthened."
 JP1_R_mitsui_export_credit:0 "Extend Mitsui Export Credit"
 JP1_R_mitsui_export_credit_desc:0 "Great War orders opened markets for Japanese textiles and tools; credit will keep domestic works funded."
 JP1_R_kobe_ship_repair:0 "Kobe Repair Capacity"
 JP1_R_kobe_ship_repair_desc:0 "Repair facilities at Kobe will support the merchant register and free military yards for service work. An additional Kansai dockyard gives the programme a physical foundation."
 JP1_R_industrial_survey:0 "Survey the Industrial Belt"
 JP1_R_industrial_survey_desc:0 "Count machine tools and trained workers from Kyushu to Kansai before distributing new orders. The survey turns expansion into an engineering programme rather than an auction between ministries."
 JP1_R_electrical_machinery:0 "Electrical Machinery Contracts"
 JP1_R_electrical_machinery_desc:0 "Electrical firms will standardise generators, instruments and workshop motors. The same manufacturing skills support communications equipment and the young aviation service."
 JP1_R_coastal_freight:0 "Schedule Coastal Freight"
 JP1_R_coastal_freight_desc:0 "Coastal steamers move heavy cargo cheaply; a schedule will reserve berths for coal, ore and munitions."
 JP1_R_great_war_exports:0 "The Export Opportunity"
 JP1_R_great_war_exports_desc:0 "Foreign orders can finance new machine tools and reorganise production. The export programme brings faster industrial research, while committing the ministries to an outward-facing investment policy."
 JP1_R_great_war_exports_tech:0 "Ride the Great War Export Boom"
 JP1_R_naval_contracts:0 "Standardize Naval Contracts"
 JP1_R_naval_contracts_desc:0 "Reliable hull contracts leave merchant capacity available and stop every yard reinventing its process."
 JP1_R_osaka_machine_consortium:0 "The Osaka Machine Consortium"
 JP1_R_osaka_machine_consortium_desc:0 "Pool specialist workshops around a new civilian production line in Kansai. The consortium builds the machinery needed by later ordnance and electrical contracts."
 JP1_R_aircraft_components:0 "Japanese Aircraft Components"
 JP1_R_aircraft_components_desc:0 "Domestic firms will manufacture instruments and replacement components for imported aircraft. Aviation research benefits from a dependable supply of parts rather than another paper organisation."
 JP1_R_aircraft_components_tech:0 "Produce Aircraft Components"
 JP1_R_national_railways:0 "Through Freight to Kanto"
 JP1_R_national_railways_desc:0 "The home railway network must serve arsenals as well as ports. Kanto freight improvements and logistics research prepare sustained deployment beyond the home islands."
 JP1_R_export_insurance:0 "Insure Overseas Orders"
 JP1_R_export_insurance_desc:0 "An insurance pool will preserve small exporters when wartime shipping losses threaten foreign contracts."
 JP1_R_fleet_auxiliaries:0 "Fleet Auxiliary Contracts"
 JP1_R_fleet_auxiliaries_desc:0 "Cargo vessels and service craft turn dockyard capacity into sustained operations. Auxiliary contracts add transports and support the next generation of naval equipment."
 JP1_R_labour_arbitration:0 "Arbitrate Industrial Labour"
 JP1_R_labour_arbitration_desc:0 "A state board can settle urgent disputes while keeping skilled workers and firms on predictable contracts."
 JP1_R_armament_standards:0 "One Armament Standard"
 JP1_R_armament_standards_desc:0 "Yahata steel and Osaka tools will meet common ordnance tolerances. Army weapons can then be improved without replacing the entire production system."
 JP1_R_hokkaido_logistics:0 "Open Hokkaido Coal Routes"
 JP1_R_hokkaido_logistics_desc:0 "Hokkaido coal matters only when ships and railways carry it south, so a controlled route will be improved."
 JP1_R_export_clearing:0 "Create an Export Clearing Office"
 JP1_R_export_clearing_desc:0 "A clearing office will simplify payments for machinery, textiles and their shipping."
 JP1_R_merchant_reserve:0 "Reserve Merchant Tonnage"
 JP1_R_merchant_reserve_desc:0 "A fleet serving wartime charters leaves Japan short of hulls when trade resumes; crews and spares will be registered."
 JP1_R_industrial_credit:0 "Invest in Domestic Capacity"
 JP1_R_industrial_credit_desc:0 "Long contracts for domestic machinery will expand the Kansai industrial base. Public investment favours dependable production over the immediate windfall from foreign orders."
 JP1_R_yahata_furnace_expansion:0 "Expand Yahata Furnaces"
 JP1_R_yahata_furnace_expansion_desc:0 "Yahata can turn the export boom into durable capacity for steel, rail and armament."
 JP1_R_railway_schedule:0 "Issue the National Railway Schedule"
 JP1_R_railway_schedule_desc:0 "One timetable moves coal, steel and troops with fewer empty returns."
 JP1_R_export_dividend:0 "Save the Export Dividend"
 JP1_R_export_dividend_desc:0 "Part of wartime trade profits will become tools and reserves before foreign production returns."
 JP1_R_merchant_marine_reserve:0 "Register Merchant Marine Crews"
 JP1_R_merchant_marine_reserve_desc:0 "Experienced crews are a reserve for commerce, auxiliaries and relief work."
 JP1_R_wartime_munitions_bureau:0 "A Unified Munitions Bureau"
 JP1_R_wartime_munitions_bureau_desc:0 "Join the armament standard to the freight timetable. The bureau directs output toward service requirements while keeping the industrial and railway programmes under one set of priorities."
 JP1_R_wartime_munitions_bureau_tech:0 "Open the Wartime Munitions Bureau"
 JP1_R_shell_steel_quotas:0 "Shell Steel Priority"
 JP1_R_shell_steel_quotas_desc:0 "The bureau will assign dependable steel batches to ammunition plants. Artillery development and production efficiency benefit from fewer interrupted contracts."
 JP1_R_shell_steel_quotas_tech:0 "Set Shell Steel Quotas"
 JP1_R_wartime_rail_priority:0 "War Freight Priority"
 JP1_R_wartime_rail_priority_desc:0 "Reserve paths for ammunition and replacement trains before embarkation begins. Logistics research and a temporary supply programme support troops without adding overseas industry by decree."
 JP1_R_wartime_rail_priority_tech:0 "Give Railways Wartime Priority"
 JP1_R_war_orders_zaibatsu:0 "Allocate Specialist War Orders"
 JP1_R_war_orders_zaibatsu_desc:0 "Electrical and aviation suppliers will receive scheduled military orders instead of competing emergency requisitions. Specialist production keeps the arms programme from exhausting its own subcontractors."
 JP1_R_naval_replenishment:0 "The Naval Replenishment Ledger"
 JP1_R_naval_replenishment_desc:0 "Reserve shipping must include maintenance, stores and trained crews. The ledger improves naval production and escorts while holding the commercial transport network together."
 JP1_R_dispersed_workshops:0 "Disperse the Subcontractors"
 JP1_R_dispersed_workshops_desc:0 "Machine and ammunition subcontractors will spread spare capacity across existing workshops. The programme improves production recovery without creating an unlimited chain of free factories."
 JP1_R_army_munitions_control:0 "Control Army Munitions Flow"
 JP1_R_army_munitions_control_desc:0 "A central office will reduce stoppages by delivering predictable lots to the army."
 JP1_R_coastal_convoy_command:0 "Coastal Transport Command"
 JP1_R_coastal_convoy_command_desc:0 "Coastal shipping will carry scheduled military freight between the industrial centres. Additional transports and organised escorts protect the link between army orders and naval replenishment."
 JP1_R_emergency_export_controls:0 "Apply Emergency Export Controls"
 JP1_R_emergency_export_controls_desc:0 "Temporary controls reserve scarce steel and machinery for defence while honouring key contracts."
 JP1_R_wartime_arms_call:0 "Call the War Industries"
 JP1_R_wartime_arms_call_desc:0 "A major war justifies activating the prepared industrial reserve. A controlled core state receives temporary war production through the existing mobilisation system."
 JP1_R_wartime_arms_call_tech:0 "Call the Wartime Arms Register"
 JP1_R_postwar_reconversion:0 "Return the Workshops to Civilian Orders"
 JP1_R_postwar_reconversion_desc:0 "When Japan leaves major war, civilian orders will retain the trained labour and tools built during mobilisation. A Chugoku production line turns that experience into lasting capacity."
 JP1_R_demobilization_ledger:0 "Draft the Demobilization Ledger"
 JP1_R_demobilization_ledger_desc:0 "Ministries will record contracts, crews and stocks before emergency orders expire."
 JP1_R_industrial_peace:0 "Renew the Industrial Peace"
 JP1_R_industrial_peace_desc:0 "Arbitration and predictable orders will steady the transition for workers and firms."
 JP1_R_final_demobilization:0 "Settle the Industrial Programme"
 JP1_R_final_demobilization_desc:0 "After major war ends, the ministries will reconcile orders and release emergency priorities. Production efficiency and industrial research carry the useful lessons into peacetime."
 JP1_R_final_demobilization_tech:0 "Complete Final Demobilization"
 JP1_R_overseas_administration:0 "Administer the Overseas Territories"
 JP1_R_overseas_administration_desc:0 "Tokyo will administer territories already under Japanese authority through records, roads and accountable offices; acquisitions belong to diplomacy."
 JP1_R_korea_bureau:0 "Consolidate Korean Administration"
 JP1_R_korea_bureau_desc:0 "Civil offices and the forces guarding the Korean railways must work together. A stronger administration will secure the routes on which our position in the peninsula depends."
 JP1_R_taiwan_governor_general:0 "Strengthen the Taiwan Governor-General"
 JP1_R_taiwan_governor_general_desc:0 "Taiwan's ports and agricultural stations need a civil register that can withstand wartime demands."
 JP1_R_karafuto_timber:0 "Survey Karafuto Timber"
 JP1_R_karafuto_timber_desc:0 "Karafuto forests can support paper and construction only with measured cutting and reliable transport."
 JP1_R_kwantung_lease_office:0 "Organize the Kwantung Lease Office"
 JP1_R_kwantung_lease_office_desc:0 "Dalian's lease administration must answer to one ledger shared by military, railway and commerce."
 JP1_R_korea_garrison:0 "Garrison the Korean Railheads"
 JP1_R_korea_garrison_desc:0 "A supplied garrison will protect Korean lines already under Japanese control."
 JP1_R_taiwan_industrial_board:0 "Create a Taiwan Industrial Board"
 JP1_R_taiwan_industrial_board_desc:0 "Taiwan's sugar, food and port workshops will follow one maintainable investment plan."
 JP1_R_south_manchurian_railway:0 "Secure the South Manchurian Railway"
 JP1_R_south_manchurian_railway_desc:0 "The railway and the Dalian corridor are essential to our position in Manchuria. Railway administration and local security must be treated as parts of the same undertaking."
 JP1_R_colonial_customs:0 "Unify Colonial Customs"
 JP1_R_colonial_customs_desc:0 "One schedule will make Korean, Taiwanese and leasehold cargo legible."
 JP1_R_korea_investment:0 "Invest in Korean Workshops"
 JP1_R_korea_investment_desc:0 "Korean workshops can expand repair and light industry; capacity buys cooperation without free cores."
 JP1_R_korea_investment_tech:0 "Invest in Korean Workshops"
 JP1_R_korea_exploitation:0 "Exploit Korean Deliveries"
 JP1_R_korea_exploitation_desc:0 "Requisitioning grain, timber and rail capacity brings an immediate margin but hardens resistance."
 JP1_R_taiwan_investment:0 "Invest in Taiwan Ports"
 JP1_R_taiwan_investment_desc:0 "Taiwan's port workshops and agriculture can support a durable Pacific network where Japan controls the state."
 JP1_R_taiwan_investment_tech:0 "Invest in Taiwan Ports"
 JP1_R_kwantung_security:0 "Secure the Dalian Corridor"
 JP1_R_kwantung_security_desc:0 "The Dalian railway and harbour form a narrow corridor, not a licence for wider expansion."
 JP1_R_korea_compliance:0 "Build Korean Compliance Offices"
 JP1_R_korea_compliance_desc:0 "A named petition channel beside the garrisons can make orders more predictable."
 JP1_R_taiwan_compliance:0 "Extend Taiwan Civil Registers"
 JP1_R_taiwan_compliance_desc:0 "Predictable records, taxes and supplies can lower friction in Taiwan's established administration."
 JP1_R_karafuto_rail_link:0 "Link Karafuto's Railheads"
 JP1_R_karafuto_rail_link_desc:0 "Karafuto's timber economy depends on short reliable links from cutting grounds to port."
 JP1_R_manchurian_military_garrison:0 "Garrison the Manchurian Leasehold"
 JP1_R_manchurian_military_garrison_desc:0 "The leasehold needs a garrison sized for railway and harbour, not a blank cheque for continental war."
 JP1_R_colonial_investment_compact:0 "Sign the Colonial Investment Compact"
 JP1_R_colonial_investment_compact_desc:0 "Rail, harbour and workshop budgets in controlled overseas states must each show a practical return."
 JP1_R_overseas_reserve:0 "Create an Overseas Reserve"
 JP1_R_overseas_reserve_desc:0 "Engineers, police and shipping crews will support territories already held when war turns east."
 JP1_R_asian_war_program:0 "Coordinate the Asian War Programme"
 JP1_R_asian_war_program_desc:0 "In major war, cabinet will coordinate garrisons, railways and shipyards around territories it actually controls."
 JP1_R_army_1905_lessons:0 "The Army after 1905"
 JP1_R_army_1905_lessons_desc:0 "Review the cost of the victory over Russia before planning the next campaign. Staff, arsenal and reserve reform will share one service programme."
 JP1_R_army_general_staff:0 "A Working General Staff"
 JP1_R_army_general_staff_desc:0 "The general staff will translate campaign reports into a common plan for mobilisation and equipment. New liaison procedures accelerate preparation without removing the need for transport."
 JP1_R_army_tokyo_arsenal:0 "The Tokyo Arsenal Programme"
 JP1_R_army_tokyo_arsenal_desc:0 "Tokyo and Koishikawa will standardise infantry weapons before introducing new models. Arsenal work gives every strategic priority the same equipment foundation."
 JP1_R_small_arms_bonus:0 "Tokyo Arsenal Standards"
 JP1_R_army_reserve_garrisons:0 "Reserve and Garrison Tables"
 JP1_R_army_reserve_garrisons_desc:0 "The home islands need trained reserves and dependable garrisons. Draft tables tie local formations to the ports, railways, and magazines they would actually defend."
 JP1_R_army_combined_arms_ledger:0 "The Combined Arms Ledger"
 JP1_R_army_combined_arms_ledger_desc:0 "Staff officers compare infantry, guns, engineers, and transport as one formation rather than four separate budgets, creating a measured foundation for later doctrine work."
 JP1_R_combined_arms_ledger:0 "The Combined Arms Ledger"
 JP1_R_army_russo_japanese_mobilisation:0 "Prepare a Continental Mobilisation"
 JP1_R_army_russo_japanese_mobilisation_desc:0 "Organise embarkation, trains and replacement classes for a continental campaign. Expeditionary preparation receives priority over the standing garrison programme."
 JP1_R_army_korean_garrison:0 "Garrison Readiness First"
 JP1_R_army_korean_garrison_desc:0 "Prioritise the standing garrisons and their replacement cadres. A defensive service programme sacrifices immediate expeditionary preparation for dependable readiness."
 JP1_R_army_harbin_staff:0 "Harbin Staff School"
 JP1_R_army_harbin_staff_desc:0 "Harbin becomes a school for reading rail junctions, frontier reports, and the movements of a continental enemy whose distances punish careless assumptions."
 JP1_R_army_field_telegraph:0 "Field Telegraph Sections"
 JP1_R_army_field_telegraph_desc:0 "Signals sections will accompany headquarters and artillery observers. Common communications equipment keeps orders moving when a permanent command post cannot follow an advance."
 JP1_R_army_koishikawa_guns:0 "Koishikawa Field Guns"
 JP1_R_army_koishikawa_guns_desc:0 "Coordinate gun design, ammunition tolerances and workshop tools. The field-gun programme equips the army before it develops a separate heavy siege train."
 JP1_R_artillery_board_bonus:0 "Koishikawa Artillery Board"
 JP1_R_army_heavy_gun_transport:0 "Heavy Gun Transport"
 JP1_R_army_heavy_gun_transport_desc:0 "Heavy pieces receive rail wagons, traction teams, and road surveys matched to Japanese terrain. The programme expands useful fire without pretending every front has a railway."
 JP1_R_army_territorial_reserves:0 "Territorial Replacement Cadres"
 JP1_R_army_territorial_reserves_desc:0 "Reserve officers will maintain trained cadres behind the home and colonial garrisons. Reinforcement begins with usable formations instead of names on a draft register."
 JP1_R_army_officer_candidates:0 "Officer Candidate Schools"
 JP1_R_army_officer_candidates_desc:0 "Candidate schools widen the professional pool while keeping examinations tied to field service, languages, and the paperwork that makes mobilisation legible."
 JP1_R_army_manchurian_railway:0 "Railway Detachments"
 JP1_R_army_manchurian_railway_desc:0 "Train military railway detachments in loading, repairs and traffic control. The army gains a supply organisation without receiving ownership of foreign railways through a focus."
 JP1_R_army_yalu_entrenchments:0 "Entrenchment Lessons from the Yalu"
 JP1_R_army_yalu_entrenchments_desc:0 "The fighting along the Yalu provides lessons in fieldworks, observation and supporting fire. Our infantry will study those positions and practise holding them against a determined attack."
 JP1_R_yalu_entrenchments:0 "Entrenchments on the Yalu"
 JP1_R_army_seoul_supply:0 "Seoul Supply Columns"
 JP1_R_army_seoul_supply_desc:0 "Supply columns around Seoul practice ration accounting, animal replacement, and guarded road movement where every lost cart lengthens the next request from Tokyo."
 JP1_R_army_manchurian_maps:0 "Maps of the Manchurian Interior"
 JP1_R_army_manchurian_maps_desc:0 "Topographers chart roads, rivers, and winter crossings beyond the railway belt. Their maps are for decisions by commanders, not decoration for the staff room."
 JP1_R_recon_maps_bonus:0 "Maps of the Manchurian Interior"
 JP1_R_army_field_codes:0 "Signal Corps Field Codes"
 JP1_R_army_field_codes_desc:0 "Signal officers shorten codes, issue spare keys, and drill replacement operators so a broken handset does not erase a corps commander’s intent."
 JP1_R_field_codes:0 "Signal Corps Field Codes"
 JP1_R_army_shrapnel_fuses:0 "Shrapnel and Fuse Production"
 JP1_R_army_shrapnel_fuses_desc:0 "Japanese factories standardise fuses and shrapnel fills around what domestic tooling can inspect. Ammunition reliability matters more than a paper total of guns."
 JP1_R_army_siege_batteries:0 "A Transported Siege Train"
 JP1_R_army_siege_batteries_desc:0 "Heavy batteries require planned railheads and observed fire. The programme supports artillery development and reduces supply waste instead of equating larger guns with an effortless offensive."
 JP1_R_army_home_draft_boards:0 "Coordinate the Draft Boards"
 JP1_R_army_home_draft_boards_desc:0 "The home draft boards will maintain replacement lists tied to real training units. Better mobilisation preserves the distinction between a reserve pool and a deployable division."
 JP1_R_army_imperial_guard:0 "Imperial Guard Maneuvers"
 JP1_R_army_imperial_guard_desc:0 "Guard formations exercise relief, reserve commitment, and artillery liaison around Tokyo. Their prestige is tied to competence in a national emergency."
 JP1_R_army_railheads_mukden:0 "The Railhead Service"
 JP1_R_army_railheads_mukden_desc:0 "Railway detachments will maintain unloading plans, repair teams and depot records. Mukden remains the model for the service, rather than a promise of free construction in foreign territory."
 JP1_R_army_infantry_fire:0 "Infantry Fire and Movement"
 JP1_R_army_infantry_fire_desc:0 "Both reserve and continental programmes need infantry that can move under covering fire. Training and support-weapon development turn manpower preparation into combat readiness."
 JP1_R_infantry_fire:0 "Infantry Fire Discipline"
 JP1_R_army_mobile_command:0 "Mobile Command Posts"
 JP1_R_army_mobile_command_desc:0 "Command posts move with maps, signal wagons, and liaison officers so an advance can change direction without waiting for a permanent headquarters to catch up."
 JP1_R_army_artillery_observers:0 "Artillery Observation Sections"
 JP1_R_army_artillery_observers_desc:0 "Gunners and observers must work from the same maps and firing tables. Joint exercises will teach them to locate enemy batteries and bring accurate fire to the infantry front."
 JP1_R_artillery_observers:0 "Artillery Observation Teams"
 JP1_R_army_medical_evacuation:0 "Field Medical and Evacuation Service"
 JP1_R_army_medical_evacuation_desc:0 "Signals, stretcher parties and field hospitals need an agreed evacuation chain. Medical preparation supports recovery and the development of divisional support equipment."
 JP1_R_army_frontier_depots:0 "Frontier Depot Network"
 JP1_R_army_frontier_depots_desc:0 "A chain of guarded magazines links Korea, Manchuria, and the home ports. Each depot has a defined stock and route instead of an abstract promise of supply."
 JP1_R_army_siberian_planning:0 "Plan the Siberian Expedition"
 JP1_R_army_siberian_planning_desc:0 "From August 1918, war with a Russian successor requires longer supply lines and cold-weather preparations. The expedition receives a temporary programme tied to that real conflict."
 JP1_R_army_china_corps:0 "The China Expeditionary Corps"
 JP1_R_army_china_corps_desc:0 "An actual campaign in China or against Germany calls for a corps staff with its own replacement and supply plans. The programme organises forces already committed to that war."
 JP1_R_army_combined_arms_schools:0 "Combined Arms Schools"
 JP1_R_army_combined_arms_schools_desc:0 "Wartime schools bring infantry, guns, engineers, and signals onto the same exercise ground, turning 1905 lessons into repeatable staff procedures."
 JP1_R_combined_arms_schools:0 "Combined Arms Schools"
 JP1_R_army_north_china_garrison:0 "North China Garrison Doctrine"
 JP1_R_army_north_china_garrison_desc:0 "Garrisons in North China rehearse rail protection, local intelligence, and limited counterattacks suited to scattered posts rather than a march to the interior."
 JP1_R_army_korean_coastal_defence:0 "Korean Coastal Defence"
 JP1_R_army_korean_coastal_defence_desc:0 "The Korean coast receives field guns, observation posts, and reserve routes that protect ports without pretending to stop every landing."
 JP1_R_army_vladivostok_landing:0 "Vladivostok Landing Column"
 JP1_R_army_vladivostok_landing_desc:0 "A Vladivostok landing column trains for a port seizure whose success depends on naval cover, cold-weather stores, and an exit plan once the railway is contested."
 JP1_R_vladivostok_landing:0 "Vladivostok Landing Column"
 JP1_R_army_tientsin_logistics:0 "Tientsin Logistics Mission"
 JP1_R_army_tientsin_logistics_desc:0 "Tientsin’s mission keeps depots, interpreters, and rail schedules aligned with the force actually present, limiting promises of supplies that do not exist."
 JP1_R_army_amur_recon:0 "Amur River Reconnaissance"
 JP1_R_army_amur_recon_desc:0 "Reconnaissance along the Amur studies ice, ferries, and riverbanks before movement is ordered. The river is an obstacle and a supply route at once."
 JP1_R_army_manchurian_winter:0 "Manchurian Winter Tables"
 JP1_R_army_manchurian_winter_desc:0 "Winter tables assign clothing, fuel, sledges, and rest cycles to each formation so the northern campaign is constrained by weather, not wishful arithmetic."
 JP1_R_manchurian_winter:0 "Manchurian Winter Tables"
 JP1_R_army_expeditionary_command:0 "Integrated Expeditionary Headquarters"
 JP1_R_army_expeditionary_command_desc:0 "Combine observers, medical services and staff liaison into a headquarters ready for overseas duty. Its organisation remains useful before the government chooses a particular war."
 JP1_R_army_continental_reserve:0 "A Sustainable Continental Reserve"
 JP1_R_army_continental_reserve_desc:0 "Reserve formations must replace losses without draining every home garrison. Support equipment and a temporary readiness programme make wartime deployments sustainable."
 JP1_R_continental_reserve_bonus:0 "Continental War Reserve"
 JP1_R_army_great_war_lessons:0 "Apply the Great War Lessons"
 JP1_R_army_great_war_lessons_desc:0 "Officers returning from the war bring reports of unfamiliar weapons, exhausted supply lines and costly attacks. The staff will compare their experience with our own campaigns and revise its field instructions."
 JP1_R_great_war_lessons:0 "Army Lessons of the Great War"
 JP1_R_navy_sasebo_ledger:0 "Audit the Sasebo Fleet"
 JP1_R_navy_sasebo_ledger_desc:0 "Count ships, crews, repair time and merchant support before expanding the navy. The service ledger opens a common staff programme for every naval priority."
 JP1_R_navy_eight_eight:0 "The Eight-Eight Priority"
 JP1_R_navy_eight_eight_desc:0 "Concentrate research and service preparation on the battle line. This capital-ship priority competes with the navy programme for commerce protection."
 JP1_R_eight_eight_bonus:0 "The Eight-Eight Programme"
 JP1_R_navy_predreadnought_lessons:0 "Pre-Dreadnought Gunnery Lessons"
 JP1_R_navy_predreadnought_lessons_desc:0 "Older ships remain useful schools for rangefinding, damage control, and crew discipline while Japan decides which foreign practices it can afford."
 JP1_R_navy_fleet_wireless:0 "A Connected Naval Staff"
 JP1_R_navy_fleet_wireless_desc:0 "Wireless procedures link the fleet, yards and coastal commands. The naval staff becomes the common foundation for battlefleet and transport programmes."
 JP1_R_navy_coastal_convoys:0 "Commerce Protection Priority"
 JP1_R_navy_coastal_convoys_desc:0 "Give escorts, merchant patrols and transport schedules first claim on naval attention. The service grows around protected communications instead of the capital battle line."
 JP1_R_navy_landing_school:0 "Naval Landing School"
 JP1_R_navy_landing_school_desc:0 "The navy studies boats, beach gradients, signals, and army liaison for limited landings where a port or island matters more than a grand fantasy."
 JP1_R_navy_kure_slipways:0 "Kure Service Slipways"
 JP1_R_navy_kure_slipways_desc:0 "Expand the service yards in Chugoku so existing ships can return to sea. A physical dockyard and a repair programme support both naval priorities."
 JP1_R_navy_yokosuka_torpedoes:0 "Yokosuka Torpedo Workshops"
 JP1_R_navy_yokosuka_torpedoes_desc:0 "Torpedo officers will work directly with the yards on dependable destroyer weapons. Both naval priorities need small craft capable of defending the fleet and its supply lanes."
 JP1_R_yokosuka_torpedoes_bonus:0 "Yokosuka Torpedo Workshops"
 JP1_R_navy_two_ship_squadrons:0 "Two-Ship Squadron Tables"
 JP1_R_navy_two_ship_squadrons_desc:0 "Squadrons practise manoeuvring in pairs so captains learn to concentrate fire before the fleet attempts a larger action."
 JP1_R_navy_battleship_fire_control:0 "Battle Line Fire Control"
 JP1_R_navy_battleship_fire_control_desc:0 "Rangefinders and plotting rooms will use common gunnery data. Capital-ship research and controlled fire improve the battle line selected by the naval budget."
 JP1_R_battleship_fire_control_bonus:0 "Battleship Fire Control"
 JP1_R_navy_cruiser_screen:0 "Cruiser Scout Screen"
 JP1_R_navy_cruiser_screen_desc:0 "Cruisers screen the battle line, scout ahead, and report contacts without being sacrificed for a single dramatic chase."
 JP1_R_navy_wireless_signals:0 "Wireless Fleet Signals"
 JP1_R_navy_wireless_signals_desc:0 "Fleet wireless practice links flagships, cruisers, and shore stations through alternate frequencies and disciplined reporting."
 JP1_R_navy_merchant_patrols:0 "Organise Merchant Patrols"
 JP1_R_navy_merchant_patrols_desc:0 "The merchant register will guide a regular system of patrols and escorted sailings. Relief crews and predictable meeting points will keep the shipping lanes covered without exhausting every destroyer."
 JP1_R_navy_landing_craft:0 "Landing Craft Experiments"
 JP1_R_navy_landing_craft_desc:0 "Small landing craft are tested with ramps, beach parties, and signals, keeping the programme useful for ports and islands."
 JP1_R_navy_torpedo_trials:0 "Torpedo Doctrine Trials"
 JP1_R_navy_torpedo_trials_desc:0 "Torpedo officers compare night approaches, firing angles, and withdrawal signals in exercises that reward patience over reckless launches."
 JP1_R_torpedo_doctrine_bonus:0 "Torpedo Doctrine Trials"
 JP1_R_navy_capital_gunnery:0 "Battlefleet Gunnery Exercises"
 JP1_R_navy_capital_gunnery_desc:0 "Spotting officers, rangefinders and gun crews must act as one team. The battle line will practise salvo control and changes of target under common signals."
 JP1_R_navy_cruiser_recon:0 "Cruiser Reconnaissance"
 JP1_R_navy_cruiser_recon_desc:0 "Cruiser captains chart sea lanes, weather, and enemy habits, giving the fleet information that can shape an operation before guns fire."
 JP1_R_navy_fleet_comms:0 "Fleet Communications Net"
 JP1_R_navy_fleet_comms_desc:0 "A communications net coordinates signals, coaling, and repairs, reducing the chance that a squadron sails beyond its support."
 JP1_R_navy_china_sea_convoys:0 "Distant Convoy Schedules"
 JP1_R_navy_china_sea_convoys_desc:0 "Longer routes require relief escorts and reserve sailings. The commerce programme will prepare distant communications without requiring Japan to seize a particular coast."
 JP1_R_navy_beach_surveys:0 "A Naval Landing Service"
 JP1_R_navy_beach_surveys_desc:0 "Prepare beach charts, boat schedules and liaison with the army. Landing preparation uses practical combat support training instead of granting ownership of a foreign port."
 JP1_R_navy_destroyer_escort:0 "Destroyer Escort Divisions"
 JP1_R_navy_destroyer_escort_desc:0 "Assign flotillas to regular escort divisions rather than temporary detachments. Destroyer research and screen defence support both the battle line and distant convoys."
 JP1_R_destroyer_escort_bonus:0 "Destroyer Escort Rotation"
 JP1_R_navy_eight_eight_budget:0 "Eight-Eight Budget Review"
 JP1_R_navy_eight_eight_budget_desc:0 "The naval budget revisits the Eight-Eight plan after costs, foreign orders, and domestic slips are known."
 JP1_R_navy_rangefinder_standard:0 "Rangefinder Standardisation"
 JP1_R_navy_rangefinder_standard_desc:0 "Standard rangefinders and calibration drills let ships compare reports instead of arguing over instruments after the target disappears."
 JP1_R_navy_commerce_protection:0 "Commerce Protection Command"
 JP1_R_navy_commerce_protection_desc:0 "A commerce command assigns patrol zones, rescue work, and escort priorities so merchant protection stays linked to the economy."
 JP1_R_navy_coastal_landing_trains:0 "Coastal Landing Trains"
 JP1_R_navy_coastal_landing_trains_desc:0 "Landing trains assemble boats, engineers, medical parties, and signals for short operations against a defended shore."
 JP1_R_navy_night_torpedo:0 "Night Torpedo Exercises"
 JP1_R_navy_night_torpedo_desc:0 "Destroyer flotillas will practise approach routes, firing discipline and disengagement at night. Crew training creates a tactical option without promising a decisive result from every torpedo launch."
 JP1_R_navy_fleet_repair:0 "Fleet Repair Depots"
 JP1_R_navy_fleet_repair_desc:0 "Standardise spare parts and repair records between the home yards. A temporary repair programme sustains existing ships before the navy seeks another construction budget."
 JP1_R_navy_counter_squadron:0 "A Concentrated Counter-Squadron"
 JP1_R_navy_counter_squadron_desc:0 "Keep one ready squadron with reliable gunnery and trained screens. Its organisation makes the capital-ship priority useful even when the navy cannot assemble every ship at once."
 JP1_R_navy_yangtze_patrols:0 "Yangtze River Patrols"
 JP1_R_navy_yangtze_patrols_desc:0 "Yangtze patrols protect river traffic through shallow-draft craft, local charts, and strict rules for a crowded waterway."
 JP1_R_navy_imperial_landing_flotilla:0 "Imperial Landing Flotilla"
 JP1_R_navy_imperial_landing_flotilla_desc:0 "A standing landing flotilla keeps boat crews, engineers, and naval liaison ready for a port or island operation."
 JP1_R_navy_far_east_convoys:0 "Sustain the Far Eastern Routes"
 JP1_R_navy_far_east_convoys_desc:0 "Relief shipping and repair rotation keep distant communications open during major war. The programme sustains a campaign without pretending that every ship can remain at sea indefinitely."
 JP1_R_navy_south_china_squadron:0 "South China Expeditionary Squadron"
 JP1_R_navy_south_china_squadron_desc:0 "A South China squadron coordinates cruisers, transports, and shore signals for operations around treaty ports and islands."
 JP1_R_navy_siberian_sea_comms:0 "Siberian Sea Communications"
 JP1_R_navy_siberian_sea_comms_desc:0 "Sea communications around Siberia combine convoy schedules with ice reports and landing liaison, keeping naval support tied to an army plan."
 JP1_R_navy_continental_landing:0 "Army-Navy Landing Coordination"
 JP1_R_navy_continental_landing_desc:0 "Army and navy staffs will coordinate embarkation, landing and follow-up stores. A temporary joint-service programme turns separate preparations into a usable wartime operation."
 JP1_R_navy_maritime_war_reserve:0 "Activate the Maritime War Reserve"
 JP1_R_navy_maritime_war_reserve_desc:0 "In major war, the fleet will activate its trained reserve crews and relief formations. Any developed naval priority can provide the basis for the wartime command."
 JP1_R_air_tokorozawa:0 "Establish the Tokorozawa Service"
 JP1_R_air_tokorozawa_desc:0 "The first service programme will bring pilots, mechanics and observation reports under one administration. Expansion begins with an air service Japan can maintain."
 JP1_R_air_balloon_service:0 "Army Balloon Observation Service"
 JP1_R_air_balloon_service_desc:0 "Balloon crews train observation, mapping, and recovery before powered flight is dependable."
 JP1_R_air_yokosuka_link:0 "Maritime Scouting Priority"
 JP1_R_air_yokosuka_link_desc:0 "Link the aviation service to Yokosuka and naval patrol schedules. Maritime observation receives the first trained crews in place of an army-first programme."
 JP1_R_air_mechanics_school:0 "Train Aviation Mechanics"
 JP1_R_air_mechanics_school_desc:0 "Imported machines require mechanics who can inspect engines and make replacement parts. The school supports aircraft research and practical pilot training."
 JP1_R_aircraft_mechanics_bonus:0 "Aircraft Mechanics School"
 JP1_R_air_first_recon:0 "Army Observation Priority"
 JP1_R_air_first_recon_desc:0 "Prioritise reconnaissance reports and artillery liaison for the army. Aircraft work from staff requirements instead of competing with naval scouting for every available crew."
 JP1_R_air_artillery_spotting:0 "Artillery Spotting Signals"
 JP1_R_air_artillery_spotting_desc:0 "Observers and batteries practise panels, lamps, and map references so a sighting can alter a fire plan without a perfect wireless set."
 JP1_R_air_balloon_maps:0 "Observation Balloon Cartography"
 JP1_R_air_balloon_maps_desc:0 "Balloon cartographers compare photographs with ground surveys, correcting the errors that make a beautiful map useless at the gun line."
 JP1_R_air_seaplane_detachment:0 "A Maintained Seaplane Detachment"
 JP1_R_air_seaplane_detachment_desc:0 "Seaplanes need servicing crews, weather reports and shipboard liaison. A dedicated detachment combines aircraft development with an affordable maritime programme."
 JP1_R_air_engine_workshops:0 "Engine and Propeller Workshops"
 JP1_R_air_engine_workshops_desc:0 "Workshops record engine wear, propeller damage, and fuel quality so flight hours grow from maintenance practice."
 JP1_R_air_manchurian_aerial_maps:0 "Manchurian Aerial Maps"
 JP1_R_air_manchurian_aerial_maps_desc:0 "Aerial mapping follows railway and river corridors first, giving commanders a picture of distance that patrols cannot make quickly."
 JP1_R_manchurian_maps_bonus:0 "Manchurian Aerial Maps"
 JP1_R_air_aviation_depot:0 "The Kanto Aviation Depot"
 JP1_R_air_aviation_depot_desc:0 "One service depot will hold spares, training machines and maintenance records. A Kanto airfield improvement supports either observation priority."
 JP1_R_air_fleet_seaplanes:0 "Fleet Scouting Crews"
 JP1_R_air_fleet_seaplanes_desc:0 "Train relief crews and observers for the fleet reconnaissance schedule. Their value lies in reports that arrive while a squadron can still act on them."
 JP1_R_fleet_seaplanes_bonus:0 "Fleet Seaplane Patrols"
 JP1_R_air_china_recon:0 "Observation over China"
 JP1_R_air_china_recon_desc:0 "An active campaign in China or against Germany requires routes, landing grounds and reports for expeditionary headquarters. The programme remains tied to that actual war."
 JP1_R_air_coastal_stations:0 "Coastal Aviation Stations"
 JP1_R_air_coastal_stations_desc:0 "Home coastal stations will maintain scouting aircraft and organise patrol reliefs. Improve a Chugoku airfield while keeping maritime operations within the service budget."
 JP1_R_air_recon_squadrons:0 "Organise Reconnaissance Squadrons"
 JP1_R_air_recon_squadrons_desc:0 "Observers will use common maps and report forms, and crews will train together before joining a field squadron. The army needs information it can use while there is still time to act."
 JP1_R_air_army_air_coordination:0 "Air Reports for the Gun Line"
 JP1_R_air_army_air_coordination_desc:0 "Observers and artillery staffs will agree on signals, reports and target handover. Aircraft can support the infantry only when the men on the ground understand what the pilots are telling them."
 JP1_R_air_naval_scout_pilots:0 "Naval Scout Pilots"
 JP1_R_air_naval_scout_pilots_desc:0 "Naval pilots train to identify ships, shoals, and weather from the cockpit, improving fleet knowledge without promising perfect detection."
 JP1_R_air_maritime_observation:0 "Maritime Observation Line"
 JP1_R_air_maritime_observation_desc:0 "Observation posts, seaplanes, and wireless stations form a coastal reporting line whose value comes from repeated coverage."
 JP1_R_air_siberian_air:0 "Cold-Weather Expeditionary Aviation"
 JP1_R_air_siberian_air_desc:0 "From August 1918, a Russian campaign calls for cold-weather engine servicing and longer reconnaissance routes. This is a wartime programme for an existing expedition."
 JP1_R_air_air_service_charter:0 "The Wartime Air Service Charter"
 JP1_R_air_air_service_charter_desc:0 "A developed observation priority and a maintained depot can support a lasting service organisation. The charter carries wartime experience into new aircraft development."
 JP1_R_air_service_charter_bonus:0 "Imperial Air Service Charter"
 JP1_R_entente_channel:0 "Keep the Anglo-Japanese Channel"
 JP1_R_entente_channel_desc:0 "The alliance with Britain has helped secure Japan's position since 1902. Keep its diplomatic channel open while asking how far London expects Japanese ships and soldiers to serve British interests."
 JP1_R_request_british_alignment_negotiation:0 "Renew the Anglo-Japanese Alliance"
 JP1_R_request_british_alignment_negotiation_desc:0 "The changing balance in the Pacific calls for a renewed understanding with Britain. Our diplomats offer cooperation against common threats and ask London to acknowledge Japan's security interests in East Asia."
 JP1_R_entente_naval_liaison:0 "Open a Naval Liaison"
 JP1_R_entente_naval_liaison_desc:0 "Admiralty officers compare convoy routes and signals with the Royal Navy. We gain practical notice of British movements without surrendering command of our fleet."
 JP1_R_entente_expeditionary_staff:0 "Prepare an Expeditionary Staff"
 JP1_R_entente_expeditionary_staff_desc:0 "The army writes a staff plan for a limited overseas commitment. Our planners count rail wagons and landing craft before politicians promise an army."
 JP1_R_entente_convoy_escort:0 "Offer Convoy Escorts"
 JP1_R_entente_convoy_escort_desc:0 "We offer escorts where British shipping is exposed, reserving the right to recall them when the home islands need protection. Cooperation earns trust through visible service."
 JP1_R_secure_tsingtao_mandate:0 "Secure the Tsingtao Mandate"
 JP1_R_secure_tsingtao_mandate_desc:0 "Germany's leased harbour at Tsingtao anchors its influence in Shandong. Prepare the landing force and the cabinet's claims so that possession of the harbour can become a recognised Japanese position."
 JP1_R_secure_pacific_stations:0 "Secure the Pacific Stations"
 JP1_R_secure_pacific_stations_desc:0 "The German island stations connect distant waters through coal depots, cables and anchorages. The navy prepares to secure that network while the German fleet is committed elsewhere."
 JP1_R_secure_micronesian_chain:0 "Secure the Micronesian Chain"
 JP1_R_secure_micronesian_chain_desc:0 "Marshall and Caroline island routes offer a chain of positions between the home islands and the southern Pacific. Surveys, landing parties and supply schedules must turn scattered footholds into a defensible naval system."
 JP1_R_entente_intelligence:0 "Share Pacific Intelligence"
 JP1_R_entente_intelligence_desc:0 "Our attachÃ©s exchange port reports and wireless intercepts with Britain. The information improves timing while every territorial question remains a separate Japanese decision."
 JP1_R_entente_russian_channel:0 "Keep a Russian Channel"
 JP1_R_entente_russian_channel_desc:0 "The agreements following Portsmouth have given Japan and Russia room to avoid another costly collision. Maintain a channel to Russian representatives while the European war consumes their attention."
 JP1_R_korean_frontier_watch:0 "Watch the Korean Frontier"
 JP1_R_korean_frontier_watch_desc:0 "The Korean frontier is already administered from Tokyo. We reinforce communications and border administration without manufacturing a second war goal against our own states."
 JP1_R_entente_post_campaign_review:0 "Review the Pacific Campaign"
 JP1_R_entente_post_campaign_review_desc:0 "After the campaign, we review ports, prisoners, and the actual wartime owners of each station. The review prepares a limited settlement decision rather than free transfers."
 JP1_R_entente_final_settlement:0 "Sign a Measured Entente Record"
 JP1_R_entente_final_settlement_desc:0 "Our delegates assemble the record of Japan's naval service and Pacific campaigns. They will seek recognition of the positions our forces have secured while preserving the alliance through which Japan entered the war."
 JP1_R_neutral_channel:0 "Keep Japan Armed and Uncommitted"
 JP1_R_neutral_channel_desc:0 "European quarrels need not determine Japan's next campaign. Examine an armed neutrality that preserves the fleet and continental garrisons while keeping the cabinet free from distant military obligations."
 JP1_R_adopt_neutrality_negotiation:0 "Adopt Armed Neutrality"
 JP1_R_adopt_neutrality_negotiation_desc:0 "Neutrality will require more than a public declaration. Prepare port instructions, diplomatic notices and the defence estimates needed to keep foreign belligerents from using Japanese waters for their own purposes."
 JP1_R_neutral_naval_watch:0 "Maintain a Naval Watch"
 JP1_R_neutral_naval_watch_desc:0 "Lookouts track foreign squadrons approaching the home islands and the Pacific mandates. The watch lasts long enough to give ministers time to decide."
 JP1_R_neutral_trade_office:0 "Protect Neutral Trade"
 JP1_R_neutral_trade_office_desc:0 "Merchants receive one clear set of rules for wartime cargoes and inspections. We protect access to fuel and materials without promising any belligerent a Japanese convoy."
 JP1_R_neutral_mediation:0 "Offer a Pacific Mediation"
 JP1_R_neutral_mediation_desc:0 "We offer a table at Yokohama where rival governments can state their Pacific claims. Mediation does not erase borders; it buys Japan a clearer view of them."
 JP1_R_neutral_korean_guard:0 "Guard the Korean Frontier"
 JP1_R_neutral_korean_guard_desc:0 "Our frontier troops exercise restraint and readiness around Korea. Existing Japanese ownership is reinforced without inventing a new Korean annexation claim."
 JP1_R_neutral_russian_watch:0 "Watch the Russian Pacific"
 JP1_R_neutral_russian_watch_desc:0 "Russian ships, railways and coastal garrisons remain an important part of the Pacific balance. Naval observers and consular reports give the cabinet warning of a change before it reaches the Korean frontier."
 JP1_R_neutral_home_defence:0 "Strengthen Home Defence"
 JP1_R_neutral_home_defence_desc:0 "The army rehearses coastal mobilisation and port security. A neutral Japan needs reserves that answer to Tokyo before they answer to any foreign mission."
 JP1_R_neutral_staff_college:0 "Open a Neutral Staff College"
 JP1_R_neutral_staff_college_desc:0 "Officers study foreign campaigns without adopting another power’s doctrine wholesale. The college turns observation into a temporary planning advantage."
 JP1_R_neutral_ports:0 "Inspect the Neutral Ports"
 JP1_R_neutral_ports_desc:0 "Neutral harbours need clear instructions for foreign warships, merchant traffic and repair work. Inspect the port offices and establish rules that the navy and customs authorities can enforce together."
 JP1_R_neutral_postwar_review:0 "Review the Postwar Balance"
 JP1_R_neutral_postwar_review_desc:0 "The European campaigns are changing the weight of distant powers in Asia. Compare their remaining naval positions with Japan's commitments before deciding how much of the new balance can be maintained without war."
 JP1_R_neutral_rearm_terms:0 "Set Terms for Rearmament"
 JP1_R_neutral_rearm_terms_desc:0 "The services submit a limited programme suited to Japan's independent position. Agree the appropriations that can be sustained after the emergency rather than allowing every foreign naval announcement to dictate a new budget."
 JP1_R_neutral_demobilise:0 "Return the Emergency Staff"
 JP1_R_neutral_demobilise_desc:0 "Temporary defence offices have fulfilled their immediate purpose. Return their responsibilities to ordinary ministries while retaining the surveys and trained staff the emergency has produced."
 JP1_R_neutral_final_statement:0 "Publish the Neutral Record"
 JP1_R_neutral_final_statement_desc:0 "The government publishes its record of armed neutrality and the obligations it is prepared to defend. Japan intends to preserve an independent Pacific policy through strength at home and carefully defined agreements abroad."
 JP1_R_asian_channel:0 "Build an Asian Diplomatic Sphere"
 JP1_R_asian_channel_desc:0 "Japan can build a regional policy around its own strength instead of waiting for the approval of European allies. Approach neighbouring governments while the army and navy examine which positions would make an independent Asian sphere defensible."
 JP1_R_form_asian_faction_negotiation:0 "Draft the Asian League Charter"
 JP1_R_form_asian_faction_negotiation_desc:0 "A Japanese-led league needs a charter that states who commands its campaigns and what membership promises. Draft those terms before inviting other governments to accept a new regional order."
 JP1_R_invite_siam_negotiation:0 "Invite Siam"
 JP1_R_invite_siam_negotiation_desc:0 "Siam has preserved its independence between European colonial empires. Offer a place in our league with military cooperation and a diplomatic counterweight to outside pressure; its government must decide whether Japanese leadership serves Siamese interests."
 JP1_R_siam_frontier_war:0 "Press the Siam Frontier"
 JP1_R_siam_frontier_war_desc:0 "A refusal by Bangkok leaves the army facing an independent power across the routes toward Malaya and Indochina. Prepare an ultimatum and a campaign plan, accepting that the defence of Siam may bring resistance well beyond its frontier."
 JP1_R_malaya_pressure:0 "Challenge British Malaya"
 JP1_R_malaya_pressure_desc:0 "Singapore guards a vital junction of the eastern sea routes. While Britain's fleets are occupied by a European war, our navy studies the approach and the cabinet prepares a demand for control of the Malayan gateway."
 JP1_R_indochina_pressure:0 "Challenge Colonial Indochina"
 JP1_R_indochina_pressure_desc:0 "France's continental war places new demands on its distant empire. Prepare a campaign against the Indochinese bases, with transport and landing forces capable of holding the coast after the first attack."
 JP1_R_east_indies_pressure:0 "Challenge the Dutch East Indies"
 JP1_R_east_indies_pressure_desc:0 "The East Indies offer oil, shipping routes and a chain of naval positions extending toward Australia. Japan's league prepares to challenge the colonial government, with the fleet responsible for sustaining a campaign across these dispersed islands."
 JP1_R_china_conference:0 "Call a China Conference"
 JP1_R_china_conference_desc:0 "Chinese representatives face competing foreign interests while their government struggles to maintain authority. Convene talks on the railway, industrial and security questions through which Japan seeks a stronger position on the continent."
 JP1_R_request_chinese_concessions_negotiation:0 "Request Chinese Concessions"
 JP1_R_request_chinese_concessions_negotiation_desc:0 "The European war offers an opening to press Japan's established interests in southern Manchuria. Present the Twenty-One Demands and seek a limited agreement on industrial and railway concessions before considering a wider confrontation."
 JP1_R_chinese_limited_concessions:0 "Record Limited Concessions"
 JP1_R_chinese_limited_concessions_desc:0 "An agreement gives our commercial representatives a defined place in the Chinese railway and industrial system. Establish the offices needed to administer those concessions while keeping the political consequences before the cabinet."
 JP1_R_china_war_ultimatum:0 "Issue a China War Ultimatum"
 JP1_R_china_war_ultimatum_desc:0 "The league's continental programme reaches beyond commercial privileges. Authorise an ultimatum that demands political submission, knowing that Chinese rejection will turn Japan's ambitions into a military contest."
 JP1_R_demand_chinese_submission_negotiation:0 "Demand Chinese Submission"
 JP1_R_demand_chinese_submission_negotiation_desc:0 "Tokyo demands a protectorate over the Chinese government and prepares for the refusal its ministers may give. The army will need to defeat organised resistance if the proposed order is to extend beyond diplomatic papers."
 JP1_R_manchurian_expansion:0 "Press the Manchurian Corridor"
 JP1_R_manchurian_expansion_desc:0 "The southern Manchurian railway can serve as the foundation of a broader continental position. Prepare to take the corridor around Kirin and connect its depots to the Korean ports that must sustain the advancing army."
 JP1_R_asian_final_settlement:0 "Write the Asian Settlement"
 JP1_R_asian_final_settlement_desc:0 "The army has a programme for its Chinese campaigns. Prepare administrators and supply offices for territory that Japan actually takes; no province changes owner through this focus, and the Chinese government can still contest the war."
 JP1_R_german_channel:0 "Hear Berlin’s Unlikely Offer"
 JP1_R_german_channel_desc:0 "Germany's conflict with Russia creates a possible opening for an unexpected understanding. Listen to Berlin's proposal while assessing the consequences for the alliance that has connected Japan to Britain."
 JP1_R_request_german_alignment_negotiation:0 "Request German Alignment"
 JP1_R_request_german_alignment_negotiation_desc:0 "Our diplomats propose a Pacific agreement that preserves German positions in return for strategic cooperation. Berlin must decide whether Japanese pressure on the continent compensates for the risks of this departure from established alliances."
 JP1_R_german_staff_mission:0 "Open a German Staff Mission"
 JP1_R_german_staff_mission_desc:0 "German officers are invited to compare mobilisation schedules with Japanese requirements. The mission is temporary and remains useful even if the cabinet later refuses alignment."
 JP1_R_german_naval_exchange:0 "Exchange Naval Lessons"
 JP1_R_german_naval_exchange_desc:0 "We study German commerce-raiding reports beside our own Pacific experience. Shared lessons do not give Berlin access to Japanese command."
 JP1_R_german_pacific_consultation:0 "Consult on Pacific Holdings"
 JP1_R_german_pacific_consultation_desc:0 "German naval representatives set out the needs of their Pacific stations. Negotiate how the two fleets can operate in the region without competing for the same anchorages and supply routes."
 JP1_R_issue_german_ultimatum_decision:0 "Issue the German Ultimatum"
 JP1_R_issue_german_ultimatum_decision_desc:0 "Britain's war with Germany brings the leased base at Tsingtao and the German Pacific squadron before the cabinet. Demand their withdrawal and prepare to act if Berlin refuses the ultimatum."
 JP1_R_german_war_council:0 "Convene the German War Council"
 JP1_R_german_war_council_desc:0 "The council names what Japan will defend and what it will leave to later negotiation. It keeps a rare alignment from becoming an unlimited demand on the army."
 JP1_R_prepare_russian_campaign_planning:0 "Prepare a Russian Campaign"
 JP1_R_prepare_russian_campaign_planning_desc:0 "Russia is again engaged in a costly struggle, and our staff studies the opportunity along its Pacific frontier. The lessons of 1905 demand a campaign built around ports, railways and achievable objectives rather than an unlimited march into Siberia."
 JP1_R_request_siberian_intervention_negotiation:0 "Request Siberian Intervention"
 JP1_R_request_siberian_intervention_negotiation_desc:0 "Russia's civil war places Vladivostok and the eastern railways at the centre of competing interests. Seek White Russian consent for an expedition against the Bolsheviks, while the cabinet sets limits on the positions Japan intends to hold."
 JP1_R_far_east_buffer:0 "Secure a Far Eastern Buffer"
 JP1_R_far_east_buffer_desc:0 "Vladivostok and Khabarovsk control the approach to the lower Amur. Make their occupation a central war aim, then seek a limited treaty through which a dependent Far Eastern administration can be established."
 JP1_R_north_sakhalin_claim:0 "Claim North Sakhalin"
 JP1_R_north_sakhalin_claim_desc:0 "The northern half of Sakhalin remains a strategic concern across the narrow waters from Karafuto. Place it among the cabinet's war aims and prepare the forces needed to secure the island's remaining Russian positions."
 JP1_R_korea_frontier_security:0 "Secure the Korea Frontier"
 JP1_R_korea_frontier_security_desc:0 "Korean ports and northern communications form the base of every continental deployment. Reinforce their staff work and supply schedules before sending the army farther along the Russian and Manchurian frontiers."
 JP1_R_russian_far_east_campaign:0 "Press the Russian Far East"
 JP1_R_russian_far_east_campaign_desc:0 "The coastal advance reaches the lower Amur and the approaches to Nikolaevsk. Prepare a further campaign against these connected positions, where control of river transport can determine whether the army sustains its gains."
 JP1_R_post_campaign_settlement:0 "Negotiate the Post-Campaign Settlement"
 JP1_R_post_campaign_settlement_desc:0 "The cabinet reviews the positions held by its expedition and the costs of continuing the campaign. Diplomats receive a limited negotiating programme, while military administrators prepare for either a treaty or a longer occupation."
 JP1_R_commit_british_alignment:0 "Commit to the Entente"
 JP1_R_commit_british_alignment_desc:0 "London has answered our request and the cabinet now chooses whether to make the understanding binding. Japan enters the Entente by a recorded decision, with its own obligations still visible."
 JP1_R_commit_neutrality:0 "Commit to Armed Neutrality"
 JP1_R_commit_neutrality_desc:0 "The cabinet accepts the neutral memorandum and keeps Japan outside the European blocs. The fleet remains ready, while later choices stay Japanese choices."
 JP1_R_commit_asian_faction:0 "Commit to an Asian Faction"
 JP1_R_commit_asian_faction_desc:0 "Japan adopts the league charter and assumes leadership of a new regional faction. Its reach will be established by the governments that accept membership and by the campaigns the army and navy can sustain."
 JP1_R_commit_german_alignment:0 "Commit to German Alignment"
 JP1_R_commit_german_alignment_desc:0 "Berlin’s answer is acceptable to the cabinet as a rare negotiated alignment. Japan chooses the connection for its own security calculation, with no historical obligation forced upon it."
 JP1_R_german_exit_terms:0 "Define Continental Commitments"
 JP1_R_german_exit_terms_desc:0 "A continental understanding must define the obligations it creates for the cabinet. Set out the consultation procedures through which Japan can refuse an unfunded campaign while preserving the agreement's strategic purpose."
 JP1_R_industry_shortcut:0 "Industry"
 JP1_R_colonies_shortcut:0 "Colonies"
