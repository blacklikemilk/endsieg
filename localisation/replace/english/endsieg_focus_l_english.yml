 SO2_new_economic_policy: "The New Economic Policy"
 SO2_new_economic_policy_desc: "Replace emergency requisitioning with limited markets and incentives to restore agriculture and trade."
 SO2_confiscate_grain: "Confiscation of Grain"
 SO2_confiscate_grain_desc: ""
 SO2_treaty_of_creation_ussr: "Found the Soviet Union"
 SO2_treaty_of_creation_ussr_desc: "The union treaty joins the Soviet republics under common institutions while defining their federal relationship."
 SO2_GOELRO: "The GOELRO Plan"
 SO2_GOELRO_desc: "An electrification program will connect new power stations to industry and the countryside."
