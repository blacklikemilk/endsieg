 AUH_ww1_common_customs_market:0 "The Common Customs Market"
 AUH_ww1_common_customs_market_desc:0 "Common contracts and technical standards will bind Austrian industry and Hungarian agriculture together. Neither treasury can afford another barrier to internal trade."
 AUH_ww1_coal_and_steel:0 "Coal and Steel Committees"
 AUH_ww1_coal_and_steel_desc:0 "Mines and foundries compete for transport with food and military stores. Joint purchasing committees must secure their inputs."
 AUH_ww1_joint_industry_board:0 "The Joint Industrial Board"
 AUH_ww1_joint_industry_board_desc:0 "Vienna, Budapest and the armament firms must reconcile competing orders. A standing board will coordinate expansion and record its obligations."
 AUH_ww1_women_in_war_industry:0 "Women in War Industry"
 AUH_ww1_women_in_war_industry_desc:0 "Mobilization has drained the workshops of skilled men. More women will enter production, supported by training and workplace facilities."
 AUH_ww1_wartime_standardization:0 "Standardize Wartime Contracts"
 AUH_ww1_wartime_standardization_desc:0 "Common gauges and inspection rules will reduce waste. Factories must deliver equipment that the army can maintain and supply."
 AUH_ww1_war_transition_commission:0 "The War and Transition Commission"
 AUH_ww1_war_transition_commission_desc:0 "Industry needs a future beyond emergency contracts. A transition commission will prepare civilian orders and reconstruction while the war continues."
 AUH_ww1_postwar_conversion:0 "Convert the War Economy"
 AUH_ww1_postwar_conversion_desc:0 "Peace must end permanent emergency production. We will redirect surviving industry to civilian reconstruction and close the temporary war plants."
 AUH_ww1_treasury_coordination:0 "The Common Civil Administration"
 AUH_ww1_treasury_coordination_desc:0 "The common ministries need consistent reporting, appointments and inspections. Regular parliamentary scrutiny will serve the two governments without a separate debt system."
 AUH_ww1_war_bond_market:0 "Municipal Service Contracts"
 AUH_ww1_war_bond_market_desc:0 "Municipalities require reliable water, housing and relief services. Reserve political effort for public works instead of launching another borrowing programme."
 AUH_ww1_hungarian_grain_agreement:0 "The Hungarian Grain Agreement"
 AUH_ww1_hungarian_grain_agreement_desc:0 "Hungarian food deliveries must be negotiated and paid for. A durable agreement will halve the monthly wartime decline in food security."
 AUH_ww1_revenue_reform:0 "Provincial Civil Registers"
 AUH_ww1_revenue_reform_desc:0 "A common set of permits and civil registers will improve procurement and appointments while provincial officials retain local knowledge."
 AUH_ww1_emergency_credit:0 "Technical College Partnerships"
 AUH_ww1_emergency_credit_desc:0 "Vienna, Prague and Budapest can exchange technical curricula and trained instructors. Better engineering instruction supports construction research."
 AUH_ww1_food_office:0 "A Common Food Office"
 AUH_ww1_food_office_desc:0 "Municipalities, army buyers and provincial authorities compete for the same supplies. A common office will record stocks and organize distribution."
 AUH_ww1_sinking_fund:0 "Municipal Housing Boards"
 AUH_ww1_sinking_fund_desc:0 "Housing boards will coordinate building sites and tenders in Vienna. The programme creates civilian workshops in territory we control."
 AUH_ww1_price_statistics:0 "Price and Delivery Statistics"
 AUH_ww1_price_statistics_desc:0 "Local reports will identify missing deliveries and diversion from public stores. Accurate schedules improve food distribution, rather than printing money."
 AUH_ww1_civilian_kitchens:0 "Municipal Civilian Kitchens"
 AUH_ww1_civilian_kitchens_desc:0 "Public kitchens give urban families an alternative to an unreliable market. Their expansion consumes resources but helps preserve the home front."
 AUH_ww1_rationing_board:0 "The Rationing Board"
 AUH_ww1_rationing_board_desc:0 "Ration cards require actual deliveries. A joint board will coordinate provincial distribution and protect a minimum civilian share of supplies."
 AUH_ww1_accountable_war_budget:0 "Inspect Common Procurement"
 AUH_ww1_accountable_war_budget_desc:0 "Parliamentary inspectors will compare military and civilian contracts. Inspection improves purchasing without creating a new fiscal resource."
 AUH_ww1_postwar_debt_settlement:0 "Restore Provincial Public Services"
 AUH_ww1_postwar_debt_settlement_desc:0 "Peace permits the restoration of local clinics, workshops and registration offices. Reconstruction must reach the remaining provinces."
 AUH_ww1_july_mediation:0 "A Concert for Balkan Mediation"
 AUH_ww1_july_mediation_desc:0 "A permanent diplomatic channel can contain the next Balkan crisis. We will commit to negotiation before another assassination turns a regional dispute into general war."
 AUH_ww1_sixtus_channel:0 "The Sixtus Channel"
 AUH_ww1_sixtus_channel_desc:0 "Karl can use Prince Sixtus as an intermediary with France. The initiative exposes the court to diplomatic risk and does not guarantee an accepted settlement."
 AUH_ww1_diplomatic_reconstruction:0 "Rebuild the Diplomatic Service"
 AUH_ww1_diplomatic_reconstruction_desc:0 "A surviving monarchy needs treaties that reflect the end of the war. Reopened channels will defend reconstruction through negotiation."
 AUH_ww1_trialist_compromise:0 "A South Slav Crownland"
 AUH_ww1_trialist_compromise_desc:0 "A third political partner could give the South Slavs a place inside the dynasty. It challenges entrenched interests and needs sustained confidence to withstand wartime strain."
 AUH_ww1_federal_compact:0 "A Federal Nationalities Compact"
 AUH_ww1_federal_compact_desc:0 "The empire can attempt a federation of its national communities. Constitutional guarantees improve cooperation but create political and administrative costs."
 AUH_ww1_provincial_rights:0 "Hear the Provincial Diets"
 AUH_ww1_provincial_rights_desc:0 "Local diets will receive a regular channel to the common ministries. Funding their representatives changes consultation, without granting a new constitution."
 AUH_ww1_reopen_reichsrat:0 "Reopen the Reichsrat"
 AUH_ww1_reopen_reichsrat_desc:0 "Karl needs a parliament through which the nationalities can speak. Reopening the Reichsrat restores scrutiny and supports civilian relief programmes."
 AUH_ww1_worker_representation:0 "Recognize Worker Delegations"
 AUH_ww1_worker_representation_desc:0 "Factories cannot sustain the war through commands alone. Formal representation trades civilian resources for more dependable production."
 AUH_ww1_constitutional_commission:0 "A Constitutional Commission"
 AUH_ww1_constitutional_commission_desc:0 "Karl will commission concrete proposals for the empire future. Negotiated guarantees offer cooperation while the military situation remains decisive."
 AUH_ww1_nationalities_conference:0 "A Conference of the Nationalities"
 AUH_ww1_nationalities_conference_desc:0 "The crown will hear provincial representatives before another emergency measure. Agreement can improve confidence but cannot undo military collapse."
 AUH_ww1_peaceful_reconstruction:0 "Preserve the Common Institutions"
 AUH_ww1_peaceful_reconstruction_desc:0 "Joint administration must restore civilian services, workshops and reliable food deliveries after the war. Reconstruction will serve the territories which remain under the common government."
 AUH_ww1_army_bill_1912:0 "The Army Bill of 1912"
 AUH_ww1_army_bill_1912_desc:0 "The new army law offers a chance to repair years of restricted recruiting and expenditure. Vienna and Budapest must agree on establishments, reserve instruction and the equipment needed to turn the enlarged paper army into a usable force."
 AUH_ww1_fieldworks_bonus:0 "Fieldworks of the Pioneer Corps Research"
 AUH_ww1_respirator_bonus:0 "Issue Respirators to the Front Research"
 AUH_ww1_gas_school_bonus:0 "Regimental Gas Defence Schools Research"
 AUH_ww1_filter_bonus:0 "Inspect the Respirator Supply Research"
 AUH_ww1_mannlicher_bonus:0 "Standardise the Mannlicher Rifle Research"
 AUH_ww1_schwarzlose_bonus:0 "Schwarzlose Machine-Gun Sections Research"
 AUH_ww1_steyr_bonus:0 "Steyr Wartime Production Standards Research"
 AUH_ww1_assault_equipment_bonus:0 "Carbines and Grenades for Assault Sections Research"
 AUH_ww1_regimental_languages:0 "Regimental Language Instruction"
 AUH_ww1_regimental_languages_desc:0 "Orders must be understood before they can be obeyed. Officers and non-commissioned officers will strengthen instruction in the languages used by their own men while retaining a common vocabulary for drill, communications and command."
 AUH_ww1_landwehr_honved_coordination:0 "Coordinate Landwehr and Honved"
 AUH_ww1_landwehr_honved_coordination_desc:0 "The Austrian Landwehr and Hungarian Honved possess their own institutions, but mobilization places their formations beside the Common Army. Liaison officers, common supply tables and joint exercises can make cooperation work without erasing those identities."
 AUH_ww1_skoda_field_bonus:0 "Skoda Field-Gun Contracts Research"
 AUH_ww1_howitzer_bonus:0 "Modernise the Howitzer Batteries Research"
 AUH_ww1_surveyed_fire_bonus:0 "Surveyed Fire and Battery Signals Research"
 AUH_ww1_artillery_reconnaissance:0 "Artillery Reconnaissance Sections"
 AUH_ww1_artillery_reconnaissance_desc:0 "Survey parties and observers must work as an organized service rather than isolated specialists. Reconnaissance sections will compare patrol reports, photographs and battery observations before targets are entered into the fire plan."
 AUH_ww1_artillery_recon_bonus:0 "Artillery Reconnaissance Sections Research"
 AUH_ww1_mountain_warfare:0 "Train for Mountain Warfare"
 AUH_ww1_mountain_warfare_desc:0 "The Kaiserjager and other experienced mountain formations possess knowledge which the wider army needs. Specialist courses in movement, climbing, dispersed fire and casualty evacuation will prepare units for the Carpathians and the Alpine frontier."
 AUH_ww1_tyrolean_depots:0 "Tyrolean Supply Depots"
 AUH_ww1_tyrolean_depots_desc:0 "Mountain positions cannot be sustained from distant stores alone. Improving the routes and depots of Tyrol will shorten the last stage of the supply journey and support the pack columns which carry food and ammunition above the railheads."
 AUH_ww1_alpine_logistics:0 "Pack Columns and Cableways"
 AUH_ww1_alpine_logistics_desc:0 "Roads narrow and horses tire long before they reach the highest positions. Better organized pack columns, cableways and protected stores will help the Alpine army maintain regular deliveries through weather which defeats ordinary transport."
 AUH_ww1_alpine_supply_bonus:0 "Pack Columns and Cableways Research"
 AUH_war_front_2_desc:0 "The Isonzo sector combines exposed approaches, rock-cut positions and narrow supply routes. A permanent front headquarters will coordinate artillery, relief and reserves so that the defence can endure repeated enemy preparations."
 AUH_ww1_stosstruppen:0 "Train the Stosstruppen"
 AUH_ww1_stosstruppen_desc:0 "Selected infantrymen will practice small-unit infiltration, grenade fighting and attacks against isolated strongpoints. Experienced assault instructors can teach those methods across the army while retaining artillery support and reserves for the main battle."
 AUH_ww1_common_operational_plan:0 "A Common Operational Plan"
 AUH_ww1_common_operational_plan_desc:0 "The army now possesses lessons from every major theatre, but scarce reserves make competing offensives dangerous. One operational plan will reconcile the needs of the Common Army, Landwehr and Honved with the guns, transport and supplies actually available."
 AUH_ww1_observation_armament_bonus:0 "Arm the Observation Aircraft Research"
 AUH_ww1_lohner_lloyd_bonus:0 "Lohner and Lloyd Two-Seaters Research"
 AUH_ww1_aviatik_two_seater_bonus:0 "Aviatik C-Type Contracts Research"
 AUH_ww1_phonix_ufag_bonus:0 "Phonix and UFAG Reconnaissance Types Research"
 AUH_ww1_bomb_rack_bonus:0 "Standardise Two-Seater Bomb Racks Research"
 AUH_ww1_bomber_program_review:0 "Review the Knoller Programme"
 AUH_ww1_bomber_program_review_desc:0 "Ambitious designs can consume scarce engines and skilled labour while failing to meet squadron needs. A review of the Knoller programme will compare trial results with front-line reports and redirect technical effort toward reliable aircraft."
 AUH_ww1_aerial_artillery_liaison:0 "Aerial Artillery Liaison"
 AUH_ww1_aerial_artillery_liaison_desc:0 "Aircraft can see beyond ridges and locate batteries hidden from ground observers, provided their messages reach the right guns. Liaison teams will connect flying companies to artillery headquarters through agreed signals, wireless procedures and target sketches."
 AUH_ww1_aviation_spares:0 "An Air Service Spare-Parts Pool"
 AUH_ww1_aviation_spares_desc:0 "Domestic aircraft share too few fittings and too many urgent repair requests. A centrally managed pool of spare engines, instruments and workshop tools will reduce the time trained crews spend waiting for machines to return to service."
 AUH_ww1_fighter_armament_bonus:0 "Create Dedicated Fighter Flights Research"
 AUH_ww1_oeffag_bonus:0 "Oeffag Albatros Production Research"
 AUH_ww1_aviatik_berg_bonus:0 "The Aviatik Berg Fighter Research"
 AUH_ww1_phonix_fighter_bonus:0 "Phonix Fighter Trials Research"
 AUH_ww1_contact_aircraft_bonus:0 "Low-Level Support Trials Research"
 AUH_ww1_joint_air_operations:0 "Coordinate the Air Companies"
 AUH_ww1_joint_air_operations_desc:0 "A useful air service must connect reconnaissance, fighters and technical support to a single operational purpose. Common planning between the Fliegerkompanien and army headquarters will assign missions according to the aircraft, crews and facilities actually ready for service."
 AUH_ww1_naval_gunnery_bonus:0 "Skoda Naval Gunnery Research"
 AUH_ww1_adriatic_patrols:0 "Adriatic Patrol Stations"
 AUH_ww1_adriatic_patrols_desc:0 "A limited fleet needs reliable information about its own sea. Coastal observation posts, patrol schedules and liaison with naval aviation will help light forces cover the approaches to Pola, Trieste and the southern bases."
 AUH_ww1_submarine_design_bonus:0 "Develop the U-Boat Arm Research"
 AUH_ww1_u_boat_training_bonus:0 "Pola U-Boat School Research"
 AUH_ww1_tatra_bonus:0 "Tatra-Class Light Forces Research"
 AUH_ww1_tegetthoff_bonus:0 "The Tegetthoff Programme Research"
 AUH_ww1_novara_bonus:0 "Novara-Class Scout Cruisers Research"
 AUH_battle_cruiser_effort_desc:0 "The Adriatic rewards speed and concentration more often than another heavy hull. Cruiser and destroyer commanders will practice rendezvous, mutual support and planned withdrawal so that fast squadrons can attack without becoming trapped by superior enemy forces."
 AUH_ww1_cattaro_support:0 "Support the Cattaro Flotillas"
 AUH_ww1_cattaro_support_desc:0 "The sailors at Cattaro serve far from the principal arsenal and depend on regular provisioning and workable shore services. Better stores, maintenance scheduling and base administration will help sustain the flotillas through a prolonged war."
 AUH_ww1_preserve_battle_fleet:0 "Preserve the Battle Fleet"
 AUH_ww1_preserve_battle_fleet_desc:0 "Admiral Haus's approach treats the capital ships as a fleet whose continued existence restricts the enemy's freedom. We will prioritize sound machinery, damage control and a protected reserve while light forces undertake the more frequent operations."
 AUH_ww1_battle_fleet_preservation_bonus:0 "Preserve the Battle Fleet Research"
 AUH_ww1_adriatic_sorties:0 "Prepare Adriatic Squadron Sorties"
 AUH_ww1_adriatic_sorties_desc:0 "A more active fleet policy requires carefully limited objectives, escort plans and routes of withdrawal. Joint cruiser, destroyer and capital-ship exercises will prepare concentrated sorties while acknowledging the danger of mines and enemy torpedo craft."
 AUH_ww1_otranto_operation:0 "Plan the Otranto Operation"
 AUH_ww1_otranto_operation_desc:0 "The barrage across the Strait of Otranto restricts movement between the Adriatic and the Mediterranean. Coordinated light-force attacks, submarine patrols and diversionary movements can challenge it, provided the plan keeps clear limits on the risk to the fleet."
 IT1_ww1_national_industrial_survey:0 "Survey National Industry"
 IT1_ww1_national_industrial_survey_desc:0 "A reliable account of machinery and skilled workers will expose the gaps between northern factories and southern districts. Public contracts must follow actual capacity."
 IT1_ww1_hydroelectric_consortium:0 "The Hydroelectric Consortium"
 IT1_ww1_hydroelectric_consortium_desc:0 "Domestic hydroelectric power can reduce the vulnerability of workshops dependent on imported coal. Engineers and investors will coordinate surveys and equipment standards."
 IT1_ww1_industrial_mobilization:0 "Dallolio Industrial Mobilization"
 IT1_ww1_industrial_mobilization_desc:0 "Military contracts must be coordinated across the firms and ministries. Central supervision can increase output, but it also expands the obligations that the treasury must settle."
 IT1_ww1_industrial_mobilization_administration_tt:0 "Social tension: +2 points. Indices are limited to 0-100."
 IT1_ww1_southern_development:0 "Develop the Mezzogiorno"
 IT1_ww1_southern_development_desc:0 "Southern development must produce more than promises. A new civilian workshop in Campania will connect local skills to public purchasing."
 IT1_ww1_southern_development_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_women_in_workshops:0 "Women in the Workshops"
 IT1_ww1_women_in_workshops_desc:0 "Mobilization has left factories short of trained labor. Instruction, wages and basic facilities will help more women enter industrial production."
 IT1_ww1_women_in_workshops_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_state_arsenal_model:0 "The State Arsenal Model"
 IT1_ww1_state_arsenal_model_desc:0 "Public arsenals will receive priority over private contracts. Direct control strengthens military construction while placing its cost and administration on the state."
 IT1_ww1_private_consortia:0 "Competitive Armament Consortia"
 IT1_ww1_private_consortia_desc:0 "Private firms will compete under common inspection and price rules. The state must support their expansion while preventing military contracts from absorbing civilian investment."
 IT1_ww1_precision_standardization:0 "Standardize Precision Production"
 IT1_ww1_precision_standardization_desc:0 "Common inspection methods and gauges will cut waste in ammunition and weapons contracts. Reliable specifications are as important as additional orders."
 IT1_ww1_reconstruction_contracts:0 "Prepare Reconstruction Contracts"
 IT1_ww1_reconstruction_contracts_desc:0 "The state must prepare civilian orders before emergency production ends. Reconstruction will use existing industry and close temporary wartime factories at peace."
 IT1_ww1_reconstruction_contracts_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_banking_committee:0 "The Common Procurement Committee"
 IT1_ww1_banking_committee_desc:0 "Treasury officials and contractors will standardise inspection and ordering procedures. A common committee improves industrial purchasing without a debt score."
 IT1_ww1_national_loan_market:0 "National Supply Contracts"
 IT1_ww1_national_loan_market_desc:0 "Pay for public transport and supply contracts that keep civilian deliveries moving. Industry receives a temporary maintenance programme."
 IT1_ww1_grain_imports:0 "Secure Grain Import Contracts"
 IT1_ww1_grain_imports_desc:0 "Shipping and grain contracts must protect civilian supply throughout a long war. This agreement halves the monthly wartime fall in food security."
 IT1_ww1_grain_imports_administration_tt:0 "Food security: +8 points. Indices are limited to 0-100."
 IT1_ww1_progressive_taxation:0 "Extraordinary Public Services"
 IT1_ww1_progressive_taxation_desc:0 "Extraordinary appropriations will support public services and domestic workshops. Competing wartime priorities create political opposition."
 IT1_ww1_progressive_taxation_administration_tt:0 "Social tension: +2 points. Indices are limited to 0-100."
 IT1_ww1_central_bank_facility:0 "Technical Purchasing Offices"
 IT1_ww1_central_bank_facility_desc:0 "Technical inspectors will help firms meet common specifications. The programme supports practical engineering research."
 IT1_ww1_central_bank_facility_administration_tt:0 "Social tension: +2 points. Indices are limited to 0-100."
 IT1_ww1_national_food_commission:0 "The National Food Commission"
 IT1_ww1_national_food_commission_desc:0 "Army buyers and municipal authorities must stop bidding blindly against one another. A joint commission will record stocks and organize distribution."
 IT1_ww1_national_food_commission_administration_tt:0 "Food security: +5 points. Indices are limited to 0-100."
 IT1_ww1_audit_military_contracts:0 "Inspect Military Contracts"
 IT1_ww1_audit_military_contracts_desc:0 "Military inspectors will compare specifications and delivery schedules, improving production efficiency through the existing procurement institutions."
 IT1_ww1_protect_small_savers:0 "Protect Small Subscribers"
 IT1_ww1_protect_small_savers_desc:0 "War finance relies on households as well as banks. Clear subscription terms and honest accounts will reduce public distrust while requiring civilian resources."
 IT1_ww1_protect_small_savers_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_municipal_relief:0 "Municipal Food Relief"
 IT1_ww1_municipal_relief_desc:0 "Public kitchens and local relief offices will support urban families. Their expansion needs paid deliveries and resources from the civilian economy."
 IT1_ww1_shipping_insurance:0 "Insure Essential Shipping"
 IT1_ww1_shipping_insurance_desc:0 "Merchant captains need predictable insurance and purchasing contracts. Paid guarantees will sustain food deliveries without creating new convoys by decree."
 IT1_ww1_shipping_insurance_administration_tt:0 "Food security: +4 points. Indices are limited to 0-100."
 IT1_ww1_budget_discipline:0 "Publish the Wartime Budget"
 IT1_ww1_budget_discipline_desc:0 "Parliament and the public must be able to see the costs of war. Consolidated accounts reduce hidden liabilities while restricting ministerial spending."
 IT1_ww1_budget_discipline_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_domestic_credit_strategy:0 "Domestic Industrial Contracts"
 IT1_ww1_domestic_credit_strategy_desc:0 "Domestic firms receive supervised contracts for common supplies. The choice supports local efficiency without any borrowing counter."
 IT1_ww1_trade_finance:0 "Foreign Purchasing Agreements"
 IT1_ww1_trade_finance_desc:0 "Foreign suppliers can fill shortages through supervised purchasing and shipping arrangements. No debt score is used."
 IT1_ww1_trade_finance_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_debt_conversion:0 "Convert Wartime Supply Contracts"
 IT1_ww1_debt_conversion_desc:0 "Redirect surviving wartime industry to civilian services. Conversion closes the temporary war plants and costs political effort."
 IT1_ww1_debt_conversion_administration_tt:0 "Social tension: +2 points. Indices are limited to 0-100."
 IT1_ww1_veterans_pensions:0 "Fund Veterans Pensions"
 IT1_ww1_veterans_pensions_desc:0 "Wounded soldiers and military families need dependable support. A national pension fund will reduce social tension while increasing public obligations."
 IT1_ww1_veterans_pensions_administration_tt:0 "Social tension: -7 points. Indices are limited to 0-100."
 IT1_ww1_balanced_reconstruction:0 "Balance the Reconstruction Budget"
 IT1_ww1_balanced_reconstruction_desc:0 "Loan conversion, pensions and food deliveries must fit a credible budget. We will end exceptional obligations while protecting a basic civilian allocation."
 IT1_ww1_balanced_reconstruction_administration_tt:0 "Food security: +3 points; Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_colonial_office:0 "A Professional Colonial Office"
 IT1_ww1_colonial_office_desc:0 "Officials must record local conditions and stop treating every province as the same problem. A permanent office will support paid administrative programmes."
 IT1_ww1_ottoman_accommodation:0 "An Understanding with the Porte"
 IT1_ww1_ottoman_accommodation_desc:0 "Commercial concessions and a negotiated sphere offer an alternative to invasion. Ottoman acceptance is required and no Libyan state changes hands by decree."
 IT1_ww1_eritrean_civil_service:0 "The Eritrean Civil Service"
 IT1_ww1_eritrean_civil_service_desc:0 "Existing colonial administration needs trained staff and dependable local services. A funded programme will strengthen civilian supply without annexing neighboring lands."
 IT1_ww1_eritrean_civil_service_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_ottoman_trade_mission:0 "Commercial Missions to Ottoman Ports"
 IT1_ww1_ottoman_trade_mission_desc:0 "Accepted accommodation permits a different colonial policy. Paid merchant missions will improve food supply and support civilian trade while preserving Ottoman sovereignty."
 IT1_ww1_ottoman_trade_mission_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_somali_coastal_services:0 "Somali Coastal Services"
 IT1_ww1_somali_coastal_services_desc:0 "Our Somali ports need roads and basic supply facilities. The investment remains inside territory already owned and controlled by Italy."
 IT1_ww1_consular_network:0 "Expand the Consular Network"
 IT1_ww1_consular_network_desc:0 "Consuls can support trade and obtain reliable local information without claiming ownership. The diplomatic network will provide a foundation for future Mediterranean agreements."
 IT1_ww1_red_sea_supply:0 "The Red Sea Supply Network"
 IT1_ww1_red_sea_supply_desc:0 "Eritrean and Somali services must coordinate shipments rather than competing for them. Funded contracts will protect supply at both ends of the route."
 IT1_ww1_red_sea_supply_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_senussi_accommodation:0 "Negotiate with the Senussi"
 IT1_ww1_senussi_accommodation_desc:0 "Local leaders may accept an agreement on civil administration and security. Negotiation requires resources and a reply; it offers an alternative to a permanent punitive campaign."
 IT1_ww1_colonial_sanitation:0 "Colonial Public Health Services"
 IT1_ww1_colonial_sanitation_desc:0 "Military garrisons and civilian communities need reliable water and basic medical services. Paid administration will improve supply without creating new territorial rights."
 IT1_ww1_colonial_sanitation_administration_tt:0 "Food security: +4 points; Social tension: -1 points. Indices are limited to 0-100."
 IT1_ww1_tripolitanian_road_services:0 "Tripolitanian Road Services"
 IT1_ww1_tripolitanian_road_services_desc:0 "Roads near the Tripoli district can support the coast and its market. Construction proceeds only where Italy owns and controls the state."
 IT1_ww1_dodecanese_administration:0 "Administer the Dodecanese"
 IT1_ww1_dodecanese_administration_desc:0 "The islands require a permanent civil service and respect for local communities. The programme applies only if Italy already owns and controls the Dodecanese."
 IT1_ww1_colonial_trade_board:0 "The Colonial Trade Board"
 IT1_ww1_colonial_trade_board_desc:0 "A trade board will reconcile civilian orders and military contracts. It supports commerce inside existing holdings rather than turning commercial ambitions into free annexations."
 IT1_ww1_mediterranean_commerce:0 "Mediterranean Commercial Cooperation"
 IT1_ww1_mediterranean_commerce_desc:0 "Consuls, merchants and the foreign ministry will support negotiated access to regional markets. Trade can strengthen influence without requiring another war."
 IT1_ww1_mediterranean_commerce_administration_tt:0 "Food security: +4 points. Indices are limited to 0-100."
 IT1_ww1_colonial_autonomy_charters:0 "Local Administrative Charters"
 IT1_ww1_colonial_autonomy_charters_desc:0 "Civil arrangements can give municipal leaders responsibility for services and supplies. The charters apply within our holdings and require an ongoing financial commitment."
 IT1_ww1_colonial_autonomy_charters_administration_tt:0 "Social tension: -4 points. Indices are limited to 0-100."
 IT1_ww1_permanent_colonial_budget:0 "Permanent Colonial Service Offices"
 IT1_ww1_permanent_colonial_budget_desc:0 "Recurring colonial services need reliable local offices and purchasing schedules. Supervised administration replaces emergency borrowing."
 IT1_ww1_peaceful_colonial_order:0 "A Negotiated Colonial Order"
 IT1_ww1_peaceful_colonial_order_desc:0 "A surviving settlement requires local administration, trade and clear financial obligations. We will support those institutions rather than fund indefinite emergency campaigns."
 IT1_ww1_peaceful_colonial_order_administration_tt:0 "Food security: +3 points; Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_continental_concert:0 "An Independent Continental Concert"
 IT1_ww1_continental_concert_desc:0 "Italy can offer France a continental understanding rather than follow either existing alignment blindly. Actual membership depends on a reply and the disposition of existing factions."
 IT1_ww1_london_supply_guarantees:0 "Clarify Allied Supply Guarantees"
 IT1_ww1_london_supply_guarantees_desc:0 "Italian intervention will require a dependable flow of materials. Our ministry will coordinate purchasing plans without assuming that foreign stocks belong to Italy."
 IT1_ww1_london_supply_guarantees_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_armed_neutrality:0 "Permanent Armed Neutrality"
 IT1_ww1_armed_neutrality_desc:0 "Italy will refuse participation in the continental war and defend its independence. Neutral trade and mediation require a firm pledge which also blocks automatic Entente entry."
 IT1_ww1_neutral_trade_conventions:0 "Neutral Trade Conventions"
 IT1_ww1_neutral_trade_conventions_desc:0 "Clear shipping and customs conventions will protect civilian commerce. The treasury must fund the guarantees while Italy remains outside the great-power factions."
 IT1_ww1_neutral_trade_conventions_administration_tt:0 "Food security: +3 points. Indices are limited to 0-100."
 IT1_ww1_adriatic_compact:0 "A Negotiated Adriatic Compact"
 IT1_ww1_adriatic_compact_desc:0 "Italy and Austria-Hungary can seek guarantees for the Adriatic rather than another territorial war. Vienna must accept before the arrangement takes effect."
 IT1_ww1_central_staff_mission:0 "A Joint Central Powers Staff Mission"
 IT1_ww1_central_staff_mission_desc:0 "Italian and German commanders will coordinate plans while preserving their national chains of command. The mission requires political effort and real allied cooperation."
 IT1_ww1_mediation_conference:0 "Sponsor a Mediation Conference"
 IT1_ww1_mediation_conference_desc:0 "A neutral Italy can pay for a channel between opposing governments. A reply may improve confidence, but the conference cannot force a faction-wide peace."
 IT1_ww1_albanian_guarantee:0 "Guarantee Albanian Independence"
 IT1_ww1_albanian_guarantee_desc:0 "Albanian independence can be defended without annexing its territory. Italy will guarantee an existing Albanian state which is neither a subject nor an enemy."
 IT1_ww1_common_frontier_commission:0 "The Common Frontier Commission"
 IT1_ww1_common_frontier_commission_desc:0 "An accepted Adriatic arrangement needs inspectors and regular consultation. The commission will oversee its obligations while improving civilian confidence."
 IT1_ww1_common_frontier_commission_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_mediterranean_security:0 "A Mediterranean Security Council"
 IT1_ww1_mediterranean_security_desc:0 "Accepted continental cooperation needs permanent institutions. Political resources will support naval consultation and paid mediation rather than another compulsory alliance."
 IT1_ww1_western_campaign_plans:0 "Plans for the Western Front"
 IT1_ww1_western_campaign_plans_desc:0 "A German-aligned Italy must prepare for the French frontier rather than repeat an Austrian campaign. Joint planning will improve staff experience without preempting actual operations."
 IT1_ww1_allied_purchase_controls:0 "Inspect Allied Purchase Contracts"
 IT1_ww1_allied_purchase_controls_desc:0 "Foreign equipment requests require honest accounts and proper distribution. A purchasing review can reduce waste within the coalition war effort."
 IT1_ww1_allied_purchase_controls_administration_tt:0 "Social tension: -1 points. Indices are limited to 0-100."
 IT1_ww1_war_aims_conference:0 "The Italian War Aims Conference"
 IT1_ww1_war_aims_conference_desc:0 "Military cooperation does not settle every territorial question. Ministers must reconcile their commitments and present a coherent negotiating position for the eventual peace."
 IT1_ww1_war_aims_conference_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_postwar_diplomatic_settlement:0 "Review the Postwar Settlement"
 IT1_ww1_postwar_diplomatic_settlement_desc:0 "The end of hostilities must be reflected in Italian diplomacy. A conference will record obligations and support reconstruction without adding an automatic territorial settlement."
 IT1_ww1_independent_great_power:0 "An Independent Great Power"
 IT1_ww1_independent_great_power_desc:0 "Italy will defend its surviving agreements through trade and consultation. A coherent independent policy requires institutions and resources as much as military prestige."
 IT1_ww1_independent_great_power_administration_tt:0 "Food security: +2 points; Social tension: -2 points. Indices are limited to 0-100."
 IT1_free_speech_administration_tt:0 "Social tension: -4 points. Indices are limited to 0-100."
 IT1_ww1_catholic_understanding:0 "The Catholic Electoral Understanding"
 IT1_ww1_catholic_understanding_desc:0 "Consultation with Catholic associations can widen the parliamentary coalition. Their support requires social commitments rather than a free increase in every national statistic."
 IT1_ww1_catholic_understanding_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_labor_pact:0 "Negotiate with Organized Labor"
 IT1_ww1_labor_pact_desc:0 "Factory representatives must have a route to discuss wages and conditions. A funded labor pact reduces tension while imposing concessions on production."
 IT1_ww1_labor_pact_administration_tt:0 "Social tension: -5 points. Indices are limited to 0-100."
 IT1_ww1_suffrage_implementation:0 "Implement the Expanded Suffrage"
 IT1_ww1_suffrage_implementation_desc:0 "A wider electorate needs reliable registration and administration. The government will fund those services rather than treating electoral reform as an automatic solution to unrest."
 IT1_ww1_suffrage_implementation_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_constitutional_settlement:0 "Review the Crown and Parliament"
 IT1_ww1_constitutional_settlement_desc:0 "A constitutional review will make the balance between royal prerogative and parliamentary responsibility explicit. Its outcome depends on the settlement the government actually accepts."
 IT1_ww1_liberal_cabinet:0 "A Responsible Liberal Cabinet"
 IT1_ww1_liberal_cabinet_desc:0 "Ministers will remain accountable to parliamentary confidence. This settlement strengthens civil administration while preserving the existing constitutional monarchy."
 IT1_ww1_liberal_cabinet_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_royal_cabinet:0 "Government through the Royal Cabinet"
 IT1_ww1_royal_cabinet_desc:0 "The crown will retain an expanded executive role. Faster political decisions come at the cost of civilian distrust and opposition to emergency powers."
 IT1_ww1_royal_cabinet_administration_tt:0 "Social tension: +5 points. Indices are limited to 0-100."
 IT1_ww1_republican_convention:0 "Convene a Republican Assembly"
 IT1_ww1_republican_convention_desc:0 "A republican assembly can place civilian authority beyond the dynasty. Bonomi will lead the accepted settlement, with real political costs and an explicit choice to retain the monarchy."
 IT1_ww1_socialist_congress:0 "A Socialist Constituent Congress"
 IT1_ww1_socialist_congress_desc:0 "A socialist constituent settlement offers a different response to war and inequality. From 1917 a Gramsci-led government can replace the monarchy, at the cost of political upheaval."
 IT1_ww1_civil_service_professionalization:0 "Professionalize the Civil Service"
 IT1_ww1_civil_service_professionalization_desc:0 "Reliable accounts and trained officials are indispensable to civilian government. A paid programme will support accountable administration without altering the military command."
 IT1_ww1_civil_service_professionalization_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_republican_guarantees:0 "Republican Civil Guarantees"
 IT1_ww1_republican_guarantees_desc:0 "An accepted republic must protect civil rights and establish a credible administrative framework. Guarantees impose limits on government as well as obligations on citizens."
 IT1_ww1_republican_guarantees_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_royal_inspection_services:0 "Royal Inspection Services"
 IT1_ww1_royal_inspection_services_desc:0 "The royal cabinet must inspect the institutions it controls. Clear accounts will restrain abuses while its emergency powers continue to create opposition."
 IT1_ww1_royal_inspection_services_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_workers_councils:0 "Recognize Factory Councils"
 IT1_ww1_workers_councils_desc:0 "The accepted socialist republic will give factory representatives a formal role in production. Council organization improves cooperation but consumes civilian resources."
 IT1_ww1_workers_councils_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_agrarian_cooperatives:0 "Support Agrarian Cooperatives"
 IT1_ww1_agrarian_cooperatives_desc:0 "Rural credit and cooperative purchasing can improve food deliveries. The programme needs public funds and cannot replace harvests with administrative promises."
 IT1_ww1_agrarian_cooperatives_administration_tt:0 "Food security: +6 points; Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_land_settlement_commission:0 "The Land Settlement Commission"
 IT1_ww1_land_settlement_commission_desc:0 "The government will mediate disputes over agricultural contracts and access to land. Compensation and administration must be financed if the settlement is to last."
 IT1_ww1_land_settlement_commission_administration_tt:0 "Social tension: -5 points. Indices are limited to 0-100."
 IT1_ww1_reintegration_of_veterans:0 "Reintegrate the Returning Soldiers"
 IT1_ww1_reintegration_of_veterans_desc:0 "Demobilized soldiers need work and dependable support. The chosen government will fund their reintegration rather than leave the problem to emergency organizations."
 IT1_ww1_reintegration_of_veterans_administration_tt:0 "Social tension: -5 points. Indices are limited to 0-100."
 IT1_ww1_constitutional_continuity:0 "Preserve the Chosen Settlement"
 IT1_ww1_constitutional_continuity_desc:0 "Italy will carry its chosen institutions into the postwar period. Reconstruction must respect that settlement and not silently replace it with a different historical regime."
 IT1_ww1_constitutional_continuity_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_staff_coordination:0 "A Permanent Mobilization Bureau"
 IT1_ww1_staff_coordination_desc:0 "Railway schedules and reserve call-ups cannot be improvised when the frontier is threatened. A permanent staff bureau will reconcile mobilization plans with the men, rolling stock and depots actually available."
 IT1_ww1_fieldworks_bonus:0 "Engineer the Field Positions Research"
 IT1_ww1_respirator_bonus:0 "Issue Protective Respirators Research"
 IT1_ww1_gas_school_bonus:0 "Regimental Gas-Defence Schools Research"
 IT1_ww1_filter_bonus:0 "Inspect the Filter Reserves Research"
 IT1_ww1_carcano_bonus:0 "The Carcano Rifle System Research"
 IT1_ww1_fiat_revelli_bonus:0 "Fiat-Revelli Machine-Gun Teams Research"
 IT1_ww1_villar_perosa_bonus:0 "Villar Perosa Field Trials Research"
 IT1_ww1_assault_equipment_bonus:0 "Carbines and Assault Equipment Research"
 IT1_ww1_field_gun_bonus:0 "Cannone da 75 Contracts Research"
 IT1_ww1_heavy_howitzer_bonus:0 "The Heavy Howitzer Parks Research"
 IT1_ww1_bombarde_bonus:0 "Bombarde for the Wire Research"
 IT1_ww1_alpini_schools:0 "The Alpini Training Schools"
 IT1_ww1_alpini_schools_desc:0 "The Alpini know the frontier valleys and the habits of mountain service. Specialist schools will spread their climbing, reconnaissance and marksmanship experience while preserving the local knowledge on which their battalions depend."
 IT1_ww1_alpine_cableways:0 "Cableways Above the Railheads"
 IT1_ww1_alpine_cableways_desc:0 "High positions depend on supplies carried beyond the reach of roads. Engineers will organize cableways, pack columns and protected stores, reducing the time soldiers spend hauling ammunition instead of preparing their positions."
 IT1_ww1_mountain_guns:0 "Artillery for the Alpine Batteries"
 IT1_ww1_mountain_guns_desc:0 "Mountain batteries must carry their guns where ordinary artillery cannot travel. Trials will combine lighter equipment, trained pack animals and reliable ammunition tables for high-angle fire across ridges and valleys."
 IT1_ww1_mountain_gun_bonus:0 "Artillery for the Alpine Batteries Research"
 IT1_ww1_winter_positions:0 "Prepare the White War Positions"
 IT1_ww1_winter_positions_desc:0 "Snow, avalanches and cold can destroy a mountain unit without an enemy attack. Winter-service courses and shelter inspections will pass on the practical lessons needed to sustain the Alpine front through another season."
 IT1_ww1_rear_services:0 "Coordinate the Rear Services"
 IT1_ww1_rear_services_desc:0 "Transport, ammunition parks and replacement depots must answer to a common picture of the army. A rear-services bureau will reconcile competing requests before shortages arrive at the same exhausted front-line formations."
 IT1_ww1_rail_transport_bonus:0 "Coordinate the Rear Services Research"
 IT1_ww1_field_hospitals:0 "Field Hospitals and Evacuation Routes"
 IT1_ww1_field_hospitals_desc:0 "Prompt treatment depends on stretcher teams, dressing stations and routes through crowded rear areas. Medical service exercises will connect those stages so that wounded soldiers reach care without obstructing the supply columns."
 IT1_ww1_field_hospitals_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_replacement_rotations:0 "Rotate the Replacement Drafts"
 IT1_ww1_replacement_rotations_desc:0 "Trained replacements should reach formations before exhaustion empties them of experienced men. Better draft schedules and periods of rear-area instruction will improve continuity while reducing the strain of uninterrupted front-line service."
 IT1_ww1_replacement_rotations_administration_tt:0 "Social tension: -2 points. Indices are limited to 0-100."
 IT1_ww1_arditi:0 "Organise the Reparti d'Assalto"
 IT1_ww1_arditi_desc:0 "Selected assault troops will practice grenade fighting, rapid movement and attacks against isolated strongpoints. The new Reparti d'Assalto require instructors and support arrangements as carefully prepared as the men chosen for their ranks."
 IT1_ww1_assault_support:0 "Artillery Support for the Arditi"
 IT1_ww1_assault_support_desc:0 "Assault troops cannot carry the whole battle alone. Joint exercises will align artillery lifts, engineer parties and ordinary infantry reserves with the Arditi objectives, turning a local penetration into a position the army can hold."
 IT1_ww1_cadorna_offensives:0 "Concentrate the Frontier Offensives"
 IT1_ww1_cadorna_offensives_desc:0 "A determined offensive policy demands concentrated artillery and tightly controlled preparations. The staff will commit its effort to breaking fortified frontier positions, accepting additional expense and strain in exchange for a stronger assault programme."
 IT1_ww1_cadorna_offensives_administration_tt:0 "Social tension: +2 points. Indices are limited to 0-100."
 IT1_ww1_early_command_reform:0 "Reform Command Before the Crisis"
 IT1_ww1_early_command_reform_desc:0 "The army can give subordinate commanders clearer objectives and more room to adapt before a disaster forces change. This alternative programme will emphasize maintained reserves and shorter operations, with less strain on the men and rear services."
 IT1_ww1_early_command_reform_administration_tt:0 "Social tension: -3 points. Indices are limited to 0-100."
 IT1_ww1_shell_concentration:0 "Concentrate the Ammunition Parks"
 IT1_ww1_shell_concentration_desc:0 "A sustained attack needs ammunition delivered to one timetable. We will prioritise artillery supply and transport for selected sectors."
 IT1_ww1_shell_concentration_bonus:0 "Concentrate the Ammunition Parks Research"
 IT1_ww1_defence_in_depth:0 "A Defence with Local Reserves"
 IT1_ww1_defence_in_depth_desc:0 "A penetrated forward trench need not cost an entire sector. Commanders will establish fallback positions and local reserves, allowing the army to absorb attacks while preserving the strength needed for a limited counterstroke."
 IT1_ww1_officer_replacements:0 "Rebuild the Officer Cadres"
 IT1_ww1_officer_replacements_desc:0 "Heavy fighting consumes the junior officers who keep units functioning under fire. Accelerated courses and supervised front-line attachments will rebuild the cadres, while commanders receive more accurate reports of their the actual strength of their formations."
 IT1_ww1_officer_replacements_administration_tt:0 "Social tension: +1 points. Indices are limited to 0-100."
 IT1_ww1_soldier_welfare:0 "Leave and Front-Line Welfare"
 IT1_ww1_soldier_welfare_desc:0 "A workable leave system and dependable rest periods help sustain an army over years of service. The reformed command will place those arrangements within the operational plan, reducing social strain while preserving trained manpower in the ranks."
 IT1_ww1_soldier_welfare_administration_tt:0 "Social tension: -4 points. Indices are limited to 0-100."
 IT1_ww1_caporetto_command_review:0 "Review the Supreme Command"
 IT1_ww1_caporetto_command_review_desc:0 "The crisis on the northern front demands an honest examination of command and communications. A military council will consider who should direct the army and how headquarters must change before another campaign."
 IT1_ww1_diaz_reforms:0 "Diaz and the Restored Army"
 IT1_ww1_diaz_reforms_desc:0 "A new command can give the army a steadier relationship between objectives, reserves and the condition of its men. the reform programme of Diaz will strengthen staff coordination and relief arrangements as the formations regain confidence."
 IT1_ww1_diaz_reforms_administration_tt:0 "Social tension: -4 points. Indices are limited to 0-100."
 IT1_ww1_retain_old_command:0 "Retain the Offensive Command"
 IT1_ww1_retain_old_command_desc:0 "The government can choose to retain the existing command after its review. This alternative commits the army to renewed concentration and assault preparation, but the decision will place additional strain on an already weary society."
 IT1_ww1_retain_old_command_administration_tt:0 "Social tension: +4 points. Indices are limited to 0-100."
 IT1_ww1_army_campaign_plan:0 "A Sustainable Campaign Plan"
 IT1_ww1_army_campaign_plan_desc:0 "The next campaign must match the the actual means of the army. The staff will reconcile Alpine positions, assault units, reserves and rear services into one plan, with clear limits on what the formations can sustain."
 IT1_ww1_air_bomb_trials_bonus:0 "Bombs from Observation Aircraft Research"
 IT1_ww1_caproni_trimotor_bonus:0 "Caproni Trimotor Contracts Research"
 IT1_ww1_caproni_ca3_bonus:0 "The Caproni Ca.3 Squadrons Research"
 IT1_ww1_caproni_standardisation_bonus:0 "Standardise the Caproni Bombing Force Research"
 IT1_ww1_bomb_sight_bonus:0 "Caproni Bomb Sights and Loading Research"
 IT1_ww1_fighter_armament_bonus:0 "Create the Fighter Squadrons Research"
 IT1_ww1_macchi_nieuport_bonus:0 "Macchi-Nieuport Licence Production Research"
 IT1_ww1_spad_bonus:0 "SPAD Service and Maintenance Research"
 IT1_ww1_ansaldo_sva_bonus:0 "Develop the Ansaldo SVA Research"
 IT1_ww1_synchronised_armament_bonus:0 "Synchronised Armament Workshops Research"
 IT1_ww1_contact_aircraft_bonus:0 "Battlefield Support Experiments Research"
 IT1_ww1_photographic_reconnaissance:0 "Photographic Sections for the Armies"
 IT1_ww1_photographic_reconnaissance_desc:0 "Photographs become useful intelligence only when trained officers interpret and distribute them. Dedicated sections will compare aerial images with maps and patrol reports, improving the information available to artillery and army headquarters."
 IT1_ww1_fiat_aero_engines:0 "Fiat Aviation Engine Contracts"
 IT1_ww1_fiat_aero_engines_desc:0 "A reliable engine supply underpins every aircraft programme. Coordinated Fiat contracts and specialist inspection will support the workshops and repair depots which must keep the expanding aviation service in the air."
 IT1_ww1_fiat_aero_engine_bonus:0 "Fiat Aviation Engine Contracts Research"
 IT1_ww1_independent_bombing:0 "An Independent Bombing Command"
 IT1_ww1_independent_bombing_desc:0 "the proposals of Douhet invite a separate air offensive beyond the immediate army battle. This alternative will prioritize Caproni contracts and dedicated bombing direction, committing scarce engines and borrowed funds to a more independent aviation strategy."
 IT1_ww1_army_air_cooperation:0 "Air Companies for the Armies"
 IT1_ww1_army_air_cooperation_desc:0 "Army headquarters need reconnaissance and support which follow their immediate operations. We will prioritize liaison and dependable squadron service, directing the bombing force toward objectives coordinated with the field armies."
 IT1_ww1_air_campaign_plan:0 "An Italian Air Campaign Plan"
 IT1_ww1_air_campaign_plan_desc:0 "Aircraft programmes must serve a coherent operational purpose. Aviation headquarters will reconcile the chosen bombing policy with reconnaissance, fighters and the engine supply, assigning missions according to the crews and machines actually ready."
 IT1_ww1_dante_alighieri_bonus:0 "The Dante Alighieri Programme Research"
 IT1_ww1_naval_gunnery_bonus:0 "Naval Gunnery and Fire Control Research"
 IT1_ww1_laurenti_bonus:0 "The Laurenti Submarine Designs Research"
 IT1_ww1_f_class_bonus:0 "The F-Class Submarine Service Research"
 IT1_ww1_indomito_pilo_bonus:0 "Indomito and Pilo Destroyers Research"
 IT1_ww1_cavour_duilio_bonus:0 "The Cavour and Duilio Squadrons Research"
 IT1_ww1_esploratori_bonus:0 "Esploratori for the Fleet Research"
 IT1_ww1_adriatic_observation:0 "Adriatic Observation Stations"
 IT1_ww1_adriatic_observation_desc:0 "Coastal observers and regular patrols can warn the fleet before an enemy sortie reaches its objective. The navy will coordinate reports from shore stations and light forces into a clearer picture of the Adriatic approaches."
 IT1_ww1_naval_staff:0 "A Permanent Naval Operations Staff"
 IT1_ww1_naval_staff_desc:0 "The battle fleet, light forces and shore services need a common operational picture. A permanent staff will reconcile their readiness reports, maintenance schedules and objectives before an emergency forces hurried coordination."
 IT1_ww1_torpedo_depots:0 "Torpedo Depots and Inspection"
 IT1_ww1_torpedo_depots_desc:0 "A flotilla cannot rely on weapons which have been stored or adjusted inconsistently. Specialized depot teams will inspect torpedoes and standardize handling procedures, giving commanders more confidence in the weapons already issued."
 IT1_ww1_torpedo_depot_bonus:0 "Torpedo Depots and Inspection Research"
 IT1_ww1_mas_flotillas:0 "Develop the MAS Flotillas"
 IT1_ww1_mas_flotillas_desc:0 "Small motor torpedo craft can operate in confined coastal waters where larger ships are too costly to risk. Trials will refine engines, torpedo fittings and crew training before an expanded flotilla programme is approved."
 IT1_ww1_otranto_patrols:0 "Patrol the Strait of Otranto"
 IT1_ww1_otranto_patrols_desc:0 "The entrance to the Adriatic concentrates traffic into waters which light forces can watch. Patrol plans will coordinate observation, escorts and reserve units while avoiding the assumption that a line on a map can seal the sea."
 IT1_ww1_adriatic_minefields:0 "Chart the Adriatic Minefields"
 IT1_ww1_adriatic_minefields_desc:0 "Mines can protect approaches and complicate enemy movements, but careless laying also threatens our own traffic. A common charting and control service will connect minefield plans to patrol routes and convoy instructions."
 IT1_ww1_adriatic_mines_bonus:0 "Chart the Adriatic Minefields Research"
 IT1_ww1_port_approaches:0 "Secure the Port Approaches"
 IT1_ww1_port_approaches_desc:0 "Our harbours need disciplined observation and traffic control as much as permanent defences. Local commands will rehearse patrol handovers and warning procedures around the principal naval bases."
 IT1_ww1_merchant_convoys:0 "Convoys for the Merchant Marine"
 IT1_ww1_merchant_convoys_desc:0 "Imported food and raw materials depend on ships which must cross contested waters. Convoy exercises will align sailing schedules, escorts and harbour services, improving the use of the light forces already available."
 IT1_ww1_antisubmarine_sections:0 "Anti-Submarine Escort Sections"
 IT1_ww1_antisubmarine_sections_desc:0 "Submarine attacks require trained lookouts and escorts with a common response plan. Trials of detection and depth-charge methods will guide specialized sections while the navy develops more dependable convoy protection."
 IT1_ww1_escort_depth_charge_bonus:0 "Anti-Submarine Escort Sections Research"
 IT1_ww1_macchi_patrol_aircraft:0 "Macchi Coastal Patrol Aircraft"
 IT1_ww1_macchi_patrol_aircraft_desc:0 "Naval aircraft can extend observation beyond shore stations and warn patrols of suspicious movements. Cooperation with the Macchi works and flying schools will develop the service routines needed for regular coastal reconnaissance."
 IT1_ww1_decisive_battle_policy:0 "Seek a Mediterranean Battle Fleet"
 IT1_ww1_decisive_battle_policy_desc:0 "Concentrated capital-ship squadrons give the fleet a wider Mediterranean role. Staff training and maintenance will support this ambitious operational policy."
 IT1_ww1_revel_light_strategy:0 "Revel and the Adriatic Light Forces"
 IT1_ww1_revel_light_strategy_desc:0 "The confined Adriatic favors patrols, torpedo craft and carefully limited attacks. We will prioritize the light-force strategy associated with Thaon di Revel, preserving the capital ships while smaller units undertake frequent operations."
 IT1_ww1_caracciolo_priority:0 "Prioritise the Caracciolo Programme"
 IT1_ww1_caracciolo_priority_desc:0 "The Caracciolo designs offer a stronger future battle squadron, but construction competes with the army and existing fleet for steel and skilled labour. Our alternative policy will maintain the technical programme and allocate further borrowed resources to its development."
 IT1_ww1_caracciolo_bonus:0 "Prioritise the Caracciolo Programme Research"
 IT1_ww1_mas_raid_schools:0 "Schools for the MAS Raids"
 IT1_ww1_mas_raid_schools_desc:0 "Coastal raids demand precise navigation, reconnaissance and an agreed route of withdrawal. Experienced MAS crews will turn those requirements into a training programme for selected flotillas, without assuming that audacity can replace preparation."
 IT1_ww1_sicilian_fleet_support:0 "Sicilian Support for the Battle Fleet"
 IT1_ww1_sicilian_fleet_support_desc:0 "An ambitious Mediterranean strategy requires maintenance farther south than the main northern arsenals. Additional productive capacity in Sicily will support repairs and construction while acknowledging the further cost of the chosen fleet policy."
 IT1_ww1_premuda_reconnaissance:0 "Prepare the Premuda Patrol Routes"
 IT1_ww1_premuda_reconnaissance_desc:0 "The island approaches require close reconnaissance and careful night navigation before a patrol can find an opportunity. Selected light-force crews will study routes and rendezvous points, preparing a limited operation without assuming its outcome."
 IT1_ww1_arsenal_repair_network:0 "Connect the Arsenal Repair Network"
 IT1_ww1_arsenal_repair_network_desc:0 "The naval arsenals must share repair schedules and technical records instead of competing for scarce spare parts. A common service plan will help the fleet return worn ships to readiness while making better use of the yards already expanded."
 IT1_ww1_naval_repair_bonus:0 "Connect the Arsenal Repair Network Research"
 AUH_ww1_coal_steel_bonus:0 "Coal and Steel Committees Research"
 AUH_ww1_conversion_planning_bonus:0 "The War and Transition Commission Research"
 AUH_ww1_technical_colleges_bonus:0 "Technical College Partnerships Research"
 AUH_ww1_civil_statistics_bonus:0 "Price and Delivery Statistics Research"
 AUH_ww1_reserve_rifles_bonus:0 "The Army Bill of 1912 Research"
 AUH_ww1_operational_reports_bonus:0 "Defence in Depth Research"
 AUH_ww1_front_coordination_bonus:0 "Prepare the Caporetto Staff Plan Research"
 AUH_ww1_combined_staff_bonus:0 "A Common Operational Plan Research"
 AUH_ww1_bohemian_negotiations:0 "Bohemian Diets"
 AUH_ww1_bohemian_negotiations_desc:0 "Bohemian and Moravian delegates need elected institutions, language guarantees and an agreed share in common affairs."
 AUH_ww1_hungarian_negotiations:0 "The Hungarian Settlement"
 AUH_ww1_hungarian_negotiations_desc:0 "Budapest must agree to the new framework and protect Slovak institutions and minority rights."
 AUH_ww1_croatian_negotiations:0 "The Croatian Sabor"
 AUH_ww1_croatian_negotiations_desc:0 "The Sabor can negotiate a recognised South Slav partner with written safeguards for the Adriatic districts."
 AUH_ww1_galician_negotiations:0 "Galician and Ruthenian Delegations"
 AUH_ww1_galician_negotiations_desc:0 "Polish and Ruthenian representatives must agree on local institutions, shared services and minority protection."
 AUH_ww1_bosnian_negotiations:0 "A Bosnian Provincial Council"
 AUH_ww1_bosnian_negotiations_desc:0 "Bosnia requires representation for its communities and a defined place under the common institutions."
 AUH_ww1_slovenian_negotiations:0 "Slovenian Regional Representation"
 AUH_ww1_slovenian_negotiations_desc:0 "Slovenian local administration and language rights need a binding agreement with the crownlands."
 AUH_ww1_nationality_charter:0 "The Nationality Charter"
 AUH_ww1_nationality_charter_desc:0 "Protect worship, language and provincial institutions without drawing arbitrary frontiers. The charter is a binding administrative obligation."
 AUH_ww1_civilian_amnesty:0 "A Reviewed Imperial Amnesty"
 AUH_ww1_civilian_amnesty_desc:0 "Review political detention through civil oversight. A measured amnesty can restore trust without abolishing the courts."
 AUH_ww1_railway_federal_board:0 "The Common Railway Board"
 AUH_ww1_railway_federal_board_desc:0 "Crownland authorities must coordinate civilian deliveries and mobilisation schedules through a paid common transport service."
 AUH_ww1_constitutional_compromise:0 "Resolve the Disputed Drafts"
 AUH_ww1_constitutional_compromise_desc:0 "Commission a common administrative compromise before choosing a constitution. Written schedules and consultation replace another blanket stability reward."
 AUH_ww1_renew_dualism:0 "Renew the Dual Monarchy"
 AUH_ww1_renew_dualism_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_renew_dualism_institutions:0 "Separate Ministerial Responsibility"
 AUH_ww1_renew_dualism_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_renew_dualism_services:0 "The Joint Delegations"
 AUH_ww1_renew_dualism_services_desc:0 "Prepare the practical administration and services required by the proposed settlement. The reform can only take effect after a separate ratification."
 AUH_ww1_renew_dualism_ratification:0 "Ratify: Renew the Dual Monarchy"
 AUH_ww1_renew_dualism_ratification_desc:0 "The crownland representatives must accept the settlement and the government must control its participating territories. Ratification changes the constitution, autonomy or borders; a failed vote remains open to renegotiation through decisions."
 AUH_ww1_renew_dualism_settlement_1:0 "Common Cabinet Procedure"
 AUH_ww1_renew_dualism_settlement_1_desc:0 "The cabinet will divide common responsibilities between Vienna and Budapest through a written procedure."
 AUH_ww1_renew_dualism_settlement_2:0 "Honved and Landwehr Liaison"
 AUH_ww1_renew_dualism_settlement_2_desc:0 "Honved, Landwehr and common-army staffs will hold joint liaison exercises and exchange railway plans."
 AUH_ww1_renew_dualism_settlement_3:0 "The Renewed Customs Agreement"
 AUH_ww1_renew_dualism_settlement_3_desc:0 "The renewed governments will use a common customs charter to support industry and internal commerce."
 AUH_ww1_common_executive:0 "A Common Executive"
 AUH_ww1_common_executive_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_common_executive_institutions:0 "Uniform Executive Appointments"
 AUH_ww1_common_executive_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_common_executive_services:0 "The Imperial Inspectorate"
 AUH_ww1_common_executive_services_desc:0 "Prepare the practical administration and services required by the proposed settlement. The reform can only take effect after a separate ratification."
 AUH_ww1_common_executive_ratification:0 "Ratify: A Common Executive"
 AUH_ww1_common_executive_ratification_desc:0 "The crownland representatives must accept the settlement and the government must control its participating territories. Ratification changes the constitution, autonomy or borders; a failed vote remains open to renegotiation through decisions."
 AUH_ww1_common_executive_settlement_1:0 "A Professional Civil Service"
 AUH_ww1_common_executive_settlement_1_desc:0 "Professional appointments will replace overlapping civil orders and improve local construction administration."
 AUH_ww1_common_executive_settlement_2:0 "The Inspectorate of Supply"
 AUH_ww1_common_executive_settlement_2_desc:0 "The supply inspectorate will organise depots and food deliveries under common ministerial supervision."
 AUH_ww1_common_executive_settlement_3:0 "Reaffirm the Common Army"
 AUH_ww1_common_executive_settlement_3_desc:0 "Common-army headquarters will reaffirm its command structure and reserve operational authority."
 AUH_ww1_three_crowns:0 "Three Partners under the Crown"
 AUH_ww1_three_crowns_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_three_crowns_institutions:0 "Recognise the South Slav Diets"
 AUH_ww1_three_crowns_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_three_crowns_services:0 "A Three-Part Military Service"
 AUH_ww1_three_crowns_services_desc:0 "Prepare the practical administration and services required by the proposed settlement. The reform can only take effect after a separate ratification."
 AUH_ww1_three_crowns_ratification:0 "Ratify: Three Partners under the Crown"
 AUH_ww1_three_crowns_ratification_desc:0 "The crownland representatives must accept the settlement and the government must control its participating territories. Ratification changes the constitution, autonomy or borders; a failed vote remains open to renegotiation through decisions."
 AUH_ww1_three_crowns_settlement_1:0 "The South Slav Public Works Board"
 AUH_ww1_three_crowns_settlement_1_desc:0 "The South Slav works board will establish civilian workshops in Croatia, where the crown retains control."
 AUH_ww1_three_crowns_settlement_2:0 "A Three-Part Officer College"
 AUH_ww1_three_crowns_settlement_2_desc:0 "The three political partners will share officer instruction at the common staff college."
 AUH_ww1_three_crowns_settlement_3:0 "The Trialist Customs Charter"
 AUH_ww1_three_crowns_settlement_3_desc:0 "A trialist commercial charter will retain an internal market across the three partners."
 AUH_ww1_united_federation:0 "The United Danubian Federation"
 AUH_ww1_united_federation_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_united_federation_institutions:0 "Elected Federal Representation"
 AUH_ww1_united_federation_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_united_federation_services:0 "Common Federal Services"
 AUH_ww1_united_federation_services_desc:0 "Prepare the practical administration and services required by the proposed settlement. The reform can only take effect after a separate ratification."
 AUH_ww1_united_federation_ratification:0 "Ratify: The United Danubian Federation"
 AUH_ww1_united_federation_ratification_desc:0 "The crownland representatives must accept the settlement and the government must control its participating territories. Ratification changes the constitution, autonomy or borders; a failed vote remains open to renegotiation through decisions."
 AUH_ww1_united_federation_settlement_1:0 "The Federal Construction Board"
 AUH_ww1_united_federation_settlement_1_desc:0 "Federal construction contracts will expand civilian machine workshops in Moravia."
 AUH_ww1_united_federation_settlement_2:0 "Federal Officer Service"
 AUH_ww1_united_federation_settlement_2_desc:0 "A federal army will replace contested provincial command arrangements with common language and recruitment services."
 AUH_ww1_united_federation_settlement_3:0 "The Danubian Market Charter"
 AUH_ww1_united_federation_settlement_3_desc:0 "The federal chamber will adopt common industrial and commercial standards."
 AUH_ww1_autonomous_crowns:0 "Autonomous Crownland Governments"
 AUH_ww1_autonomous_crowns_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_autonomous_crowns_institutions:0 "Define Crownland Autonomy"
 AUH_ww1_autonomous_crowns_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_autonomous_crowns_services:0 "The Common Defence Convention"
 AUH_ww1_autonomous_crowns_services_desc:0 "Prepare the practical administration and services required by the proposed settlement. The reform can only take effect after a separate ratification."
 AUH_ww1_autonomous_crowns_ratification:0 "Ratify: Autonomous Crownland Governments"
 AUH_ww1_autonomous_crowns_ratification_desc:0 "The crownland representatives must accept the settlement and the government must control its participating territories. Ratification changes the constitution, autonomy or borders; a failed vote remains open to renegotiation through decisions."
 AUH_ww1_autonomous_crowns_settlement_1:0 "Crownland Reconstruction Contracts"
 AUH_ww1_autonomous_crowns_settlement_1_desc:0 "Pay for one civilian workshop in each autonomous member government; construction stays inside its controlled territory."
 AUH_ww1_autonomous_crowns_settlement_2:0 "Exchange Crownland Technical Standards"
 AUH_ww1_autonomous_crowns_settlement_2_desc:0 "Exchange the common state's current technology with its autonomous member governments."
 AUH_ww1_autonomous_crowns_settlement_3:0 "The Confederate Customs Agreement"
 AUH_ww1_autonomous_crowns_settlement_3_desc:0 "The crownland governments and common council will adopt the same customs and industrial standards."
 AUH_ww1_republican_convention:0 "A Republican Convention"
 AUH_ww1_republican_convention_desc:0 "Choose the constitutional programme and authorise its drafting. Ratification remains a separate step requiring regional consent, civic order and control of the participating crownlands."
 AUH_ww1_republican_convention_institutions:0 "An Elected Constituent Assembly"
 AUH_ww1_republican_convention_institutions_desc:0 "Set out written responsibilities, representation and rights for this constitutional programme. Political effort funds an institutional arrangement rather than an abstract cohesion increase."
 AUH_ww1_republican_convention_services:0 "Civil Control of Common Services"
