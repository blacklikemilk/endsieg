 SO2_treaty_of_tartu: "Sign Treaty of Tartu (Finland)"
 SO2_treaty_of_tartu_desc: "With the Finnish Civil War over we should define the final borders of our countries."
 SO2_send_supplies_HNN: "Aid the Hungarian Soviet Republic"
 SO2_send_supplies_HNN_desc: "The Hungarian Soviet Republic desperately needs our support in any way possible as it is surrounded by enemies."
 SO2_intervene_in_hungary: "Intervene in Hungary"
 SO2_intervene_in_hungary_desc: "In order to intervene in Hungary we must make sure we share a border with Romania and aid the Hungarians in their war against them."
 SO2_puppet_hungarian_sr: "Puppet Soviet Hungary"
 SO2_puppet_hungarian_sr_desc: "The Hungarisn are already dependent on us for their protection, all that is left is to take the final step forward."
 SO2_establish_rumanian_sr: "Establish Rumanian SR"
 SO2_establish_rumanian_sr_desc: "With Rumania defeated and occupied we should spread Communism further and establish a loyalist communist government in the country."
 SO2_send_supplies_FNR: "Aid Red Finland"
 SO2_send_supplies_FNR_desc: "RedFinland desperately needs our support in their losing battle against the numerically superior White Finnish Movement."
 SO2_intervene_finland: "Intervene in Finland"
 SO2_intervene_finland_desc: "Red Finland will never win the war on their own, we must come to their aid if we wish to spread Communism to the Finnish borders."
 SO2_puppet_fnr: "Puppet Red Finland"
 SO2_puppet_fnr_desc: "Red Finland is already dependent on us for their protection and economy it is just one more step forward to do this..."
 SO2_integrate_FNR: "Integrate Red Finland"
 SO2_integrate_FNR_desc: "Finland has been a part of the Russian Empire for a long time in the past and they will become a part of the motherland once again."
 SO2_european_diplomacy: "Diplomacy in Europe"
 SO2_european_diplomacy_desc: ""
 SO2_found_comintern: "Found the Comintern"
 SO2_found_comintern_desc: "Workers of the world unite!"
 SO2_reconquista: "The Reconquista"
 SO2_reconquista_desc: "With the Central Powers defeated in the First World War the Treaty of Brest-Litovsk remains all but a fictional piece of paper, it is time for the reconquista of our formerly ceded lands."
 SO2_westward_offensive: "The Westward Offensive"
 SO2_westward_offensive_desc: "In order to reconquer our old territories we have gathered an army on the Western Front of red guard ready to invade the enemy and reconquer our lands!"

