 WHR_offer_siberian_land: "Offer Japan Territory"
 WHR_offer_siberian_land_desc: "There is no doubt that the Japanese take our civil war as a possible opportunity to seize a good portion of our Siberian territory but they are still skeptical, perhaps if we are to offer a fair chunk of Siberia too them they will join the Civil War fully on our side and help us crush the Bolsheviks, we could deal with the Japanese later..."
 WHR_restore_order: "Restore Order"
 WHR_restore_order_desc: "The nations that have declared their independence which has formerly been part of the Tsars' Empire are nothing but illegimate in their existance, it is our duty to bring them back into the motherland!"
