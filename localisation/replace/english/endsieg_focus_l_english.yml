 WHR_french_greek_desc: ""
 WHR_request_allied_support_1: "Allied Support I"
 WHR_request_allied_support_1_desc: "The Western Allies are willing to support us with uniforms and ammunition for now but if we are to fall out of grace with them we will be just as easily cut off from this free stockpile of supplies."
 WHR_request_allied_support_2: "Allied Support II"
