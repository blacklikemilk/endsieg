 US2_neutrality: "Complete U.S. Neutrality"
 US2_neutrality_desc: "We meant it when we said we are neutral and not getting involved!"
 US2_isolationism: "U.S. Isolationism"
 US2_isolationism_desc: ""
 US2_support_entente: "Support Entente"
 US2_support_entente_desc: "Although we do not wish to get involved in this European conflict the Entente is the good in this war and no matter what we will aid democracy against their fight versus the autocrats. Though the fact Russia is amongst the Entente is quite unsettling for us..."
 US2_condemn_unrestricted_sub: "Condemn Unrestricted Submarine Warfare"
 US2_condemn_unrestricted_sub_desc: "The Germans must not be able to get away with their hostile and inhumane actions of unrestricted submarine warfare, we will not let any more American citizens perish at the hands of u-boots."
 US2_send_munitions_1: "Send Munitions to Entente I"
 US2_send_munitions_1_desc: ""
 US2_send_munitions_2: "Send Munitions to Entente II"
 US2_send_munitions_2_desc: ""
 US2_send_munitions_3: "Send Munitions to Entente III"
 US2_send_munitions_3_desc: ""
 US2_condemn_zimmerman: "Condemn the Zimmerman Telegram"
 US2_condemn_zimmerman_desc: "The Germans are lucky we haven't declared war yet! Their recent actions trying to get Mexico to join them in a war against us is absolutely traitorous! We just can't be left in peace it seems..."
 US2_declare_war_on_germany: "Declare war on Germany"
 US2_declare_war_on_germany_desc: "The time has come for us to declare war on those evil Huns whom seek to establish a new imperialistic order in Europe."
 US2_send_expeditionary_force_france: "Send UEF to France"
 US2_send_expeditionary_force_france_desc: "In order to aid our French allies with badly needed fresh manpower on the front we need to send in the American Expeditionary Force."
 US2_mexican_revolution_actions: "Actions in Mexico"
 US2_mexican_revolution_actions_desc: ""
 US2_send_army_to_border: "Send Army to the Border"
 US2_send_army_to_border_desc: "With the Mexican revolution on-going we will not tolerate any of the fighting over there from spilling into our borders!"
 US2_support_revolution: "Support Maderistas"
 US2_support_revolution_desc: "The Maderistas are democratic and wish to restore the true results of the recent elections in Mexico, we for one welcome such a government."
 US2_intervention_in_mexico: "Intervene on the sideof Maderistas"
 US2_intervention_in_mexico_desc: "The Maderistas are democratic and wish to restore the true results of the recent elections in Mexico, we for one welcoem such a government and are willing to put up a quick fight to bring down Diaz."
 US2_fortify_border: "Fortify Mexican-American Border"
 US2_fortify_border_desc: "With the revolution spilling over into our borders at time and some of the revolutionaries calling for a war with us it would be a wise idea to fortify our border with Mexico."
 US2_withdraw_from_veracruz: "Withdraw from Veracruz"
 US2_withdraw_from_veracruz_desc: "It is time to withdraw from Veracruz, we wouldn't want to upset the Mexican Revolutionaries any more than we already have."
 US2_condemn_huerta: "Condemn Huerta"
 US2_condemn_huerta_desc: "Huerta is an exact copy of his previous counterpart Diaz, he is nothing but a brutal dictator that must be laid to rest where he belongs in hell!"
 US2_back_revolutionaries_2: "Back Revolutionaries against Huerta"
 US2_back_revolutionaries_2_desc: "With the rise of the Constitutionalistas and Villistas against Huerta we can support the end of the Huerta regime through silent means."
 US2_condemn_villa: "Condemn Villa"
 US2_condemn_villa_desc: "Villa was an ally of ours in the past but now he has turned into a menace and a menace that must be eliminated!"
