 GE1_N_coastal_defence:0 "Jade and Heligoland Defence"
 GE1_N_coastal_defence_desc:0 "The Kaiserliche Marine centres its programme on jade and heligoland defence. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_repair_docks:0 "Wilhelmshaven Repair Basin"
 GE1_N_repair_docks_desc:0 "The Kaiserliche Marine centres its programme on the Wilhelmshaven repair basin. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_merchant_protection:0 "Merchant Route Bureau"
 GE1_N_merchant_protection_desc:0 "The Kaiserliche Marine centres its programme on merchant route bureau. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_naval_morale:0 "Fleet Training and Damage Control"
 GE1_N_naval_morale_desc:0 "The yards and merchant-route staff will support whichever operational programme the navy has chosen. Gunnery lessons or submarine patrol experience will inform the final training cycle."
 GE1_N_u_boat_production:0 "U-Boot Construction Office"
 GE1_N_u_boat_production_desc:0 "The Kaiserliche Marine centres its programme on u-boot construction office. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_torpedo_school:0 "Torpedo School at Kiel"
 GE1_N_torpedo_school_desc:0 "The Kaiserliche Marine centres its programme on torpedo school at kiel. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_prize_rules:0 "Prize Rules and Admiralty Law"
 GE1_N_prize_rules_desc:0 "The Kaiserliche Marine centres its programme on prize rules and admiralty law. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_convoy_interdiction:0 "North Sea Commerce Patrols"
 GE1_N_convoy_interdiction_desc:0 "The Kaiserliche Marine centres its programme on north sea commerce patrols. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_commerce_focus:0 "Commit to the Commerce War"
 GE1_N_commerce_focus_desc:0 "The navy will concentrate its specialist instruction on submarine patrols and attacks on merchant shipping. This commitment takes priority over the expansion of the battle fleet."
 GE1_P_imperial_constitution:0 "The Wilhelmine Reich"
 GE1_P_imperial_constitution_desc:0 "The Reich is prosperous, armed and divided. Wilhelm rules beside an elected Reichstag, a Prussian monarchy and federal princes whose powers overlap without answering the same electorate. We must decide which of these institutions will lead Germany into the new century."
 GE1_P_reichstag_budget_committee:0 "The Reichstag Budget"
 GE1_P_reichstag_budget_committee_desc:0 "The army, the navy and the state secretaries all demand funds. Parliamentary budget committees can bring the bills into a single negotiation, but the deputies expect a voice in return for their votes."
 GE1_P_prussian_franchise:0 "Defend the Three-Class Franchise"
 GE1_P_prussian_franchise_desc:0 "The Reichstag already rests on universal male suffrage; Prussia does not. Landowners and the conservative establishment insist that the three-class franchise protects the crown from parliamentary government. Preserving it will close the route to an early democratic settlement."
 GE1_P_universal_reichstag_franchise:0 "Equal Suffrage in Prussia"
 GE1_P_universal_reichstag_franchise_desc:0 "Prussian electors vote in unequal tax classes even as they cast equal ballots for the Reichstag. Liberal and Social Democratic deputies demand that the largest German state accept the same principle. A genuine reform will cost royal influence and open a constitutional alternative."
 GE1_P_centre_balance:0 "A Centre-Liberal Understanding"
 GE1_P_centre_balance_desc:0 "The Centre Party, National Liberals and progressive deputies share neither creed nor every policy. They can nevertheless establish a parliamentary majority for practical reforms and prevent the crown from playing one group against another."
 GE1_P_spd_mandate:0 "Recognise the Social Democratic Mandate"
 GE1_P_spd_mandate_desc:0 "Social Democracy has become a mass party rooted in factories, unions and working-class associations. Recognising its electoral mandate opens negotiations over labour rights; refusing the party a place in government leaves reform dependent on the old establishment."
 GE1_P_cross_class_burgfrieden:0 "The Burgfrieden"
 GE1_P_cross_class_burgfrieden_desc:0 "With war at the frontiers, deputies and trade unions suspend their bitter domestic struggle. The truce brings a brief unity; it does not resolve the questions of suffrage, war aims or who must bear the losses."
 GE1_P_war_credit_discipline:0 "Parliamentary Accounts for War Spending"
 GE1_P_war_credit_discipline_desc:0 "Emergency appropriations are not a blank cheque. A continuing audit of contracts, transport and army requisitions can restrain waste and give deputies an informed voice in the next request for funds."
 GE1_P_civilian_chancellery:0 "Keep the Generals out of Government"
 GE1_P_civilian_chancellery_desc:0 "Military commanders advise on what the front requires. Civilian ministers must decide what the nation can bear. Defending this boundary prevents operational authority from becoming a substitute constitution."
 GE1_P_ohl_partnership:0 "The Third Supreme Army Command"
 GE1_P_ohl_partnership_desc:0 "Hindenburg and Ludendorff promise an energetic solution to a war that has consumed the resources of the Reich. Granting them a dominant role may accelerate mobilisation, but civilian control will become far harder to recover."
 GE1_P_press_bureau:0 "The Imperial Press Bureau"
 GE1_P_press_bureau_desc:0 "Reports from the front shape expectations at home. A central press bureau can explain losses and objectives, but censorship risks turning reassurance into a promise that the army cannot keep."
 GE1_P_war_finance_office:0 "Coordinate the War Treasury"
 GE1_P_war_finance_office_desc:0 "War loans carry the promise that victory will pay the bill. Taxes demand sacrifices now. The finance office must choose how to spread these burdens before confidence in the currency and the state begins to fail."
 GE1_P_food_supply_administration:0 "Municipal Provisioning Offices"
 GE1_P_food_supply_administration_desc:0 "Urban households face uneven prices and shrinking supplies. Municipal provisioning offices can coordinate distribution and prevent the army from solving its own needs at the expense of every civilian market."
 GE1_P_1917_peace_resolution:0 "The Reichstag Peace Resolution"
 GE1_P_1917_peace_resolution_desc:0 "A parliamentary majority calls for peace without forced annexations or punitive indemnities. The resolution will give diplomats a mandate; it cannot make enemy governments forget the occupation of their territory."
 GE1_P_easter_message:0 "Make Good the Easter Promise"
 GE1_P_easter_message_desc:0 "Wilhelm has promised that Prussia will reconsider its electoral order after the war. Acting now could win trust that another postponement would squander, though the conservative establishment will resist losing its decisive influence."
 GE1_P_bundesrat_reform:0 "Negotiate with the Bundesrat"
 GE1_P_bundesrat_reform_desc:0 "A constitutional settlement requires the assent of the federal states as well as the Reichstag. The government must reassure the princes that responsible ministers need not erase the federal Reich."
 GE1_P_october_reforms:0 "The October Reforms"
 GE1_P_october_reforms_desc:0 "The authority to choose ministers and approve the course of the war must finally rest on the confidence of parliament. Reform comes amid military crisis; it must be substantial enough to survive the men who reluctantly concede it."
 GE1_P_crown_and_parliament:0 "The Crown within the Constitution"
 GE1_P_crown_and_parliament_desc:0 "If the emperor accepts the new limits, the monarchy can remain as head of a parliamentary state. The army and civil administration must understand that responsible ministers now set national policy."
 GE1_P_responsible_cabinet:0 "A Cabinet with Parliamentary Confidence"
 GE1_P_responsible_cabinet_desc:0 "Ministers must be able to rely on a majority and be removed by it. The new rules replace personal access to the sovereign with a government that can explain its decisions publicly."
 GE1_P_veterans_demobilisation:0 "Prepare an Orderly Demobilisation"
 GE1_P_veterans_demobilisation_desc:0 "Millions of soldiers will need employment, transport and a place in civilian life when the guns fall silent. Planning their return protects the state from leaving exhausted veterans to solve these problems alone."
 GE1_P_armistice_government:0 "The Armistice Cabinet"
 GE1_P_armistice_government_desc:0 "The armistice brings urgent duties: maintain civil order, feed the cities and negotiate a settlement the country can carry out. This cabinet prepares those duties without replacing the peace process itself."
 GE1_D_foreign_office_reform:0 "The Auswaertiges Amt"
 GE1_D_foreign_office_reform_desc:0 "Germany can pursue security through an entrenched continental alliance, an understanding with Britain, or renewed accommodation in the east. The Foreign Office must turn the ambitions of a world power into a policy that its partners will actually accept."
 GE1_D_commercial_attaches:0 "Commercial Diplomacy"
 GE1_D_commercial_attaches_desc:0 "Industrial exporters and banks already reach beyond the military alliances. Commercial attaches can use these connections to open negotiations without making every trade dispute a test of national prestige."
 GE1_D_mitteleuropa_tariff_board:0 "The Mitteleuropa Customs Board"
 GE1_D_mitteleuropa_tariff_board_desc:0 "Germany seeks a continental economic association around common tariffs and railway access. It can bind partners through commerce, but its legitimacy will depend on whether they see a shared market or a permanent subordinate position."
 GE1_D_haldane_mission:0 "Receive the Haldane Mission"
 GE1_D_haldane_mission_desc:0 "Britain fears the growth of our battle fleet; Germany fears a hostile British intervention in a continental war. Naval conversations offer a narrow opportunity to test whether these concerns can be reconciled through concessions."
 GE1_D_limit_naval_rivalry:0 "A Naval Convention with Britain"
 GE1_D_limit_naval_rivalry_desc:0 "Germany will offer Britain a definite limit to the naval competition: six German combat ships for every ten in the Royal Navy. Acceptance will require us to honour that ratio. Choosing this course excludes a renewed commitment to the Dual Alliance."
 GE1_D_anglo_german_commerce:0 "Anglo-German Commercial Ties"
 GE1_D_anglo_german_commerce_desc:0 "Banks, merchants and shipping firms will prepare commercial articles for the proposed British coalition. Ratification will give these arrangements a dependable political foundation and bring the trade benefits into effect."
 GE1_D_vienna_consultation:0 "The Alliance with Vienna"
 GE1_D_vienna_consultation_desc:0 "Austria-Hungary remains our indispensable ally and a state with crises of its own. Direct consultation can establish what Berlin will support before a Balkan confrontation obliges both governments to improvise."
 GE1_D_support_austria:0 "Keep Faith with the Dual Monarchy"
 GE1_D_support_austria_desc:0 "The Dual Alliance remains the foundation of our continental security. Reaffirming it commits Berlin to Vienna and rules out an exclusive coalition with Britain or Russia."
 GE1_D_restrain_balkans:0 "Restrain the Balkan Crisis"
 GE1_D_restrain_balkans_desc:0 "An ally need not endorse every escalation. We can press Vienna to pursue a limited settlement in the Balkans, accepting the strain on the alliance in exchange for a chance to prevent a wider war."
 GE1_D_serbian_settlement:0 "A Limited Settlement with Serbia"
 GE1_D_serbian_settlement_desc:0 "A settlement that addresses the immediate dispute without destroying Serbia would give all sides a way to step back. Berlin can support mediation, but Serbia and Austria-Hungary retain their own decisions."
 GE1_D_bulgaria_coordination:0 "Negotiate with Bulgaria"
 GE1_D_bulgaria_coordination_desc:0 "Bulgaria seeks to reverse the losses of the Balkan Wars. Military cooperation must be tied to a negotiated coalition programme that Sofia considers worth the risks of intervention."
 GE1_D_ottoman_economic_mission:0 "The Baghdad Railway Partnership"
 GE1_D_ottoman_economic_mission_desc:0 "German finance and Ottoman sovereignty meet along the Baghdad Railway. Investment offers access and influence, but the partnership will last only if Constantinople regards it as strengthening the empire rather than selling it."
 GE1_D_ottoman_military_convention:0 "The Ottoman Military Mission"
 GE1_D_ottoman_military_convention_desc:0 "German officers can support training and staff work while the Ottoman army rebuilds after the Balkan Wars. The mission must serve a partner government, not treat the army as a German colonial formation."
 GE1_D_persian_transit:0 "Diplomatic Access through Persia"
 GE1_D_persian_transit_desc:0 "Our representatives will ask Persia to permit the movement of German troops and supplies along agreed routes. The Persian government must decide whether those arrangements can be reconciled with its sovereignty and foreign commitments."
 GE1_D_colonial_settlement:0 "The Imperial Colonial Office"
 GE1_D_colonial_settlement_desc:0 "The colonial office governs scattered possessions with limited resources and uncertain connections to the Reich. A coherent policy must distinguish what can be developed from what can actually be defended in a European war."
 GE1_D_dutch_neutral_trade:0 "The Dutch Neutral Corridor"
 GE1_D_dutch_neutral_trade_desc:0 "Dutch merchants remain valuable intermediaries as the European crisis hardens. A trade arrangement can preserve limited access to neutral markets, provided our naval conduct does not make that neutrality impossible."
 GE1_D_scandinavian_shipping:0 "Scandinavian Shipping Agreements"
 GE1_D_scandinavian_shipping_desc:0 "Scandinavian shipping and ore remain important to German industry. Negotiated cargo arrangements support trade under neutral flags without granting a right to drag those governments into our war."
 GE1_D_italian_neutrality_terms:0 "Keep Italy from the Entente"
 GE1_D_italian_neutrality_terms_desc:0 "Italy questions the value of an alliance that binds it to Vienna while leaving its territorial demands unresolved. Diplomatic terms can encourage neutrality; they cannot turn an Italian decision into a German command."
 GE1_D_greek_neutrality:0 "Greek Channels"
 GE1_D_greek_neutrality_desc:0 "The Greek court, government and army do not agree on intervention. Maintaining channels in Athens can preserve influence without assuming that a royal friendship controls the whole country."
 GE1_D_albanian_guarantees:0 "Support Albanian Independence"
 GE1_D_albanian_guarantees_desc:0 "A recognised Albania can limit the competition of larger Balkan powers. Our support concerns its independence and security; it does not confer a German right to move its borders at will."
 GE1_D_polish_regency_framework:0 "The Polish Regency Question"
 GE1_D_polish_regency_framework_desc:0 "Occupied Poland raises a difficult choice between a buffer kingdom, Austrian ambitions and German security demands. A regency framework prepares a client state without pretending that military occupation has created popular consent."
 GE1_D_lithuanian_administration:0 "A Lithuanian Council"
 GE1_D_lithuanian_administration_desc:0 "Civil administration in Lithuania must distinguish local representation from the needs of the occupying army. Supporting an organised council provides a partner for the eastern settlement without assigning new borders by decree."
 GE1_D_ukrainian_grain_compact:0 "The Ukrainian Grain Agreement"
 GE1_D_ukrainian_grain_compact_desc:0 "Our purchasing mission will offer railway and supply equipment in return for dependable Ukrainian grain deliveries. Ukraine must weigh the proposal against its own needs before the agreement can take effect."
 GE1_D_eastern_peace_framework:0 "Negotiate the Eastern Settlement"
 GE1_D_eastern_peace_framework_desc:0 "Military success must become a negotiated settlement if divisions are to return west. Our diplomats prepare agreements over sovereignty, economic access and the administration of the occupied east while the armies still guard the lines of contact."
 GE1_D_american_commercial_outreach:0 "Maintain the American Connection"
 GE1_D_american_commercial_outreach_desc:0 "American commerce and public opinion matter even when Washington remains outside the European war. The Foreign Office must explain German policy through diplomatic channels before naval incidents determine it for us."
 GE1_D_submarine_warning_policy:0 "Respect the Prize Rules"
 GE1_D_submarine_warning_policy_desc:0 "Warning, search and provision for crews constrain submarine operations. Accepting these limits may preserve neutral relations at the cost of raiding efficiency, and excludes a deliberate unrestricted campaign."
 GE1_D_diplomatic_pressure_washington:0 "A Maritime Note to Washington"
 GE1_D_diplomatic_pressure_washington_desc:0 "The Foreign Office sets out the terms of German maritime policy and asks Washington to apply the same concern to restrictions imposed by our enemies. Diplomatic argument must be supported by the conduct of our own commanders."
 GE1_D_mexican_reply:0 "The Mexican Reply"
 GE1_D_mexican_reply_desc:0 "Mexico must decide whether it can accept the limited cooperation Germany is able to offer across the Atlantic. The reply will determine whether our missions exchange military assistance or close the proposal without an agreement."
 GE1_D_1917_peace_note:0 "A General Peace Offer"
 GE1_D_1917_peace_note_desc:0 "A peace offer must say what Germany is prepared to give up, not merely invite its enemies to endorse our gains. Neutral diplomats can test whether negotiations are possible before another campaign consumes the reserves on both sides."
 GE1_D_neutral_mediation:0 "Invite Neutral Mediation"
 GE1_D_neutral_mediation_desc:0 "Neutral diplomats can carry proposals between governments that no longer trust direct assurances. Mediation gives the home government a channel to test compromise without forcing a peace that the belligerents have not accepted."
 GE1_D_belgian_neutrality_guarantee:0 "Prepare the Belgian Protocol"
 GE1_D_belgian_neutrality_guarantee_desc:0 "Our representatives will prepare the articles under which Germany would respect and guarantee Belgian neutrality. The protocol will accompany the proposed British coalition and enter into force only when London accepts that agreement."
 GE1_D_anglo_german_alliance:0 "The Anglo-German Alliance"
 GE1_D_anglo_german_alliance_desc:0 "The naval convention and the proposed Belgian protocol offer Britain a basis for a formal coalition. If London accepts, the guarantee becomes binding and the British partnership replaces our Austrian alignment."
 RUS_steel_commission:0 "Ural Mining Commission"
 RUS_steel_commission_desc:0 "A commission surveys the iron seams around Nizhny Tagil, Zlatoust, and Perm for a reliable imperial steel reserve. Its maps tie miners, railways, and artillery contracts into one controlled chain."
 RUS_dnieper_foundries:0 "Yuzovka Furnace Programme"
 RUS_dnieper_foundries_desc:0 "Donbas metallurgists at Yuzovka enlarge blast furnaces and coke batteries for the army's shell appetite. The hot metal is close to the railways, yet every furnace depends on a fragile coal timetable."
 RUS_moscow_machineworks:0 "Moscow Machine Tool Cooperative"
 RUS_moscow_machineworks_desc:0 "Moscow machine shops pool lathes and drawings under an Imperial Technical Society committee. Shared tooling lets small firms copy urgent parts without erasing their specialist civilian trades."
 RUS_ural_metallurgy:0 "Perm and Zlatoust Metallurgy"
 RUS_ural_metallurgy_desc:0 "Perm and Zlatoust works receive orders for alloy steel, gun tubes, and springs suited to Russian winters. The expansion gives the Urals a military future while consuming transport capacity needed by Siberian grain."
 RUS_caucasus_oil_refineries:0 "Nobel Baku Refinery Board"
 RUS_caucasus_oil_refineries_desc:0 "The Baku refinery and transport programme will bring more of the existing petroleum supply into production. Investment adds oil resources in the Baku state only while it remains securely under our government."
 RUS_rural_electrification:0 "Zemstvo Dynamo Stations"
 RUS_rural_electrification_desc:0 "Zemstvo councils install small dynamos beside mills, hospitals, and repair shops in the central provinces. The current is modest, but it lengthens the working day without demanding a new national grid."
 RUS_volga_power_grid:0 "Samara-Saratov Power Link"
 RUS_volga_power_grid_desc:0 "Engineers connect the workshops of Samara and Saratov with a chain of local generators and protected cables. Volga industry gains dependable light while fuel trains are diverted to feed the stations."
 RUS_moscow_power_grid:0 "Moscow Tramway Generators"
 RUS_moscow_power_grid_desc:0 "Moscow tramway engineers adapt their generating plant to feed machine shops after dark. The capital's factories run longer, and the city must ration electricity to keep military orders moving."
 RUS_siberian_power_stations:0 "Tomsk and Novonikolaevsk Stations"
 RUS_siberian_power_stations_desc:0 "New power stations rise near Tomsk and Novonikolaevsk to service the distant railway workshops. Siberia gains the beginnings of an industrial belt, but imported copper remains painfully scarce."
 RUS_railway_rolling_stock:0 "Kolomna Freight Car Standard"
 RUS_railway_rolling_stock_desc:0 "Kolomna and Bryansk builders agree on a common freight wagon frame that can be repaired anywhere on the state network. Standard axles simplify mobilisation, although private carriers surrender their favourite designs."
 RUS_western_rail_corridors:0 "Warsaw-Vilna Military Sidings"
 RUS_western_rail_corridors_desc:0 "The Warsaw-Vilna corridor receives sidings, water points, and guarded repair sheds for the western armies. Its capacity helps Alexeyev move reserves, but makes the frontier railway a prime enemy target."
 RUS_ural_freight_corridors:0 "Orenburg Ural Freight Line"
 RUS_ural_freight_corridors_desc:0 "A reinforced line through Orenburg ties Ural metal to the Volga magazines and the army depots beyond them. Freight becomes predictable at the cost of crowding civilian grain and passenger service."
 RUS_siberian_freight_corridors:0 "Trans-Siberian Depot Chain"
 RUS_siberian_freight_corridors_desc:0 "Depot officers mark coal, fodder, and spare parts at every major Trans-Siberian station. The chain gives the Empire depth, though a single bridge failure can still strand an entire train column."
 RUS_cement_standardization:0 "Novorossiysk Cement Standards"
 RUS_cement_standardization_desc:0 "Engineers at Novorossiysk set a common cement mix for barracks, depots, and gun emplacements. Uniform batches shorten construction time, while Black Sea shipping competes with grain exports for the same holds."
 RUS_public_works_bureau:0 "Imperial Public Works Bureau"
 RUS_public_works_bureau_desc:0 "A new bureau brings zemstvo surveyors and military engineers under one schedule for roads, depots, and hospitals. It promises order across the provinces, but local councils give up some control of their own works."
 RUS_state_credit_bank:0 "State Bank War Credits"
 RUS_state_credit_bank_desc:0 "The State Bank extends controlled credit to factories that can show a delivery date and a responsible director. Finance reaches the workshops faster, while the treasury assumes a larger wartime burden."
 RUS_factory_accounting:0 "War Ministry Factory Accounts"
 RUS_factory_accounting_desc:0 "War Ministry inspectors introduce cost books that follow a shell from raw steel to the artillery park. The figures expose waste and fraud, though managers resent the inspectors who now share their floor."
 RUS_workers_technical_schools:0 "Imperial Technical School Courses"
 RUS_workers_technical_schools_desc:0 "The Imperial Moscow Technical School opens accelerated courses for fitters, draughtsmen, and foremen. Students leave with practical drawings in hand, and factories must release their most promising apprentices to teach them."
 RUS_merchant_fleet_contracts:0 "Russian-American Line Contracts"
 RUS_merchant_fleet_contracts_desc:0 "Merchant contracts will commission additional ships for the routes serving our national industry. Ten convoys will expand the shipping available for commercial deliveries."
 RUS_artillery_arsenals:0 "Perm and Petrograd Arsenal Chain"
 RUS_artillery_arsenals_desc:0 "Perm, Petrograd, and Kiev arsenals divide the work of forging, rifling, and finishing field pieces. Their chain reduces bottlenecks and leaves each arsenal dependent on the others' railway deliveries."
 RUS_small_arms_standardization:0 "Tula Mosin Gauges"
 RUS_small_arms_standardization_desc:0 "Tula armourers publish gauges for the three-line Mosin rifle and its bayonet fittings. Interchangeable parts help reserve units, while private gunsmiths must discard familiar but nonstandard tools."
 RUS_shell_filling_plants:0 "Putilov Shell-Filling Shops"
 RUS_shell_filling_plants_desc:0 "Putilov's shell-filling shops expand under strict safety rules and military supervision. Output rises for the three-inch guns, while every accident threatens the city's already thin supply of trained chemists."
 RUS_optical_instruments:0 "Petrograd Optical Workshop"
 RUS_optical_instruments_desc:0 "Opticians in Petrograd assemble rangefinders, sights, and periscopes around imported glass. The army receives clearer fire control, but the workshop's instruments are too delicate for careless depot handling."
 RUS_chemical_industry:0 "Russian Chemical Society Laboratories"
 RUS_chemical_industry_desc:0 "The Russian Chemical Society coordinates laboratories in Moscow, Kazan, and Petrograd to make acids, dyes, and propellants. Domestic chemistry gains independence, while the same knowledge raises the spectre of gas warfare."
 RUS_railway_mobilization:0 "Alexeyev's Railway Timetable"
 RUS_railway_mobilization_desc:0 "Alexeyev's staff turns the railway timetable into a mobilisation plan with named trains and reserve crews. Reinforcements arrive with less confusion, but the schedule leaves little tolerance for weather or sabotage."
 RUS_urals_reserve_factories:0 "Evacuate Workshops to the Urals"
 RUS_urals_reserve_factories_desc:0 "Planners mark Perm, Ekaterinburg, and Chelyabinsk as reserve sites for machinery moved away from the front. The east gains new workshops, though dismantling a plant delays production before the move is complete."
 RUS_eastern_industry_survey:0 "Siberian Industrial Survey"
 RUS_eastern_industry_survey_desc:0 "Surveyors catalogue timber, coal, and repair capacity from Tomsk to Vladivostok. Their report turns Siberia into a measurable reserve instead of a blank space on the ministry map."
 RUS_state_arsenal_network:0 "Unified Imperial Arsenal Board"
 RUS_state_arsenal_network_desc:0 "The War Ministry places the principal arsenals under one board with common drawings and delivery rules. Central control reduces duplication, but local directors lose the freedom to improvise for their own fronts."
 RUS_russian_aviation_industry:0 "Duks Aircraft Works"
 RUS_russian_aviation_industry_desc:0 "Duks in Moscow expands its aircraft line beside the workshops building bicycles and engines. The factory can copy foreign designs quickly, yet imported magnetos and instruments still set the pace."
 RUS_industrial_research_bureau:0 "Moscow Technical Research Bureau"
 RUS_industrial_research_bureau_desc:0 "Professors and factory engineers form a bureau to test steels, fuels, and fuzes in controlled trials. The Empire gains a bridge between laboratory and shop floor, provided the ministries share their failures as well as successes."
 RUS_production_reserves:0 "Stavka Material Reserves"
 RUS_production_reserves_desc:0 "Stavka orders reserves of boots, cartridges, wire, and spare gun parts at depots behind the front. The stockpile blunts a sudden crisis, while warehouses consume rail capacity and guarded space."
 RUS_total_war_ledger:0 "The Stavka Total War Ledger"
 RUS_total_war_ledger_desc:0 "The Stavka merges army, fleet, and factory returns into one ledger for the coming campaigns. Russia can now see the full price of endurance, and every ministry must defend its claim before the throne."
 RUS_officer_academy:0 "Reopen the Nicholas General Staff Academy"
 RUS_officer_academy_desc:0 "The Nicholas General Staff Academy resumes accelerated courses for officers who have learned war in the field. Its graduates bring maps and staff habits back to divisions that previously relied on personal authority."
 RUS_general_staff_reform:0 "Unify Stavka Reporting"
 RUS_general_staff_reform_desc:0 "Stavka adopts common reports for strength, ammunition, and rail movement from Riga to the Caucasus. Reliable figures improve decisions, although commanders lose the shelter of vague telegrams."
 RUS_staff_maps:0 "Military Topographic Corps"
 RUS_staff_maps_desc:0 "The Military Topographic Corps redraws Galicia and the Carpathian approaches with surveyed contours and usable roads. Accurate maps make artillery possible in bad weather, but survey teams work within rifle range."
 RUS_reserve_officer_corps:0 "Reserve Officer Training Battalions"
 RUS_reserve_officer_corps_desc:0 "Training battalions turn teachers, clerks, and former cadets into reserve officers for the next call-up. The Empire gains leaders in quantity, while veterans must spend time teaching men who have never seen a trench."
 RUS_infantry_regulations:0 "Field Service Regulations of 1915"
 RUS_infantry_regulations_desc:0 "The War Ministry rewrites infantry regulations around dispersed formations, machine guns, and shell fire. Soldiers gain clearer drills for survival, though the new book cannot substitute for experienced NCOs."
 RUS_mosin_standardization:0 "Izhevsk Receiver Gauges"
 RUS_mosin_standardization_desc:0 "Izhevsk armourers standardise receiver gauges and bolt parts for the Mosin-Nagant line. A rifle can return to service sooner, provided the railways deliver gauges and steel to every repair shop."
 RUS_maxim_gun_program:0 "Vickers-Maxim Water Jackets"
 RUS_maxim_gun_program_desc:0 "Russian contracts copy the Vickers-Maxim water jacket and mount for harsh field service. Sustained fire becomes practical in defence, while the extra weight slows batteries and pack trains."
 RUS_mobilization_tables:0 "Mobilisation Tables for the Reserves"
 RUS_mobilization_tables_desc:0 "Clerks prepare tables that assign each reserve class to a depot, train, and division before the summons goes out. The plan saves days during a crisis, but it exposes every railway bottleneck in advance."
 RUS_field_artillery_school:0 "Brusilov's Artillery Liaison"
 RUS_field_artillery_school_desc:0 "Artillery officers attach themselves to Brusilov's assault staffs and learn to answer infantry requests by map and telephone. The partnership shortens the gap between a call for fire and the first rounds."
 RUS_heavy_howitzers:0 "Schneider Howitzers in the Park"
 RUS_heavy_howitzers_desc:0 "Captured and imported Schneider howitzers are catalogued beside Russian heavy pieces for siege work. Their range threatens enemy works, but foreign shells and spare parts make every battery a logistical gamble."
 RUS_counterbattery_observers:0 "Forward Artillery Observers"
 RUS_counterbattery_observers_desc:0 "Selected lieutenants climb church towers and observation balloons to direct counterbattery fire. Their reports protect the infantry, though the enemy soon learns which silhouettes to search for."
 RUS_railgun_batteries:0 "Railway Gun Detachments"
 RUS_railgun_batteries_desc:0 "Naval guns mounted on railway carriages cover junctions and fortresses from prepared tracks. Their reach is formidable, but they cannot move until engineers secure the line and bridges."
 RUS_deep_battle_exercises:0 "Maneuver Army Exercises"
 RUS_deep_battle_exercises_desc:0 "Field armies rehearse attacks that pass through the first trench and strike the roads behind it. The exercises reward initiative, yet they consume ammunition and reveal plans before war makes them necessary."
 RUS_infiltration_sections:0 "Assault Sections with Grenades"
 RUS_infiltration_sections_desc:0 "Small assault sections receive grenades, wire cutters, and storming drills for the first minutes after a barrage. They open breaches for the line, but every section is hard to replace once lost."
 RUS_combined_arms_staff:0 "Staffs for Infantry and Guns"
 RUS_combined_arms_staff_desc:0 "Division staffs seat infantry, artillery, engineers, and aircraft officers at the same map table. Cooperation improves an attack's timing, while senior commanders surrender some freedom to separate branch traditions."
 RUS_cavalry_screen:0 "Cavalry Screens on the Frontier"
 RUS_cavalry_screen_desc:0 "Cavalry screens patrol the open ground beyond the Dvina and the Galician roads. They warn the army of movement early, but horses and fodder disappear rapidly in a long campaign."
 RUS_cossack_reforms:0 "Reform the Don and Kuban Hosts"
 RUS_cossack_reforms_desc:0 "The Don and Kuban hosts receive clearer mobilisation rolls and modern carbines without losing their local command customs. Cossacks scout with confidence, while the War Ministry must negotiate every reform."
 RUS_cavalry_artillery:0 "Horse Artillery Batteries"
 RUS_cavalry_artillery_desc:0 "Horse artillery trains practise limbering, firing, and moving with Cossack patrols. Fast guns support a screen in open country, though their teams need the best remounts available."
 RUS_armored_cars:0 "Austin Armoured Car Detachments"
 RUS_armored_cars_desc:0 "British Austin armoured cars arrive through northern ports and form detachments for rail security and reconnaissance. Their machine guns dominate roads, but damaged engines cannot be replaced locally."
 RUS_armored_car_doctrine:0 "Armoured Car Raids"
 RUS_armored_car_doctrine_desc:0 "Commanders pair armoured cars with cavalry to seize crossings and cut telegraph lines. The raids reward speed and surprise, but mud and shell craters can turn a motor column into a trap."
 RUS_tractor_columns:0 "Putilov Tractor Columns"
 RUS_tractor_columns_desc:0 "Putilov tractors haul guns and supplies where horse teams fail in the spring thaw. Mechanisation promises heavier fire, while fuel and mechanics become new dependencies for every battery."
 RUS_motor_transport:0 "Moscow Motor Transport School"
 RUS_motor_transport_desc:0 "A motor school in Moscow trains drivers to maintain lorries, tractors, and armoured cars under field conditions. The army moves faster on good roads, but each vehicle consumes imported petrol and rubber."
 RUS_engineer_corps:0 "Expand the Sapper Corps"
 RUS_engineer_corps_desc:0 "Sapper units receive formal ranks for bridging, demolition, fortification, and road repair. Their skills protect the army's movement, though every assignment keeps a trained man away from the rifle line."
 RUS_sapper_bridges:0 "Dnieper Pontoon Trains"
 RUS_sapper_bridges_desc:0 "Pontoon trains practise crossings on the Dnieper and the Vistula with boats, cables, and prefabricated trestles. Engineers restore mobility across rivers, but the train itself becomes a tempting target."
 RUS_fortress_engineers:0 "Modernise the Brest Works"
 RUS_fortress_engineers_desc:0 "Fortress engineers strengthen Brest-Litovsk with concrete shelters, communications trenches, and controlled demolitions. The works delay an assault, while their fixed labour cannot follow a retreating field army."
 RUS_communications_corps:0 "Signals Corps of the Fronts"
 RUS_communications_corps_desc:0 "A dedicated signals corps lays telephone, telegraph, and lamp links between Stavka and the trenches. Orders travel more clearly, but wires remain exposed to shellfire and soaked ground."
 RUS_field_telephones:0 "Indestructible Field Telephone Sets"
 RUS_field_telephones_desc:0 "Signal workshops seal telephone sets against mud and cold for use in forward dugouts. A working handset can save a battery, yet copper wire remains the scarce part."
 RUS_medical_service:0 "Front Medical Detachments"
 RUS_medical_service_desc:0 "Medical detachments organise dressing stations behind the trench line and teach stretcher bearers to work under fire. More wounded survive evacuation, while surgeons and nurses face exhaustion without relief."
 RUS_field_hospitals:0 "Evacuation Hospitals at Minsk"
 RUS_field_hospitals_desc:0 "Hospitals at Minsk and Baranovichi become rail-linked centres for surgery, infection control, and recovery. The system returns veterans to service, though every hospital train competes with ammunition for track space."
 RUS_mobilization_stockpiles:0 "Reserve Boots and Ammunition"
 RUS_mobilization_stockpiles_desc:0 "Quartermasters seal reserve boots, cartridges, wire, and greatcoats in depots before the next mobilisation. Divisions start with fewer shortages, but warehouses demand guards, railcars, and dry storage."
 RUS_regimental_artillery:0 "Regimental Guns for the Infantry"
 RUS_regimental_artillery_desc:0 "Regimental batteries place light guns close enough to answer an infantry commander without waiting for corps headquarters. The arrangement gives assaults immediate weight, while ammunition columns multiply."
 RUS_army_aviation_coordination:0 "Aviation Liaison Officers"
 RUS_army_aviation_coordination_desc:0 "Every corps appoints an aviation liaison to turn Russian pilot sketches into artillery targets and road reports. The army finally sees above its own trenches, but radios and maps still limit the conversation."
 RUS_machine_gun_tactics:0 "Maxim Crossfire Schools"
 RUS_machine_gun_tactics_desc:0 "Machine-gun instructors build interlocking fires around villages, redoubts, and wire gaps. The crossfire holds ground with fewer rifles, although it makes ammunition discipline a matter of survival."
 RUS_air_observation_service:0 "Aeronautical Observation Corps"
 RUS_air_observation_service_desc:0 "The observation corps assigns trained photographers and map readers to every major army. Their plates reveal trenches and roads that cavalry scouts cannot see, but glass plates and darkrooms must follow the front."
 RUS_airship_reconnaissance:0 "Volga Airship Patrols"
 RUS_airship_reconnaissance_desc:0 "Airship crews patrol the Volga approaches and report railway movement from above. Their endurance suits wide spaces, though hydrogen, storms, and enemy aircraft make the patrols hazardous."
 RUS_radio_navigation:0 "Ulyanin Radio Stations"
 RUS_radio_navigation_desc:0 "Sergey Ulyanin's radio specialists install transmitters and direction-finding sets at selected airfields. Pilots can find a station through cloud, but operators and batteries are harder to replace than the aerials."
 RUS_naval_aviation:0 "Grigorovich Naval Aircraft"
 RUS_naval_aviation_desc:0 "Grigorovich's naval aircraft scout the Baltic and Black Sea approaches from improvised coastal stations. The fleet gains eyes beyond the harbour, while salt water shortens the life of every engine."
 RUS_engine_plant_aircraft:0 "Duks and Gnome Engine Shops"
 RUS_engine_plant_aircraft_desc:0 "Duks workers rebuild Gnome and RhÃƒÂ´ne engines beside Russian-made components and copied drawings. Domestic repair stretches the flying season, but each unfamiliar alloy risks a new failure."
 RUS_dreadnought_desc:0 "The Gangut-class battleships enter trials with Russian crews learning to handle speed, gunnery, and heavy armour together. Their power anchors the Baltic, but the new ships demand trained specialists in every department."
 RUS_battle_cruiser_effort_desc:0 "Naval designers will compare heavy guns, protection and speed for the Izmail programme. Technical studies support the next heavy hull while leaving construction to the shipyards."
 RUS_baltic_fleet_reform:0 "Baltic Fleet Staff Reform"
 RUS_baltic_fleet_reform_desc:0 "Baltic staff officers rewrite signals and sailing orders after exercises around Helsingfors and the Gulf of Finland. Clearer command gives the fleet purpose, although captains lose some cherished independence."
 RUS_black_sea_shipyards:0 "Nikolayev Black Sea Yards"
 RUS_black_sea_shipyards_desc:0 "Nikolayev yards organise a southern production line for patrol craft, destroyers, and repairs. The Black Sea fleet gains a local base, while every plate and engine must be allocated against the war in the west."
 RUS_arctic_supply_ports:0 "Arkhangelsk Naval Stores"
 RUS_arctic_supply_ports_desc:0 "Arkhangelsk naval stores will receive permanent workshop contracts. A dockyard in the White Sea region will support repairs and construction while the state remains under our control."
 RUS_naval_engineering_bureau:0 "Baltic Works Design Bureau"
 RUS_naval_engineering_bureau_desc:0 "Engineers from the Baltic Works and Obukhov combine drawings for guns, turbines, and hull reinforcement. Russian ship design becomes less dependent on foreign consultants, provided the bureaus share their failures."
 RUS_torpedo_school:0 "Whitehead Torpedo School"
 RUS_torpedo_school_desc:0 "Torpedo crews study Whitehead weapons, firing angles, and maintenance at a dedicated school. A destroyer can threaten a larger ship, but a missed torpedo wastes months of scarce production."
 RUS_mine_warfare:0 "Gulf of Finland Minefields"
 RUS_mine_warfare_desc:0 "Naval engineers chart mine belts across the Gulf of Finland and drill crews to lay and recover them. The fields shelter the fleet, while a single inaccurate chart can destroy a Russian ship."
 RUS_destroyer_screen:0 "Novik Screen Tactics"
 RUS_destroyer_screen_desc:0 "Novik captains practise smoke, torpedo screens, and night manoeuvres around the battleship line. The screen buys time against a superior fleet, but it depends on signals working in darkness."
 RUS_submarine_tenders:0 "Submarine Tender Ships"
 RUS_submarine_tenders_desc:0 "Tender ships carry fuel, batteries, torpedoes, and mechanics to the Bars-class boats at sea. Patrols last longer, although every tender becomes a conspicuous prize for enemy cruisers."
 RUS_fleet_radio:0 "Fleet Radio Service"
 RUS_fleet_radio_desc:0 "Radio officers standardise call signs and aerials from Kronstadt to Sevastopol. Admirals can coordinate distant squadrons, but enemy interception makes careless signals dangerous."
 RUS_coastal_defence:0 "Fortify the Imperial Harbours"
 RUS_coastal_defence_desc:0 "Coastal commands link guns, mines, searchlights, and observation posts around the principal harbours. The fleet gains a layered shield, while engineers are tied to fixed positions instead of mobile works."
 RUS_baltic_batteries:0 "Kronstadt Battery Modernisation"
 RUS_baltic_batteries_desc:0 "Kronstadt batteries receive improved range tables, shells, and protected magazines. The fortress guards Petrograd's approaches, but every gun needs crews that could serve aboard ship."
 RUS_black_sea_batteries:0 "Sevastopol Coastal Guns"
 RUS_black_sea_batteries_desc:0 "Sevastopol's coastal guns are reorganised to cover the harbour entrance and the routes toward Odessa. The Black Sea fleet gains warning and firepower, though ammunition storage becomes a new vulnerability."
 RUS_landing_parties:0 "Naval Landing Companies"
 RUS_landing_parties_desc:0 "Sailors train as landing companies for piers, river mouths, and lightly held coastal works. The navy gains a small force ashore, but every landing detachment weakens a ship's deck crew."
 RUS_fleet_logistics:0 "Admiralty Coal Service"
 RUS_fleet_logistics_desc:0 "The Admiralty creates a coal service that records bunkers, colliers, and consumption by squadron. Ships spend more time at sea, while merchants surrender cargo space to naval fuel."
 RUS_sea_trials:0 "Black Sea Turbine Trials"
 RUS_sea_trials_desc:0 "Engineers conduct turbine and boiler trials on the Black Sea where calm water permits measured runs. Reliable machinery promises speed, but every trial burns fuel that cannot be recovered."
 RUS_escort_construction:0 "Convoy Escort Contracts"
 RUS_escort_construction_desc:0 "Shipyards receive small escort contracts for patrols between Arkhangelsk, Murmansk, and the Black Sea ports. Escorts protect supplies, though every slip used for a small hull delays a larger warship."
 RUS_oil_fuel_reserves:0 "Baku Fuel for the Fleet"
 RUS_oil_fuel_reserves_desc:0 "The Admiralty will assign a limited fuel reserve to fleet operations and training. Stored fuel will support the ships already in service without creating a new resource system."
 RUS_admiralty_staff:0 "General Naval Staff College"
 RUS_admiralty_staff_desc:0 "The General Naval Staff College teaches officers to combine charts, signals, intelligence, and fuel in one operation. Russia gains planners for a modern fleet, although classroom time removes captains from their decks."
 RUS_fleet_doctrine:0 "Fleet-in-Being Doctrine"
 RUS_fleet_doctrine_desc:0 "Admirals adopt a fleet-in-being doctrine that preserves capital ships while destroyers and submarines contest the approaches. The policy protects Russia's strength, but it frustrates officers who want decisive battle."
 RUS_arctic_convoys:0 "White Sea Convoy Schedules"
 RUS_arctic_convoys_desc:0 "Convoy schedules bind Arkhangelsk, Murmansk, ice pilots, and escort captains to the same weather reports. Foreign materiel arrives with fewer losses, though the northern route remains hostage to the ice."
 RUS_fleet_air_cooperation:0 "Seaplane Scouts for the Fleet"
 RUS_fleet_air_cooperation_desc:0 "Fleet officers place Grigorovich seaplanes beside destroyer screens for reconnaissance over the Baltic and Black Sea. The fleet sees farther, while salt, wind, and spare engines limit the aircraft's endurance."
 RUS_modernize_baltic_dockyards:0 "Modernise the Baltic Works"
 RUS_modernize_baltic_dockyards_desc:0 "Baltic Works receives new cranes, machine tools, and dry-dock plans for the next generation of Russian ships. The investment creates a durable naval industry, but army contracts must wait for the same machinery."
 RUS_ww1_council_of_ministers:0 "A Council that Can Govern"
 RUS_ww1_council_of_ministers_desc:0 "A railway order, a treasury payment and an army requisition cannot be treated as three unrelated matters. The Council of Ministers must bring the Interior, Finance and War ministries to the same table. Common budgets and an agreed order of business can make the state act before disputes between ministers become shortages at the front."
 RUS_ww1_duma_business:0 "Bring Business before the Duma"
 RUS_ww1_duma_business_desc:0 "The State Duma contains landowners, industrial interests, reformers and opponents of the government. Its commissions can scrutinise contracts and identify faults that the ministries prefer to conceal. By bringing practical business before the chamber, we can use parliamentary expertise without settling every dispute over the constitution at once."
 RUS_ww1_court_and_cabinet:0 "The Court and the Cabinet"
 RUS_ww1_court_and_cabinet_desc:0 "Access to the emperor must not replace the work of a ministry. We will review appointments and clarify how the court receives advice on government business."
 RUS_ww1_continue_stolypin:0 "Continue the Agrarian Programme"
 RUS_ww1_continue_stolypin_desc:0 "The agrarian programme remains unfinished. Peasant households seeking independent holdings need surveys, credit and access to markets, while the countryside still struggles with poor roads and uncertain titles. Continuing this work can connect rural incomes with the industrial economy, rather than treating the village merely as a reservoir of recruits."
 RUS_ww1_zemstvo_schools:0 "Schools and Provincial Services"
 RUS_ww1_zemstvo_schools_desc:0 "Zemstvo institutions know the needs of their districts. Service agreements will support schools, clinics and roads while retaining a common national programme."
 RUS_ww1_worker_insurance:0 "Enforce Workers' Insurance"
 RUS_ww1_worker_insurance_desc:0 "A law promising insurance is of little use if a worker cannot register a claim. Factory inspectors and sickness funds must make protection available in the workshops where injuries and lost wages are most severe. Reliable administration gives industrial workers a reason to trust the state and helps keep skilled labour at its machines."
 RUS_ww1_public_accounts:0 "Publish the Ministerial Accounts"
 RUS_ww1_public_accounts_desc:0 "The ministries must compare the cost of their contracts and report what has actually been delivered. Public accounts will improve purchasing routines and expose administrative waste."
 RUS_ww1_keep_court_out_of_orders:0 "Keep the Court out of Orders"
 RUS_ww1_keep_court_out_of_orders_desc:0 "Appointments and military orders must answer to a responsible ministry. Reducing informal influence at court will make it harder for private interests to obstruct government business."
 RUS_ww1_historical_counsel:0 "The Emperor's Wartime Counsel"
 RUS_ww1_historical_counsel_desc:0 "The crown intends to prosecute the war through the existing ministries and the emperor's personal authority. Members of the Duma may offer their counsel, but the cabinet answers to the sovereign. This preserves imperial command while leaving Russia exposed to the disputes over supply, appointments and political responsibility that war brings into the open."
 RUS_ww1_renew_autocracy:0 "A Reinvigorated Autocracy"
 RUS_ww1_renew_autocracy_desc:0 "The emperor must choose between ruling decisively and allowing rival ministers to rule in his name. A renewed autocracy places appointments, provincial inspections and public contracts under a single imperial programme. The dynasty will retain its authority, but it must accept responsibility for the administration it commands."
 RUS_ww1_responsible_government:0 "A Government of Public Confidence"
 RUS_ww1_responsible_government_desc:0 "Russia need not choose between a powerless parliament and the overthrow of the crown. A ministry drawn from a dependable majority can answer for the budget and the conduct of public business while Nicholas remains sovereign. Negotiating that settlement is the first step towards a constitutional monarchy."
 RUS_ww1_constituent_republic:0 "The Sovereignty of the Assembly"
 RUS_ww1_constituent_republic_desc:0 "The authority to govern cannot rest indefinitely on an appointment from the palace. Civil guarantees, electoral registers and a national assembly can establish a mandate beyond the dynasty. This course commits us to a republic built through civilian institutions, rather than a transfer of power to the army or the soviets."
 RUS_ww1_officers_council:0 "Entrust Government to the Officers"
 RUS_ww1_officers_council_desc:0 "The officers argue that Russia's survival requires a government able to issue orders and see them carried out. Their council can restore a common chain of command, but it also brings military authority into civil affairs. We must decide who will direct that government and whether the army is assuming a temporary duty or a permanent political role."
 RUS_ww1_progressive_bloc:0 "Hear the Progressive Bloc"
 RUS_ww1_progressive_bloc_desc:0 "The Progressive Bloc calls for a government capable of enjoying the country's confidence. Its deputies do not agree on every reform, but they share a fear that ministerial paralysis is endangering the war. Hearing their demands may bring parliamentary experience into the national effort; dismissing them will leave the palace increasingly isolated."
 RUS_ww1_ministerial_turnover:0 "Confront Ministerial Turnover"
 RUS_ww1_ministerial_turnover_desc:0 "Repeated appointments leave contracts unfinished and provincial instructions unclear. A common register of outstanding business will keep the ministries operating through another change of personnel."
 RUS_ww1_duma_committee:0 "The Duma Committee"
 RUS_ww1_duma_committee_desc:0 "The imperial administration has given way to a provisional government. The Duma committee must establish ministries, maintain public services and decide how it will work with the soviets."
 RUS_ww1_dual_power:0 "The Problem of Dual Power"
 RUS_ww1_dual_power_desc:0 "The government and the Petrograd Soviet speak with different sources of authority. Ministers must decide whether to preserve this uneasy arrangement or seek a decisive constitutional settlement."
 RUS_ww1_historical_coalition:0 "The Provisional Coalition"
 RUS_ww1_historical_coalition_desc:0 "The coalition will continue to govern while the war and the struggle over national representation develop. This course preserves the existing Lenin, July Days, Kornilov and October event sequence."
 RUS_ww1_assembly_in_time:0 "Convene the Assembly in Time"
 RUS_ww1_assembly_in_time_desc:0 "Every postponement leaves the Provisional Government with a weaker claim to speak for the country. The electoral machinery must be ready, delegates must reach the capital and the army must respect the result. Convening the assembly before the political crisis deepens offers a chance to establish a civilian republic on a durable mandate."
 RUS_ww1_april_programme:0 "The April Programme"
 RUS_ww1_april_programme_desc:0 "Lenin's return places a new programme before the revolutionary movement. The provisional authorities must contend with demands for an end to the war and a transfer of power to the soviets."
 RUS_ww1_summer_crisis:0 "The Summer Political Crisis"
 RUS_ww1_summer_crisis_desc:0 "Street demonstrations and disputes within the army expose the weakness of the coalition. The government must continue its work while rival political organisations mobilise their supporters."
 RUS_ww1_defend_winter_palace:0 "Defend the Provisional Republic"
 RUS_ww1_defend_winter_palace_desc:0 "The republic cannot rely on declarations while its ministries lose control of the capital. Loyal guards, clear orders and an agreement among the democratic parties must defend civilian government against an armed seizure of power. Holding the palace is only the first duty; restoring a legitimate administration must follow."
 RUS_ww1_soviet_transfer:0 "Power to the Soviets"
 RUS_ww1_soviet_transfer_desc:0 "The revolutionary movement is preparing to displace the provisional government. Completing this programme invokes the existing October transition to Soviet Russia and its civil-war tree."
 RUS_ww1_cabinet_discipline:0 "Discipline the Imperial Cabinet"
 RUS_ww1_cabinet_discipline_desc:0 "The ministries will receive common reporting rules and a clear order of business. Appointments must support the imperial programme rather than restart it."
 RUS_ww1_provincial_inspectors:0 "Inspect the Governorates"
 RUS_ww1_provincial_inspectors_desc:0 "An inspectorate will bring provincial administration under common service regulations. Direct supervision strengthens the executive while requiring public resources."
 RUS_ww1_crown_councils:0 "A Crown Council of State"
 RUS_ww1_crown_councils_desc:0 "The emperor will receive advice through a formal council with recorded decisions. Its members must connect the concerns of the provinces with the obligations of the common state."
 RUS_ww1_renewed_imperial_government:0 "The Renewed Imperial Government"
 RUS_ww1_renewed_imperial_government_desc:0 "The crown is ready to place its executive programme into effect. A reformed imperial cabinet will preserve Nicholas as head of state and consolidate the alternative autocratic settlement."
 RUS_ww1_imperial_schools:0 "Schools under the Imperial Programme"
 RUS_ww1_imperial_schools_desc:0 "The imperial government needs officials and engineers trained to a common standard. Investment in practical education will support the next generation of national institutions."
 RUS_ww1_dynastic_public_works:0 "Public Works of the Dynasty"
 RUS_ww1_dynastic_public_works_desc:0 "Factories and public works will give the imperial programme a visible presence beyond the capital. A civilian workshop in Moscow will support local employment and national contracts."
 RUS_ww1_imperial_service_charter:0 "An Imperial Service Charter"
 RUS_ww1_imperial_service_charter_desc:0 "The dynasty will publish the duties of its national and provincial services. Common defence obligations will accompany the local responsibilities recognised by the charter."
 RUS_ww1_crown_internal_market:0 "The Crown's Internal Market"
 RUS_ww1_crown_internal_market_desc:0 "The crown will replace competing local standards with a common framework for internal commerce. Manufacturers and transport offices will share predictable schedules."
 RUS_ww1_duma_responsibility:0 "Make Ministers Answer to the Duma"
 RUS_ww1_duma_responsibility_desc:0 "Ministers must defend their appointments and contracts before the chamber. Written responsibility will make parliamentary support part of government business."
 RUS_ww1_parliamentary_accounts:0 "A Parliamentary Accounts Office"
 RUS_ww1_parliamentary_accounts_desc:0 "Officials will report expenditures against the appropriations voted by parliament. Permanent accounts will support industrial purchasing and civilian investment."
 RUS_ww1_octobrist_compromise:0 "Negotiate the Octobrist Compromise"
 RUS_ww1_octobrist_compromise_desc:0 "Conservative and liberal representatives must agree how the crown and the chamber share executive power. A workable compromise can protect the monarchy without preserving arbitrary ministerial authority."
 RUS_ww1_constitutional_monarchy:0 "A Constitutional Russian Monarchy"
 RUS_ww1_constitutional_monarchy_desc:0 "The crown will accept a ministry responsible to parliament. Nicholas remains head of state while a new constitutional settlement replaces the historical collapse of imperial government."
 RUS_ww1_equal_civil_law:0 "A Common Civil Law"
 RUS_ww1_equal_civil_law_desc:0 "Citizens and local administrations need clear legal guarantees. Common obligations will accompany provincial representation and the protection of public services."
 RUS_ww1_parliamentary_education:0 "Education through Parliament"
 RUS_ww1_parliamentary_education_desc:0 "Parliament will establish a programme of practical education and public research. Clear appropriations will make the universities and technical schools dependable national institutions."
 RUS_ww1_municipal_charters:0 "Charters for the Municipalities"
 RUS_ww1_municipal_charters_desc:0 "Municipal councils will administer local services through written agreements. The national government will support construction while retaining parliamentary oversight of the funds."
 RUS_ww1_constitutional_market:0 "Commerce under the Constitution"
 RUS_ww1_constitutional_market_desc:0 "The responsible ministry will reconcile transport and commercial regulations across the provinces. A common internal market will support civilian construction and industrial learning."
 RUS_ww1_civil_guarantees:0 "Publish the Civil Guarantees"
 RUS_ww1_civil_guarantees_desc:0 "The assembly will publish the rights of citizens and the responsibilities of its officials. A clear mandate will give the new institutions political authority."
 RUS_ww1_constituent_registers:0 "Prepare the Electoral Registers"
 RUS_ww1_constituent_registers_desc:0 "The national vote requires officials, records and procedures which can be trusted beyond the capital. Electoral registers will become part of a professional civil administration."
 RUS_ww1_elected_ministries:0 "Ministries from an Elected Majority"
 RUS_ww1_elected_ministries_desc:0 "A parliamentary majority must accept responsibility for the common ministries. Recorded appointments and public debate will establish the government's national mandate."
 RUS_ww1_lvov_republic:0 "A Parliamentary Russian Republic"
 RUS_ww1_lvov_republic_desc:0 "The cabinet must now answer to an elected assembly. Lvov will lead a civilian ministry, while the new institutions establish a government independent of the imperial court."
 RUS_ww1_republican_schools:0 "Schools for the Republic"
 RUS_ww1_republican_schools_desc:0 "The republic needs trained officials and engineers in every region. A public education programme will support research and the practical work of civilian government."
 RUS_ww1_rural_cooperatives:0 "Rural Cooperatives and Workshops"
 RUS_ww1_rural_cooperatives_desc:0 "Local cooperatives need tools, contracts and access to industrial services. A civilian workshop in Chernigov will support employment and reconstruction in a state we securely govern."
 RUS_ww1_regional_representation:0 "Representation of the Regions"
 RUS_ww1_regional_representation_desc:0 "Regional representatives will receive a permanent place in national political business. Their local responsibilities will accompany a common defence and service charter."
 RUS_ww1_republican_market:0 "The Republican Internal Market"
 RUS_ww1_republican_market_desc:0 "Elected institutions will agree a common framework for rail transport and commercial contracts. Manufacturers will benefit from predictable conditions across the country."
 RUS_ww1_labour_peasant_convention:0 "A Labour and Peasant Convention"
 RUS_ww1_labour_peasant_convention_desc:0 "Workers and rural representatives will draft their own constitutional programme. Their convention seeks a republic whose services answer directly to the communities supporting it."
 RUS_ww1_kerensky_social_republic:0 "Kerensky's Social Republic"
 RUS_ww1_kerensky_social_republic_desc:0 "Kerensky seeks a government supported by workers, peasants and the elected representatives of the republic. Cooperatives and public works can answer demands that a change of ministers alone cannot satisfy. The coalition must keep its democratic mandate while finding the funds and organisation to carry out its programme."
 RUS_ww1_cooperative_industry:0 "Cooperative Industrial Agreements"
 RUS_ww1_cooperative_industry_desc:0 "Workplace representatives will negotiate common standards with industrial managers. Longer service agreements will support production routines and the provision of insurance."
 RUS_ww1_social_reconstruction:0 "The Social Reconstruction Programme"
 RUS_ww1_social_reconstruction_desc:0 "Public works will absorb returning workers and restore civilian transport. The coalition will accept a temporary reduction in military output to accelerate civilian recovery."
 RUS_ww1_elected_service_boards:0 "Elected Boards of Public Service"
 RUS_ww1_elected_service_boards_desc:0 "Local communities will elect boards responsible for schools, health and public roads. Common appropriations will make their work part of a national programme."
 RUS_ww1_a_democratic_social_union:0 "A Democratic Social Union"
 RUS_ww1_a_democratic_social_union_desc:0 "A common market and a democratic mandate can keep the regions working together. The social republic will preserve shared defence and commerce through its elected institutions."
 RUS_ww1_national_defence_council:0 "A Council of National Defence"
 RUS_ww1_national_defence_council_desc:0 "The senior officers will establish a council linking military plans with the common ministries. Concentrated authority will strengthen reserve organisation while limiting civilian investment."
 RUS_ww1_alekseev_directorate:0 "Alekseev's Directorate"
 RUS_ww1_alekseev_directorate_desc:0 "Alekseev proposes an executive organised around staff work, dependable mobilisation returns and a functioning civil service. The general's authority will bind the army and the ministries to a common programme. Military administration gains priority, while civilian construction bears the cost of maintaining the directorate."
 RUS_ww1_kornilov_order:0 "Kornilov's National Order"
 RUS_ww1_kornilov_order_desc:0 "Kornilov intends to place discipline and an offensive spirit at the centre of government. His emergency administration can accelerate mobilisation and strengthen the army's resolve, but civil politics will suffer under military supervision. Russia will gain a harder executive at the price of a more restricted public life."
 RUS_ww1_kolchak_government:0 "Kolchak's National Government"
 RUS_ww1_kolchak_government_desc:0 "Kolchak brings the concerns of ports, transport and naval command into the executive. His government will give priority to moving supplies and restoring the fleet's organisation. Maintaining that apparatus requires resources that the civilian economy could otherwise use, and military authority must still answer the question of its eventual retirement."
 RUS_ww1_directorate_civil_service:0 "A Civil Service beneath the Directorate"
 RUS_ww1_directorate_civil_service_desc:0 "Military orders cannot substitute for every task of civil government. Qualified officials will continue provincial contracts and publish the records needed by the directorate."
 RUS_ww1_restore_reserve_orders:0 "Restore Reserve Mobilisation Orders"
 RUS_ww1_restore_reserve_orders_desc:0 "The reserve establishment needs clear timetables and a dependable chain of command. Joint staff exercises will turn the directorate's mobilisation orders into practical arrangements."
 RUS_ww1_directorate_public_works:0 "The Directorate's Public Works"
 RUS_ww1_directorate_public_works_desc:0 "The government must repair the transport network and restore civilian contracts. A year of public works will accelerate construction while the armament programme adjusts to new priorities."
 RUS_ww1_return_civil_authority:0 "Return Authority to the Assembly"
 RUS_ww1_return_civil_authority_desc:0 "Emergency military command has served its purpose. With peace restored, executive authority will return to a civilian ministry and representative institutions."
 RUS_ww1_permanent_directorate:0 "A Permanent National Directorate"
 RUS_ww1_permanent_directorate_desc:0 "The officers will retain the national executive and formalise their appointment procedures. Permanent coordination gives the government political authority and a stronger command reserve."
 RUS_ww1_nationalities_commission:0 "The Question of the Nationalities"
 RUS_ww1_nationalities_commission_desc:0 "The empire contains communities with different laws, languages and provincial institutions. A national commission will establish which powers belong to the common government and which responsibilities can remain local."
 RUS_ww1_regional_compacts:0 "Negotiate Regional Compacts"
 RUS_ww1_regional_compacts_desc:0 "Provincial representatives will negotiate written responsibilities for local services. A common compact recognises their institutions while retaining one state, army and internal market."
 RUS_ww1_finnish_senate:0 "Work with the Finnish Senate"
 RUS_ww1_finnish_senate_desc:0 "A recognised channel to the Finnish Senate can give local institutions a place within the common state. Agreed responsibilities will support civilian services without releasing an independent country. The programme invests in infrastructure within the participating region."
 RUS_ww1_finnish_senate_schools:0 "The Senate and Finnish Education"
 RUS_ww1_finnish_senate_schools_desc:0 "Finland's educational administration cannot be strengthened by treating its institutions as an ordinary provincial office. An agreement with the Senate will support teacher training and technical instruction while giving the common government a reliable partner for public services."
 RUS_ww1_baltic_municipalities:0 "The Baltic Municipalities"
 RUS_ww1_baltic_municipalities_desc:0 "Municipal representatives will coordinate roads, public health and industrial contracts in the Baltic provinces. Their local experience will become part of the common service programme. The programme invests in infrastructure within the participating region."
 RUS_ww1_baltic_municipalities_schools:0 "Baltic Technical Colleges"
 RUS_ww1_baltic_municipalities_schools_desc:0 "The Baltic towns connect shipping, workshops and commerce across several languages and communities. Municipal technical colleges can train mechanics, surveyors and clerks for these services. Their practical instruction must reach local employers rather than remain a plan confined to the ministry."
 RUS_ww1_polish_civil_guarantees:0 "Civil Guarantees in Poland"
 RUS_ww1_polish_civil_guarantees_desc:0 "The Polish provinces need clear responsibilities for courts and local public services. Written guarantees can support cooperation while the government retains its common defence obligations. The programme invests in infrastructure within the participating region."
 RUS_ww1_polish_civil_guarantees_schools:0 "Reopen the Polish Classrooms"
 RUS_ww1_polish_civil_guarantees_schools_desc:0 "Civil guarantees in Poland must be accompanied by institutions that people can use. Restoring classrooms and technical courses will give the provincial administration a trained staff and the workshops a supply of skilled labour. Education offers a practical basis for cooperation beyond official proclamations."
 RUS_ww1_ukrainian_local_services:0 "Local Services in Ukraine"
 RUS_ww1_ukrainian_local_services_desc:0 "Provincial offices and rural organisations will agree how schools, roads and registration services are maintained. Their work must connect local responsibilities with the national ministries. The programme invests in infrastructure within the participating region."
 RUS_ww1_ukrainian_local_services_schools:0 "Ukraine's Zemstvo Schools"
 RUS_ww1_ukrainian_local_services_schools_desc:0 "The Ukrainian provinces need teachers, agricultural instructors and engineers as much as they need ministry circulars. Zemstvo schools can connect local knowledge with technical courses financed by the state. Better training will strengthen public administration and the workshops serving the region."
 RUS_ww1_caucasian_councils:0 "Councils of the Caucasus"
 RUS_ww1_caucasian_councils_desc:0 "The Caucasian provinces require transport and public services suited to their geography. Regional councils will coordinate their work with the common defence and railway authorities. The programme invests in infrastructure within the participating region."
 RUS_ww1_caucasian_councils_schools:0 "Training for the Caucasian Services"
 RUS_ww1_caucasian_councils_schools_desc:0 "Caucasian public services must work across difficult terrain and communities with different languages and needs. Regional training centres can prepare clerks, medical staff and engineers for that task. A dependable local administration will make common services more effective without demanding that every problem be settled in the capital."
 RUS_ww1_finnish_services:0 "Finnish Transport Agreements"
 RUS_ww1_finnish_services_desc:0 "The Senate and the common ministries will coordinate transport and construction contracts. Provincial infrastructure will receive support through the agreed service programme."
 RUS_ww1_baltic_contracts:0 "Baltic Workshop Contracts"
 RUS_ww1_baltic_contracts_desc:0 "Municipal contracts will bring steady work to Baltic workshops and suppliers. Local investment will strengthen the industrial network serving the western provinces."
 RUS_ww1_ukrainian_workshops:0 "Ukrainian Engineering Contracts"
 RUS_ww1_ukrainian_workshops_desc:0 "Engineering workshops will produce tools for provincial services and national transport. Investment in Kiev's wider industrial region requires secure control of the selected state."
 RUS_ww1_caucasian_services:0 "Caucasian Service Agreements"
 RUS_ww1_caucasian_services_desc:0 "Regional offices will share schedules for transport and public works. Better coordination will support infrastructure construction and reduce waste in the common supply network."
 RUS_ww1_nationality_charter:0 "A Charter for the Common State"
 RUS_ww1_nationality_charter_desc:0 "The empire's nationalities cannot be held together by ambiguous promises. A written charter must establish which duties belong to the central ministries and which belong to regional institutions. Common defence and transport will remain national responsibilities, while the choice between provincial compacts and uniform administration must be made openly."
 RUS_ww1_federal_service_union:0 "A Union of Self-Governing Provinces"
 RUS_ww1_federal_service_union_desc:0 "Finland, the Baltic towns, Poland, Ukraine and the Caucasus require institutions that can address local concerns. A federal settlement grants regional authorities responsibility for their public services while retaining a common army, treasury and internal market. The state will survive through an agreed division of powers rather than through continual administrative confrontation."
 RUS_ww1_unitary_state_charter:0 "The Unitary State Charter"
 RUS_ww1_unitary_state_charter_desc:0 "A common state requires rules that its officials can enforce in every province. The charter will preserve local services but place them under uniform ministry regulations. This favours a dependable central administration over the negotiation of separate constitutional arrangements."
 RUS_ww1_regional_officer_colleges:0 "Regional Officer Colleges"
 RUS_ww1_regional_officer_colleges_desc:0 "Officer colleges will use common instruction while recruiting students from the provinces. Liaison courses will strengthen the army's shared working procedures."
 RUS_ww1_common_commercial_code:0 "A Common Commercial Code"
 RUS_ww1_common_commercial_code_desc:0 "Local contracts must operate within one internal market. A common commercial code will support civilian construction and the development of industrial production."
 RUS_ww1_one_state_many_regions:0 "One State, Many Regions"
 RUS_ww1_one_state_many_regions_desc:0 "The common state now has an agreed constitution, shared services and a functioning market. The government can consolidate that settlement without turning local representation into an arbitrary partition."
 RUS_war_front_2_desc:0 "Reserve formations must be assigned through a common operational plan. Staff exercises and recorded movement orders will make them available where the front requires support."
 RUS_ww1_the_returning_army:0 "Provide for the Returning Army"
 RUS_ww1_the_returning_army_desc:0 "Demobilisation must be planned before the depots fill with returning soldiers. Railway movement, medical care and civilian employment need a common timetable, while the army must retain the officers and stores required for national defence. An orderly return to civilian life will prevent peace from creating a new administrative crisis."
 RUS_ww1_allied_contract_offices:0 "Permanent Allied Contract Offices"
 RUS_ww1_allied_contract_offices_desc:0 "Supervised purchasing offices will compare foreign orders with domestic industrial requirements. Long-term arrangements will accelerate civilian investment while requiring administrative resources."
 RUS_ww1_balkan_staff_college:0 "The Balkan Liaison College"
 RUS_ww1_balkan_staff_college_desc:0 "Military representatives will compare reserve and railway plans with our Balkan partners. Joint instruction will improve staff liaison and command preparation."
 RUS_ww1_romanian_rail_mission:0 "The Romanian Railway Mission"
 RUS_ww1_romanian_rail_mission_desc:0 "Romanian mobilisation depends on bringing men and supplies from the interior to the frontier. A liaison mission can coordinate railway timetables, unloading points and staff arrangements with Bucharest. Cooperation must reinforce Romania as an independent partner rather than reduce its army to an extension of our own."
 RUS_ww1_reaffirm_independent_balkans:0 "Reaffirm Independent Balkan Partners"
 RUS_ww1_reaffirm_independent_balkans_desc:0 "The ministry will state the obligations and limits of the Balkan arrangements. A clear negotiating mandate will support future guarantees and prevent military liaison from becoming an unannounced territorial policy."
 RUS_ww1_caspian_conventions:0 "Caspian Transit Conventions"
 RUS_ww1_caspian_conventions_desc:0 "Representatives will agree the administrative work needed by the Caucasian and Caspian routes. Transit conventions support transport construction and reduce supply waste."
 RUS_ww1_japanese_rapprochement:0 "A Rapprochement with Japan"
 RUS_ww1_japanese_rapprochement_desc:0 "The Far Eastern frontier does not have to remain a permanent source of alarm. Discussions with Japan can establish a non-aggression agreement and commercial cooperation without surrendering our interests in the Pacific. Tokyo must accept the offer before these arrangements can become government policy."
 RUS_ww1_pacific_commercial_missions:0 "Pacific Commercial Missions"
 RUS_ww1_pacific_commercial_missions_desc:0 "The accepted relationship can support ports and industrial purchasing. Permanent missions will organise contracts while retaining the government's independence."
 RUS_ww1_an_independent_diplomacy:0 "An Independent Russian Diplomacy"
 RUS_ww1_an_independent_diplomacy_desc:0 "The government can reconsider the commitments inherited from the existing alliance system. Independent negotiations require peace so that a diplomatic choice cannot erase an ongoing war."
 RUS_ww1_armed_neutrality:0 "Choose Armed Neutrality"
 RUS_ww1_armed_neutrality_desc:0 "A policy of neutrality must be backed by forces able to deter its violation. Russia will leave its faction commitments and organise its security around defence of its own territory. Neutrality preserves diplomatic freedom, but it does not end a war already being fought or excuse neglect of the army."
 RUS_ww1_german_rapprochement:0 "Negotiate with Berlin"
 RUS_ww1_german_rapprochement_desc:0 "Russia and Germany have rival strategic interests, yet neither rivalry nor alliance is inevitable. An offer covering non-aggression, trade and industrial contracts can test Berlin's willingness to reach an accommodation. Such an agreement requires German consent and a Russian departure from commitments that would make it meaningless."
 RUS_ww1_neutral_shipping:0 "Neutral Shipping Agreements"
 RUS_ww1_neutral_shipping_desc:0 "Merchant contracts will provide shipping for an independent commercial policy. Ten commissioned convoys will support the routes used by our national services."
 RUS_ww1_berlin_contracts:0 "Russian-German Industrial Contracts"
 RUS_ww1_berlin_contracts_desc:0 "An accepted agreement will support supervised industrial contracts with Germany. Civilian construction will benefit from the purchasing programme while resources are reserved for its administration."
 RUS_ww1_independent_security:0 "A National Security Convention"
 RUS_ww1_independent_security_desc:0 "An independent diplomatic position still requires prepared staffs and maritime services. A national convention will coordinate their obligations without creating a new faction."
 RUS_ww1_maintain_independent_position:0 "Maintain the Independent Position"
 RUS_ww1_maintain_independent_position_desc:0 "The government will reaffirm the agreements on which its independent programme rests. A clear mandate will support continued negotiations and national defence."
 RUS_ww1_postwar_foreign_service:0 "The Postwar Foreign Service"
 RUS_ww1_postwar_foreign_service_desc:0 "Peace requires the ministry to reconcile its treaties, public contracts and regional commitments. Permanent missions will give the government a mandate for the reconstruction years."
 RUS_ww1_postwar_constitution:0 "Confirm the Postwar Constitution"
 RUS_ww1_postwar_constitution_desc:0 "Victory, revolution or reform cannot leave the government forever dependent on emergency arrangements. The surviving settlement must define the powers of the executive, the representation of the provinces and the responsibilities of the national ministries. A constitution for peace will turn the chosen political course into a durable government."
 RUS_ww1_university_reconstruction:0 "Restore the Universities"
 RUS_ww1_university_reconstruction_desc:0 "Universities and technical institutes must restore their teaching after the emergency years. Public studies will support the engineers and officials needed for reconstruction."
 RUS_ww1_demobilisation_contracts:0 "Contracts for Demobilisation"
 RUS_ww1_demobilisation_contracts_desc:0 "Civilian contracts will absorb workers and reorganise the emergency industries. The programme accelerates reconstruction while military output adjusts to peace."
 RUS_ww1_civilian_workshops:0 "Reopen the Civilian Workshops"
 RUS_ww1_civilian_workshops_desc:0 "The reconstruction programme needs machinery and local employment. A civilian workshop in Moscow will support the work of the national services."
 RUS_ww1_provincial_repair_agreements:0 "Provincial Repair Agreements"
 RUS_ww1_provincial_repair_agreements_desc:0 "Provincial offices will agree a long-term calendar of repairs and public works. Their contracts will support infrastructure construction across the country."
 RUS_ww1_a_state_for_the_new_decade:0 "A State for the New Decade"
 RUS_ww1_a_state_for_the_new_decade_desc:0 "The chosen government now has a reconstruction programme, trained officials and a functioning internal market. Its political mandate will support the next stage of national development."
 RUS_ww1_soldier_representatives:0 "The Soldiers' Representatives"
 RUS_ww1_soldier_representatives_desc:0 "Soldiers seek representation in the institutions of the revolution. Elected committees can give the ranks a political voice, while parallel authority complicates military command."
 RUS_ww1_coalition_ministries:0 "Ministries of the Coalition"
 RUS_ww1_coalition_ministries_desc:0 "The provisional coalition must distribute responsibility among parties and public organisations. Recorded ministerial appointments will give its administration a workable political mandate."
 RUS_ww1_kerensky_offensive:0 "The Provisional Government's Offensive"
 RUS_ww1_kerensky_offensive_desc:0 "The government will try to restore its authority through a prepared military campaign. Front headquarters will coordinate operations for a limited period, but political support cannot substitute for the forces available."
 RUS_ww1_democratic_conference:0 "The Democratic Conference"
 RUS_ww1_democratic_conference_desc:0 "Political organisations will meet to consider the authority of the provisional institutions. The government must prepare a national mandate while the struggle over the constituent assembly continues."
