 SO2_southern_expansion: "Southern Expansion"
 SO2_treaty_of_kars: "Treaty of Kars"
 SO2_treaty_of_kars_desc: "With the transcaucasian states defeated and reintgrated it is time to finalize our borders with the Republic of Turkey."
 SO2_intervene_PSSR: "Intervene in Persia"
 SO2_intervene_PSSR_desc: "The Persian Socialist Republic will not win on its own they will need the help of the mighty of the Red Army to overcome the evil autocrats in Tehran."
 SO2_supply_PSSR: "Supply the Persian SR"
 SO2_supply_PSSR_desc: "The Persian Socialist Republic will only get our supplies we cannot risk sparking another allied intervention over there."
 SO2_demand_jap_evac: "Demand Japanese Evacuation from Europe"
 SO2_demand_jap_evac_desc: "It is time for the Japanese to get out of our country!"
 SO2_reintegrate_FAR: "Reintegrate the Far Eastern Republic"
 SO2_reintegrate_FAR_desc: "With the Japanese no longer a threat the time has come for us to reintegrate the Far Eastern Republic."
 SO2_SO2_JAP_convention: "Soviet-Japanese Convention"
 SO2_SO2_JAP_convention_desc: "We should try and restore our relationship with the Japanese which has been ruined during the Civil War."
 SO2_invade_mongolia: "Invade Mongolia"
 SO2_invade_mongolia_desc: "With Roman von Ungern-Sternberg invading Mongolia for his own imperialistic purposes this serves as a perfect casus beli to invade and save the people of Mongolia."
 SO2_create_tanu_tuva: "Creation of Tannu Tuva"
 SO2_create_tanu_tuva_desc: ""
 SO2_war_communism: "War Communism"
 SO2_war_communism_desc: "Central control and requisitioning sustain the Red Army, but impose severe costs on the civilian economy."
