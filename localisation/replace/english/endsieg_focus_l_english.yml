 AUH_entente_diplomacy: "Entente Diplomacy"
 AUH_entente_diplomacy_desc: "Diplomacy with the Entente"
 AUH_seperate_peace: "Separate Peace"
 AUH_seperate_peace_desc: "Separate peace with the Entente could save our country."
 AUH_befriend_italy: "Befriend Italy"
 AUH_befriend_italy_desc: "It would be best to improve relations with the Italians as much as we can."
 AUH_subdue_italy: "Subdue Italy"
 AUH_subdue_italy_desc: "In order to prevent western infuence from getting hold in Italy offering territorial concessions on our behalf withour our benefit we should be the first to go in and offer these concessions, it would not be pleasant to deal with three fronts at once..."
 AUH_cede_tyrol: "Cede South Tyrol"
 AUH_cede_tyrol_desc: "Whilst the Italians would much rather prefer South Tyrol along with Istria, we could have a lucky throw of a dice and see if they will accept this proposition."
 AUH_cede_tyrol_and_istria: "Cede South Tyrol and Istria"
 AUH_cede_tyrol_and_istria_desc: "The Italians would very much likely accept this offer, however there is always a chance they won't."
 AUH_promise_italy: "Promise Italy Claims in France"
 AUH_promise_italy_desc: "We could promise the Italians a sizeable chunk of French territory once victory is assured and they are sitting comfortably at the peace table."
 AUH_italy_central_power: "Invite Italy"
 AUH_italy_central_power_desc: "Italian alignment with the Central Powers is now assured, now all that is left is to invite them."
 AUH_diplomatic_effort: "Diplomatic Effort"
 AUH_diplomatic_effort_desc: ""
 AUH_annex_bosnia: "Annex Bosnia"
 AUH_annex_bosnia_desc: "With the Young Turks revolution in Turkey and a momentary state of internal crisis, now would be the perfect time to snatch the territory of Bosnia from them and annex it into the Empire."
 AUH_anti_serb_rhetoric: "Anti-Serb Rhetoric"
 AUH_anti_serb_rhetoric_desc: "The Serbs are a threat to our dominance in the Balkans"
 AUH_dominate_balkan_SOI: "Dominate Balkans Sphere of Influence"
 AUH_dominate_balkan_SOI_desc: "If we have a sphere of influence over the Balkans we can effectively control the region, however such is unlikely as long as Serbia is around."
 AUH_pro_germany: "Pro-German Relations"
 AUH_pro_germany_desc: "Despite being a former foe, the German Empire now is very much our friend."
 AUH_bulgaria_friend: "Improve Relations with Bulgaria"
 AUH_bulgaria_friend_desc: "If there is one thing Austria and Bulgaria have in common it is our hatred of Serbia"
 AUH_prepare_for_war: "Prepare for War"
 AUH_prepare_for_war_desc: ""
 AUH_ottoman_friends: "Improve Relations with Turkey"
 AUH_ottoman_friends_desc: "Whilst the Ottomans and us have previously left off on bad terms with Bosnia and control of the Balkans, currently all of that is behind us and it is better if we focus on the future being friends with the Turks."
 AUH_confiscate_serb_grain: "Confiscate Serbian Grain"
 AUH_confiscate_serb_grain_desc: "As we now control the whole of Serbia, it would be a wise idea to strip the country of its grain supplies in order to feed our own men whom are lacking such needed supplies"
 AUH_volunteer_albania: "Volunteers from Albania"
 AUH_volunteer_albania_desc: "A few thousand Albanian volunteers have agreed join the Austro-Hungarian military"
 AUH_cede_macedonia_bulgaria: "Cede Macedonia to Bulgaria"
 AUH_cede_macedonia_bulgaria_desc: "As we have promised Bulgaria their rightful claims in Macedonia, we could always transfer over military control of the area to them so we won't have to deal with those rebellious killers."
 AUH_massive_war_effort: "Massive War Effort"
 AUH_massive_war_effort_desc: ""
 AUH_central_powers_diplomacy: "Central Powers Diplomacy"
 AUH_central_powers_diplomacy_desc: "Diplomacy with our Allies"
 AUH_german_advisors: "Request German Advisors"
 AUH_german_advisors_desc: "With our military leadership rather lacking, it would be a good idea to request German officers in order to increase the efficiency of our troops"
 AUH_german_troops: "German Reinforcements"
 AUH_german_troops_desc: "In order to further increase our military efficiency, we could request several German divisions whom could help with our military efforts."
 AUH_send_germany_aid: "Send Germany Military Aid"
 AUH_send_germany_aid_desc: "Our ally Germany is heavily involved with the brunt of the war effort against Russia and France, we could surely help them out quite a bit offering a sizable chunk of military hardware"
 AUH_send_germany_troops: "Send Reinforcements to Germany"
 AUH_send_germany_troops_desc: "The Germans desperately need more numerical superiority on their front against the French, we could surely aid them by seending over several of our divisions"
 AUH_turkish_reinforcements: "Turkish Reinforcements"
 AUH_turkish_reinforcements_desc: "We have recently been taking heavy casualties on the Eastern Front, the Turks are willing to send some reinforcements to help us out if we wish to recieve them."
 AUH_send_turkey_troops: "Send Troops to Turkey"
 AUH_send_turkey_troops_desc: "In order to help out our ally Turkey on their frontlines, we could offer to send over several garrison divisions and sizeable fighting divisions to aid them."
 AUH_send_turkey_weapons: "Send Weapons to Turkey"
 AUH_send_turkey_weapons_desc: "It is a well known fact that the Ottoman Empire is by far a industrial nation which can sufficiently produce its own war supply, if we help them out with this it should surely do them a lot of good."
 AUH_political_effort: "Political Effort"
 AUH_political_effort_desc: "As a loosely held empire of dozens of ethnicites, playing hardball with our politics might be the only way to save our great nation."
 AUH_imperial_stability: "Imperial Stability"
 AUH_imperial_stability_desc: "The Empire is far from stable with nationalism at its highest these days, which is why imperial stability is key to preserving the Empire."
 AUH_focus_military: "Focus on Military"
 AUH_focus_military_desc: "Focusing on the military means ignoring the internal issues, this could put the Empire at an even greater risk of collapse."
 AUH_focus_internal_issues: "Focus on Internal Isses"
 AUH_focus_internal_issues_desc: "Focusing on internal issues means somewhat sidelining focus on the military, however it will insure the stability of the Empire for a much longer time."
 AUH_supress_minorities: "Supress Minorities"
 AUH_supress_minorities_desc: "The nationalistic tendencies amongst the minorities must be supressed or else everything could go sideways."
 AUH_polish_legions: "Create Polish Legion"
 AUH_polish_legions_desc: ""
 AUH_war_effort_1: "War Effort I"
 AUH_war_effort_1_desc: "Rallying our citizens behind war would unite our country and, perhaps for a little while, make those pesky nationalists scattered across our empire, at least for a moment, disregard their long-time views of independence."
 AUH_war_effort_2: "War Effort II"
 AUH_war_effort_2_desc: "Rallying our citizens behind war would unite our country and, perhaps for a little while, make those pesky nationalists scattered across our empire, at least for a moment, disregard their long-time views of independence."
 AUH_war_effort_3: "War Effort III"
 AUH_war_effort_3_desc: "Rallying our citizens behind war would unite our country and, perhaps for a little while, make those pesky nationalists scattered across our empire, at least for a moment, disregard their long-time views of independence."
 AUH_hungarian_support: "Hungarian Support"
 AUH_hungarian_support_desc: "If we are to enter this war, and anticipate any degree of success, we require extensive support from the Hungarian side of the Empire."
 AUH_coronation: "Coronation of Charles"
 AUH_coronation_desc: "With the death of Franz Joseph, it is time to introduce the new King and Emperor, Charles I (IV)"
