 US2_naval_effort:0 "United States Naval Reorganisation"
 US2_naval_effort_desc:0 "The Navy Department aligns yards, fleets, and overseas stations for a war that may reach the Atlantic. The programme makes convoy protection and fleet readiness equal partners to battleship prestige."
