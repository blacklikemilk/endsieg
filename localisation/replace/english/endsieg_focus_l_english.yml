 TUR_naval_effort:0 "A Serviceable Ottoman Fleet"
 TUR_naval_effort_desc:0 "List serviceable ships, crews and yard capacity before seeking new naval commitments. The programme begins with a fleet the empire can keep in service."
 TUR_dreadnought:0 "The Modest Battlefleet Priority"
 TUR_dreadnought_desc:0 "Concentrate design work and crew preparation on the capital ships the empire can afford. This priority competes with the full coastal-defence programme."
 TUR_better_weaponry: "Better Weaponry"
 TUR_better_weaponry_desc: ""
