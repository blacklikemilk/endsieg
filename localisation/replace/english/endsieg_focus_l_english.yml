 GE1_shorter_training: "Shorter Training"
 GE1_shorter_training_desc: "With the war dragging on and taking more and more lives we need more men to refill the casualties so shortening training would help with that."
 GE1_war_front: "Frontline Focus I"
 GE1_war_front_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
