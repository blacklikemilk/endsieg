 GE1_improved_tac_2:0 "Develop Tactical Bombers"
 GE1_improved_tac_2_desc:0 "Standardised bomb loads and improved engines will make our bombers more dependable over the battlefield. Technical development must be matched by practical experience."
 GE1_zeppelin_service:0 "Zeppelin Army Service"
