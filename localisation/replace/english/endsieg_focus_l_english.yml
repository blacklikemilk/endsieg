 FR3_support_italian_claim: "Back Italy's Claims"
 FR3_support_italian_claim_desc: "If we support Italy's claims in the Austro-Hungarian Empire it would be very likely that they will join our side in order to get a slice of the old Empire at the peace conference."
 FR3_give_ita_savoy_corsica: "Cede Savoy and Corsica to Italy"
 FR3_give_ita_savoy_corsica_desc: "I would heavily advise against such an downplay on the power of our country but if we are to give the Italians Savoy and Corsica they would have no choice but to join the Entente."
 FR3_invite_britain: "Invite Britain"
 FR3_invite_britain_desc: "With the Germans violating the Belgian neutrality the British have no choice but to join us in this conflict!"
 FR3_britain_reinforcement: "British Reinforcements"
 FR3_britain_reinforcement_desc: "The French Army alone will not be able to hold the Western Front together which is why we need the combined French and British armies to stay in a successful defensive posture and eventually counterattack."
 FR3_invite_italy: "Invite Italy to Entente"
 FR3_invite_italy_desc: "Since Italy has accepted our offer we may now invite them into our faction"
 FR3_send_troops_serbia: "Send Reinforcements to Serbia"
 FR3_send_troops_serbia_desc: "In order to help our ally Serbia against the numerically superior forces of Austria we can send some of our troops to help hold the front line against any offensives."
 FR3_allied_blockade_greece: "Force Blockade on Greece"
 FR3_allied_blockade_greece_desc: "In order to try and force the Pro-Central Powers monarch, Constantine I, we could force a blockade on Greece which would sow dissent in the country and force Constantine to abdicate in favor of his Pro-Entente Son, Alexander."
 FR3_invite_greece: "Invite Greece"
 FR3_invite_greece_desc: "Since Constantine I has abdicated and been replaced with his Pro-Entente son we can now invite Greece into our faction."
 FR3_support_greece: "Support Greece"
 FR3_support_greece_desc: "In order to support our ally Greece on their front with the Central Powers we can send them aid in the form of weapons which they might be lacking."
 FR3_troops_greece: "Send Troops to Greece"
 FR3_troops_greece_desc: "In order to put more pressure on the Central Powers we could send in the Armee d'Orient into Greece heavily reinforcing the Greek Army making it a formiddable force combined with our troops."
 FR3_russian_reinforcement: "Request Troops from Russia"
 FR3_russian_reinforcement_desc: "Seeing as the Russian Empire has practically unlimited reserves, we could, in return for muntions, ask for several divisions to come to Western Front where we lack men and are in need of numerical superiority against the Germans."
 FR3_entente_diplomacy: "Entente Diplomacy"
 FR3_entente_diplomacy_desc: "Diplomatic actions with our allies"
 FR3_convince_romania: "Convince Romania to join Entente"
 FR3_convince_romania_desc: "We could try and convince the Kingdom of Romania to join the Entente, however the Eastern Front must be stabilizd before we do this or else the Romanians are heavily unlikely to join!"
 FR3_invite_romania: "Invite Romania"
 FR3_invite_romania_desc: "As we have succesfully managed to convince the Kingdom of Romania to join our side we can now invite them"
 FR3_diplomatic_effort: "Diplomatic Effort"
 FR3_diplomatic_effort_desc: ""
 FR3_european_diplomacy: "European Diplomacy"
 FR3_european_diplomacy_desc: ""
 FR3_anti_german_propaganda: "Anti-German Sentiment"
 FR3_anti_german_proapganda_desc: "With our humiliating defeat in the 1871 Franco-Prussian war and Germany's forceful annexation of the rightful French territory of Elsass-Lothringen we have nothing left for them but Anti-German sentiment..."
 FR3_pro_russia: "Pro-Russia Relations"
 FR3_pro_russia_desc: "Whilst the Russian Empire is in now way democratic they are still a very important ally to us against the German Empire which is now squashed in between us, as long as we are allies the Germans will not be a threat!"
 FR3_agadir_crisis: "Agadir Crisis"
 FR3_agadir_crisis_desc: "In order to expand further in Morocco we could deploy a substantial force of our troops into the interior of Morocco, however we might face a retaliation from Berlin."
 FR3_prepare_for_war: "Prepare for War"
 FR3_prepare_for_war_desc: ""
 FR3_defend_border: "Border Defenses"
 FR3_defend_border_desc: "It wouldn't hurt to fortify our border with Germany even more."
 FR3_sacred_union: "Sacred Union"
 FR3_sacred_union_desc: "The time of war is no time to be bickering about politics and drawing up dissent, we must all come together and let go of that for now."
 FR3_defend_colonies: "Colonial Defenses"
 FR3_defend_colonies_desc: "It wouldn't hurt to fortify our colonial strongholds."
 FR3_volunteers_1: "Manpower from the Colonies"
 FR3_volunteers_1_desc: "Since mainland France lacks as much manpower as the Germans can field we could always compensate with recruiting men from the colonies."
 FR3_volunteers_2: "Manpower from the Colonies"
