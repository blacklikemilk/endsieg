  # United States WWI
 US2_diplomatic_effort:0 "America across Two Oceans"
 US2_lafayette_escadrille:0 "The Lafayette Volunteers"
 US2_lafayette_escadrille_desc:0 "American volunteers seek flying service with French squadrons before their country enters the war. Arrange liaison that returns practical aviation experience without conjuring an expeditionary army."
 US2_condemn_zimmerman_telegram:0 "Expose the Zimmermann Telegram"
 US2_condemn_zimmerman_telegram_desc:0 "An intercepted German proposal offers Mexico an alliance against the United States. Publish the evidence only when Germany has actually authorised the telegram and the message has reached Washington."
 US2_send_expeditionary_force:0 "Organise the AEF in France"
 US2_send_expeditionary_force_desc:0 "American soldiers need their own command and a reception system before they can sustain a campaign in France. Establish liaison with an actual French ally while retaining American responsibility for the expeditionary army."
 US2_supply_revolutionaries:0 "A Limited Arms Consignment"
 US2_supply_revolutionaries_desc:0 "Mexican factions seek foreign supply far beyond their available funds. Release a limited consignment from American stocks only while the receiving faction still exists."
 US2_denounce_communist_state:0 "Examine the Bolshevik Government"
 US2_denounce_communist_state_desc:0 "Reports from Russia raise questions about legitimacy, property and the future of Allied commitments. Assess the new government before recognition or military involvement becomes an assumption."
 US2_political_effort:0 "The American Republic"
 US2_political_effort_desc:0 "The republic combines expanding industrial power with strong state institutions and a contested federal executive. Bring the administration and Congress into a coherent programme for the decade ahead."
 US2_industrial_effort:0 "America’s Industrial Base"
 US2_industrial_effort_desc:0 "We will measure the productive base that can sustain a national program. Federal coordination will connect workshops, railways and shipyards before emergency orders arrive."
