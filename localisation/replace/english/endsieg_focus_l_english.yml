  # Kingdom of Italy Focus Tree

 IT1_strategic_bomber_research_1:0 "Study the Caproni Ca.4"
 IT1_strategic_bomber_research_1_desc:0 "The large Caproni triplane promises greater range and load, but demands careful structural and handling trials. A technical commission will evaluate the proposal without treating a drawing as an operational squadron."
 IT1_massive_war_effort:0 "The Final National War Effort"
 IT1_massive_war_effort_desc:0 "A sustained commitment requires public finance and civilian supply. The ministries will pay those costs rather than receive unexplained reserves of men and material."
 IT1_frontline_focus_1:0 "Organise the Mobilized Front"
 IT1_frontline_focus_1_desc:0 "A field army needs clear sectors, reserve routes and headquarters which can coordinate neighboring formations. Mobilization inspections will connect front-line establishments to the railheads and depots behind them."
 IT1_frontline_focus_2:0 "The Grappa Reserve Positions"
 IT1_frontline_focus_2_desc:0 "A prepared defensive position behind the frontier gives headquarters room to recover from a dangerous penetration. Work on the Grappa approaches will establish surveyed routes and protected reserves before a retreat makes preparation impossible."
 IT1_frontline_focus_3:0 "The Grappa-Piave Defence"
 IT1_frontline_focus_3_desc:0 "The army must restore orderly relief, reserves and artillery liaison along the Grappa-Piave line. A coordinated defensive plan will connect the mountain positions to the river sectors while the formations rebuild their strength."
 IT1_democracy:0 "The Giolittian Parliamentary System"
 IT1_democracy_desc:0 "Negotiated majorities and parliamentary scrutiny can sustain the constitutional monarchy. A dependable civil government needs consultation as well as authority."
 IT1_free_speech:0 "Protect Parliamentary Debate"
 IT1_free_speech_desc:0 "Government proposals must withstand scrutiny in the chamber and the press. Open debate will strengthen the parliamentary mandate and provide political support for the work ahead."
 IT1_patriotic_fervor:0 "National Civic Mobilization"
 IT1_patriotic_fervor_desc:0 "A civic campaign can encourage support for a difficult war. Its benefit is temporary and must be backed by a government willing to pay for it."
 IT1_war_effort_part_1:0 "Authorize Wartime Administration"
 IT1_war_effort_part_1_desc:0 "Parliament must authorize the ministries' emergency purchasing and transport arrangements. The programme supports the war while recording its financial burden."
 IT1_homefront_focus_1:0 "Municipal Home-front Offices"
 IT1_homefront_focus_1_desc:0 "Local offices must handle food, fuel and military families' needs. Their work can reduce tension, but supplies must be purchased and delivered."
 IT1_homefront_focus_2:0 "Provincial Relief Networks"
 IT1_homefront_focus_2_desc:0 "Industrial towns beyond the main capitals need reliable relief. Provincial networks will record unmet needs and organize funded deliveries."
 IT1_homefront_focus_3:0 "Protect the Civilian Ration"
 IT1_homefront_focus_3_desc:0 "The army cannot absorb every remaining delivery. Funded inspections will preserve a basic civilian allocation and reduce the danger of a renewed urban crisis."
 IT1_political_effort:0 "The Statuto Albertino"
 IT1_political_effort_desc:0 "The crown, parliament and ministers share an uneasy constitutional framework. Effective government requires a clear understanding of who authorizes public commitments."
