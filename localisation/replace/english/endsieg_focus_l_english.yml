 GE1_form_airforce:0 "Form the Fliegertruppen"
 GE1_form_airforce_desc:0 "The Fliegertruppen organise form the fliegertruppen around the front's immediate demands. Pilot logs and workshop reports set the next rotation of crews, engines, and airframes."
 GE1_fliegertruppen:0 "Organise the Fliegertruppen"
 GE1_fliegertruppen_desc:0 "The flying detachments need a common organisation, trained personnel and reliable support. Bringing these services together will give the army an air arm it can depend upon."
