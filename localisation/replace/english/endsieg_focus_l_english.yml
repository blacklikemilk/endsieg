 IT1_claims_libya: "Claims on Libya"
 IT1_claims_libya_desc: "Every since the 1877 Russo-Turkish War we have publicly with the the acceptance of the other great powers set our eyes on Tripolitania."
 IT1_italo_turkish_war: "Italo-Turkish War"
 IT1_italo_turkish_war_desc: "The time has come to back what is ours from the sick man of europe, this war should be a simple military walk at most and soon the resource rich North Africa will be ours!"
 IT1_supress_senussi: "Supress the Senussi Order"
 IT1_supress_senussi_desc: "Ever since we have conquered Tripolitania the Senussi Order seperatists have been at war with us fighting as guerillas in the deserts of Tripolitania."
 IT1_establish_italian_presence: "Establish Italian Military Presence"
 IT1_establish_italian_presence_desc: "Since the transfer of Tripolitania into our hands the occupation has not exactly been easy, the people of Tripolitania are very against our rule in nature and support dissidents such as the Senussi Order which is why it is important to establish a stronger military presence to curb thes dissent in North Africa."
 IT1_prepare_for_war: "Prepare for War"
 IT1_prepare_for_war_desc: ""
 IT1_support_germany: "Support Triple Alliance"
 IT1_support_germany_desc: "Perhaps we should stick with the good old Triple Alliance, after all it is quite strategic and we still have a lot to gain."
 IT1_claim_france: "Italian Claims on France"
 IT1_claim_france_desc: "The Italian people in Corsica and Savoy ever since the French takeover have lusted over the reunification with our great nation, whislt there are many in Austria as well we can deal with their reunification later..."
 IT1_demand_tyrol: "Demand South Tyrol"
 IT1_demand_tyrol_desc: "The Central Powers obviously need us so why not try to make a deal with them to at least cede Tyrol for our pariticipation in their war."
 IT1_honor_alliance: "Honor Triple Alliance"
 IT1_honor_alliance_desc: "The time has come for us to honor the Triple Alliance and join our allies in their war."
 IT1_honor_alliance_2: "Honor Triple Alliance"
 IT1_honor_alliance_2_desc: "The Time has come for us to honor the Triple Alliance and join our allies in their war."
 IT1_neutral_stance: "Temporary Neutral Stance"
 IT1_neutral_stance_desc: "We will not be joining our 'allies' in their war of agresssion against Serbia as the Triple Alliance was meant to be defensive pact and we are not obliged to join in an offensive war.."
 IT1_deal_with_france: "London Pact"
 IT1_deal_with_france_desc: "We have formuated a secret pact between us and the Entente where the Entente has promised us large sqaths of Austria-Hungary to the North of Italy and the east across the Adriatic. The British have also promised funding."
 IT1_join_war: "Join the War"
 IT1_join_war_desc: "The time has come for Italy to join the Great War. If we achieve victory, we will unite with all Italians currently subjected by Austria-Hungary."
 IT1_entente_diplomacy: "Entente Diplomacy"
 IT1_entente_diplomacy_desc: "Improving our relations with the Entente is critical given they are our current wartime allies."
 IT1_request_allied_support: "Request Allied Support"
 IT1_request_allied_support_desc: "On our own we have been struggling lately with getting behind the war and achieving total victory, compounded with below average results from the front lines."

 # German Empire Hocus Pocus

 GE1_alternative_diplomacy: "Alternative Diplomacy"
 GE1_alternative_diplomacy_desc: "Perhaps we will be able to strike a few deals with other countries neutralizing them or bringing them into our sphere, however none of it is guaranteed."
 GE1_negotiate_sweden: "Negotiate with Sweden"
 GE1_negotiate_sweden_desc: "We can try and negotiate with Sweden offering them their former territory of Finland back if they join the war against Russia, however it is very unlikely they will accept."
 GE1_silesia_to_austria: "Offer Silesia to Austria for Italian Neutrality"
 GE1_silesia_to_austria_desc: "We can offer Silesia to Austria-Hungary where in return they will cede South Tyrol to Italy to keep them neutral in this conflict, though this is not guaranteed to work out."
 GE1_offer_bessarabia: "Offer Besserabia to Romania for Neutrality"
 GE1_offer_bessarabia_desc: "We can offer Romania the territory of Bessarabia following the collapse of Russia in order for them to keep neutral in this conflict, but this is far from guaranteed."
 GE1_invite_sweden: "Invite Sweden to Central Powers"
 GE1_invite_sweden_desc: "Since Sweden has agreed during our negotiations with them on joining the war with the terms that Finland is ceded back to them we can now officially invite them to join the Central Powers."
 GE1_zimmerman: "Zimmerman Telegram"
 GE1_zimmerman_desc: "With the United States already threatening to declare war on us due to our policy of unrestricted submarine warfare, it would beneficial if we could get Mexico on our side in the case that the United States shall directly intervene on behalf of the Entente."
 GE1_diplomatic_effort: "Diplomatic Effort"
 GE1_diplomatic_effort_desc: "Improving our diplomatic stance across Europe and the world will better prepare us for a potential future global conflict."
 GE1_mittelafrika_plan: "Mittelafrika Plan"
 GE1_mittelafrika_plan_desc: "Mittelafrika (Central Africa) articulated Germany's foreign policy aim prior to the First World War of bringing the region under German domination particularly the region between the colonies of German East Africa, South West Africa, and Cameroon, creating a contiguous entity covering the bdeath of the African continent from the Atlantic to the Indian Ocean."
 GE1_reinforce_colonies: "Reinforce Colonies"
 GE1_reinforce_colonies_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_befriend_turkey: "Befriend Turkey"
 GE1_befriend_turkey_desc: "Whilst Turkey is known as the 'Sick Man of Europe' and is largely a shell of its former self, it would still be in our benefit to befriend them and have them as an ally, their ports in particular could be quite useful to us."
 GE1_ottoman_german_alliance: "Ottoman German Alliance"
 GE1_ottoman_german_alliance_desc: "Allying Turkey would threaten British holdings in case of a war such as those in Persia which have lots of oil fields and the Suez Canal for which controls the quickest access to British India."
 GE1_befriend_jabal_shammar: "Befriend Jabal Shammar"
 GE1_befriend_jabal_Shammar: "The Emirate of Jabal Shamar whilst a weak state could still provide support against the British in the Middle East."
 GE1_invite_jabal_shammar: "Invite Jabal Shammar to Central Powers"
 GE1_invite_jabal_Shammar_desc: "It's time to bring Jabal Shammar into the Central Powers. By them joining, we can assist the Ottomans with their struggle in the Middle East and stabilise their fronts."
 GE1_berlin_baghdad_1: "Berlin-Baghdad Railway I"
 GE1_berlin_baghdad_1_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_2: "Berlin-Baghdad Railway II"
 GE1_berlin_baghdad_2_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_3: "Berlin-Baghdad Railway III"
 GE1_berlin_baghdad_3_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_4: "Berlin-Baghdad Railway IV"
 GE1_berlin_baghdad_4_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_colonial_defense: "Colonial Defense I"
 GE1_colonial_defense_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_colonial_defense_2: "Colonial Defense II"
 GE1_colonial_defense_2_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_agadir_crisis: "Agadir Crisis"
 GE1_agadir_crisis_desc: "With France persuing territorial expansion in Morocco we should in turn ask for territorial compensation for ourselves elsewhere, while this is a very risky and hostile move it is only fair we get our slice of the cake."
 GE1_prepare_for_war: "Prepare for War"
 GE1_prepare_for_war_desc: "A Great War looms on the horizon. With the advent of the Agadir crisis, our diplomats are urging our government to arm and prepare ourselves. §Y Unlocks German Warplan Decisions §!"
 GE1_rupprecht_plan: "Rupprecht Plan"
 GE1_rupprecht_plan_desc: "The Rupprecht Plan, different from the Schlieffen Plan with the fact the main swing into France would be through the neutral Switzerland versus Belgium, however it will be much harder due to the Swiss mountainous terrain. \n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_schlieffen_plan: "Schlieffen Plan"
 GE1_schlieffen_plan_desc: "The Schlieffen Plan called for an invasion of Belgium to swing past the main French fortifications on the border with Germany and quickly conquer Paris forcing a French capitulation and calling an end to the war.\n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_kronprinz_plan: "Kronprinz Plan"
 GE1_kronprinz_plan_desc: "The Kronprinz Plan was different from the Schlieffen Plan as it avoided any sort of invasion of Belgium and called for a war only against Russia and France.\n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_goeben_breslau: "The Goeben and the Breslau"
 GE1_goeben_breslau_desc: "With the SMS Goeben and SMS Breslau stuck in the Mediterranean Sea and the British Mediterranean Fleet trying to intercept them we can evade the British fleet by passing through the Dardanelles reaching Constantinople where we will hand them over to the Ottoman Empire."
 GE1_albania_negotiations: "Negotiate with Albania"
 GE1_albania_negotiations_desc: "With Prince Wilhelm of Wied being of German origin we can attempt to negotiate with him on an entrance of Albania on the side of the Central Powers despite the neutrality of Albania within the treaty of London."
 GE1_boer_revolt: "Support the Boer's"
 GE1_boer_revolt_desc: "We can support the Boer's in South Africa who are still willing to fight again and re-establish the South African Republic, thus if all goes well we will be allied with the new South African Republic and threaten British interests."
 GE1_asien_corps: "Asian Corps"
 GE1_asien_corps_desc: "We can aid our Turkish allies by sending in units to help with construction of roads and to work with Ottoman sanitary and medical units"
 GE1_advisors_turkey: "Advisors to Turkey"
 GE1_advisors_turkey_desc: "We can further aid our Turkish allies by sending military advisors to help them in their campaigns."
 GE1_befriend_bulgaria: "Befriend Bulgaria"
 GE1_befriend_bulgaria_desc: "Bulgaria is critical to our success in the Balkans. If we are to lose Buglaria to the Entente not only is victory against Serbia even more exaggerated but it could very well threaten Constantinople itself."
 GE1_invite_bulgaria: "Invite Bulgaria"
 GE1_invite_bulgaria_desc: "With Bulgaria poised to join the Central Powers, we can take the pressure off Austria-Hungary in Serbia and knock Serbia out of the war, providing desperately needed reinforcements for Austria-Hungary against Russia."
 GE1_septemberprogramme: "Septemberprogramm"
 GE1_septemberprogramme_desc: "The Septemberprogramm was a plan for territorial expansion of the German Empire at the expense of the Russian Empire, France, and Belgium. It gave insight to Germany's war aims and the scopes of its territorial expansions."
 GE1_polish_puppet: "Create Polish Puppet"
 GE1_polish_puppet_desc: "As we have conquered the area of Poland we can promise the poles a restoration in order to legitimize our military occupation and possibly in the future gather volunteers for the war effort against the entente."
 GE1_polish_volunteers: "Request Volunteers from Poland"
 GE1_polish_volunteers_desc: "As we have created a Polish Puppet State promising independence we can also request volunteers to continue our war effort"
 GE1_send_lenin: "Send Lenin"
 GE1_send_lenin_desc: "In an effort to de-stabilize Russia and knock it out of the war we can send back the exiled Vladimir Lenin who holds a great deal of influence over the communists in Russia who are calling for revolution."
 GE1_huerta_power: "Bring Back Huerta"
 GE1_huerta_power_desc: "In an attempt to get Mexico on our side it would be best to collude with Victoriano Huerta, whom has made promises should we assist him in regaining power that he will undoubtedly show his support for the Kaiser, even if it means declaring war on the United States...but who knows? Perhaps it is a bluff..."
 GE1_grain_ukraine: "Enforce a Authoritarian Regime in Ukraine"
 GE1_grain_ukraine_desc: "In an effort to better our food situation we can enforce a more authoritarian regime in Ukraine to quicken the pace of the grain deliveries."
 GE1_supply_dervish_state: "Supply Dervish State"
 GE1_supply_dervish_state_desc: "The Dervish State has long been at war with much of the Entente, particularly Britain if we were to supply them then it would distract some of the British forces."
 GE1_befriend_dervish: "Befriend Dervish State"
 GE1_befriend_dervish_desc: "Us and the Dervish State have similar enemies, for that reason why not be friends?"
 GE1_invite_dervish: "Invite Dervish State to Central Powers"
 GE1_invite_dervish_desc: "Sisnce we are fighting the same enemy we might as well officially invite the Dervish state into the Central Powers"
 GE1_political_effort: "Political Effort"
 GE1_political_effort_desc: ""
 GE1_power_to_kaiser: "Power to Kaiser"
 GE1_power_to_kaiser_desc: "If we support the Kaiser we can enact more reforms and decisions. Doing this would make keeping the Kaiser in rule easier."
 GE1_power_to_military: "Power to Military"
 GE1_power_to_military_desc: "If we support the military, we will receive several bonuses for our troops at the cost of lessening the power of the Kaiser and raising the power of the military."
 GE1_home_by_christmas: "Home by Christmas"
 GE1_home_by_christmas_desc: ""
 GE1_fund_insurrectionists_india: "Support Indian Independence"
 GE1_fund_insurrectionists_india_desc: "Whilst a very daring and big plot if it managed to turn out as planned the British could see an armed insurrection within India which would provide a huge backhand blow."
 GE1_befriend_afgahnistan: "Befriend Afgahnistan"
 GE1_befriend_afgahnistan_desc: "Afgahnistan could provide as a good base to invade India from should they later agree to an alliance"
 GE1_negotiate_afgahnistan: "Negotiate with Afgahnistan"
 GE1_negotiate_afgahnistan_desc: "However unlikely it is based on the fact that the Afgah Emir is payed by the British themselves, if we are to throw out a deal based territorial gains in India and the Afgahn Emir were to agree we could strike a significant and the Afgahn attack would serve as a thorn in the back of British India diverting troops and resources."
 GE1_continue_unrestricted_sub: "Resume Unrestricted Submarine Warfare"
 GE1_continue_unrestricted_sub_desc: "Despite facing a possibility of going to war with the United States the general staff have said that it if we are to win this war we must resume unestricted submarine warfare, saying that U.S. intervention if it should happen won't be a threat because it will take too long for the Americans to get involved and by then we would have won."
 GE1_industrial_effort: "Industrial Effort"
 GE1_industrial_effort_desc: "Our Empire has already become the strongest power in the region, and further industrialisation will increase our chances of winning a future war."
 GE1_infrastructure_effort_1: "Infrastructure Effort I"
 GE1_infrastructure_effort_1_desc: "Infrastructure is critical to our country, as our territory stretches from Metz to Memel. Larger than most other countries in Europe, having extensive infrastructure will improve standards of living while compounding the effectiveness of our rapid mobilisation in the Schliffen Plan."
 GE1_infrastructure_effort_2: "Infrastructure Effort II"
 GE1_infrastructure_effort_2_desc: "Further development of our infrastructure will help decrease unemployment in our Empire while also providing a better standard of living for our citizens."
 GE1_infrastructure_effort_3: "Infrastructure Effort III"
 GE1_infrastructure_effort_3_desc: "Continuing to improve our infrastructure will no doubt place us as the foremost power, both economically and military in not just Europe, but perhaps the whole world."
