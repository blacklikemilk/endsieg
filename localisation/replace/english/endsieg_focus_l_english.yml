 IT1_ww1_reconstruction_industry_bonus:0 "Reconstruction Industry Studies"

 GE1_I_industrial_foundation:0 "A Reich Industrial Programme"
 GE1_I_industrial_foundation_desc:0 "The industrial districts must share standards, surveys and transport planning. Scientific research and commercial investment will build the foundation for a sustained national programme."
 GE1_I_rhine_ruhr_mills:0 "Rhine and Ruhr Mills"
 GE1_I_rhine_ruhr_mills_desc:0 "Ruhr coal and steel feed the machine works along the Rhine and Westphalia. A carefully guarded expansion in the Ruhr gives civilian production a physical base without conjuring factories beyond the state map."
 GE1_I_silesian_coal:0 "Silesian Coal and Power"
 GE1_I_silesian_coal_desc:0 "Upper and Lower Silesian mines supply coal, steel and power to the eastern industrial belt. Better local transport keeps those inputs moving when mobilization trains begin competing for every wagon."
 GE1_I_prewar_export_economy:0 "The Export Economy"
 GE1_I_prewar_export_economy_desc:0 "Export houses and overseas contracts helped build Germany's machine industry before 1914. Preserving their credit networks gives Berlin a route between civilian modernization and the demands of mobilization."
 GE1_I_electrical_network:0 "The Electrical Network"
 GE1_I_electrical_network_desc:0 "Electrical firms and municipal grids can share generators, standards and trained engineers. Coordinated investment turns a collection of local systems into dependable industrial infrastructure."
 GE1_I_chemical_cartels:0 "Chemical Cartels"
 GE1_I_chemical_cartels_desc:0 "The chemical firms already share laboratories, patents and purchasing arrangements. A national programme can use that cooperation for civilian fertilizers and strategic materials while retaining the research base."
 GE1_I_haber_bosch:0 "Haber-Bosch Ammonia"
 GE1_I_haber_bosch_desc:0 "Synthetic ammonia reduces dependence on imported nitrates and anchors German chemistry in a process that can be scaled at home. The Haber-Bosch works are a research achievement first and a wartime substitute only when supplies demand it."
 GE1_I_machine_tool_shops:0 "Machine Tool Shops"
 GE1_I_machine_tool_shops_desc:0 "German export lathes and precision tools can give smaller workshops access to reliable equipment. Machine shops in turn broaden the civilian base that armament contracts will later draw upon."
 GE1_I_skilled_labor_reserve:0 "A Skilled Labour Reserve"
 GE1_I_skilled_labor_reserve_desc:0 "Technical schools and protected trades preserve skills that cannot be replaced by a short draft exemption. Their graduates keep machine tools, rail workshops and chemical plants operating as the army expands."
 GE1_I_rail_freight_coordination:0 "Rail Freight Coordination"
 GE1_I_rail_freight_coordination_desc:0 "Coal, steel, food and military stores all compete for the same railway capacity. A common freight schedule gives the civilian economy a voice in mobilization planning and makes the later supply decisions credible."
 GE1_I_mobilisation_credit:0 "Mobilisation Credit"
 GE1_I_mobilisation_credit_desc:0 "The banks can finance the first orders, but credit must remain tied to signed contracts and available inputs. Mobilization borrowing becomes useful only when it connects treasury promises to machines already in production."
 GE1_I_allocation_commissions:0 "Allocation Commissions"
 GE1_I_allocation_commissions_desc:0 "Inspection and allocation offices can stop ministries and firms bidding for the same coal, metals and machine tools. Their paperwork is slow, but it prevents a shortage in one plant from becoming a shutdown across the chain."
 GE1_I_war_corporations:0 "War Corporations"
 GE1_I_war_corporations_desc:0 "Large firms receive shell and equipment orders on a scale their peacetime boards have never administered. Delivery schedules and public accounts must keep this concentration of private industry serving the war rather than simply consuming the next emergency appropriation."
 GE1_I_fuse_standardisation:0 "Fuse Standardisation"
 GE1_I_fuse_standardisation_desc:0 "Common fuses, gauges and inspection rules make artillery supply more dependable. Standard parts reduce waste at the front and let civilian precision shops join military production without rebuilding every tool."
 GE1_I_substitute_chemistry:0 "Substitute Chemistry"
 GE1_I_substitute_chemistry_desc:0 "Synthetic processes can replace selected imported materials, but each substitute needs engineers, feedstock and time. Research funding therefore favors practical plant methods instead of promising that every shortage can disappear."
 GE1_I_substitute_fibres:0 "Substitute Fibres"
 GE1_I_substitute_fibres_desc:0 "Domestic fibres and improved spinning methods ease pressure on imported textiles and uniforms. The programme supports the textile workshops that remain tied to civilian clothing as well as military cloth."
 GE1_I_food_rations_supply:0 "Food Ration Supply"
 GE1_I_food_rations_supply_desc:0 "Ration offices protect the urban workforce while the army and civilian authorities share limited stocks. Keeping workers fed is an industrial decision as much as a home-front concession."
 GE1_I_neutral_import_channels:0 "Neutral Import Channels"
 GE1_I_neutral_import_channels_desc:0 "Carefully financed trade through neutral markets preserves inputs that domestic chemistry cannot yet provide. The credit cost is deliberate: every shipment must compete with wartime procurement for scarce foreign exchange."
 GE1_I_coal_bottlenecks:0 "Relieve Coal Bottlenecks"
 GE1_I_coal_bottlenecks_desc:0 "Coal directors and railway offices must target the points where fuel shortages stop entire production chains. The directorate favors measured infrastructure and excavation research over an abstract promise of unlimited output."
 GE1_I_industry_reorganisation:0 "Reorganise Industry"
 GE1_I_industry_reorganisation_desc:0 "A permanent industrial office can turn emergency coordination into a more efficient civilian and military system. Reorganisation keeps the useful parts of wartime planning while preparing firms for a postwar order."
 GE1_I_output_acceleration:0 "Emergency Output Targets"
 GE1_I_output_acceleration_desc:0 "The Hindenburg contracts will be fulfilled through longer shifts and immediate output targets. This programme favours the next campaign over the gradual development of a skilled industrial workforce."
 GE1_I_skilled_worker_protection:0 "Protect the Skilled Workforce"
 GE1_I_skilled_worker_protection_desc:0 "Experienced workers will remain in the factories and train their replacements. This programme sacrifices rapid induction in order to preserve dependable production throughout a long war."
 GE1_I_worker_shortage:0 "Address the Worker Shortage"
 GE1_I_worker_shortage_desc:0 "Labour offices, retraining and limited exemptions can keep critical plants staffed. The focus improves the information available to ministries rather than inventing manpower or equipment."
 GE1_I_recovery_workshops:0 "Rebuild the Industrial Workshops"
 GE1_I_recovery_workshops_desc:0 "Either emergency output or protected labour can leave exhausted workshops behind. The next development programme will restore their machinery before the civilian economy is converted."
 GE1_A_general_staff:0 "Reform the Großer Generalstab"
 GE1_A_general_staff_desc:0 "German Army planners place reform the großer generalstab in the mobilisation tables and corps manuals. Depot returns and field reports determine how the measure reaches the next formation."
