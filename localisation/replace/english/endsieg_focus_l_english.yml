 IT1_homefront: "Homefront Focus I"
 IT1_homefront_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_homefront_2: "Homefront Focus II"
 IT1_homefront_2_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_homefront_3: "Homefront Focus III"
 IT1_homefront_3_desc: "Choosing to focus on the homefront means gaining more stability within your country instead of war support."
 IT1_shorter_training: "Shorter Training"
 IT1_shorter_training_desc: "With the war dragging on and taking more and more lives we need more men to refill the casualties so shortening training would help with that."
 IT1_war_front: "Frontline Focus I"
 IT1_war_front_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_war_front_2: "Frontline Focus II"
 IT1_war_front_2_desC: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_war_front_3: "Frontline Focus III"
 IT1_war_front_3_desc: "Choosing to focus on the frontline means gaining more war support but losing stability on the homefront."
 IT1_army_effort:0 "The Regio Esercito"
 IT1_army_effort_desc:0 "The Royal Army draws recruits from every region of a still young kingdom. Its training, reserve system and supply arrangements must make those men a dependable field army before a European crisis puts mobilization to the test."
 IT1_trench_warfare:0 "Engineer the Field Positions"
 IT1_trench_warfare_desc:0 "Rocky slopes and exposed valleys punish hastily dug positions. Army engineers will standardize drainage, covered communications and protected shelters so that divisions can hold ground through bombardment and bad weather."
 IT1_gas_mask_1:0 "Issue Protective Respirators"
 IT1_gas_mask_1_desc:0 "Chemical warfare makes reliable protective equipment an urgent requirement. Medical officers will supervise fitting and inspection while regimental instructors teach the alarms and procedures needed to use it."
 IT1_gas_mask_2:0 "Regimental Gas-Defence Schools"
 IT1_gas_mask_2_desc:0 "A respirator is useful only when a soldier recognizes the danger in time. Specialist instructors will rehearse gas alarms, filter changes and the evacuation of casualties under the conditions found at the front."
 IT1_gas_mask_3:0 "Inspect the Filter Reserves"
 IT1_gas_mask_3_desc:0 "Long service damages masks and exhausts filters. A regular inspection system will maintain replacement stocks and prevent worn equipment from leaving veteran units exposed during another campaigning season."
 IT1_equipment_effort_1:0 "The Carcano Rifle System"
 IT1_equipment_effort_1_desc:0 "The Carcano rifle is familiar to our infantry and armourers. Consistent inspection, ammunition standards and repair tools will make the existing system easier to support as reserve formations expand."
 IT1_equipment_effort_2:0 "Fiat-Revelli Machine-Gun Teams"
 IT1_equipment_effort_2_desc:0 "The Fiat-Revelli gun demands trained crews and careful maintenance. Regimental machine-gun sections will practice ammunition supply, transport and interlocking fire before the weapon is asked to support an advance."
 IT1_equipment_effort_3:0 "Villar Perosa Field Trials"
 IT1_equipment_effort_3_desc:0 "The Villar Perosa offers a high volume of close-range fire, but its tactical role requires practical trials. Infantry instructors will evaluate portable mountings and suitable employment without treating it as a substitute for every heavier gun."
 IT1_equipment_effort_4:0 "Carbines and Assault Equipment"
 IT1_equipment_effort_4_desc:0 "Assault sections need compact carbines, grenades and reliable field repairs. Procurement officers will adapt existing arms and compare new designs, directing orders toward equipment which small teams can carry through broken positions."
 IT1_artillery_effort_1:0 "Cannone da 75 Contracts"
 IT1_artillery_effort_1_desc:0 "Modern field guns need dependable ammunition as much as dependable barrels. Coordinated contracts for the 75 mm batteries will improve maintenance and supply while the army prepares a larger mobilized artillery establishment."
 IT1_artillery_effort_2:0 "The Heavy Howitzer Parks"
 IT1_artillery_effort_2_desc:0 "Fortified ridges and protected trenches require high-angle fire beyond the reach of ordinary field pieces. The army will organize heavy howitzer parks with the transport, survey teams and ammunition columns needed to bring their fire to the right sector."
 IT1_artillery_effort_3:0 "Bombarde for the Wire"
 IT1_artillery_effort_3_desc:0 "Short-range bombarde can open obstacles which shelter enemy infantry from direct fire. Specialized crews will learn to concentrate their bombardment and move the weapons forward without abandoning their ammunition supply."
 IT1_artillery_effort_4:0 "Surveyed Battery Fire"
 IT1_artillery_effort_4_desc:0 "Accurate survey work allows batteries to join a fire plan without revealing every position through repeated ranging. Observation teams and artillery schools will establish common target reporting and fire tables for the whole front."
 IT1_tactics_1:0 "Staff Rides Along the Frontier"
 IT1_tactics_1_desc:0 "Maps do not show every obstruction to a marching column or supply train. Staff rides will test mobilization assumptions against the roads, valleys and railheads which an army must actually use."
 IT1_tactics_2:0 "Learn from the Libyan Campaign"
 IT1_tactics_2_desc:0 "The Libyan fighting exposes the distance between a landing plan and sustained operations inland. Staff officers will collect lessons on reconnaissance, communications and supply, applying them to future expeditions without assuming the same enemy or terrain."
 IT1_tactics_3:0 "Combined Arms on Broken Ground"
 IT1_tactics_3_desc:0 "Infantry, engineers and artillery must prepare one plan rather than arrive at separate timetables. Battalion exercises will practice liaison and limited objectives on terrain which denies commanders an easy view of the whole battle."
 IT1_tactics_4:0 "An Army Lessons Bureau"
 IT1_tactics_4_desc:0 "Experience disappears when casualties and transfers scatter the officers who earned it. A permanent lessons bureau will turn reports from the front into practical instructions for schools, replacement drafts and serving formations."
 IT1_form_airforce:0 "The Military Air Service"
 IT1_form_airforce_desc:0 "Our military balloon detachments and early flying experiments need a permanent foundation. The air service will connect pilots, observers and mechanics to the the information requirements of the army as powered aircraft enter military use."
 IT1_bomber_focus:0 "Bombs from Observation Aircraft"
 IT1_bomber_focus_desc:0 "Aircraft can strike small targets beyond the reach of a patrol, but improvised bomb loads create practical hazards. Controlled trials will develop release procedures and mounts while observation remains the the principal task of the crews."
 IT1_fighter_focus:0 "Create the Fighter Squadrons"
 IT1_fighter_focus_desc:0 "Observation aircraft need protection against increasingly capable enemy patrols. Dedicated fighter squadrons will develop interception and escort methods while the technical service evaluates suitable weapons and airframes."
 IT1_fighter_1:0 "Macchi-Nieuport Licence Production"
 IT1_fighter_1_desc:0 "Licensed Nieuport production gives the Macchi works a tested fighter design. Common acceptance procedures will connect factory output to the needs of squadron mechanics, reducing delays caused by unsuitable fittings or inconsistent parts."
 IT1_fighter_2:0 "SPAD Service and Maintenance"
 IT1_fighter_2_desc:0 "The SPAD brings new demands on engines, handling and field repair. Training and workshop preparation will allow fighter units to exploit its capabilities without leaving serviceable aircraft grounded for lack of familiar mechanics."
 IT1_fighter_3:0 "Develop the Ansaldo SVA"
 IT1_fighter_3_desc:0 "The fast Ansaldo SVA offers particular promise for reconnaissance over long routes. Service trials will assess visibility, navigation and handling under operational loads, allowing the air service to develop its role from practical results."
 IT1_aviation_effort_1:0 "Lessons from the Libyan Air Detachment"
 IT1_aviation_effort_1_desc:0 "The first wartime air detachments demonstrate both the promise and limitations of aircraft. Their reports will guide reconnaissance procedures, field maintenance and the communication of observations to commanders on the ground."
 IT1_pilot_training_1:0 "The Italian Military Flying Schools"
 IT1_pilot_training_1_desc:0 "Elementary flying instruction must provide a safe and common foundation for new pilots. A coordinated school programme will connect navigation, aircraft handling and mechanic training before crews are sent to operational units."
 IT1_aviation_effort_2:0 "Organise the Corpo Aeronautico"
 IT1_aviation_effort_2_desc:0 "A permanent aviation corps will give the growing service clear establishments and technical responsibilities. Headquarters must distinguish shortages of aircraft from shortages of engines, mechanics or trained crews before allocating its orders."
 IT1_pilot_training_2:0 "Combat Instruction at the Rear Schools"
 IT1_pilot_training_2_desc:0 "Experienced pilots can teach lessons which elementary training cannot reproduce. Rear schools will develop formation discipline, gunnery and evasive flying, passing practical knowledge to crews before their first front-line mission."
 IT1_tactical_bomber_1:0 "Caproni Trimotor Contracts"
 IT1_tactical_bomber_1_desc:0 "The Caproni trimotor offers a practical foundation for a dedicated bombing force. Acceptance tests will examine engine reliability, load handling and crew coordination before expanding orders place further demands on the aircraft workshops."
 IT1_tactical_bomber_2:0 "The Caproni Ca.3 Squadrons"
 IT1_tactical_bomber_2_desc:0 "The latest Caproni machines need trained crews and a dependable ground organization. Technical officers will refine their fittings and service routines while the squadrons develop formation bombing and mutual support."
 IT1_tactical_bomber_3:0 "Standardise the Caproni Bombing Force"
 IT1_tactical_bomber_3_desc:0 "A larger bombing establishment cannot depend on individual workshop improvisation. Common acceptance standards and spare-part records will help the Caproni squadrons sustain their missions as crews and aircraft wear out."
 IT1_strategic_bomber_research: "Strategic Bomber Research"
 IT1_strategic_bomber_research_desc: ""
 IT1_strat_bomber_1:0 "Heavy Bomber Crew Trials"
 IT1_strat_bomber_1_desc:0 "Large aircraft require crews able to coordinate engines, navigation, defensive fire and bomb release. An experimental training detachment will develop those procedures before headquarters expands the heavy-bomber programme."
 IT1_improved_tac_1:0 "Caproni Bomb Sights and Loading"
 IT1_improved_tac_1_desc:0 "Bombing crews need consistent sights, racks and loading instructions. Technical officers will compare field results with test flights, improving release accuracy and reducing the maintenance burden imposed by improvised fittings."
 IT1_improved_tac_2:0 "The Night Navigation Courses"
 IT1_improved_tac_2_desc:0 "Night missions demand preparation beyond ordinary daylight flying. Dedicated courses will practice navigation, rendezvous and safe landing procedures, giving the bombing force a more reliable method for operating over long routes."
 IT1_improved_fighter_1:0 "Synchronised Armament Workshops"
 IT1_improved_fighter_1_desc:0 "Reliable gun synchronization requires exact workshop practice and careful inspection. Specialist armament teams will standardize adjustment and testing across the licensed and domestic fighters entering Italian service."
 IT1_improved_fighter_2:0 "Ansaldo Fighter Acceptance Trials"
 IT1_improved_fighter_2_desc:0 "Domestic fighter proposals must prove themselves under squadron conditions. Acceptance teams will compare armament, cooling and handling, identifying useful improvements without promising formations a machine before it is ready."
 IT1_cas_research:0 "Infantry Contact Flights"
 IT1_cas_research_desc:0 "The army needs prompt information on the progress of its own troops as well as distant reconnaissance. Contact flights will rehearse signals, message delivery and the identification of forward positions in confused fighting."
 IT1_cas_2:0 "Battlefield Support Experiments"
 IT1_cas_2_desc:0 "Flying low over the battlefield brings aircraft within range of ground weapons. Limited trials will test small bomb loads and attack routes while commanders establish realistic objectives for supporting infantry in close combat."
 IT1_anglo_german: "Anglo-German Naval Race"
 IT1_anglo_german_desc: ""
 IT1_tirpitz_expands_fleet: "Tirpitz Expansion"
 IT1_tirpitz_expands_fleet_desc: ""
 IT1_kaiser_expands_fleet: "Kaiser Expansion"
 IT1_kaiser_expands_fleet_desc: ""
 IT1_submarine_theory:0 "The Laurenti Submarine Designs"
 IT1_submarine_theory_desc:0 "Italian submarine development offers ways to challenge enemy traffic without matching every surface squadron. Trials will examine endurance, machinery reliability and safe operation before the navy expands orders for these specialized vessels."
 IT1_submarine_effort:0 "The F-Class Submarine Service"
 IT1_submarine_effort_desc:0 "The next submarine series needs crews and workshops prepared for sustained operations. A common technical programme will connect design improvements to patrol experience and the maintenance demands of the submarine flotillas."
 IT1_naval_effort:0 "The Regia Marina"
 IT1_naval_effort_desc:0 "The Royal Navy guards a long coastline and the sea routes on which Italy depends. Training and command arrangements must turn its varied squadrons into a fleet able to protect trade and respond to a Mediterranean crisis."
 IT1_dreadnought:0 "The Dante Alighieri Programme"
 IT1_dreadnought_desc:0 "Dante Alighieri marks our entry into the dreadnought era. The fleet technical service will consolidate experience with a uniform heavy battery, machinery and hull arrangements before larger orders consume still more of the naval budget."
 IT1_better_weaponry:0 "Naval Gunnery and Fire Control"
 IT1_better_weaponry_desc:0 "A heavy battery is effective only when range finding, ammunition handling and fire orders work together. Gunnery schools and technical workshops will refine common procedures for the modern ships entering service."
 IT1_BB_effort:0 "The Cavour and Duilio Squadrons"
 IT1_BB_effort_desc:0 "The Cavour and Duilio classes commit large sums and skilled labour to our battle fleet. Technical officers will compare their service experience, refining heavy-hull arrangements while headquarters reckon with the costs of keeping capital ships ready."
 IT1_cruiser_effort:0 "Esploratori for the Fleet"
 IT1_cruiser_effort_desc:0 "Fast scouts give the battle fleet information and a force suited to limited operations. Cruiser development will emphasize reliable machinery, scouting endurance and the coordination needed to return with useful reports."
 IT1_unrestricted_sub: "Unrestricted Submarine Warfare"
 IT1_unrestricted_sub_desc: ""
 IT1_destroyer_effort:0 "Indomito and Pilo Destroyers"
 IT1_destroyer_effort_desc:0 "Destroyers must combine reconnaissance, escort and torpedo attack in crowded coastal waters. Development work will emphasize dependable engines and coordinated flotilla tactics for the Indomito and Pilo generation of light forces."
 IT1_battle_cruiser_effort:0 "Fast Squadron Exercises"
 IT1_battle_cruiser_effort_desc:0 "Speed is useful only when squadrons can concentrate and withdraw in good order. Cruiser and destroyer commanders will practice rendezvous, mutual support and screened approaches before the fleet commits them to a hazardous operation."
 IT1_european_diplomacy:0 "The European Balance"
 IT1_european_diplomacy_desc:0 "Italy cannot treat continental and maritime security as separate questions. Our diplomats will examine the terms offered by competing great powers."
 IT1_imperial_ambitions:0 "The Ministry of Colonial Affairs"
 IT1_imperial_ambitions_desc:0 "Libya, Eritrea and Somalia confront the kingdom with different needs. Colonial policy must be supported by shipping, civil administration and a budget."
 IT1_dockyard_1:0 "The Genoa Shipbuilding Contracts"
 IT1_dockyard_1_desc:0 "The yards around Genoa combine skilled labour with an established marine engineering industry. Additional naval contracts will expand useful construction capacity while technical officers enforce the standards required by the fleet."
 IT1_dockyard_2:0 "Modernise the La Spezia Arsenal"
 IT1_dockyard_2_desc:0 "La Spezia is central to naval construction and maintenance. Investment in its arsenal workshops will support major repairs and improve the capacity available for ships already committed to the naval programme."
 IT1_dockyard_3:0 "Castellammare Naval Workshops"
 IT1_dockyard_3_desc:0 "The yards near Naples bring valuable construction and repair experience to the fleet. Enlarged workshop capacity will spread naval orders across the kingdom and shorten the maintenance burden carried by the northern arsenals."
 IT1_dockyard_4:0 "The Taranto Arsenal"
 IT1_dockyard_4_desc:0 "Taranto offers a major base close to the lower Adriatic and the central Mediterranean. Expanded arsenal capacity will help sustain the fleet and its light forces without requiring every repair to be undertaken on the northern coast."
 IT1_claims_libya:0 "The Libyan Question"
 IT1_claims_libya_desc:0 "Italy claims a sphere of influence across Tripolitania and Cyrenaica. Formal claims strengthen a diplomatic demand but do not transfer Ottoman territory."
 IT1_italo_turkish_war:0 "The Italo-Turkish Expedition"
 IT1_italo_turkish_war_desc:0 "The government will commit to a limited Libyan expedition. A declaration of war opens the campaign; occupation and a negotiated treaty must settle its outcome."
 IT1_supress_senussi:0 "The Senussi Security Campaign"
 IT1_supress_senussi_desc:0 "The government can attempt to suppress armed resistance through a funded security programme. This does not annex an independent Senussi state or erase local opposition by decree."
 IT1_establish_italian_presence:0 "Administer the Libyan Coast"
 IT1_establish_italian_presence_desc:0 "The treaty leaves Italy responsible for governing its coastal holdings. Civil staff and local services must replace an administration based only on military occupation."
 IT1_prepare_for_war:0 "Approve Military Preparations"
 IT1_prepare_for_war_desc:0 "Diplomacy needs a credible military foundation. Mobilization planning will coordinate transport and procurement without producing an army from nothing."
 IT1_support_germany:0 "Talks with Berlin"
 IT1_support_germany_desc:0 "The German alliance remains a possible foundation for our security. Diplomatic contacts will test its value without committing Italy to war."
 IT1_claim_france:0 "The French Irredentist Programme"
 IT1_claim_france_desc:0 "A Central Powers Italy can claim Corsica, Savoy and the French Alpine frontier. Claims strengthen a war aim; they do not establish cores or transfer foreign land."
 IT1_demand_tyrol:0 "Negotiate the Trentino Compensation"
 IT1_demand_tyrol_desc:0 "Territorial compensation may make continued cooperation with Vienna acceptable. The Austrian government must consent and actually own the provinces concerned."
 IT1_honor_alliance:0 "Negotiate the Triple Alliance Commitment"
 IT1_honor_alliance_desc:0 "Berlin must reply to an Italian offer of cooperation. An accepted agreement brings actual faction membership, while refusal leaves other diplomatic options open."
 IT1_honor_alliance_2:0 "Execute the Alliance War Pledge"
 IT1_honor_alliance_2_desc:0 "After Berlin accepts our membership, the government can enter Germany's existing wars against France and Imperial Russia. This is a military commitment, not another invitation."
 IT1_neutral_stance:0 "The Defensive Alliance Argument"
 IT1_neutral_stance_desc:0 "The Triple Alliance does not oblige Italy to join every offensive war. A neutral stance allows consultation while the government examines its choices."
 IT1_deal_with_france:0 "Negotiate the Treaty of London"
 IT1_deal_with_france_desc:0 "Territorial promises and access to supplies can bring Italy closer to the Entente. France must accept the offer before Italy can make its military commitment."
 IT1_join_war:0 "Enter the War against Austria-Hungary"
 IT1_join_war_desc:0 "An accepted Entente agreement permits Italy to enter the war on the Austrian frontier. Existing neutrality pledges and a Central Powers commitment block this choice."
 IT1_entente_diplomacy:0 "Permanent Entente Liaison"
 IT1_entente_diplomacy_desc:0 "The ministries must organize contact with allies once Italy has entered their faction. Liaison will support paid supply requests and common operational planning."
 IT1_request_allied_support:0 "Request Allied Equipment Support"
 IT1_request_allied_support_desc:0 "A request to France asks for equipment from an actual stockpile. The donor may decline; acceptance carries a real material cost instead of spawning duplicate divisions."

 # German Empire Hocus Pocus

 GE1_alternative_diplomacy: "Alternative Diplomacy"
 GE1_alternative_diplomacy_desc: "Perhaps we will be able to strike a few deals with other countries neutralizing them or bringing them into our sphere, however none of it is guaranteed."
 GE1_negotiate_sweden: "Negotiate with Sweden"
 GE1_negotiate_sweden_desc: "We can try and negotiate with Sweden offering them their former territory of Finland back if they join the war against Russia, however it is very unlikely they will accept."
 GE1_silesia_to_austria: "Offer Silesia to Austria for Italian Neutrality"
 GE1_silesia_to_austria_desc: "We can offer Silesia to Austria-Hungary where in return they will cede South Tyrol to Italy to keep them neutral in this conflict, though this is not guaranteed to work out."
 GE1_offer_bessarabia: "Offer Besserabia to Romania for Neutrality"
 GE1_offer_bessarabia_desc: "We can offer Romania the territory of Bessarabia following the collapse of Russia in order for them to keep neutral in this conflict, but this is far from guaranteed."
 GE1_invite_sweden: "Invite Sweden to Central Powers"
 GE1_invite_sweden_desc: "Since Sweden has agreed during our negotiations with them on joining the war with the terms that Finland is ceded back to them we can now officially invite them to join the Central Powers."
 GE1_zimmerman: "Zimmerman Telegram"
 GE1_zimmerman_desc: "With the United States already threatening to declare war on us due to our policy of unrestricted submarine warfare, it would beneficial if we could get Mexico on our side in the case that the United States shall directly intervene on behalf of the Entente."
 GE1_diplomatic_effort: "Diplomatic Effort"
 GE1_diplomatic_effort_desc: "Improving our diplomatic stance across Europe and the world will better prepare us for a potential future global conflict."
 GE1_mittelafrika_plan: "Mittelafrika Plan"
 GE1_mittelafrika_plan_desc: "Mittelafrika (Central Africa) articulated Germany's foreign policy aim prior to the First World War of bringing the region under German domination particularly the region between the colonies of German East Africa, South West Africa, and Cameroon, creating a contiguous entity covering the bdeath of the African continent from the Atlantic to the Indian Ocean."
 GE1_reinforce_colonies: "Reinforce Colonies"
 GE1_reinforce_colonies_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_befriend_turkey: "Befriend Turkey"
 GE1_befriend_turkey_desc: "Whilst Turkey is known as the 'Sick Man of Europe' and is largely a shell of its former self, it would still be in our benefit to befriend them and have them as an ally, their ports in particular could be quite useful to us."
 GE1_ottoman_german_alliance: "Ottoman German Alliance"
 GE1_ottoman_german_alliance_desc: "Allying Turkey would threaten British holdings in case of a war such as those in Persia which have lots of oil fields and the Suez Canal for which controls the quickest access to British India."
 GE1_befriend_jabal_shammar: "Befriend Jabal Shammar"
 GE1_befriend_jabal_Shammar: "The Emirate of Jabal Shamar whilst a weak state could still provide support against the British in the Middle East."
 GE1_invite_jabal_shammar: "Invite Jabal Shammar to Central Powers"
 GE1_invite_jabal_Shammar_desc: "It's time to bring Jabal Shammar into the Central Powers. By them joining, we can assist the Ottomans with their struggle in the Middle East and stabilise their fronts."
 GE1_berlin_baghdad_1: "Berlin-Baghdad Railway I"
 GE1_berlin_baghdad_1_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_2: "Berlin-Baghdad Railway II"
 GE1_berlin_baghdad_2_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_3: "Berlin-Baghdad Railway III"
 GE1_berlin_baghdad_3_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_berlin_baghdad_4: "Berlin-Baghdad Railway IV"
 GE1_berlin_baghdad_4_desc: "The Berlin-Baghdad Railway if completed would allow us to establish a port on the Persian Gulf and thus avoid the Suez canal to access the eastern parts of our colonial empire whilst also increasing Turkish influence and infrastructure."
 GE1_colonial_defense: "Colonial Defense I"
 GE1_colonial_defense_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_colonial_defense_2: "Colonial Defense II"
 GE1_colonial_defense_2_desc: "We should try to reinforce and better fortify the colonies should a conflict break out."
 GE1_agadir_crisis: "Agadir Crisis"
 GE1_agadir_crisis_desc: "With France persuing territorial expansion in Morocco we should in turn ask for territorial compensation for ourselves elsewhere, while this is a very risky and hostile move it is only fair we get our slice of the cake."
 GE1_prepare_for_war: "Prepare for War"
 GE1_prepare_for_war_desc: "A Great War looms on the horizon. With the advent of the Agadir crisis, our diplomats are urging our government to arm and prepare ourselves. §Y Unlocks German Warplan Decisions §!"
 GE1_rupprecht_plan: "Rupprecht Plan"
 GE1_rupprecht_plan_desc: "The Rupprecht Plan, different from the Schlieffen Plan with the fact the main swing into France would be through the neutral Switzerland versus Belgium, however it will be much harder due to the Swiss mountainous terrain. \n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_schlieffen_plan: "Schlieffen Plan"
 GE1_schlieffen_plan_desc: "The Schlieffen Plan called for an invasion of Belgium to swing past the main French fortifications on the border with Germany and quickly conquer Paris forcing a French capitulation and calling an end to the war.\n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_kronprinz_plan: "Kronprinz Plan"
 GE1_kronprinz_plan_desc: "The Kronprinz Plan was different from the Schlieffen Plan as it avoided any sort of invasion of Belgium and called for a war only against Russia and France.\n §RThis focus can be taken through event after you are at war with France.§!"
 GE1_goeben_breslau: "The Goeben and the Breslau"
 GE1_goeben_breslau_desc: "With the SMS Goeben and SMS Breslau stuck in the Mediterranean Sea and the British Mediterranean Fleet trying to intercept them we can evade the British fleet by passing through the Dardanelles reaching Constantinople where we will hand them over to the Ottoman Empire."
 GE1_albania_negotiations: "Negotiate with Albania"
 GE1_albania_negotiations_desc: "With Prince Wilhelm of Wied being of German origin we can attempt to negotiate with him on an entrance of Albania on the side of the Central Powers despite the neutrality of Albania within the treaty of London."
 GE1_boer_revolt: "Support the Boer's"
 GE1_boer_revolt_desc: "We can support the Boer's in South Africa who are still willing to fight again and re-establish the South African Republic, thus if all goes well we will be allied with the new South African Republic and threaten British interests."
 GE1_asien_corps: "Asian Corps"
 GE1_asien_corps_desc: "We can aid our Turkish allies by sending in units to help with construction of roads and to work with Ottoman sanitary and medical units"
 GE1_advisors_turkey: "Advisors to Turkey"
 GE1_advisors_turkey_desc: "We can further aid our Turkish allies by sending military advisors to help them in their campaigns."
 GE1_befriend_bulgaria: "Befriend Bulgaria"
 GE1_befriend_bulgaria_desc: "Bulgaria is critical to our success in the Balkans. If we are to lose Buglaria to the Entente not only is victory against Serbia even more exaggerated but it could very well threaten Constantinople itself."
 GE1_invite_bulgaria: "Invite Bulgaria"
 GE1_invite_bulgaria_desc: "With Bulgaria poised to join the Central Powers, we can take the pressure off Austria-Hungary in Serbia and knock Serbia out of the war, providing desperately needed reinforcements for Austria-Hungary against Russia."
 GE1_septemberprogramme: "Septemberprogramm"
 GE1_septemberprogramme_desc: "The Septemberprogramm was a plan for territorial expansion of the German Empire at the expense of the Russian Empire, France, and Belgium. It gave insight to Germany's war aims and the scopes of its territorial expansions."
 GE1_polish_puppet: "Create Polish Puppet"
 GE1_polish_puppet_desc: "As we have conquered the area of Poland we can promise the poles a restoration in order to legitimize our military occupation and possibly in the future gather volunteers for the war effort against the entente."
 GE1_polish_volunteers: "Request Volunteers from Poland"
 GE1_polish_volunteers_desc: "As we have created a Polish Puppet State promising independence we can also request volunteers to continue our war effort"
 GE1_send_lenin: "Send Lenin"
 GE1_send_lenin_desc: "In an effort to de-stabilize Russia and knock it out of the war we can send back the exiled Vladimir Lenin who holds a great deal of influence over the communists in Russia who are calling for revolution."
 GE1_huerta_power: "Bring Back Huerta"
 GE1_huerta_power_desc: "In an attempt to get Mexico on our side it would be best to collude with Victoriano Huerta, whom has made promises should we assist him in regaining power that he will undoubtedly show his support for the Kaiser, even if it means declaring war on the United States...but who knows? Perhaps it is a bluff..."
 GE1_grain_ukraine: "Enforce a Authoritarian Regime in Ukraine"
 GE1_grain_ukraine_desc: "In an effort to better our food situation we can enforce a more authoritarian regime in Ukraine to quicken the pace of the grain deliveries."
 GE1_supply_dervish_state: "Supply Dervish State"
 GE1_supply_dervish_state_desc: "The Dervish State has long been at war with much of the Entente, particularly Britain if we were to supply them then it would distract some of the British forces."
 GE1_befriend_dervish: "Befriend Dervish State"
 GE1_befriend_dervish_desc: "Us and the Dervish State have similar enemies, for that reason why not be friends?"
 GE1_invite_dervish: "Invite Dervish State to Central Powers"
 GE1_invite_dervish_desc: "Sisnce we are fighting the same enemy we might as well officially invite the Dervish state into the Central Powers"
 GE1_political_effort: "Political Effort"
 GE1_political_effort_desc: ""
 GE1_power_to_kaiser: "Power to Kaiser"
 GE1_power_to_kaiser_desc: "If we support the Kaiser we can enact more reforms and decisions. Doing this would make keeping the Kaiser in rule easier."
 GE1_power_to_military: "Power to Military"
 GE1_power_to_military_desc: "If we support the military, we will receive several bonuses for our troops at the cost of lessening the power of the Kaiser and raising the power of the military."
 GE1_home_by_christmas: "Home by Christmas"
 GE1_home_by_christmas_desc: ""
 GE1_fund_insurrectionists_india: "Support Indian Independence"
 GE1_fund_insurrectionists_india_desc: "Whilst a very daring and big plot if it managed to turn out as planned the British could see an armed insurrection within India which would provide a huge backhand blow."
 GE1_befriend_afgahnistan: "Befriend Afgahnistan"
 GE1_befriend_afgahnistan_desc: "Afgahnistan could provide as a good base to invade India from should they later agree to an alliance"
 GE1_negotiate_afgahnistan: "Negotiate with Afgahnistan"
 GE1_negotiate_afgahnistan_desc: "However unlikely it is based on the fact that the Afgah Emir is payed by the British themselves, if we are to throw out a deal based territorial gains in India and the Afgahn Emir were to agree we could strike a significant and the Afgahn attack would serve as a thorn in the back of British India diverting troops and resources."
 GE1_continue_unrestricted_sub: "Resume Unrestricted Submarine Warfare"
 GE1_continue_unrestricted_sub_desc: "Despite facing a possibility of going to war with the United States the general staff have said that it if we are to win this war we must resume unestricted submarine warfare, saying that U.S. intervention if it should happen won't be a threat because it will take too long for the Americans to get involved and by then we would have won."
 GE1_industrial_effort: "Industrial Effort"
 GE1_industrial_effort_desc: "Our Empire has already become the strongest power in the region, and further industrialisation will increase our chances of winning a future war."
 GE1_infrastructure_effort_1: "Infrastructure Effort I"
 GE1_infrastructure_effort_1_desc: "Infrastructure is critical to our country, as our territory stretches from Metz to Memel. Larger than most other countries in Europe, having extensive infrastructure will improve standards of living while compounding the effectiveness of our rapid mobilisation in the Schliffen Plan."
 GE1_infrastructure_effort_2: "Infrastructure Effort II"
 GE1_infrastructure_effort_2_desc: "Further development of our infrastructure will help decrease unemployment in our Empire while also providing a better standard of living for our citizens."
 GE1_infrastructure_effort_3: "Infrastructure Effort III"
 GE1_infrastructure_effort_3_desc: "Continuing to improve our infrastructure will no doubt place us as the foremost power, both economically and military in not just Europe, but perhaps the whole world."
