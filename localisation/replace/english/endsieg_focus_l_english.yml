 GE1_N_jutland_lessons:0 "Jutland Gunnery Reports"
 GE1_N_jutland_lessons_desc:0 "The Kaiserliche Marine centres its programme on jutland gunnery reports. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_surface_risk_theory:0 "Commit to the High Seas Fleet"
 GE1_N_surface_risk_theory_desc:0 "The navy will concentrate its training and construction programme on a cohesive battle fleet. This commitment gives priority to surface squadrons over a specialised commerce-war programme."
 GE1_N_destroyer_screen:0 "Torpedoboot Screens"
 GE1_N_destroyer_screen_desc:0 "The Kaiserliche Marine centres its programme on torpedoboot screens. Kiel school reports, dockyard capacity, and patrol experience determine how the policy reaches the fleet."
 GE1_N_mine_warfare:0 "North Sea Mine Barrages"
