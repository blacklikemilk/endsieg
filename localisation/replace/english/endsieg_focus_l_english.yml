 RUS_diplomatic_effort_desc: ""
 RUS_european_diplomacy: "European Diplomacy"
 RUS_european_diplomacy_desc: "Diplomacy in Europe"
 RUS_investments_from_west: "Investments from the West"
 RUS_investments_from_west_desc: "If we accept investments from the west we will face a largely foreign owned industry, however on the upside we would industrialize quicker."
 RUS_railway_construction: "Trans-Siberian Railway Construction I"
 RUS_railway_construction_desc: "Once we finish the Trans-Siberian railway we will have more control over the country and benefit economically greately having much easier access to the eastern port of Vladivostok."
 RUS_prepare_for_war: "Prepare for War"
 RUS_prepare_for_war_desc: ""
 RUS_railway_construction_2: "Finish Trans-Siberian Railway"
 RUS_railway_construction_2_desc: "Once we finish the Trans-Siberian railway we will have more control over the country and benefit economically greately having much easier access to the eastern port of Vladivostok."
 RUS_occupy_northern_persia: "Occupy Northern Persia"
 RUS_occupy_northern_persia_desc: "In order to safeguard the Persian Oilfields it would be wise to occupy Northern Persia seeing Turkey may very well get involved in this conflict..."
 RUS_brusilov_offensive: "Launch Brusilov Offensive"
 RUS_brusilov_offensive_desc: "Launching the Brusilov offensive will give you a timed idea with heavy military bonuses, but you must control a certain amount of territory, not being pushed back too far by the Austrians."
 RUS_petrograd_defense: "Petrograd Defense"
 RUS_petrograd_defense_desc: "Since our capita, Petrograd, is a coastal city it would be wise to increase fortifications should the German fleet seek to bombard it in the future."
 RUS_asian_diplomacy: "Asian Diplomacy"
 RUS_asian_diplomacy_desc: "Diplomacy in Asia"
 RUS_mongolian_bufferstate: "Back Mongolian Bufferstate"
 RUS_mongolian_bufferstate_desc: "Taking advantage of the chaos in China with their revolution we have the opportunity to back the creation of a Mongolian state in order to create a buffer between our two countries."
 RUS_russian_dominance: "Russian Dominance in Asia"
 RUS_russian_dominance_desc: "We could take even more advantage of the situation in China and enforce a Russian dominance in the region"
 RUS_take_manchuria: "Annex Manchuria"
 RUS_take_manchuria_desc: "Enforcing our dominance we have decided to move our troops into the territory of Manchuria where the Chinese who are already divided inside dealing with their own issues provided no retaliation."
 RUS_entente_diplomacy: "Entente Diplomacy"
 RUS_entente_diplomacy_desc: "Diplomacy with our Allies"
 RUS_send_troops_france: "Send Troops to France"
 RUS_send_troops_france_desc: "In order to help out our french allies on the Western Front we could send Russian troops to aid them against the numerically superior Germans."
 RUS_request_aid: "Request Aid I"
 RUS_request_aid_desc: "Whilst providing aid will prove rather difficult considering that the Baltic Sea and the Black Sea are cut off by the Central Powers, at least something would help considering our shortages."
 RUS_request_aid_2: "Request Aid II"
 RUS_request_aid_2_desc: "Whilst providing aid will prove rather difficult considering that the Baltic Sea and the Black Sea are cut off by the Central Powers, at least something would help considering our shortages."
 RUS_political_effort: "Political Effort"
 RUS_political_effort_desc: ""
 RUS_supress_revolutionaries: "Supress Revolutionaries"
 RUS_supress_revolutionaries_desc: "The country has been recently filled with various radical revolutionaries, whilst we can supress them with secret police in the end we will have little control of the will of the people"
 RUS_continue_russification: "Continue Russification"
 RUS_continue_russification_desc: "In order to cut down on dissent from minorities we should continue our policy with Russification"
 RUS_pan_slavism: "Pan-Slavism"
 RUS_pan_slavism_desc: "All Slavic people's should unite as one"
 RUS_reinforce_tsars_authority: "Reinforce the Tsars Authority"
 RUS_reinforce_tsars_authority_desc: "The Tsar's authority shall not be undermined."
 RUS_nicholas_on_front: "Transfer Nicholas to the Front"
 RUS_nicholas_on_front_desc: "Should Nicholas be transfered to the front, there will be a morale boost amongst the soldiers."
 RUS_form_polish_legion: "Form Polish Legion"
 RUS_form_polish_legion_desc: "Forming a Polish Legion will give us a few extra Polish divisions to use."
