 RUS_ww1_politics_shortcut:0 "Politics"
 SO2_southern_expansion_desc:0 "The approaches to the Caucasus must be secured as the Civil War draws to a close. We will coordinate our existing southern programme with the new army administration."
 WHR_diplomatic_effort_desc:0 "The White government needs recognition, supply arrangements and dependable foreign contacts. A diplomatic office will coordinate those efforts without placing the Civil War under a foreign command."
 WHR_political_effort_desc:0 "Officers, provincial administrations and civil representatives must agree on how the government will operate. A common political programme is necessary to hold this coalition together."
 WW1_GEN_equipment_programme:0 "National Equipment Programme"
 WW1_GEN_staff_programme:0 "General Staff Training Programme"
 shared_GEN_bomber_research_desc:0 "Bombing requires suitable machines, accurate navigation and realistic targets. The service will begin with trials against military infrastructure."
 shared_GEN_gunnery_school:0 "A Naval Gunnery School"
 shared_GEN_gunnery_school_desc:0 "Gunnery officers will receive a common training programme. Exercises and observation will improve the crews without depending on an immediate new class of ship."
 shared_GEN_industrial_effort_desc:0 "A modern economy needs surveyed resources, reliable transport and a government capable of placing orders. We will put these foundations before prestige projects."
 shared_GEN_merchant_protection:0 "Protect the Merchant Marine"
 shared_GEN_merchant_protection_desc:0 "Sailings, escorts and reporting procedures will be coordinated across the maritime services. Merchant shipping must survive alongside the warships."
 shared_GEN_modern_navy_desc:0 "Gunnery training and fleet exercises must bring the different arms of the navy together. A balanced force will only be effective if its ships can fight as one."
