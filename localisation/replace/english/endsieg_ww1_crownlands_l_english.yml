l_english:
 WW1_HAB_AUH_franz_joseph_name:0 "Franz Joseph I"
 WW1_HAB_AUH_franz_joseph_desc:0 "For decades Franz Joseph has held together the lands inherited from his forebears. Though the common ministries have given way to separate crownland governments, the emperor remains determined that the dynasty shall outlast the crisis."
 WW1_HAB_AUH_karl_i_name:0 "Karl I"
 WW1_HAB_AUH_karl_i_desc:0 "Karl has inherited a monarchy whose survival now rests on the consent of its crownlands. He seeks to preserve the dynasty through reconciliation, a settlement of national grievances and relief for a population exhausted by political turmoil."
 WW1_HAB_AUH_zita_name:0 "Zita of Bourbon-Parma"
 WW1_HAB_AUH_zita_desc:0 "As regent for her son Otto, Zita has assumed the burden of defending the crown and the settlement that preserves it. Her court must hold the loyalty of the provinces until the young emperor comes of age."
 WW1_HAB_AUH_otto_name:0 "Otto von Habsburg"
 WW1_HAB_AUH_otto_desc:0 "Having come of age, Otto has assumed the duties of the Austrian crown. He must reconcile the dynasty's traditions with governments that now expect their own voice in the affairs of the Danube."
 WW1_HAB_CZE_kramar_name:0 "Karel Kramář"
 WW1_HAB_CZE_kramar_desc:0 "A leading advocate of Czech national rights, Karel Kramář has accepted the crownland charter in return for a Bohemian government responsible for its own domestic affairs. His appointment embodies a difficult reconciliation between the court and the Czech national movement."
 WW1_HAB_HUN_tisza_name:0 "István Tisza"
 WW1_HAB_HUN_tisza_desc:0 "István Tisza sees the Hungarian constitution and the authority of the Crown of Saint Stephen as the foundations of political order. He intends to preserve the kingdom through disciplined government and a continued understanding with the dynasty."
 WW1_HAB_HUN_bethlen_kr_name:0 "István Bethlen"
 WW1_HAB_HUN_bethlen_kr_desc:0 "István Bethlen has taken charge of a kingdom shaken by the collapse of the common government. A conservative aristocrat and experienced parliamentarian, he seeks to restore administrative order while preserving Hungary's place in the dynastic settlement."
 WW1_HAB_CRO_sarkotic_name:0 "Stjepan Sarkotić"
 WW1_HAB_CRO_sarkotic_desc:0 "Stjepan Sarkotić has been entrusted with a South Slav crownland stretching from Zagreb to Sarajevo. A career imperial officer, he must reconcile Croatia's constitutional claims with the religious and national divisions of Bosnia and the Adriatic provinces."
 WW1_HAB_GLO_karol_stefan_name:0 "Karol Stefan Habsburg"
 WW1_HAB_GLO_karol_stefan_desc:0 "Karol Stefan has been appointed royal governor of Galicia-Lodomeria. His household's ties to Żywiec and its adoption of Polish public life offer the court a bridge to the province's Polish leaders, though Ruthenian representatives demand guarantees of their own."
 WW1_HAB_GLO_karol_olbracht_name:0 "Karol Olbracht Habsburg"
 WW1_HAB_GLO_karol_olbracht_desc:0 "Karol Olbracht has succeeded his father as royal governor of Galicia-Lodomeria. An officer with close ties to the region, he must maintain the crown's authority while holding together a province divided by language, religion and rival national aspirations."
