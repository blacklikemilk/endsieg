 WW1_HAB_crownland_charter:0 "The Crownland Charter"
 WW1_HAB_crownland_charter_desc:0 "Separate ministries and provincial diets now administer the lands once governed by the common state. The charter preserves the crown's authority while giving the new governments a stake in the settlement."
 WW1_HAB_vienna_tt:0 "The Empire of Austria will retain the Crown of Bohemia, the Kingdom of Hungary, the Crown of Galicia-Lodomeria and the Crown of Illyria as §Ypuppets§!."
 WW1_HAB_union_tt:0 "Austria will be integrated into Germany. Bohemia, Hungary, Galicia-Lodomeria and Illyria will become §YGerman puppets§!."
 ww1_crownlands.1.t:0 "The Vienna Protocol"
 ww1_crownlands.1.d:0 "Berlin has submitted a new proposal for the lands of the monarchy. The Austrian crown would be absorbed into the German Empire, while Bohemia, Hungary, Galicia-Lodomeria and Illyria would receive separate governments under German protection.\n\nOur ministers point out that the earlier negotiations guaranteed the dynasty's authority over the crownlands. If we surrender Austria itself, those guarantees will pass to Berlin. The court must decide whether union offers a future for our people, or merely the end of the monarchy."
 ww1_crownlands.1.a:0 "Accept the union on these terms."
 ww1_crownlands.1.b:0 "The crownlands must remain under Vienna."
 ww1_crownlands.1.c:0 "We will not surrender the crown."
 ww1_crownlands.2.t:0 "Vienna Proposes a Crownland Settlement"
 ww1_crownlands.2.d:0 "The Austrian government will accept separate administrations in Prague, Budapest, Kraków and Zagreb, but only if they remain subjects of the Austrian crown. Vienna argues that the dynasty is the one authority capable of securing the loyalty of the new governments.\n\nThe proposal would end the common state without bringing Austria into Germany. We can recognise this settlement, or insist that our original terms be carried out."
 ww1_crownlands.2.a:0 "An Austrian settlement will secure the Danube."
 ww1_crownlands.2.b:0 "Union remains our final demand."
 ww1_crownlands.3.t:0 "Five Crowns on the Danube"
 ww1_crownlands.3.d:0 "The instruments of separation have been signed. The Empire of Austria remains the seat of the dynasty, while the Crown of Bohemia, the Kingdom of Hungary, the Crown of Galicia-Lodomeria and the Crown of Illyria assume responsibility for their own ministries and armed forces.\n\nTheir governments remain bound to Vienna as subjects of the Austrian crown. The common state has ended, but its railways, trade and dynastic obligations will continue to link the lands of the monarchy."
 ww1_crownlands.3.a:0 "The crown endures."
 ww1_crownlands.4.t:0 "The Danubian Settlement Ratified"
 ww1_crownlands.4.d:0 "The settlement has brought Austria into the German Empire. Imperial officials are taking charge in Vienna, while separate administrations have been established for Bohemia, Hungary, Galicia-Lodomeria and Illyria.\n\nThese four states are now German protectorates. Berlin has assumed the obligations once exercised by Vienna, including the defence of their frontiers and the supervision of their foreign affairs. The division of the old ministries will occupy our representatives for many months to come."
 ww1_crownlands.4.a:0 "A new order on the Danube."
 ww1_crownlands.6.t:0 "Austria Rejects the Union"
 ww1_crownlands.6.d:0 "The court in Vienna has rejected our proposal to incorporate Austria into the German Empire. Its ministers insist that separation can proceed only under a surviving Austrian crown.\n\nWe can still conclude the original crownland settlement, leaving Austria in control of the four new governments. If we insist on union, diplomacy has reached its limit."
 ww1_crownlands.6.a:0 "Conclude the crownland settlement."
 ww1_crownlands.6.b:0 "Then we shall enforce our terms."
 ww1_crownlands.10.t:0 "The Bohemian Charter"
 ww1_crownlands.10.d:0 "The charter of the Crown of Bohemia has been proclaimed in Prague. Karel Kramář has accepted the office of minister-president after the court agreed to recognise a separate Bohemian administration and reconcile with the Czech national movement.\n\nThe new government will administer Bohemia, Moravia and Austrian Silesia. Its subjects now look to Prague for the protection of their language, their livelihoods and their constitutional rights."
 ww1_crownlands.10.a:0 "Let the new ministry begin its work."
 ww1_crownlands.10.b:0 "The diet must have a greater voice."
 ww1_crownlands.11.t:0 "The Lands of Saint Stephen"
 ww1_crownlands.11.d:0 "The Hungarian government has assumed the civil and military responsibilities once divided with the common ministries in Vienna. The Kingdom of Hungary retains its historic lands, including Slovakia, Ruthenia and Transylvania.\n\nThe royal ministry promises to preserve the constitution and restore orderly government. Representatives of the kingdom's other peoples are demanding that the new settlement protect their rights as well as those of Budapest."
 ww1_crownlands.11.a:0 "The kingdom will stand by the charter."
 ww1_crownlands.11.b:0 "The counties must be heard."
 ww1_crownlands.12.t:0 "A Crown for Galicia-Lodomeria"
 ww1_crownlands.12.d:0 "A separate government for the Crown of Galicia-Lodomeria has been established at Kraków. A royal governor drawn from the Żywiec Habsburg household will represent the crown, while local officials assume control of the province's administration.\n\nThe charter brings Galicia and Bukovina under a single government. Polish and Ruthenian representatives have both demanded guarantees for their schools, churches and public offices. The new administration will have to earn the loyalty that the treaty alone cannot command."
 ww1_crownlands.12.a:0 "A common administration for the crownland."
 ww1_crownlands.12.b:0 "The provincial diet must safeguard every people."
 ww1_crownlands.13.t:0 "The Illyrian Crown"
 ww1_crownlands.13.d:0 "The charter of the Crown of Illyria has been read before the assembled representatives in Zagreb. Stjepan Sarkotić has been appointed royal governor, charged with establishing a government for Croatia, Bosnia, Herzegovina and the Dalmatian coast.\n\nThe new administration must reconcile the claims of Zagreb with the institutions and religious communities of Bosnia. Sarkotić has called for order and cooperation, warning that the survival of the crownland will depend on more than the loyalty of its officers."
 ww1_crownlands.13.a:0 "Establish the royal administration."
 ww1_crownlands.13.b:0 "Civil representatives must share the work."
 ww1_crownlands.20.t:0 "Terms for the Habsburg Lands"
 ww1_crownlands.20.d:0 "With the armies of the monarchy unable to secure a decision, our ministers have opened discussions on a settlement. The common state would be divided into Austria, Bohemia, Hungary, Galicia-Lodomeria and Illyria.\n\nThe court has made its condition clear: the new crownland governments must remain subjects of the Austrian crown. Separate ministries may end the constitutional struggle, but the dynasty will not willingly consent to its own expulsion from the Danube. Acceptance will bring the war to an end on this basis."
 ww1_crownlands.20.a:0 "Accept separation under the Austrian crown."
 ww1_crownlands.20.b:0 "Reject the terms and continue resistance."
 WW1_HAB_player_union_tt:0 "You will continue playing as §YGermany§!."
