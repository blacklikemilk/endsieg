 ITA_BALKAN_POWDER_KEG_DESC:0 "Italy has secured its place among the great powers, but unity has not brought prosperity to every province. Northern industry is growing while much of the south remains poor, and the army struggles to turn national ambition into military strength. The alliance with Berlin and Vienna offers protection, yet Italian claims on Austrian territory divide the partners. Across the Mediterranean, colonial ambitions promise prestige and new burdens. Rome must decide what kind of power the kingdom is to become."
 ITA_THE_GREAT_WAR_DESC:0 "Victory over the Ottoman Empire has brought Italy new possessions in Libya and the Aegean, but the cost of conquest has exposed weaknesses in the army and the treasury. Parliamentary bargaining holds the government together as social unrest challenges the old order. Italy remains bound to Germany and Austria-Hungary, while claims on Trentino and Trieste draw it towards their rivals. If the European peace gives way, the kingdom will have to choose between its treaty partners, its territorial ambitions and the risks of another war."
 ITA_SOMME_DESC:0 "Italy has entered the war against Austria-Hungary, seeking the frontier promised by the Treaty of London. The mountain passes and the Isonzo have proved far harder to cross than the interventionists expected. Costly attacks have won little ground, while factories, railways and ports struggle to sustain the front. The government must keep its allies supplied, its soldiers equipped and its people willing to endure. Victory demands more than another order to advance."
 ITA_KAISERSCHLACHT_DESC:0 "The defeat at Caporetto forced Italy back to the Piave and shook confidence in the army's leadership. Under Armando Diaz, the surviving formations are being rebuilt behind a shorter defensive line, with Allied support and a renewed effort in the factories. Austria-Hungary remains a dangerous enemy, but its own resources are strained. Italy must hold the river, restore the army's strength and prepare for the moment when defence can give way to victory."
