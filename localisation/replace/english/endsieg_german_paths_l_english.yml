l_english:
 INT_GER_republic_path:0 "Republican Institutions"
 INT_GER_republic_path_desc:0 "Decisions for civic rights, elections and coalition recovery."
 INT_GER_communist_path:0 "Workers' Administration"
 INT_GER_communist_path_desc:0 "Decisions for councils, transport and social welfare."
 INT_GER_monarchist_path:0 "Monarchist Settlement"
 INT_GER_monarchist_path_desc:0 "Decisions for federal administration and the restored court."
 INT_GER_eastern_path:0 "Eastern Cooperation"
 INT_GER_eastern_path_desc:0 "Decisions for trade, training and technical exchange."
 INT_GER_versailles_path:0 "Treaty Revision"
 INT_GER_versailles_path_desc:0 "Decisions for diplomacy, public advocacy and procurement."
 INT_GER_fascist_path:0 "Party Administration"
 INT_GER_fascist_path_desc:0 "Decisions for labour mobilization, administration and contracts."

 INT_GER_paths_public_education:0 "Fund Civic Education"
 INT_GER_paths_public_education_desc:0 "Teach constitutional rights and parliamentary procedure through a national civic programme."
 INT_GER_paths_municipal_charters:0 "Issue Municipal Charters"
 INT_GER_paths_municipal_charters_desc:0 "Give local councils clearer powers to deliver services and represent their communities."
 INT_GER_paths_social_compromise:0 "Broker a Social Compromise"
 INT_GER_paths_social_compromise_desc:0 "Bring employers, unions and parties into a durable settlement over wages and welfare."
 INT_GER_paths_constitutional_guard:0 "Strengthen the Constitutional Guard"
 INT_GER_paths_constitutional_guard_desc:0 "Train officials and judges to defend the constitutional order during emergencies."
 INT_GER_paths_election_registers:0 "Update Election Registers"
 INT_GER_paths_election_registers_desc:0 "Prepare accurate voter rolls and transparent polling procedures for the next election."
 INT_GER_paths_cabinet_recovery:0 "Coordinate Cabinet Recovery"
 INT_GER_paths_cabinet_recovery_desc:0 "Use the crisis cabinet's mandate to restore confidence in government and public finance."

 INT_GER_paths_shop_floor:0 "Recognize Shop Floor Committees"
 INT_GER_paths_shop_floor_desc:0 "Give workplace committees a formal role in production and labour relations."
 INT_GER_paths_transport_committees:0 "Organize Transport Committees"
 INT_GER_paths_transport_committees_desc:0 "Put railway workers and planners together to keep the national network moving."
 INT_GER_paths_social_welfare:0 "Expand Socialist Welfare"
 INT_GER_paths_social_welfare_desc:0 "Direct relief and public health resources toward workers and their families."
 INT_GER_paths_red_training:0 "Open Red Training Schools"
 INT_GER_paths_red_training_desc:0 "Build a cadre of officers and organizers trained in the new republic's defence."
 INT_GER_paths_workers_constitution:0 "Ratify the Workers' Constitution"
 INT_GER_paths_workers_constitution_desc:0 "Settle the balance between local councils and the central workers' republic."

 INT_GER_paths_prussian_administration:0 "Restore Prussian Administration"
 INT_GER_paths_prussian_administration_desc:0 "Rebuild a professional state service while the monarchy finds its footing."
 INT_GER_paths_federal_chambers:0 "Convene Federal Chambers"
 INT_GER_paths_federal_chambers_desc:0 "Give the Länder a lasting voice in the restored constitutional order."
 INT_GER_paths_royal_railways:0 "Charter the Royal Railways"
 INT_GER_paths_royal_railways_desc:0 "Use the crown's prestige to coordinate long term railway investment."
 INT_GER_paths_restored_court:0 "Reopen the Restored Court"
 INT_GER_paths_restored_court_desc:0 "Reestablish the court as a symbol of continuity and public service."
 INT_GER_paths_monarchist_reconciliation:0 "Pursue Monarchist Reconciliation"
 INT_GER_paths_monarchist_reconciliation_desc:0 "Bring republican veterans, federalists and royalists into a common settlement."

 INT_GER_paths_eastern_trade:0 "Open an Eastern Trade Office"
 INT_GER_paths_eastern_trade_desc:0 "Coordinate contracts and clearing arrangements with markets to the east."
 INT_GER_paths_eastern_exercises:0 "Sponsor Eastern Exercises"
 INT_GER_paths_eastern_exercises_desc:0 "Exchange field lessons with a partner whose army also studies modern warfare."
 INT_GER_paths_joint_aviation:0 "Fund Joint Aviation Trials"
 INT_GER_paths_joint_aviation_desc:0 "Test aircraft and training methods beyond the reach of the treaty inspectors."
 INT_GER_paths_eastern_credit:0 "Secure Eastern Credit"
 INT_GER_paths_eastern_credit_desc:0 "Use commercial ties to keep reconstruction finance available when western lenders hesitate."

 INT_GER_paths_treaty_legalists:0 "Brief the Treaty Lawyers"
 INT_GER_paths_treaty_legalists_desc:0 "Prepare a careful legal case for revising the restrictions imposed on Germany."
 INT_GER_paths_foreign_press:0 "Address the Foreign Press"
 INT_GER_paths_foreign_press_desc:0 "Present Germany's grievances to foreign editors and parliamentary audiences."
 INT_GER_paths_hidden_procurement:0 "Authorize Hidden Procurement"
 INT_GER_paths_hidden_procurement_desc:0 "Quietly acquire equipment and expertise while public negotiations continue."
 INT_GER_paths_officer_professionalization:0 "Professionalize the Officer Corps"
 INT_GER_paths_officer_professionalization_desc:0 "Standardize training and staff work so that a smaller army can still learn quickly."

 INT_GER_paths_labor_front:0 "Mobilize the Labour Front"
 INT_GER_paths_labor_front_desc:0 "Coordinate labour exchanges and industrial arbitration through the new state structure."
 INT_GER_paths_controlled_press:0 "Establish a Controlled Press"
 INT_GER_paths_controlled_press_desc:0 "Create a unified public information service for the regime's policies."
 INT_GER_paths_arms_contracts:0 "Sign Arms Contracts"
 INT_GER_paths_arms_contracts_desc:0 "Use carefully managed contracts to build military capacity before the 1936 transition."

 INT_ger_paths.1.t:0 "Parliamentary Commissions"
 INT_ger_paths.1.d:0 "The new commissions can either hold ministers to account or help the cabinet move legislation through a crowded Reichstag."
 INT_ger_paths.1.a:0 "Let the commissions oversee the cabinet"
 INT_ger_paths.1.b:0 "Give the cabinet a coordinating hand"
 INT_ger_paths.2.t:0 "The Crisis Cabinet's Mandate"
 INT_ger_paths.2.d:0 "The coalition has survived its first crisis. Its next decision will shape whether recovery rests on relief or retrenchment."
 INT_ger_paths.2.a:0 "Protect coalition relief"
 INT_ger_paths.2.b:0 "Retrench and restore confidence"
 INT_ger_paths.3.t:0 "The Workers' Planning Board"
 INT_ger_paths.3.d:0 "Delegates disagree over whether the new plan should be built from the shop floor or directed through a central office."
 INT_ger_paths.3.a:0 "Give councils the initiative"
 INT_ger_paths.3.b:0 "Coordinate the plan centrally"
 INT_ger_paths.4.t:0 "The Princes' Congress"
 INT_ger_paths.4.d:0 "The restored states must decide how much authority belongs to the federal compact and how much belongs to the crown."
 INT_ger_paths.4.a:0 "Bind the crown to a federal compact"
 INT_ger_paths.4.b:0 "Reserve a stronger royal prerogative"
 INT_ger_paths.5.t:0 "The Rapallo Commission"
 INT_ger_paths.5.d:0 "The commission can make eastern cooperation an open commercial programme or keep its most sensitive research discreet."
 INT_ger_paths.5.a:0 "Lead with commerce"
 INT_ger_paths.5.b:0 "Keep the research discreet"
 INT_ger_paths.6.t:0 "Revising the Treaty"
 INT_ger_paths.6.d:0 "A public legal campaign may build international support, while quiet procurement would give negotiations a stronger backstop."
 INT_ger_paths.6.a:0 "Make the legal case"
 INT_ger_paths.6.b:0 "Prepare a covert backstop"
 INT_ger_paths.7.t:0 "The Party Administration"
 INT_ger_paths.7.d:0 "The new administration can emphasize orderly bureaucracy or a more forceful public information apparatus."
 INT_ger_paths.7.a:0 "Build bureaucratic coordination"
 INT_ger_paths.7.b:0 "Build the propaganda apparatus"

 INT_GER_paths_republic_oversight:0 "Parliamentary Oversight"
 INT_GER_paths_republic_oversight_desc:0 "Commissions keep ministers answerable to the Reichstag."
 INT_GER_paths_cabinet_coordination:0 "Cabinet Coordination"
 INT_GER_paths_cabinet_coordination_desc:0 "A disciplined cabinet can move policy quickly through parliament."
 INT_GER_paths_civic_education:0 "Civic Education"
 INT_GER_paths_civic_education_desc:0 "Citizens and officials know the rights and procedures of the constitution."
 INT_GER_paths_social_compromise_spirit:0 "Social Compromise"
 INT_GER_paths_social_compromise_spirit_desc:0 "Employers and organized labour have a reason to defend the settlement."
 INT_GER_paths_constitutional_guard_spirit:0 "Constitutional Guard"
 INT_GER_paths_constitutional_guard_spirit_desc:0 "Officials are prepared to defend constitutional government in a crisis."
 INT_GER_paths_workers_councils:0 "Workers' Councils"
 INT_GER_paths_workers_councils_desc:0 "Shop floor representation has a recognized place in economic administration."
 INT_GER_paths_central_planning:0 "Central Planning Board"
 INT_GER_paths_central_planning_desc:0 "Production targets and material allocations are coordinated nationally."
 INT_GER_paths_social_welfare_spirit:0 "Socialist Welfare Network"
 INT_GER_paths_social_welfare_spirit_desc:0 "Public welfare institutions stabilize the workers' republic."
 INT_GER_paths_red_training_spirit:0 "Red Training Schools"
 INT_GER_paths_red_training_spirit_desc:0 "A trained cadre shares lessons across the revolutionary armed forces."
 INT_GER_paths_federal_compact:0 "Federal Compact"
 INT_GER_paths_federal_compact_desc:0 "The Länder and the crown share authority under a negotiated compact."
 INT_GER_paths_crown_prerogative:0 "Crown Prerogative"
 INT_GER_paths_crown_prerogative_desc:0 "The restored court retains a stronger coordinating role in the state."
 INT_GER_paths_royal_administration:0 "Royal Administration"
 INT_GER_paths_royal_administration_desc:0 "A professional civil service carries the monarchy's programme into every Land."
 INT_GER_paths_eastern_commerce:0 "Eastern Commerce"
 INT_GER_paths_eastern_commerce_desc:0 "Trade offices turn eastern contacts into reliable commercial exchange."
 INT_GER_paths_eastern_training:0 "Eastern Training Exchange"
 INT_GER_paths_eastern_training_desc:0 "Joint exercises and discreet schools spread new military methods."
 INT_GER_paths_legal_revision:0 "Legal Treaty Revision"
 INT_GER_paths_legal_revision_desc:0 "A public legal campaign gives treaty revision diplomatic credibility."
 INT_GER_paths_covert_procurement:0 "Covert Procurement"
 INT_GER_paths_covert_procurement_desc:0 "Quiet acquisitions improve military expertise while carrying political risk."
 INT_GER_paths_bureaucratic_coordination:0 "Bureaucratic Coordination"
 INT_GER_paths_bureaucratic_coordination_desc:0 "Party offices and state ministries share a coordinated administrative chain."
 INT_GER_paths_propaganda_apparatus:0 "Propaganda Apparatus"
 INT_GER_paths_propaganda_apparatus_desc:0 "A unified information service keeps the regime's message in the public sphere."
 INT_GER_paths_transport_bonus:0 "Transport Committee Studies"
 INT_GER_paths_eastern_doctrine_bonus:0 "Eastern Exercise Reports"
 INT_GER_paths_railway_bonus:0 "Royal Railway Charter"
 INT_GER_paths_officer_bonus:0 "Professional Staff Course"

 INT_GER_paths_aviation_bonus:0 "Joint Aviation Research"
 INT_GER_paths_coalition_relief_spirit:0 "Coalition Relief Program"
 INT_GER_paths_coalition_relief_spirit_desc:0 "Emergency relief steadies the republic while drawing civilian factories into public provision. This program expires after two years."
 INT_GER_paths_retrenchment_spirit:0 "Cabinet Retrenchment"
 INT_GER_paths_retrenchment_spirit_desc:0 "Budget cuts free some industrial capacity and strengthen the cabinet, but deepen public discontent. This program expires after two years."
