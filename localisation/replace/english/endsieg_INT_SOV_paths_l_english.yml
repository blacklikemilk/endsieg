l_english:
 SO2_INT_transport_reconstruction: "Rebuild the Transport Arteries"
 SO2_INT_transport_reconstruction_desc: "The civil war left rail junctions and freight depots worn down. A coordinated repair program will reconnect industrial regions and make future expansion easier."
 SO2_INT_public_health_campaign: "A Public Health Campaign"
 SO2_INT_public_health_campaign_desc: "Rural clinics and anti-epidemic campaigns can restore confidence in the new state and keep more workers healthy."
 SO2_INT_trade_delegations: "Send Trade Delegations"
 SO2_INT_trade_delegations_desc: "Soviet representatives will seek machinery, expertise and commercial links abroad while preserving our political independence."
 SO2_INT_comintern_press: "Expand the Comintern Press"
 SO2_INT_comintern_press_desc: "Schools and printers can give the international communist movement a steadier voice across borders."
 SO2_INT_far_eastern_trade: "Far Eastern Trade Offices"
 SO2_INT_far_eastern_trade_desc: "Border commissions have reduced immediate friction. Commercial offices can now open practical channels across the Pacific frontier."
 SO2_INT_armored_corps: "Organize an Armored Corps"
 SO2_INT_armored_corps_desc: "Experimental vehicles need permanent crews, maintenance methods and a clear place in field exercises."
 SO2_INT_red_army_logistics: "Red Army Logistics"
 SO2_INT_red_army_logistics_desc: "Deep operations depend on fuel, rail timetables and supply officers as much as on doctrine."
 SO2_INT_aircraft_design_bureaus: "Aircraft Design Bureaus"
 SO2_INT_aircraft_design_bureaus_desc: "A network of design teams and flight schools will turn experimental aircraft into an effective air force."
 SO2_INT_frontline_air_control: "Frontline Air Control"
 SO2_INT_frontline_air_control_desc: "Forward liaison officers can coordinate pilots with advancing ground formations."
 SO2_INT_ural_power_grid: "The Ural Power Grid"
 SO2_INT_ural_power_grid_desc: "Link the new rail lines and industrial towns with reliable electricity."
 SO2_INT_precision_machine_tools: "Precision Machine Tools"
 SO2_INT_precision_machine_tools_desc: "More accurate tools will improve the output of every armament workshop."
 SO2_INT_baltic_submarine_school: "Baltic Submarine School"
 SO2_INT_baltic_submarine_school_desc: "The Baltic Fleet will train a new generation of submarine crews and engineers."
 SO2_INT_black_sea_naval_staff: "Black Sea Naval Staff"
 SO2_INT_black_sea_naval_staff_desc: "A permanent planning staff will coordinate training and readiness along the southern coast."
 SO2_INT_plan_targets: "Set the Plan Targets"
 SO2_INT_plan_targets_desc: "Production targets must reflect both political ambition and the capacity of factories and farms. The planning commission will choose its priorities."
 SO2_INT_workers_congress: "Convene a Workers' Congress"
 SO2_INT_workers_congress_desc: "The Left Opposition will give factory committees a formal voice in the workers' republic."
 SO2_INT_plan_consolidation: "Consolidate the Plan"
 SO2_INT_plan_consolidation_desc: "With heavy industry established, the party center can standardize investment and complete the next stage of the plan."
 SO2_INT_cooperative_union: "A Union of Cooperatives"
 SO2_INT_cooperative_union_desc: "The Right Opposition will bind towns, workshops and farms into a durable cooperative economy."
 INT_SOV_reconstruction: "Reconstruction and Welfare"
 INT_SOV_reconstruction_desc: "Direct resources toward railways, power, farms and public health."
 INT_SOV_party: "The Party and the Union"
 INT_SOV_party_desc: "Shape Soviet institutions and choose how to manage the economy."
 INT_SOV_diplomacy: "Soviet Diplomacy"
 INT_SOV_diplomacy_desc: "Use trade and political contacts to expand the Union's international reach."
 INT_SOV_armed_forces: "Red Armed Forces"
 INT_SOV_armed_forces_desc: "Turn interwar doctrine into exercises and service readiness."
 INT_SOV_rail_commissions: "Fund Rail Commissions"
 INT_SOV_rail_commissions_desc: "Repair trunk lines and freight hubs serving the industrial regions."
 INT_SOV_rural_clinics: "Open Rural Clinics"
 INT_SOV_rural_clinics_desc: "Send medical teams to villages underserved since the civil war."
 INT_SOV_tractor_orders: "Place Tractor Orders"
 INT_SOV_tractor_orders_desc: "Contract new machinery for the agricultural and engineering sectors."
 INT_SOV_power_station_survey: "Survey Power Stations"
 INT_SOV_power_station_survey_desc: "Identify the next generation of generating sites in the Urals."
 INT_SOV_republics_congress: "Convene a Congress of Republics"
 INT_SOV_republics_congress_desc: "Bring the republics together to settle administrative disputes."
 INT_SOV_workers_committees: "Empower Workers' Committees"
 INT_SOV_workers_committees_desc: "Let local soviets oversee more decisions in workshops and districts."
 INT_SOV_factory_quota_review: "Review Factory Quotas"
 INT_SOV_factory_quota_review_desc: "Inspect unrealistic production targets and improve planning methods."
 INT_SOV_cooperative_credit_fund: "Expand Cooperative Credit"
 INT_SOV_cooperative_credit_fund_desc: "Offer long-term capital to workshops and cooperatives."
 INT_SOV_european_trade_mission: "European Trade Mission"
 INT_SOV_european_trade_mission_desc: "Send commercial representatives to find machinery and markets."
 INT_SOV_comintern_correspondence: "Comintern Correspondence"
 INT_SOV_comintern_correspondence_desc: "Strengthen the movement's international networks."
 INT_SOV_pacific_commercial_talks: "Pacific Commercial Talks"
 INT_SOV_pacific_commercial_talks_desc: "Keep Far Eastern channels open through practical trade negotiations."
 INT_SOV_recognition_campaign: "Recognition Campaign"
 INT_SOV_recognition_campaign_desc: "Demonstrate that the Union can sustain normal diplomatic relations."
 INT_SOV_armored_maneuvers: "Armored Maneuvers"
 INT_SOV_armored_maneuvers_desc: "Test combined operations with the new armored corps."
 INT_SOV_staff_map_exercises: "Staff Map Exercises"
 INT_SOV_staff_map_exercises_desc: "Practice long-range planning and supply coordination."
 INT_SOV_air_training_program: "Air Training Program"
 INT_SOV_air_training_program_desc: "Increase the tempo of flying and maintenance exercises."
 INT_SOV_fleet_readiness_drills: "Fleet Readiness Drills"
 INT_SOV_fleet_readiness_drills_desc: "Put the Black Sea staff's plans to the test."
 INT_sov_rework.1.t: "The Grain Procurement Debate"
 INT_sov_rework.1.d: "The government must decide how forcefully it will collect grain for the cities and industry."
 INT_sov_rework.1.a: "Enforce procurement targets"
 INT_sov_rework.1.b: "Negotiate with the villages"
 INT_sov_rework.2.t: "The Collectivization Question"
 INT_sov_rework.2.d: "The new farms require equipment and cooperation from the countryside. Party leaders disagree about the pace."
 INT_sov_rework.2.a: "Prioritize mechanization"
 INT_sov_rework.2.b: "Offer local concessions"
 INT_sov_rework.3.t: "What Should the Plan Measure?"
 INT_sov_rework.3.d: "The planning commission has drafted competing measures of industrial success."
 INT_sov_rework.3.a: "Demand higher quotas"
 INT_sov_rework.3.b: "Reward quality and reliability"
 INT_sov_rework.4.t: "The Future of the NEP"
 INT_sov_rework.4.d: "Supporters of the New Economic Policy disagree over the role of cooperative industry and financial discipline."
 INT_sov_rework.4.a: "Back the cooperatives"
 INT_sov_rework.4.b: "Strengthen accounting controls"
 INT_sov_rework.5.t: "After the Berlin Treaty"
 INT_sov_rework.5.d: "The treaty opens a path to commercial exchanges, while the Comintern urges greater attention to political networks."
 INT_sov_rework.5.a: "Prioritize trade missions"
 INT_sov_rework.5.b: "Support revolutionary contacts"
 INT_sov_rework.6.t: "The Red Army's Next Lesson"
 INT_sov_rework.6.d: "Commanders debate whether the priority should be officer education or the supply system needed for deep operations."
 INT_sov_rework.6.a: "Expand officer schools"
 INT_sov_rework.6.b: "Improve field logistics"
 INT_SOV_transport_network: "Reconstructed Transport Network"
 INT_SOV_transport_network_desc: "Railway repairs shorten the route between Soviet factories and markets."
 INT_SOV_public_health: "Public Health Campaign"
 INT_SOV_public_health_desc: "Medical campaigns improve stability and expand the healthy workforce."
 INT_SOV_trade_delegations: "Trade Delegations"
 INT_SOV_trade_delegations_desc: "Soviet missions bring foreign equipment and technical contacts."
 INT_SOV_comintern_press: "Comintern Press"
 INT_SOV_comintern_press_desc: "International publications maintain political influence abroad."
 INT_SOV_far_eastern_trade: "Far Eastern Trade"
 INT_SOV_far_eastern_trade_desc: "Pacific trade channels ease pressure on consumer supply."
 INT_SOV_red_army_logistics: "Red Army Logistics"
 INT_SOV_red_army_logistics_desc: "Supply doctrine improves the army's readiness and training."
 INT_SOV_frontline_air_control: "Frontline Air Control"
 INT_SOV_frontline_air_control_desc: "Forward liaison creates a steadier flow of air experience."
 INT_SOV_ural_power_grid: "Ural Power Grid"
 INT_SOV_ural_power_grid_desc: "Reliable power makes new industrial construction easier."
 INT_SOV_precision_tools: "Precision Machine Tools"
 INT_SOV_precision_tools_desc: "Better tools raise factory output."
 INT_SOV_black_sea_staff: "Black Sea Naval Staff"
 INT_SOV_black_sea_staff_desc: "Permanent planning improves naval training."
 INT_SOV_workers_congress: "Workers' Congress"
 INT_SOV_workers_congress_desc: "Factory representatives strengthen the workers' republic."
 INT_SOV_plan_consolidation: "Consolidated Plan"
 INT_SOV_plan_consolidation_desc: "Standardized investment improves heavy industrial output."
 INT_SOV_cooperative_union: "Union of Cooperatives"
 INT_SOV_cooperative_union_desc: "Cooperative networks reduce consumer pressure and support stability."
 INT_SOV_grain_requisition: "Grain Requisition"
 INT_SOV_grain_requisition_desc: "Firm procurement supports factories but strains the countryside."
 INT_SOV_grain_compromise: "Grain Compromise"
 INT_SOV_grain_compromise_desc: "Negotiation calms the villages at a cost to urban supply."
 INT_SOV_collective_mechanization: "Collective Mechanization"
 INT_SOV_collective_mechanization_desc: "Machinery raises output while increasing the cost of transition."
 INT_SOV_collective_concessions: "Collective Concessions"
 INT_SOV_collective_concessions_desc: "Local latitude reduces unrest while slowing industrial expansion."
 INT_SOV_plan_quotas: "Plan Quotas"
 INT_SOV_plan_quotas_desc: "Aggressive targets increase output and create strain."
 INT_SOV_plan_quality: "Plan Quality"
 INT_SOV_plan_quality_desc: "Reliable production and technical progress take priority."
 INT_SOV_local_soviets: "Local Soviets"
 INT_SOV_local_soviets_desc: "District councils gain more authority."
 INT_SOV_officer_schools: "Officer Schools"
 INT_SOV_officer_schools_desc: "A wider education system improves command experience."
 INT_SOV_rural_clinic_network: "Rural Clinic Network"
 INT_SOV_rural_clinic_network_desc: "Local medical services support health and confidence."
 INT_sov_rework.7.t: "Who Directs the Factories?"
 INT_sov_rework.7.d: "The Left Opposition must decide whether factory councils or union commissars should set the pace of industrial democracy."
 INT_sov_rework.7.a: "Empower factory councils"
 INT_sov_rework.7.b: "Appoint union commissars"
 INT_SOV_factory_councils: "Factory Councils"
 INT_SOV_factory_councils_desc: "Shop-floor representatives help direct production and settle disputes."
 INT_SOV_union_commissars: "Union Commissars"
 INT_SOV_union_commissars_desc: "Appointed union officials coordinate industrial policy with the state."
