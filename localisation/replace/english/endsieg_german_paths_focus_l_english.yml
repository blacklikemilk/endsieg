l_english:
 INT_GER_parliamentary_commissions: "Parliamentary Commissions"
 INT_GER_parliamentary_commissions_desc: "The young republic can give elected members stronger oversight of administrative work or coordinate their efforts through the cabinet. A choice event establishes the balance and opens future parliamentary decisions."
 INT_GER_civic_education: "Civic Education Program"
 INT_GER_civic_education_desc: "Schools and civic associations can explain the new constitution and give citizens a stronger voice in its institutions. Gain an electronics research bonus and democratic support."
 INT_GER_social_compromise: "Renew the Social Compromise"
 INT_GER_social_compromise_desc: "Employers and trade unions can settle practical disputes over work, wages and demobilization. Stability and civilian manpower reflect a more durable settlement."
 INT_GER_local_government_reform: "Empower Local Government"
 INT_GER_local_government_reform_desc: "Municipal governments need the authority to rebuild services and commission useful civilian projects. Gain a civilian factory and limited administrative capacity."
 INT_GER_republican_crisis_cabinet: "A Crisis Cabinet"
 INT_GER_republican_crisis_cabinet_desc: "After the global economic crash, republican parties must decide whether to prioritize coalition relief or fiscal restraint. A choice event shapes the political cost of defending parliamentary government."
 INT_GER_defend_constitution: "Defend the Constitution"
 INT_GER_defend_constitution_desc: "Civic organizations and constitutional parties can preserve democratic participation through the emergency. Strengthen democratic resilience and support."
 INT_GER_shop_floor_committees: "Shop-Floor Committees"
 INT_GER_shop_floor_committees_desc: "Workplace committees can coordinate production methods and draw workers into the council system. Gain industrial research progress and communist support."
 INT_GER_workers_planning_board: "Workers Planning Board"
 INT_GER_workers_planning_board_desc: "The new council government must choose between dispersed worker committees and a central planning office. A choice event sets the character of economic coordination."
 INT_GER_socialist_welfare: "Organize Socialist Welfare"
 INT_GER_socialist_welfare_desc: "Local councils can coordinate food, housing and employment relief. The program raises stability and brings workers back into the civilian labor pool."
 INT_GER_red_training_schools: "Red Training Schools"
 INT_GER_red_training_schools_desc: "Instructors from the reorganized army can train a new officer corps. Gain army experience and land doctrine research progress."
 INT_GER_workers_republic_constitution: "Charter the Workers Republic"
 INT_GER_workers_republic_constitution_desc: "Consolidate the institutions of the council state after its military and civilian branches are established. Improve stability and communist support."
 INT_GER_prussian_administration: "Rebuild the Prussian Administration"
 INT_GER_prussian_administration_desc: "Experienced provincial offices can restore records, procurement and fiscal administration under a conservative government. Gain industrial research and political capacity."
 INT_GER_federal_chambers: "Establish Federal Chambers"
 INT_GER_federal_chambers_desc: "A constitutional monarchy can preserve regional representation through a permanent chamber of the states. This stabilizes the federal settlement."
 INT_GER_monarchist_reconciliation: "Reconcile the Federal States"
 INT_GER_monarchist_reconciliation_desc: "Negotiate a workable balance between the crown and the state governments. Gain political capacity and stability for the constitutional route."
 INT_GER_royal_railways: "Royal Railway Contracts"
 INT_GER_royal_railways_desc: "The restored administration can commission civilian rail and freight works. Gain one civilian factory and an industrial research bonus."
 INT_GER_restored_court: "Reconstitute the Royal Court"
 INT_GER_restored_court_desc: "The restored monarchy can organize a stable court after bringing the princes and civil service into the new order. Gain stability and neutral support."
 INT_GER_rapallo_commission: "Rapallo Cooperation Commission"
 INT_GER_rapallo_commission_desc: "Set priorities for German-Soviet cooperation: commercial exchange or restricted military research. A choice event shapes the projects that follow."
 INT_GER_eastern_trade_network: "Expand Eastern Trade Networks"
 INT_GER_eastern_trade_network_desc: "Use the trade commissions to build civilian links with the Soviet economy. Gain one civilian factory and limited political capacity while relations remain open."
 INT_GER_eastern_exercises: "Joint Eastern Exercises"
 INT_GER_eastern_exercises_desc: "Staff contacts can improve army training without granting unrestricted rearmament. Gain army experience and a land doctrine bonus."
 INT_GER_joint_aviation_trials: "Joint Aviation Trials"
 INT_GER_joint_aviation_trials_desc: "Technical cooperation can test aviation practices in the east. Gain air experience and light-air research progress when the Soviet partner exists."
 INT_GER_diplomatic_treaty_revision: "Review the Treaty by Diplomacy"
 INT_GER_diplomatic_treaty_revision_desc: "The government must decide whether to publicize legal objections to Versailles or prepare covert procurement. A choice event opens related one-time decisions; the existing revision chain remains available."
 INT_GER_foreign_press_campaign: "Address Foreign Opinion"
 INT_GER_foreign_press_campaign_desc: "Publish Germany's case for revision in foreign newspapers and diplomatic circles. Gain political capacity and limited stability."
 INT_GER_hidden_procurement: "Organize Hidden Procurement"
 INT_GER_hidden_procurement_desc: "Build restricted armament capacity under the treaty regime. Gain one military factory and a small increase in war support."
 INT_GER_officer_professionalization: "Professionalize the Officer Corps"
 INT_GER_officer_professionalization_desc: "Develop a smaller but more capable staff through disciplined training. Gain army and command experience and land doctrine progress."
 INT_GER_party_administration: "Consolidate Party Administration"
 INT_GER_party_administration_desc: "The new authoritarian government can prioritize bureaucratic control or a propaganda apparatus. A choice event establishes how state offices will be directed."
 INT_GER_controlled_press: "Control the Press"
 INT_GER_controlled_press_desc: "Political control of reporting strengthens support for the ruling party while imposing a cost on civic stability."
 INT_GER_reich_labor_front: "Organize the Labor Front"
 INT_GER_reich_labor_front_desc: "Mobilize labor for state priorities after the political takeover. Add available manpower and war support at a cost to stability."
 INT_GER_state_contracts: "Direct State Contracts"
 INT_GER_state_contracts_desc: "Channel public orders to civilian firms. Gain one civilian factory and industrial research progress."
 INT_GER_arms_contracts: "Issue Armaments Contracts"
 INT_GER_arms_contracts_desc: "After the 1935 rearmament decision, commission a military factory and give the army experience with new production."
