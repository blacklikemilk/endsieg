l_english:
 INT_ger_milestone.1.t:0 "The London Reparations Ultimatum"
 INT_ger_milestone.1.d:0 "The Allied powers demand that Germany accept a schedule of reparations totaling 132 billion gold marks. Their ultimatum threatens an occupation of the Ruhr if the Reichstag refuses. Joseph Wirth's new cabinet accepts the terms while arguing that the burden will prove impossible to meet. The decision averts an immediate occupation, but the cost of payments and bitter domestic opposition place fresh strain on the republic."
 INT_ger_milestone.1.a:0 "The cabinet accepts under protest."
 INT_ger_milestone.2.t:0 "Treaty of Rapallo"
 INT_ger_milestone.2.d:0 "German and Soviet Russian delegates have concluded an agreement at Rapallo. The two governments restore diplomatic relations and renounce claims arising from the war and its aftermath. Rathenau and Wirth see a way out of diplomatic isolation; the Western powers regard the surprise agreement with suspicion. Berlin gains a partner for trade and negotiation, though the treaty creates no military alliance."
 INT_ger_milestone.2.a:0 "Restore relations with Soviet Russia."
 INT_ger_milestone.3.t:0 "French and Belgian Troops Occupy the Ruhr"
 INT_ger_milestone.3.d:0 "French and Belgian forces enter the Ruhr industrial district after alleging that Germany has failed to deliver reparations. The Cuno government calls for passive resistance rather than armed confrontation. Workers stop cooperating with the occupiers, and the treasury promises to support them. Coal and steel output falter while the cost of maintaining resistance places mounting pressure on the mark."
 INT_ger_milestone.3.a:0 "Support passive resistance."
 INT_ger_milestone.4.t:0 "The Mark Collapses"
 INT_ger_milestone.4.d:0 "The paper mark is losing value faster than wages can be paid. Prices change during the working day, families spend cash as soon as they receive it, and savings built over a lifetime are disappearing. The expense of Ruhr resistance adds to a budget already weakened by debt and reparations. A new currency and a credible limit on government borrowing are becoming urgent necessities."
 INT_ger_milestone.4.a:0 "The treasury must restore confidence."
 INT_ger_milestone.5.t:0 "The Munich Putsch Fails"
 INT_ger_milestone.5.d:0 "Adolf Hitler and his allies have attempted to seize power in Munich and march on Berlin. Bavarian police stop the march at the Feldherrnhalle, and the revolt collapses. The government bans the Nazi Party and prepares to prosecute its leaders. The immediate threat is contained, but the putsch exposes how far political violence has spread during the currency and Ruhr crises."
 INT_ger_milestone.5.a:0 "Defend the constitutional order."
 INT_ger_milestone.6.t:0 "The Grand Coalition Collapses"
 INT_ger_milestone.6.d:0 "Hermann Müller's coalition cannot agree on how to finance unemployment insurance as joblessness rises. Its resignation ends the last government backed by a broad parliamentary majority. President Hindenburg appoints Heinrich Brüning, who seeks to govern with emergency decrees when the Reichstag will not support his budgets. The economic crisis is now becoming a constitutional crisis."
 INT_ger_milestone.6.a:0 "A presidential cabinet takes office."
 INT_ger_milestone.7.t:0 "The Hoover Moratorium Takes Effect"
 INT_ger_milestone.7.d:0 "A one-year suspension of intergovernmental war debts and reparations begins under the plan proposed by the United States. Germany gains some breathing room as foreign loans are withdrawn and unemployment rises. The pause does not cancel its obligations, and private creditors still demand payment, but it gives the cabinet time to seek a more durable settlement."
 INT_ger_milestone.7.a:0 "Use the respite carefully."
 INT_ger_milestone.8.t:0 "The German Banking Crisis"
 INT_ger_milestone.8.d:0 "The collapse of the Danat-Bank sets off a run on German banks. Depositors crowd branches to withdraw their savings, while businesses fear that credit will vanish. The government orders emergency bank holidays and seeks help from foreign central banks. Production and investment are already weak; a loss of confidence in the financial system threatens to deepen the depression."
 INT_ger_milestone.8.a:0 "Stabilize the banks."
 INT_ger_milestone.9.t:0 "Lausanne Suspends German Reparations"
 INT_ger_milestone.9.d:0 "Delegates at Lausanne agree that the reparations system cannot continue under the weight of the world depression. Germany's remaining payments are set aside as the powers seek a broader settlement of war debts. The cabinet presents the result as the end of a long struggle over the postwar bill. Relief to the budget is real, though unemployment and political instability remain unresolved."
 INT_ger_milestone.9.a:0 "The reparations burden is lifted."
 INT_ger_milestone.10.t:0 "The Reichstag Fire Decree"
 INT_ger_milestone.10.d:0 "The Reichstag building has burned, and the Hitler cabinet uses the fire to demand emergency powers. President Hindenburg signs a decree suspending fundamental civil liberties. Police may now detain political opponents and suppress publications and meetings. The government calls the measures a defense against revolution; the republic's constitutional protections are being dismantled."
 INT_ger_milestone.10.a:0 "Emergency powers take effect."
 INT_ger_milestone.11.t:0 "The Enabling Act Passes"
 INT_ger_milestone.11.d:0 "The Reichstag has passed a law permitting Hitler's cabinet to enact legislation without parliamentary approval. Opposition deputies face intimidation, and Communist mandates have already been nullified. Otto Wels speaks against the measure for the Social Democrats, but his party cannot block it. The cabinet can now govern outside the ordinary legislative process, leaving the constitutional parliament without effective control."
 INT_ger_milestone.11.a:0 "Parliament yields its authority."
 INT_ger_milestone.12.t:0 "President Hindenburg Dies"
 INT_ger_milestone.12.d:0 "Paul von Hindenburg has died. His presidency was the last office with a formal claim to stand above the Hitler cabinet. A law prepared before his death merges the offices of president and chancellor, placing the powers of both in Hitler's hands. The army is instructed to swear a personal oath to him. Germany enters a new phase of one-man rule."
 INT_ger_milestone.12.a:0 "The offices are merged."
 INT_GER_london_reparations:0 "London Reparations Schedule"
 INT_GER_london_reparations_desc:0 "The 1921 Allied payment schedule strains the budget and intensifies opposition to the republic."
 INT_GER_ruhr_resistance:0 "Passive Resistance in the Ruhr"
 INT_GER_ruhr_resistance_desc:0 "The government supports non-cooperation with the occupation, at heavy cost to production and public finances."
 INT_GER_hyperinflation:0 "Hyperinflation"
 INT_GER_hyperinflation_desc:0 "The collapse of the paper mark destroys savings and undermines daily economic life."
 INT_GER_political_violence:0 "Political Violence"
 INT_GER_political_violence_desc:0 "The failed Munich putsch exposes armed hostility to the republic."
 INT_GER_parliamentary_deadlock:0 "Parliamentary Deadlock"
 INT_GER_parliamentary_deadlock_desc:0 "Coalitions cannot agree on a response to unemployment and the depression."
 INT_GER_hoover_moratorium:0 "Hoover Moratorium"
 INT_GER_hoover_moratorium_desc:0 "A temporary suspension of war-debt and reparations payments eases pressure on the treasury."
 INT_GER_banking_crisis:0 "Banking Crisis"
 INT_GER_banking_crisis_desc:0 "Bank failures and withdrawals restrict credit and weaken confidence in the economy."
 INT_GER_lausanne_settlement:0 "Lausanne Settlement"
 INT_GER_lausanne_settlement_desc:0 "Further German reparations are set aside, easing the postwar fiscal burden."
 INT_GER_reichstag_fire_decree:0 "Reichstag Fire Decree"
 INT_GER_reichstag_fire_decree_desc:0 "Emergency powers suspend constitutional liberties and permit repression of political opponents."
 INT_GER_enabling_act:0 "Enabling Act"
 INT_GER_enabling_act_desc:0 "The cabinet may legislate without effective parliamentary oversight."
 INT_ger_milestone.13.t:0 "Fighting in Berlin"
 INT_ger_milestone.13.d:0 "Armed revolutionary groups and their supporters occupy parts of central Berlin as the new republic prepares to elect a national assembly. The government calls on loyal forces to regain the streets, while workers' demonstrations and rival claims to authority divide the city. Any decision to use force carries a grave risk of further bloodshed and a lasting split within the German left."
 INT_ger_milestone.13.a:0 "Hold the capital together."
 INT_ger_milestone.14.t:0 "A Council Republic Proclaimed in Bavaria"
 INT_ger_milestone.14.d:0 "Revolutionary councils in Munich proclaim a Bavarian republic governed through workers' and soldiers' councils. The elected state government leaves the city and seeks support to restore its authority. Control of Bavaria outside Munich remains uncertain, and armed groups gather on both sides. The national government faces another challenge to its fragile postwar order."
 INT_ger_milestone.14.a:0 "The crisis spreads to Bavaria."
 INT_ger_milestone.15.t:0 "The Munich Council Republic Is Suppressed"
 INT_ger_milestone.15.d:0 "Government troops and volunteer formations have taken Munich after fierce fighting. The council government is gone, but deaths in the streets and reprisals against suspected supporters deepen the divide between revolutionary workers and the republic's leaders. Restoring civil administration will take more than a military victory."
 INT_ger_milestone.15.a:0 "The fighting leaves deep wounds."
 INT_ger_milestone.16.t:0 "The Night of the Long Knives"
 INT_ger_milestone.16.d:0 "Hitler orders the arrest and killing of leaders of the SA and other people he regards as rivals. Ernst Röhm is among the targets; former chancellor Kurt von Schleicher is also murdered. The government presents the killings as a response to an imminent revolt, but many victims have no connection to such a plot. The army leadership offers no public resistance as the regime claims authority to kill without trial."
 INT_ger_milestone.16.a:0 "The purge shocks the country."
 INT_ger_milestone.17.t:0 "Germany Leaves the League of Nations"
 INT_ger_milestone.17.d:0 "The Hitler government announces that Germany will leave the League of Nations and the disarmament talks in Geneva. Berlin argues that the other powers refuse Germany equal treatment in armaments. Foreign governments see the withdrawal as a challenge to the international settlement, and diplomacy loses a forum that the Weimar republic had worked to enter only seven years earlier."
 INT_ger_milestone.17.a:0 "Withdraw from Geneva."
 INT_ger_milestone.18.t:0 "Anglo-German Naval Agreement"
 INT_ger_milestone.18.d:0 "British and German representatives sign an agreement allowing the German navy to reach 35 percent of British naval tonnage overall, with a separate provision for submarines. London hopes a defined limit will prevent an uncontrolled naval race; Berlin treats the deal as recognition of its rearmament. France has not been included in the negotiation, and the agreement revises naval restrictions set after the Great War."
 INT_ger_milestone.18.a:0 "Build within the agreed ratio."
 INT_ger_milestone.19.t:0 "The Nuremberg Laws"
 INT_ger_milestone.19.d:0 "The regime announces new laws at its party rally in Nuremberg. Jewish Germans are stripped of full citizenship, and marriages and intimate relationships between Jews and people classified by the state as German blood are prohibited. The measures make racial persecution a matter of national law and deepen the exclusion already imposed through dismissals, boycotts, and violence."
 INT_ger_milestone.19.a:0 "Discrimination is written into law."
 INT_GER_revolutionary_disorder:0 "Revolutionary Disorder"
 INT_GER_revolutionary_disorder_desc:0 "Fighting in Berlin disrupts administration and production during the republic's first weeks."
 INT_GER_bavarian_council_republic:0 "Bavarian Council Republic"
 INT_GER_bavarian_council_republic_desc:0 "A council government in Munich contests the authority of the elected state government."
 INT_GER_purge_aftermath:0 "Aftermath of the June Purge"
 INT_GER_purge_aftermath_desc:0 "Extrajudicial killings and fear within the regime unsettle political life."
 INT_GER_discriminatory_laws:0 "Nuremberg Laws"
 INT_GER_discriminatory_laws_desc:0 "State-enforced racial persecution excludes people from public life and drives away skills and knowledge."
