l_english:
 ###### WW1 victory localisation is in events_l_english on line 4329 #######
 kaiserschlachtvictory.1.t:0 "A Peace Offer to France"
 kaiserschlachtvictory.1.d:0 "Our armies have entered Paris and occupied much of northern France. Ministers argue that the victory gives Germany an opportunity to end the war on favourable terms. Others demand that the advance continue until French resistance is completely broken."
 kaiserschlachtvictory.1.a:0 "Offer an armistice."
 kaiserschlachtvictory.1.b:0 "Continue the offensive."

 kaiserschlachtvictory.2.t:0 "Germany Offers an Armistice"
 kaiserschlachtvictory.2.d:0 "German representatives have offered an armistice following the loss of Paris. The occupation of northern France has gravely weakened our ability to sustain the war. The government must choose between opening negotiations and asking the country to endure another campaign."
 kaiserschlachtvictory.2.a:0 "Accept the armistice."
 kaiserschlachtvictory.2.b:0 "Continue the war."

 kaiserschlachtvictory.3.t:0 "France Rejects the Armistice"
 kaiserschlachtvictory.3.d:0 "The French government has rejected our armistice offer. Its representatives declare that France will continue the war despite the loss of Paris. Our commanders must prepare to renew the offensive."
 kaiserschlachtvictory.3.a:0 "Prepare for renewed fighting."

 kaiserschlachtvictory.4.t:0 "The Armistice of the Marne"
 kaiserschlachtvictory.4.d:0 "France has accepted an armistice following the capture of Paris. The agreement brings the fighting between our two countries to an end and opens the way to a German peace settlement. The other Entente governments must now decide how to respond to their ally's defeat."
 kaiserschlachtvictory.4.a:0 "Begin the peace negotiations."

 kaiserschlachtvictory.5.t:0 "Britain Considers the German Armistice"
 kaiserschlachtvictory.5.d:0 "France has accepted a German armistice, leaving Britain without its principal continental partner. The cabinet must weigh continued resistance against the cost of a war that has lost its main land front. Berlin is prepared to hear an armistice proposal."
 kaiserschlachtvictory.5.a:0 "Seek an honourable peace."
 kaiserschlachtvictory.5.b:0 "Britain will continue the war."

 kaiserschlachtvictory.6.t:0 "Britain Accepts the Armistice"
 kaiserschlachtvictory.6.d:0 "The British government has agreed to an armistice after the French defeat. Negotiators will now discuss a final settlement between the two empires. Britain's fleet and overseas position ensure that these talks will demand concessions as well as firmness."
 kaiserschlachtvictory.6.a:0 "Open negotiations with London."

 kaiserschlachtvictory.7.t:0 "Britain Rejects the Peace Terms"
 kaiserschlachtvictory.7.d:0 "London has rejected our peace terms. The British cabinet is unwilling to accept the settlement offered after France's defeat. The dispute remains a threat to the peace we have sought in the west."
 kaiserschlachtvictory.7.a:0 "The British question remains unresolved."

 kaiserschlachtvictory.8.t:0 "An Armistice for Italy"
 kaiserschlachtvictory.8.d:0 "The defeat of France has weakened the promises on which Italy entered the war. Ministers face growing demands to end the fighting before further losses leave us with even less influence at the peace table. The Central Powers have offered an armistice."
 kaiserschlachtvictory.8.a:0 "Accept the armistice."
 kaiserschlachtvictory.8.b:0 "Italy will continue the war."

 kaiserschlachtvictory.9.t:0 "Italy Accepts the Armistice"
 kaiserschlachtvictory.9.d:0 "Italy has accepted an armistice with the Central Powers. Its government has chosen negotiation over another campaign after the collapse of the French position. The territorial terms remain to be settled."
 kaiserschlachtvictory.9.a:0 "Prepare the Italian settlement."

 kaiserschlachtvictory.10.t:0 "Italy Rejects the Armistice"
 kaiserschlachtvictory.10.d:0 "Rome has rejected the armistice and declared its intention to continue the war. The Italian government still hopes to resist the settlement demanded by the Central Powers. Its answer has hardened opinion among our ministers and commanders."
 kaiserschlachtvictory.10.a:0 "Germany will stand firm."
 kaiserschlachtvictory.10.b:0 "Vienna must reconsider its position."

 kaiserschlachtvictory.11.t:0 "A German Armistice Offer"
 kaiserschlachtvictory.11.d:0 "Berlin proposes ending the war with the United States without territorial demands or reparations. France's defeat has raised difficult questions about the prospects of another campaign in Europe. The administration must decide whether to accept the offer or continue the struggle."
 kaiserschlachtvictory.11.a:0 "Accept peace without reparations."
 kaiserschlachtvictory.11.b:0 "Continue the American war effort."

 kaiserschlachtvictory.12.t:0 "America Accepts the Armistice"
 kaiserschlachtvictory.12.d:0 "The American government has accepted our armistice proposal. Hostilities between Germany and the United States are to end without territorial concessions or reparations. Another major belligerent has left the war behind."
 kaiserschlachtvictory.12.a:0 "Welcome the end of hostilities."

 kaiserschlachtvictory.13.t:0 "America Rejects the Armistice"
 kaiserschlachtvictory.13.d:0 "Washington has rejected the armistice despite the limited terms we offered. American representatives insist that their government is not prepared to end the war on this basis. Our diplomacy must now reckon with continued opposition across the Atlantic."
 kaiserschlachtvictory.13.a:0 "Our differences remain unsettled."

 kaiserschlachtvictory.14.t:0 "A Letter from the German Emperor"
 kaiserschlachtvictory.14.d:0 "A letter from the German emperor proposes an armistice and a wider understanding in East Asia. Berlin offers to consider our position in the Pacific and French Indochina as part of the peace negotiations. The cabinet must decide whether this approach serves Japan's interests better than continued war."
 kaiserschlachtvictory.14.a:0 "Accept the armistice."
 kaiserschlachtvictory.14.b:0 "Decline the German approach."

 kaiserschlachtvictory.15.t:0 "Japan Accepts the Armistice"
 kaiserschlachtvictory.15.d:0 "Tokyo has accepted an armistice following the emperor's diplomatic approach. The agreement ends the immediate conflict while leaving the Pacific possessions for further negotiation. Germany must now consider the concessions required for a lasting understanding."
 kaiserschlachtvictory.15.a:0 "Turn to the Pacific negotiations."
 kaiserschlachtvictory.16.t:0 "Japan Declines the Armistice"
 kaiserschlachtvictory.16.d:0 "Tokyo has declined the proposed armistice. The emperor's appeal has failed to overcome the Japanese government's objections. Our position in East Asia remains unsettled."
 kaiserschlachtvictory.16.a:0 "Reconsider our diplomatic position."

 kaiserschlachtvictory.17.t:0 "An Armistice with Germany"
 kaiserschlachtvictory.17.d:0 "Germany's victory in Europe has brought an offer to end our distant war. The status of Qingdao remains the principal unresolved question between the two governments. We may accept peace, insist on recognition of Chinese sovereignty, or withhold an agreement."
 kaiserschlachtvictory.17.a:0 "Accept peace and recognise the concession."
 kaiserschlachtvictory.17.b:0 "Peace requires recognition of Chinese Qingdao."
 kaiserschlachtvictory.17.c:0 "Withhold an armistice."

 kaiserschlachtvictory.18.t:0 "China Recognises the German Concession"
 kaiserschlachtvictory.18.d:0 "China has accepted peace while recognising the German concession at Qingdao. The agreement opens the way to restoring our administration wherever the Chinese authorities can carry out its terms. Any dispute with another occupying power remains to be settled."
 kaiserschlachtvictory.18.a:0 "Prepare to restore the concession."

 kaiserschlachtvictory.19.t:0 "The Future of Qingdao"
 kaiserschlachtvictory.19.d:0 "China will agree to peace if Germany recognises the end of its concession at Qingdao. The port's occupation complicates the proposal, and Berlin must decide whether to arrange a transfer, support the Chinese claim, or uphold its own rights. The answer will shape our relations with both China and Japan."
 kaiserschlachtvictory.19.a:0 "Agree to the transfer of Qingdao."
 kaiserschlachtvictory.19.b:0 "Support the Chinese claim."
 kaiserschlachtvictory.19.c:0 "Uphold Germany's rights."

 kaiserschlachtvictory.20.t:0 "China Requests Qingdao"
 kaiserschlachtvictory.20.d:0 "Germany has recognised China's claim to Qingdao, but the port remains in our hands. Chinese representatives ask us to carry out the transfer required by the agreement. The cabinet must decide whether to recognise their claim or retain the occupation."
 kaiserschlachtvictory.20.a:0 "Transfer Qingdao to China."
 kaiserschlachtvictory.20.b:0 "Retain the port."

 kaiserschlachtvictory.21.t:0 "China Declines the Armistice"
 kaiserschlachtvictory.21.d:0 "China has declined to conclude an armistice. Its government remains formally at war with Germany despite the lack of a decisive campaign between our countries. The Qingdao dispute continues to obstruct a settlement."
 kaiserschlachtvictory.21.a:0 "The formal state of war continues."

 kaiserschlachtvictory.22.t:0 "Qingdao Is Lost"
 kaiserschlachtvictory.22.d:0 "Chinese forces have taken Qingdao and established their own administration. The loss places the future of our concession in doubt. We must decide whether to accept the outcome or prepare to recover the port."
 kaiserschlachtvictory.22.a:0 "Accept the loss of Qingdao."
 kaiserschlachtvictory.22.b:0 "Prepare to recover the port."

 kaiserschlachtvictory.23.t:0 "The Struggle for Qingdao"
 kaiserschlachtvictory.23.d:0 "Our attempt to recover Qingdao has failed. The loss has sharpened demands for an end to the fighting, while others insist that China cannot accept foreign control of the port. The government must decide whether to recognise the present position or continue the struggle."
 kaiserschlachtvictory.23.a:0 "Accept the present settlement."
 kaiserschlachtvictory.23.b:0 "Continue the struggle for Qingdao."

 kaiserschlachtvictory.24.t: "" #TODO
 kaiserschlachtvictory.24.d: ""
 kaiserschlachtvictory.24.a: ""
 kaiserschlachtvictory.24.b: ""

 kaiserschlachtvictory.25.t:0 "France Leaves the War"
 kaiserschlachtvictory.25.d:0 "France has accepted an armistice with Germany. Our principal ally has left the war, and the balance on the continent has changed sharply against us. The government must consider how to secure the country's future in the negotiations ahead."
 kaiserschlachtvictory.25.a:0 "We must reassess our position."

 kaiserschlachtvictory.123.t:0 "The Future of Belgium"
 kaiserschlachtvictory.123.d:0 "The peace conference has reached the question of Belgium. Our representatives propose several alternatives, from restoring the prewar kingdom to annexation or a division under German influence. The Congo is also at stake in the wider colonial settlement."
 kaiserschlachtvictory.123.a:0 "Annex Belgium."
 kaiserschlachtvictory.123.b:0 "Establish a dependent Belgian state."
 kaiserschlachtvictory.123.c:0 "Take the Meuse lands and subordinate Belgium."
 kaiserschlachtvictory.123.dd:0 "Take the Meuse lands and Congo; subordinate Belgium."
 kaiserschlachtvictory.123.e:0 "Divide Belgium into Flanders and Wallonia."
 kaiserschlachtvictory.123.f:0 "Restore prewar Belgium."
 kaiserschlachtvictory.124.t:0 "Belgian Annexation Terms"
 kaiserschlachtvictory.124.d:0 "The delegation has drafted terms annexing Belgium to Germany. The proposal would end the kingdom's independent existence. Ministers must either approve these terms or return the question to the conference."
 kaiserschlachtvictory.124.a:0 "Approve the annexation."
 kaiserschlachtvictory.124.b:0 "Reopen the Belgian question."
 kaiserschlachtvictory.125.t:0 "A Dependent Belgian State"
 kaiserschlachtvictory.125.d:0 "The delegation proposes retaining a Belgian state under German authority. Its government would continue to administer the country within the settlement imposed by Berlin. Ministers must decide whether to approve this arrangement."
 kaiserschlachtvictory.125.a:0 "Approve the dependent government."
 kaiserschlachtvictory.125.b:0 "Reopen the Belgian question."
 kaiserschlachtvictory.126.t:0 "The Meuse Settlement"
 kaiserschlachtvictory.126.d:0 "The proposed settlement cedes Belgian territory along the Meuse to Germany and places the remaining state under German authority. The Congo is excluded from these terms. The delegation awaits approval before proceeding."
 kaiserschlachtvictory.126.a:0 "Approve the Meuse settlement."
 kaiserschlachtvictory.126.b:0 "Reopen the Belgian question."
 kaiserschlachtvictory.127.t:0 "Belgium and the Congo"
 kaiserschlachtvictory.127.d:0 "The delegation proposes ceding the Belgian lands along the Meuse and the Congo to Germany. The remaining Belgian state would stand under German authority. Ministers must approve the package or reopen the negotiations."
 kaiserschlachtvictory.127.a:0 "Approve the combined settlement."
 kaiserschlachtvictory.127.b:0 "Reopen the Belgian question."
 kaiserschlachtvictory.128.t:0 "The Division of Belgium"
 kaiserschlachtvictory.128.d:0 "The proposed settlement divides Belgium into Flemish and Walloon states and transfers the Congo to Germany. It would replace the Belgian kingdom with a new political order under German influence. The delegation awaits the government's final decision."
 kaiserschlachtvictory.128.a:0 "Approve the division and colonial transfer."
 kaiserschlachtvictory.128.b:0 "Reopen the Belgian question."

 kaiserschlachtvictory.257.t: "The Fate of the Colonial Empires"
 kaiserschlachtvictory.257.d: "With the Entente defeated, its colonial empires cannot remain as they were. The territories named in the settlement will be transferred to German administration as part of the postwar order."
 kaiserschlachtvictory.257.a: "Secure the colonial settlement."

 kaiserschlachtvictory.258.t: "The Pacific Question"
 kaiserschlachtvictory.258.d: "The defeat of the Entente has left its possessions in Southeast Asia exposed. British Malaya will become the centre of a German East Asian administration, joined by any territories in Indochina and the Pacific already held by Germany."
 kaiserschlachtvictory.258.a: "Establish German East Asia."

 kaiserschlachtvictory.129.t:0 "The Future of Egypt"
 kaiserschlachtvictory.129.d:0 "Egypt and the Suez Canal have become central questions in the colonial negotiations. Britain seeks to preserve its route to the east, while Germany, the Ottoman Empire and Italy have their own ambitions. Our delegation must decide what political and territorial arrangement to demand."
 kaiserschlachtvictory.129.a:0 "Demand the Suez Canal for Germany."
 kaiserschlachtvictory.129.b:0 "Transfer the canal to the Ottoman Empire."
 kaiserschlachtvictory.129.c:0 "Establish a dependent Egyptian government."
 kaiserschlachtvictory.129.dd:0 "Transfer Egypt to the Ottoman Empire."
 kaiserschlachtvictory.129.e:0 "Assume the Egyptian protectorate."
 kaiserschlachtvictory.129.f:0 "Leave the existing arrangement in place."
 kaiserschlachtvictory.130.t:0 "Restoring Belgium"
 kaiserschlachtvictory.130.d:0 "The delegation proposes restoring Belgium's prewar territorial position. The kingdom would retain its independence rather than accept annexation or a new division. Ministers must approve the terms or reopen the negotiations."
 kaiserschlachtvictory.130.a:0 "Approve the restoration."
 kaiserschlachtvictory.130.b:0 "Reopen the Belgian question."
 kaiserschlachtvictory.131.t:0 "The Egyptian Settlement"
 kaiserschlachtvictory.131.d:0 "The delegation has completed its proposed settlement for Egypt and the Suez Canal. The terms determine the future administration of one of the world's most important maritime routes. Ministers must either confirm the agreement or reopen the Egyptian question."
 kaiserschlachtvictory.131.a:0 "Confirm the Egyptian terms."
 kaiserschlachtvictory.131.b:0 "Reopen the Egyptian question."
 kaiserschlachtvictory.156.t:0 "The Future of Gibraltar"
 kaiserschlachtvictory.156.d:0 "Gibraltar guards the western entrance to the Mediterranean and supports Britain's route to Suez. Our delegation can demand the fortress for Germany, support its transfer to Spain, or leave British possession undisturbed. The decision will shape naval access after the war."
 kaiserschlachtvictory.156.a:0 "Demand Gibraltar for Germany."
 kaiserschlachtvictory.156.b:0 "Transfer Gibraltar to Spain."
 kaiserschlachtvictory.156.c:0 "Leave Gibraltar under Britain."
 kaiserschlachtvictory.157.t:0 "The Gibraltar Settlement"
 kaiserschlachtvictory.157.d:0 "The delegation has entered the proposed disposition of Gibraltar into the settlement. Its possession will influence access between the Atlantic and the Mediterranean. Ministers must confirm the terms or return to the negotiations."
 kaiserschlachtvictory.157.a:0 "Confirm the Gibraltar terms."
 kaiserschlachtvictory.157.b:0 "Reopen the Gibraltar question."
 kaiserschlachtvictory.163.t:0 "The Future of Malta"
 kaiserschlachtvictory.163.d:0 "Malta provides Britain with a major base in the central Mediterranean. Germany and Italy both have reasons to seek control of the island. The delegation must decide whether to demand a transfer or leave the British base in place."
 kaiserschlachtvictory.163.a:0 "Demand Malta for Germany."
 kaiserschlachtvictory.163.b:0 "Transfer Malta to Italy."
 kaiserschlachtvictory.163.c:0 "Leave Malta under Britain."
 kaiserschlachtvictory.164.t:0 "The Maltese Settlement"
 kaiserschlachtvictory.164.d:0 "The proposed settlement for Malta is ready for approval. The island's future administration will shape the naval balance in the central Mediterranean. Ministers must confirm the agreement or reopen the question."
 kaiserschlachtvictory.164.a:0 "Confirm the Maltese terms."
 kaiserschlachtvictory.164.b:0 "Reopen the Maltese question."

 kaiserschlachtvictory.242.t:0 "The Second Treaty of Frankfurt"
 kaiserschlachtvictory.242.desc:0 "The conference has opened negotiations on France's territorial losses. Military representatives demand additional security along the Lorraine frontier, while colonial advocates press for possessions overseas. Germany must decide how far its victory should reshape the French state."
 kaiserschlachtvictory.242.a:0 "Demand the Lorraine frontier strip."
 kaiserschlachtvictory.242.0: "We'll take nothing, have the status quo of 1871 restored!"
 kaiserschlachtvictory.242.b:0 "Demand Lorraine and African possessions."
 kaiserschlachtvictory.242.c:0 "Demand mainland France."
 kaiserschlachtvictory.242.d:0 "Demand the widest territorial settlement."

 kaiserschlachtvictory.243.t: ""
 kaiserschlachtvictory.243.d: ""
 kaiserschlachtvictory.243.a: ""

 kaiserschlachtvictory.244.t:0 "The Treaty of Constantinople"
 kaiserschlachtvictory.244.d:0 "The peace conference is settling the claims of Bulgaria and the Ottoman Empire against their defeated Balkan opponents. Sofia seeks an enlarged position in the region, while Constantinople presses its own strategic demands. The delegation must give effect to the portion of the settlement now before it."
 kaiserschlachtvictory.244.a:0 "Confirm the Bulgarian settlement."
 kaiserschlachtvictory.244.b:0 "Confirm the Ottoman settlement."

 kaiserschlachtvictory.245.t:0 "The Balkan Settlement"
 kaiserschlachtvictory.245.d:0 "The defeat of the Entente has opened the way to a new Balkan settlement. The Central Powers seek an arrangement that will secure their influence and satisfy their allies. The delegation now turns to the regional claims left by the war."
 kaiserschlachtvictory.245.a:0 "Proceed with the Balkan terms."

 kaiserschlachtvictory.246.t:0 "The Treaty of Innsbruck"
 kaiserschlachtvictory.246.d:0 "The Treaty of Innsbruck sets out Italy's losses after its defeat. The settlement addresses its African possessions, the Dervish state, Rhodes and the northern Adriatic frontier. Our representatives are preparing to carry out the agreed transfers."
 kaiserschlachtvictory.246.a:0 "Carry out the agreed transfers."

 kaiserschlachtvictory.247.t:0 "The Corsican Question"
 kaiserschlachtvictory.247.d:0 "The conference is considering Corsica as part of the settlement with France. Italian representatives invoke its historical ties to the peninsula, while others favour leaving it under French administration. The delegation must decide whether to support the Italian claim."
 kaiserschlachtvictory.247.a:0 "Transfer Corsica to Italy."
 kaiserschlachtvictory.247.b:0 "Leave Corsica under France."
 kaiserschlachtvictory.247.c: "It would be prudent to give the Italians something..."

 kaiserschlachtvictory.248.t:0 "The Kuwait Question"
 kaiserschlachtvictory.248.d:0 "Kuwait offers a useful position at the head of the Persian Gulf. The Ottoman government seeks its return, while German representatives argue for a foothold of our own. The delegation must decide which claim to advance."
 kaiserschlachtvictory.248.a:0 "Demand Kuwait for Germany."
 kaiserschlachtvictory.248.b:0 "Transfer Kuwait to the Ottoman Empire."

 kaiserschlachtvictory.249.t:0 "The Future of French Indochina"
 kaiserschlachtvictory.249.d:0 "France's defeat has placed the future of Indochina before the peace conference. Germany could extend its own overseas administration, while Japan seeks recognition of its ambitions in the region. The decision will shape our relations in East Asia long after the European fighting ends."
 kaiserschlachtvictory.249.a:0 "Bring Indochina under German administration."
 kaiserschlachtvictory.249.b:0 "Support Japanese possession of Indochina."

 kaiserschlachtvictory.250.t:0 "The German Pacific Possessions"
 kaiserschlachtvictory.250.d:0 "Japan has occupied German island possessions in the Pacific during the war. Berlin can seek their return or offer formal recognition of Japanese possession in exchange for compensation. Either course will require Tokyo's agreement."
 kaiserschlachtvictory.250.a:0 "Offer recognition in exchange for compensation."
 kaiserschlachtvictory.250.b:0 "Demand the return of the islands."

 kaiserschlachtvictory.251.t:0 "A Pacific Purchase Agreement"
 kaiserschlachtvictory.251.d:0 "Germany offers to recognise our possession of its Pacific island colonies in exchange for compensation. Acceptance would settle the dispute through purchase. Refusal leaves our occupation to be defended without German recognition."
 kaiserschlachtvictory.251.a:0 "Purchase German recognition."
 kaiserschlachtvictory.251.b:0 "Retain the islands without payment."

 kaiserschlachtvictory.252.t:0 "Germany Demands Its Islands"
 kaiserschlachtvictory.252.d:0 "Berlin demands the return of the German Pacific possessions occupied during the war. The cabinet must decide whether to restore them or maintain our present position. The answer may determine whether the colonial dispute can be settled peacefully."
 kaiserschlachtvictory.252.a:0 "Retain the Pacific possessions."
 kaiserschlachtvictory.252.b:0 "Return the possessions to Germany."

 kaiserschlachtvictory.253.t:0 "Japan Rejects the Pacific Settlement"
 kaiserschlachtvictory.253.d:0 "Tokyo has refused the proposed settlement for the Pacific islands. The dispute remains unresolved despite the peace negotiations in Europe. Some ministers now urge a firmer response, while others doubt the wisdom of another confrontation."
 kaiserschlachtvictory.253.a:0 "Consider our response."

 kaiserschlachtvictory.254.t: "The Treaty of Brest-Litovsk"
 kaiserschlachtvictory.254.d: "After several months of brutal negotiations a final treaty has been agreed upon between our government in an effort to stop further advances by the Germanand Austro-Hungarian forces. According to the treaty, we will default on all of Imperial Russia's commitments ot the Triple Entente alliance. In the treaty we will cede all of the Baltic States to Germany meant to become German vassal states under German princelings, recognize the independence of Ukraine, cede Byelorussia, cede Kars Oblast in the South Caucasus to the Ottoman Turks. The terms are far above harsh and it is even said the German negotiator has been shocked by the harshness."
 kaiserschlachtvictory.254.a: "Excellent!"

 kaiserschlachtvictory.255.t:0 "The Future of Switzerland"
 kaiserschlachtvictory.255.d:0 "Switzerland's position has become a question for the peace conference. German representatives may seek a dependent government or leave the country's independent neutrality intact. Ministers must decide whether further demands serve the settlement we hope to preserve."
 kaiserschlachtvictory.255.a:0 "Establish a dependent Swiss government."
 kaiserschlachtvictory.255.b:0 "Respect Swiss independence and neutrality."

 kaiserschlachtvictory.256.t:0 "The Treaty of Bologna"
 kaiserschlachtvictory.256.d:0 "Italy's participation alongside Germany has secured concessions in the peace negotiations. The settlement grants the agreed territories in North Africa and along the Franco-Italian frontier, with restrictions on French military preparations nearby. The government is preparing to put the treaty into effect."
 kaiserschlachtvictory.256.a:0 "Carry out the Italian settlement."
 kaiserschlachtvictory.129.italy:0 "Transfer Egypt to Italy."
