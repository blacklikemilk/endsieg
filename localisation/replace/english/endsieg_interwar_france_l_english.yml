l_english:
INT_france.1.t:0 "Raymond Poincaré"
 INT_france.1.d:0 "The Republic enters the peace under President Raymond Poincaré. His government faces the twin tasks of securing France's borders and repairing the country after four years of war."
 INT_france.1.a:0 "The Republic must be rebuilt."
 INT_france.2.t:0 "Alexandre Millerand Elected President"
 INT_france.2.d:0 "The parliamentary chambers have elected Alexandre Millerand to the presidency. His assertive view of executive authority may test the customs of the Third Republic."
 INT_france.2.a:0 "A new president takes office."
 INT_france.3.t:0 "Gaston Doumergue Elected President"
 INT_france.3.d:0 "Gaston Doumergue succeeds Millerand after the latter loses parliamentary support. He promises to act as a constitutional arbiter while a new coalition takes office."
 INT_france.3.a:0 "The presidency changes hands."
 INT_france.4.t:0 "Paul Doumer Elected President"
 INT_france.4.d:0 "Paul Doumer has won the presidential election. A veteran of public finance and colonial administration, he takes office as France struggles with falling trade and cabinet instability."
 INT_france.4.a:0 "The Chamber has chosen."
 INT_france.5.t:0 "Albert Lebrun Elected President"
 INT_france.5.d:0 "Following Doumer's assassination, the chambers have elected Albert Lebrun. The new president inherits an unsettled political scene and a deepening economic slump."
 INT_france.5.a:0 "A new president must steady France."
 INT_france.6.t:0 "The Blue Horizon Chamber"
 INT_france.6.d:0 "The postwar election sends a conservative majority to the Chamber. Veterans and advocates of a firm peace have gained influence, while the government must still finance reconstruction."
 INT_france.6.a:0 "A new majority takes shape."
 INT_france.7.t:0 "French Troops Enter the Ruhr"
 INT_france.7.d:0 "French and Belgian forces have entered the Ruhr after Germany falls behind on deliveries. Paris hopes to enforce reparations, but the occupation is already provoking resistance and international concern."
 INT_france.7.a:0 "The question of payment now becomes a confrontation."
 INT_france.8.t:0 "The Cartel Wins the Election"
 INT_france.8.d:0 "The Cartel des Gauches has won the parliamentary election. Its parties agree on opposition to the old majority but differ over tax, religion, and security policy."
 INT_france.8.a:0 "The left prepares to govern."
 INT_france.9.t:0 "Poincaré Returns to Government"
 INT_france.9.d:0 "The franc's collapse has brought Raymond Poincaré back to lead a broad cabinet. Ministers from rival parties are accepting painful fiscal measures in the hope of restoring confidence."
 INT_france.9.a:0 "A national union faces the crisis."
 INT_france.10.t:0 "The Franc Stabilized"
 INT_france.10.d:0 "Parliament has adopted a new monetary law after years of exchange-rate instability. The franc's lower parity reflects wartime debt and inflation, but the government hopes the settlement will give households and businesses a dependable currency."
 INT_france.10.a:0 "Confidence has a price."
 INT_france.11.t:0 "The Slump Deepens"
 INT_france.11.d:0 "The international depression is reaching French commerce and industry. Falling demand and tax revenue are forcing the cabinet to consider relief, public works, and a disputed budget."
 INT_france.11.a:0 "The crisis can no longer be treated as distant."
 INT_france.12.t:0 "The Stavisky Scandal"
 INT_france.12.d:0 "A financial fraud case has raised questions about political patronage and police protection. Opposition leagues use the affair to attack parliament, while the cabinet struggles to establish the facts and retain confidence."
 INT_france.12.a:0 "The Republic faces a crisis of trust."
 INT_france.13.t:0 "Violence on the Place de la Concorde"
 INT_france.13.d:0 "Demonstrators have clashed with police near the Chamber of Deputies. Dead and wounded lie in the streets, the government is under immense pressure, and parties across France disagree sharply over what the violence means for the Republic."
 INT_france.13.a:0 "The cabinet cannot ignore the streets."
 INT_france.14.t:0 "The Popular Front Takes Shape"
 INT_france.14.d:0 "Parties of the left have agreed to act together against the leagues. Their common demonstrations and negotiations are becoming an electoral alliance, though the program and its leadership remain unsettled."
 INT_france.14.a:0 "A new coalition is forming."
 INT_france_news.1.t:0 "The Postwar Chamber Meets"
 INT_france_news.1.d:0 "France's newly elected Chamber has convened with a large conservative majority. Many deputies served in uniform; their debates turn on reparations, veterans' pensions, and reconstruction. The government must turn victory into a workable peace."
 INT_france_news.1.a:0 "The war's political legacy endures."
 INT_france_news.2.t:0 "France and Belgium Occupy the Ruhr"
 INT_france_news.2.d:0 "French and Belgian forces have entered Germany's Ruhr district to enforce reparations deliveries. The German government denounces the action, and workers are organizing resistance. Europe's fragile settlement faces a serious test."
 INT_france_news.2.a:0 "A dangerous escalation."
 INT_france_news.3.t:0 "The Cartel des Gauches Wins in France"
 INT_france_news.3.d:0 "The alliance of French radicals and socialists has defeated the postwar majority in the legislative election. Its leaders promise a change in domestic policy and a less confrontational approach abroad, but the coalition must first agree on a government."
 INT_france_news.3.a:0 "Paris chooses a new course."
 INT_france_news.4.t:0 "Poincaré Called Back to Power"
 INT_france_news.4.d:0 "France's currency crisis has returned Raymond Poincaré to the premiership. His cabinet draws support from across the Chamber and seeks to restore fiscal order. Investors welcome the appointment, though its measures will be contested."
 INT_france_news.4.a:0 "The franc is at the center of politics."
 INT_france_news.5.t:0 "France Passes a Monetary Law"
 INT_france_news.5.d:0 "The French parliament has fixed a new value for the franc. The measure formalizes a substantial departure from the prewar gold parity and follows two years of monetary stabilization. Supporters expect calmer markets; critics question the social cost of the policy."
 INT_france_news.5.a:0 "The new franc enters circulation."
 INT_france_news.6.t:0 "The Depression Reaches France"
 INT_france_news.6.d:0 "Factories and merchants in France report falling orders as the international slump spreads. Government receipts are weakening and cabinet ministers disagree over relief and retrenchment. The country has escaped the first shock, but it cannot escape the world economy."
 INT_france_news.6.a:0 "The crisis crosses another border."
 INT_france_news.7.t:0 "Scandal Shakes the French Republic"
 INT_france_news.7.d:0 "The Stavisky affair has brought allegations of corruption into the center of French politics. Parliamentary opponents demand an inquiry, while leagues call for action in the streets. Confidence in the government is eroding quickly."
 INT_france_news.7.a:0 "Paris is in turmoil."
 INT_france_news.8.t:0 "Riots Outside the French Chamber"
 INT_france_news.8.d:0 "Violence has erupted near France's Chamber of Deputies during demonstrations against the government. Police and protesters have suffered heavy casualties. The cabinet's survival is uncertain, and the country's parties offer sharply different explanations for the crisis."
 INT_france_news.8.a:0 "France confronts a constitutional test."
 INT_france_news.9.t:0 "France's Left Unites"
 INT_france_news.9.d:0 "French socialists, radicals, and communists are moving toward a common front against the leagues. Their cooperation has produced large demonstrations and talks on a joint program. Whether this alliance can govern remains an open question."
 INT_france_news.9.a:0 "A coalition gathers strength."
 INT_FRA_war_damage:0 "The Wounds of War"
 INT_FRA_war_damage_desc:0 "Industrial districts and public finances remain burdened by the destruction of the Great War."
 INT_FRA_veterans_support:0 "Veterans' Relief"
 INT_FRA_veterans_support_desc:0 "Pensions, medical care, and employment aid help former soldiers reenter civilian life."
 INT_FRA_reconstruction:0 "National Reconstruction"
 INT_FRA_reconstruction_desc:0 "Public contracts and coordinated credit accelerate repairs in the devastated regions."
 INT_FRA_heavy_industry:0 "Reviving Heavy Industry"
 INT_FRA_heavy_industry_desc:0 "Coal, steel, and heavy manufacturing receive focused support."
 INT_FRA_agricultural_recovery_spirit:0 "Agricultural Recovery"
 INT_FRA_agricultural_recovery_spirit_desc:0 "Recovered farmland helps ease the pressure of wartime shortages."
 INT_FRA_industrial_credit_spirit:0 "Reconstruction Credit"
 INT_FRA_industrial_credit_spirit_desc:0 "State-backed loans help firms replace destroyed machinery."
 INT_FRA_fiscal_pressure:0 "Postwar Fiscal Pressure"
 INT_FRA_fiscal_pressure_desc:0 "Debt and uncertain revenue constrain the treasury."
 INT_FRA_stable_franc:0 "The Stabilized Franc"
 INT_FRA_stable_franc_desc:0 "A more credible currency restores confidence in trade and public finance."
 INT_FRA_public_works:0 "Public Works Program"
 INT_FRA_public_works_desc:0 "Infrastructure projects sustain employment and domestic demand."
 INT_FRA_depression_pressure:0 "The Depression Reaches France"
 INT_FRA_depression_pressure_desc:0 "Falling trade and investment are weakening industry."
 INT_FRA_budget_restraint:0 "Budget Restraint"
 INT_FRA_budget_restraint_desc:0 "Spending limits defend the treasury but slow construction."
 INT_FRA_modern_industry:0 "Modernized Industry"
 INT_FRA_modern_industry_desc:0 "Industrial investment raises factory output."
 INT_FRA_parliamentary_majority:0 "The Blue Horizon Majority"
 INT_FRA_parliamentary_majority_desc:0 "The postwar Chamber gives the government a working majority."
 INT_FRA_cartel_government:0 "The Cartel Government"
 INT_FRA_cartel_government_desc:0 "The left coalition promises change but must manage its diverse parties."
 INT_FRA_national_union:0 "Government of National Union"
 INT_FRA_national_union_desc:0 "Rival parties are cooperating during a period of crisis."
 INT_FRA_cabinet_stability_spirit:0 "Cabinet Stability"
 INT_FRA_cabinet_stability_spirit_desc:0 "Longer-lived governments can carry reforms through the Chamber."
 INT_FRA_political_tension:0 "Political Tension"
 INT_FRA_political_tension_desc:0 "Scandal and street agitation have undermined confidence in parliament."
 INT_FRA_popular_front_spirit:0 "The Popular Front Alliance"
 INT_FRA_popular_front_spirit_desc:0 "The parties of the left have agreed to defend republican government together."
 INT_FRA_reparations_expectation:0 "Expected Reparations"
 INT_FRA_reparations_expectation_desc:0 "Reconstruction plans rest partly on German payments that remain uncertain."
 INT_FRA_frontier_security:0 "Frontier Security Planning"
 INT_FRA_frontier_security_desc:0 "Defensive plans prioritize the northeastern approaches."
 INT_FRA_collective_security:0 "Collective Security"
 INT_FRA_collective_security_desc:0 "France seeks strength through treaties and coordinated responses."
 INT_FRA_european_cooperation:0 "European Cooperation"
 INT_FRA_european_cooperation_desc:0 "Diplomacy and commerce strengthen ties with neighboring states."
 INT_FRA_trained_reserve:0 "Trained Reserve"
 INT_FRA_trained_reserve_desc:0 "Reserve formations preserve military readiness after demobilization."
 INT_FRA_maginot_construction:0 "Maginot Construction Program"
 INT_FRA_maginot_construction_desc:0 "Parliament has funded a major eastern fortification program."
 INT_FRA_mobile_reserve_spirit:0 "Mobile Reserve Doctrine"
 INT_FRA_mobile_reserve_spirit_desc:0 "A more mobile field army complements the frontier defenses."
 INT_FRA_air_defense:0 "Air Defense Program"
 INT_FRA_air_defense_desc:0 "Fighter groups and warning systems receive attention."
 INT_FRA_mediterranean_security_spirit:0 "Mediterranean Naval Program"
 INT_FRA_mediterranean_security_spirit_desc:0 "Shipyards and planners concentrate on the sea lanes linking metropolitan France and North Africa."
 INT_FRA_rearmament:0 "Coordinated Rearmament"
 INT_FRA_rearmament_desc:0 "Industry is preparing new weapons orders for the armed services."
 INT_FRA_armistice:0 "The Armistice and the Republic"
 INT_FRA_armistice_desc:0 "The guns have fallen silent. Ministers must turn wartime administration toward demobilization, reconstruction, and the uncertain peace conference."
 INT_FRA_veterans_ministry:0 "A Ministry for Veterans"
 INT_FRA_veterans_ministry_desc:0 "Millions return from the front with wounds, pensions, and claims on the Republic. A dedicated ministry must give them a voice."
 INT_FRA_rebuild_north:0 "Rebuild the Devastated North"
 INT_FRA_rebuild_north_desc:0 "Rail yards, factories, and villages in the occupied departments need an organized reconstruction program."
 INT_FRA_restore_railways:0 "Restore Northern Railways"
 INT_FRA_restore_railways_desc:0 "Reopening rail links will reconnect mines, towns, and the ports that supply reconstruction."
 INT_FRA_clear_battlefields:0 "Clear the Battlefields"
 INT_FRA_clear_battlefields_desc:0 "The former front still contains shattered roads and dangerous munitions. Engineers must make it usable again."
 INT_FRA_coal_and_steel:0 "Revive Coal and Steel"
 INT_FRA_coal_and_steel_desc:0 "Mining and metallurgical production are essential to restoring housing, rail, and industry."
 INT_FRA_housing_program:0 "Housing for the Displaced"
 INT_FRA_housing_program_desc:0 "The state will support housing in towns that lost much of their building stock during the war."
 INT_FRA_agricultural_recovery:0 "Restore the Farms"
 INT_FRA_agricultural_recovery_desc:0 "Farms near the old front need seed, tools, labor, and cleared land before harvests can recover."
 INT_FRA_industrial_credit:0 "Credit for Reconstruction"
 INT_FRA_industrial_credit_desc:0 "Public guarantees will keep credit flowing to firms replacing destroyed equipment."
 INT_FRA_balance_war_debt:0 "Balance the War Debt"
 INT_FRA_balance_war_debt_desc:0 "The treasury must confront enormous wartime borrowing while preserving funds for reconstruction."
 INT_FRA_poincare_franc:0 "Defend the Franc"
 INT_FRA_poincare_franc_desc:0 "The currency's weakness is undermining confidence. A credible budget and central-bank program can arrest the slide."
 INT_FRA_monetary_law:0 "The Monetary Law of 1928"
 INT_FRA_monetary_law_desc:0 "The franc can now be stabilized in law after a long struggle over debt and exchange rates."
 INT_FRA_municipal_works:0 "Municipal Public Works"
 INT_FRA_municipal_works_desc:0 "Local works can keep the economy moving when private investment contracts."
 INT_FRA_depression_response:0 "Confront the Depression"
 INT_FRA_depression_response_desc:0 "The world slump has reached France. The cabinet must weigh austerity against jobs and credit."
 INT_FRA_protect_employment:0 "Protect Employment"
 INT_FRA_protect_employment_desc:0 "Public orders and relief can limit unemployment, though they strain the budget."
 INT_FRA_budget_retrenchment:0 "Budget Retrenchment"
 INT_FRA_budget_retrenchment_desc:0 "A restrained budget may stabilize public finances, at the cost of slower recovery."
 INT_FRA_modernize_industry:0 "Modernize French Industry"
 INT_FRA_modernize_industry_desc:0 "New machinery and management can raise productivity after the first wave of reconstruction."
 INT_FRA_social_insurance:0 "Consolidate Social Insurance"
 INT_FRA_social_insurance_desc:0 "Illness and old age should no longer throw working families into destitution."
 INT_FRA_blue_horizon:0 "The Blue Horizon Chamber"
 INT_FRA_blue_horizon_desc:0 "The 1919 election has produced a conservative majority shaped by the men who fought the war."
 INT_FRA_republican_institutions:0 "Protect Republican Institutions"
 INT_FRA_republican_institutions_desc:0 "The Chamber and the Senate must contain bitter divisions without sacrificing the authority of civil government."
 INT_FRA_women_civic_campaign:0 "Women in Public Life"
 INT_FRA_women_civic_campaign_desc:0 "Organizations pressing for women's political rights deserve a hearing, even while the Senate resists reform."
 INT_FRA_cartel_des_gauches:0 "The Cartel des Gauches"
 INT_FRA_cartel_des_gauches_desc:0 "The left's electoral alliance challenges the postwar majority and promises a different course for the Republic."
 INT_FRA_herriot_cabinet:0 "The Herriot Cabinet"
 INT_FRA_herriot_cabinet_desc:0 "A new majority wants tax reform and a less confrontational foreign policy."
 INT_FRA_laicite_debate:0 "The Secular Settlement"
 INT_FRA_laicite_debate_desc:0 "Religious education and the status of Alsace-Lorraine test the coalition's ability to govern."
 INT_FRA_poincare_national_union:0 "Poincare's National Union"
 INT_FRA_poincare_national_union_desc:0 "A monetary crisis brings rivals into a broad cabinet pledged to restore confidence."
 INT_FRA_cabinet_stability:0 "A Stable Cabinet"
 INT_FRA_cabinet_stability_desc:0 "Longer-lived ministries can act where rapid cabinet turnover has stalled reform."
 INT_FRA_election_1928:0 "The Election of 1928"
 INT_FRA_election_1928_desc:0 "Voters judge the government's recovery program and the future direction of the Chamber."
 INT_FRA_antiparliamentary_leagues:0 "Confront the Leagues"
 INT_FRA_antiparliamentary_leagues_desc:0 "Street movements denounce the parliamentary system and test the state's ability to keep public order."
 INT_FRA_stavisky_crisis:0 "The Stavisky Affair"
 INT_FRA_stavisky_crisis_desc:0 "A financial scandal has deepened suspicion of ministers, police, and parliamentary influence."
 INT_FRA_february_sixth:0 "The February Crisis"
 INT_FRA_february_sixth_desc:0 "Violence outside the Chamber brings the regime's legitimacy into question."
 INT_FRA_doumergue_union:0 "A Government of National Union"
 INT_FRA_doumergue_union_desc:0 "An emergency cabinet seeks to calm the streets and restore parliamentary confidence."
 INT_FRA_popular_front:0 "Build the Popular Front"
 INT_FRA_popular_front_desc:0 "Socialists, communists, and radicals unite against the leagues and prepare a common electoral program."
 INT_FRA_republican_program:0 "Negotiate a Common Program"
 INT_FRA_republican_program_desc:0 "The left alliance begins drafting a common platform for the next election. Its parties still differ over labor, finance, and the defense of parliamentary government."
 INT_FRA_peace_conference:0 "The Peace Conference"
 INT_FRA_peace_conference_desc:0 "French delegates seek security and reparations in the postwar settlement."
 INT_FRA_reparations_commission:0 "The Reparations Commission"
 INT_FRA_reparations_commission_desc:0 "An international body must turn treaty promises into enforceable payments."
 INT_FRA_rhineland_security:0 "Security on the Rhine"
 INT_FRA_rhineland_security_desc:0 "A demilitarized Rhineland and Allied guarantees are central to the French security plan."
 INT_FRA_little_entente:0 "Support the Little Entente"
 INT_FRA_little_entente_desc:0 "Relations with Czechoslovakia, Romania, and Yugoslavia can strengthen the continental settlement."
 INT_FRA_ruhr_occupation:0 "Occupy the Ruhr"
 INT_FRA_ruhr_occupation_desc:0 "German defaults have prompted a Franco-Belgian move into the Ruhr. Coercion may secure payment but risks a wider crisis."
 INT_FRA_dawes_compromise:0 "Accept the Dawes Plan"
 INT_FRA_dawes_compromise_desc:0 "A revised payment schedule offers a way to end the Ruhr confrontation without abandoning reparations."
 INT_FRA_locarno:0 "The Locarno Treaties"
 INT_FRA_locarno_desc:0 "Western border guarantees and German admission to European diplomacy could reduce the risk of another war."
 INT_FRA_briand_kellogg:0 "The Pact of Paris"
 INT_FRA_briand_kellogg_desc:0 "Aristide Briand's proposal to renounce war now has broad international support."
 INT_FRA_young_plan:0 "The Young Plan"
 INT_FRA_young_plan_desc:0 "Negotiators have reached a further revision of German reparations."
 INT_FRA_european_union:0 "Briand's European Project"
 INT_FRA_european_union_desc:0 "Economic cooperation may do more for lasting peace than another round of threats and guarantees."
 INT_FRA_league_security:0 "Work Through the League"
 INT_FRA_league_security_desc:0 "French security policy needs allies, law, and an effective forum for collective action."
 INT_FRA_colonial_exhibition:0 "The Colonial Exhibition"
 INT_FRA_colonial_exhibition_desc:0 "The Paris exhibition presents the empire to the public while prompting debate over its costs and obligations."
 INT_FRA_defend_belgium:0 "Defend the Belgian Frontier"
 INT_FRA_defend_belgium_desc:0 "Cooperation with Belgium remains central to preventing another invasion through the north."
 INT_FRA_eastern_alliance:0 "Eastern Security Guarantees"
 INT_FRA_eastern_alliance_desc:0 "Eastern partners need credible consultation and material support as European tensions rise."
 INT_FRA_review_armed_forces:0 "Review the Armed Forces"
 INT_FRA_review_armed_forces_desc:0 "The army must retain lessons of the Great War while adapting to peacetime limits."
 INT_FRA_army_demobilization:0 "Orderly Demobilization"
 INT_FRA_army_demobilization_desc:0 "The army must bring men home without losing its professional core."
 INT_FRA_reserve_system:0 "A Trained Reserve"
 INT_FRA_reserve_system_desc:0 "A shorter active term requires sound mobilization plans and trained reserves."
 INT_FRA_fortification_commission:0 "The Frontier Commission"
 INT_FRA_fortification_commission_desc:0 "Engineers and generals debate how permanent works should protect the eastern frontier."
 INT_FRA_maginot_program:0 "Authorize the Maginot Program"
 INT_FRA_maginot_program_desc:0 "Parliament votes a major line of fortifications for the vulnerable frontier."
 INT_FRA_mobile_reserve:0 "Develop Mobile Reserves"
 INT_FRA_mobile_reserve_desc:0 "Motorized units will give field commanders a response beyond static defense."
 INT_FRA_modern_artillery:0 "Modern Artillery"
 INT_FRA_modern_artillery_desc:0 "Modern fire control and ammunition supply should give the army more than its wartime inheritance."
 INT_FRA_air_ministry:0 "A Modern Air Ministry"
 INT_FRA_air_ministry_desc:0 "A unified ministry can coordinate aircraft procurement, bases, and doctrine."
 INT_FRA_fighter_defense:0 "Defend French Airspace"
 INT_FRA_fighter_defense_desc:0 "Fighter groups and ground observers must protect French cities and industry."
 INT_FRA_fleet_modernization:0 "Modernize the Fleet"
 INT_FRA_fleet_modernization_desc:0 "The navy must balance capital ships, cruisers, and protection for long imperial routes."
 INT_FRA_mediterranean_security:0 "Secure the Mediterranean"
 INT_FRA_mediterranean_security_desc:0 "Sea lanes through the Mediterranean remain vital to France and the empire."
 INT_FRA_degaulle_proposals:0 "Study Armored Warfare"
 INT_FRA_degaulle_proposals_desc:0 "Officers arguing for concentrated armor challenge the army's inherited methods."
 INT_FRA_rearmament_review:0 "Review Rearmament"
 INT_FRA_rearmament_review_desc:0 "French industry and the services must coordinate orders as German rearmament accelerates."
 INT_france.15.t:0 "The Locarno Agreements"
 INT_france.15.d:0 "Delegates at Locarno have agreed on Germany's western borders and European arbitration. Paris sees a chance to supplement its security with British and Italian guarantees, while remaining cautious about the eastern frontier."
 INT_france.15.a:0 "A new framework for European security."
 INT_france.16.t:0 "Parliament Funds the Frontier Line"
 INT_france.16.d:0 "The Chamber has approved a five-year program to fortify the eastern frontier. André Maginot argues that permanent works will protect France while the army mobilizes. Critics question the expense and the danger of relying too heavily on fixed defenses."
 INT_france.16.a:0 "The engineers receive their orders."
 INT_france.17.t:0 "A New Left Majority in the Chamber"
 INT_france.17.d:0 "The legislative election has returned a second left majority, but radicals and socialists disagree over the next ministry. The president must find a government able to command the Chamber amid falling revenues and rising public frustration."
 INT_france.17.a:0 "A difficult mandate begins."
 INT_france.18.t:0 "Doumergue Forms an Emergency Cabinet"
 INT_france.18.d:0 "Gaston Doumergue has assembled a cabinet drawing support from several parties after the February riots. It promises public order and institutional reform, but its members disagree on how far to change the Republic."
 INT_france.18.a:0 "The crisis demands a government."
 INT_france.19.t:0 "The Stresa Conference"
 INT_france.19.d:0 "France, Britain, and Italy have met at Stresa in response to German rearmament. Their declaration reaffirms existing treaties and Austrian independence, but they have not settled how they will act if the agreements are breached."
 INT_france.19.a:0 "The powers seek a common position."
 INT_france.20.t:0 "A Franco-Soviet Pact"
 INT_france.20.d:0 "France and the Soviet Union have signed a mutual-assistance treaty. The agreement is presented as a support for collective security, though its practical military meaning depends on the League of Nations and future diplomacy."
 INT_france.20.a:0 "A new guarantee is signed."
 INT_france.21.t:0 "The Young Plan Negotiated"
 INT_france.21.d:0 "Reparations experts have proposed a revised schedule for German payments. The plan may ease political confrontation while giving France a more predictable basis for its claims."
 INT_france.21.a:0 "A difficult compromise."
 INT_france_news.10.t:0 "The Locarno Treaties"
 INT_france_news.10.d:0 "European governments have concluded agreements at Locarno. Germany's western borders receive new guarantees, while arbitration mechanisms are meant to contain future disputes. Supporters call this a step toward reconciliation; critics note that eastern security remains less certain."
 INT_france_news.10.a:0 "The postwar settlement changes shape."
 INT_france_news.11.t:0 "France Votes Funds for the Maginot Line"
 INT_france_news.11.d:0 "France's parliament has approved a large multi-year program of frontier fortifications. The planned works will guard key routes from the east while the army mobilizes. Debate continues over whether fixed defenses will be enough in a future war."
 INT_france_news.11.a:0 "A new line takes shape."
 INT_france_news.12.t:0 "The French Left Wins Again"
 INT_france_news.12.d:0 "French legislative elections have returned a new left majority. The result weakens the governments that dominated the late 1920s, but the winning parties have not agreed on a stable cabinet. The economic slump makes the struggle over policy more urgent."
 INT_france_news.12.a:0 "Paris faces another change of course."
 INT_france_news.13.t:0 "Powers Confer at Stresa"
 INT_france_news.13.d:0 "France, Britain, and Italy have issued a common declaration at Stresa after Germany's announcement of rearmament. They reaffirm treaty obligations and Austria's independence. Whether the understanding can withstand other disputes between its members remains uncertain."
 INT_france_news.13.a:0 "Europe watches the new alignment."
 INT_france_news.14.t:0 "France and the Soviet Union Sign a Pact"
 INT_france_news.14.d:0 "France and the Soviet Union have signed a treaty of mutual assistance. Both governments describe it as a defense against unprovoked aggression within the League of Nations system. Diplomats elsewhere are weighing how the agreement may affect European security."
 INT_france_news.14.a:0 "A new treaty enters the diplomatic map."
 INT_france_news.15.t:0 "Reparations Experts Submit the Young Plan"
 INT_france_news.15.d:0 "International negotiators have put forward a new plan for German reparations. It aims to replace temporary schedules with a longer settlement and to ease disputes that have strained relations since the war. Ratification and implementation still lie ahead."
 INT_france_news.15.a:0 "The payments question remains open."
 INT_france.22.t:0 "Paul Deschanel Takes Office"
 INT_france.22.d:0 "Paul Deschanel has entered the Élysée after his election by the parliamentary chambers. He inherits the burdens of peace and reconstruction from Raymond Poincaré. His presidency begins amid debate over how much authority the head of state should exercise."
 INT_france.22.a:0 "A new president takes office."
 INT_FRA_war_damage_law:0 "The War Damage Compensation Law"
 INT_FRA_war_damage_law_desc:0 "The law of 17 April 1919 recognizes a public duty to compensate civilian war damage. Claims offices must now turn that promise into rebuilding across the devastated departments."
 INT_FRA_social_insurance_law:0 "Enact Social Insurance"
 INT_FRA_social_insurance_law_desc:0 "The laws of 1928 and 1930 establish compulsory insurance for many wage earners against sickness, maternity, disability, old age, and death."
 INT_FRA_family_allowances_law:0 "The Family Allowances Law"
 INT_FRA_family_allowances_law_desc:0 "The law of 11 March 1932 requires employers in covered occupations to participate in family allowance funds. Benefits reach working households with children."
 INT_FRA_marquet_public_works:0 "The Marquet Public Works Plan"
 INT_FRA_marquet_public_works_desc:0 "Adrien Marquet's 1934 program commits funds to roads and other public works in an effort to relieve unemployment and improve national infrastructure."
 INT_FRA_tours_congress:0 "The Congress of Tours"
 INT_FRA_tours_congress_desc:0 "The socialist congress divides over membership in the Communist International. A majority forms the communist party while Léon Blum and his allies retain the SFIO."
 INT_FRA_election_1932:0 "The Election of 1932"
 INT_FRA_election_1932_desc:0 "Voters return a left majority to the Chamber. Radicals and socialists must negotiate policy amid the deepening economic crisis."
 INT_FRA_february_antifascism:0 "The Antifascist Demonstrations"
 INT_FRA_february_antifascism_desc:0 "After the violence of 6 February, trade unions and left parties demonstrate against the leagues. Their cooperation begins to bridge old divisions."
 INT_FRA_polish_alliance:0 "The Franco-Polish Accord"
 INT_FRA_polish_alliance_desc:0 "France and Poland sign a political agreement on 19 February 1921, pledging consultation on European affairs and laying the basis for military cooperation."
 INT_FRA_czechoslovak_treaty:0 "Treaty with Czechoslovakia"
 INT_FRA_czechoslovak_treaty_desc:0 "A 1924 treaty of alliance and friendship strengthens consultation with Prague and France's eastern security network."
 INT_FRA_lausanne_conference:0 "The Lausanne Reparations Settlement"
 INT_FRA_lausanne_conference_desc:0 "The 1932 conference sharply reduces the remaining German reparations claim. The settlement is tied to unresolved Allied war debts, leaving its formal implementation uncertain."
 INT_FRA_stresa_declaration:0 "The Stresa Declaration"
 INT_FRA_stresa_declaration_desc:0 "France, Britain, and Italy reaffirm the European settlement in April 1935 after Germany announces conscription. Their common position is diplomatic, not a new military alliance."
 INT_FRA_franco_soviet_pact:0 "The Franco-Soviet Pact"
 INT_FRA_franco_soviet_pact_desc:0 "The May 1935 treaty promises mutual assistance in the event of unprovoked aggression, subject to League of Nations procedures."
 INT_FRA_eighteen_month_service:0 "Eighteen Months of Service"
 INT_FRA_eighteen_month_service_desc:0 "The 1923 service law shortens active military duty to eighteen months. The army must keep a credible reserve and mobilization system."
 INT_FRA_independent_air_force:0 "An Independent Air Force"
 INT_FRA_independent_air_force_desc:0 "The law of 2 July 1934 establishes the Armée de l'air as an autonomous service, with its own organization and command."
 INT_FRA_two_year_service:0 "Restore Two-Year Service"
 INT_FRA_two_year_service_desc:0 "Faced with small conscription classes and mounting security concerns, France restores a two-year service term in 1935."
 INT_FRA_dunkerque_program:0 "Lay Down the Dunkerque"
 INT_FRA_dunkerque_program_desc:0 "The new capital ship is laid down at Brest in December 1932. Its design reflects the navy's search for speed and modern firepower within treaty limits."
 INT_FRA_san_remo_mandate:0 "The San Remo Mandate"
 INT_FRA_san_remo_mandate_desc:0 "The 1920 San Remo settlement assigns France a mandate over Syria and Lebanon. Administering the territory will bring military and political obligations as well as resistance."
 INT_FRA_rif_campaign:0 "The Rif Campaign"
 INT_FRA_rif_campaign_desc:0 "Abd el-Krim's forces attack the French zone of Morocco in 1925. A major campaign follows, imposing heavy costs on the army and the region."
 INT_FRA_syrian_revolt:0 "The Syrian Revolt"
 INT_FRA_syrian_revolt_desc:0 "The 1925 uprising in the Druze region spreads across the French mandate. Suppression of the revolt, including the bombardment of Damascus, draws grave criticism."
 INT_FRA_family_allowances:0 "Family Allowances"
 INT_FRA_family_allowances_desc:0 "Employer-funded allowances provide regular support to many wage-earning families with children."
 INT_FRA_marquet_public_works_spirit:0 "The Marquet Plan"
 INT_FRA_marquet_public_works_spirit_desc:0 "A program of public construction offers work during the slump and expands transport infrastructure."
 INT_FRA_reparations_settlement:0 "After Lausanne"
 INT_FRA_reparations_settlement_desc:0 "The reparations claim can no longer be treated as a dependable source of public revenue."
 INT_FRA_antifascist_mobilization:0 "Antifascist Mobilization"
 INT_FRA_antifascist_mobilization_desc:0 "Unions and republican parties are cooperating to oppose the political leagues."
 INT_FRA_two_year_service_spirit:0 "Two-Year Military Service"
 INT_FRA_two_year_service_spirit_desc:0 "Longer active service increases the army's trained strength while keeping more men away from civilian work."
 INT_FRA_independent_air_force_spirit:0 "The Armée de l'air"
 INT_FRA_independent_air_force_spirit_desc:0 "The air service has its own command and can coordinate training and procurement more effectively."
 INT_france.23.t:0 "Compensation for War Damage"
 INT_france.23.d:0 "The Republic has passed a law recognizing the right to compensation for material damage caused by the war. The promise is sweeping; surveyors, local officials, and the treasury must now process thousands of claims across the devastated regions."
 INT_france.23.a:0 "The rebuilding claims begin."
 INT_france.24.t:0 "The Socialists Split at Tours"
 INT_france.24.d:0 "Delegates at Tours have voted by a large majority to join the Communist International. Léon Blum and the minority refuse its conditions and retain the old socialist organization. The division will shape French politics for years."
 INT_france.24.a:0 "The left enters a new era."
 INT_france.25.t:0 "The Social Insurance Law"
 INT_france.25.d:0 "Parliament has revised the social insurance system first enacted in 1928. Compulsory coverage for many wage earners now includes sickness, maternity, disability, old age, and death benefits, though administration remains complex."
 INT_france.25.a:0 "Put the new funds to work."
 INT_france.26.t:0 "The Lausanne Conference Concludes"
 INT_france.26.d:0 "The powers at Lausanne have agreed to replace Germany's remaining reparations schedule with a much smaller final settlement. Its implementation depends on unresolved Allied debts to the United States, so the treasury cannot rely on these payments."
 INT_france.26.a:0 "Revise the fiscal forecasts."
 INT_france.27.t:0 "The Armée de l'air Is Established"
 INT_france.27.d:0 "A new law gives France's air force independent service status. Officers must now organize a separate command, training system, and procurement program while coordinating with the army and navy."
 INT_france.27.a:0 "The new service takes shape."
 INT_france.28.t:0 "Two Years Under Arms"
 INT_france.28.d:0 "Parliament has lengthened military service to two years amid concern over smaller draft classes and Germany's rearmament. The decision gives the army more active manpower but carries a cost for families and employers."
 INT_france.28.a:0 "Prepare the next class."
 INT_france_news.16.t:0 "French Socialists Split at Tours"
 INT_france_news.16.d:0 "The French socialist congress at Tours has divided over the Communist International. Most delegates voted to affiliate, while a minority led by Léon Blum will continue as the SFIO. The split redraws the French left after the war."
 INT_france_news.16.a:0 "Another party enters European politics."
 INT_france_news.17.t:0 "Lausanne Revises German Reparations"
 INT_france_news.17.d:0 "The governments meeting at Lausanne have proposed a final reduction of German reparations. The agreement depends on a wider settlement of Allied war debts and has yet to be fully implemented, but it marks the end of the old payment schedule."
 INT_france_news.17.a:0 "Europe weighs the settlement."
 INT_france_news.18.t:0 "France Lengthens Military Service"
 INT_france_news.18.d:0 "France has restored two-year military service in response to smaller draft classes and mounting concern over European security. The law will expand the active army over time, while drawing more young men away from civilian life."
 INT_france_news.18.a:0 "The call-up changes."
 INT_FRA_state_reconstruction_bank:0 "The Reconstruction Bank"
 INT_FRA_state_reconstruction_bank_desc:0 "A public credit institution can channel reparations and state loans into rebuilding the northern departments and replacing wartime machinery."
 INT_FRA_electricity_grid:0 "Extend the Electricity Grid"
 INT_FRA_electricity_grid_desc:0 "Hydroelectric projects and regional networks bring dependable power to factories, mines, and provincial towns."
 INT_FRA_automobile_corridors:0 "Build the Automobile Corridors"
 INT_FRA_automobile_corridors_desc:0 "Road construction links industrial centers and encourages the new automobile industry to serve a national market."
 INT_FRA_rural_credit:0 "Rural Credit Cooperatives"
 INT_FRA_rural_credit_desc:0 "Agricultural banks and cooperative credit give smallholders access to seed, machinery, and the capital needed for recovery."
 INT_FRA_cooperative_dairies:0 "Organize Cooperative Dairies"
 INT_FRA_cooperative_dairies_desc:0 "Producer cooperatives can improve rural incomes and move perishable food from farms to the growing cities."
 INT_FRA_cheap_housing:0 "Finance Cheap Housing"
 INT_FRA_cheap_housing_desc:0 "Municipal loans and public builders address the shortage of decent homes left by war and rapid urban growth."
 INT_FRA_technical_institutes:0 "Expand Technical Institutes"
 INT_FRA_technical_institutes_desc:0 "Engineering schools and vocational colleges prepare the skilled workforce required by modern industry."
 INT_FRA_plan_d_outillage:0 "A Plan for Industrial Equipment"
 INT_FRA_plan_d_outillage_desc:0 "The state surveys obsolete plant and coordinates investment in machine tools, chemicals, and electrical equipment."
 INT_FRA_rationalize_industry:0 "Rationalize Industry"
 INT_FRA_rationalize_industry_desc:0 "Consolidation and modern accounting promise greater output, even as unions and employers argue over the social cost."
 INT_FRA_laval_deflation:0 "Laval's Deflation"
 INT_FRA_laval_deflation_desc:0 "Pierre Laval answers the currency crisis with spending cuts and wage restraint, defending the franc at the price of bitter opposition."
 INT_FRA_defend_the_franc:0 "Defend the Franc"
 INT_FRA_defend_the_franc_desc:0 "The treasury commits to monetary stability while seeking enough confidence to keep capital and commerce in France."
 INT_FRA_export_credit:0 "Offer Export Credit"
 INT_FRA_export_credit_desc:0 "State-backed credit helps French firms sell machinery and vehicles abroad as international demand weakens."
 INT_FRA_senate_reform:0 "Debate Senate Reform"
 INT_FRA_senate_reform_desc:0 "Republicans debate the balance between the Chamber, the Senate, and the presidency without abandoning parliamentary government."
 INT_FRA_secular_schools:0 "Defend Secular Schools"
 INT_FRA_secular_schools_desc:0 "Teachers and republican deputies reaffirm the secular school as a civic institution of the Third Republic."
 INT_FRA_radical_program:0 "Write a Radical Program"
 INT_FRA_radical_program_desc:0 "The Radicals set out a platform of fiscal caution, secular citizenship, and parliamentary control of the executive."
 INT_FRA_labor_arbitration:0 "Establish Labor Arbitration"
 INT_FRA_labor_arbitration_desc:0 "Conciliation boards give employers and organized labor a way to settle disputes before they become national crises."
 INT_FRA_veterans_bloc:0 "Organize the Veterans' Bloc"
 INT_FRA_veterans_bloc_desc:0 "Former soldiers use their associations to press for pensions, remembrance, and a firm voice in postwar politics."
 INT_FRA_national_bloc:0 "Consolidate the National Bloc"
 INT_FRA_national_bloc_desc:0 "Conservative and center-right deputies bind their postwar majority together around security and fiscal responsibility."
 INT_FRA_monitor_leagues:0 "Monitor the Leagues"
 INT_FRA_monitor_leagues_desc:0 "Police and prefects track armed political leagues as their street demonstrations become a challenge to the Republic."
 INT_FRA_republican_defense:0 "A Republican Defense Committee"
 INT_FRA_republican_defense_desc:0 "Parties and unions coordinate legal and civic resistance to attempts at overthrowing parliamentary government."
 INT_FRA_unity_ministry:0 "A Ministry of National Unity"
 INT_FRA_unity_ministry_desc:0 "A broad cabinet seeks to keep the state functioning while the left and right contest the meaning of order."
 INT_FRA_electoral_reform:0 "Reconsider Electoral Reform"
 INT_FRA_electoral_reform_desc:0 "The deputies examine representation and coalition rules in the hope of making governments answerable without making them helpless."
 INT_FRA_mandate_commission:0 "Create a Mandate Commission"
 INT_FRA_mandate_commission_desc:0 "A permanent commission coordinates the new Syrian and Lebanese mandates with parliament, the army, and the League of Nations."
 INT_FRA_beirut_administration:0 "Build the Beirut Administration"
 INT_FRA_beirut_administration_desc:0 "Officials establish courts, schools, and customs offices while negotiating the limits of French authority in the Levant."
 INT_FRA_levant_development:0 "Develop the Levant"
 INT_FRA_levant_development_desc:0 "Ports, roads, and irrigation projects tie the mandate economy to Beirut and the Mediterranean trade network."
 INT_FRA_morocco_pacification:0 "End the Rif War"
 INT_FRA_morocco_pacification_desc:0 "After the costly Rif campaign, France seeks a settlement that restores security without an endless occupation."
 INT_FRA_empire_development:0 "Develop the Empire"
 INT_FRA_empire_development_desc:0 "The colonial exhibition gives way to practical investment in ports, railways, and agricultural production across the empire."
 INT_FRA_colonial_service:0 "Create an Imperial Service"
 INT_FRA_colonial_service_desc:0 "Colonial troops and administrators receive common training so the army can respond across the wide imperial frontier."
 INT_FRA_mandate_federation:0 "Coordinate the Mandates"
 INT_FRA_mandate_federation_desc:0 "Paris tries to reconcile local institutions and French strategic interests through a more coherent mandate policy."
 INT_FRA_british_staff_talks:0 "Prepare British Staff Liaison"
 INT_FRA_british_staff_talks_desc:0 "French and British planners begin exchanging views on the Channel, Belgium, and the Mediterranean as German rearmament becomes harder to ignore."
 INT_FRA_conciliate_rome:0 "Conciliate Rome"
 INT_FRA_conciliate_rome_desc:0 "After Stresa, Paris keeps channels open with Italy in the hope that common opposition to revisionism can survive colonial disputes."
 INT_FRA_saar_guarantees:0 "Accept the Saar Settlement"
 INT_FRA_saar_guarantees_desc:0 "After the January plebiscite, France accepts the Saar's return to Germany while seeking a wider diplomatic framework for the western frontier."
 INT_FRA_danube_guarantees:0 "Guarantee the Danube"
 INT_FRA_danube_guarantees_desc:0 "Consultation with Czechoslovakia, Romania, and Yugoslavia extends French security diplomacy into central Europe."
 INT_FRA_anti_revisionist_front:0 "An Anti-Revisionist Front"
 INT_FRA_anti_revisionist_front_desc:0 "France attempts to turn scattered treaties into a united diplomatic answer to German and Italian revisionism."
 INT_FRA_grand_quartier_general:0 "Reorganize the General Staff"
 INT_FRA_grand_quartier_general_desc:0 "The postwar high command studies the Great War and reorganizes its planning staff for peacetime mobilization and a smaller professional army."
 INT_FRA_military_railways:0 "Plan Military Railways"
 INT_FRA_military_railways_desc:0 "Timetables and rail junctions receive military attention so reserves can reach the frontier before an attack becomes a breakthrough."
 INT_FRA_alpine_fortifications:0 "Fortify the Alpine Frontier"
 INT_FRA_alpine_fortifications_desc:0 "Works in the Alps protect the southeast while allowing the army to concentrate its strongest formations in the northeast."
 INT_FRA_armored_maneuvers:0 "Hold Armored Maneuvers"
 INT_FRA_armored_maneuvers_desc:0 "A few officers experiment with concentrated armor and radio coordination against the prevailing infantry doctrine."
 INT_FRA_anti_tank_batteries:0 "Prepare Anti-Tank Batteries"
 INT_FRA_anti_tank_batteries_desc:0 "New guns and field exercises give the infantry a response to the armored formations emerging across the Rhine."
 INT_FRA_aircraft_engines:0 "Invest in Aircraft Engines"
 INT_FRA_aircraft_engines_desc:0 "Engine research and standardized procurement address the persistent weakness of French aircraft production."
 INT_FRA_bomber_command:0 "Form a Bomber Command"
 INT_FRA_bomber_command_desc:0 "The air force debates strategic bombing and close support while building a command structure independent from the army."
 INT_FRA_naval_aviation:0 "Develop Naval Aviation"
 INT_FRA_naval_aviation_desc:0 "The fleet adds reconnaissance and torpedo aircraft to protect France's long Mediterranean and imperial routes."
 INT_FRA_convoy_doctrine:0 "Study Convoy Doctrine"
 INT_FRA_convoy_doctrine_desc:0 "Naval planners adapt lessons from the Great War to protect shipping between metropolitan France and the empire."
 INT_FRA_mobilization_timetables:0 "Write Mobilization Timetables"
 INT_FRA_mobilization_timetables_desc:0 "The army synchronizes reserves, railways, and depots so a trained reserve can become a field army quickly."
 INT_FRA_national_defense_plan:0 "Adopt a National Defense Plan"
 INT_FRA_national_defense_plan_desc:0 "The government sets service priorities and industrial orders as Germany's repudiation of the postwar limits becomes unmistakable."
 INT_FRA_inter_service_council:0 "Create an Inter-Service Council"
 INT_FRA_inter_service_council_desc:0 "Army, navy, and air leaders coordinate procurement and mobilization instead of competing for disconnected programs."
 INT_FRA_state_reconstruction_spirit:0 "State Reconstruction Credit"
 INT_FRA_state_reconstruction_spirit_desc:0 "Public credit directs scarce capital toward rebuilding and replacing the plant destroyed in the Great War."
 INT_FRA_electricification_spirit:0 "The National Grid"
 INT_FRA_electricification_spirit_desc:0 "Electricity reaches factories and provincial towns, improving industrial output and infrastructure planning."
 INT_FRA_rural_modernization_spirit:0 "Modern Rural Credit"
 INT_FRA_rural_modernization_spirit_desc:0 "Cooperative finance and new machinery help small farms recover without abandoning the peasant countryside."
 INT_FRA_labor_compromise_spirit:0 "The Labor Compromise"
 INT_FRA_labor_compromise_spirit_desc:0 "Arbitration and social negotiation moderate strikes while preserving organized labor's place in the Republic."
 INT_FRA_levante_administration_spirit:0 "Levant Administration"
 INT_FRA_levante_administration_spirit_desc:0 "A professional mandate service improves administration and reduces the cost of governing the Levant."
 INT_FRA_colonial_recruitment_spirit:0 "Imperial Recruitment"
 INT_FRA_colonial_recruitment_spirit_desc:0 "Colonial units enlarge France's trained manpower pool while tying military service to imperial administration."
 INT_FRA_british_entente_spirit:0 "The Anglo-French Understanding"
 INT_FRA_british_entente_spirit_desc:0 "Staff contacts and trade links improve confidence between the two western democracies."
 INT_FRA_alpine_defense_spirit:0 "Alpine Defense"
 INT_FRA_alpine_defense_spirit_desc:0 "Mountain works and specialized troops make the southeastern frontier harder to force."
 INT_FRA_mechanized_experiments_spirit:0 "Mechanized Experiments"
 INT_FRA_mechanized_experiments_spirit_desc:0 "Small armored formations test radios, concentrated firepower, and movement beyond the infantry pace."
 INT_FRA_aircraft_engineering_spirit:0 "Aircraft Engineering"
 INT_FRA_aircraft_engineering_spirit_desc:0 "Engineers and manufacturers cooperate to improve reliability and reduce the accidents that waste scarce aircraft."
 INT_FRA_military_railways_spirit:0 "Military Railway Planning"
 INT_FRA_military_railways_spirit_desc:0 "Railway schedules and mobilization tables give the high command a more dependable reserve system."
