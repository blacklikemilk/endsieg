 AUH_stab_food:0 "Coordinate Food Distribution"
 AUH_stab_food_desc:0 "The ministries must agree transport priorities and provincial allocations before supplies can reach the districts that need them. Industrial resources will be committed until the programme is completed."
 AUH_stab_food_tt:0 "After §Y90 days§!, food security rises by §G10§! in peace or §G6§! during war. The next programme becomes available 90 days after completion."
 AUH_stab_reconstruction:0 "Restore the Provincial Services"
 AUH_stab_reconstruction_desc:0 "Peace allows damaged services and transport links to be restored. Appointing staff and coordinating the provincial administrations will take months, and renewed war would bring the work to a halt."
 AUH_stab_reconstruction_tt:0 "After §Y180 days§!, discontent falls by §G2§! in every region still administered by the empire and food security rises by §G6§!. Renewed war cancels the programme. It can be repeated 365 days after completion."
 AUH_stab_unlock_consult_tt:0 "Unlocks provincial hearings in the Imperial Council."
 AUH_stab_unlock_languages_tt:0 "Unlocks permanent provincial language services in the Imperial Council."
 AUH_stab_unlock_budgets_tt:0 "Unlocks provincial budget agreements in the Imperial Council."
 AUH_stab_unlock_schools_tt:0 "Unlocks the training of provincial school and administrative staff."
 AUH_stab_unlock_compact_tt:0 "Unlocks local implementation of the constitution once it has been ratified. Provincial hearings, language services and budget agreements must be completed first."
 AUH_stab_unlock_relief_tt:0 "Unlocks repeatable provincial relief programmes."
 AUH_stab_unlock_food_tt:0 "Unlocks timed food-distribution programmes."
 AUH_stab_unlock_reconstruction_tt:0 "Unlocks peacetime restoration of provincial services."
 AUH_stab_imperial_council:0 "The Imperial Council"
 AUH_stab_imperial_council_desc:0 "The empire depends upon agreements between its governments, provincial administrations and peoples. Select a region to examine its grievances and the programmes available there. At most §Ytwo development programmes§! can run at once. Work takes months; constitutional promises require years to implement. War, shortages and occupation can undo gains.\n\nFood security: §Y[?AUH_ww1_food_security|0]/100§!. Only lands under direct imperial administration contribute to the council's assessment."
 AUH_stab_multi_ethnic:0 "A Multi-Ethnic Empire"
 AUH_stab_multi_ethnic_desc:0 "Our peoples share a state but have different languages, institutions and expectations of the Crown. The strength of their grievances affects the common army and confidence in the government. A constitutional settlement must be implemented throughout the provinces before it can endure.\n\nAverage regional discontent: §Y[?AUH_stab_average|1]/100§!."
 AUH_stab_elevated_discontent:0 "Elevated Provincial Discontent"
 AUH_stab_elevated_discontent_desc:0 "Provincial grievances hamper recruitment, production of raw materials and public works. The effects end when discontent falls or the province leaves direct imperial administration."
 AUH_stab_penalty_elevated_tt:0 "Local manpower: §R−5%§!\nLocal resources: §R−2.5%§!\nState construction speed: §R−5%§!"
 AUH_stab_high_discontent:0 "High Provincial Discontent"
 AUH_stab_high_discontent_desc:0 "Provincial grievances hamper recruitment, production of raw materials and public works. The effects end when discontent falls or the province leaves direct imperial administration."
 AUH_stab_penalty_high_tt:0 "Local manpower: §R−15%§!\nLocal resources: §R−7.5%§!\nState construction speed: §R−10%§!"
 AUH_stab_severe_discontent:0 "Severe Provincial Discontent"
 AUH_stab_severe_discontent_desc:0 "Provincial grievances hamper recruitment, production of raw materials and public works. The effects end when discontent falls or the province leaves direct imperial administration."
 AUH_stab_penalty_severe_tt:0 "Local manpower: §R−30%§!\nLocal resources: §R−15%§!\nState construction speed: §R−20%§!"
 AUH_stab_programmes_tt:0 "At most two provincial or national programmes may run at once. Their political and industrial costs begin on selection; improvements are granted only after completion."
 AUH_stab_capacity_tt:0 "The Imperial Council has fewer than two programmes running, and Vienna is under our control."
 AUH_stab_region_controlled_tt:0 "We own land in this region and control all of its states still under our administration."
 AUH_stab_region_free_tt:0 "No other provincial programme is running in this region."
 AUH_stab_programme_unfinished_tt:0 "This provincial programme has not already been completed."
 AUH_stab_relief_cooldown_tt:0 "At least 270 days have passed since any previous relief programme was completed here."
 AUH_stab_constitution_ratified_tt:0 "A constitution preserving the common state has been ratified."
 AUH_stab_implementation_ready_tt:0 "Provincial hearings, language services and the budget agreement have been completed in this region."
 AUH_stab_national_free_tt:0 "No other national programme is running."
 AUH_stab_food_cooldown_tt:0 "At least 90 days have passed since any previous food-distribution programme was completed."
 AUH_stab_reconstruction_cooldown_tt:0 "At least 365 days have passed since any previous restoration of provincial services was completed."
