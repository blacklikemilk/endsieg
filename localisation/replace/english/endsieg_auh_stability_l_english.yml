l_english:
 AUH_stab_austria_consult:0 "Convene Provincial Hearings: German Austrian Lands"
 AUH_stab_austria_consult_desc:0 "Civil servants and local representatives will record grievances, examine petitions and agree which questions can be settled under the existing law. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_consult_tt:0 "Discontent in German Austrian Lands falls by §G6§! in peace or §G4§! during war when the §Y60-day§! programme is completed."
 AUH_stab_austria_languages:0 "Establish Language Services: German Austrian Lands"
 AUH_stab_austria_languages_desc:0 "Recruiting clerks and interpreters takes time. The new offices must be able to conduct ordinary business in the languages used by the people they serve. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_languages_tt:0 "Discontent in German Austrian Lands falls by §G10§! in peace or §G6§! during war when the §Y120-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_austria_budgets:0 "Negotiate the Provincial Budget: German Austrian Lands"
 AUH_stab_austria_budgets_desc:0 "The provincial authorities and the common ministries must agree a workable division of expenditure. Promises require a place in the budget before they can become lasting policy. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_budgets_tt:0 "Discontent in German Austrian Lands falls by §G10§! in peace or §G6§! during war when the §Y150-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_austria_schools:0 "Staff Schools and District Offices: German Austrian Lands"
 AUH_stab_austria_schools_desc:0 "Teachers, surveyors and district officials are needed beyond the principal towns. Training and assigning them will occupy resources that could otherwise be used by industry. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_schools_tt:0 "Discontent in German Austrian Lands falls by §G8§! in peace or §G5§! during war when the §Y180-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_austria_compact:0 "Implement the Constitutional Settlement: German Austrian Lands"
 AUH_stab_austria_compact_desc:0 "The constitutional agreement must be carried through local statutes, appointments and financial arrangements. Enacting the settlement on paper has not completed that work. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_compact_tt:0 "Discontent in German Austrian Lands falls by §G12§! in peace or §G7§! during war when the §Y240-day§! programme is completed. The completed institutions also reduce its monthly discontent growth. A ratified constitution, provincial hearings, language services and an agreed budget are required."
 AUH_stab_austria_relief:0 "Maintain Provincial Relief: German Austrian Lands"
 AUH_stab_austria_relief_desc:0 "Maintaining distribution, hearing grievances and repairing local services can prevent an unsettled province from becoming a new crisis. Wartime demands limit the relief that can be provided. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_austria_relief_tt:0 "Discontent in German Austrian Lands falls by §G5§! in peace or §G3§! during war when the §Y90-day§! programme is completed. Another relief programme in this region can begin 270 days after completion. Also settles the January strike crisis if food security is at least 30 when completed."
