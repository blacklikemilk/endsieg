 AUH_stab_bosnia_languages_tt:0 "Discontent in Bosnia and Herzegovina falls by §G10§! in peace or §G6§! during war when the §Y120-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_bosnia_budgets:0 "Negotiate the Provincial Budget: Bosnia and Herzegovina"
 AUH_stab_bosnia_budgets_desc:0 "The provincial authorities and the common ministries must agree a workable division of expenditure. Promises require a place in the budget before they can become lasting policy. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_bosnia_budgets_tt:0 "Discontent in Bosnia and Herzegovina falls by §G10§! in peace or §G6§! during war when the §Y150-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_bosnia_schools:0 "Staff Schools and District Offices: Bosnia and Herzegovina"
 AUH_stab_bosnia_schools_desc:0 "Teachers, surveyors and district officials are needed beyond the principal towns. Training and assigning them will occupy resources that could otherwise be used by industry. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_bosnia_schools_tt:0 "Discontent in Bosnia and Herzegovina falls by §G8§! in peace or §G5§! during war when the §Y180-day§! programme is completed. The completed institutions also reduce its monthly discontent growth."
 AUH_stab_bosnia_compact:0 "Implement the Constitutional Settlement: Bosnia and Herzegovina"
 AUH_stab_bosnia_compact_desc:0 "The constitutional agreement must be carried through local statutes, appointments and financial arrangements. Enacting the settlement on paper has not completed that work. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_bosnia_compact_tt:0 "Discontent in Bosnia and Herzegovina falls by §G12§! in peace or §G7§! during war when the §Y240-day§! programme is completed. The completed institutions also reduce its monthly discontent growth. A ratified constitution, provincial hearings, language services and an agreed budget are required."
 AUH_stab_bosnia_relief:0 "Maintain Provincial Relief: Bosnia and Herzegovina"
 AUH_stab_bosnia_relief_desc:0 "Maintaining distribution, hearing grievances and repairing local services can prevent an unsettled province from becoming a new crisis. Wartime demands limit the relief that can be provided. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_bosnia_relief_tt:0 "Discontent in Bosnia and Herzegovina falls by §G5§! in peace or §G3§! during war when the §Y90-day§! programme is completed. Another relief programme in this region can begin 270 days after completion."
 AUH_stab_transylvania_consult:0 "Convene Provincial Hearings: Transylvania"
 AUH_stab_transylvania_consult_desc:0 "Civil servants and local representatives will record grievances, examine petitions and agree which questions can be settled under the existing law. Benefits apply only after the programme is completed. Losing control of the province ends the work without granting its benefits."
 AUH_stab_transylvania_consult_tt:0 "Discontent in Transylvania falls by §G6§! in peace or §G4§! during war when the §Y60-day§! programme is completed."
