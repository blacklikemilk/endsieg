 INT_weimar.1.t:0 "The Reichstag Dissolved"
 INT_weimar.1.d:0 "Chancellor Marx asks President Ebert to dissolve the Reichstag before deputies can overturn the government's emergency economic decrees. The cabinet argues that currency stabilization needs time, but its opponents call the move an evasion of parliamentary scrutiny. Voters now decide whether Marx can build a dependable majority."
 INT_weimar.1.a:0 "The nation returns to the polls."
 INT_weimar.2.t:0 "The Reichstag Dissolved Again"
 INT_weimar.2.d:0 "The parties fail to sustain a governing coalition, and President Ebert dissolves the Reichstag once more. Germany faces another election in the same year while questions of reparations, economic recovery, and the republic's authority divide the chamber. Every party campaigns for a mandate it may struggle to use."
 INT_weimar.2.a:0 "Another election campaign begins."
 INT_weimar.3.t:0 "The Reichstag Dissolved"
 INT_weimar.3.d:0 "A fragile coalition gives way, and President Hindenburg dissolves the Reichstag. The government hopes an election will produce a clearer parliamentary majority, but divisions between democratic parties and the political extremes remain sharp. The republic must ask its voters to settle another cabinet crisis."
 INT_weimar.3.a:0 "The coalition must face the voters."
 INT_weimar.4.t:0 "The Reichstag Dissolved"
 INT_weimar.4.d:0 "The Reichstag votes down Chancellor Brüning's emergency decree, and President Hindenburg responds by dissolving the chamber. Brüning seeks to continue governing through presidential authority while the country heads toward an election amid unemployment and austerity. The balance between parliament and the presidency grows more precarious."
 INT_weimar.4.a:0 "The political crisis deepens."
 INT_weimar.5.t:0 "The Reichstag Dissolved"
 INT_weimar.5.d:0 "Chancellor von Papen governs with President Hindenburg's support but commands almost no votes in the Reichstag. The president dissolves parliament and calls an election in the hope of breaking the impasse. The parties prepare for a bitter contest as street violence and economic hardship unsettle the republic."
 INT_weimar.5.a:0 "Germany faces another election."
 INT_weimar.6.t:0 "The Reichstag Dissolved After a Vote of No Confidence"
 INT_weimar.6.d:0 "The Reichstag delivers an overwhelming vote of no confidence in Chancellor von Papen. Instead of yielding to the chamber, the government presents a dissolution order signed by President Hindenburg. Germany heads to the polls again while the struggle between presidential rule and parliamentary authority intensifies."
 INT_weimar.6.a:0 "Parliament has reached another dead end."
 INT_weimar.7.t:0 "The Reichstag Dissolved for a March Election"
 INT_weimar.7.d:0 "President Hindenburg dissolves the Reichstag and calls a new election for March. The collapse of successive cabinets leaves the country facing another campaign, with the political extremes gaining ground. The next chamber will determine whether parliamentary government can regain its footing."
 INT_weimar.7.a:0 "The republic faces another test."
 INT_weimar.8.t:0 "The Imperial Cabinet Resigns"
 INT_weimar.8.d:0 "The imperial cabinet is leaving office as defeat and revolution end the old political order. Ministers and military advisers associated with the wartime government submit their resignations, while the new authorities face demobilization, shortages, and unrest. A civilian republican cabinet must now take responsibility for the state."
 INT_weimar.8.a:0 "Accept their resignations."
 INT_weimar.9.t:0 "A Republican Cabinet Takes Office"
 INT_weimar.9.d:0 "A republican cabinet takes office and begins replacing imperial advisers with civilian figures from the new political order. Its president must establish authority over the administration while the country confronts peace negotiations, demobilization, and political violence. Chancellors will rise and fall as parties attempt to govern the republic."
 INT_weimar.9.a:0 "Begin the work of the republic."
 INT_weimar.10.t:0 "Noske Leaves the Defence Ministry"
 INT_weimar.10.d:0 "The failed Kapp Putsch has shaken confidence in Defence Minister Gustav Noske. Critics blame his handling of the armed forces and demand a new course; Noske leaves office as the cabinet tries to reassert civilian authority. Carl Severing becomes available to help defend the republic's institutions."
 INT_weimar.10.a:0 "The cabinet must recover."
 INT_weimar.11.t:0 "Matthias Erzberger Assassinated"
 INT_weimar.11.d:0 "Former finance minister Matthias Erzberger has been assassinated. His signature on the armistice and his support for the republic have made him a target of the nationalist right. The government loses an experienced reformer as political murder threatens public life."
 INT_weimar.11.a:0 "Mourn Erzberger."
 INT_weimar.12.t:0 "Rathenau Enters the Cabinet"
 INT_weimar.12.d:0 "Walther Rathenau enters the foreign ministry as the republic searches for room to maneuver abroad. An industrialist with broad international contacts, he must navigate reparations, relations with the victorious powers, and Germany's isolation. His appointment offers a diplomatic opening, though critics at home remain fierce."
 INT_weimar.12.a:0 "Recruit Rathenau."
 INT_weimar.13.t:0 "Walther Rathenau Assassinated"
 INT_weimar.13.d:0 "Foreign Minister Walther Rathenau has been murdered by right-wing extremists. His efforts to negotiate with other powers have drawn violent opposition from enemies of the republic. Crowds gather in protest while the government faces the urgent task of protecting its officials and the constitutional order."
 INT_weimar.13.a:0 "Mourn Rathenau."
 INT_weimar.14.t:0 "Rudolf Havenstein Dies"
 INT_weimar.14.d:0 "Reichsbank president Rudolf Havenstein has died while Germany struggles through a devastating currency crisis. Prices change faster than wages can follow, and confidence in the mark is collapsing. The government must find a successor capable of restoring monetary order."
 INT_weimar.14.a:0 "A vacancy at the Reichsbank."
 INT_weimar.15.t:0 "Schacht Takes Charge of the Reichsbank"
 INT_weimar.15.d:0 "Hjalmar Schacht takes charge of the Reichsbank after helping to stabilize the currency. The immediate panic is easing, but the government still needs credit, budget discipline, and a workable approach to foreign obligations. Schacht now becomes a central adviser in the effort to rebuild financial confidence."
 INT_weimar.15.a:0 "Recruit Schacht."
 INT_weimar.16.t:0 "Hindenburg Elected Reich President"
 INT_weimar.16.d:0 "Paul von Hindenburg wins the presidential election and succeeds the late Friedrich Ebert. The celebrated former field marshal now holds the republic's highest office, even though many of his supporters distrust the system he is sworn to uphold. His use of presidential powers will shape every future cabinet."
 INT_weimar.16.a:0 "The presidency changes hands."
 INT_weimar.17.t:0 "Schacht Resigns from the Reichsbank"
 INT_weimar.17.d:0 "Hjalmar Schacht resigns from the Reichsbank as disputes over reparations and financial policy deepen. His departure removes a prominent advocate of monetary stability from the government's circle. Ministers must now defend their economic course without the banker who helped end the inflation crisis."
 INT_weimar.17.a:0 "Schacht leaves office."
 INT_weimar.18.t:0 "Severing Removed from Office"
 INT_weimar.18.d:0 "Carl Severing is forced from office during the struggle over control of Prussia. The removal of republican officials from Germany's largest state weakens a major institutional safeguard of the Weimar system. The cabinet loses an experienced defender of constitutional government."
 INT_weimar.18.a:0 "The cabinet loses an experienced adviser."
 INT_weimar.19.t:0 "Groener Leaves the Cabinet"
 INT_weimar.19.d:0 "Wilhelm Groener leaves the cabinet amid mounting pressure from the army and the political right. As a former senior officer and minister, he has tried to keep the armed forces tied to the government. His departure exposes the presidential cabinet to further instability."
 INT_weimar.19.a:0 "Groener leaves office."
 INT_weimar.20.t:0 "Philipp Scheidemann Appointed Reich Chancellor"
 INT_weimar.20.d:0 "Philipp Scheidemann forms a cabinet drawn from the parties supporting the new National Assembly. The government must build republican institutions while facing food shortages, demobilization, unrest, and the terms of peace. Its parliamentary majority is broad, but the challenges before it are immediate."
 INT_weimar.20.a:0 "Form the new cabinet."
 INT_weimar.21.t:0 "Gustav Bauer Appointed Reich Chancellor"
 INT_weimar.21.d:0 "Gustav Bauer is asked to form a new cabinet after Philipp Scheidemann resigns over the proposed peace settlement. The government must decide how to respond to Allied demands while preserving enough parliamentary support to survive. Bauer inherits a republic whose first major test cannot be postponed."
 INT_weimar.21.a:0 "Form the new cabinet."
 INT_weimar.22.t:0 "Hermann Müller Appointed Reich Chancellor"
 INT_weimar.22.d:0 "Hermann Müller takes office in the aftermath of the Kapp Putsch. A general strike has defeated the coup, but the government still faces unrest, distrust of the armed forces, and demands for accountability. Müller must rebuild a workable coalition before the next parliamentary contest."
 INT_weimar.22.a:0 "Form the new cabinet."
 INT_weimar.23.t:0 "Constantin Fehrenbach Appointed Reich Chancellor"
 INT_weimar.23.d:0 "Constantin Fehrenbach forms a cabinet after elections leave the parties of the original republican coalition without their former majority. His Center-led government must seek support across a divided Reichstag. Reparations and domestic recovery remain pressing while every vote becomes harder to secure."
 INT_weimar.23.a:0 "Form the new cabinet."
 INT_weimar.24.t:0 "Joseph Wirth Appointed Reich Chancellor"
 INT_weimar.24.d:0 "Joseph Wirth takes the chancellorship as Germany confronts an Allied reparations ultimatum. He hopes that accepting obligations and demonstrating compliance will create room for later revision. The strategy demands painful compromises and leaves his coalition vulnerable to attacks from both left and right."
 INT_weimar.24.a:0 "Form the new cabinet."
 INT_weimar.25.t:0 "Wilhelm Cuno Appointed Reich Chancellor"
 INT_weimar.25.d:0 "Non-party businessman Wilhelm Cuno forms a cabinet as foreign pressure and economic instability grow. French and Belgian demands over reparations threaten the Ruhr, the center of German heavy industry. His government must choose how to answer while the mark weakens and public confidence erodes."
 INT_weimar.25.a:0 "Form the new cabinet."
 INT_weimar.26.t:0 "Gustav Stresemann Appointed Reich Chancellor"
 INT_weimar.26.d:0 "Gustav Stresemann brings together a grand coalition amid occupation, passive resistance, and runaway inflation. The government needs to end the economic emergency while asking Germans to accept difficult compromises. Its survival depends on holding parties together through a crisis that reaches every household."
 INT_weimar.26.a:0 "Form the new cabinet."
 INT_weimar.27.t:0 "Wilhelm Marx Appointed Reich Chancellor"
 INT_weimar.27.d:0 "Wilhelm Marx succeeds Stresemann and attempts to steady the republic after the worst of the currency crisis. His cabinet faces the unfinished questions of reparations, political extremism, and Germany's place in Europe. A dependable parliamentary majority remains elusive."
 INT_weimar.27.a:0 "Form the new cabinet."
 INT_weimar.28.t:0 "Hans Luther Appointed Reich Chancellor"
 INT_weimar.28.d:0 "Hans Luther takes office at the head of a new coalition after Marx's cabinet falls. Stabilization has opened a chance for recovery, but the government still faces contested budget choices and foreign-policy obligations. Luther must keep rival parties cooperating long enough to turn short-term calm into lasting order."
 INT_weimar.28.a:0 "Form the new cabinet."
 INT_weimar.29.t:0 "Wilhelm Marx Appointed Reich Chancellor"
 INT_weimar.29.d:0 "Wilhelm Marx returns to the chancellorship after Luther resigns. The republic enjoys a measure of economic relief, yet arguments over schools, budgets, and coalition partners continue to unsettle parliament. Marx must assemble support issue by issue to keep the government functioning."
 INT_weimar.29.a:0 "Form the new cabinet."
 INT_weimar.30.t:0 "Hermann Müller Appointed Reich Chancellor"
 INT_weimar.30.d:0 "Hermann Müller returns to lead a broad coalition that brings together parties with sharply different economic priorities. They agree on defending parliamentary government, but unemployment insurance and the public finances threaten to divide them. Müller must turn electoral support into a durable governing compromise."
 INT_weimar.30.a:0 "Form the new cabinet."
 INT_weimar.31.t:0 "Heinrich Brüning Appointed Reich Chancellor"
 INT_weimar.31.d:0 "Heinrich Brüning forms a cabinet as the grand coalition breaks apart during the economic downturn. Without a secure Reichstag majority, he relies increasingly on President Hindenburg's emergency powers. Cuts in spending and rising unemployment test both the cabinet and the republic's constitutional habits."
 INT_weimar.31.a:0 "Form the new cabinet."
 INT_weimar.32.t:0 "Franz von Papen Appointed Reich Chancellor"
 INT_weimar.32.d:0 "Franz von Papen becomes chancellor with President Hindenburg's backing despite lacking a parliamentary majority. His small cabinet looks to presidential decrees rather than party negotiation, while the depression continues to deepen. The Reichstag and the streets are unlikely to accept this arrangement quietly."
 INT_weimar.32.a:0 "Form the new cabinet."
 INT_weimar.33.t:0 "Kurt von Schleicher Appointed Reich Chancellor"
 INT_weimar.33.d:0 "General Kurt von Schleicher replaces von Papen and tries to build support across the political divide. He hopes to draw unions and parts of the nationalist right into a new governing arrangement, but neither parliament nor the president offers him a secure base. Time is running short for the republic's final presidential cabinet."
 INT_weimar.33.a:0 "Form the new cabinet."
