 INT_ENG_election_1922:0 "The 1922 General Election"
 INT_ENG_election_1922_desc:0 "The Conservatives seek a mandate to govern alone under Bonar Law."
 INT_ENG_baldwin_1923:0 "Baldwin Takes Office"
 INT_ENG_baldwin_1923_desc:0 "Stanley Baldwin succeeds Bonar Law as prime minister amid debate over tariffs and unemployment."
 INT_ENG_labour_1924:0 "The First Labour Government"
 INT_ENG_labour_1924_desc:0 "Ramsay MacDonald forms Britain’s first Labour ministry with support from the Liberals."
 INT_ENG_election_1924:0 "The 1924 Conservative Victory"
 INT_ENG_election_1924_desc:0 "After Labour loses the confidence of the Commons, Baldwin returns with a Conservative majority."
 INT_ENG_general_strike:0 "The General Strike"
 INT_ENG_general_strike_desc:0 "A dispute over coal wages and working hours spreads into a national stoppage."
 INT_ENG_strike_settlement:0 "End the General Strike"
 INT_ENG_strike_settlement_desc:0 "The national stoppage ends, though the miners’ dispute continues for months."
 INT_ENG_election_1929:0 "The Second Labour Ministry"
 INT_ENG_election_1929_desc:0 "The general election returns Labour as the largest party, and MacDonald again becomes prime minister."
 INT_ENG_national_government:0 "A National Government"
 INT_ENG_national_government_desc:0 "A financial crisis leads MacDonald to form a cross-party ministry in August 1931."
 INT_ENG_election_1931:0 "The National Government Mandate"
 INT_ENG_election_1931_desc:0 "The October election gives the National Government a large parliamentary majority."
 INT_ENG_baldwin_1935:0 "Baldwin Returns"
 INT_ENG_baldwin_1935_desc:0 "Stanley Baldwin replaces MacDonald as prime minister and leads the government into the 1935 election."
 INT_ENG_demobilization:0 "Demobilise the Armed Forces"
 INT_ENG_demobilization_desc:0 "Millions of servicemen return to civilian life while wartime industry adjusts to peacetime demand."
 INT_ENG_homes_for_heroes:0 "Homes Fit for Heroes"
 INT_ENG_homes_for_heroes_desc:0 "Housing policy turns wartime promises into a programme of new homes and local services."
 INT_ENG_postwar_recession:0 "The Postwar Slump"
 INT_ENG_postwar_recession_desc:0 "Falling demand and industrial disruption deepen unemployment after the short postwar boom."
 INT_ENG_trade_recovery:0 "Restore Overseas Trade"
 INT_ENG_trade_recovery_desc:0 "The government seeks export markets and shipping work as industry adapts to peace."
 INT_ENG_gold_standard:0 "Return to Gold"
 INT_ENG_gold_standard_desc:0 "Churchill restores sterling to the gold standard at the prewar parity."
 INT_ENG_coal_industry:0 "The Coal Industry Dispute"
 INT_ENG_coal_industry_desc:0 "Coal owners press for lower wages, deepening the confrontation with the miners’ unions."
 INT_ENG_rating_relief:0 "Local Government Reform"
 INT_ENG_rating_relief_desc:0 "The 1929 reforms change local finance and relieve rates on parts of industry and agriculture."
 INT_ENG_depression:0 "The World Slump Reaches Britain"
 INT_ENG_depression_desc:0 "The global crisis adds to unemployment and strains the public finances."
 INT_ENG_unemployment_relief:0 "Address Unemployment"
 INT_ENG_unemployment_relief_desc:0 "Ministers expand relief while searching for work in regions hit hardest by industrial decline."
 INT_ENG_leave_gold:0 "Suspend the Gold Standard"
 INT_ENG_leave_gold_desc:0 "Sterling leaves gold after a severe drain on reserves in September 1931."
 INT_ENG_sterling_area:0 "The Sterling Area"
 INT_ENG_sterling_area_desc:0 "Common currency ties help Britain and its partners manage trade after the gold-standard crisis."
 INT_ENG_ottawa:0 "The Ottawa Agreements"
 INT_ENG_ottawa_desc:0 "Britain and the dominions negotiate a system of imperial tariff preferences."
 INT_ENG_special_areas:0 "The Special Areas Act"
 INT_ENG_special_areas_desc:0 "New powers target persistent unemployment in the worst affected industrial districts."
 INT_ENG_recovery_1935:0 "A Uneven Recovery"
 INT_ENG_recovery_1935_desc:0 "Lower interest rates and housing growth aid recovery, though older industrial regions still struggle."
 INT_ENG_imperial_settlement:0 "The Empire After the War"
 INT_ENG_imperial_settlement_desc:0 "London must reconcile wartime imperial cooperation with growing demands for self-government."
 INT_ENG_cairo_conference:0 "The Cairo Conference"
 INT_ENG_cairo_conference_desc:0 "British officials reshape administration in the Middle East after the Ottoman collapse."
 INT_ENG_egypt_1922:0 "Egyptian Independence"
 INT_ENG_egypt_1922_desc:0 "Britain recognises Egypt as an independent kingdom while retaining reserved powers."
 INT_ENG_imperial_conference_1926:0 "The Imperial Conference"
 INT_ENG_imperial_conference_1926_desc:0 "The dominions press for an explicit statement of equality within the Commonwealth."
 INT_ENG_balfour_declaration:0 "The Balfour Declaration of 1926"
 INT_ENG_balfour_declaration_desc:0 "The conference recognises Britain and the dominions as autonomous communities of equal status."
 INT_ENG_india_round_table:0 "The Round Table Conferences"
 INT_ENG_india_round_table_desc:0 "British and Indian delegates debate constitutional reform and provincial responsibility."
 INT_ENG_statute_westminster:0 "The Statute of Westminster"
 INT_ENG_statute_westminster_desc:0 "Parliament gives legal effect to the constitutional equality of the dominions."
 INT_ENG_india_white_paper:0 "The India White Paper"
 INT_ENG_india_white_paper_desc:0 "The government sets out its proposals for a new constitutional settlement in India."
 INT_ENG_india_act:0 "The Government of India Act"
 INT_ENG_india_act_desc:0 "The new act expands provincial autonomy and lays out a federal framework."
 INT_ENG_paris_peace:0 "The Paris Peace Conference"
 INT_ENG_paris_peace_desc:0 "Britain joins the negotiations that will set the terms of the postwar order."
 INT_ENG_league_nations:0 "Support the League"
 INT_ENG_league_nations_desc:0 "The League of Nations becomes a central forum for Britain’s diplomacy."
 INT_ENG_washington_treaty:0 "The Washington Naval Treaty"
 INT_ENG_washington_treaty_desc:0 "The major naval powers agree limits on capital ships and new construction."
 INT_ENG_locarno:0 "The Locarno Agreements"
 INT_ENG_locarno_desc:0 "Britain joins the guarantee of the western European frontier."
 INT_ENG_kellogg_briand:0 "The Kellogg–Briand Pact"
 INT_ENG_kellogg_briand_desc:0 "Britain endorses the international renunciation of war as an instrument of policy."
 INT_ENG_london_naval:0 "The London Naval Treaty"
 INT_ENG_london_naval_desc:0 "Naval talks extend limitations to further classes of warships."
 INT_ENG_manchuria:0 "The Manchurian Crisis"
 INT_ENG_manchuria_desc:0 "Japan’s occupation of Manchuria tests Britain’s commitment to the League."
 INT_ENG_disarmament_conference:0 "The Geneva Disarmament Conference"
 INT_ENG_disarmament_conference_desc:0 "Delegates debate arms limits while European security becomes less certain."
 INT_ENG_stresa_front:0 "The Stresa Front"
 INT_ENG_stresa_front_desc:0 "Britain, France and Italy condemn German treaty violations and discuss European security."
 INT_ENG_abyssinian_crisis:0 "The Abyssinian Crisis"
 INT_ENG_abyssinian_crisis_desc:0 "Italy’s attack on Ethiopia forces Britain to weigh League sanctions against European diplomacy."
 INT_ENG_ten_year_rule:0 "The Ten-Year Rule"
 INT_ENG_ten_year_rule_desc:0 "Treasury and defence planners assume no major war is likely in the next decade."
 INT_ENG_raf_independence:0 "Preserve the Royal Air Force"
 INT_ENG_raf_independence_desc:0 "The RAF remains a separate service despite postwar pressure to reduce expenditure."
 INT_ENG_naval_reductions:0 "Postwar Naval Reductions"
 INT_ENG_naval_reductions_desc:0 "The Admiralty adjusts its fleet and dockyards to peacetime budgets."
 INT_ENG_air_defence:0 "Air Defence of Britain"
 INT_ENG_air_defence_desc:0 "Air staff examine warning, interception and the defence of the home islands."
 INT_ENG_imperial_defence:0 "Review Imperial Defence"
 INT_ENG_imperial_defence_desc:0 "Britain weighs commitments in Europe, the Mediterranean and Asia against limited resources."
 INT_ENG_defence_requirements:0 "The Defence Requirements Committee"
 INT_ENG_defence_requirements_desc:0 "The committee reviews threats and recommends priorities for future rearmament."
 INT_ENG_raf_expansion:0 "Expand the RAF"
 INT_ENG_raf_expansion_desc:0 "Cabinet approves the first stages of a major expansion of the air force."
 INT_ENG_naval_rearmament:0 "Rebuild Naval Strength"
 INT_ENG_naval_rearmament_desc:0 "The Admiralty presses for ships and modern equipment as the international situation deteriorates."
 INT_ENG_army_modernisation:0 "Modernise the Army"
 INT_ENG_army_modernisation_desc:0 "The army studies mechanisation and the requirements of a future European war."
 INT_ENG_postwar_burden_spirit:0 "War Debt and Demobilisation"
 INT_ENG_postwar_burden_spirit_desc:0 "The cost of the war still weighs on the public finances."
 INT_ENG_housing_program_spirit:0 "Postwar Housing Programme"
 INT_ENG_housing_program_spirit_desc:0 "Local authorities are building homes for returning servicemen and their families."
 INT_ENG_postwar_slump_spirit:0 "Postwar Slump"
 INT_ENG_postwar_slump_spirit_desc:0 "Industry struggles with unemployment and falling export demand."
 INT_ENG_trade_recovery_spirit:0 "Overseas Trade Recovery"
 INT_ENG_trade_recovery_spirit_desc:0 "Commercial networks are being restored after wartime disruption."
 INT_ENG_gold_standard_spirit:0 "Sterling on Gold"
 INT_ENG_gold_standard_spirit_desc:0 "The pound has returned to the prewar gold parity."
 INT_ENG_general_strike_spirit:0 "General Strike"
 INT_ENG_general_strike_spirit_desc:0 "Work in transport and industry has been interrupted by the national stoppage."
 INT_ENG_depression_pressure_spirit:0 "Depression Pressure"
 INT_ENG_depression_pressure_spirit_desc:0 "The world economic crisis has worsened unemployment and strained the Treasury."
 INT_ENG_unemployment_relief_spirit:0 "Unemployment Relief"
 INT_ENG_unemployment_relief_spirit_desc:0 "Relief measures ease hardship in districts hit by industrial decline."
 INT_ENG_sterling_recovery_spirit:0 "Sterling Recovery"
 INT_ENG_sterling_recovery_spirit_desc:0 "A more flexible exchange rate supports exports after gold convertibility ends."
 INT_ENG_sterling_area_spirit:0 "The Sterling Area"
 INT_ENG_sterling_area_spirit_desc:0 "Currency ties support trade among Britain and its partners."
 INT_ENG_imperial_preference_spirit:0 "Imperial Preference"
 INT_ENG_imperial_preference_spirit_desc:0 "The Ottawa agreements give Commonwealth trade a preferential framework."
 INT_ENG_special_areas_spirit:0 "Special Areas"
 INT_ENG_special_areas_spirit_desc:0 "Public support is directed to districts with persistent unemployment."
 INT_ENG_recovery_spirit:0 "Economic Recovery"
 INT_ENG_recovery_spirit_desc:0 "New construction and easier credit are aiding recovery, though it remains uneven."
 INT_ENG_national_government_spirit:0 "National Government"
 INT_ENG_national_government_spirit_desc:0 "The cabinet draws support from several parties in a national emergency."
 INT_ENG_dominion_equality_spirit:0 "Dominion Equality"
 INT_ENG_dominion_equality_spirit_desc:0 "The dominions have been recognised as autonomous communities of equal status."
 INT_ENG_westminster_statute_spirit:0 "Statute of Westminster"
 INT_ENG_westminster_statute_spirit_desc:0 "Parliament has codified the constitutional status of the dominions."
 INT_ENG_indian_reform_spirit:0 "Indian Constitutional Reform"
 INT_ENG_indian_reform_spirit_desc:0 "The 1935 act expands provincial self-government in British India."
 INT_ENG_league_policy_spirit:0 "League Diplomacy"
 INT_ENG_league_policy_spirit_desc:0 "Britain works through the League of Nations to address international disputes."
 INT_ENG_ten_year_rule_spirit:0 "Ten-Year Rule"
 INT_ENG_ten_year_rule_spirit_desc:0 "Defence planning assumes a major war is not imminent."
 INT_ENG_defence_review_spirit:0 "Defence Requirements Review"
 INT_ENG_defence_review_spirit_desc:0 "The government has reconsidered the scale and timing of rearmament."
 INT_ENG_raf_expansion_spirit:0 "RAF Expansion"
 INT_ENG_raf_expansion_spirit_desc:0 "The air force is receiving increased resources and new aircraft."
 INT_ENG_naval_rearmament_spirit:0 "Naval Rearmament"
 INT_ENG_naval_rearmament_spirit_desc:0 "The fleet is beginning a new programme of modernisation."
 INT_uk_interwar.1.t:0 "The Peace of Versailles"
 INT_uk_interwar.1.d:0 "The German delegation has signed the treaty at Versailles. Our ministers return with a settlement that promises security, but the costs of the war and the future of Europe remain unresolved."
 INT_uk_interwar.1.a:0 "We must make the peace endure."
 INT_uk_interwar.2.t:0 "The Anglo-Irish Treaty"
 INT_uk_interwar.2.d:0 "Our negotiators have agreed to create an Irish Free State with dominion status. The treaty leaves Northern Ireland within the United Kingdom and divides opinion on both sides of the Irish Sea."
 INT_uk_interwar.2.a:0 "Present the agreement to Parliament."
 INT_uk_interwar.3.t:0 "Bonar Law Forms a Government"
 INT_uk_interwar.3.d:0 "Conservative MPs have ended the coalition with Lloyd George. Andrew Bonar Law now forms a ministry that seeks a mandate of its own."
 INT_uk_interwar.3.a:0 "A new government takes office."
 INT_uk_interwar.4.t:0 "Baldwin Succeeds Bonar Law"
 INT_uk_interwar.4.d:0 "Ill health has forced Bonar Law from office. Stanley Baldwin takes over the premiership as arguments over tariffs and unemployment dominate the Commons."
 INT_uk_interwar.4.a:0 "Baldwin will lead the ministry."
 INT_uk_interwar.5.t:0 "Britain's First Labour Government"
 INT_uk_interwar.5.d:0 "The Conservatives have lost the confidence of the Commons. Ramsay MacDonald forms a Labour ministry, dependent on Liberal support and watched closely by both the trade unions and the City."
 INT_uk_interwar.5.a:0 "MacDonald forms his cabinet."
 INT_uk_interwar.6.t:0 "Baldwin Returns to Downing Street"
 INT_uk_interwar.6.d:0 "A general election has given the Conservatives a majority. Baldwin returns as prime minister after Labour's short first ministry."
 INT_uk_interwar.6.a:0 "The new Parliament meets."
 INT_uk_interwar.7.t:0 "The General Strike"
 INT_uk_interwar.7.d:0 "The Trades Union Congress has called a general strike in support of the miners. Trains, newspapers and many public services are disrupted while the government tries to maintain essential supplies."
 INT_uk_interwar.7.a:0 "Keep essential services running."
 INT_uk_interwar.8.t:0 "MacDonald Returns to Office"
 INT_uk_interwar.8.d:0 "Labour has emerged as the largest party in the Commons. Ramsay MacDonald returns to Downing Street to form a second ministry amid mounting economic difficulties."
 INT_uk_interwar.8.a:0 "A second Labour ministry begins."
 INT_uk_interwar.9.t:0 "A National Government Is Formed"
 INT_uk_interwar.9.d:0 "The financial crisis has broken the Labour cabinet over spending cuts. MacDonald remains prime minister and forms a National Government supported by Conservatives and Liberals."
 INT_uk_interwar.9.a:0 "The coalition must face the crisis."
 INT_uk_interwar.10.t:0 "Sterling Leaves the Gold Standard"
 INT_uk_interwar.10.d:0 "Pressure on sterling and the Bank of England's reserves has forced the government to suspend gold convertibility. Ministers now confront a volatile exchange rate and the need to restore confidence."
 INT_uk_interwar.10.a:0 "The pound must find a new footing."
 INT_uk_interwar.11.t:0 "The Statute of Westminster"
 INT_uk_interwar.11.d:0 "Parliament has enacted a statute recognising the legislative independence of the dominions. The Commonwealth now rests more clearly on consent than on Westminster's direct authority."
 INT_uk_interwar.11.a:0 "Recognise the dominions' equality."
 INT_uk_interwar.12.t:0 "Baldwin Again Becomes Prime Minister"
 INT_uk_interwar.12.d:0 "Ramsay MacDonald has stepped aside as leader of the National Government. Stanley Baldwin returns to the premiership as the cabinet faces questions of defence, unemployment and European security."
 INT_uk_interwar.12.a:0 "Baldwin takes office."
 INT_uk_interwar.13.t:0 "The Abyssinian Crisis"
 INT_uk_interwar.13.d:0 "Italy's assault on Ethiopia has put collective security to the test. Our ministers debate sanctions, the Mediterranean fleet and the risk that European cooperation will break apart."
 INT_uk_interwar.13.a:0 "Consult our partners in the League."
 INT_uk_news.a:0 "The world takes notice."
 INT_uk_news.1.t:0 "Britain and Ireland Sign a Treaty"
 INT_uk_news.1.d:0 "British and Irish negotiators have reached an agreement that provides for an Irish Free State with dominion status. Its implementation and the position of Northern Ireland remain politically contentious."
 INT_uk_news.2.t:0 "Labour Forms a Government in Britain"
 INT_uk_news.2.d:0 "Ramsay MacDonald has formed Britain's first Labour government after the Conservative ministry lost a vote in the Commons. The new cabinet relies on Liberal support."
 INT_uk_news.3.t:0 "A General Strike Begins in Britain"
 INT_uk_news.3.d:0 "British trade unions have begun a general strike in support of the miners. Transport and other essential services face disruption as talks between the unions and government continue."
 INT_uk_news.4.t:0 "Britain Forms a National Government"
 INT_uk_news.4.d:0 "Prime Minister Ramsay MacDonald has formed a cross-party National Government amid Britain's financial crisis. The move has split the Labour Party."
 INT_uk_news.5.t:0 "Britain Suspends Gold Convertibility"
 INT_uk_news.5.d:0 "The British government has suspended sterling's convertibility into gold after pressure on the currency and the Bank of England's reserves."
 INT_uk_news.6.t:0 "Dominions Gain Legislative Independence"
 INT_uk_news.6.d:0 "The British Parliament has enacted the Statute of Westminster, defining the legislative independence of the dominions within the Commonwealth."
 INT_uk_news.7.t:0 "Britain Debates Sanctions on Italy"
 INT_uk_news.7.d:0 "Italy's invasion of Ethiopia has prompted a British debate over League of Nations sanctions and the security of the Mediterranean."

 INT_ENG_civic_reconstruction:0 "Rebuild Parliamentary Government"
 INT_ENG_civic_reconstruction_desc:0 "The wartime coalition has ended. Parliament must restore ordinary debate while the country adjusts to peace."
 INT_ENG_welfare_ministry:0 "A Ministry for Health"
 INT_ENG_welfare_ministry_desc:0 "Public health administration can turn wartime lessons into more dependable services for civilians."
 INT_ENG_electoral_reform:0 "Extend the Franchise"
 INT_ENG_electoral_reform_desc:0 "The postwar electorate demands a broader voice in the Commons and a more representative settlement."
 INT_ENG_education_act:0 "The Fisher Education Act"
 INT_ENG_education_act_desc:0 "Longer schooling and better continuation classes will prepare a generation for modern industry."
 INT_ENG_wireless_britain:0 "Broadcasting for Britain"
 INT_ENG_wireless_britain_desc:0 "The new wireless service can inform the public and give the country a shared national forum."
 INT_ENG_social_compromise:0 "A Social Compromise"
 INT_ENG_social_compromise_desc:0 "Ministers seek practical agreements between employers, unions and local authorities after years of upheaval."
 INT_ENG_broadcast_service:0 "A National Broadcasting Service"
 INT_ENG_broadcast_service_desc:0 "A public broadcaster will provide reliable news and cultural programming across the United Kingdom."
 INT_ENG_equal_franchise:0 "Equal Franchise"
 INT_ENG_equal_franchise_desc:0 "The 1928 settlement gives women and men the same voting terms in parliamentary elections."
 INT_ENG_parliamentary_stability:0 "Steady the Commons"
 INT_ENG_parliamentary_stability_desc:0 "A stable ministry can address unemployment and security without another constitutional crisis."
 INT_ENG_public_works:0 "Public Works for Recovery"
 INT_ENG_public_works_desc:0 "Roads, schools and municipal improvements offer useful work while industry recovers from the slump."

 INT_ENG_industrial_reconstruction:0 "Reconstruct British Industry"
 INT_ENG_industrial_reconstruction_desc:0 "Factories and mines must be made competitive as wartime contracts and overseas demand fall away."
 INT_ENG_electricity_grid:0 "Coordinate the Electricity Grid"
 INT_ENG_electricity_grid_desc:0 "A coordinated supply of power will help modern machinery reach towns and industrial districts alike."
 INT_ENG_transport_board:0 "Unify Transport Planning"
 INT_ENG_transport_board_desc:0 "Railways, roads and ports need a common plan if British exports are to reach their markets efficiently."
 INT_ENG_research_associations:0 "Industrial Research Associations"
 INT_ENG_research_associations_desc:0 "Government-backed research can spread new techniques beyond the largest firms."
 INT_ENG_research_associations_bonus:0 "$INT_ENG_research_associations$"
 INT_ENG_empire_marketing:0 "Market British Goods Abroad"
 INT_ENG_empire_marketing_desc:0 "Commercial networks across the Empire offer a route for British goods while global trade remains unsettled."
 INT_ENG_industrial_modernisation:0 "Modernise the Industrial Base"
 INT_ENG_industrial_modernisation_desc:0 "Investment and research can renew the older industries that still support millions of British workers."
 INT_ENG_development_areas:0 "Develop the Distressed Areas"
 INT_ENG_development_areas_desc:0 "Special assistance is directed toward coal, steel and shipbuilding districts where unemployment is persistent."
 INT_ENG_housing_estates:0 "Build Municipal Estates"
 INT_ENG_housing_estates_desc:0 "Local authorities expand the housing drive, improving living standards and sustaining construction employment."
 INT_ENG_public_works_program:0 "A National Works Programme"
 INT_ENG_public_works_program_desc:0 "Large civic projects can put idle labour to work and improve the infrastructure needed for recovery."
 INT_ENG_recovery_investment:0 "Invest in Recovery"
 INT_ENG_recovery_investment_desc:0 "Lower borrowing costs and renewed construction give the economy a cautious path out of depression."

 INT_ENG_mandate_system:0 "Administer the Mandates"
 INT_ENG_mandate_system_desc:0 "Britain must organise its League mandates while answering growing demands for responsible government."
 INT_ENG_palestine_mandate:0 "The Palestine Mandate"
 INT_ENG_palestine_mandate_desc:0 "The mandate requires a difficult balance between commitments, local communities and security."
 INT_ENG_iraq_treaty:0 "The Anglo-Iraqi Treaty"
 INT_ENG_iraq_treaty_desc:0 "A treaty with Baghdad can replace direct occupation with a more durable partnership."
 INT_ENG_transjordan_autonomy:0 "Autonomy in Transjordan"
 INT_ENG_transjordan_autonomy_desc:0 "Local administration under Emir Abdullah offers a less costly and more flexible imperial arrangement."
 INT_ENG_iraq_independence:0 "Iraqi Independence"
 INT_ENG_iraq_independence_desc:0 "Britain supports Iraq's entry into the League while preserving close strategic and commercial ties."
 INT_ENG_middle_east_command:0 "Coordinate Middle Eastern Defence"
 INT_ENG_middle_east_command_desc:0 "Airfields, ports and garrisons in the Middle East require a single strategic outlook."
 INT_ENG_imperial_shipping:0 "Protect Imperial Shipping"
 INT_ENG_imperial_shipping_desc:0 "Merchant routes link the Empire, and the Royal Navy must keep those routes dependable in a crisis."
 INT_ENG_empire_exhibition:0 "The Empire Exhibition"
 INT_ENG_empire_exhibition_desc:0 "A great exhibition in Wembley presents imperial goods and reinforces economic ties across the Commonwealth."
 INT_ENG_dominion_consultation:0 "Consult the Dominions"
 INT_ENG_dominion_consultation_desc:0 "The dominions expect a voice in decisions that affect the common defence and foreign policy."
 INT_ENG_commonwealth_defence:0 "Plan Commonwealth Defence"
 INT_ENG_commonwealth_defence_desc:0 "Defence discussions with the dominions can turn constitutional partnership into practical cooperation."

 INT_ENG_american_relations:0 "Renew Anglo-American Relations"
 INT_ENG_american_relations_desc:0 "The United States remains an indispensable financial and naval partner in the postwar order."
 INT_ENG_anglo_french_entente:0 "Maintain the French Connection"
 INT_ENG_anglo_french_entente_desc:0 "Regular consultation with France offers a measure of security on the Channel and the Rhine."
 INT_ENG_soviet_recognition:0 "Recognise the Soviet Union"
 INT_ENG_soviet_recognition_desc:0 "Formal relations with Moscow may open trade while giving diplomats a clearer view of Soviet policy."
 INT_ENG_rhine_guarantee:0 "Guarantee the Rhineland Settlement"
 INT_ENG_rhine_guarantee_desc:0 "Britain helps uphold the Locarno settlement and the principle of negotiated European security."
 INT_ENG_trade_diplomacy:0 "Trade as Diplomacy"
 INT_ENG_trade_diplomacy_desc:0 "Commercial agreements can ease political tensions and keep Britain engaged with continental markets."
 INT_ENG_collective_security:0 "Defend Collective Security"
 INT_ENG_collective_security_desc:0 "The League will only deter aggression if Britain is prepared to give its promises practical weight."
 INT_ENG_arms_control:0 "Pursue Arms Control"
 INT_ENG_arms_control_desc:0 "Britain continues to seek verifiable limits even as the failures of disarmament become harder to ignore."
 INT_ENG_french_staff_talks:0 "Staff Talks with France"
 INT_ENG_french_staff_talks_desc:0 "Military discussions clarify what help Britain could provide if a continental crisis becomes a war."
 INT_ENG_mediterranean_entente:0 "Secure the Mediterranean"
 INT_ENG_mediterranean_entente_desc:0 "The route through the Mediterranean remains vital to India, the dominions and the defence of Europe."
 INT_ENG_security_guarantees:0 "Guarantee European Security"
 INT_ENG_security_guarantees_desc:0 "Britain must decide which commitments it can honour as treaty violations multiply."

 INT_ENG_staff_college:0 "Reform the Staff College"
 INT_ENG_staff_college_desc:0 "Professional education will prepare officers for the changing demands of mechanised and joint warfare."
 INT_ENG_territorial_army:0 "Renew the Territorial Army"
 INT_ENG_territorial_army_desc:0 "The Territorial Army provides trained reserves without returning to the mass mobilisation of 1914."
 INT_ENG_mechanisation_board:0 "A Mechanisation Board"
 INT_ENG_mechanisation_board_desc:0 "The Army studies vehicles, signals and logistics before committing to expensive equipment programmes."
 INT_ENG_military_training:0 "Standardise Field Training"
 INT_ENG_military_training_desc:0 "Exercises and staff work can restore readiness after years of economy and reduced commitments."
 INT_ENG_armoured_experiments:0 "Experiment with Armour"
 INT_ENG_armoured_experiments_desc:0 "Experimental formations test how tanks might support infantry and exploit a breakthrough."
 INT_ENG_home_defence_plans:0 "Plan Home Defence"
 INT_ENG_home_defence_plans_desc:0 "The defence of ports, factories and communications needs a plan for the first days of a war."
 INT_ENG_coastal_defence_plans:0 "Plan Coastal Defence"
 INT_ENG_coastal_defence_plans_desc:0 "Coastal patrols and maritime aircraft plans protect the approaches to the British Isles."
 INT_ENG_naval_aviation_coordination:0 "Coordinate Naval Aviation"
 INT_ENG_naval_aviation_coordination_desc:0 "Naval aviation planning must connect reconnaissance, carrier operations and the wider air defence system."
 INT_ENG_submarine_defence:0 "Prepare Anti-Submarine Defence"
