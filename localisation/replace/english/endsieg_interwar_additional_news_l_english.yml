l_english:
 INT_world_news.a:0 "The world takes notice."

 INT_world_news.1.t:0 "The Munich Putsch Fails"
 INT_world_news.1.d:0 "On 9 November 1923, Bavarian police stopped Adolf Hitler and his allies as they marched through Munich toward the Feldherrnhalle. The attempted seizure of power collapsed, and the government moved to ban the Nazi Party and prosecute its leaders. The immediate revolt is contained, but the violence of the currency and Ruhr crises has exposed the fragility of Germany's constitutional order."
 INT_world_news.2.t:0 "The Reichstag Fire Decree"
 INT_world_news.2.d:0 "After the Reichstag burned on 27 February 1933, President Hindenburg signed an emergency decree at the Hitler cabinet's request. Fundamental civil liberties are suspended, allowing police to detain political opponents and suppress publications and meetings. Berlin calls the measures a defense against revolution; the republic's constitutional protections are being dismantled."
 INT_world_news.3.t:0 "Fighting in Berlin"
 INT_world_news.3.d:0 "Armed revolutionary groups and their supporters have seized parts of central Berlin in January 1919, as the new republic prepares to elect a national assembly. The government calls on loyal forces to regain the streets while workers' demonstrations and rival claims to authority divide the capital. The fighting threatens to deepen the split within the German left."
 INT_world_news.4.t:0 "A Council Republic Proclaimed in Bavaria"
 INT_world_news.4.d:0 "On 7 April 1919, revolutionary councils in Munich proclaimed a Bavarian republic governed through workers' and soldiers' councils. The elected state government has left the city and is seeking support to restore its authority. Armed groups are gathering on both sides, presenting the national government with another challenge to its fragile postwar order."
 INT_world_news.5.t:0 "The Munich Council Republic Is Suppressed"
 INT_world_news.5.d:0 "Government troops and volunteer formations took Munich in early May 1919 after fierce fighting. The council government is gone, but deaths in the streets and reprisals against suspected supporters are deepening the divide between revolutionary workers and the republic's leaders. Restoring civil administration will take more than a military victory."
 INT_world_news.6.t:0 "Germany Leaves the League of Nations"
 INT_world_news.6.d:0 "On 14 October 1933, the Hitler government announced Germany's withdrawal from the League of Nations and the disarmament talks in Geneva. Berlin argues that the other powers refuse Germany equal treatment in armaments. Foreign governments see the withdrawal as a challenge to the international settlement, and diplomacy loses a forum that the Weimar republic worked to enter only seven years ago."
 INT_world_news.7.t:0 "Anglo-German Naval Agreement"
 INT_world_news.7.d:0 "British and German representatives signed an agreement on 18 June 1935 allowing the German navy to reach 35 percent of British naval tonnage overall, with a separate provision for submarines. London hopes a defined limit will prevent an uncontrolled naval race; Berlin treats the deal as recognition of its rearmament. France was not included in the negotiation."
 INT_world_news.8.t:0 "The Nuremberg Laws"
 INT_world_news.8.d:0 "At the Nazi Party rally in Nuremberg on 15 September 1935, the regime announced laws stripping Jewish Germans of full citizenship and prohibiting marriages and intimate relationships between Jews and people classified by the state as German blood. Racial persecution is now written into national law, deepening the exclusion already imposed through dismissals, boycotts, and violence."

 INT_world_news.9.t:0 "The Great Kanto Earthquake"
 INT_world_news.9.d:0 "On 1 September 1923, a devastating earthquake struck the Tokyo-Yokohama region. Fires spread through the wreckage, communications failed, and ruined infrastructure made relief and reconstruction an urgent national task. The scale of the disaster has shaken Japan's government and economy."

 INT_world_news.10.t:0 "Bonar Law Forms a Government"
 INT_world_news.10.d:0 "On 23 October 1922, Conservative MPs ended the coalition with David Lloyd George. Andrew Bonar Law formed a ministry seeking a mandate of its own, while Britain faced the postwar debt burden, industrial unrest, and arguments over the direction of trade policy."
 INT_world_news.11.t:0 "Baldwin Succeeds Bonar Law"
 INT_world_news.11.d:0 "Ill health forced Andrew Bonar Law from office in May 1923. Stanley Baldwin took over the premiership as arguments over tariffs, unemployment, and the future of the Conservative government dominated the House of Commons."
 INT_world_news.12.t:0 "Baldwin Returns to Downing Street"
 INT_world_news.12.d:0 "A general election in October 1924 gave the Conservatives a majority, and Stanley Baldwin returned as prime minister in November. Labour's short first ministry has ended, while the new government faces pressure over industrial relations, housing, and the gold standard."
 INT_world_news.13.t:0 "MacDonald Returns to Office"
 INT_world_news.13.d:0 "The general election of May 1929 left Labour as the largest party in the Commons. Ramsay MacDonald returned to Downing Street to form a second ministry, taking office as unemployment rises and the international economy shows signs of strain."
 INT_world_news.14.t:0 "Baldwin Again Becomes Prime Minister"
 INT_world_news.14.d:0 "Ramsay MacDonald stepped aside as leader of the National Government in June 1935. Stanley Baldwin returned to the premiership as the cabinet faced questions of defence, unemployment, and European security."

 INT_world_news.15.t:0 "The Nineteenth Amendment"
 INT_world_news.15.d:0 "On 18 August 1920, Tennessee became the final state needed to ratify the Nineteenth Amendment. The Constitution now prohibits denying the vote on grounds of sex, bringing women into national elections after decades of campaigning."
 INT_world_news.16.t:0 "The Immigration Act"
 INT_world_news.16.d:0 "The Immigration Act signed on 26 May 1924 imposes national-origin quotas and excludes immigrants from much of Asia. Washington presents the measure as a restriction on population and migration, while critics warn that it makes racial hierarchy a principle of American law."
 INT_world_news.17.t:0 "Hoover Takes Office"
 INT_world_news.17.d:0 "Herbert Hoover entered the White House on 4 March 1929 after promising continued prosperity and efficient government. His administration inherits a booming but increasingly speculative economy, with confidence in American growth still high as the new term begins."
 INT_world_news.18.t:0 "Smoot-Hawley Becomes Law"
 INT_world_news.18.d:0 "President Hoover signed the Smoot-Hawley Tariff Act on 17 June 1930, raising American duties across a broad range of imports. Supporters call the measure protection for domestic producers; trading partners warn that retaliation could further restrict world commerce during the depression."
 INT_world_news.19.t:0 "The Reconstruction Finance Corporation"
 INT_world_news.19.d:0 "Congress authorised the Reconstruction Finance Corporation in January 1932 to lend to banks, railroads, and other institutions under pressure. Washington hopes emergency credit will prevent further failures, though the agency begins work while unemployment and the wider depression continue to deepen."
