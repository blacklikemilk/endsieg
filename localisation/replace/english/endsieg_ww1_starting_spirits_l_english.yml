l_english:
 FR3_ww1_citizen_army: "The Citizen Army"
 FR3_ww1_citizen_army_desc: "France has trained reservists in every district, but the depots cannot yet call them all up efficiently. The Three-Year Law can provide more trained men. Reserve registers and district exercises are needed to put them in the field.\n\n§Y$FR3_ww1_reform_implementation$§! starts the programme. §Y$FR3_ww1_reform_trials$§! completes it."
 EN1_ww1_small_regular_army: "The Small Regular Army"
 EN1_ww1_small_regular_army_desc: "Britain maintains a professional expeditionary force, but it has limited reserves for a long war. Haldane’s reforms provide the framework. County cadres must be trained and the new system exercised.\n\n§Y$EN1_ww1_reform_implementation$§! starts the programme. §Y$EN1_ww1_reform_trials$§! completes it."
 JP1_ww1_service_rivalry: "Separate Services"
 JP1_ww1_service_rivalry_desc: "The Army and Navy plan for different wars and place competing orders with the same factories. The cabinet can audit the accounts, bring purchasing together and then settle how contracts will be awarded.\n\n§Y$JP1_ww1_reform_implementation$§! starts the programme. §Y$JP1_ww1_reform_trials$§! completes it."
