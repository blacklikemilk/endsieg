 # Technology localisation
 accounting_machine_desc:0 "Machines that combine tabulation with routine calculations can reduce the burden of complex clerical work. Researchers will be able to process information more efficiently."
 advanced_early_machine_tools_desc:0 "Specialized tooling and improved workshop practice will allow production lines to make better use of their equipment."
 advanced_light_tank_art_a:0 "Light Self-Propelled Artillery IV"
 advanced_light_tank_art_a_desc:0 "$light_tank_artillery_equipment_desc$"
 advanced_light_tank_art_b:0 "Light Self-Propelled Artillery V"
 advanced_light_tank_art_b_desc:0 "$light_tank_artillery_equipment_desc$"
 advanced_light_tank_spaa_a:0 "Light Self-Propelled Anti-Air IV"
 advanced_light_tank_spaa_a_desc:0 "$light_tank_aa_equipment_desc$"
 advanced_light_tank_spaa_b:0 "Light Self-Propelled Anti-Air V"
 advanced_light_tank_spaa_b_desc:0 "$light_tank_aa_equipment_desc$"
 advanced_light_tank_td_a:0 "Light Tank Destroyer IV"
 advanced_light_tank_td_a_desc:0 "$light_tank_destroyer_equipment_desc$"
 advanced_light_tank_td_b:0 "Light Tank Destroyer V"
 advanced_light_tank_td_b_desc:0 "$light_tank_destroyer_equipment_desc$"
 air_armaments_desc:0 "Mounting weapons on an aircraft presents new problems of recoil, weight and aiming. Suitable installations will allow pilots to engage the enemy in the air."
 air_counter_air_desc:0 "Air patrols must find and engage the enemy before they reach our formations. Better coordination between observers and pilots will help us secure the airspace above the front."
 air_duel_doctrine_desc:0 "Enemy reconnaissance aircraft cannot be allowed to observe our positions unchallenged. Pilots trained to seek out and engage them will contest control of the sky."
 air_recon_desc:0 "Observations from the air can reveal enemy movements beyond the reach of ground patrols. Reports must reach our commanders quickly enough to guide the battle."
 airframe_desc:0 "The wings and supporting structure must withstand the stresses of flight without becoming too heavy. More dependable construction will allow aircraft to carry useful military loads."
 anti_air3_desc:0 "Improved sights and gun drill will help anti-aircraft batteries engage moving aircraft more effectively."
 anti_air52_desc:0 "Prepared anti-aircraft positions can accommodate more substantial batteries. Fixed installations will provide a stronger basis for the defense of important sites."
 automatic_feed_tab_desc:0 "An automatic card feed will reduce the handling required by tabulating machines. Larger sets of information can then be processed more efficiently."
 basic_CAS:0 "Interwar Close Air Support"
 basic_CAS_desc:0 "Experience over the battlefield can be applied to a dedicated ground attack aircraft. A practical weapons load and dependable handling will make it more useful to the army."
 basic_bomber:0 "Basic Bomber"
 basic_bomber_desc:0 "A more practical bomber design can carry a useful load on regular operations. Its crew must be able to navigate, defend the aircraft and release the bombs over the target."
 basic_fighter_desc:0 "A fighter must do more than carry a machine gun. Stronger construction and improved handling will allow pilots to bring their weapons to bear during sustained aerial combat."
 battlefleet_concentration1_desc:0 "$battlefleet_concentration_desc$"
 better_trench_conditions_desc:0 "Improved drainage, shelters and routine maintenance will make life in the trenches more bearable. Troops will be better able to recover from the strain of service."
 bomb_dropping_desc:0 "Aircraft can strike targets beyond the front line by carrying bombs. Dedicated training will make these attacks more accurate and consistent."
 cas_concept_desc:0 "Aircraft operating close to the front can attack positions that hold up our advance. Their efforts must be coordinated with the troops below."
 census_tabulating_desc:0 "Punched cards allow large collections of information to be sorted and counted mechanically. These methods can assist the calculations required by research and administration."
 central_control_desc:0 "Central direction can concentrate supporting fire on the most important objectives. Common orders will help separate formations bring their weapons to bear together."
 cipher_machine_desc:0 "Mechanical cipher equipment can make the preparation of coded messages more consistent. Its design will form a basis for further work in secure communications."
 combined_arms2:0 "Combined Arms II"
 combined_arms2_desc:0 "$combined_arms_desc$"
 concentrated_fire_desc:0 "Capital ships should concentrate their guns on selected targets. Common fire orders will prevent the strength of the battle line from being dispersed."
 construction10_desc:0 "Further improvements in equipment and site organization will increase the pace of construction."
 construction11_desc:0 "Coordinating the delivery of materials with work on site will allow major building projects to proceed with fewer interruptions."
 construction6_desc:0 "Improved materials and construction methods will allow more substantial works to be completed efficiently, including permanent fortifications."
 construction7_desc:0 "Common specifications and better site planning will reduce delays in building projects."
 construction8_desc:0 "Mechanized equipment and improved organization will allow construction crews to complete large projects more quickly."
 construction9_desc:0 "Repair crews need suitable equipment and clear priorities to restore damaged industry. Organized reconstruction will bring facilities back into service more quickly."
 constructiondemob_desc:0 "Emergency wartime building programs must give way to regular civil and military works. Construction will proceed at a peacetime pace, with more permanent defensive positions replacing improvised works."
 convoy_raiding_desc:0 "Submarines must find and attack merchant shipping before escorts can intervene. Shared reports and coordinated patrols will improve their chances of intercepting traffic."
 counterattack_desc:0 "An attacker is vulnerable while reorganizing after an advance. Reserves held ready for a counterattack can recover ground before the enemy consolidates it."
 cross_branch_tactical_desc:0 "Sharing battlefield experience between the arms of the service will help infantry make better use of supporting fire."
 cv_naval_bomber0:0 "Early Carrier Naval Bomber"
 cv_naval_bomber0_desc:0 "Adapting a naval bomber for shipboard use will extend the striking reach of the fleet. Its airframe must withstand the demands of takeoff and landing at sea."
 cv_naval_bomber01:0 "Interwar Carrier Naval Bomber"
 cv_naval_bomber01_desc:0 "A more capable carrier bomber will allow the fleet to strike targets beyond the horizon. Its design must combine a useful weapons load with the demands of shipboard operation."
 defense_in_depth_desc:0 "A defensive system must extend beyond a single line of trenches. Successive positions will allow troops to continue resisting even when the forward line is breached."
 defensive_attrition_desc:0 "Prepared positions and carefully directed fire can wear down repeated attacks. Building substantial defenses takes time, but will make the enemy pay for each advance."
 demobilization2_desc:0 "The industrial expansion of wartime cannot be maintained indefinitely. Returning factories and shipyards to a peacetime footing will reduce the capacity devoted to military production."
 demobilization_machine_tools_desc:0 "Factories organized for wartime demand must return to a peacetime footing. Replacing emergency production arrangements will reduce the intensity of military output."
 distracting_maneuver_desc:0 "A diversion can draw the enemy away from our main effort. Heavy ships should be ready to exploit the opening while the opposing fleet is out of position."
 early_CAS_desc:0 "Aircraft attacking from low altitude can engage enemy positions close to our troops. Their design must accommodate weapons suited to ground targets."
 early_air_armaments_desc:0 "Machine guns need suitable mountings before they can serve aboard an aircraft. Fixed installations and flexible mounts will give crews weapons for aerial combat."
 early_airframe_desc:0 "Stronger construction and protection for vulnerable components will make small aircraft more suitable for combat service."
 early_artillery_3_desc:0 "Refinements to gun construction and ammunition will make field batteries more effective. The same work can also inform compact gun mountings for armored vehicles."
 early_artillery_5_desc:0 "More consistent ammunition and improved sights will help batteries place their fire where it is needed."
 early_artillery_6_desc:0 "Better fire direction and gun drill will allow field artillery to support the infantry with greater effect."
 early_artillery_7_desc:0 "Field artillery must be reorganized around common equipment and methods. Modern gun designs will provide a basis for the next generation of batteries."
 early_engine_desc:0 "A lightweight engine with dependable output will provide a practical power plant for early military aircraft."
 early_fighter_airframe_desc:0 "Improved construction and protection for vulnerable components will prepare larger aircraft for more demanding combat operations."
 early_fighter_engine_desc:0 "A more powerful engine will give our small aircraft greater freedom to carry weapons and equipment."
 early_fuel_tank2_desc:0 "Additional fuel capacity will extend the reach of our medium aircraft. The tanks must fit within the airframe without displacing essential equipment."
 early_fuselage_desc:0 "A military aircraft needs space for its pilot, fuel and equipment. An improved fuselage will allow additional fuel to be carried without compromising the structure."
 early_heavy_airframe_desc:0 "Large combat aircraft need stronger structures and protection for their vulnerable components. These improvements will make them better suited to sustained operations."
 early_heavy_bomb_desc:0 "A large bomb bay provides the space needed for a substantial bomb load. Its structure must carry that weight without weakening the aircraft."
 early_heavy_engine_desc:0 "Multiple engines will provide the power required by large military aircraft. Common installations will simplify the construction and operation of these designs."
 early_infantry_equip_desc:0 "Refinements to the infantry arsenal will make small arms more effective in service. Reliable weapons and consistent ammunition are essential to sustained fire."
 early_infantry_equip2_desc:0 "Experience in the field will guide improvements to infantry weapons and their fittings. Soldiers need equipment that remains dependable under the conditions of battle."
 early_infantry_equip3_desc:0 "Further refinements to small arms will give infantry formations a more effective arsenal. Common equipment standards will simplify their use in the field."
 early_light_bomb_desc:0 "An internal bay will allow a small aircraft to carry bombs in a dedicated installation. The release mechanism must operate reliably in flight."
 early_machine_tools_desc:0 "Accurate machine tools allow workshops to produce components to common dimensions. This will make larger production runs more practical."
 early_medium_bomb_desc:0 "A larger bomb bay will allow medium aircraft to carry a more useful load against ground targets."
 early_naval_bomber_desc:0 "Aircraft armed for attacks on shipping can threaten vessels far from our own fleet. Their crews need suitable weapons and training for operations over water."
 early_support_weapons_desc:0 "Weapons assigned to support the riflemen can strengthen both an assault and a defensive position. Their crews must be trained to work with the rest of the formation."
 early_support_weapons2_desc:0 "More dependable supporting weapons will give infantry formations a steadier base of fire. Suitable equipment and practiced crews are equally necessary."
 early_support_weapons3_desc:0 "Supporting weapons must be distributed where the infantry can make use of them. Common methods of deployment will improve their contribution to the battle."
 early_support_weapons4_desc:0 "Experience in sustained fighting will guide improvements to our supporting weapons. Crews need equipment that can remain in action under demanding conditions."
 early_support_weapons5_desc:0 "Dedicated fire support formations will bring heavier weapons closer to the infantry. Their organization must allow them to assist both attacks and defensive operations."
 eg_early_tank:0 "Early Tank I"
 eg_early_tank_desc:0 "A tracked vehicle protected by armor can accompany infantry across ground swept by machine gun fire. Its first designs favor protection and obstacle crossing over speed."
 eg_early_tank2:0 "Early Tank II"
 eg_early_tank2_desc:0 "Experience with early tanks reveals the need for more reliable engines and better crew arrangements. Refining these designs will make armored vehicles more practical in the field."
 eg_early_tank3:0 "Early Tank III"
 eg_early_tank3_desc:0 "Improved layout and mechanical reliability will allow tanks to operate more effectively alongside the infantry. Their weapons and protection must be developed as parts of a single design."
 eg_tank_armor:0 "Tank Armor"
 eg_tank_armor_desc:0 "Steel plate can protect a vehicle and its crew from small arms fire. The protection must be balanced against the weight its tracks and engine can carry."
 eg_tank_engine:0 "Tank Engine"
 eg_tank_engine_desc:0 "A tracked armored vehicle needs enough power to move across broken ground. Its engine and transmission must withstand heavy loads at low speed."
 eg_tank_gun:0 "Tank Armament"
 eg_tank_gun_desc:0 "An armored vehicle must carry weapons that can be served within a confined fighting compartment. Suitable mountings will allow the crew to engage targets while under fire."
 engine_desc:0 "Aircraft require engines that combine sufficient power with low weight. Reliable operation is essential if flights are to extend beyond the airfield."
 engine3_desc:0 "More powerful engines will allow our bombers to carry heavier loads. Careful development is needed to preserve their reliability on long flights."
 escort_sub_desc:0 "Reports from submarine patrols can help us locate merchant traffic and assess threats to our own routes. Coordinating these patrols with convoy protection will make better use of the information they gather."
 experimental_aircraft_desc:0 "Experimental flying machines will allow us to study powered flight. Their designs provide a foundation for aircraft suited to military service."
 fighter_airframe_desc:0 "An improved airframe can make better use of a powerful engine. Refined construction will prepare our fighters for longer flights and more demanding combat."
 fighter_engine_desc:0 "Further development of the aircraft engine will provide the power needed by heavier and faster fighters. Reliability must keep pace with the increase in output."
 fleet_in_being1_desc:0 "$fleet_in_being_desc$"
 flying_circus_desc:0 "Concentrating experienced fighter pilots in mobile formations allows us to reinforce the most important sectors. Their skill and coordination will give our aircraft a greater influence over the battle."
 focused_fire_desc:0 "Sustained fire against priority targets can decide an engagement before the enemy brings their full strength to bear. The battle line must act on a common plan."
 force_substitution_desc:0 "Aircraft can undertake missions that would otherwise tie down ground forces. Concentrating our air strength over threatened sectors will make this support more dependable."
 formal_air_doctrine_desc:0 "Common procedures for patrols, escorts and reporting will turn individual squadrons into a coordinated air force."
 forward_control_desc:0 "Command close to the front allows orders and supply arrangements to respond to local conditions. Formations will be better able to remain organized as they move."
 frag_grenade_desc:0 "A casing designed to break into fragments will make a grenade more effective against nearby targets. Its fuze must provide a dependable delay after it is thrown."
 fuel_tank2_desc:0 "Larger fuel tanks can extend the reach of an aircraft. Their installation must account for the added weight and the need to supply the engines throughout the flight."
 fuselage_desc:0 "A purpose-built fuselage can house the crew and equipment while holding the aircraft together. Its design must balance strength, weight and resistance to the air."
 gas_mask_desc:0 "Protective masks will allow troops to remain in position when exposed to poison gas. A reliable seal and suitable filtering material are essential."
 gas_mask2_desc:0 "Improved filters and a closer fit will make gas masks more dependable in the field. Soldiers must be able to put them on quickly without exposing their faces."
 gas_mask3_desc:0 "More practical respirators will provide protection during prolonged exposure. Clear instructions and careful maintenance will help troops keep their masks serviceable."
 gwtank_desc:0 "A more balanced tank design can retain the protection of its predecessors while improving mobility and reliability. It will provide a foundation for further armored development."
 hand_grenade_desc:0 "Hand grenades give infantry a means of attacking targets sheltered from direct rifle fire. Suitable designs must be safe to carry and simple to use under fire."
 heavy_bomb_desc:0 "Heavy bombs provide a means of attacking substantial structures. Carrying them requires suitable aircraft and stronger release gear."
 heavy_engine_desc:0 "Large aircraft require engines capable of sustaining heavy loads over long distances. Improved power plants will make these designs more practical."
 horse_artillery2_desc:0 "Improved gun handling and trained teams will bring horse-drawn batteries into action more effectively. Once deployed, their fire must be directed against the targets that matter most."
 horses_desc:0 "Mounted troops can cover ground more quickly than infantry on foot. Their organization must provide for both the soldiers and the horses on which their mobility depends."
 howitzer:0 "Howitzer I"
 howitzer_desc:0 "Howitzers can fire over obstacles and into covered positions. Bringing their fire to bear on the enemy will help the infantry force a passage through defended ground."
 howitzer10_desc:0 "Further refinements to projectiles and fuzes will improve the effect of howitzer shells against resistant targets."
 howitzer11_desc:0 "Rapid fire planning will allow howitzer batteries to support an advance as the fighting moves forward. The infantry must be able to call for fire without lengthy delays."
 howitzer12:0 "Howitzer XII"
 howitzer12_desc:0 "Closer coordination between observers and gun crews will keep heavy fire support available throughout an assault."
 howitzer2_desc:0 "Improved shells and more consistent charges will make howitzer fire more effective against protected targets."
 howitzer3_desc:0 "Closer cooperation between infantry and howitzer batteries will allow heavy fire to be directed against the enemy positions that resist our advance."
 howitzer4_desc:0 "Further development of ammunition will improve the effect of howitzer shells against armored and reinforced targets."
 howitzer5_desc:0 "Refined fuzes and shell construction will help our howitzers deliver more effective fire against protected targets."
 howitzer6_desc:0 "Howitzer batteries must be reorganized around common fire procedures and ammunition standards. This will provide a consistent basis for their future development."
 howitzer7_desc:0 "More responsive howitzer support will allow infantry formations to bring heavy fire against enemy troop concentrations."
 howitzer8_desc:0 "Improved projectiles will increase the effectiveness of howitzer fire against armored targets and fortified positions."
 howitzer9_desc:0 "Training infantry to direct supporting howitzer fire will help them engage armored targets that their own weapons cannot defeat."
 improved_bomber:0 "Improved Bomber"
 improved_bomber_desc:0 "Stronger airframes and improved engines will allow our bombers to carry heavier loads farther from their bases."
 improved_early_machine_tools_desc:0 "More dependable cutting and shaping equipment will reduce variation between components. Factories can maintain a more consistent rate of output."
 improved_fighter_desc:0 "Combat experience allows us to refine the fighter into a more capable aircraft. Greater performance and a more practical armament will help it contend with enemy designs."
 improved_rubber_plant_desc:0 "Refinements to plant construction will make it easier to expand synthetic rubber production. Larger installations can make better use of the available process equipment."
 indirect_intervention_desc:0 "Our heavy ships need not seek a decisive battle at every opportunity. Working with light forces, they can influence the fighting while limiting their own exposure."
 interwar_bomber_doctrine_desc:0 "The experience of sustained bombing campaigns must become a permanent part of air force training. Careful target selection will make better use of each sortie."
 interwar_fighter_doctrine_desc:0 "Fighter training must place greater emphasis on formation flying and bomber escort. Disciplined squadrons can protect our aircraft while watching for enemy interception."
 interwar_machine_gun_desc:0 "Machine gun formations must be reorganized around common equipment and methods. Wartime establishments will give way to a consistent basis for future development."
 interwar_support_weapons_desc:0 "Supporting weapons must be adapted to the lessons of the Great War. Better arrangements for their crews and ammunition will make them more useful in the field."
 interwar_support_weapons2_desc:0 "Further refinements to supporting weapons will give infantry formations a more dependable base of fire."
 interwar_support_weapons3_desc:0 "Improved sights, mountings and crew drill will help supporting weapons work more effectively alongside the infantry."
 interwar_support_weapons4_desc:0 "Wartime support arrangements must be reorganized around common equipment and peacetime establishments. This will create a consistent foundation for future development."
 interwars_infantry_equip_desc:0 "The lessons of the Great War must inform the development of infantry weapons. Improved designs will help small formations deliver effective fire."
 interwars_infantry_equip2_desc:0 "The infantry arsenal must be reorganized around common weapons and ammunition. A consistent peacetime standard will provide the basis for future rearmament."
 interwars_naval_bomber_desc:0 "Improved naval aircraft can carry their weapons farther over open water. Dependable navigation and practical attack methods will make them a more useful threat to shipping."
 leading_by_order_desc:0 "Detailed orders will give each formation a clear place in the plan. Discipline and a common understanding of command will help units act together."
 leading_by_task_desc:0 "Commanders should be given a clear objective and the freedom to choose how to achieve it. Initiative at the front can keep an operation moving when circumstances change."
 light_bomb_desc:0 "Small bombs give aircraft a means of attacking exposed troops and equipment. Suitable racks will allow them to be carried and released safely."
 machine_gun_desc:0 "A machine gun can maintain a volume of fire beyond that of individual riflemen. Its crew needs a stable mounting and a dependable supply of ammunition."
 machine_gun2_desc:0 "Improved cooling and feed mechanisms will help machine guns sustain their fire. Suitable mountings will also allow them to serve aboard armored vehicles."
 machine_gun3_desc:0 "More practical mountings and ammunition arrangements will allow machine guns to be used in a wider range of positions and vehicles."
 machine_gun4_desc:0 "Refinements to the weapon and its mounting will make machine gun teams more effective. Reliable operation remains essential during prolonged fighting."
 main_battle_tank_art_a:0 "Modern Self-Propelled Artillery II"
 main_battle_tank_art_a_desc:0 "$modern_tank_artillery_equipment_desc$"
 main_battle_tank_spaa_a:0 "Modern Self-Propelled Anti-Air II"
 main_battle_tank_spaa_a_desc:0 "An armored anti-aircraft vehicle can accompany mobile formations and engage aircraft threatening their advance. Its weapons and crew must be ready to respond as the battle moves."
 main_battle_tank_td_a:0 "Modern Tank Destroyer II"
 main_battle_tank_td_a_desc:0 "$modern_tank_destroyer_equipment_desc$"
 mass_charge_desc:0 "A rapid assault by concentrated infantry can carry the fight into the enemy position before the attack loses momentum. Speed comes at the expense of careful defensive preparation."
 medium_bomb_desc:0 "A larger bomb can inflict greater damage on buildings and field positions. Aircraft must be provided with racks suited to its weight and dimensions."
 modern_machine_gun_desc:0 "Modern machine guns must combine dependable automatic fire with practical handling. They will provide infantry formations with a strong base of fire in attack and defense."
 modern_support_weapons_desc:0 "Modern fire support formations need weapons and procedures suited to the pace of battle. Organized support will strengthen infantry in both attack and defense."
 modern_support_weapons2_desc:0 "Improved field guns and supporting weapons will allow specialist formations to deliver more effective fire in support of the infantry."
 modern_support_weapons3_desc:0 "Further improvements to gun handling and fire direction will make supporting formations more responsive as the fighting develops."
 modern_support_weapons4_desc:0 "Supporting formations must keep their weapons in action as the infantry advances. Refined equipment and crew drill will help them maintain effective fire."
 modern_support_weapons5_desc:0 "Reliable supporting weapons and well-practiced crews will give infantry formations the fire they need during sustained operations."
 naval_baiting_desc:0 "A threatened withdrawal can draw the enemy toward a prepared battle line. Careful coordination will allow our capital ships to fight on more favorable terms."
 nineteenth_cent_warfare_desc:0 "Established methods of drill and command provide the foundation of the army. They must now contend with the increasing firepower of modern weapons."
 offensive_attrition_desc:0 "Sustained pressure can exhaust the enemy and deny them the opportunity to recover. Formations must be prepared to hold their gains while the fighting continues."
 post_gw_desc:0 "The mass armies of the Great War must return to a peacetime establishment. Reduced formations and a revised command structure will replace the extraordinary arrangements of wartime."
 post_gw2_desc:0 "The experience of the Great War must be collected and made part of regular naval training. Peacetime exercises will preserve the lessons of fleet actions, escort work and submarine patrols."
 post_gw_doctrine_desc:0 "The lessons of the Great War must guide the next generation of air operations. Dedicated methods for ground support, bombing and naval attack will give each formation a clear role."
 powered_flight_desc:0 "Powered aircraft offer a new means of observing the battlefield. Before they can serve the army, we must establish how pilots and ground crews are to operate them."
 prototype_fighter:0 "Prototype Fighter"
 prototype_fighter_desc:0 "An armed aircraft can deny the enemy the freedom to observe our troops. These first fighter designs place weapons within reach of the pilot while retaining enough agility for combat."
 rubber_plant_desc:0 "Purpose-built installations will allow synthetic rubber to be produced on an industrial scale. Standard plant designs will make further expansion more practical."
 schwerepunkt_desc:0 "The main effort must be directed against a chosen point in the enemy line. Concentrating strength there offers a better chance of breaking through than attacking everywhere at once."
 schwerepunkt2_desc:0 "$schwerpunk_desc$"
 seperate_armed_forces_desc:0 "Each arm of the service requires methods suited to its own weapons and duties. Specialized training will allow formations to make better use of their firepower."
 specialized_branch_tactical_desc:0 "Specialist training within each arm will refine the methods used to hold ground. Units must understand the strengths of their own weapons and organization."
 static_defense_desc:0 "Prepared positions allow infantry to make fuller use of their weapons and cover. Troops must know how to hold their ground under a sustained assault."
 str_concept_desc:0 "Factories and railways sustain the enemy army. Bombing these targets allows us to carry the war beyond the battlefield."
 strong_point_desc:0 "Defenses should be organized around positions that can support one another. Careful planning will give the troops a clear structure to hold under attack."
 super_heavy_tank_art_a:0 "Super-Heavy Self-Propelled Artillery II"
 super_heavy_tank_art_a_desc:0 "$super_heavy_tank_artillery_equipment_desc$"
 super_heavy_tank_spaa_a:0 "Super-Heavy Self-Propelled Anti-Air II"
 super_heavy_tank_spaa_a_desc:0 "$super_heavy_tank_aa_equipment_desc$"
 super_heavy_tank_td_a:0 "Super-Heavy Tank Destroyer II"
 super_heavy_tank_td_a_desc:0 "$super_heavy_tank_destroyer_equipment_desc$"
 synth_rubber_experiments_desc:0 "Producing rubber from industrial feedstocks could reduce our dependence on natural supplies. Experimental plants will establish methods suited to larger-scale production."
 tank_armor_desc:0 "$eg_tank_armor_desc$"
 tank_engine_desc:0 "$eg_tank_engine_desc$"
 tank_gun_desc:0 "$eg_tank_gun_desc$"
 tas_concept_desc:0 "Attacks on troop concentrations and supply routes can disrupt the enemy before our soldiers advance. Bomber crews must learn to identify targets that matter to the ground battle."
 tech_engineers5_desc:0 "Engineer teams trained in field works will help divisions establish stronger positions. Practical methods for fighting in built-up areas will support operations in towns and cities."
 tech_engineers6_desc:0 "Improved equipment and construction drill will allow engineers to prepare more substantial positions and assist troops fighting in built-up areas."
 tech_engineers7_desc:0 "Engineers must be able to turn damaged buildings and broken ground into useful cover. Refined methods will help divisions hold and contest urban positions."
 tech_engineers8_desc:0 "Specialist training in field fortification and urban combat will make engineer support more effective throughout sustained operations."
 tech_maintenance_company5_desc:0 "Organized inspections and recovery teams will keep more equipment in service. Useful vehicles and weapons left by the enemy should also be collected for repair."
 tech_maintenance_company6_desc:0 "Improved workshop practice will reduce avoidable breakdowns. Recovery crews must be able to assess and salvage both our own equipment and captured material."
 tech_maintenance_company7_desc:0 "Specialist repair teams and better arrangements for spare parts will help divisions preserve their equipment and recover serviceable enemy materiel."
 tech_maintenance_company8_desc:0 "Coordinated maintenance and recovery work will keep equipment losses from mounting during sustained operations. Captured materiel must be inspected and returned to use wherever practical."
 tech_military_police_5_desc:0 "Military police trained in patrol and security duties will make garrisons more effective at maintaining control behind the front."
 tech_military_police_6_desc:0 "Closer coordination between patrols and local commands will help military police respond to disturbances before they spread."
 tech_military_police_7_desc:0 "Improved organization and training will allow military police to make better use of the forces assigned to security duties."
 tech_military_police_8_desc:0 "Established patrol routines and experienced security personnel will make military police more effective during prolonged occupation duties."
 tech_mortar_company1_desc:0 "A dedicated mortar company will provide infantry with high-angle fire against targets hidden by cover. Its weapons can be brought into action close to the troops they support."
 tech_mortar_company2_desc:0 "Practiced deployment and ammunition handling will help mortar crews support infantry assaults more effectively."
 tech_mortar_company3_desc:0 "Closer cooperation with forward observers will allow mortar fire to be directed against positions that obstruct an advance."
 tech_mortar_company4_desc:0 "Mortar companies must be able to shift their fire as the infantry moves forward. Common procedures will help them maintain support during an attack."
 tech_mortar_company5_desc:0 "Improved mortar drill and fire planning will give infantry more responsive support against defended positions."
 tech_mortar_company6_desc:0 "Reliable communication with the attacking troops will help mortar companies bring fire onto new targets without unnecessary delay."
 tech_mortar_company7_desc:0 "Refined methods of observation and fire adjustment will make mortar support more useful during a developing assault."
 tech_mortar_company8_desc:0 "Experienced mortar crews can shift their fire quickly between targets. Their training must keep pace with the demands of mobile infantry operations."
 tech_mortar_company_a_desc:0 "Common fire plans and improved crew coordination will help mortar companies sustain support as the infantry advances."
 tech_mortar_company_b_desc:0 "Further refinements to observation and fire control will allow mortar companies to respond more effectively to resistance encountered during an assault."
 tech_mortar_company_c_desc:0 "A mortar company must keep pace with the formations it supports. Efficient deployment and rapid fire adjustment will keep its weapons useful throughout the attack."
 tech_recon5_desc:0 "Reconnaissance formations need trained observers and clear reporting procedures. Reliable information will help commanders understand the ground and the enemy ahead."
 tech_recon6_desc:0 "Improved patrol methods will allow reconnaissance units to gather more useful information without becoming drawn into unnecessary fighting."
 tech_recon7_desc:0 "Combining reports from separate patrols will give commanders a clearer picture of enemy movements and positions."
 tech_recon8_desc:0 "Experienced reconnaissance teams and refined reporting methods will help divisions maintain an accurate picture of a changing battlefield."
 teleprinter_desc:0 "A teleprinter can transmit written messages directly between stations. This offers a practical means of carrying precise information over long distances."
 torpedo_bomb_desc:0 "An aircraft carrying a torpedo could strike ships beyond the reach of coastal batteries. Release gear and attack procedures must be developed together."
 total_war1_desc:0 "Sustained war demands more than the output of existing factories. Expanding industrial capacity and reorganizing production will place more of the economy at the service of the armed forces."
 total_war2_desc:0 "A deeper mobilization of industry will bring additional workshops and shipyards into the war effort. Common production methods will help them maintain their output."
 total_war3_desc:0 "The demands of prolonged war require the fullest use of available industrial capacity. Production must be coordinated across factories and shipyards to sustain the fighting."
 trade_interdiction2_desc:0 "$trade_interdiction_desc$"
 trench_warfare2_desc:0 "$trench_warfare_desc$"
 twenty_cent_warfare_desc:0 "Modern armies require reliable reinforcement, careful planning and formations able to operate under sustained fire. Training and command must adapt to these demands."
 wood_flooring_desc:0 "Duckboards will provide firmer footing in wet trenches. Keeping soldiers clear of standing water will improve the conditions in which they recover between attacks."
 ww1_advanced_cruiser_armor_scheme_desc:0 "Careful integration of belt, deck, and internal protection makes the cruiser's vital spaces harder to penetrate."
 ww1_advanced_depth_charges_desc:0 "Refinements to depth-charge equipment allow escorts to place their charges more consistently around a submerged target."
 ww1_advanced_heavy_battery_desc:0 "Refined gun mountings and recoil mechanisms provide a steadier platform for the heaviest naval artillery."
 ww1_advanced_light_battery_desc:0 "A more efficient light-gun installation combines improved ammunition handling with a stable mount for sustained fire against enemy screening vessels."
 ww1_advanced_medium_battery_desc:0 "Refined loading, training, and elevation mechanisms allow a cruiser's main battery to keep its guns on target throughout an engagement."
 ww1_advanced_naval_mines_desc:0 "Refinements to mine design improve the reliability and destructive effect of weapons laid along an enemy's sea routes."
 ww1_advanced_ship_torpedo_launcher_desc:0 "Stronger launching equipment and refined mount arrangements allow a ship to bring a more effective torpedo salvo to bear."
 ww1_airdrop_mines_desc:0 "$airdrop_mines_desc$"
 ww1_airsweep_mines_desc:0 "$airsweep_mines_desc$"
 ww1_basic_battery_desc:0 "$basic_battery_desc$"
 ww1_basic_cruiser_armor_scheme_desc:0 "A stronger arrangement of belt and deck armor protects a cruiser's machinery and magazines from shellfire."
 ww1_basic_depth_charges_desc:0 "Explosive charges set to detonate beneath the surface allow escort vessels to attack submerged submarines."
 ww1_basic_heavy_armor_scheme_desc:0 "Heavy belt and deck armor shield a capital ship's machinery and magazines from the powerful guns of an enemy battle line."
 ww1_basic_heavy_battery_desc:0 "Heavy naval guns housed in protected turrets give capital ships the means to engage an enemy battle line at long range."
 ww1_basic_heavy_shell_desc:0 "Carefully shaped armor-piercing shells carry the force of a capital ship's main battery through the heavy protection of an enemy vessel."
 ww1_basic_light_battery_desc:0 "Improved mounts give light naval guns a steadier platform for engaging torpedo boats, destroyers, and other small vessels."
 ww1_basic_light_shell_desc:0 "Improved small-caliber projectiles balance armor penetration with an explosive charge capable of damaging the lightly protected spaces of an enemy ship."
 ww1_basic_medium_battery_desc:0 "Improved medium-caliber gun installations provide cruisers with an effective main armament for fighting enemy surface vessels."
 ww1_basic_medium_shell_desc:0 "Improved medium-caliber shells combine a durable body with a more efficient shape, helping cruiser guns defeat an enemy vessel's armor."
 ww1_basic_naval_mines_desc:0 "An explosive charge laid beneath the surface detonates when struck by a vessel. Equipment for laying and sweeping these mines allows a navy to obstruct enemy passages and keep its own routes open."
 ww1_basic_secondary_battery_desc:0 "Smaller guns supplement a ship's main armament, defending it against destroyers and other vessels that approach too closely."
 ww1_basic_submarine_snorkel_desc:0 "An air intake extended above the surface allows a submarine to run its engines while keeping most of the hull submerged."
 ww1_basic_torpedo_desc:0 "A self-propelled underwater weapon carries an explosive warhead toward a vessel's vulnerable hull below the waterline."
 ww1_damage_control_1_desc:0 "Every sailor must know how to fight a fire, isolate a damaged compartment, and assist in keeping the ship afloat after a hit."
 ww1_damage_control_2_desc:0 "Clear damage-control procedures and better distribution of firefighting equipment help crews contain fires and flooding before they spread through the ship."
 ww1_damage_control_3_desc:0 "Coordinated repair parties and improved emergency equipment allow a crew to restore essential services and contain severe damage while the ship remains under fire."
 ww1_degaussing_desc:0 "$degaussing_desc$"
 ww1_dp_secondary_battery_desc:0 "Guns with suitable elevation and handling arrangements can engage both surface vessels and aircraft, allowing one battery to serve both purposes."
 ww1_early_bomber:0 "Early Bomber"
 ww1_early_bomber_desc:0 "An aircraft designed to carry bombs can strike targets beyond the front line. Payload and range must be balanced against the limits of early engines."
 ww1_early_scout_plane_desc:0 "A light reconnaissance aircraft can observe enemy movements beyond our lines. Good visibility and predictable handling will assist the observer in this work."
 ww1_electric_torpedo_desc:0 "$electric_torpedo_desc$"
 ww1_fire_control_methods_1_desc:0 "Observing the fall of shot and correcting the range allows a ship's gunners to bring successive salvos onto a moving target."
 ww1_fire_control_methods_2_desc:0 "Standardized ranging procedures and closer communication between observers and gun crews make it easier to correct salvos during an engagement."
 ww1_fire_control_methods_3_desc:0 "Coordinating observation, range estimates, and the firing of each battery helps a ship maintain accurate fire amid the confusion of a fleet action."
 ww1_homing_torpedo_desc:0 "$homing_torpedo_desc$"
 ww1_improved_cruiser_armor_scheme_desc:0 "Refining the distribution of a cruiser's armor provides more effective protection for its vital spaces without burdening every part of the hull equally."
 ww1_improved_depth_charges_desc:0 "More dependable fuzes and improved handling make depth charges a more effective weapon against submarines beneath the ship."
 ww1_improved_heavy_armor_scheme_desc:0 "An improved armor scheme concentrates protection around a capital ship's most vulnerable spaces, reducing the danger of a penetrating hit reaching its machinery or magazines."
 ww1_improved_heavy_battery_desc:0 "Improved loading arrangements and turret machinery help heavy guns sustain their fire while their crews remain protected from enemy shells."
 ww1_improved_heavy_shell_desc:0 "Stronger shell bodies and improved explosive arrangements make heavy projectiles more effective after penetrating an enemy ship's armor."
 ww1_improved_light_battery_desc:0 "Refinements to the handling and protection of light guns help their crews maintain fire against fast-moving surface targets."
 ww1_improved_light_shell_desc:0 "Refined shell construction allows light naval guns to penetrate tougher protection while retaining the ability to cause damage beyond the point of impact."
 ww1_improved_medium_battery_desc:0 "Better turret arrangements and ammunition handling help cruiser guns deliver sustained fire while protecting their crews and equipment."
 ww1_improved_medium_shell_desc:0 "Further refinements to medium-caliber projectiles improve their penetration and the damage they cause after striking a ship."
 ww1_improved_naval_mines_desc:0 "More dependable firing mechanisms and improved charges make a naval minefield a more dangerous obstacle to passing ships."
 ww1_improved_secondary_battery_desc:0 "Improved mountings give secondary guns a wider field of fire and help their crews respond to threats around the ship."
 ww1_improved_ship_torpedo_launcher_desc:0 "Improved torpedo mounts simplify the handling and aiming of their tubes, helping crews prepare a coordinated salvo."
 ww1_improved_sonar_desc:0 "Refined underwater detection equipment provides a clearer indication of a submarine's position, helping escorts maintain contact during a hunt."
 ww1_improved_submarine_mine_laying_desc:0 "Improved mine stowage and release procedures allow submarines to lay their fields more efficiently while remaining concealed."
 ww1_improved_submarine_snorkel_desc:0 "A refined air intake and improved protection against seawater make it easier for a submarine to operate its engines close beneath the surface."
 ww1_landing_craft_desc:0 "Dedicated landing craft and arrangements for unloading supplies help troops establish a foothold on a hostile coast before a proper port can be secured."
 ww1_magnetic_detonator_desc:0 "A magnetic firing mechanism allows a torpedo to detonate beneath a passing ship, directing the force of the explosion against its underwater structure."
 ww1_modern_depth_charges_desc:0 "Improved charges and delivery equipment produce a more effective underwater attack pattern against an evasive submarine."
 ww1_modern_naval_mines_desc:0 "Further improvements to the charge and firing mechanism make a mine more effective against ships passing through the field."
 ww1_modern_ship_torpedo_launcher_desc:0 "Further improvements to torpedo tubes and their launching mechanisms make a ship's torpedo armament more dependable in battle."
 ww1_scout_plane:0 "Scout Aircraft"
 ww1_scout_plane_desc:0 "A light aircraft can observe the ground far beyond our own lines. Clear visibility and dependable handling are more valuable for this task than a heavy payload."
 ww1_smoke_generator_desc:0 "$smoke_generator_desc$"
 ww1_sonar_desc:0 "Underwater listening equipment helps a ship's crew distinguish the sounds of a submerged vessel from the surrounding sea."
 ww1_submarine_mine_laying_desc:0 "$submarine_mine_laying_desc$"
 ww1_tank_landing_craft_desc:0 "Improved landing craft and unloading arrangements allow troops and heavier equipment to reach the beach more effectively during an opposed landing."
 ww1_transport_desc:0 "Ships fitted to carry soldiers and their equipment provide the means to move troops across the sea and put a landing force ashore."
