 ww1_small_plane_cas_airframe_2_desc:0 "A more practical ground attack airframe will provide space for weapons while retaining the handling needed for operations near the battlefield."
 ww1_small_plane_cas_airframe_3:0 "Improved Ground Attack Airframe"
 ww1_small_plane_cas_airframe_3_desc:0 "Refined construction will allow a small ground attack aircraft to carry its weapons more effectively during repeated operations over the front."
