 ww1_small_plane_cas_airframe_1:0 "Prototype Ground Attack Airframe"
 ww1_small_plane_cas_airframe_1_desc:0 "A small airframe adapted for ground attack can carry weapons against troops and field positions. It must remain controllable during low-altitude operations."
