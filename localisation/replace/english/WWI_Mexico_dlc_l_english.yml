l_english:
 MEX_WW1_eulalio_gutierrez:0 "Eulalio Gutiérrez"
 MEX_WW1_francisco_leon_de_la_barra:0 "Francisco León de la Barra"
 MEX_WW1_spirit_foreign_reconstruction:0 "Reconstruction Concessions"
 MEX_WW1_spirit_foreign_reconstruction_desc:0 "Defined foreign contracts have accelerated the rebuilding programme, while their terms remain a source of dispute."
 MEX_WW1_spirit_national_contracts:0 "National Purchasing Contracts"
 MEX_WW1_spirit_national_contracts_desc:0 "Regular orders support Mexican workshops and reduce their dependence on improvised military purchases."
 MEX_WW1_DLC_revolutionary_currency:0 "The Revolutionary Currencies"
 MEX_WW1_DLC_revolutionary_currency_desc:0 "Competing military notes and emergency issues have undermined the accounts of the treasury and the wages of the workers."
 MEX_WW1_DLC_workers_under_arms:0 "The Red Battalions"
 MEX_WW1_DLC_workers_under_arms_desc:0 "Organized workers serve the constitutionalist cause under an agreement whose social promises have yet to be fulfilled."
 MEX_WW1_spirit_veterans_settlement:0 "The Veterans’ Settlement"
 MEX_WW1_spirit_veterans_settlement_desc:0 "A regular programme of pensions, employment and verified claims has reduced the dependence of former soldiers on their commanders."
 MEX_WW1_spirit_electrification:0 "A Regular Power Supply"
 MEX_WW1_spirit_electrification_desc:0 "Coordinated generation and transmission contracts provide the industrial districts with a more dependable supply of power."
 MEX_WW1_spirit_workers_housing:0 "Municipal Housing Grants"
 MEX_WW1_spirit_workers_housing_desc:0 "Water, sanitation and housing grants have given the workshop towns a firmer foundation for recovery."
 MEX_WW1_DLC_oil_tax_receipts:0 "The Oil Tax Receipts"
 MEX_WW1_DLC_oil_tax_receipts_desc:0 "The new registration requirements have made a larger share of the oil revenues available to the national treasury."
 MEX_WW1_DLC_civil_succession:0 "The Civilian Succession"
 MEX_WW1_DLC_civil_succession_desc:0 "The presidency has passed between civilian governments without the intervention of another military chief. The constitutional settlement has survived its first great test."
 mex_ww1_dlc.1.t:0 "The Provisional President"
 mex_ww1_dlc.1.d:0 "The delegates have chosen Eulalio Gutiérrez to head the provisional government. His authority rests on a Convention whose armies have not surrendered their own ambitions.\n\nCarranza rejects the settlement. The new president must hold the capital, reconcile his supporters and demonstrate that the Convention can govern as well as appoint a government."
 mex_ww1_dlc.1.a:0 "Recognise the Convention’s president."
 mex_ww1_dlc.2.t:0 "The Retirement of Díaz"
 mex_ww1_dlc.2.d:0 "Representatives of the presidency and the opposition have agreed on a transfer of power. Díaz will leave office, and the authorities will recognize Madero’s mandate rather than prolong the fighting.\n\nThe federal army remains intact. The villages that took up arms will judge the new government by its answer to their claims, and not by the departure of the old president alone."
 mex_ww1_dlc.2.a:0 "The presidency must pass to civil government."
 mex_ww1_dlc.3.t:0 "A Peaceful Succession"
 mex_ww1_dlc.3.d:0 "Madero has agreed to leave the presidency rather than seek another term. A civilian coalition has invited Francisco León de la Barra to return from diplomatic service and accept office under the constitutional guarantees defended by the outgoing government.\n\nHis supporters promise reconciliation with the provinces and continued legal restitution. The settlement will survive only if those promises restrain the old interests as firmly as they restrain the armies."
 mex_ww1_dlc.3.a:0 "Let the constitution govern the succession."
 mex_ww1_dlc.4.t:0 "An Extraordinary Mandate"
 mex_ww1_dlc.4.d:0 "The president has refused to entrust the succession to the Sonoran movement. Supporters in the administration have endorsed an extraordinary mandate in the name of protecting the revolution.\n\nIt has preserved the government in the capital, but its authority now rests more heavily on officers who expect their loyalty to be rewarded. The promise of a regular civilian succession has been postponed."
 mex_ww1_dlc.4.a:0 "The First Chief will remain at his post."
 mex_ww1_dlc.5.t:0 "The Rights Beneath the Oilfields"
 mex_ww1_dlc.5.d:0 "New registration and taxation requirements have brought the oil companies into open dispute with the government. Their representatives argue that existing concessions must be protected; officials reply that the constitution recognizes the nation’s rights over the subsoil.\n\nThe foreign legations are following the dispute closely. The government must choose whether to enforce its terms at once or negotiate an arrangement that preserves revenue while the legal questions are settled."
 mex_ww1_dlc.5.a:0 "Enforce the registration and revenue requirements."
 mex_ww1_dlc.5.b:0 "Negotiate an interim arrangement with the companies."
 mex_ww1_dlc.6.t:0 "The Accounts of Veracruz"
 mex_ww1_dlc.6.d:0 "The occupation has left disputed customs receipts and unsettled claims. Mexican officials propose a joint accounting followed by the restoration of normal administration at the port.\n\nA settlement can close this particular dispute, but it will not erase the resentment created by foreign troops on Mexican soil."
 mex_ww1_dlc.6.a:0 "Offer a commission to settle the accounts."
 mex_ww1_dlc.7.t:0 "Instructions for the Border Commission"
 mex_ww1_dlc.7.d:0 "The foreign secretariat has proposed limits on the pursuit of armed raiders. American troops would operate only under agreed conditions, with reports supplied to the Mexican authorities and a clear obligation to withdraw.\n\nThe proposal offers a means of avoiding another clash. It will also be denounced by those who believe that any agreement rewards an invasion of the country."
 mex_ww1_dlc.7.a:0 "Submit the protocol to Washington."
 mex_ww1_dlc.8.t:0 "The Bucareli Agreements"
 mex_ww1_dlc.8.d:0 "The negotiators have reached a settlement on the claims that have obstructed recognition. The government will provide a procedure for compensation and address the application of the constitution to existing property rights.\n\nThe agreement has opened the way to recognition, but its opponents argue that the revolution is being made to pay for the obligations of its enemies. The president must decide whether the gains justify the concessions."
 mex_ww1_dlc.8.a:0 "Accept the claims procedure and seek recognition."
 mex_ww1_dlc.8.b:0 "Withhold ratification until the terms are revised."
 mex_ww1_dlc.9.t:0 "The Sonoran Provisional Government"
 mex_ww1_dlc.9.d:0 "The movement of Agua Prieta has broken the authority of the First Chief. Adolfo de la Huerta will lead a provisional administration while the government prepares elections and seeks terms with the remaining revolutionary commands.\n\nObregón’s supporters expect him to win the presidency. Until the election is settled, the provisional government must keep the army supplied and prevent victory from becoming another round of reprisals."
 mex_ww1_dlc.9.a:0 "Prepare the return to regular government."
 mex_ww1_dlc.16.t:0 "The Veracruz Accounts"
 mex_ww1_dlc.16.d:0 "The Mexican government has offered to settle the disputed accounts at Veracruz through a commission. It asks that occupation give way to normal Mexican administration once the customs records have been examined."
 mex_ww1_dlc.16.a:0 "Settle the accounts and withdraw."
 mex_ww1_dlc.16.b:0 "The existing claims must be met first."
 mex_ww1_dlc.17.t:0 "A Protocol for the Mexican Border"
 mex_ww1_dlc.17.d:0 "Mexico proposes a limited agreement governing the pursuit of armed raiders. Its officials insist on a defined area of operations, regular reports and the recognition of Mexican authority once the expedition withdraws."
 mex_ww1_dlc.17.a:0 "Accept the limits and avoid another clash."
 mex_ww1_dlc.17.b:0 "We cannot accept these restrictions."
 mex_ww1_dlc.21.t:0 "The Authority of the Convention"
 mex_ww1_dlc.21.d:0 "The national government asks our command to recognize the Convention and accept a common political settlement. It promises that the agrarian programme will be represented in the presidency rather than entrusted to another distant ministry.\n\nRecognition would open the way to the integration of our forces into a single Mexican government. Refusal would preserve our separate command, but leave the Convention without a common authority."
 mex_ww1_dlc.21.a:0 "We will accept a common government."
 mex_ww1_dlc.21.b:0 "Our command will remain independent."
 mex_ww1_dlc.22.t:0 "The Authority of the Convention"
 mex_ww1_dlc.22.d:0 "The national government asks our command to recognize the Convention and accept a common political settlement. It promises that the agrarian programme will be represented in the presidency rather than entrusted to another distant ministry.\n\nRecognition would open the way to the integration of our forces into a single Mexican government. Refusal would preserve our separate command, but leave the Convention without a common authority."
 mex_ww1_dlc.22.a:0 "We will accept a common government."
 mex_ww1_dlc.22.b:0 "Our command will remain independent."
