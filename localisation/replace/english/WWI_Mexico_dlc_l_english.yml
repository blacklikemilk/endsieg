l_english:
 MEX_WW1_eulalio_gutierrez:0 "Eulalio Gutiérrez"
 MEX_WW1_francisco_leon_de_la_barra:0 "Francisco León de la Barra"
 MEX_WW1_spirit_foreign_reconstruction:0 "Reconstruction Concessions"
 MEX_WW1_spirit_foreign_reconstruction_desc:0 "Defined foreign contracts have accelerated the rebuilding programme, while their terms remain a source of dispute."
 MEX_WW1_spirit_national_contracts:0 "National Purchasing Contracts"
 MEX_WW1_spirit_national_contracts_desc:0 "Regular orders support Mexican workshops and reduce their dependence on improvised military purchases."
 MEX_WW1_DLC_revolutionary_currency:0 "The Revolutionary Currencies"
 MEX_WW1_DLC_revolutionary_currency_desc:0 "Competing military notes and emergency issues have undermined the accounts of the treasury and the wages of the workers."
 MEX_WW1_DLC_workers_under_arms:0 "The Red Battalions"
 MEX_WW1_DLC_workers_under_arms_desc:0 "Organized workers serve the constitutionalist cause under an agreement whose social promises have yet to be fulfilled."
 MEX_WW1_spirit_veterans_settlement:0 "The Veterans’ Settlement"
 MEX_WW1_spirit_veterans_settlement_desc:0 "A regular programme of pensions, employment and verified claims has reduced the dependence of former soldiers on their commanders."
 MEX_WW1_spirit_electrification:0 "A Regular Power Supply"
 MEX_WW1_spirit_electrification_desc:0 "Coordinated generation and transmission contracts provide the industrial districts with a more dependable supply of power."
 MEX_WW1_spirit_workers_housing:0 "Municipal Housing Grants"
 MEX_WW1_spirit_workers_housing_desc:0 "Water, sanitation and housing grants have given the workshop towns a firmer foundation for recovery."
 MEX_WW1_DLC_oil_tax_receipts:0 "The Oil Tax Receipts"
 MEX_WW1_DLC_oil_tax_receipts_desc:0 "The new registration requirements have made a larger share of the oil revenues available to the national treasury."
 MEX_WW1_DLC_civil_succession:0 "The Civilian Succession"
 MEX_WW1_DLC_civil_succession_desc:0 "The presidency has passed between civilian governments without the intervention of another military chief. The constitutional settlement has survived its first great test."
 mex_ww1_dlc.1.t:0 "A President for the Convention"
 mex_ww1_dlc.1.d:0 "The convention has chosen Eulalio Gutiérrez to head a provisional government. The delegates hope his appointment will give the revolutionary movement an authority that its rival commanders can recognise.\n\nTheir consent in the hall is only the beginning. The new government must turn the promises of the convention into a settlement that can be enforced in the provinces."
 mex_ww1_dlc.1.a:0 "Recognise the provisional president."
 mex_ww1_dlc.2.t:0 "The Presidency Passes to Madero"
 mex_ww1_dlc.2.d:0 "An agreement between the government and the opposition has opened the way for Francisco Madero to assume the presidency. His supporters hope the transfer of power will spare Mexico further fighting and establish the principle for which they took up arms.\n\nThe question of land, and the place of the federal army in the new republic, will remain long after the ceremony is over."
 mex_ww1_dlc.2.a:0 "Madero shall take office."
 mex_ww1_dlc.3.t:0 "A Civilian Succession"
 mex_ww1_dlc.3.d:0 "The government has chosen a civilian succession and invited Francisco León de la Barra to assume the presidency. His supporters present the appointment as a means of keeping the transfer of power within the law.\n\nThe new president will have to hold together a coalition whose agreement on the succession does not extend to every question before the republic."
 mex_ww1_dlc.3.a:0 "The succession shall proceed."
 mex_ww1_dlc.4.t:0 "An Extended Mandate"
 mex_ww1_dlc.4.d:0 "The government has set aside a regular succession in favour of an extraordinary mandate. Its supporters argue that the revolution cannot yet be entrusted to an uncertain election.\n\nThe president will remain dependent on the officers whose support makes the decision possible."
 mex_ww1_dlc.4.a:0 "The government will remain in office."
 mex_ww1_dlc.5.t:0 "The Oil Concessions"
 mex_ww1_dlc.5.d:0 "The government’s plans for registration and taxation have met resistance from the oil companies. Their representatives point to existing concessions; officials insist that Mexico has a right to regulate the resources beneath its soil.\n\nWe can press the new requirements or seek an interim understanding with the firms."
 mex_ww1_dlc.5.a:0 "Enforce the new requirements."
 mex_ww1_dlc.5.b:0 "Negotiate an interim agreement."
 mex_ww1_dlc.6.t:0 "The Veracruz Accounts"
 mex_ww1_dlc.6.d:0 "The occupation of Veracruz has left customs receipts and other claims in dispute. Officials propose an accounting with the United States and the restoration of Mexican administration at the port.\n\nThe arrangement offers a way to close one dispute, although it will not erase the resentment caused by foreign troops on Mexican soil."
 mex_ww1_dlc.6.a:0 "Refer the matter to the commission."
 mex_ww1_dlc.7.t:0 "A Border Protocol"
 mex_ww1_dlc.7.d:0 "The Foreign Secretariat has prepared a proposal to regulate the pursuit of armed bands near the northern frontier. It calls for agreed limits and a recognition of Mexican authority.\n\nThe protocol may prevent another clash with the United States, but critics will ask why foreign forces should receive any permission to operate on our soil."
 mex_ww1_dlc.7.a:0 "Proceed with the commission’s work."
 mex_ww1_dlc.8.t:0 "The Question of Foreign Claims"
 mex_ww1_dlc.8.d:0 "The government must decide how to address the property claims that stand in the way of recognition by the United States. Negotiators propose a procedure for compensation and a settlement over the application of Mexican law to existing holdings.\n\nSupporters see a way to restore relations; opponents fear that the concessions will undermine the revolution."
 mex_ww1_dlc.8.a:0 "Accept a procedure for the claims."
 mex_ww1_dlc.8.b:0 "Withhold approval for now."
 mex_ww1_dlc.9.t:0 "A Provisional Presidency"
 mex_ww1_dlc.9.d:0 "The Sonoran movement has secured the formation of a provisional government under Adolfo de la Huerta. Its immediate task is to prepare the return to regular government and keep the revolutionary commands from settling their disputes by force.\n\nThe coalition that brought it to office will expect a voice in the elections to come."
 mex_ww1_dlc.9.a:0 "The provisional government must prepare elections."
 mex_ww1_dlc.16.t:0 "Mexico’s Veracruz Proposal"
 mex_ww1_dlc.16.d:0 "The Mexican government has proposed a commission to settle disputed customs accounts at Veracruz. Its representatives ask that the port return to Mexican administration as part of the settlement."
 mex_ww1_dlc.16.a:0 "Settle the accounts."
 mex_ww1_dlc.16.b:0 "Our claims must be met first."
 mex_ww1_dlc.17.t:0 "A Proposal for the Border"
 mex_ww1_dlc.17.d:0 "Mexico has submitted a proposal concerning operations against armed bands on the frontier. Its representatives seek clear limits, regular reports and respect for Mexican authority.\n\nAn agreement might prevent further incidents, though some officials doubt the wisdom of accepting restrictions."
 mex_ww1_dlc.17.a:0 "Accept the proposed limits."
 mex_ww1_dlc.17.b:0 "We cannot accept these terms."
 mex_ww1_dlc.21.t:0 "The Convention’s Request"
 mex_ww1_dlc.21.d:0 "The government asks our command to recognise the convention and join a common political settlement. Its delegates promise that the interests of the villages will have a place in the new government.\n\nAcceptance would open the way to a united administration. Refusal would preserve our independence, but leave the revolution divided."
 mex_ww1_dlc.21.a:0 "Recognise the convention."
 mex_ww1_dlc.21.b:0 "Our command will remain independent."
 mex_ww1_dlc.22.t:0 "An Appeal to the Northern Command"
 mex_ww1_dlc.22.d:0 "The government has asked the northern command to recognise the convention and accept a common settlement. Its representatives argue that the revolution needs a single authority if it is to govern the country.\n\nOur officers must decide whether to place their forces under that authority or retain an independent command."
 mex_ww1_dlc.22.a:0 "We will recognise the convention."
 mex_ww1_dlc.22.b:0 "The northern command must remain independent."
 mex_ww1_dlc.1.unavailable.d:0 "The convention must appoint a provisional government, but Eulalio Gutiérrez is no longer available to take office. The delegates will have to continue their deliberations without him."
 mex_ww1_dlc.1.unavailable.a:0 "The delegates must find another way."
 mex_ww1_dlc.3.unavailable.d:0 "The supporters of a civilian succession have reached an agreement in principle, but Francisco León de la Barra is no longer available to assume the presidency. They must look elsewhere for a candidate."
 mex_ww1_dlc.3.unavailable.a:0 "The government must continue its search."
 mex_ww1_dlc.9.unavailable.d:0 "The Sonoran movement seeks a provisional administration, but Adolfo de la Huerta is no longer available to lead it. The government must keep order while its supporters consider another candidate."
 mex_ww1_dlc.9.unavailable.a:0 "The coalition must choose another course."
 mex_ww1_dlc.6.alternative.d:0 "Officials are examining the outstanding customs accounts and claims associated with Veracruz. The conditions for a direct settlement over the port are not presently in place, but a clear account of the dispute would still serve the government."
 mex_ww1_dlc.7.alternative.d:0 "The Foreign Secretariat is considering how best to manage the northern frontier. The conditions for an immediate agreement with the United States are absent, but ministers can still prepare instructions for the commission."
 mex_ww1_dlc.8.alternative.d:0 "Ministers are considering a procedure for outstanding foreign property claims. Its supporters argue that a settlement would reassure investors and restore credit; its opponents fear concessions that may weaken the government’s authority over Mexican resources."
 mex_ww1_dlc.16.alternative.d:0 "Mexico has proposed a commission to settle the disputed Veracruz accounts. Control of the port has changed since the proposal was sent, but the financial claims remain before our officials."
