l_english:
 ww1_anglo_american_war.1.t: "A British Proposal"
 ww1_anglo_american_war.1.d: "The British minister has proposed that Mexico join the war against the United States. London is prepared to support our claims to territories held by Washington along the northern frontier. The offer raises the prospect of recovering lost land, but also of committing our army to a dangerous war."
 ww1_anglo_american_war.1.a: "We will take the field against the United States."
 ww1_anglo_american_war.1.b: "This is not Mexico’s war."
 ww1_anglo_american_war.2.t: "Mexico Replies"
 ww1_anglo_american_war.2.accepted: "Mexico has entered the war against the United States. American commanders must now consider their southern frontier as well as the forces confronting them elsewhere."
 ww1_anglo_american_war.2.refused: "The Mexican government has declined our invitation to join the war against the United States. We cannot count on a Mexican front in our plans."
 ww1_anglo_american_war.2.a: "Inform the War Office."
 ww1_anglo_american_war.2.b: "We must proceed without them."
 ww1_anglo_american_war.2.failed: "Mexico agreed to our proposal, but its entry into the war could not be completed. The War Office must plan without assuming that a southern front has been opened."
 ww1_anglo_american_war.2.c: "The circumstances have changed."
