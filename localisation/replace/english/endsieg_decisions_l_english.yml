l_english:

    ### WW1 ###

    SO2_invade_azerbaijan: "Invade Azerbaijan"
    SO2_invade_azerbaijan_desc: "Azerbaijan should remain with the rest of the Motherland like in the past."
    SO2_invade_armenia: "Invade Armenia"
    SO2_invade_armenia_desc: "Armenia should remain with the rest of the Motherland like in the past."
    SO2_invade_georgia: "Invade Georgia"
    SO2_invade_georgia_desc: "Georgia should remain with the rest of the Motherland like in the past."
    SO2_invade_baku: "Invade Baku"
    SO2_invade_baku_desc: "Baku should remain with the rest of the Motherland like in the past."
    SO2_invade_belarus: "Invade Belarus"
    SO2_invade_belarus_desc: ""
    SO2_invade_estonia: "Invade Estonia"
    SO2_invade_estonia_desc: ""
    SO2_invade_latvia: "Invade Latvia"
    SO2_invade_latvia_desc: ""
    SO2_invade_lithuania: "Invade Lithuania"
    SO2_invade_lithuania_desc: ""
    soviet_reconquer_category: "Reconquer the Motherland"
    soviet_reconquer_category_desc: "The collapse of German authority in the east opens the former imperial borderlands to the Red Army. The new republics are arming to resist us."
    invade_belarus: "Advance into Belarus"
    invade_belarus_desc: "German troops are withdrawing from Belarus. We can move west before another government consolidates control of the former imperial provinces."
    invade_ukraine: "Advance into Ukraine"
    invade_ukraine_desc: "The German withdrawal has left Ukraine contested. The Red Army can support the local soviets and challenge the Ukrainian government."
    invade_estonia: "Advance into Estonia"
    invade_estonia_desc: "Estonia has declared independence. Our western offensive can carry the Red Army toward Tallinn, though the Estonians are preparing to defend their republic."
    invade_latvia: "Advance into Latvia"
    invade_latvia_desc: "As the German army leaves Latvia, our forces can cross the frontier and seek to establish Soviet authority in Riga."
    invade_lithuania: "Advance into Lithuania"
    invade_lithuania_desc: "The Lithuanian republic is consolidating its independence. Our army can enter the borderlands and contest its hold on the former imperial territory."
    invade_poland: "Advance toward Poland"
    invade_poland_desc: "The frontier between Poland and Soviet Russia is unsettled. An advance west risks a long war with a state determined to defend its independence."

    ##### Market Liberal #####
        market_liberal_on_the_rise: "Market Liberalism on the Rise"
        market_liberal_on_the_rise_desc: "Vocal political elements have begun to speak up in favor of market liberal values, finding support with an increasing number of the population. The nation's path to market liberalism lies open, merely awaiting the choice of peaceful or violent transition."
        prepare_for_market_liberal_civil_war: "Prepare for Civil War"
        prepare_for_market_liberal_civil_war_desc: "We have no time to wait for the slow changes in the minds of the people. For their own sake, we must force the matter swiftly, even if some may lose their lives in the process. Unlike a peaceful referendum, a civil war will cause tremendous devastation to our armed forces and the country's industry and infrastructure, but it is also quicker, and ensures we will be able to force our will through more forcefully afterwards."
        expand_civil_market_liberal_support: "Expand Civil Support"
        expand_civil_market_liberal_support_desc: "We must ensure the continuing spread of support for our cause among the people, and encourage them to publically challenge the authority of the present government. As the position of the government is increasingly undermined and civil unrest continues to mount, it will become easier for us to achieve our goals. This holds especially true if, unlike a legal change in government, these goals involves a more... sinister means of regime change."
        army_support_for_market_liberal_civil_war: "Expand Military Support"
        army_support_for_market_liberal_civil_war_desc: "Without ample support of the military, any hope of victory in an armed ideological struggle would be vain. We must ensure the loyalty of well-placed units of our military forces."
        ensure_general_loyalty_for_market_liberal_civil_war: "Ensure Lower Army Command Loyalty"
        ensure_general_loyalty_for_market_liberal_civil_war_desc: "It is possible certain generals harbor secret sentiments in favor of fascism. We must approach them and ensure their loyalty for when the fighting starts."
        ensure_marshal_loyalty_for_market_liberal_civil_war: "Ensure Upper Army Command Loyalty"
        ensure_marshal_loyalty_for_market_liberal_civil_war_desc: "It is possible certain field marshals harbor secret sentiments in favor of fascism. We must approach them and ensure their loyalty for when the fighting starts."
        siphon_equipment_stockpiles_for_market_liberal_civil_war: "Siphon Equipment"
        siphon_equipment_stockpiles_for_market_liberal_civil_war_desc: "By skimming the nation's equipment stores we can create a minor cache of weaponry to aid us in our future struggle."
        formulate_surprise_attack_plan_for_market_liberal_civil_war: "Formulate Surprise Attack Plan"
        formulate_surprise_attack_plan_for_market_liberal_civil_war_desc: "The enemy has no idea of the impending calamity. We must ensure this remains so, all the while directing our battle plans to make maximum use of the element of surprise."
        ignite_the_market_liberal_civil_war: "Ignite Civil War"
        ignite_the_market_liberal_civil_war_desc: "The time has come to take the plunge. All preparations we deemed necessary have been made. There is no turning back now."
        rebuild_the_nation_market_liberal: "Rebuild the Nation"
        rebuild_the_nation_market_liberal_desc: "After the civil war, the time has now come to rebuild our ruined nation."
        open_up_political_discourse_market_liberal: "Open Up Political Discourse"
        open_up_political_discourse_market_liberal_desc: "We must open up the acceptance of diverging viewpoints in the government. Perhaps this will eventually make it possible to affect a peaceful change in the politics of our nation."
        discredit_government_market_liberal: "Discredit Government"
        discredit_government_market_liberal_desc: "By pointing out our current government's many flaws we can make people think about the ideological causes of these failures."
        hold_the_market_liberal_national_referendum: "Hold National Referendum"
        hold_the_market_liberal_national_referendum_desc: "With sufficient support, we may now safely hold a referendum to affect a change of government, without bloodshed."
