        rebuild_the_nation_anarchist_desc: "After the civil war, the time has now come to rebuild our ruined nation."
        open_up_political_discourse_anarchist: "Open Up Political Discourse"
        open_up_political_discourse_anarchist_desc: "We must open up the acceptance of diverging viewpoints in the government. Perhaps this will eventually make it possible to affect a peaceful change in the politics of our nation."
        discredit_government_anarchist: "Discredit Government"
        discredit_government_anarchist_desc: "By pointing out our current government's many flaws we can make people think about the ideological causes of these failures."
        hold_the_anarchist_national_referendum: "Hold National Referendum"
        hold_the_anarchist_national_referendum_desc: "With sufficient support, we may now safely hold a referendum to affect a change of government, without bloodshed."
