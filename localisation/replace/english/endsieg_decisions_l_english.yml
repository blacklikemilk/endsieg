    #WW1

    send_lenin_decision: "Send Lenin to Russia"
    send_lenin_decision_desc: "We could send Lenin over to Russia, but this could cause revolutions in Russia that may in turn backfire on us.\n\n§RSending Lenin via decision or focus is needed to fire Brest-Litovsk!§!"
    puppet_poland_decision: "Create the Regency Kingdom of Poland"
    puppet_poland_decision_desc: "We should consolidate our control over the Polish territories by creating a state."
    request_polish_divisions: "Request Polish Divisions"
    request_polish_divisions_desc: "We should ask for manpower from Poland, now that we have \"liberated\" the Poles."
    russian_army_reform: "Russian Army Reform 1/3"
    russian_army_reform_desc: "This decision, §B after one month of being fired §!, will halve the debuff from the national spirit \"Poor Military Leadership\" "
    russian_army_more_reform: "Russian Army Reform 2/3"
    russian_army_more_reform_desc: "This decision will §B halve the debuff yet again after one month! §!"
    russian_army_final_reform: "Russian Army Reform 3/3"
    russian_army_final_reform_desc: "§G This decision will remove the \"Poor Military Leadership\" debuff after a month! §!"
    german_warplan_selection_schlieffen: "The Schlieffen plan"
    german_warplan_selection_schlieffen_desc: "The Schlieffen plan was the German warplan to invade Belgium."
    german_warplan_selection_kronprinz: "The Kronprinz plan"
    german_warplan_selection_kronprinz_desc: "This alternate-history warplan invades §Rneither Belgium or Switzerland§, in favor of invading only France and Russia. \n\n§GThis should delay the UK's entry to the war, until they decide to via focus.§!"
    german_warplan_selection_rupprecht: "The Rupprecht plan"
    german_warplan_selection_rupprecht_desc: "This alternate-history plan invades Switzerland, and is only reccomended if you want a challenge as Germany, or if France has built extensive fortifications on the Belgian border."

    form_saudi_arabia_category: "Unite Saudi Arabia"
    form_saudi_arabia_category_desc: "The region of Saudi Arabia has long been home to our enemies. It is time we show them our force and take control of our rightful homeland."
    form_saudi_arabia: "Form Saudi Arabia"

    form_transcaucasia_category: "Form Transcaucasia"
    form_transcaucasia_category_desc: "For multiple ages, the people of the Caucasus have had to suffer under oppressing regime. It is time to finally unite the region under one banner, and remove outside influences."
    form_transcaucasia: "Form Transcaucasia"

    #GERMANY
    ger_forify_berlin: "Fortify Berlin"
    ger_forify_berlin_desc: "The Soviets are at the gates of the capital of our great reich. We must make them bleed before it. Building a series of trenches in Berlin will hopefully hold the savage soviets back!"

    ww1_home_front_category: "The Home Front"
    ww1_home_front_category_desc: "The endurance of the civilian population is as important to victory as the strength of the armies at the front."
    ww1_strengthen_civilian_confidence: "Strengthen Civilian Confidence"
    ww1_strengthen_civilian_confidence_desc: "Fund public relief and reassure the population that the government can endure the hardships of war."
    ww1_mobilize_national_spirit: "Mobilize National Spirit"
    ww1_mobilize_national_spirit_desc: "Organize rallies and patriotic appeals to sustain public support for the war effort."

    ww1_ger_domestic_category: "Imperial Home Front"
    ww1_ger_domestic_category_desc: "Balance parliamentary confidence, industrial output, and the demands of a total war."
    ww1_ger_war_bonds_drive: "Launch a War Bonds Drive"
    ww1_ger_war_bonds_drive_desc:0 "The treasury must find new means to sustain the war. A public loan campaign can draw on patriotic savings, but the promises made today will burden future budgets."
    ww1_ger_labour_compromise: "Negotiate with Labour"
    ww1_ger_labour_compromise_desc:0 "The trade unions can help keep essential production moving. Recognising them as negotiating partners will ease unrest, though employers and army purchasers must accept concessions."
    ww1_ger_industrial_mobilisation: "Mobilize the War Industry"
    ww1_ger_industrial_mobilisation_desc:0 "The demands of the front have outgrown ordinary procurement. Central direction can increase arms output, at the cost of civilian supply and industrial peace."
    ww1_ger_reduce_strikes: "Defuse the Strike Wave"
    ww1_ger_reduce_strikes_desc:0 "Production cannot recover while the dispute continues. Ministers should offer concessions that workers' representatives can defend before their members."

    ww1_ger_war_economy_category: "War Economy and Supply"
    ww1_ger_war_economy_category_desc:0 "Food, imported materials and skilled labour are all in short supply. The ministries must reconcile the needs of the front with those of the civilian economy."
    ww1_ger_raw_material_recovery: "Recover Strategic Materials"
    ww1_ger_raw_material_recovery_desc:0 "Imports can no longer be taken for granted. Coordinated purchasing and the recovery of usable materials will help factories maintain production."
    ww1_ger_ersatz_contracts: "Commission Ersatz Contracts"
    ww1_ger_ersatz_contracts_desc:0 "Domestic substitutes can replace some of the imports denied by the blockade. Firms should receive contracts to develop and produce them in useful quantities."
    ww1_ger_emergency_rationing: "Impose Emergency Rationing"
    ww1_ger_emergency_rationing_desc:0 "Food and fuel must be shared more strictly if supplies are to last. A national rationing system will conserve stocks, but further restrictions will be deeply unpopular."
    ww1_ger_blockade_relief: "Organize Blockade Relief"
    ww1_ger_blockade_relief_desc:0 "Neutral merchants and domestic substitutes still offer some relief from the blockade. The ministries must make better use of both before shortages become unmanageable."
    ww1_ger_ammunition_works: "Expand Ammunition Works"
    ww1_ger_ammunition_works_desc:0 "The guns consume shells faster than existing works can replace them. New machinery and expanded workshops will increase the supply of ammunition."

    ww1_ger_operations_category: "Operational Preparations"
    ww1_ger_operations_category_desc:0 "Another campaign requires more than fresh orders. The army and its partners must coordinate railway movements, reserves and the delivery of supplies."
    ww1_ger_rail_coordination: "Coordinate Military Railways"
    ww1_ger_rail_coordination_desc:0 "Military trains compete for crowded lines and overworked junctions. Coordinated timetables and improvements to the network will help reinforcements reach the front."
    ww1_ger_stormtroop_training: "Train Stormtroop Detachments"
    ww1_ger_stormtroop_training_desc:0 "Selected assault detachments will practise infiltration and the reduction of strongpoints. Their methods demand careful preparation and cannot replace the endurance of the whole army."
    ww1_ger_offensive_preparations: "Prepare an Offensive"
    ww1_ger_offensive_preparations_desc:0 "An offensive must have its ammunition, reserves and transport in place before the first attack. The staff should concentrate its work on a limited, carefully supplied operation."
    ww1_ger_submarine_diplomacy: "Settle the Submarine Question"
    ww1_ger_submarine_diplomacy_desc:0 "The naval command demands a decision on unrestricted submarine warfare. We must weigh its promise against the danger of bringing the United States into the war."
    ww1_ger_support_central_powers: "Support a Central Powers Front"
    ww1_ger_support_central_powers_desc:0 "Our partners need weapons to hold their fronts. A shipment from German stores can strengthen an allied army, though those rifles will then be unavailable to our own formations."

    ww1_mittelafrika_category: "Mittelafrika Administration"
    ww1_mittelafrika_category_desc:0 "Distant territories cannot be administered by decree alone. Local councils, public works and dependable officials will be needed to consolidate Mittelafrika."
    ww1_establish_mittelafrika: "Establish Mittelafrika"
    ww1_establish_mittelafrika_desc:0 "Our African possessions are administered through separate offices with competing priorities. Placing them under Wilhelm Solf will give the colonies a common government answerable to Berlin."
    ww1_establish_mittelafrika_effect_tt: "All German-owned African states, including Madagascar, become part of Mittelafrika, a German puppet led by Wilhelm Solf. Germany relinquishes its claims to those states."
    ww1_expand_mittelafrika_constabulary: "Expand the Colonial Constabulary"
    ww1_expand_mittelafrika_constabulary_desc:0 "The administration needs constables who know the districts they patrol. More training and local stations will strengthen its presence beyond the principal towns."
    ww1_mittelafrika_local_councils: "Negotiate with Local Councils"
    ww1_mittelafrika_local_councils_desc:0 "Meet local representatives to discuss grievances over taxation, labour and the conduct of the administration. An agreement can reduce the resentment on which resistance thrives."
    ww1_mittelafrika_factory_investment: "Invest in Colonial Industry"
    ww1_mittelafrika_factory_investment_desc:0 "Local workshops depend on machinery and capital from abroad. New investment will expand production and provide the administration with a stronger economic base."
    ww1_mittelafrika_resource_survey: "Survey Colonial Resources"
    ww1_mittelafrika_resource_survey_desc:0 "Much of the territory's economic potential remains poorly surveyed. Engineers and prospectors should examine deposits and prepare them for development."

    ww1_german_east_asia_category: "German East Asia Administration"
    ww1_german_east_asia_category_desc:0 "Distant territories cannot be administered by decree alone. Local councils, public works and dependable officials will be needed to consolidate German East Asia."
    ww1_expand_german_east_asia_constabulary: "Expand the Colonial Constabulary"
    ww1_expand_german_east_asia_constabulary_desc:0 "A larger, better trained constabulary can relieve isolated garrisons and keep the colonial administration in contact with the districts it governs."
    ww1_german_east_asia_local_councils: "Negotiate with Local Councils"
    ww1_german_east_asia_local_councils_desc:0 "Meet local representatives to discuss grievances over taxation, labour and the conduct of the administration. An agreement can reduce the resentment on which resistance thrives."
    ww1_german_east_asia_factory_investment: "Invest in Colonial Industry"
    ww1_german_east_asia_factory_investment_desc:0 "Local workshops depend on machinery and capital from abroad. New investment will expand production and provide the administration with a stronger economic base."
    ww1_german_east_asia_resource_survey: "Survey Colonial Resources"
    ww1_german_east_asia_resource_survey_desc:0 "Much of the territory's economic potential remains poorly surveyed. Engineers and prospectors should examine deposits and prepare them for development."

    ww1_postwar_settlement_category: "Post-War Settlement"
    ww1_postwar_settlement_category_desc: "The Armistice has ended the fighting. The terms of the final peace must now be imposed."
    ww1_treaty_of_versailles: "Treaty of Versailles"
    ww1_treaty_of_versailles_desc:0 "The peace terms demand territorial concessions, military restrictions and financial obligations from Germany. Ratification will bind the republic to a settlement that many of its citizens bitterly oppose."
    ww1_establish_weimar_republic: "Establish the Weimar Republic"
    ww1_establish_weimar_republic_desc:0 "The German Republic needs a constitution that can outlast the upheaval in which it was born. An elected assembly must give the new state a durable foundation."
    ww1_treaty_of_versailles_weimar_prerequisite_tt: "The Weimar Republic has been established"
    ww1_peace_treaty_due: "Peace Treaty Due"
    ww1_peace_treaty_due_desc:0 "The armistice has silenced the guns, but it has left the peace unsettled. The government must ratify the final terms before the Allies lose patience."

    ### Austria-Hungary WWI administration ###
    AUH_ww1_food_security: "Food Security"
 AUH_ww1_administration_status:0 "§YImperial Administration§!\nStability: §Y[?stability|%0]§! | Food security: §Y[?AUH_ww1_food_security|0]/100§!\nMonthly change: stability §Y[?AUH_ww1_stability_monthly_change|%+1]§!, food §Y[?AUH_ww1_food_monthly_change|+0]§!.\nWar costs 0.2 percentage points of stability and 2 food each month (1 food with the Hungarian grain agreement). Food below 20 costs another 0.3 percentage points; unresolved strikes and Cattaro unrest each cost another 0.2. At peace, stability recovers by 0.2 percentage points monthly only while below 50%."
    AUH_ww1_imperial_council_category: "The Imperial Council"
 AUH_ww1_imperial_council_category_desc:0 "The common affairs of the monarchy depend on agreement between Vienna, Budapest and the crownlands. Their representatives must be heard before grievances harden into demands for separation.\n\n$AUH_ww1_administration_status$"
    AUH_ww1_home_front_category: "The Imperial Home Front"
 AUH_ww1_home_front_category_desc:0 "Food shortages and years of sacrifice are testing the loyalty of the civilian population. The monarchy must keep its towns supplied and its relief services working.\n\n$AUH_ww1_administration_status$"
 AUH_ww1_council_programme_ready_tt:0 "No other council programme is running"
 AUH_ww1_home_front_programme_ready_tt:0 "No other home front programme is running"
 AUH_ww1_measure_delayed_tt:0 "§YEffects apply when the programme is completed.§!"
 AUH_ww1_joint_delegations:0 "Convene the Joint Delegations"
 AUH_ww1_joint_delegations_desc:0 "The Austrian and Hungarian delegations must agree on common expenditure. A renewed conference will give their members an opportunity to settle outstanding grievances."
 AUH_ww1_joint_delegations_result_tt:0 "The Austrian and Hungarian delegations can review common expenditure and settle administrative grievances. A 45-day conference raises stability by 2.5 percentage points and provides Provincial Consultation for 90 days."
 AUH_ww1_provincial_commissions:0 "Send Provincial Grievance Commissions"
 AUH_ww1_provincial_commissions_desc:0 "Complaints of requisitions and irregular relief deliveries have reached the ministries. We should send officials to investigate alongside local representatives."
 AUH_ww1_provincial_commissions_result_tt:0 "Officials and local representatives will investigate requisitions and irregular relief deliveries. A 60-day inquiry uses one civilian factory, improves food security by 2 and provides Civil Administration for 90 days."
 AUH_ww1_army_language_services:0 "Expand Army Language Services"
 AUH_ww1_army_language_services_desc:0 "Orders lose their meaning when soldiers cannot understand them. More interpreters and liaison officers will improve communication throughout the common army."
 AUH_ww1_army_language_services_result_tt:0 "Train interpreters and liaison officers over 45 days with one civilian factory. Practical communication in the common army provides 5 army experience and raises war support by 1 percentage point."
 AUH_ww1_local_welfare_committees:0 "Recognize Local Welfare Committees"
 AUH_ww1_local_welfare_committees_desc:0 "Local representatives know where relief is needed most. Recognising their committees will bring public scrutiny to the purchase and distribution of supplies."
 AUH_ww1_local_welfare_committees_result_tt:0 "Provincial and parliamentary representatives can supervise relief purchasing. Establish the committees over 60 days with one civilian factory; food security rises by 4 and Parliamentary Scrutiny lasts 90 days."
 AUH_ww1_imperial_press_directives:0 "Coordinate Imperial Press Directives"
 AUH_ww1_imperial_press_directives_desc:0 "The newspapers of the monarchy carry conflicting accounts of the war. Common instructions will strengthen the official message, though tighter censorship will provoke resentment."
 AUH_ww1_imperial_press_directives_result_tt:0 "Prepare common wartime press instructions over 30 days. The campaign raises war support by 4 percentage points and provides Imperial Censorship for 90 days, while political restrictions cost 1 percentage point of stability."
 AUH_ww1_january_strike_settlement:0 "Negotiate the January Strike Settlement"
 AUH_ww1_january_strike_settlement_desc:0 "The strikes have exposed the depth of hardship in our industrial towns. Ministers must meet the workers' delegates and reach an agreement on food and working conditions."
 AUH_ww1_january_strike_settlement_result_tt:0 "Meet workers' representatives for 30 days using two civilian factories. The negotiated settlement resolves the January strikes, raises stability by 4 percentage points and food security by 3, and provides Strike Concessions for 90 days."
 AUH_ww1_grain_transport_priority:0 "Give Grain Trains Priority"
 AUH_ww1_grain_transport_priority_desc:0 "Grain is of little use while it waits at a railway siding. Giving food trains priority will bring supplies to the towns before stocks are exhausted."
 AUH_ww1_grain_transport_priority_result_tt:0 "Reserve rolling stock and coordinate grain traffic for 45 days with two civilian factories. Completed deliveries raise food security by 8 and provide Food Distribution for 90 days."
 AUH_ww1_civilian_kitchen_network:0 "Extend the Civilian Kitchen Network"
 AUH_ww1_civilian_kitchen_network_desc:0 "Municipal kitchens can provide a dependable meal to families whose wages no longer cover the cost of food. Their equipment and deliveries must be expanded."
 AUH_ww1_civilian_kitchen_network_result_tt:0 "Equip municipal kitchens over 60 days with two civilian factories. Completed relief raises food security by 10 and stability by 1.5 percentage points; Civilian Kitchens lasts 120 days."
 AUH_ww1_urban_rationing:0 "Revise Urban Ration Schedules"
 AUH_ww1_urban_rationing_desc:0 "Uneven ration schedules have left some districts short while others hold reserves. Revised cards and stricter distribution will conserve food, at the cost of further restrictions on daily life."
 AUH_ww1_urban_rationing_result_tt:0 "Reorganize ration cards over 30 days using one civilian factory. Tighter distribution conserves 6 food-security points and provides Food Distribution for 60 days, but restrictions cost 2 percentage points of stability."
 AUH_ww1_municipal_food_inspections:0 "Inspect Municipal Food Stores"
 AUH_ww1_municipal_food_inspections_desc:0 "Reports of hoarding and diverted deliveries are undermining confidence in the rationing system. Inspectors must examine the stores and reconcile the municipal records."
 AUH_ww1_municipal_food_inspections_result_tt:0 "Inspect municipal stores, investigate diversion and repair ration records over 30 days with one civilian factory. Recovered supplies improve food security by 4."
 AUH_ww1_hungarian_grain_deliveries:0 "Arrange Hungarian Grain Deliveries"
 AUH_ww1_hungarian_grain_deliveries_desc:0 "The grain agreement must be followed by reliable deliveries. New arrangements with Budapest can relieve the towns, though renewed demands will anger the producing districts."
 AUH_ww1_hungarian_grain_deliveries_result_tt:0 "Organize deliveries under the grain agreement over 60 days with one civilian factory. Shipments raise food security by 10, while renewed requisitions create resentment and cost 1 percentage point of stability."
 AUH_ww1_cattaro_crew_delegation:0 "Receive the Cattaro Crew Delegation"
 AUH_ww1_cattaro_crew_delegation_desc:0 "The sailors at Cattaro have grievances over rations and the conduct of their officers. Receiving their delegates offers a chance to settle the dispute before unrest spreads through the fleet."
 AUH_ww1_cattaro_crew_delegation_result_tt:0 "Assign one civilian factory to a 30-day inquiry into sailors' rations and command grievances. Negotiated concessions resolve Cattaro unrest, improve food security by 2, provide 5 navy experience and raise war support by 1 percentage point."

    ### Italy WWI administration ###
 IT1_ww1_home_front_category:0 "Civilian Relief and Public Services"
 IT1_ww1_home_front_category_desc:0 "Shortages and industrial disputes are placing a growing burden on civilian life. The government must coordinate relief, public works and negotiations with organised labour."
 IT1_ww1_colonial_category:0 "Colonial Civil Administration"
 IT1_ww1_colonial_category_desc:0 "The colonial administration must extend beyond garrisons and tax offices. Courts, public services and transport will determine how firmly it can govern the territories under its control."
 IT1_ww1_home_front_programme_ready_tt:0 "No other home-front programme is running"
 IT1_ww1_colonial_programme_ready_tt:0 "No other colonial programme is running"
 IT1_ww1_measure_delayed_tt:0 "The promised rewards take effect §Ywhen this programme finishes§!."
 IT1_ww1_grain_shipping_priority:0 "Give Grain Cargoes Shipping Priority"
 IT1_ww1_grain_shipping_priority_desc:0 "Grain cargoes are waiting behind less urgent freight. Coordinating shipping and port handling will bring food to the towns before local stocks run out."
 IT1_ww1_grain_shipping_priority_result_tt:0 "On completion: §YRationing§! for §Y90 days§!."
 IT1_ww1_municipal_kitchen_network:0 "Equip the Municipal Kitchen Network"
 IT1_ww1_municipal_kitchen_network_desc:0 "Municipal kitchens can reach families unable to afford a proper meal. More equipment and dependable deliveries will allow them to serve the districts most in need."
 IT1_ww1_municipal_kitchen_network_result_tt:0 "On completion: §YVeteran Resettlement Programme§! for §Y120 days§!."
 IT1_ww1_urban_ration_cards:0 "Revise Urban Ration Cards"
 IT1_ww1_urban_ration_cards_desc:0 "Uneven ration records have left some households without their share. Reissuing the cards and inspecting distribution will make the system more dependable."
 IT1_ww1_urban_ration_cards_result_tt:0 "On completion: §YRationing§! for §Y60 days§!."
 IT1_ww1_seed_and_harvest_credit:0 "Advance Seed and Harvest Credit"
 IT1_ww1_seed_and_harvest_credit_desc:0 "Farmers need seed, repaired tools and transport to prepare the next harvest. Agricultural credit will help them resume production and bring food to market."
 IT1_ww1_seed_and_harvest_credit_result_tt:0 "On completion: §YColonial Investment§! for §Y180 days§!."
 IT1_ww1_market_inspections:0 "Inspect Municipal Food Markets"
 IT1_ww1_market_inspections_desc:0 "Rumours of hoarding and diverted supplies are undermining confidence in the food markets. Inspectors should examine the stores and follow the municipal accounts."
 IT1_ww1_market_inspections_result_tt:0 "On completion: §YPublished Wartime Accounts§! for §Y90 days§!."
 IT1_ww1_industrial_labor_settlement:0 "Negotiate an Industrial Labor Settlement"
 IT1_ww1_industrial_labor_settlement_desc:0 "Workers and employers must find terms on wages and conditions that both can uphold. Government mediation can prevent another dispute from closing essential workshops."
 IT1_ww1_industrial_labor_settlement_result_tt:0 "On completion: §YStrike Agreement§! for §Y90 days§!."
 IT1_ww1_demobilization_offices:0 "Open Demobilization Assistance Offices"
 IT1_ww1_demobilization_offices_desc:0 "Returning servicemen need housing, work and help with official papers. Local offices can ease their return to civilian life and prevent them from being lost between departments."
 IT1_ww1_demobilization_offices_result_tt:0 "On completion: §YVeteran Resettlement Programme§! for §Y120 days§!."
 IT1_ww1_municipal_employment_grants:0 "Finance Municipal Employment Grants"
 IT1_ww1_municipal_employment_grants_desc:0 "Public buildings and local services need repair, while many families have no dependable wage. Municipal contracts can address both needs through supervised public works."
 IT1_ww1_municipal_employment_grants_result_tt:0 "On completion: §YPublished Wartime Accounts§! for §Y180 days§!."
 IT1_ww1_parliamentary_mediation:0 "Sponsor Parliamentary Mediation"
 IT1_ww1_parliamentary_mediation_desc:0 "Parliamentary deputies, municipal leaders and trade delegates should be brought together before their disputes become another national crisis. An agreed settlement will carry greater authority than a ministerial order alone."
 IT1_ww1_parliamentary_mediation_result_tt:0 "On completion: §YMediation Mission§! for §Y90 days§!."
 IT1_ww1_veterans_vocational_courses:0 "Arrange Veterans' Vocational Courses"
 IT1_ww1_veterans_vocational_courses_desc:0 "Military service has interrupted the working lives of thousands of men. Vocational courses will help veterans find employment while retaining the useful skills acquired in the army."
 IT1_ww1_veterans_vocational_courses_result_tt:0 "On completion: army experience §G+5§!."
 IT1_ww1_colonial_civil_census:0 "Conduct a Colonial Civil Census"
 IT1_ww1_colonial_civil_census_desc:0 "Uncertain civil records leave families and property subject to arbitrary claims. A census will give local officials a more dependable basis for their work."
 IT1_ww1_colonial_civil_census_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_magistrates:0 "Train Local Magistrates and Interpreters"
 IT1_ww1_colonial_magistrates_desc:0 "Courts cannot command confidence when officials and petitioners cannot understand one another. Training magistrates and interpreters will make local justice more consistent."
 IT1_ww1_colonial_magistrates_result_tt:0 "On completion: one eligible colony gains §G4 compliance§! and loses up to §G2 resistance§!."
 IT1_ww1_colonial_health_services:0 "Support Local Health and Relief Services"
 IT1_ww1_colonial_health_services_desc:0 "Dispensaries and relief offices lack equipment and trained staff. Better provision will help local authorities answer hardship before it becomes wider unrest."
 IT1_ww1_colonial_health_services_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_constabulary_training:0 "Train the Colonial Constabulary"
 IT1_ww1_colonial_constabulary_training_desc:0 "Constables need training suited to the districts they patrol. Better instruction and local recruits can reduce reliance on distant military garrisons."
 IT1_ww1_colonial_constabulary_training_result_tt:0 "On completion: one eligible colony loses up to §G4 resistance§!; §YColonial Constabulary§! for §Y120 days§!."
 IT1_ww1_colonial_road_contracts:0 "Award Local Road Contracts"
 IT1_ww1_colonial_road_contracts_desc:0 "Isolated districts remain difficult to supply and administer. Local road contracts will improve the routes between settlements and the principal towns."
 IT1_ww1_colonial_road_contracts_result_tt:0 "On completion: one eligible colony gains §G1 infrastructure level§! (maximum 5)."
 IT1_ww1_colonial_port_handling:0 "Improve Colonial Port Handling"
 IT1_ww1_colonial_port_handling_desc:0 "Confused cargo records and poor storage delay deliveries at the ports. Clear procedures and better labour arrangements will help supplies reach their destinations."
 IT1_ww1_colonial_port_handling_result_tt:0 "On completion: one eligible colony with an existing port gains §G2 compliance§!; §YColonial Investment§! for §Y120 days§!."
 IT1_ww1_colonial_irrigation_grants:0 "Finance Local Irrigation Grants"
 IT1_ww1_colonial_irrigation_grants_desc:0 "Small irrigation works and reliable agricultural transport can improve the livelihoods of rural communities. Local grants will put those projects within reach."
 IT1_ww1_colonial_irrigation_grants_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_apprenticeships:0 "Fund Colonial Technical Apprenticeships"
 IT1_ww1_colonial_apprenticeships_desc:0 "The administration needs trained clerks and technicians who know the country. Apprenticeships will prepare local recruits for those responsibilities."
 IT1_ww1_colonial_apprenticeships_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!; §YColonial Investment§! for §Y120 days§!."
 IT1_ww1_foreign_policy_category:0 "Italian Foreign Policy"
 IT1_ww1_foreign_policy_category_desc:0 "Rejected proposals need not end our diplomacy. Ministers must decide where revised terms can still secure an agreement worthy of Italy's interests."
 IT1_ww1_diplomatic_programme_ready_tt:0 "No other Italian diplomatic mission is running."
 IT1_ww1_diplomatic_proposal_delayed_tt:0 "A new diplomatic proposal is sent when the 45-day mission finishes."
 IT1_ww1_retry_central_negotiation:0 "Reopen Talks with Berlin"
 IT1_ww1_retry_central_negotiation_desc:0 "The last negotiations with Berlin ended without agreement. A renewed mission will seek terms that the German government and our own cabinet can accept."
 IT1_ww1_retry_entente_negotiation:0 "Renew the Entente Negotiation"
 IT1_ww1_retry_entente_negotiation_desc:0 "Our envoys should return to the French government with revised proposals on supply and intervention. Its reply will show whether an understanding remains possible."
 IT1_ww1_retry_continental_negotiation:0 "Reconsider the Continental Concert"
 IT1_ww1_retry_continental_negotiation_desc:0 "A renewed conference can reconsider the proposed Continental Concert and Italy's position in the Mediterranean. Our representatives must reconcile those ambitions with the commitments already accepted abroad."
 IT1_ww1_retry_ottoman_negotiation:0 "Reopen Ottoman Commercial Talks"
 IT1_ww1_retry_ottoman_negotiation_desc:0 "The dispute over colonial concessions remains unresolved. Another approach to Constantinople may secure commercial terms without a new confrontation."
 IT1_ww1_retry_senussi_negotiation:0 "Revise the Senussi Terms"
 IT1_ww1_retry_senussi_negotiation_desc:0 "Local administrative terms have failed to satisfy the Senussi leadership. Revised proposals may yet produce a settlement that both sides can uphold."
 IT1_ww1_retry_adriatic_negotiation:0 "Reopen the Adriatic Conference"
 IT1_ww1_retry_adriatic_negotiation_desc:0 "The Adriatic dispute continues to divide Rome and Vienna. A renewed conference should seek guarantees that protect our interests and can win Austrian agreement."
 AUH_ww1_stability_administration_category:0 "Civil Administration and Stability"
 AUH_ww1_stability_administration_category_desc:0 "The monarchy relies on thousands of clerks, teachers and municipal officials. Their offices must be equipped and their responsibilities made clear if public services are to endure.\n\n$AUH_ww1_administration_status$"
 AUH_ww1_stability_programme_ready_tt:0 "No other stability programme is running"
 AUH_ww1_regional_representative_panels:0 "Seat Regional Representative Panels"
 AUH_ww1_regional_representative_panels_desc:0 "Provincial officials cannot settle every grievance from a distant office. Local panels will give communities a voice in the administration of their affairs."
 AUH_ww1_regional_representative_panels_result_tt:0 "Assemble local representative panels over 60 days with one civilian factory. One randomly selected owned, fully controlled non-core state below 90 compliance gains 3 compliance; Provincial Consultation lasts 120 days."
 AUH_ww1_provincial_police_training:0 "Reform Provincial Police Training"
 AUH_ww1_provincial_police_training_desc:0 "Poor training and language barriers have undermined trust in the provincial police. New instruction and interpreters can help restore order with fewer abuses."
 AUH_ww1_provincial_police_training_result_tt:0 "Train provincial police and translators over 60 days using one civilian factory. One owned and fully controlled non-core state loses up to 3 resistance. Local Police Reform lasts 120 days."
 AUH_ww1_parliamentary_question_days:0 "Reserve Parliamentary Question Days"
 AUH_ww1_parliamentary_question_days_desc:0 "The delegations should have a regular opportunity to question ministers about requisitions and civil administration. Public answers may restore confidence, even when they expose uncomfortable failures."
 AUH_ww1_parliamentary_question_days_result_tt:0 "Set aside 45 days for questions on requisitions and civil administration. Public scrutiny raises stability by 2 percentage points and provides Parliamentary Scrutiny for 90 days, while exposing wartime grievances costs 1 percentage point of war support."
 AUH_ww1_seed_and_harvest_supplies:0 "Purchase Seed and Harvest Supplies"
 AUH_ww1_seed_and_harvest_supplies_desc:0 "Another poor harvest would deepen the crisis. Farmers need seed, repaired tools and transport if they are to bring their produce to market."
 AUH_ww1_seed_and_harvest_supplies_result_tt:0 "Purchase seed, repair tools and organize agricultural transport through a 120-day programme using two civilian factories. The completed harvest raises food security by 15."
 AUH_ww1_refugee_registration_offices:0 "Open Refugee Registration Offices"
 AUH_ww1_refugee_registration_offices_desc:0 "Families displaced by the fighting need housing and access to rations. Registration offices will help local authorities coordinate relief without losing people between jurisdictions."
 AUH_ww1_refugee_registration_offices_result_tt:0 "Coordinate refugee registration, housing and ration access over 60 days with two civilian factories. The offices improve food security by 3 and stability by 2 percentage points, then provide Civil Administration for 120 days."
 AUH_ww1_municipal_health_services:0 "Restore Municipal Health Services"
 AUH_ww1_municipal_health_services_desc:0 "Overcrowding and shortages have strained the towns' dispensaries and sanitation services. Repairs and fresh supplies will help prevent hardship from becoming an epidemic."
 AUH_ww1_municipal_health_services_result_tt:0 "Repair dispensaries, sanitation and relief facilities over 90 days with two civilian factories. Health provision improves food security by 4 and provides Public Works for 90 days."
 AUH_ww1_civilian_bulk_purchasing:0 "Coordinate Civilian Bulk Purchasing"
 AUH_ww1_civilian_bulk_purchasing_desc:0 "Municipalities compete for the same scarce supplies. Combining their orders can secure better terms and make deliveries more dependable."
 AUH_ww1_civilian_bulk_purchasing_result_tt:0 "Consolidate municipal food orders over 60 days using two civilian factories. Better purchasing and distribution raise food security by 5 and provide Food Distribution for 60 days."
 AUH_ww1_civil_register_reorganization:0 "Reorganize the Civil Registers"
 AUH_ww1_civil_register_reorganization_desc:0 "Conflicting registers and permits delay even routine business. Provincial offices should reconcile their records and establish clear lines of responsibility."
 AUH_ww1_civil_register_reorganization_result_tt:0 "Reconcile provincial registers, permits and civil-service responsibilities over 60 days with one civilian factory. The completed work provides Civil Administration for 120 days."
 AUH_ww1_technical_school_courses:0 "Equip Technical School Courses"
 AUH_ww1_technical_school_courses_desc:0 "Technical schools need equipment and instructors to prepare the next generation of engineers and civil servants. Common courses will also make cooperation between the crownlands easier."
 AUH_ww1_technical_school_courses_result_tt:0 "Equip technical schools and common-language training over 90 days using two civilian factories. The courses provide one 25% electronics research bonus and Provincial Consultation for 60 days. This curriculum programme is undertaken once."
 AUH_ww1_technical_schools_bonus:0 "Equip Technical School Courses Research"
 AUH_ww1_local_road_contracts:0 "Award Local Road Contracts"
 AUH_ww1_local_road_contracts_desc:0 "Neglected roads isolate villages and delay deliveries. New contracts will repair the routes on which local trade and public services depend."
 AUH_ww1_local_road_contracts_result_tt:0 "Reserve three civilian factories for 120 days of road construction. One randomly selected owned and fully controlled state below infrastructure level 5 gains one infrastructure level when the work finishes."
 AUH_ww1_administrative_budget_review:0 "Review Administrative Expenditure"
 AUH_ww1_administrative_budget_review_desc:0 "Common procurement has accumulated overlapping obligations and uncertain accounts. A thorough review will show where public money is being spent and which commitments can be met."
 AUH_ww1_administrative_budget_review_result_tt:0 "Review common procurement and public-service obligations for 45 days using one civilian factory. The examination provides Parliamentary Scrutiny for 120 days and 3 army experience from reviewing military purchasing."
 AUH_ww1_civil_service_procurement:0 "Standardize Civil-Service Procurement"
 AUH_ww1_civil_service_procurement_desc:0 "Offices across the monarchy purchase the same equipment under different specifications. Common standards will simplify orders and reduce waste."
 AUH_ww1_civil_service_procurement_result_tt:0 "Prepare common purchasing specifications over 90 days using two civilian factories. The completed programme gives one 25% industry research bonus and Civil Administration for 90 days. The shared specifications are introduced once."
 AUH_ww1_procurement_bonus:0 "Standardize Civil-Service Procurement Research"
 AUH_ww1_municipal_service_reconstruction:0 "Rebuild Municipal Public Services"
 AUH_ww1_municipal_service_reconstruction_desc:0 "The return of peace must bring visible improvements to daily life. Municipal repairs will restore public buildings and services damaged by the war."
 AUH_ww1_municipal_service_reconstruction_result_tt:0 "Reserve three civilian factories for 90 days of municipal repairs and public-service restoration. If peace continues, the programme raises stability by 1 percentage point and provides Public Works for 120 days."
 AUH_ww1_food_warehouse_repairs:0 "Repair Public Food Warehouses"
 AUH_ww1_food_warehouse_repairs_desc:0 "Damaged stores and loading facilities allow precious food to spoil. Repairing them will protect civilian stocks, though the work must compete with military demands."
 AUH_ww1_food_warehouse_repairs_result_tt:0 "Rebuild municipal storage and loading facilities over 90 days using two civilian factories. Restored civilian stocks improve food security by 6 and provide Public Works for 90 days; allocating capacity away from the war effort costs 1 percentage point of war support."
 AUH_ww1_demobilized_labor_offices:0 "Organize Demobilized Labor Offices"
 AUH_ww1_demobilized_labor_offices_desc:0 "Returning soldiers need work, housing and ration documents. Local employment offices can help them find a place in civilian life."
 AUH_ww1_demobilized_labor_offices_result_tt:0 "Arrange civilian employment and ration registration for returning soldiers over 60 days with two civilian factories. If peace continues, stability rises by 2 percentage points and food security by 2; the civilian transition reduces war support by 2 percentage points."
 AUH_ww1_industrial_liaison_offices:0 "Staff the Industrial Liaison Offices"
 AUH_ww1_industrial_liaison_offices_desc:0 "Factories receive competing demands from army purchasers and provincial authorities. Permanent liaison offices will give their orders a common schedule."
 AUH_ww1_industrial_liaison_offices_result_tt:0 "Coordinate firms, army purchasers and provincial works departments over 60 days with two civilian factories. The completed liaison service provides 5 army experience and Public Works for 120 days."
 AUH_ww1_bohemian_negotiations_retry:0 "Reopen Bohemian Negotiations"
 AUH_ww1_bohemian_negotiations_retry_desc:0 "The Bohemian delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_hungarian_negotiations_retry:0 "Reopen Hungarian Negotiations"
 AUH_ww1_hungarian_negotiations_retry_desc:0 "The Hungarian delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_croatian_negotiations_retry:0 "Reopen Croatian Negotiations"
 AUH_ww1_croatian_negotiations_retry_desc:0 "The Croatian delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_galician_negotiations_retry:0 "Reopen Galician Negotiations"
 AUH_ww1_galician_negotiations_retry_desc:0 "The Galician delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_bosnian_negotiations_retry:0 "Reopen Bosnian Negotiations"
 AUH_ww1_bosnian_negotiations_retry_desc:0 "The Bosnian delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_slovenian_negotiations_retry:0 "Reopen Slovenian Negotiations"
 AUH_ww1_slovenian_negotiations_retry_desc:0 "The Slovenian delegates remain dissatisfied with the last proposal. A fresh hearing will give ministers another opportunity to address their objections and seek an agreement."
 AUH_ww1_renew_dualism_ratification_retry:0 "Reconvene the Ratification Vote: Renew Dualism"
 AUH_ww1_renew_dualism_ratification_retry_desc:0 "The last vote left the proposed renew dualism settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_common_executive_ratification_retry:0 "Reconvene the Ratification Vote: Common Executive"
 AUH_ww1_common_executive_ratification_retry_desc:0 "The last vote left the proposed common executive settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_three_crowns_ratification_retry:0 "Reconvene the Ratification Vote: Three Crowns"
 AUH_ww1_three_crowns_ratification_retry_desc:0 "The last vote left the proposed three crowns settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_united_federation_ratification_retry:0 "Reconvene the Ratification Vote: United Federation"
 AUH_ww1_united_federation_ratification_retry_desc:0 "The last vote left the proposed united federation settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_autonomous_crowns_ratification_retry:0 "Reconvene the Ratification Vote: Autonomous Crowns"
 AUH_ww1_autonomous_crowns_ratification_retry_desc:0 "The last vote left the proposed autonomous crowns settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_republican_convention_ratification_retry:0 "Reconvene the Ratification Vote: Republican Convention"
 AUH_ww1_republican_convention_ratification_retry_desc:0 "The last vote left the proposed republican convention settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 AUH_ww1_negotiated_separation_ratification_retry:0 "Reconvene the Ratification Vote: Negotiated Separation"
 AUH_ww1_negotiated_separation_ratification_retry_desc:0 "The last vote left the proposed negotiated separation settlement unresolved. Renewed discussions may bring the delegates back to the chamber with terms they can accept."
 RUS_ww1_state_business_category:0 "Russian State Business"
 RUS_ww1_state_business_category_desc:0 "The ministries must keep provincial services working while the army demands men and supplies. Careful staff work and diplomacy can ease the strain on the state."
 RUS_ww1_programme_ready_tt:0 "No other Russian public-service or diplomatic programme is running."
 RUS_ww1_programme_delayed_tt:0 "The programme's rewards take effect when the work finishes."
 RUS_ww1_civil_register_review:0 "Review the Provincial Registers"
 RUS_ww1_civil_register_review_desc:0 "Provincial offices hold conflicting registration records and purchasing accounts. Reconciling them will make it harder for supplies and public money to disappear without explanation."
 RUS_ww1_provincial_services:0 "Support Provincial Public Services"
 RUS_ww1_provincial_services_desc:0 "Roads, schools and dispensaries have been neglected as military demands grow. New service agreements will give provincial authorities the means to maintain them."
 RUS_ww1_industrial_insurance:0 "Negotiate Industrial Insurance"
 RUS_ww1_industrial_insurance_desc:0 "Factory insurance means little if workers cannot obtain the benefits promised to them. Employers and workers' representatives must agree on a dependable system of administration."
 RUS_ww1_front_staff_exercises:0 "Hold Front Staff Exercises"
 RUS_ww1_front_staff_exercises_desc:0 "Front headquarters should compare movement orders, intelligence reports and reserve timetables. Exercises will reveal conflicting assumptions before they disrupt a campaign."
 RUS_ww1_refugee_registration:0 "Fund Refugee Registration Offices"
 RUS_ww1_refugee_registration_desc:0 "Displaced families need shelter and a place on the ration lists. Local offices will coordinate registration and transport so that relief reaches those who need it."
 RUS_ww1_civilian_reconstruction:0 "Commission Civilian Reconstruction"
 RUS_ww1_civilian_reconstruction_desc:0 "Peace has left damaged buildings and disrupted civilian trade in its wake. Public contracts will put workers and workshops to the task of reconstruction."
 RUS_ww1_reopen_berlin_talks:0 "Reopen the Berlin Negotiation"
 RUS_ww1_reopen_berlin_talks_desc:0 "A fresh approach to Berlin may find more favourable terms for commerce and non-aggression. Our envoys should submit a revised proposal and seek a German reply."
 RUS_ww1_reopen_japanese_talks:0 "Renew the Japanese Proposal"
 RUS_ww1_reopen_japanese_talks_desc:0 "Commercial disputes need not define our relations with Japan. A renewed mission will offer practical terms on which both governments can agree."
    ww1_ger_reichstag_hearings:0 "Hold Reichstag Hearings"
    ww1_ger_reichstag_hearings_desc:0 "Deputies, state ministers and labour representatives should be heard on the conduct of wartime administration. The civilian government must show that it remains accountable."
    ww1_ger_zabern_inquiry:0 "Reopen the Zabern Inquiry"
    ww1_ger_zabern_inquiry_desc:0 "The conduct of the army at Zabern remains a bitter example of unchecked authority. Reopening the inquiry will demonstrate that military officers must answer to civil law."
    ww1_ger_war_credit_hearing:0 "Review the War Credits"
    ww1_ger_war_credit_hearing_desc:0 "A public committee examines procurement and war credits while the army is in the field. Parliamentary scrutiny slows decisions slightly but can keep the civilian ministry intact."
    ww1_ger_fatherland_rallies:0 "Organise Fatherland Rallies"
    ww1_ger_fatherland_rallies_desc:0 "Fund public meetings and veterans' associations behind the Fatherland Party. The campaign reinforces resolve for a little while and carries the political cost of a harder war programme."
    ww1_ger_easter_deputations:0 "Receive Easter Deputations"
    ww1_ger_easter_deputations_desc:0 "Party delegations and municipal leaders are demanding that the Easter promise be honoured. Receiving them will give the government an opportunity to reaffirm its commitment to reform."
    ww1_ger_russian_mission:0 "Send the Potsdam Mission"
    ww1_ger_russian_mission_desc:0 "Envoys should approach Petrograd with proposals for commercial access and renewed neutrality. The Russian government must be persuaded that an agreement serves its own interests."
    ww1_ger_coastal_raids:0 "Coordinate Coastal Raids"
    ww1_ger_coastal_raids_desc:0 "Use destroyers, minesweepers and naval intelligence to prepare a limited coastal operation. The temporary organisation improves screening and gives the fleet practical experience."
    ww1_ger_stormtroop_logistics:0 "Rehearse Stormtroop Logistics"
    ww1_ger_stormtroop_logistics_desc:0 "Assault detachments depend on ammunition columns and railway troops as much as their own training. Joint rehearsals will expose weaknesses before an offensive begins."
    ww1_ger_civilian_supply_committee:0 "Convene a Civilian Supply Committee"
    ww1_ger_civilian_supply_committee_desc:0 "Provincial officials, factory managers and parliamentarians should examine the failures of civilian supply together. Clear responsibilities can prevent essential deliveries from falling between ministries."
 EN1_R_decision_war_savings:0 "National War Savings"
 EN1_R_decision_war_savings_desc:0 "Small subscriptions can make a substantial contribution to the war loan. The Treasury should renew its appeal to households, workplaces and local savings associations."
 EN1_R_decision_rail_priority:0 "Review Railway Priorities"
 EN1_R_decision_rail_priority_desc:0 "Congested railways delay troops, coal and food alike. The ministries and railway companies must agree which traffic takes precedence and where extra capacity is most urgently needed."
 EN1_R_decision_skilled_workers:0 "Protect Skilled Workers"
 EN1_R_decision_skilled_workers_desc:0 "An experienced machinist cannot be replaced as readily as a military recruit. Recruitment offices and employers must agree on protection for workers indispensable to essential production."
 EN1_R_decision_recruiting:0 "Renew the Recruiting Campaign"
 EN1_R_decision_recruiting_desc:0 "Recruiting offices need a renewed campaign that reaches beyond the first wave of volunteers. Public meetings and local committees can encourage men to come forward."
 EN1_R_decision_allied_liaison:0 "Hold an Allied Staff Conference"
 EN1_R_decision_allied_liaison_desc:0 "Allied staffs should compare their operational plans and supply requirements. Better liaison will help prevent one army's preparations from frustrating another's."
 EN1_R_decision_berlin_liaison:0 "Meet the Anglo-German Secretariat"
 EN1_R_decision_berlin_liaison_desc:0 "The Anglo-German agreement requires regular consultation. The secretariat should review transport, supply and the military commitments accepted by both governments."
 EN1_R_decision_imperial_supplies:0 "Review Imperial Procurement"
 EN1_R_decision_imperial_supplies_desc:0 "Departments across the empire place orders for the same scarce goods. A common review will coordinate purchasing and improve the movement of supplies."
 EN1_R_decision_irish_guarantees:0 "Review Irish Constitutional Guarantees"
 EN1_R_decision_irish_guarantees_desc:0 "Constitutional promises will command little trust if they remain unexamined. Ministers and Irish representatives should review the guarantees and settle disputes over their application."
 ww1_eng_administration_category:0 "British War Administration"
 ww1_eng_administration_category_desc:0 "Parliament, the ministries and our partners must coordinate recruitment, production and military supply. Their agreements will shape Britain's ability to sustain its commitments."
 FR3_R_decision_munition_contracts:0 "Review the Munitions Contracts"
 FR3_R_decision_munition_contracts_desc:0 "Bring the arsenals, ministries and parliamentary inspectors together to review specifications and deliveries. The programme gives essential production a common schedule while keeping the contracts accountable."
 FR3_R_decision_labour_exemptions:0 "Review Essential Worker Exemptions"
 FR3_R_decision_labour_exemptions_desc:0 "Indispensable workers are receiving conflicting recruitment and production orders. A common review will allow the army and the factories to plan around a dependable allocation of skilled labour."
 FR3_R_decision_front_rotation:0 "Renew the Leave and Rotation Programme"
 FR3_R_decision_front_rotation_desc:0 "Coordinate leave and reserve schedules with medical and supply services. Predictable rest supports readiness while formations continue to hold their sectors."
 FR3_R_decision_refugee_relief:0 "Coordinate Refugee Relief"
 FR3_R_decision_refugee_relief_desc:0 "Coordinate accommodation, transport and municipal assistance for civilians displaced by the war. Accurate records help the ministries share resources instead of competing for them."
 FR3_R_decision_russian_liaison:0 "Meet the Franco-Russian Staff Mission"
 FR3_R_decision_russian_liaison_desc:0 "Compare operational calendars and supply plans with our Russian partner. The mission respects any separate agreement or neutral policy accepted by the Russian government."
 FR3_R_decision_british_liaison:0 "Review Channel Transport"
 FR3_R_decision_british_liaison_desc:0 "Review unloading, repairs and the transport of reinforcements with British representatives. The agreement depends on the continuing alliance between the two governments."
 FR3_R_decision_continental_liaison:0 "Convene the Continental Secretariat"
 FR3_R_decision_continental_liaison_desc:0 "The participating governments should compare reserves, transport and operational plans. Regular meetings will give the coalition a common understanding of the next campaign."
 FR3_R_decision_reconstruction_survey:0 "Survey the Recovered Departments"
 FR3_R_decision_reconstruction_survey_desc:0 "Engineers and administrators must assess damaged transport and civilian industry in the recovered departments. Their reports will establish the priorities for reconstruction."
 ww1_fra_administration_category:0 "French War Administration"
 ww1_fra_administration_category_desc:0 "The ministries, parliamentary commissions and our partners coordinate recruitment, production and military supply. These programmes support the policies and treaties the government has accepted."
 ww1_usa_administration_category:0 "Federal Administration and Preparedness"
 ww1_usa_administration_category_desc:0 "Congress and the executive departments must reconcile commerce, defence and the needs of military supply. Contracts and public services require careful supervision if the country is to meet its commitments."
 US2_R_decision_industrial_survey:0 "Renew the Industrial Survey"
 US2_R_decision_industrial_survey_desc:0 "Update the survey of American workshops and available civilian capacity. Manufacturers can use the revised record to prepare investment and future orders."
 US2_R_decision_rail_priorities:0 "Coordinate Military Rail Priorities"
 US2_R_decision_rail_priorities_desc:0 "Reserve rail capacity for embarkation ports and supply depots. Military schedules must account for the civilian freight that still supports the war economy."
 US2_R_decision_ordnance_contracts:0 "Review Ordnance Contracts"
 US2_R_decision_ordnance_contracts_desc:0 "Examine costs and delivery schedules before renewing military orders. Clear standards allow useful suppliers to expand without granting every bidder a permanent emergency contract."
 US2_R_decision_merchant_yards:0 "Renew the Merchant Yard Programme"
 US2_R_decision_merchant_yards_desc:0 "Offer selected yards another term of merchant construction contracts. These orders support transport capacity without creating a permanent wartime fleet subsidy."
 US2_R_decision_training_camps:0 "Organise Reserve Training Camps"
 US2_R_decision_training_camps_desc:0 "Reservists and instructors should be brought together for another period of organised training. A dependable reserve will allow the army to answer an emergency with prepared formations."
 US2_R_decision_escort_drills:0 "Run Atlantic Escort Drills"
 US2_R_decision_escort_drills_desc:0 "Practise convoy station keeping, rescue and coordination with merchant captains. Renew the programme only while the country still has an active wartime escort commitment."
 US2_R_decision_air_mechanics:0 "Train Aircraft Mechanics"
 US2_R_decision_air_mechanics_desc:0 "Run another course for technicians servicing experimental aircraft. Reliable inspection and repair matter as much as the number of trained pilots."
 US2_R_decision_border_patrols:0 "Coordinate the Frontier Patrols"
 US2_R_decision_border_patrols_desc:0 "Renew patrol timetables and local supply arrangements along the southwestern frontier. Border protection remains distinct from a general intervention in Mexico."
 US2_R_decision_civilian_conciliation:0 "Convene Industrial Conciliation Boards"
 US2_R_decision_civilian_conciliation_desc:0 "Invite employers and organised labour to another term of mediated negotiation. Voluntary agreements can prevent disputes from interrupting essential civilian production."
 US2_R_decision_neutral_mediation:0 "Renew the Mediation Mission"
 US2_R_decision_neutral_mediation_desc:0 "Keep diplomatic channels open to governments that cannot yet agree on peace. The mission offers a negotiating service without committing the United States to either coalition."
 US2_R_decision_veteran_care:0 "Coordinate Veterans Medical Care"
 US2_R_decision_veteran_care_desc:0 "Maintain the medical records and hospital arrangements for returning soldiers. Rehabilitation remains a responsibility after the emergency military departments close."
 US2_R_decision_pacific_stations:0 "Service the Pacific Stations"
 US2_R_decision_pacific_stations_desc:0 "Distant naval stations depend on regular maintenance and dependable supply officers. Renewed arrangements will keep the fleet ready to protect American interests across the Pacific."
 OT1_R_ottoman_administration:0 "Imperial Administration"
 OT1_R_ottoman_administration_desc:0 "Imperial administration is now managed through The Sick Man of Europe. Cabinet authority and officer loyalty remain political considerations; provincial confidence is the inverse of average regional discontent."
 OT1_R_ottoman_administration_dashboard:0 "Cabinet authority: [?OT1_R_cabinet_authority|0]/100\nOfficer loyalty: [?OT1_R_officer_loyalty|0]/100\nProvincial confidence: [?OT1_R_provincial_confidence|0]/100 (derived from regional discontent).\nRegional and political work share a limit of two programmes."
 OT1_R_300_cabinet_procedures:0 "Cabinet Procedures"
 OT1_R_300_cabinet_procedures_desc:0 "Ministers issue conflicting instructions while important papers wait for a decision. Clear cabinet procedures will strengthen central authority, though provincial and military offices will resist tighter supervision."
 OT1_R_300_cabinet_procedures_tt:0 "Starts immediately: -40 political power, -1 reform capacity. Runs 45 days. On completion: cabinet authority +10, officer loyalty -2. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_301_provincial_consultation:0 "Provincial Consultation"
 OT1_R_301_provincial_consultation_desc:0 "Provincial notables complain that their advice reaches Constantinople too late to matter. Consultation can restore their confidence, at the cost of concessions from the ministries."
 OT1_R_301_provincial_consultation_tt:0 "Starts immediately: -60 political power, -1 reform capacity. Runs 45 days. On completion: provincial confidence +12, cabinet authority -6, officer loyalty -2. No direct stability change."
 OT1_R_302_staff_mediation:0 "Staff Mediation"
 OT1_R_302_staff_mediation_desc:0 "Rival military staffs are undermining cooperation between commands. A mediated agreement can restore discipline, but officers will expect the cabinet and provincial authorities to accept their demands."
 OT1_R_302_staff_mediation_tt:0 "Starts immediately: -60 political power, -1 reform capacity. Runs 45 days. On completion: officer loyalty +12, cabinet authority -5. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_303_tax_registry:0 "Provincial Tax Registry"
 OT1_R_303_tax_registry_desc:0 "Outdated tax rolls conceal both arrears and unjust demands. Reconciling the registers with provincial officials will make collection more dependable."
 OT1_R_303_tax_registry_tt:0 "Starts immediately: -60 political power, -1 reform capacity. Runs 45 days. On completion: cabinet authority +8, provincial confidence +4, officer loyalty -3. No direct stability change."
 OT1_R_304_railway_priority:0 "Railway Priority Board"
 OT1_R_304_railway_priority_desc:0 "Army movements and provincial commerce compete for the same railway lines. A priority board will settle disputes before freight and reinforcements are stranded."
 OT1_R_304_railway_priority_tt:0 "Starts immediately: -70 political power, -1 reform capacity. Runs 60 days. On completion: provincial confidence +6, officer loyalty +6, cabinet authority -4. No direct stability change or free factories."
 OT1_R_305_officer_rotation:0 "Officer Rotation Lists"
 OT1_R_305_officer_rotation_desc:0 "Long appointments have allowed personal loyalties to rival the chain of command. New rotation lists will strengthen discipline, though local authorities will resent losing familiar intermediaries."
 OT1_R_305_officer_rotation_tt:0 "Starts immediately: -60 political power, -1 reform capacity. Runs 30 days. On completion: officer loyalty +8, cabinet authority +2. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_306_constitutional_review:0 "Constitutional Review"
 OT1_R_306_constitutional_review_desc:0 "Unsettled constitutional questions have become a source of repeated conflict. Ministers and parliamentary representatives should clarify their powers before another dispute paralyses the government."
 OT1_R_306_constitutional_review_tt:0 "Starts immediately: -50 political power, -1 reform capacity. Runs 45 days. On completion: cabinet authority +5, provincial confidence +5, officer loyalty -4. No direct stability change."
 OT1_R_307_garrison_stipends:0 "Garrison Stipends"
 OT1_R_307_garrison_stipends_desc:0 "Arrears in garrison pay have weakened the loyalty of the troops. Settling the stipends will reassure the officers, though the money must come from other public obligations."
 OT1_R_307_garrison_stipends_tt:0 "Starts immediately: -50 political power, -1 reform capacity. Runs 30 days. On completion: officer loyalty +7, cabinet authority -5. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_320_federal_council:0 "Federal Council"
 OT1_R_320_federal_council_desc:0 "The federal settlement needs a chamber in which the provinces can speak for themselves. A council of their representatives can resolve grievances before they become demands for separation."
 OT1_R_320_federal_council_tt:0 "Federal route. Starts immediately: -70 political power, -1 reform capacity. Runs 60 days. On completion: provincial confidence +10, cabinet authority +3, officer loyalty -4. No direct stability change."
 OT1_R_321_liberal_constitution:0 "Liberal Constitutional Charter"
 OT1_R_321_liberal_constitution_desc:0 "A responsible ministry requires more than assurances from the palace. A constitutional charter will define parliamentary rights and the limits of executive authority."
 OT1_R_321_liberal_constitution_tt:0 "Liberal route. Starts immediately: -80 political power, -1 reform capacity. Runs 60 days. On completion: provincial confidence +8, cabinet authority +8, officer loyalty -6. No direct stability change."
 OT1_R_330_cup_requisition_board:0 "CUP Requisition Board"
 OT1_R_330_cup_requisition_board_desc:0 "Unionist officials propose a common board to direct military requisitions. It will strengthen the army's supply, but provincial communities will bear much of the burden."
 OT1_R_330_cup_requisition_board_tt:0 "Unionist route. Starts immediately: -70 political power, -1 reform capacity. Runs 45 days. On completion: officer loyalty +10, cabinet authority +3. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_331_cup_staff_inspection:0 "CUP Staff Inspection"
 OT1_R_331_cup_staff_inspection_desc:0 "Party and military representatives will inspect the staffs and demand an account of their readiness. Officers may welcome the attention to their needs, while provincial authorities fear further interference."
 OT1_R_331_cup_staff_inspection_tt:0 "Unionist route. Starts immediately: -60 political power, -1 reform capacity. Runs 30 days. On completion: officer loyalty +10, cabinet authority +5. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_340_palace_patronage:0 "Palace Patronage"
 OT1_R_340_palace_patronage_desc:0 "The palace can strengthen its position through appointments and favours. Such patronage will draw officials closer to the throne, though those left outside the court will resent it."
 OT1_R_340_palace_patronage_tt:0 "Palace route. Starts immediately: -60 political power, -1 reform capacity. Runs 30 days. On completion: cabinet authority +8, officer loyalty -4. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_341_palace_royal_commission:0 "Royal Administrative Commission"
 OT1_R_341_palace_royal_commission_desc:0 "A royal commission will investigate failures in the administration. Its authority comes from the sultan, leaving provincial representatives with little influence over its conclusions."
 OT1_R_341_palace_royal_commission_tt:0 "Palace route. Starts immediately: -80 political power, -1 reform capacity. Runs 60 days. On completion: cabinet authority +6, officer loyalty +4. No direct stability change. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_350_emergency_cabinet:0 "Emergency Cabinet Measures"
 OT1_R_350_emergency_cabinet_desc:0 "The cabinet's authority is collapsing. An emergency agreement between ministers can restore a common direction, but it will require concessions from the provinces and the army."
 OT1_R_350_emergency_cabinet_tt:0 "Crisis only. Starts immediately: -75 political power, -1 reform capacity. Runs 21 days. On completion: cabinet authority +25, officer loyalty -4. No direct stability change and no refund. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_351_emergency_province:0 "Emergency Provincial Delegation"
 OT1_R_351_emergency_province_desc:0 "Provincial confidence in the government has broken down. An extraordinary delegation must hear local demands and offer terms that can prevent a wider rupture."
 OT1_R_351_emergency_province_tt:0 "Crisis only. Starts immediately: -75 political power, -1 reform capacity. Runs 21 days. On completion: provincial confidence +25, cabinet authority -8, officer loyalty -4. No direct stability change and no refund."
 OT1_R_352_emergency_officers:0 "Emergency Staff Mediation"
 OT1_R_352_emergency_officers_desc:0 "Discontent among the officers threatens the government's command of its own army. Senior mediators must settle their grievances before the dispute reaches the ranks."
 OT1_R_352_emergency_officers_tt:0 "Crisis only. Starts immediately: -80 political power, -1 reform capacity. Runs 21 days. On completion: officer loyalty +25, cabinet authority -8. No direct stability change and no refund. Occupies one of the two shared programme places. Provincial grievances require regional work."
 OT1_R_crisis_cabinet:0 "Cabinet Authority Crisis"
 OT1_R_crisis_cabinet_desc:0 "Ministers can no longer rely on their orders being carried out. Unless the cabinet restores its authority, disputes between offices will bring the government to a standstill."
 OT1_R_crisis_cabinet_resolve_tt:0 "Resolve at cabinet authority 35 or higher for 0 political power. Removes this 60-day crisis and starts a 180-day cooldown."
 OT1_R_crisis_province:0 "Provincial Confidence Crisis"
 OT1_R_crisis_province_desc:0 "Provincial representatives are losing faith in the promises made at Constantinople. The government must rebuild their confidence before local obstruction becomes open defiance."
 OT1_R_crisis_province_resolve_tt:0 "Resolve at provincial confidence 35 or higher for 0 political power. Removes this 60-day crisis and starts a 180-day cooldown."
 OT1_R_crisis_officers:0 "Officer Loyalty Crisis"
 OT1_R_crisis_officers_desc:0 "The loyalty of the officer corps can no longer be taken for granted. Senior commands must be reconciled with the government before military discontent turns into a political crisis."
 OT1_R_crisis_officers_resolve_tt:0 "Resolve at officer loyalty 35 or higher for 0 political power. Removes this 60-day crisis and starts a 180-day cooldown."
 OT1_R_retry_german:0 "Renew Talks with Berlin"
 OT1_R_retry_german_desc:0 "Our last approach to Berlin ended without agreement. Revised proposals may persuade the German government to reopen the negotiations."
 OT1_R_retry_straits:0 "Reopen the Straits Negotiations"
 OT1_R_retry_straits_desc:0 "The Straits remain a source of tension with our neighbours. A renewed conference may produce terms that protect our position while answering their concerns."
 OT1_R_retry_entente:0 "Renew the Entente Proposal"
 OT1_R_retry_entente_desc:0 "A fresh mission will seek an understanding with the Entente governments. Our envoys must discover whether their objections can be answered without surrendering our essential interests."
 OT1_R_retry_italian:0 "Reopen the Italian Accommodation"
 OT1_R_retry_italian_desc:0 "The last accommodation with Italy has failed to settle our differences. New talks may yet preserve commerce and spare the empire another confrontation."
 OT1_R_retry_balkan:0 "Renew the Balkan Settlement Talks"
 OT1_R_retry_balkan_desc:0 "The Balkan governments remain dissatisfied with the proposed settlement. Revised terms may give their representatives reason to return to the negotiating table."
 OT1_R_abort_programme:0 "Suspend the Current Government Programme"
 OT1_R_abort_programme_desc:0 "The current programme is drawing officials and funds away from more urgent business. Ministers should suspend the work and turn their attention to the immediate crisis."

 JP1_R_japanese_state_business:0 "Imperial Strategy and Administration"
 JP1_R_japanese_state_business_desc:0 "Japan's overseas commitments demand constant attention. The government must weigh foreign proposals, the administration of occupied territories and the strain on military supply."
 JP1_R_east_asian_league:0 "East Asian League"
 JP1_R_historical_plan:0 "Japan: Great War policy"
 JP1_R_historical_plan_desc:0 "Historical cabinet development, Entente cooperation and limited continental commitments before 1936."
 JP1_R_reopen_british_talks:0 "Reopen Talks with Britain"
 JP1_R_reopen_british_talks_desc:0 "London rejected our last proposal, but circumstances may have changed. A new mission should seek terms on which the British government is willing to negotiate."
 JP1_R_reopen_german_talks:0 "Reopen Talks with Germany"
 JP1_R_reopen_german_talks_desc:0 "A fresh approach to Berlin will test whether an understanding remains possible. Our envoys should explain Japan's interests and ask for concrete terms."
 JP1_R_reopen_chinese_talks:0 "Reopen the Chinese Concession Talks"
 JP1_R_reopen_chinese_talks_desc:0 "Railway and industrial concessions remain disputed. Revised terms should be presented to the government in Beijing in the hope of reaching an agreement."
 JP1_R_renew_siam_invitation:0 "Renew the Invitation to Siam"
 JP1_R_renew_siam_invitation_desc:0 "Siam declined our invitation to the league. A renewed approach may persuade its government that cooperation offers greater security than standing apart."
 JP1_R_request_far_eastern_peace:0 "Propose a Far Eastern Peace"
 JP1_R_request_far_eastern_peace_desc:0 "Our occupation of the principal Far Eastern positions gives us grounds to propose a limited peace. The opposing government must decide whether to accept those losses or continue the war."
 JP1_R_far_eastern_buffer:0 "Organise a Far Eastern Buffer"
 JP1_R_far_eastern_buffer_desc:0 "The Far Eastern settlement has left distant territories under Japanese administration. A dependent local government can assume their civil affairs while preserving our influence along the frontier."
 JP1_R_provincial_investment:0 "Invest in an Occupied Province"
 JP1_R_provincial_investment_desc:0 "Occupied provinces need functioning offices and dependable public services. Local investment can ease grievances and make the administration less dependent on coercion."
 JP1_R_colonial_transport:0 "Improve Colonial Transport"
 JP1_R_colonial_transport_desc:0 "Poor roads delay supplies and isolate officials from the districts they govern. Local contracts will improve the routes on which colonial administration and commerce depend."
 JP1_R_expeditionary_training:0 "Train Expeditionary Replacements"
 JP1_R_expeditionary_training_desc:0 "An overseas army needs trained replacements familiar with its methods and equipment. Instructors should prepare the next contingents before they embark."
 JP1_R_maritime_inspections:0 "Inspect Overseas Shipping"
 JP1_R_maritime_inspections_desc:0 "Escort schedules and port routines must be tested before an emergency exposes their weaknesses. Naval staffs will inspect the arrangements for Japan's overseas shipping."
