    #WW1

    send_lenin_decision: "Send Lenin to Russia"
    send_lenin_decision_desc: "We could send Lenin over to Russia, but this could cause revolutions in Russia that may in turn backfire on us.\n\n§RSending Lenin via decision or focus is needed to fire Brest-Litovsk!§!"
    puppet_poland_decision: "Create the Regency Kingdom of Poland"
    puppet_poland_decision_desc: "We should consolidate our control over the Polish territories by creating a state."
    request_polish_divisions: "Request Polish Divisions"
    request_polish_divisions_desc: "We should ask for manpower from Poland, now that we have \"liberated\" the Poles."
    russian_army_reform: "Russian Army Reform 1/3"
    russian_army_reform_desc: "This decision, §B after one month of being fired §!, will halve the debuff from the national spirit \"Poor Military Leadership\" "
    russian_army_more_reform: "Russian Army Reform 2/3"
    russian_army_more_reform_desc: "This decision will §B halve the debuff yet again after one month! §!"
    russian_army_final_reform: "Russian Army Reform 3/3"
    russian_army_final_reform_desc: "§G This decision will remove the \"Poor Military Leadership\" debuff after a month! §!"
    german_warplan_selection_schlieffen: "The Schlieffen plan"
    german_warplan_selection_schlieffen_desc: "The Schlieffen plan was the German warplan to invade Belgium."
    german_warplan_selection_kronprinz: "The Kronprinz plan"
    german_warplan_selection_kronprinz_desc: "This alternate-history warplan invades §Rneither Belgium or Switzerland§, in favor of invading only France and Russia. \n\n§GThis should delay the UK's entry to the war, until they decide to via focus.§!"
    german_warplan_selection_rupprecht: "The Rupprecht plan"
    german_warplan_selection_rupprecht_desc: "This alternate-history plan invades Switzerland, and is only reccomended if you want a challenge as Germany, or if France has built extensive fortifications on the Belgian border."

    form_saudi_arabia_category: "Unite Saudi Arabia"
    form_saudi_arabia_category_desc: "The region of Saudi Arabia has long been home to our enemies. It is time we show them our force and take control of our rightful homeland."
    form_saudi_arabia: "Form Saudi Arabia"

    form_transcaucasia_category: "Form Transcaucasia"
    form_transcaucasia_category_desc: "For multiple ages, the people of the Caucasus have had to suffer under oppressing regime. It is time to finally unite the region under one banner, and remove outside influences."
    form_transcaucasia: "Form Transcaucasia"

    #GERMANY
    ger_forify_berlin: "Fortify Berlin"
    ger_forify_berlin_desc: "The Soviets are at the gates of the capital of our great reich. We must make them bleed before it. Building a series of trenches in Berlin will hopefully hold the savage soviets back!"

    ww1_home_front_category: "The Home Front"
    ww1_home_front_category_desc: "The endurance of the civilian population is as important to victory as the strength of the armies at the front."
    ww1_strengthen_civilian_confidence: "Strengthen Civilian Confidence"
    ww1_strengthen_civilian_confidence_desc: "Fund public relief and reassure the population that the government can endure the hardships of war."
    ww1_mobilize_national_spirit: "Mobilize National Spirit"
    ww1_mobilize_national_spirit_desc: "Organize rallies and patriotic appeals to sustain public support for the war effort."

    ww1_mittelafrika_category: "Mittelafrika Administration"
    ww1_mittelafrika_category_desc: "Establish Mittelafrika and support its administration against resistance in the colonies."
    ww1_establish_mittelafrika: "Establish Mittelafrika"
    ww1_establish_mittelafrika_desc: "Over 180 days, place all German-owned African territories, including Madagascar, under a unified German puppet administration led by Wilhelm Solf."
    ww1_establish_mittelafrika_effect_tt: "All German-owned African states, including Madagascar, become part of Mittelafrika, a German puppet led by Wilhelm Solf. Germany relinquishes its claims to those states."
    ww1_expand_mittelafrika_constabulary: "Expand the Colonial Constabulary"
    ww1_expand_mittelafrika_constabulary_desc: "After 180 days, reduce resistance by 2 in one random non-core state of Mittelafrika with active resistance."
    ww1_mittelafrika_local_councils: "Negotiate with Local Councils"
    ww1_mittelafrika_local_councils_desc: "After 180 days, one random non-core state of Mittelafrika below 70 compliance gains 3 compliance and loses up to 2 resistance."
    ww1_mittelafrika_factory_investment: "Invest in Colonial Industry"
    ww1_mittelafrika_factory_investment_desc: "After 180 days, one random Mittelafrika state under its control gains one building slot and either one civilian or one military factory. The project can be repeated."
    ww1_mittelafrika_resource_survey: "Survey Colonial Resources"
    ww1_mittelafrika_resource_survey_desc: "After 180 days, one random Mittelafrika state under its control gains either two rubber or two steel resources. The survey can be repeated."

    ww1_german_east_asia_category: "German East Asia Administration"
    ww1_german_east_asia_category_desc: "Support German East Asia's administration and develop its industry and resources."
    ww1_expand_german_east_asia_constabulary: "Expand the Colonial Constabulary"
    ww1_expand_german_east_asia_constabulary_desc: "After 180 days, reduce resistance by 2 in one random non-core state of German East Asia with active resistance."
    ww1_german_east_asia_local_councils: "Negotiate with Local Councils"
    ww1_german_east_asia_local_councils_desc: "After 180 days, one random non-core state of German East Asia below 70 compliance gains 3 compliance and loses up to 2 resistance."
    ww1_german_east_asia_factory_investment: "Invest in Colonial Industry"
    ww1_german_east_asia_factory_investment_desc: "After 180 days, one random German East Asia state under its control gains one building slot and either one civilian or one military factory. The project can be repeated."
    ww1_german_east_asia_resource_survey: "Survey Colonial Resources"
    ww1_german_east_asia_resource_survey_desc: "After 180 days, one random German East Asia state under its control gains either two rubber or two steel resources. The survey can be repeated."

    ww1_postwar_settlement_category: "Post-War Settlement"
    ww1_postwar_settlement_category_desc: "The Armistice has ended the fighting. The terms of the final peace must now be imposed."
    ww1_treaty_of_versailles: "Treaty of Versailles"
    ww1_treaty_of_versailles_desc: "Signed on 28 June 1919, the Treaty of Versailles formally ended the war between Germany and the Allied Powers. Its territorial, military and financial provisions remade Germany's eastern and northern borders. Formal ratification takes 180 days and must be completed before the 360-day deadline."
    ww1_establish_weimar_republic: "Establish the Weimar Republic"
    ww1_establish_weimar_republic_desc: "The German Republic must adopt a durable constitutional identity before it can accept the final peace settlement. This transition takes 30 days."
    ww1_treaty_of_versailles_weimar_prerequisite_tt: "The Weimar Republic has been established"
    ww1_peace_treaty_due: "Peace Treaty Due"
    ww1_peace_treaty_due_desc: "The final peace settlement must be ratified within 360 days of the Armistice of Compiègne."

    ### Austria-Hungary WWI administration ###
    AUH_ww1_food_security: "Food Security"
 AUH_ww1_administration_status:0 "§YImperial Administration§!\nStability: §Y[?stability|%0]§! | Food security: §Y[?AUH_ww1_food_security|0]/100§!\nMonthly change: stability §Y[?AUH_ww1_stability_monthly_change|%+1]§!, food §Y[?AUH_ww1_food_monthly_change|+0]§!.\nWar costs 0.2 percentage points of stability and 2 food each month (1 food with the Hungarian grain agreement). Food below 20 costs another 0.3 percentage points; unresolved strikes and Cattaro unrest each cost another 0.2. At peace, stability recovers by 0.2 percentage points monthly only while below 50%."
    AUH_ww1_imperial_council_category: "The Imperial Council"
 AUH_ww1_imperial_council_category_desc:0 "Negotiate public grievances and regional representation. Only one council programme runs at a time.\n\n$AUH_ww1_administration_status$"
    AUH_ww1_home_front_category: "The Imperial Home Front"
 AUH_ww1_home_front_category_desc:0 "Coordinate food deliveries, relief services and the war-weary home front. Only one home-front programme runs at a time.\n\n$AUH_ww1_administration_status$"
 AUH_ww1_council_programme_ready_tt:0 "No other council programme is running"
 AUH_ww1_home_front_programme_ready_tt:0 "No other home front programme is running"
 AUH_ww1_measure_delayed_tt:0 "The programme costs political power now; its benefits arrive when the timer finishes."
 AUH_ww1_joint_delegations:0 "Convene the Joint Delegations"
 AUH_ww1_joint_delegations_desc:0 "The Austrian and Hungarian delegations can review common expenditure and settle administrative grievances. A 45-day conference raises stability by 2.5 percentage points and provides Provincial Consultation for 90 days."
 AUH_ww1_joint_delegations_result_tt:0 "The Austrian and Hungarian delegations can review common expenditure and settle administrative grievances. A 45-day conference raises stability by 2.5 percentage points and provides Provincial Consultation for 90 days."
 AUH_ww1_provincial_commissions:0 "Send Provincial Grievance Commissions"
 AUH_ww1_provincial_commissions_desc:0 "Officials and local representatives will investigate requisitions and irregular relief deliveries. A 60-day inquiry uses one civilian factory, improves food security by 2 and provides Civil Administration for 90 days."
 AUH_ww1_provincial_commissions_result_tt:0 "Officials and local representatives will investigate requisitions and irregular relief deliveries. A 60-day inquiry uses one civilian factory, improves food security by 2 and provides Civil Administration for 90 days."
 AUH_ww1_army_language_services:0 "Expand Army Language Services"
 AUH_ww1_army_language_services_desc:0 "Train interpreters and liaison officers over 45 days with one civilian factory. Practical communication in the common army provides 5 army experience and raises war support by 1 percentage point."
 AUH_ww1_army_language_services_result_tt:0 "Train interpreters and liaison officers over 45 days with one civilian factory. Practical communication in the common army provides 5 army experience and raises war support by 1 percentage point."
 AUH_ww1_local_welfare_committees:0 "Recognize Local Welfare Committees"
 AUH_ww1_local_welfare_committees_desc:0 "Provincial and parliamentary representatives can supervise relief purchasing. Establish the committees over 60 days with one civilian factory; food security rises by 4 and Parliamentary Scrutiny lasts 90 days."
 AUH_ww1_local_welfare_committees_result_tt:0 "Provincial and parliamentary representatives can supervise relief purchasing. Establish the committees over 60 days with one civilian factory; food security rises by 4 and Parliamentary Scrutiny lasts 90 days."
 AUH_ww1_imperial_press_directives:0 "Coordinate Imperial Press Directives"
 AUH_ww1_imperial_press_directives_desc:0 "Prepare common wartime press instructions over 30 days. The campaign raises war support by 4 percentage points and provides Imperial Censorship for 90 days, while political restrictions cost 1 percentage point of stability."
 AUH_ww1_imperial_press_directives_result_tt:0 "Prepare common wartime press instructions over 30 days. The campaign raises war support by 4 percentage points and provides Imperial Censorship for 90 days, while political restrictions cost 1 percentage point of stability."
 AUH_ww1_january_strike_settlement:0 "Negotiate the January Strike Settlement"
 AUH_ww1_january_strike_settlement_desc:0 "Meet workers' representatives for 30 days using two civilian factories. The negotiated settlement resolves the January strikes, raises stability by 4 percentage points and food security by 3, and provides Strike Concessions for 90 days."
 AUH_ww1_january_strike_settlement_result_tt:0 "Meet workers' representatives for 30 days using two civilian factories. The negotiated settlement resolves the January strikes, raises stability by 4 percentage points and food security by 3, and provides Strike Concessions for 90 days."
 AUH_ww1_grain_transport_priority:0 "Give Grain Trains Priority"
 AUH_ww1_grain_transport_priority_desc:0 "Reserve rolling stock and coordinate grain traffic for 45 days with two civilian factories. Completed deliveries raise food security by 8 and provide Food Distribution for 90 days."
 AUH_ww1_grain_transport_priority_result_tt:0 "Reserve rolling stock and coordinate grain traffic for 45 days with two civilian factories. Completed deliveries raise food security by 8 and provide Food Distribution for 90 days."
 AUH_ww1_civilian_kitchen_network:0 "Extend the Civilian Kitchen Network"
 AUH_ww1_civilian_kitchen_network_desc:0 "Equip municipal kitchens over 60 days with two civilian factories. Completed relief raises food security by 10 and stability by 1.5 percentage points; Civilian Kitchens lasts 120 days."
 AUH_ww1_civilian_kitchen_network_result_tt:0 "Equip municipal kitchens over 60 days with two civilian factories. Completed relief raises food security by 10 and stability by 1.5 percentage points; Civilian Kitchens lasts 120 days."
 AUH_ww1_urban_rationing:0 "Revise Urban Ration Schedules"
 AUH_ww1_urban_rationing_desc:0 "Reorganize ration cards over 30 days using one civilian factory. Tighter distribution conserves 6 food-security points and provides Food Distribution for 60 days, but restrictions cost 2 percentage points of stability."
 AUH_ww1_urban_rationing_result_tt:0 "Reorganize ration cards over 30 days using one civilian factory. Tighter distribution conserves 6 food-security points and provides Food Distribution for 60 days, but restrictions cost 2 percentage points of stability."
 AUH_ww1_municipal_food_inspections:0 "Inspect Municipal Food Stores"
 AUH_ww1_municipal_food_inspections_desc:0 "Inspect municipal stores, investigate diversion and repair ration records over 30 days with one civilian factory. Recovered supplies improve food security by 4."
 AUH_ww1_municipal_food_inspections_result_tt:0 "Inspect municipal stores, investigate diversion and repair ration records over 30 days with one civilian factory. Recovered supplies improve food security by 4."
 AUH_ww1_hungarian_grain_deliveries:0 "Arrange Hungarian Grain Deliveries"
 AUH_ww1_hungarian_grain_deliveries_desc:0 "Organize deliveries under the grain agreement over 60 days with one civilian factory. Shipments raise food security by 10, while renewed requisitions create resentment and cost 1 percentage point of stability."
 AUH_ww1_hungarian_grain_deliveries_result_tt:0 "Organize deliveries under the grain agreement over 60 days with one civilian factory. Shipments raise food security by 10, while renewed requisitions create resentment and cost 1 percentage point of stability."
 AUH_ww1_cattaro_crew_delegation:0 "Receive the Cattaro Crew Delegation"
 AUH_ww1_cattaro_crew_delegation_desc:0 "Assign one civilian factory to a 30-day inquiry into sailors' rations and command grievances. Negotiated concessions resolve Cattaro unrest, improve food security by 2, provide 5 navy experience and raise war support by 1 percentage point."
 AUH_ww1_cattaro_crew_delegation_result_tt:0 "Assign one civilian factory to a 30-day inquiry into sailors' rations and command grievances. Negotiated concessions resolve Cattaro unrest, improve food security by 2, provide 5 navy experience and raise war support by 1 percentage point."

    ### Italy WWI administration ###
 IT1_ww1_home_front_category:0 "Civilian Relief and Public Services"
 IT1_ww1_home_front_category_desc:0 "Fund civilian relief, public works and negotiated labour agreements. One home-front programme may run at a time. Each programme grants ordinary country bonuses when its work finishes."
 IT1_ww1_colonial_category:0 "Colonial Civil Administration"
 IT1_ww1_colonial_category_desc:0 "The Colonial Office can improve institutions and infrastructure in territories Italy owns and fully controls. One colonial programme may run at a time. A state selected at completion must still meet the programme's conditions."
 IT1_ww1_home_front_programme_ready_tt:0 "No other home-front programme is running"
 IT1_ww1_colonial_programme_ready_tt:0 "No other colonial programme is running"
 IT1_ww1_measure_delayed_tt:0 "The promised rewards take effect §Ywhen this programme finishes§!."
 IT1_ww1_grain_shipping_priority:0 "Give Grain Cargoes Shipping Priority"
 IT1_ww1_grain_shipping_priority_desc:0 "Reserve merchant capacity and coordinate port handling. The completed programme supports Rationing for 90 days.\n\nProgramme: §Y45 days§!. Cost: §Y45 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_grain_shipping_priority_result_tt:0 "On completion: §YRationing§! for §Y90 days§!."
 IT1_ww1_municipal_kitchen_network:0 "Equip the Municipal Kitchen Network"
 IT1_ww1_municipal_kitchen_network_desc:0 "Equip municipal kitchens, organise local deliveries and provide public works. The completed programme supports civilian reconstruction and reserve training for 120 days.\n\nProgramme: §Y60 days§!. Cost: §Y50 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_municipal_kitchen_network_result_tt:0 "On completion: §YVeteran Resettlement Programme§! for §Y120 days§!."
 IT1_ww1_urban_ration_cards:0 "Revise Urban Ration Cards"
 IT1_ww1_urban_ration_cards_desc:0 "Reissue ration cards and enforce equal distribution. The revision provides Rationing for 60 days.\n\nProgramme: §Y30 days§!. Cost: §Y35 political power§! and §Y1 civilian factory§! for the duration."
 IT1_ww1_urban_ration_cards_result_tt:0 "On completion: §YRationing§! for §Y60 days§!."
 IT1_ww1_seed_and_harvest_credit:0 "Advance Seed and Harvest Credit"
 IT1_ww1_seed_and_harvest_credit_desc:0 "Fund seed, agricultural transport and repairs to rural services. The completed programme supports infrastructure investment for 180 days.\n\nProgramme: §Y120 days§!. Cost: §Y60 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_seed_and_harvest_credit_result_tt:0 "On completion: §YColonial Investment§! for §Y180 days§!."
 IT1_ww1_market_inspections:0 "Inspect Municipal Food Markets"
 IT1_ww1_market_inspections_desc:0 "Inspect food stores, investigate diversion and reconcile municipal accounts. The completed inquiry improves factory routines through Published Wartime Accounts for 90 days.\n\nProgramme: §Y30 days§!. Cost: §Y35 political power§! and §Y1 civilian factory§! for the duration."
 IT1_ww1_market_inspections_result_tt:0 "On completion: §YPublished Wartime Accounts§! for §Y90 days§!."
 IT1_ww1_industrial_labor_settlement:0 "Negotiate an Industrial Labor Settlement"
 IT1_ww1_industrial_labor_settlement_desc:0 "Meet workers' delegates and employers to negotiate wages and workplace conditions. The resulting Strike Agreement lasts 90 days.\n\nProgramme: §Y45 days§!. Cost: §Y60 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_industrial_labor_settlement_result_tt:0 "On completion: §YStrike Agreement§! for §Y90 days§!."
 IT1_ww1_demobilization_offices:0 "Open Demobilization Assistance Offices"
 IT1_ww1_demobilization_offices_desc:0 "Arrange housing, registration and employment referrals for returning servicemen. If peace continues, the completed programme supports civilian reconstruction and reserve training for 120 days.\n\nProgramme: §Y60 days§!. Cost: §Y50 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_demobilization_offices_result_tt:0 "On completion: §YVeteran Resettlement Programme§! for §Y120 days§!."
 IT1_ww1_municipal_employment_grants:0 "Finance Municipal Employment Grants"
 IT1_ww1_municipal_employment_grants_desc:0 "Fund municipal maintenance and public works through supervised contracts. The completed programme provides Published Wartime Accounts for 180 days, improving factory routines at a modest civilian cost.\n\nProgramme: §Y90 days§!. Cost: §Y75 political power§! and §Y3 civilian factories§! for the duration."
 IT1_ww1_municipal_employment_grants_result_tt:0 "On completion: §YPublished Wartime Accounts§! for §Y180 days§!."
 IT1_ww1_parliamentary_mediation:0 "Sponsor Parliamentary Mediation"
 IT1_ww1_parliamentary_mediation_desc:0 "Bring parliamentary representatives, municipal leaders and trade delegates together. Their agreement provides a Mediation Mission for 90 days.\n\nProgramme: §Y30 days§!. Cost: §Y50 political power§! and §Y1 civilian factory§! for the duration."
 IT1_ww1_parliamentary_mediation_result_tt:0 "On completion: §YMediation Mission§! for §Y90 days§!."
 IT1_ww1_veterans_vocational_courses:0 "Arrange Veterans' Vocational Courses"
 IT1_ww1_veterans_vocational_courses_desc:0 "Organise vocational courses and military skills reviews for veterans. If peace continues, the courses provide 5 army experience.\n\nProgramme: §Y60 days§!. Cost: §Y60 political power§! and §Y2 civilian factories§! for the duration."
 IT1_ww1_veterans_vocational_courses_result_tt:0 "On completion: army experience §G+5§!."
 IT1_ww1_colonial_civil_census:0 "Conduct a Colonial Civil Census"
 IT1_ww1_colonial_civil_census_desc:0 "Register civil records and local property. One randomly selected eligible colony gains 3 compliance when the programme finishes.\n\nProgramme: §Y60 days§!. Cost: §Y50 political power§! and §Y1 civilian factory§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_civil_census_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_magistrates:0 "Train Local Magistrates and Interpreters"
 IT1_ww1_colonial_magistrates_desc:0 "Train local judicial staff and interpreters over 90 days using one civilian factory. One eligible colony gains 4 compliance and loses up to 2 resistance.\n\nProgramme: §Y90 days§!. Cost: §Y60 political power§! and §Y1 civilian factory§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_magistrates_result_tt:0 "On completion: one eligible colony gains §G4 compliance§! and loses up to §G2 resistance§!."
 IT1_ww1_colonial_health_services:0 "Support Local Health and Relief Services"
 IT1_ww1_colonial_health_services_desc:0 "Equip dispensaries and relief offices. One eligible colony gains 3 compliance when the programme finishes.\n\nProgramme: §Y90 days§!. Cost: §Y60 political power§! and §Y2 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_health_services_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_constabulary_training:0 "Train the Colonial Constabulary"
 IT1_ww1_colonial_constabulary_training_desc:0 "Train patrol officers and local recruits for 90 days using two civilian factories. One eligible colony loses up to 4 resistance and Colonial Constabulary lasts 120 days. The programme adds and does not create new combat divisions.\n\nProgramme: §Y90 days§!. Cost: §Y75 political power§! and §Y2 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_constabulary_training_result_tt:0 "On completion: one eligible colony loses up to §G4 resistance§!; §YColonial Constabulary§! for §Y120 days§!."
 IT1_ww1_colonial_road_contracts:0 "Award Local Road Contracts"
 IT1_ww1_colonial_road_contracts_desc:0 "Reserve three civilian factories for 120 days of local road construction. One eligible colony below infrastructure level 5 gains one level when work finishes. The contracts add \n\nProgramme: §Y120 days§!. Cost: §Y100 political power§! and §Y3 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_road_contracts_result_tt:0 "On completion: one eligible colony gains §G1 infrastructure level§! (maximum 5)."
 IT1_ww1_colonial_port_handling:0 "Improve Colonial Port Handling"
 IT1_ww1_colonial_port_handling_desc:0 "Improve cargo records, storage and labour arrangements at an existing port. One eligible colony gains 2 compliance, and Colonial Investment lasts 120 days.\n\nProgramme: §Y90 days§!. Cost: §Y75 political power§! and §Y2 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_port_handling_result_tt:0 "On completion: one eligible colony with an existing port gains §G2 compliance§!; §YColonial Investment§! for §Y120 days§!."
 IT1_ww1_colonial_irrigation_grants:0 "Finance Local Irrigation Grants"
 IT1_ww1_colonial_irrigation_grants_desc:0 "Support small irrigation works and local agricultural transport. One eligible colony gains 3 compliance when the programme finishes.\n\nProgramme: §Y120 days§!. Cost: §Y75 political power§! and §Y2 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_irrigation_grants_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!."
 IT1_ww1_colonial_apprenticeships:0 "Fund Colonial Technical Apprenticeships"
 IT1_ww1_colonial_apprenticeships_desc:0 "Train technical apprentices and administrative clerks. One eligible colony gains 3 compliance, and Colonial Investment lasts 120 days.\n\nProgramme: §Y90 days§!. Cost: §Y60 political power§! and §Y2 civilian factories§! for the duration. An eligible colonial state must remain owned and fully controlled when the programme finishes."
 IT1_ww1_colonial_apprenticeships_result_tt:0 "On completion: one eligible colony gains §G3 compliance§!; §YColonial Investment§! for §Y120 days§!."
 IT1_ww1_foreign_policy_category:0 "Italian Foreign Policy"
 IT1_ww1_foreign_policy_category_desc:0 "A refused offer need not end our diplomatic options. These missions cost 75political power and take 45days before a new proposal is sent. Only one foreign mission may run at a time. Acceptance is never guaranteed."
 IT1_ww1_diplomatic_programme_ready_tt:0 "No other Italian diplomatic mission is running."
 IT1_ww1_diplomatic_proposal_delayed_tt:0 "A new diplomatic proposal is sent when the 45-day mission finishes."
 IT1_ww1_retry_central_negotiation:0 "Reopen Talks with Berlin"
 IT1_ww1_retry_central_negotiation_desc:0 "Italy will pay for another approach to Berlin. A reply remains necessary, and an accepted rival commitment blocks the mission."
 IT1_ww1_retry_entente_negotiation:0 "Renew the Entente Negotiation"
 IT1_ww1_retry_entente_negotiation_desc:0 "A paid mission will reopen supply and intervention talks with France. The proposal remains subject to acceptance and existing neutrality commitments."
 IT1_ww1_retry_continental_negotiation:0 "Reconsider the Continental Concert"
 IT1_ww1_retry_continental_negotiation_desc:0 "A funded conference permits another French proposal or an independent Mediterranean compact. Existing factions and foreign consent remain decisive."
 IT1_ww1_retry_ottoman_negotiation:0 "Reopen Ottoman Commercial Talks"
 IT1_ww1_retry_ottoman_negotiation_desc:0 "The government will reopen the colonial concession talks after a refusal. The mission does not transfer Libyan territory or force the Ottoman government to accept."
 IT1_ww1_retry_senussi_negotiation:0 "Revise the Senussi Terms"
 IT1_ww1_retry_senussi_negotiation_desc:0 "A paid mission will reconsider local administrative terms. An existing Senussi state retains the right to reject the agreement; the programme never recreates an annexed country."
 IT1_ww1_retry_adriatic_negotiation:0 "Reopen the Adriatic Conference"
 IT1_ww1_retry_adriatic_negotiation_desc:0 "The ministry will seek revised guarantees from Vienna. Agreement requires Austrian consent and no current war between the negotiating countries."
 AUH_ww1_stability_administration_category:0 "Civil Administration and Stability"
 AUH_ww1_stability_administration_category_desc:0 "Fund paid, timed civil programmes, technical education and public services. Native stability determines institutional strain; no debt or cohesion counter is used.\n\n$AUH_ww1_administration_status$"
 AUH_ww1_stability_programme_ready_tt:0 "No other stability programme is running"
 AUH_ww1_regional_representative_panels:0 "Seat Regional Representative Panels"
 AUH_ww1_regional_representative_panels_desc:0 "Assemble local representative panels over 60 days with one civilian factory. One randomly selected owned, fully controlled non-core state below 90 compliance gains 3 compliance; Provincial Consultation lasts 120 days."
 AUH_ww1_regional_representative_panels_result_tt:0 "Assemble local representative panels over 60 days with one civilian factory. One randomly selected owned, fully controlled non-core state below 90 compliance gains 3 compliance; Provincial Consultation lasts 120 days."
 AUH_ww1_provincial_police_training:0 "Reform Provincial Police Training"
 AUH_ww1_provincial_police_training_desc:0 "Train provincial police and translators over 60 days using one civilian factory. One owned and fully controlled non-core state loses up to 3 resistance. Local Police Reform lasts 120 days."
 AUH_ww1_provincial_police_training_result_tt:0 "Train provincial police and translators over 60 days using one civilian factory. One owned and fully controlled non-core state loses up to 3 resistance. Local Police Reform lasts 120 days."
 AUH_ww1_parliamentary_question_days:0 "Reserve Parliamentary Question Days"
 AUH_ww1_parliamentary_question_days_desc:0 "Set aside 45 days for questions on requisitions and civil administration. Public scrutiny raises stability by 2 percentage points and provides Parliamentary Scrutiny for 90 days, while exposing wartime grievances costs 1 percentage point of war support."
 AUH_ww1_parliamentary_question_days_result_tt:0 "Set aside 45 days for questions on requisitions and civil administration. Public scrutiny raises stability by 2 percentage points and provides Parliamentary Scrutiny for 90 days, while exposing wartime grievances costs 1 percentage point of war support."
 AUH_ww1_seed_and_harvest_supplies:0 "Purchase Seed and Harvest Supplies"
 AUH_ww1_seed_and_harvest_supplies_desc:0 "Purchase seed, repair tools and organize agricultural transport through a 120-day programme using two civilian factories. The completed harvest raises food security by 15."
 AUH_ww1_seed_and_harvest_supplies_result_tt:0 "Purchase seed, repair tools and organize agricultural transport through a 120-day programme using two civilian factories. The completed harvest raises food security by 15."
 AUH_ww1_refugee_registration_offices:0 "Open Refugee Registration Offices"
 AUH_ww1_refugee_registration_offices_desc:0 "Coordinate refugee registration, housing and ration access over 60 days with two civilian factories. The offices improve food security by 3 and stability by 2 percentage points, then provide Civil Administration for 120 days."
 AUH_ww1_refugee_registration_offices_result_tt:0 "Coordinate refugee registration, housing and ration access over 60 days with two civilian factories. The offices improve food security by 3 and stability by 2 percentage points, then provide Civil Administration for 120 days."
 AUH_ww1_municipal_health_services:0 "Restore Municipal Health Services"
 AUH_ww1_municipal_health_services_desc:0 "Repair dispensaries, sanitation and relief facilities over 90 days with two civilian factories. Health provision improves food security by 4 and provides Public Works for 90 days."
 AUH_ww1_municipal_health_services_result_tt:0 "Repair dispensaries, sanitation and relief facilities over 90 days with two civilian factories. Health provision improves food security by 4 and provides Public Works for 90 days."
 AUH_ww1_civilian_bulk_purchasing:0 "Coordinate Civilian Bulk Purchasing"
 AUH_ww1_civilian_bulk_purchasing_desc:0 "Consolidate municipal food orders over 60 days using two civilian factories. Better purchasing and distribution raise food security by 5 and provide Food Distribution for 60 days."
 AUH_ww1_civilian_bulk_purchasing_result_tt:0 "Consolidate municipal food orders over 60 days using two civilian factories. Better purchasing and distribution raise food security by 5 and provide Food Distribution for 60 days."
 AUH_ww1_civil_register_reorganization:0 "Reorganize the Civil Registers"
 AUH_ww1_civil_register_reorganization_desc:0 "Reconcile provincial registers, permits and civil-service responsibilities over 60 days with one civilian factory. The completed work provides Civil Administration for 120 days."
 AUH_ww1_civil_register_reorganization_result_tt:0 "Reconcile provincial registers, permits and civil-service responsibilities over 60 days with one civilian factory. The completed work provides Civil Administration for 120 days."
 AUH_ww1_technical_school_courses:0 "Equip Technical School Courses"
 AUH_ww1_technical_school_courses_desc:0 "Equip technical schools and common-language training over 90 days using two civilian factories. The courses provide one 25% electronics research bonus and Provincial Consultation for 60 days. This curriculum programme is undertaken once."
 AUH_ww1_technical_school_courses_result_tt:0 "Equip technical schools and common-language training over 90 days using two civilian factories. The courses provide one 25% electronics research bonus and Provincial Consultation for 60 days. This curriculum programme is undertaken once."
 AUH_ww1_technical_schools_bonus:0 "Equip Technical School Courses Research"
 AUH_ww1_local_road_contracts:0 "Award Local Road Contracts"
 AUH_ww1_local_road_contracts_desc:0 "Reserve three civilian factories for 120 days of road construction. One randomly selected owned and fully controlled state below infrastructure level 5 gains one infrastructure level when the work finishes."
 AUH_ww1_local_road_contracts_result_tt:0 "Reserve three civilian factories for 120 days of road construction. One randomly selected owned and fully controlled state below infrastructure level 5 gains one infrastructure level when the work finishes."
 AUH_ww1_administrative_budget_review:0 "Review Administrative Expenditure"
 AUH_ww1_administrative_budget_review_desc:0 "Review common procurement and public-service obligations for 45 days using one civilian factory. The examination provides Parliamentary Scrutiny for 120 days and 3 army experience from reviewing military purchasing."
 AUH_ww1_administrative_budget_review_result_tt:0 "Review common procurement and public-service obligations for 45 days using one civilian factory. The examination provides Parliamentary Scrutiny for 120 days and 3 army experience from reviewing military purchasing."
 AUH_ww1_civil_service_procurement:0 "Standardize Civil-Service Procurement"
 AUH_ww1_civil_service_procurement_desc:0 "Prepare common purchasing specifications over 90 days using two civilian factories. The completed programme gives one 25% industry research bonus and Civil Administration for 90 days. The shared specifications are introduced once."
 AUH_ww1_civil_service_procurement_result_tt:0 "Prepare common purchasing specifications over 90 days using two civilian factories. The completed programme gives one 25% industry research bonus and Civil Administration for 90 days. The shared specifications are introduced once."
 AUH_ww1_procurement_bonus:0 "Standardize Civil-Service Procurement Research"
 AUH_ww1_municipal_service_reconstruction:0 "Rebuild Municipal Public Services"
 AUH_ww1_municipal_service_reconstruction_desc:0 "Reserve three civilian factories for 90 days of municipal repairs and public-service restoration. If peace continues, the programme raises stability by 1 percentage point and provides Public Works for 120 days."
 AUH_ww1_municipal_service_reconstruction_result_tt:0 "Reserve three civilian factories for 90 days of municipal repairs and public-service restoration. If peace continues, the programme raises stability by 1 percentage point and provides Public Works for 120 days."
 AUH_ww1_food_warehouse_repairs:0 "Repair Public Food Warehouses"
 AUH_ww1_food_warehouse_repairs_desc:0 "Rebuild municipal storage and loading facilities over 90 days using two civilian factories. Restored civilian stocks improve food security by 6 and provide Public Works for 90 days; allocating capacity away from the war effort costs 1 percentage point of war support."
 AUH_ww1_food_warehouse_repairs_result_tt:0 "Rebuild municipal storage and loading facilities over 90 days using two civilian factories. Restored civilian stocks improve food security by 6 and provide Public Works for 90 days; allocating capacity away from the war effort costs 1 percentage point of war support."
 AUH_ww1_demobilized_labor_offices:0 "Organize Demobilized Labor Offices"
 AUH_ww1_demobilized_labor_offices_desc:0 "Arrange civilian employment and ration registration for returning soldiers over 60 days with two civilian factories. If peace continues, stability rises by 2 percentage points and food security by 2; the civilian transition reduces war support by 2 percentage points."
 AUH_ww1_demobilized_labor_offices_result_tt:0 "Arrange civilian employment and ration registration for returning soldiers over 60 days with two civilian factories. If peace continues, stability rises by 2 percentage points and food security by 2; the civilian transition reduces war support by 2 percentage points."
 AUH_ww1_industrial_liaison_offices:0 "Staff the Industrial Liaison Offices"
 AUH_ww1_industrial_liaison_offices_desc:0 "Coordinate firms, army purchasers and provincial works departments over 60 days with two civilian factories. The completed liaison service provides 5 army experience and Public Works for 120 days."
 AUH_ww1_industrial_liaison_offices_result_tt:0 "Coordinate firms, army purchasers and provincial works departments over 60 days with two civilian factories. The completed liaison service provides 5 army experience and Public Works for 120 days."
 AUH_ww1_bohemian_negotiations_retry:0 "Reopen Bohemian Negotiations"
 AUH_ww1_bohemian_negotiations_retry_desc:0 "Pay 25 political power to arrange a new hearing over 30 days. The delegates then vote again; all consent, stability, ownership and peace requirements still apply."
