l_english:
 ww1_early_campaigns.1.t:0 "The Garrisons in Tibet"
 ww1_early_campaigns.1.d:0 "Disorder in China has left our troops in Tibet dependent on uncertain supplies and divided commands. The authorities in Lhasa demand the withdrawal of the remaining garrisons. An agreement would bring our soldiers home, though it would leave the Tibetan government in control of the plateau."
 ww1_early_campaigns.1.a:0 "Bring the garrisons home."
 ww1_early_campaigns.1.b:0 "The frontier must be held."
 ww1_early_campaigns.2.t:0 "Tibetan Rule Restored"
 ww1_early_campaigns.2.d:0 "The remaining Chinese garrisons have agreed to withdraw. Authority in Lhasa rests with the Tibetan government once again, and the immediate danger of an advance from China has passed. The eastern frontier remains disputed, but for now our soldiers can return to guarding the plateau."
 ww1_early_campaigns.2.a:0 "Tibet will govern its own affairs."
 ww1_early_campaigns.3.t:0 "The Demands from Lhasa"
 ww1_early_campaigns.3.d:0 "The fall of the imperial government has left our authority over Tibet uncertain. The authorities in Lhasa demand the withdrawal of Chinese officials and troops, and insist on governing their own affairs. An agreement would spare us another frontier war, but accepting it would leave the plateau beyond our control."
 ww1_early_campaigns.3.a:0 "We must settle our differences peacefully."
 ww1_early_campaigns.3.b:0 "The republic will uphold its authority."
 ww1_early_campaigns.4.t:0 "The Fall of the Qing Government"
 ww1_early_campaigns.4.d:0 "The imperial government can no longer command the provinces or sustain its armies. Officials and officers now look to the republic for instructions. The overthrow of the dynasty has opened the way to a new government, but bringing its scattered administrations under a common authority will test the promises made during the revolution."
 ww1_early_campaigns.4.a:0 "The republic must unite the country."
