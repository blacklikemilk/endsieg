l_english:
 ww1_early_campaigns.1.t:0 "The Garrisons in Tibet"
 ww1_early_campaigns.1.d:0 "Our troops in Tibet are isolated, and the authorities in Lhasa have secured the city. The government must decide whether to withdraw the remaining garrisons and accept Tibetan control or continue a costly struggle across the plateau."
 ww1_early_campaigns.1.a:0 "Bring our soldiers home."
 ww1_early_campaigns.1.b:0 "We will hold the frontier."
 ww1_early_campaigns.2.t:0 "The Authorities in Lhasa"
 ww1_early_campaigns.2.d:0 "The immediate struggle with China has ended, and the authorities in Lhasa can turn to the administration of the plateau. The frontier remains disputed, but for the moment Tibet governs its own affairs."
 ww1_early_campaigns.2.a:0 "Tibet will govern itself."
 ww1_early_campaigns.3.t:0 "Demands from Lhasa"
 ww1_early_campaigns.3.d:0 "The fall of the Qing has unsettled the administration of Tibet. The authorities in Lhasa demand the withdrawal of Chinese officials and insist on governing the plateau themselves.\n\nWe can accept their position or attempt to enforce the republic’s authority, risking another war while our government is still finding its feet."
 ww1_early_campaigns.3.a:0 "Come to terms with Lhasa."
 ww1_early_campaigns.3.b:0 "The republic must assert its authority."
 ww1_early_campaigns.4.t:0 "A Republic in Beijing"
 ww1_early_campaigns.4.d:0 "The Qing government has fallen and Beijing is in republican hands. The dynasty’s former officials and the provincial authorities must now decide how they will serve the new state.\n\nWinning the revolution was only the beginning; bringing its scattered governments together will be a task of its own."
 ww1_early_campaigns.4.a:0 "The republic must unite the country."