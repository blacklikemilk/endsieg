l_english:
 MEX_WW1_telegram_council:0 "The German Proposal"
 MEX_WW1_telegram_council_desc:0 "The German minister has placed a conditional alliance before the government. Before answering, the General Staff must examine the balance of forces, the means of obtaining supplies and the obligations that would follow from a convention. An offer is not a commitment; the final decision rests with the Mexican government."
 MEX_WW1_ZT_general_staff_assessment:0 "The General Staff Examines the Proposal"
 MEX_WW1_ZT_general_staff_assessment_desc:0 "The commission is reviewing the frontier, available reserves, German deliveries and the likely cost of a war with the United States. Its report will give the council a basis on which to judge the promises in the telegram."
 MEX_WW1_ZT_assessment_unlock_tt:0 "The General Staff begins a 35-day examination of the German proposal."
 MEX_WW1_ZT_offer_ready_tt:0 "The German proposal has reached the Foreign Secretariat."
 MEX_WW1_ZT_report_ready_tt:0 "The General Staff report has been considered, or the proposal has been withdrawn."
 MEX_WW1_ZT_guarantees_ready_tt:0 "The military report has been considered and Mexico remains free to request guarantees from a valid German government."
 MEX_WW1_ZT_terms_ready_tt:0 "Germany has confirmed the requested terms and Mexico remains free to ratify the convention."
 MEX_WW1_ZT_german_cost_tt:0 "Germany must provide 50 Political Power and transfer 1,000 Infantry Equipment from its existing stockpile."
 MEX_WW1_ZT_no_automatic_entry_tt:0 "The proposal may be negotiated, but only ratification through the national focus tree can commit Mexico to the alliance."
 MEX_WW1_ZT_neutral_exit_tt:0 "The report has been considered, the proposal is no longer valid, or no proposal has arrived by June 1917."
 MEX_WW1_ZT_public_assurance:0 "Mexican Assurance of Neutrality"
 MEX_WW1_ZT_evasive_reply:0 "An Unsatisfactory Reply"
 MEX_WW1_ZT_atlantic_reply:0 "Mexico Confirms Its Atlantic Convention"
 mex_ww1_telegram.1.t:0 "A Telegram from Berlin"
 mex_ww1_telegram.1.a:0 "The proposal must be examined."
 mex_ww1_telegram.2.t:0 "The Army Gives Its Assessment"
 mex_ww1_telegram.2.withdrawn.d:0 "The commission has completed its review, but events have overtaken its work. The circumstances that made a German agreement possible have changed, and the proposal can no longer be pursued on its original terms. The report will remain with the government as it considers Mexico’s place in the world."
 mex_ww1_telegram.2.active.d:0 "The officers have considered the frontier, our army’s condition and the supplies Germany might provide. They warn that the United States could bring far greater resources to bear, while aid promised from across the Atlantic might never reach us. Holding any territory gained would require men and money the republic can scarcely spare.\n\nThe ministers must now decide whether to ask Berlin for firmer terms or leave the matter there."
 mex_ww1_telegram.2.a:0 "Their objections deserve consideration."
 mex_ww1_telegram.3.t:0 "Mexico Asks for Guarantees"
 mex_ww1_telegram.3.a:0 "Send the arms and confirm our undertaking."
 mex_ww1_telegram.3.b:0 "We cannot spare what they ask."
 mex_ww1_telegram.4.t:0 "The German Reply"
 mex_ww1_telegram.4.accepted.d:0 "Berlin has agreed to the terms requested by our government and released a first consignment of rifles from its own stores. German assurances now have some weight behind them, though the distance between our countries will continue to make further deliveries uncertain.\n\nThe question of an agreement remains before the government."
 mex_ww1_telegram.4.refused.d:0 "Our representatives report that Berlin will not provide the guarantees requested by the government. The Germans ask us to contemplate a formidable enemy while offering little that can reach our army. Ministers must decide whether there is any advantage in continuing the discussions."
 mex_ww1_telegram.4.a:0 "We will consider the agreement."
 mex_ww1_telegram.4.b:0 "We need more than promises."
 mex_ww1_telegram.5.t:0 "Mexico Declines the Proposal"
 mex_ww1_telegram.5.d:0 "The German minister has been informed that Mexico cannot accept the proposal from Berlin. Our army’s assessment and the uncertain prospect of assistance have weighed against the attraction of the German offer. The government will pursue its own interests without taking on Germany’s commitments."
 mex_ww1_telegram.5.a:0 "Mexico must attend to its own affairs."
 mex_ww1_telegram.6.t:0 "The German Proposal Lapses"
 mex_ww1_telegram.6.d:0 "The conditions under which Berlin made its proposal no longer hold, and the negotiations have come to an end without an agreement. The ministers must now consider Mexico’s policy in light of the changed circumstances."
 mex_ww1_telegram.6.a:0 "We must choose our own course."
 mex_ww1_telegram.10.t:0 "Mexico and the German Proposal"
 mex_ww1_telegram.10.a:0 "Ask Mexico City for an explanation."
 mex_ww1_telegram.10.b:0 "Our quarrel is with Berlin."
 mex_ww1_telegram.11.t:0 "An Inquiry from Washington"
 mex_ww1_telegram.11.d:0 "The United States has asked the Foreign Secretariat to state Mexico’s position on the German proposal. Washington wishes to know whether our government has entered into any understanding with Berlin. The reply will be read closely on both sides of the frontier."
 mex_ww1_telegram.11.a:0 "We have chosen neutrality."
 mex_ww1_telegram.11.b:0 "We have signed no agreement with Germany."
 mex_ww1_telegram.11.c:0 "We are aligned with France."
 mex_ww1_telegram.11.e:0 "Our foreign policy is our own affair."
 mex_ww1_telegram.12.t:0 "The Mexican Reply"
 mex_ww1_telegram.12.neutral.d:0 "Mexico City has informed us that it declined the German offer and intends to remain neutral. The assurance should ease fears along the frontier, although Mexico has made no commitment to support our own policy."
 mex_ww1_telegram.12.unsigned.d:0 "The Mexican government states that it has signed no military agreement with Germany. The answer leaves open the possibility of further discussions, but gives us no grounds to claim that Berlin has secured an ally on our border."
 mex_ww1_telegram.12.atlantic.d:0 "Mexico City points to its alignment with France in reply to our inquiry. Whatever Germany hoped to gain from its proposal, the Mexican government has chosen a different course."
 mex_ww1_telegram.12.defiant.d:0 "Mexico has refused to offer the assurance requested by Washington, asserting its right to conduct its own foreign relations. The reply falls short of confirming an agreement with Berlin, but it will do little to quiet concern along the border."
 mex_ww1_telegram.12.a:0 "The reply has been received."
 mex_ww1_telegram.12.b:0 "The frontier must be watched."
 mex_ww1_telegram.200.t:0 "The Zimmermann Telegram"
 mex_ww1_telegram.200.a:0 "A dangerous proposal."
 mex_ww1_telegram.1.peace.d:0 "The German minister has presented a confidential proposal from Berlin. Should Germany and the United States go to war, Mexico is invited to join Germany in return for financial assistance and support for recovering former Mexican territories.\n\nThe territories named in the message stir old ambitions, but any agreement would bring us into conflict with a powerful neighbour. The cabinet must weigh the offer carefully."
 mex_ww1_telegram.1.war.d:0 "With Germany and the United States already at war, the German minister has presented a confidential proposal from Berlin. Germany seeks a Mexican ally and offers financial assistance and support for recovering former Mexican territories.\n\nThe opportunity is considerable, but so is the danger of fighting a powerful neighbour. The cabinet must weigh the offer carefully."
 mex_ww1_telegram.3.peace.d:0 "Mexico has answered our proposal with a request for arms and more definite guarantees. A first delivery of rifles would demonstrate that our promises have substance, though it would draw upon stores needed by our own army. If the Americans enter the war, Mexican cooperation could open another front against them."
 mex_ww1_telegram.3.war.d:0 "Mexico has answered our proposal with a request for arms and more definite guarantees. A first delivery of rifles would draw upon stores needed by our own army, but a Mexican partner could oblige the Americans to defend their southern frontier while they fight us elsewhere."
 mex_ww1_telegram.10.peace.d:0 "The publication of Germany’s message has caused outrage across the United States. Berlin has proposed that Mexico attack us should war break out, but the telegram gives no certain answer as to Mexico City’s intentions. The government must decide whether to seek an explanation from our southern neighbour."
 mex_ww1_telegram.10.war.d:0 "A German proposal for an alliance with Mexico has become public while our countries are at war. The message offers Mexican leaders financial assistance, but its publication does not establish what Mexico has agreed to do. Washington must decide whether to seek an explanation."
 mex_ww1_telegram.200.german.d:0 "A confidential German proposal to Mexico has become public. Berlin offered financial support and proposed an alliance against the United States. Mexico has since aligned itself with Germany, giving the disclosure particular weight throughout the Americas."
 mex_ww1_telegram.200.entente.d:0 "A confidential German proposal to Mexico has become public. Berlin offered financial support and proposed an alliance against the United States. Mexico has since aligned itself with France, leaving little doubt that the German overture failed to secure its intended partner."
 mex_ww1_telegram.200.rejected.d:0 "A confidential German proposal to Mexico has become public. Berlin offered financial support and proposed an alliance against the United States. Mexico has declined the proposal, but the disclosure has nevertheless caused an international controversy."
 mex_ww1_telegram.200.pending.d:0 "A confidential German proposal to Mexico has become public. Berlin offered financial support and proposed an alliance against the United States. The disclosure has caused an international controversy, while Mexico’s intentions remain a matter of speculation."
 mex_ww1_telegram.1.frontier.d:0 "The German minister has delivered a confidential proposal from Berlin. Germany asks Mexico to cooperate against the United States and offers financial assistance in return. Our government already controls Texas, New Mexico and Arizona, so the value of any agreement would rest on the assistance Berlin can actually provide.\n\nThe cabinet must consider whether a distant partner can help Mexico defend its interests. It would be a decision with consequences for the entire frontier."
 mex_ww1_telegram.1.usa_absent.d:0 "The German minister has presented a confidential proposal for closer cooperation between Mexico and Berlin. Germany offers financial assistance in return for an agreement, but the disappearance of the United States has transformed the position on our northern frontier. The cabinet must decide what value a distant partner can offer in these new circumstances."
 mex_ww1_telegram.3.usa_absent.d:0 "Mexico has asked for arms and firmer guarantees in return for cooperation. With the United States no longer a power on the northern frontier, the calculations behind our original approach have changed. We must decide whether securing a partner in the Americas is still worth a commitment of German equipment."
 mex_ww1_telegram.200.no_us.d:0 "A confidential exchange between Berlin and Mexico City has become public. Germany offered financial support and proposed closer cooperation, but the collapse of the United States has changed the balance of power in North America. Governments across the world are watching to see what comes of the German approach."
