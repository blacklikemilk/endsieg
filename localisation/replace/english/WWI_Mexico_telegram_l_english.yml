l_english:
 MEX_WW1_telegram_council:0 "The German Proposal"
 MEX_WW1_telegram_council_desc:0 "The German minister has placed a conditional alliance before the government. Before answering, the General Staff must examine the balance of forces, the means of obtaining supplies and the obligations that would follow from a convention. An offer is not a commitment; the final decision rests with the Mexican government."
 MEX_WW1_ZT_general_staff_assessment:0 "The General Staff Examines the Proposal"
 MEX_WW1_ZT_general_staff_assessment_desc:0 "The commission is reviewing the frontier, available reserves, German deliveries and the likely cost of a war with the United States. Its report will give the council a basis on which to judge the promises in the telegram."
 MEX_WW1_ZT_assessment_unlock_tt:0 "The General Staff begins a 35-day examination of the German proposal."
 MEX_WW1_ZT_offer_ready_tt:0 "The German proposal has reached the Foreign Secretariat."
 MEX_WW1_ZT_report_ready_tt:0 "The General Staff report has been considered, or the proposal has been withdrawn."
 MEX_WW1_ZT_guarantees_ready_tt:0 "The military report has been considered and Mexico remains free to request guarantees from a valid German government."
 MEX_WW1_ZT_terms_ready_tt:0 "Germany has confirmed the requested terms and Mexico remains free to ratify the convention."
 MEX_WW1_ZT_german_cost_tt:0 "Germany must provide 50 Political Power and transfer 1,000 Infantry Equipment from its existing stockpile."
 MEX_WW1_ZT_no_automatic_entry_tt:0 "The proposal may be negotiated, but only ratification through the national focus tree can commit Mexico to the alliance."
 MEX_WW1_ZT_neutral_exit_tt:0 "The report has been considered, the proposal is no longer valid, or no proposal has arrived by June 1917."
 MEX_WW1_ZT_public_assurance:0 "Mexican Assurance of Neutrality"
 MEX_WW1_ZT_evasive_reply:0 "An Unsatisfactory Reply"
 MEX_WW1_ZT_atlantic_reply:0 "Mexico Confirms Its Atlantic Convention"
 mex_ww1_telegram.1.t:0 "A Message from von Eckardt"
 mex_ww1_telegram.1.d:0 "The German minister has delivered a confidential proposal from Berlin. If Germany and the United States enter the same war, Mexico is asked to become Germany’s ally. Financial assistance and recognition of Mexican claims to Texas, New Mexico and Arizona are offered in return. The promises are considerable, but so are the obligations. The government must decide what the republic could undertake before it sends an answer."
 mex_ww1_telegram.1.a:0 "Put the proposal before the council."
 mex_ww1_telegram.2.t:0 "The General Staff Reports"
 mex_ww1_telegram.2.withdrawn.d:0 "The circumstances on which the German proposal depended have changed. The staff has preserved its papers, but there is no longer a convention that the government can safely negotiate on the original terms. Mexico remains free to settle its own foreign policy."
 mex_ww1_telegram.2.active.d:0 "The commission has examined the frontier, our reserves and the prospect of obtaining foreign supplies. Its officers warn that American strength exceeds our own, while German credit would not by itself place rifles and ammunition in Mexican hands. Even a successful advance would leave the army responsible for extensive territories and an armed population. The report does not remove the government’s choice, but it makes the cost of the proposal plain."
 mex_ww1_telegram.2.a:0 "Promises must be measured against these findings."
 mex_ww1_telegram.3.t:0 "Mexico Requests Firm Guarantees"
 mex_ww1_telegram.3.d:0 "The Mexican government has replied that the proposed alliance cannot rest on promises alone. It requests a firm initial delivery of infantry equipment, support for the negotiations and confirmation that the convention will respect Mexico’s decisions. Meeting the request would divert equipment and political attention from Germany’s own war. Refusal would leave Mexico free to reaffirm neutrality."
 mex_ww1_telegram.3.a:0 "Provide the equipment and confirm the terms."
 mex_ww1_telegram.3.b:0 "We cannot divert the necessary resources."
 mex_ww1_telegram.4.t:0 "Berlin Answers"
 mex_ww1_telegram.4.accepted.d:0 "Berlin has confirmed the requested terms and released the first equipment from German stocks. The government now has something more substantial than a promise to examine. No alliance has yet been ratified: that decision, and any decision to enter the American war, remain Mexico’s to make."
 mex_ww1_telegram.4.refused.d:0 "Berlin will not provide the guarantees requested by the council. Its own war has placed limits on the equipment and attention it can spare. The proposal has therefore failed to acquire the practical foundation our representatives demanded. Mexico can renew the negotiations later or settle upon neutrality."
 mex_ww1_telegram.4.a:0 "The convention can now be put to a decision."
 mex_ww1_telegram.4.b:0 "We will not bind the republic to an unsupported promise."
 mex_ww1_telegram.5.t:0 "Mexico Reaffirms Neutrality"
 mex_ww1_telegram.5.d:0 "The government has rejected the German proposal. The staff’s conclusions, the condition of the republic and the uncertainty of the promised assistance have weighed more heavily than the territories named in the telegram. Mexico will preserve its independence and defend its jurisdiction without undertaking another power’s war."
 mex_ww1_telegram.5.a:0 "The republic has its own work to complete."
 mex_ww1_telegram.6.t:0 "The Proposal Falls Away"
 mex_ww1_telegram.6.d:0 "The circumstances surrounding the German proposal have changed before a convention could be secured. The council’s work has been retained, but the negotiations cannot proceed on the former basis. No alliance has been entered and no war has been undertaken. Mexico must determine its policy in the world that now exists."
 mex_ww1_telegram.6.a:0 "We remain responsible for our own course."
 mex_ww1_telegram.10.t:0 "A Question for Mexico"
 mex_ww1_telegram.10.d:0 "The publication of Germany’s proposal has raised a further question: what answer did Mexico give? The telegram itself establishes what Berlin sought, rather than proving that Mexico accepted. An explanation from the Mexican government could remove uncertainty before events on the frontier make it more dangerous."
 mex_ww1_telegram.10.a:0 "Ask Mexico to state its position."
 mex_ww1_telegram.10.b:0 "Our immediate reply concerns Berlin."
 mex_ww1_telegram.11.t:0 "Washington Requests an Explanation"
 mex_ww1_telegram.11.d:0 "The American government has asked the Foreign Secretariat to explain Mexico’s position on the German proposal. Its note distinguishes between an offer and an agreement, but warns that uncertainty could have serious consequences. The reply must state what the government has actually undertaken."
 mex_ww1_telegram.11.a:0 "State that Mexico has reaffirmed neutrality."
 mex_ww1_telegram.11.b:0 "No military undertaking has been signed."
 mex_ww1_telegram.11.c:0 "Our Atlantic convention makes our position clear."
 mex_ww1_telegram.11.e:0 "Mexico will answer no foreign ultimatum."
 mex_ww1_telegram.12.t:0 "Mexico’s Reply"
 mex_ww1_telegram.12.neutral.d:0 "Mexico has stated that it rejected Germany’s proposal and intends to remain neutral. The reply gives no undertaking to join our own alliance, but it distinguishes the Mexican government’s policy from the ambitions expressed in Berlin’s telegram."
 mex_ww1_telegram.12.unsigned.d:0 "The Mexican government states that it has signed no military undertaking with Germany. The wording leaves room for continuing discussions, but it does not confirm the alliance suggested in the published telegram. Relations will require attention rather than an assumption that Mexico has already entered the German camp."
 mex_ww1_telegram.12.atlantic.d:0 "The Mexican government points to its convention with the Entente as the practical statement of its policy. Whatever Berlin intended when it sent the telegram, Mexico has entered a different alignment."
 mex_ww1_telegram.12.defiant.d:0 "Mexico has refused to provide the assurance requested in our note, insisting that its government will decide its foreign relations without American supervision. The response does not by itself declare war, but it leaves public suspicion and uncertainty on the frontier."
 mex_ww1_telegram.12.a:0 "We have their statement."
 mex_ww1_telegram.12.b:0 "The frontier will have to be watched closely."
 mex_ww1_telegram.200.t:0 "The Zimmermann Telegram"
 mex_ww1_telegram.200.d:0 "A confidential German proposal to Mexico has become public. The message offers financial assistance and recognition of Mexican territorial claims if Mexico joins Germany in a war against the United States. Its publication has caused an immediate controversy in Washington. The document reveals what Berlin sought; Mexico’s answer and any agreement that follows remain separate questions."
 mex_ww1_telegram.200.a:0 "The proposal is now a public question."
