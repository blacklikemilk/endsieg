l_english:
 INT_TUR_aftermath_of_mudros:0 "The Armistice of Mudros"
 INT_GRE_anatolian_overstretch:0 "Anatolian Overstretch"
 INT_GRE_anatolian_overstretch_desc:0 "The campaign deep inside Anatolia strains Greek supply lines and disperses experienced formations across a vast front. Replacements and ammunition arrive slowly, while support for continuing the war is weakening."
 INT_turkey_news.1.t:0 "Peace Signed at Lausanne"
 INT_turkey_news.1.d:0 "Delegates at Lausanne have signed a new peace with Turkey. The agreement replaces the unratified settlement of Sèvres and recognizes the sovereignty of the state built by the nationalist movement. Questions over borders and the Straits have dominated months of talks, but the fighting that followed the Great War now has a diplomatic conclusion."
 INT_turkey_news.1.a:0 "A new settlement in Anatolia."
 INT_turkey_news.2.t:0 "Turkey Proclaims a Republic"
 INT_turkey_news.2.d:0 "The Grand National Assembly in Ankara has proclaimed a republic and elected Mustafa Kemal as president. The vote settles a constitutional question left open during the independence struggle: authority now rests with a civilian government answerable to the assembly. Foreign governments are watching how the new state will turn victory into lasting institutions."
 INT_turkey_news.2.a:0 "A republic takes shape."
 INT_turkey_news.3.t:0 "A New Constitution in Ankara"
 INT_turkey_news.3.d:0 "Turkey's parliament has adopted a constitution defining the powers of the assembly, presidency, and cabinet. Its provisions affirm national sovereignty and civil equality after years of imperial collapse and war. The document gives the republic a permanent legal framework, though its promises must still be carried into the provinces and courts."
 INT_turkey_news.3.a:0 "The republic writes its charter."
 INT_turkey_news.4.t:0 "Turkey and Greece Seek Reconciliation"
 INT_turkey_news.4.d:0 "The governments in Ankara and Athens have reached an agreement to improve relations. The war and population exchange remain fresh in memory, yet both sides see value in a settled frontier and renewed commerce. Their rapprochement could change the balance of diplomacy around the Aegean."
 INT_turkey_news.4.a:0 "The Aegean grows quieter."
 INT_turkey_news.5.t:0 "Turkey Joins the League of Nations"
 INT_turkey_news.5.d:0 "Turkey has entered the League of Nations. For Ankara, membership marks international recognition of the republic and gives it a forum for defending the post-Lausanne order. The League gains a member at the crossroads of Europe and the Near East as regional security becomes a growing concern."
 INT_turkey_news.5.a:0 "Ankara takes its seat."
 INT_turkey_news.6.t:0 "Balkan Entente Signed"
 INT_turkey_news.6.d:0 "Turkey, Greece, Romania, and Yugoslavia have signed a pact to uphold peace and their existing frontiers in the Balkans. The partners promise consultation as demands for territorial revision grow elsewhere in Europe. The agreement gives their recent rapprochement a wider regional purpose."
 INT_turkey_news.6.a:0 "A new Balkan understanding."
 INT_turkey_news.7.t:0 "Turkish Women Gain Parliamentary Suffrage"
 INT_turkey_news.7.d:0 "Turkey's assembly has extended the vote and eligibility for parliamentary office to women. Municipal rights have already opened a path into public life; the new law carries that participation to national politics. Supporters see another major reform of the republic, while its practical reach will depend on the next election."
 INT_turkey_news.7.a:0 "The electorate expands."
 INT_turkey_news.8.t:0 "Turkey Announces an Industrial Plan"
 INT_turkey_news.8.d:0 "Ankara has presented a state-led plan for factories making basic goods that the country now imports. Public banks and engineers will direct investment toward textiles, chemicals, and raw materials. The program may strengthen economic independence, but it also demands transport, credit, and skilled labor that remain scarce."
 INT_turkey_news.8.a:0 "Industry becomes a national project."
 INT_turkey_news.9.t:0 "Ottoman Parliament Reconvenes"
 INT_turkey_news.9.d:0 "After an Ottoman victory in the Great War, deputies have reconvened in Istanbul to decide how the empire should be governed in peace. The palace retains its authority, but provincial representatives demand a stronger voice over taxation and reconstruction. Foreign chancelleries are watching whether this constitutional settlement can hold together the victorious empire."
 INT_turkey_news.9.a:0 "The empire enters a new session."
 INT_turkey_news.10.t:0 "Greek Troops Land at Izmir"
 INT_turkey_news.10.d:0 "Greek forces have landed at Izmir under Allied authorization. The occupation of the city and its hinterland is provoking protests across Anatolia, where many fear that the armistice is becoming a permanent partition. Istanbul's government is under pressure to defend its claims, while local groups begin organizing resistance."
 INT_turkey_news.10.a:0 "The armistice grows more fragile."
 INT_turkey_news.11.t:0 "A National Movement Gathers in Anatolia"
 INT_turkey_news.11.d:0 "Mustafa Kemal Pasha has arrived at Samsun as opposition to the occupation spreads. Officers and civic groups are drawing together around the demand that the country's future be decided by its own people. Their organization remains uncertain, but a new center of resistance is taking shape beyond Istanbul."
 INT_turkey_news.11.a:0 "Anatolia is stirring."
 INT_turkey_news.12.t:0 "A New Assembly Opens in Ankara"
 INT_turkey_news.12.d:0 "Delegates have convened in Ankara to form a Grand National Assembly. With Istanbul under Allied occupation, the assembly claims authority to direct the national struggle and organize a government of its own. Two rival centers now speak for the Ottoman lands, and their dispute will shape the war ahead."
 INT_turkey_news.12.a:0 "Ankara asserts its authority."
 INT_turkey_news.13.t:0 "Ankara Rejects the Treaty of Sèvres"
 INT_turkey_news.13.d:0 "The nationalist assembly has rejected the peace terms signed by the Sultan's government at Sèvres. Its delegates refuse the proposed territorial losses and foreign controls, insisting that no settlement is valid without their consent. The treaty deepens the divide between Istanbul and Ankara as fighting continues."
 INT_turkey_news.13.a:0 "The settlement is contested."
 INT_turkey_news.14.t:0 "Turkish Forces Hold at Sakarya"
 INT_turkey_news.14.d:0 "The Greek advance toward Ankara has been stopped along the Sakarya River. Weeks of fighting have exhausted both armies, but the nationalist government has held its capital and gained time to rebuild. Ankara now hopes to turn a defensive victory into a lasting change in the war."
 INT_turkey_news.14.a:0 "The offensive has stalled."
 INT_turkey_news.15.t:0 "Turkish Forces Enter Izmir"
 INT_turkey_news.15.d:0 "Turkish troops have entered Izmir after a rapid offensive drove Greek forces west across Anatolia. The victory ends the occupation that helped ignite the national movement, though the future of Eastern Thrace and the Straits remains to be negotiated. Attention is turning from the battlefield to an armistice."
 INT_turkey_news.15.a:0 "The Aegean front has changed."
 INT_turkey_news.16.t:0 "The Ottoman Sultanate Is Abolished"
 INT_turkey_news.16.d:0 "The Grand National Assembly has abolished the sultanate, ending the political authority of the Ottoman dynasty. Ankara now claims to be the sole government entitled to negotiate peace, while the position of the caliph remains a separate question. The decision marks a decisive break with the imperial order."
 INT_turkey_news.16.a:0 "Sovereignty rests with the assembly."
 INT_turkey_news.17.t:0 "Ankara Abolishes the Caliphate"
 INT_turkey_news.17.d:0 "The Turkish assembly has abolished the caliphate and ended the last institutional office held by the Ottoman dynasty. Supporters describe the decision as necessary for a republic governed by its own laws; opponents fear the loss of a symbol recognized far beyond Turkey. Ankara must now manage the political and religious response."
 INT_turkey_news.17.a:0 "A historic office comes to an end."
 INT_turkey_news.18.t:0 "Turkey Adopts a New Alphabet"
 INT_turkey_news.18.d:0 "Turkey's parliament has approved a Latin-based alphabet for the Turkish language. Schools, newspapers, and public offices are preparing to replace the Ottoman script, while teachers face the vast task of explaining the new letters across the country. The reform is intended to expand literacy and reshape everyday administration."
 INT_turkey_news.18.a:0 "A new script enters public life."
 INT_turkey_news.19.t:0 "A New Opposition Party Forms in Turkey"
 INT_turkey_news.19.d:0 "Fethi Okyar has formed the Free Republican Party with the approval of President Mustafa Kemal. Its meetings are drawing citizens frustrated by economic hardship and the pace of reform. The government now faces a public test of whether organized opposition can operate within the young republic."
 INT_turkey_news.19.a:0 "Ankara opens a political contest."
 INT_turkey_news.20.t:0 "Turkey and Iraq Settle the Mosul Question"
 INT_turkey_news.20.d:0 "Turkey, Britain, and Iraq have reached an agreement on their disputed frontier around Mosul. Ankara accepts the border while the parties arrange compensation tied to the region's oil revenues. The settlement removes a dangerous quarrel left unresolved at Lausanne, though it disappoints those who hoped to retain the province."
 INT_turkey_news.20.a:0 "A frontier is recognized."
 INT_turkey_news.21.t:0 "Turkey Adopts a Surname Law"
 INT_turkey_news.21.d:0 "The assembly has required citizens to take hereditary surnames. Officials must now update registers and identity papers throughout the republic, replacing older forms of identification with a common legal standard. The measure is another step in Ankara's effort to remake civil administration."
 INT_turkey_news.21.a:0 "Names enter the new registers."
 INT_turkey_news.22.t:0 "Rebellion Breaks Out in Eastern Turkey"
 INT_turkey_news.22.d:0 "Forces led by Sheikh Said have risen against the government in eastern Turkey. Ankara is sending troops to restore control as the revolt tests the authority of the young republic and exposes deep divisions over its reforms. The fighting threatens to draw resources away from reconstruction."
 INT_turkey_news.22.a:0 "The government faces a grave test."
 INT_TUR_alphabet_reform_bonus:0 "Alphabet Reform"
 INT_TUR_education_bonus:0 "Unified Education"
 INT_TUR_historical_studies:0 "Historical Studies"
 INT_TUR_language_studies:0 "Language Studies"
 INT_TUR_officer_training:0 "Officer Training"
 INT_TUR_ottoman_education_bonus:0 "Provincial Schools"
 INT_TUR_standardization:0 "Common Standards"
 INT_TUR_university_reform_bonus:0 "University Reform"
 INT_turkey.1.t:0 "A Constitution for the Republic"
 INT_turkey.1.d:0 "The Grand National Assembly has adopted a new constitution. It confirms that sovereignty rests with the nation and gives the president and cabinet defined duties under parliament. Deputies now face the harder work of making these rules govern the courts, provinces, and daily administration."
 INT_turkey.1.a:0 "Put the charter into practice."
 INT_turkey.2.t:0 "An Opposition Party Takes Shape"
 INT_turkey.2.d:0 "Fethi Okyar's Free Republican Party has attracted supporters far beyond the government's expectations. Shopkeepers, farmers, and professionals bring grievances about taxes, credit, and the pace of reform to its meetings. Ankara must decide how a republic built by one movement will accommodate dissent."
 INT_turkey.2.a:0 "The debate is now public."
 INT_turkey.3.t:0 "Ankara and Athens Reconcile"
 INT_turkey.3.d:0 "The Turkish and Greek governments have agreed to put their recent war behind them. The exchange of populations has left painful memories on both sides of the Aegean, but officials now seek trade and practical cooperation. A quieter western frontier will let both states spend more on rebuilding."
 INT_turkey.3.a:0 "Keep the peace across the Aegean."
 INT_turkey.4.t:0 "The Balkan Entente"
 INT_turkey.4.d:0 "Representatives of Turkey, Greece, Romania, and Yugoslavia have signed a regional pact. They seek to uphold existing borders and settle disputes by consultation as new pressures grow in Europe. The agreement cannot remove every rivalry, but it gives Ankara partners in defending the peace."
 INT_turkey.4.a:0 "Strengthen the regional settlement."
 INT_turkey.5.t:0 "A New Assembly Convenes"
 INT_turkey.5.d:0 "Deputies assemble for the new parliamentary term. Women now hold seats after the expansion of national suffrage, and the government asks the chamber to supervise its industrial and social programs. The republic enters the next decade with more institutions than it possessed at its birth."
 INT_turkey.5.a:0 "Open the session."
 INT_turkey.6.t:0 "The First Industrial Plan"
 INT_turkey.6.d:0 "The government has set out a coordinated program for factories producing textiles, chemicals, and other basic goods. Public banks and engineers will direct investment where private capital remains scarce. The plan promises jobs and independence from imports, but it will test the treasury and transport network."
 INT_turkey.6.a:0 "Begin the works."
 INT_turkey.7.t:0 "The Imperial Parliament Returns"
 INT_turkey.7.d:0 "After the victory, deputies have returned to Istanbul to consider an empire no longer governed on wartime orders alone. Provincial representatives demand a voice in taxation and reconstruction, while the palace wants a dependable ministry. The settlement reached here will decide whether victory can become a durable peace."
 INT_turkey.7.a:0 "Let the deputies speak."
 INT_turkey.8.t:0 "The Grand National Assembly Abolishes the Sultanate"
 INT_turkey.8.d:0 "The Grand National Assembly has voted to abolish the Ottoman sultanate. Mehmed VI no longer holds political authority; Ankara alone will represent Turkey at the peace negotiations. Mustafa Kemal now heads the assembly government. The caliphate remains a separate office, leaving the dynasty a religious role while its rule over the state ends."
 INT_turkey.8.a:0 "Sovereignty belongs to the assembly."
 INT_turkey.9.t:0 "The Treaty of Lausanne"
 INT_turkey.9.d:0 "Our delegates have signed a peace treaty at Lausanne. The agreement replaces the unratified Treaty of Sèvres and recognizes the sovereignty of the government in Ankara. The war's last territorial and diplomatic questions can now be settled through the new treaty."
 INT_turkey.9.a:0 "Accept the new settlement."
 INT_turkey.10.t:0 "The Republic Is Proclaimed"
 INT_turkey.10.d:0 "The Grand National Assembly has proclaimed the Republic of Turkey and elected Mustafa Kemal its first president. The abolition of the sultanate left sovereignty with the assembly; today's vote gives the state a republican head of government and a settled constitutional direction."
 INT_turkey.10.a:0 "Long live the republic."
 INT_TUR_agricultural_recovery:0 "Rural Recovery"
 INT_TUR_agricultural_recovery_desc:0 "The end of the tithe gives farmers room to rebuild their holdings."
 INT_TUR_industry_incentive_spirit:0 "Industrial Incentives"
 INT_TUR_industry_incentive_spirit_desc:0 "Private investors receive modest support for domestic manufacturing."
 INT_TUR_central_bank_spirit:0 "Central Bank of the Republic"
 INT_TUR_central_bank_spirit_desc:0 "A national bank steadies credit and currency."
 INT_TUR_five_year_plan:0 "First Industrial Plan"
 INT_TUR_five_year_plan_desc:0 "The state directs capital into essential industries."
 INT_TUR_mining_investment:0 "Mining Investment"
 INT_TUR_mining_investment_desc:0 "State financing supports surveys and extraction."
 INT_TUR_emergency_order:0 "Emergency Powers"
 INT_TUR_emergency_order_desc:0 "Temporary security powers have restored order at a political cost."
 INT_TUR_civil_service:0 "Professional Civil Service"
 INT_TUR_civil_service_desc:0 "Trained officials carry reforms into the provinces."
 INT_TUR_balkan_security:0 "Balkan Entente"
 INT_TUR_balkan_security_desc:0 "Regional diplomacy gives Turkey a more secure position."
 INT_TUR_defense_preparedness:0 "Defense Review"
 INT_TUR_defense_preparedness_desc:0 "The armed forces coordinate plans and supplies for a new decade."
 INT_TUR_provincial_compromise_spirit:0 "Provincial Compromise"
 INT_TUR_provincial_compromise_spirit_desc:0 "Autonomy has eased tension between Istanbul and the provinces."
 INT_TUR_ottoman_budget_spirit:0 "Revised Imperial Budget"
 INT_TUR_ottoman_budget_spirit_desc:0 "The treasury now matches its commitments to dependable revenue."
 INT_TUR_ottoman_industry_spirit:0 "Ottoman Industrial Program"
 INT_TUR_ottoman_industry_spirit_desc:0 "Railways and technical schools support modest factory growth."
 INT_TUR_ottoman_constitutional_order:0 "Constitutional Empire"
 INT_TUR_ottoman_constitutional_order_desc:0 "The dynasty, parliament, and provinces have found a durable balance."
 INT_TUR_ottoman_parliament:0 "Reconvene the Ottoman Parliament"
 INT_TUR_ottoman_parliament_desc:0 "Victory has preserved the dynasty, but the wartime cabinet cannot govern indefinitely. Deputies return to debate taxes, provincial demands, and the empire's future."
 INT_TUR_provincial_compromise:0 "Negotiate Provincial Autonomy"
 INT_TUR_provincial_compromise_desc:0 "The provinces seek a greater voice after years of requisition and military rule. Istanbul offers administrative concessions in exchange for renewed loyalty."
 INT_TUR_customs_compromise:0 "Renegotiate Customs Revenues"
 INT_TUR_customs_compromise_desc:0 "The treasury needs stable duties and predictable trade. A revised customs settlement helps finance reconstruction without returning to wartime expropriation."
 INT_TUR_ottoman_budget:0 "Balance the Imperial Budget"
 INT_TUR_ottoman_budget_desc:0 "The ministry compares provincial receipts with the cost of railways, schools, and a standing army. Reform will fail unless the treasury can pay for it."
 INT_TUR_ottoman_schools:0 "Expand Provincial Schools"
 INT_TUR_ottoman_schools_desc:0 "New classrooms and teacher training strengthen administration outside the capital. Education also gives young subjects a stake in a reformed empire."
 INT_TUR_ottoman_officers:0 "Reform the Imperial Officer Corps"
 INT_TUR_ottoman_officers_desc:0 "A victorious wartime army still needs modern staff work, logistics, and peacetime discipline. The officer schools revise their lessons from the Great War."
 INT_TUR_ottoman_industry:0 "Develop Ottoman Industry"
 INT_TUR_ottoman_industry_desc:0 "Rail connections and technical education support modest factories. The court seeks a broader tax base without putting all industry under direct military control."
 INT_TUR_ottoman_slump:0 "Contain the Imperial Slump"
 INT_TUR_ottoman_slump_desc:0 "Export earnings and credit fall as the world economy contracts. The ministries protect food supply and public works while seeking fresh revenue."
 INT_TUR_ottoman_recovery:0 "Fund the Recovery Works"
 INT_TUR_ottoman_recovery_desc:0 "Road, port, and industrial projects put idle labor to work. A smaller but dependable program offers a path out of the slump."
 INT_TUR_ottoman_1935_settlement:0 "Secure the Constitutional Empire"
 INT_TUR_ottoman_1935_settlement_desc:0 "By the middle of the decade, the dynasty, parliament, and provinces have reached a workable balance. The empire faces new pressures abroad from a firmer domestic position."
 INT_TUR_maintenance_of_order:0 "The Law on Maintenance of Order"
 INT_TUR_maintenance_of_order_desc:0 "The government claims emergency authority to contain the revolt and other violent challenges. Stability may return, but exceptional powers narrow political life."
 INT_TUR_izmir_conspiracy:0 "Investigate the Izmir Conspiracy"
 INT_TUR_izmir_conspiracy_desc:0 "An alleged plot against the president is uncovered during a planned visit to Izmir. Investigators pursue those involved as the republic tests its new institutions."
 INT_TUR_great_speech:0 "Deliver the Great Speech"
 INT_TUR_great_speech_desc:0 "Mustafa Kemal recounts the national struggle before the party congress. His account defines the republic's origins and the direction its leaders intend to follow."
 INT_TUR_free_republican_party:0 "Allow the Free Republican Party"
 INT_TUR_free_republican_party_desc:0 "Fethi Okyar organizes an opposition party with the president's encouragement. Public enthusiasm exposes both economic discontent and the difficulty of managed competition."
 INT_TUR_menemen_incident:0 "The Menemen Crisis"
 INT_TUR_menemen_incident_desc:0 "The killing of an officer during a local uprising shocks the government. Ankara responds with security measures and renews debate over the pace of reform."
 INT_TUR_1935_assembly:0 "Convene the Fifth Assembly"
 INT_TUR_1935_assembly_desc:0 "The new parliament reflects the republic's political settlement and includes women deputies for the first time. Its work will carry the reforms into a more uncertain decade."
 INT_TUR_civil_administration:0 "Professionalize the Civil Service"
 INT_TUR_civil_administration_desc:0 "Officials in the provinces need consistent training and clear authority. A professional administration should turn laws passed in Ankara into routine practice."
 INT_TUR_soviet_friendship:0 "Renew Friendship with Moscow"
 INT_TUR_soviet_friendship_desc:0 "Ankara and Moscow renew their commitment to peaceful relations. Their wartime cooperation becomes a pragmatic treaty of neutrality and nonaggression."
 INT_TUR_mosul_settlement:0 "Settle the Mosul Question"
 INT_TUR_mosul_settlement_desc:0 "The frontier with Iraq is settled after difficult talks with Britain. Ankara accepts a fixed boundary and turns its attention to internal development."
 INT_TUR_italian_rapprochement:0 "Normalize Relations with Italy"
 INT_TUR_italian_rapprochement_desc:0 "Former adversaries improve their relations through diplomacy. Commercial exchanges and mutual assurances reduce one source of tension across the Mediterranean."
 INT_TUR_greek_rapprochement:0 "Reconcile with Greece"
 INT_TUR_greek_rapprochement_desc:0 "Venizelos and İnönü seek a practical peace after years of war and population exchange. Cooperation across the Aegean gives both countries room to rebuild."
 INT_TUR_league_of_nations:0 "Enter the League of Nations"
 INT_TUR_league_of_nations_desc:0 "Turkey joins the League of Nations as a recognized sovereign republic. Membership gives Ankara another forum in which to defend the post-Lausanne settlement."
 INT_TUR_balkan_entente:0 "Sign the Balkan Entente"
 INT_TUR_balkan_entente_desc:0 "Greece, Romania, Yugoslavia, and Turkey coordinate to protect the regional status quo. The pact strengthens diplomacy without binding Ankara to an immediate war."
 INT_TUR_eastern_diplomacy:0 "Talk with the Eastern Neighbors"
 INT_TUR_eastern_diplomacy_desc:0 "Ankara seeks steadier relations with Iran, Iraq, and Afghanistan. Border security and trade offer common ground for future regional agreements."
 INT_TUR_peace_at_home:0 "Peace at Home, Peace in the World"
 INT_TUR_peace_at_home_desc:0 "The republic aims to secure its borders through diplomacy while directing its resources to reform at home. New regional ties make that policy more credible."
 INT_TUR_general_staff_reform:0 "Separate the General Staff"
 INT_TUR_general_staff_reform_desc:0 "The General Staff becomes an independent military command outside the cabinet. Civilian leaders retain political authority while officers plan national defense."
 INT_TUR_officer_schools:0 "Rebuild the Officer Schools"
 INT_TUR_officer_schools_desc:0 "A generation of officers trained in the independence struggle must now prepare for peacetime command, logistics, and modern combined arms."
 INT_TUR_reserve_system:0 "Organize the Reserves"
 INT_TUR_reserve_system_desc:0 "The army registers, trains, and equips a reserve force. A smaller standing army can meet emergencies only if its mobilization system works."
 INT_TUR_border_roads:0 "Build Roads to the Interior"
 INT_TUR_border_roads_desc:0 "Roads from the capital to the provinces improve both trade and mobilization. Supply failures from the independence struggle remain a warning."
 INT_TUR_air_service:0 "Expand the Air Service"
 INT_TUR_air_service_desc:0 "Airfields, maintenance crews, and pilot training give the armed forces a more reliable air arm, though resources remain limited."
 INT_TUR_naval_training:0 "Restore Naval Training"
 INT_TUR_naval_training_desc:0 "The navy rebuilds professional training and maintenance after the long wars. Coastal defense depends on crews that can keep a small fleet at sea."
 INT_TUR_defense_review:0 "Review National Defense"
 INT_TUR_defense_review_desc:0 "Army, navy, and air officers review the republic's defenses as Europe becomes more unsettled. Mobility and reliable supply matter more than imperial ambitions."
 INT_TUR_abolish_ashar:0 "Abolish the Aşar Tax"
 INT_TUR_abolish_ashar_desc:0 "The tithe weighs heavily on farmers rebuilding after a decade of war. Its abolition sacrifices revenue now in hope of larger harvests and a stronger rural economy."
 INT_TUR_agricultural_credit:0 "Expand Agricultural Credit"
 INT_TUR_agricultural_credit_desc:0 "Credit cooperatives and rural lending help farmers purchase seed, tools, and draft animals. Recovery in the countryside will determine how much the new republic can sustain."
 INT_TUR_model_farms:0 "Establish Model Farms"
 INT_TUR_model_farms_desc:0 "Demonstration farms around Ankara test improved methods and show what organized irrigation and machinery might offer the countryside."
 INT_TUR_sugar_industry:0 "Build the Sugar Industry"
 INT_TUR_sugar_industry_desc:0 "Domestic sugar production gives farmers a new market and reduces reliance on imports. Factories in the interior link agricultural reform to industrial policy."
 INT_TUR_industry_incentives:0 "Encourage Domestic Industry"
 INT_TUR_industry_incentives_desc:0 "Tax concessions and legal protection draw private capital into manufacturing. The republic still relies on imported machinery and a thin domestic investor base."
 INT_TUR_central_bank:0 "Establish the Central Bank"
 INT_TUR_central_bank_desc:0 "A national central bank gives Ankara a firmer hand over currency and credit. It must steady the lira while trade and foreign investment weaken."
 INT_TUR_depression_response:0 "Respond to the World Slump"
 INT_TUR_depression_response_desc:0 "Falling demand and scarce credit threaten the republic's young factories. Ankara reviews imports, investment, and public works as the wider world economy contracts."
 INT_TUR_first_industrial_plan:0 "Draft the First Industrial Plan"
 INT_TUR_first_industrial_plan_desc:0 "The state directs scarce capital toward textiles, chemicals, and basic materials. A coordinated plan gives new factories the imports, credit, and power they need."
 INT_TUR_textile_mills:0 "Expand Textile Mills"
 INT_TUR_textile_mills_desc:0 "New textile works process domestic cotton and wool into goods the country has long imported. State planning turns local harvests into industrial supply."
 INT_TUR_etibank:0 "Found Etibank"
 INT_TUR_etibank_desc:0 "A state mining bank will survey deposits, finance extraction, and supply the planned factories with domestic raw materials."
 INT_TUR_industrial_recovery:0 "Consolidate the Industrial Drive"
 INT_TUR_industrial_recovery_desc:0 "The first state industries are taking shape, but roads, skilled workers, and finance remain scarce. Ankara consolidates the gains before the next round of investment."
 INT_TUR_1924_constitution:0 "Adopt the 1924 Constitution"
 INT_TUR_1924_constitution_desc:0 "The assembly replaces its wartime constitutional framework with a permanent republican charter. Sovereignty remains with parliament while the presidency and cabinet acquire defined responsibilities."
 INT_TUR_civil_courts:0 "Unify the Civil Courts"
 INT_TUR_civil_courts_desc:0 "A single civilian judiciary takes shape as separate religious courts give way to republican institutions. Judges and clerks must learn to administer a new legal order."
 INT_TUR_hat_reform:0 "The Hat Reform"
 INT_TUR_hat_reform_desc:0 "New rules for public dress make reform visible in everyday life. The government presents them as a civic break with imperial custom, while resistance reveals the limits of rapid change."
 INT_TUR_close_lodges:0 "Close the Dervish Lodges"
 INT_TUR_close_lodges_desc:0 "Religious lodges and hereditary titles lose their official standing. Ankara seeks a common civic authority, but communities accustomed to local religious leadership may object."
 INT_TUR_common_calendar:0 "Adopt Common Measures and Time"
 INT_TUR_common_calendar_desc:0 "The administration adopts international calendars, clocks, numerals, and measures. Uniform standards make trade, schools, and the railways easier to coordinate."
 INT_TUR_local_womens_vote:0 "Women's Municipal Suffrage"
 INT_TUR_local_womens_vote_desc:0 "Women gain the right to vote and stand in municipal elections. The reform introduces political participation at the local level before a nationwide parliamentary change."
 INT_TUR_historical_society:0 "Establish the Historical Society"
 INT_TUR_historical_society_desc:0 "Scholars gather in a new historical society to study Anatolia and the republic's past. Their work reaches schools and helps shape a shared civic narrative."
 INT_TUR_language_society:0 "Establish the Language Society"
 INT_TUR_language_society_desc:0 "The new language society studies Turkish vocabulary and supports literacy after the alphabet reform. Teachers and officials need common terms for public life."
 INT_TUR_peoples_houses:0 "Open the People's Houses"
 INT_TUR_peoples_houses_desc:0 "Local cultural houses offer lectures, libraries, theatre, and adult classes. The government uses them to bring the republic's reforms beyond Ankara and Istanbul."
 INT_TUR_university_reform:0 "Reorganize Istanbul University"
 INT_TUR_university_reform_desc:0 "The old Darülfünun is reorganized as Istanbul University. New appointments and curricula aim to strengthen science, medicine, and public administration."
 INT_TUR_aftermath_of_mudros_desc:0 "The Ottoman armies lay disarmed and the Allies may occupy strategic ground. Istanbul still has a sultan, but provincial officers and local associations are beginning to contest the settlement."
 INT_TUR_italian_landing:0 "Italian Troops Land at Antalya"
 INT_TUR_italian_landing_desc:0 "Italian forces occupy Antalya as the Allied powers divide their influence in Anatolia. Ankara will have to persuade Rome to withdraw while facing the Greek army in the west."
 INT_TUR_occupation_of_izmir:0 "The Landing at Izmir"
 INT_TUR_occupation_of_izmir_desc:0 "Greek forces land at Izmir with Allied approval. News of the occupation carries resistance committees beyond the western coast and turns Anatolian discontent into a national question."
 INT_TUR_samsun:0 "Mustafa Kemal at Samsun"
 INT_TUR_samsun_desc:0 "Sent to inspect the Ninth Army district, Mustafa Kemal reaches Samsun on 19 May 1919. He begins coordinating officers and local groups who refuse to accept partition."
 INT_TUR_amasya_circular:0 "Issue the Amasya Circular"
 INT_TUR_amasya_circular_desc:0 "The circular declares that the nation's independence will be secured by its own determination. It calls representatives together and challenges the passive course of the Istanbul government."
 INT_TUR_erzurum_congress:0 "The Erzurum Congress"
 INT_TUR_erzurum_congress_desc:0 "Delegates from eastern Anatolia reject mandates and territorial partition. They insist that the eastern provinces form an indivisible whole and choose a representative committee."
 INT_TUR_sivas_congress:0 "The Sivas Congress"
 INT_TUR_sivas_congress_desc:0 "Representatives from across Anatolia unite the defense associations under one movement. The congress gives the national struggle a countrywide political organization."
 INT_TUR_representative_committee:0 "A Representative Committee"
 INT_TUR_representative_committee_desc:0 "The committee speaks for the congresses, coordinates provincial resistance, and presses the Istanbul cabinet to recognize the demands of the national movement."
 INT_TUR_national_pact:0 "The National Pact"
 INT_TUR_national_pact_desc:0 "The last Ottoman chamber adopts the Misak-ı Milli, setting out the lands and sovereignty the national movement refuses to surrender."
 INT_TUR_occupation_of_istanbul:0 "Occupation of Istanbul"
 INT_TUR_occupation_of_istanbul_desc:0 "Allied troops occupy the imperial capital and arrest nationalist deputies. The remaining center of independent political action shifts toward Ankara."
 INT_TUR_grand_national_assembly:0 "Open the Grand National Assembly"
 INT_TUR_grand_national_assembly_desc:0 "Deputies meet in Ankara on 23 April 1920. Their assembly claims national sovereignty and provides the political authority needed to direct the struggle on several fronts."
 INT_TUR_kuvayi_milliye:0 "Organize the Kuvâ-yi Milliye"
 INT_TUR_kuvayi_milliye_desc:0 "Local irregular forces resist occupation where the old army cannot. Their flexibility buys time, though scattered command makes sustained campaigns difficult."
 INT_TUR_regular_army:0 "Build a Regular Army"
 INT_TUR_regular_army_desc:0 "The assembly brings the western front under a centralized command. Regular formations replace independent bands and give Ankara a force capable of meeting Greek offensives."
 INT_TUR_western_front:0 "The Western Front"
 INT_TUR_western_front_desc:0 "The contest with Greece becomes an open war for western Anatolia. Ankara commits its reorganized army while trying to keep Britain and France out of the fighting."
 INT_TUR_first_inonu:0 "First Battle of İnönü"
 INT_TUR_first_inonu_desc:0 "The army checks the first Greek thrust toward Eskişehir in January 1921. The defense strengthens the assembly's authority and confidence in its new command."
 INT_TUR_second_inonu:0 "Second Battle of İnönü"
 INT_TUR_second_inonu_desc:0 "Another Greek offensive is turned back in March 1921. Ankara gains time to mobilize, but the larger contest for central Anatolia remains undecided."
 INT_TUR_kutahya_eskisehir:0 "Retreat from Kütahya and Eskişehir"
 INT_TUR_kutahya_eskisehir_desc:0 "The July 1921 battles force a withdrawal toward the Sakarya River. Preserving the army takes priority over holding every town on the western approaches."
 INT_TUR_tekalif_i_milliye:0 "National Obligations Orders"
 INT_TUR_tekalif_i_milliye_desc:0 "Emergency requisitions gather transport, clothing, food, and equipment for the army. The burden falls on a population already exhausted by years of war."
 INT_TUR_sakarya:0 "Hold at Sakarya"
 INT_TUR_sakarya_desc:0 "After weeks of fighting east of the Sakarya River, the Greek advance is stopped in September 1921. The victory gives Ankara room to prepare a decisive offensive."
 INT_TUR_great_offensive:0 "The Great Offensive"
 INT_TUR_great_offensive_desc:0 "A carefully prepared attack begins in August 1922. Concentrated forces break the Greek front and pursue the retreating army toward the Aegean."
 INT_TUR_liberate_izmir:0 "Return to Izmir"
 INT_TUR_liberate_izmir_desc:0 "The nationalist army reaches Izmir in September 1922. The western campaign ends, but a formal settlement is still needed for Thrace and the Straits."
 INT_TUR_mudanya:0 "Armistice of Mudanya"
 INT_TUR_mudanya_desc:0 "The October 1922 armistice settles the fighting with Greece and arranges the return of eastern Thrace without another campaign across the Straits."
 INT_TUR_eastern_front:0 "The Eastern Front"
 INT_TUR_eastern_front_desc:0 "Kazım Karabekir's forces confront Armenia in the east while Ankara seeks a stable Caucasian frontier."
 INT_TUR_alexandropol:0 "The Settlement at Alexandropol"
 INT_TUR_alexandropol_desc:0 "Victory in the eastern campaign returns Kars to Ankara's control. A lasting frontier still requires agreement with the Soviet republics."
 INT_TUR_moscow_treaty:0 "Treaty of Moscow"
 INT_TUR_moscow_treaty_desc:0 "Ankara and Soviet Russia recognize one another's struggle against the postwar settlement. Their March 1921 agreement lays out the principles of the northeastern border."
 INT_TUR_kars_treaty:0 "Treaty of Kars"
 INT_TUR_kars_treaty_desc:0 "The October 1921 treaty confirms the frontier with the Caucasian Soviet republics and secures Kars within the national settlement."
 INT_TUR_cilician_resistance:0 "Resistance in Cilicia"
 INT_TUR_cilician_resistance_desc:0 "Local forces resist French occupation around Adana and the southern towns. Ankara seeks a negotiated withdrawal while keeping its main army on the Greek front."
 INT_TUR_italian_withdrawal:0 "The Italian Withdrawal"
 INT_TUR_italian_withdrawal_desc:0 "Italian forces leave their zone in southwestern Anatolia in 1921, removing one occupation front without a major campaign."
 INT_TUR_ankara_accord:0 "The Franco-Turkish Agreement"
 INT_TUR_ankara_accord_desc:0 "The October 1921 agreement ends the southern fighting and returns occupied Cilician territory while leaving Hatay under French administration."
 INT_TUR_sevres:0 "The Treaty of Sèvres"
 INT_TUR_sevres_desc:0 "The Istanbul government accepts a treaty that would partition Anatolia and place the Straits under international control. Ankara refuses to treat that signature as a mandate from the nation."
 INT_TUR_reject_sevres:0 "Reject the Partition"
 INT_TUR_reject_sevres_desc:0 "The Grand National Assembly repudiates Sèvres and insists on the National Pact. No settlement can last without Ankara's consent."
 INT_TUR_abolish_sultanate:0 "Abolish the Sultanate"
 INT_TUR_abolish_sultanate_desc:0 "The assembly ends the Ottoman sultanate on 1 November 1922. Authority rests with Ankara before the formal proclamation of a republic."
 INT_TUR_lausanne:0 "The Treaty of Lausanne"
 INT_TUR_lausanne_desc:0 "Negotiators secure international recognition of the new Turkish state in July 1923. Lausanne supersedes Sèvres and closes the War of Independence."
 INT_TUR_republic:0 "Proclaim the Republic"
 INT_TUR_republic_desc:0 "The assembly proclaims a republic on 29 October 1923 and elects Mustafa Kemal president. Ankara becomes the undisputed center of government."
 INT_TUR_abolish_caliphate:0 "Abolish the Caliphate"
 INT_TUR_abolish_caliphate_desc:0 "The assembly abolishes the caliphate in March 1924, separating the new republican state from the remaining imperial religious office."
 INT_TUR_unify_education:0 "Unify Education"
 INT_TUR_unify_education_desc:0 "The Law on the Unification of Education puts schools under one national ministry and expands the republic's ability to train a new generation."
 INT_TUR_civil_code:0 "Adopt a Civil Code"
 INT_TUR_civil_code_desc:0 "A new civil code replaces much of the Ottoman family-law framework and advances the republic's program of secular legal reform."
 INT_TUR_alphabet_reform:0 "The Alphabet Reform"
 INT_TUR_alphabet_reform_desc:0 "The Turkish alphabet law of 1928 introduces a Latin-based script and launches a nationwide campaign to teach it."
 INT_TUR_surname_law:0 "The Surname Law"
 INT_TUR_surname_law_desc:0 "The 1934 law requires citizens to adopt hereditary surnames. The assembly will soon confer one on the republic's founder."
 INT_TUR_ataturk_surname:0 "The Name Atatürk"
 INT_TUR_ataturk_surname_desc:0 "The assembly grants Mustafa Kemal the surname Atatürk in November 1934. His official name and portrait now follow the later republican era."
 INT_TUR_womens_suffrage:0 "Women's Political Rights"
 INT_TUR_womens_suffrage_desc:0 "Constitutional changes in 1934 extend national voting and candidacy rights to women, broadening participation in the republic's institutions."
 INT_TUR_izmir_economic_congress:0 "The Izmir Economic Congress"
 INT_TUR_izmir_economic_congress_desc:0 "Delegates debate agriculture, trade, and industrial reconstruction in 1923. The government must rebuild an economy strained by a decade of war."
 INT_TUR_railway_nationalization:0 "A National Railway Policy"
 INT_TUR_railway_nationalization_desc:0 "Ankara expands and nationalizes railways to bind the interior to ports and markets, reducing dependence on foreign-owned lines."
 INT_TUR_isbank:0 "Found İşbank"
 INT_TUR_isbank_desc:0 "The new national bank channels capital to Turkish enterprises and supports a domestic commercial sector."
 INT_TUR_early_statism:0 "State-Led Industry"
 INT_TUR_early_statism_desc:0 "As private capital proves insufficient for heavy industry, the state takes a larger role in financing and building factories."
 INT_TUR_republican_peoples_party:0 "Organize the Republican People's Party"
 INT_TUR_republican_peoples_party_desc:0 "The movement that directed the independence struggle becomes the governing party of the new state."
 INT_TUR_progressive_republican_party:0 "The Opposition Experiment"
 INT_TUR_progressive_republican_party_desc:0 "Former comrades organize the Progressive Republican Party in 1924, testing how far opposition can operate within the new order."
 INT_TUR_sheikh_said_rebellion:0 "The Sheikh Said Rebellion"
 INT_TUR_sheikh_said_rebellion_desc:0 "Rebellion in eastern Anatolia exposes deep tensions over centralization, identity, and secular reform. The government responds with emergency powers."
 INT_TUR_six_arrows:0 "The Six Arrows"
 INT_TUR_six_arrows_desc:0 "The party codifies republicanism, nationalism, populism, statism, secularism, and reformism as guiding principles."
 INT_TUR_1936_handoff:0 "A Republic Entering 1936"
 INT_TUR_1936_handoff_desc:0 "The independence struggle and first reform era give way to the challenges represented by Turkey's 1936 focus tree."
 INT_TUR_ottoman_victory:0 "The Empire Survives"
 INT_TUR_ottoman_victory_desc:0 "A Central Powers victory averts Mudros and the historical partition crisis. The Ottoman government must still address exhausted provinces and the cost of war."
 INT_TUR_constitutional_restoration:0 "Restore Parliamentary Government"
 INT_TUR_constitutional_restoration_desc:0 "The victory government reopens constitutional politics to regain legitimacy beyond the wartime cabinet."
 INT_TUR_ottoman_provincial_reform:0 "Reform the Provinces"
 INT_TUR_ottoman_provincial_reform_desc:0 "Greater administrative capacity and negotiated local authority offer a path to holding together a diverse empire."
 INT_TUR_ottoman_railways:0 "Rebuild Ottoman Railways"
 INT_TUR_ottoman_railways_desc:0 "Postwar reconstruction focuses on the Anatolian rail network, whose weakness hampered supply and commerce during the war."
 INT_TUR_ottoman_army_reorganization:0 "Reorganize the Ottoman Army"
 INT_TUR_ottoman_army_reorganization_desc:0 "Experience from the Great War informs a smaller, more coherent army for the surviving empire."
 INT_TUR_occupation:0 "Allied Occupation"
 INT_TUR_occupation_desc:0 "The armistice leaves foreign troops at strategic points and limits the government's authority."
 INT_TUR_national_resistance:0 "National Resistance"
 INT_TUR_national_resistance_desc:0 "Local defense associations and officers organize against partition."
 INT_TUR_kuvayi_milliye_spirit:0 "Kuvâ-yi Milliye"
 INT_TUR_kuvayi_milliye_spirit_desc:0 "Irregular resistance recruits quickly but lacks the cohesion of a regular army."
 INT_TUR_regular_army_spirit:0 "National Army"
 INT_TUR_regular_army_spirit_desc:0 "The assembly has united its field formations under a central command."
 INT_TUR_emergency_requisitions:0 "National Obligations"
 INT_TUR_emergency_requisitions_desc:0 "Emergency requisitions sustain the army while straining civilian life."
 INT_TUR_sakarya_victory:0 "Victory at Sakarya"
 INT_TUR_sakarya_victory_desc:0 "The defense of the Sakarya has restored confidence in the army."
 INT_TUR_great_offensive_spirit:0 "The Great Offensive"
 INT_TUR_great_offensive_spirit_desc:0 "The army concentrates its strength for a decisive campaign in the west."
 INT_TUR_sevres_pressure:0 "The Sèvres Settlement"
 INT_TUR_sevres_pressure_desc:0 "Partition threatens the territory claimed by the National Pact."
 INT_TUR_republican_institutions:0 "Republican Institutions"
 INT_TUR_republican_institutions_desc:0 "The assembly and presidency form the core of the new state."
 INT_TUR_railways:0 "National Railways"
 INT_TUR_railways_desc:0 "Rail construction and nationalization improve inland connections."
 INT_TUR_statism:0 "State-Led Development"
 INT_TUR_statism_desc:0 "Public investment fills gaps that private capital cannot yet cover."
 INT_TUR_internal_unrest:0 "Internal Unrest"
 INT_TUR_internal_unrest_desc:0 "The rebellion and its suppression strain public confidence."
 INT_TUR_ottoman_reconstruction:0 "Ottoman Reconstruction"
 INT_TUR_ottoman_reconstruction_desc:0 "Victory leaves the empire intact, but rebuilding remains a formidable task."
