l_english:
 peria.1.t:0 "The Coup in Tehran"
 peria.2.t:0 "A Treaty with Soviet Russia"
 transcauc.7.t:0 "The Svalbard Treaty"
 ww1_france.215.accepted.d:0 "Rome has accepted our offer of territorial concessions. The government is preparing to carry out the agreement and establish closer cooperation with Italy."
 ww1_france.215.accepted.t:0 "Italy Accepts the Bargain"
 ww1_france.215.refused.d:0 "Rome has rejected the proposed territorial bargain. The government must seek another way to secure Italian cooperation."
 ww1_france.215.refused.t:0 "Italy Rejects the Bargain"
 ww1_france.217.accepted.d:0 "Berlin has accepted our diplomatic proposal. The agreement opens a path towards closer relations as the government prepares the next stage of negotiations."
 ww1_france.217.accepted.t:0 "Germany Accepts the Proposal"
 ww1_france.217.refused.d:0 "Berlin has rejected our diplomatic proposal. The government must reconsider its approach as the prospects for an understanding recede."
 ww1_france.217.refused.t:0 "Germany Rejects the Proposal"
 ww1_germany.212.accepted.d:0 "The Haldane mission has returned with an agreement that offers a basis for further talks. The naval rivalry remains unresolved, but both governments have shown a willingness to negotiate."
 ww1_germany.212.accepted.t:0 "A British Understanding"
 ww1_germany.212.refused.d:0 "The Haldane mission has ended without an agreement. The disputes dividing Britain and Germany remain unresolved, leaving little prospect of an immediate improvement in relations."
 ww1_germany.212.refused.t:0 "The Haldane Mission Fails"
 ww1_germany.215.accepted.d:0 "London has accepted the proposed limits on the naval rivalry. Our representatives can now put the agreement into practice and pursue a more stable relationship with Britain."
 ww1_germany.215.accepted.t:0 "Britain Accepts Naval Restraint"
 ww1_germany.215.refused.d:0 "London has rejected the proposed naval terms. Our envoys report that the disagreement has left the rivalry between the two fleets unresolved."
 ww1_germany.215.refused.t:0 "Britain Rejects Naval Restraint"
 ww1_germany.218.accepted.d:0 "The Netherlands has accepted our proposal for closer commercial cooperation. Merchants and officials can begin arranging the deliveries on which the agreement depends."
 ww1_germany.218.accepted.t:0 "The Dutch Trade Agreement"
 ww1_germany.218.refused.d:0 "The Dutch government has declined our trade proposal. Our envoys will return without an agreement, leaving the existing commercial arrangements in place."
 ww1_germany.218.refused.t:0 "The Dutch Proposal Is Refused"
 ww1_germany.221.accepted.d:0 "Vienna has agreed to closer diplomatic consultations. The two governments will exchange their views before taking further steps in the Balkans."
 ww1_germany.221.accepted.t:0 "Vienna Agrees to Consult"
 ww1_germany.221.refused.d:0 "Vienna has declined the proposed consultations. The Foreign Office must now judge Austrian intentions without the assurances it had sought."
 ww1_germany.221.refused.t:0 "Vienna Declines Consultation"
 ww1_germany.224.accepted.d:0 "Vienna has accepted our appeal for restraint. Our diplomats can work with the Austrian government towards a negotiated settlement of the Balkan dispute."
 ww1_germany.224.accepted.t:0 "Austrian Restraint in the Balkans"
 ww1_germany.224.refused.d:0 "The Austrian government has rejected our appeal. Vienna intends to pursue its own course in the Balkans, increasing the danger of a wider confrontation."
 ww1_germany.224.refused.t:0 "Vienna Rejects Restraint"
 ww1_germany.227.accepted.d:0 "Constantinople has accepted the German economic mission. Officials can begin negotiating the railway, credit and procurement arrangements that will bind our economies more closely."
 ww1_germany.227.accepted.t:0 "The Ottoman Economic Agreement"
 ww1_germany.227.refused.d:0 "The Ottoman government has declined the proposed mission. Our diplomats have failed to secure the closer economic relationship they sought."
 ww1_germany.227.refused.t:0 "The Ottoman Mission Is Refused"
 ww1_germany.230.accepted.d:0 "Stockholm has accepted our proposed shipping terms. The agreement gives German merchants a new channel for commercial negotiations with Sweden."
 ww1_germany.230.accepted.t:0 "A Swedish Shipping Agreement"
 ww1_germany.230.refused.d:0 "The Swedish government has rejected the proposed shipping arrangement. Our envoys must return without the commercial assurances they had sought."
 ww1_germany.230.refused.t:0 "Sweden Refuses the Shipping Terms"
 ww1_germany.233.accepted.d:0 "Rome has accepted the limited understanding proposed by our diplomats. The agreement opens a more cordial channel between the two governments."
 ww1_germany.233.accepted.t:0 "An Understanding with Italy"
 ww1_germany.233.refused.d:0 "Rome has refused the proposed understanding. The Italian government has chosen to preserve its freedom of action rather than draw closer to Berlin."
 ww1_germany.233.refused.t:0 "Italy Rejects the German Terms"
 ww1_germany.236.accepted.d:0 "The Russian government has accepted our proposal for preliminary peace discussions. Our representatives can begin exploring the terms on which the eastern conflict might be settled."
 ww1_germany.236.accepted.t:0 "Russia Agrees to Talks"
 ww1_germany.236.refused.d:0 "The Russian government has rejected the proposed peace discussions. The diplomatic opening has closed, and the eastern conflict remains unresolved."
 ww1_germany.236.refused.t:0 "Russia Refuses Negotiations"
 ww1_germany.239.accepted.d:0 "Washington has agreed to the proposed commercial channel. Our representatives can begin discussions over trade and maritime communications."
 ww1_germany.239.accepted.t:0 "Washington Accepts Commercial Talks"
 ww1_germany.239.refused.d:0 "The American government has declined the proposed commercial arrangement. Our envoys have failed to overcome Washington's reservations."
 ww1_germany.239.refused.t:0 "Washington Rejects the Proposal"
 ww1_germany.242.accepted.d:0 "London has accepted the treaty. Naval restraint and the settlement over Belgium have made a formal alliance possible, bringing an end to the long rivalry between our governments."
 ww1_germany.242.accepted.t:0 "Britain Accepts the German Treaty"
 ww1_germany.242.refused.d:0 "London has rejected the proposed treaty. The negotiations have failed to overcome Britain's doubts, leaving Germany to pursue its own diplomatic course."
 ww1_germany.242.refused.t:0 "Britain Rejects the German Treaty"
 ww1_germany.245.accepted.d:0 "France and Russia have accepted the proposed continental alliance. Their governments are ready to establish the agreement and consult Italy over its position."
 ww1_germany.245.accepted.t:0 "The Continental Agreement Is Accepted"
 ww1_germany.245.refused.d:0 "The proposed continental alliance has failed to secure the necessary agreement. The governments concerned will retain their separate commitments."
 ww1_germany.245.refused.t:0 "The Continental Talks Fail"
 ww1_germany.248.accepted.d:0 "Rome has accepted the invitation to join the French-led alliance. Italian representatives will take their place in the consultations between the member governments."
 ww1_germany.248.accepted.t:0 "Italy Joins the Continental Alliance"
 ww1_germany.248.refused.d:0 "Rome has declined the invitation to join the continental alliance. The Italian government intends to keep its distance from the new arrangement."
 ww1_germany.248.refused.t:0 "Italy Declines the Alliance"
 ww1_germany.251.accepted.d:0 "London has agreed to enter the war alongside Germany. The final military consultations can proceed with British support assured."
 ww1_germany.251.accepted.t:0 "Britain Commits to the War"
 ww1_germany.251.refused.d:0 "London has refused to enter the proposed war. The plans for a common declaration cannot proceed on the terms previously discussed."
 ww1_germany.251.refused.t:0 "Britain Refuses the War Commitment"
 ww1_germany.253.accepted.d:0 "The Russian government has agreed to enter the war with its allies. Preparations for a common declaration can now proceed."
 ww1_germany.253.accepted.t:0 "Russia Commits to the War"
 ww1_germany.253.refused.d:0 "The Russian government has declined the proposed declaration of war. The alliance must reconsider its plans in the absence of Russian agreement."
 ww1_germany.253.refused.t:0 "Russia Refuses the War Commitment"
 ww1_germany.256.accepted.d:0 "Rome has agreed to commit Italian forces to the war. Its representatives have confirmed the decision to the other allied governments."
 ww1_germany.256.accepted.t:0 "Italy Commits to the War"
 ww1_germany.256.refused.d:0 "Rome has refused the request to enter the war. The Italian government will retain its present position despite the appeals of its allies."
 ww1_germany.256.refused.t:0 "Italy Refuses the War Commitment"
 ww1_germany.257.accepted.d:0 "Paris has approved the proposed declaration of war. The French government is prepared to act alongside its partners when the remaining consultations are complete."
 ww1_germany.257.accepted.t:0 "France Commits to the War"
 ww1_germany.257.refused.d:0 "Paris has refused to approve the proposed war. The plans drawn up by the allied governments must now be set aside."
 ww1_germany.257.refused.t:0 "France Refuses the War Commitment"
 ww1_germany.278.accepted.d:0 "Russia has accepted the proposed understanding. Our governments can develop closer trade and regular consultations under a pledge to preserve peace between the two empires."
 ww1_germany.278.accepted.t:0 "Russia Accepts the Potsdam Memorandum"
 ww1_germany.278.refused.d:0 "Russia has refused the proposed understanding. The eastern frontier remains a source of uncertainty, and our diplomats must seek another basis for relations."
 ww1_germany.278.refused.t:0 "Russia Rejects the Potsdam Memorandum"
 ww1_germany.281.accepted.d:0 "Sofia has accepted our invitation and Bulgaria has entered the Central Powers. The agreement gives Germany a new ally and strengthens our position in the Balkans."
 ww1_germany.281.accepted.t:0 "Bulgaria Joins the Central Powers"
 ww1_germany.281.refused.d:0 "Sofia has declined our invitation. Bulgaria will remain outside the Central Powers, leaving our diplomats to reconsider the balance in the Balkans."
 ww1_germany.281.refused.t:0 "Bulgaria Declines the Invitation"
 ww1_germany.295.accepted.d:0 "London has accepted the proposed separate peace. The settlement over Belgium and the naval question offers a basis for a new agreement between Britain and Germany."
 ww1_germany.295.accepted.t:0 "A Separate Peace with Britain"
 ww1_germany.295.refused.d:0 "London has rejected the proposed separate peace. The negotiations have ended without an agreement, and the conflict with Britain continues."
 ww1_germany.295.refused.t:0 "Britain Rejects the Peace Offer"
 ww1_italy.412.continental.d:0 "Italy has ratified membership in the continental compact led by France. The agreement establishes a new basis for cooperation as its members consider their position amid the competing alliances."
 ww1_italy.412.continental.t:0 "Italy Ratifies a Continental Compact"
 ww1_italy.412.mediterranean.d:0 "Rome has founded a neutral Mediterranean compact under Italian leadership. The new association seeks willing partners as Italy pursues a diplomatic course outside the rival great-power alliances."
 ww1_italy.412.mediterranean.t:0 "Italy Forms a Mediterranean Compact"
 ww1_japan.311.accepted.d:0 "London has accepted the proposed understanding on cooperation in East Asia. The reply gives ministers a basis for further discussions over Japan's diplomatic and military commitments."
 ww1_japan.311.accepted.t:0 "Britain Accepts the Proposed Understanding"
 ww1_japan.311.refused.d:0 "London has declined the proposed renewal of practical cooperation. Ministers must reconsider the British relationship as they decide which diplomatic course Japan should pursue."
 ww1_japan.311.refused.t:0 "Britain Declines the Proposed Understanding"
 ww1_japan.313.accepted.d:0 "Berlin has accepted the proposed strategic understanding with Japan. Ministers can now consider the terms of a closer relationship and the commitments it would bring in the Pacific and on the continent."
 ww1_japan.313.accepted.t:0 "Berlin Accepts the Proposed Understanding"
 ww1_japan.313.refused.d:0 "Berlin has declined Japan's proposed strategic understanding. The cabinet must reassess its position between the European powers and consider the other diplomatic courses open to Tokyo."
 ww1_japan.313.refused.t:0 "Berlin Declines the Proposed Understanding"
 ww1_turkey.311.accepted.d:0 "Berlin has accepted the proposed understanding with the Porte. Our representatives can now prepare the basis for closer cooperation between the two empires. The cabinet must consider the commitments that would follow a final agreement."
 ww1_turkey.311.accepted.t:0 "Berlin Accepts the Ottoman Proposal"
 ww1_turkey.311.refused.d:0 "Berlin has declined the proposed understanding with the Porte. The German reply leaves the empire without the agreement sought by our envoys. Ministers must reconsider the terms or pursue another diplomatic course."
 ww1_turkey.311.refused.t:0 "Berlin Declines the Ottoman Proposal"
 ww1_turkey.313.accepted.d:0 "France has accepted our partnership proposal under the guarantees discussed in the earlier negotiations. The reply opens the way to closer cooperation with the Entente. The cabinet must now consider how to give effect to the understanding."
 ww1_turkey.313.accepted.t:0 "Paris Accepts the Ottoman Partnership"
 ww1_turkey.313.refused.d:0 "France has declined the proposed Ottoman partnership. Our representatives have failed to secure the agreement sought after the Straits negotiations. The Porte must review its position before making any further commitment."
 ww1_turkey.313.refused.t:0 "Paris Declines the Ottoman Partnership"
 ww1_turkey.318.accepted.d:0 "Britain, Russia and France have accepted the proposed convention on Ottoman sovereignty and passage through the Straits. Their common consent gives our diplomats a basis for the next stage of negotiations. The cabinet can now consider the partnership for which these guarantees were sought."
 ww1_turkey.318.accepted.t:0 "Agreement on the Straits Guarantees"
 ww1_turkey.318.refused.d:0 "The negotiations have failed to secure common agreement on the Straits convention. Our prospective partners remain divided over the guarantees requested by the Porte. The cabinet must seek revised terms or another diplomatic course."
 ww1_turkey.318.refused.t:0 "The Straits Convention Is Refused"
 ww1_turkey.320.accepted.d:0 "Italy has accepted the commercial guarantees proposed by the Porte. The agreement offers a negotiated course for the Libyan dispute in place of a campaign. Both governments must now honour the understanding reached by their representatives."
 ww1_turkey.320.accepted.t:0 "Rome Accepts the Commercial Accommodation"
 ww1_turkey.320.refused.d:0 "Italy has rejected the proposed commercial guarantees. Its ministers remain unwilling to set aside their demands over Libya on the terms offered. The Porte must maintain its defences while considering its next response."
 ww1_turkey.320.refused.t:0 "Rome Rejects the Commercial Accommodation"
 ww1_turkey.324.accepted.d:0 "Bulgaria, Serbia and Greece have accepted the proposed division of the Ottoman Balkan districts. The agreement also recognises an Albanian state. The government can now carry out the negotiated withdrawal and seek a more secure relationship with its neighbours."
 ww1_turkey.324.accepted.t:0 "The Balkan Withdrawal Agreement"
 ww1_turkey.324.refused.d:0 "The Balkan governments have failed to agree on the proposed withdrawal settlement. Their competing demands have prevented the common agreement sought by the Porte. The government must reconsider its offer while retaining responsibility for the present frontier."
 ww1_turkey.324.refused.t:0 "The Balkan Settlement Is Rejected"
