l_english:
 peria.1.t:0 "The Coup in Tehran"
 peria.2.t:0 "A Treaty with Soviet Russia"
 transcauc.7.t:0 "The Svalbard Treaty"
 ww1_france.215.accepted.d:0 "The Italian ambassador has brought an agreement from Rome. In return for the concessions we offered, the cabinet is prepared to work more closely with France. Our officials must now arrange the transfer of the promised territories. The bargain will meet opposition at home, where the loss of French land will be difficult to defend."
 ww1_france.215.accepted.t:0 "Italy Accepts the Bargain"
 ww1_france.215.refused.d:0 "Rome has rejected our territorial offer. The Italian cabinet is unwilling to commit itself on the terms we proposed, despite the concessions on our side of the frontier. Our ambassador has been instructed to return for consultations. For now, we must make our plans without the cooperation we hoped to secure."
 ww1_france.215.refused.t:0 "Italy Rejects the Bargain"
 ww1_france.217.accepted.d:0 "Berlin has agreed to discuss a non-aggression settlement. Our ambassador reports that the German government is ready to proceed with the draft. At the Quai d'Orsay, officials are preparing the papers for ratification. A written pledge would give us a measure of security on the frontier, though it will be treated with deep suspicion by many Frenchmen."
 ww1_france.217.accepted.t:0 "Germany Accepts the Proposal"
 ww1_france.217.refused.d:0 "The German government has refused the proposed non-aggression agreement. Our ambassador reports that the talks have reached an impasse. The assurances we sought will have to wait, and the General Staff must continue to plan for a hostile eastern frontier."
 ww1_france.217.refused.t:0 "Germany Rejects the Proposal"
 ww1_germany.212.accepted.d:0 "Our ambassador reports that the British cabinet has authorised Haldane to continue the conversations. London wants a definite proposal on shipbuilding before it will go further. The Admiralty and the Foreign Office have been asked to put figures to the assurances we have given."
 ww1_germany.212.accepted.t:0 "A British Understanding"
 ww1_germany.212.refused.d:0 "Haldane has left Berlin without an agreement. The British cabinet will make no further undertaking on the basis we offered. In the Admiralty, officers are returning to their building estimates. The Foreign Office must look for another way to ease London's suspicions."
 ww1_germany.212.refused.t:0 "The Haldane Mission Fails"
 ww1_germany.215.accepted.d:0 "London has accepted the six-to-ten convention. The Admiralty must bring the fleet within the agreed limit and revise its estimates accordingly. Officers who have spent years arguing for new ships are bitter at the concessions, but the cabinet believes the agreement will ease a dispute that has poisoned relations with Britain."
 ww1_germany.215.accepted.t:0 "Britain Accepts Naval Restraint"
 ww1_germany.215.refused.d:0 "The British cabinet has rejected the proposed fleet limits. Our ambassador was unable to secure agreement on the terms sent from Berlin. The Admiralty will continue to draw up its own programme, and the Foreign Office can offer the Reichstag little hope of an early end to the naval rivalry."
 ww1_germany.215.refused.t:0 "Britain Rejects Naval Restraint"
 ww1_germany.218.accepted.d:0 "The Hague has approved the proposed commercial agreement. Our consuls can now put German importers in touch with the Dutch firms handling the cargoes. The arrangements will be watched carefully by the other powers, making discretion at the ports as important as the contracts themselves."
 ww1_germany.218.accepted.t:0 "The Dutch Trade Agreement"
 ww1_germany.218.refused.d:0 "The Dutch government has declined our trade proposal. Our envoy reports that ministers in The Hague regard the agreement as too great a risk to their neutrality. Importers must continue to make their own arrangements at the ports, where we have secured none of the assurances they requested."
 ww1_germany.218.refused.t:0 "The Dutch Proposal Is Refused"
 ww1_germany.221.accepted.d:0 "Vienna has agreed to consult us on Balkan policy. Our ambassador will attend discussions before the Austrian government makes further commitments. The Foreign Office hopes that a frank exchange now will spare both allies the danger of learning one another's intentions from an ultimatum."
 ww1_germany.221.accepted.t:0 "Vienna Agrees to Consult"
 ww1_germany.221.refused.d:0 "Vienna has declined the proposed consultations. The Austrian cabinet insists that decisions concerning its frontier must remain in its own hands. Our ambassador has been told to keep the Foreign Office informed, but he returns to his post without the assurances Berlin had sought."
 ww1_germany.221.refused.t:0 "Vienna Declines Consultation"
 ww1_germany.224.accepted.d:0 "The Austrian government has agreed to give negotiations more time. Our envoys have been instructed to work with their Austrian colleagues on a settlement in the Balkans. The generals will have to wait while the diplomats see whether a compromise can still be reached."
 ww1_germany.224.accepted.t:0 "Austrian Restraint in the Balkans"
 ww1_germany.224.refused.d:0 "Vienna has rejected our appeal to hold back. Austrian ministers believe that further delay would weaken their position along the southern frontier. The Foreign Office fears that a threat intended for a Balkan capital may soon demand an answer from Petrograd."
 ww1_germany.224.refused.t:0 "Vienna Rejects Restraint"
 ww1_germany.227.accepted.d:0 "The Porte has agreed to receive a permanent German economic mission. Bankers, railway engineers and purchasing officials are preparing to leave for Constantinople. Several firms have already asked the Foreign Office to put their representatives in touch with the Ottoman ministries handling the contracts."
 ww1_germany.227.accepted.t:0 "The Ottoman Economic Agreement"
 ww1_germany.227.refused.d:0 "The Ottoman government has declined the proposed economic mission. Our representatives have been unable to persuade the Porte to place so much railway and purchasing business in German hands. The delegation will return to Berlin with its contracts unsigned."
 ww1_germany.227.refused.t:0 "The Ottoman Mission Is Refused"
 ww1_germany.230.accepted.d:0 "Stockholm has agreed to the proposed shipping arrangements. Our Baltic consuls can now advise merchants on the terms under which their cargo will pass. Swedish officials insist that the trade must observe their neutral rules, and our captains have been told to give them no cause for complaint."
 ww1_germany.230.accepted.t:0 "A Swedish Shipping Agreement"
 ww1_germany.230.refused.d:0 "The Swedish government has refused the proposed shipping terms. Its ministers are unwilling to expose their neutral commerce to the suspicions the agreement would invite. German agents in the Baltic must look to the sailings and contracts they can arrange without Stockholm's assurances."
 ww1_germany.230.refused.t:0 "Sweden Refuses the Shipping Terms"
 ww1_germany.233.accepted.d:0 "Rome has agreed to closer commercial relations and regular talks between our embassies. Our ambassador will remain to work out the trade arrangements. The Italian cabinet has given no undertaking on a future war, but our diplomats believe they have found room to do business."
 ww1_germany.233.accepted.t:0 "An Understanding with Italy"
 ww1_germany.233.refused.d:0 "The Italian cabinet has rejected our proposed understanding. Our ambassador reports that the prospect of closer trade was insufficient to overcome Rome's reservations. The Foreign Office must now reckon with an Italy unwilling to give Berlin the assurances it sought."
 ww1_germany.233.refused.t:0 "Italy Rejects the German Terms"
 ww1_germany.236.accepted.d:0 "The Russian government is prepared to send representatives for preliminary peace discussions. Our delegates have been instructed to find out what terms the other side will consider. No armistice has been signed, and the armies remain under their present orders while the talks are arranged."
 ww1_germany.236.accepted.t:0 "Russia Agrees to Talks"
 ww1_germany.236.refused.d:0 "The Russian government has refused the proposed peace discussions. Our representatives have been told that no delegation will be sent on the basis we offered. The General Staff has received the dispatch. The fighting in the east will continue."
 ww1_germany.236.refused.t:0 "Russia Refuses Negotiations"
 ww1_germany.239.accepted.d:0 "The State Department has agreed to talks on commerce and shipping. Our embassy can now take up complaints over cargoes and the treatment of American vessels through a regular exchange. German firms have been informed that the talks may help their trade, although Washington has made no undertaking to stay out of a future conflict."
 ww1_germany.239.accepted.t:0 "Washington Accepts Commercial Talks"
 ww1_germany.239.refused.d:0 "Washington has declined the proposed commercial talks. Our ambassador reports that the State Department remains unconvinced by the assurances offered from Berlin. The outstanding disputes over shipping will have to be taken up through the usual diplomatic correspondence."
 ww1_germany.239.refused.t:0 "Washington Rejects the Proposal"
 ww1_germany.242.accepted.d:0 "The British cabinet has accepted the alliance treaty. The papers now await our ratification, together with the protocol guaranteeing Belgian neutrality. Vienna will have to be informed that the old alliance is ending. In London and Berlin, diplomats who have spent years contending with the other power must prepare to work beside it."
 ww1_germany.242.accepted.t:0 "Britain Accepts the German Treaty"
 ww1_germany.242.refused.d:0 "London has rejected the alliance treaty. The naval limits and the proposed guarantee for Belgium have failed to win the cabinet's consent. Our ambassador is returning for consultations, leaving the Foreign Office to account for an agreement on which it had placed considerable hopes."
 ww1_germany.242.refused.t:0 "Britain Rejects the German Treaty"
 ww1_germany.245.accepted.d:0 "France and Russia have agreed to establish their continental alliance. Their representatives will now put the common undertaking into effect and approach Rome. The British agreement with Germany has given the two governments a reason to settle questions that might otherwise have kept them apart."
 ww1_germany.245.accepted.t:0 "The Continental Agreement Is Accepted"
 ww1_germany.245.refused.d:0 "The continental negotiations have ended without an agreement. The governments in Paris and Petrograd have been unable to accept a common undertaking on the terms discussed. Their delegates are returning home as Europe waits to see how each will answer the Anglo-German treaty."
 ww1_germany.245.refused.t:0 "The Continental Talks Fail"
 ww1_germany.248.accepted.d:0 "Rome has accepted the invitation to the French-led alliance. Italian representatives will take their seats beside the French and Russian delegates. Questions about the employment of the army and fleet remain for military talks, but the new alliance can now count Italy among its members."
 ww1_germany.248.accepted.t:0 "Italy Joins the Continental Alliance"
 ww1_germany.248.refused.d:0 "Italy has declined the invitation. The cabinet in Rome intends to keep its distance from the new alliance, despite the arguments made by its supporters. French and Russian representatives must continue their consultations without an Italian delegation."
 ww1_germany.248.refused.t:0 "Italy Declines the Alliance"
 ww1_germany.251.accepted.d:0 "London has agreed to support Germany in the proposed war. Our ambassador reports that the cabinet has authorised military consultations. The General Staff is passing the message to the officers working with the British delegation as it waits for the remaining dispatches from the continent."
 ww1_germany.251.accepted.t:0 "Britain Commits to the War"
 ww1_germany.251.refused.d:0 "The British cabinet will not enter the proposed war. Our ambassador reports that the ministers are unwilling to make the commitment we requested. The General Staff must suspend plans that depended upon British participation while the government decides how to proceed."
 ww1_germany.251.refused.t:0 "Britain Refuses the War Commitment"
 ww1_germany.253.accepted.d:0 "The Russian government has agreed to stand with its allies in the coming confrontation. Its representatives have confirmed that the army will be committed once the final consultations are complete. Our diplomats have forwarded the dispatch to the General Staff."
 ww1_germany.253.accepted.t:0 "Russia Commits to the War"
 ww1_germany.253.refused.d:0 "Petrograd has refused the proposed commitment to war. The Russian government is unwilling to send its armies into the confrontation on the terms discussed. Plans that assumed its participation must now be reconsidered."
 ww1_germany.253.refused.t:0 "Russia Refuses the War Commitment"
 ww1_germany.256.accepted.d:0 "Rome has agreed to commit the Italian army and fleet alongside its allies. The decision has been conveyed to the other governments, whose staffs are still settling their plans. Italy's representatives have asked to be kept informed before the final orders go out."
 ww1_germany.256.accepted.t:0 "Italy Commits to the War"
 ww1_germany.256.refused.d:0 "The Italian cabinet has refused the request to enter the war. Appeals from its allies have failed to secure the commitment sought in the military talks. The other governments must now reckon with Italy remaining out of the fighting."
 ww1_germany.256.refused.t:0 "Italy Refuses the War Commitment"
 ww1_germany.257.accepted.d:0 "The French cabinet has approved the proposed declaration of war. Its representatives have been authorised to complete the military consultations with France's partners. The diplomats are awaiting the remaining replies before passing the final instructions to the army commands."
 ww1_germany.257.accepted.t:0 "France Commits to the War"
 ww1_germany.257.refused.d:0 "Paris has refused to approve the proposed declaration of war. The cabinet is unwilling to commit France on the terms laid before it. The allied staffs must put aside the plans that depended upon a common decision to open hostilities."
 ww1_germany.257.refused.t:0 "France Refuses the War Commitment"
 ww1_germany.278.accepted.d:0 "Russia has accepted the Potsdam memorandum. The two governments will pursue closer trade and regular consultations under a pledge to preserve peace along their common frontier. Our embassy has been instructed to arrange the first exchanges with the Russian ministries."
 ww1_germany.278.accepted.t:0 "Russia Accepts the Potsdam Memorandum"
 ww1_germany.278.refused.d:0 "The Russian government has rejected the Potsdam memorandum. Our ambassador reports that the assurances offered from Berlin have failed to settle its doubts. The diplomats return to their ordinary correspondence, and the General Staff must continue to treat the eastern frontier as a danger."
 ww1_germany.278.refused.t:0 "Russia Rejects the Potsdam Memorandum"
 ww1_germany.281.accepted.d:0 "Sofia has accepted our invitation to the Central Powers. Bulgarian representatives have confirmed their country's commitment to our side in the war. The General Staff is arranging liaison with its new ally, whose demands in Macedonia will weigh heavily in future discussions."
 ww1_germany.281.accepted.t:0 "Bulgaria Joins the Central Powers"
 ww1_germany.281.refused.d:0 "Bulgaria has declined the invitation to join the Central Powers. Our envoy reports that the cabinet in Sofia remains unwilling to commit itself on the terms offered. The General Staff will have to make its plans without the Bulgarian divisions it had hoped to see in the field."
 ww1_germany.281.refused.t:0 "Bulgaria Declines the Invitation"
 ww1_germany.295.accepted.d:0 "London has agreed to the proposed separate peace. Our representatives will carry out the settlement over Belgium and the naval question. For the first time since the fighting began, the two governments have terms upon which to halt their war and begin discussing their relations in peace."
 ww1_germany.295.accepted.t:0 "A Separate Peace with Britain"
 ww1_germany.295.refused.d:0 "The British cabinet has rejected the separate peace offer. Our representatives have been told that the terms concerning Belgium and the fleets are insufficient. The talks have ended, and commanders have been informed that the war with Britain continues."
 ww1_germany.295.refused.t:0 "Britain Rejects the Peace Offer"
 ww1_italy.412.continental.d:0 "Italy has ratified its place in the alliance led by France. Our representatives will join the common consultations, bringing Rome into closer relations with the continental powers. The cabinet must now explain the obligations it has accepted to the officers who will be asked to carry them out."
 ww1_italy.412.continental.t:0 "Italy Ratifies a Continental Compact"
 ww1_italy.412.mediterranean.d:0 "Rome has announced the formation of a neutral Mediterranean compact. Our diplomats have been instructed to approach governments willing to preserve their independence from the competing great-power alliances. Italy will lead the new association and bear much of the work of finding it partners."
 ww1_italy.412.mediterranean.t:0 "Italy Forms a Mediterranean Compact"
 ww1_japan.311.accepted.d:0 "The British cabinet has agreed to renew talks on cooperation in East Asia. Our ambassador will begin discussions with the Foreign Office on the responsibilities each country would assume. The navy has asked to be represented wherever the security of Pacific shipping is concerned."
 ww1_japan.311.accepted.t:0 "Britain Accepts the Proposed Understanding"
 ww1_japan.311.refused.d:0 "London has declined our proposal for renewed cooperation. Our ambassador reports that the cabinet is unwilling to give the assurances we requested. Ministers in Tokyo must now consider how much of our policy in East Asia can still rest upon British support."
 ww1_japan.311.refused.t:0 "Britain Declines the Proposed Understanding"
 ww1_japan.313.accepted.d:0 "Berlin has agreed to discuss a strategic understanding with Japan. The Foreign Ministry is preparing instructions for our representatives on commerce and security in the Pacific. The army and navy have each submitted views on the commitments they are prepared to undertake."
 ww1_japan.313.accepted.t:0 "Berlin Accepts the Proposed Understanding"
 ww1_japan.313.refused.d:0 "Germany has declined the proposed understanding. Our representatives have been unable to persuade Berlin to accept the commitments discussed. The cabinet must reconsider its position before it sends further assurances to either of the European camps."
 ww1_japan.313.refused.t:0 "Berlin Declines the Proposed Understanding"
 ww1_turkey.311.accepted.d:0 "Berlin has agreed to further talks with the Porte. Our embassy will work on the terms for closer military and diplomatic cooperation. The cabinet has asked the ministries to prepare their requests, knowing that any agreement will also bring German demands upon the empire."
 ww1_turkey.311.accepted.t:0 "Berlin Accepts the Ottoman Proposal"
 ww1_turkey.311.refused.d:0 "Germany has declined the proposed understanding. Our ambassador returns to Constantinople without the assurances requested by the cabinet. Ministers must now look again at the empire's position, with the German agreement they had counted upon still out of reach."
 ww1_turkey.311.refused.t:0 "Berlin Declines the Ottoman Proposal"
 ww1_turkey.313.accepted.d:0 "Paris has accepted the proposed Ottoman partnership on the basis of the earlier guarantees. Our diplomats are preparing the papers for closer cooperation with the Entente. Ministers who argued for the agreement must now make its obligations understood in the army and the provincial offices."
 ww1_turkey.313.accepted.t:0 "Paris Accepts the Ottoman Partnership"
 ww1_turkey.313.refused.d:0 "The French government has refused the proposed partnership. Our representatives have failed to secure the agreement sought after the Straits talks. The Porte must reconsider what support it can expect from the Entente before making further commitments."
 ww1_turkey.313.refused.t:0 "Paris Declines the Ottoman Partnership"
 ww1_turkey.318.accepted.d:0 "Britain, Russia and France have accepted the convention on Ottoman sovereignty and passage through the Straits. The Porte now has the written assurances it sought from all three powers. Ministers can return to the question of a partnership with the Entente with those papers before them."
 ww1_turkey.318.accepted.t:0 "Agreement on the Straits Guarantees"
 ww1_turkey.318.refused.d:0 "The Straits negotiations have ended without the consent of all three powers. The Porte has been unable to secure the common assurances it requested for Ottoman sovereignty and passage. Our representatives have been recalled for instructions before any further undertaking is made."
 ww1_turkey.318.refused.t:0 "The Straits Convention Is Refused"
 ww1_turkey.320.accepted.d:0 "Rome has agreed to the commercial settlement over Libya. Italian ministers are prepared to accept the guarantees offered through our representatives. The Porte will issue instructions to its officials and commanders to carry out the agreement and avoid an incident that could undo it."
 ww1_turkey.320.accepted.t:0 "Rome Accepts the Commercial Accommodation"
 ww1_turkey.320.refused.d:0 "Italy has rejected the proposed commercial guarantees for Libya. Our representatives report that Rome remains unwilling to set aside its demands on the terms we offered. The Porte has ordered officials to keep the coastal defences ready while ministers consider their reply."
 ww1_turkey.320.refused.t:0 "Rome Rejects the Commercial Accommodation"
 ww1_turkey.324.accepted.d:0 "Bulgaria, Serbia and Greece have accepted the terms for an Ottoman withdrawal. The agreement divides the disputed Balkan districts and recognises an Albanian state. Our commanders and governors must now arrange the evacuation, bringing imperial rule in those lands to an end."
 ww1_turkey.324.accepted.t:0 "The Balkan Withdrawal Agreement"
 ww1_turkey.324.refused.d:0 "The Balkan governments have failed to agree on the proposed settlement. Rival claims to the districts we offered have prevented a common answer. The Porte has instructed its commanders to retain their positions while diplomats consider whether there is any room left to negotiate."
 ww1_turkey.324.refused.t:0 "The Balkan Settlement Is Rejected"
