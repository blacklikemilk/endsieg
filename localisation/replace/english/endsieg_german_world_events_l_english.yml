l_english:
 ww1_world_diplomacy.1.t:0 "A Common Foreign Policy"
 ww1_world_diplomacy.1.d:0 "The Foreign Office has established a regular conference of its political, commercial and colonial departments. Reports that once reached the chancellery through competing channels will now be considered together.\n\nThe new arrangements cannot settle Germany's choice of allies. They will give the government a clearer account of the obligations it assumes when it makes that choice."
 ww1_world_diplomacy.1.a:0 "Give the diplomats a common brief."
 ww1_world_diplomacy.2.t:0 "The Consular Reports"
 ww1_world_diplomacy.2.d:0 "Our commercial attachés have submitted their first common survey of foreign markets. Exporters, banks and shipping firms have been asked to identify the customs barriers and transport difficulties that diplomacy might resolve.\n\nThe reports will guide our representatives abroad. Any agreement must still be concluded with the government concerned."
 ww1_world_diplomacy.2.a:0 "Put the reports before our negotiators."
 ww1_world_diplomacy.3.t:0 "Faith in the Dual Alliance"
 ww1_world_diplomacy.3.d:0 "Berlin has reaffirmed its commitment to the Dual Monarchy. The chancellery regards the alliance as the foundation of German security, while the general staffs are preparing closer exchanges of mobilisation and railway plans.\n\nThis decision commits our foreign policy to Vienna. An exclusive coalition with Britain or Russia would contradict the undertaking we have just made."
 ww1_world_diplomacy.3.a:0 "We stand by our ally."
 ww1_world_diplomacy.4.t:0 "The Belgian Protocol Is Drafted"
 ww1_world_diplomacy.4.d:0 "Our representatives have completed the proposed articles concerning Belgium. They provide for recognition of Belgian neutrality and an undertaking that German war plans will respect it.\n\nThe protocol is ready to accompany an offer of coalition to London. It will become binding when Britain accepts that coalition; the draft alone has created no new German guarantee."
 ww1_world_diplomacy.4.a:0 "Place the protocol with the British treaty."
 ww1_world_diplomacy.5.t:0 "Merchants across the North Sea"
 ww1_world_diplomacy.5.d:0 "Representatives of German and British shipping houses have met to discuss freight, insurance and the obstacles created by the naval rivalry. Both sides see advantages in a more dependable commercial relationship.\n\nThe proposed arrangements are being prepared alongside the political talks. Regular access and joint protection of shipping will depend on the governments concluding their coalition."
 ww1_world_diplomacy.5.a:0 "Prepare the commercial articles."
 ww1_world_diplomacy.6.t:0 "The North Sea Liaison Office"
 ww1_world_diplomacy.6.d:0 "The German and British naval staffs have exchanged officers to coordinate patrol sectors, recognition signals and the reporting of hostile movements. Their first task is to ensure that an incident at sea does not undo the treaty negotiated ashore.\n\nNeither fleet has surrendered its own command. The liaison office will provide a common account of the situation before the admiralties issue their orders."
 ww1_world_diplomacy.6.a:0 "Establish the liaison service."
 ww1_world_diplomacy.7.t:0 "A Continental Answer"
 ww1_world_diplomacy.7.d:0 "Our understanding with Britain has altered the calculations of the continental powers. The Foreign Office expects closer consultation among governments that fear the new coalition, even where their immediate interests differ.\n\nThe general staff has been instructed to review this possibility. Its plans must remain consistent with the Belgian undertaking on which the British agreement rests."
 ww1_world_diplomacy.7.a:0 "Review the continental position."
 ww1_world_diplomacy.8.t:0 "The Anglo-German War Council"
 ww1_world_diplomacy.8.d:0 "Delegates from the German and British general staffs and admiralties have assembled for the first joint war council. They are comparing estimates of enemy strength and identifying the transport and supply arrangements a common campaign would require.\n\nThe council coordinates policy between allies. It does not release either government from the treaty obligations that brought them together."
 ww1_world_diplomacy.8.a:0 "Let the staffs work from a common plan."
 ww1_world_diplomacy.9.t:0 "Officers of the Expeditionary Staff"
 ww1_world_diplomacy.9.d:0 "British liaison officers have begun work with the German staff. Their reports concern communications, medical services, artillery observation and the supply of formations operating beside an allied army.\n\nThe exchange will bring practical knowledge to both services while preserving their separate chains of command."
 ww1_world_diplomacy.9.a:0 "Circulate the liaison reports."
 ww1_world_diplomacy.10.t:0 "Convoys under the Accord"
 ww1_world_diplomacy.10.d:0 "The shipping commission has agreed procedures for the protection and reporting of merchant traffic. Convoy routes and recognition arrangements will be circulated to the naval commands and the principal shipping firms.\n\nThe agreement supports commerce under the coalition. It leaves neutral governments free to decide the use of their own ports."
 ww1_world_diplomacy.10.a:0 "Put the shipping arrangements into effect."
 ww1_world_diplomacy.11.t:0 "The Italian Calculation"
 ww1_world_diplomacy.11.d:0 "Our representatives in Rome report that Italy is weighing its continental commitments against its ambitions in the Adriatic and the Mediterranean. The Anglo-German coalition has introduced a further consideration into that debate.\n\nThe Foreign Office will keep its channels open. Italy must determine its own alignment, and no German assessment can substitute for that decision."
 ww1_world_diplomacy.11.a:0 "Keep the embassy informed."
 ww1_world_diplomacy.12.t:0 "An Examination of Our Commitments"
 ww1_world_diplomacy.12.d:0 "The chancellery has ordered a review of Germany's commitments to the Dual Monarchy. The Foreign Office will examine whether another understanding could provide greater security before Berlin makes an exclusive choice.\n\nConsultation alone changes no faction membership. Vienna remains our partner until another government accepts a new coalition."
 ww1_world_diplomacy.12.a:0 "Consider the alternatives before we commit."
 ww1_world_diplomacy.13.t:0 "The Conversations at Potsdam"
 ww1_world_diplomacy.13.d:0 "German and Russian representatives have compared their interests in Persia, the Ottoman Empire and the approaching European crisis. The discussions have revealed room for accommodation, but neither government has yet accepted the obligations of a new alliance.\n\nOur diplomats will prepare the questions that a renewed understanding must settle."
 ww1_world_diplomacy.13.a:0 "Continue the discussions with Petrograd."
 ww1_world_diplomacy.14.t:0 "Ratification in Berlin"
 ww1_world_diplomacy.14.d:0 "The government has approved the proposed understanding with Russia and instructed its representatives to seek a corresponding commitment from Petrograd. A continental coalition would require the Russian government to accept the same obligations.\n\nUntil that answer is received, the ratification in Berlin remains one part of the agreement."
 ww1_world_diplomacy.14.a:0 "Present the instruments to Petrograd."
 ww1_world_diplomacy.15.t:0 "Security through Accommodation"
 ww1_world_diplomacy.15.d:0 "The Foreign Office has reviewed the European balance in light of the Russian understanding. Its aim is to reduce the danger of simultaneous hostile coalitions while preserving a clear account of Germany's commitments.\n\nThe general staff will use the diplomatic reports when it revises mobilisation plans and the distribution of reserves."
 ww1_world_diplomacy.15.a:0 "Bring policy and planning into agreement."
 ww1_world_diplomacy.16.t:0 "The Colonial Estimates"
 ww1_world_diplomacy.16.d:0 "The Colonial Office has submitted a common programme for the administration and defence of Germany's overseas possessions. The estimates distinguish civilian works, local security and the supplies that could still reach the colonies during a European war.\n\nThe programme will concentrate the available officials and resources on tasks the administration can sustain."
 ww1_world_diplomacy.16.a:0 "Approve the revised estimates."
 ww1_world_diplomacy.17.t:0 "A Regular Colonial Service"
 ww1_world_diplomacy.17.d:0 "The Colonial Office has drawn up common arrangements for the training and equipment of local constabularies. Civil officials will retain responsibility for administration, while trained formations take over duties that previously fell to improvised detachments.\n\nThe programme is intended to make local services more dependable without assuming that reinforcements can always arrive from Europe."
 ww1_world_diplomacy.17.a:0 "Issue the training instructions."
 ww1_world_diplomacy.18.t:0 "The Overseas Supply Returns"
 ww1_world_diplomacy.18.d:0 "Shipping agents and colonial officials have completed a survey of depots, railways and the movement of essential stores. The returns identify where the administration must build reserves before communications are interrupted.\n\nThe first allocation of transport equipment will support that work."
 ww1_world_diplomacy.18.a:0 "Send the transport allotments."
 ww1_world_diplomacy.19.t:0 "The Allied General Staffs"
 ww1_world_diplomacy.19.d:0 "The allied representatives have compared mobilisation schedules and the movement of reinforcements across their common communications. A standing exchange of staff officers will keep those plans under review.\n\nThe conference has also made clear that each government must be consulted before a local crisis becomes a common war."
 ww1_world_diplomacy.19.a:0 "Maintain regular staff conferences."
 ww1_world_diplomacy.20.t:0 "Common Orders for the Allied Armies"
 ww1_world_diplomacy.20.d:0 "The procurement offices have identified equipment that can be ordered to common standards. The programme will concentrate first on small arms, ammunition handling and the stores most frequently exchanged between allied formations.\n\nTechnical reports will accompany the orders so that factories on either side of the frontier can benefit from the work."
 ww1_world_diplomacy.20.a:0 "Circulate the common specifications."
 ww1_world_diplomacy.21.t:0 "The Vienna Liaison Mission"
 ww1_world_diplomacy.21.d:0 "German officers have joined their Austrian counterparts to review staff procedures and the supply of forces operating on the same front. The mission will exchange lessons without replacing either army's own command.\n\nIts reports will be considered alongside the work of the allied procurement offices."
 ww1_world_diplomacy.21.a:0 "Keep the staffs in close contact."
 ww1_world_diplomacy.22.t:0 "Officers for Constantinople"
 ww1_world_diplomacy.22.d:0 "The military mission has prepared its training programme with the Ottoman authorities. German officers will assist with staff work, communications and the handling of modern equipment while the Ottoman army maintains its own command.\n\nThe mission is part of our wider relationship with Constantinople. It does not by itself bring the empire into a German war."
 ww1_world_diplomacy.22.a:0 "Dispatch the instructors and stores."
 ww1_world_diplomacy.23.t:0 "Surveyors on the Anatolian Route"
 ww1_world_diplomacy.23.d:0 "Engineers have submitted their survey of the Anatolian sections of the railway. Gradients, bridging and the movement of materials have been considered together with the administration responsible for the line.\n\nThe reports will guide German technical work and the transport equipment assigned to the programme."
 ww1_world_diplomacy.23.a:0 "Complete the engineering returns."
 ww1_world_diplomacy.24.t:0 "A Common Railway Contract"
 ww1_world_diplomacy.24.d:0 "The railway offices have agreed common forms for technical specifications, accounts and the delivery of materials. Standard contracts should reduce disputes between the companies and make the movement of equipment more predictable.\n\nThe Ottoman government retains authority over the works on its territory."
 ww1_world_diplomacy.24.a:0 "Put the contracts before the railway offices."
 ww1_world_diplomacy.25.t:0 "The Mesopotamian Sections"
 ww1_world_diplomacy.25.d:0 "The engineers have compared the requirements of the Mesopotamian sections with those of the route through Anatolia. The work will bring separate construction reports into a common technical programme.\n\nThe resulting studies will be available to the German offices and the Ottoman administration supervising the line."
 ww1_world_diplomacy.25.a:0 "Share the construction reports."
 ww1_world_diplomacy.26.t:0 "The Commercial Corridor"
 ww1_world_diplomacy.26.d:0 "Shipping firms, railway companies and consular offices have assembled a common account of the trade expected along the Berlin-Baghdad route. The programme now concerns dependable freight and administration as much as the laying of track.\n\nGerman transport allotments will support the companies while diplomatic representatives continue their work with Constantinople."
 ww1_world_diplomacy.26.a:0 "Coordinate the traffic and the contracts."
 ww1_world_diplomacy.27.t:0 "The Albanian Question"
 ww1_world_diplomacy.27.d:0 "Our representatives have set out Germany's support for an independent Albanian government. They have been instructed to distinguish recognition and diplomatic assistance from promises that might draw the country into another power's war.\n\nThe Foreign Office will work with the Albanian authorities as they establish their administration."
 ww1_world_diplomacy.27.a:0 "Support a government able to govern."
 ww1_world_diplomacy.28.t:0 "Conversations with Sofia"
 ww1_world_diplomacy.28.d:0 "The military representatives have completed a preliminary programme of cooperation with Bulgaria. Training reports and the equipment needed by the Bulgarian army have been considered alongside Sofia's political aims.\n\nBulgaria has not joined our coalition through these conversations. A formal invitation and an accepted Bulgarian decision must follow."
 ww1_world_diplomacy.28.a:0 "Prepare a concrete offer for Sofia."
 ww1_world_diplomacy.29.t:0 "Reports from Athens"
 ww1_world_diplomacy.29.d:0 "The embassy in Athens has renewed its contacts with the court, ministers and naval authorities. Their reports confirm that Greek policy rests on a difficult balance of continental and maritime interests.\n\nOur representatives will preserve those channels while Greece decides its own course."
 ww1_world_diplomacy.29.a:0 "Keep the channels open."
 ww1_world_diplomacy.30.t:0 "The Maritime Note"
 ww1_world_diplomacy.30.d:0 "The German note has been delivered in Washington. It sets out our position on warning, search and the safety of merchant crews, while asking the American government to apply the same scrutiny to restrictions imposed by other belligerents.\n\nThe work of the maritime claims commission will support the argument with reports on incidents at sea."
 ww1_world_diplomacy.30.a:0 "Our conduct must support our case."
 ww1_world_diplomacy.31.t:0 "A Constitution for the Polish Kingdom"
 ww1_world_diplomacy.31.d:0 "The officials responsible for occupied Poland have prepared a framework for the proposed regency. Their reports concern the civil service, courts and the division of responsibilities between local authorities and the occupying commands.\n\nThe framework prepares a government; a proclamation and the arrangements for sovereignty must still follow."
 ww1_world_diplomacy.31.a:0 "Complete the constitutional papers."
 ww1_world_diplomacy.32.t:0 "The Lithuanian Council"
 ww1_world_diplomacy.32.d:0 "Our civil commissioners have opened regular discussions with Lithuanian representatives on schools, local offices and the administration of the occupied districts. The council is intended to provide a recognised partner for the eventual settlement.\n\nThe military authorities have been instructed to distinguish their immediate requirements from the work of a lasting civil administration."
 ww1_world_diplomacy.32.a:0 "Give the civil offices a clear remit."
 ww1_world_diplomacy.33.t:0 "The Eastern Peace Delegation"
 ww1_world_diplomacy.33.d:0 "The Foreign Office has assembled the papers for an eastern settlement. The delegation must distinguish military demands from the arrangements needed for trade, local government and the return of regular railway traffic.\n\nWhere hostilities continue, these remain negotiating instructions. No proposal can become a peace treaty without the assent of the government on the other side of the front."
 ww1_world_diplomacy.33.a:0 "Prepare the terms for negotiation."
 ww1_world_diplomacy.34.t:0 "The Mitteleuropa Customs Board"
 ww1_world_diplomacy.34.d:0 "The customs offices have established a permanent board to compare tariffs, freight charges and the documentation required at the frontier. Industrial representatives will advise it on the movement of essential materials.\n\nThe board is intended to make the common market more dependable and to reduce the costs that separate national procedures impose on trade."
 ww1_world_diplomacy.34.a:0 "Put the common schedules into effect."
 ww1_world_diplomacy.35.t:0 "A Note to the Belligerents"
 ww1_world_diplomacy.35.d:0 "The government has sent its proposal for general negotiations through neutral diplomatic channels. It invites discussion of a settlement rather than treating Germany's existing demands as terms that its enemies have already accepted.\n\nThe neutral representatives will report whether the other governments are prepared to open talks."
 ww1_world_diplomacy.35.a:0 "Keep the diplomatic channel open."
 ww1_world_diplomacy.36.t:0 "The Neutral Channel"
 ww1_world_diplomacy.36.d:0 "Neutral representatives have agreed to carry further communications between the belligerents. The exchange provides a way to clarify proposals without requiring governments to make a public concession before talks begin.\n\nThe channel can bring the parties to negotiations. It cannot conclude peace on their behalf."
 ww1_world_diplomacy.36.a:0 "Let the intermediaries carry our reply."
 ww1_world_diplomacy.37.t:0 "The Danubian Academic Exchange"
 ww1_world_diplomacy.37.d:0 "Universities and technical institutes have agreed a regular exchange of scholars, research reports and industrial studies. A common commission will maintain the programme beyond the first round of visits.\n\nThe new arrangements give German researchers a permanent institution through which to organise the work."
 ww1_world_diplomacy.37.a:0 "Establish the research commission."
 ww1_world_diplomacy.38.t:0 "Delegates on the Danube"
 ww1_world_diplomacy.38.d:0 "The delegates have assembled the instruments that will govern the Habsburg settlement. Their work concerns the authority of the Austrian crown, the administration of the crownlands and the obligations Germany would assume under each proposal.\n\nA negotiated charter and an Austrian union remain distinct outcomes. The congress will present both for a final decision."
 ww1_world_diplomacy.38.a:0 "Bring the instruments before the governments."
 ww1_world_diplomacy.39.t:0 "From War Aims to Settlement"
 ww1_world_diplomacy.39.d:0 "With the fighting ended, the Foreign Office has brought the military, commercial and colonial reports before the peace delegation. Promises made during the war must now be reconciled with the means to administer and defend the settlement.\n\nTechnical commissions will examine the industrial and transport questions that cannot be resolved by a line on a map."
 ww1_world_diplomacy.39.a:0 "Give the commissions their instructions."
 ww1_world_diplomacy.101.t:0 "An Understanding at Berlin"
 ww1_world_diplomacy.101.d:0 "The German and British governments have announced that the conversations opened by the Haldane mission will continue on an agreed basis. Both sides have acknowledged the dangers of an unchecked naval rivalry and authorised further talks.\n\nThe announcement creates no alliance. It nevertheless marks a change in relations between two powers whose fleets have become symbols of their mutual suspicions."
 ww1_world_diplomacy.101.a:0 "The naval question returns to the diplomats."
 ww1_world_diplomacy.102.t:0 "The Haldane Talks End without Agreement"
 ww1_world_diplomacy.102.d:0 "The conversations between Britain and Germany have ended without a common undertaking. Officials in both capitals have declined to describe the exchanges as a final break, but the questions of naval strength and continental commitments remain unsettled.\n\nThe two governments will continue to judge one another by their policies at sea and on the continent."
 ww1_world_diplomacy.102.a:0 "The rivalry remains."
 ww1_world_diplomacy.103.t:0 "The Anglo-German Naval Convention"
 ww1_world_diplomacy.103.d:0 "Britain and Germany have ratified a convention recognising the Royal Navy's predominance. The German combat fleet is to remain within a ratio of six vessels for every ten British warships, with surplus vessels withdrawn and scrapped.\n\nThe agreement provides a definite limit to the naval competition. Its political significance will depend on whether the two governments can also reach an understanding over the continent."
 ww1_world_diplomacy.103.a:0 "A new limit in the North Sea."
 ww1_world_diplomacy.104.t:0 "An Anglo-German Coalition"
 ww1_world_diplomacy.104.d:0 "Britain and Germany have concluded a formal coalition. The agreement joins a naval convention to a binding German guarantee of Belgian neutrality. Officials in Berlin have confirmed that their operational plans will respect that undertaking.\n\nThe new coalition replaces Germany's former Austrian alignment. Its creation has forced every European chancellery to reconsider the balance of power."
 ww1_world_diplomacy.104.a:0 "Europe faces a new alignment."
 ww1_world_diplomacy.105.t:0 "Britain Declines the German Coalition"
 ww1_world_diplomacy.105.d:0 "The British government has declined Germany's offer of a formal coalition. Preliminary conversations have failed to produce agreement on the obligations that would accompany the proposed partnership.\n\nBerlin has not obtained a British commitment, and the proposed Belgian protocol has not entered into force through these talks. Any separate naval convention remains a distinct agreement."
 ww1_world_diplomacy.105.a:0 "The negotiations have reached their limit."
 ww1_world_diplomacy.106.t:0 "German-Dutch Commercial Arrangements"
 ww1_world_diplomacy.106.d:0 "The German and Dutch governments have concluded arrangements for commercial traffic through the Netherlands. Customs officials and shipping firms have been asked to provide regular accounts of the goods carried under the agreement.\n\nThe Dutch government has maintained its independent foreign policy. The commercial arrangement does not bring the Netherlands into a German coalition."
 ww1_world_diplomacy.106.a:0 "Neutral commerce continues."
 ww1_world_diplomacy.107.t:0 "The Baghdad Railway Partnership"
 ww1_world_diplomacy.107.d:0 "Germany and the Ottoman Empire have announced an agreement supporting their railway and commercial partnership. Technical offices will coordinate their reports with the Ottoman administration responsible for the line.\n\nThe agreement strengthens a connection that reaches from German industry to the Ottoman provinces. Constantinople retains authority over the works on its territory."
 ww1_world_diplomacy.107.a:0 "Railway finance becomes foreign policy."
 ww1_world_diplomacy.108.t:0 "Berlin and Vienna Renew Their Understanding"
 ww1_world_diplomacy.108.d:0 "The governments in Berlin and Vienna have concluded a round of consultations on their alliance. Their representatives have agreed to maintain closer diplomatic and staff exchanges as the European situation develops.\n\nThe announcement reaffirms the value both governments place on regular consultation before a local crisis becomes a common commitment."
 ww1_world_diplomacy.108.a:0 "The allied capitals draw closer."
 ww1_world_diplomacy.109.t:0 "A German Mediation Initiative"
 ww1_world_diplomacy.109.d:0 "Vienna has agreed to hear a German initiative intended to limit the Balkan crisis. The proposal seeks a diplomatic settlement of immediate disputes while preserving the governments concerned.\n\nThe initiative is an opening for further discussions. It does not amount to a peace imposed on Serbia or a surrender of Austrian policy to Berlin."
 ww1_world_diplomacy.109.a:0 "The diplomats have another opportunity."
 ww1_world_diplomacy.110.t:0 "A Scandinavian Shipping Agreement"
 ww1_world_diplomacy.110.d:0 "Germany and Sweden have concluded an agreement concerning neutral shipping and commercial traffic. The arrangement provides a regular channel through which shipping firms and consular officials can address practical difficulties.\n\nStockholm has not assumed an obligation to join a German war. The agreement concerns commerce under an independent Swedish flag."
 ww1_world_diplomacy.110.a:0 "Shipping remains a diplomatic concern."
 ww1_world_diplomacy.111.t:0 "Conversations between Berlin and Rome"
 ww1_world_diplomacy.111.d:0 "The Italian government has welcomed a German proposal for continued consultation over continental questions. Representatives in both capitals will seek to reduce the disputes that could turn Italy towards a hostile coalition.\n\nThe announcement settles no territorial claim and brings Italy into no new faction. Rome retains responsibility for its own alignment."
 ww1_world_diplomacy.111.a:0 "Italy weighs its interests."
 ww1_world_diplomacy.112.t:0 "An Eastern Diplomatic Framework"
 ww1_world_diplomacy.112.d:0 "Germany and Russia have accepted a framework for further discussions of their eastern relationship. The agreement establishes a channel for questions of trade, administration and the political arrangements left by the conflict.\n\nOfficials have distinguished the framework from a territorial peace treaty. The authority of each government and the settlement of the frontiers remain matters for their own negotiations."
 ww1_world_diplomacy.112.a:0 "The eastern question remains before the diplomats."
 ww1_world_diplomacy.113.t:0 "Germany and America Maintain Commercial Talks"
 ww1_world_diplomacy.113.d:0 "Washington has accepted a German proposal to maintain commercial conversations through regular diplomatic channels. The agreement concerns the treatment of trade and the reporting of incidents that might otherwise deepen the dispute between the two governments.\n\nIt carries no American commitment to a German coalition or a European war."
 ww1_world_diplomacy.113.a:0 "The Atlantic channel remains open."
 ww1_world_diplomacy.114.t:0 "Germany Reaffirms the Dual Alliance"
 ww1_world_diplomacy.114.d:0 "The German government has reaffirmed its faith in the Dual Monarchy. Berlin has coupled the announcement with closer staff consultation and a clearer statement of its continental commitments.\n\nThe decision places the Austrian partnership at the centre of German policy, rather than an exclusive coalition with Britain or Russia."
 ww1_world_diplomacy.114.a:0 "Berlin has made its choice."
 ww1_world_diplomacy.115.t:0 "The Joint Anglo-German War Council"
 ww1_world_diplomacy.115.d:0 "Representatives of the British and German armed services have established a common war council. Its work will concern operational reports, transport and the coordination of allied plans.\n\nThe council gives practical form to the coalition while preserving the separate commands of both countries. The Belgian protocol remains among the obligations its plans must respect."
 ww1_world_diplomacy.115.a:0 "The coalition acquires a common staff."
 ww1_world_diplomacy.116.t:0 "Berlin and London Conclude a Separate Peace"
 ww1_world_diplomacy.116.d:0 "Britain and Germany have accepted a separate settlement ending their war against one another. The agreement restores Belgian territory held under the German settlement and replaces hostilities in the North Sea with a naval convention and a new coalition.\n\nFrance and Russia are not parties to this peace. Their governments must now confront a European situation transformed by the withdrawal of Britain from its former alignment."
 ww1_world_diplomacy.116.a:0 "The war has taken a different course."
 ww1_world_diplomacy.90.t:0 "The Belgian Protocol Enters into Force"
 ww1_world_diplomacy.90.d:0 "Britain has accepted the coalition, and the Belgian protocol has been ratified with it. The Foreign Office has notified Brussels of the German undertaking, while the general staff has received instructions that the treaty must govern its plans.\n\nThe naval and commercial arrangements can now be administered as the commitments of an actual coalition."
 ww1_world_diplomacy.90.a:0 "Issue the ratified instruments."
 ww1_world_diplomacy.91.t:0 "The German Undertaking to Belgium"
 ww1_world_diplomacy.91.d:0 "Berlin has confirmed that the Belgian protocol forms a binding part of our coalition. The German government has established the guarantee and informed its military authorities that the undertaking applies to their plans.\n\nThe Foreign Office and Admiralty will maintain liaison with their German counterparts as the agreement is put into effect."
 ww1_world_diplomacy.91.a:0 "Keep the treaty under review."
 ww1_world_diplomacy.92.t:0 "A Guarantee from Berlin"
 ww1_world_diplomacy.92.d:0 "The German government has informed us that its undertaking to respect Belgian neutrality has entered into force as part of its coalition with Britain. Brussels has received the ratified articles rather than another proposal for future consideration.\n\nOur government must continue to preserve its independence while watching how the great powers honour their commitments."
 ww1_world_diplomacy.92.a:0 "Belgium will maintain its neutrality."
 ww1_world_diplomacy.93.t:0 "Berlin Looks to London"
 ww1_world_diplomacy.93.d:0 "Berlin has confirmed a coalition with Britain and ended our place in the German partnership. Its representatives describe the new arrangement as a change in Germany's security policy, but the decision leaves Vienna to reconsider the protection on which it has long relied.\n\nThe court and ministers must judge the German government by the obligations it is now willing to uphold."
 ww1_world_diplomacy.93.a:0 "We must reconsider our position."
 ww1_world_diplomacy.94.t:0 "The Talks Have Been Overtaken"
 ww1_world_diplomacy.94.d:0 "The circumstances on which the proposed agreement rested have changed before its terms could be put into effect. Our representatives can no longer proceed on the basis of the earlier exchange.\n\nThe Foreign Office has instructed them to close the present round of talks and report on the new situation."
 ww1_world_diplomacy.94.a:0 "Withdraw the papers for reconsideration."
