l_english:
 ww1_world_diplomacy.1.t:0 "A Foreign Office Reorganized"
 ww1_world_diplomacy.1.d:0 "The demands of our diplomacy have outgrown the old divisions between the political, commercial and colonial offices. Their representatives will now meet under a common direction, bringing the reports of our embassies before the chancellery together."
 ww1_world_diplomacy.1.a:0 "Our representatives must speak with one voice."
 ww1_world_diplomacy.2.t:0 "Commerce and the Consulates"
 ww1_world_diplomacy.2.d:0 "Our exporters look to the consulates for more than introductions. Reports from the ports and commercial capitals can tell us where rivals have secured favorable tariffs, where German goods face obstacles, and where a treaty might open a market."
 ww1_world_diplomacy.2.a:0 "Let the attachés make their inquiries."
 ww1_world_diplomacy.3.t:0 "The Alliance with Vienna"
 ww1_world_diplomacy.3.d:0 "The Dual Monarchy remains the partner upon which our position in Europe rests. Our ministers have assured Vienna that the alliance will guide German policy, and our officers will continue the work of preparing for a common defense."
 ww1_world_diplomacy.3.a:0 "Germany will stand with Austria-Hungary."
 ww1_world_diplomacy.4.t:0 "The Belgian Question"
 ww1_world_diplomacy.4.d:0 "A proposed protocol on Belgian neutrality has been prepared for the negotiations with Britain. If the wider agreement is concluded, our government will undertake to respect Belgium’s independence and our military plans must account for that obligation."
 ww1_world_diplomacy.4.a:0 "The proposal is ready for London."
 ww1_world_diplomacy.5.t:0 "Commerce across the North Sea"
 ww1_world_diplomacy.5.d:0 "German and British merchants have much to lose from a quarrel between their governments. Representatives of shipping and finance have discussed freight, insurance and the security of trade; their proposals will accompany our political overtures to London."
 ww1_world_diplomacy.5.a:0 "Let trade make its case for friendship."
 ww1_world_diplomacy.6.t:0 "Liaison in the North Sea"
 ww1_world_diplomacy.6.d:0 "Officers of the German and British navies have established a channel for exchanging reports from the North Sea. Recognition signals and patrol arrangements are to be discussed between the two staffs, while each fleet remains under its own command."
 ww1_world_diplomacy.6.a:0 "A misunderstanding at sea must not ruin the accord."
 ww1_world_diplomacy.7.t:0 "A New Continental Balance"
 ww1_world_diplomacy.7.d:0 "Our understanding with Britain has changed the calculations of the other European powers. The General Staff has been asked to consider what combinations might form against us and how our forces could meet them without violating our obligations to Belgium."
 ww1_world_diplomacy.7.a:0 "The maps must be studied anew."
 ww1_world_diplomacy.8.t:0 "A Council of War"
 ww1_world_diplomacy.8.d:0 "British and German officers have gathered to examine how their armies and fleets might act together. The first discussions concern transport, intelligence and the passage of supplies; differences in organization will take longer to overcome."
 ww1_world_diplomacy.8.a:0 "Give the staffs the means to cooperate."
 ww1_world_diplomacy.9.t:0 "The Liaison Officers"
 ww1_world_diplomacy.9.d:0 "An exchange of officers has brought British experience to our headquarters and German observers to theirs. Reports on communications, artillery and medical services have already begun to circulate among the staffs."
 ww1_world_diplomacy.9.a:0 "There is much to learn from one another."
 ww1_world_diplomacy.10.t:0 "Securing the Sea Lanes"
 ww1_world_diplomacy.10.d:0 "The shipping commission has drawn up arrangements for routing merchant vessels and reporting incidents at sea. These measures should make commerce more dependable while the naval staffs coordinate the protection available to it."
 ww1_world_diplomacy.10.a:0 "Send the instructions to the ports."
 ww1_world_diplomacy.11.t:0 "Italy Weighs Its Position"
 ww1_world_diplomacy.11.d:0 "Rome must reckon with its ambitions in the Adriatic and its interests beyond the Mediterranean. Our understanding with Britain adds another consideration. The embassy will sound out Italian ministers, but the decision remains theirs."
 ww1_world_diplomacy.11.a:0 "We shall keep the conversation open."
 ww1_world_diplomacy.12.t:0 "Germany’s Commitments Reviewed"
 ww1_world_diplomacy.12.d:0 "Our diplomats have been asked to examine the commitments that bind us to Vienna and the alternatives available to Germany. No change of allegiance has yet been made; the government must first decide where its security is best served."
 ww1_world_diplomacy.12.a:0 "Put the alternatives before the chancellery."
 ww1_world_diplomacy.13.t:0 "Conversations at Potsdam"
 ww1_world_diplomacy.13.d:0 "German and Russian representatives have met to discuss the points at which their interests meet, from Persia to the Ottoman lands. There is room for negotiation, though difficult questions remain before either government can offer a wider commitment."
 ww1_world_diplomacy.13.a:0 "The conversation should continue."
 ww1_world_diplomacy.14.t:0 "A Renewed Understanding"
 ww1_world_diplomacy.14.d:0 "The Foreign Office has prepared the German terms for a renewed understanding with Russia. The document can now be presented to the Russian government; its value will depend on the answer returned from the other capital."
 ww1_world_diplomacy.14.a:0 "Send our proposals east."
 ww1_world_diplomacy.15.t:0 "The European Balance"
 ww1_world_diplomacy.15.d:0 "With a Russian understanding in prospect, the government has ordered a fresh examination of Germany’s position on the continent. Diplomats and officers must determine how best to protect our interests without creating the encirclement we fear."
 ww1_world_diplomacy.15.a:0 "Our policy and our plans must agree."
 ww1_world_diplomacy.16.t:0 "The Colonial Budget"
 ww1_world_diplomacy.16.d:0 "The Colonial Office has submitted its estimates for the administration and defense of our possessions overseas. Officials must decide which roads, depots and local services can be sustained with the resources available to them."
 ww1_world_diplomacy.16.a:0 "The estimates will be considered."
 ww1_world_diplomacy.17.t:0 "A Colonial Constabulary"
 ww1_world_diplomacy.17.d:0 "Our colonial authorities have proposed regular training and equipment for local security forces. More dependable units would relieve officials of duties now entrusted to improvised detachments, though they will still depend on the resources available in each territory."
 ww1_world_diplomacy.17.a:0 "Issue the new instructions."
 ww1_world_diplomacy.18.t:0 "Stores for the Colonies"
 ww1_world_diplomacy.18.d:0 "Reports from our overseas administrations reveal gaps in depots and transport. Officials have been instructed to establish reserves and improve the movement of stores before a disruption of shipping can leave distant garrisons isolated."
 ww1_world_diplomacy.18.a:0 "The supplies must reach them while they can."
 ww1_world_diplomacy.19.t:0 "Consultations between Allies"
 ww1_world_diplomacy.19.d:0 "The staffs have compared their mobilization timetables and the routes by which reinforcements and supplies would pass. Regular exchanges should give each government a clearer idea of what it can expect from its partners in a crisis."
 ww1_world_diplomacy.19.a:0 "Let the consultations become a habit."
 ww1_world_diplomacy.20.t:0 "Orders for Allied Armies"
 ww1_world_diplomacy.20.d:0 "Procurement officials have found equipment and supplies that can be ordered to common specifications. Their first concern is to make the exchange of ammunition and stores easier without placing either army under foreign command."
 ww1_world_diplomacy.20.a:0 "Approve the common specifications."
 ww1_world_diplomacy.21.t:0 "A Mission to Vienna"
 ww1_world_diplomacy.21.d:0 "German officers have joined their Austrian counterparts to study staff work and the supply of armies operating together. The mission’s reports will inform preparations on both sides of the frontier."
 ww1_world_diplomacy.21.a:0 "The staffs must remain in contact."
 ww1_world_diplomacy.22.t:0 "German Instructors in Constantinople"
 ww1_world_diplomacy.22.d:0 "The Ottoman authorities have agreed to work with German officers on training, communications and staff organization. Our instructors can offer experience and equipment, but the success of the mission will rest on cooperation with the Ottoman command."
 ww1_world_diplomacy.22.a:0 "Send the officers to Constantinople."
 ww1_world_diplomacy.23.t:0 "Surveying the Anatolian Line"
 ww1_world_diplomacy.23.d:0 "Engineers studying the route toward Baghdad have reported on gradients, crossings and the transport of materials. Before the line can be carried farther, the companies and the Ottoman authorities must agree how to meet the difficulties ahead."
 ww1_world_diplomacy.23.a:0 "Examine the surveyors’ reports."
 ww1_world_diplomacy.24.t:0 "Contracts for the Railway"
 ww1_world_diplomacy.24.d:0 "The companies involved in the Baghdad route have prepared common specifications for materials, accounts and delivery. Clearer contracts should help the Ottoman administration and its German partners coordinate the work ahead."
 ww1_world_diplomacy.24.a:0 "Put the contracts in order."
 ww1_world_diplomacy.25.t:0 "The Road to Mesopotamia"
 ww1_world_diplomacy.25.d:0 "The country beyond the Anatolian mountains presents its own difficulties to the railway engineers. Their surveys will help the companies decide where labor and material must be assembled as the route advances toward Mesopotamia."
 ww1_world_diplomacy.25.a:0 "The work will demand patience."
 ww1_world_diplomacy.26.t:0 "Trade along the Railway"
 ww1_world_diplomacy.26.d:0 "A railway can carry more than soldiers and supplies. Merchants and shipping firms are examining the goods that might pass along the route to Baghdad, and the arrangements needed to bring them to market."
 ww1_world_diplomacy.26.a:0 "Let commerce follow the rails."
 ww1_world_diplomacy.27.t:0 "The Albanian Question"
 ww1_world_diplomacy.27.d:0 "Our diplomats have been instructed to support the independence of Albania as the Balkan settlement takes shape. A government able to administer its territory could help prevent the ambitions of its neighbors from producing another crisis."
 ww1_world_diplomacy.27.a:0 "Albania must have room to govern."
 ww1_world_diplomacy.28.t:0 "An Approach to Sofia"
 ww1_world_diplomacy.28.d:0 "Our representatives have discussed military cooperation with Bulgaria and listened to Sofia’s account of its interests in the Balkans. These conversations may prepare the way for closer ties, though a formal commitment would require Bulgaria’s agreement."
 ww1_world_diplomacy.28.a:0 "Prepare the next approach."
 ww1_world_diplomacy.29.t:0 "The Embassy in Athens"
 ww1_world_diplomacy.29.d:0 "The embassy’s reports describe a Greek government pulled between interests on land and at sea. Maintaining contact with ministers and military officers may help us understand its intentions before events force a choice."
 ww1_world_diplomacy.29.a:0 "Athens must be heard."
 ww1_world_diplomacy.30.t:0 "A Note to Washington"
 ww1_world_diplomacy.30.d:0 "Our representatives in Washington have been instructed to set out Germany’s position on maritime commerce. Reports of incidents at sea will be gathered for the negotiations, where American concerns over merchant shipping cannot be ignored."
 ww1_world_diplomacy.30.a:0 "Deliver the note."
 ww1_world_diplomacy.31.t:0 "The Polish Administration"
 ww1_world_diplomacy.31.d:0 "German officials have begun to consider how authority in Poland might be organized. Any arrangement will have to contend with local demands as well as the obligations and interests of the powers that brought it about."
 ww1_world_diplomacy.31.a:0 "Prepare a proposal for the administration."
 ww1_world_diplomacy.32.t:0 "An Administration in Lithuania"
 ww1_world_diplomacy.32.d:0 "Our authorities have examined the arrangements needed for civil administration in Lithuania. They must find officials, secure communications and determine how local representatives can participate in the government of the territory."
 ww1_world_diplomacy.32.a:0 "The work of administration begins."
 ww1_world_diplomacy.33.t:0 "Terms for the East"
 ww1_world_diplomacy.33.d:0 "Our diplomats have prepared a framework for negotiations over the eastern territories. Frontiers, administration and commerce remain difficult questions, and the papers before us are only a beginning to their settlement."
 ww1_world_diplomacy.33.a:0 "Give the negotiators their instructions."
 ww1_world_diplomacy.34.t:0 "The Central European Tariff Board"
 ww1_world_diplomacy.34.d:0 "Representatives of industry and commerce have been asked to study customs barriers across Central Europe. A common approach to tariffs could benefit German trade, provided the governments concerned can agree on its terms."
 ww1_world_diplomacy.34.a:0 "Commission the tariff study."
 ww1_world_diplomacy.35.t:0 "A Note on Peace"
 ww1_world_diplomacy.35.d:0 "The government has prepared a statement of the terms on which it would consider peace. Its reception cannot be known until it reaches the other governments, but a diplomatic opening may yet serve where the battlefield has not."
 ww1_world_diplomacy.35.a:0 "Let our position be known."
 ww1_world_diplomacy.36.t:0 "The Neutral Intermediaries"
 ww1_world_diplomacy.36.d:0 "Neutral governments may be able to carry proposals where direct contacts have become difficult. Our diplomats will explore whether their good offices can bring the parties to a discussion of terms."
 ww1_world_diplomacy.36.a:0 "Ask whether they will assist."
 ww1_world_diplomacy.37.t:0 "Contacts in Bohemia"
 ww1_world_diplomacy.37.d:0 "Our representatives have opened conversations with Czech leaders about the future administration of their lands. Their cooperation may be valuable, but they will bring demands of their own to any settlement."
 ww1_world_diplomacy.37.a:0 "Hear what they have to say."
 ww1_world_diplomacy.38.t:0 "The Danubian Congress"
 ww1_world_diplomacy.38.d:0 "Delegates have assembled to consider the future of the lands of the Habsburg monarchy. The interests represented at the table are far from identical, and any settlement will have to address both political authority and economic ties."
 ww1_world_diplomacy.38.a:0 "The discussions can begin."
 ww1_world_diplomacy.39.t:0 "Preparing the Peace Conference"
 ww1_world_diplomacy.39.d:0 "Officials have assembled the claims, reports and draft arrangements needed for a peace conference. The lines proposed on their maps will have consequences for railways, industry and the people who live on either side of them."
 ww1_world_diplomacy.39.a:0 "The delegations must come prepared."
 ww1_world_diplomacy.101.t:0 "The Berlin Conversations Continue"
 ww1_world_diplomacy.101.d:0 "Britain and Germany have agreed to continue the conversations begun by the Haldane mission. Naval rivalry and political commitments remain difficult questions, but both governments have chosen to keep the negotiations open."
 ww1_world_diplomacy.101.a:0 "Diplomacy has another chance."
 ww1_world_diplomacy.102.t:0 "The Haldane Mission Returns"
 ww1_world_diplomacy.102.d:0 "The talks between Britain and Germany have ended without an agreement. Neither side has found terms sufficient to settle the naval question and the obligations each fears the other may assume on the continent."
 ww1_world_diplomacy.102.a:0 "The old suspicions remain."
 ww1_world_diplomacy.103.t:0 "A Naval Convention in the North Sea"
 ww1_world_diplomacy.103.d:0 "Britain and Germany have concluded a naval convention limiting the German combat fleet to six ships for every ten in the Royal Navy. The German government must withdraw surplus vessels to bring its fleet within the agreed ratio."
 ww1_world_diplomacy.103.a:0 "The naval race takes a new course."
 ww1_world_diplomacy.104.t:0 "London and Berlin Form a Coalition"
 ww1_world_diplomacy.104.d:0 "Britain and Germany have announced a formal coalition. A naval convention and a German undertaking to respect Belgian neutrality accompany the agreement, which replaces Berlin’s former Austrian alignment."
 ww1_world_diplomacy.104.a:0 "The balance of Europe has shifted."
 ww1_world_diplomacy.105.t:0 "Britain Declines Berlin’s Offer"
 ww1_world_diplomacy.105.d:0 "The British government has rejected Germany’s proposal for a coalition. The negotiations have not produced the common political commitment sought in Berlin, leaving the two governments to consider their positions separately."
 ww1_world_diplomacy.105.a:0 "The offer has been declined."
 ww1_world_diplomacy.106.t:0 "German-Dutch Trade Agreement"
 ww1_world_diplomacy.106.d:0 "Berlin and The Hague have concluded commercial arrangements for traffic through the Netherlands. The agreement provides channels for customs and shipping questions while leaving Dutch foreign policy in the hands of its own government."
 ww1_world_diplomacy.106.a:0 "Trade continues across the frontier."
 ww1_world_diplomacy.107.t:0 "A Railway Partnership with Constantinople"
 ww1_world_diplomacy.107.d:0 "Germany and the Ottoman Empire have announced cooperation on the railway route toward Baghdad. German industry and finance will take part in a project whose construction remains under Ottoman authority."
 ww1_world_diplomacy.107.a:0 "A long road lies ahead."
 ww1_world_diplomacy.108.t:0 "Berlin and Vienna Confer"
 ww1_world_diplomacy.108.d:0 "Representatives of Germany and Austria-Hungary have concluded another round of alliance consultations. The two governments intend to maintain closer diplomatic and military contact as the situation in Europe develops."
 ww1_world_diplomacy.108.a:0 "The allies reaffirm their ties."
 ww1_world_diplomacy.109.t:0 "A German Offer to Mediate"
 ww1_world_diplomacy.109.d:0 "Vienna has agreed to hear a German initiative intended to ease tensions in the Balkans. Much remains to be negotiated, but the proposal offers the governments concerned another opportunity to seek a diplomatic solution."
 ww1_world_diplomacy.109.a:0 "The next move belongs to the diplomats."
 ww1_world_diplomacy.110.t:0 "A German-Swedish Shipping Agreement"
 ww1_world_diplomacy.110.d:0 "Germany and Sweden have reached an understanding on commercial shipping. Consular and commercial representatives will have a regular channel through which to settle practical difficulties affecting traffic between them."
 ww1_world_diplomacy.110.a:0 "The agreement concerns trade."
 ww1_world_diplomacy.111.t:0 "Berlin Opens Talks with Rome"
 ww1_world_diplomacy.111.d:0 "The Italian government has welcomed a German proposal for further consultation on European affairs. The conversations may reduce the distance between the two capitals, but Italy has made no new military commitment."
 ww1_world_diplomacy.111.a:0 "Rome will weigh its interests."
 ww1_world_diplomacy.112.t:0 "An Eastern Framework"
 ww1_world_diplomacy.112.d:0 "German and Russian representatives have accepted a framework for further talks on the political and economic questions facing them in the east. The details of any settlement remain to be negotiated."
 ww1_world_diplomacy.112.a:0 "The eastern question remains open."
 ww1_world_diplomacy.113.t:0 "Talks across the Atlantic"
 ww1_world_diplomacy.113.d:0 "Germany and the United States have agreed to maintain a channel for commercial discussions. Their representatives will exchange reports on trade and maritime incidents, even as wider disputes remain unresolved."
 ww1_world_diplomacy.113.a:0 "The conversation continues."
 ww1_world_diplomacy.114.t:0 "Germany Reaffirms Its Austrian Alliance"
 ww1_world_diplomacy.114.d:0 "Berlin has publicly reaffirmed its commitment to Austria-Hungary. The announcement places the Dual Alliance at the center of German policy as the governments of Europe measure their own commitments."
 ww1_world_diplomacy.114.a:0 "Vienna can count on Berlin."
 ww1_world_diplomacy.115.t:0 "A Joint Anglo-German War Council"
 ww1_world_diplomacy.115.d:0 "British and German officers have established a council to coordinate operational reports, transport and military planning. Each government retains command of its own forces while its representatives work toward a common strategy."
 ww1_world_diplomacy.115.a:0 "The staffs meet as allies."
 ww1_world_diplomacy.116.t:0 "Britain and Germany Make a Separate Peace"
 ww1_world_diplomacy.116.d:0 "The British and German governments have agreed to end the war between them. Their settlement provides for the return of Belgian territory held under the German settlement, a naval convention and a new coalition. France and Russia are not parties to the agreement."
 ww1_world_diplomacy.116.a:0 "The war has taken another course."
 ww1_world_diplomacy.90.t:0 "The Belgian Protocol Ratified"
 ww1_world_diplomacy.90.d:0 "Britain’s acceptance of the coalition has brought the Belgian protocol into force. Brussels will be notified of our undertaking, and the General Staff must ensure that its plans respect the guarantee."
 ww1_world_diplomacy.90.a:0 "Inform Brussels and the General Staff."
 ww1_world_diplomacy.91.t:0 "Germany Guarantees Belgium"
 ww1_world_diplomacy.91.d:0 "Berlin has confirmed its undertaking to respect Belgian neutrality as part of our agreement. Our diplomats and officers will maintain contact with their German counterparts as the coalition takes shape."
 ww1_world_diplomacy.91.a:0 "The undertaking is welcome."
 ww1_world_diplomacy.92.t:0 "A German Guarantee"
 ww1_world_diplomacy.92.d:0 "The German government has informed Brussels that it has guaranteed Belgian neutrality as part of an agreement with Britain. The declaration strengthens our position, though the preservation of independence remains our own responsibility."
 ww1_world_diplomacy.92.a:0 "Belgium must remain vigilant."
 ww1_world_diplomacy.93.t:0 "Berlin Turns to London"
 ww1_world_diplomacy.93.d:0 "Germany has entered a coalition with Britain, leaving Vienna outside its new alignment. The loss of the partnership on which our diplomacy has relied will force our ministers to reconsider Austria-Hungary’s position."
 ww1_world_diplomacy.93.a:0 "We must consider our own security."
 ww1_world_diplomacy.94.t:0 "Negotiations Interrupted"
 ww1_world_diplomacy.94.d:0 "The circumstances in which our representatives began their talks have changed. The proposals on the table can no longer be pursued as they stand, and the Foreign Office has recalled them for reconsideration."
 ww1_world_diplomacy.94.a:0 "The papers must be revised."