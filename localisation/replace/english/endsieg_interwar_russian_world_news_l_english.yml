 INT_russian_news.1.t: "The Communist International Is Founded"
 INT_russian_news.1.d: "Delegates from communist parties have agreed to establish the Communist International in Moscow. The new organization will coordinate revolutionary movements across borders."
 INT_russian_news.1.a: "Workers of the world unite."
 INT_russian_news.2.t: "Soviet Russia Declares War on Romania"
 INT_russian_news.2.d: "Soviet forces have declared war on Romania while supporting the Hungarian Soviet Republic. Fighting now links the revolutions in Central Europe to Moscow's intervention."
 INT_russian_news.2.a: "A new front opens."
 INT_russian_news.3.t: "Soviet Russia Intervenes in Finland"
 INT_russian_news.3.d: "Soviet Russia has declared war on Finland as it intervenes on the side of Red Finland. The conflict adds a new front to the unsettled Baltic aftermath."
 INT_russian_news.3.a: "The fighting spreads north."
 INT_russian_news.4.t: "The Far Eastern Republic Is Reintegrated"
 INT_russian_news.4.d: "The Far Eastern Republic has been dissolved and its territory reintegrated into Soviet Russia. Moscow now administers the former buffer state directly."
 INT_russian_news.4.a: "The buffer state is gone."
 INT_russian_news.5.t: "The Soviet-Japanese Convention Is Signed"
 INT_russian_news.5.d: "Moscow and Tokyo have signed the Soviet-Japanese Basic Convention, reopening diplomatic relations after the civil-war intervention in the Far East."
 INT_russian_news.5.a: "Relations begin to normalize."
 INT_russian_news.6.t: "Soviet Russia Intervenes in Mongolia"
 INT_russian_news.6.d: "Soviet Russia has declared war on Mongolia in response to Roman von Ungern-Sternberg's invasion. Soviet forces are entering the conflict alongside the Mongolian government."
 INT_russian_news.6.a: "The steppe becomes a battlefield."
 INT_russian_news.7.t: "The New Economic Policy Is Introduced"
 INT_russian_news.7.d: "The Soviet government has introduced the New Economic Policy, allowing limited markets and private trade under state control after the civil war."
 INT_russian_news.7.a: "A necessary retreat."
 INT_russian_news.8.t: "Soviet Russia Intervenes in Persia"
 INT_russian_news.8.d: "Soviet Russia has declared war on Persia while supporting the Persian Socialist Republic. The intervention brings the Red Army into another conflict on the southern frontier."
 INT_russian_news.8.a: "The revolution crosses the Caspian."
 INT_russian_news.9.t: "White Russia Declares War on Poland"
 INT_russian_news.9.d: "White Russia has declared war on Poland as its government seeks to restore the former imperial frontier."
 INT_russian_news.9.a: "A northern war begins."
 INT_russian_news.10.t: "White Russia Declares War on Ukraine"
 INT_russian_news.10.d: "White Russia has declared war on Ukraine, opening another front in its attempt to reassert authority across the former imperial borderlands."
 INT_russian_news.10.a: "The frontier erupts again."
 INT_russian_news.11.t: "White Russia Declares War in Finland"
 INT_russian_news.11.d: "White Russia has opened a northern campaign against Finland and Red Finland. The surviving governments of the former imperial frontier face a new offensive."
 INT_russian_news.11.a: "The old frontier is contested."
 INT_russian_news.12.t: "White Russia Moves Against the Baltic States"
 INT_russian_news.12.d: "White Russian forces have opened campaigns against the Baltic states. Estonia, Latvia and Lithuania now face pressure from the government in Petrograd."
 INT_russian_news.12.a: "The Baltic front reopens."
 INT_russian_news.13.t: "White Russia Moves into Transcaucasia"
 INT_russian_news.13.d: "White Russia has opened campaigns against the governments of Transcaucasia. The unsettled southern frontier is again under military pressure."
 INT_russian_news.13.a: "The Caucasus is in crisis."
 INT_russian_news.14.t: "The Russian Civil War Ends"
 INT_russian_news.14.d: "The last organized White Russian government has collapsed, bringing the principal struggle between the Red and White armies to an end. Its remaining territories pass under Soviet administration, while regional White forces are disarmed and their commanders face surrender or exile.\n\nYears of revolution and civil war leave Russia with shattered transport networks, damaged industry and widespread hardship. The Soviet government now turns from emergency mobilization toward reconstruction and the consolidation of its authority. Across Europe and Asia, governments reassess their relations with a revolutionary state that has survived the struggle for its existence."
 INT_russian_news.14.a: "Russia enters a new era."
