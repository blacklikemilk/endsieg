l_english:
 INT_russian_news.1.t:0 "The Communist International Founded"
 INT_russian_news.1.d:0 "Communist delegates meeting in Moscow have established a new international organisation. Its leaders intend to coordinate revolutionary parties across national borders, giving Soviet Russia a central place in a movement that rejects the existing international order."
 INT_russian_news.1.a:0 "A new revolutionary centre."
 INT_russian_news.2.t:0 "Soviet Russia Enters the War against Romania"
 INT_russian_news.2.d:0 "Soviet Russia has declared war on Romania in support of the Hungarian Soviet Republic. Moscow's intervention links the fighting in Central Europe to the wider struggle surrounding the Russian Revolution."
 INT_russian_news.2.a:0 "The conflict has widened."
 INT_russian_news.3.t: "Soviet Russia Intervenes in Finland"
 INT_russian_news.3.d:0 "The Soviet government has entered the Finnish conflict on the side of Red Finland. Its declaration of war against the White Finnish authorities has brought Russian forces openly into the struggle over Finland's future."
 INT_russian_news.3.a:0 "The northern frontier is at war."
 INT_russian_news.4.t:0 "The Far Eastern Republic Dissolved"
 INT_russian_news.4.d:0 "The Far Eastern Republic has dissolved its separate administration and passed under Soviet authority. The end of the buffer government marks another stage in Moscow's effort to restore control across the Russian Far East."
 INT_russian_news.4.a:0 "Moscow reasserts its eastern authority."
 INT_russian_news.5.t:0 "A Soviet-Japanese Convention"
 INT_russian_news.5.d:0 "Moscow and Tokyo have signed a convention intended to restore diplomatic relations after the disputes of the Russian Civil War. The agreement offers a more regular basis for dealings between powers whose forces and interests have confronted one another in the Far East."
 INT_russian_news.5.a:0 "A cautious rapprochement."
 INT_russian_news.6.t:0 "Soviet Russia Moves against Ungern-Sternberg"
 INT_russian_news.6.d:0 "Soviet Russia has declared war on Mongolia following the rise of Roman von Ungern-Sternberg. The intervention brings the Red Army against a monarchist regime whose ambitions have alarmed Moscow and unsettled the region."
 INT_russian_news.6.a:0 "The struggle has crossed another frontier."
 INT_russian_news.7.t:0 "Moscow Introduces the New Economic Policy"
 INT_russian_news.7.d:0 "The Soviet government has introduced a New Economic Policy permitting limited private trade and market activity. Its leaders present the change as a response to the devastation of war, while retaining state control over the principal foundations of the economy."
 INT_russian_news.7.a:0 "A change of course in Moscow."
 INT_russian_news.8.t: "Soviet Russia Intervenes in Persia"
 INT_russian_news.8.d:0 "The Soviet government has declared war on Persia in support of the Persian Socialist Republic. The intervention carries the Red Army into another conflict beyond the former empire's southern frontier."
 INT_russian_news.8.a:0 "The fighting spreads south of the Caspian."
 INT_russian_news.9.t: "White Russia Declares War on Poland"
 INT_russian_news.9.d:0 "The White Russian government has declared war on Poland in pursuit of its claims to the former imperial frontier. Warsaw now faces an armed challenge to the independence it has sought to consolidate amid the upheaval in Eastern Europe."
 INT_russian_news.9.a:0 "Another war over the former empire."
 INT_russian_news.10.t: "White Russia Declares War on Ukraine"
 INT_russian_news.10.d:0 "White Russia has opened a war against Ukraine, asserting its claim to a united Russian state. The Ukrainian government is preparing to defend its independence as another front divides the former imperial territories."
 INT_russian_news.10.a:0 "The Ukrainian frontier is aflame."
 INT_russian_news.11.t:0 "White Russia Opens a Finnish Campaign"
 INT_russian_news.11.d:0 "The White Russian government has begun military operations against the Finnish authorities. Its claim to restore the former imperial frontier places Finland's independence under renewed pressure after its own internal struggle."
 INT_russian_news.11.a:0 "The northern settlement is challenged."
 INT_russian_news.12.t:0 "White Russia Moves against the Baltic Governments"
 INT_russian_news.12.d:0 "White Russian forces have opened hostilities along the Baltic frontier. The campaign challenges the independence of the region's new governments and renews the struggle over lands once ruled from the Russian capital."
 INT_russian_news.12.a:0 "The Baltic settlement is under threat."
 INT_russian_news.13.t: "White Russia Moves into Transcaucasia"
 INT_russian_news.13.d:0 "The White Russian government has opened a campaign against the states of Transcaucasia. Its attempt to restore Russian authority brings renewed fighting to a region already transformed by war and revolution."
 INT_russian_news.13.a:0 "The Caucasus faces another campaign."
 INT_russian_news.14.t: "The Russian Civil War Ends"
 INT_russian_news.14.d:0 "The last organised White Russian government has collapsed, ending the principal struggle between the Red and White armies. Soviet authorities are taking control of the remaining White territories as surviving commanders face surrender or exile. Across a country devastated by years of war, attention turns to reconstruction and the consolidation of the new order."
 INT_russian_news.14.a:0 "Russia emerges from the civil war."
