l_english:
 MEX_WW1_R_unfinished_revolution:0 "The Unfinished Revolution"
 MEX_WW1_R_unfinished_revolution_desc:0 "The old order has been broken, but the armies, villages and provincial governments have yet to accept a common settlement. Laws must be carried into the countryside and the generals brought under civilian authority. War and the occupation of the capital weaken that work.\n\nGovernment legitimacy: §Y[?MEX_WW1_legitimacy|0]/100§!\nLand discontent: §Y[?MEX_WW1_land_discontent|0]/100§!\nArmy autonomy: §Y[?MEX_WW1_army_autonomy|0]/100§!\nProgrammes underway: §Y[?MEX_WW1_R_active_programmes|0]/2§!\n\nHigh legitimacy and low discontent and army autonomy strengthen the settlement. Each programme takes several months; a lasting settlement will take years."
 MEX_WW1_R_programme_capacity_tt:0 "Fewer than §Y2§! settlement programmes are underway."
 MEX_WW1_R_fractured_revolution:0 "A Fractured Revolution"
 MEX_WW1_R_fractured_revolution_desc:0 "Rival claims to the revolution have left the government dependent on provincial commanders. Villages resist requisitions, the treasury struggles to pay its armies, and few trust the promises made in the capital."
 MEX_WW1_R_contested_settlement:0 "A Contested Settlement"
 MEX_WW1_R_contested_settlement_desc:0 "The government has established a measure of authority, but its laws are still contested in the provinces. Land settlements and military reform must continue if peace is to outlast the present administration."
 MEX_WW1_R_consolidated_settlement:0 "The Revolutionary Settlement"
 MEX_WW1_R_consolidated_settlement_desc:0 "The municipalities recognize the national government, land commissions have reduced rural grievances, and regular accounts bind the army to the treasury. The work of reconstruction can at last proceed on firmer ground."
 MEX_WW1_R_food_crisis:0 "Disrupted Grain Supplies"
 MEX_WW1_R_food_crisis_desc:0 "War has severed the routes between the harvest and the market. Military requisitions and worthless paper currency leave civilians unable to buy the grain that does arrive."
 MEX_WW1_R_general_strike:0 "The General Strike"
 MEX_WW1_R_general_strike_desc:0 "Wages have fallen behind the cost of food and the workers have laid down their tools. The government must now answer the demands of organizations that once furnished men for its armies."
 MEX_WW1_R_emergency_decrees:0 "Emergency Labour Decrees"
 MEX_WW1_R_emergency_decrees_desc:0 "The government has reopened the workshops under military protection. Production is recovering, but arrests and emergency decrees have deepened the distrust between the authorities and organized labour."
 MEX_WW1_R_entrenched_army:0 "Lessons of the Bajío"
 MEX_WW1_R_entrenched_army_desc:0 "Our commanders have prepared defensive positions and coordinated their artillery and reserves. Discipline and careful planning may accomplish what another headlong cavalry charge cannot."
 mex_ww1_revolution.10.t:0 "The Convention at Aguascalientes"
 mex_ww1_revolution.10.d:0 "Victory over Huerta has left the revolution without a common authority. Delegates have gathered at Aguascalientes to settle the dispute between the First Chief and the commanders who refuse to place their armies at his disposal.\n\nThe Convention claims the right to speak for the revolution and to appoint a provisional president. Carranza insists that the constitutional cause cannot be surrendered to a gathering of generals. Between them lie the demands for land, local government and an end to military rule that brought so many Mexicans into the field."
 mex_ww1_revolution.10.a:0 "The revolution must decide who speaks in its name."
 mex_ww1_revolution.20.t:0 "Bread for the Cities"
 mex_ww1_revolution.20.d:0 "Grain trains stand idle while rival commands dispute their cargoes. In the markets, prices rise faster than wages, and the notes issued by military authorities buy less with every passing week.\n\nOfficials warn that the cities cannot endure another season of interrupted deliveries. The army demands first claim on the railways, but the crowds gathering outside the grain stores will not be satisfied by appeals to the needs of the front."
 mex_ww1_revolution.20.a:0 "Purchase grain and protect civilian deliveries."
 mex_ww1_revolution.20.b:0 "The armies must be supplied first."
 mex_ww1_revolution.21.t:0 "The Workers Lay Down Their Tools"
 mex_ww1_revolution.21.d:0 "The alliance between the government and organized labour is coming apart. Workers who once supported the revolutionary armies now demand wages that will keep pace with the cost of food. Electricity, transport and the workshops are threatened by a general stoppage.\n\nThe unions call upon the government to honour its promises. Commanders reply that the strike endangers the revolution itself, and urge the president to restore production by decree."
 mex_ww1_revolution.21.a:0 "Bring the unions and employers to the table."
 mex_ww1_revolution.21.b:0 "Order the workshops reopened."
 MEX_WW1_R_agrarian_claims:0 "Hear the Village Land Claims"
 MEX_WW1_R_agrarian_claims_desc:0 "Petitions have followed the armies from village to village. Surveyors and local commissions must establish which lands were taken, and whose claims can be upheld."
 MEX_WW1_R_agrarian_claims_completion_tt:0 "After §Y150 days§!: Land discontent falls by §G15§! and legitimacy rises by §G5§!. Completed land commissions also ease rural discontent over time."
 MEX_WW1_R_officer_pay:0 "Regularize the Army Payroll"
 MEX_WW1_R_officer_pay_desc:0 "Commands have lived on requisitions and personal loyalties. A reliable payroll will bring the officers closer to the treasury, though their accounts will take months to untangle."
 MEX_WW1_R_officer_pay_completion_tt:0 "After §Y120 days§!: Army autonomy falls by §G12§! and legitimacy rises by §G3§!. With field regulations in place, paid commands become easier to control over time."
 MEX_WW1_R_municipal_hearings:0 "Convene the Municipal Hearings"
 MEX_WW1_R_municipal_hearings_desc:0 "The authority of the capital means little where local officials rule without consent. Public hearings will settle disputes over appointments and allow the municipalities to present their grievances."
 MEX_WW1_R_municipal_hearings_completion_tt:0 "After §Y90 days§!: Legitimacy rises by §G6§!, land discontent falls by §G5§! and army autonomy falls by §G3§!."
 MEX_WW1_R_food_relief:0 "Organize Provincial Food Relief"
 MEX_WW1_R_food_relief_desc:0 "Broken railway lines and competing military requisitions have left towns short of grain. Provincial purchasing offices will arrange shipments and protect civilian supplies."
 MEX_WW1_R_food_relief_completion_tt:0 "After §Y90 days§!: Land discontent falls by §G6§! and legitimacy rises by §G4§!. The food crisis ends."
 MEX_WW1_R_demobilization:0 "Negotiate the Return to Civilian Life"
 MEX_WW1_R_demobilization_desc:0 "The generals cannot simply dismiss the men who brought them to power. Civilian employment and negotiated discharge must replace the promises that kept their armies together."
 MEX_WW1_R_demobilization_completion_tt:0 "After §Y150 days§!: Army autonomy falls by §G18§! and legitimacy rises by §G4§!."
 MEX_WW1_R_fiscal_settlement:0 "Negotiate the Provincial Revenues"
 MEX_WW1_R_fiscal_settlement_desc:0 "Rival authorities have imposed taxes, issued paper money and seized customs receipts. Provincial officials must agree on accounts the national treasury can honour."
 MEX_WW1_R_fiscal_settlement_completion_tt:0 "After §Y120 days§!: Legitimacy rises by §G5§!, army autonomy falls by §G5§! and land discontent falls by §G4§!."
 MEX_WW1_R_labour_arbitration:0 "Arbitrate the Labour Disputes"
 MEX_WW1_R_labour_arbitration_desc:0 "The workers who supported the revolution expect more than promises. Employers, unions and government inspectors will meet to settle wages and the enforcement of labour protections."
 MEX_WW1_R_labour_arbitration_completion_tt:0 "After §Y90 days§!: Legitimacy rises by §G8§!. The general strike and emergency labour decrees end."
