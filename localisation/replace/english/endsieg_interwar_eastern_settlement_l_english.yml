l_english:
 INT_eastern.1.t: "The Eastern Galician Campaign Ends"
 INT_eastern.1.d: "Polish forces have secured the remaining West Ukrainian positions in Eastern Galicia. Lwów and Stanisławów are now administered from Warsaw, although the region's competing national claims remain unsettled. The war between the Polish and West Ukrainian governments is drawing to a close."
 INT_eastern.1.a: "Secure the new frontier"
 INT_eastern.2.t: "The Treaty of Riga"
 INT_eastern.2.d: "Polish and Soviet delegates have signed a peace treaty in Riga. The agreed frontier places western Volhynia, Polesie, Nowogródek, and Wilejka under Polish administration and ends the fighting between the signatories. The status of Vilnius remains a separate Polish-Lithuanian dispute."
 INT_eastern.2.a: "The eastern frontier is settled"
 INT_eastern.11.t: "Poland Secures Eastern Galicia"
 INT_eastern.11.d: "The Polish-West Ukrainian fighting in Eastern Galicia is ending. Polish authorities now administer Stanisławów alongside Lwów, while West Ukrainian forces withdraw from the region. The territory's future remains a source of dispute."
 INT_eastern.11.a: "Another border takes shape"
 INT_eastern.12.t: "Peace Signed at Riga"
 INT_eastern.12.d: "Poland and Soviet Russia have concluded peace at Riga. Their new frontier divides the contested lands of western Belarus and Ukraine, bringing the Polish-Soviet War to an end. The Polish-Lithuanian dispute over Vilnius is not resolved by this treaty."
 INT_eastern.12.a: "A new map of Eastern Europe"
