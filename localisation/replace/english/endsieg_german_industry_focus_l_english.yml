l_english:
 INT_GER_reconstruction_commission: "Postwar Reconstruction Commission"
 INT_GER_reconstruction_commission_desc: "Phase I - Reconstruction. Returning soldiers, strained municipal services and factories built for wartime orders need a coordinated transition to civilian production. Establish a commission to choose reconstruction priorities and open one-time industrial projects."
 INT_GER_roaring_twenties: "The Roaring Twenties"
 INT_GER_roaring_twenties_desc: "Phase III - The Roaring Twenties. A stable currency opens a window for investment, new machinery and rising urban demand. Choose rapid expansion backed by foreign credit or a slower approach built on domestic savings. Credit can accelerate growth, but a withdrawal of lending will leave industry exposed. If this focus is completed after the 1929 crash, the investment program proceeds without a boom bonus."
 INT_GER_electrification: "Connect the Industrial Power Grid"
 INT_GER_electrification_desc: "Coal alone cannot power a modern economy efficiently. Link generating stations and industrial districts, opening a one-time electrification project for a controlled German core state."
 INT_GER_domestic_capital: "Mobilize Domestic Capital"
 INT_GER_domestic_capital_desc: "Savings banks and retained earnings offer an alternative to volatile foreign borrowing. Organize domestic investment and open a savings campaign; the following reserve focus can cushion a later credit shock."
 INT_GER_build_reserves: "Build a Liquidity Reserve"
 INT_GER_build_reserves_desc: "Set aside resources before the crash rather than committing every available mark to expansion. Reserves soften the additional penalty from foreign-credit exposure; they cannot prevent the worldwide Depression. This optional preparation must be finished before 24 October 1929."
 INT_GER_export_guarantees: "Guarantee Industrial Exports"
 INT_GER_export_guarantees_desc: "Machinery and chemical producers need secure orders as much as new equipment. A limited guarantee program opens a one-time export drive during the boom, strengthening manufacturing without promising unlimited foreign demand."
 INT_GER_bank_restructuring: "Restructure the Banking System"
 INT_GER_bank_restructuring_desc: "Phase IV - Depression and Recovery. Consolidate distressed balance sheets and restore the flow of working capital. The banking crisis must be addressed before the broader recovery program can succeed; any additional foreign-credit burden remains until that program is completed."
 INT_GER_industrial_recovery: "An Industry Fit for Recovery"
 INT_GER_industrial_recovery_desc: "Repaired banks, retrained workers and a coherent employment policy can support a lasting recovery. Open a final one-time industrial investment project and prepare German industry for the next decade."
 INT_GER_reconstruction_projects_tt: "Unlocks one-time reconstruction decisions in the German Industrial Development category."
 INT_GER_roaring_twenties_tt: "Opens an investment-policy event. Foreign credit offers faster growth but adds exposure to the 1929 crash. Domestic savings favor resilience. Boom bonuses cannot be gained after the crash."
 INT_GER_electrification_tt: "Unlocks the one-time industrial electrification decision."
 INT_GER_domestic_capital_tt: "Unlocks a domestic savings decision and the focus to build pre-crash reserves."
 INT_GER_export_guarantees_tt: "Unlocks a one-time export promotion decision during the boom years."
 INT_GER_industrial_recovery_tt: "Unlocks a final one-time industrial recovery project."
 INT_GER_grid_bonus: "Industrial Electrification"
 INT_GER_industrial_recovery_bonus: "Industrial Recovery"
