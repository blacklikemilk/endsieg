l_english:
 INT_depression.1.t: "The Great Depression"
 INT_depression.1.d: "The collapse of financial confidence in October 1929 has spread across the world economy. Trade and credit are contracting, factories are slowing, and unemployment is rising. Our government must choose how to answer the crisis."
 INT_depression.1.a: "We must act."

 INT_great_depression: "The Great Depression"
 INT_great_depression_desc: "The global downturn has reduced demand, credit and industrial activity."
 INT_GER_great_depression: "The Great Depression"
 INT_GER_great_depression_desc: "Dependence on foreign credit and collapsing trade have made Germany especially vulnerable."
 INT_USA_great_depression: "The Great Depression"
 INT_USA_great_depression_desc: "Bank failures, collapsing demand and mass unemployment have struck the American economy."
 INT_ENG_great_depression: "The Great Depression"
 INT_ENG_great_depression_desc: "Exports and investment have weakened across Britain and its trading partners."
 INT_FRA_great_depression: "The Great Depression"
 INT_FRA_great_depression_desc: "The global slump has reached France through trade, finance and falling industrial demand."
 INT_ITA_great_depression: "The Great Depression"
 INT_ITA_great_depression_desc: "Shrinking markets and credit have increased pressure on Italian industry."
 INT_JAP_great_depression: "The Great Depression"
 INT_JAP_great_depression_desc: "The collapse of export markets has hit Japanese producers and workers."
 INT_SOV_great_depression: "Global Trade Shock"
 INT_SOV_great_depression_desc: "Central planning limits the direct financial shock, though falling world trade still affects industrial imports."
 INT_depression_aftershock: "Depression Aftershocks"
 INT_depression_aftershock_desc: "Emergency measures have contained the worst damage, but the economy has not fully recovered."
 INT_GER_recovery_program: "Recovery Program"
 INT_GER_recovery_program_desc: "Industry and public finances have begun to recover from the crisis."

 shared_INT_depression_emergency: "Emergency Economic Measures"
 shared_INT_depression_emergency_desc: "Mobilize the government to contain bank failures and unemployment."
 shared_INT_depression_public_works: "Expand Public Works"
 shared_INT_depression_public_works_desc: "Invest in infrastructure and industry to create jobs and sustain demand."
 shared_INT_depression_austerity: "Balance the Budget"
 shared_INT_depression_austerity_desc: "Protect public finances through spending restraint, despite the immediate social cost."
 shared_INT_depression_stabilization: "Stabilize the Economy"
 shared_INT_depression_stabilization_desc: "The worst of the downturn can be contained, although its effects will linger."

 INT_GER_depression_response: "Confront the Great Depression"
 INT_GER_depression_response_desc: "Phase IV - Depression and Recovery. The global collapse of credit and demand requires an emergency response. Choose between public works and austerity, support municipal relief, and prepare a restructuring of the banks. This response does not require completing the boom-era investment projects."
 INT_GER_public_works: "A Public Works Program"
 INT_GER_public_works_desc: "Use public investment to employ workers and revive industry."
 INT_GER_austerity: "Chancellor's Austerity"
 INT_GER_austerity_desc: "Cut spending to defend public finances, accepting greater hardship in the short term."
 INT_GER_recover_from_depression: "German Economic Recovery"
 INT_GER_recover_from_depression_desc: "With a response to unemployment chosen and the banks restructured, begin a broader recovery from 1933. End the Depression and any additional foreign-credit shock, then retrain workers and rebuild industrial confidence."
