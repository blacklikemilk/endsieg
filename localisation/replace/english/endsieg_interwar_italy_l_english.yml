l_english:
 INT_ITA_villa_giusti:0 "After Villa Giusti"
 INT_ITA_villa_giusti_desc:0 "The armistice has ended the fighting with Austria-Hungary, but the peace must still answer the cost of victory."
 INT_ITA_demobilize_army:0 "Demobilize the Army"
 INT_ITA_demobilize_army_desc:0 "Millions of men are returning from the front. Their reintegration will determine the stability of the kingdom."
 INT_ITA_honor_the_veterans:0 "Honor the Veterans"
 INT_ITA_honor_the_veterans_desc:0 "Pensions and employment must give the veterans a stake in the peace they fought to win."
 INT_ITA_adriatic_claims:0 "The Adriatic Settlement"
 INT_ITA_adriatic_claims_desc:0 "Italian delegates press the claims promised during the war while the Allies debate the new frontier."
 INT_ITA_fiume_question:0 "The Fiume Question"
 INT_ITA_fiume_question_desc:0 "D'Annunzio's seizure of Fiume has forced the government to decide how much irregular action it will tolerate."
 INT_ITA_rapallo_settlement:0 "The Treaty of Rapallo"
 INT_ITA_rapallo_settlement_desc:0 "The 1920 treaty with the Kingdom of Serbs, Croats and Slovenes establishes a Free State of Fiume and settles much of the disputed border."
 INT_ITA_annex_fiume:0 "Incorporate Fiume"
 INT_ITA_annex_fiume_desc:0 "The 1924 Treaty of Rome ends the Free State and formally incorporates Fiume into Italy, following the earlier Rapallo settlement."
 INT_ITA_southern_land:0 "Land for the South"
 INT_ITA_southern_land_desc:0 "Smallholders and returning soldiers demand access to land in the Mezzogiorno."
 INT_ITA_red_biennium:0 "The Red Biennium"
 INT_ITA_red_biennium_desc:0 "Factory occupations and rural strikes expose the weakness of the postwar political settlement."
 INT_ITA_fasci_movement:0 "The Fasci di Combattimento"
 INT_ITA_fasci_movement_desc:0 "Veteran militants and nationalist leagues organize against the left and the parliamentary order."
 INT_ITA_national_fascist_party:0 "Organize the National Fascist Party"
 INT_ITA_national_fascist_party_desc:0 "The movement turns from local squads into a national political organization."
 INT_ITA_march_on_rome:0 "The March on Rome"
 INT_ITA_march_on_rome_desc:0 "The government faces a mobilization of Fascist squads. The king must choose who will form a ministry."
 INT_ITA_grand_council:0 "Create the Grand Council"
 INT_ITA_grand_council_desc:0 "Mussolini consolidates the movement by placing party chiefs within a new governing council."
 INT_ITA_acerbo_law:0 "Pass the Acerbo Law"
 INT_ITA_acerbo_law_desc:0 "The electoral law promises a sweeping majority to the largest list and puts the opposition at risk."
 INT_ITA_matteotti_crisis:0 "The Matteotti Crisis"
 INT_ITA_matteotti_crisis_desc:0 "The deputy's disappearance has shaken the government and united its opponents."
 INT_ITA_aventine_opposition:0 "Break the Aventine Opposition"
 INT_ITA_aventine_opposition_desc:0 "The opposition has abandoned the Chamber; the government can outlast it or be forced into compromise."
 INT_ITA_january_declaration:0 "The January Declaration"
 INT_ITA_january_declaration_desc:0 "Mussolini takes responsibility for the regime's violence and challenges parliament to remove him."
 INT_ITA_press_laws:0 "The Press Laws"
 INT_ITA_press_laws_desc:0 "Independent newspapers face censorship as the executive dismantles organized opposition."
 INT_ITA_secret_police:0 "Build the Political Police"
 INT_ITA_secret_police_desc:0 "A national security apparatus watches opponents and suppresses clandestine networks."
 INT_ITA_corporate_state:0 "The Corporate State"
 INT_ITA_corporate_state_desc:0 "The regime replaces free bargaining with state-controlled organizations of labor and industry."
 INT_ITA_lateran_accords:0 "The Lateran Accords"
 INT_ITA_lateran_accords_desc:0 "An agreement with the Holy See can settle the Roman Question after nearly sixty years."
 INT_ITA_youth_organizations:0 "Organize Fascist Youth"
 INT_ITA_youth_organizations_desc:0 "Youth organizations bind education and civic life to the regime's political project."
 INT_ITA_war_debts:0 "The Burden of War Debts"
 INT_ITA_war_debts_desc:0 "Public borrowing and inflation threaten to consume the gains of victory."
 INT_ITA_northern_factories:0 "Reequip Northern Industry"
 INT_ITA_northern_factories_desc:0 "Industrial firms need credit and machinery to move from wartime orders to civilian production."
 INT_ITA_southern_infrastructure:0 "Connect the Mezzogiorno"
 INT_ITA_southern_infrastructure_desc:0 "Railways and roads are needed to tie southern producers to national markets."
 INT_ITA_industrial_credit:0 "Industrial Credit"
 INT_ITA_industrial_credit_desc:0 "A state-backed credit program keeps strategic manufacturers and banks solvent."
 INT_ITA_grain_campaign:0 "The Battle for Grain"
 INT_ITA_grain_campaign_desc:0 "The government seeks higher domestic grain output and a reduced food import bill."
 INT_ITA_quota_ninety:0 "Quota Ninety"
 INT_ITA_quota_ninety_desc:0 "A strong lira is meant to symbolize national strength, though exporters bear the cost."
 INT_ITA_hydroelectric_power:0 "Hydroelectric Power"
 INT_ITA_hydroelectric_power_desc:0 "New generating capacity reduces dependence on imported fuel."
 INT_ITA_public_works:0 "Public Works"
 INT_ITA_public_works_desc:0 "Roads, reclamation and building projects absorb workers displaced by slower industry."
 INT_ITA_depression_response:0 "Confront the Depression"
 INT_ITA_depression_response_desc:0 "Falling trade and weak banks force Rome to choose between retrenchment and intervention."
 INT_ITA_state_rescue:0 "Rescue the Banks"
 INT_ITA_state_rescue_desc:0 "The state assumes troubled industrial holdings to prevent a wider financial collapse."
 INT_ITA_iri:0 "Found the IRI"
 INT_ITA_iri_desc:0 "A public holding company reorganizes banks and industrial firms damaged by the crisis."
 INT_ITA_industrial_recovery:0 "Industrial Recovery"
 INT_ITA_industrial_recovery_desc:0 "Investment in steel and engineering begins to restore production."
 INT_ITA_adriatic_policy:0 "An Adriatic Policy"
 INT_ITA_adriatic_policy_desc:0 "Rome must define a durable relationship with the new states across the Adriatic."
 INT_ITA_albanian_influence:0 "Influence in Albania"
 INT_ITA_albanian_influence_desc:0 "Loans and military missions give Italy a stronger voice across the Strait of Otranto."
 INT_ITA_mediterranean_trade:0 "Mediterranean Trade"
 INT_ITA_mediterranean_trade_desc:0 "Ports and commercial agreements can turn naval position into economic influence."
 INT_ITA_austrian_independence:0 "Guarantee Austria's Independence"
 INT_ITA_austrian_independence_desc:0 "The Alpine frontier depends on an Austria that remains outside German control."
 INT_ITA_stresa_front:0 "The Stresa Front"
 INT_ITA_stresa_front_desc:0 "Italy, Britain and France coordinate their response to German rearmament."
 INT_ITA_colonial_ambitions:0 "Colonial Ambitions"
 INT_ITA_colonial_ambitions_desc:0 "The regime seeks prestige in East Africa, risking a wider diplomatic confrontation."
 INT_ITA_ethiopian_campaign:0 "The Ethiopian Campaign"
 INT_ITA_ethiopian_campaign_desc:0 "The Ethiopian frontier crisis is used as the pretext for a full-scale invasion."
 INT_ITA_army_reorganization:0 "Reorganize the Army"
 INT_ITA_army_reorganization_desc:0 "The army must absorb lessons from the trenches and update its command structure."
 INT_ITA_alpine_fortifications:0 "Strengthen the Alpine Frontier"
 INT_ITA_alpine_fortifications_desc:0 "Permanent defenses support a smaller professional force in the north."
 INT_ITA_officer_training:0 "Professional Officer Training"
 INT_ITA_officer_training_desc:0 "A modern staff college can replace habits inherited from the last war."
 INT_ITA_regia_marina:0 "Modernize the Regia Marina"
 INT_ITA_regia_marina_desc:0 "Shipyards and naval schools prepare the fleet for Mediterranean competition."
 INT_ITA_regia_aeronautica:0 "An Independent Air Force"
 INT_ITA_regia_aeronautica_desc:0 "A separate air service can develop aviation beyond army and navy requirements."
 INT_ITA_mechanized_experiments:0 "Mechanized Experiments"
 INT_ITA_mechanized_experiments_desc:0 "Motor transport and armored vehicles merit careful trials before mass production."
 INT_ITA_logistics_corps:0 "Modern Logistics"
 INT_ITA_logistics_corps_desc:0 "The army's mobility depends on engineers, transport and reliable supply."
 INT_ITA_postwar_dislocation:0 "Postwar Dislocation"
 INT_ITA_postwar_dislocation_desc:0 "Demobilization and inflation are straining the postwar economy."
 INT_ITA_veterans_question:0 "Veterans Question"
 INT_ITA_veterans_question_desc:0 "Unsettled veterans expect work, pensions and recognition."
 INT_ITA_veterans_settlement:0 "Veterans Settlement"
 INT_ITA_veterans_settlement_desc:0 "Veterans have a firmer place in the postwar order."
 INT_ITA_adriatic_compromise:0 "Adriatic Compromise"
 INT_ITA_adriatic_compromise_desc:0 "A negotiated Adriatic settlement has reduced the danger of renewed conflict."
 INT_ITA_southern_land_reform:0 "Southern Land Reform"
 INT_ITA_southern_land_reform_desc:0 "Land reform gives small farmers and veterans a direct stake in recovery."
 INT_ITA_social_unrest:0 "Social Unrest"
 INT_ITA_social_unrest_desc:0 "Strikes and factory occupations disrupt production and weaken governments."
 INT_ITA_squadrist_violence:0 "Squadrist Violence"
 INT_ITA_squadrist_violence_desc:0 "Political squads intimidate opponents and erode public order."
 INT_ITA_fascist_institutions:0 "Fascist Institutions"
 INT_ITA_fascist_institutions_desc:0 "The new regime is building institutions around the Fascist movement."
 INT_ITA_matteotti_crisis_spirit:0 "The Matteotti Crisis"
 INT_ITA_matteotti_crisis_spirit_desc:0 "The murder of a deputy has triggered a grave crisis of legitimacy."
 INT_ITA_authoritarian_regime:0 "Authoritarian Regime"
 INT_ITA_authoritarian_regime_desc:0 "Executive power is concentrated as opposition parties lose their place."
 INT_ITA_censored_press:0 "Censored Press"
 INT_ITA_censored_press_desc:0 "Press controls narrow the space for public opposition."
 INT_ITA_police_state:0 "Police State"
 INT_ITA_police_state_desc:0 "Surveillance and political policing suppress visible dissent."
 INT_ITA_corporatism:0 "Corporatism"
 INT_ITA_corporatism_desc:0 "State-supervised corporations mediate between labor and employers."
 INT_ITA_lateran_settlement:0 "The Lateran Settlement"
 INT_ITA_lateran_settlement_desc:0 "The settlement with the Holy See has ended the Roman Question."
 INT_ITA_war_debt:0 "War Debt"
 INT_ITA_war_debt_desc:0 "Wartime borrowing weighs on the treasury and the currency."
 INT_ITA_northern_industry:0 "Northern Industry"
 INT_ITA_northern_industry_desc:0 "Northern factories are adapting to peacetime orders."
 INT_ITA_southern_infrastructure_spirit:0 "Southern Infrastructure"
 INT_ITA_southern_infrastructure_spirit_desc:0 "Transport investment strengthens links between the south and national markets."
 INT_ITA_industrial_credit_spirit:0 "Industrial Credit"
 INT_ITA_industrial_credit_spirit_desc:0 "Industrial credit protects manufacturers from a prolonged postwar slump."
 INT_ITA_grain_campaign_spirit:0 "Grain Campaign"
 INT_ITA_grain_campaign_spirit_desc:0 "The grain campaign seeks greater domestic food production."
 INT_ITA_strong_lira:0 "Quota Ninety"
 INT_ITA_strong_lira_desc:0 "The strong lira restrains prices but makes exports less competitive."
 INT_ITA_hydroelectric_program:0 "Hydroelectric Program"
 INT_ITA_hydroelectric_program_desc:0 "Electricity projects reduce dependence on imported fuel."
 INT_ITA_public_works_spirit:0 "Public Works"
 INT_ITA_public_works_spirit_desc:0 "Public works provide employment and modernize roads and reclaimed land."
 INT_ITA_depression_pressure:0 "Depression Pressure"
 INT_ITA_depression_pressure_desc:0 "Falling trade and bank losses are spreading through the economy."
 INT_ITA_state_intervention:0 "State Intervention"
 INT_ITA_state_intervention_desc:0 "The state has taken a direct role in rescuing industry."
 INT_ITA_iri_spirit:0 "Institute for Industrial Reconstruction"
 INT_ITA_iri_spirit_desc:0 "The IRI coordinates bank and industrial restructuring."
 INT_ITA_recovered_industry:0 "Recovered Industry"
 INT_ITA_recovered_industry_desc:0 "Italian industry has regained momentum after the crisis."
 INT_ITA_adriatic_policy_spirit:0 "Adriatic Policy"
 INT_ITA_adriatic_policy_spirit_desc:0 "Rome has a clearer diplomatic program for the Adriatic."
 INT_ITA_mediterranean_trade_spirit:0 "Mediterranean Trade"
 INT_ITA_mediterranean_trade_spirit_desc:0 "Commercial links across the Mediterranean support industry and ports."
 INT_ITA_stresa_cooperation:0 "Stresa Cooperation"
 INT_ITA_stresa_cooperation_desc:0 "Cooperation with Britain and France supports European security."
 INT_ITA_colonial_ambition:0 "Colonial Ambition"
 INT_ITA_colonial_ambition_desc:0 "Colonial ambitions raise prestige claims and diplomatic risks."
 INT_ITA_army_reform:0 "Army Reform"
 INT_ITA_army_reform_desc:0 "Command reforms apply lessons from the Great War."
 INT_ITA_alpine_defense:0 "Alpine Defense"
 INT_ITA_alpine_defense_desc:0 "Alpine defenses support a strategy of holding the northern frontier."
 INT_ITA_naval_program:0 "Naval Program"
 INT_ITA_naval_program_desc:0 "Shipyards and naval schools are modernizing the fleet."
 INT_ITA_air_program:0 "Air Program"
 INT_ITA_air_program_desc:0 "The independent air service develops training and doctrine."
 INT_ITA_logistics_reform:0 "Logistics Reform"
 INT_ITA_logistics_reform_desc:0 "Better transport and supply improve army readiness."
 INT_ita_interwar.1.t:0 "D'Annunzio Enters Fiume"
 INT_ita_interwar.1.d:0 "Gabriele D'Annunzio and a column of volunteers have entered Fiume. The occupation defies the peace conference and draws nationalists to their cause, while the government must weigh its Adriatic claims against its relations with the Allies."
 INT_ita_interwar.1.a:0 "Rome must respond."
 INT_ita_interwar.2.t:0 "The Factories Are Occupied"
 INT_ita_interwar.2.d:0 "Workers have occupied factories across northern Italy. Employers demand protection, unions call for control of production, and the government faces a dangerous test of its ability to negotiate."
 INT_ita_interwar.2.a:0 "Seek a settlement."
 INT_ita_interwar.3.t:0 "A Fragmented Chamber"
 INT_ita_interwar.3.d:0 "The election has left no party with a secure majority. Socialists and Catholic deputies have made major gains, and the old liberal bloc must build a coalition in an increasingly divided Chamber."
 INT_ita_interwar.3.a:0 "Build a ministry."
 INT_ita_interwar.4.t:0 "The Treaty of Rapallo"
 INT_ita_interwar.4.d:0 "Italy and the Kingdom of Serbs, Croats and Slovenes have agreed on an Adriatic settlement. Fiume becomes a free state for now, while the agreement provides a diplomatic answer to the border dispute."
 INT_ita_interwar.4.a:0 "Accept the agreement."
 INT_ita_interwar.5.t:0 "The King Appoints Mussolini"
 INT_ita_interwar.5.d:0 "The Fascist mobilization has brought the government to a standstill. The king has asked Benito Mussolini to form a cabinet; the decision brings the movement into power without resolving whether parliament can restrain it."
 INT_ita_interwar.5.a:0 "A new government takes office."
 INT_ita_interwar.6.t:0 "The Acerbo Law Passes"
 INT_ita_interwar.6.d:0 "Parliament has approved an electoral law awarding a decisive majority to the leading list. Fascist leaders call it a cure for unstable cabinets; opponents warn that it places the next election under coercive pressure."
 INT_ita_interwar.6.a:0 "The law is passed."
 INT_ita_interwar.7.t:0 "Matteotti Is Missing"
 INT_ita_interwar.7.d:0 "Socialist deputy Giacomo Matteotti has disappeared after denouncing violence and fraud in the election. His absence is becoming a national crisis, and opposition deputies demand an independent inquiry."
 INT_ita_interwar.7.a:0 "The Chamber demands answers."
 INT_ita_interwar.8.t:0 "Mussolini Addresses the Chamber"
 INT_ita_interwar.8.d:0 "Mussolini has challenged parliament to remove him while accepting political responsibility for his movement's actions. The speech marks a decisive turn toward open dictatorship."
 INT_ita_interwar.8.a:0 "The regime takes its course."
 INT_ita_interwar.9.t:0 "The Lateran Accords Are Signed"
 INT_ita_interwar.9.d:0 "Italy and the Holy See have signed agreements recognizing Vatican City and settling the financial and political dispute left by the capture of Rome. The accord brings a new relationship between the state and the Church."
 INT_ita_interwar.9.a:0 "The Roman Question is settled."
 INT_ita_interwar.10.t:0 "The Crisis Reaches Italy"
 INT_ita_interwar.10.d:0 "Foreign demand is falling and the banking system faces mounting losses. Italy has been slower to feel the worldwide collapse, but the government now faces rising unemployment and a shrinking export market."
 INT_ita_interwar.10.a:0 "The treasury must act."
 INT_ita_interwar.11.t:0 "The IRI Is Established"
 INT_ita_interwar.11.d:0 "The government has created the Institute for Industrial Reconstruction to take over distressed bank holdings and reorganize industrial firms. Its rescue operation puts a substantial share of the economy under state control."
 INT_ita_interwar.11.a:0 "Reorganize the banks."
 INT_ita_interwar.12.t:0 "The Stresa Conference"
 INT_ita_interwar.12.d:0 "Italian, British and French representatives have met at Stresa to oppose unilateral changes to Europe's security settlement. The common declaration promises consultation, though each government has its own priorities."
 INT_ita_interwar.12.a:0 "Consult with our partners."
 INT_ita_interwar.13.t:0 "War Begins in Ethiopia"
 INT_ita_interwar.13.d:0 "Italian forces have crossed into Ethiopia from Eritrea and Somaliland. The campaign promises imperial prestige, while the League of Nations and other powers consider their response."
 INT_ita_interwar.13.a:0 "The campaign has begun."
 INT_ita_interwar.14.t:0 "The Lira at Ninety"
 INT_ita_interwar.14.d:0 "Mussolini has announced a strong-lira target against sterling. The policy offers monetary prestige but raises costs for exporters and threatens employment in competitive industries."
 INT_ita_interwar.14.a:0 "Defend the lira."
 INT_ita_interwar.15.t:0 "The Battle for Grain"
 INT_ita_interwar.15.d:0 "The government is launching a campaign to raise wheat output and limit food imports. Farmers are being pressed to change acreage and methods, with uncertain results for other crops."
 INT_ita_interwar.15.a:0 "Increase production."
 INT_ita_interwar.16.t:0 "The Fascists Form a Party"
 INT_ita_interwar.16.d:0 "Mussolini's movement has organized as the National Fascist Party. Its leaders hope to turn local squads and veteran associations into a force able to enter government."
 INT_ita_interwar.16.a:0 "The movement is organized."
 INT_ita_news.1.t:0 "Italian Nationalists Occupy Fiume"
 INT_ita_news.1.d:0 "D'Annunzio's volunteers have seized Fiume and declared that the city must join Italy. Rome has not sanctioned the expedition, leaving the Adriatic settlement in doubt."
 INT_ita_news.1.a:0 "A new chapter in Europe."
 INT_ita_news.2.t:0 "Factory Occupations Spread in Italy"
 INT_ita_news.2.d:0 "Workers have taken over factories in northern Italy as strikes and political violence spread. The government faces pressure from employers, unions and the army to restore order."
 INT_ita_news.2.a:0 "A new chapter in Europe."
 INT_ita_news.3.t:0 "Mussolini Forms an Italian Government"
 INT_ita_news.3.d:0 "After the Fascist March on Rome, King Victor Emmanuel III has asked Benito Mussolini to form a cabinet. Europe is watching whether the new government will operate within Italy's parliamentary system."
 INT_ita_news.3.a:0 "A new chapter in Europe."
 INT_ita_news.4.t:0 "Matteotti's Disappearance Shakes Italy"
 INT_ita_news.4.d:0 "The disappearance of Socialist deputy Giacomo Matteotti has provoked public anger in Italy. Opposition deputies blame Fascist violence and demand an investigation."
 INT_ita_news.4.a:0 "A new chapter in Europe."
 INT_ita_news.5.t:0 "Mussolini Consolidates Power"
 INT_ita_news.5.d:0 "Mussolini has answered the crisis in the Chamber by asserting the authority of his government. His opponents now face a regime moving openly toward dictatorship."
 INT_ita_news.5.a:0 "A new chapter in Europe."
 INT_ita_news.6.t:0 "Italy and the Holy See Reach an Accord"
 INT_ita_news.6.d:0 "The Lateran Accords recognize Vatican City and end the long dispute between the Italian state and the papacy. Both sides present the settlement as a new beginning."
 INT_ita_news.6.a:0 "A new chapter in Europe."
 INT_ita_news.7.t:0 "Italy Creates an Industrial Rescue Agency"
 INT_ita_news.7.d:0 "Rome has established the IRI to rescue banks and reorganize failing industrial holdings. The decision gives the Italian state a much larger economic role."
 INT_ita_news.7.a:0 "A new chapter in Europe."
 INT_ita_news.8.t:0 "The Powers Meet at Stresa"
 INT_ita_news.8.d:0 "Italy, Britain and France have issued a joint declaration at Stresa in response to German rearmament. Their cooperation will be tested by their different strategic aims."
 INT_ita_news.8.a:0 "A new chapter in Europe."
 INT_ita_news.9.t:0 "Italy Invades Ethiopia"
 INT_ita_news.9.d:0 "Italian forces have entered Ethiopia from the north and east. The war is drawing international scrutiny and threatens to reshape Mediterranean diplomacy."
 INT_ita_news.9.a:0 "A new chapter in Europe."
 INT_ita_news.10.t:0 "An Adriatic Treaty Is Signed"
 INT_ita_news.10.d:0 "Italy and the Kingdom of Serbs, Croats and Slovenes have agreed to a new border settlement at Rapallo. Fiume's status remains a delicate part of the compromise."
 INT_ita_news.10.a:0 "A new chapter in Europe."
 INT_ita_news.11.t:0 "Italy Faces the World Slump"
 INT_ita_news.11.d:0 "The collapse in world trade has reached Italy's banks and factories. Rome is weighing how far the state should intervene to contain the crisis."
 INT_ita_news.11.a:0 "A new chapter in Europe."
 INT_ita_news.12.t:0 "A National Fascist Party Is Founded"
 INT_ita_news.12.d:0 "Mussolini's movement has formed a national party in Italy. Its rise follows years of postwar unrest and the spread of Fascist squads."
 INT_ita_news.12.a:0 "A new chapter in Europe."
 INT_ITA_militia_1923:0 "Organize the Voluntary Militia"
 INT_ITA_militia_1923_desc:0 "The Blackshirt squads are brought into the Milizia Volontaria per la Sicurezza Nazionale, giving the movement an armed institution beside the regular forces."
 INT_ITA_april_1924_election:0 "The April 1924 Election"
 INT_ITA_april_1924_election_desc:0 "The National List wins under the Acerbo law amid intimidation and violence. Matteotti's challenge to the result will soon threaten the government."
 INT_ITA_exceptional_laws:0 "The Exceptional Laws"
 INT_ITA_exceptional_laws_desc:0 "Legislation in 1925 and 1926 dismantles independent opposition and concentrates executive authority in the regime."
 INT_ITA_1929_plebiscite:0 "The 1929 Plebiscite"
 INT_ITA_1929_plebiscite_desc:0 "Voters are offered a single list for the Chamber of Deputies, displaying the regime's control of parliamentary representation."
 INT_ITA_autostrada_dei_laghi:0 "Open the Autostrada dei Laghi"
 INT_ITA_autostrada_dei_laghi_desc:0 "The Milan-Varese road opens in 1924 and demonstrates a new route for motor traffic and civil engineering."
 INT_ITA_integral_reclamation:0 "The Integral Reclamation Law"
 INT_ITA_integral_reclamation_desc:0 "The 1928 law funds drainage, settlement and agricultural works, especially in marshland areas."
 INT_ITA_imi:0 "Establish the IMI"
 INT_ITA_imi_desc:0 "The Istituto Mobiliare Italiano, founded in 1931, supplies longer-term credit to industry as the banking crisis deepens."
 INT_ITA_corfu_crisis:0 "The Corfu Crisis"
 INT_ITA_corfu_crisis_desc:0 "After the murder of an Italian boundary commission, the government occupies Corfu and demands compensation from Greece. International pressure soon brings withdrawal."
 INT_ITA_tirana_pact:0 "The First Treaty of Tirana"
 INT_ITA_tirana_pact_desc:0 "The 1926 pact with Albania formalizes friendship and security while deepening Italy's influence across the Adriatic."
 INT_ITA_second_tirana_pact:0 "The Second Treaty of Tirana"
 INT_ITA_second_tirana_pact_desc:0 "A defensive alliance signed in 1927 tightens Italian military and political ties with Albania."
 INT_ITA_rome_protocols:0 "The Rome Protocols"
 INT_ITA_rome_protocols_desc:0 "Italy, Austria and Hungary agree in 1934 to closer political consultation and preferential economic cooperation in the Danube basin."
 INT_ITA_franco_italian_accord:0 "The Franco-Italian Accord"
 INT_ITA_franco_italian_accord_desc:0 "Mussolini and Laval agree in January 1935 to consult on Austrian independence and settle several colonial disputes."
 INT_ITA_washington_naval_treaty:0 "The Washington Naval Treaty"
 INT_ITA_washington_naval_treaty_desc:0 "Italy accepts the 1922 capital-ship limits and plans its fleet within the naval treaty system."
 INT_ITA_london_naval_treaty:0 "The London Naval Treaty"
 INT_ITA_london_naval_treaty_desc:0 "Italy signs the 1930 treaty's capital-ship and submarine provisions, while the powers leave cruiser and destroyer quotas unresolved."
 INT_ITA_littorio_program:0 "Lay Down the Littorio Class"
 INT_ITA_littorio_program_desc:0 "The keels of Littorio and Vittorio Veneto are laid in 1934, beginning a new generation of Italian battleships."
 INT_ITA_alpine_wall:0 "Expand the Alpine Wall"
 INT_ITA_alpine_wall_desc:0 "Border fortification programs expand through the early 1930s along the northern approaches."
 INT_ITA_balbo_atlantic_flight:0 "Balbo's Atlantic Flight"
 INT_ITA_balbo_atlantic_flight_desc:0 "Italo Balbo's mass formation flight reaches Chicago in 1933, displaying the range and organization of Italian aviation."
 INT_ITA_fiume_integrated:0 "Fiume Incorporated"
 INT_ITA_fiume_integrated_desc:0 "The legal settlement of 1924 formally brings Fiume into the kingdom."
 INT_ITA_party_militia:0 "The Voluntary Militia"
 INT_ITA_party_militia_desc:0 "The party militia places organized political force at the regime's disposal."
 INT_ITA_electoral_coercion:0 "Electoral Coercion"
 INT_ITA_electoral_coercion_desc:0 "Violence and pressure surrounding the 1924 election undermine public confidence in the Chamber."
 INT_ITA_one_party_state:0 "One-Party State"
 INT_ITA_one_party_state_desc:0 "The exceptional laws close legal space for organized political opposition."
 INT_ITA_plebiscitary_chamber:0 "Plebiscitary Chamber"
 INT_ITA_plebiscitary_chamber_desc:0 "A single national list reduces parliamentary elections to an endorsement of the regime."
 INT_ITA_motor_roads:0 "Motor Roads"
 INT_ITA_motor_roads_desc:0 "New roads built for motor vehicles improve connections around Italy's industrial centers."
 INT_ITA_land_reclamation:0 "Integral Reclamation"
 INT_ITA_land_reclamation_desc:0 "Drainage and settlement works reshape farmland, though their results differ sharply by region."
 INT_ITA_imi_credit:0 "IMI Industrial Credit"
 INT_ITA_imi_credit_desc:0 "The new public institution directs medium and long-term finance toward industry."
 INT_ITA_tirana_influence:0 "The Tirana Pact"
 INT_ITA_tirana_influence_desc:0 "The friendship and security pact gives Italy a stronger position in Albania."
 INT_ITA_albanian_military_mission:0 "Albanian Military Ties"
 INT_ITA_albanian_military_mission_desc:0 "Italian officers, equipment and loans deepen Albania's dependence on Rome."
 INT_ITA_danubian_protocols:0 "Danubian Cooperation"
 INT_ITA_danubian_protocols_desc:0 "The Rome Protocols support Italian trade and diplomatic influence in Austria and Hungary."
 INT_ITA_french_consultation:0 "French-Italian Consultation"
 INT_ITA_french_consultation_desc:0 "Paris and Rome agree to consult if Austrian independence is threatened."
 INT_ITA_treaty_navy:0 "Treaty Navy"
 INT_ITA_treaty_navy_desc:0 "The Regia Marina develops its shipbuilding plans under the Washington treaty limits."
 INT_ITA_capital_ship_program:0 "Capital Ship Program"
 INT_ITA_capital_ship_program_desc:0 "Italian yards begin work on the new Littorio-class battleships."
 INT_ITA_alpine_wall_spirit:0 "Alpine Wall"
 INT_ITA_alpine_wall_spirit_desc:0 "Permanent border defenses reinforce the northern frontier."
 INT_ITA_national_reconstruction:0 "National Reconstruction"
 INT_ITA_national_reconstruction_desc:0 "The kingdom must turn the armistice into a workable peace by restoring public administration and civilian production."
 INT_ITA_proportional_reform:0 "Proportional Reform"
 INT_ITA_proportional_reform_desc:0 "A proportional electoral law gives the fractured postwar electorate a chance to organize within parliament."
 INT_ITA_popular_partito:0 "Build the Popular Party"
 INT_ITA_popular_partito_desc:0 "Catholic organizers create a mass party that can mediate between local associations, the Church and the liberal state."
 INT_ITA_factory_commissions:0 "Recognize the Factory Commissions"
 INT_ITA_factory_commissions_desc:0 "Worker councils have seized a place in northern industry; negotiated recognition may prevent another escalation of the Red Biennium."
 INT_ITA_rural_cooperatives:0 "Support Rural Cooperatives"
 INT_ITA_rural_cooperatives_desc:0 "Credit and collective purchasing give smallholders in the Mezzogiorno a stronger position against land fragmentation and debt."
 INT_ITA_social_insurance:0 "Extend Social Insurance"
 INT_ITA_social_insurance_desc:0 "Insurance schemes for sickness, injury and unemployment offer workers a stake in the fragile postwar settlement."
 INT_ITA_liberal_coalition:0 "Form a Liberal Coalition"
 INT_ITA_liberal_coalition_desc:0 "Liberals, Catholics and constitutional reformers attempt to hold together a parliamentary majority before the streets decide Italy's future."
 INT_ITA_labor_compromise:0 "Negotiate a Labour Compromise"
 INT_ITA_labor_compromise_desc:0 "Employers and unions receive a framework for bargaining that keeps industrial disputes inside the law."
 INT_ITA_constitutional_guard:0 "Guard the Constitution"
 INT_ITA_constitutional_guard_desc:0 "The crown, parliament and civil service are instructed to resist private armies and preserve the constitutional order."
 INT_ITA_national_education:0 "Invest in National Education"
 INT_ITA_national_education_desc:0 "Schools and technical institutes are expanded so that a literate workforce can support a modern economy."
 INT_ITA_railway_reintegration:0 "Reintegrate the Railways"
 INT_ITA_railway_reintegration_desc:0 "A unified rail service reconnects northern industry, southern farms and returning veterans with national markets."
 INT_ITA_chamber_reform:0 "Reform the Chamber"
 INT_ITA_chamber_reform_desc:0 "Committee work and responsible ministries give parliament tools to govern amid factional pressure."
 INT_ITA_organized_local_government:0 "Organize Local Government"
 INT_ITA_organized_local_government_desc:0 "Municipal councils receive clearer responsibilities for relief, schools and public works."
 INT_ITA_civic_compromise:0 "A Civic Compromise"
 INT_ITA_civic_compromise_desc:0 "A broader civic settlement links social reform, constitutional government and national reconstruction."
 INT_ITA_electrify_the_north:0 "Electrify the North"
 INT_ITA_electrify_the_north_desc:0 "Hydroelectric generation in the Alps feeds the factories of Lombardy, Piedmont and Liguria."
 INT_ITA_fiat_retooling:0 "Retool Fiat"
 INT_ITA_fiat_retooling_desc:0 "Turin's engineering firms turn wartime machine capacity toward automobiles, tractors and precision tools."
 INT_ITA_state_railways:0 "Modernize the State Railways"
 INT_ITA_state_railways_desc:0 "A coordinated railway service standardizes equipment and moves coal, grain and manufactured goods more reliably."
 INT_ITA_port_of_genoa:0 "Expand the Port of Genoa"
 INT_ITA_port_of_genoa_desc:0 "Modern quays and cranes strengthen Italy's principal Atlantic and Mediterranean commercial gateway."
 INT_ITA_triestine_shipyards:0 "Restore the Triestine Shipyards"
 INT_ITA_triestine_shipyards_desc:0 "The yards of Trieste are folded into the national industrial system and prepared for naval and merchant construction."
 INT_ITA_steel_consortium:0 "A Steel Consortium"
 INT_ITA_steel_consortium_desc:0 "Credit and state coordination keep the iron and steel combine supplied while private banks struggle."
 INT_ITA_mezzogiorno_credit:0 "Credit for the Mezzogiorno"
 INT_ITA_mezzogiorno_credit_desc:0 "Long-term loans help southern municipalities build roads, irrigation and small industries."
 INT_ITA_cooperative_farms:0 "Organize Cooperative Farms"
 INT_ITA_cooperative_farms_desc:0 "Cooperative storage and purchasing make the Battle for Grain less dependent on the largest estates."
 INT_ITA_fertilizer_program:0 "A Fertilizer Program"
 INT_ITA_fertilizer_program_desc:0 "Domestic fertilizer production raises yields and reduces the foreign exchange cost of feeding Italy."
 INT_ITA_marshland_settlement:0 "Settle the Reclaimed Marshes"
 INT_ITA_marshland_settlement_desc:0 "Drainage, roads and planned settlements turn parts of the Pontine marshes into productive farmland."
 INT_ITA_iri_steel_holdings:0 "Consolidate IRI Holdings"
 INT_ITA_iri_steel_holdings_desc:0 "The Institute for Industrial Reconstruction takes a more deliberate role in steel, credit and strategic engineering."
 INT_ITA_human_capital:0 "Build Human Capital"
 INT_ITA_human_capital_desc:0 "Technical schools and apprenticeships prepare a larger pool of engineers and skilled industrial workers."
 INT_ITA_synthetic_fuel_research:0 "Research Synthetic Fuels"
 INT_ITA_synthetic_fuel_research_desc:0 "Italian laboratories study ways to turn domestic electricity and chemistry into a partial answer to imported fuel dependence."
 INT_ITA_recovery_budget:0 "Fund the Recovery Budget"
 INT_ITA_recovery_budget_desc:0 "Industrial credit, public works and disciplined spending are combined into a final prewar recovery program."
 INT_ITA_league_of_nations:0 "Work Through the League"
 INT_ITA_league_of_nations_desc:0 "Italy uses its seat at Geneva to defend its interests through the institutions it helped create after the war."
 INT_ITA_locarno_spirit:0 "The Locarno Spirit"
 INT_ITA_locarno_spirit_desc:0 "The 1925 security settlement offers Rome a chance to balance frontier security with negotiated diplomacy."
 INT_ITA_mediterranean_conference:0 "A Mediterranean Conference"
 INT_ITA_mediterranean_conference_desc:0 "Italy seeks a practical understanding among Mediterranean powers over commerce, shipping and regional stability."
 INT_ITA_turkey_friendship:0 "Friendship With Turkey"
 INT_ITA_turkey_friendship_desc:0 "The 1928 treaty of friendship opens a cautious channel between Rome and Ankara across the eastern Mediterranean."
 INT_ITA_dodecanese_administration:0 "Administer the Dodecanese"
 INT_ITA_dodecanese_administration_desc:0 "Ports and administration in the Dodecanese are improved as Italy consolidates its island possessions."
 INT_ITA_libya_pacification:0 "Pacify Libya"
 INT_ITA_libya_pacification_desc:0 "The colonial army combines roads, garrisons and coercion in an effort to end organized resistance in Cyrenaica."
 INT_ITA_eritrea_development:0 "Develop Eritrea"
 INT_ITA_eritrea_development_desc:0 "Roads, ports and agricultural projects in Eritrea support the Red Sea colonies and their garrisons."
 INT_ITA_somalia_development:0 "Develop Italian Somaliland"
 INT_ITA_somalia_development_desc:0 "River works and coastal infrastructure make the Somali colony more useful to Rome's commercial and military plans."
 INT_ITA_colonial_service:0 "Professionalize the Colonial Service"
 INT_ITA_colonial_service_desc:0 "Officers and administrators are trained for the distinct demands of Italy's African possessions."
 INT_ITA_ethiopian_road_network:0 "Prepare East African Road Networks"
 INT_ITA_ethiopian_road_network_desc:0 "Engineering surveys, depots and expedition logistics are assembled before the Ethiopian crisis becomes an open war."
 INT_ITA_african_logistics:0 "African Logistics"
 INT_ITA_african_logistics_desc:0 "Roads, depots and transport units improve the supply chain for overseas operations."
 INT_ITA_austrian_guarantee:0 "Oppose Anschluss"
 INT_ITA_austrian_guarantee_desc:0 "Rome makes the defense of Austrian independence a visible part of its Alpine diplomacy as German pressure mounts."
 INT_ITA_rome_diplomatic_mission:0 "A Mission to the Danube"
 INT_ITA_rome_diplomatic_mission_desc:0 "Italian diplomats turn the Rome Protocols into regular economic and political consultations."
 INT_ITA_stresa_consultation:0 "Consult at Stresa"
 INT_ITA_stresa_consultation_desc:0 "The Stresa partners seek a common answer to German rearmament while their colonial interests pull them apart."
 INT_ITA_sanctions_preparation:0 "Prepare for Sanctions"
 INT_ITA_sanctions_preparation_desc:0 "The Ethiopian campaign may bring League sanctions, so Rome prepares shipping, reserves and political messaging."
 INT_ITA_general_staff:0 "Rebuild the General Staff"
 INT_ITA_general_staff_desc:0 "A professional staff system studies the failures of 1915-18 and coordinates a modern army."
 INT_ITA_alpine_divisions:0 "Raise Alpine Divisions"
 INT_ITA_alpine_divisions_desc:0 "Specialist formations are prepared for the passes and fortified valleys of the northern frontier."
 INT_ITA_artillery_modernization:0 "Modernize the Artillery"
 INT_ITA_artillery_modernization_desc:0 "New guns, observation methods and ammunition doctrine give the army more reliable fire support."
 INT_ITA_carabinieri_service:0 "Expand the Carabinieri Service"
 INT_ITA_carabinieri_service_desc:0 "The Carabinieri extend military policing, border security and domestic public order without replacing the field army."
 INT_ITA_field_exercises:0 "Hold Field Exercises"
 INT_ITA_field_exercises_desc:0 "Staff exercises test the army's ability to move formations and supply them beyond the railhead."
 INT_ITA_tankette_trials:0 "Trial Tankettes"
 INT_ITA_tankette_trials_desc:0 "Small armored vehicles are tested as reconnaissance and infantry support machines in Italy's difficult terrain."
 INT_ITA_motor_transport:0 "Expand Motor Transport"
 INT_ITA_motor_transport_desc:0 "Trucks and maintenance units begin to close the gap between Italy's road ambitions and its army's mobility."
 INT_ITA_divisional_reforms:0 "Reform the Divisions"
 INT_ITA_divisional_reforms_desc:0 "Division tables are revised around artillery, engineers and transport rather than simply repeating the last war's organization."
 INT_ITA_submarine_arm:0 "Develop the Submarine Arm"
 INT_ITA_submarine_arm_desc:0 "Within treaty limits, Italian yards refine a submarine force suited to the narrow seas around the peninsula."
 INT_ITA_taranto_base:0 "Expand Taranto"
 INT_ITA_taranto_base_desc:0 "The naval base at Taranto receives workshops, fuel stores and training facilities for the fleet's main anchorage."
 INT_ITA_naval_air_arm:0 "Coordinate Naval Aviation"
 INT_ITA_naval_air_arm_desc:0 "Seaplanes and fleet officers cooperate so that the Regia Marina can find and track ships across the Mediterranean."
 INT_ITA_cruiser_squadrons:0 "Form Cruiser Squadrons"
 INT_ITA_cruiser_squadrons_desc:0 "Fast cruisers are organized for scouting, convoy protection and presence missions under the London treaty regime."
 INT_ITA_bomber_doctrine:0 "Debate the Bomber Doctrine"
 INT_ITA_bomber_doctrine_desc:0 "The independent air force tests whether massed bombers can substitute for the heavy artillery Italy cannot easily deploy overseas."
 INT_ITA_airfield_network:0 "Build the Airfield Network"
 INT_ITA_airfield_network_desc:0 "Permanent fields, depots and weather stations give Italian aircraft a wider reach before the next crisis."
 INT_ITA_modern_command:0 "Modernize Command"
 INT_ITA_modern_command_desc:0 "Army, fleet and air staff officers establish common planning habits after years of separate modernization programs."
 INT_ITA_joint_staff:0 "Create a Joint Staff"
 INT_ITA_joint_staff_desc:0 "Joint planning links logistics, naval movement and air reconnaissance into one national defense system."
 INT_ITA_1935_mobilization:0 "Mobilize for the Ethiopian War"
 INT_ITA_1935_mobilization_desc:0 "The 1935 crisis demands a final call-up, with colonial logistics and modern command placed on a war footing."
 INT_ITA_reconstruction:0 "National Reconstruction"
 INT_ITA_reconstruction_desc:0 "A coordinated postwar program restores public administration and civilian production."
 INT_ITA_electoral_reform:0 "Proportional Reform"
 INT_ITA_electoral_reform_desc:0 "A broader electoral system gives organized postwar movements a place in public life."
 INT_ITA_catholic_network:0 "Catholic Civic Network"
 INT_ITA_catholic_network_desc:0 "Parish associations and mutual aid societies strengthen social stability."
 INT_ITA_labor_mediation:0 "Labour Mediation"
 INT_ITA_labor_mediation_desc:0 "Employers and unions gain channels for settling industrial disputes."
 INT_ITA_electrification:0 "Northern Electrification"
 INT_ITA_electrification_desc:0 "Hydroelectric power raises industrial capacity in the northern regions."
 INT_ITA_engineering_sector:0 "Engineering Sector"
 INT_ITA_engineering_sector_desc:0 "Machine builders and automobile firms expand Italy's industrial base."
 INT_ITA_port_development:0 "Port Development"
 INT_ITA_port_development_desc:0 "Modern quays and cranes improve Italy's maritime trade and shipbuilding."
 INT_ITA_southern_credit:0 "Southern Credit"
 INT_ITA_southern_credit_desc:0 "Long-term loans bring infrastructure and small industry to the Mezzogiorno."
 INT_ITA_agrarian_cooperatives:0 "Agrarian Cooperatives"
 INT_ITA_agrarian_cooperatives_desc:0 "Cooperative storage and purchasing raise the resilience of small farms."
 INT_ITA_public_industry:0 "Public Industry"
 INT_ITA_public_industry_desc:0 "The IRI coordinates finance and strategic industrial holdings."
 INT_ITA_technical_education:0 "Technical Education"
 INT_ITA_technical_education_desc:0 "Apprenticeships and technical schools supply engineers for recovery."
 INT_ITA_league_diplomacy:0 "League Diplomacy"
 INT_ITA_league_diplomacy_desc:0 "Italian diplomacy works through the postwar League institutions."
 INT_ITA_turkish_friendship:0 "Turkish Friendship"
 INT_ITA_turkish_friendship_desc:0 "The friendship treaty opens a stable channel with Ankara."
 INT_ITA_alpine_guarantee:0 "Alpine Guarantee"
 INT_ITA_alpine_guarantee_desc:0 "Italian diplomacy commits to the independence of the Alpine buffer."
 INT_ITA_danubian_mission:0 "Danubian Mission"
 INT_ITA_danubian_mission_desc:0 "Economic and political missions turn the Rome Protocols into a working network."
 INT_ITA_sanctions_resistance:0 "Sanctions Resistance"
 INT_ITA_sanctions_resistance_desc:0 "Italy prepares its economy and public for the cost of League sanctions."
 INT_ITA_mobilization:0 "1935 Mobilization"
 INT_ITA_mobilization_desc:0 "Colonial logistics and a modern command system are placed on a war footing."
 INT_ita_interwar.18.t:0 "Fiume Is Incorporated"
 INT_ita_interwar.18.d:0 "The Treaty of Rome has ended the Free State of Fiume. The port is now formally incorporated into Italy, completing a settlement that began with the 1920 Treaty of Rapallo."
 INT_ita_interwar.18.a:0 "The Adriatic settlement is complete."
 INT_ita_interwar.19.t:0 "The Corfu Crisis"
 INT_ita_interwar.19.d:0 "Italian forces have occupied Corfu after the murder of members of an Italian boundary commission. Greece disputes responsibility, and the League of Nations is drawn into the crisis."
 INT_ita_interwar.19.a:0 "Press our demands."
 INT_ita_interwar.20.t:0 "A Pact With Albania"
 INT_ita_interwar.20.d:0 "Italy and Albania have signed a treaty of friendship and security at Tirana. Loans and advisers already give Rome considerable influence, and the new pact formalizes their relationship."
 INT_ita_interwar.20.a:0 "Strengthen Adriatic ties."
 INT_ita_interwar.21.t:0 "A Second Treaty of Tirana"
 INT_ita_interwar.21.d:0 "Rome and Tirana have concluded a defensive alliance. The agreement draws Albania's armed forces closer to Italy and alarms its neighbors."
 INT_ita_interwar.21.a:0 "Expand the military mission."
 INT_ita_interwar.22.t:0 "The Integral Reclamation Law"
 INT_ita_interwar.22.d:0 "A new law expands state support for draining marshes and settling reclaimed land. Officials promise work and farmland, although the scale of the undertaking remains large."
 INT_ita_interwar.22.a:0 "Begin the works."
 INT_ita_interwar.23.t:0 "The IMI Is Created"
 INT_ita_interwar.23.d:0 "The Istituto Mobiliare Italiano is being established to provide longer-term industrial finance as banks struggle with frozen assets and failing firms."
 INT_ita_interwar.23.a:0 "Direct credit to industry."
 INT_ita_interwar.24.t:0 "The Rome Protocols"
 INT_ita_interwar.24.d:0 "Italy, Austria and Hungary have signed protocols for consultation and closer economic relations. Rome hopes the agreements will strengthen its place in Central Europe."
 INT_ita_interwar.24.a:0 "Work with Vienna and Budapest."
 INT_ita_interwar.25.t:0 "Laval Visits Rome"
 INT_ita_interwar.25.d:0 "French and Italian leaders have agreed to consult on Austrian independence and settled a series of colonial questions. Their agreement opens the way for wider talks on European security."
 INT_ita_interwar.25.a:0 "Consult with France."
 INT_ita_interwar.26.t:0 "The July Putsch in Austria"
 INT_ita_interwar.26.d:0 "A Nazi coup attempt in Vienna has killed Chancellor Dollfuss. Italy is moving troops toward the Brenner as Rome signals that it will resist German interference in Austria."
 INT_ita_interwar.26.a:0 "Watch the Alpine frontier."
 INT_ita_interwar.27.t:0 "The National List Wins"
 INT_ita_interwar.27.d:0 "The Fascist-led National List has won the parliamentary election under the Acerbo law. Opposition deputies report intimidation and violence throughout the campaign."
 INT_ita_interwar.27.a:0 "The Chamber convenes."
 INT_ita_news.13.t:0 "Fiume Formally Joins Italy"
 INT_ita_news.13.d:0 "The Treaty of Rome has dissolved the Free State of Fiume and formally incorporated the port into Italy. The agreement follows the Adriatic settlement reached at Rapallo in 1920."
 INT_ita_news.13.a:0 "The border is settled."
 INT_ita_news.14.t:0 "Italy Occupies Corfu"
 INT_ita_news.14.d:0 "Italian forces have occupied the Greek island of Corfu after the murder of Italian commissioners on the Albanian frontier. The dispute is before the League of Nations."
 INT_ita_news.14.a:0 "Europe watches."
 INT_ita_news.15.t:0 "Italy and Albania Sign a Pact"
 INT_ita_news.15.d:0 "A friendship and security treaty signed at Tirana has reinforced Italian influence in Albania. The agreement is being watched closely in the Balkans."
 INT_ita_news.15.a:0 "Adriatic politics shift."
 INT_ita_news.16.t:0 "Rome Protocols Signed"
 INT_ita_news.16.d:0 "Italy, Austria and Hungary have agreed to closer consultation and economic cooperation. Rome presents the pact as a means of strengthening the Danube region."
 INT_ita_news.16.a:0 "A new regional arrangement."
 INT_ita_news.17.t:0 "France and Italy Reach an Accord"
 INT_ita_news.17.d:0 "French and Italian leaders have reached agreements in Rome covering Austrian independence and colonial disputes. Their rapprochement may shape Europe's response to German rearmament."
 INT_ita_news.17.a:0 "The powers consult."
 INT_ita_news.18.t:0 "A Failed Coup in Austria"
 INT_ita_news.18.d:0 "A Nazi coup attempt in Vienna has killed Chancellor Dollfuss. Italy has moved troops toward the Brenner and signaled opposition to a German move against Austria."
 INT_ita_news.18.a:0 "The frontier is tense."
 INT_ita_news.19.t:0 "Fascist National List Wins Italian Election"
 INT_ita_news.19.d:0 "The National List has won Italy's election under the Acerbo law. Opposition parties denounce intimidation and violence during the campaign."
 INT_ita_news.19.a:0 "A crisis may follow."
