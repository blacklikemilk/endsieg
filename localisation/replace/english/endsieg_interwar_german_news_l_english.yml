l_english:
 INT_ger_news.1.t:0 "Germany Adopts a Republican Constitution"
 INT_ger_news.1.d:0 "Delegates meeting in Weimar approve a constitution for the new German republic. It places lawmaking in an elected Reichstag, provides for a directly elected president, and guarantees civil rights after years of war and revolution. Supporters hail a democratic beginning; opponents on both extremes question whether parliamentary compromise can meet the demands of peace, demobilization, and economic recovery. The government now has institutions on paper and must make them work in practice."
 INT_ger_news.1.a:0 "The republic takes shape."
 INT_ger_news.2.t:0 "General Strike Defeats the Kapp Putsch"
 INT_ger_news.2.d:0 "The attempt to overthrow the German republic is collapsing. Civil servants refuse the putschists their cooperation, and a nationwide general strike stops transport, utilities, and much of industry. Wolfgang Kapp and his allies cannot turn their seizure of Berlin into a functioning government. The constitutional cabinet prepares to return, but the crisis exposes the uncertain loyalty of the army and leaves armed conflict and bitter questions of accountability behind it."
 INT_ger_news.2.a:0 "The republic survives this test."
 INT_ger_news.3.t:0 "Foreign Minister Rathenau Assassinated"
 INT_ger_news.3.d:0 "Berlin reports the murder of Foreign Minister Walther Rathenau by right-wing extremists. The industrialist and statesman is trying to ease Germany's diplomatic isolation while negotiating its obligations abroad. His killers present him as a symbol of the republic they reject. Public demonstrations gather in his memory, and the government faces urgent demands to curb political violence before another attack shakes the fragile constitutional order."
 INT_ger_news.3.a:0 "A grave loss for the republic."
 INT_ger_news.4.t:0 "Germany Ends Passive Resistance in the Ruhr"
 INT_ger_news.4.d:0 "The German government orders an end to passive resistance against the French and Belgian occupation of the Ruhr. Strikes and non-cooperation have kept the conflict alive, but paying idle workers while industry stands still is exhausting the treasury and accelerating the collapse of the mark. The decision opens the way to negotiations and currency reform, even as many Germans condemn it as a surrender under foreign pressure."
 INT_ger_news.4.a:0 "The occupation still casts a shadow."
 INT_ger_news.5.t:0 "Germany Moves to Stabilize the Mark"
 INT_ger_news.5.d:0 "The government is putting a new currency into circulation as the paper mark loses the last of its purchasing power. Officials promise firm limits on issue and seek confidence from businesses and households that now calculate prices by the hour. Reichsbank president Hjalmar Schacht is charged with defending monetary stability. The reform cannot restore destroyed savings, but shops, wages, and public accounts finally have a chance to function again."
 INT_ger_news.5.a:0 "Confidence must be rebuilt."
 INT_ger_news.6.t:0 "Hindenburg Elected Reich President"
 INT_ger_news.6.d:0 "Paul von Hindenburg wins Germany's presidential election and succeeds the late Friedrich Ebert. The former field marshal commands great prestige among conservatives and veterans, while republican parties warn that his supporters often distrust the democratic constitution. Hindenburg pledges to serve as head of state, with the power to appoint chancellors and act in emergencies. Berlin now waits to see how he will use an office with far-reaching authority."
 INT_ger_news.6.a:0 "A new president takes office."
 INT_ger_news.7.t:0 "European Powers Agree at Locarno"
 INT_ger_news.7.d:0 "German, French, Belgian, British, and Italian delegates announce a set of security agreements at Locarno. Germany accepts its western frontiers and the demilitarized status of the Rhineland; Britain and Italy undertake to guarantee the settlement. Disputes with Germany's eastern neighbors are referred to arbitration, without a comparable guarantee of those borders. Supporters see a path away from postwar isolation, while critics at home argue over the price of reconciliation."
 INT_ger_news.7.a:0 "A diplomatic opening in Europe."
 INT_ger_news.8.t:0 "Germany Enters the League of Nations"
 INT_ger_news.8.d:0 "The League of Nations welcomes Germany into its assembly at Geneva. Foreign Minister Gustav Stresemann presents admission as recognition that the republic has a voice in European affairs again. Membership offers a forum for diplomacy and a permanent seat on the League Council, but it also asks Berlin to work within a settlement many Germans still seek to revise. Delegates applaud; the harder work of cooperation begins now."
 INT_ger_news.8.a:0 "Germany returns to the council table."
 INT_ger_news.9.t:0 "The Economic Crisis Reaches Germany"
 INT_ger_news.9.d:0 "The collapse on the New York stock market is spreading across the Atlantic. American lenders call in short-term loans, German banks face pressure, and firms begin cutting orders and shifts. The recovery of recent years depends heavily on foreign credit and export markets; both are now uncertain. Ministers promise action, but workers and employers alike fear that an overseas financial panic is becoming a German social crisis."
 INT_ger_news.9.a:0 "The government faces an economic emergency."
 INT_ger_news.10.t:0 "Young Plan Reshapes German Reparations"
 INT_ger_news.10.d:0 "An international settlement revises the schedule of German reparations under the Young Plan. The agreement reduces annual payments and restores more control over German financial institutions, while the other powers promise an earlier end to the Rhineland occupation. Government supporters call it a practical improvement on the Dawes framework. Nationalist opponents reject the remaining obligations, and the worsening world economy raises doubts about whether even the revised payments can be sustained."
 INT_ger_news.10.a:0 "The reparations debate continues."
 INT_ger_news.11.t:0 "Presidential Decree Topples the Prussian Government"
 INT_ger_news.11.d:0 "President Hindenburg issues an emergency decree placing Prussia under Reich control. Chancellor Franz von Papen becomes Reich Commissioner and removes the caretaker government of Otto Braun; Interior Minister Carl Severing is forced out as officials move against the state administration and police. The government calls the intervention necessary to restore order. Republicans denounce it as a blow to federalism and one of the strongest remaining centers of democratic power."
 INT_ger_news.11.a:0 "Prussia is placed under Reich authority."
 INT_ger_news.12.t:0 "Hitler Appointed Reich Chancellor"
 INT_ger_news.12.d:0 "President Hindenburg appoints Adolf Hitler Reich Chancellor after weeks of negotiations among conservative leaders. The new cabinet includes National Socialists alongside traditional right-wing ministers who claim they can restrain him. Crowds gather in Berlin as supporters celebrate and opponents fear for the republic's future. The direction of German government now rests with a chancellor whose party openly challenges parliamentary democracy."
 INT_ger_news.12.a:0 "Germany enters an uncertain new era."
 INT_ger_news.13.t:0 "Germany and Soviet Russia Sign at Rapallo"
 INT_ger_news.13.d:0 "German and Soviet Russian delegates announce a treaty at Rapallo while the Genoa economic conference is still in progress. The governments restore diplomatic relations and give up claims for wartime costs and confiscated property. Foreign Minister Walther Rathenau calls the agreement a practical answer to the isolation of both states. Western delegates are surprised, and neighboring governments ask what further cooperation may follow. For now, Berlin and Moscow have opened a diplomatic and commercial channel."
 INT_ger_news.13.a:0 "Two isolated states reopen relations."
 INT_ger_news.14.t:0 "French and Belgian Forces Enter the Ruhr"
 INT_ger_news.14.d:0 "French and Belgian troops are moving into Germany's Ruhr industrial district over disputed reparations deliveries. Berlin rejects the occupation and calls on officials and workers to refuse cooperation. Coal pits, factories, and railways are caught between the occupiers and the government's promise to sustain passive resistance. The confrontation threatens production across Europe and puts Germany's already fragile currency under still greater strain."
 INT_ger_news.14.a:0 "The reparations dispute becomes an occupation."
 INT_ger_news.15.t:0 "Germany's Mark Loses Its Value"
 INT_ger_news.15.d:0 "Germany's currency crisis is consuming wages and savings. Shops revise prices several times a day; families hurry to buy necessities before their pay loses value. The government continues to finance support for workers resisting the Ruhr occupation while tax receipts cannot keep pace with spending. Officials are discussing a new monetary foundation, but the paper mark is collapsing before they can put one in place."
 INT_ger_news.15.a:0 "Every day of delay destroys more savings."
 INT_ger_news.16.t:0 "Lausanne Ends the Reparations Schedule"
 INT_ger_news.16.d:0 "Negotiators at Lausanne agree to suspend the remaining German reparations amid the world economic crisis. The earlier Dawes and Young schedules cannot be sustained while trade, credit, and employment are contracting. Berlin welcomes relief from a burden that has shaped its politics since the war, while the other powers still seek a wider settlement of intergovernmental debts. The decision eases Germany's treasury, but it does not by itself restore jobs or political stability."
 INT_ger_news.16.a:0 "A central postwar dispute is set aside."
 INT_ger_news.17.t:0 "German Cabinet Gains Legislative Powers"
 INT_ger_news.17.d:0 "Germany's Reichstag has approved a law allowing Hitler's cabinet to pass legislation without normal parliamentary consent. The vote takes place amid intimidation and the exclusion of Communist deputies. Social Democratic opponents protest that the chamber is surrendering the constitution it is meant to protect. The government can now reshape the state by decree and statute with little effective parliamentary check."
 INT_ger_news.17.a:0 "Parliament's authority is broken."
 INT_ger_news.18.t:0 "President Hindenburg Dies"
 INT_ger_news.18.d:0 "President Paul von Hindenburg has died after months of failing health. His office carried the prestige of the old army and the final formal authority above Germany's chancellor. A law prepared by the Hitler cabinet combines the presidency with the chancellorship, and soldiers are ordered to pledge loyalty to Hitler personally. Germany's remaining constitutional separation of those offices disappears with Hindenburg's death."
 INT_ger_news.18.a:0 "The presidency is absorbed into the chancellorship."
