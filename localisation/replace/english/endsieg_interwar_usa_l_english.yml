l_english:
 INT_USA_postwar_adjustment:0 "The Postwar Republic"
 INT_USA_postwar_adjustment_desc:0 "The armistice brings our soldiers home, but demobilisation and a changing world demand new choices from Washington."
 INT_USA_league_debate:0 "Debate the League of Nations"
 INT_USA_league_debate_desc:0 "Wilson argues for a new international order while senators question any permanent commitment abroad."
 INT_USA_senate_rejection:0 "The Senate Rejects Versailles"
 INT_USA_senate_rejection_desc:0 "The treaty fails to win the Senate consent needed for ratification, leaving peace without American membership in the League."
 INT_USA_red_scare:0 "The First Red Scare"
 INT_USA_red_scare_desc:0 "Raids and investigations answer fears of revolution, but civil liberties and public confidence suffer."
 INT_USA_nineteenth_amendment:0 "Ratify the Nineteenth Amendment"
 INT_USA_nineteenth_amendment_desc:0 "Women gain the constitutional right to vote after decades of national campaigning."
 INT_USA_election_1920:0 "The Election of 1920"
 INT_USA_election_1920_desc:0 "Voters turn from Wilsonian internationalism toward Harding and a promise of normalcy."
 INT_USA_harding_administration:0 "The Harding Administration"
 INT_USA_harding_administration_desc:0 "A new Republican administration seeks lower taxes, limited federal government and a return to ordinary life."
 INT_USA_teapot_dome:0 "The Teapot Dome Scandal"
 INT_USA_teapot_dome_desc:0 "Questions over federal oil leases erode faith in the administration and prompt investigation."
 INT_USA_coolidge_succeeds:0 "Coolidge Succeeds Harding"
 INT_USA_coolidge_succeeds_desc:0 "Harding has died in office; Vice President Coolidge now assumes the presidency."
 INT_USA_immigration_act:0 "The Immigration Act of 1924"
 INT_USA_immigration_act_desc:0 "Congress sharply restricts immigration through national-origin quotas and exclusion."
 INT_USA_election_1924:0 "Coolidge Wins a Full Term"
 INT_USA_election_1924_desc:0 "Coolidge secures his own electoral mandate amid growing prosperity and a divided opposition."
 INT_USA_election_1928:0 "The Election of 1928"
 INT_USA_election_1928_desc:0 "Herbert Hoover campaigns on continued prosperity while the country debates prohibition and religion."
 INT_USA_hoover_administration:0 "The Hoover Administration"
 INT_USA_hoover_administration_desc:0 "Hoover enters office confident in American enterprise, unaware of the shock approaching the financial system."
 INT_USA_election_1932:0 "The Election of 1932"
 INT_USA_election_1932_desc:0 "The Depression gives Franklin Roosevelt a mandate to seek relief, recovery and reform."
 INT_USA_roosevelt_inauguration:0 "Roosevelt Takes Office"
 INT_USA_roosevelt_inauguration_desc:0 "Roosevelt calls for energetic federal action as banks close and unemployment rises."
 INT_USA_fireside_chats:0 "Speak to the Nation"
 INT_USA_fireside_chats_desc:0 "The president uses radio to explain the banking emergency directly to households across the country."
 INT_USA_demobilize:0 "Demobilise the War Economy"
 INT_USA_demobilize_desc:0 "Contracts end and millions of servicemen return to civilian work."
 INT_USA_postwar_recession:0 "The Postwar Recession"
 INT_USA_postwar_recession_desc:0 "Prices and employment swing sharply as wartime demand fades."
 INT_USA_railroad_return:0 "Return the Railroads"
 INT_USA_railroad_return_desc:0 "Federal wartime operation ends and railways return to private management."
 INT_USA_emergency_tariff:0 "The Emergency Tariff"
 INT_USA_emergency_tariff_desc:0 "Congress raises duties to protect farmers and domestic producers from foreign competition."
 INT_USA_fordney_mccumber:0 "The Fordney-McCumber Tariff"
 INT_USA_fordney_mccumber_desc:0 "Higher tariff schedules entrench protection as an economic principle."
 INT_USA_automobile_industry:0 "The Automobile Industry"
 INT_USA_automobile_industry_desc:0 "Motor manufacturing transforms factories, roads and the scale of domestic demand."
 INT_USA_electrification:0 "Expand Electrification"
 INT_USA_electrification_desc:0 "Electric power reaches more homes and factories, increasing productivity."
 INT_USA_farm_crisis:0 "The Farm Crisis"
 INT_USA_farm_crisis_desc:0 "Agricultural prices remain weak even while cities and factories prosper."
 INT_USA_consumer_credit:0 "The Credit Economy"
 INT_USA_consumer_credit_desc:0 "Instalment buying broadens access to consumer goods and deepens household debt."
 INT_USA_roaring_twenties:0 "The Roaring Twenties"
 INT_USA_roaring_twenties_desc:0 "Industry and finance expand, masking deeper weaknesses in banks and agriculture."
 INT_USA_wall_street_crash:0 "The Wall Street Crash"
 INT_USA_wall_street_crash_desc:0 "Share prices collapse, exposing fragile credit and shaking public confidence."
 INT_USA_smoot_hawley:0 "The Smoot-Hawley Tariff"
 INT_USA_smoot_hawley_desc:0 "New duties seek domestic protection but invite retaliation and strain world trade."
 INT_USA_bank_failures:0 "The Banking Panics"
 INT_USA_bank_failures_desc:0 "Bank failures spread as depositors lose confidence and credit dries up."
 INT_USA_reconstruction_finance:0 "The Reconstruction Finance Corporation"
 INT_USA_reconstruction_finance_desc:0 "Federal credit goes to banks, railroads and other institutions under severe pressure."
 INT_USA_hoover_relief:0 "Emergency Relief and Construction"
 INT_USA_hoover_relief_desc:0 "Congress authorises additional loans and public works as the crisis deepens."
 INT_USA_bank_holiday:0 "Declare a Bank Holiday"
 INT_USA_bank_holiday_desc:0 "Roosevelt suspends banking transactions to stop runs and inspect the system."
 INT_USA_emergency_banking:0 "The Emergency Banking Act"
 INT_USA_emergency_banking_desc:0 "Congress gives the government new authority to reopen sound banks and restore deposits."
 INT_USA_ccc:0 "The Civilian Conservation Corps"
 INT_USA_ccc_desc:0 "Young men enter conservation work, receiving wages while improving public land."
 INT_USA_tva:0 "The Tennessee Valley Authority"
 INT_USA_tva_desc:0 "Federal investment promises power, flood control and development across the Tennessee Valley."
 INT_USA_aaa:0 "Agricultural Adjustment"
 INT_USA_aaa_desc:0 "The government tries to raise farm prices by managing production."
 INT_USA_nira:0 "National Industrial Recovery"
 INT_USA_nira_desc:0 "Industrial codes and public works form a central part of the early New Deal."
 INT_USA_glass_steagall:0 "Banking Reform and Deposit Insurance"
 INT_USA_glass_steagall_desc:0 "New banking rules separate activities and protect ordinary deposits."
 INT_USA_gold_reserve:0 "The Gold Reserve Act"
 INT_USA_gold_reserve_desc:0 "Federal control of monetary gold gives the administration room to adjust the dollar."
 INT_USA_wpa:0 "The Works Progress Administration"
 INT_USA_wpa_desc:0 "Federal projects provide employment on roads, buildings and other public works."
 INT_USA_wagner_act:0 "The Wagner Act"
 INT_USA_wagner_act_desc:0 "Congress protects collective bargaining and creates a national labor board."
 INT_USA_social_security:0 "Social Security"
 INT_USA_social_security_desc:0 "Old-age benefits and unemployment insurance establish a new federal safety net."
 INT_USA_paris_peace:0 "The Paris Peace Conference"
 INT_USA_paris_peace_desc:0 "Wilson takes his principles to Europe, where Allied priorities often differ from ours."
 INT_USA_washington_conference:0 "The Washington Conference"
 INT_USA_washington_conference_desc:0 "Naval powers gather in Washington to restrain the fleet competition of the postwar years."
 INT_USA_five_power_treaty:0 "The Five-Power Treaty"
 INT_USA_five_power_treaty_desc:0 "Limits on capital-ship tonnage establish a new naval balance in the Pacific."
 INT_USA_dawes_plan:0 "The Dawes Plan"
 INT_USA_dawes_plan_desc:0 "American finance helps reorganise German reparations and European debt payments."
 INT_USA_kellogg_briand:0 "The Kellogg-Briand Pact"
 INT_USA_kellogg_briand_desc:0 "Nations pledge to renounce war as a tool of national policy."
 INT_USA_london_naval:0 "The London Naval Treaty"
 INT_USA_london_naval_desc:0 "The principal naval powers agree to further limits on cruisers, destroyers and submarines."
 INT_USA_stimson_doctrine:0 "The Stimson Doctrine"
 INT_USA_stimson_doctrine_desc:0 "Washington refuses to recognise territorial changes achieved by force in Manchuria."
 INT_USA_good_neighbor:0 "The Good Neighbor Policy"
 INT_USA_good_neighbor_desc:0 "Roosevelt promises greater respect for the sovereignty of the American republics."
 INT_USA_recognize_soviet:0 "Recognise the Soviet Union"
 INT_USA_recognize_soviet_desc:0 "Washington opens formal diplomatic relations with Moscow."
 INT_USA_reciprocal_trade:0 "Reciprocal Trade Agreements"
 INT_USA_reciprocal_trade_desc:0 "The administration receives authority to negotiate lower tariffs with trading partners."
 INT_USA_neutrality_act:0 "The Neutrality Act"
 INT_USA_neutrality_act_desc:0 "Congress restricts arms sales to belligerents to keep America clear of foreign wars."
 INT_USA_army_demobilization:0 "A Peacetime Army"
 INT_USA_army_demobilization_desc:0 "The Army shrinks rapidly after the armistice while officers preserve lessons from France."
 INT_USA_naval_limits:0 "Adapt to Naval Limits"
 INT_USA_naval_limits_desc:0 "The Navy revises its plans under treaty tonnage ceilings."
 INT_USA_army_air_service:0 "Develop the Air Service"
 INT_USA_army_air_service_desc:0 "The Army Air Service tests doctrine and new aircraft in the postwar years."
 INT_USA_air_corps:0 "Create the Army Air Corps"
 INT_USA_air_corps_desc:0 "Air power receives a more distinct place inside the Army structure."
 INT_USA_naval_aviation:0 "Expand Naval Aviation"
 INT_USA_naval_aviation_desc:0 "Carriers and patrol aircraft become central to planning for the Pacific."
 INT_USA_fleet_exercises:0 "Fleet Problems"
 INT_USA_fleet_exercises_desc:0 "Large exercises test how ships, aircraft and logistics operate across the ocean."
 INT_USA_naval_construction:0 "Authorise Naval Construction"
 INT_USA_naval_construction_desc:0 "Congress funds ships within the treaty limits as tensions abroad grow."
 INT_USA_vinson_trammell:0 "The Vinson-Trammell Program"
 INT_USA_vinson_trammell_desc:0 "A long-term building programme aims to bring the fleet to authorised treaty strength."
 INT_USA_army_modernisation:0 "Modernise the Army"
 INT_USA_army_modernisation_desc:0 "Training, motor transport and equipment prepare the small peacetime force for future demands."
 INT_USA_postwar_readjustment_spirit:0 "Postwar Readjustment"
 INT_USA_postwar_readjustment_spirit_desc:0 "The transition from wartime procurement to civilian production strains employment and public finances."
 INT_USA_isolationist_congress_spirit:0 "An Isolationist Congress"
 INT_USA_isolationist_congress_spirit_desc:0 "Senators resist binding commitments to European security."
 INT_USA_red_scare_spirit:0 "The First Red Scare"
 INT_USA_red_scare_spirit_desc:0 "Fear of radicalism and political violence has sharpened domestic divisions."
 INT_USA_normalcy_spirit:0 "Return to Normalcy"
 INT_USA_normalcy_spirit_desc:0 "The administration promises stability and a smaller federal role after the war."
 INT_USA_immigration_restrictions_spirit:0 "Immigration Restrictions"
 INT_USA_immigration_restrictions_spirit_desc:0 "The 1924 quota system has radically reduced immigration."
 INT_USA_postwar_recession_spirit:0 "Postwar Recession"
 INT_USA_postwar_recession_spirit_desc:0 "A sharp contraction follows the end of wartime demand."
 INT_USA_protectionism_spirit:0 "Protectionist Tariffs"
 INT_USA_protectionism_spirit_desc:0 "Higher duties shield domestic markets while narrowing foreign trade."
 INT_USA_motor_industry_spirit:0 "Motor Industry"
 INT_USA_motor_industry_spirit_desc:0 "Automobile production supports a broad network of suppliers and workers."
 INT_USA_electrification_spirit:0 "Industrial Electrification"
 INT_USA_electrification_spirit_desc:0 "Electric power improves factory output and the reach of consumer industry."
 INT_USA_farm_crisis_spirit:0 "Farm Crisis"
 INT_USA_farm_crisis_spirit_desc:0 "Farm incomes remain depressed despite urban prosperity."
 INT_USA_industrial_boom_spirit:0 "Industrial Boom"
 INT_USA_industrial_boom_spirit_desc:0 "Factories enjoy strong output and consumer demand."
 INT_USA_smoot_hawley_spirit:0 "Smoot-Hawley Tariff"
 INT_USA_smoot_hawley_spirit_desc:0 "Retaliatory tariffs reduce access to foreign markets."
 INT_USA_bank_failures_spirit:0 "Bank Failures"
 INT_USA_bank_failures_spirit_desc:0 "Depositors and firms face collapsing credit and widespread closures."
 INT_USA_reconstruction_finance_spirit:0 "Reconstruction Finance Corporation"
 INT_USA_reconstruction_finance_spirit_desc:0 "Federal lending supports banks and other institutions in distress."
 INT_USA_bank_holiday_spirit:0 "National Bank Holiday"
 INT_USA_bank_holiday_spirit_desc:0 "Banking transactions are temporarily suspended while institutions are examined."
 INT_USA_banking_reform_spirit:0 "Emergency Banking Reform"
 INT_USA_banking_reform_spirit_desc:0 "Inspected banks reopen under new federal guarantees and authority."
 INT_USA_civilian_conservation_spirit:0 "Civilian Conservation Corps"
 INT_USA_civilian_conservation_spirit_desc:0 "Conservation employment improves public land and infrastructure."
 INT_USA_tva_spirit:0 "Tennessee Valley Authority"
 INT_USA_tva_spirit_desc:0 "Regional power and flood-control projects stimulate development."
 INT_USA_agricultural_adjustment_spirit:0 "Agricultural Adjustment"
 INT_USA_agricultural_adjustment_spirit_desc:0 "Federal measures seek to lift farm purchasing power."
 INT_USA_industrial_recovery_spirit:0 "Industrial Recovery"
 INT_USA_industrial_recovery_spirit_desc:0 "New Deal industrial policy encourages wages, codes and public investment."
 INT_USA_deposit_insurance_spirit:0 "Deposit Insurance"
 INT_USA_deposit_insurance_spirit_desc:0 "Federal insurance helps restore confidence in banks."
 INT_USA_gold_policy_spirit:0 "Gold Reserve Policy"
 INT_USA_gold_policy_spirit_desc:0 "Federal control of monetary gold gives the Treasury greater flexibility."
 INT_USA_public_works_spirit:0 "Public Works Employment"
 INT_USA_public_works_spirit_desc:0 "Federal works projects provide jobs and improve roads and public buildings."
 INT_USA_collective_bargaining_spirit:0 "Collective Bargaining Rights"
 INT_USA_collective_bargaining_spirit_desc:0 "Federal law protects workers organising and bargaining collectively."
 INT_USA_social_security_spirit:0 "Social Security"
 INT_USA_social_security_spirit_desc:0 "Old-age and unemployment benefits provide a new social safety net."
 INT_USA_new_deal_mandate_spirit:0 "New Deal Mandate"
 INT_USA_new_deal_mandate_spirit_desc:0 "The administration has broad support to act against the economic crisis."
 INT_USA_naval_treaty_spirit:0 "Washington Naval Treaty"
 INT_USA_naval_treaty_spirit_desc:0 "Treaty limits guide fleet planning and capital-ship construction."
 INT_USA_good_neighbor_spirit:0 "Good Neighbor Policy"
 INT_USA_good_neighbor_spirit_desc:0 "Washington pursues less interventionist relations in the Americas."
 INT_USA_reciprocal_trade_spirit:0 "Reciprocal Trade Agreements"
 INT_USA_reciprocal_trade_spirit_desc:0 "Negotiated tariff reductions open selected foreign markets."
 INT_USA_neutrality_policy_spirit:0 "Neutrality Legislation"
 INT_USA_neutrality_policy_spirit_desc:0 "Congress restricts arms sales to belligerents in foreign wars."
 INT_USA_naval_construction_spirit:0 "Naval Construction Program"
 INT_USA_naval_construction_spirit_desc:0 "Congress funds new ships within existing treaty limits."
 INT_USA_prohibition:0 "Prohibition Takes Effect"
 INT_USA_prohibition_desc:0 "The Eighteenth Amendment and the Volstead Act prohibit the production and sale of alcoholic beverages."
 INT_USA_repeal_prohibition:0 "Repeal Prohibition"
 INT_USA_repeal_prohibition_desc:0 "The Twenty-first Amendment ends national prohibition and returns alcohol regulation to the states."
 INT_USA_indian_citizenship:0 "The Indian Citizenship Act"
 INT_USA_indian_citizenship_desc:0 "Congress grants citizenship to Indigenous Americans, although state voting barriers remain."
 INT_USA_prohibition_spirit:0 "National Prohibition"
 INT_USA_prohibition_spirit_desc:0 "The nationwide alcohol ban is difficult to enforce and fuels organised crime."
 INT_usa_interwar.1.t:0 "The Senate Rejects the Treaty"
 INT_usa_interwar.1.d:0 "The Senate has refused to ratify the Versailles settlement. President Wilson remains committed to the League, but the constitutional majority is not there."
 INT_usa_interwar.1.a:0 "We must respond."
 INT_usa_interwar.2.t:0 "The Nineteenth Amendment"
 INT_usa_interwar.2.d:0 "The final state has ratified the constitutional amendment prohibiting the denial of the vote on grounds of sex."
 INT_usa_interwar.2.a:0 "We must respond."
 INT_usa_interwar.3.t:0 "Harding Takes Office"
 INT_usa_interwar.3.d:0 "Warren G. Harding takes the oath of office, promising a return to normalcy after the demands of war and peace negotiations."
 INT_usa_interwar.3.a:0 "We must respond."
 INT_usa_interwar.4.t:0 "The Washington Naval Treaty"
 INT_usa_interwar.4.d:0 "Delegates have signed the Five-Power Treaty, setting tonnage limits for capital ships and a new Pacific balance."
 INT_usa_interwar.4.a:0 "We must respond."
 INT_usa_interwar.5.t:0 "Coolidge Succeeds Harding"
 INT_usa_interwar.5.d:0 "President Harding has died in San Francisco. Calvin Coolidge takes the oath and assumes the responsibilities of the presidency."
 INT_usa_interwar.5.a:0 "We must respond."
 INT_usa_interwar.6.t:0 "The Immigration Act"
 INT_usa_interwar.6.d:0 "The new immigration law imposes national-origin quotas and excludes immigrants from much of Asia."
 INT_usa_interwar.6.a:0 "We must respond."
 INT_usa_interwar.7.t:0 "Hoover Takes Office"
 INT_usa_interwar.7.d:0 "Herbert Hoover enters the White House after promising continued prosperity and efficient government."
 INT_usa_interwar.7.a:0 "We must respond."
 INT_usa_interwar.8.t:0 "The Stock Market Crashes"
 INT_usa_interwar.8.d:0 "Share prices plunge in New York. The shock exposes speculative credit and begins to spread far beyond Wall Street."
 INT_usa_interwar.8.a:0 "We must respond."
 INT_usa_interwar.9.t:0 "Smoot-Hawley Becomes Law"
 INT_usa_interwar.9.d:0 "The president has signed a broad tariff increase despite warnings that other governments may retaliate."
 INT_usa_interwar.9.a:0 "We must respond."
 INT_usa_interwar.10.t:0 "The Reconstruction Finance Corporation"
 INT_usa_interwar.10.d:0 "Congress authorises a federal lending agency to support banks, railroads and other institutions under pressure."
 INT_usa_interwar.10.a:0 "We must respond."
 INT_usa_interwar.11.t:0 "Roosevelt Is Inaugurated"
 INT_usa_interwar.11.d:0 "Franklin Roosevelt takes office amid widespread unemployment and bank failures, calling for direct federal action."
 INT_usa_interwar.11.a:0 "We must respond."
 INT_usa_interwar.12.t:0 "A National Bank Holiday"
 INT_usa_interwar.12.d:0 "Roosevelt suspends banking transactions while officials inspect institutions and seek a way to halt withdrawals."
 INT_usa_interwar.12.a:0 "We must respond."
 INT_usa_interwar.13.t:0 "The Emergency Banking Act"
 INT_usa_interwar.13.d:0 "Congress has passed emergency legislation, allowing sound banks to reopen with federal support."
 INT_usa_interwar.13.a:0 "We must respond."
 INT_usa_interwar.14.t:0 "The Civilian Conservation Corps"
 INT_usa_interwar.14.d:0 "A new federal corps offers paid conservation work to unemployed young men."
 INT_usa_interwar.14.a:0 "We must respond."
 INT_usa_interwar.15.t:0 "The Tennessee Valley Authority"
 INT_usa_interwar.15.d:0 "Congress creates a federal authority to develop power, flood control and navigation across the Tennessee Valley."
 INT_usa_interwar.15.a:0 "We must respond."
 INT_usa_interwar.16.t:0 "National Industrial Recovery"
 INT_usa_interwar.16.d:0 "The National Industrial Recovery Act establishes industrial codes and authorises major public works."
 INT_usa_interwar.16.a:0 "We must respond."
 INT_usa_interwar.17.t:0 "Recognition of the Soviet Union"
 INT_usa_interwar.17.d:0 "Washington and Moscow establish diplomatic relations after years without formal recognition."
 INT_usa_interwar.17.a:0 "We must respond."
 INT_usa_interwar.18.t:0 "The Gold Reserve Act"
 INT_usa_interwar.18.d:0 "Congress places monetary gold under Treasury control and changes the framework for the dollar."
 INT_usa_interwar.18.a:0 "We must respond."
 INT_usa_interwar.19.t:0 "The Wagner Act"
 INT_usa_interwar.19.d:0 "Federal law now protects collective bargaining and establishes a national labor board."
 INT_usa_interwar.19.a:0 "We must respond."
 INT_usa_interwar.20.t:0 "Social Security Becomes Law"
 INT_usa_interwar.20.d:0 "The president signs a system of old-age benefits and unemployment insurance into law."
 INT_usa_interwar.20.a:0 "We must respond."
 INT_usa_interwar.21.t:0 "The Neutrality Act"
 INT_usa_interwar.21.d:0 "Congress restricts arms exports to countries at war as public opinion seeks to avoid another foreign conflict."
 INT_usa_interwar.21.a:0 "We must respond."
 INT_usa_interwar.22.t:0 "National Prohibition Begins"
 INT_usa_interwar.22.d:0 "The Eighteenth Amendment takes effect, banning the manufacture and sale of alcoholic beverages."
 INT_usa_interwar.22.a:0 "We must respond."
 INT_usa_interwar.23.t:0 "Prohibition Is Repealed"
 INT_usa_interwar.23.d:0 "Ratification of the Twenty-first Amendment ends national prohibition and returns alcohol regulation to the states."
 INT_usa_interwar.23.a:0 "We must respond."
 INT_usa_news.a:0 "The world takes notice."
 INT_usa_news.1.t:0 "America Rejects the Versailles Treaty"
 INT_usa_news.1.d:0 "The United States Senate has rejected ratification of the Versailles treaty, blocking American membership in the League of Nations."
 INT_usa_news.2.t:0 "Harding Becomes President"
 INT_usa_news.2.d:0 "Warren G. Harding has taken office in the United States following a campaign for a return to normalcy."
 INT_usa_news.3.t:0 "Naval Powers Sign the Washington Treaty"
 INT_usa_news.3.d:0 "The major naval powers have agreed to limits on capital ships at the Washington Conference."
 INT_usa_news.4.t:0 "President Harding Dies"
 INT_usa_news.4.d:0 "Warren G. Harding has died in office. Vice President Calvin Coolidge has been sworn in as president."
 INT_usa_news.5.t:0 "Shares Collapse on Wall Street"
 INT_usa_news.5.d:0 "A steep fall in New York share prices has unsettled investors and banks across the world."
 INT_usa_news.6.t:0 "Roosevelt Takes Office"
 INT_usa_news.6.d:0 "Franklin Roosevelt has been inaugurated as president of the United States amid a severe banking and employment crisis."
 INT_usa_news.7.t:0 "The United States Closes Its Banks"
 INT_usa_news.7.d:0 "President Roosevelt has declared a national bank holiday as officials seek to halt bank runs."
 INT_usa_news.8.t:0 "American Banks Begin to Reopen"
 INT_usa_news.8.d:0 "Emergency legislation has allowed inspected American banks to reopen with federal support."
 INT_usa_news.9.t:0 "The United States Launches Industrial Recovery"
 INT_usa_news.9.d:0 "Washington has enacted new industrial codes and public works measures as part of Roosevelt's economic programme."
 INT_usa_news.10.t:0 "America Establishes Social Security"
 INT_usa_news.10.d:0 "The United States has enacted a system of old-age benefits and unemployment insurance."
 INT_usa_news.11.t:0 "The United States Passes a Neutrality Act"
 INT_usa_news.11.d:0 "Congress has restricted arms exports to belligerents, seeking to keep the United States out of foreign wars."
 INT_usa_interwar.24.t:0 "The Teapot Dome Hearings"
 INT_usa_interwar.24.d:0 "Senators have opened hearings into the leasing of federal naval oil reserves. Questions about former Interior Secretary Albert Fall threaten public confidence in the administration."
 INT_usa_interwar.24.a:0 "The investigation must proceed."
 INT_usa_interwar.25.t:0 "The Unknown Soldier Is Laid to Rest"
 INT_usa_interwar.25.d:0 "The remains of an unidentified American soldier have been interred at Arlington. The ceremony gives the nation a place to mourn those lost in the Great War."
 INT_usa_interwar.25.a:0 "We remember their service."
 INT_usa_news.12.t:0 "American Senate Investigates Naval Oil Leases"
 INT_usa_news.12.d:0 "Hearings have begun in Washington over the leasing of United States naval oil reserves at Teapot Dome. The investigation is raising questions about members of the former Harding administration."

 INT_USA_progressive_reform:0 "Renew Progressive Reform"
 INT_USA_progressive_reform_desc:0 "Municipal reformers and social investigators press Washington to address the inequalities exposed by war and industrialisation."
 INT_USA_womens_voting_organizing:0 "Organise the New Electorate"
 INT_USA_womens_voting_organizing_desc:0 "The Nineteenth Amendment brings women into national politics and strengthens civic organisations across the republic."
 INT_USA_civil_liberties:0 "Defend Civil Liberties"
 INT_USA_civil_liberties_desc:0 "The Red Scare has tested free speech; legal advocates demand that emergency measures give way to constitutional protections."
 INT_USA_prohibition_enforcement:0 "Enforce Prohibition"
 INT_USA_prohibition_enforcement_desc:0 "Federal agents expand enforcement of the Volstead Act despite organised crime and public resistance."
 INT_USA_urban_machines:0 "Work with Urban Machines"
 INT_USA_urban_machines_desc:0 "City organisations turn patronage, immigrant neighbourhoods and practical services into a durable political coalition."
 INT_USA_labor_mediation:0 "Mediate Industrial Disputes"
 INT_USA_labor_mediation_desc:0 "Federal mediators seek to keep the great factories working as unions and employers clash over wages and recognition."
 INT_USA_indian_reorganization:0 "The Indian Reorganization Act"
 INT_USA_indian_reorganization_desc:0 "Congress moves toward tribal self-government and away from the allotment policy that fractured Indigenous communities."
 INT_USA_veterans_bonus:0 "Settle the Bonus Question"
 INT_USA_veterans_bonus_desc:0 "Veterans organise for compensation promised after the Great War, forcing Congress to weigh fiscal caution against public duty."
 INT_USA_public_broadcasting:0 "A National Radio Network"
 INT_USA_public_broadcasting_desc:0 "Radio links households across the country and gives public institutions a new way to explain national policy."
 INT_USA_utility_holding_reform:0 "Reform Utility Holding Companies"
 INT_USA_utility_holding_reform_desc:0 "Federal rules curb sprawling utility monopolies and protect consumers from opaque financial structures."
 INT_USA_national_youth_administration:0 "The National Youth Administration"
 INT_USA_national_youth_administration_desc:0 "Work, training and education programmes give young Americans a route through the Depression."
 INT_USA_budget_bureau:0 "Create a Budget Bureau"
 INT_USA_budget_bureau_desc:0 "Professional budget officers bring the expanding federal administration under a single plan."
 INT_USA_farm_cooperatives:0 "Support Farm Cooperatives"
 INT_USA_farm_cooperatives_desc:0 "Cooperative purchasing and marketing help farmers withstand falling prices and costly transport."
 INT_USA_public_power:0 "Public Power Projects"
 INT_USA_public_power_desc:0 "Municipal utilities and federal dams challenge private monopolies and extend reliable electricity."
 INT_USA_mass_production:0 "Master Mass Production"
 INT_USA_mass_production_desc:0 "Standardised parts, moving assembly lines and skilled supervisors make American factories the envy of the world."
 INT_USA_farm_credit:0 "Expand Farm Credit"
 INT_USA_farm_credit_desc:0 "Federal credit agencies refinance indebted farmers and keep productive land from being abandoned."
 INT_USA_stock_exchange_rules:0 "Regulate Wall Street"
