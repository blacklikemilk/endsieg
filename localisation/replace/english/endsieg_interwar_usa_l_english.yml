 INT_USA_public_works_bond:0 "Finance Public Works"
 INT_USA_public_works_bond_desc:0 "Federal bonds fund useful construction and put idle labour and materials back to work."
 INT_USA_rural_electrification:0 "Electrify the Countryside"
