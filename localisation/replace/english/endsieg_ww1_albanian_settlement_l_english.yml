l_english:
 ww1_serbia.4.b:0 "Authorize the pursuit."
 ww1_serbia.5.b:0 "The army will continue its operations."
 ww1_serbia.6.d.negotiated:0 "The withdrawal agreed through diplomatic talks has been completed. Our troops are back behind the Albanian frontier, and the government can turn its attention to securing the border from Serbian territory."
 ww1_serbia.6.d.unilateral:0 "Our commanders have completed the return of Serbian troops from Albania. The operations beyond the frontier are over; the army will now organize the defense of the border on our own side."
 ww1_serbia.7.b:0 "Ask Britain to mediate."
 ww1_serbia.7.c:0 "We will not press the demand."
 ww1_serbia.8.t:0 "An Austrian Demand to Serbia"
 ww1_serbia.8.d:0 "Vienna has demanded that Serbian forces leave Albania. The dispute touches the settlement on the Adriatic in which Italy has a strong interest. We can support Austria-Hungary’s demand or warn against an intervention that might widen the crisis."
 ww1_serbia.8.a:0 "Support the Albanian frontier."
 ww1_serbia.8.b:0 "Urge Vienna to exercise restraint."
 ww1_serbia.9.t:0 "A Position on the Adriatic"
 ww1_serbia.9.d:0 "Our forces remain in the disputed coastal area. Their presence sustains Serbia’s claim, but it also risks drawing the opposition of powers determined to preserve the Albanian settlement."
 ww1_serbia.9.a:0 "We must weigh the consequences."
 ww1_serbia.11.t:0 "The Frontier Settled"
 ww1_serbia.11.d:0 "Serbian forces have left the disputed frontier districts. Albanian authority can be asserted there again, though the task of establishing an administration and securing the border remains."
 ww1_serbia.11.a:0 "The frontier must now be secured."
 ww1_serbia.11.t.incursion:0 "Serbian Troops across the Frontier"
 ww1_serbia.11.d.incursion:0 "Serbian troops have crossed into Albania, and Belgrade says it is pursuing armed groups from the frontier. The government can appeal to the powers responsible for the settlement or seek a direct understanding with Serbia."
 ww1_serbia.11.b:0 "Appeal to the powers."
 ww1_serbia.11.c:0 "Seek talks with Belgrade."
 ww1_serbia.12.t:0 "An Ultimatum from Vienna"
 ww1_serbia.12.d:0 "Austria-Hungary has demanded that our forces evacuate Albanian territory within eight days. Vienna warns that it is prepared to take further measures if we refuse. Our ministers must decide whether to withdraw or risk a confrontation."
 ww1_serbia.12.a:0 "Begin the withdrawal."
 ww1_serbia.12.b:0 "Serbia will not submit."
 ww1_serbia.13.t:0 "The Ultimatum Expires"
 ww1_serbia.13.d:0 "The time allowed for Serbia to withdraw from Albania has passed without the evacuation we demanded. We must choose whether to enforce the ultimatum by arms or accept that Belgrade has defied us."
 ww1_serbia.13.d.withdrawing:0 "Our deadline has expired, but the Serbian government has begun withdrawing its troops. We can allow the movement to finish, use force if intervention remains possible, or abandon the demand."
 ww1_serbia.13.a:0 "Order military intervention."
 ww1_serbia.13.b:0 "We cannot enforce the demand."
 ww1_serbia.13.c:0 "Allow the withdrawal to finish."
 ww1_serbia.14.t:0 "Vienna Requests Mediation"
 ww1_serbia.14.d:0 "Austria-Hungary has asked Britain to help settle the dispute over Serbian operations in Albania. An approach to Belgrade may secure a withdrawal, but it would draw us into a quarrel in which the outcome is far from certain."
 ww1_serbia.14.a:0 "Offer our good offices."
 ww1_serbia.14.b:0 "Vienna must handle the matter itself."
 ww1_serbia.15.t:0 "The Mediation Fails"
 ww1_serbia.15.d:0 "Britain has declined to mediate over the Serbian presence in Albania. Without its assistance, we must decide whether to deliver a direct ultimatum or leave the matter there."
 ww1_serbia.15.d.refused:0 "Belgrade has refused the proposal for a negotiated withdrawal from Albania. Our government must now decide whether to issue a direct demand or refrain from enforcing its objections."
 ww1_serbia.15.a:0 "Deliver an eight-day ultimatum."
 ww1_serbia.15.b:0 "We will not pursue the demand."
 ww1_serbia.16.t:0 "Serbia Withdraws from Albania"
 ww1_serbia.16.d:0 "Serbian troops have evacuated Albanian territory following an ultimatum from [AUH.GetNameDef]. The withdrawal has met Vienna’s demand and removed an immediate danger of armed intervention."
 ww1_serbia.16.d.negotiated:0 "Serbian troops have withdrawn behind the Albanian frontier, bringing their operations across the border to an end. The immediate dispute has passed, though the frontier remains a source of tension."
 ww1_serbia.16.a:0 "A confrontation has been avoided."
 ww1_serbia.17.t:0 "War over the Albanian Frontier"
 ww1_serbia.17.d:0 "The dispute over Serbian operations in Albania has led to war between [AUH.GetNameDef] and [SER.GetNameDef]. Following the failure of its demand for evacuation, Vienna has chosen intervention. Other European governments must now consider their own interests in the crisis."
 ww1_serbia.17.a:0 "The conflict has spread."
 ww1_albanian_settlement_category:0 "The Albanian Frontier"
 ww1_albanian_settlement_category_desc:0 "Operations beyond the frontier have brought our government into conflict with Albania and the powers that established its borders. Our commanders must prepare to withdraw or face the consequences of a prolonged dispute."
 ww1_serbian_albanian_ultimatum:0 "The Austrian Ultimatum"
 ww1_serbian_albanian_ultimatum_desc:0 "Vienna has allowed eight days for our troops to leave Albanian territory. The deadline runs from the delivery of the demand. A withdrawal that is still underway when it expires will require a further decision from the Austrian government."
 ww1_serbian_albanian_withdrawal:0 "Withdrawal behind the Albanian Frontier"
 ww1_serbian_albanian_withdrawal_desc:0 "Our commanders are bringing the detachments engaged beyond the Albanian frontier back to Serbian territory."
 ww1_serbian_reconsider_albania:0 "End the Frontier Operations"
 ww1_serbian_reconsider_albania_desc:0 "Our army can complete its return behind the frontier in three days. Ending the operations will remove the immediate challenge to Albanian authority, though any outstanding ultimatum must still be answered."
 ww1_serbian_frontier_operations:0 "Operations beyond the Frontier"
 ww1_serbian_frontier_operations_desc:0 "Detachments operating across the Albanian frontier have strained our military organization and brought the government under diplomatic pressure."
 ww1_serbian_withdrawal_three_days_tt:0 "Our troops will complete their withdrawal in §Y3 days§!. The Austrian deadline continues to run."
 ww1_serbian_negotiated_withdrawal_tt:0 "Our troops will complete their withdrawal in §Y3 days§!."
 ww1_serbian_reject_ultimatum_tt:0 "§RAustria-Hungary may choose war if its deadline expires without a withdrawal.§!"
 ww1_albanian_intervention_war_tt:0 "§RWar with Serbia will begin. Guarantees and alliances may widen the conflict.§!"
 ww1_albanian_coastal_dispute:0 "Dispute over the Albanian Frontier"
 ww1_albanian_agreement_honoured:0 "Honoured the Albanian Settlement"
 ww1_albanian_ultimatum_rejected:0 "Rejected the Albanian Ultimatum"
 ww1_albanian_frontier_wargoal:0 "Enforce the Albanian Frontier"
 ww1_albanian_frontier_wargoal_short_desc:0 "Enforce the Albanian Frontier"
 ww1_albanian_frontier_wargoal_desc:0 "Enforce the demand that Serbian troops evacuate Albanian territory."
