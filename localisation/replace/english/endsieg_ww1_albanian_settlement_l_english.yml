l_english:
 ww1_serbia.4.b:0 "Authorize a pursuit across the frontier."
 ww1_serbia.5.b:0 "The army must be allowed to finish its operations."
 ww1_serbia.6.d.negotiated:0 "Our commanders report that the withdrawal agreed in the talks is complete. Serbian troops have returned behind the Albanian frontier, and the Albanian government has been informed. The agreement leaves the border districts in our hands while removing the immediate cause of foreign intervention."
 ww1_serbia.6.d.unilateral:0 "Our troops have completed their withdrawal from Albania. The commanders responsible for the frontier will now organize its defence from Serbian territory. Whatever the outcome of the diplomatic exchanges, the army's operations beyond the border have ended."
 ww1_serbia.7.b:0 "Ask London to mediate."
 ww1_serbia.7.c:0 "We cannot risk another Balkan crisis."
 ww1_serbia.8.t:0 "Vienna's Demand to Belgrade"
 ww1_serbia.8.d:0 "[AUH.GetNameDefCap] has demanded that Serbia evacuate Albanian territory within eight days. We have an interest in preserving Albania, but an Austrian intervention would also disturb the balance on the Adriatic. Our government must decide whether to endorse the demand or warn Vienna against military action."
 ww1_serbia.8.a:0 "The Albanian frontier must be respected."
 ww1_serbia.8.b:0 "An intervention would threaten the Adriatic balance."
 ww1_serbia.9.t:0 "Vienna Withdraws Its Demand"
 ww1_serbia.9.d:0 "The government in Vienna has decided against enforcing its demand over Albania. Our army will retain responsibility for ending the frontier operations. We have avoided an imposed withdrawal, but the dispute with the Albanian authorities will persist until our troops return home."
 ww1_serbia.9.a:0 "The decision will be made in Belgrade."
 ww1_serbia.11.t:0 "Serbian Troops Withdraw"
 ww1_serbia.11.d:0 "Serbian commanders have confirmed that their troops have returned behind the frontier. The withdrawal ends an immediate challenge to our authority and allows our administration to re-establish its presence in the affected districts. Maintaining the frontier will remain a difficult task."
 ww1_serbia.11.a:0 "Our independence must be defended."
 ww1_serbia.11.t.incursion:0 "Serbian Troops Cross the Frontier"
 ww1_serbia.11.d.incursion:0 "Serbian forces have entered Albanian territory in pursuit of armed groups involved in the fighting around Debar. Their presence challenges the frontier agreed by the powers and our ability to administer the border districts. We can appeal abroad or attempt direct negotiations with Belgrade."
 ww1_serbia.11.b:0 "Appeal to the powers that established the frontier."
 ww1_serbia.11.c:0 "Seek a direct agreement with Belgrade."
 ww1_serbia.12.t:0 "The Austrian Ultimatum"
 ww1_serbia.12.d:0 "[AUH.GetNameDefCap] has demanded the evacuation of all Serbian troops from Albanian territory within eight days. The note warns that Vienna will take further measures if the demand is not met. Our commanders can arrange a withdrawal, but refusing would place the government at risk of a war for which the country has scarcely recovered from the last campaign."
 ww1_serbia.12.a:0 "Order the troops back across the frontier."
 ww1_serbia.12.b:0 "Reject the ultimatum."
 ww1_serbia.13.t:0 "The Ultimatum Expires"
 ww1_serbia.13.d:0 "The period allowed for Serbia to evacuate Albania has expired without a completed withdrawal. Our representatives in Belgrade have received no satisfactory settlement. We must now decide whether to enforce our demand by arms or accept the loss of authority that would follow a retreat."
 ww1_serbia.13.d.withdrawing:0 "Our ultimatum has expired, but Serbian troops are already withdrawing from Albania. Belgrade has asked for the remaining movements to be completed before any further action is taken. We can allow this short extension or abandon the demand altogether."
 ww1_serbia.13.a:0 "Then the army will enforce our demand."
 ww1_serbia.13.b:0 "We cannot risk a European war."
 ww1_serbia.13.c:0 "Allow the withdrawal to finish."
 ww1_serbia.14.t:0 "Mediation over Albania"
 ww1_serbia.14.d:0 "Vienna has asked us to mediate over Serbian operations beyond the Albanian frontier. The question threatens the settlement reached by the ambassadors in London. A renewed agreement could secure a Serbian evacuation, though accepting the request would make us responsible for talks whose outcome remains uncertain."
 ww1_serbia.14.a:0 "Invite Belgrade to settle the matter through talks."
 ww1_serbia.14.b:0 "Vienna must conduct its own negotiations."
 ww1_serbia.15.t:0 "No Settlement in London"
 ww1_serbia.15.d:0 "The British government has declined to mediate over Albania. Serbian troops remain beyond the frontier, leaving us to decide whether to present a direct demand or end our involvement in the dispute."
 ww1_serbia.15.d.refused:0 "Belgrade has rejected a negotiated withdrawal from Albania. Our efforts to settle the dispute through talks have produced no agreement. We can now deliver a direct ultimatum or accept that our objections will not be enforced."
 ww1_serbia.15.a:0 "Deliver an eight-day ultimatum."
 ww1_serbia.15.b:0 "Let the matter rest."
 ww1_serbia.16.t:0 "Serbia Evacuates Albania"
 ww1_serbia.16.d:0 "The Serbian government has completed the withdrawal of its troops from Albanian territory following an ultimatum from [AUH.GetNameDef]. Vienna had allowed eight days for evacuation and threatened further measures if its demand was ignored. The withdrawal has averted another confrontation between the Balkan states and the great powers."
 ww1_serbia.16.d.negotiated:0 "Serbian troops have withdrawn behind the Albanian frontier. The evacuation ends a dispute arising from military operations around the new border and removes an immediate challenge to the Albanian state. The frontier remains unsettled in the eyes of many on both sides."
 ww1_serbia.16.a:0 "A crisis has passed."
 ww1_serbia.17.t:0 "War over Albania"
 ww1_serbia.17.d:0 "The dispute over Serbian operations in Albania has ended in war between [AUH.GetNameDef] and [SER.GetNameDef]. After the deadline for evacuation expired, Vienna chose military intervention. Governments across Europe are now considering whether their obligations and interests will draw them into another Balkan conflict."
 ww1_serbia.17.a:0 "The settlement in London has failed."
 ww1_albanian_settlement_category:0 "The Albanian Frontier"
 ww1_albanian_settlement_category_desc:0 "Operations beyond the frontier have brought our government into conflict with Albania and the powers that established its borders. Our commanders must prepare to withdraw or face the consequences of a prolonged dispute."
 ww1_serbian_albanian_ultimatum:0 "The Austrian Ultimatum"
 ww1_serbian_albanian_ultimatum_desc:0 "Vienna has allowed eight days for our troops to leave Albanian territory. The deadline runs from the delivery of the demand. A withdrawal that is still underway when it expires will require a further decision from the Austrian government."
 ww1_serbian_albanian_withdrawal:0 "Withdrawal behind the Albanian Frontier"
 ww1_serbian_albanian_withdrawal_desc:0 "Our commanders are bringing the detachments engaged beyond the Albanian frontier back to Serbian territory."
 ww1_serbian_reconsider_albania:0 "End the Frontier Operations"
 ww1_serbian_reconsider_albania_desc:0 "Our army can complete its return behind the frontier in three days. Ending the operations will remove the immediate challenge to Albanian authority, though any outstanding ultimatum must still be answered."
 ww1_serbian_frontier_operations:0 "Operations beyond the Frontier"
 ww1_serbian_frontier_operations_desc:0 "Detachments operating across the Albanian frontier have strained our military organization and brought the government under diplomatic pressure."
 ww1_serbian_withdrawal_three_days_tt:0 "Our troops will complete their withdrawal in §Y3 days§!. The Austrian deadline continues to run."
 ww1_serbian_negotiated_withdrawal_tt:0 "Our troops will complete their withdrawal in §Y3 days§!."
 ww1_serbian_reject_ultimatum_tt:0 "§RAustria-Hungary may choose war if its deadline expires without a withdrawal.§!"
 ww1_albanian_intervention_war_tt:0 "§RWar with Serbia will begin. Guarantees and alliances may widen the conflict.§!"
 ww1_albanian_coastal_dispute:0 "Dispute over the Albanian Frontier"
 ww1_albanian_agreement_honoured:0 "Honoured the Albanian Settlement"
 ww1_albanian_ultimatum_rejected:0 "Rejected the Albanian Ultimatum"
 ww1_albanian_frontier_wargoal:0 "Enforce the Albanian Frontier"
 ww1_albanian_frontier_wargoal_short_desc:0 "Enforce the Albanian Frontier"
 ww1_albanian_frontier_wargoal_desc:0 "Enforce the demand that Serbian troops evacuate Albanian territory."
