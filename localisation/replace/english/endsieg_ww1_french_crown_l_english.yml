l_english:
 FR3_royal_convention: "Convene a National Convention"
 FR3_royal_convention_desc: "Royalists and Bonapartists agree that the Republic has exhausted itself. They agree on little else. A national convention will hear the two claimants and determine whether either can command a government."
 FR3_invite_jacques: "Invite Jacques de Bourbon"
 FR3_invite_jacques_desc: "The Legitimists have rallied to Jacques, Duke of Anjou and Madrid. To secure an invitation from the Assembly, he must renounce any attempt to govern Spain from Paris and accept a charter for the French kingdom."
 FR3_invite_victor: "Recall Victor Napoléon"
 FR3_invite_victor_desc: "The heir of the imperial house has lived in exile in Belgium. His supporters propose a return on the strength of a national plebiscite, reviving the imperial tradition of his great-uncle."
 FR3_crown_and_charter: "The Crown and the Chambers"
 FR3_crown_and_charter_desc: "The restoration has split the Chamber and alarmed the provinces. Retaining elected representatives and guaranteeing the ordinary courts will give the new regime a chance to govern beyond its own supporters."
 FR3_carolingian_programme: "The Carolingian Programme"
 FR3_carolingian_programme_desc: "Aachen once stood at the centre of an empire that crossed the modern frontiers. Court historians now give the government a language for expansion. The General Staff will turn the rhetoric into plans for the Rhine and the Alpine passes."
 FR3_the_low_countries: "Reopen the Low Countries Question"
 FR3_the_low_countries_desc: "Brussels, Luxembourg and the mouths of the Rhine sit astride the roads into France. The Crown will demand control of the frontier and prepare to enforce its claims where the neighbouring governments refuse."
 FR3_cross_the_rhine: "The Road to Aachen"
 FR3_cross_the_rhine_desc: "The court invokes Charlemagne’s old capital to justify a frontier on the Rhine. The General Staff is under no illusion that Germany will accept such a settlement willingly."
 FR3_the_lombard_crown: "The Iron Crown of Lombardy"
 FR3_the_lombard_crown_desc: "Charlemagne’s conquest of the Lombard kingdom offers the court another argument for influence across the Alps. The proposed settlement extends from Piedmont to Venetia."
 FR3_proclaim_frankish_empire: "Proclaim the Frankish Empire"
 FR3_proclaim_frankish_empire_desc: "The Crown now holds the principal territories named in its programme. The government will proclaim a new empire at Aachen. Its peoples, laws and languages will still have to be governed."
 FR3_arm_the_channel: "Arm the Channel Ports"
 FR3_arm_the_channel_desc: "A challenge to Britain will put France’s own shipping at risk. The Admiralty will reinforce the Channel squadrons and expand the dock facilities in Brittany."
 FR3_summon_london: "Summon London to Terms"
 FR3_summon_london_desc: "Paris will demand that Britain accept French suzerainty while retaining its own Parliament. The court has put aside the older colonial demands. If London refuses, it will take a war to enforce these terms."
 FR3_royal_jacques: "Jacques I"
 ww1_french_crown.1.t: "A Bourbon on the Throne"
 ww1_french_crown.1.d: "The convention has invited Jacques de Bourbon to return to France and accept the crown under a charter. He has agreed to set aside his Spanish claim while he reigns in Paris. Royalists celebrate the restoration, but republican deputies warn that the new government will have to earn the allegiance of a divided country."
 ww1_french_crown.1.a: "Long live Jacques I!"
 FR3_royal_victor: "Napoléon V"
 ww1_french_crown.2.t: "The Return of the Bonapartes"
 ww1_french_crown.2.d: "Prince Victor has answered the convention’s invitation and returned from exile. His supporters hail the restoration of the Empire under Napoléon V, while republicans protest the end of their government. The new Emperor promises to govern with the support of the nation and its elected representatives."
 ww1_french_crown.2.a: "Long live the Emperor!"
 ww1_french_crown.3.t: "An Ultimatum from Paris"
 ww1_french_crown.3.d: "The French ambassador has delivered an extraordinary demand: Britain is to acknowledge the authority of the Crown in Paris. Parliament would remain, but the country’s independence in foreign affairs would be at an end. Our ministers must decide whether to submit or risk a French attempt to enforce the claim."
 ww1_french_crown.3.war.d: "While Britain is already at war, the French ambassador has delivered a demand for our submission to the Crown in Paris. The cabinet cannot accept the proposed settlement while the present fighting continues. Refusal may give France a pretext to press its claims by force."
 ww1_french_crown.3.a: "Accept French suzerainty."
 ww1_french_crown.3.b: "Reject the demand."
 FR3_royal_london_threat: "The French Ultimatum to Britain"
 FR3_BOURBON_REALM_neutrality: "Kingdom of France"
 FR3_BOURBON_REALM_neutrality_DEF: "the Kingdom of France"
 FR3_BOURBON_REALM_neutrality_ADJ: "French"
