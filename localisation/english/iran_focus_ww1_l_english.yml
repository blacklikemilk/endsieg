l_english:
 IR1_gilan_congress: "The Congress of Gilan"
 IR1_gilan_congress_desc: "The committees of Gilan have called a congress at Rasht, with delegates from the Caspian towns and the villages behind them. It claims to speak for a province the cabinet has never been able to govern directly, and its programme reaches well beyond the Jungle Movement's rifles."
 IR1_republican_committee: "A Republican Committee"
 IR1_republican_committee_desc: "Deputies, journalists and officers have formed a committee to argue that the monarchy cannot survive the settlement that is coming. Its manifesto is drafted but not printed, and every minister must decide whether such a question can be raised at all while foreign columns are still on the roads."
 iran_paris_memorandum: "The Paris Memorandum"
 iran_paris_memorandum_desc: "The delegation in Paris carried a memorandum that the victors have read and not answered. It sets out the agreements concluded with Persia under pressure, the foreign forces still on Persian soil and the government's claim to administer its own customs and finances. Presented formally, it becomes the country's programme; left in a drawer, it is only a record."
 iran_paris_memorandum_effect_tt: "The memorandum is tabled: the concessions of the war years are contested, the foreign customs administration is brought to an end, and the government gains standing and freedom of action at the expense of the patron that held them."
 iran_proclaim_the_republic: "Proclaim the Republic"
 iran_proclaim_the_republic_desc: "The committee's manifesto has found a majority, and the Majlis can be asked to vote the Qajar monarchy out of existence. A republic would make the chamber the source of authority and end the court's claim to govern; it would also invite every power, and every provincial khan, to test whether the new government can hold the country."
 iran_proclaim_the_republic_effect_tt: "The monarchy is abolished and the Majlis becomes the sovereign body: the settlement of the balance moves to the chamber, the government is reconstituted on a parliamentary footing and the powers must decide whether to deal with it."
 iran_f1.1.t: "The Memorandum of the Persian Delegation"
 iran_f1.1.d: "The delegation has set its case on paper: the agreements signed while foreign armies stood on Persian roads, the troops that have never left, the customs collected by Belgian officials under British eyes. The victors will not be bound by a document from a country they did not invite, but a memorandum entered in the record is not nothing. Published in Tehran it becomes the government's programme and the Majlis will argue over every clause; sent quietly through the legations it may earn a private answer and no public commitment."
 iran_f1.1.a: "Publish the memorandum and lay it before the Majlis."
 iran_f1.1.b: "Send it quietly through the legations."
 iran_f1.2.t: "The Congress of Gilan"
 iran_f1.2.d: "Delegates have come down from the hills and in from the Caspian ports to sit at Rasht. They speak of the province's grain taken for foreign armies, of the customs farmed out and the roads held by strangers, and they ask to be recognised as a government of Gilan rather than a rebellion inside it. The cabinet can receive the congress and let its programme enter the Majlis, or answer that a province is governed from Tehran and send the gendarmerie to say so."
 iran_f1.2.a: "Receive the congress and let its programme be heard."
 iran_f1.2.b: "Answer that Gilan is governed from Tehran."
 iran_f1.3.t: "A Republican Committee"
 iran_f1.3.d: "The committee has met in a house near the bazaar and agreed its text: the crown has failed the country, the settlement will be made without Persia unless Persia speaks with one voice, and that voice must be the chamber's. Printing it would put the question on every platform in the capital; withholding it keeps the argument inside the government's own circle and leaves the committee to work by persuasion."
 iran_f1.3.a: "Let the committee publish its case."
 iran_f1.3.b: "Keep the committee's work inside the government."
 iran_f1.4.t: "The Republic Is Proclaimed"
 iran_f1.4.d: "The vote has been taken and the Qajar monarchy is at an end. The chamber is now the only lawful authority in the country, and it must decide at once what kind of government it has made: a parliament that governs through ministers answerable to it, or a provisional executive that rules by decree until the provinces and the legations have accepted the change."
 iran_f1.4.a: "Let the Majlis govern through its ministers."
 iran_f1.4.b: "Let a provisional government rule until the country accepts it."
