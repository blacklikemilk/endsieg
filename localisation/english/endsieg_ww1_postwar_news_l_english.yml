l_english:
 ww1_postwar_news.1.t:0 "The Paris Peace Conference Opens"
 ww1_postwar_news.1.d:0 "Delegations have assembled at the Quai d'Orsay to draw up the peace treaties. France seeks guarantees along its eastern frontier, while the American delegation presses for a League of Nations. Smaller nations have come to Paris with claims of their own, and several delegations are already pressing for a hearing before the great powers settle the agenda."
 ww1_postwar_news.1.a:0 "The talks begin."

 ww1_postwar_news.2.t:0 "The Allies Present Their Terms to Germany"
 ww1_postwar_news.2.d:0 "The German delegation has received the draft treaty at Versailles. It calls for frontier changes, limits on the armed forces and a German obligation to pay reparations.\n\nBerlin is preparing its objections in writing. The Allied delegations have given it only a short time to reply."
 ww1_postwar_news.2.a:0 "Berlin must answer."

 ww1_postwar_news.3.t:0 "The Compiègne Armistice Breaks Down"
 ww1_postwar_news.3.d:0 "The deadline for ratification has expired and the German government has let the armistice lapse. As word reaches the capitals, military staffs are reviewing their orders and diplomats are looking for a way to recover the talks."
 ww1_postwar_news.3.war.d:0 "The deadline for ratification has expired and hostilities with Germany have resumed. Governments are recalling their wartime staffs, and reports from the frontier suggest the peace now depends on another round of fighting."
 ww1_postwar_news.3.a:0 "Europe faces another crisis."

 ww1_postwar_news.4.t:0 "Peace Signed at Saint-Germain"
 ww1_postwar_news.4.d:0 "The Austrian delegation has signed the treaty at Saint-Germain-en-Laye. It recognizes the states that have emerged from the Habsburg lands and limits the size of Austria's army.\n\nVienna will have to seek the consent of the League of Nations before surrendering its independence, closing the immediate prospect of union with Germany."
 ww1_postwar_news.4.a:0 "The old empire has its settlement."

 ww1_postwar_news.5.t:0 "Bulgaria Signs the Treaty of Neuilly"
 ww1_postwar_news.5.d:0 "The Bulgarian delegation has signed the peace treaty at Neuilly-sur-Seine. Sofia must accept limits on its army, pay reparations and surrender Western Thrace to the Allied powers for a later disposition.\n\nThe loss of its Aegean outlet has already drawn protests in Bulgaria."
 ww1_postwar_news.5.a:0 "A hard peace for Bulgaria."

 ww1_postwar_news.6.t:0 "Hungary Receives the Allied Peace Terms"
 ww1_postwar_news.6.d:0 "The Hungarian delegation has received the draft treaty in Paris. The proposed frontiers would place large Hungarian communities under neighboring governments. Budapest is preparing a reply and intends to argue for plebiscites in the disputed districts."
 ww1_postwar_news.6.a:0 "Budapest will make its case."

 ww1_postwar_news.7.t:0 "Ottoman Delegates Sign at Sèvres"
 ww1_postwar_news.7.d:0 "Representatives of the Sultan's government have signed the Treaty of Sèvres. The terms place the Straits under international supervision and give Greece a position in western Anatolia.\n\nThe assembly at Ankara disputes the authority of the government in Constantinople. Enforcing the treaty across Anatolia may prove harder than signing it."
 ww1_postwar_news.7.a:0 "Ankara will have a reply."

 ww1_postwar_news.8.t:0 "Berlin Opens Separate Peace Talks"
 ww1_postwar_news.8.d:0 "Berlin has sent peace proposals to the governments still in arms after the French armistice. The offers are being handled separately, and each capital must now decide whether to fight on or come to terms. Several delegations are already seeking assurances about their trade and overseas possessions."
 ww1_postwar_news.8.a:0 "Each government must decide."

 ww1_postwar_news.9.t:0 "A Settlement in the West"
 ww1_postwar_news.9.d:0 "Germany and its partners have concluded the Western settlement. Troops are receiving orders to end hostilities in the west, and diplomats are preparing separate agreements on frontiers and overseas possessions. Other fronts remain subject to their own terms."
 ww1_postwar_news.9.a:0 "The fighting in the west is over."

 ww1_postwar_news.10.t:0 "The Treaty of Frankfurt"
 ww1_postwar_news.10.d:0 "The Frankfurt settlement gives Germany the districts around Nancy and Briey. French troops are to withdraw from the demilitarized districts along the new frontier. In France, the loss of the forts is expected to dominate the first postwar debate."
 ww1_postwar_news.10.colonies.d:0 "The Frankfurt settlement gives Germany the districts around Nancy and Briey and calls for the transfer of French possessions in Africa. Colonial administrations are awaiting word on which districts will change hands."
 ww1_postwar_news.10.border.d:0 "The Frankfurt settlement extends German rule well beyond the Lorraine frontier. The demands reach Champagne and the Channel coast, and officials on both sides are working out how to administer the new districts."
 ww1_postwar_news.10.wide.d:0 "Berlin has secured its most extensive terms at Frankfurt. Germany takes districts deep inside mainland France, and the treaty also calls for the transfer of French holdings in Africa. French officials are still assessing what can be administered from the territory left to them."
 ww1_postwar_news.10.a:0 "France must live with the terms."
 ww1_postwar_news.10.b:0 "The settlement is secured."

 ww1_postwar_news.11.t:0 "The Central Powers Conclude the General Peace"
 ww1_postwar_news.11.d:0 "Berlin has announced the conclusion of the general settlement. Earlier armistices took the opposing powers out of the fighting in stages. The remaining negotiations have now ended, leaving the victors to carry out their agreements and the defeated governments to deal with the terms at home."
 ww1_postwar_news.11.a:0 "The Great War is over."

 ww1_postwar_news.12.t:0 "Germany Accepts the London Reparations Schedule"
 ww1_postwar_news.12.d:0 "The German cabinet has accepted the Allied schedule of 132 billion gold marks in reparations. The decision has averted the immediate threat of an occupation of the Ruhr.\n\nDebate has already begun in Berlin over the taxes and exports needed to meet the payments."
 ww1_postwar_news.12.a:0 "The payments fall due."

 ww1_postwar_news.13.t:0 "San Remo Assigns the Mandates"
 ww1_postwar_news.13.d:0 "The Allied powers have agreed at San Remo on the division of mandates in the former Ottoman territories. France is to administer Syria and Lebanon, while Britain is to administer Palestine and Mesopotamia. Arab leaders in Damascus have sought recognition for an independent state. The mandates leave their claims unresolved."
 ww1_postwar_news.13.a:0 "The mandates will be contested."


 ww1_postwar_news.14.t:0 "Gunfire on the Burgenland Frontier"
 ww1_postwar_news.14.d:0 "Hungarian irregulars have driven back Austrian gendarmes sent to take over the frontier districts. The Austrian government has protested to the Allied commission. In Budapest, ministers are under pressure to hold out for a vote in and around Sopron."
 ww1_postwar_news.14.a:0 "The handover will have to wait."

 ww1_postwar_news.15.t:0 "An Agreement at Venice"
 ww1_postwar_news.15.d:0 "Italy has brokered an agreement between Austria and Hungary. Budapest will withdraw its irregulars from the disputed districts. A vote will decide the future of Sopron and eight surrounding communities, while preparations resume for the handover of the rest of Burgenland."
 ww1_postwar_news.15.a:0 "The frontier is closer to a settlement."

 ww1_postwar_news.16.t:0 "Austria Takes Over Burgenland"
 ww1_postwar_news.16.d:0 "The Allied commission has handed Burgenland over to Austrian administration. Officials from Vienna are taking up their posts in the new province. The authorities will wait for the vote before settling the status of Sopron and the surrounding villages."
 ww1_postwar_news.16.a:0 "A new province for Austria."

 ww1_postwar_news.17.t:0 "Sopron Votes to Stay With Hungary"
 ww1_postwar_news.17.d:0 "A majority in Sopron and the surrounding villages has voted to remain in Hungary. The result leaves Austria to find an administrative seat for its new province. Arrangements are being made for Hungary to take over the plebiscite district at the beginning of the new year."
 ww1_postwar_news.17.a:0 "The vote settles the question."

 ww1_postwar_news.18.t:0 "Poland and Lithuania Sign the Suwałki Agreement"
 ww1_postwar_news.18.d:0 "Polish and Lithuanian delegates have agreed to a ceasefire and a line of demarcation. The agreement leaves the future of Vilnius open."
 ww1_postwar_news.18.a:0 "Will the ceasefire hold?"

 ww1_postwar_news.19.t:0 "Finland Takes Possession of Petsamo"
 ww1_postwar_news.19.d:0 "Finnish officials have taken over Petsamo under the Treaty of Tartu with Soviet Russia. Finland now has an outlet to the Arctic Ocean."
 ww1_postwar_news.19.a:0 "An Arctic port for Finland."

 ww1_postwar_news.20.t:0 "The Armistice of Mudanya"
 ww1_postwar_news.20.d:0 "Fighting between Greece and the government in Ankara has ended. The armistice leaves the final terms of peace to a diplomatic conference."
 ww1_postwar_news.20.a:0 "The negotiations can begin."

 ww1_postwar_news.21.t:0 "Ankara and Moscow Sign a Treaty of Friendship"
 ww1_postwar_news.21.d:0 "Representatives of the Ankara government and Soviet Russia have signed a treaty of friendship in Moscow. The agreement gives Ankara a diplomatic partner across the Black Sea."
 ww1_postwar_news.21.a:0 "Ankara gains recognition."

 ww1_postwar_news.22.t:0 "The Treaty of Kars"
 ww1_postwar_news.22.d:0 "A treaty at Kars settles the frontier between Turkey and the Soviet republics of the South Caucasus. Turkish officials will administer the Kars district."
 ww1_postwar_news.22.a:0 "A frontier takes shape."

 ww1_postwar_news.23.t:0 "Georgia and Germany Reach Agreement at Poti"
 ww1_postwar_news.23.d:0 "The new Georgian government has granted German forces military access. The agreement gives Georgia a link to Berlin as it seeks to secure its independence."
 ww1_postwar_news.23.a:0 "Berlin gains a foothold in the Caucasus."

 ww1_postwar_news.24.t:0 "The Uqair Frontier Settlement"
 ww1_postwar_news.24.d:0 "Negotiations at Uqair have fixed the frontier between Iraq and Nejd. Iraqi officials will assume responsibility for Al Hajara under the settlement."
 ww1_postwar_news.24.a:0 "The desert frontier takes shape."

 ww1_postwar_news.25.t:0 "Ha'il Falls to Ibn Saud"
 ww1_postwar_news.25.d:0 "The Rashidi capital has surrendered. Ibn Saud has taken control of the seat of the emirate of Jabal Shammar, extending his rule north from Riyadh."
 ww1_postwar_news.25.a:0 "Rashidi rule in Ha'il ends."

 ww1_postwar_news.26.t:0 "The Treaty of London Ends the First Balkan War"
 ww1_postwar_news.26.d:0 "The Ottoman Empire and the Balkan allies have reached terms in London. The settlement ends their war, but the division of Macedonia still divides the victors."
 ww1_postwar_news.26.a:0 "The allies now face one another."

 ww1_postwar_news.27.t:0 "The Balkan Powers Sign Peace at Bucharest"
 ww1_postwar_news.27.d:0 "Bulgaria and its Balkan opponents have concluded peace at Bucharest. The settlement revises the division of the lands disputed after the First Balkan War."
 ww1_postwar_news.27.a:0 "A second settlement in the Balkans."

 ww1_postwar_news.28.t:0 "Persia and Soviet Russia Sign a Treaty of Friendship"
 ww1_postwar_news.28.d:0 "Tehran and Moscow have agreed on new terms for their relations. The agreement renounces privileges claimed in Persia by the former Russian Empire."
 ww1_postwar_news.28.a:0 "A new relationship across the Caspian."

 ww1_postwar_news.29.t:0 "An Ottoman Agreement with the Imam of Yemen"
 ww1_postwar_news.29.d:0 "Ottoman representatives and Imam Yahya have reached an agreement at Daan. The settlement recognises the imam’s authority over local religious affairs in the Yemeni highlands."
 ww1_postwar_news.29.a:0 "A settlement in the highlands."

 ww1_postwar_news.30.t:0 "The Svalbard Treaty Is Signed"
 ww1_postwar_news.30.d:0 "The signatories recognise Norwegian sovereignty over Svalbard and agree on equal access for their nationals to economic activity on the islands."
 ww1_postwar_news.30.a:0 "A settlement for the Arctic islands."

 ww1_postwar_news.31.t:0 "Nejd and Transjordan Settle Their Frontier"
 ww1_postwar_news.31.d:0 "An agreement at Hadda fixes the boundary between Nejd and Transjordan. The Ruwaished district falls on the Transjordan side of the line."
 ww1_postwar_news.31.a:0 "The frontier has been agreed."

 ww1_postwar_news.32.t:0 "The Treaties of Batum"
 ww1_postwar_news.32.d:0 "Ottoman delegates at Batum have signed separate agreements with Armenia, Azerbaijan and Georgia. Each of the three republics has sent its own representatives following the breakup of the Transcaucasian government."
 ww1_postwar_news.32.a:0 "Three governments take their place at the table."
