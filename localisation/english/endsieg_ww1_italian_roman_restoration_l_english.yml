l_english:
 IT1_roman_inheritance: "The Roman Inheritance"
 IT1_roman_inheritance_desc: "Victory in Libya has given the nationalists a hearing in Rome. They argue that Italy cannot secure the coast of Tripoli while other powers command the sea around it. Their programme has won the cabinet's backing, though there are already protests in the Chamber over what it will cost."
 IT1_roman_west: "The Western Sea"
 IT1_roman_west_desc: "Between Gibraltar and the Strait of Messina lie the ports and islands that command the western sea. If Rome is to stand as an empire again, the fleet must be able to sail from Corsica to the Pillars of Hercules."
 IT1_roman_africa: "From Carthage to the Nile"
 IT1_roman_africa_desc: "Tripoli gives Italy a foothold on the African shore. The ports of Tunisia and Algeria lie to the west, and Alexandria and the canal to the east. The cabinet has ordered our diplomats to lay claim to the coast and the navy to prepare for the consequences."
 IT1_roman_east: "The Roads to Constantinople"
 IT1_roman_east_desc: "The ports of the Adriatic guard the approaches to Italy. Beyond them lie the Aegean islands, Constantinople and the harbours of the Levant. The Foreign Ministry has been instructed to put Rome's claims before the governments that hold them."
 IT1_roman_proclamation: "Proclaim the Roman Empire"
 IT1_roman_proclamation_desc: "The straits and the great ports are in our hands. Parliament will now be asked to issue a new proclamation from the Capitol. The provinces will still have to be governed, and it will take more than a ceremony in Rome to persuade them to stay."
 ww1_italy.418.t: "The Roman Empire Proclaimed"
 ww1_italy.418.d: "Crowds gathered on the Capitoline Hill as the government proclaimed the restoration of the Roman Empire. The announcement follows a series of Italian victories that brought Gibraltar, Alexandria and Constantinople under Rome's authority. In the newly acquired territories, the officials charged with carrying out the proclamation have already asked for reinforcements."
 ww1_italy.418.a: "The Mediterranean has a new master."
