l_english:
 # Party management: elections, patronage, courting deputies, proscription and coalitions.
 # Every one of these decisions moves seats, and the bill list reacts to the result.

 SPR_parties: "Party Politics"
 SPR_parties_desc: "The chamber is 400 seats and 201 govern. Elections move seats, money moves deputies, and a government without a majority can pass nothing."

 SPR_call_election: "Call a General Election"
 SPR_call_election_desc: "Dissolve the chamber and let the country speak. The tide decides: a government that has lost the chamber, or the country's confidence, pays for it."
 SPR_finance_monarchists: "Finance the Court Party"
 SPR_finance_monarchists_desc: "Money, titles and patronage for the monarchists: a reliable purchase, and one the chamber notices."
 SPR_finance_liberals: "Finance the Liberals"
 SPR_finance_liberals_desc: "Subsidise the liberal press and the electoral committees that carry it."
 SPR_finance_conservatives: "Finance the Conservatives"
 SPR_finance_conservatives_desc: "The Catholic unions, the landowners' clubs and the provincial bosses all cost money."
 SPR_finance_republicans: "Finance the Republicans"
 SPR_finance_republicans_desc: "Pay for the clubs, the lodges and the newspapers that carry the republican cause."
 SPR_finance_socialists: "Finance the Socialists"
 SPR_finance_socialists_desc: "The unions have their own funds, but a subsidy buys the party time and printers."
 SPR_finance_carlists: "Finance the Carlists"
 SPR_finance_carlists_desc: "The Traditionalist circles take money gladly and answer to nobody afterwards."
 SPR_finance_falange: "Finance the Falange"
 SPR_finance_falange_desc: "Uniforms, halls, newspapers and the small violence that goes with them."
 SPR_court_the_chamber: "Court the Chamber"
 SPR_court_the_chamber_desc: "Whips, favours and contracts: deputies come over to the government, and the opposition loses them."
 SPR_proscribe_the_falange: "Proscribe the Falange"
 SPR_proscribe_the_falange_desc: "Ban the party, jail its leaders and drive its voters underground. The chamber loses a bloc and the street gains one."
 SPR_proscribe_the_carlists: "Proscribe the Carlists"
 SPR_proscribe_the_carlists_desc: "Close the Traditionalist circles. The Requeté does not disappear; it merely stops being legal."
 SPR_coalition_monarchists: "Invite the Court Party into Government"
 SPR_coalition_liberals: "Invite the Liberals into Government"
 SPR_coalition_conservatives: "Invite the Conservatives into Government"
 SPR_coalition_republicans: "Invite the Republicans into Government"
 SPR_coalition_socialists: "Invite the Socialists into Government"
 SPR_coalition_liberals_desc: "A partner brings its seats and its demands to the government bloc."
 SPR_coalition_conservatives_desc: "A partner brings its seats and its demands to the government bloc."
 SPR_coalition_republicans_desc: "A partner brings its seats and its demands to the government bloc."
 SPR_coalition_socialists_desc: "A partner brings its seats and its demands to the government bloc."
 SPR_coalition_monarchists_desc: "A partner brings its seats and its demands to the government bloc."
 SPR_drop_the_coalition: "End the Coalition"
 SPR_drop_the_coalition_desc: "Govern alone again. The government bloc falls back to its own seats."

 SPAIN_CORTES_GOVERNMENT: "Government seats (201 needed)"

 spain_campaign.80.t: "The Cortes Returns a Verdict"
 spain_campaign.80.d: "The votes are counted and the chamber is remade. The government bloc now holds [?spain_government_seats] of the 400 seats.\n\nMonarchists [?spain_cortes_seats_monarchists], liberals [?spain_cortes_seats_liberals], conservatives [?spain_cortes_seats_conservatives], republicans [?spain_cortes_seats_republicans], socialists [?spain_cortes_seats_socialists], Carlists [?spain_cortes_seats_carlists], Falange [?spain_cortes_seats_falange]."
 spain_campaign.80.a: "The chamber is read."
 spain_campaign.80.a.tt: "The new chamber decides what the government can legislate."

 # flags that gate decisions, so their tooltips read as requirements rather than identifiers
 spain_campaign_initialized: "The Spanish campaign is under way"
 spain_elections_suspended: "Elections are suspended"
 spain_cortes_dissolved: "The Cortes is dissolved"
 spain_chapter_civil_war: "Spain is in civil war"
 spain_chapter_restoration: "The Restoration monarchy governs Spain"
 spain_falange_proscribed: "The Falange is proscribed"
 spain_carlists_proscribed: "The Carlists are proscribed"
