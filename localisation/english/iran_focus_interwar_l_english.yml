l_english:
 iran_f2.1.t: "The Division Refuses"
 iran_f2.1.d: "Orders arrive at the barracks before dawn and are read twice. The Cossack officers do not move. By the time the ministers are awake it is clear that no column is coming down the road into Tehran, and that the men who might have led one are waiting to see what the government will do."
 iran_f2.1.a: "The government has the army it paid for"
 iran_f2.1.b: "The officers are bought with promotions and pay"
 iran_f2.2.t: "The Terms of 1933"
 iran_f2.2.d: "The company's negotiators come to Tehran with a new draft: a longer lease in exchange for a larger royalty, a share of the refining and a payment into the treasury this year rather than the next. The cabinet can sign it, or publish it and refuse."
 iran_f2.2.a: "Sign the new concession"
 iran_f2.2.b: "Publish the terms and refuse"
 iran_f2.3.t: "The State in 1935"
 iran_f2.3.d: "Sixteen years after an agreement nobody signed, the government takes stock of what the settlement has made: its own courts, its own army, its own revenues, and chancelleries that now address the country by the name it chose for itself."
 iran_f2.3.a: "The settlement has held"
 iran_f2.3.b: "The settlement is still contested"
 iran_settle_the_concession_1933: "Settle the Concession of 1933"
 iran_settle_the_concession_1933_desc: "The renegotiation is on the table and the cabinet must decide what to do with it. Signing keeps the company and the revenue; refusing turns the question into a public dispute with the legation."
 iran_court_audit_the_concession: "Audit the Concession"
 iran_court_audit_the_concession_desc: "The restored court opens the company's books before its own auditors and finds the payments short. The finding is worth little without the will to act on it, and acting costs political capital."
 iran_concession_authority_tt: "The government must be strong enough to enforce the terms it signs: Authority of 50."
