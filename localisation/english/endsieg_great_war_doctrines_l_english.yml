l_english:
 endsieg_great_war_land_name: "Great War Land Warfare"
 endsieg_great_war_land_desc: "The armies of the Great War took different lessons from the same battlefields. Choose how officers give orders, how the infantry fights and how the guns support it. Each arm develops its doctrine through combat."
 endsieg_ww1_command_name: "Command"
 endsieg_ww1_infantry_name: "Infantry"
 endsieg_ww1_coordination_name: "Artillery Coordination"
 endsieg_ww1_mission_orders_name: "Mission Orders"
 endsieg_ww1_mission_orders_desc: "An officer receives an objective and has discretion over how to meet it. Experience improves the army's ability to keep formations moving when orders fall behind events."
 endsieg_ww1_mission_orders_staff_rides: "Staff Rides"
 endsieg_ww1_mission_orders_junior_commands: "Junior Commands"
 endsieg_ww1_mission_orders_field_dispatches: "Field Dispatches"
 endsieg_ww1_mission_orders_independent_reserves: "Independent Reserves"
 endsieg_ww1_mission_orders_local_initiative: "Local Initiative"
 endsieg_ww1_detailed_orders_name: "Detailed Orders"
 endsieg_ww1_detailed_orders_desc: "Headquarters coordinates large formations through written orders and common timetables. Experienced staffs can prepare more ambitious operations and keep reserves organized."
 endsieg_ww1_detailed_orders_staff_colleges: "Staff Colleges"
 endsieg_ww1_detailed_orders_march_tables: "March Tables"
 endsieg_ww1_detailed_orders_divisional_orders: "Divisional Orders"
 endsieg_ww1_detailed_orders_reserve_timetables: "Reserve Timetables"
 endsieg_ww1_detailed_orders_army_plans: "Army Plans"
 endsieg_ww1_strongpoints_name: "Strongpoint Defence"
 endsieg_ww1_strongpoints_desc: "Infantry builds its doctrine around holding ground. From the first fieldworks to defence in depth, each lesson makes a division harder to dislodge."
 endsieg_ww1_strongpoints_fieldworks: "Fieldworks"
 endsieg_ww1_strongpoints_trench_reliefs: "Trench Reliefs"
 endsieg_ww1_strongpoints_strongpoint_networks: "Strongpoint Networks"
 endsieg_ww1_strongpoints_local_counterattacks: "Local Counterattacks"
 endsieg_ww1_strongpoints_defence_in_depth: "Defence in Depth"
 endsieg_ww1_assault_name: "Concentrated Assault"
 endsieg_ww1_assault_desc: "Early offensives placed their faith in massed infantry. As casualties mount, the army develops specialist assault companies and learns to concentrate its strength where it can break through."
 endsieg_ww1_assault_assembly_drills: "Assembly Drills"
 endsieg_ww1_assault_follow_up_waves: "Follow-up Waves"
 endsieg_ww1_assault_assault_companies: "Assault Companies"
 endsieg_ww1_assault_counterstroke: "Counterstroke"
 endsieg_ww1_assault_concentration_of_effort: "Concentration of Effort"
 endsieg_ww1_forward_control_name: "Forward Control"
 endsieg_ww1_forward_control_desc: "Artillery officers work alongside the infantry they support. Experience links the two arms more closely as the battle moves beyond the original plan."
 endsieg_ww1_forward_control_liaison_officers: "Liaison Officers"
 endsieg_ww1_forward_control_field_telephones: "Field Telephones"
 endsieg_ww1_forward_control_observation_posts: "Observation Posts"
 endsieg_ww1_forward_control_infantry_liaison: "Infantry Liaison"
 endsieg_ww1_forward_control_combined_arms: "Combined Arms"
 endsieg_ww1_central_control_name: "Central Fire Control"
 endsieg_ww1_central_control_desc: "The artillery staff directs batteries across a whole sector. As the staff gains experience, divisional fire plans can draw on the strength of several formations."
 endsieg_ww1_central_control_battery_tables: "Battery Tables"
 endsieg_ww1_central_control_survey_sections: "Survey Sections"
 endsieg_ww1_central_control_artillery_groups: "Artillery Groups"
 endsieg_ww1_central_control_fire_programmes: "Fire Programmes"
 endsieg_ww1_central_control_massed_batteries: "Massed Batteries"
