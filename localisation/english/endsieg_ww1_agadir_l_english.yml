l_english:
 WW1_agadir_crisis:0 "The Agadir Crisis"
 WW1_agadir_crisis_desc:0 "French troops have entered Fez. The Foreign Office has asked the fleet to make its presence felt off Morocco while our ambassador sounds out Paris."
 WW1_agadir_send_squadron:0 "Send a Squadron to Agadir"
 WW1_agadir_send_squadron_desc:0 "Detach a surface warship with sufficient range and assign its task force to patrol the §YAfrican Coast§! naval region, off western Morocco. Confirm the deployment once the ship arrives. Under historical settings, the deployment can be confirmed from 1 July 1911."
 WW1_agadir_surface_ship_off_morocco_tt:0 "At least one of our surface warships is in the §YAfrican Coast§! naval region."
 WW1_agadir_deployment_tt:0 "The squadron's arrival will bring the dispute over Morocco into the open."
 ww1_agadir.1.t:0 "A Warning from Mansion House"
 ww1_agadir.1.d:0 "The arrival of a German warship off Agadir has raised the prospect of a permanent German foothold on Morocco's Atlantic coast. Sir Edward Grey has already raised our concerns with the German ambassador. The Chancellor now has an opportunity to make our position clear in public at Mansion House."
 ww1_agadir.1.a:0 "Europe must hear where Britain stands."
 ww1_agadir.1.b:0 "Keep our objections private."
 ww1_agadir.2.t:0 "The Treaty of Fez"
 ww1_agadir.2.d:0 "With Berlin's objections settled, our resident has opened negotiations at Fez. The proposed treaty leaves the Sultan on his throne and entrusts France with the direction of Morocco's foreign affairs and administration."
 ww1_agadir.2.a:0 "Establish the protectorate."
 ww1_agadir.2.b:0 "Leave the Sultan to govern."
 ww1_agadir.3.t:0 "The Spanish Zone in Morocco"
 ww1_agadir.3.d:0 "The agreement with France defines the northern zone of Morocco that Spain is to administer. Our officials can now assume authority in the Rif under the terms of the convention."
 ww1_agadir.3.a:0 "Put the convention into effect."
 ww1_agadir.4.t:0 "An Ultimatum over Morocco"
 ww1_agadir.4.d:0 "The German ambassador has delivered a final demand for territory adjoining Kamerun in return for German recognition of our position in Morocco. The squadron off Agadir will remain until an answer is received. Our ministers must decide whether to accept the colonial exchange or refuse to negotiate under threat of force. London may support us, but no British undertaking can make the decision for France."
 ww1_agadir.4.a:0 "Accept the exchange and end the confrontation."
 ww1_agadir.4.b:0 "France will not yield to an ultimatum."
 ww1_agadir.5.t:0 "Paris Refuses the Ultimatum"
 ww1_agadir.5.d:0 "The French government has rejected our final demands. Our ambassador reports that Paris is preparing for a confrontation and seeking assurances from London. The naval demonstration has reached its limit. We must recall the squadron and endure the humiliation, or order the armed forces to compel a settlement. War with France may bring Britain into the struggle."
 ww1_agadir.5.a:0 "Recall the squadron. We will not fight over this."
 ww1_agadir.5.b:0 "Then we shall take the territory by force."
 ww1_agadir.6.t:0 "War over Morocco"
 ww1_agadir.6.d:0 "Germany has declared war on France after Paris rejected its demands for colonial compensation. The dispute over Agadir now threatens the balance of power in Europe. The Cabinet must decide whether to support France by force or leave the two powers to fight. Intervention will mean war with Germany; remaining outside may leave Britain facing a greatly strengthened German Empire."
 ww1_agadir.6.a:0 "We cannot stand aside. Declare war on Germany."
 ww1_agadir.6.b:0 "Britain will remain outside the war."
 ww1_agadir.7.t:0 "Germany Delivers an Ultimatum"
 ww1_agadir.7.d:0 "The confrontation over Morocco has taken a dangerous turn. With German warships off Agadir, Berlin has demanded a colonial settlement from France and warned that further delay is unacceptable. Paris has yet to give its final answer. European governments are seeking assurances as the possibility of a diplomatic bargain gives way to fears of war."
 ww1_agadir.7.a:0 "The gunboats have brought Europe to the brink."
 ww1_agadir.8.t:0 "Germany and France at War"
 ww1_agadir.8.d:0 "Negotiations over Morocco have ended in war. After France refused its ultimatum, Germany ordered its armed forces into action, turning a colonial dispute into a conflict between two of Europe's great powers. Governments across the continent are weighing their obligations while London considers whether Britain can remain outside the struggle."
 ww1_agadir.8.a:0 "A colonial quarrel has become a European war."
