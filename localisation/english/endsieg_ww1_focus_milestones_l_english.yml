l_english:
 US2_occupy_veracruz: "Occupy Veracruz"
 US2_occupy_veracruz_desc: "A shipment of arms bound for Huerta is approaching Veracruz. The Navy can seize the customs house and stop the cargo from reaching his troops. What begins at the docks may prove harder to contain."
 US2_R_caribbean_intervention: "Enforce the Corollary"
 US2_R_caribbean_intervention_desc: "The Navy has plans to land Marines if disorder threatens Caribbean ports. Congress and the cabinet must decide whether to back those plans or seek agreements with the governments concerned."
 US2_R_caribbean_intervention_tt: "Allows the government to consider intervention in Haiti and the Dominican Republic when conditions permit."
 RC1_offer_yuan_the_crown: "Offer Yuan the Throne"
 RC1_offer_yuan_the_crown_desc: "Yuan's supporters insist that only an emperor can hold the provinces together. The generals in Beijing are prepared to back him, but word of the proposal has already reached the southern governors."
