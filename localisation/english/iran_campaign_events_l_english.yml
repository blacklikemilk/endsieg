l_english:
iran_qajar_state: "The Qajar Court Restored"
iran_qajar_state_desc: "The crown governs through the household, the provincial governors it appoints and the officers it pays. Decisions are quick and the court's word is final, but the country's educated classes and the shariat have little reason to defend a government that consults neither."
iran_socialist_state: "The Persian Socialist Republic"
iran_socialist_state_desc: "Workers' councils and peasants' committees are the government's base, and the old officer corps has been replaced by men raised in the movement. Industry and recruitment respond to the new order, while landlords, tribal khans and foreign creditors wait for it to fail."
iran_nationalist_state: "The National Union"
iran_nationalist_state_desc: "The government rests on the officers, the press and the bazaar nationalists who demand that Iran be governed by Iranians. War support and the army's morale are its strength; the Majlis, the tribes and the foreign companies are its problem."
iran_wartime_economy: "Wartime Economy"
iran_wartime_economy_desc: "Price controls, requisition and rationing direct scarce goods toward the war effort. Civilian consumption is held down for as long as the emergency lasts."
iran_caucasus_interest: "Beyond the Aras"
iran_caucasus_interest_desc: "The Caucasus lies across the Aras, with its oil, its railways and its Armenian, Azerbaijani and Georgian populations. Iran may cultivate commercial and cultural influence there; the Soviet Union regards the region as its own."
iran_mesopotamia_interest: "The Mesopotamian Question"
iran_mesopotamia_interest_desc: "The Tigris plains and the Shia shrine cities of Najaf and Karbala have old ties to Iran that no frontier has erased. Iranian influence there will be watched closely by Baghdad and by the power that advises Baghdad."
iran_gulf_islands_tt: "Raises Iranian claims in the Gulf. Britain, as the protecting power, will treat this as a challenge and may refuse to negotiate."
iran_campaign.50.t: "The Third of Hut"
iran_campaign.50.d: "Before dawn the Cossack squadrons have occupied the telegraph office, the arsenal and the police headquarters in Tehran. The cabinet has been dismissed and the shah has signed a proclamation naming a new government. The officers say the country could not be governed otherwise; the deputies say the constitution has been suspended by a colonel."
iran_campaign.50.a: "Accept the proclamation and work with the officers."
iran_campaign.50.b: "Denounce the coup and demand the Majlis be summoned."
iran_campaign.51.t: "The Republic of Gilan"
iran_campaign.51.d: "In Resht the Jangali committees, the foresters and the Soviet-supplied volunteers have proclaimed a republic. They hold the Caspian ports and speak of land and of an end to the Tehran government's taxes. Tehran must decide whether the movement is a band of brigands or a rival authority."
iran_campaign.51.a: "Treat with the Gilan committees."
iran_campaign.51.b: "Refuse recognition and prepare to restore the province."
iran_campaign.52.t: "The Congress of the Jangal"
iran_campaign.52.d: "Delegates from the Gilan villages, the workers of Enzeli and the radical press have met in congress. They have adopted a programme of land reform and national independence and asked the northern neighbour for recognition. The gathering has given the movement a political programme that the Tehran newspapers cannot dismiss as disorder."
iran_campaign.52.a: "Endorse the congress and its programme."
iran_campaign.52.b: "Call for the movement to submit to the government."
iran_campaign.53.t: "The Republican Constitution"
iran_campaign.53.d: "The assembly has adopted a constitution that vests sovereignty in the nation, seats a single chamber elected by universal male suffrage, and makes the cabinet responsible to it. Supporters call it the completion of the constitutional revolution of 1906. Its opponents ask who will protect the country when the chamber cannot agree."
iran_campaign.53.a: "Promulgate the constitution."
iran_campaign.53.b: "Amend it to strengthen the executive."
iran_campaign.54.t: "The Disarming of the Tribes"
iran_campaign.54.d: "Columns have moved into the Bakhtiari, Qashqai and Lur summer pastures and demanded the surrender of rifles and hostages. Some confederations have complied and some have scattered into the mountains. The roads are quieter and the tribes will remember who made them give up their arms."
iran_campaign.54.a: "Continue the campaign to the end."
iran_campaign.54.b: "Negotiate with the confederations that resisted."
iran_campaign.55.t: "The Oil Concession"
iran_campaign.55.d: "The company's representatives have come to Tehran with a proposal to revise the concession's terms. The government may accept a smaller royalty and a longer term, or hold out for a larger share of the revenue and a say in how the fields are worked. The company has friends in London and in the bazaar alike."
iran_campaign.55.a: "Settle with the company."
iran_campaign.55.b: "Reject the terms and press the national claim."
iran_campaign.56.t: "The State in 1935"
iran_campaign.56.d: "The country has taken a new name abroad and a new administration at home. Its railways reach further than its tax collectors, its army is larger than its arsenals can supply, and the powers on either side have begun to count Iranian oil and Iranian roads among their own strategic requirements."
iran_campaign.56.a: "Enter the coming years with the state we have built."
iran_caucasus_interest_tt: "Opens commercial and cultural influence in the Caucasus. The Soviet Union treats the region as its own sphere and will react."
iran_mesopotamia_interest_tt: "Opens influence in Mesopotamia and the shrine cities. Iraq and its British advisers will react."
