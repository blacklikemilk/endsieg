l_english:
iran_qajar_state: "The Qajar Court Restored"
iran_qajar_state_desc: "The crown governs through the household, the provincial governors it appoints and the officers it pays. Decisions are quick and the court's word is final, but the country's educated classes and the shariat have little reason to defend a government that consults neither."
iran_socialist_state: "The Persian Socialist Republic"
iran_socialist_state_desc: "Workers' councils and peasants' committees are the government's base, and the old officer corps has been replaced by men raised in the movement. Industry and recruitment respond to the new order, while landlords, tribal khans and foreign creditors wait for it to fail."
iran_nationalist_state: "The National Union"
iran_nationalist_state_desc: "The government rests on the officers, the press and the bazaar nationalists who demand that Iran be governed by Iranians. War support and the army's morale are its strength; the Majlis, the tribes and the foreign companies are its problem."
iran_wartime_economy: "Wartime Economy"
iran_wartime_economy_desc: "Price controls, requisition and rationing direct scarce goods toward the war effort. Civilian consumption is held down for as long as the emergency lasts."
iran_caucasus_interest: "Beyond the Aras"
iran_caucasus_interest_desc: "The Caucasus lies across the Aras, with its oil, its railways and its Armenian, Azerbaijani and Georgian populations. Iran may cultivate commercial and cultural influence there; the Soviet Union regards the region as its own."
iran_mesopotamia_interest: "The Mesopotamian Question"
iran_mesopotamia_interest_desc: "The Tigris plains and the Shia shrine cities of Najaf and Karbala have old ties to Iran that no frontier has erased. Iranian influence there will be watched closely by Baghdad and by the power that advises Baghdad."
iran_gulf_islands_tt: "Raises Iranian claims in the Gulf. Britain, as the protecting power, will treat this as a challenge and may refuse to negotiate."
iran_campaign.50.t: "Officers Move in Tehran"
iran_campaign.50.d: "The Cossack command has intervened in Tehran, and a new government has been announced under pressure from the officers. Supporters say that a stronger hand is needed to restore order; deputies warn that the constitutional settlement is in danger. The country must decide how to respond."
iran_campaign.50.a: "Work with the officers to restore order."
iran_campaign.50.b: "Defend the authority of the Majlis."
iran_campaign.51.t: "The Movement in Gilan"
iran_campaign.51.d: "The Jangali movement in Gilan has become a serious challenge to the authority of Tehran. Its supporters speak of reform and national independence, while officials in the capital fear the growth of a rival government in the north."
iran_campaign.51.a: "Open talks with the movement."
iran_campaign.51.b: "Strengthen the government’s position in the north."
iran_campaign.52.t: "A Congress in Gilan"
iran_campaign.52.d: "Supporters of the Jangali movement have gathered to discuss their political programme. Their calls for reform and independence are attracting attention beyond Gilan, and the government must decide whether to seek common ground or rally those who oppose them."
iran_campaign.52.a: "Support the congress and its programme."
iran_campaign.52.b: "Rally support for the government."
iran_campaign.53.t: "A Constitution for the Republic"
iran_campaign.53.d: "A proposed constitution would set out the powers of the assembly and the government. Its supporters hope to secure the gains of the constitutional movement, while others want a stronger executive capable of acting in a crisis."
iran_campaign.53.a: "Promulgate the constitution."
iran_campaign.53.b: "Strengthen the executive."
iran_campaign.54.t: "The Tribal Question"
iran_campaign.54.d: "The government wishes to extend its authority into regions where tribal leaders have long governed their own affairs. Officers favour disarmament and direct supervision; others warn that an agreement with the confederations would bring more lasting security."
iran_campaign.54.a: "Proceed with disarmament."
iran_campaign.54.b: "Negotiate with the tribal leaders."
iran_campaign.55.t: "The Oil Concession"
iran_campaign.55.d: "The terms under which foreign companies work Iran’s oil fields have become a matter of renewed debate. Ministers must decide whether to reach an agreement with the concessionaires or press for greater national control and a larger share of the proceeds."
iran_campaign.55.a: "Reach an agreement with the company."
iran_campaign.55.b: "Press the national claim."
iran_campaign.56.t: "Iran and the World"
iran_campaign.56.d: "Our government has renewed its efforts to strengthen the state and assert Iran’s place among the nations. The work has made the country’s roads, resources and strategic position more important to foreign governments as well as to our own."
iran_campaign.56.a: "Iran must decide its own future."
iran_caucasus_interest_tt: "Opens commercial and cultural influence in the Caucasus. The Soviet Union treats the region as its own sphere and will react."
iran_mesopotamia_interest_tt: "Opens influence in Mesopotamia and the shrine cities. Iraq and its British advisers will react."
