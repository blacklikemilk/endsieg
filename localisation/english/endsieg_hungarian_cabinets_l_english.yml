l_english:
 INT_hungary.17.t:0 "A Trade Union Cabinet"
 INT_hungary.17.d:0 "Béla Kun’s council government has lost the means to continue its programme. The trade unions propose a cabinet under Gyula Peidl, which would restore a civilian republic and seek an understanding with the neighbouring powers. Its ministers would inherit a country exhausted by revolution and defeat."
 INT_hungary.17.a:0 "Entrust the government to Peidl."
 INT_hungary.17.b:0 "The councils will remain in office."
 INT_hungary.18.t:0 "Friedrich Demands Power"
 INT_hungary.18.d:0 "Conservative officers and politicians have rallied behind István Friedrich. They demand an end to socialist government and a new administration capable of restoring order. Accepting their demands would place the provisional government in conservative hands."
 INT_hungary.18.a:0 "Friedrich will form the government."
 INT_hungary.18.b:0 "Reject the demand for a new cabinet."
 INT_hungary.19.t:0 "A Coalition under Huszár"
 INT_hungary.19.d:0 "Negotiations among the parties have produced a proposal for a coalition led by Károly Huszár. Its supporters hope to end the isolation of the provisional government and prepare the country for elections. They ask the present ministers to make way for a broader administration."
 INT_hungary.19.a:0 "Invite Huszár to form a coalition."
 INT_hungary.19.b:0 "Retain the present ministry."
 INT_hungary_news.6.t:0 "Hungary Accepts an Armistice"
 INT_hungary_news.6.d:0 "Fighting has ceased on Hungary’s fronts after the advance of the neighbouring armies. The armistice leaves the country’s future government unsettled, while its neighbours retain their territorial claims."
 INT_hungary_news.6.a:0 "The armies fall silent."
