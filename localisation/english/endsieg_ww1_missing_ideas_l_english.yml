l_english:
 CHEKA_desc:0 "The Cheka has been given extensive powers to pursue the revolution's enemies. Its officers investigate opposition networks and impose the government's authority through coercion."
 CUP_in_power_desc:0 "The Committee of Union and Progress has consolidated its hold on the government. Its networks connect the ministries, the army and the industrial programme while restricting rival political influence."
 DEN_:0 "Military Theorist"
 DEN_Erik_Scavenius_ww1:0 "Erik Scavenius"
 FR3_Louis_GE1main_Martin:0 "Louis Germain-Martin"
 GE1_baghdad_railway_works_1_desc:0 "One portion of the civilian construction establishment is committed to the Baghdad Railway. Surveyors, contractors and workshops are engaged in the works."
 GE1_baghdad_railway_works_2_desc:0 "A larger share of the civilian construction establishment is committed to the Baghdad Railway. The expanded works require further contracts, machinery and skilled labour."
 GOELRO:0 "GOELRO Electrification Plan"
 GOELRO_desc:0 "The electrification plan coordinates new power stations with the development of industry. Its engineers aim to give reconstruction a more dependable supply of electricity."
 INT_SOV_westward_offensive_desc:0 "The advance west has stretched our communications and exposed the uneven preparation of the Red Army. Commanders must contend with unfamiliar ground, uncertain supplies and opponents fighting close to home."
 NEP_desc:0 "The New Economic Policy permits a limited revival of private trade and enterprise. The government seeks to restore ordinary economic life while rebuilding the country's industry."
 SER_grain_desc:0 "Grain deliveries from Serbia replenish army stores. Regular supplies help the depots keep replacement drafts and front-line formations provisioned."
 USA_isolationism_desc:0 "Many Americans regard European alliances and wars as commitments the republic should avoid. The government faces strong pressure to preserve its freedom of action and remain outside foreign conflicts."
 USA_support_desc:0 "American assistance has strengthened the troops and their supply arrangements. The prospect of continuing support gives commanders greater confidence in the campaign ahead."
 WWI_general_staff_desc:0 "The General Staff maintains a permanent body of officers trained to prepare campaigns and coordinate the army. Detailed plans allow large formations to act together."
 WWI_general_staff_upgraded_desc:0 "The General Staff has refined its procedures through further organisation and field experience. Its officers can prepare operations and coordinate formations with greater assurance."
 americans_are_here_desc:0 "American troops are arriving in strength. Their presence gives the Allied armies fresh reserves and encourages those who have endured years of fighting."
 backwards_military_desc:0 "The imperial forces use uneven training, equipment and command arrangements. These differences make it difficult to prepare recruits and keep formations working together on campaign."
 blockade_desc:0 "British naval control restricts Germany's access to overseas supplies. Scarcity raises the burden of feeding the population and forces industry to work with fewer imported materials."
 brusilov_offensive_desc:0 "Detailed preparation and close coordination have given the offensive momentum. The army is exploiting its initial success while replacement drafts sustain the advance."
 caliphate:0 "The Caliphate"
 caliphate_desc:0 "The Sultan's standing as caliph lends religious authority to the defence of the empire. The government draws upon that office to sustain the resolve of its soldiers."
 collectivist_ethos_focus_desc:0 "The government presents collective duty as the basis of political life. Public institutions place the common cause above competing individual and parliamentary claims."
 desertion_desc:0 "Growing numbers of men are leaving their formations. The loss of trained soldiers and uncertainty over replacements weaken units already worn down by the war."
 don_kuban_stability_2_desc:0 "The settlement in the Don and Kuban has been consolidated. More dependable local administration has strengthened the government's position behind the front."
 don_kuban_stability_desc:0 "The authorities have established a more secure footing in the Don and Kuban. A steadier rear allows the government to concentrate on the wider civil war."
 fall_of_russia_desc:0 "Russia's withdrawal has released men and attention for other fronts. The prospect of concentrating the war effort has renewed confidence among troops and civilians."
 foreign_expeditions_focus_desc:0 "The armed services have made arrangements for sending forces abroad. Expeditionary staffs can draw upon established recruiting, transport and supply procedures."
 german_advisors_ww1_1_desc:0 "German advisers are helping Ottoman officers revise training and staff procedures. Their work gives the army a foundation for more consistent organisation."
 german_advisors_ww1_2_desc:0 "The German military mission has extended its work throughout the army. Closer cooperation between instructors and Ottoman staffs has improved preparations for the field."
 grain_confiscation_desc:0 "Army requisition parties collect grain for the troops. The deliveries sustain the front, while the burden falls on villages already exhausted by the civil war."
 grain_ukraine_desc:0 "Grain deliveries from Ukraine replenish the army's stores. The shipments provide relief to formations whose depots have struggled to obtain enough food."
 gulags:0 "Forced Labour Camps"
 gulags_desc:0 "The state has organised forced labour camps to supply workers for construction projects. Coercion and confinement form the basis of this expansion."
 home_by_christmas_desc:0 "The troops have marched to war expecting a short and victorious campaign. That confidence lends urgency to their preparations and determination to their first battles."
 hundred_days_desc:0 "The Allied armies have regained the initiative on the Western Front. Coordinated attacks and continued reinforcement sustain the pressure on the opposing lines."
 internal_focus_desc:0 "The government has concentrated its attention on the empire's internal affairs. A more settled administration gives the army firmer support at home."
 iran_oil_revenue_dividend:0 "Oil Revenue Dividend"
 iran_oil_revenue_dividend_desc:0 "A larger share of the proceeds from oil is reaching the treasury. The government can meet more of its obligations at home and strengthen confidence in the settlement."
 jihad_desc:0 "The call to jihad appeals to the religious loyalties of the empire's Muslim subjects. The government invokes a common duty to defend the state and the faith."
 kaiser2_desc:0 "The Kaiser remains on the throne, but his place in the conduct of the war has become a source of political strain. Ministers must reconcile loyalty to the crown with mounting demands for a different course."
 kaiser3_desc:0 "The crown has emerged with renewed authority. A stronger settlement around the throne has restored confidence in the imperial government."
 kaiser_desc:0 "The imperial crown remains a source of continuity and public loyalty. The Kaiser's position links the government, the army and the federal princes."
 kuk_flieGE1arsenal_fischamend:0 "Imperial and Royal Aviation Arsenal, Fischamend"
 lafayette_escadrille_desc:0 "American volunteers fly in French service. Their squadron adds experienced airmen to the front and gives the public a visible symbol of support from across the Atlantic."
 land_reforms:0 "Land Reform"
 land_reforms_desc:0 "The land question can no longer be deferred. The government has undertaken to examine ownership, tenancy and the claims arising from the revolution."
 liberty_ethos_focus_desc:0 "The government has affirmed civil liberty as a guiding principle. Its public commitment encourages closer relations with countries receptive to that tradition."
 libya_not_subdued_desc:0 "The colonial administration's authority remains uncertain beyond its principal garrisons. Local resistance makes the occupation a continuing military commitment."
 libya_subdued_desc:0 "Italian authority has been established across the territory claimed by the colonial administration. Officials now turn their attention to maintaining communications and consolidating the occupation."
 militarism_focus_desc:0 "Military service and sacrifice occupy a central place in public life. The authorities encourage enlistment and extend military influence into civil society."
 military_focus_desc:0 "The government has given the armed services priority in research and training. Military schools and technical offices are expected to turn expenditure into practical improvements."
 military_tradition2_desc:0 "Military service occupies an established place in public life. The army can draw on this tradition when calling men to the colours and sustaining their resolve in the field."
 military_youth_focus_desc:0 "Youth organisations prepare their members for military service. Drill and instruction familiarise a new generation with the duties expected of recruits."
 morane_saulnier2:0 "Morane-Saulnier"
 multi_ethnic_desc:0 "The monarchy brings together peoples with different languages, laws and political ambitions. Rival administrations and conflicting national demands hinder common action in Vienna and in the army."
 orient_army_desc:0 "The Army of the Orient brings together the men, staffs and supply arrangements needed for operations in the Balkans. An established command gives the expedition a firmer footing."
 paramilitarism_focus_desc:0 "Paramilitary organisations provide a body of men familiar with weapons and military discipline. Their local networks also assist the authorities in maintaining control."
 patriotic_fervor_desc:0 "Public enthusiasm has carried into the army. Volunteers, reservists and serving soldiers take confidence from the belief that the nation stands behind their cause."
 political_commissars_focus_desc:0 "Political commissars serve alongside military commanders. Their task is to explain the government's cause and sustain the political commitment of the troops."
 rasputin_desc:0 "Rasputin's influence at court has become a source of distrust and political scandal. Ministers and officials struggle to command confidence while the conduct of government remains entangled in palace intrigue."
 recognized_by_west_desc:0 "Recognition abroad has given our government a stronger claim to speak for Russia. It has also encouraged officers and soldiers who feared that their struggle had been abandoned."
 red_scare_desc:0 "Fear of revolutionary agitation has spread through public life. The authorities have tightened their watch on radical organisations amid demands for stronger measures against them."
 red_terror_desc:0 "The revolutionary government has authorised a campaign against its opponents. Arrests and executions extend state coercion into political and civil life."
 russia_meh:0 "Reformed Military Districts"
 russia_meh_desc:0 "The district reforms have reduced some of the army's administrative difficulties. Further work is still needed before training, replacement drafts and field commands operate to a common standard."
 russia_sucks_less:0 "Reorganising the Military Districts"
 russia_sucks_less_desc:0 "New district arrangements are being introduced, but the transition remains incomplete. Uneven training and uncertain coordination continue to hinder the army."
 sacred_union_desc:0 "The parties have set aside their quarrels in defence of France. The truce gives the government room to direct the war with the backing of a broad parliamentary coalition."
 senussi_dissidents_desc:0 "The Senussi resist the extension of Italian rule. Their influence and knowledge of the interior challenge an administration dependent on a few coastal strongholds."
 shadow_kaiser_desc:0 "The Supreme Army Command has acquired influence far beyond the battlefield. Civilian ministers find their decisions overshadowed by the demands of the military leadership."
 shorter_training_GE1_desc:0 "The training syllabus has been shortened to deliver recruits to their formations sooner. Depots concentrate on the instruction considered essential for service."
 sick_man_europe_desc:0 "Repeated defeats and years of political upheaval have weakened the Ottoman army. Training, leadership and organisation vary sharply between formations, making concerted action difficult."
 sky_angel_desc:0 "The exploits of Manfred von Richthofen have made him a national figure. Reports of his victories give soldiers and civilians a celebrated example of courage above the front."
 supressed_minorities_desc:0 "The authorities have answered national agitation with restrictions and police action. Public opposition has been driven from the streets, though its grievances remain unresolved."
 supressed_revolutionaries_desc:0 "The authorities have restricted revolutionary organisations and strengthened their surveillance. Opposition groups find it harder to organise openly against the government."
 surprise_attack_desc:0 "The attack caught our forces before their preparations were complete. Disrupted communications and disorganised movements hinder the effort to establish a coherent defence."
 triumphant_will2:0 "Nationalist Ascendancy"
 triumphant_will2_desc:0 "The nationalist government has consolidated its authority around a common political programme. Its leaders can act with greater confidence at home and pursue alliances abroad."
 tsarist_officers_desc:0 "Former imperial officers have been retained for their military knowledge. Their experience supplies the army with trained commanders and staff officers."
 turkish_german_training_desc:0 "Ottoman and German officers have established a common training programme. Shared exercises and instruction are bringing greater consistency to the army's methods."
 unpopular_dictatorship_1_desc:0 "Opposition to the dictatorship has spread into the army. Commanders struggle to maintain confidence among men whose families have grievances against the government."
 unpopular_dictatorship_2_desc:0 "The dictatorship's enemies have gained support across the country. Desertion and uncertain loyalties undermine the government's attempts to restore order by force."
 volunteer_corps_focus_desc:0 "Volunteer formations have been organised for service beyond the country's borders. Their experience provides a foundation for further expeditions."
 war_communism_desc:0 "The state directs production, requisitions supplies and mobilises labour for the civil war. Economic life is subordinated to the demands of the army and the survival of the revolutionary government."
 white_terror_desc:0 "The authorities have entrusted the struggle against revolutionary activity to military tribunals and the security services. Arrests and reprisals carry the civil war into towns and villages far behind the front."
 why_we_fight_focus_desc:0 "The government has set out the country's reasons for continuing the struggle. A shared account of the war's purpose helps sustain support at home and resolve in the ranks."
 ww1_german_advisors_desc:0 "German officers are working with the imperial and royal army. Their advice is being incorporated into staff procedures, training and the handling of formations in the field."
 young_turk_reform_1:0 "Young Turk Reforms"
 young_turk_reform_1_desc:0 "The reformers have begun to reorganise the army and the civil administration. Early measures seek to make the ministries more effective and establish a basis for economic development."
 young_turk_reform_2:0 "Expanding the Reforms"
 young_turk_reform_2_desc:0 "The reform programme has extended into more branches of government. More consistent administration is helping the army and the public works departments put their plans into practice."
 young_turk_reform_3:0 "Consolidated Reforms"
 young_turk_reform_3_desc:0 "Sustained reform has established more reliable military and civil institutions. The ministries can now undertake wider development with a firmer administrative foundation."
