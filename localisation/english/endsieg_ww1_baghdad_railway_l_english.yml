l_english:
 baghdad_railway_gulf_safeguards: "Baghdad Railway Safeguards"
 GE1_baghdad_railway: "The Berlin–Baghdad Railway"
 GE1_baghdad_railway_request_first_contract: "Request the Anatolian Contract"
 GE1_baghdad_railway_request_first_contract_desc: "Ask the railway company to submit its contract for strengthening the approach through Cilicia. Authorizing the work costs 35 Political Power."
 GE1_baghdad_railway_adana_secured_tt: "The Ottoman government controls the route through Adana and can cooperate with Germany."
 GE1_baghdad_railway_british_reply_tt: "Britain's reply has been received, or Britain is unable to intervene."
 GE1_baghdad_railway_unlocked_tt: "Starts the §YBerlin–Baghdad Railway§! negotiations. If the Porte grants the concession, construction proceeds in five stages."
 GE1_baghdad_railway_bond_required_tt: "Construction stops while Britain and Germany are at war. After peace, Germany must pay an additional 25 Political Power to underwrite the Baghdad terminus."
 ww1_baghdad.1.t: "The Railway to Baghdad"
 ww1_baghdad.1.d: "German financiers and Ottoman officials are preparing to carry their railway toward Baghdad. The line promises new trade, but a route reaching the Gulf would also bring German influence closer to the approaches to India. Some ministers favor an accommodation with Berlin; others insist that Britain cannot permit the project to advance."
 ww1_baghdad.1.a: "Protect our interests along the line."
 ww1_baghdad.1.b: "This calls for war with Germany."
 ww1_baghdad.1.wartime.d: "German and Ottoman officials continue to press ahead with the railway to Baghdad. A completed line would ease the movement of supplies through Ottoman territory and strengthen the enemy's position in Mesopotamia. The cabinet must determine how to answer the project."
 ww1_baghdad.2.t: "Britain Replies on the Baghdad Railway"
 ww1_baghdad.2.accommodation.d: "The British government has chosen to seek an understanding over the railway to Baghdad. London remains concerned about access to the Persian Gulf and the security of the approaches to India, but is prepared to pursue those interests through negotiation.\n\nOur representatives can continue their work with the Ottoman authorities."
 ww1_baghdad.2.war.d: "The British government has declared war over our railway venture in the Ottoman Empire. Ministers in London describe German influence in Mesopotamia as a threat to their position in the Persian Gulf and to the approaches to India.\n\nThe company's foreign credit has been disrupted. Its work now depends upon the outcome of the conflict."
 ww1_baghdad.2.wartime.d: "British ministers have denounced the railway to Baghdad as an instrument of German influence and Ottoman military power. With our countries already at war, London intends to obstruct the project as part of its campaign in the region.\n\nThe company will need fresh financial guarantees before its plans can be carried through."
 ww1_baghdad.2.a: "Inform the railway company."
 ww1_baghdad.3.t: "Reinforce the Anatolian Approach"
 ww1_baghdad.3.d: "The track across Cilicia was laid for lighter traffic. The company must strengthen the permanent way and lengthen its passing loops before the railhead can supply the mountain works. The contractors estimate 90 days of work."
 ww1_baghdad.3.a: "Authorize the contract."
 ww1_baghdad.3.b: "Defer the contract."
 ww1_baghdad.4.t: "Through the Mountains"
 ww1_baghdad.4.d: "The engineers are ready to start the cuttings and bridge works east of Malatya. Until the contractors open this section, supplies for the next railhead will have to go by road. The contractors estimate 180 days of work."
 ww1_baghdad.4.a: "Authorize the contract."
 ww1_baghdad.4.b: "Defer the contract."
 ww1_baghdad.5.t: "Rails to Mosul"
 ww1_baghdad.5.d: "The company can now carry rails and sleepers down from the mountain railhead. The crews will lay the line across the upper plains and bring it into Mosul. The contractors estimate 135 days of work."
 ww1_baghdad.5.a: "Authorize the contract."
 ww1_baghdad.5.b: "Defer the contract."
 ww1_baghdad.6.t: "Down the Tigris"
 ww1_baghdad.6.d: "The surveyors have marked out the route from Mosul to Tikrit. With the northern railhead in service, the contractors can move their equipment south and begin laying the track. The contractors estimate 55 days of work."
 ww1_baghdad.6.a: "Authorize the contract."
 ww1_baghdad.6.b: "Defer the contract."
 ww1_baghdad.7.t: "The Baghdad Terminus"
 ww1_baghdad.7.d: "Only the approach from Tikrit and the freight yard remain. Once the points are fitted and the line inspected, trains will be able to work through to Baghdad. The contractors estimate 35 days of work."
 ww1_baghdad.7.a: "Authorize the contract."
 ww1_baghdad.7.b: "Defer the contract."
 ww1_baghdad.8.t: "Trains Reach Baghdad"
 ww1_baghdad.8.d: "The first freight train has arrived at Baghdad from the Anatolian railhead. The company can now run a regular service over a route that until recently depended on roads and river transport."
 ww1_baghdad.8.a: "Open the line to traffic."
 GE1_baghdad_railway_works_1: "Baghdad Railway Works"
 GE1_baghdad_railway_works_2: "Baghdad Railway Works"
