l_english:
 shx_campaign.1.t: "Shanxi Takes Charge"
 shx_campaign.1.d: "The authority of the central government has weakened, leaving Shanxi to manage its own affairs. In Taiyuan, the provincial administration and its officers must now secure the treasury, maintain their forces and decide how to deal with the rival governments beyond their borders."
 shx_campaign.1.a: "Shanxi must look to its own affairs."
 shx_campaign.2.t: "A Request from the Capital"
 shx_campaign.2.d: "The government in Beijing has asked Shanxi to send troops for its service. Our officers are reluctant to part with men needed at home, but a refusal may come at a political cost. The governor must decide how to answer."
 shx_campaign.2.a: "Our men are needed in Shanxi."
 shx_campaign.2.b: "Send the detachment."
 shx_campaign.3.t: "A Debt Comes Due"
 shx_campaign.3.d: "A representative of our patron has come to collect on the assistance given to Shanxi. We can settle the obligation in money or equipment, though either would place a strain on our own resources. A refusal will leave our officers to reckon with the consequences."
 shx_campaign.3.a: "Settle the account in money."
 shx_campaign.3.b: "Pay with equipment from the arsenal."
 shx_campaign.3.c: "We will give them nothing."
shx_campaign.4.t: "A Railway Concession"
shx_campaign.4.d: "Japanese representatives propose a railway survey through Shanxi, backed by a loan and rights to work the coal deposits along the route. The funds would help us meet pressing obligations, but the concession would give foreign interests a lasting foothold in the province."
shx_campaign.4.a: "Accept the concession."
shx_campaign.4.b: "Shanxi will keep control of its resources."
shx_campaign.5.t: "The Coalition Defeated"
shx_campaign.5.d: "The northern coalition has failed in its challenge to the government. Shanxi must reckon with the cost of the campaign and the disappointment of commanders who expected a better result. The governor must now rebuild his position at home."
shx_campaign.5.a: "We must put our affairs in order."
