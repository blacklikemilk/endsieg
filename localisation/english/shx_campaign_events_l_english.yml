l_english:
 shx_campaign.1.t: "The Province Takes Its Own Account"
 shx_campaign.1.d: "The Republic's garrison has marched out of Taiyuan and the provincial treasury is now kept by the men who already hold the valley. Yan Xishan has governed this province since the dynasty still stood, and he intends to go on governing it without asking Nanjing or Beijing what it costs."
 shx_campaign.1.a: "The province will be run from Taiyuan."

 shx_campaign.2.t: "Beijing Asks for Troops"
 shx_campaign.2.d: "A dispatch from the capital requires the province to send a detachment east for the government's use. The officers have read it before the governor did, and they are waiting to hear whether the province intends to answer it."
 shx_campaign.2.a: "The province keeps its men at home."
 shx_campaign.2.b: "The province sends the detachment and pays for it."

 shx_campaign.3.t: "The Patron Presents His Account"
 shx_campaign.3.d: "The rifles, the instructors and the credit have all been supplied on the understanding that the province would settle later. The patron's representative has come to Taiyuan to discuss what later means."
 shx_campaign.3.a: "The province pays in coin."
 shx_campaign.3.b: "The province pays in stores from the arsenal."
 shx_campaign.3.c: "The province refuses, and the officers hear of it."

shx_campaign.4.t: "The Surveyors at the Pass"
shx_campaign.4.d: "A Japanese company asks leave to survey a railway north through the province's hills, and behind the surveyors stand the men who would finance it. They offer a loan the treasury can finally accept, and the price they name is the coal under the passes. The officers hear the word loan and think of their arrears. The governor hears the price and thinks of what a province is."
shx_campaign.4.a: "Sell the line and take the money."
shx_campaign.4.b: "The province keeps its hills."
shx_campaign.5.t: "The Coalition Comes Apart"
shx_campaign.5.d: "The northern coalition has broken. Nanjing bought two of its commanders, fought the rest to a standstill and left the province to carry the bill home. The garrison returns to Taiyuan in good order and in poor humour, its pay in arrears again, and the National Government's newspapers now print the province's name beside the word rebel."
shx_campaign.5.a: "The province comes home."
