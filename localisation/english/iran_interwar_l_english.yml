l_english:
 IR2_majlis_restored: "The Majlis Restored"
 IR2_majlis_restored_desc: "With the agreement set aside, the cabinet lets a new Majlis be elected and take up the country's business. Deputies who were kept waiting on foreign signatures now hold the government's mandate, and the ministries answer for their conduct in the chamber."
 IR2_british_advisers: "The Armitage-Smith Mission"
 IR2_british_advisers_desc: "A British financial adviser arrives at the treasury with a small staff and a voice in receipts and expenditure. Their accounts can put the ministry's house in order, and their presence ties the budget to the legation's goodwill."
 IR2_cabinet_responsibility: "A Cabinet Answerable to the Majlis"
 IR2_cabinet_responsibility_desc: "Ministers hold office only while the deputies accept them, and each answers for the department he runs. The government gains a lawful footing for its authority, and officers who expected the cabinet to obey a commander find the chamber in the way."
 IR2_the_coup_of_1921: "The Coup of February 1921"
 IR2_the_coup_of_1921_desc: "The Cossack division marches on the capital before dawn, and a cabinet is formed with Sayyid Zia ol-Din at its head and Reza Khan commanding the army. The old ministers are arrested and the Majlis is not consulted; who arranged the march has never been settled."
 IR2_cossack_brigade: "The Cossack Command"
 IR2_cossack_brigade_desc: "The brigade is paid, reinforced and given Persian officers, and it becomes the strongest organized force in the country. Its commanders acquire an interest in politics that no cabinet can put aside."
 IR2_gilan_republic: "The Gilan Republic"
 IR2_gilan_republic_desc: "The Jangali movement and the social democrats of Rasht have proclaimed a republic in Gilan under Mirza Kuchak Khan. Rather than send the gendarmerie north, the cabinet leaves the province to its committees and begins to treat its leaders as partners in a wider settlement."
 IR2_reza_khan_minister: "Reza Khan at the War Ministry"
 IR2_reza_khan_minister_desc: "The commander of the Cossacks becomes minister of war and keeps the army's command in his own hands. Garrisons answer to him rather than to the cabinet, and every promotion confirms that the coming order will be made by soldiers."
 IR2_jangali_congress: "The Jangali Congress"
 IR2_jangali_congress_desc: "Delegates from the Gilan committees, the workers of Rasht and the villages of the hills meet to agree a common programme. The congress gives the movement a platform and a treasury, though its factions quarrel over land and over how far to trust Tehran."
 IR2_soviet_accord: "Supplies from Moscow"
 IR2_soviet_accord_desc: "The treaty signed in Moscow has cancelled the debts and concessions of the old empire, and Soviet vessels now bring rifles and instructors to the Caspian ports. The cabinet accepts them, and the left gains a patron with an interest in its success."
 IR2_socialist_congress: "A Congress of Workers and Peasants"
 IR2_socialist_congress_desc: "Delegates from the workshops, the oilfields and the villages are brought to Tehran to agree a programme for the country. Their resolutions give the left a national platform and put the government's economic policy under public argument."
 IR2_landlord_settlement: "A Settlement with the Landlords"
 IR2_landlord_settlement_desc: "The great landed families keep their estates in return for accepting the government's taxes, its courts and its roads. Their co-operation steadies the countryside and brings the harvest to market, at the price of leaving the tenants where they were."
 IR2_provincial_governors: "Governors from Tehran"
 IR2_provincial_governors_desc: "Governors-general are sent out from the capital with direct authority over the districts and their revenues. The provinces come under the ministries' control, and the notables who held those places lose them."
 IR2_dynastic_question: "The Dynastic Question"
 IR2_dynastic_question_desc: "With the army and the Majlis both claiming the settlement, the fate of the Qajar throne can no longer be deferred. Courtiers, deputies and officers must decide whether the dynasty remains, is replaced or is set aside, and the argument will be made in public."
 IR2_nationalist_movement: "The Nationalist Movement"
 IR2_nationalist_movement_desc: "Younger officials, journalists and officers have made national sovereignty their common ground. They fill the galleries and write in the press, and they will back whichever government promises to end foreign control of the country's finances."
 IR2_nationalist_press: "The Nationalist Press"
 IR2_nationalist_press_desc: "Papers in Tehran and the provincial capitals print the movement's arguments and its attacks on the concessions. The cabinet uses them to press its claims abroad, and finds that a press it has encouraged does not always stay friendly."
 IR2_nationalist_officers: "Officers of the Nation"
 IR2_nationalist_officers_desc: "Officers of the enlarged army see themselves as servants of the country rather than retainers of a court. Bound to that idea, they will sustain a government that defends Iranian sovereignty and judge one that does not."
 IR2_the_final_settlement: "The Final Settlement"
 IR2_the_final_settlement_desc: "A constituent assembly is summoned to decide the country's form of government, with the dynasty, the constitution and the army all in question at once. Whatever it decides will fix the state for the rest of the decade, and the losing side will have to live under it."
 IR2_qajar_restoration: "The Restoration of the Qajars"
 IR2_qajar_restoration_desc: "The assembly confirms Ahmad Shah and his house, and the court resumes the government it lost during the war. Ministries are filled from the household and the great families, elections are suspended, and the crown rules again over a country that has learned to argue."
 IR2_nationalist_front: "The National Front"
 IR2_nationalist_front_desc: "The nationalist officers and their allies close the Majlis and form a government of national purpose. It promises to end the concessions and rebuild the army, governs without elections, and rests on the loyalty of the garrison and the enthusiasm of the movement."
 IR2_socialist_republic: "The Socialist Republic"
 IR2_socialist_republic_desc: "The assembly declares a republic governed through councils of workers and peasants, with elections held and the land question opened. The court and the great landlords lose their place in the state, and the new government depends on the committees that made it."
 IR2_royal_authority: "The Crown's Authority"
 IR2_royal_authority_desc: "The shah governs as well as reigns, and ministers serve at his pleasure while the household's wishes reach into every department. The dynasty recovers what the constitution took from it, and the ministries learn to look to the palace."
 IR2_court_ministries: "Ministries of the Court"
 IR2_court_ministries_desc: "The departments are staffed from the court's own circle, and the household's officers take charge of the capital's administration. Government becomes a matter of the shah's confidence, and the great families left outside begin to look for other patrons."
 IR2_governors_of_the_crown: "Governors of the Crown"
 IR2_governors_of_the_crown_desc: "Provincial governors are appointed as the crown's representatives, answerable to the palace rather than to the ministries. Their districts are governed through the local notables the court trusts, and the provinces are tied to Tehran by patronage rather than by law."
 IR2_household_brigade: "The Household Brigade"
 IR2_household_brigade_desc: "The Cossack regiments become the crown's own guard, paid from the court and commanded by men the shah knows personally. It is a small force, drilled for the capital and the palace, and it is the dynasty's assurance that its orders will be obeyed."
 IR2_press_restraint: "Restraint of the Press"
 IR2_press_restraint_desc: "Newspapers are licensed, warned and where necessary closed, and editors learn what may be printed about the court. The capital grows quieter, and the government relies on foreign correspondents for what the world hears about the country."
 IR2_royal_works: "Works of the Crown"
 IR2_royal_works_desc: "The court sponsors workshops and a factory of its own in the capital, carrying the shah's name above the gate. The enterprise belongs to the household rather than to the ministries, and its profits and its patronage stay at the palace."
 IR2_restoration_capstone: "A Dynasty Restored"
 IR2_restoration_capstone_desc: "The Qajar order stands: the crown governs, the court fills the ministries and the guard holds the capital. The dynasty has survived the war and the republicans both, and its authority now rests on the habits of a country that has known no other form of government."
 IR2_electoral_law: "An Electoral Law"
 IR2_electoral_law_desc: "A statute fixes the franchise, the constituencies and the conduct of elections, and takes the returning officers out of the governors' hands. Deputies arrive in Tehran with constituencies behind them rather than patrons, and the chamber becomes harder to manage."
 IR2_provincial_compacts_ii: "Compacts with the Provinces"
 IR2_provincial_compacts_ii_desc: "The cabinet negotiates with tribal khans and town notables over the taxes, roads and recruits each district will provide. The agreements are written and registered, so that provincial co-operation has a legal form instead of a personal one."
 IR2_civil_service: "A Civil Service"
 IR2_civil_service_desc: "Appointments to the ministries are made on examination and record rather than on recommendation. A salaried service that survives a change of cabinet gives the government an administration of its own, and gives trained Persians the posts foreigners have been filling."
 IR2_budget_control: "The Budget under the Majlis"
 IR2_budget_control_desc: "The budget is laid before the deputies, debated in the open and voted line by line. Control of the purse gives the chamber a hold on every ministry, and the government can tell its creditors that its accounts are its own."
 IR2_constitutional_army: "An Army under the Law"
 IR2_constitutional_army_desc: "The army's establishment, its pay and its command are fixed by statute, and officers hold their commissions from the state rather than from a patron. The force grows slowly, but it belongs to the government that raised it."
 IR2_constitutional_capstone: "The Constitutional Order"
 IR2_constitutional_capstone_desc: "A crown that reigns, a chamber that votes the budget and a service that carries out its decisions have settled into a working arrangement. The settlement is unglamorous and durable, and it is defended by everyone it employs."
 IR2_republican_constitution: "The Republican Constitution"
 IR2_republican_constitution_desc: "A constitution is drafted for a republic with a president, a single chamber and a cabinet responsible to it. The crown's estates and prerogatives pass to the state, and the document is presented to the country as the founding law of the new order."
 IR2_elections_1928: "The Elections of 1928"
 IR2_elections_1928_desc: "The first general election under the republic is held with rival lists, public meetings and a press that has something to argue about. A chamber elected in the open gives the government a mandate it can cite abroad, and an opposition it cannot dismiss."
 IR2_civil_code: "A Civil Code"
 IR2_civil_code_desc: "The rulings of the religious courts and the customs of the towns are gathered into one code, administered by salaried state judges. Litigants get a single law and a single procedure, and the courts become an arm of the republic rather than of the seminaries."
 IR2_land_reform_debate: "The Land Question"
 IR2_land_reform_debate_desc: "The chamber takes up the great estates: who holds the land, who works it and what the state may ask of both. Nothing is settled quickly, and the debate itself changes what villagers expect of the republic."
 IR2_civilian_control: "Civilian Command"
 IR2_civilian_control_desc: "The army is placed under a ministry answerable to the cabinet, and its budget, postings and promotions pass through civilian hands. Officers accept the arrangement as the price of a professional service, and the government need no longer fear its own garrison."
 IR2_republic_capstone: "The Republic Established"
 IR2_republic_capstone_desc: "An elected chamber, a code of law and a subordinate army: the republic has the institutions it was founded to have. Its authority is the authority of its constitution, and it depends on the voters who put the government there."
 IR2_pahlavi_army: "The Pahlavi Army"
 IR2_pahlavi_army_desc: "Conscripts are raised by district, trained in camps outside the cities and posted where the government needs them. Uniform regiments replace the household troops and the tribal levies, and the state acquires the one instrument that reaches every province."
 IR2_secular_courts: "Secular Courts"
 IR2_secular_courts_desc: "Civil and commercial cases are moved from the religious courts to state tribunals staffed by salaried judges. The change gives the government one law for contracts and property, and takes a large part of the clergy's public authority with it."
 IR2_tribal_disarmament: "Disarming the Tribes"
 IR2_tribal_disarmament_desc: "The tribes are required to surrender their rifles and register their horsemen, district by district, with the army in support. Khans who submit keep their lands and their standing; those who resist are treated as rebels, and the campaign is remembered in the mountains for a long time."
 IR2_military_academy: "The Military Academy"
 IR2_military_academy_desc: "Officers are trained in Tehran on a common syllabus and commissioned into a common army. The academy produces men whose careers depend on the institution rather than on a provincial family, and gives the state a corps it can post anywhere."
 IR2_state_enterprises: "State Factories"
 IR2_state_enterprises_desc: "The government builds mills, a cement works and a sugar plant with its own capital and its own managers. Industry arrives without a concession attached to it, though the treasury carries the cost and the ministries must learn to run what they own."
 IR2_pahlavi_capstone: "The Pahlavi State"
 IR2_pahlavi_capstone_desc: "Army, courts, schools and factories answer to one government, and that government answers to the shah. The country is administered as never before, the men who built the administration expect it to serve them, and the crown's authority has become the state's."
 IR2_national_union: "A National Union"
 IR2_national_union_desc: "The front draws the nationalist press, the officers and the reforming officials into one organization with a single programme. Its branches in the provincial towns give the government a presence outside the capital, and its discipline is that of a movement rather than a ministry."
 IR2_economic_independence: "Economic Independence"
 IR2_economic_independence_desc: "A national bank, tariff protection and state investment are meant to keep the country's trade and credit in Persian hands. The programme builds industry at home and reduces what the government must ask of foreign lenders, at the cost of higher prices and slower returns."
 IR2_national_militia: "The National Militia"
 IR2_national_militia_desc: "Each district raises and equips its own militia, sworn to the nation rather than to a dynasty. The force is cheap, enthusiastic and hard to control, and it gives the front a reserve the regular army cannot match in numbers."
 IR2_iranian_academy: "The Iranian Academy"
 IR2_iranian_academy_desc: "A learned society is founded to fix the language, publish textbooks and honour the country's own scholarship. Its members staff the schools and the ministries, and it becomes the intellectual centre of the national programme."
 IR2_oil_revision: "Revising the Concession"
 IR2_oil_revision_desc: "The company's concession is reopened: the area it holds, the royalty it pays and the accounts it submits to the government. A revised agreement gives the treasury a larger and more visible share, and both sides understand that the dispute is now a question of national standing."
 IR2_gulf_claims: "Claims in the Gulf"
 IR2_gulf_claims_desc: "The government asserts its rights over the islands and the waters of the Gulf, and begins to build the means of making the claim good. A station on the coast, a few vessels and a customs service turn a diplomatic note into a presence."
 IR2_nationalist_capstone: "The Sovereign Nation"
 IR2_nationalist_capstone_desc: "The concessions are revised, the army belongs to the nation, and the government answers to no legation. The front has made sovereignty the test of every policy, and the country's standing abroad now depends on keeping that promise at home."
 IR2_workers_councils: "Workers' Councils"
 IR2_workers_councils_desc: "The mills and the oil installations are run by elected councils of their own workers, with the state supplying capital and the market. Production begins under different managers, and the former owners and their engineers are asked to serve or to leave."
 IR2_land_to_the_peasants: "Land to the Villagers"
 IR2_land_to_the_peasants_desc: "The largest estates are divided among the families who farm them, with title registered to the village. The measure gives the peasantry something to defend, and makes enemies of every great landowning house in the country."
 IR2_red_gendarmes: "The Red Gendarmes"
 IR2_red_gendarmes_desc: "The gendarmerie is re-formed from the committees and given political officers alongside its commanders. It patrols the roads and the frontier as the republic's force, and answers to the councils as much as to the ministry."
 IR2_soviet_trade: "Trade with the Soviet Union"
 IR2_soviet_trade_desc: "A clearing agreement sends cotton, rice and oil north in exchange for machinery, rails and fuel. The trade gives the republic a market and a supplier that Britain cannot close, and gives Moscow a large say in the country's economy."
 IR2_labour_law: "A Labour Law"
 IR2_labour_law_desc: "Hours, wages, holidays and the right to organize are fixed by statute, and inspectors are given power to enforce them. The law gives the republic's supporters in the workshops something concrete, and gives the mill owners a grievance to carry to anyone who will listen."
 IR2_anti_concession: "Against the Concessions"
 IR2_anti_concession_desc: "The remaining foreign concessions are cancelled or allowed to lapse, and none further is granted. The government takes over the installations it can use, and accepts that the companies, their shareholders and their governments will not forget the loss."
 IR2_socialist_capstone: "The Republic of Councils"
 IR2_socialist_capstone_desc: "Councils, divided estates and a cancelled concession make a state whose legitimacy rests on the villages and the workshops. It is a government of the poor and the organized, and its survival depends on whether it can feed the towns and hold the army."
 IR2_the_state_in_1935: "The State in 1935"
 IR2_the_state_in_1935_desc: "A settled government, a treasury that knows its income and an army that answers to it: what has been built since 1919 now stands on its own. The government asks foreign chancelleries to call the country Iran, and the settlement of 1925 is expected to hold."
 IR2_caspian_roads_project: "The Caspian Road"
 IR2_caspian_roads_project_desc: "The road from Qazvin over the Elburz to Rasht and the Caspian ports is widened and graded for motor traffic. Grain and silk reach the capital in days, and the northern provinces are tied to Tehran by something more reliable than the telegraph."
 IR2_gulf_harbour_project: "The Gulf Harbour"
 IR2_gulf_harbour_project_desc: "Bandar Abbas is dredged, given a mole and joined by road to the interior. The Gulf trade can be landed at a Persian port under Persian customs, and the shipping lines that serve the coast gain a reason to call there."
 IR2_oil_renegotiation: "The Oil Agreement of 1933"
 IR2_oil_renegotiation_desc: "The concession is rewritten: a smaller area, a fixed royalty, a share of the company's profits and Persian officials in its offices. The agreement is signed in Tehran, and both governments present it as a settlement rather than a surrender."
 IR2_textile_industry: "A Textile Industry"
 IR2_textile_industry_desc: "Cotton is spun and woven in mills built with state credit, and cloth that was imported is made at home. The mills give the towns work and the treasury a taxable industry, and they put the bazaar's importers out of business."
 IR2_sugar_refinery: "The Sugar Refinery"
 IR2_sugar_refinery_desc: "A refinery is built where the beet is grown, and the crop becomes worth planting for the market rather than for the household. Sugar, among the country's largest imports, begins to be made on Persian soil."
 IR2_agricultural_credit: "Credit for the Villages"
 IR2_agricultural_credit_desc: "A bank lends to cultivators against the standing crop rather than against their land, at rates the village moneylender cannot match. The harvest is no longer sold in advance to pay for seed, and the village keeps more of what it grows."
 IR2_land_registry: "The Land Registry"
 IR2_land_registry_desc: "Every parcel is surveyed, entered in a register and given a title the courts will enforce. The state learns who owns what and can tax it, and landowners who held property by custom alone must now prove it on paper."
 IR2_tehran_university: "The University of Tehran"
 IR2_tehran_university_desc: "The higher schools are gathered into one university with faculties of law, medicine, science and letters. Its graduates fill the ministries and the schools, and the country's intellectual life acquires an address in the capital."
 IR2_industrial_bank: "An Industrial Bank"
 IR2_industrial_bank_desc: "A bank with state capital lends to factories and takes a share in them, so that industry need not go abroad for money. Credit is directed by the government, and its officers decide which projects the country can afford."
 IR2_mining_survey: "The Mining Survey"
 IR2_mining_survey_desc: "Geologists are sent into the provinces to map coal, iron and copper, and the promising districts are licensed to Persian companies. The survey turns rumour into a register of what the country holds underground, and gives the steelworks a domestic source."
 IR2_road_programme: "The Trunk Roads"
 IR2_road_programme_desc: "Two great roads are built, one through the western provinces and one through Khorasan, with bridges and surfaces fit for lorries. Districts that were weeks apart are joined to the capital's market, and the army gains roads it can move on."
 IR2_customs_reform: "The Customs Tariff"
 IR2_customs_reform_desc: "The tariff is rewritten to protect domestic manufacture, and the customs houses are put under Persian officers. The government sets the price of imported cloth and machinery, and revenue that was farmed out comes in at the ports."
 IR2_telecommunications: "Telegraph and Telephone"
 IR2_telecommunications_desc: "Telegraph lines are extended to the provincial capitals and a telephone exchange opens in Tehran. Orders travel from ministry to district in hours, and the government is no longer surprised by news that reached the provinces before it."
 IR2_urban_works: "Public Works in the Capital"
 IR2_urban_works_desc: "Streets are paved, water is piped and public buildings rise where the old quarters stood. The capital becomes a place a government can be seen to govern from, and the works give the towns employment in years when the countryside has none."
 IR2_economic_capstone: "The National Economy"
 IR2_economic_capstone_desc: "A tariff, a bank, a railway and a register of the country's resources: the government now directs an economy it once only taxed. Foreign debt and foreign advisers count for less than they did, and the budget is written in Tehran."
 IR2_conscription_law: "The Conscription Law"
 IR2_conscription_law_desc: "Every district must supply its quota of recruits for two years with the colours, and exemptions are narrowed to the schools and the essential trades. The army becomes an institution with a claim on every village, and the villages learn to count the years."
 IR2_officer_academy: "A Staff College"
 IR2_officer_academy_desc: "Senior officers are sent back to study supply, maps and the movement of large formations. The army acquires a staff that can plan beyond the next district, and promotion begins to depend on the course rather than on seniority."
 IR2_armored_detachment: "An Armoured Detachment"
 IR2_armored_detachment_desc: "A squadron of light tanks and armoured cars is formed, with instructors and spares bought abroad. It moves faster than any column the country has, and it stands more as a demonstration of the army's intentions than as a weapon it can replace."
 IR2_arsenal_expansion: "The Tehran Arsenal"
 IR2_arsenal_expansion_desc: "The arsenal is enlarged and given machinery for small arms, cartridge cases and repairs. The army's rifles no longer depend on a foreign order arriving on time, and the government has an industrial establishment it can show a visiting general."
 IR2_frontier_divisions: "Frontier Divisions"
 IR2_frontier_divisions_desc: "Regiments are posted to the northwest and to Fars, with concrete posts, depots and roads behind them. The frontiers are held by units that live where they serve, and a neighbour's manoeuvre meets a garrison rather than a protest."
 IR2_air_force_1930: "The Persian Air Force"
 IR2_air_force_1930_desc: "A field is levelled outside Tehran, hangars built and a handful of machines bought with their instructors. The air service can carry a message, watch a frontier and overawe a tribal column, and it announces that the country means to be counted among those that fly."
 IR2_navy_gulf: "The Gulf Squadron"
 IR2_navy_gulf_desc: "A dockyard is built at Bandar Abbas and two sloops are ordered for the customs service. The government can board a dhow and inspect a cargo without asking the Royal Navy, and the Gulf is no longer policed entirely by others."
 IR2_supply_corps: "The Supply Corps"
 IR2_supply_corps_desc: "Depots, transport companies and a quartermaster's branch are organized to feed and equip a division in the field. An army that could march but not resupply is given the means to stay where it is sent."
 IR2_army_capstone: "The Army of the State"
 IR2_army_capstone_desc: "Conscription, staff, arsenal and air service have made the army the largest organized institution in the country. It can hold the frontiers and keep order in the provinces, and it has become a political fact no government can ignore."
 IR2_soviet_treaty_1921: "The Treaty of 1921"
 IR2_soviet_treaty_1921_desc: "Moscow's treaty renounces the debts and concessions of the old empire and gives the cabinet the right to close its frontier to armed forces. Ratified, it lets the northern provinces be cleared of foreign troops on legal grounds rather than by protest."
 IR2_apoc_negotiation_1933: "Negotiating with the Company"
 IR2_apoc_negotiation_1933_desc: "The Anglo-Persian Oil Company's concession is brought to the table again, with the royalty, the area and the company's accounts all in question. A settlement reduces the leverage its government has carried for twenty years, and the fields are worked on new terms."
 IR2_league_of_nations: "A Seat at Geneva"
 IR2_league_of_nations_desc: "The government takes its place at the League, brings disputes to the council and grievances to the assembly. The League cannot enforce much, but it gives a small state a hearing and a record, and the record is worth having."
 IR2_american_advisers: "The American Financial Mission"
 IR2_american_advisers_desc: "American advisers are brought in to administer the finances, with a hand in receipts, expenditure and the customs. They balance the budget and pay the army, and they make the government's accounts legible to lenders abroad."
 IR2_turkish_frontier: "The Turkish Frontier"
 IR2_turkish_frontier_desc: "The frontier with Turkey is surveyed and marked, and the two governments agree to police their own side of it. Raiding and smuggling across the border are dealt with by arrangement rather than by protest, and the western provinces are quieter for it."
 IR2_afghan_relations: "Relations with Kabul"
 IR2_afghan_relations_desc: "A treaty with Afghanistan settles the frontier, the passage of tribes and the water of the Helmand. The two governments undertake to prevent raids from their territory, and the eastern border becomes one the army need not garrison in strength."
 IR2_german_economic_mission: "The German Economic Mission"
 IR2_german_economic_mission_desc: "German engineers, machine tools and credit arrive in exchange for orders and a share of the trade. The government gets factories and equipment without a political treaty, and the British legation begins to read every German contract with attention."
 IR2_saadabad_prelude: "Toward Saadabad"
 IR2_saadabad_prelude_desc: "The government prepares a pact of non-aggression and consultation with Turkey, Iraq and Afghanistan. A regional understanding would keep the neighbours' disputes out of the great powers' hands, and give the country a place at the head of a bloc of its own."
 IR2_arms_purchasing: "Arms Purchases"
 IR2_arms_purchasing_desc: "Orders are placed with several suppliers at once, so that no single government can stop the army's rifles by withholding a shipment. The army pays more for its equipment and depends on nobody in particular, which is the purpose."
 IR2_diplomacy_capstone: "A Foreign Policy of Standing"
 IR2_diplomacy_capstone_desc: "Treaties with Moscow, Ankara, Kabul and Baghdad, a seat at Geneva and a pact in preparation among the neighbours have given the country a place in the region's politics. It can choose its friends, and it is courted by more than one of them."
 IR2_regional_ambitions: "Ambitions in the Region"
 IR2_regional_ambitions_desc: "The government begins to think of the country as the natural centre of the lands between the Caucasus and the Gulf. Claims, cultural missions and commercial treaties are prepared together, and the cabinet expects to be consulted on what its neighbours do."
 IR2_caucasus_interest: "Interests in the Caucasus"
 IR2_caucasus_interest_desc: "Persian consuls, merchants and communities across the Aras are drawn into a single policy, and the government watches the Soviet republics for signs of disorder. Influence there is cultivated quietly, and any claim is left to be made when the moment suits."
 IR2_mesopotamia_interest: "The Mesopotamian Question"
 IR2_mesopotamia_interest_desc: "The government takes up the shrines, the frontier tribes and the river navigation with Baghdad. Its interest in the south of Iraq is stated in terms of religion, trade and the treatment of Persian subjects, and the British embassy hears it clearly."
 IR2_gulf_islands: "The Gulf Islands"
 IR2_gulf_islands_desc: "Bahrain, the Tunbs and Abu Musa are claimed as part of the country's territory, and the claim is pursued through charts, treaties and a naval presence. The islands will not change hands on a note, but the government intends the question to stay open."
 IR2_afghan_influence: "Influence in Afghanistan"
 IR2_afghan_influence_desc: "Persian is taught, trade is encouraged and consuls are posted where the two peoples meet. The government cultivates its eastern neighbour's court and tribes, and works to ensure that Kabul looks to Tehran before it looks to London or Moscow."
 IR2_caspian_fisheries: "The Caspian Fisheries"
 IR2_caspian_fisheries_desc: "The fishing grounds off Gilan are taken back from the Russian concession and leased to a Persian company. Caviar and sturgeon become an export the government controls, and the Caspian coast gains a harbour and a revenue it has not had."
 IR2_regional_capstone: "The Regional Settlement"
 IR2_regional_capstone_desc: "A pact among the neighbours, consuls in the Caucasus and the Gulf, and a claim kept alive on the islands: the country has become a power in its own region. Its weight is now measured in treaties as well as in divisions."
 iran_settlement_choice_tt: "The assembly will choose the country's form of government, and that choice will settle the dynasty, the Majlis and the army at once."
 iran_socialist_support_tt: "The socialist movement in the towns and the northern provinces must be strong enough to carry a republic of councils."
 IR2_loyal_division: "The Division Refuses"
 IR2_loyal_division_desc: "The Cossack officers are ordered to march on the capital and do not march. Whether out of loyalty to the crown, to the Majlis or simply to their own pay, the brigade stays in its barracks, and the cabinet is left standing with an army that has not moved against it."
 IR2_court_and_concessions: "The Court and the Concessions"
 IR2_court_and_concessions_desc: "The restored court reopens the files of 1919. The companies that hold the country's roads, mines and oil are called to account before a tribunal that no longer waits on a foreign legation, and the first of the old concessions is cut down to size."
 IR2_general_staff: "A General Staff of Our Own"
 IR2_general_staff_desc: "The army is brought under a single staff answerable to the government of the day rather than to a commander's household. It is a slower reform than a strongman's, and it is the one a settlement can actually carry."
 IR2_volunteer_levy: "A Volunteer Levy"
 IR2_volunteer_levy_desc: "Instead of a conscription law imposed from above, the provinces are asked for volunteers and paid for them. The army grows more slowly, and it does not resent the ministry that raised it."
 IR2_state_railways: "The State Railways"
 IR2_state_railways_desc: "The railway is built as a state work, funded from the treasury and argued through the chamber line by line. It arrives later than a shah's decree would have brought it, and it belongs to the country rather than to a court."
 IR2_state_university: "A National University"
 IR2_state_university_desc: "The university is founded by the state and opened to the provinces as well as to the capital. Its charter answers to the government of the day, and its first faculties are law, medicine and engineering."
 IR2_national_tariff_office: "The Tariff Office"
 IR2_national_tariff_office_desc: "Tariff autonomy is asserted by statute and administered by a civil office rather than by a decree. The revenue is smaller, the procedure is public, and the foreign companies must argue their case in the same queue as everyone else."
 iran_pahlavi_programme_tt: "This programme belongs to the Pahlavi state: a restored Qajar court, a constitutional monarchy, a republic, a nationalist front or a socialist republic pursues its own equivalent instead."
 iran_alternative_programme_tt: "The settlement has taken a different course, and this focus is that course's equivalent of the Pahlavi programme."
 iran_officer_loyalty_tt: "The officer corps must still be loyal to the government, and Reza Khan must not yet command it."
