l_english:
 WW1_naval_race:0 "The Anglo-German Naval Race"
 WW1_naval_race_desc:0 "[GetWW1NavalRaceDescription]"
 WW1_naval_race_peacetime_desc:0 "The Royal Navy remains the world's strongest fleet, but the German naval laws have set a challenge to British command of the seas. Shipbuilding demands money, labour and time. The balance is measured by commissioned battleships, battlecruisers, light and heavy cruisers, including their early predecessors; new dockyards and ships must still be built and deployed. A binding naval convention or a common alliance will end the rivalry.\n\n[GetWW1NavalRaceBalance]"
 WW1_race_naval_estimates:0 "Fund the Naval Estimates"
 WW1_race_naval_estimates_desc:0 "Additional estimates will give the yards the resources to accelerate their work. The programme will place a substantial burden on the civilian economy while it lasts."
 WW1_race_expand_yards:0 "Expand the Naval Yards"
 WW1_race_expand_yards_desc:0 "A larger fleet requires slips, equipment and skilled hands. We will commit men and materials to expanding a home dockyard."
 WW1_race_german_naval_standard:0 "Challenge British Naval Supremacy"
 WW1_race_german_naval_standard_desc:0 "Our fleet has grown into a force that the Admiralty must reckon with. The government can point to the naval programme as proof of Germany's place at sea."
 WW1_race_british_naval_standard:0 "Maintain the Naval Margin"
 WW1_race_british_naval_standard_desc:0 "The Royal Navy must remain strong enough to protect the seas on which the empire depends. Our building programme has preserved a clear margin over the German battle fleet."
 WW1_north_sea_blockade:0 "The North Sea Blockade"
 WW1_north_sea_blockade_desc:0 "The blockade depends on the Royal Navy and its allies retaining control of the North Sea. Assign fleets to the North Sea or Eastern North Sea to enforce it. The Admiralty reviews control weekly.\n\n[GetWW1BlockadeStatus]\n\nEnemy shipping remains subject to the ordinary convoy and trade system; a fleet must be deployed to affect it."
 WW1_blockade_status_active:0 "§GThe blockade is being enforced.§! Germany suffers shortages."
 WW1_blockade_status_inactive:0 "§RThe blockade is not being enforced.§! Our fleets must regain control of the North Sea."
 WW1_naval_blockade_requirements_tt:0 "The blockade is enforced while Britain and its allies control the §YNorth Sea§! or §YEastern North Sea§!. Sea control is checked weekly."
 WW1_naval_race_open:0 "Britain and Germany remain naval rivals without a binding naval settlement"
 WW1_naval_race_focus_ready:0 "The navy has established its shipbuilding programme"
 WW1_naval_race_coastal_yard_available:0 "A controlled home coastal state has room for a dockyard"
 WW1_naval_race_germany_over_six_tenths:0 "Germany has more than 60% as many battleships, battlecruisers and cruisers as Britain"
 WW1_blockade_status_not_authorized:0 "§YThe blockade has not been authorized.§!"
 WW1_authorize_north_sea_blockade:0 "Authorize the North Sea Blockade"
 WW1_authorize_north_sea_blockade_desc:0 "The Admiralty will direct the fleet to restrict German access to overseas trade. The blockade can only be sustained while our ships control the approaches to the North Sea."
 WW1_naval_race_germany_closing:0 "§YGermany has more than six battleships, battlecruisers and cruisers for every ten British equivalents.§!"
 WW1_naval_race_british_margin:0 "§YBritain holds Germany at or below six battleships, battlecruisers and cruisers for every ten British equivalents.§!"
 WW1_race_program_free_tt:0 "No other naval programme is underway"
 WW1_naval_race_ui_title:0 "The North Sea Balance"
 WW1_naval_race_ui_germany:0 "Germany"
 WW1_naval_race_ui_britain:0 "Britain"
 WW1_naval_race_ui_german_count:0 "§Y[GetWW1GermanBattlefleetCount]§!"
 WW1_naval_race_ui_british_count:0 "§Y[GetWW1BritishBattlefleetCount]§!"
 WW1_naval_race_ui_counts:0 "Germany: §Y[GetWW1GermanBattlefleetCount]§!     Britain: §Y[GetWW1BritishBattlefleetCount]§!"
 WW1_naval_race_ui_counts_tt:0 "Commissioned battleships, battlecruisers, light and heavy cruisers currently controlled, including early models. Each ship counts once. Losses, transfers and completed ships change these totals."
 WW1_naval_race_ui_target:0 "[GetWW1NavalRaceTarget]"
 WW1_naval_race_peacetime_target:0 "German target: §Ymore than 60%§! of Britain's battle fleet"
 WW1_naval_race_ui_timer:0 "[GetWW1NavalRaceTimer]"
 WW1_naval_race_peacetime_timer:0 "[GetWW1NavalDeadline]"
 WW1_naval_deadline_countdown:0 "Fleet review in §Y[?GER.days_mission_timeout@WW1_german_fleet_review|0]§! days"
 WW1_naval_deadline_success:0 "§GThe fleet review was successful.§!"
 WW1_naval_deadline_failed:0 "§RThe fleet review failed.§!"
 WW1_naval_deadline_cancelled:0 "§YThe fleet review has been cancelled.§!"
 WW1_naval_deadline_unavailable:0 "The fleet review is not scheduled."
 WW1_german_fleet_review:0 "The Fleet Review"
 WW1_german_fleet_review_desc:0 "Six years have been allotted to build a battle fleet large enough to challenge Britain's command of the seas. If our commissioned battleships, battlecruisers and cruisers do not exceed three-fifths of Britain's total at the review, the failure will cause a severe political and financial crisis. War with Britain or a naval agreement cancels the review without penalty."
 WW1_failed_naval_programme:0 "The Naval Programme in Crisis"
 WW1_failed_naval_programme_desc:0 "The fleet has fallen short of the expectations raised by the Kaiser and the Navy Office. Amid recriminations over the cost of the ships, the government must settle its accounts and restore confidence in the dockyards."
 WW1_naval_race_recovery:0 "The Naval Programme in Crisis"
 WW1_naval_race_recovery_desc:0 "The failure of the naval programme has shaken confidence in the government. The costs and contracts must be settled before the yards can move forward."
 WW1_settle_the_naval_accounts:0 "Settle the Naval Accounts"
 WW1_settle_the_naval_accounts_desc:0 "Ministers, bankers and shipbuilders must agree on the outstanding contracts. The settlement will be costly, but it can bring an end to the dispute."
 ww1_naval_race.1.t:0 "The Fleet Review"
 ww1_naval_race.1.d:0 "The Navy Office has presented its reckoning to the government. Years of construction have left us with a formidable fleet, but not the strength promised against the Royal Navy. Deputies who approved the estimates now demand to know what Germany has gained for the expense. The unsettled contracts and the next naval budget promise a difficult reckoning."
 ww1_naval_race.1.a:0 "The government must answer for the expense."
 WW1_naval_war_open:0 "Britain and Germany remain opponents in the Great War"
 WW1_naval_war_german_control:0 "Germany has broken a previously enforced blockade and controls a North Sea approach"
 WW1_naval_war_british_control:0 "The North Sea blockade is being enforced"
 WW1_naval_race_wartime_desc:0 "The rivalry between the Royal Navy and the High Seas Fleet has become a struggle for command of the North Sea. Britain seeks to close the approaches to German trade, while the naval staffs review the position every 30 days. Germany must secure an approach to force a passage through the blockade.\n\n[GetWW1BlockadeStatus]"
 WW1_naval_war_german_target:0 "German target: §Ycontrol the sea and break the blockade§!"
 WW1_naval_war_british_target:0 "British target: §Yenforce the North Sea blockade§!"
 WW1_naval_war_german_countdown:0 "Naval review in §Y[?GER.days_mission_timeout@WW1_german_north_sea_campaign|0]§! days"
 WW1_naval_war_british_countdown:0 "Naval review in §Y[?ENG.days_mission_timeout@WW1_british_north_sea_campaign|0]§! days"
 WW1_naval_war_preparing:0 "The next naval review is being prepared."
 WW1_german_north_sea_campaign:0 "Challenge the Blockade"
 WW1_german_north_sea_campaign_desc:0 "The naval staff will review the North Sea in 30 days. To break an enforced blockade, our fleet must control the North Sea or Eastern North Sea while British control of both approaches is denied. The first breakthrough grants §G5§! naval experience and §G15§! political power. Later reviews carry no reward or penalty, and the review ends if the war ends."
 WW1_british_north_sea_campaign:0 "Maintain the Blockade"
 WW1_british_north_sea_campaign_desc:0 "The Admiralty reviews the North Sea every 30 days. The blockade must be authorized and backed by control of at least one North Sea approach. Reviews carry no political reward or penalty and end if the war ends."
 WW1_naval_war_dockyard_repairs:0 "Prioritize Fleet Repairs"
 WW1_naval_war_dockyard_repairs_desc:0 "Divert workshops and materials to repairing ships damaged at sea."
 WW1_naval_war_escort_effort:0 "Organize Wartime Escorts"
 WW1_naval_war_escort_effort_desc:0 "Commit dockyard labour and merchant captains to the protection of the sea lanes."
 WW1_naval_war_submarine_effort:0 "Support the Submarine Campaign"
 WW1_naval_war_submarine_effort_desc:0 "Provide the boats and their crews with additional support for operations against enemy shipping."
 ww1_naval_race.2.t:0 "The Blockade Broken"
 ww1_naval_race.2.d:0 "German ships have driven back British patrols and opened a North Sea approach for the first time since the blockade took hold. Control of the waters remains uncertain, and the fleet must be ready for the Royal Navy's response."
 ww1_naval_race.2.a:0 "Keep the fleet ready."
 ww1_naval_race.3.t:0 "The Fleet Held Back"
 ww1_naval_race.3.d:0 "The naval staff cannot report control of the North Sea approaches at its latest review. Our fleet remains a force the enemy must watch, but it has not secured the position sought by the government. Questions are being asked about the next move."
 ww1_naval_race.3.a:0 "We must find a way forward."
 ww1_naval_race.4.t:0 "The Patrols Hold"
 ww1_naval_race.4.d:0 "The Admiralty reports that the blockade remains in force. Our fleets hold the approaches through which German trade must pass, but the patrols cannot be relaxed while enemy ships remain at sea."
 ww1_naval_race.4.a:0 "Maintain the watch."
 ww1_naval_race.5.t:0 "The North Sea Review"
 ww1_naval_race.5.d:0 "The Admiralty has completed its review without a blockade in force. Ministers must decide how to bring the fleet and the machinery of the blockade into position if German overseas trade is to be restricted."
 ww1_naval_race.5.a:0 "The Admiralty must respond."
 ww1_naval_race.2.d_authorized:0 "Our fleet has secured a North Sea approach and broken the blockade's hold on German trade. British patrols no longer command either approach, and the shortages imposed by their blockade have eased. The Royal Navy will seek to recover its position."
 ww1_naval_race.5.d_authorized:0 "The Admiralty’s latest review finds the blockade no longer being enforced. Without control of the North Sea approaches, we cannot maintain the pressure on German overseas trade. The fleet must be brought back into position."
 WW1_blockade_status_active_german:0 "§RThe British blockade is being enforced.§! German imports are restricted."
 WW1_blockade_status_inactive_german:0 "§GThe blockade has been lifted.§! German trade has some relief."
 WW1_naval_race_blockade_status:0 "[GetWW1BlockadeSpiritStatus]"
 WW1_blockade_spirit_active_german:0 "North Sea Blockade §RACTIVE§!"
 WW1_blockade_spirit_active_british:0 "North Sea Blockade §GACTIVE§!"
 WW1_blockade_spirit_lifted_german:0 "North Sea Blockade §GLIFTED§!"
 WW1_blockade_spirit_lifted_british:0 "North Sea Blockade §RLIFTED§!"
 WW1_blockade_spirit_peacetime:0 "North Sea Blockade §gINACTIVE§!"
 WW1_naval_race_blockade_spirit_tt:0 "§YNorth Sea Blockade§!\n[GetWW1BlockadeSpiritDetails]"
 WW1_blockade_spirit_active_tt:0 "Germany has the §YNorth Sea Blockade§! national spirit.\nConstruction Speed §R-10%§!\nRation Production Cost §R+50%§!\n\nThese penalties end when Britain loses control of both North Sea approaches, withdraws its blockade or makes peace with Germany."
 WW1_blockade_spirit_lifted_tt:0 "The §YNorth Sea Blockade§! national spirit has been lifted from Germany.\nIts §Y-10% construction speed§! and §Y+50% ration production cost§! penalties have ended.\nBritain can restore the blockade by regaining control of either North Sea approach."
 ww1_naval_race.2.d_restored:0 "The Royal Navy has returned to the approaches since our fleet's success. Merchant captains again report British patrols on their routes, and the relief to German trade has proved brief. Our commanders must find a way to drive them back."
 WW1_blockade_status_reinstated:0 "§YThe British blockade has been reinstated.§! Its penalties are active again."
 WW1_blockade_status_lifted_british:0 "§RThe blockade has been broken.§! German ships control an approach and the penalties are suspended."
 WW1_blockade_status_suspended:0 "§YThe blockade is not being enforced.§! The German fleet has not secured control of an approach."
 WW1_blockade_status_awaiting_enforcement:0 "§YThe blockade is authorized but has not yet been enforced.§! British patrols must secure an approach."
 WW1_blockade_spirit_reinstated:0 "North Sea Blockade §YREINSTATED§!"
 WW1_blockade_spirit_not_authorized:0 "North Sea Blockade §gNOT ORDERED§!"
 WW1_blockade_spirit_suspended:0 "North Sea Blockade §YNOT ENFORCED§!"
 WW1_blockade_spirit_awaiting_enforcement:0 "North Sea Blockade §YAWAITING PATROLS§!"
 WW1_blockade_spirit_peacetime_tt:0 "The North Sea blockade is not active in the current war. Its construction and ration penalties are not applied."
 WW1_blockade_spirit_not_authorized_tt:0 "Britain has not ordered a North Sea blockade. No blockade penalties are applied to Germany."
 WW1_blockade_spirit_suspended_tt:0 "The blockade is not currently enforced and its penalties are not applied. Germany has not secured control of a North Sea approach. British patrols may restore the blockade."
 WW1_blockade_spirit_awaiting_enforcement_tt:0 "Britain has ordered a blockade, but its patrols have not established it. Germany has no North Sea blockade penalties and no German breakthrough has been recorded."
 ww1_naval_race.2.d_peace:0 "Our fleet broke the blockade's hold on German trade before hostilities with Britain ended. The opening brought relief after months of restricted shipping. With peace now concluded, the fleet's task is to safeguard that return to trade."
 WW1_naval_war_german_prevents_blockade:0 "German sea control prevents Britain from establishing its blockade"
 WW1_blockade_status_prevented:0 "§YGerman sea control prevents enforcement.§! The British blockade has not yet taken hold."
 WW1_blockade_spirit_prevented:0 "North Sea Blockade §YPREVENTED§!"
 WW1_blockade_spirit_prevented_tt:0 "German ships control a North Sea approach and prevent the British blockade from taking effect. No blockade penalties apply. This has prevented enforcement rather than broken an established blockade."
 WW1_blockade_status_peacetime:0 "§gThe North Sea blockade campaign is inactive.§! No blockade penalties are applied."
