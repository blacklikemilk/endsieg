l_english:
 qing_ww1: "The Late Qing Reform Era"
 qing_politics_navigation: "Court and Government"
 qing_economy_navigation: "Treasury and Industry"
 qing_army_navigation: "The Army"
 qing_diplomacy_navigation: "Foreign Affairs"
 qing_provinces_navigation: "The Provinces"
 QW1_regency_council: "The Regency Council"
 QW1_regency_council_desc: "The regent holds the seals for a child emperor and governs through a Grand Council that has outlived its usefulness. Give the council a programme before the provinces decide the dynasty has none."
 QW1_edict_of_reform: "The Edict of Reform"
 QW1_edict_of_reform_desc: "A reform edict costs the court little and tells every governor, editor and officer that the dynasty intends to survive. It also tells them what it intends to become."
 QW1_court_resistance: "The Court Will Not Be Rushed"
 QW1_court_resistance_desc: "The grand secretaries and the princes of the blood argue that reform is a foreign word for surrender. Their obstruction is a programme of its own, and it can be made to work."
 QW1_provincial_assemblies: "Provincial Assemblies"
 QW1_provincial_assemblies_desc: "The provincial gentry have asked for elected assemblies since the war with Japan. Granting them gives the dynasty a channel for provincial opinion and gives the provinces a stage."
 QW1_legal_code: "A Modern Legal Code"
 QW1_legal_code_desc: "A code that applies to officials as well as subjects is the difference between a reform programme and a new set of circulars. The foreign powers have promised to surrender extraterritoriality when the law is fit to be used."
 QW1_grand_council: "The Grand Council"
 QW1_grand_council_desc: "Government by memorial and rescript is government by delay. Give the council a fixed membership, a secretary and a duty to answer within the month."
 QW1_banner_privilege: "The Banner Establishment"
 QW1_banner_privilege_desc: "The banners are the dynasty's oldest claim to loyalty and its heaviest charge on the treasury. Confirm their privileges and the court keeps a garrison it can trust, at a price the provinces will notice."
 QW1_elective_assembly: "An Elective Assembly"
 QW1_elective_assembly_desc: "A national chamber elected by the provinces would make the government answerable to the people who pay for it. It would also make the court answerable to them, which is the point."
 QW1_budget_authority: "The Power of the Purse"
 QW1_budget_authority_desc: "Let the assembly vote the budget and the court must explain its spending for the first time in the dynasty's history. The provinces will lend more readily to a government that accounts for what it borrows."
 QW1_judicial_reform: "Independent Courts"
 QW1_judicial_reform_desc: "Courts that cannot be overruled by a governor are worth more to the dynasty than another division. Build them, and the foreign powers lose their loudest argument."
 QW1_court_appointments: "Appointments from the Court"
 QW1_court_appointments_desc: "Every ministry, every governorship and every customs post is filled by the court's favour. Use that power deliberately and the court becomes a government rather than a household."
 QW1_imperial_guard: "The Imperial Guard"
 QW1_imperial_guard_desc: "The guard answers to the throne and to nobody else. Its officers are the only men in Beijing whose loyalty is not a matter of negotiation."
 QW1_regency_end: "The Regency Question"
 QW1_regency_end_desc: "The emperor is a child, and every faction in the court is already governing in his name. Fix the succession of authority before the boy grows up and the question answers itself."
 QW1_constitutional_settlement: "The Constitutional Settlement"
 QW1_constitutional_settlement_desc: "The throne accepts a written constitution, a chamber with a mandate and a cabinet responsible to it. The dynasty keeps its crown and loses its monopoly on the state."
 QW1_constitution_draft: "Drafting the Constitution"
 QW1_constitution_draft_desc: "A written constitution needs a text, and every clause is a fight between the court's lawyers and the assembly's. Publish it and both sides are bound to something they can quote."
 QW1_party_politics: "Party Politics"
 QW1_party_politics_desc: "Organised parties turn a chamber of notables into a parliament. They also give the court someone to negotiate with, which is cheaper than negotiating with every province at once."
 QW1_cabinet_responsibility: "Responsible Government"
 QW1_cabinet_responsibility_desc: "A cabinet that answers to the chamber rather than the palace is the settlement's real content. Make it explicit and the constitution becomes a government rather than a promise."
 QW1_royal_prerogative: "The Royal Prerogative"
 QW1_royal_prerogative_desc: "The crown keeps the army, the foreign service and the right to dissolve the chamber. Written into the constitution, those powers become a permanent argument rather than a coup."
 QW1_constitutional_capstone: "A Crown Above the Law"
 QW1_constitutional_capstone_desc: "The settlement has survived its first crisis. The dynasty governs through institutions it did not choose and cannot easily dismiss, and that is the only reason it still governs."
 QW1_autocratic_settlement: "The Court Restored"
 QW1_autocratic_settlement_desc: "The revolution is put down and the court governs through the Grand Council, the governors it appoints and the army it pays. The empire is intact. The question is what it now costs to keep it."
 QW1_imperial_edicts: "Rule by Edict"
 QW1_imperial_edicts_desc: "Rescripts from the throne have the force of law and none of the deliberation. Use them and the government moves quickly, in whatever direction the palace last looked."
 QW1_censorate: "The Censorate"
 QW1_censorate_desc: "The censors can investigate a governor without the court losing face. Rebuild them and the throne gains eyes in every province."
 QW1_dynastic_legitimacy: "The Mandate Restored"
 QW1_dynastic_legitimacy_desc: "Rites, examinations and the language of the edict are the dynasty's oldest technology of rule. Use them and the court speaks to the country in a register it still understands."
 QW1_manchu_garrisons: "The Banner Garrisons"
 QW1_manchu_garrisons_desc: "The garrisons are expensive, antiquated and loyal. Reform them into a reserve and the court keeps both the loyalty and the money."
 QW1_authoritarian_capstone: "The Throne Unbound"
 QW1_authoritarian_capstone_desc: "The court has survived the revolution without sharing power. The provinces obey, the army is paid, and every reform now depends on the judgement of one household."
 QW1_imperial_treasury: "The Imperial Treasury"
 QW1_imperial_treasury_desc: "The treasury collects less than it is owed and spends more than it admits. An audit is the least glamorous and most dangerous reform in the empire."
 QW1_salt_gabelle: "The Salt Gabelle"
 QW1_salt_gabelle_desc: "Salt is the one tax every household pays. Reform its collection and the treasury gains a reliable revenue for the first time since the Taiping wars."
 QW1_land_tax_survey: "The Land Survey"
 QW1_land_tax_survey_desc: "Nobody knows how much land the empire has or who owns it. A survey gives the government a tax base and the gentry a reason to obstruct it."
 QW1_railway_programme: "The Railway Programme"
 QW1_railway_programme_desc: "Railways move troops, grain and ideas, and every one of them is a political question about foreign loans and provincial consent. Build them anyway."
 QW1_currency_board: "A Currency Board"
 QW1_currency_board_desc: "China runs on silver, copper and the paper of a dozen provincial banks. A national currency would make the budget legible and the provinces furious."
 QW1_telegraph_network: "The Telegraph Network"
 QW1_telegraph_network_desc: "A message that reaches a governor in a day instead of a month changes what governing means. Extend the wires and the court can act before a crisis becomes a rebellion."
 QW1_hanyang_arsenal: "The Hanyang Arsenal"
 QW1_hanyang_arsenal_desc: "Hanyang makes rifles the army can use and machine guns it cannot afford. Expand it and the New Army stops depending on foreign purchases for its ammunition."
 QW1_modern_banking: "Modern Banking"
 QW1_modern_banking_desc: "A state bank that can issue notes, hold the salt revenue and lend to the government would end the dynasty's dependence on foreign creditors and provincial remittances."
 QW1_industrial_mission: "An Industrial Mission"
 QW1_industrial_mission_desc: "Factories need engineers, and engineers need schools. Send a mission abroad, bring the teachers home and the first generation of Chinese industrial managers will be the dynasty's own."
 QW1_national_budget: "A National Budget"
 QW1_national_budget_desc: "A budget that the provinces can read and the assembly can vote is a revolutionary document disguised as an account book."
 QW1_foreign_loans: "Foreign Loans"
 QW1_foreign_loans_desc: "The powers will lend, at a price measured in railway rights and customs receipts. The money builds railways. The price builds something else."
 QW1_famine_administration: "Famine Administration"
 QW1_famine_administration_desc: "A famine that the government relieves is a demonstration of rule. A famine it ignores is an argument for revolution. Build the granaries and the relief columns."
 QW1_arsenal_expansion: "Arsenal Expansion"
 QW1_arsenal_expansion_desc: "Hanyang can be doubled, and the new works can make field guns as well as rifles. The army will notice, and so will the treasury."
 QW1_currency_capstone: "The Silver Standard"
 QW1_currency_capstone_desc: "A single currency, a single budget and a state bank give the dynasty something no Qing emperor has had since the eighteenth century: a government that knows what it owns."
 QW1_new_army_budget: "The New Army Budget"
 QW1_new_army_budget_desc: "The divisions raised after 1895 are the only modern force the dynasty has. Paying for them properly is a decision about who the state trusts with its guns."
 QW1_officer_schools: "Officer Schools"
 QW1_officer_schools_desc: "An army officered by men who studied abroad and came home impatient is an army that will have opinions. Train them anyway."
 QW1_modern_drill: "Modern Drill"
 QW1_modern_drill_desc: "Drill is doctrine made visible. Adopt the foreign manuals and the New Army begins to look like an army rather than a parade."
 QW1_military_academy: "A Military Academy"
 QW1_military_academy_desc: "A staff college produces officers who can plan a campaign rather than a march. It also produces officers who read newspapers."
 QW1_artillery_corps: "The Artillery Corps"
 QW1_artillery_corps_desc: "Artillery wins the battles the infantry cannot. Form the corps and the army gains the one arm that makes fortifications a problem for the enemy."
 QW1_engineering_corps: "The Engineering Corps"
 QW1_engineering_corps_desc: "Bridges, railways, telegraphs and field works are the army's least visible and most decisive business. Give the engineers a proper establishment."
 QW1_german_instructors: "German Instructors"
 QW1_german_instructors_desc: "A foreign military mission brings doctrine, drill and a great deal of political embarrassment. It also brings an army that can fight a modern war."
 QW1_national_arsenals: "National Arsenals"
 QW1_national_arsenals_desc: "An army that cannot make its own ammunition is a customer rather than a force. Arsenal reform is the difference between a modern army and a modern parade."
 QW1_supply_service: "A Supply Service"
 QW1_supply_service_desc: "Divisions that outrun their grain and ammunition are a rumour rather than an army. Build the depots and the railways that feed them."
 QW1_general_staff: "A General Staff"
 QW1_general_staff_desc: "A staff that plans for the whole empire rather than for each province is the last institution a modern army needs and the first the court fears."
 QW1_frontier_garrisons: "Frontier Garrisons"
 QW1_frontier_garrisons_desc: "Manchuria, Mongolia and Tibet are where the empire is thinnest. Move the new divisions north and the frontier becomes a frontier rather than a claim."
 QW1_army_capstone: "An Army of the State"
 QW1_army_capstone_desc: "The New Army has a staff, an arsenal, a doctrine and a supply service. It is now the strongest institution in China, and the court has to decide whether that is a guarantee or a threat."
 QW1_beiyang_command: "The Beiyang Command"
 QW1_beiyang_command_desc: "The Beiyang divisions are the best troops in China and answer to their own commander. Give that command a place in the system before it becomes a rival to the system."
 QW1_yuan_shikai_rise: "The Rise of Yuan Shikai"
 QW1_yuan_shikai_rise_desc: "Yuan Shikai has commanded the Beiyang army since the war with Japan and has outlasted every minister who tried to remove him. Bring him into the government and the army comes with him."
 QW1_beiyang_officers: "The Beiyang Officers"
 QW1_beiyang_officers_desc: "The officers around Yuan are a political network as much as a military one. Pay them, promote them and they will hold the north for whoever holds their loyalty."
 QW1_yuan_premiership: "The Premiership"
 QW1_yuan_premiership_desc: "Yuan Shikai becomes premier with the army, the treasury and the provinces in his gift. The throne keeps its title. The government belongs to the man who can move divisions."
 QW1_yuan_cabinet: "The Beiyang Cabinet"
 QW1_yuan_cabinet_desc: "Yuan's cabinet is staffed with officers, bankers and provincial governors who owe their posts to him. It governs efficiently and it governs for one man."
 QW1_beiyang_loyalty: "The Price of the Army"
 QW1_beiyang_loyalty_desc: "The army will guarantee the dynasty as long as the dynasty pays, promotes and does not investigate. Make the arrangement explicit and it becomes a constitution of its own."
 QW1_military_finance: "Military Finance"
 QW1_military_finance_desc: "A budget written by the army for the army is the real government of a military monarchy. Put the war ministry in charge of the revenue and the provinces will learn who governs."
 QW1_army_politics: "The Officers in Politics"
 QW1_army_politics_desc: "Beiyang officers are being elected to the provincial assemblies and appointed as governors. The army is becoming the state, one posting at a time."
 QW1_yuan_succession: "The Succession"
 QW1_yuan_succession_desc: "Yuan is not young, and the army has no answer to what comes after him. Settle the succession while he can still enforce it or the Beiyang command will divide into factions."
 QW1_provincial_governors: "The Provincial Governors"
 QW1_provincial_governors_desc: "Governors collect the taxes, raise the militia and report to Beijing when it suits them. Define what they owe the centre and the empire becomes a state rather than a courtesy."
 QW1_gentry_compact: "The Gentry Compact"
 QW1_gentry_compact_desc: "The gentry lend the dynasty its local authority and resent every new tax. A compact that guarantees their rents and their schools buys their loyalty at a price the treasury will pay later."
 QW1_provincial_assemblies_ii: "The Assemblies in Session"
 QW1_provincial_assemblies_ii_desc: "The provincial assemblies have discovered that they can refuse a budget, question a governor and publish the answers. Let them sit and the dynasty gains a provincial parliament it did not design."
 QW1_provincial_taxation: "Provincial Taxation"
 QW1_provincial_taxation_desc: "Let the provinces collect and keep a share of the revenue and they will collect it properly. Let them keep too much and the centre becomes a foreign ministry with a flag."
 QW1_local_militia: "Local Militia"
 QW1_local_militia_desc: "Provincial militia are cheap, locally loyal and useless in a real war. They are also the only force that can hold a province while the New Army is somewhere else."
 QW1_border_marches: "The Border Marches"
 QW1_border_marches_desc: "Tibet, Mongolia and Xinjiang are governed by arrangements rather than by law. Regularise them before a foreign power offers the border princes a better arrangement."
 QW1_federal_settlement: "The Provincial Compact"
 QW1_federal_settlement_desc: "The provinces keep their taxes, their militia and their assemblies. Beijing keeps the dynasty, the foreign service and the name of China. It is a settlement, not a victory."
 QW1_provincial_charter: "The Provincial Charter"
 QW1_provincial_charter_desc: "A charter that names what the provinces may do and what they may not do is the only document both sides will accept. Write it carefully, because neither will forgive a clause it dislikes."
 QW1_fiscal_compact: "The Fiscal Compact"
 QW1_fiscal_compact_desc: "The provinces keep the land tax and send a fixed quota to Beijing. The arrangement is stable, legible and permanently insufficient in a war."
 QW1_regional_armies: "Regional Armies"
 QW1_regional_armies_desc: "Every province wants its own army and every army wants its own revenue. Recognise the regional armies and the empire gains soldiers it cannot order into another province."
 QW1_federal_capstone: "A Union of Provinces"
 QW1_federal_capstone_desc: "The compact has survived a budget, a border dispute and a change of governor. China is now a union that the dynasty chairs rather than an empire it commands."
 QW1_foreign_office: "The Foreign Office"
 QW1_foreign_office_desc: "The dynasty negotiates through the Zongli Yamen, an office created to manage foreigners rather than to conduct diplomacy. Rebuild it and China can have a foreign policy."
 QW1_treaty_ports: "The Treaty Ports"
 QW1_treaty_ports_desc: "The treaty ports are where the empire meets the world economy and where foreign law replaces Chinese law. Regulate them and the customs revenue becomes a tool of policy."
 QW1_boxer_indemnity: "The Boxer Indemnity"
 QW1_boxer_indemnity_desc: "The indemnity of 1901 is a mortgage on the Chinese state paid to eight foreign governments. Renegotiate it and the treasury gains room, the powers gain a reason to watch China closely."
 QW1_british_understanding: "An Understanding with Britain"
 QW1_british_understanding_desc: "London cares about trade, the Yangtze and the balance of power in Asia. Offer all three and Britain will treat the dynasty as a government rather than an inconvenience."
 QW1_german_military_mission: "The German Mission"
 QW1_german_military_mission_desc: "German officers are the best teachers the Chinese army can hire and German industry is eager for Chinese orders. The mission will modernise the army and alarm every neighbour."
 QW1_japanese_relations: "The Japanese Question"
 QW1_japanese_relations_desc: "Japan is the one power with both the interest and the means to dismember China. Every Chinese government must decide how much it will concede to buy time."
 QW1_american_open_door: "The Open Door"
 QW1_american_open_door_desc: "Washington wants equal access to China and no exclusive spheres. That is not friendship, but it is a useful counterweight to the powers that want spheres."
 QW1_french_mission: "The French Mission"
 QW1_french_mission_desc: "France has loans, railway concessions and a sphere in the south. A French mission brings officers, engineers and a claim on Chinese goodwill."
 QW1_shandong_question: "The Shandong Question"
 QW1_shandong_question_desc: "Shandong is German-leased, Japanese-claimed and Chinese-inhabited. Every power has an opinion about it and none of them asks the province."
 QW1_foreign_concessions: "The Concessions"
 QW1_foreign_concessions_desc: "The foreign concessions in Shanghai, Tianjin and Hankou are states inside the state. Buying them back is expensive, slow and the only way to make Chinese law mean anything."
 QW1_diplomacy_capstone: "A Seat Among the Powers"
 QW1_diplomacy_capstone_desc: "China has an army trained abroad, a foreign office that answers its own telegrams and a claim to be treated as a state rather than a market. The powers have noticed."
 QW1_railway_guard: "The Railway Guard"
 QW1_railway_guard_desc: "The new lines need troops along them, and troops along the lines are how the court learns what the provinces are doing before the provinces do it."
 QW1_wuchang_garrison: "The Wuchang Garrison"
 QW1_wuchang_garrison_desc: "The garrison at Wuchang is the hinge of the middle Yangtze. Pay it, officer it and know its colonels by name."
 QW1_provincial_loyalty: "Provincial Loyalty"
 QW1_provincial_loyalty_desc: "Every province has a governor, a garrison and an assembly, and each of the three can defect separately. Find out which ones will hold before the shooting starts."
 QW1_capital_defences: "The Capital Defences"
 QW1_capital_defences_desc: "Beijing is the dynasty's last argument. Fortify the approaches, stock the granaries and make the capital expensive to take."
 QW1_revolution_prepared: "The Dynasty Is Prepared"
 QW1_revolution_prepared_desc: "The court has done what a government can do before a revolution: paid the army, watched the provinces, fortified the capital and made a settlement thinkable. What happens next is no longer entirely in its hands."
 QW1_chapter_end: "The Dynasty Enters the War"
 QW1_chapter_end_desc: "The settlement has held long enough to become ordinary. Now the European war arrives and the dynasty must decide what China's neutrality, or China's army, is worth to the powers."
 QW1_imperial_examinations: "The Imperial Examinations"
 QW1_imperial_examinations_desc: "The examination system is the dynasty's oldest route into office and its slowest. Modernise the syllabus and the state gains officials who can read a budget as well as a classic."
 QW1_regency_household: "The Regency Household"
 QW1_regency_household_desc: "The regent's household appoints the eunuchs, the guards and half the ministers. Bring it under the council and the court gains an administration."
 QW1_grain_reserves: "The Grain Reserves"
 QW1_grain_reserves_desc: "A granary system that works in a normal year is the cheapest insurance a Chinese government can buy against a bad one."
 QW1_cotton_mills: "Cotton Mills"
 QW1_cotton_mills_desc: "Textiles are the first industry a modern economy builds and the last one a rural economy gives up."
 QW1_steelworks: "A Steelworks"
 QW1_steelworks_desc: "Steel is the difference between buying weapons and making them. The works at Hanyang can be doubled."
 QW1_cavalry_reform: "Cavalry Reform"
 QW1_cavalry_reform_desc: "Cavalry is still the fastest arm in China and the most obsolete. Convert the best regiments into mounted infantry and the army gains reach without losing speed."
 QW1_railway_troops: "Railway Troops"
 QW1_railway_troops_desc: "A railway that cannot be guarded is a foreign concession in waiting. Form the railway troops and the lines become a national asset."
 QW1_military_telegraph: "Military Telegraph"
 QW1_military_telegraph_desc: "Orders that arrive in a day instead of a week change what a commander can be ordered to do."
