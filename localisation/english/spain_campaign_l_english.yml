l_english:
 # Spanish campaign - systems text: national spirits, balance of power, decision categories, decisions,
 # chapter events and shared effect tooltips.

 # ================================================================ balance of power
 SPR_crown_side: "The Crown"
 SPR_cortes_side: "The Cortes"
 SPR_crown_absolute: "Royal Government"
 SPR_crown_ascendant: "Court Ascendancy"
 SPR_crown_cortes_deadlock: "Deadlock"
 SPR_cortes_ascendant: "Chamber Ascendancy"
 SPR_cortes_sovereign: "Parliamentary Sovereignty"
 SPR_crown_cortes_deadlock_tt: "Neither the palace nor the chamber can carry a decision, and every ministry is formed to fall."

 # ================================================================ national spirits
 spain_officer_corps_loyal: "A Loyal Officer Corps"
 spain_officer_corps_loyal_desc: "The officer corps is paid on time, promoted on merit and consulted before it is ordered."
 spain_officer_corps_restive: "A Restive Officer Corps"
 spain_officer_corps_restive_desc: "The officer corps is underpaid, passed over and unpersuaded that the government deserves it."
 spain_officer_corps_estranged: "An Estranged Officer Corps"
 spain_officer_corps_estranged_desc: "The officer corps regards the government as an enemy of the army, and its senior men have begun to meet without being summoned."

 spain_industry_tier_1: "Industrial Recovery"
 spain_industry_tier_1_desc: "Mills and workshops are working again, and the tariff keeps the home market for Spanish goods."
 spain_industry_tier_2: "Industrial Expansion"
 spain_industry_tier_2_desc: "Spanish industry supplies the home market and begins to compete for the colonial and Latin American trade."
 spain_industry_tier_3: "Industrial Economy"
 spain_industry_tier_3_desc: "Iron, textiles and chemicals are organised into a national economy that finances the state instead of draining it."
 spain_agriculture_tier_1: "Agrarian Improvement"
 spain_agriculture_tier_1_desc: "Yields rise where credit and water reach the land, and the cities are fed a little more cheaply."
 spain_agriculture_tier_2: "Settled Countryside"
 spain_agriculture_tier_2_desc: "Irrigation and tenure reform keep the small farm alive and slow the flight of labourers to the cities."
 spain_agriculture_tier_3: "Productive Land"
 spain_agriculture_tier_3_desc: "The countryside feeds the cities, pays its taxes and stops emptying itself into the industrial suburbs."
 spain_infrastructure_tier_1: "Public Works"
 spain_infrastructure_tier_1_desc: "Roads, bridges and track are repaired as fast as the budget allows."
 spain_infrastructure_tier_2: "Connected Country"
 spain_infrastructure_tier_2_desc: "Freight moves on Spanish rails between the Basque ports, the Catalan mills and the southern estates."
 spain_infrastructure_tier_3: "Modern Infrastructure"
 spain_infrastructure_tier_3_desc: "The grid, the railways and the ports carry the country's trade without the bottlenecks of 1910."
 spain_education_tier_1: "Public Schooling"
 spain_education_tier_1_desc: "Literacy rises slowly, and each year of it takes something from the parish and gives it to the state."
 spain_education_tier_2: "A Teaching State"
 spain_education_tier_2_desc: "A generation of teachers, inspectors and school buildings exists where there was a charitable subscription."
 spain_education_tier_3: "Scientific Spain"
 spain_education_tier_3_desc: "Spanish institutes and universities produce their own engineers, chemists and officers instead of importing them."

 spain_caciquismo_system: "Caciquismo"
 spain_caciquismo_system_desc: "The district bosses deliver the vote, and the state repays them with the favours the law does not describe."
 spain_crown_government: "Government by the Crown"
 spain_crown_government_desc: "Ministers are chosen by the palace and the Cortes is informed afterwards."
 spain_parliamentary_government: "Parliamentary Government"
 spain_parliamentary_government_desc: "The Cortes writes the budget, and the ministry depends on its confidence rather than on the palace."
 spain_military_privileges: "Army Privileges"
 spain_military_privileges_desc: "The army keeps its own courts, its own promotion lists and a budget the treasury cannot audit."
 spain_rif_quagmire: "The Rif Quagmire"
 spain_rif_quagmire_desc: "The campaign in the protectorate consumes men, money and the government's remaining credit."
 spain_africanist_command: "The Africanist Command"
 spain_africanist_command_desc: "The officers of the Army of Africa hold the commands, the promotions and their own idea of Spain."
 spain_protectorate_pacified: "The Protectorate Pacified"
 spain_protectorate_pacified_desc: "Morocco is garrisoned, administered and quiet, and it is a school for officers."

 spain_republican_reform_programme: "The Reform Programme"
 spain_republican_reform_programme_desc: "Schools, statutes, arbitration and land settlement are law, and the state is committed to all four."
 spain_agrarian_reform_drive: "Land Settlement"
 spain_agrarian_reform_drive_desc: "Settlements are under way, the estates are on notice and the owners have taken their case to the chamber and the courts."
 spain_army_reform_azana: "The Azaña Reform"
 spain_army_reform_azana_desc: "The officer corps has been reduced, retired and reorganised on paper and in the barracks."
 spain_religious_tension: "Church Against Republic"
 spain_religious_tension_desc: "The schoolroom, the cemetery and the budget are all battlefields, and the bishops have chosen theirs."
 spain_catalan_statute: "The Catalan Statute"
 spain_catalan_statute_desc: "Catalonia governs itself within the Spanish state, with its own parliament, courts and schools."
 spain_basque_statute: "The Basque Statute"
 spain_basque_statute_desc: "The Basque provinces have recovered their administration and their tax arrangement."
 spain_centralist_reaction: "Administrative Unity"
 spain_centralist_reaction_desc: "Madrid has reasserted its authority over the provinces, and the statutes are suspended or trimmed."

 spain_holds_catalan_industry: "Catalonia Held"
 spain_holds_catalan_industry_desc: "The Catalan mills, workshops and port are in friendly hands, and they are working for the war."
 spain_holds_basque_steel: "The Basque Coast Held"
 spain_holds_basque_steel_desc: "Basque iron, the Bilbao docks and the Cantabrian coast are secured."
 spain_holds_andalusian_manpower: "Andalusia Held"
 spain_holds_andalusian_manpower_desc: "The southern countryside supplies grain and recruits in quantity."
 spain_holds_aragon: "Aragon Held"
 spain_holds_aragon_desc: "The Ebro valley supplies grain, horses and recruits."
 spain_holds_levantine_ports: "The Levante Held"
 spain_holds_levantine_ports_desc: "Valencia and the Levantine ports are open, and supplies reach the front through them."
 spain_holds_madrid_approaches: "The Capital Held"
 spain_holds_madrid_approaches_desc: "Madrid and its approaches are held, with the ministries, the treasury and the telegraph."
 spain_holds_african_army: "The Army of Africa"
 spain_holds_african_army_desc: "The protectorate and the Regulares are secured, and the best troops in the country are on this side."

 spain_falangist_state: "The Falangist State"
 spain_falangist_state_desc: "One party, one syndicate, one leader, and a national revolution announced from the balcony."
 spain_carlist_state: "The Carlist State"
 spain_carlist_state_desc: "Throne, altar and fueros: a traditionalist monarchy armed by the committees and the parishes."
 spain_monarchist_state: "The Restored Monarchy"
 spain_monarchist_state_desc: "A Bourbon restoration resting on the army, the aristocracy and the banks rather than on a party."
 spain_military_directorate: "The Military Directorate"
 spain_military_directorate_desc: "The army governs directly, without a party, a king or a constitution to argue with."

 spain_axis_alignment: "Axis Trade"
 spain_axis_alignment_desc: "German machine tools and Italian fuel arrive, and Spanish ore and wolfram go north."
 spain_allied_alignment: "Allied Trade"
 spain_allied_alignment_desc: "British credit, American oil and French coal arrive, and Spanish neutrality is bought rather than declared."
 spain_armed_neutrality: "Armed Neutrality"
 spain_armed_neutrality_desc: "The coastal defences are manned, the army is mobilised and both blocs are kept bidding."
 spain_blue_division_sent: "The Blue Division"
 spain_blue_division_sent_desc: "Spanish volunteers are fighting on the Eastern Front, and the regime has tied its prestige to the outcome."

 spain_civil_war_reconstruction: "A Country to Rebuild"
 spain_civil_war_reconstruction_desc: "The war has left the railways broken, the factories idle and the treasury empty, and every programme begins with a shortage."
 spain_reconstruction_advanced: "Reconstruction Under Way"
 spain_reconstruction_advanced_desc: "Track, plant and housing have been restored far enough that output responds to policy again."

 SPR_civil_war_preparation: "Before the Rising"
 SPR_buy_arms_abroad: "Buy Arms Abroad"
 SPR_buy_arms_abroad_desc: "Rifles, machine guns and shells purchased from France, Mexico or Czechoslovakia while the democracies will still sell. The stockpile grows and the treasury notices."
 SPR_court_the_french: "Court the French"
 SPR_court_the_french_desc: "Cultural missions, trade talks and staff conversations in Paris. French goodwill is the only great-power support the Republic can count on before the war."
 SPR_arm_the_unions: "Arm the Unions"
 SPR_arm_the_unions_desc: "Release rifles to the UGT and CNT committees. It raises the will to fight and it tells the officer corps exactly what it is facing."
 SPR_secure_the_garrisons: "Secure the Garrisons"
 SPR_secure_the_garrisons_desc: "Screen the peninsula's garrisons, move suspect commanders and put reliable officers in the arms rooms. It weakens the plot and irritates the army."
 SPR_negotiate_with_the_officers: "Negotiate with the Officers"
 SPR_negotiate_with_the_officers_desc: "Pay, postings and honours offered to the men who are being counted on to rise. It buys quiet and it costs the government its authority."

 # ================================================================ decision categories
 SPR_crown_and_cortes_category: "The Crown and the Cortes"
 SPR_military_loyalty: "The Officer Corps"
 SPR_regional_question: "The Regional Question"
 SPR_rif_war: "The Rif Campaign"
 SPR_nationalist_factions: "The Movement"
 SPR_wartime_diplomacy: "Wartime Diplomacy"
 SPR_reconstruction: "Reconstruction"
 SPR_campaign_debug: "Campaign Tuning"

 # ================================================================ decisions
 SPR_court_appointments: "Court Appointments"
 SPR_court_appointments_desc: "Place officers and administrators on the palace's list. The Crown gains ground in the balance and the army is reminded who pays it."
 SPR_royal_progress: "A Royal Progress"
 SPR_royal_progress_desc: "Take the king into the provinces. Cheap, popular, and it makes the monarchy look like a government."
 SPR_budget_offensive: "A Budget Offensive"
 SPR_budget_offensive_desc: "Force the estimates through the chamber and let the palace veto them if it dares. It moves the balance towards the Cortes and costs stability while it is fought."
 SPR_parliamentary_inquiry: "A Parliamentary Inquiry"
 SPR_parliamentary_inquiry_desc: "Put the African campaign, the police budget or a minister's contracts before a committee. It weakens the Crown's men and embarrasses the officer corps."
 SPR_dissolve_the_cortes: "Dissolve the Cortes"
 SPR_dissolve_the_cortes_desc: "Send the chamber home and govern by decree. Available only while the Crown is ascendant, and it spends the monarchy's remaining legitimacy."
 SPR_force_an_election: "Force an Election"
 SPR_force_an_election_desc: "Bring the government down and go to the country. Available only while the Cortes is ascendant, and the army will read the result as a verdict on itself."

 SPR_raise_officer_pay: "Raise Officer Pay"
 SPR_raise_officer_pay_desc: "Money for the officer corps, taken from the civil estimates. The army is satisfied and the treasury is not."
 SPR_promote_the_africanists: "Promote the Africanists"
 SPR_promote_the_africanists_desc: "Merit from the Moroccan commands against seniority from the peninsula. The Africanists are pleased, the juntas are not, and the Crown gains an ally."
 SPR_retire_senior_officers: "Retire Senior Officers"
 SPR_retire_senior_officers_desc: "Clear the promotion list of the men who blocked reform. The army loses experience and the government makes an enemy of every affected mess."
 SPR_garrison_the_cities: "Garrison the Cities"
 SPR_garrison_the_cities_desc: "Put infantry into the working-class districts and the railway stations. It consumes equipment, calms the streets and makes a coup harder to organise."
 SPR_amnesty_for_the_juntas: "Amnesty for the Juntas"
 SPR_amnesty_for_the_juntas_desc: "Bring the officers' committees back into the barracks legally. It removes the grievance and keeps the organisation."

 SPR_negotiate_the_catalan_statute: "Negotiate the Statute"
 SPR_negotiate_the_catalan_statute_desc: "Talks with the Generalitat over finance, language and competences. Autonomy rises, and so does the anger of the men who call it a partition."
 SPR_dissolve_the_mancomunitat: "Dissolve the Commonwealth"
 SPR_dissolve_the_mancomunitat_desc: "Govern Catalonia from Madrid by governor and garrison. Order is immediate, and the grievance is permanent."
 SPR_basque_economic_accord: "The Basque Economic Accord"
 SPR_basque_economic_accord_desc: "Settle the provincial tax quota and let the Basque provinces administer their own revenue. Industry gains and the treasury loses a lever."
 SPR_provincial_police: "Provincial Police"
 SPR_provincial_police_desc: "A state police in the provinces instead of municipal forces. It centralises order and it is read as an occupation."

 SPR_reinforce_the_presidios: "Reinforce the Presidios"
 SPR_reinforce_the_presidios_desc: "Hold the coastal garrisons, build blockhouses and wait. It costs equipment and ties down the army, and it commits Spain to the protectorate."
 SPR_advance_the_column: "Advance the Column"
 SPR_advance_the_column_desc: "Push inland from Melilla with the columns. It costs men and it is what the Africanists want."
 SPR_negotiate_with_the_tribes: "Negotiate with the Tribes"
 SPR_negotiate_with_the_tribes_desc: "Subsidies, stipends and the recognition of local authority instead of columns. The treasury pays, the officer corps objects and the casualties stop."
 SPR_annual_relief_expedition: "Relieve the Annual Garrisons"
 SPR_annual_relief_expedition_desc: "Send a relief force to the eastern command after the disaster. It costs men and it is the only thing the country will accept."

 SPR_back_the_falange: "Back the Falange"
 SPR_back_the_falange_desc: "Money, arms and offices for the party of the national revolution. It strengthens the Falange at the army's expense."
 SPR_back_the_carlists: "Back the Carlists"
 SPR_back_the_carlists_desc: "Subsidise the traditionalist committees and their requetés. It strengthens the Carlists at the Falange's expense."
 SPR_back_the_monarchists: "Back the Monarchists"
 SPR_back_the_monarchists_desc: "Work with the Alfonsine committees, the banks and the aristocracy. It strengthens the monarchists at the Carlists' expense."
 SPR_back_the_army: "Back the Army"
 SPR_back_the_army_desc: "Let the general staff settle the movement's politics. It strengthens the army at the monarchists' expense and satisfies the officer corps."
 SPR_unify_the_movement: "Unify the Movement"
 SPR_unify_the_movement_desc: "Force the factions into one organisation under the strongest of them. The regime acquires an identity and loses the others' goodwill."

 SPR_negotiate_with_germany: "Negotiate with Germany"
 SPR_negotiate_with_germany_desc: "Machine tools, fuel and instructors in exchange for ore, wolfram and a friendly neutrality. German leverage rises and the Allies notice."
 SPR_negotiate_with_britain: "Negotiate with Britain"
 SPR_negotiate_with_britain_desc: "Credit, oil and coal in exchange for keeping the strait and the ore out of German hands. Allied leverage rises."
 SPR_wolfram_exports: "The Wolfram Contracts"
 SPR_wolfram_exports_desc: "Sell tungsten to whoever pays in hard currency. Industry gains while the contracts run, and the other bloc remembers."
 SPR_the_blue_division: "The Blue Division"
 SPR_the_blue_division_desc: "Send volunteers to the Eastern Front. War support rises, the Axis is satisfied, and the Allies will not forget it."
 SPR_close_the_pyrenees: "Close the Pyrenees"
 SPR_close_the_pyrenees_desc: "Refuse transit, intern the deserters and hold the passes. German leverage falls and the Allies gain a corridor of goodwill."
 SPR_declare_armed_neutrality: "Declare Armed Neutrality"
 SPR_declare_armed_neutrality_desc: "Abandon alignment with either bloc and mobilise instead. Stability rises, and neither side will arm Spain on credit."

 SPR_rebuild_the_railways: "Rebuild the Railways"
 SPR_rebuild_the_railways_desc: "Bridges, track and rolling stock first, because nothing else moves without them."
 SPR_restore_the_industry: "Restore the Industry"
 SPR_restore_the_industry_desc: "State credit for the Catalan mills and the Basque furnaces, and the machinery that the war did not destroy."
 SPR_housing_programme: "A Housing Programme"
 SPR_housing_programme_desc: "Rebuild the working-class districts of Madrid, Barcelona and Bilbao. It is expensive, visible and popular."
 SPR_veterans_pension: "Veterans' Pensions"
 SPR_veterans_pension_desc: "Pay the men who fought, whichever side they fought on. It buys quiet in the villages and costs the treasury."

 SPR_debug_crown: "Tuning: Crown"
 SPR_debug_crown_desc: "Debug only. Pushes the balance hard towards the Crown."
 SPR_debug_cortes: "Tuning: Cortes"
 SPR_debug_cortes_desc: "Debug only. Pushes the balance hard towards the Cortes."
 SPR_debug_loyalty: "Tuning: Loyalty Up"
 SPR_debug_loyalty_desc: "Debug only. Raises officer loyalty."
 SPR_debug_discontent: "Tuning: Loyalty Down"
 SPR_debug_discontent_desc: "Debug only. Lowers officer loyalty."

 # ================================================================ events
 spain_campaign.10.t: "The Captain General Speaks"
 spain_campaign.10.d: "The manifesto is printed in Barcelona before the government in Madrid has finished reading it. The Captain General of Catalonia declares the constitution suspended, the administration corrupt and the army ready to save the country. The garrisons are already answering."
 spain_campaign.10.a: "Let him restore order."
 spain_campaign.10.b: "The Crown will use him."

 spain_campaign.12.t: "The Disaster of Annual"
 spain_campaign.12.d: "Silvestre pushed past the line agreed with the ministry and into the Rif without orders. In eight days the eastern command ceased to exist. The garrisons at Melilla held only because the tribes stopped to loot. The Cortes demands a name and the army demands silence."
 spain_campaign.12.a: "The army will not be tried in the press."
 spain_campaign.12.b: "Open the file to the Cortes."

 spain_campaign.14.t: "Alhucemas"
 spain_campaign.14.d: "The landing went in at dawn, with tanks in the first wave and the fleet firing over open sights. Twelve thousand men crossed the beach and the Rif line inland broke. The campaign is not finished, but the shape of it has changed."
 spain_campaign.14.a: "The protectorate is ours."

 spain_campaign.16.t: "The Dictatorship Runs Out"
 spain_campaign.16.d: "The Directory has no constitution, no party it trusts and no credit left to borrow against. The universities are against it, the artillery corps is against it, and the captains have asked for a decision rather than a reform. A general who was loyal in 1923 is a problem in 1930."
 spain_campaign.16.a: "The Crown looks for a way out."
 spain_campaign.16.b: "The regime hardens."

 spain_campaign.20.t: "The Republic Is Proclaimed"
 spain_campaign.20.d: "The municipal returns came in from the cities first. The crowds were in the Puerta del Sol and the Plaza de Cataluña before the ministry had met. The king's departure was announced from Cartagena in the evening. By morning the tricolour was on the public buildings and the Republic had a provisional government of men who had not expected to be one."
 spain_campaign.20.a: "The Republic is declared."
 spain_campaign.20.b: "It is declared over the army's objection."

 spain_campaign.22.t: "Asturias"
 spain_campaign.22.d: "The miners took the valleys with dynamite and a plan and held them for two weeks against infantry, artillery and aircraft. The Legion and the Regulares came up from Africa and retook the towns street by street. When it ended there were more prisoners than dead, and everyone understood what the next rising would look like."
 spain_campaign.22.a: "The rising is crushed."
 spain_campaign.22.b: "The government negotiates."

 spain_campaign.25.t: "The Last Winter"
 spain_campaign.25.d: "The election gave the Popular Front a majority and a mandate it cannot carry out without money it does not have. The Cortes is deadlocked, the ministry changes by the month, and the man in the Pamplona garrison sends his instructions through Lisbon. The Republic has months, not years."
 spain_campaign.25.a: "The decisive year begins."

 spain_campaign.26.t: "Spain Divides"
 spain_campaign.26.d: "From this month the question is no longer who governs Spain but which Spain exists. The ministries are in Madrid; the garrisons, the unions and two Internationals are all waiting."
 spain_campaign.26.a: "We hold what we hold."

 spain_campaign.30.t: "The Crown Rules Alone"
 spain_campaign.30.d: "The ministry now takes its instructions from the palace, and the Cortes is presented with decisions already taken. The Crown's opponents have been reduced to pressmen and professors, and the officers who were passed over are counting."
 spain_campaign.30.a: "The Crown governs."

 spain_campaign.31.t: "Parliamentary Sovereignty"
 spain_campaign.31.d: "The Cortes has the budget, the ministries and the succession of governments. The palace keeps its ceremonial and its army list, and it will not accept that arrangement for long."
 spain_campaign.31.a: "The Cortes governs."

 spain_campaign.40.t: "The Garrison Telephones"
 spain_campaign.40.d: "A general's manifesto is circulating in the barracks before it appears in the press. The Madrid garrison has been told to wait for a signal, and the signal is the arrival of a column at a railway station."
 spain_campaign.40.a: "The government stands firm."
 spain_campaign.40.b: "Concede to the officers."
 spain_campaign.40.c: "Buy the ringleaders."

 spain_campaign.41.t: "The Coup Succeeds"
 spain_campaign.41.d: "The garrisons declared before the government could arrest their commanders. By evening the key buildings were held and the ministry had fled or submitted. The Directory is proclaimed from the balcony of the Ministry of War."
 spain_campaign.41.a: "The army governs."

 spain_campaign.42.t: "The Coup Fails"
 spain_campaign.42.d: "The signal came too early for half the garrisons. Two generals are in prison, one is in Portugal, and the officer corps has learned which of its neighbours informed on it. The government survives, and the conspirators wait."
 spain_campaign.42.a: "The government survives."

 spain_campaign.50.t: "The Movement Splits"
 spain_campaign.50.d: "The coalition that won in July is composed of men who agree only about the enemy. The Falange wants a single party, the Carlists want a king of their own choosing, the monarchists want a restoration along the lines of 1876, and the army wants all three to do as they are told."
 spain_campaign.50.a: "Unify under the strongest."
 spain_campaign.50.b: "Let them compete."
 spain_campaign.50.c: "The army arbitrates."

 spain_campaign.60.t: "Spain After the War"
 spain_campaign.60.d: "The fighting is over and the country is a landscape of broken track, unmilled grain and requisitioned furniture. Somebody has to decide who was right, who is punished, and which industries reopen first."
 spain_campaign.60.a: "The next decade begins."

 spain_campaign.61.t: "The Post-War State"
 spain_campaign.61.d: "The books are empty, the army is demobilising and the railways run at half speed. Reconstruction is not a programme so much as a daily negotiation with shortages."
 spain_campaign.61.a: "Rebuild."

 spain_campaign.101.t: "The Directory Proclaims Itself"
 spain_campaign.101.d: "The Captain General has suspended the constitution and formed a military directory. Madrid is calm, the exchange is closed, and the embassies are asking whether this is permanent."
 spain_campaign.101.a: "Spain has a new government."

 spain_campaign.102.t: "The Republic Is Proclaimed in Madrid"
 spain_campaign.102.d: "The king has left the country and the tricolour is flying over the Ministry of the Interior. The provisional government has promised a constituent Cortes and an amnesty, and the army has promised nothing."
 spain_campaign.102.a: "Spain has a new government."

 # ================================================================ effect tooltips
 spain_restoration_programme_tt: "The Restoration enters its last decade with a programme of reform and no majority to carry it."
 spain_rivera_programme_tt: "The Directory now has a programme: order, public works and a constitution of its own making."
 spain_republic_programme_tt: "The Republic now has a programme: the constitution, the schools, the statutes and the land."
 spain_industry_gain_tt: "Industrial development rises."
 spain_agriculture_gain_tt: "Agricultural development rises."
 spain_infrastructure_gain_tt: "Infrastructure development rises."
 spain_education_gain_tt: "Educational development rises."
 spain_autonomy_gain_tt: "Regional autonomy rises."
 spain_autonomy_loss_tt: "Regional autonomy falls."
 spain_palace_intrigue_tt: "The officer corps resents appointments made at court."
 spain_juntas_tt: "The officers' committees have been recognised, and the army now negotiates as a body."
 spain_electoral_reform_tt: "An honest count would end the turno and put both dynastic parties at the mercy of the electorate."
 spain_constitutional_crisis_tt: "The chamber and the palace now claim the same authority."
 spain_labour_question_tt: "The labour question is open: conciliation or repression, and both are permanent."
 spain_army_question_open_tt: "The army question is open: pay, promotion and the African commands."
 spain_rif_unlock_tt: "The Rif campaign is open in its own decision category."
 spain_rif_settled_tt: "The protectorate is pacified and the Moroccan question is closed."
 spain_regional_question_tt: "The regional question is open: statute, suppression or a provincial police."
 spain_restoration_exhausted_tt: "The Restoration has no majority, no credit and no candidate for prime minister."
 spain_constitution_1929_tt: "The regime has written a constitution for itself and means to be ratified by it."
 spain_army_reform_tt: "The officer corps has been reorganised, and it knows who reorganised it."
 spain_africanists_retired_tt: "The Africanist commanders have been removed from the peninsula's commands."
 spain_constitution_1931_tt: "The Republic has a constitution: one chamber, secular schools and the right to autonomy."
 spain_constitution_1939_tt: "The Republic has settled its war powers, its statutes and the position of the parties that defended it."
 spain_republic_consolidated_tt: "The Republic has survived its civil war and now has to govern the country it won."
 spain_republic_against_the_army_tt: "The Republic was proclaimed against the army's judgment, and the officer corps will remember it."
 spain_catalan_statute_tt: "Catalonia has a statute, a parliament and a grievance about its finances."
 spain_basque_statute_tt: "The Basque provinces have a statute and a tax arrangement of their own."
 spain_army_plot_tt: "The plot is no longer a rumour: the garrisons have been assigned and the date discussed."
 spain_rising_expected_tt: "The rising is expected, prepared and only waiting for its moment."
 spain_decisive_year_tt: "Spain has entered the decisive year of the Republic."
 spain_communist_question_tt: "The communists' place in the Republic is now a decision rather than a fact."
 spain_pce_in_government_tt: "The PCE holds ministries, and Soviet credit follows it."
 spain_pce_marginalised_tt: "The PCE has been pushed into opposition and Soviet aid has stopped."
 spain_anarchist_question_tt: "The collectives are legal or they are not, and the CNT will answer either way."
 spain_collectivised_land_tt: "The collectives keep the land and receive state credit."
 spain_smallholding_restored_tt: "The land returns to individual tenure and the CNT splits over it."
 spain_secular_state_tt: "The religious orders are gone from teaching and their property is not returned."
 spain_militia_army_tt: "The militia tradition is kept and the reserves are enlarged."
 spain_professional_army_tt: "The army is smaller, better paid and watched."
 spain_western_diplomacy_tt: "Britain and the United States now have a Spanish government they can talk to."
 spain_moscow_alignment_tt: "Moscow has a Spanish partner, and the Western powers have a problem."
 spain_iberian_accord_tt: "Portugal and Spain have agreed to consult before either of them is dragged into a war."
 spain_german_trade_tt: "German machine tools and coal arrive through the northern ports."
 spain_british_trade_tt: "British credit and coal arrive through the Atlantic ports."
 spain_willing_to_fight_tt: "The Republic has told the Allies it will fight when the moment comes."
 spain_reconstruction_notice_tt: "Reconstruction is now a standing programme in its own decision category."

 spain_court_party_tt: "§YThe Court Party§!: the Crown's own deputies sit in the Cortes, and every seat they hold is one the electorate did not choose."
 spain_legion_formed_tt: "§YThe Spanish Legion§!: a volunteer corps with its own officers, its own discipline and its own politics."
 spain_coup_prepared_tt: "§YPreparations for a Pronunciamiento§!: the Africanist officers are ready; the government's remaining months are numbered."
 spain_campaign.17.t: "The Tragic Week"
 spain_campaign.17.d: "Barcelona has spent a week in flames. The reservists embarked for Morocco, the unions called a general strike, and the churches burned before the army restored order. The government must decide whom to blame: the radicals who lit the fires, or the ministers who sent the reservists to die."
 spain_campaign.17.a: "The army has kept order."
 spain_campaign.17.b: "The ministers are to blame."
 spain_campaign.18.t: "The Assembly Movement"
 spain_campaign.18.d: "Deputies of both dynastic parties, Catalan and Basque representatives, professors and journalists have assembled in Madrid without royal summons. They demand a constituent Cortes and an end to government by decree. The King's government may receive them, or arrest them."
 spain_campaign.18.a: "Receive the assembly."
 spain_campaign.18.b: "Dissolve it and arrest the delegates."
 spain_campaign.19.t: "The General Strike of 1917"
 spain_campaign.19.d: "The UGT and the CNT have brought out the cities together, the first and last time they will agree on anything. The railways have stopped and the government has declared martial law. The strike can be broken with the army, or ended with a bargain."
 spain_campaign.19.a: "Break the strike."
 spain_campaign.19.b: "Negotiate with the committees."

 spain_air_force_rebuilt_tt: "§YThe Air Force Rebuilt§!: the Republic fields an air force again, though most of its aircraft were built for another war."
 spain_air_force_tt: "§YThe Air Force§!: aviation is recognised as a separate service with its own staff and budget."
 spain_army_and_party_tt: "§YThe Army and the Party§!: the settlement between the government and the officer corps is written down and enforced."
 spain_calvo_sotelo_tt: "§YThe Murder of Calvo Sotelo§!: the last obstacle to a military rising has been removed by a policeman's pistol."
 spain_carlist_militia_tt: "§YThe Requetes§!: Carlist volunteers drill in Navarre under their own officers and their own flag."
 spain_casas_viejas_tt: "§YCasas Viejas§!: the Republic's agrarian reform is discredited, and the peasants of the south have stopped waiting for it."
 spain_ceda_tt: "§YThe CEDA in Government§!: the Catholic right governs through the Republic while preparing to revise it."
 spain_choice_of_war_tt: "§YThe Choice of War§!: the government has decided how it will meet a rising, and who it will arm to do it."
 spain_exiles_returned_tt: "§YThe Exiles Return§!: the professional middle class returns, bringing skills the reconstruction could not buy."
 spain_falange_broken_tt: "§YThe Falange Broken§!: the movement survives in prison and in exile, without uniforms."
 spain_falange_tt: "§YThe Falange§!: a national-syndicalist movement with uniforms, salutes and a very small electorate."
 spain_garrisons_secured_tt: "§YGarrisons Secured§!: the key garrison commanders have declared for the government, for now."
 spain_gibraltar_claim_tt: "§YThe Gibraltar Claim§!: Spain raises the question of the Rock with the powers that now decide such questions."
 spain_king_isolated_tt: "§YThe King Isolated§!: Alfonso XIII has lost the politicians who could still defend the Crown."
 spain_monarchy_exiled_tt: "§YThe Monarchy in Exile§!: the Bourbons are abroad and the Republic decides how to treat them."
 spain_municipal_elections_tt: "§YMunicipal Elections§!: the results in the great cities will be read as a verdict on the monarchy itself."
 spain_officer_discontent_tt: "§YOfficer Discontent§!: the officer corps regards the dictatorship as an insult to the army rather than a government."
 spain_pact_of_san_sebastian_tt: "§YThe Pact of San Sebastian§!: the opposition has a common programme and a provisional government in waiting."
 spain_peseta_tt: "§YDefending the Peseta§!: the Bank of Spain spends its reserves to hold the exchange rate."
 spain_political_police_tt: "§YThe Political Police§!: a civil security service keeps the files, and the army does not."
 spain_postwar_settlement_tt: "§YThe 1945 Settlement§!: Spain's place in the postwar order has been defined, at least on paper."
 spain_reconstruction_complete_tt: "§YReconstruction Complete§!: the material damage of the civil war has been made good."
 spain_renovacion_tt: "§YRenovacion Espanola§!: the monarchist right organises around the exiled King."
 spain_republican_alliance_tt: "§YThe Republican Alliance§!: republicans, socialists and Catalan nationalists have agreed that the monarchy must go."
 spain_restoration_collapsing_tt: "§YThe Restoration Collapsing§!: the monarchy has lost the Cortes, the cities and the army in the same season."
 spain_rising_prepared_tt: "§YThe Rising Prepared§!: the conspiracy has a timetable, a director and a list of garrisons."
 spain_sanjurjo_plot_tt: "§YThe Sanjurjo Plot§!: the first military rising against the Republic has failed, and taught the army that risings are survivable."
 spain_seeking_foreign_aid_tt: "§YSeeking Foreign Aid§!: emissaries have been sent abroad to buy the weapons the Republic cannot build."
 spain_ume_tt: "§YThe Spanish Military Union§!: officers organise secretly against the Republic, bound by an oath to Spain."
 spain_un_founding_tt: "§YThe United Nations§!: the Republic has made its claim to a seat among the victors of the world war."
 spain_volunteer_debate_tt: "§YThe Volunteer Question§!: the Republic has taken a position on sending Spaniards to fight in someone else's war."
 spain_wolfram_trade_tt: "§YThe Wolfram Trade§!: both alliances are buying Galician tungsten, and neutrality has become profitable."
 spain_works_halt_tt: "§YThe Works Halt§!: the public works programme has stopped, and the unemployment it concealed is now visible."
 spain_electoral_machine_tt: "\u00a7YThe Electoral Machine\u00a7!: elections are managed from the Ministry of the Interior, and the Crown's patronage grows with every result."
 spain_elections_managed_tt: "\u00a7YElections Managed\u00a7!: the government writes the results, so alternation costs nothing and means nothing."
 spain_cacique_deputies_tt: "\u00a7YThe Cacique Deputies\u00a7!: every seat in the Cortes is held by a patron, and legislation is a negotiation between patrons."
 spain_turno_reformed_tt: "\u00a7YThe Turno\u00a7!: the two dynastic parties alternate by agreement, and the agreement is enforced by the governor of each province."
 spain_liberal_governments_tt: "\u00a7YLiberal Government\u00a7!: the Liberal party governs with a programme of gradual reform and a machine built to avoid implementing it."
 spain_conservative_governments_tt: "\u00a7YConservative Government\u00a7!: the Conservative party governs for order, property and the Church, and the army knows it has a friend."
 spain_crown_bound_tt: "\u00a7YThe Crown Bound\u00a7!: the King reigns through the Cortes, and the Crown's political role is now a matter of law rather than habit."
 spain_dynastic_marriage_tt: "\u00a7YA Dynastic Marriage\u00a7!: the dynasty is tied to a foreign royal house, and Spain gains a guarantor abroad and a grievance at home."
 spain_crown_settled_tt: "\u00a7YThe Crown Settled\u00a7!: the Crown's constitutional position is settled in writing."
 spain_cortes_settled_tt: "\u00a7YThe Cortes Settled\u00a7!: parliament has established what it is for, and the monarchy must live with the answer."
 spain_labour_conciliation_tt: "\u00a7YConciliation\u00a7!: the state bargains with the unions instead of breaking them, and the army regards this as surrender."
 spain_royal_guard_tt: "\u00a7YThe Royal Guard\u00a7!: household troops answer to the Crown alone, and no government can be dismissed without them."
 spain_civil_guard_tt: "\u00a7YThe Civil Guard Expanded\u00a7!: rural Spain is policed by a force that answers to the barracks and reports to no court."
 spain_labour_repression_tt: "\u00a7YRepression\u00a7!: the state has chosen the Civil Guard over the bargaining table, and the anarchists have chosen the bomb."
 spain_lockout_tt: "\u00a7YThe Barcelona Lockout\u00a7!: the employers close the mills and the pistoleros settle the dispute, and the city arms itself."
 spain_concordat_tt: "\u00a7YChurch and State\u00a7!: the Church keeps its schools and its property, and the state gains a moral authority it does not control."
 spain_orders_question_tt: "\u00a7YThe Religious Orders\u00a7!: a commission establishes what the orders own, and every figure it publishes becomes a political weapon."
 spain_public_health_tt: "\u00a7YPublic Health\u00a7!: dispensaries and inspectors reach the provinces, and the state begins to count its own people."
 spain_labour_settled_tt: "\u00a7YThe Labour Question Settled\u00a7!: the choice between conciliation and repression is made and cannot be unmade."
 spain_land_settlement_tt: "\u00a7YLand Settlement\u00a7!: tenants are placed on expropriated estates, and the countryside acquires a class with a stake in the state."
 spain_export_drive_tt: "\u00a7YAn Export Drive\u00a7!: wine and olive oil pay for the imports the industrial north cannot produce."
 spain_tariff_protection_tt: "\u00a7YTariff Protection\u00a7!: Spanish industry is sheltered from foreign competition, and Spanish consumers pay the difference."
 spain_industrial_capital_tt: "\u00a7YIndustrial Capital\u00a7!: domestic banks now finance domestic industry, and the country stops borrowing abroad to build its own factories."
 spain_telegraph_tt: "\u00a7YThe Telegraph Network\u00a7!: orders from Madrid reach the provinces in hours, and the state discovers how much it did not know."
 spain_economy_settled_tt: "\u00a7YThe Economy Settled\u00a7!: Spain ends the era with a budget, a railway and an industrial base rather than a colonial debt."
 spain_regions_settled_tt: "\u00a7YThe Regions Settled\u00a7!: the regional question has an answer, and both the nationalists and the generals have read it."
 spain_rif_offensive_tt: "\u00a7YThe Rif Offensive\u00a7!: columns advance into the mountains behind Melilla, and the army learns to win in Africa."
 spain_peninsular_reform_tt: "\u00a7YPeninsular Reform\u00a7!: the army is reorganised around Spain rather than Morocco, and the Africanists are told their war is over."
 spain_artillery_corps_tt: "\u00a7YAn Artillery Corps\u00a7!: the guns are grouped into regiments, and the army can support a battle instead of a patrol."
 spain_naval_programme_tt: "\u00a7YThe Naval Programme\u00a7!: two dockyards are laid down and the fleet acquires a plan it cannot yet afford."
 spain_moroccan_railway_tt: "\u00a7YRailways in the Protectorate\u00a7!: steel into the Rif carries supplies forward and garrisons inland."
 spain_army_settled_tt: "\u00a7YThe Army Settled\u00a7!: the officer corps has a doctrine and a budget, and a grievance it has learned to express in politics."
 spain_africanist_corps_tt: "\u00a7YThe Africanist Command\u00a7!: promotion now comes from Morocco, and the officers who win there will expect to govern at home."
 spain_strict_neutrality_tt: "\u00a7YStrict Neutrality\u00a7!: Spain will trade with both alliances and fight for neither."
 spain_wolfram_contracts_tt: "\u00a7YWolfram Contracts\u00a7!: both alliances are buying Galician tungsten, and neutrality has become a business."
 spain_red_cross_tt: "\u00a7YThe Red Cross\u00a7!: Spanish hospitals treat the wounded of both sides, and neutrality earns a reputation worth something in 1918."
 spain_tangier_tt: "\u00a7YThe Tangier Settlement\u00a7!: the international zone is reorganised and Spain's position in Morocco is recognised in writing."
 spain_iberian_accord_tt: "\u00a7YThe Iberian Accord\u00a7!: Lisbon and Madrid agree to consult, which is the most either will promise."
 spain_vatican_accord_tt: "\u00a7YThe Vatican Accord\u00a7!: Rome blesses the Crown, and the religious question is deferred rather than answered."
 spain_moroccan_conference_tt: "\u00a7YThe Moroccan Conference\u00a7!: the powers divide a country none of them owns, and Spain leaves with a larger zone and a longer border."
 spain_powers_settled_tt: "\u00a7YThe Powers Settled\u00a7!: Spain's place among the neutrals is established, and it will be worth exactly as much as the next war makes it worth."
