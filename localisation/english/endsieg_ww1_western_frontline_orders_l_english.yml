l_english:
 WW1_WF_field_programme_available_tt:0 "The Western Front is active and no other field programme is underway."
 WW1_WF_replacement_drafts:0 "Prepare Replacement Drafts"
 WW1_WF_replacement_drafts_desc:0 "The replacement depots must keep pace with losses at the front. Fresh drafts, properly equipped and drilled before joining their regiments, will help restore exhausted divisions."
 WW1_WF_replacement_drafts_idea:0 "Fresh Replacement Drafts"
 WW1_WF_replacement_drafts_idea_desc:0 "Trained replacements and new equipment are reaching the divisions at the front."
 WW1_WF_assault_training:0 "Train Assault Detachments"
 WW1_WF_assault_training_desc:0 "Selected infantrymen and pioneers will practise small-unit attacks against enemy strongpoints. Their experience can be passed on through the army's training schools."
 WW1_WF_assault_training_idea:0 "Assault Detachments"
 WW1_WF_assault_training_idea_desc:0 "Specially trained assault detachments are supporting the infantry in attacks on fortified positions."
 WW1_WF_siegfried_positions:0 "Prepare the Siegfriedstellung"
 WW1_WF_siegfried_positions_desc:0 "New defensive positions will give the army room to absorb an enemy offensive. Working parties and engineers will prepare deep dugouts, wire obstacles and supporting strongpoints."
 WW1_WF_siegfried_positions_idea:0 "Prepared Defensive Positions"
 WW1_WF_siegfried_positions_idea_desc:0 "Engineers and working parties have strengthened the army's defensive positions."
 WW1_WF_artillery_preparation:0 "Coordinate the Artillery Fire Plan"
 WW1_WF_artillery_preparation_desc:0 "Survey teams and artillery staffs will prepare a coordinated fire plan. Careful registration and a short, concentrated bombardment should give the infantry a better chance of reaching its objectives."
 WW1_WF_artillery_preparation_idea:0 "Coordinated Artillery Preparation"
 WW1_WF_artillery_preparation_idea_desc:0 "Artillery batteries are working to a common fire plan, with targets surveyed and supporting fire arranged in advance."
