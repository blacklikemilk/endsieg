l_english:
 IR1_anjoman_elections: "Anjoman Elections"
 IR1_anjoman_elections_desc: "The provincial associations draw their standing from local members who expect to be heard in Tehran. Hold elections for the anjomans so that the cabinet can claim a provincial mandate instead of relying on appointed officials."
 IR1_royal_household: "The Royal Household"
 IR1_royal_household_desc: "The court, its servants and the Qajar princes form a network of patronage that reaches into every ministry. Bring the household into the government's work and give the crown a stake in the cabinet's programme."
 IR1_press_and_debate: "Press and Debate"
 IR1_press_and_debate_desc: "Tehran's newspapers and the galleries of the Majlis have made public argument part of the business of government. Encourage an informed press and draw on its debates for practical proposals rather than silencing criticism."
 IR1_palace_guard: "The Palace Guard"
 IR1_palace_guard_desc: "The Cossack Brigade stands at the gate of the citadel, drilled by foreign officers and paid irregularly. Confirm its place as the crown's guard and give it a settled command and a clear duty in the capital."
 IR1_the_young_shah: "The Young Shah"
 IR1_the_young_shah_desc: "Ahmad Shah has reached his majority, and the authority of the regency passes to a sovereign who has never governed. The court and the Majlis both wait to learn whether he will rule with parliament or through his household."
 IR1_regency_council: "A Council of Regency"
 IR1_regency_council_desc: "Ministers and princes can share the burden of the crown through a formal council while the young shah learns the work of government. Such a body gives the court a defined place and the cabinet a continuous hand on affairs."
 IR1_diplomatic_corps: "A Diplomatic Corps"
 IR1_diplomatic_corps_desc: "Persian representation abroad is scattered among notables whose posts owe more to patronage than to training. Establish a service that can carry the government's case to the legations in Tehran and to the capitals of the powers."
 IR1_constitution_or_crown: "Constitution or Crown"
 IR1_constitution_or_crown_desc: "The question that has divided Persian politics since the revolution can no longer be deferred. The cabinet must settle whether the Majlis or the court will hold the decisive voice in the government of the country."
 IR1_defend_constitution: "Defend the Constitution"
 IR1_defend_constitution_desc: "Deputies and the provincial anjomans look to the cabinet to make parliamentary government real. Stand with the Majlis and give the constitutional order the authority it needs against the court and the pressure of the powers."
 IR1_royal_prerogative: "The Royal Prerogative"
 IR1_royal_prerogative_desc: "The crown can act without waiting on divided deputies, appointing and dismissing ministers at will. Affirm the shah's prerogative as the basis of government, accepting that the Majlis will resent every use of it."
 IR1_majlis_budget_authority: "The Budget and the Majlis"
 IR1_majlis_budget_authority_desc: "A parliament that cannot examine expenditure cannot hold a cabinet to account. Give the Majlis the right to review the budget and to vote on the taxes that are raised to fund it."
 IR1_court_and_cabinet: "Court and Cabinet"
 IR1_court_and_cabinet_desc: "Ministers taken from the household can govern with the crown's confidence and without the delays of parliamentary bargaining. Build a cabinet around the court's circle, knowing that its standing rests on the shah's favour."
 IR1_assembly_of_1918: "An Assembly in Wartime"
 IR1_assembly_of_1918_desc: "With foreign columns on the roads and parliament long interrupted, the cabinet needs a body that can authorize taxation and judge its conduct. Convene an assembly and let the deputies pass sentence on the government's wartime record."
 IR1_belgian_advisers: "Belgian Customs Advisers"
 IR1_belgian_advisers_desc: "Belgian officials already administer the customs houses and know where revenue escapes the treasury. Retain their service on terms the government can supervise and use their experience to train Persian officials to replace them."
 IR1_state_bank: "The Imperial Bank Question"
 IR1_state_bank_desc: "The Imperial Bank of Persia keeps the government's accounts, prints its notes and answers to a board in London. Rather than charter a rival in the middle of a war, reopen the terms of the concession: the state's own money should be held, and paid for, on Persian soil."
 IR1_telegraph_network: "The Telegraph Lines"
 IR1_telegraph_network_desc: "The telegraph carried the revolution's news between the cities and now carries the government's orders, but the lines run through country the cabinet cannot reach. Extend the network so that a province answers Tehran in days rather than weeks."
 IR1_agricultural_relief: "Relief for the Countryside"
 IR1_agricultural_relief_desc: "Villages that lose a harvest to requisition or drought have nothing to carry them to the next sowing. Send grain and seed to the provinces and repair the roads that bring them to market."
 IR1_abadan_concession: "The Abadan Concession"
 IR1_abadan_concession_desc: "The Anglo-Persian Oil Company refines at Abadan and ships from the Gulf, while the government's share of the profits remains small. Confirm the terms of the concession and press for a revenue the treasury can actually collect."
 IR1_oil_royalty_share: "Reopen the Royalty"
 IR1_oil_royalty_share_desc: "The company's accounts have never been open to Persian officials, and the royalty has been calculated on terms agreed under duress. Demand a new settlement of the oil revenue and a share the government can verify for itself."
 IR1_concession_guarantees: "Guarantees for the Concession"
 IR1_concession_guarantees_desc: "The company's installations depend on pipelines that cross tribal country and on a refinery the Royal Navy counts upon. Accept its request for protection and let British credit and equipment follow the agreement."
 IR1_road_to_the_caspian: "The Road to the Caspian"
 IR1_road_to_the_caspian_desc: "Goods from the Caspian ports must cross the Elburz to reach Tehran, and the road is impassable for much of the year. Lay a railway up the northern route, so that Gilan's trade and its grain can reach the capital."
 IR1_bushehr_trade: "Trade through Bushehr"
 IR1_bushehr_trade_desc: "Bushehr carries the southern trade, but its approaches are shallow, its roads poor and its merchants dependent on British shipping. Improve the port's communications so that the Gulf trade serves Persian buyers and not only foreign houses."
 IR1_gulf_ports: "Ports of the Gulf"
 IR1_gulf_ports_desc: "A country with a long coastline and no naval station cannot protect its shipping or collect its customs. Establish a station on the Gulf coast, at Bushehr while the port is in the government's hands, and give the cabinet a presence at sea that it can maintain with its own crews."
 IR1_the_great_famine: "The Hunger Years"
 IR1_the_great_famine_desc: "War, requisition and broken transport have left the towns short of bread and the countryside without seed. The government can take the shortage in hand and ration what there is, knowing that a country fed this way will feel the hunger in its workshops and its streets for years to come."
 IR1_grain_requisition: "Requisition the Harvest"
 IR1_grain_requisition_desc: "The army and the towns must be fed, and the grain is in the villages that grow it. Take the harvest under government control and accept that the countryside will remember the price it paid."
 IR1_public_granaries_1917: "Public Granaries"
 IR1_public_granaries_1917_desc: "A government that stores grain can sell it in the lean months and hold prices within reach of the poor. Build granaries and reserve stocks so that the towns depend on the state rather than on speculation."
 IR1_wartime_budget: "A Wartime Budget"
 IR1_wartime_budget_desc: "War has raised the cost of everything the government buys while its revenue has fallen away. Draw up a budget that keeps the ministries working and shelters ordinary households from the worst of the shortage."
 IR1_merchant_credit: "Credit for Merchants"
 IR1_merchant_credit_desc: "Persian merchants can move goods and finance trade if a bank will lend against their standing. Open credit to them at Anzali, where the Caspian trade is already theirs, and let domestic capital carry part of the country's development."
 IR1_tabriz_workshops: "Workshops in Tabriz"
 IR1_tabriz_workshops_desc: "Tabriz has craftsmen, capital and a trade route to the Caucasus, but its workshops work with worn tools. Support its manufacturers and give Azerbaijan a productive base away from the frontier."
 IR1_gendarmerie_recruitment: "Recruit the Gendarmerie"
 IR1_gendarmerie_recruitment_desc: "The gendarmerie needs men who know the roads they will patrol and officers who can keep them from becoming another tribal levy. Recruit in the provinces and give the force a settled establishment."
 IR1_cossack_pay: "Pay the Cossack Brigade"
 IR1_cossack_pay_desc: "The brigade has gone unpaid often enough to know its own worth to the government. Settle its arrears and provide for it regularly, so that its officers look to Tehran rather than to a foreign legation."
 IR1_tribal_levies: "Tribal Levies"
 IR1_tribal_levies_desc: "The tribes can put horsemen in the field faster than any ministry can raise a regiment, and their khans expect to be asked. Bring their levies into the government's service on terms that keep them under its orders."
 IR1_rifle_contracts: "Rifle Contracts"
 IR1_rifle_contracts_desc: "The arsenal can repair what the army has but cannot yet arm new battalions. Contract for rifles abroad and keep the workshops busy, so that the army never depends on a single supplier."
 IR1_national_gendarmerie: "A National Gendarmerie"
 IR1_national_gendarmerie_desc: "Separate provincial forces enforce the government's will unevenly and answer to different patrons. Unite them in one gendarmerie under a single command that reports to the cabinet."
 IR1_azerbaijan_command: "The Azerbaijan Command"
 IR1_azerbaijan_command_desc: "The northwestern provinces face the Ottoman frontier and the Russian Caucasus, and every road leads through Tabriz. Establish a command there that can hold the passes and keep order in the province."
 IR1_south_persia_rifles: "The South Persia Rifles"
 IR1_south_persia_rifles_desc: "British officers have proposed a force to guard the southern roads and the oil installations. Accept their organization and their equipment, knowing that the force will answer to British officers as much as to Tehran."
 IR1_military_finance: "Military Finance"
 IR1_military_finance_desc: "An army cannot be paid, fed and equipped from a treasury that never knows its own income. Give the war ministry a proper budget so that its regiments are supplied before a campaign begins."
 IR1_air_detachment: "A Foreign Air Mission"
 IR1_air_detachment_desc: "Persia has neither machines nor pilots, but the war has shown how much an aircraft can see and carry where roads fail and telegraph lines are cut. Accept a foreign mission to instruct a handful of officers in the new arm, and let the government's first aviation section begin as a school rather than a squadron."
 IR1_army_of_the_constitution: "An Army of the Constitution"
 IR1_army_of_the_constitution_desc: "The gendarmerie and the provincial commands can become a national army that serves the Majlis rather than a household. Place the army under the constitution and give the cabinet a force for which it can answer."
 IR1_army_of_the_crown: "An Army of the Crown"
 IR1_army_of_the_crown_desc: "The shah's government can raise a force loyal to the person of the sovereign and to its own officers. Build the army around the crown's authority, so that orders travel from the palace without parliamentary delay."
 IR1_reserve_service: "Reserve Service"
 IR1_reserve_service_desc: "A standing army is too small to defend the country and too expensive to enlarge. Establish a reserve that can be called up in a crisis and returns to its villages when the danger passes."
 IR1_gulf_flotilla: "A Gulf Flotilla"
 IR1_gulf_flotilla_desc: "Persia has customs houses along the coast and no vessels to patrol the water between them. Build a dockyard on the Gulf coast and lay down the first hulls, so that the customs service has ships of its own and does not depend on a foreign squadron."
 IR1_wartime_mobilization: "Wartime Mobilization"
 IR1_wartime_mobilization_desc: "The war has reached Persia's frontiers, and the government must decide how far to call up its men. Mobilize the reserve and the gendarmerie without committing the country to a campaign it cannot sustain."
 IR1_gendarmerie_resistance: "The Gendarmerie Stands"
 IR1_gendarmerie_resistance_desc: "Gendarme detachments hold the roads and the frontier posts that any foreign column must cross. Support them so that the government's authority persists where its army cannot march."
 IR1_officer_loyalty: "Officers and the Government"
 IR1_officer_loyalty_desc: "Officers trained by foreign instructors and patronized by provincial families must be bound to the cabinet that pays them. Confirm their commissions and promotions in the government's own name."
 IR1_british_loan: "A British Loan"
 IR1_british_loan_desc: "The treasury needs money before the harvest and the banks will not lend to a government at war. Accept British credit for equipment and accept the scrutiny that comes with it."
 IR1_russian_understanding: "An Understanding with Russia"
 IR1_russian_understanding_desc: "The northern provinces border the Russian Caucasus, and Russian consuls have long claimed a voice in their affairs. Reach an understanding that settles the routine business of the frontier without conceding the government's authority there."
 IR1_ottoman_frontier: "The Ottoman Frontier"
 IR1_ottoman_frontier_desc: "The Ottoman Empire is at war and its frontier with Persia runs through mountains neither government controls. Reach an agreement with Constantinople on the policing of the border, or it will be settled by whoever marches across it first."
 IR1_niedermayer_expedition: "The Niedermayer Mission"
 IR1_niedermayer_expedition_desc: "A German mission has crossed the country claiming to carry the Kaiser's friendship and arms for those who resist the Entente. Decide how far the government will receive it, knowing that Britain and Russia will count every rifle."
 IR1_neutrality_declaration: "Declare Neutrality"
 IR1_neutrality_declaration_desc: "Persia has proclaimed her neutrality, and the proclamation must be made good at the frontiers. Send the same note to every belligerent, so that any violation of Persian ground is plainly a breach of it."
 IR1_south_persia_oil: "Oil in the South"
 IR1_south_persia_oil_desc: "The company's wells in Khuzestan are the country's largest source of revenue and its largest foreign interest. Let British capital build its works on Persian soil, so that the crude is refined where it is lifted and the government's share of the trade can be counted."
 IR1_tribal_frontier_pact: "A Frontier Pact"
 IR1_tribal_frontier_pact_desc: "The tribes along the western frontier can close the roads or open them, and their khans have dealt with Ottoman officers before. Reach an agreement that keeps the frontier quiet and their horsemen available to the government."
 IR1_refugee_administration: "Refugees and the Provinces"
 IR1_refugee_administration_desc: "Families have left the frontier districts and the towns must absorb them. Organize relief and registration so that the displaced are fed and the government knows who is living in its provinces."
 IR1_foreign_advisers: "Foreign Advisers"
 IR1_foreign_advisers_desc: "Belgians run the customs, Swedes command the gendarmerie and Russians instruct the Cossacks. Take a foreign military mission into the war ministry's service and let it train the officers who will one day take the work into Persian hands."
 IR1_jangali_movement: "The Jangali Movement"
 IR1_jangali_movement_desc: "In Gilan, Mirza Kuchak Khan's Jangalis have taken up arms against foreign troops and against the government that tolerates them. Decide whether to treat the movement as rebellion or as a provincial force with a claim on the cabinet."
 IR1_tabriz_consulates: "Consulates in the North"
 IR1_tabriz_consulates_desc: "The provinces of the northwest and the Persian communities across the Caucasus need representatives who can settle ordinary business. Establish consulates that answer to Tehran rather than to a foreign ministry's goodwill."
 IR1_hague_appeal: "Appeal to the Hague"
 IR1_hague_appeal_desc: "Persia has no seat among the powers that will settle the war, but the Hague conventions give small states a forum. Present the government's case there and let the record of foreign violations stand on its own."
 IR1_armistice_watch: "The Armistice"
 IR1_armistice_watch_desc: "The fighting in Europe has stopped, and the powers will soon turn to drawing up the settlement. Watch the armistice terms closely, for what is decided now will determine whether Persia is heard at the peace or divided without being asked."
 IR1_persia_at_the_conference: "Persia at the Conference"
 IR1_persia_at_the_conference_desc: "A Persian delegation must reach Paris with a case the victors cannot dismiss. Send envoys to the peace conference to claim the country's independence and its standing among the sovereign states."
 iran_diplomatic_corps_tt: "A permanent diplomatic service will represent the government at the foreign legations and in the capitals of the powers."
 iran_constitution_or_crown_tt: "The government must settle whether the Majlis or the crown holds the decisive voice."
 iran_court_cabinet_tt: "Ministers drawn from the court will govern on the crown's confidence."
 iran_shuster_mission_tt: "A financial mission working with the Majlis will bring revenue under the government's supervision."
 iran_hague_appeal_tt: "Persia's case will be laid before the Hague conventions and entered in the record of the powers."
 iran_royalty_share_tt: "The oil royalty will be reopened for negotiation with the company."
 iran_campaign.17.t: "The Shah Comes of Age"
 iran_campaign.17.d: "Ahmad Shah has reached his majority and the regency that governed in his name has ended. The court expects the young sovereign to rely on his household, while the Majlis expects him to open parliament and let his ministers answer to the deputies. The choice will shape the government for years to come."
 iran_campaign.17.a: "Let the shah govern with the Majlis."
 iran_campaign.17.b: "Let the shah govern with his court."
 iran_campaign.18.t: "The Assembly Convenes"
 iran_campaign.18.d: "Deputies have gathered in Tehran for the first time in years, and the government's wartime conduct is laid before them. The assembly can endorse the cabinet and give its measures a legal footing, or it can be managed from the palace and kept to ceremony. Ministers must decide how far they will submit to it."
 iran_campaign.18.a: "Submit the government's record to the assembly."
 iran_campaign.18.b: "Keep the assembly under the court's direction."
 iran_campaign.19.t: "The Call to the Colours"
 iran_campaign.19.d: "War on every frontier has forced the question of mobilization. The reserve and the gendarmerie can be called up to hold the roads and the northern passes, though every man under arms is a man taken from the harvest. The cabinet may also keep the garrisons at home and trust to distance and diplomacy."
 iran_campaign.19.a: "Call up the reserve and the gendarmerie."
 iran_campaign.19.b: "Keep the garrisons at home."
 iran_campaign.27.t: "Persia Declares Her Neutrality"
 iran_campaign.27.d: "The government has proclaimed Persia's neutrality and sent the same note to every belligerent. Britain and Russia hold the northern and southern roads and will ask for passage, while the Ottomans press on the western frontier. Neutrality must now be defended or quietly set aside."
 iran_campaign.27.a: "Hold to strict neutrality."
 iran_campaign.27.b: "Permit the powers their transit."
 iran_campaign.28.t: "The Armistice in Europe"
 iran_campaign.28.d: "The armistice in Europe has ended the fighting that reached Persia's borders. The government can press its claims at once, before the peace is settled among the victors, or it can wait and trust that the powers remember what they promised while they needed Persian roads. Either course has its price at home."
 iran_campaign.28.a: "Press Persia's claims at once."
 iran_campaign.28.b: "Wait upon the powers' settlement."
 iran_campaign.29.t: "Persia at Paris"
 iran_campaign.29.d: "The peace conference has opened in Paris, and the victors will redraw the map without Persia in the room. A delegation can petition the conference for recognition of Persian independence and the withdrawal of foreign forces, or the government can refuse to appear before a body that never invited it."
 iran_campaign.29.a: "Send a delegation to petition the conference."
 iran_campaign.29.b: "Refuse to appear before the conference."
 iran_ww1_gulf_naval_station_tt: "A naval station is surveyed on the Gulf coast, where the customs service can keep its few vessels"
 iran_ww1_gulf_dockyard_tt: "A dockyard is laid out on the Gulf coast, where hulls can be repaired and new ones built"
 iran_ww1_foreign_military_mission_tt: "A foreign military mission enters the war ministry's service, training the officers who will command the army"
 iran_ww1_settlement_tt: "The settlement strengthens the Majlis where the government has already committed itself to the constitution, and the crown where it has not"
 iran_ww1_famine_tt: "The shortage grips the country: the supply emergency holds back industry and public order until granaries or a relief programme break it"
 iran_ww1_harvest_tt: "Grain is bought and brought in before the sowing, and the wartime shortage of the towns eases"
 iran_ww1_conference_tt: "The delegation's standing at Paris strengthens the cabinet's authority and the country's independence of the powers"
 iran_ww1_relief_programme_tt: "The government has taken charge of the country's relief"
