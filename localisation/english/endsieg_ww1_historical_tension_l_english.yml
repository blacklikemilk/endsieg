 WW1_tension_three_year_law:0 "France Extends Military Service"
 WW1_tension_fleet_expansion:0 "Further Expansion of the German Fleet"
 WW1_tension_liman_mission:0 "German Military Mission at Constantinople"
 ww1_historical_tension.1.t:0 "Germany Expands Its Naval Programme"
 ww1_historical_tension.1.d:0 "Berlin has approved a further programme to strengthen the High Seas Fleet. German ministers defend the expenditure as a necessary protection for overseas trade and the empire's standing among the great powers. In Britain, the decision renews concern over the balance in the North Sea and the cost of keeping a commanding lead."
 ww1_historical_tension.1.a:0 "The naval rivalry continues."
 ww1_historical_tension.2.t:0 "German Officers at Constantinople"
 ww1_historical_tension.2.d:0 "A German military mission has taken up the work of reorganising the Ottoman army. Russia has protested against the influence this gives Berlin in the defence of Constantinople, close to the passage between the Black Sea and the Mediterranean. The Ottoman government insists that it has sought instructors, not surrendered its sovereignty, while diplomats search for an arrangement that will quiet the dispute."
 ww1_historical_tension.2.a:0 "The Straits remain a sensitive question."
