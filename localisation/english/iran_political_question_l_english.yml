l_english:
 iran_political_question:0 "The Political Question"
 iran_political_question_desc:0 "Who rules Persia, now that the old certainties are gone?"
 iran_political_question_qajar:0 "Recall the Qajar Line"
 iran_political_question_qajar_desc:0 "Bring back the dynasty the Pahlavis displaced. The tribes will listen; the army may not."
 iran_political_question_republic:0 "Proclaim the Republic"
 iran_political_question_republic_desc:0 "The monarchy has failed the country twice over. Abolish it before it fails again."
 iran_political_question_constitution:0 "Bind the Crown to the Majlis"
 iran_political_question_constitution_desc:0 "Keep the Shah, but make his ministers answerable to the chamber."
 iran_political_question_socialist:0 "Invite the Tudeh"
 iran_political_question_socialist_desc:0 "The workers of the oil towns and the railway depots have organised. Let them in."
 iran_political_question_nationalist:0 "A Government of Nationalists"
 iran_political_question_nationalist_desc:0 "Neither the court nor the left: a cabinet of officers, technocrats and oil nationalists."
