l_english:
 qing_interwar: "The Chinese Republic That Was Not"
 qing_politics_navigation: "Court and Government"
 qing_economy_navigation: "Treasury and Industry"
 qing_army_navigation: "The Army"
 qing_diplomacy_navigation: "Foreign Affairs"
 qing_provinces_navigation: "The Provinces"
 QW2_settlement_government: "The Settlement Government"
 QW2_settlement_government_desc: "The revolution is a decade old and the settlement has become the ordinary constitution of the state. Its institutions are now the arena for every later fight."
 QW2_constitutional_trunk: "The Constitutional Government"
 QW2_constitutional_trunk_desc: "The chamber sits, the cabinet answers to it and the crown keeps its reserved powers. Governing means managing three institutions that each believe they are sovereign."
 QW2_constitutional_elections: "The Second Election"
 QW2_constitutional_elections_desc: "The chamber must face the electorate again. The result will decide whether the settlement has produced a party system or merely a court with a debating society attached."
 QW2_constitutional_parties: "Party Organisation"
 QW2_constitutional_parties_desc: "Parties with offices, newspapers and provincial committees are the machinery of constitutional politics. Build them and the chamber stops being a collection of notables."
 QW2_constitutional_cabinet: "Cabinet Government"
 QW2_constitutional_cabinet_desc: "A cabinet that can survive a hostile chamber is the settlement's success. One that cannot is a crisis waiting for a budget."
 QW2_constitutional_crisis: "The Constitutional Crisis"
 QW2_constitutional_crisis_desc: "The chamber has refused the war budget and the crown has threatened to dissolve it. The constitution does not say clearly which of them wins, and both sides know it."
 QW2_constitutional_capstone: "A Working Constitution"
 QW2_constitutional_capstone_desc: "The settlement has survived an election, a budget crisis and a royal veto. The dynasty governs through institutions it cannot abolish without losing the country."
 QW2_authoritarian_trunk: "The Court Government"
 QW2_authoritarian_trunk_desc: "The court governs through the Grand Council, the governors it appoints and the army it pays. Efficiency is real, and so is the absence of anyone who can legally say no."
 QW2_authoritarian_provinces: "Direct Rule"
 QW2_authoritarian_provinces_desc: "Replace the self-governing provinces with prefects appointed from Beijing. The centre gains control and loses the local knowledge that made the provinces governable."
 QW2_authoritarian_censorate: "The Reformed Censorate"
 QW2_authoritarian_censorate_desc: "Censors with the power to impeach a governor are the court's answer to provincial autonomy. Use them and the empire is governed by reports from men who owe their careers to the throne."
 QW2_authoritarian_schools: "Schools for the Service"
 QW2_authoritarian_schools_desc: "A modern civil service needs schools that teach law, accounting and engineering rather than the classics. Build them and the court gains a bureaucracy that can read a budget."
 QW2_authoritarian_opposition: "The Opposition Question"
 QW2_authoritarian_opposition_desc: "There are men in the provinces who oppose the court and are not rebels. Leave them alone and they organise. Arrest them and they become martyrs with better newspapers."
 QW2_authoritarian_capstone: "The Court Ascendant"
 QW2_authoritarian_capstone_desc: "The court has outlasted the assemblies, the parties and the newspapers. It governs a quiet country, and quiet is the only measure of success it recognises."
 QW2_yuan_trunk: "The Beiyang Government"
 QW2_yuan_trunk_desc: "Yuan Shikai's officers run the ministries and the provinces. The throne is safe as long as the army is paid and the army is paid as long as the throne does what it is told."
 QW2_yuan_army_state: "The Army and the State"
 QW2_yuan_army_state_desc: "The war ministry writes the budget, the officers fill the governorships and the civil service is a pension scheme for retired colonels. Make the arrangement coherent and it becomes a government."
 QW2_yuan_finance: "The Military Budget"
 QW2_yuan_finance_desc: "A budget written by the men who spend it is not a budget. Yuan's government can make it work because the army enforces the collection. That is also why it cannot survive a defeat."
 QW2_yuan_succession_crisis: "The Succession Crisis"
 QW2_yuan_succession_crisis_desc: "Yuan is dying, or rumoured to be, and the Beiyang commanders are already counting divisions. Settle the succession before the officers settle it themselves."
 QW2_yuan_capstone: "A Military Monarchy"
 QW2_yuan_capstone_desc: "The army has become the state and the state has become the army's estate. It can hold China together, and it has no answer to what happens when the officer corps disagrees."
 QW2_federal_trunk: "The Union Government"
 QW2_federal_trunk_desc: "Beijing coordinates, the provinces govern and the compact is the constitution. It works when the centre is patient and fails whenever it needs something urgently."
 QW2_federal_provinces: "The Provincial Chamber"
 QW2_federal_provinces_desc: "A chamber of provincial delegations gives the compact a permanent forum and the provinces a way to bargain without threatening secession every time."
 QW2_federal_taxation: "The Quota System"
 QW2_federal_taxation_desc: "The provinces pay a fixed quota and keep the rest. The centre gains predictability and loses every argument about the size of the quota."
 QW2_federal_armies: "The Regional Armies"
 QW2_federal_armies_desc: "The provinces field their own divisions and the centre has no authority to move them. A federal army has to be built out of what the provinces will lend."
 QW2_federal_compromise: "The Compromise of the Provinces"
 QW2_federal_compromise_desc: "The compact has held through a famine, a border incident and two changes of governor. That is more than any constitution has managed since 1911."
 QW2_federal_capstone: "A Federal China"
 QW2_federal_capstone_desc: "The provinces have agreed to a common army, a common tariff and a common foreign policy. The dynasty chairs a union that could, in time, become a nation."
 QW2_industrial_takeoff: "Industrial Take-Off"
 QW2_industrial_takeoff_desc: "The war left China with new mills, new ports and a generation of managers. The peace can either continue that work or let it rust."
 QW2_cotton_mills: "Cotton and Silk"
 QW2_cotton_mills_desc: "Textiles are the first industry every modern economy builds. Shanghai and Hankou can supply the mills if the railways can move the crop."
 QW2_coal_and_steel: "Coal and Steel"
 QW2_coal_and_steel_desc: "Coal in Shanxi, iron in Hubei and a market of four hundred million people. A steel industry is the difference between a country that buys weapons and one that makes them."
 QW2_railway_expansion: "The Trunk Lines"
 QW2_railway_expansion_desc: "The north-south and east-west trunks decide where industry can grow. Complete them and the interior stops being a different country."
 QW2_shanghai_port: "The Shanghai Port"
 QW2_shanghai_port_desc: "Shanghai is the empire's window on the world and the foreign powers' window on China. Modernise the port and the customs revenue rises with the traffic."
 QW2_education_drive: "The Education Drive"
 QW2_education_drive_desc: "Universities produce engineers, teachers, lawyers and agitators. A government that wants the first three has to tolerate the fourth."
 QW2_public_health: "Public Health"
 QW2_public_health_desc: "Epidemics kill more Chinese than wars. A public health service is cheap, popular and one of the few reforms the provinces will pay for."
 QW2_land_reform: "Tenancy and Rent"
 QW2_land_reform_desc: "Most Chinese peasants rent the land they work. Reducing rents wins the countryside and loses the gentry, and the dynasty has always chosen the gentry."
 QW2_state_bank: "The State Bank"
 QW2_state_bank_desc: "A central bank that holds the reserves, issues the notes and lends to the treasury would give the government a monetary policy instead of a monthly crisis."
 QW2_heavy_industry: "The Heavy Industry Plan"
 QW2_heavy_industry_desc: "Steel, machinery, chemicals and arms are the industries a war needs. Build them in the interior where the coast cannot be shelled and the plan becomes a strategy."
 QW2_economy_capstone: "A Modern Economy"
 QW2_economy_capstone_desc: "China has banks, railways, steel and a budget that can be read. It is not a rich country. It is, for the first time, a country that could become one."
 QW2_army_establishment: "The Army Establishment"
 QW2_army_establishment_desc: "The army is the largest institution the state pays for. Decide what it is for and every later budget follows from that decision."
 QW2_army_air_force: "A Chinese Air Force"
 QW2_army_air_force_desc: "Aircraft are expensive, fragile and the one arm that can reach an enemy without a railway. Build a small air force and the army gains eyes."
 QW2_army_navy: "The Chinese Navy"
 QW2_army_navy_desc: "The navy was sunk in 1895 and has never recovered. A coastal defence force is affordable, useful against Japan and a permanent argument with the treasury."
 QW2_army_doctrine: "A National Doctrine"
 QW2_army_doctrine_desc: "A doctrine written for Chinese conditions rather than copied from Germany or Japan is the difference between an army that can fight and one that can only parade."
 QW2_army_academies: "The Staff Academies"
 QW2_army_academies_desc: "Staff officers who can plan a campaign and a logistics service that can supply one are the two things the army has never had at the same time."
 QW2_army_arsenals: "The Arsenals"
 QW2_army_arsenals_desc: "Rifles, machine guns, field artillery and ammunition. An army that cannot replace its losses in a long war is a peacetime army."
 QW2_army_fortifications: "The Northern Fortifications"
 QW2_army_fortifications_desc: "The Great Wall is a line on a map. Concrete, railways and supply depots north of Beijing are a defence."
 QW2_army_capstone: "An Army That Can Fight"
 QW2_army_capstone_desc: "The army has a doctrine, a staff, arsenals and a plan for the north. Whether it can use them depends on who is in government when the war comes."
 QW2_versailles_revision: "Revising Versailles"
 QW2_versailles_revision_desc: "The settlement of 1919 gave Shandong to Japan and left the concessions intact. A decade of diplomacy can revise it, one power at a time."
 QW2_washington_system: "The Washington System"
 QW2_washington_system_desc: "The naval treaties and the Nine-Power Treaty gave China a paper guarantee. Paper is worth something if the powers believe the Chinese government can hold its own country."
 QW2_soviet_relations: "The Soviet Border"
 QW2_soviet_relations_desc: "Moscow supports the Nationalists, claims influence in Mongolia and keeps an army in the Far East. A border understanding buys time and legitimises a government the Soviets distrust."
 QW2_japanese_pressure_ii: "The Japanese Pressure"
 QW2_japanese_pressure_ii_desc: "Japan wants the north, the railways and a government in Beijing that signs what it is given. Every year of peace is a year of preparation for the demand that cannot be signed."
 QW2_german_advisers_ii: "The German Advisers Return"
 QW2_german_advisers_ii_desc: "German officers who lost a war in Europe are willing to teach China how to win one in Asia. The mission is small, useful and politically expensive."
 QW2_concessions_return: "The Return of the Concessions"
 QW2_concessions_return_desc: "The concessions can be bought back, negotiated back or taken back. Only the first two are compatible with a country that needs foreign credit."
 QW2_league_seat: "A Seat at the League"
 QW2_league_seat_desc: "A permanent seat on the League Council would make China a subject of international politics rather than its object. It requires the powers to agree that the dynasty is permanent."
 QW2_provincial_administration: "Provincial Administration"
 QW2_provincial_administration_desc: "Every province has a governor, a garrison, an assembly and a budget. Make the four work together and the province becomes governable."
 QW2_warlord_amnesty: "The Warlord Amnesty"
 QW2_warlord_amnesty_desc: "The commanders who fought in 1911 are now governors with armies. An amnesty that confirms them in their posts buys peace and ratifies the fragmentation."
 QW2_provincial_army_law: "Provincial Army Law"
 QW2_provincial_army_law_desc: "A law that says how large a provincial army may be is either the beginning of central control or a list of numbers everyone ignores."
 QW2_southern_integration: "The Southern Provinces"
 QW2_southern_integration_desc: "Guangdong and Guangxi have been governed by their own commanders since the revolution. Integrating them is the last unfinished business of 1911."
 QW2_manchurian_defence: "The Manchurian Defence"
 QW2_manchurian_defence_desc: "The Japanese railway zone runs through the richest province in China. A defence plan for Manchuria is a plan for the war that everyone expects."
 QW2_manchurian_industry: "Manchurian Industry"
 QW2_manchurian_industry_desc: "Coal, iron and railways make Manchuria the most valuable province in the empire. Develop it and Japan's interest becomes an appetite."
 QW2_manchurian_crisis_prep: "The Northern Crisis"
 QW2_manchurian_crisis_prep_desc: "The Kwantung Army has been rehearsing a solution to the Manchurian question for years. Prepare the provinces, the railways and the world's opinion."
 QW2_kmt_question: "The Nationalist Question"
 QW2_kmt_question_desc: "The Nationalists have a programme, an army and a claim to represent the nation. They can be treated as rebels, as rivals or as a party."
 QW2_northern_expedition: "The Northern Expedition"
 QW2_northern_expedition_desc: "If the Nationalists march north, the dynasty must decide whether to fight them, buy them or join them. Each choice changes what China is by 1936."
 QW2_civil_service: "A Modern Civil Service"
 QW2_civil_service_desc: "A bureaucracy recruited by examination and paid enough not to steal is the cheapest reform available. It is also the one the court can block most easily."
 QW2_press_law: "A Press Law"
 QW2_press_law_desc: "Newspapers can be licensed, censored or left alone. Each choice produces a different kind of politics and a different kind of scandal."
 QW2_local_government: "Local Government"
 QW2_local_government_desc: "County councils, magistrates and school boards are where most Chinese meet the state. Reform them and the settlement reaches beyond the capital."
 QW2_irrigation: "Irrigation and Water Control"
 QW2_irrigation_desc: "Floods kill more people than wars. Dikes, canals and a water conservancy board are the least political investment a Chinese government can make."
 QW2_road_programme: "The Road Programme"
 QW2_road_programme_desc: "China has railways between its cities and mud between its villages. Motor roads and lorry transport connect the countryside to the market for the first time."
 QW2_telegraph_ii: "The National Telegraph"
 QW2_telegraph_ii_desc: "A national telegraph network is a nervous system for the state. Extend it to the county level and Beijing can hear about a famine before it becomes a rebellion."
 QW2_tariff_policy: "Tariff Policy"
 QW2_tariff_policy_desc: "Tariffs protect Chinese industry and raise the price of everything the poor buy. The choice between the two is the first real economic argument of the republic."
 QW2_army_manpower: "Conscription and Reserves"
 QW2_army_manpower_desc: "A modern army needs a reserve and a reserve needs a census. Register the manpower and the country gains a million trained men and a great deal of paperwork."
 QW2_army_armour: "Armoured Cars and Tanks"
 QW2_army_armour_desc: "China has no tank industry and no oil. A small armoured force is still useful against an enemy who has neither."
 QW2_army_air_academy: "An Air Academy"
 QW2_army_air_academy_desc: "Pilots take years to train and aircraft take months to buy. Start both now and China will have an air force when the war comes."
 QW2_foreign_loans_ii: "The Second Round of Loans"
 QW2_foreign_loans_ii_desc: "The powers will lend again if the customs revenue is pledged and the government looks stable. The money builds railways that the lenders will eventually want to control."
 QW2_cultural_mission: "A Cultural Mission"
 QW2_cultural_mission_desc: "Students abroad, professors at home and a national library are soft power in the most literal sense. They also produce the people who will criticise the dynasty."
 QW2_yunnan: "The Yunnan Question"
 QW2_yunnan_desc: "Yunnan is governed by a commander who has never obeyed Beijing and never rebelled. Leave him alone and the province stays quiet. Integrate it and the quiet ends."
 QW2_tibet: "The Tibetan Settlement"
 QW2_tibet_desc: "Tibet has been outside effective Chinese administration since 1911. A settlement that recognises its internal autonomy and its Chinese suzerainty is the only one available."
 QW2_xinjiang: "The Xinjiang Frontier"
 QW2_xinjiang_desc: "Xinjiang is a military district with a border, a treaty with Moscow and no Chinese administration worth the name. Regularise it before the Soviets do."
 QW2_famine_1930: "The Famine of 1930"
 QW2_famine_1930_desc: "Drought and war have produced a famine across the northwest. Relief is expensive and visible, and the government's reputation will be decided by it."
 QW2_flood_relief: "The Yangtze Floods"
 QW2_flood_relief_desc: "The great river floods every few years and every government since the Han has been judged on its response. Build the dykes and the relief service."
 QW2_constitutional_press: "A Free Press"
 QW2_constitutional_press_desc: "A constitutional government that censors its newspapers is a contradiction the opposition will use every week. Let the press alone and the settlement gains a public."
 QW2_constitutional_judiciary: "A Constitutional Court"
 QW2_constitutional_judiciary_desc: "Someone has to decide whether a law is constitutional. A court with that power is the settlement's last line of defence and the crown's last grievance."
 QW2_authoritarian_prefects: "Prefects from Beijing"
 QW2_authoritarian_prefects_desc: "Replace the governors with prefects who answer to the ministry of the interior. The centre gains control and loses every governor who knew his province."
 QW2_authoritarian_court_schools: "Schools of the Court"
 QW2_authoritarian_court_schools_desc: "Schools that teach loyalty alongside literacy produce officials who will not question the throne. They also produce officials who cannot run a modern ministry."
 QW2_yuan_officers: "The Officers' Compact"
 QW2_yuan_officers_desc: "The officers will accept the throne if the throne accepts their pay, their pensions and their promotions. Write it down and it becomes the real constitution."
 QW2_yuan_education: "Military Education"
 QW2_yuan_education_desc: "Staff officers educated in the new academies are loyal to the army as an institution rather than to a commander. That is either the army's future or its next coup."
 QW2_federal_bank: "A Provincial Bank"
 QW2_federal_bank_desc: "A bank capitalised by the provinces can lend to the union without the union controlling it. It is the federal idea in financial form."
 QW2_federal_police: "A Federal Police"
 QW2_federal_police_desc: "The provinces keep their own police and the union has none. A small federal force with a narrow mandate can investigate customs fraud and little else, which is exactly what the provinces will accept."
 QW2_chapter_end: "The Long Peace Ends"
 QW2_chapter_end_desc: "The settlement has survived a decade and a half, a world depression and a Japanese invasion of the north. The next war will not be fought by the state that 1912 created."
 qing_restoration_band_tt: "The restoration programme opens on a consolidated state: [?qing_consolidation|0] of 100 against a bar of 60, held without a lapse for a year. Court, reform, army, provinces and public works each carry a fifth of the score."
 QW2_restoration_programme: "The Restoration Programme"
 QW2_restoration_programme_desc: "The settlement of 1912 was an armistice written as a constitution. Twenty years on, the dynasty governs a country that has accepted it, and the court means to stop ruling as a provisional arrangement. Each family of the state is to be settled in turn, and the crown's place written into the peace rather than left to the next crisis."
 QW2_restoration_court: "The Crown's Prerogative"
 QW2_restoration_court_desc: "The powers the throne gave up in 1911 and took back in practice are to be defined in law. Ministers will argue over the wording for a year; the point is that afterwards the court's authority rests on a text and not on the army's patience."
 QW2_restoration_reform: "The Restored Code"
 QW2_restoration_reform_desc: "The reform edicts of the last twenty years are a heap of rescripts. Codify them: one civil code, one commercial code, one set of courts that applies both, and a ministry that can say what the law is."
 QW2_restoration_army: "The Imperial Guard"
 QW2_restoration_army_desc: "The New Army was built to defend the dynasty and has spent twenty years deciding whether to. A guard sworn to the crown, paid from the palace and officered by men whose careers end with the monarchy, gives the court one corps it does not have to ask for."
 QW2_restoration_provinces: "The Provincial Settlement"
 QW2_restoration_provinces_desc: "The provinces will accept a restored monarchy if it is cheaper than the alternative. Fix the provincial contribution, confirm the assemblies in their local work, and let the governors keep the dignity they have already taken."
 QW2_restoration_treasury: "The Palace Treasury"
 QW2_restoration_treasury_desc: "The household and the state have shared a purse since the regency, and every minister has used the confusion. Separate them: a civil list for the court, a budget for the government, and an audit that publishes both."
 QW2_restoration_nobility: "The Return of the Nobility"
 QW2_restoration_nobility_desc: "The princes and the banner families went quiet after 1911 and kept their estates. Bring them back into the court's service with titles and duties, and the dynasty gains a class that has nowhere else to go."
 QW2_restoration_code: "The New Code"
 QW2_restoration_code_desc: "A code is only real when the men who apply it have been taught it. Reopen the law faculty, print the code in the vernacular, and staff the courts with examiners rather than with the relatives of magistrates."
 QW2_restoration_guard: "The Imperial Officer Corps"
 QW2_restoration_guard_desc: "Officers commissioned by the crown, promoted by examination and pensioned by the palace are the difference between an army that obeys and an army that negotiates. The Beiyang commanders will call it a shadow army, which is what it is."
 QW2_restoration_gentry: "The Gentry Compact"
 QW2_restoration_gentry_desc: "The county gentry collect the land tax, run the schools and settle most disputes before the magistrate hears of them. Give them the offices and the honours, and the restoration reaches the countryside without a single soldier."
 QW2_restoration_constitution: "The Imperial Constitution"
 QW2_restoration_constitution_desc: "The settlement charter was written by a provisional assembly to bind a defeated court. A constitution granted by the crown with the chamber's consent replaces it, and the difference between those two documents is the whole politics of the decade."
 QW2_restoration_succession: "The Law of Succession"
 QW2_restoration_succession_desc: "The dynasty has one emperor, no heir named and a court that remembers what happened the last time the question was left open. A succession law settled in public removes the army's favourite argument."
 QW2_restoration_legation: "The Legations Recognise the Throne"
 QW2_restoration_legation_desc: "The powers have dealt with the Qing for twenty years while telling each other it would not last. A court with a code, a treasury and an heir is a government they can lend to, and a government they lend to is one they no longer plan to replace."
 QW2_restoration_proclaimed: "The Restoration Proclaimed"
 QW2_restoration_proclaimed_desc: "The edicts are sealed, the code is in force, the succession is settled and the legations have sent their congratulations. The monarchy is no longer a provisional arrangement that survived the revolution; it is the constitution of China, and the war that is coming will be fought by a restored state."
 qing_interwar_reward_constitutional_trunk: "The chamber gains standing at court. The assembly side of the Balance of Power strengthens and the reform programme advances."
 qing_interwar_reward_federal_trunk: "The compact is signed in the provinces as well as the capital. The assembly gains ground in the Balance of Power, provincial trust grows and the standing of the throne rises with it."
 qing_interwar_reward_industrial_takeoff: "The mills, ports and managers of the war years are put to peaceful work. The reform programme leaps forward, at a cost to public order."
 qing_interwar_reward_cotton_mills: "Chinese cloth now uniforms the New Army. The mills deliver a stock of infantry equipment and the reform programme advances."
 qing_interwar_reward_provincial_administration: "Governor, garrison, assembly and budget answer to one office. The assembly gains ground in the Balance of Power, provincial trust grows sharply and the standing of the throne rises."
 qing_interwar_reward_civil_service: "Examinations replace patronage in the ministries. The court gains ground in the Balance of Power and the reform programme advances."
 qing_interwar_reward_local_government: "County councils, magistrates and school boards are brought into the settlement. Provincial trust grows and the assembly gains ground in the Balance of Power."
 qing_interwar_reward_road_programme: "Lorries reach the villages and the army can move by road. The reform programme advances and the country braces for war."
 qing_interwar_reward_tariff_policy: "The tariff is fought through the chamber and the government gains political capital from the fight, at a cost to public order."
 qing_interwar_reward_versailles_revision: "One power at a time, the settlement of 1919 is revisited. The government gains political capital from the victory and the country is steadier for it."
 qing_interwar_reward_authoritarian_prefects: "Prefects of the interior ministry replace the governors. The throne's standing rises and the reform programme advances, at the price of provincial trust."
 qing_interwar_reward_education_drive: "Universities turn out engineers, teachers and lawyers. A new research slot opens, the reform programme advances and the provinces see the state pay for their sons."
 qing_interwar_reward_public_health: "Clinics, quarantine stations and a health service the provinces help to pay for. Public order improves, the throne's standing rises and provincial trust grows."
 qing_interwar_reward_army_air_force: "A small air arm gives the army eyes over the north. Air experience is gained, the reform programme advances and the officer corps is bound closer to the state."
 qing_interwar_reward_army_armour: "Armoured cars and a handful of tanks for the plains. Army experience is gained, the officer corps is bound closer to the state and the country's confidence in the coming war rises."
 qing_interwar_reward_restoration_army: "A guard sworn to the crown and paid from the palace. The officer corps is bound to the state, army experience is gained and the throne's standing rises."
 qing_interwar_reward_japanese_pressure_ii: "Every year of Japanese pressure is a year of preparation. The country braces for war, the officer corps is bound closer to the state and the throne's standing rises."
 qing_interwar_reward_cultural_mission: "Students abroad, professors at home and a national library. A new research slot opens and the reform programme advances, at a cost to public order, because the people it educates will criticise the dynasty."
 qing_interwar_reward_tibet: "A settlement that recognises Tibetan autonomy under Chinese suzerainty. The throne's standing rises, public order improves and the provinces see the centre bargain rather than conquer."
 qing_interwar_reward_restoration_court: "The crown's prerogative is defined in law rather than left to the army's patience. The government gains political capital, the throne's standing rises sharply and the court gains ground in the Balance of Power."
 qing_interwar_reward_settlement_government: "The settlement becomes the ordinary constitution of the state. The government gains political capital and the throne's standing rises."
 qing_interwar_reward_army_establishment: "The army is defined by what the state expects of it. Army experience is gained and the officer corps is bound closer to the state."
 qing_interwar_reward_restoration_guard: "Officers commissioned, promoted and pensioned by the crown. The officer corps is bound to the state, army experience is gained and a stock of infantry equipment follows the new commissions."
 qing_interwar_reward_restoration_treasury: "A civil list for the court and a budget for the government. The government gains political capital, a stock of infantry equipment is bought from the audit's savings and the country is steadier."
 qing_interwar_reward_restoration_legation: "The powers deal with a court that has a code, a treasury and an heir. The government gains political capital, the throne's standing rises, the country braces for war and a stock of infantry equipment arrives with the recognition."
