l_english:
 ww1_early_settlements.1.t:0 "The Rising Is Suppressed"
 ww1_early_settlements.1.d:0 "The republican rising in Ireland has been defeated. Government forces have restored control over the occupied districts, and the surviving insurgents have laid down their arms. British administration is being re-established.\n\nThe immediate challenge to our authority has ended, but the question of Ireland's future remains before the government."
 ww1_early_settlements.1.a:0 "Restore order."
