l_english:
 # iran_ww2 reward tooltips and the chapter decisions (common/decisions/iran_focus_ww2_b.txt).
 iran_budget_delivered_tt: "Bread has been distributed, or the budget year of 1938 has begun."
 iran_concession_ledger_tt: "If this is the second concession Iran signs, it is entered in the public accounts and the Majlis is told."
 iran_blocs_tt: "Iran plays the patrons against each other: the power it leans on gains standing in Tehran and the other loses ground, and with the two evenly matched the government keeps its hands free."
 iran_oil_debate_tt: "The chamber argues from the outcome it was given: the northern province and the party question decide where its votes fall."
 iran_final_settlement_tt: "The terms are written from the northern outcome and the party question: a province restored by force hardens them, a province negotiated softens them, and the Tudeh is answered in kind."
 iran_pahlavi_consolidated_tt: "The Pahlavi state is consolidated: army, administration and construction answer to one programme, and the monarchy no longer governs against the country."
 iran_enduring_settled_tt: "The route is settled for good: where the government has the authority to carry it, the state spirit of this regime is consolidated, and the institutions it built outlast the war that made them."
 iran_technical_college: "Technical college"
 iran_f3b_labour_congress: "A Congress of Workers' Delegates"
 iran_f3b_labour_congress_desc: "The syndicates of Isfahan, Tabriz and the Tehran workshops have been illegal since 1931 and organised regardless. A congress of their delegates, held under the government's tolerance, turns a scattered labour movement into a political force the parties must reckon with. The left will grow; the cabinet will not be thanked."
 iran_f3b_wartime_cabinet: "Convene the Wartime Cabinet"
 iran_f3b_wartime_cabinet_desc: "The emergency cabinet of 1941 was appointed to last the war and has governed since without meeting as a body. Calling its ministers together settles who answers for what: a cabinet that took the crown's free hand rules by decree, and one that kept itself answerable to the Majlis must carry the chamber with it."
