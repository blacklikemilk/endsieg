l_english:
 ww1_brest.1.t:0 "An Armistice at Brest-Litovsk"
 ww1_brest.1.d:0 "Our delegates have agreed to an armistice with the Central Powers at Brest-Litovsk. The armies are to hold their positions while the delegates negotiate. German troops still occupy Russian territory, and Berlin has yet to say what it will demand in exchange for peace."
 ww1_brest.1.a:0 "Send our delegates back to the table."
 ww1_brest.2.t:0 "Neither War nor Peace"
 ww1_brest.2.d:0 "The German delegation insists that Russia give up its western territories. Trotsky proposes to leave Brest-Litovsk without signing, declare the war over on our side and order the army to demobilise. He hopes German workers will oppose a renewed offensive. If Berlin calls his bluff, our soldiers will have to hold the front while we seek another agreement."
 ww1_brest.2.a:0 "End the war on our side and leave the treaty unsigned."
 ww1_brest.2.b:0 "Ask Berlin to submit its final terms."
 ww1_brest.3.t:0 "Operation Faustschlag"
 ww1_brest.3.d:0 "Trotsky has left Brest-Litovsk without a treaty. Berlin has given notice that the armistice is over, and the Supreme Army Command has ordered the eastern armies to resume their advance. The Russian government must now decide whether it can afford to keep the delegates away from the table."
 ww1_brest.3.a:0 "Order the eastern armies to advance."
 ww1_brest.4.t:0 "Trotsky Walks Out at Brest-Litovsk"
 ww1_brest.4.d:0 "The Russian delegation has withdrawn from the peace talks. Trotsky has declared the war at an end on Russia's side and announced the demobilisation of its armies, while refusing to sign away the territory demanded by the Central Powers. Berlin has yet to accept his declaration."
 ww1_brest.4.a:0 "Neither war nor peace."
 RUS_ww1_brest_demobilising_army:0 "Demobilising Army"
 RUS_ww1_brest_demobilising_army_desc:0 "The order to demobilise has reached the front, but no peace treaty has been signed. As soldiers leave their units and return home, the formations still in the line struggle to hold their positions."
 ww1_brest.5.t:0 "The Terms We Take to Brest"
 ww1_brest.5.d:0 "Berlin must decide what its delegates will demand. The Supreme Army Command wants Crimea and a government in Kiev that will answer to Berlin. Others argue that recognition of an independent Ukraine and leaving Crimea with Russia may bring a quicker signature. The rest of the eastern settlement, including German protection for Transcaucasia, would stand under either proposal."
 ww1_brest.5.a:0 "Insist on the full terms."
 ww1_brest.5.b:0 "Offer terms that Russia can sign."
 ww1_brest.full_terms_tt:0 "§YIf Russia signs:§! Germany takes Russian-held Crimea and establishes German protectorates in Poland and Ukraine where the treaty can be applied."
 ww1_brest.limited_terms_tt:0 "§YIf Russia signs:§! Russia keeps any territory it owns in Crimea, and Germany recognizes Ukraine as independent."
 ww1_brest.limited_russian_terms:0 "Berlin has withdrawn its claim to our part of Crimea and agreed to recognize an independent Ukraine. We would still relinquish much of the western borderlands and accept German protection over Transcaucasia. The delegates await our authority to sign."
 ww1_brest.refuse_terms:0 "Reject the treaty and keep fighting."
 ww1_brest.6.t:0 "Russia Refuses the Treaty"
 ww1_brest.6.d:0 "The Russian delegation has refused to sign. Our eastern armies will have to hold their positions while Berlin decides whether to reopen negotiations."
 ww1_brest.6.a:0 "The war in the east continues."
 ww1_brest.limited_news:0 "Russia and the Central Powers have signed a separate peace at Brest-Litovsk. Russia relinquishes much of its western borderlands. Berlin agreed to recognise Ukrainian independence and dropped its demand for Russian-held Crimea to secure the agreement."
 TRC_ww1_seim:0 "Transcaucasian Seim"
 TRC_ww1_seim_short:0 "Seim"
