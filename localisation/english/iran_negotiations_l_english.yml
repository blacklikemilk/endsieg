l_english:
 # ---------------------------------------------------------------- demands: the northern railway
 iran_n.1.t: "The Railway Convention"
 iran_n.1.d: "A note from the northern legation has sat on the cabinet table for a week. It asks for the right to run a railway from the Caspian to the frontier, a share of the Caspian carrying trade, and a subsidy for the Cossack Brigade that garrisons the capital. None of it is a surprise. All of it outlives the government that answers it."
 iran_n.1.a: "Concede the convention, and take the subsidy."
 iran_n.1.b: "Submit it to the Majlis and let the deputies answer."
 iran_n.1.c: "Sign it by royal decree."
 iran_n.1.e: "Refuse the note."
 iran_n.1.f: "Charter a Persian company with a Russian minority of shareholders."
 iran_n.1.g: "Ask for four months."
 iran_n.1.h: "Take the British loan instead."
 iran_n.2.t: "The Chamber Answers"
 iran_n.2.d: "The deputies have the convention in front of them, and every one of them knows what happened to the last chamber that said no. They also know that a treaty the Court signs alone is a treaty the country does not owe."
 iran_n.2.a: "The chamber ratifies the convention."
 iran_n.2.b: "The chamber refuses it."
 iran_n.3.t: "The Convention Returns"
 iran_n.3.d: "The refusal was filed and forgotten, by us. The legation has come back with the same convention, a shorter deadline and a note that the Brigade has not been paid this quarter."
 iran_n.3.a: "Sign it, on their terms now."
 iran_n.3.b: "Refuse again, and let them do what they can."

 # ---------------------------------------------------------------- demands: the Gulf and the telegraph
 iran_n.4.t: "The Gulf and the Telegraph"
 iran_n.4.d: "The British legation wants a coaling station and a naval anchorage in the Gulf, a garrison at Bushire to protect the telegraph, and the telegraph concessions renewed in perpetuity. The Gulf is the one coast where no foreign consulate has yet planted a flag. The note is courteous, detailed, and does not contemplate an answer other than yes."
 iran_n.4.a: "Grant the facilities and the garrison."
 iran_n.4.b: "Submit it to the Majlis and let the deputies answer."
 iran_n.4.c: "Sign it by royal decree."
 iran_n.4.e: "Refuse the note."
 iran_n.4.f: "Grant the facilities, and keep the customs in Persian hands."
 iran_n.4.g: "Ask for four months."
 iran_n.4.h: "Offer the Gulf to German engineers instead."
 iran_n.5.t: "The Chamber and the Gulf"
 iran_n.5.d: "The Gulf note is read aloud twice: once by the government, once by the deputy for Bushire. The chamber understands that a coaling station is not a harbour and that a telegraph post is not a garrison, and that both arrive with soldiers."
 iran_n.5.a: "The chamber ratifies the note."
 iran_n.5.b: "The chamber refuses it."
 iran_n.6.t: "A Naval Demonstration at Bushire"
 iran_n.6.d: "Two sloops have anchored off Bushire and a landing party has been put ashore to protect the telegraph station, which nobody has threatened. The legation regrets the necessity, and repeats the request, which it now calls an arrangement."
 iran_n.6.a: "Accept the arrangement, on their terms now."
 iran_n.6.b: "Refuse, and protest to every legation in Tehran."

 # ---------------------------------------------------------------- demands: the Caspian fisheries
 iran_n.7.t: "The Caspian Fisheries"
 iran_n.7.d: "The Soviet mission proposes a fisheries concession on the Caspian and a trade treaty for Gilan, and in exchange offers what no other power has offered: recognition of this government as the government of Iran. The fisheries are the poorest province of the revenue and the richest argument the left has ever had."
 iran_n.7.a: "Concede the fisheries, and take the recognition."
 iran_n.7.b: "Submit it to the Majlis and let the deputies answer."
 iran_n.7.c: "Sign it by royal decree."
 iran_n.7.e: "Refuse the note."
 iran_n.7.f: "Propose a joint fisheries company instead."
 iran_n.7.g: "Ask for four months."
 iran_n.7.h: "Ask London for a loan instead."
 iran_n.8.t: "The Chamber and the Fisheries"
 iran_n.8.d: "Recognition is worth something to every deputy in the room, and the fisheries are worth something to every voter on the coast. The chamber is asked to weigh one against the other, which is the work it was elected to do and has rarely been allowed to."
 iran_n.8.a: "The chamber ratifies the treaty."
 iran_n.8.b: "The chamber refuses it."
 iran_n.9.t: "The Fisheries Question Returns"
 iran_n.9.d: "The mission has returned with a shorter treaty, a longer list of what it calls traditional fishing grounds, and the observation that the Caspian is not a lake Iran can patrol alone."
 iran_n.9.a: "Sign it, on their terms now."
 iran_n.9.b: "Refuse again."

 # ---------------------------------------------------------------- demands: the German economic offer
 iran_n.10.t: "The German Economic Offer"
 iran_n.10.d: "The German delegation has no frontier to defend and no concession to demand, which is exactly why the offer is dangerous: a commercial treaty, machine tools on credit, a research institute, and a clause that binds Iranian trade to one market for five years. It is generous in the way that a rope is generous."
 iran_n.10.a: "Sign the commercial treaty."
 iran_n.10.b: "Submit it to the Majlis and let the deputies answer."
 iran_n.10.c: "Sign it by royal decree."
 iran_n.10.e: "Refuse the offer."
 iran_n.10.f: "Take the advisers, and refuse the treaty."
 iran_n.10.g: "Ask for four months."
 iran_n.10.h: "Tell the British legation what has been offered."
 iran_n.11.t: "The Chamber and the German Treaty"
 iran_n.11.d: "The deputies are asked to ratify a treaty with a power that has never occupied a Persian province, and to do it while the British minister watches from the gallery. Some of them think this is prudence. Others think it is the first payment on a debt nobody has read."
 iran_n.11.a: "The chamber ratifies the treaty."
 iran_n.11.b: "The chamber refuses it."

 # ---------------------------------------------------------------- what each answer costs
 iran_demand_russian_railway_concede_tt: "Iran concedes to the northern patron: the railway convention, a share of the Caspian carrying trade and the Brigade subsidy, in exchange for goodwill that will be spent before it is banked."
 iran_demand_russian_railway_compromise_tt: "Iran charters the line itself, with a Russian minority of shareholders: a smaller concession, a board seated in Tehran, and the railway still built."
 iran_demand_russian_railway_reject_tt: "Iran refuses: the concession is reclaimed, the legation is affronted, and the demand is closed."
 iran_demand_russian_railway_support_tt: "Iran takes the British loan instead: money and equipment now, a rival patron's protection, and a northern legation that will remember the choice."
 iran_demand_russian_railway_escalation_accept_tt: "Iran signs the convention on the patron's terms, a full tier heavier than the one already refused."
 iran_demand_british_gulf_concede_tt: "Iran concedes to Britain: the Gulf anchorage, the Bushire garrison and the telegraph, for as long as the treaty runs."
 iran_demand_british_gulf_compromise_tt: "Iran concedes the anchorage and keeps the customs service, which is the part of the Gulf that pays for itself."
 iran_demand_british_gulf_reject_tt: "Iran refuses: the facilities are reclaimed, the legation is affronted, and the demand is closed."
 iran_demand_british_gulf_support_tt: "Iran invites German engineers into the Gulf instead: a rival presence, a British humiliation, and a patron that will be told about it in Berlin."
 iran_demand_british_gulf_escalation_accept_tt: "Iran accepts the arrangement under the guns of two sloops, on terms one tier worse than those refused."
 iran_demand_soviet_caspian_concede_tt: "Iran concedes the Caspian fisheries and the Gilan trade route, and receives recognition that no other power has extended."
 iran_demand_soviet_caspian_compromise_tt: "Iran proposes a joint fisheries company: half the catch, Persian inspectors on every boat, and a treaty that recognises both governments."
 iran_demand_soviet_caspian_reject_tt: "Iran refuses: the fisheries are reclaimed, the mission is affronted, and the demand is closed."
 iran_demand_soviet_caspian_support_tt: "Iran takes the British loan and the British position instead: equipment now, and a northern neighbour that will not forget which legation it was."
 iran_demand_soviet_caspian_escalation_accept_tt: "Iran signs the fisheries treaty on the mission's terms, a full tier heavier than the one already refused."
 iran_demand_german_pact_concede_tt: "Iran signs the German commercial treaty: a research institute, machine tools on credit, and Iranian trade bound to one market."
 iran_demand_german_pact_compromise_tt: "Iran takes the German advisers and leaves the treaty on the table: the machinery without the clause."
 iran_demand_german_pact_reject_tt: "Iran refuses the offer: the delegation withdraws its engineers, and the trade stays in British and northern hands."
 iran_demand_german_pact_support_tt: "Iran tells the British legation what Berlin has offered, and takes the British counter-offer instead."

 # ---------------------------------------------------------------- renegotiation decisions
 iran_renegotiate_russian_railway: "Reopen the Railway Convention"
 iran_renegotiate_russian_railway_desc: "The convention has run its three years and the line is built. Reopening it means buying back the shares, the Brigade subsidy and the northern influence that came with them - and telling Petersburg, or Moscow, that the terms were a lease and not a title."
 iran_renegotiate_british_gulf: "Reopen the Gulf Arrangement"
 iran_renegotiate_british_gulf_desc: "The anchorage, the garrison and the telegraph are up for review. London will treat a review as a breach unless the chamber carries it, and the fleet in the Gulf is a better argument than any we have."
 iran_renegotiate_soviet_caspian: "Reopen the Fisheries Treaty"
 iran_renegotiate_soviet_caspian_desc: "Recognition was bought with the fisheries, and the fisheries are worth more now. Reopening the treaty costs the goodwill of the only power that recognised this government before it was fashionable to."
 iran_renegotiate_german_pact: "Reopen the German Commercial Treaty"
 iran_renegotiate_german_pact_desc: "The treaty binds Iranian trade to one market and the war has made that market a liability. The institute and the machine tools will be lost with it; the freedom to sell elsewhere will not."
 iran_renegotiate_anglo_persian: "Repudiate the Anglo-Persian Agreement"
 iran_renegotiate_anglo_persian_desc: "The agreement of 1919 was never ratified by a chamber that could sit. Six years on, the country that signed it no longer exists and the legation that drafted it still holds the customs, the officers and the telegraph."
 iran_renegotiate_abadan_deal: "Reopen the Abadan Terms"
 iran_renegotiate_abadan_deal_desc: "The company's terms were signed in 1933 with a government that needed the money. Reopening them buys a better royalty, a larger share of the field, and a British minister who will explain the consequences of ingratitude."
