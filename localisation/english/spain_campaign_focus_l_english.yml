l_english:
 # Spanish campaign - focus names and descriptions, 1910-1945.
 # Chapters: Restoration (SPR1), Dictatorship (SPR2), Republic (SPR3), Republican post-war (SPR4).
 # Text is written as world description, not as patch notes.

 # ---------------- shortcuts
 spain_politics_navigation: "Politics"
 spain_crown_navigation: "The Crown"
 spain_economy_navigation: "Economy"
 spain_army_navigation: "Army"
 spain_diplomacy_navigation: "Diplomacy"

 # ================================================================ Restoration, 1910-1923
 SPR1_the_restoration_state: "The Restoration State"
 SPR1_the_restoration_state_desc: "The settlement of 1876 still governs Spain: two dynastic parties take turns in office, the Crown arbitrates between them, and the Cortes ratifies the result. Beneath it the country is poorer than Italy and angrier than either party admits."
 SPR1_caciquismo: "Caciquismo"
 SPR1_caciquismo_desc: "The local boss delivers the district. In exchange the state looks away from his debts, his labourers and his courts. Government by favour is cheap, and it turns every reform into a personal obligation."
 SPR1_royal_prerogative: "The Royal Prerogative"
 SPR1_royal_prerogative_desc: "Alfonso XIII will not be a figurehead. He appoints and dismisses ministers, reads the dispatches, and treats the army as an instrument of the Crown. Each exercise of that right costs the monarchy a little of its legitimacy."
 SPR1_crown_government: "Government by the Crown"
 SPR1_crown_government_desc: "Ministers serve at the palace's pleasure and the Cortes is consulted afterwards. Decisions come faster, and nothing is shared."
 SPR1_palace_camarilla: "The Palace Camarilla"
 SPR1_palace_camarilla_desc: "Courtiers, confessors and generals settle policy in the antechamber. Officers who are passed over remember it for the rest of their careers."
 SPR1_turno_politics: "The Turno"
 SPR1_turno_politics_desc: "The party out of office prepares its turn by manufacturing the result in advance. The system has kept the peace for thirty years by making elections meaningless."
 SPR1_electoral_reform: "Electoral Reform"
 SPR1_electoral_reform_desc: "An honest count would end the turno and force both parties to organise real constituencies. The men who profit from the old count sit in the chamber that must pass it."
 SPR1_parliamentary_sovereignty: "Parliamentary Sovereignty"
 SPR1_parliamentary_sovereignty_desc: "The Crown reigns and the Cortes governs. It is the demand of the reformist opposition and the private nightmare of the palace."
 SPR1_constitutional_crisis: "Constitutional Crisis"
 SPR1_constitutional_crisis_desc: "When the chamber and the palace claim the same authority, every institution in the state has to choose a side."
 SPR1_labour_question: "The Labour Question"
 SPR1_labour_question_desc: "Barcelona's textile workers and the Andalusian braceros have discovered the general strike. The state can arbitrate or it can shoot, and both answers change the country."
 SPR1_conciliate_the_cnt: "Conciliate the CNT"
 SPR1_conciliate_the_cnt_desc: "Recognition and arbitration in exchange for order. The employers call it surrender; the anarchists call it a trap."
 SPR1_repress_the_cnt: "Repress the CNT"
 SPR1_repress_the_cnt_desc: "The Civil Guard, the courts and the pistoleros. It restores order in the short term and recruits for the men it arrests in the long one."
 SPR1_church_and_state: "The Church and the State"
 SPR1_church_and_state_desc: "The Concordat of 1851 makes the Church a department of state. Teaching, marriage and poor relief all pass through the parish."
 SPR1_state_budget: "The State Budget"
 SPR1_state_budget_desc: "Spain taxes less than any comparable European state and borrows to cover the difference. Reform begins with the ledger."
 SPR1_tax_reform: "Tax Reform"
 SPR1_tax_reform_desc: "A progressive income tax and state monopolies on water, gas and transport. The Basque and Catalan industrialists will finance the state that protects them, or they will not."
 SPR1_railway_gauge: "The Railway Gauge"
 SPR1_railway_gauge_desc: "Spanish track is wider than French track, so every wagon at the border is unloaded by hand. Unifying the gauge is expensive, and it decides where Spanish freight can go."
 SPR1_hydraulic_works: "Hydraulic Works"
 SPR1_hydraulic_works_desc: "The Ebro and the Guadalquivir flood and then fail. Canals, reservoirs and irrigation turn the dry half of Spain into farmland."
 SPR1_basque_steel: "Basque Steel"
 SPR1_basque_steel_desc: "Bilbao's iron reaches the sea at Portugalete. Altos Hornos and the shipping lines make Vizcaya the industrial core of the country."
 SPR1_catalan_textiles: "Catalan Textiles"
 SPR1_catalan_textiles_desc: "Terrassa, Sabadell and Barcelona spin, weave and dye for the whole peninsula. The mills also produce the most organised working class in Spain."
 SPR1_public_education: "Public Education"
 SPR1_public_education_desc: "Half of Spain cannot read. The Institución Libre de Enseñanza has shown what a secular school can do; the state has never been willing to pay for one."
 SPR1_industrial_capital: "Industrial Capital"
 SPR1_industrial_capital_desc: "With Basque iron and Catalan mills behind one tariff, Spanish industry can finally supply Spanish demand."
 SPR1_the_army_question: "The Army Question"
 SPR1_the_army_question_desc: "Spain keeps more officers than France on half the budget. Promotion by seniority protects the mediocre and blocks the men who fought in Africa."
 SPR1_juntas_de_defensa: "The Juntas de Defensa"
 SPR1_juntas_de_defensa_desc: "Officers' syndicates demanding pay, promotion by merit and an end to favouritism. They are a grievance committee and a political weapon at the same time."
 SPR1_africanist_command: "The Africanist Command"
 SPR1_africanist_command_desc: "The officers who serve in Morocco form a caste with its own loyalties, its own promotions and its own view of what Spain should be."
 SPR1_annual_disaster: "The Disaster of Annual"
 SPR1_annual_disaster_desc: "Silvestre advanced past the agreed line into the Rif and lost an army in a week. Ten thousand dead, and a country demanding to know who gave the order."
 SPR1_rif_settlement: "The Rif Settlement"
 SPR1_rif_settlement_desc: "Pacification by column, by subsidy or by withdrawal. Each choice settles Morocco and unsettles the army."
 SPR1_naval_programme: "The Naval Programme"
 SPR1_naval_programme_desc: "The 1908 programme promised a fleet Spain could not pay for. Dockyards and slipways are where any serious navy begins."
 SPR1_neutrality_in_europe: "Neutrality in Europe"
 SPR1_neutrality_in_europe_desc: "Spain has no alliance, no border with the Central Powers and no interest in the Balkans. That is a policy, not an accident."
 SPR1_german_overtures: "German Overtures"
 SPR1_german_overtures_desc: "Berlin offers coal, machine tools and instruction. The price is Spanish ore, Spanish shipping and a government that does not ask about Morocco."
 SPR1_allied_overtures: "Allied Overtures"
 SPR1_allied_overtures_desc: "London and Paris want Spanish ore kept out of German hands and Spanish waters free of submarines. They pay in coal and credit."
 SPR1_tangier_settlement: "The Tangier Settlement"
 SPR1_tangier_settlement_desc: "The international zone at the mouth of the strait is the hinge of the western Mediterranean. Spain wants the police, the port and the customs."
 SPR1_iberian_accord: "The Iberian Accord"
 SPR1_iberian_accord_desc: "Madrid and Lisbon share a peninsula, a coastline and a fear of the same great powers. A pact costs little and closes the western approaches to everyone else."
 SPR1_the_regional_question: "The Regional Question"
 SPR1_the_regional_question_desc: "Catalonia, the Basque provinces and Galicia have their own languages, taxes and elites. The state can negotiate a statute or appoint a governor."
 SPR1_mancomunitat: "The Mancomunitat"
 SPR1_mancomunitat_desc: "Prat de la Riba's commonwealth joins the four Catalan provinces for roads, schools and welfare. It is administrative autonomy, and everyone understands what it could become."
 SPR1_suppress_the_mancomunitat: "Suppress the Mancomunitat"
 SPR1_suppress_the_mancomunitat_desc: "Dissolve the commonwealth, close its schools and govern Catalonia from Madrid. Order is restored, and the grievance is handed to the next generation."
 SPR1_the_year_of_crisis: "The Year of Crisis"
 SPR1_the_year_of_crisis_desc: "Anarchist bombs, a collapsing cabinet, a colonial army in revolt and a king who has run out of ministers. The Restoration has no card left to play."

 # ================================================================ Dictatorship, 1923-1930
 SPR2_the_pronunciamiento: "The Pronunciamiento"
 SPR2_the_pronunciamiento_desc: "Primo de Rivera issues his manifesto from Barcelona and the garrisons join him. The government in Madrid dissolves without a shot being fired."
 SPR2_suspend_the_constitution: "Suspend the Constitution"
 SPR2_suspend_the_constitution_desc: "Martial law, a censored press and a dissolved Cortes. The Directory governs by decree and calls it a temporary necessity."
 SPR2_civil_governors: "Civil Governors"
 SPR2_civil_governors_desc: "Soldiers replace provincial governors, then are replaced by soldiers who understand printers and tax collectors."
 SPR2_rule_by_decree: "Rule by Decree"
 SPR2_rule_by_decree_desc: "No chamber, no budget vote and no opposition with a platform. It is fast, and it has no way of being corrected."
 SPR2_the_patronage_machine: "The Patronage Machine"
 SPR2_the_patronage_machine_desc: "The Unión Patriótica was built to give the regime a base. It gives it jobs for the faithful instead."
 SPR2_unione_patriotica: "The Unión Patriótica"
 SPR2_unione_patriotica_desc: "A party of officials, mayors and men who want a career. It fills the gap the old parties left, and it convinces almost nobody."
 SPR2_the_assembly: "The Consultative Assembly"
 SPR2_the_assembly_desc: "A chamber nominated by the regime to draft a constitution. It debates well and answers to the man who appointed it."
 SPR2_constitution_of_1929: "The Constitution of 1929"
 SPR2_constitution_of_1929_desc: "A corporative chamber, a strong executive and a referendum. The regime tries to convert itself into a system before it runs out of time."
 SPR2_labour_corporatism: "Labour Corporatism"
 SPR2_labour_corporatism_desc: "Committees of employers and workers under state chairmanship. Strikes are illegal, wages are negotiated, and the CNT is driven underground."
 SPR2_syndicate_network: "The Syndicate Network"
 SPR2_syndicate_network_desc: "State unions with compulsory membership and state arbitration. They deliver productivity and they destroy the independent labour movement."
 SPR2_concordat: "The Concordat"
 SPR2_concordat_desc: "The Church receives schools, subsidies and a monopoly on marriage. In return it blesses a regime that dissolved the constitution."
 SPR2_education_programme: "The Education Programme"
 SPR2_education_programme_desc: "New schools, new teachers, a national curriculum read from Madrid. The illiteracy rate is the regime's strongest argument."
 SPR2_hydraulic_confederation: "The Hydraulic Confederations"
 SPR2_hydraulic_confederation_desc: "River-basin authorities with the power to tax, dam and resettle. Lorenzo Pardo's plan is the most ambitious thing the dictatorship attempts."
 SPR2_railway_monopoly: "The Railway Monopoly"
 SPR2_railway_monopoly_desc: "The state takes over the failing private lines and finances new track with borrowed money. The debt will outlast the regime."
 SPR2_tourism_boards: "Tourism Boards"
 SPR2_tourism_boards_desc: "Posters of the Alhambra, the Costa Brava and the Prado. Foreign currency pays for the public works."
 SPR2_public_debt_settlement: "The Debt Settlement"
 SPR2_public_debt_settlement_desc: "The peseta is stabilised and the foreign debt renegotiated. Confidence returns to the exchange and not to the Cortes."
 SPR2_army_reorganisation: "Army Reorganisation"
 SPR2_army_reorganisation_desc: "Fewer officers, better paid, promoted on merit, with the Africanists at the top. The reform creates the army that will later divide the country."
 SPR2_artillery_rearmament: "Artillery Rearmament"
 SPR2_artillery_rearmament_desc: "New field guns from Trubia and Seville. The force that lands at Alhucemas is the best-equipped Spain has ever sent abroad."
 SPR2_alhucemas_landing: "The Landing at Alhucemas"
 SPR2_alhucemas_landing_desc: "A combined landing with tanks, artillery and naval gunfire breaks the Rif. It is the first successful operation of its kind in the Mediterranean."
 SPR2_pacify_the_protectorate: "Pacify the Protectorate"
 SPR2_pacify_the_protectorate_desc: "The khalifa governs, the interventores advise, and the Army of Africa garrisons the hills. Morocco is quiet, and it is a school for generals."
 SPR2_naval_reconstruction: "Naval Reconstruction"
 SPR2_naval_reconstruction_desc: "The 1926 programme lays down cruisers and destroyers at Ferrol and Cartagena. The fleet is small, modern and expensive."
 SPR2_catalan_policy: "The Catalan Policy"
 SPR2_catalan_policy_desc: "The Mancomunitat is dissolved, the language is restricted in official use, and the Catalan question is declared closed."
 SPR2_basque_policy: "The Basque Policy"
 SPR2_basque_policy_desc: "The provincial fueros are trimmed and the Carlist committees are tolerated. The Basque provinces lose their administration and keep their church."
 SPR2_the_spring_of_1930: "The Spring of 1930"
 SPR2_the_spring_of_1930_desc: "The dictator asks the captains whether they still support him. Their answer is polite, and it ends the regime."

 # ================================================================ Republic, 1931-1936
 SPR3_the_republic_proclaimed: "The Republic Proclaimed"
 SPR3_the_republic_proclaimed_desc: "The municipal elections of 12 April return republican councillors in every city. Alfonso XIII leaves from Cartagena that night, and the Republic is declared the next morning."
 SPR3_constituent_cortes: "The Constituent Cortes"
 SPR3_constituent_cortes_desc: "A chamber elected to write a constitution, with the Socialists inside the government and the Church outside it."
 SPR3_constitution_1931: "The Constitution of 1931"
 SPR3_constitution_1931_desc: "Sovereignty in the people, universal suffrage, a single chamber, secular education and the right to regional autonomy. It is the most progressive constitution in Europe and the least agreed."
 SPR3_agrarian_reform: "Agrarian Reform"
 SPR3_agrarian_reform_desc: "Two million landless labourers in the south and estates that have not changed hands in centuries. The Institute of Agrarian Reform is created to settle them."
 SPR3_ira_expedite: "Expedite the Settlements"
 SPR3_ira_expedite_desc: "Settle the land faster than the law allows, with compensation capped and the owners sitting in the chamber. The right calls it confiscation and the left calls it a beginning."
 SPR3_compensate_the_landowners: "Compensate the Landowners"
 SPR3_compensate_the_landowners_desc: "Buy the estates at their declared value with bonds the treasury cannot honour. Legal, slow, and the labourers wait."
 SPR3_military_reform: "The Azaña Law"
 SPR3_military_reform_desc: "Officers may retire on full pay or accept the post the Republic offers. The army shrinks by a third and the officer corps learns to hate the minister."
 SPR3_retire_the_africanists: "Retire the Africanists"
 SPR3_retire_the_africanists_desc: "The men who ran Morocco are moved to the peninsula, downgraded or retired. They keep their African loyalties and their grievance."
 SPR3_guardia_de_asalto: "The Guardia de Asalto"
 SPR3_guardia_de_asalto_desc: "A republican paramilitary police, loyal to the regime rather than to the old order, equipped with trucks and radios."
 SPR3_guardia_civil_reform: "Reform the Guardia Civil"
 SPR3_guardia_civil_reform_desc: "The rural police that every village fears. Reform its postings and its pay, and find out whether it fires on strikers next time."
 SPR3_religious_settlement: "The Religious Settlement"
 SPR3_religious_settlement_desc: "The constitution abolishes the teaching role of the religious orders and the budget for the clergy. The bishops read it as a declaration of war."
 SPR3_secular_schools: "Secular Schools"
 SPR3_secular_schools_desc: "The religious orders are removed from the classroom and replaced by lay teachers who do not yet exist in sufficient numbers."
 SPR3_education_mission: "The Pedagogical Missions"
 SPR3_education_mission_desc: "Students, poets and teachers take libraries and cinema into the villages. It is the Republic's most popular and least funded project."
 SPR3_catalan_statute: "The Catalan Statute"
 SPR3_catalan_statute_desc: "The Generalitat is restored and the statute goes to the Cortes. Autonomy is granted, cut down and granted again."
 SPR3_statute_of_nuria: "The Statute of Núria"
 SPR3_statute_of_nuria_desc: "The draft approved at Núria gives Catalonia its own parliament, courts and schools. Madrid negotiates it down, and the compromise satisfies nobody."
 SPR3_basque_statute: "The Basque Statute"
 SPR3_basque_statute_desc: "Navarre refuses, Álava hesitates, and the statute goes forward for Vizcaya and Guipúzcoa. The Carlist councils and the Church both claim it."
 SPR3_centralist_reaction: "The Centralist Reaction"
 SPR3_centralist_reaction_desc: "Cortes, army and treasury against the statutes. Administrative unity becomes the rallying cry of the right."
 SPR3_labour_ministry: "The Labour Ministry"
 SPR3_labour_ministry_desc: "Largo Caballero's ministry writes the first national system of collective bargaining, arbitration and rural wages."
 SPR3_ugt_alliance: "The UGT Alliance"
 SPR3_ugt_alliance_desc: "The Socialist union shares in government and moderates its demands. Its membership grows and its revolutionary wing splits away."
 SPR3_cnt_insurrection: "The CNT Insurrection"
 SPR3_cnt_insurrection_desc: "The anarcho-syndicalists reject parliament, arbitration and the Republic itself. Their risings at Figols and Casas Viejas are crushed and remembered."
 SPR3_public_works: "Public Works"
 SPR3_public_works_desc: "Roads, reservoirs and schools as emergency employment. The Republic spends what it cannot borrow."
 SPR3_industrial_policy: "Industrial Policy"
 SPR3_industrial_policy_desc: "Tariffs, state contracts and the first planning offices. Catalan and Basque industry wants protection and resents regulation."
 SPR3_agrarian_credit: "Agrarian Credit"
 SPR3_agrarian_credit_desc: "Cheap loans for the smallholder, the tenant and the cooperative. It does not create land, and it does keep the small farm alive."
 SPR3_elections_1933: "The Elections of 1933"
 SPR3_elections_1933_desc: "The right returns united, the left divided, and the Republic changes hands at the ballot box for the first and only time."
 SPR3_asturias_1934: "The Rising in Asturias"
 SPR3_asturias_1934_desc: "Miners, socialists and communists seize the valleys, and the Legion and the Regulares are brought from Africa to retake them. The repression that follows poisons the Republic."
 SPR3_the_popular_front: "The Popular Front"
 SPR3_the_popular_front_desc: "Republicans, socialists and communists agree on a programme and a slate. The election of February 1936 gives them a majority and gives the right a grievance."
 SPR3_the_national_front: "The National Front"
 SPR3_the_national_front_desc: "CEDA, the monarchists and the Falange coordinate against the Popular Front. The government that results is legal, and the army watches it."
 SPR3_army_plot: "The Army Plot"
 SPR3_army_plot_desc: "Mola coordinates the garrisons from Pamplona, Sanjurjo waits in Lisbon, and Franco hesitates in the Canaries. Every appointment now matters."
 SPR3_the_rising: "The Rising"
 SPR3_the_rising_desc: "The date is set for July. Whether it becomes a barracks revolt or a civil war depends on how the garrisons answer."

 # ================================================================ Republican post-war, 1939 onwards
 SPR4_the_republic_endures: "The Republic Endures"
 SPR4_the_republic_endures_desc: "The rising failed and the war ended with the Republic still standing. The state is intact; the economy, the army and the governing coalition are not."
 SPR4_constitution_of_1939: "The Constitution of 1939"
 SPR4_constitution_of_1939_desc: "The 1931 constitution is amended to settle the war powers, the statute of the regions and the place of the parties that fought for the Republic."
 SPR4_secular_state: "The Secular State"
 SPR4_secular_state_desc: "The religious orders are gone from teaching and the confiscated property is not returned. The Church withdraws from public life and waits."
 SPR4_catalan_settlement: "The Regional Settlement"
 SPR4_catalan_settlement_desc: "Catalonia and the Basque Country receive the statutes they were promised in 1931 and 1936, with their finances finally settled."
 SPR4_the_communist_question: "The Communist Question"
 SPR4_the_communist_question_desc: "The PCE fought for the Republic and now claims the government. Moscow's line arrives before the party's own."
 SPR4_the_pce_in_government: "The PCE in Government"
 SPR4_the_pce_in_government_desc: "Ministries for the communists in exchange for Soviet credit and the Comintern's volunteers going home. Washington notices."
 SPR4_marginalise_the_pce: "Marginalise the PCE"
 SPR4_marginalise_the_pce_desc: "The communists are pushed out of the cabinet and into opposition. Soviet aid stops and the Western powers relax."
 SPR4_the_anarchist_question: "The Anarchist Question"
 SPR4_the_anarchist_question_desc: "The CNT collectivised half of Catalonia and Aragon during the war. The Republic has to decide whether that land is legal."
 SPR4_collectivise_the_land: "Legalise the Collectives"
 SPR4_collectivise_the_land_desc: "The collectives keep the land they took and receive state credit. Production recovers in Aragon and the smallholders of the south organise against it."
 SPR4_restore_smallholding: "Restore the Smallholder"
 SPR4_restore_smallholding_desc: "The collectives are dissolved and the land returns to individual tenure. It is popular in Andalusia and it splits the CNT."
 SPR4_rebuild_the_industry: "Rebuild the Industry"
 SPR4_rebuild_the_industry_desc: "Catalan mills and Basque furnaces are repaired with state credit. The Republic begins its reconstruction without a Marshall Plan."
 SPR4_the_hydroelectric_grid: "The Hydroelectric Grid"
 SPR4_the_hydroelectric_grid_desc: "The Duero and Ebro schemes are completed. Electrification is the cheapest way to raise output in a country short of coal."
 SPR4_railway_restoration: "Railway Restoration"
 SPR4_railway_restoration_desc: "Bridges, rolling stock and the Madrid to Barcelona line. Reconstruction begins with the railway because nothing else moves without it."
 SPR4_army_of_the_republic: "The Army of the Republic"
 SPR4_army_of_the_republic_desc: "A conscript army with a professional cadre, its Africanist factions removed and its political loyalties watched."
 SPR4_the_people_in_arms: "The People in Arms"
 SPR4_the_people_in_arms_desc: "The militia tradition is kept and the reserves enlarged. Manpower is cheap, equipment is not, and the officer corps resents it."
 SPR4_professionalise_the_army: "Professionalise the Army"
 SPR4_professionalise_the_army_desc: "Better paid, better trained, smaller. The Republic bets that a professional army is less likely to revolt than a militia."
 SPR4_diplomacy_with_the_allies: "Diplomacy with the Allies"
 SPR4_diplomacy_with_the_allies_desc: "Britain and France need a friendly Spain on the Atlantic approaches, and they find one that owes them nothing yet."
 SPR4_western_orientation: "Western Orientation"
 SPR4_western_orientation_desc: "Trade, credit and eventually bases with Britain and France. It secures the Pyrenees and forecloses Soviet support."
 SPR4_relations_with_moscow: "Relations with Moscow"
 SPR4_relations_with_moscow_desc: "Soviet credit and advisers, paid for in political alignment. It restores the party's position and makes a Western war more likely."
 SPR4_the_iberian_pact: "The Iberian Pact"
 SPR4_the_iberian_pact_desc: "A non-aggression and consultation pact with Portugal. It closes the peninsula to invaders and does not commit Spain to a war."
 SPR4_the_european_war: "The European War"
 SPR4_the_european_war_desc: "The Republic states its willingness to fight alongside the Allies when the moment comes. The army that won the civil war is still being rebuilt."
 SPR4_armed_neutrality: "Armed Neutrality"
 SPR4_armed_neutrality_desc: "A mobilised neutrality, with the coastal defences manned and both blocs courted. Spain trades with whoever pays and commits to nobody."

 SPR1_court_party: "The Court Party"
 SPR1_court_party_desc: "A parliamentary grouping that exists to serve the palace rather than the electorate. Its deputies owe their seats to the King's household, and its votes are bought with appointments."
 SPR1_royal_guard: "The Royal Guard"
 SPR1_royal_guard_desc: "The household troops answer to the Crown alone. While they stand in Madrid, no government can be dismissed by anyone but the King."
 SPR1_liberal_party: "The Liberal Party"
 SPR1_liberal_party_desc: "Sagasta's heirs promise honest elections and a slower, safer modernisation. They will disappoint the radicals and reassure the middle classes."
 SPR1_conservative_party: "The Conservative Party"
 SPR1_conservative_party_desc: "Canovas's inheritance: order, property and the Church. The Conservatives will defend the Crown against both the street and the ballot."
 SPR1_press_freedom: "A Free Press"
 SPR1_press_freedom_desc: "Censorship is lifted and the Madrid dailies begin to print what the provinces have known for years. Scandal and literacy spread together."
 SPR1_public_schools: "Public Schools"
 SPR1_public_schools_desc: "Four out of ten Spaniards cannot read. A national school programme is the cheapest revolution available to the state, and the Church knows it."
 SPR1_public_health: "The Public Health Service"
 SPR1_public_health_desc: "Cholera and tuberculosis kill more Spaniards than the Rif ever will. Inspectors, sewers and dispensaries are cheaper than another colonial expedition."
 SPR1_workers_housing: "Workers' Housing"
 SPR1_workers_housing_desc: "The shanty towns beyond the ring roads of Madrid and Barcelona are a permanent insurrection. Cheap housing buys quiet streets."
 SPR1_womens_work: "Women in Industry"
 SPR1_womens_work_desc: "Textile mills and tobacco factories already run on female labour at half the male wage. Formalising it brings women into the workforce and out of the household economy."
 SPR1_tragic_week: "The Tragic Week"
 SPR1_tragic_week_desc: "In July 1909 the reservists sailed for Morocco and Barcelona burned. Churches, convents and the government's credibility went up together."
 SPR1_catalan_language: "The Catalan Language"
 SPR1_catalan_language_desc: "Catalan is taught again in the schools and printed in the press. Madrid calls it folklore; Barcelona calls it a nation."
 SPR1_basque_fueros: "The Basque Fueros"
 SPR1_basque_fueros_desc: "The provinces retain their own tax arrangements and their own sense of themselves. The fueros are the oldest bargain in Spain and the hardest to revoke."
 SPR1_mining_industry: "The Mining Districts"
 SPR1_mining_industry_desc: "Asturian coal and Rio Tinto copper feed the blast furnaces of Biscay. Spain sells its ore abroad and buys back finished steel."
 SPR1_merchant_marine: "The Merchant Marine"
 SPR1_merchant_marine_desc: "A flag that carries its own goods carries its own arguments. Spanish shipping lines are thin, and every hull lost to a foreign carrier is a subsidy to someone else."
 SPR1_telegraph_network: "The Telegraph Network"
 SPR1_telegraph_network_desc: "Orders from Madrid take days to reach Estremadura. Wire and cable bind the state together faster than any speech in the Cortes."
 SPR1_agrarian_credit: "Agrarian Credit Banks"
 SPR1_agrarian_credit_desc: "The smallholder borrows at rates that devour his harvest. A state credit bank lends at rates that leave him something to plant next year."
 SPR1_wine_and_oil: "Wine and Olive Oil"
 SPR1_wine_and_oil_desc: "The Mediterranean exports pay for the northern industry. Fraud, phylloxera and French tariffs decide whether Andalusia eats."
 SPR1_military_academy: "The Military Academy"
 SPR1_military_academy_desc: "The Africanists want promotion by merit and war; the peninsular generals want promotion by seniority and peace. The academy decides which officer the army will have in 1936."
 SPR1_artillery_corps: "An Artillery Corps"
 SPR1_artillery_corps_desc: "Spanish guns are few, old and scattered among the infantry. A proper artillery corps is the difference between a colonial gendarmerie and an army."
 SPR1_moroccan_railway: "Railways in the Protectorate"
 SPR1_moroccan_railway_desc: "Steel into the Rif carries supplies to the forward posts and garrisons into the mountains. It is engineering and occupation at once."
 SPR1_spanish_legion: "The Spanish Legion"
 SPR1_spanish_legion_desc: "Millan-Astray proposes a unit in the manner of the French Foreign Legion: volunteers, discipline and no questions about the past. Its officers will remember who created them."
 SPR1_vatican_concordat: "A New Concordat"
 SPR1_vatican_concordat_desc: "Rome will bless the Crown provided the Crown protects the Church. The price is paid in schools and in the marriage register."
 SPR1_french_accord: "The French Accord"
 SPR1_french_accord_desc: "Paris holds the keys to Morocco and to any Spanish claim in Europe. An understanding with France costs less than a squadron of dreadnoughts."
 SPR1_moroccan_conference: "The Moroccan Conference"
 SPR1_moroccan_conference_desc: "The powers meet to divide a country none of them owns. Spain arrives with a small army and a large claim, and leaves with a larger zone and a longer border."
 SPR1_the_assembly_movement: "The Assembly Movement"
 SPR1_the_assembly_movement_desc: "The Cortes has been suspended and the country is run by decree. In Barcelona and Madrid, deputies and professors begin to assemble without the King's permission."
 SPR1_the_general_strike: "The General Strike"
 SPR1_the_general_strike_desc: "The UGT and the CNT call out the cities in support of the assembly. Trains stop, factories close and the government discovers how little it controls."
 SPR1_barcelona_lockout: "The Barcelona Lockout"
 SPR1_barcelona_lockout_desc: "The employers close the mills rather than bargain. The pistols come out on both sides, and Barcelona settles into a permanently armed peace."
 SPR1_the_coup_that_waits: "The Coup That Waits"
 SPR1_the_coup_that_waits_desc: "The Africanist officers have a plan, a list of names and a general willing to sign. All they await is the moment the monarchy can no longer defend itself."

 SPR2_aircraft_industry: "The Aircraft Industry"
 SPR2_aircraft_industry_desc: "Hispano-Suiza builds aero engines at Barcelona and the military air service grows from a colonial police arm into a branch of the army."
 SPR2_highway_programme: "The Highway Programme"
 SPR2_highway_programme_desc: "The dictatorship prefers asphalt to argument. Roads reach the provincial capitals, and with them the gendarmerie and the newspaper."
 SPR2_iron_and_coal: "Iron and Coal"
 SPR2_iron_and_coal_desc: "Asturian coal and Biscayan iron are the two halves of a single industry that has never been joined. The state now proposes to join them."
 SPR2_liberal_opposition: "The Liberal Opposition"
 SPR2_liberal_opposition_desc: "The dynastic politicians the dictatorship suspended have not disappeared. They meet in Madrid drawing rooms and wait for the regime to fail."
 SPR2_municipal_elections: "The Municipal Elections"
 SPR2_municipal_elections_desc: "The government promises municipal elections as a demonstration of gratitude. The results in the great cities will decide whether the monarchy survives April."
 SPR2_officer_discontent: "Officer Discontent"
 SPR2_officer_discontent_desc: "The artillery corps has been disbanded by decree and the Africanists have been passed over. The garrisons begin to talk among themselves."
 SPR2_promote_tourism_abroad: "Promote Tourism Abroad"
 SPR2_promote_tourism_abroad_desc: "The state advertises the Alhambra and the Costa Brava to foreign travellers. Their sterling pays for the public works the budget cannot afford."
 SPR2_public_works_halt: "The Works Halt"
 SPR2_public_works_halt_desc: "Credit dries up and the cement plants fall silent. The roads half-built across Castile become monuments to the dictatorship's arithmetic."
 SPR2_republican_alliance: "The Republican Alliance"
 SPR2_republican_alliance_desc: "Republicans, socialists and Catalan nationalists discover that they agree on one thing: the monarchy must go."
 SPR2_republican_pact: "The Pact of San Sebastian"
 SPR2_republican_pact_desc: "The opposition meets in the border town and agrees on a provisional government before it has agreed on a constitution."
 SPR2_rif_air_war: "Air War over the Rif"
 SPR2_rif_air_war_desc: "Aircraft bomb villages the infantry cannot reach. The Rif is subdued from the air, and the air force learns what it is for."
 SPR2_socialist_opposition: "The Socialist Opposition"
 SPR2_socialist_opposition_desc: "The UGT has grown fat under arbitration and hostile to the regime that fed it. Its leaders begin to speak of the Republic as a stage rather than an end."
 SPR2_student_unrest: "Student Unrest"
 SPR2_student_unrest_desc: "The university federations strike against the dictatorship and are closed for their trouble. The students take their politics to the streets."
 SPR2_submarine_force: "The Submarine Force"
 SPR2_submarine_force_desc: "The navy can afford neither dreadnoughts nor prestige. Submarines are cheap, and cheap is what the budget allows."
 SPR2_telephone_monopoly: "The Telephone Monopoly"
 SPR2_telephone_monopoly_desc: "A single concession holds every telephone line in Spain. Its shareholders include men who sit in the Council of State."
 SPR2_the_dictatorship_ends: "The Dictatorship Ends"
 SPR2_the_dictatorship_ends_desc: "Primo de Rivera loses the army, the King and the peseta in a single winter. The regime ends the way it began, with a general and a proclamation."
 SPR2_the_intellectuals: "The Intellectuals"
 SPR2_the_intellectuals_desc: "Ortega writes, Unamuno is exiled and the Ateneo fills. The regime has no answer to men who can write."
 SPR2_the_king_withdraws: "The King Withdraws"
 SPR2_the_king_withdraws_desc: "Alfonso XIII discovers that a dictatorship he sponsored has left him without constitutional allies. The Crown withdraws from politics and takes its chances."
 SPR2_the_oil_monopoly: "The Oil Monopoly"
 SPR2_the_oil_monopoly_desc: "The state grants a monopoly on imported oil and taxation on its sale. The concessionaires grow rich and the treasury grows content."
 SPR2_the_peseta_defence: "Defending the Peseta"
 SPR2_the_peseta_defence_desc: "The Bank of Spain spends its reserves to hold the exchange rate. Every defence of the currency is a defence of the regime's credit."
 SPR2_the_world_crash: "The World Crash"
 SPR2_the_world_crash_desc: "Wall Street collapses and the remittances from Argentina stop. Spain's exports fall and the regime's promises fall with them."
 SPR3_air_force: "The Air Force"
 SPR3_air_force_desc: "The Republic inherits a colonial air service and must decide whether aviation is a branch of the army or a service of its own."
 SPR3_arms_for_the_militias: "Arms for the Militias"
 SPR3_arms_for_the_militias_desc: "The unions demand rifles and the government must choose between arming its own supporters and admitting that it trusts no one else."
 SPR3_army_union: "The Spanish Military Union"
 SPR3_army_union_desc: "Officers who believe the Republic has humiliated the army organise in secret. Their oath is to Spain, which they identify with themselves."
 SPR3_calvo_sotelo: "The Murder of Calvo Sotelo"
 SPR3_calvo_sotelo_desc: "A monarchist deputy is taken from his home and shot by policemen. The assassination removes the last argument against a rising."
 SPR3_carlist_requetes: "The Requetes"
 SPR3_carlist_requetes_desc: "Navarre drills its own militia under the red beret. The Carlists want a king, a God and a war, in that order."
 SPR3_casas_viejas: "Casas Viejas"
 SPR3_casas_viejas_desc: "Twelve peasants are burned in a hut at Casas Viejas. The Republic's promise of land is buried with them."
 SPR3_clerical_resistance: "Clerical Resistance"
 SPR3_clerical_resistance_desc: "The Church loses its schools and its cemeteries and tells the faithful that the Republic is the enemy of God."
 SPR3_divorce_law: "The Divorce Law"
 SPR3_divorce_law_desc: "Marriage becomes a civil contract that can be dissolved. The Republic legislates the private life of the nation."
 SPR3_falange_founded: "The Falange"
 SPR3_falange_founded_desc: "Jose Antonio Primo de Rivera founds a movement of national syndicalism with uniforms, salutes and very few votes."
 SPR3_foreign_aid: "Seeking Foreign Aid"
 SPR3_foreign_aid_desc: "If war comes, it will not be fought with Spanish rifles alone. Emissaries are sent to Paris and to Moscow before anyone fires a shot."
 SPR3_gil_robles: "The CEDA"
 SPR3_gil_robles_desc: "Gil Robles assembles the Catholic right into a mass party that will accept the Republic until it can be amended out of existence."
 SPR3_irrigation_schemes: "Irrigation Schemes"
 SPR3_irrigation_schemes_desc: "Water turns the dry south into arable land. The dams also turn peasants into tenants of the state that built them."
 SPR3_land_settlement: "Land Settlement"
 SPR3_land_settlement_desc: "The Institute of Agrarian Reform moves families onto estates the state has expropriated at a price the owners consider theft."
 SPR3_naval_reform: "Naval Reform"
 SPR3_naval_reform_desc: "The Republic inherits a fleet designed for a king's prestige and a budget meant for a poor country. The two must be reconciled."
 SPR3_prison_reform: "Prison Reform"
 SPR3_prison_reform_desc: "The Republic empties the political prisons the monarchy filled. The officers who put men there are not amused."
 SPR3_public_order: "Public Order"
 SPR3_public_order_desc: "The Guardia de Asalto is raised as a republican gendarmerie, loyal to the state rather than to the barracks."
 SPR3_renovacion_espanola: "Renovacion Espanola"
 SPR3_renovacion_espanola_desc: "Monarchists who never accepted 1931 organise the right around the exiled King and the promise of restoration."
 SPR3_sanjurjo_plot: "The Sanjurjo Plot"
 SPR3_sanjurjo_plot_desc: "General Sanjurjo rises at Seville and fails at Seville. The Republic pardons him, and the army learns that risings are survivable."
 SPR3_school_building: "School Building"
 SPR3_school_building_desc: "Five thousand new schools are promised and a few hundred built. The Republic's teachers become its most reliable constituency."
 SPR3_the_choice_of_war: "The Choice of War"
 SPR3_the_choice_of_war_desc: "If the rising comes, the government will have to choose between arming the unions and losing the war. It cannot do both."
 SPR3_the_falange_street: "The Falange in the Street"
 SPR3_the_falange_street_desc: "Pistoleros of left and right shoot each other in Madrid and Seville. Each funeral produces the next."
 SPR3_the_garrison_question: "The Garrison Question"
 SPR3_the_garrison_question_desc: "Every garrison commander must be sounded out. A single loyal brigade in the right place can decide the first week of a civil war."
 SPR3_the_rising_prepared: "The Rising Prepared"
 SPR3_the_rising_prepared_desc: "Mola coordinates the conspiracy from Pamplona, city by city, officer by officer. The timetable is drafted before the war it assumes."
 SPR3_university_autonomy: "University Autonomy"
 SPR3_university_autonomy_desc: "The universities are freed from ministerial appointment. The professoriate that gains freedom becomes the Republic's loudest critic."
 SPR3_women_suffrage: "Women's Suffrage"
 SPR3_women_suffrage_desc: "The Cortes debates whether women should vote. Clara Campoamor argues that citizenship cannot be granted in halves."
 SPR4_a_place_in_europe: "A Place in Europe"
 SPR4_a_place_in_europe_desc: "A Republic that survived the war now asks the victors of 1945 for recognition and finds that survival is not the same as welcome."
 SPR4_amnesty_debate: "The Amnesty Debate"
 SPR4_amnesty_debate_desc: "The prisons are full and the country is tired. The Cortes must decide how much of the defeated side can be released without releasing the war."
 SPR4_coal_and_steel: "Coal and Steel"
 SPR4_coal_and_steel_desc: "The blast furnaces of Biscay are repaired and the mines of Asturias reopened. Rebuilding the war industry also rebuilds the class that fought the war."
 SPR4_gibraltar_question: "The Gibraltar Question"
 SPR4_gibraltar_question_desc: "The Rock is British, the Straits are Spanish and the war has shown both facts to be negotiable. Madrid raises the question and waits for a reply."
 SPR4_political_police: "The Political Police"
 SPR4_political_police_desc: "A security service answers to the Ministry of the Interior rather than to the army. Its files are the Republic's insurance and its liability."
 SPR4_pyrenees_defences: "The Pyrenees Defences"
 SPR4_pyrenees_defences_desc: "Concrete and wire along the French frontier. The Republic has learned that a neighbour who promises help may also arrive uninvited."
 SPR4_reconstruction_complete: "Reconstruction Complete"
 SPR4_reconstruction_complete_desc: "The last bridge is reopened and the last rationing order withdrawn. The war is finally a memory rather than a balance sheet."
 SPR4_the_1945_settlement: "The 1945 Settlement"
 SPR4_the_1945_settlement_desc: "Europe is redrawn at Potsdam and San Francisco. Spain's borders are not in question, but its government is."
 SPR4_the_air_force: "The Air Force Rebuilt"
 SPR4_the_air_force_desc: "Surplus German and Italian aircraft are bought for scrap prices and rebuilt. The Republic's air force is a museum that flies."
 SPR4_the_army_and_the_party: "The Army and the Party"
 SPR4_the_army_and_the_party_desc: "Who commands the army answers the larger question of who commands the Republic. The settlement of 1939 is renegotiated in every barracks."
 SPR4_the_church_settlement: "The Church Settlement"
 SPR4_the_church_settlement_desc: "A concordat or a separation: the Republic must define what the Church is allowed to own, teach and say."
 SPR4_the_exiled_monarchy: "The Exiled Monarchy"
 SPR4_the_exiled_monarchy_desc: "The Bourbons live in Rome and Paris and wait. The Republic must decide whether a pretender in exile is a citizen or a conspirator."
 SPR4_the_exiles_return: "The Exiles Return"
 SPR4_the_exiles_return_desc: "Doctors, engineers and professors return from Mexico and Toulouse. The Republic gains the middle class it lost in 1939."
 SPR4_the_falange_remnant: "The Falange Remnant"
 SPR4_the_falange_remnant_desc: "The movement is broken but not dissolved. Its members are in prison, in exile, or quietly in the administration."
 SPR4_the_merchant_fleet: "The Merchant Fleet"
 SPR4_the_merchant_fleet_desc: "Half the merchant marine was sunk or seized. Without hulls the Republic cannot trade, and without trade it cannot rebuild."
 SPR4_the_un_question: "The United Nations"
 SPR4_the_un_question_desc: "The founding conference convenes in San Francisco. The Republic seeks a seat and finds its wartime friends divided about its politics."
 SPR4_volunteer_question: "Volunteers for the Front"
 SPR4_volunteer_question_desc: "The Blue Division was Franco's gift to Hitler. A republican Spain must decide what, if anything, it owes the other side of that war."
 SPR4_wolfram_trade: "The Wolfram Trade"
 SPR4_wolfram_trade_desc: "Both alliances will pay in gold and machine tools for a mineral only Galicia produces in quantity. Neutrality becomes a business."
