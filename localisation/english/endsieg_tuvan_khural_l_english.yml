l_english:
 INT_tuvan_khural.1.t:0 "The All-Tuvan Khural"
 INT_tuvan_khural.1.d:0 "Delegates from the districts of Uriankhai have gathered at Sug-Bazhy. They have proclaimed the People's Republic of Tannu-Tuva and formed a central council. Soviet Russia will support the new republic on its southern frontier."
 INT_tuvan_khural.1.a:0 "Recognise the republic."
 INT_TAN_khural:0 "General Central Council"
 INT_TAN_revolutionary_party:0 "Tuvan People's Revolutionary Party"
