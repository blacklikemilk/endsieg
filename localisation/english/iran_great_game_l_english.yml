l_english:
iran_great_game: "The Great Game"
iran_great_game_desc: "Two empires meet across Iran because it is the only ground on which they can meet without a war. London holds the Gulf and the telegraph; Petersburg - now Moscow - holds the north and the Caspian road. Neither can be removed and neither can be trusted, so every government in Tehran governs by keeping the two of them interested in different things."

iran_court_the_legation: "Court the British Legation"
iran_court_the_legation_desc: "Send the young men of the court to the legation with compliments, and let the legation send its advisers to the ministries. The British pay in coin, in rifles and in the quiet word that stops a Russian advance, and they charge for all three."

iran_cultivate_the_mission: "Cultivate the Soviet Mission"
iran_cultivate_the_mission_desc: "The mission in Tehran is easier to please and harder to remove. It asks for the northern roads, the Caspian fisheries and the right to land a shipment at Enzeli without inspection. In exchange it will arm a government's enemies - or not arm them."

iran_play_them_off: "Play One Against the Other"
iran_play_them_off_desc: "While neither patron has the upper hand, Tehran can do what a weak state does best: sell the same assurance twice. It works exactly as long as the two of them believe that losing Iran matters more than denying it to the other."

iran_expel_the_advisers: "Expel the Foreign Advisers"
iran_expel_the_advisers_desc: "Empty the ministries of foreign advisers in one afternoon. The departments will not function in the spring, the customs will not be worked by anyone who knows them, and for a year the country will be governed entirely by Iranians - which is either the point or the whole disaster, depending on who is asked."

iran_northern_concession: "Grant the Northern Concession"
iran_northern_concession_desc: "Sell the north to the Russians on the same terms the south was sold to the British. The treasury gains and the map is now divided by two sets of concessions rather than one, which at least means neither neighbour can claim the whole country."

iran_invite_a_third_power: "Invite a Third Power In"
iran_invite_a_third_power_desc: "If Britain is entrenched and Moscow is not, there is room for a third party with no frontier and no history in the country. German engineers, German credit and German instructors can be brought in on the theory that a distant friend is safer than a close neighbour - a theory nobody has yet tested to its conclusion."

iran_british_preference: "The British Connection"
iran_british_preference_desc: "The legation's advice is followed, its credit is used and its interests are protected. The treasury benefits and the country is governed by men the British find reasonable."

iran_soviet_preference: "The Northern Connection"
iran_soviet_preference_desc: "Moscow's mission has the run of the northern provinces and its technicians staff the Caspian works. Factories appear and the provinces near the border grow noisy."

iran_balancing_powers: "Neither Patron Decisive"
iran_balancing_powers_desc: "Both legations are courted, neither is satisfied, and Tehran extracts from each what it would not pay for from either alone. Every cabinet minister knows the arrangement survives only while the two of them remain rivals."
iran_campaign.70.t: "An Invitation from Tehran"
iran_campaign.70.d: "The Iranian government has asked, through a channel it would deny using, whether Germany would send a mission to Tehran. There is no frontier between the two countries and no history of one, which is precisely why the offer exists: a distant friend cannot annex the country it advises."
iran_campaign.70.a: "Send the mission."
iran_campaign.70.b: "Decline. The British will hear of it."
iran_campaign.70.c: "Send it, and name our price."
