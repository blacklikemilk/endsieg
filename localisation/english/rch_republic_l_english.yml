l_english:
 rch_republic: "The Early Republic"
 rch_politics_navigation: "Government"
 rch_economy_navigation: "Finance and Industry"
 rch_army_navigation: "The Army"
 rch_diplomacy_navigation: "Foreign Affairs"
 rch_society_navigation: "Society"
 RC1_provisional_government: "The Provisional Government"
 RC1_provisional_government_desc: "The republic exists on paper, in Nanjing, with a provisional president and no revenue. Give it a government before the north decides the revolution was a misunderstanding."
 RC1_national_assembly: "The National Assembly"
 RC1_national_assembly_desc: "An elected assembly is the republic's only claim to legitimacy. Let it sit and it will claim the government as well."
 RC1_presidential_office: "The Presidency"
 RC1_presidential_office_desc: "A president with real powers can hold the provinces together. A president with real powers can also close the assembly, and everyone remembers 1912."
 RC1_provisional_constitution: "The Provisional Constitution"
 RC1_provisional_constitution_desc: "A constitution written in a hurry to bind a president who has not yet arrived. It is the republic's best weapon and its first casualty."
 RC1_cabinet_responsibility: "A Responsible Cabinet"
 RC1_cabinet_responsibility_desc: "A cabinet that answers to the assembly is the difference between a republic and a presidency with a parliament attached."
 RC1_provincial_governors: "The Military Governors"
 RC1_provincial_governors_desc: "Every province is governed by the commander who took it in 1911. Confirm them and the republic survives, at the price of being a federation of armies."
 RC1_second_revolution: "The Second Revolution"
 RC1_second_revolution_desc: "The assembly's supporters in the south have risen against the president. Support them and the republic has a civil war. Abandon them and it has a dictator."
 RC1_military_government: "Government by the Army"
 RC1_military_government_desc: "The president governs through the Beiyang command and the provinces through their garrisons. It is efficient and it is not a republic."
 RC1_parliamentary_settlement: "A Parliamentary Republic"
 RC1_parliamentary_settlement_desc: "The assembly wins the argument and the presidency becomes a chair. The republic is governed by coalitions, newspapers and budgets that never quite balance."
 RC1_nationalist_settlement: "The Nationalist Cause"
 RC1_nationalist_settlement_desc: "The party of 1911 keeps the revolution alive in the south, with its own army, its own schools and its own claim to speak for the nation."
 RC1_beiyang_settlement: "The Beiyang Republic"
 RC1_beiyang_settlement_desc: "The army governs through the presidency, the ministries and the provincial garrisons. The assembly exists, is permitted to speak, and is not permitted to govern."
 RC1_provincial_settlement: "A Union of Governors"
 RC1_provincial_settlement_desc: "The provinces keep their armies, their taxes and their governors. Beijing keeps the name of China and the foreign ministry, which is what the powers deal with anyway."
 RC1_assembly_elections: "Elections to the Assembly"
 RC1_assembly_elections_desc: "The republic's first real election will decide whether the assembly is a government or a debating society with a printing press."
 RC1_party_politics: "Party Politics"
 RC1_party_politics_desc: "Parties with offices and newspapers turn a chamber of notables into a parliament. They also give the president someone to negotiate with."
 RC1_civil_liberties: "Civil Liberties"
 RC1_civil_liberties_desc: "A press law, a habeas corpus and a judiciary that the president cannot dismiss are the republic's substance rather than its decoration."
 RC1_parliamentary_capstone: "A Republic of Laws"
 RC1_parliamentary_capstone_desc: "The assembly has survived a president, a rebellion and a budget. The republic governs through institutions that were written down before anyone knew who would use them."
 RC1_kmt_army: "The Party Army"
 RC1_kmt_army_desc: "A party with an army is a government in waiting. Train the officers, pay the soldiers and the revolution has a sword as well as a programme."
 RC1_kmt_programme: "The Three Principles"
 RC1_kmt_programme_desc: "Nationalism, democracy and livelihood give the movement a programme that reaches peasants, students and officers at once."
 RC1_kmt_south: "The Southern Base"
 RC1_kmt_south_desc: "Guangdong is far from Beijing, rich enough to pay for an army and hostile enough to the north to host one. Build the base before the expedition."
 RC1_nationalist_capstone: "A Government in Waiting"
 RC1_nationalist_capstone_desc: "The party has an army, a programme and a province. It is not the government of China, and it is the only movement in China that behaves as if it will be."
 RC1_beiyang_officers: "The Beiyang Officers"
 RC1_beiyang_officers_desc: "The officers who made the republic can unmake it. Pay them, promote them and keep them in the north."
 RC1_beiyang_finance: "The Military Budget"
 RC1_beiyang_finance_desc: "A budget written by the war ministry is the Beiyang republic in financial form. It works until the provinces refuse to remit."
 RC1_beiyang_assembly: "An Assembly on Sufferance"
 RC1_beiyang_assembly_desc: "The assembly is allowed to meet, vote and complain. The army is allowed to ignore it. Both arrangements are stable until one of them is not."
 RC1_beiyang_capstone: "A Stable Military Republic"
 RC1_beiyang_capstone_desc: "The president governs, the army obeys and the assembly complains. It is not what 1911 was fought for, and it is the only government China has."
 RC1_provincial_charter: "The Provincial Charter"
 RC1_provincial_charter_desc: "A written division of revenue and authority between Beijing and the governors is the only constitution the provinces will accept."
 RC1_provincial_taxes: "Provincial Taxes"
 RC1_provincial_taxes_desc: "The provinces collect and keep the land tax and send a quota. The arrangement is stable and permanently insufficient."
 RC1_provincial_armies: "Provincial Armies"
 RC1_provincial_armies_desc: "Each province keeps its own divisions. The republic keeps the right to ask for them."
 RC1_provincial_capstone: "A Republic of Provinces"
 RC1_provincial_capstone_desc: "The governors have agreed a charter, a quota and a common foreign policy. China is a union that Beijing chairs rather than a state it commands."
 RC1_treasury: "The Empty Treasury"
 RC1_treasury_desc: "The republic inherited the Qing's debts and none of its revenue. An audit is the first act of any government that intends to last."
 RC1_currency: "A National Currency"
 RC1_currency_desc: "Silver, copper and provincial paper circulate at different rates. A national dollar would make the budget legible."
 RC1_railways: "The Railway Programme"
 RC1_railways_desc: "Railways move troops and grain, and every line is a political argument about foreign loans. Build them."
 RC1_industrial_bank: "An Industrial Bank"
 RC1_industrial_bank_desc: "A state bank that lends to factories and holds the salt revenue gives the government an economic policy."
 RC1_agriculture: "Agriculture and Rent"
 RC1_agriculture_desc: "Most Chinese rent the land they work. Rent reduction wins the countryside and alarms the gentry, and the republic needs both."
 RC1_customs: "The Customs Service"
 RC1_customs_desc: "The maritime customs is the one Chinese institution that collects money reliably, and it is run by foreigners. Keep it and use it."
 RC1_beiyang_army: "The Beiyang Army"
 RC1_beiyang_army_desc: "The best troops in China are also the most political. Pay them and they hold the north. Ignore them and they hold the government."
 RC1_officer_schools: "Officer Schools"
 RC1_officer_schools_desc: "A staff college produces officers who can plan a campaign and read a newspaper. Both are useful and only one is safe."
 RC1_provincial_army_law: "A Provincial Army Law"
 RC1_provincial_army_law_desc: "A law fixing the size of provincial armies is either the beginning of central control or a list of numbers nobody enforces."
 RC1_arsenal: "The Shanghai Arsenal"
 RC1_arsenal_desc: "An arsenal that can make rifles and ammunition is the difference between an army and a militia with foreign rifles."
 RC1_navy: "The Chinese Navy"
 RC1_navy_desc: "The navy was sunk in 1895 and has never recovered. A river and coastal force is affordable and useful against the power that actually threatens China."
 RC1_army_capstone: "An Army of the Republic"
 RC1_army_capstone_desc: "The army has a staff, an arsenal and a paymaster. Whether it serves the republic or owns it is a question the next crisis will answer."
 RC1_foreign_ministry: "The Foreign Ministry"
 RC1_foreign_ministry_desc: "The republic inherits the Qing's treaties, debts and legations. It needs a foreign ministry before it needs an army."
 RC1_neutrality: "Neutrality in the Great War"
 RC1_neutrality_desc: "Europe is at war and both sides want China's labourers, ore and neutrality. Selling neutrality to both is profitable and undignified."
 RC1_entente_entry: "Join the Entente"
 RC1_entente_entry_desc: "Declaring for the Entente costs a war China cannot fight and buys a seat at the peace conference. That is the whole calculation."
 RC1_twenty_one_demands: "The Twenty-One Demands"
 RC1_twenty_one_demands_desc: "Japan has presented a list that would make China a protectorate. The government has days to answer and no army that could refuse."
 RC1_shandong: "The Shandong Question"
 RC1_shandong_desc: "Shandong is Chinese, German-leased and Japanese-claimed. Every power has an opinion and none of them asks the province."
 RC1_paris: "The Paris Peace Conference"
 RC1_paris_desc: "China arrives at Paris as a victor and leaves as a lesson. The refusal to sign is the only thing the delegation can still do."
 RC1_education: "Schools of the Republic"
 RC1_education_desc: "A republic needs citizens who can read its laws. Build the schools and the next generation will have opinions about the government."
 RC1_press: "A Republican Press"
 RC1_press_desc: "Newspapers are the only parliament most Chinese ever see. A press law is the republic's cheapest institution and its most dangerous."
 RC1_new_culture: "The New Culture"
 RC1_new_culture_desc: "Writers and students are arguing about language, science and the family. The government can ignore them, censor them or recruit them."
 RC1_may_fourth: "The May Fourth Movement"
 RC1_may_fourth_desc: "Students have taken the streets over Shandong. The government can arrest them and lose the cities, or listen and lose control of the narrative."
 RC1_society_capstone: "A Republican Society"
 RC1_society_capstone_desc: "Schools, newspapers and a generation that argues in public are the republic's real constitution. They will outlast every government that tries to close them."
