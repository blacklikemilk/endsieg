l_english:
 WW1_1914_mobilisation_training:0 "Mobilisation of the Reserves"
 WW1_1914_mobilisation_training_desc:0 "Reservists are reporting to their depots as the army expands its training programmes. Experienced instructors and established mobilisation plans allow new formations to be readied more quickly, though the pressure on the depots cannot be sustained indefinitely."
 WW1_1914_russian_mobilisation_training:0 "General Mobilisation"
 WW1_1914_russian_mobilisation_training_desc:0 "Reservists are reporting for duty across the empire. Congestion on the railways delays their arrival, and the depots struggle to equip new formations and supply the armies already at the front."
