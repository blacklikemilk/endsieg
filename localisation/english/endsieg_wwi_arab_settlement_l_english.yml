l_english:
 ww1_levant.1.t:0 "After the Ottoman Armistice"
 ww1_levant.1.d:0 "Ottoman authority is withdrawing from the Arab provinces. Hussein rules from Mecca, Imam Yahya is consolidating power in northern Yemen, and Faisal's Arab administration governs from Damascus. Britain administers Mesopotamia and Palestine while France holds the Lebanese coast."
 ww1_levant.1.a:0 "Recognise the local administrations."
 ww1_levant.2.t:0 "The Syrian Congress Proclaims a Kingdom"
 ww1_levant.2.d:0 "The Syrian General Congress in Damascus has proclaimed independence and offered Faisal the crown. The new kingdom claims a wider territory than its government controls."
 ww1_levant.2.a:0 "Accept the crown."
 ww1_levant.3.t:0 "French Troops Enter Damascus"
 ww1_levant.3.d:0 "After the defeat of the Syrian army at Maysalun, French forces enter Damascus. Faisal's government falls and French administrators take charge of the interior."
 ww1_levant.3.a:0 "Establish the mandate administration."
 ww1_levant.4.t:0 "Abdullah Forms a Government in Amman"
 ww1_levant.4.d:0 "Abdullah bin Hussein has formed a government east of the Jordan. His ministers will oversee local affairs while Britain retains control of the territory. Palestine west of the river remains under separate administration."
 ww1_levant.4.a:0 "Recognise the emirate."
 ww1_levant.5.t:0 "Faisal Is Crowned in Baghdad"
 ww1_levant.5.d:0 "Faisal has been crowned king in Baghdad. Iraq now has its own monarch and ministries, while Britain retains authority under the mandate."
 ww1_levant.5.a:0 "Recognise Faisal under the mandate."
 ww1_levant.6.t:0 "The Northern Hejaz Campaign"
 ww1_levant.6.d:0 "The revolt has spread northwards along the pilgrimage route. The capture of Aqaba opens a supply route for the Arab Northern Army."
 ww1_levant.6.a:0 "Advance into the northern Hejaz."
 ww1_levant.7.t:0 "The Egyptian–Italian Frontier Agreement"
 ww1_levant.7.d:0 "Italy and Egypt have agreed on their western frontier. Jaghbub passes to Italian Libya under the settlement."
 ww1_levant.7.a:0 "Recognise the agreed frontier."
 ww1_levant.8.t:0 "The Fall of Ha'il"
 ww1_levant.8.d:0 "The Rashidi capital has surrendered to Ibn Saud. The emirate of Jabal Shammar is absorbed into his northern Arabian dominions. The frontier with Iraq and Transjordan remains unsettled."
 ww1_levant.8.a:0 "End Rashidi rule."
 ww1_levant.9.t:0 "The Uqair Settlement"
 ww1_levant.9.d:0 "The Uqair negotiations have fixed much of the frontier between Najd, Iraq and Kuwait. The desert district represented on this map as Al Hajara passes to Iraqi administration."
 ww1_levant.9.a:0 "Recognise the Iraqi frontier."
 ww1_levant.10.t:0 "Kuwait and British Protection"
 ww1_levant.10.d:0 "The House of Sabah administers Kuwait under British protection. British forces retain access to the Gulf port."
 ww1_levant.10.a:0 "Recognise the sheikh's administration."
 ww1_levant.11.t:0 "Succession in Kuwait"
 ww1_levant.11.d:0 "The House of Sabah has acclaimed Jaber II Al-Sabah as ruler of Kuwait."
 ww1_levant.11.a:0 "Recognise the new ruler."
 ww1_levant.12.t:0 "Succession in Kuwait"
 ww1_levant.12.d:0 "The House of Sabah has acclaimed Salim Al-Mubarak Al-Sabah as ruler of Kuwait."
 ww1_levant.12.a:0 "Recognise the new ruler."
 ww1_levant.13.t:0 "Succession in Kuwait"
 ww1_levant.13.d:0 "The House of Sabah has acclaimed Ahmad Al-Jaber Al-Sabah as ruler of Kuwait."
 ww1_levant.13.a:0 "Recognise the new ruler."
 SYR_wwi_arab_government:0 "Arab Administration of Syria"
 SYR_wwi_arab_government_DEF:0 "the Arab Administration of Syria"
 SYR_wwi_arab_kingdom:0 "Arab Kingdom of Syria"
 SYR_wwi_arab_kingdom_DEF:0 "the Arab Kingdom of Syria"
 JOR_wwi_emirate:0 "Emirate of Transjordan"
 JOR_wwi_emirate_DEF:0 "the Emirate of Transjordan"
 ww1_levant.14.t:0 "Britain Recognises Egyptian Independence"
 ww1_levant.14.d:0 "Britain has ended its protectorate. Fuad heads the Egyptian state. British troops retain their presence and London reserves questions of imperial communications, defence, foreign interests and the Sudan."
 ww1_levant.14.a:0 "Recognise the Egyptian government."
 ww1_levant.15.t:0 "The Medina Garrison Surrenders"
 ww1_levant.15.d:0 "The Ottoman defenders of Medina have finally surrendered. The Hashemite government can now administer the city."
 ww1_levant.15.a:0 "Take charge of Medina."
 ww1_levant.16.t:0 "Iraq Enters the League of Nations"
 ww1_levant.16.d:0 "Admission to the League brings the British mandate to an end. The Anglo-Iraqi treaty continues to govern relations between the two states."
 ww1_levant.16.a:0 "Recognise Iraqi sovereignty."
 ww1_levant.17.t:0 "Ghazi Succeeds His Father"
 ww1_levant.17.d:0 "King Faisal has died. His son Ghazi succeeds him on the Iraqi throne."
 ww1_levant.17.a:0 "Proclaim King Ghazi."
 ww1_levant.18.t:0 "The Saudi Campaign in the Hejaz"
 ww1_levant.18.d:0 "Ibn Saud has begun his campaign against the Hashemite kingdom. Control of the holy cities and the Red Sea ports is at stake."
 ww1_levant.18.a:0 "Contest the Hejaz."
 ww1_levant.19.t:0 "The Surrender of Jeddah"
 ww1_levant.19.d:0 "The Hashemite government has surrendered the Hejaz. Ibn Saud now rules the western cities as well as Najd."
 ww1_levant.19.a:0 "Accept the surrender."
 ww1_levant.20.t:0 "The Kingdom of Saudi Arabia"
 ww1_levant.20.d:0 "Ibn Saud has proclaimed a single kingdom joining the Hejaz and Najd under the name Saudi Arabia."
 ww1_levant.20.a:0 "Proclaim the kingdom."
 ww1_levant.21.t:0 "The Occupation of Kufra"
 ww1_levant.21.d:0 "Italian forces have occupied the Senussi oasis of Kufra in the Libyan interior."
 ww1_levant.21.a:0 "Establish control of the oasis."
 VICTORY_POINTS_4968:0 "Ha'il"
 ww1_levant.23.t:0 "British Troops Enter Mosul"
 ww1_levant.23.d:0 "British forces have entered Mosul after the armistice. Its military administration now joins that of Baghdad and Basra. The final frontier remains unsettled."
 ww1_levant.23.a:0 "Acknowledge the occupation."
 ww1_levant.24.t:0 "British Troops Land at Alexandretta"
 ww1_levant.24.d:0 "British troops have landed at the port of Alexandretta following the Ottoman armistice."
 ww1_levant.24.a:0 "Record the landing."
 ww1_levant.25.t:0 "A French Administration at Alexandretta"
 ww1_levant.25.d:0 "A French military governor takes charge of the Sanjak of Alexandretta on the Syrian coast."
 ww1_levant.25.a:0 "Acknowledge the new administration."
 ww1_levant.26.t:0 "Allied Garrisons Enter Cilicia"
 ww1_levant.26.d:0 "French-led forces are establishing garrisons along the Mersin–Tarsus–Adana route. Ottoman sovereignty over the districts remains unresolved."
 ww1_levant.26.a:0 "Record the garrisons."
 ww1_levant.27.t:0 "Italian Troops Land at Antalya"
 ww1_levant.27.d:0 "Italian troops have landed at Antalya to establish a base for their occupation of the southwestern coast."
 ww1_levant.27.a:0 "Record the landing."
 ww1_levant.28.t:0 "Italian Troops Leave Antalya"
 ww1_levant.28.d:0 "The last Italian troops are leaving Antalya. Turkish authorities resume control of the port."
 ww1_levant.28.a:0 "Receive the port."
 shammar.3.t:0 "A New Emir in Ha'il"
 shammar.3.d:0 "The ruling family is divided over terms with Ibn Saud. In Ha'il, Muhammad bin Talal Al Rashid has taken command of those determined to hold the town."
 shammar.3.a:0 "Stand with Muhammad bin Talal."
 ww1_levant.29.t:0 "Allied Troops Enter Constantinople"
 ww1_levant.29.d:0 "Allied warships have anchored off Constantinople. British, French and Italian troops are taking up positions in the Ottoman capital. The Ottoman government remains in the city."
 ww1_levant.29.a:0 "Receive the Allied commissioners."
 ww1_levant.30.t:0 "The Allies Leave Constantinople"
 ww1_levant.30.d:0 "The Allied garrison has evacuated Constantinople. Control of the city returns to the Turkish authorities."
 ww1_levant.30.a:0 "Take over the garrison posts."
 shammar.5.t:0 "Ibn Saud Takes al-Hasa"
 shammar.5.d:0 "Ibn Saud's forces have entered Hofuf. The Ottoman garrison is withdrawing, giving Nejd control of the oasis and access to the Gulf."
 shammar.5.a:0 "Appoint a governor at Hofuf."
 shammar.6.t:0 "The Siege of Ha'il"
 shammar.6.d:0 "Ibn Saud's forces have driven the Rashidi defenders back toward Ha'il. The town still holds, but supplies must get past the besiegers."
 shammar.6.a:0 "Distribute the remaining stores."
 SHA_siege_of_hail:0 "Siege of Ha'il"
 SHA_siege_of_hail_desc:0 "Nejdi forces are blockading the Rashidi capital. Food and supplies are becoming harder to bring into the town."
