l_english:
 rch_warlord: "The Warlord Era"
 rch_politics_navigation: "Government"
 rch_economy_navigation: "Finance and Industry"
 rch_army_navigation: "The Army"
 rch_diplomacy_navigation: "Foreign Affairs"
 rch_society_navigation: "Society"
 RC2_beijing_government: "The Beijing Government"
 RC2_beijing_government_desc: "The republic has a president, a parliament and a constitution, and none of them commands a division. Government is a negotiation between the men who do."
 RC2_constitution: "The 1923 Constitution"
 RC2_constitution_desc: "A constitution written by the government of the day is a constitution the next government will ignore. Write one anyway."
 RC2_parliament: "A Parliament Without Power"
 RC2_parliament_desc: "The chamber meets, quarrels and is dissolved whenever it becomes inconvenient. It is still the only place where opposition is legal."
 RC2_presidency: "The Presidency"
 RC2_presidency_desc: "The president appoints the premier, the governors and the generals. In practice the generals appoint the president."
 RC2_provincial_governors: "The Provincial Governors"
 RC2_provincial_governors_desc: "Governors collect taxes, raise troops and obey Beijing when it is convenient. The republic is a negotiation with twelve men."
 RC2_military_governors: "Government by Garrisons"
 RC2_military_governors_desc: "The garrison commander is the government in most of China. Recognise that and the republic has an administration. Deny it and it has a civil war."
 RC2_protection: "Constitutional Protection"
 RC2_protection_desc: "The south refuses to recognise the Beijing government and calls its own assembly. Legitimacy is now something two governments claim."
 RC2_presidential_election: "A Presidential Election"
 RC2_presidential_election_desc: "The assembly must elect a president and the generals must accept the result. Both conditions have never been met at once."
 RC2_parliamentary_settlement: "A Government of the Chamber"
 RC2_parliamentary_settlement_desc: "The chamber forms a cabinet and the provinces are asked to accept it. It is the republic's best idea and its weakest government."
 RC2_beiyang_settlement: "A Government of Commanders"
 RC2_beiyang_settlement_desc: "The Zhili and Fengtian commanders agree on a president and a premier. The government is stable for as long as the two of them agree."
 RC2_kmt_settlement: "The Nationalist Alternative"
 RC2_kmt_settlement_desc: "The party has reorganised, acquired advisers and an army, and claims to be the only legitimate government of China. Beijing calls it a faction in Guangdong."
 RC2_provincial_settlement: "A Compact of Governors"
 RC2_provincial_settlement_desc: "The governors sign a compact recognising Beijing in exchange for their own armies and revenues. It is the cheapest constitution available."
 RC2_chamber_budget: "A Budget for the Republic"
 RC2_chamber_budget_desc: "The chamber votes the budget and the army discovers it must ask for money."
 RC2_chamber_army: "Civilian Control"
 RC2_chamber_army_desc: "A war ministry answerable to civilians is the republic's real defence against its own generals."
 RC2_chamber_capstone: "A Parliamentary Republic"
 RC2_chamber_capstone_desc: "The chamber has survived a president, two premiers and a war. The republic is a government of argument."
 RC2_chamber_organise: "Organising the Provinces"
 RC2_chamber_organise_desc: "Extend the winning settlement into the counties, where government is a magistrate and a tax collector."
 RC2_zhili_compact: "The Zhili Compact"
 RC2_zhili_compact_desc: "The Zhili commanders divide the ministries and the provinces between them."
 RC2_fengtian_accord: "The Fengtian Accord"
 RC2_fengtian_accord_desc: "Zhang Zuolin's Fengtian army is the strongest force outside Beijing. Buy it or fight it."
 RC2_beiyang_capstone: "A Stable Military Republic"
 RC2_beiyang_capstone_desc: "The commanders have agreed a president, a cabinet and a budget. It is a government, and it is theirs."
 RC2_beiyang_organise: "Organising the Provinces"
 RC2_beiyang_organise_desc: "Extend the winning settlement into the counties, where government is a magistrate and a tax collector."
 RC2_whampoa: "The Whampoa Academy"
 RC2_whampoa_desc: "A military academy that trains officers for the party rather than for a province."
 RC2_party_congress: "A Party Congress"
 RC2_party_congress_desc: "A congress of delegates gives the movement a civilian authority over its own army."
 RC2_kmt_capstone: "A Government in Waiting"
 RC2_kmt_capstone_desc: "The party has an army, a congress and a province. It is ready for the north."
 RC2_kmt_organise: "Organising the Provinces"
 RC2_kmt_organise_desc: "Extend the winning settlement into the counties, where government is a magistrate and a tax collector."
 RC2_provincial_council: "A Council of Governors"
 RC2_provincial_council_desc: "A standing council of governors turns the compact from a bargain into an institution."
 RC2_provincial_finance: "Provincial Finance"
 RC2_provincial_finance_desc: "Each province keeps its land tax and pays a quota to Beijing."
 RC2_provincial_capstone: "A Republic of Provinces"
 RC2_provincial_capstone_desc: "The governors have built a working confederation on the ruins of the republic."
 RC2_provincial_organise: "Organising the Provinces"
 RC2_provincial_organise_desc: "Extend the winning settlement into the counties, where government is a magistrate and a tax collector."
 RC2_industrial_recovery: "Industrial Recovery"
 RC2_industrial_recovery_desc: "The war is over and the mills can return to cotton, flour and silk. A government that cannot feed its cities will not survive the next winter."
 RC2_railways: "Railways and Warlords"
 RC2_railways_desc: "Every railway is controlled by the commander whose province it crosses. A national network is a political project before it is an economic one."
 RC2_banking: "The Banking Group"
 RC2_banking_desc: "Shanghai's bankers will lend to a government that looks stable. Their loans are the republic's only reliable revenue."
 RC2_agriculture: "The Rural Crisis"
 RC2_agriculture_desc: "Rents, banditry and taxes are emptying the countryside. Land reform is expensive and the alternative is a peasantry that supports whoever promises it land."
 RC2_customs: "The Customs Revenue"
 RC2_customs_desc: "The maritime customs still collects, still employs foreigners and still pays the foreign loans first. Reform it and the government gains a revenue."
 RC2_economy_capstone: "A Working Economy"
 RC2_economy_capstone_desc: "The republic has banks, railways and a customs service. It is not rich, and it can pay for a government."
 RC2_army: "The Armies of the Republic"
 RC2_army_desc: "China has a dozen armies and no army. The first task of any government is to decide which of them it can pay."
 RC2_officer_corps: "A National Officer Corps"
 RC2_officer_corps_desc: "Officers trained in the same academies and paid from the same budget begin to think of themselves as one army."
 RC2_arsenal: "The Arsenal Programme"
 RC2_arsenal_desc: "Rifles and ammunition made in China are cheaper than imports and harder to embargo."
 RC2_air_force: "A Chinese Air Force"
 RC2_air_force_desc: "Aircraft are expensive and the warlords have none. A small air force is a decisive advantage in a civil war."
 RC2_unified_command: "A Unified Command"
 RC2_unified_command_desc: "One staff, one plan and one budget for the whole army is the end of warlordism in military form."
 RC2_army_capstone: "One Army"
 RC2_army_capstone_desc: "The republic has a staff, an arsenal and a unified command. Whether it has a government that can use them is a different question."
 RC2_washington: "The Washington Conference"
 RC2_washington_desc: "The powers are dividing the Pacific and China is on the agenda. A treaty that guarantees Chinese territorial integrity is worth more than a division."
 RC2_unequal_treaties: "Revising the Treaties"
 RC2_unequal_treaties_desc: "Extraterritoriality, the tariff and the legations are the three marks of inequality. Negotiate them one at a time."
 RC2_soviet_aid: "Soviet Aid"
 RC2_soviet_aid_desc: "Moscow will send advisers, money and weapons to a movement that opposes the treaty powers. The aid has conditions attached."
 RC2_japan: "The Japanese Pressure"
 RC2_japan_desc: "Japan wants the railway zone, the mines and a government in Beijing that signs what it is given. Every year of peace is preparation for the demand that cannot be signed."
 RC2_league: "A Seat at the League"
 RC2_league_desc: "The League of Nations can be used by a weak government to embarrass a strong neighbour. It cannot do more than embarrass."
 RC2_diplomacy_capstone: "A Recognised Republic"
 RC2_diplomacy_capstone_desc: "China is recognised, represented and occasionally listened to. In a decade of warlordism, that is a foreign policy."
 RC2_may_thirtieth: "The May Thirtieth Movement"
 RC2_may_thirtieth_desc: "Foreign police have fired on Chinese demonstrators in Shanghai. The city is on strike and the government must choose between the powers and the crowd."
 RC2_student_politics: "Student Politics"
 RC2_student_politics_desc: "Students organise, strike and publish. A government that suppresses them loses the cities; one that tolerates them loses the narrative."
 RC2_labour: "The Labour Movement"
 RC2_labour_desc: "Shanghai's unions can stop the docks. Whether they are a partner or a threat depends on who reaches them first."
 RC2_society_capstone: "A National Public"
 RC2_society_capstone_desc: "Newspapers, unions, students and a shared grievance have produced something the republic never had: a public that expects to be addressed."
