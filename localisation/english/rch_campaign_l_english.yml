l_english:
 rch_beiyang_republic: "The Beiyang Republic"
 rch_beiyang_republic_desc: "The presidency, the ministries and the provinces are run by officers who made the revolution and now own its government. The republic has elections, a parliament and a chain of command that outranks both."
 rch_parliamentary_republic: "A Parliamentary Republic"
 rch_parliamentary_republic_desc: "The assembly forms the cabinet and the president signs what it sends him. Government is slow, public and legitimate, and every coalition is one budget away from collapse."
 rch_nationalist_government: "The Nationalist Government"
 rch_nationalist_government_desc: "The party governs the state, the army and the schools, and claims to represent the nation rather than a faction. It is the most effective government China has had since 1911."
 rch_provincial_union: "A Union of Provinces"
 rch_provincial_union_desc: "The provinces keep their taxes, their armies and their governors, and Beijing keeps the name of China and the foreign ministry. The union is real, voluntary and permanently negotiated."
 rch_warlord_armies: "The Warlord Armies"
 rch_warlord_armies_desc: "The republic's divisions belong to commanders who pay them from provincial revenue. They fight well for the man who pays them and not at all for a government in Beijing."
 rch_new_army: "The National Army"
 rch_new_army_desc: "A small force with a national staff, foreign instructors and a budget. It is not large enough to fight a great power and it is large enough to matter in a civil war."
 rch_party_army: "The Party Army"
 rch_party_army_desc: "Officers are trained in party academies and commissioned into a party army. It fights for a programme as well as a paymaster, which makes it more dangerous and harder to dismiss."
 rch_empty_treasury: "The Empty Treasury"
 rch_empty_treasury_desc: "The government collects a fraction of what it spends and borrows against revenue it has already pledged. Every ministry begins the year with a shortfall and ends it with arrears."
 rch_foreign_tutelage: "Foreign Tutelage"
 rch_foreign_tutelage_desc: "The customs, the salt revenue and the railways are administered under foreign supervision because the loans depend on it. The government governs with a foreign accountant at its elbow."
 rch_japanese_pressure: "Japanese Pressure"
 rch_japanese_pressure_desc: "Japan treats China as a market, a frontier and a future colony. Every government in Beijing faces the same demands and the same calculation about what can be refused."

 rch_government: "The Republican Government"
 rch_government_desc: "The presidency, the assembly, the party and the provinces."
 rch_reconstruction: "Reconstruction and Revenue"
 rch_reconstruction_desc: "Railways, arsenals, currency and relief."
 rch_foreign_policy: "Republican Diplomacy"
 rch_foreign_policy_desc: "Loans, advisers, treaties and the Japanese question."

 rch_decision_assembly_session: "Convene the Assembly"
 rch_decision_assembly_session_desc: "Let the chamber sit, debate and vote. It will demand more than it was offered and it will be harder to dismiss afterwards."
 rch_decision_presidential_decree: "Rule by Presidential Decree"
 rch_decision_presidential_decree_desc: "Govern through the presidency and the garrison commanders. It is fast, effective and it is not what the republic was declared for."
 rch_decision_party_campaign: "A Party Campaign"
 rch_decision_party_campaign_desc: "Send organisers into the schools, the factories and the villages and build a movement that reaches further than the state does."
 rch_decision_provincial_conference: "A Conference of Governors"
 rch_decision_provincial_conference_desc: "Bring the governors to the capital, hear their demands and buy their agreement with revenue and appointments."
 rch_decision_army_pay: "Pay the Army"
 rch_decision_army_pay_desc: "Pay the divisions on time and in full. The treasury will complain and the officers will remember."
 rch_decision_officer_purge: "Purge the Officer Corps"
 rch_decision_officer_purge_desc: "Remove the commanders whose loyalty is doubtful and promote the ones whose careers depend on the government."
 rch_decision_constitution: "Promulgate a Constitution"
 rch_decision_constitution_desc: "Write the government's powers and the citizen's rights into a single document and accept that it will be quoted against the government."
 rch_decision_land_reform: "Reduce Rents"
 rch_decision_land_reform_desc: "Cap rents and fund credit cooperatives. The countryside will support the government and the gentry will look for a new one."
 rch_project_railway: "Build a Trunk Railway"
 rch_project_railway_desc: "A state line from the capital into the interior, with the troops and the depots to keep it running."
 rch_project_arsenal: "Expand the Arsenal"
 rch_project_arsenal_desc: "A rifle line, a machine shop and an ammunition works at Shanghai."
 rch_project_nanjing_industry: "Industry at Nanjing"
 rch_project_nanjing_industry_desc: "Power, textiles and machine shops around the capital, where the government can actually protect them."
 rch_project_whampoa: "Found a Military Academy"
 rch_project_whampoa_desc: "An academy with a curriculum, a training ground and an officer corps that owes its commission to the government."
 rch_project_currency: "Reform the Currency"
 rch_project_currency_desc: "One national currency, one issuing bank and one exchange rate for the provinces that accept it."
 rch_project_relief: "Organise Relief"
 rch_project_relief_desc: "Granaries, relief columns and a provincial reporting system that works before the famine does."
 rch_diplomacy_british_loan: "Negotiate a British Loan"
 rch_diplomacy_british_loan_desc: "London will lend against the customs revenue and expect a say in how it is spent."
 rch_diplomacy_soviet_advisers: "Accept Soviet Advisers"
 rch_diplomacy_soviet_advisers_desc: "Moscow will send officers, money and weapons to a government that opposes the treaty powers."
 rch_diplomacy_league_appeal: "Appeal to the League"
 rch_diplomacy_league_appeal_desc: "Put the Japanese question before the League of Nations and accept that it can condemn and not prevent."
 rch_diplomacy_german_mission: "Invite a German Mission"
 rch_diplomacy_german_mission_desc: "German officers and German rifles, at the price of German influence and Japanese suspicion."
