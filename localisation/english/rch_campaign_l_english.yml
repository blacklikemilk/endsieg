l_english:
 rch_beiyang_republic: "The Beiyang Republic"
 rch_beiyang_republic_desc: "The presidency, the ministries and the provinces are run by officers who made the revolution and now own its government. The republic has elections, a parliament and a chain of command that outranks both."
 rch_parliamentary_republic: "A Parliamentary Republic"
 rch_parliamentary_republic_desc: "The assembly forms the cabinet and the president signs what it sends him. Government is slow, public and legitimate, and every coalition is one budget away from collapse."
 rch_nationalist_government: "The Nationalist Government"
 rch_nationalist_government_desc: "The party governs the state, the army and the schools, and claims to represent the nation rather than a faction. It is the most effective government China has had since 1911."
 rch_provincial_union: "A Union of Provinces"
 rch_provincial_union_desc: "The provinces keep their taxes, their armies and their governors, and Beijing keeps the name of China and the foreign ministry. The union is real, voluntary and permanently negotiated."
 rch_warlord_armies: "The Warlord Armies"
 rch_warlord_armies_desc: "The republic's divisions belong to commanders who pay them from provincial revenue. They fight well for the man who pays them and not at all for a government in Beijing."
 rch_new_army: "The National Army"
 rch_new_army_desc: "A small force with a national staff, foreign instructors and a budget. It is not large enough to fight a great power and it is large enough to matter in a civil war."
 rch_party_army: "The Party Army"
 rch_party_army_desc: "Officers are trained in party academies and commissioned into a party army. It fights for a programme as well as a paymaster, which makes it more dangerous and harder to dismiss."
 rch_empty_treasury: "The Empty Treasury"
 rch_empty_treasury_desc: "The government collects a fraction of what it spends and borrows against revenue it has already pledged. Every ministry begins the year with a shortfall and ends it with arrears."
 rch_foreign_tutelage: "Foreign Tutelage"
 rch_foreign_tutelage_desc: "The customs, the salt revenue and the railways are administered under foreign supervision because the loans depend on it. The government governs with a foreign accountant at its elbow."
 rch_japanese_pressure: "Japanese Pressure"
 rch_japanese_pressure_desc: "Japan treats China as a market, a frontier and a future colony. Every government in Beijing faces the same demands and the same calculation about what can be refused."

 rch_government: "The Republican Government"
 rch_government_desc: "The presidency, the assembly, the party and the provinces."
 rch_reconstruction: "Reconstruction and Revenue"
 rch_reconstruction_desc: "Railways, arsenals, currency and relief."
 rch_foreign_policy: "Republican Diplomacy"
 rch_foreign_policy_desc: "Loans, advisers, treaties and the Japanese question."

 rch_decision_assembly_session: "Convene the Assembly"
 rch_decision_assembly_session_desc: "Let the chamber sit, debate and vote. It will demand more than it was offered and it will be harder to dismiss afterwards."
 rch_decision_presidential_decree: "Rule by Presidential Decree"
 rch_decision_presidential_decree_desc: "Govern through the presidency and the garrison commanders. It is fast, effective and it is not what the republic was declared for."
 rch_decision_party_campaign: "A Party Campaign"
 rch_decision_party_campaign_desc: "Send organisers into the schools, the factories and the villages and build a movement that reaches further than the state does."
 rch_decision_provincial_conference: "A Conference of Governors"
 rch_decision_provincial_conference_desc: "Bring the governors to the capital, hear their demands and buy their agreement with revenue and appointments."
 rch_decision_army_pay: "Pay the Army"
 rch_decision_army_pay_desc: "Pay the divisions on time and in full. The treasury will complain and the officers will remember."
 rch_decision_officer_purge: "Purge the Officer Corps"
 rch_decision_officer_purge_desc: "Remove the commanders whose loyalty is doubtful and promote the ones whose careers depend on the government."
 rch_decision_constitution: "Promulgate a Constitution"
 rch_decision_constitution_desc: "Write the government's powers and the citizen's rights into a single document and accept that it will be quoted against the government."
 rch_decision_land_reform: "Reduce Rents"
 rch_decision_land_reform_desc: "Cap rents and fund credit cooperatives. The countryside will support the government and the gentry will look for a new one."
 rch_project_railway: "Build a Trunk Railway"
 rch_project_railway_desc: "A state line from the capital into the interior, with the troops and the depots to keep it running."
 rch_project_arsenal: "Expand the Arsenal"
 rch_project_arsenal_desc: "A rifle line, a machine shop and an ammunition works at Shanghai."
 rch_project_nanjing_industry: "Industry at Nanjing"
 rch_project_nanjing_industry_desc: "Power, textiles and machine shops around the capital, where the government can actually protect them."
 rch_project_whampoa: "Found a Military Academy"
 rch_project_whampoa_desc: "An academy with a curriculum, a training ground and an officer corps that owes its commission to the government."
 rch_project_currency: "Reform the Currency"
 rch_project_currency_desc: "One national currency, one issuing bank and one exchange rate for the provinces that accept it."
 rch_project_relief: "Organise Relief"
 rch_project_relief_desc: "Granaries, relief columns and a provincial reporting system that works before the famine does."
 rch_diplomacy_british_loan: "Negotiate a British Loan"
 rch_diplomacy_british_loan_desc: "London will lend against the customs revenue and expect a say in how it is spent."
 rch_diplomacy_soviet_advisers: "Accept Soviet Advisers"
 rch_diplomacy_soviet_advisers_desc: "Moscow will send officers, money and weapons to a government that opposes the treaty powers."
 rch_diplomacy_league_appeal: "Appeal to the League"
 rch_diplomacy_league_appeal_desc: "Put the Japanese question before the League of Nations and accept that it can condemn and not prevent."
 rch_diplomacy_german_mission: "Invite a German Mission"
 rch_diplomacy_german_mission_desc: "German officers and German rifles, at the price of German influence and Japanese suspicion."
 rch_save_the_republic: "Save the Republic"
 rch_save_the_republic_desc: "The Republic has one year to prove that it can govern China. The mission states the conditions survival requires, and it is won on the first day every one of them stands together. If the year passes without them, the Republic falls."
 rch_save_the_republic_terms_tt: "The mission succeeds only while all of these hold at once. The government controls Beiping. Legitimacy is 80 or higher. Stability is above 55 percent. More than 150 political power remains unspent. The Republic is at war with nobody. One political programme has been carried through, either the 1936 constitution, a cabinet government, a Beiyang command that answers to the government, a party army or a provincial compact. One foreign or financial programme is in place, either the currency reform, the German military mission, the British loan or the Whampoa academy."
 rch_republic_endures: "The Republic Endures"
 rch_republic_endures_desc: "The government held the capital, the provinces and the army through the crisis that broke every previous republic. Foreign observers who had written China off as a geographical expression have had to revise their dispatches."
 rch_rescue_off_script: "History is not following its historical course"
 rch_constitution_1936: "The 1936 constitution has been promulgated"
 rch_cabinet_government: "A cabinet government has been formed"
 rch_beiyang_command: "The Beiyang command answers to the government"
 rch_provincial_compact: "The provinces have signed the compact"
 rch_currency_reform: "The currency has been reformed"
 rch_german_mission: "The German military mission is in place"
 rch_british_loan: "The British loan has been secured"
 rch_whampoa: "The Whampoa academy is established"

 rch_beiyang_order_category: "The Beiyang Order"
 rch_beiyang_order_category_desc: "The republic's civil government and its military governors press their claims on the same presidency. Each reform the government writes into law can be undone by the commanders who guarantee it, and neither side can act twice in a season.\n\nOn 12 December 1915 the government's record is closed. The constitution, the rotation of the officer corps, the civil governors and the funding of the ministries count only if each has stood for more than 180 days on that day, and nothing taken later can be added. The seat that follows is judged on that count, on a crown refused, on the government's legitimacy, on the strength of the nationalist cause, on the army's share of power, on the military governors appointed, on the hold on Beijing and on war with another Chinese government."
 RCH_beiyang_order: "The Beiyang Order"
 RCH_side_civil: "The Civil Government"
 RCH_side_military: "The Military Governors"
 RCH_bop_settlement: "The Shared Presidency"
 RCH_bop_civil_ascendant: "The Ministries Ascendant"
 RCH_bop_civil_supremacy: "Government by the Assembly"
 RCH_bop_military_government: "The Commanders in the Cabinet"
 RCH_bop_military_supremacy: "Rule by the Garrison"
 rch_press_family_available: "The government has not pressed this matter in the past six months."

 rch_press_constitution_civil: "Press the Constitution"
 rch_press_constitution_civil_desc: "Publish the constitution, seat the provincial delegates who support it and let the press print the text. The government gains a standard it can be measured against and the commanders gain a document they did not sign."
 rch_press_constitution_military: "Suspend the Constitution"
 rch_press_constitution_military_desc: "Suspend the constitution, close the provincial delegations and govern through the presidency and the garrison. The commanders will be satisfied and the republic's claim to law will not survive the year."
 rch_press_army_civil: "Rotate the Officer Corps"
 rch_press_army_civil_desc: "Move the commanders between provinces, promote the staff officers who owe their careers to the government and pay for the transfers out of the army's own training budget."
 rch_press_army_military: "Confirm the Commanders"
 rch_press_army_military_desc: "Confirm the provincial commanders in their posts and let them keep the troops they have raised. The army stays loyal to the men who pay it."
 rch_press_provinces_civil: "Install Civil Governors"
 rch_press_provinces_civil_desc: "Send civilian governors to the provinces with a budget, a court and an inspectorate, and take the collection of taxes away from the garrison."
 rch_press_provinces_military: "Appoint Military Governors"
 rch_press_provinces_military_desc: "Appoint the provincial commanders as military governors with control of revenue and policing. The provinces will be governed, and they will be governed by their garrisons."
 rch_press_money_civil: "Fund the Ministries"
 rch_press_money_civil_desc: "Pay the ministries, the courts and the schools out of the ordinary revenue, and let the treasury carry the cost of governing without the army's permission."
 rch_press_money_military: "Borrow Against the Provinces"
 rch_press_money_military_desc: "Borrow against provincial revenue, pledge the salt and customs receipts and give the commanders a share of the loan. The treasury is filled and the creditors now include every garrison in the country."

 rch_succession_constitutional: "The Constitutional Seat"
 rch_succession_constitutional_desc: "The presidency governs under a constitution that the assembly wrote and the provinces accepted. The government collects its own revenue, appoints its own governors and can be removed only by the process it published.\n\nSeat standing: [?rch_succession_final_score|0] out of 100."
 rch_succession_contested: "The Contested Seat"
 rch_succession_contested_desc: "The government holds the capital and the east, and the south holds a government of its own. Neither can defeat the other and neither will recognise the other's authority beyond the provinces it actually administers.\n\nSeat standing: [?rch_succession_final_score|0] out of 100."
 rch_succession_garrison: "The Garrison Seat"
 rch_succession_garrison_desc: "The presidency rests on the divisions around Beijing. The army is loyal, paid and politically decisive, and every ministry governs on the understanding that the garrison could replace it before the week is out.\n\nSeat standing: [?rch_succession_final_score|0] out of 100."
 rch_succession_dissolved: "The Dissolved Seat"
 rch_succession_dissolved_desc: "The presidency is a title the commanders tolerate and the provinces ignore. Revenue reaches the capital only when a garrison chooses to send it, and the government's orders travel no further than its own telegraph line.\n\nSeat standing: [?rch_succession_final_score|0] out of 100."
