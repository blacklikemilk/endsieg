l_english:

 # The Cortes bills and the negotiation that decides them.
 # Keys for common/decisions/spain_cortes.txt, events/spain_cortes_bills.txt and
 # common/scripted_effects/spain_cortes_bills.txt.

 SPR_bill_budget: "Bring the Budget to the Floor"
 SPR_bill_budget_desc: "The Treasury's figures go before the chamber. §GThe government, the Liberals and the Conservatives carry them§!; the republican and socialist benches vote against a budget that pays the officer corps. Carrying it needs 201 of the 400 seats, and a government short of that has to buy the difference."
 SPR_bill_agrarian_reform: "Bring the Agrarian Bill"
 SPR_bill_agrarian_reform_desc: "§GThe republican, socialist and Liberal benches back resettlement of the great estates§!. The landowners' benches will vote for it only if the estates are paid for, and the day labourers of the south have already been told what it promises."
 SPR_bill_labour_charter: "Bring the Labour Charter"
 SPR_bill_labour_charter_desc: "§GSocialists, republicans and Liberals back hours, wages and the right to organise§!, written into law. The Conservative benches will vote for a charter with the right to organise struck out, which is a different law and a different country."
 SPR_bill_army_budget: "Bring the Army Budget"
 SPR_bill_army_budget_desc: "§GMonarchists, Conservatives, Liberals and the Falange back the officer corps' credits§!. The Liberals will vote for the army in barracks but not for the Africanistas in the Directorate, and their price for the difference is a commission of enquiry."
 SPR_bill_regional_statute: "Bring the Regional Statute"
 SPR_bill_regional_statute_desc: "§GRepublicans, socialists and Liberals back autonomy for Catalonia and the Basque provinces§!. The Conservative benches will vote for it once the Captain-General has been reassured that the statute costs the army nothing, and reassurance is never free."
 SPR_bill_electoral_law: "Bring the Electoral Law"
 SPR_bill_electoral_law_desc: "§GA new franchise and a new register, carried by the government and the Republican and Socialist benches§!. The Monarchists, Conservatives, Carlists and Falange will not enfranchise the voters who would unseat them, and the election follows the law at once: the government that brings it gambles its majority on the voters it has just enfranchised."

 spain_bill_dissolved_tt: "§RThe Cortes is dissolved.§! No bill can be brought before a chamber that is not sitting."
 spain_bill_cooldown_tt: "§RThis bill has just been withdrawn or lost.§! It cannot return to the order paper yet."
 spain_bill_reach_budget_tt: "§YThe chamber can still carry the budget.§! Its committed benches hold a majority of the 400 seats, or the government is close enough that the Liberals could be bought."
 spain_bill_reach_agrarian_tt: "§YThe chamber can still carry the agrarian bill.§! Its committed benches hold a majority of the 400 seats, or the government is close enough that the landowners' benches could be bought."
 spain_bill_reach_labour_tt: "§YThe chamber can still carry the labour charter.§! Its committed benches hold a majority of the 400 seats, or the government is close enough that the Conservative benches could be bought."
 spain_bill_reach_army_tt: "§YThe chamber can still carry the army budget.§! Its committed benches hold a majority of the 400 seats, or the government is close enough that the Liberals could be bought."
 spain_bill_reach_statute_tt: "§YThe chamber can still carry the regional statute.§! Its committed benches hold a majority of the 400 seats, or the government is close enough that the Conservative benches could be bought."
 spain_bill_reach_electoral_tt: "§YThe government's own benches with the Republican and Socialist deputies can bring a new franchise to the floor.§! They need not hold a majority to bring it, and no bench's votes can be bought for a franchise: a bloc short of the 201 seats the law needs can only reform the register or withdraw the bill."

 spain_bills.1.t: "The Budget Before the Chamber"
 spain_bills.1.d: "§YThe Cortes divides on the budget§!, and the whips have been counting for a week. [?spain_bill_votes] deputies are committed to the government's figures; [?spain_bill_needed] are needed to carry them.\n\nThe Treasury wants its room, the Crown wants the credit for a chamber that votes its taxes, and the benches that are short of a majority want to be paid for their trouble."
 spain_bills.1.a: "Call the vote and take the majority"
 spain_bills.1.a.tt: "§GThe budget passes as written.§! The Treasury gains room, stability improves and the Crown takes the credit for it."
 spain_bills.1.b: "Buy the Liberals with the Catalan question"
 spain_bills.1.b.tt: "§YThe Liberal benches vote for the budget.§! The Catalan question is reopened, the Conservatives will not forgive it, and the Liberal benches take the credit for the money."
 spain_bills.1.c: "Water the budget down"
 spain_bills.1.c.tt: "§RThe appropriations pass, the political credit does not.§! The Treasury gains its room and the chamber grumbles about the rest."
 spain_bills.1.e: "Withdraw the budget"
 spain_bills.1.e.tt: "§RThe government loses the session.§! Stability falls, the army reads weakness in it and the governing party loses support."

 spain_bills.2.t: "The Agrarian Bill"
 spain_bills.2.d: "§YResettlement of the great estates is on the order paper§!. [?spain_bill_votes] deputies are committed to it and [?spain_bill_needed] are needed.\n\nThe republican, socialist and Liberal benches wrote the bill. The landowners' benches will vote for it only if the estates are paid for, and in the south the day labourers have already been told what it promises."
 spain_bills.2.a: "Carry the reform as written"
 spain_bills.2.a.tt: "§GThe estates are broken up.§! Agriculture develops, the countryside is unsettled by it and the government takes the credit."
 spain_bills.2.b: "Compensate the grandees"
 spain_bills.2.b.tt: "§YThe reform passes with the estates paid for.§! The Conservatives and the Carlists keep their hold on the countryside, and the Treasury pays for the land twice over."
 spain_bills.2.c: "Water the settlement down"
 spain_bills.2.c.tt: "§RA smaller settlement passes.§! Agriculture develops less, stability still suffers and the government gains nothing from it."
 spain_bills.2.e: "Withdraw the bill"
 spain_bills.2.e.tt: "§RThe reform dies on the order paper.§! Stability falls, the army reads weakness in it and the governing party loses support."

 spain_bills.3.t: "The Labour Charter"
 spain_bills.3.d: "§YThe charter is on the order paper§! with [?spain_bill_votes] deputies behind it against [?spain_bill_needed] needed.\n\nHours and wages are agreed. The right to organise is the question: the socialist and republican benches will not sign without it, the Conservative benches will not sign with it, and the unions are counting the votes in the street."
 spain_bills.3.a: "Write the charter as agreed"
 spain_bills.3.a.tt: "§GThe charter becomes law with the right to organise in it.§! Conciliation replaces repression, industry gains and the socialist benches gain with it."
 spain_bills.3.b: "Soften the text for the Conservative benches"
 spain_bills.3.b.tt: "§YThe charter passes with the right to organise struck out.§! The Conservative benches take the credit, the socialist benches call it a betrayal and the strike funds grow."
 spain_bills.3.c: "Water the charter down"
 spain_bills.3.c.tt: "§RA charter of hours alone passes.§! Industry gains a little, stability suffers and no bench is satisfied."
 spain_bills.3.e: "Withdraw the charter"
 spain_bills.3.e.tt: "§RThe charter is withdrawn.§! Stability falls, the army reads weakness in it and the governing party loses support."

 spain_bills.4.t: "The Army Budget"
 spain_bills.4.d: "§YThe officer corps' credits come to the floor§! with [?spain_bill_votes] deputies behind them and [?spain_bill_needed] needed.\n\nMonarchists, Conservatives, Liberals and the Falange all say they support the army. The Liberals mean the army in barracks, not the Africanistas in the Directorate, and that difference is the whole vote."
 spain_bills.4.a: "Vote the credits as the General Staff asked"
 spain_bills.4.a.tt: "§GThe army is paid.§! Loyalty rises, war support improves and coup pressure falls."
 spain_bills.4.b: "Accept the Liberals' watch on the Africanistas"
 spain_bills.4.b.tt: "§YThe credits pass with a commission of enquiry attached.§! The army is paid and insulted at once: coup pressure falls, though not as far as a clean vote would have taken it, and the barracks keep the insult. The republican benches lose ground with the officers' friends."
 spain_bills.4.c: "Cut the appropriation"
 spain_bills.4.c.tt: "§RA reduced appropriation passes.§! Loyalty rises less, coup pressure falls less and the barracks notice both."
 spain_bills.4.e: "Withdraw the army budget"
 spain_bills.4.e.tt: "§RThe army is left unpaid.§! Stability falls, coup pressure grows and the governing party loses support."

 spain_bills.5.t: "The Regional Statute"
 spain_bills.5.d: "§YAutonomy for Catalonia and the Basque provinces is before the chamber§! with [?spain_bill_votes] deputies behind it and [?spain_bill_needed] needed.\n\nThe republican, socialist and Liberal benches wrote it. The Conservative benches will vote for it if the Captain-General is reassured that the statute costs the army nothing, and the Captain-General has never been reassured for free."
 spain_bills.5.a: "Grant the statute as drafted"
 spain_bills.5.a.tt: "§GAutonomy is granted.§! Catalan and Basque autonomy rise, stability suffers and the government takes the credit."
 spain_bills.5.b: "Reassure the Captain-General"
 spain_bills.5.b.tt: "§YThe Conservative benches come across and the statute passes.§! Military loyalty falls for good: the officer corps has been told that the regions are a political matter and that the army has no say in them."
 spain_bills.5.c: "Grant a narrower statute"
 spain_bills.5.c.tt: "§RA reduced statute passes.§! Autonomy rises less, stability suffers and the government gains nothing from it."
 spain_bills.5.e: "Withdraw the statute"
 spain_bills.5.e.tt: "§RThe statute is withdrawn.§! Stability falls, the army reads weakness in it and the governing party loses support."

 spain_bills.6.t: "The Electoral Law"
 spain_bills.6.d: "§YThe government puts a new franchise before the chamber§!. [?spain_bill_votes] of the 400 seats are committed and [?spain_bill_needed] are needed.\n\nThe Republican and Socialist deputies vote for the register that would bring them the voters; the Monarchists, Conservatives, Carlists and Falange will not vote for the franchise that would unseat them. The election follows the law at once, so the government that carries the bill gambles its majority on the voters it has just enfranchised."
 spain_bills.6.a: "Dissolve into the new franchise"
 spain_bills.6.a.tt: "§GA new franchise and a new register become law.§! The chamber gains authority over the Crown, and the country goes to the polls at once."
 spain_bills.6.b: "Reform the register only"
 spain_bills.6.b.tt: "§YThe register is reformed and the upper chambers keep their veto.§! The election still follows, stability suffers and the government gets no credit for the reform."
 spain_bills.6.c: "Withdraw the bill"
 spain_bills.6.c.tt: "§RThe reform dies.§! Stability falls, the army reads weakness in it and the governing party loses support."

 spain_bills.90.t: "The Clerk of the Chamber"
 spain_bills.90.d: "The clerk counts the committed benches and reports the tally to the government whips."
 spain_bills.90.a: "Noted."
