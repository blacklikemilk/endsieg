l_english:
 qing_ww2: "The Qing and the Second World War"
 qing_politics_navigation: "Court and Government"
 qing_economy_navigation: "Treasury and Industry"
 qing_army_navigation: "The Army"
 qing_diplomacy_navigation: "Foreign Affairs"
 qing_provinces_navigation: "The Provinces"
 QW3_wartime_government: "The Wartime Government"
 QW3_wartime_government_desc: "The dynasty has governed China for a quarter of a century and now has to defend it. Every institution it built is about to be tested by an enemy that has been preparing for this war since 1931."
 QW3_constitutional_war: "The Chamber at War"
 QW3_constitutional_war_desc: "A parliament at war must vote the budget, consent to conscription and tolerate emergency powers. It can do all three and survive, or do them and be suspended."
 QW3_constitutional_emergency: "Emergency Powers"
 QW3_constitutional_emergency_desc: "The cabinet asks for the power to govern by decree for the duration. Grant it and the war is fought efficiently. Refuse it and the war is fought constitutionally."
 QW3_constitutional_coalition: "A War Coalition"
 QW3_constitutional_coalition_desc: "Bring the Nationalists and the provincial leaders into a coalition and the war becomes a national effort. It also gives the dynasty's enemies a place in government."
 QW3_constitutional_capstone: "The Constitution Holds"
 QW3_constitutional_capstone_desc: "The chamber has voted the war budget, the cabinet has governed and the crown has not dissolved anything. The settlement has survived the one test that matters."
 QW3_authoritarian_war: "The Court at War"
 QW3_authoritarian_war_desc: "The court governs alone and the war is its justification. Every failure is now a judgement on the dynasty rather than on a cabinet."
 QW3_authoritarian_decree: "Government by Decree"
 QW3_authoritarian_decree_desc: "Rescripts can move an army and close a newspaper in the same afternoon. In wartime that is an advantage, and it is also why nobody will tell the court the truth."
 QW3_authoritarian_terror: "The Security Bureau"
 QW3_authoritarian_terror_desc: "A political police that can arrest a governor without evidence is a weapon against treason and a temptation against competence. Build it and the court will use it."
 QW3_authoritarian_capstone: "The Dynasty at War"
 QW3_authoritarian_capstone_desc: "The court has centralised the war effort, silenced the opposition and held the north. It has also made itself the only thing standing between China and chaos, which is exactly the argument it wanted."
 QW3_yuan_war: "The Army's War"
 QW3_yuan_war_desc: "The Beiyang command runs the war and the government follows it. Decisions are fast, supplies are prioritised by rank and the provinces are expected to obey."
 QW3_yuan_mobilisation: "General Mobilisation"
 QW3_yuan_mobilisation_desc: "The army wants every man, every horse and every truck. Give it all three and the countryside will remember the year the soldiers took the harvest."
 QW3_yuan_command: "A Unified Command"
 QW3_yuan_command_desc: "One commander, one staff and one plan for the whole front. The provinces will lose their separate armies and the army will lose its separate politics."
 QW3_yuan_capstone: "The Army Wins the War"
 QW3_yuan_capstone_desc: "The Beiyang command has fought the war its own way and the dynasty has survived it. The army is now the state in everything but name, and everyone knows it."
 QW3_federal_war: "The Provinces at War"
 QW3_federal_war_desc: "Every province fights with its own army and pays for it out of its own revenue. Coordination is slow, and the Japanese advance is not."
 QW3_federal_war_council: "A Federal War Council"
 QW3_federal_war_council_desc: "A council of provincial commanders can agree a strategy if the centre gives up the pretence of commanding them. It is slower than a general staff and more legitimate."
 QW3_federal_levies: "Provincial Levies"
 QW3_federal_levies_desc: "The provinces will raise troops if the centre pays and will not if it does not. A subsidy system is expensive and the only army a federal China can have."
 QW3_federal_capstone: "A Union at War"
 QW3_federal_capstone_desc: "The provinces have fought a war together without dissolving the union. That is the first thing a federal China has done that an empire could not."
 QW3_war_economy: "The War Economy"
 QW3_war_economy_desc: "A war economy is a set of decisions about who eats, who works and who fights. The dynasty has never had to make them for the whole country at once."
 QW3_interior_industry: "Industry in the Interior"
 QW3_interior_industry_desc: "The coast will be lost, so the factories must be built where the Japanese navy cannot reach them. Move the machine tools west and the war can continue."
 QW3_arsenal_programme: "The Arsenal Programme"
 QW3_arsenal_programme_desc: "Rifles, machine guns and ammunition in quantities that matter. An army that runs out of ammunition in 1939 has lost the war before 1940."
 QW3_railway_logistics: "Wartime Logistics"
 QW3_railway_logistics_desc: "The railways that carried the harvest now carry divisions and shells. Prioritise them and the front can be supplied, at the cost of the cities."
 QW3_burma_road_focus: "The Burma Road"
 QW3_burma_road_focus_desc: "The only land route for Allied supplies runs through Yunnan. Build it and China can be armed from outside the Japanese blockade."
 QW3_inflation_control: "Controlling Inflation"
 QW3_inflation_control_desc: "War spending without taxation produces inflation, and inflation destroys the soldiers' pay before it destroys the enemy. Tax, borrow and ration, in that order."
 QW3_war_economy_capstone: "A Country That Can Arm Itself"
 QW3_war_economy_capstone_desc: "China is producing its own weapons, feeding its own armies and paying for them in its own currency. The war has done what a decade of reform could not."
 QW3_army_reorganisation: "Reorganising the Army"
 QW3_army_reorganisation_desc: "The divisions that fought in 1937 were organised for a civil war. Reorganise them for a war against a modern enemy and accept that the process will cost battles."
 QW3_army_guerrilla: "Guerrilla Warfare"
 QW3_army_guerrilla_desc: "Regular divisions cannot hold every village. Organise the villages and the Japanese will hold the railways and nothing else."
 QW3_army_protracted: "Protracted War"
 QW3_army_protracted_desc: "China cannot win a short war and does not need to. Trade space for time, preserve the army and let the enemy's supply lines do the work."
 QW3_army_air_defence: "Air Defence"
 QW3_army_air_defence_desc: "Japanese aircraft bomb cities with impunity. Anti-aircraft guns, shelters and a warning system will not win the war but they will keep the government credible."
 QW3_army_officer_corps: "The Officer Corps"
 QW3_army_officer_corps_desc: "The army needs officers who can command a division in a modern war and do not spend their evenings plotting. The two requirements conflict."
 QW3_army_capstone: "The Chinese Army"
 QW3_army_capstone_desc: "The army has learned to fight a modern war in its own country. It is short of everything except men and distance, and it has used both."
 QW3_allied_overtures: "Overtures to the Allies"
 QW3_allied_overtures_desc: "Britain, France and the United States have interests in China and no wish to see Japan take it. They will help a government that looks like it can survive."
 QW3_soviet_aid: "Soviet Aid"
 QW3_soviet_aid_desc: "Moscow will send aircraft and advisers to keep Japan busy in China. The aid comes with an interest in the frontier and a great deal of advice about domestic politics."
 QW3_american_aid: "American Aid"
 QW3_american_aid_desc: "Washington has money, aircraft and a dislike of Japanese expansion. A lend-lease agreement would change the war and tie China to the American peace."
 QW3_german_mission_ends: "The German Mission Ends"
 QW3_german_mission_ends_desc: "Germany has chosen Japan. The advisers who trained the Chinese army must leave, and the arsenals they built must be run by Chinese officers."
 QW3_equal_treaties: "Equal Treaties"
 QW3_equal_treaties_desc: "The powers will give up extraterritoriality in exchange for a Chinese war effort they can rely on. Sign the treaties and the dynasty gains the thing it has wanted since 1842."
 QW3_diplomacy_capstone: "A Founding Member"
 QW3_diplomacy_capstone_desc: "China has signed equal treaties, sat in the councils of the Allies and been treated as one of the powers that will shape the peace. The dynasty has bought its seat with a war."
 QW3_north_china_front: "The North China Front"
 QW3_north_china_front_desc: "The first battles will be fought in the north, where the Japanese have railways and the Chinese have distances. Hold the passes and the war continues."
 QW3_shanghai_front: "The Shanghai Front"
 QW3_shanghai_front_desc: "Fighting in Shanghai puts Chinese divisions under Japanese naval guns. It also puts the war in front of the foreign press, which is worth more than the divisions."
 QW3_capital_relocation: "The Government Moves West"
 QW3_capital_relocation_desc: "Nanjing will fall. The government must move to Chongqing before it does, and carry the ministries, the archives and the foreign embassies up the Yangtze."
 QW3_occupied_coast: "The Occupied Coast"
 QW3_occupied_coast_desc: "The coast is lost and the interior is not. Govern the occupied provinces through resistance committees and the Japanese will find that conquest costs more than it returns."
 QW3_the_hump: "The Hump"
 QW3_the_hump_desc: "When the Burma Road closes, supplies come over the Himalayas. The airlift is expensive, dangerous and the only thing keeping the Chinese armies in the war."
 QW3_ichigo: "The Year of Disaster"
 QW3_ichigo_desc: "The Japanese offensive of 1944 breaks the front and takes the American airfields. The government must hold the interior and the alliance together at the same time."
 QW3_victory: "The Japanese Surrender"
 QW3_victory_desc: "The war ends with Japanese armies in China laying down their arms. The dynasty has survived the greatest test of its existence and inherited the question every victor inherits."
 QW3_civil_defence: "Civil Defence"
 QW3_civil_defence_desc: "Air raids kill civilians before they damage factories. Shelters, wardens and evacuation plans keep the cities working and the government visible."
 QW3_wartime_propaganda: "The War of Words"
 QW3_wartime_propaganda_desc: "A government that explains the war keeps the country in it. Posters, radio and the press are cheaper than divisions and, in a long war, more important."
 QW3_rationing: "Rationing"
 QW3_rationing_desc: "Food, cloth and fuel must be shared before they run out. Rationing is unpopular, fair and the only way a blockaded country survives."
 QW3_aircraft_industry: "Aircraft Production"
 QW3_aircraft_industry_desc: "China cannot build fighters in the numbers Japan can. It can build enough, with foreign engines and Chinese assembly, to make Japanese bombing expensive."
 QW3_truck_production: "Trucks and Roads"
 QW3_truck_production_desc: "An army without trucks moves at the speed of a porter. Assemble trucks from imported parts and the interior becomes reachable."
 QW3_shipyards: "The River Yards"
 QW3_shipyards_desc: "The Japanese navy holds the coast, so the war is fought on the Yangtze. River gunboats and transports are the Chinese navy that can still operate."
 QW3_fuel_supply: "Fuel and Depots"
 QW3_fuel_supply_desc: "Aircraft, trucks and generators all need fuel that China does not produce. Stock the depots, ration the armies and the front can still move."
 QW3_army_armour: "Chinese Armour"
 QW3_army_armour_desc: "A few tank battalions cannot change the war. They can break a Japanese roadblock, and in a war of roads that is worth the fuel."
 QW3_army_air_force_ii: "The Chinese Air Force"
 QW3_army_air_force_ii_desc: "A small air force of foreign aircraft and Chinese pilots can contest the Japanese bombers over Chongqing. It cannot win the air war and it can make the bombing costly."
 QW3_army_marines: "River Marines"
 QW3_army_marines_desc: "The Yangtze is a highway for whoever controls it. Marines trained for river crossings and landing parties can keep the Japanese off the banks."
 QW3_army_special_forces: "Special Operations"
 QW3_army_special_forces_desc: "Small units that can blow a railway, raid a depot and disappear are worth more in occupied China than another division. Train them and use them behind the lines."
 QW3_united_front: "A United Front"
 QW3_united_front_desc: "The Nationalists and the Communists will fight Japan if the dynasty gives them a place in the war. The alternative is fighting all three at once."
 QW3_pacific_alliance: "The Pacific Alliance"
 QW3_pacific_alliance_desc: "When Japan strikes south, China becomes an ally rather than a supplicant. The dynasty should be ready to name its price for a Pacific strategy."
 QW3_postwar_planning: "Planning the Peace"
 QW3_postwar_planning_desc: "The powers are already drawing the postwar map. A Chinese delegation with a programme for the peace will be harder to ignore than one with a list of requests."
 QW3_chongqing_bombing: "The Bombing of Chongqing"
 QW3_chongqing_bombing_desc: "Japanese aircraft bomb the wartime capital for weeks at a time. The government must keep governing from the shelters and be seen to do it."
 QW3_burma_campaign: "The Burma Campaign"
 QW3_burma_campaign_desc: "Chinese divisions in Burma keep the supply road open and give China a claim on the Allied victory. It is a long way from home and the only offensive China can join."
 QW3_coastal_landings: "Return to the Coast"
 QW3_coastal_landings_desc: "By 1945 the Japanese armies are stretched and the Allies are at sea. A Chinese offensive toward the coast would put Chinese troops in the ports before the war ends."
 QW3_constitutional_local: "Wartime Local Government"
 QW3_constitutional_local_desc: "Elections suspended for the duration still leave councils, mayors and provincial budgets. Keep local government alive and the settlement survives the war."
 QW3_authoritarian_youth: "The Imperial Youth"
 QW3_authoritarian_youth_desc: "A movement that teaches loyalty, drill and literacy gives the court a generation that owes it everything. It also gives the court a generation that expects to be led."
 QW3_yuan_officer_pay: "Officers' Pay"
 QW3_yuan_officer_pay_desc: "An army that is paid on time does not need to be watched. Raise the pay, guarantee the pensions and the Beiyang command stays loyal for another year."
 QW3_federal_bank: "A Federal Bank"
 QW3_federal_bank_desc: "A bank owned by the provinces can issue the war loans the centre cannot. It can also refuse them, which is the price of a federal constitution."
 QW3_chapter_end: "The Qing Settlement of 1945"
 QW3_chapter_end_desc: "The war is over and the dynasty is still on the throne. What it does with the peace will decide whether the Qing century is a restoration or an interval."
