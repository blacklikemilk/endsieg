l_english:
 endsieg_ww1_rigid_airship: "Rigid Airship"
 endsieg_ww1_rigid_airship_desc: "A rigid frame holds the gas cells in shape on long flights. From the gondolas below, observers can follow a fleet or watch the railways beyond the front."
 endsieg_ww1_improved_airship: "Improved Zeppelin"
 endsieg_ww1_improved_airship_desc: "A larger hull provides the lift for more fuel and a heavier bomb load. Its crew can patrol farther from home, though the airship remains vulnerable to fighters."
 endsieg_ww1_zeppelin: "Airship"
 endsieg_ww1_zeppelin_desc: "A single rigid airship assigned to reconnaissance, maritime patrol or strategic bombing."
 endsieg_ww1_zeppelin_equipment: "Rigid Airship"
 endsieg_ww1_zeppelin_equipment_short: "Airship"
 endsieg_ww1_zeppelin_equipment_desc: "$endsieg_ww1_rigid_airship_desc$"
 endsieg_ww1_zeppelin_equipment_1: "Early Rigid Airship"
 endsieg_ww1_zeppelin_equipment_1_short: "Airship I"
 endsieg_ww1_zeppelin_equipment_1_desc: "$endsieg_ww1_rigid_airship_desc$"
 endsieg_ww1_zeppelin_equipment_2: "Improved Zeppelin"
 endsieg_ww1_zeppelin_equipment_2_short: "Airship II"
