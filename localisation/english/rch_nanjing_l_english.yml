 rch_nanjing: "The Nanjing Decade"
 rch_politics_navigation: "Government"
 rch_economy_navigation: "Finance and Industry"
 rch_army_navigation: "The Army"
 rch_diplomacy_navigation: "Foreign Affairs"
 rch_society_navigation: "Society"
 RC3_nanjing_government: "The Nanjing Government"
 RC3_nanjing_government_desc: "The republic has a capital, a party, an army and a decade. The question is whether it can become a state before the next war arrives."
 RC3_state_council: "The State Council"
 RC3_state_council_desc: "A council of ministers, a civil service and a budget office would make the government a machine rather than a court."
 RC3_finance_ministry: "The Finance Ministry"
 RC3_finance_ministry_desc: "A government that cannot tax cannot govern. The finance ministry must find a revenue the provinces will actually remit."
 RC3_land_law: "The Land Law"
 RC3_land_law_desc: "A land law that reduces rents wins the countryside and loses the gentry who collect them. The government has to choose which of the two it can afford."
 RC3_local_government: "County Government"
 RC3_local_government_desc: "The county is where the state meets the village. Reform the magistrates and the tax collectors and the republic reaches the countryside."
 RC3_parliamentary_trunk: "The Constitutional Government"
 RC3_parliamentary_trunk_desc: "The assembly has been promised a constitution, elections and a cabinet. Delivering them is the only way the republic becomes a republic."
 RC3_beiyang_trunk: "The Northern Command"
 RC3_beiyang_trunk_desc: "The old Beiyang commanders still hold the north. A government that cannot command them is a government on sufferance."
 RC3_kmt_trunk: "The Party-State"
 RC3_kmt_trunk_desc: "The party governs the state, the army and the schools. It is the most effective government China has had since 1911 and the least accountable."
 RC3_provincial_trunk: "The Provincial Union"
 RC3_provincial_trunk_desc: "The provinces have accepted Nanjing in exchange for their own revenues and armies. The union is real and permanently conditional."
 RC3_constitution_1936: "The 1936 Constitution"
 RC3_constitution_1936_desc: "A constitution that names the government's powers and the citizen's rights is a promise the government can be held to."
 RC3_elections: "National Elections"
 RC3_elections_desc: "An election with more than one party is the difference between a republic and a regime with a parliament."
 RC3_parliamentary_capstone: "A Constitutional Republic"
 RC3_parliamentary_capstone_desc: "The republic has a constitution, elections and a cabinet that can be dismissed. It is not a democracy, and it is the closest China has come."
 RC3_northern_army: "The Northern Army"
 RC3_northern_army_desc: "The northern divisions are the strongest force in the state. Give them a budget and a doctrine and they become an army."
 RC3_military_administration: "Military Administration"
 RC3_military_administration_desc: "Military governors administer the northern provinces and answer to the general staff rather than the cabinet."
 RC3_beiyang_capstone: "A Government of Commanders"
 RC3_beiyang_capstone_desc: "The commanders have kept the republic together and made themselves indispensable. The state is stable and it is theirs."
 RC3_party_congress: "The Party Congress"
 RC3_party_congress_desc: "A congress of delegates gives the party a civilian authority over its own government and army."
 RC3_mass_movement: "A Mass Movement"
 RC3_mass_movement_desc: "Party branches in factories, schools and villages give the government reach the old state never had."
 RC3_kmt_capstone: "The Party-State Consolidated"
 RC3_kmt_capstone_desc: "The party is the state, the army and the school system. It has unified China and it has no rival it permits."
 RC3_provincial_council: "A Standing Council"
 RC3_provincial_council_desc: "A standing council of provincial delegates turns the bargain into an institution with a budget."
 RC3_regional_armies: "Regional Armies"
 RC3_regional_armies_desc: "The provinces keep their divisions and the centre keeps the right to request them."
 RC3_provincial_capstone: "A Union of Provinces"
 RC3_provincial_capstone_desc: "China is a union of provinces with a common government. It is not centralised, and it works."
 RC3_industry: "The Nanjing Decade"
 RC3_industry_desc: "Factories, roads and power stations can be built in the few provinces the government actually controls. It is not a national economy and it is a start."
 RC3_railways: "Railway Construction"
 RC3_railways_desc: "Every kilometre of railway is a claim on the interior. Build the lines and the government follows them."
 RC3_currency: "The 1935 Currency Reform"
 RC3_currency_desc: "A national paper currency backed by silver reserves would end the chaos of provincial notes. It would also tie China's money to foreign banks."
 RC3_nanjing_industry: "Industry in the Capital"
 RC3_nanjing_industry_desc: "Power, textiles and machine shops around Nanjing give the government a tax base it can actually see."
 RC3_agriculture: "Agricultural Reform"
 RC3_agriculture_desc: "Rent reduction, credit cooperatives and irrigation are cheaper than land redistribution and slower to show results."
 RC3_economy_capstone: "A State With a Budget"
 RC3_economy_capstone_desc: "The government taxes, borrows, builds and accounts for it. That is what a modern state is, and China has one in the east."
 RC3_army: "The National Army"
 RC3_army_desc: "The army is a coalition of provincial units with a national staff on top. Reform begins with the staff."
 RC3_german_advisers: "German Advisers"
 RC3_german_advisers_desc: "German officers can teach a Chinese army to fight a modern war. They cannot give it the industry to supply one."
 RC3_arsenal: "The Arsenals"
 RC3_arsenal_desc: "Rifles, machine guns and field artillery made in China. The arsenals are small, and they are the difference between dependence and resistance."
 RC3_air_force: "The Air Force"
 RC3_air_force_desc: "A small modern air force is the one arm China can build quickly with foreign aircraft and Chinese pilots."
 RC3_navy: "The Navy"
 RC3_navy_desc: "A coastal navy cannot challenge Japan and can deny the coast to pirates, smugglers and landing parties."
 RC3_army_capstone: "A Modern Army"
 RC3_army_capstone_desc: "The army has a staff, advisers, arsenals and an air force. It is still outmatched by Japan and it is no longer a militia."
 RC3_diplomacy: "The Foreign Ministry"
 RC3_diplomacy_desc: "The republic's diplomacy is a long argument about treaties it did not sign and cannot denounce."
 RC3_unequal_treaties: "Tariff Autonomy"
 RC3_unequal_treaties_desc: "Restoring the tariff is the first treaty revision a weak government can actually achieve, and it pays for everything else."
 RC3_league: "The League and the Powers"
 RC3_league_desc: "The League can condemn Japan and cannot stop it. A government that knows the difference can still use the condemnation."
 RC3_manchuria: "The Manchurian Crisis"
 RC3_manchuria_desc: "Japan has taken the north and called it a state. The government can fight, negotiate or appeal, and it has already lost the province."
 RC3_germany: "German Relations"
 RC3_germany_desc: "Germany lost its concessions in the war and wants them back as trade. A German mission builds an army without a colonial price."
 RC3_diplomacy_capstone: "A Sovereign State"
 RC3_diplomacy_capstone_desc: "China has tariff autonomy, a seat at Geneva and an army trained abroad. It is still weak, and it is no longer a patient."
 RC3_central_plains: "The Central Plains War"
 RC3_central_plains_desc: "The provincial commanders who helped take the north have turned against Nanjing. The government must buy them, beat them or lose the decade."
 RC3_flood: "The 1931 Floods"
 RC3_flood_desc: "The Yangtze has flooded half the country. Relief is expensive, visible and the government's only chance to be seen governing."
 RC3_shanghai_1932: "The Shanghai Incident"
 RC3_shanghai_1932_desc: "Japanese marines have landed in Shanghai and the Chinese army is fighting them in the streets. A month of resistance buys the government's reputation."
 RC3_communists: "The Communist Question"
 RC3_communists_desc: "The Communists have surviving armies in the interior and a claim to represent the peasants. They can be fought, contained or allied."
 RC3_new_life: "The New Life Movement"
 RC3_new_life_desc: "A movement for order, cleanliness and public morality is cheap, popular and gives the government a language for reform."
 RC3_crisis_capstone: "A Government That Governs"
 RC3_crisis_capstone_desc: "The government has survived a civil war, a flood, a Japanese landing and a Communist insurgency. It has become the state by surviving."
