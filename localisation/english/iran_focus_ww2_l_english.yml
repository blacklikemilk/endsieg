l_english:
 IR3_german_industrial_mission: "The German Industrial Mission"
 IR3_german_industrial_mission_desc: "German engineers and machine tools are worth more to the army than any speech about sovereignty. A technical mission is invited to Tehran on a five-year term to run the arsenal workshops, train the fitters and take a share of the arms programme; London will notice, and the notice is the price of the machinery."
 iran_f3.1.t: "The Concession Ledger"
 iran_f3.1.d: "Two concessions have now been signed, and the treasury can no longer keep them in separate files. Laid end to end, the oil expansion, the northern line and the corridor accounts show what the country has given away and to whom, and what it has received in return. Ministers must decide whether that account is a state paper or a private one."
 iran_f3.1.a: "Publish the ledger and let the chamber read it."
 iran_f3.1.b: "Keep the ledger in the treasury."
 iran_f3.2.t: "The Mission Leaves Tehran"
 iran_f3.2.d: "The German technical mission has been the quietest of Iran's foreign arrangements and the most useful to its workshops. With the ultimatum on the table it has become the first thing the Allies ask for, and the government sends the mission home with its machinery, its drawings and its instructors, in exchange for a hearing in London and Moscow."
 iran_f3.2.a: "Send the mission home."
 iran_f3.3.t: "The Tudeh Question"
 iran_f3.3.d: "The party has branches in the northern factories, a newspaper that prints more copies than any cabinet organ, and deputies who speak for the workshops. Its opponents call it a Soviet instrument; its members call it the only party that has ever organised labour in this country. The government must decide whether it is a danger, a nuisance, or a partner."
 iran_f3.3.a: "Proscribe the party and close its clubs."
 iran_f3.3.b: "Tolerate it, and watch it."
 iran_f3.3.c: "Bring its leaders into the government."
 iran_evacuation_settled: "Settle the Evacuation"
 iran_evacuation_settled_desc: "The last foreign columns are embarking, and the wartime administration that governed the country in their shadow has no further purpose. The government closes the occupation accounts, recovers the emergency powers it granted itself, and presents the evacuation as a settlement rather than a withdrawal."
