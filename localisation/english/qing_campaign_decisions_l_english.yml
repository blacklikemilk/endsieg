l_english:
 qing_bop_appoint_grand_council: "Appoint a Grand Council"
 qing_bop_appoint_grand_council_desc: "Ministers chosen by the throne and answerable to it alone. The council will govern quickly and the assembly will call it a household."
 qing_bop_court_the_gentry: "Court the Gentry"
 qing_bop_court_the_gentry_desc: "Titles, examinations and invitations bring the great provincial families back to the court and away from the assemblies."
 qing_bop_imperial_progress: "An Imperial Progress"
 qing_bop_imperial_progress_desc: "The regent travels the northern provinces, inspects the garrisons and is seen to rule."
 qing_bop_convene_assembly: "Convene the Assembly"
 qing_bop_convene_assembly_desc: "Let the deputies sit, speak and vote. The chamber will demand more than it was offered."
 qing_bop_provincial_budget: "Pass the Budget through the Assembly"
 qing_bop_provincial_budget_desc: "No taxation without the chamber's consent, and no borrowing without its scrutiny."
 qing_bop_empower_provincial_assemblies: "Empower the Provincial Assemblies"
 qing_bop_empower_provincial_assemblies_desc: "The provincial assemblies were the first institution the empire allowed the provinces to elect. Give them a real role in local government."
 qing_bop_negotiate_settlement: "Negotiate the Settlement"
 qing_bop_negotiate_settlement_desc: "Bring the court and the chamber to terms neither of them likes, before one of them wins outright."
 qing_bop_promulgate_constitution: "Promulgate the Constitution"
 qing_bop_promulgate_constitution_desc: "Write the settlement into law while both sides still accept it, and bind the throne to a text it cannot easily revoke."

 qing_decision_reform_edict: "Issue a Reform Edict"
 qing_decision_reform_edict_desc: "A rescript that modernises a ministry, a school or a court and tells the provinces the dynasty intends to change."
 qing_decision_new_army_pay: "Raise the New Army's Pay"
 qing_decision_new_army_pay_desc: "Pay the divisions on time and in full. The treasury will complain and the officers will remember."
 qing_decision_officer_purge: "Purge the Officer Corps"
 qing_decision_officer_purge_desc: "Remove the officers whose loyalty is doubtful and promote the ones whose careers depend on the throne. The army will lose experienced commanders and gain a political education."
 qing_decision_yuan_commission: "Commission Yuan Shikai"
 qing_decision_yuan_commission_desc: "Give Yuan Shikai a command he cannot refuse and a place in the government he cannot ignore. The army follows him and the court follows the army."
 qing_decision_provincial_compact: "Negotiate a Provincial Compact"
 qing_decision_provincial_compact_desc: "Offer the provinces a written share of taxation and local appointment in exchange for a settled contribution to the centre."
 qing_decision_banner_reform: "Reform the Banner Establishment"
 qing_decision_banner_reform_desc: "Convert the banner garrisons into a paid reserve with modern weapons and a fixed establishment."
 qing_decision_civil_service_exam: "Restore the Examinations"
 qing_decision_civil_service_exam_desc: "Recruit officials by examination in law, accounting and administration rather than by patronage."
 qing_decision_elections: "Hold Elections"
 qing_decision_elections_desc: "Let the country vote for the chamber and accept that the result will not be the court's preference."
 qing_decision_court_purge: "Purge the Court"
 qing_decision_court_purge_desc: "Remove the ministers and princes who have obstructed the throne and replace them with men who owe everything to it."

 qing_project_railway_north: "Build the Northern Trunk Line"
 qing_project_railway_north_desc: "Connect Beijing to the Yellow River plain with a state-owned trunk line and the troops to guard it."
 qing_project_railway_south: "Build the Southern Trunk Line"
 qing_project_railway_south_desc: "Extend the line from the Yangtze into Sichuan, where the grain and the recruits are."
 qing_project_hanyang: "Expand the Hanyang Arsenal"
 qing_project_hanyang_desc: "Add a modern rifle line and a machine shop to the arsenal at Hanyang."
 qing_project_shanghai_dock: "Modernise the Shanghai Dockyard"
 qing_project_shanghai_dock_desc: "Deepen the berths, repair the cranes and give the navy a yard that can build a gunboat."
 qing_project_baoding_academy: "Found the Baoding Academy"
 qing_project_baoding_academy_desc: "A staff college with a curriculum, a library and a training airfield."
 qing_project_capital_forts: "Fortify the Capital Approaches"
 qing_project_capital_forts_desc: "Concrete, trenches and supply depots on the roads into Beijing."
 qing_project_currency: "Reform the Currency"
 qing_project_currency_desc: "One national currency, one issuing bank and one exchange rate for the whole country."
 qing_project_famine_relief: "Organise Famine Relief"
 qing_project_famine_relief_desc: "Granaries, relief columns and a provincial reporting system that works before the famine does."

 qing_diplomacy_british_loan: "Negotiate a British Loan"
 qing_diplomacy_british_loan_desc: "London will lend against the customs revenue and expect a say in how it is spent."
 qing_diplomacy_german_mission: "Invite a German Military Mission"
 qing_diplomacy_german_mission_desc: "German officers, German manuals and German rifles, at the price of German influence."
 qing_diplomacy_japanese_accommodation: "Accommodate Japan"
 qing_diplomacy_japanese_accommodation_desc: "Settle the outstanding claims, accept the railway zone and buy another few years of peace."
 qing_diplomacy_reject_japan: "Reject the Japanese Demands"
 qing_diplomacy_reject_japan_desc: "Refuse the claims in public and accept that Tokyo will remember the refusal."
 qing_diplomacy_american_open_door: "Appeal to the Open Door"
 qing_diplomacy_american_open_door_desc: "Ask Washington to insist on equal access to China, which is not friendship but is a useful counterweight."
 qing_diplomacy_shandong: "Settle the Shandong Question"
 qing_diplomacy_shandong_desc: "Recover the province through negotiation, compensation and the support of the powers that want Japan contained."
 qing_diplomacy_buy_concessions: "Buy Back the Concessions"
 qing_diplomacy_buy_concessions_desc: "Purchase the foreign municipal concessions and place them under Chinese law."

 qing_war_general_mobilisation: "General Mobilisation"
 qing_war_general_mobilisation_desc: "Call up the reserves, requisition the transport and place the country on a war footing."
 qing_war_scorched_earth: "Scorched Earth"
 qing_war_scorched_earth_desc: "Destroy the railways, the bridges and the warehouses the Japanese will need. The provinces will pay for it twice."
 qing_war_guerrilla_committees: "Arm the Guerrilla Committees"
 qing_war_guerrilla_committees_desc: "Give the villages weapons, orders and a claim on the government's attention."
 qing_war_burma_road: "Open the Burma Road"
 qing_war_burma_road_desc: "Build the road from Kunming to the Burmese border and keep the supply route open."
 qing_war_lend_lease: "Request Lend-Lease"
 qing_war_lend_lease_desc: "Ask Washington for equipment under the new aid programme and accept the conditions attached."
 qing_war_inflation_control: "Control Wartime Inflation"
 qing_war_inflation_control_desc: "Tax, borrow, ration and control prices before the currency collapses."

 qing_consolidation_report: "Report on the Consolidated State"
 qing_consolidation_report_desc: "Court [?qing_legitimacy|0] of 100. Reform [?qing_reform|0]. Army [?qing_army_loyalty|0]. Provinces [?qing_provincial_trust|0]. The works of the state are the currency, the northern trunk line, the arsenal, the examinations and the public works. Between them they make a consolidated state of [?qing_consolidation|0] of 100. At 60 the interwar government can be convened, and 60 held for a year opens the restoration programme."
 qing_consolidation_court: "A Progress through the Provinces"
 qing_consolidation_court_desc: "The throne's standing is [?qing_legitimacy|0] of 100. A progress through the northern provinces, an audience for the provincial notables and a season at the summer palace remind the country who its government is. A court that loses the room while the progress is under way loses the progress with it."
 qing_consolidation_reform: "A Programme of Reform"
 qing_consolidation_reform_desc: "Reform stands at [?qing_reform|0] of 100. A ministry with a scheme, a budget and a deadline can change how the state works. A scheme that outlives the government that began it does not."
 qing_consolidation_army: "The Pay and Promotion of the Army"
 qing_consolidation_army_desc: "The army's loyalty is [?qing_army_loyalty|0] of 100. Pay, promotion and a barracks worth living in buy the officer corps' obedience. Let the pay fall behind while the programme runs and the officers will find another patron."
 qing_consolidation_provinces: "A Settlement with the Provinces"
 qing_consolidation_provinces_desc: "The provinces' confidence is [?qing_provincial_trust|0] of 100. An agreement with the assemblies, the gentry and the governors is worth more than a garrison in every county town, and it collapses if the province stops believing the centre can deliver."
 qing_consolidation_works: "Public Works of the Restoration"
 qing_consolidation_works_desc: "Roads, the capital's water and a ministry building that is not a requisitioned yamen are the visible half of consolidation. The treasury has to keep paying while they are built: a government that runs out of money mid-programme loses the credit as well as the works."
 qing_convene_interwar: "Convene the Interwar Government"
 qing_convene_interwar_desc: "The settlement has held long enough to be a government rather than a truce. Convene the administration that will carry China through the peace, and the reconstruction of the state begins."
 qing_convene_interwar_tt: "Consolidated: [?qing_consolidation|0] of 100. The interwar government requires 60. Court, reform, army, provinces and public works each carry a fifth of the score."
 qing_chapter_two: "the interwar government has been convened"
 qing_works_completed: "the public works programme is complete"
 QIN_constitution_promulgated: "the constitution has been promulgated"
 qing_constitution_1912: "the constitution of 1912 is in force"
