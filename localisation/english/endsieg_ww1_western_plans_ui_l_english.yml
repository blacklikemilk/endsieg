 WW1_WF_flanders_tt:0 "§YFlanders§!\nRequires German control of a state in the sector. Each German-controlled state in Flanders gains §G+0.5 local supply§! for 28 days. Control §Y[GetWW1WFFlandersObjective]§! when orders are reviewed to earn §G5 Army Experience§!."
 WW1_WF_somme_tt:0 "§YThe Somme§!\nRequires German control of a state in the sector. Each German-controlled state in the Somme gains §G+0.5 local supply§! for 28 days. Control §Y[GetWW1WFSommeObjective]§! when orders are reviewed to earn §G5 Army Experience§!."
 WW1_WF_lorraine_tt:0 "§YLorraine§!\nRequires German control of a state in the sector. Each German-controlled state in Lorraine gains §G+0.5 local supply§! for 28 days. Control §Y[GetWW1WFLorraineObjective]§! when orders are reviewed to earn §G5 Army Experience§!."
