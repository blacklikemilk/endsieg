 WW1_WP_stores:0 "Stored rifles §Y[?GER.num_equipment@infantry_equipment|0]§!   Guns §Y[?GER.num_equipment@artillery_equipment|0]§!"
 WW1_WP_reserves_tt:0 "§YThe offensive reserve§!\nEach phase receives between 75% and 125% of its planned time. Reserves are assessed when that phase starts.\n\nFull cover requires rifles and field guns in storage equal to 10% of the deployed army's requirements, together with rations for the planned phase. The least well-covered requirement determines the allowance. Half cover gives the original timetable. Disabled rations and equipment the army does not require are excluded.\n\n§YLast assessment§!\nRifles §Y[?GER.WW1_western_plan_rifle_coverage|%0]§!\nField guns §Y[?GER.WW1_western_plan_artillery_coverage|%0]§!\nRations §Y[?GER.WW1_western_plan_ration_coverage|%0]§!\nPlanned phase §Y[?GER.WW1_western_plan_phase_base_days|0] days§!\n\nOffensive attack bonuses end at Christmas."
