l_english:
 rch_campaign.1.t: "The Republic Is Proclaimed"
 rch_campaign.1.d: "The abdication edict has been read and the republic has been declared in Nanjing. The provinces have accepted the new government in principle and are already calculating what it will cost them in practice."
 rch_campaign.1.a: "The republic begins."
 rch_campaign.3.t: "The Second Revolution"
 rch_campaign.3.d: "The assembly's supporters in the south have risen against the presidency, and the government must decide whether the republic is a parliament that appoints a president or a president who permits a parliament."
 rch_campaign.3.a: "The assembly is the republic."
 rch_campaign.3.b: "The presidency must govern."
 rch_campaign.3.c: "The revolution belongs to the party."
 rch_campaign.4.t: "The Twenty-One Demands"
 rch_campaign.4.d: "Japan has presented a list of demands that would make China a protectorate in all but name. The foreign ministry has days to answer and no army that could refuse."
 rch_campaign.4.a: "Accept what cannot be refused."
 rch_campaign.4.b: "Reject them and publish the text."
 rch_campaign.5.t: "The President Dies"
 rch_campaign.5.d: "The president who held the republic together by commanding its army is dead. The assembly, the provincial governors and the party in the south each claim to be his successor."
 rch_campaign.5.a: "The assembly chooses the next president."
 rch_campaign.5.b: "The army chooses the next president."
 rch_campaign.5.c: "The party claims the revolution."
 rch_campaign.5.e: "The provinces will decide among themselves."
 rch_campaign.6.t: "The Restoration"
 rch_campaign.6.d: "A general has brought his troops into Beijing and proclaimed the restoration of the Qing. The republic has hours to decide whether it still has an army of its own."
 rch_campaign.6.a: "The republic is restored."
 rch_campaign.6.b: "Negotiate with the general."
 rch_campaign.7.t: "The Armistice"
 rch_campaign.7.d: "The Great War has ended in Europe. China sent labourers and declared for the Entente, and now expects a seat at the peace and the return of Shandong."
 rch_campaign.7.a: "We will be at the peace."
 rch_campaign.8.t: "May Fourth"
 rch_campaign.8.d: "The peace conference has given Shandong to Japan and the students of Beijing have taken to the streets. The slogans are new and the crowd is not."
 rch_campaign.8.a: "The government listens."
 rch_campaign.8.b: "The government clears the streets."
 rch_campaign.20.t: "The Warlord Era"
 rch_campaign.20.d: "The republic has a government, a constitution and no monopoly on violence. Provincial commanders collect the taxes, raise the troops and ignore the capital whenever it is convenient."
 rch_campaign.20.a: "The government will manage them."
 rch_campaign.21.t: "The Zhili-Anhui War"
 rch_campaign.21.d: "Two cliques that governed together have fallen out over the premiership, the railways and the revenue. The fighting is in the capital's suburbs."
 rch_campaign.21.a: "The Zhili commanders win."
 rch_campaign.21.b: "Negotiate a settlement."
 rch_campaign.22.t: "The Zhili-Fengtian War"
 rch_campaign.22.d: "The Fengtian army has come south to settle the question of who governs the north. Beijing is the prize and the battlefield."
 rch_campaign.22.a: "The Fengtian army enters Beijing."
 rch_campaign.22.b: "The Zhili command holds the capital."
 rch_campaign.23.t: "The Party Reorganises"
 rch_campaign.23.d: "The Nationalists have held a congress, adopted a programme and accepted foreign advisers. They now have a party army and a claim to be the government of China rather than a faction in the south."
 rch_campaign.23.a: "Accept Soviet assistance."
 rch_campaign.23.b: "Build the party first."
 rch_campaign.24.t: "The Northern Expedition"
 rch_campaign.24.d: "The Nationalist armies have left Guangdong and are moving north. The provincial commanders between the south and Beijing are already deciding which side to join."
 rch_campaign.24.a: "The party marches north."
 rch_campaign.24.b: "The government prepares to fight."
 rch_campaign.30.t: "The Nanjing Decade"
 rch_campaign.30.d: "The government has a capital, a party, an army and a decade. Whether it can become a state before the next war depends on the work of the next ten years."
 rch_campaign.30.a: "The work begins."
 rch_campaign.31.t: "The Government Is Consolidated"
 rch_campaign.31.d: "The capital is secure, the provinces have accepted the government and the party has a congress. The republic is a state again, in the east at least."
 rch_campaign.31.a: "Consolidate the government."
 rch_campaign.33.t: "The Manchurian Incident"
 rch_campaign.33.d: "Japanese officers have blamed a Chinese attack on the railway at Mukden and occupied the surrounding towns. Tokyo calls it a local measure and the Kwantung Army calls it a solution."
 rch_campaign.33.a: "Appeal to the world."
 rch_campaign.33.b: "Accept the loss and keep the peace."
 rch_campaign.35.t: "The Republic Enters 1936"
 rch_campaign.35.d: "The government has survived the warlords, the party wars and the Japanese advance into the north. The republic that faces 1936 is smaller, poorer and more unified than the one declared in 1912."
 rch_campaign.35.a: "The government will hold."
