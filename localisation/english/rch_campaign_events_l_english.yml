l_english:
 rch_campaign.1.t: "The Republic After the Revolution"
 rch_campaign.1.d: "The imperial court has fallen, but victory has left the new government with a country divided by distance, regional loyalties and years of upheaval. In Nanjing, republicans speak of a constitution and a government responsible to the people. The provinces are waiting to see how much authority the new capital can exercise.\n\nThe revolution has given China a republic. The task now is to make it govern."
 rch_campaign.1.a: "There is much work ahead."
 rch_campaign.2.t: "The Beiyang Government"
 rch_campaign.2.d: "The presidency rests on an uneasy understanding between the assembly, the ministries and the commanders of the Beiyang Army. Each has a claim to authority; none can govern the country alone.\n\nThe government must decide how much power to leave in the hands of the officers and how much to entrust to civilian institutions. The choices made now will shape the succession when the present leadership is gone."
 rch_campaign.2.a: "China needs both order and government."
 rch_campaign.3.t: "A Republic Divided"
 rch_campaign.3.d: "The president's authority is being challenged by men who believe the revolution has been betrayed. Opposition leaders in the south look to the assembly and the provinces for support, while the commanders around the capital demand a firm response.\n\nWhat begins as a dispute over the powers of the presidency may decide who speaks for the republic."
 rch_campaign.3.a: "Defend the authority of the assembly."
 rch_campaign.3.b: "The presidency must restore order."
 rch_campaign.3.c: "Entrust the revolution to the Nationalists."
 rch_campaign.4.t: "Japanese Demands"
 rch_campaign.4.d: "The Japanese government has presented demands for a wider political and economic role in China. Its diplomats offer assurances of friendship, but the proposed concessions would leave us with little control over important affairs of state.\n\nRefusal would carry risks of its own. Ministers must decide how much the republic can concede, and how much it can afford to resist."
 rch_campaign.4.friendly.d: "Japanese diplomats have proposed an expansion of their country's privileges in China, citing the value of cooperation between our governments. The terms have nevertheless alarmed ministers who fear that friendship will come at the expense of Chinese authority.\n\nWe can seek an understanding with Tokyo or make clear that our partnership has limits."
 rch_campaign.4.a: "Seek an understanding with Japan."
 rch_campaign.4.b: "Chinese sovereignty is not for negotiation."
 rch_campaign.5.t: "The Balance of Authority"
 rch_campaign.5.d: "Yuan Shikai is dead. His government depended on a balance between the presidency, the army and the provinces; now each must decide where its loyalties lie.\n\nThe institutions and alliances built during his time in office will determine whether the transfer of power strengthens the republic or opens the way to further division."
 rch_campaign.5.alternative.d: "Disputes over the government’s authority have reached a critical point. The assembly, provincial authorities and military commanders are pressing their claims over the future of the state.\n\nThe institutions built in recent years will determine how much room the government has to act."
 rch_campaign.5.a: "The constitution has held."
 rch_campaign.5.c: "The government must bargain with the provinces."
 rch_campaign.5.b: "The army remains the government's support."
 rch_campaign.5.e: "The provinces will decide their own course."
 rch_campaign.6.t: "The Army and the Constitution"
 rch_campaign.6.d: "Some officers speak openly of restoring the old dynasty, while others insist that the army must defend the republic. Their quarrel has reached the capital, where ministers fear that a dispute over the constitution may become a contest between armed factions.\n\nWe can rally support for constitutional government or seek an accommodation with the commanders."
 rch_campaign.6.alternative.d: "Arguments over the proper place of the army have once again reached the government. Officers want a greater voice in the affairs of state; civilian officials warn that every concession makes their own authority more precarious.\n\nThe question can no longer be postponed."
 rch_campaign.6.a: "Rally support for the constitutional order."
 rch_campaign.6.b: "Offer the commanders a compromise."
 rch_campaign.7.t: "The War in Europe Ends"
 rch_campaign.7.d: "The fighting between the European powers has come to an end. Having taken part in the war against Germany, China now looks to the coming negotiations and the place it will be accorded among the victorious powers.\n\nOur representatives will press the claims of the republic and seek recognition of its sovereignty."
 rch_campaign.7.a: "China must be heard."
 rch_campaign.8.t: "A New National Movement"
 rch_campaign.8.d: "Students and reformers have taken to the streets, angered by foreign control in Shandong and by a government they believe has failed to defend China's interests. Their demonstrations have spread beyond the universities, drawing merchants and workers into the dispute.\n\nThe cabinet must decide whether to listen to the protesters or put an end to their agitation."
 rch_campaign.8.alternative.d: "Students and reformers are calling for a stronger, more independent China. Their criticism of the government has found an audience beyond the universities, and merchants and workers are beginning to lend their support.\n\nThe cabinet must decide whether to listen to their demands or put an end to the demonstrations."
 rch_campaign.8.a: "Hear their demands."
 rch_campaign.8.b: "Restore order in the streets."
 rch_campaign.20.t: "The Provincial Commanders"
 rch_campaign.20.d: "Authority in the provinces depends as much on the men who command troops as on the instructions sent from the capital. Governors bargain over revenue and appointments, and the government cannot easily dismiss those who refuse its orders.\n\nIf China is to be governed as one country, the balance between the centre and the provinces must be settled."
 rch_campaign.20.a: "For now, we must work with them."
 rch_campaign.21.t: "A Cabinet in Dispute"
 rch_campaign.21.d: "Rival groups within the army and government have fallen out over appointments, money and the direction of national policy. Their supporters are gathering behind them, and a quarrel in the cabinet threatens to become a struggle for control of the state.\n\nThe government can rely on the commanders who offer their support or seek a settlement before the dispute grows."
 rch_campaign.21.a: "Back the field commanders."
 rch_campaign.21.b: "Negotiate a settlement."
 rch_campaign.22.t: "Rivalry in the North"
 rch_campaign.22.d: "The balance of power among the northern commanders is shifting. Each faction wants influence in the capital, and none is willing to see its rivals control the government unopposed.\n\nA show of strength might secure our position, but it may also deepen the divisions we are trying to overcome."
 rch_campaign.22.a: "Stand with the army."
 rch_campaign.22.b: "Seek a broader agreement."
 rch_campaign.23.t: "The Nationalist Movement"
 rch_campaign.23.d: "Nationalist organisers argue that China needs a disciplined party capable of carrying the revolution into the provinces. Some look abroad for advisers and support; others insist that the movement must build its own institutions first.\n\nThe direction they choose will shape the party's influence over the republic."
 rch_campaign.23.a: "Seek Soviet assistance."
 rch_campaign.23.b: "Build the movement at home."
 rch_campaign.24.t: "The Question of Unification"
 rch_campaign.24.d: "The Nationalists believe the time has come to bring the provinces under a single government. Their leaders seek the authority to direct the campaign, while officers loyal to the existing administration warn against giving one party control of the army.\n\nWhichever course we choose, the question of who governs China cannot be left unanswered."
 rch_campaign.24.a: "Let the Nationalists take the lead."
 rch_campaign.24.b: "Keep command with the government."
 rch_campaign.30.t: "A Government for China"
 rch_campaign.30.d: "Years of rivalry among parties and commanders have left China with a difficult inheritance. The government has an opportunity to strengthen its administration, rebuild its finances and extend its authority, but it must first persuade the provinces that it can endure."
 rch_campaign.30.a: "Begin the work of reconstruction."
 rch_campaign.31.t: "The Work of Government"
 rch_campaign.31.d: "Ministers are pressing for a more settled administration. The government must choose its allies carefully, improve its standing in the provinces and show that the capital can do more than survive one crisis after another."
 rch_campaign.31.a: "Strengthen the government."
 rch_campaign.33.t: "The Manchurian Question"
 rch_campaign.33.d: "Japanese interests in Manchuria have become a growing concern for the government. Reports from the north speak of mounting pressure over railways, security and the authority of local officials.\n\nWe can take our case abroad or seek to avoid a confrontation while China prepares for the future."
 rch_campaign.33.friendly.d: "Cooperation with Japan has not settled every question in Manchuria. Chinese officials are concerned that arrangements over railways and security may leave the government with less authority in the region.\n\nWe can press our case or defer the dispute in the hope of preserving the relationship."
 rch_campaign.33.a: "Make our position known."
 rch_campaign.33.b: "Avoid a confrontation for now."
 rch_campaign.35.t: "China Faces a New Year"
 rch_campaign.35.d: "The republic enters a new year with old questions still unresolved. The government must secure its finances, retain the loyalty of its commanders and defend China's place in a world growing more dangerous."
 rch_campaign.35.a: "The work continues."
 rch_campaign.40.t: "The Republic Endures"
 rch_campaign.40.d: "The government has weathered the latest challenge to its authority. Its supporters can point to a capital that still governs and institutions that have survived the strain. Much remains to be done, but the republic has been given time to do it."
 rch_campaign.40.a: "The republic stands."
 rch_campaign.41.t: "A Government in Crisis"
 rch_campaign.41.d: "The government's efforts to secure its position have fallen short. Confidence is ebbing, provincial leaders are making their own arrangements and the authority of the capital is in doubt. The republic faces an uncertain future."
 rch_campaign.41.a: "We must reckon with the consequences."
 rch_campaign.42.t: "The Question of the Crown"
 rch_campaign.42.d: "Supporters of the president have prepared petitions calling for the restoration of the monarchy. They argue that a throne would give China the authority and continuity its government has struggled to establish. Their opponents warn that a crown would divide the country and undo the promises of the revolution.\n\nThe president must answer."
 rch_campaign.42.already.d: "The president has accepted the throne, but the question of the monarchy is far from settled. Supporters of the new order promise a stronger government; opponents in the provinces fear that the revolution's gains are being undone.\n\nThe court must now prepare to govern in the face of both expectations."
 rch_campaign.42.a: "The republic will not surrender to a crown."
 rch_campaign.42.b: "The president accepts the throne."
 rch_campaign.42.c: "The throne must be defended."
