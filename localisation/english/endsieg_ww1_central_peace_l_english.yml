l_english:
 ww1_central_peace.1.t:0 "The General Peace Conference"
 ww1_central_peace.1.d:0 "The last armistices have brought the war to a close. The western delegations have begun their work and the army can now stand down on the remaining fronts. The treaties will determine whether the peace holds."
 ww1_central_peace.1.french_first.d:0 "France accepted its armistice before the eastern campaign was settled. The guns have now fallen silent on the last front, and our delegates can turn the separate armistices into a general peace."
 ww1_central_peace.1.a:0 "Conclude the settlement."
 ww1_central_peace.2.t:0 "The Western Peace Conference"
 ww1_central_peace.2.east.d:0 "With the western belligerents out of the war, our delegates can draw up terms for France and settle the claims that reach from Africa to the Pacific. The eastern armies are still in the field. Their orders have not changed."
 ww1_central_peace.2.d:0 "The western belligerents have laid down their arms. Our delegation must now settle the frontiers of France and Belgium and decide which overseas claims to press."
 ww1_central_peace.2.a:0 "Call the delegations to order."
 ww1_central_peace.3.t:0 "The Republic Beyond the Sea"
 ww1_central_peace.3.algiers.d:0 "London has refused the German terms. Officials in Algiers offer to receive a republican delegation and keep the administration in French hands. If we commission a government overseas, those who embark will take France back into the war while the authorities at home observe the armistice."
 ww1_central_peace.3.dakar.d:0 "Algiers is beyond our reach, but the governor at Dakar still answers to France. With British shipping to sustain it, Dakar could shelter a republican government and keep a French flag in the war."
 ww1_central_peace.3.london.d:0 "Neither Algiers nor Dakar can receive a government. The British offer offices in London and safe passage for our delegates. They could speak for those Frenchmen still in arms, though they would have no territory of their own."
 ww1_central_peace.3.a:0 "Send the delegation overseas."
 ww1_central_peace.3.b:0 "France must honour the armistice."
 ww1_central_peace.4.t:0 "A Government at Bordeaux"
 ww1_central_peace.4.d:0 "The German advance has put the ministries and the railways out of Paris in danger. The cabinet can move to Bordeaux and direct the war from there, while the army remains responsible for the defence of the capital."
 ww1_central_peace.4.a:0 "The ministries must leave for Bordeaux."
 ww1_central_peace.4.b:0 "The government will remain in Paris."
 ww1_central_peace.5.t:0 "France Establishes a Government in Exile"
 ww1_central_peace.5.d:0 "French representatives have established a republican government overseas with British recognition. The authorities on the mainland remain bound by the armistice. The new government has called on French servicemen and colonial administrators to continue the war."
 ww1_central_peace.5.a:0 "France fights on overseas."
 ww1_central_peace.6.t:0 "A French Committee in London"
 ww1_central_peace.6.d:0 "French delegates arriving in Britain have formed a national committee. With the principal French ports closed to them, they will raise funds, assist servicemen who reach Britain and press the case for France with the Allied governments."
 ww1_central_peace.6.a:0 "They have found a place to speak."
