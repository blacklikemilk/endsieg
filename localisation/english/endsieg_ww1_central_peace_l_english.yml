l_english:
 ww1_central_peace.1.t:0 "The General Peace"
 ww1_central_peace.1.d:0 "The remaining enemies of Germany have laid down their arms. With the fighting at an end, our diplomats can turn from separate armistices to the terms of a general peace. The decisions made at the conference will shape Europe and the overseas territories for years to come."
 ww1_central_peace.1.french_first.d:0 "France left the war while our armies were still fighting in the east. That campaign, too, has now ended, and the separate agreements can be brought together in a general settlement. Our diplomats must decide what peace will follow victory."
 ww1_central_peace.1.a:0 "Let the conference begin."
 ww1_central_peace.2.t:0 "Peace in the West"
 ww1_central_peace.2.east.d:0 "Our enemies in the west have laid down their arms, but the eastern campaign continues. The government can now settle its western claims and begin negotiations over overseas possessions while the army fights on in the east."
 ww1_central_peace.2.d:0 "The fighting against our western enemies has ended. Our representatives must now negotiate the terms of peace, including the frontiers and overseas territories affected by the war."
 ww1_central_peace.2.a:0 "We will set out our terms."
 ww1_central_peace.3.t:0 "France Beyond the Armistice"
 ww1_central_peace.3.algiers.d:0 "Britain has rejected the German terms and intends to continue the war. Officials in Algiers are prepared to receive French representatives who would do the same, even as the authorities at home observe the armistice.\n\nBritain also intends to secure important French naval stations. Sending a delegation would give the French forces overseas a government from which to continue the struggle; refusing would leave France bound by its agreement with Germany."
 ww1_central_peace.3.dakar.d:0 "Britain has refused the German terms. Algiers is beyond our reach, but Dakar remains in French hands and could shelter a delegation prepared to continue the war. British support would be essential to sustain it.\n\nLondon also intends to secure important French naval stations. We must decide whether to send representatives overseas or observe the armistice at home."
 ww1_central_peace.3.london.d:0 "Britain has rejected the German terms, but neither Algiers nor Dakar is available to receive a French government. The British offer passage and a place in London for representatives determined to continue the struggle. They would have no French territory from which to govern.\n\nLondon also intends to secure important French naval stations. We must decide whether to send a delegation or uphold the armistice."
 ww1_central_peace.3.a:0 "Send representatives to continue the fight."
 ww1_central_peace.3.b:0 "France must observe the armistice."
 ww1_central_peace.4.t:0 "The Government and Bordeaux"
 ww1_central_peace.4.d:0 "The German advance threatens the capital and the routes by which the government directs the war. Bordeaux remains in our hands and can receive the ministries. Moving them would keep the administration working if the capital falls, though it may also be taken as a sign that we expect defeat."
 ww1_central_peace.4.a:0 "Move the government to Bordeaux."
 ww1_central_peace.4.b:0 "The government will remain where it is."
 ww1_central_peace.5.t:0 "France Fights On Overseas"
 ww1_central_peace.5.d:0 "French representatives have established a government overseas and announced their intention to continue the war alongside Britain. The authorities on the mainland remain bound by the armistice with Germany.\n\nThe new government is calling on French servicemen and colonial officials to follow its lead. Whether they will do so remains to be seen."
 ww1_central_peace.5.a:0 "The French cause endures."
 ww1_central_peace.6.t:0 "A French Committee in London"
 ww1_central_peace.6.d:0 "French representatives have arrived in Britain to establish a committee opposed to the armistice. With no territory of their own, they will depend on British support to assist those who wish to continue the fight and to make their case abroad."
 ww1_central_peace.6.a:0 "They have found a place to speak."
