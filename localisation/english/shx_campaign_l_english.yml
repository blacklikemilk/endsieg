l_english:
 # Shanxi provincial command, 1916-1935.
 warlord_cohesion_fractious: "A Province of Grudges"
 warlord_cohesion_fractious_desc: "The commanders keep their own accounts of pay and insult, and the governor's orders reach the barracks long after the officers have decided what they will do."
 warlord_cohesion_brittle: "A Province Held Together"
 warlord_cohesion_brittle_desc: "The province answers when it is spoken to, though every order travels through men who are still owed something for the last one."
 warlord_cohesion_steady: "A Province That Obeys"
 warlord_cohesion_steady_desc: "Pay arrives, the officers are heard, and the countryside expects the governor's word to hold from one end of the valley to the other."
 warlord_cohesion_devoted: "A Province Behind Its Governor"
 warlord_cohesion_devoted_desc: "The garrison, the gentry and the villages act on the same instruction, which is why the province can now be asked to do more than defend itself."

 shx_provincial_command: "The Provincial Command"
 shx_provincial_command_desc: "The treasury, the arsenal, the officers and the road to the coast. Cohesion stands at [?warlord_cohesion|0] of 100 and the province owes [?warlord_patronage_debt|0] of 3 favours. What the province can afford decides what it can refuse."

 shx_band_readout_fractious: "The Command Has Come Apart"
 shx_band_readout_fractious_desc: "The province stands at [?warlord_cohesion|0] of 100. Commanderies act on their own account and the governor cannot order a march, a levy or a war until its officers answer again."
 shx_band_readout_brittle: "The Command Is Thin"
 shx_band_readout_brittle_desc: "The province stands at [?warlord_cohesion|0] of 100. It holds, but its officers are owed and its orders travel slowly, and it will not carry an offensive."
 shx_band_readout_steady: "The Command Holds"
 shx_band_readout_steady_desc: "The province stands at [?warlord_cohesion|0] of 100. The garrison answers, the treasury pays, and a conference in the provincial capital can be called and heard."
 shx_band_readout_devoted: "The Command Is the Province"
 shx_band_readout_devoted_desc: "The province stands at [?warlord_cohesion|0] of 100. The governor can spend that loyalty on a war against a rival, provided that rival is already occupied elsewhere."

 shx_pay_arrears: "Settle the Arrears"
 shx_pay_arrears_desc: "The officers have been paid in promises for two seasons. Coin from the provincial treasury buys their patience for one more."
 shx_equip_commanders: "Equipment for the Commanders"
 shx_equip_commanders_desc: "The arsenal's stores go to the men who will have to use them, and the officers remember who filled their depots."
 shx_grant_office: "An Office and a Salary"
 shx_grant_office_desc: "A commander with a provincial office has something to lose, and a reason to see the governor keep his seat."
 shx_patron_japan: "An Understanding with Japan"
 shx_patron_japan_desc: "Japanese officers offer rifles and instructors, and in return expect the province to hear their advice on what it should build and whom it should allow to survey its hills."
 shx_patron_britain: "An Understanding with Britain"
 shx_patron_britain_desc: "The treaty port houses offer credit and a market for the province's coal. They expect the governor to keep the road open and the contracts quiet."
 shx_patron_soviet: "An Understanding with Soviet Russia"
 shx_patron_soviet_desc: "The northern government offers equipment and instructors, and its agents speak of the province's villages in a language the gentry do not enjoy hearing."
 shx_stand_alone: "No Patron at All"
 shx_stand_alone_desc: "The province will owe nobody, buy nothing on credit and take no instructor it has not trained itself. It will be poorer and it will be its own."
 shx_restore_order: "Restore the Command"
 shx_restore_order_desc: "The governor rides out himself, with the pay chest and the garrison behind him, to make the commanderies answer again."
 shx_court_the_gentry: "Court the County Gentry"
 shx_court_the_gentry_desc: "The families who hold the land and the granaries are given seats and titles, and in return they deliver the levies the officers ask for."
 shx_host_the_conference: "Host the Provincial Conference"
 shx_host_the_conference_desc: "Delegates from the commanderies, the chamber of commerce and the gentry meet in the provincial capital to hear the governor's programme read aloud."
 shx_declare_clique_war: "The Province Moves"
 shx_declare_clique_war_desc: "The rival is engaged elsewhere and the garrison is behind its governor. The province can take the field to change who governs the neighbouring clique."
 shx_tt_paid_beijing: "Beijing's demand has been answered"
 shx_tt_debt_state: "Unpaid favours: [?warlord_patronage_debt|0] of 3. At three the patron's representative comes to Taiyuan, and the bill is 60 political power or 600 infantry equipment."
 shx_tt_war_cost: "The province spends 25 army experience and 20 cohesion on the campaign, and the war aim is a change of government in the neighbouring clique."

shx_nanjing_government: "The Nanjing Decade"
shx_nanjing_government_desc: "The province answers Nanjing on its own terms. Cohesion stands at [?warlord_cohesion|0] of 100, and a province that cannot hold its commanders cannot hold a statute either."
shx_enact_the_statute: "Write the Provincial Statute"
shx_enact_the_statute_desc: "The chamber, the gentry and the commanderies are brought to agree on one paper: what Nanjing keeps, what Taiyuan keeps, and what no government in China may take from the province without its consent."
shx_join_the_coalition: "Join the Northern Coalition"
shx_join_the_coalition_desc: "The northern commanders invite the province to break Nanjing before the National Government breaks them. The province joins, and the campaign ahead is one it cannot win: Nanjing is stronger, the other members are already looking for terms, and the garrison will come home unpaid."
shx_buy_back_the_concession: "Buy Back the Concession"
shx_buy_back_the_concession_desc: "The province buys the railway and the mines out of Japanese hands at the price Japan sets, and pays it in political capital the treasury cannot replace."
shx_tt_statute_terms: "The province must be holding together as A Province That Obeys or better before a statute can be written."
shx_tt_coalition_terms: "The province must be holding together as A Province That Obeys or better, must have written its statute, and must not be at war."
shx_tt_coalition_loss: "The province spends 80 political power, 18 cohesion and 4 percent stability, and the coalition is lost for good."
shx_japanese_concession: "The Northern Concession"
shx_japanese_concession_desc: "The iron road north, the coal behind it and the survey office beside it now answer to Japanese capital. The province kept its officers paid with money it did not have, and the hills will not come back cheaply."
