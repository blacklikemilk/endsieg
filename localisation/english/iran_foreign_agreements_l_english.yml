l_english:
 iran_foreign_agreements: "Foreign Agreements"
 iran_foreign_agreements_desc: "What Iran has signed, what it owes, and what it would take to be free of it.\n\nSovereignty: [?iran_sovereignty|0]/100. Foreign influence: [?iran_british_influence|0] in the south, [?iran_northern_influence|0] in the north.\n\nAgreements pay immediately and cost for years. Reform pays slowly and costs now."

 iran_accept_british_loan: "Take the British Loan"
 iran_accept_british_loan_desc: "The Imperial Bank will advance the sum, and in exchange its advisers will sit in the customs houses and sign the accounts. The money builds roads and bridges. The signature builds something else."
 iran_accept_northern_railway: "Grant the Northern Railway"
 iran_accept_northern_railway_desc: "A line from the Caspian to the frontier, built by the northern neighbour's engineers, guarded by its surveyors and scheduled by its ministry. It will move grain, troops and influence in equal measure."
 iran_accept_military_mission: "Invite a Foreign Military Mission"
 iran_accept_military_mission_desc: "The patron with the most influence in Tehran sends officers to train the army. The army will be better. It will also learn whose advice wins arguments at the palace."
 iran_accept_customs_officers: "Appoint Foreign Customs Officers"
 iran_accept_customs_officers_desc: "Revenue will rise the month they arrive and keep rising afterwards. The customs houses will answer to a foreign administration, and so will a share of the budget."
 iran_reform_customs_service: "Reform the Customs Service"
 iran_reform_customs_service_desc: "Iranian inspectors, Iranian accounts, and a treasury that knows what it is owed. It costs political capital now and pays in independence for the rest of the century."
 iran_found_national_bank: "Found the National Bank"
 iran_found_national_bank_desc: "A bank of issue owned in Tehran means the government can borrow from its own people instead of from a legation. The first loan is the hard one."
 iran_professionalise_gendarmerie: "Professionalise the Gendarmerie"
 iran_professionalise_gendarmerie_desc: "Officers paid by the state rather than by a frontier subsidy, stationed where the state needs them rather than where a neighbouring power prefers. It is slow, unglamorous and it is what sovereignty is made of."
 iran_renegotiate_concessions: "Renegotiate the Concessions"
 iran_renegotiate_concessions_desc: "A government with standing to bargain can put the existing agreements on the table. One of them will go, and its patron will remember which government removed it."
 iran_terminate_foreign_customs: "End the Foreign Customs Administration"
 iran_terminate_foreign_customs_desc: "Take the customs houses back into Iranian hands. Revenue will fall before it recovers, and the power that ran them will find other ways to make its opinion known."

 iran_british_financial_mission: "The British Financial Mission"
 iran_british_financial_mission_desc: "British advisers run the customs houses and sign the accounts. The roads are being built with their money, and the budget is being read by their legation."
 iran_northern_railway_concession: "The Northern Railway Concession"
 iran_northern_railway_concession_desc: "The line runs to the frontier and the timetable is set in the patron's capital. It carries our grain, our troops and, when it suits them, their garrisons."
 iran_foreign_military_mission: "A Foreign Military Mission"
 iran_foreign_military_mission_desc: "Foreign officers train our army and advise our staff. The army is better than it was. It also knows who its tutors answer to."
 iran_foreign_customs_administration: "Foreign Customs Administration"
 iran_foreign_customs_administration_desc: "The revenue is collected efficiently, on time, and by officials who report to a foreign administration before they report to us."
 iran_competing_concessions: "Competing Concessions"
 iran_competing_concessions_desc: "Two patrons hold privileges that cannot both be honoured. Each has noticed the other's, and each expects our government to resolve the contradiction in its favour."

 iran_campaign.73.t: "Two Legations, One Country"
 iran_campaign.73.d: "The British minister has discovered the northern railway agreement, and the northern mission has discovered the loan. Neither is surprised that we signed it. Both are offended that we signed the other, and both have sent the same question in different words: which of them is our government actually working for?"
 iran_campaign.73.a: "Honour London. Tear up the railway."
 iran_campaign.73.b: "Honour the north. Return the loan."
 iran_campaign.73.c: "Keep both, and tell each that the other is the problem."
