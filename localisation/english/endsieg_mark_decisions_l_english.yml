l_english:
 INT_GER_recall_ruhr_payroll:0 "End the Ruhr payroll"
 INT_GER_recall_ruhr_payroll_desc:0 "The unions still hold the cabinet to its promise. Ask the workers to return and end Treasury payments for passive resistance."
 INT_GER_collect_indexed_taxes:0 "Assess taxes in gold marks"
 INT_GER_collect_indexed_taxes_desc:0 "Assess liabilities in gold marks and collect their cash equivalent on the day of payment. The Treasury receives what it budgeted for, but households lose the relief of paying yesterday's bill in today's money."
 INT_GER_discount_treasury_bills:0 "Discount Treasury bills"
 INT_GER_discount_treasury_bills_desc:0 "Send short-term bills to the Reichsbank for fresh paper marks. The railways can meet Friday's payroll, at the expense of the currency in which the workers are paid."
 INT_GER_prepare_rentenbank:0 "Establish the Deutsche Rentenbank"
 INT_GER_prepare_rentenbank_desc:0 "Place a charge on agricultural and industrial property to back a new note issue. A ceiling on that issue gives the bank an answer to the Treasury's next request for credit."
 INT_GER_issue_rentenmark:0 "Issue the Rentenmark"
 INT_GER_issue_rentenmark_desc:0 "Put the new notes into circulation at one Rentenmark to one trillion paper marks. Treasury offices will accept them for taxes and settle their accounts in the same unit."
 INT_GER_mark_recall_tt:0 "Ends passive resistance and cuts currency pressure by 8. The Ruhr payroll will no longer add 4 points each month."
 INT_GER_mark_tax_tt:0 "Subtracts 4 pressure at each monthly closing for 62 days. The Treasury cannot discount new bills during this policy."
 INT_GER_mark_discount_tt:0 "Adds 5 pressure at each monthly closing for 62 days. The Treasury cannot index taxes during this policy."
 INT_GER_mark_bank_tt:0 "Subtracts 4 pressure at each monthly closing and allows the Rentenbank to issue notes from 15 November 1923."
 INT_GER_mark_reform_tt:0 "Closes the ledger and grants Currency Stabilized. Below 35 pressure, gain 25 political power. At 70 or above, lose 2% stability."
 INT_GER_rentenbank_prepared:0 "The Deutsche Rentenbank has been established"
 INT_GER_mark_tax_drive:0 "Gold-mark tax assessments are in force"
 INT_GER_mark_discounting:0 "The Reichsbank is discounting Treasury bills"
 INT_GER_mark_crisis_active:0 "The paper mark crisis is active"
