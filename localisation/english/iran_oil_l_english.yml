l_english:
iran_oil_settlement: "The Oil Settlement"
iran_oil_settlement_desc: "The company holds a concession granted by a government that no longer exists, on terms written half a century ago by men who are dead. Every cabinet since the war has wanted a larger share of the revenue and none has wanted to be the one that broke the contract. The refinery at Abadan burns off what the country cannot use, and the wells at Masjed Soleyman have never been taxed by a government that could count them."

iran_renegotiate_royalties: "Press the Company for Better Royalties"
iran_renegotiate_royalties_desc: "Sit the company's directors down and point at the gap between what leaves Abadan and what reaches the treasury. They will claim the concession is iron, then offer something. What they offer is the difference between a government that pays its soldiers and one that does not."

iran_abadan_company_deal: "Settle the Concession Question"
iran_abadan_company_deal_desc: "The long renegotiation: a new agreement, a longer lease, a larger royalty and the company's hold on Iranian oil written down in fresh ink for another generation. The treasury gains, the company gains, and the next government inherits this bargain instead of the old one."

iran_cancel_the_concession: "Cancel the Concession"
iran_cancel_the_concession_desc: "Revoke the concession outright and take the wells into the nation's own hands. The country will cheer in the streets and the company will take its case to London, where the men it complains to own the telegraph lines, the port at Abadan and half the shipping in the Gulf. This is a decision made once and paid for afterwards."

iran_domestic_refining: "Build a Refinery of Our Own"
iran_domestic_refining_desc: "Iran burns crude and imports what it can refine. A refinery at Kermanshah, staffed by Iranians and paid for out of oil, would make the country's fuel its own business instead of a line on a foreign company's balance sheet."

iran_oil_revenue_fund: "Spend the Oil Revenue on the Ground"
iran_oil_revenue_fund_desc: "Roads, bridges and the tracks that reach the oilfields. Revenue that stays in a vault buys nothing and impresses no one; revenue spent in Khuzestan is visible from the road, and the men working it are reminded who paid for it."
