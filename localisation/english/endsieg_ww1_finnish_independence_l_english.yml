 FNN_1917_republic:0 "Finland"
 FNN_1917_republic_DEF:0 "Finland"
 FNN_1917_republic_ADJ:0 "Finnish"
 ww1_finnish_independence.1.t:0 "Finland Declares Independence"
 ww1_finnish_independence.1.d:0 "The Finnish Parliament has approved the Senate's declaration of independence. The government in Helsinki is seeking recognition abroad. The first answer must come from Petrograd, where the new Russian government is still consolidating its authority."
 ww1_finnish_independence.1.a:0 "Finland takes its place among the nations."
 ww1_finnish_independence.2.t:0 "Soviet Russia Recognizes Finland"
 ww1_finnish_independence.2.d:0 "The Council of People's Commissars has approved a decree recognizing Finnish independence. The Finnish delegation can return home with the result it came to Petrograd to secure, though tensions between the rival guards in Finland are growing."
 ww1_finnish_independence.2.a:0 "Petrograd has given its answer."
 ww1_russia.46.c:0 "The rival guards have taken up arms."
