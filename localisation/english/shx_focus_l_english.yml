l_english:
 # Shanxi focus trees, 1916-1935.
 shx_rise_treasury_navigation: "The Provincial Treasury"
 shx_rise_army_navigation: "The Arsenal"
 shx_rise_beijing_navigation: "The Question from Beijing"
 shx_wars_brokerage_navigation: "The Brokers' Table"
 shx_wars_borders_navigation: "Suiyuan and Chahar"
 shx_wars_army_navigation: "The Provincial Army"

 SHX_model_province: "The Model Province"
 SHX_model_province_desc: "Yan Xishan's programme is not to conquer but to be the one province that survives with its books balanced, its arsenal working and its villages quiet. The treasury comes first, because nothing else can be paid for without it."
 SHX_provincial_treasury: "The Provincial Treasury"
 SHX_provincial_treasury_desc: "A provincial bank, a land tax collected by the province rather than by a warlord's quartermaster, and a treasury that can pay its own garrison."
 SHX_arsenal_expansion: "Expand the Taiyuan Arsenal"
 SHX_arsenal_expansion_desc: "The arsenal already makes rifles and small shells. A second line means the province can arm a levy without asking a patron for every crate."
 SHX_three_thirds_compact: "The Three Thirds"
 SHX_three_thirds_compact_desc: "Village self-government, provincial administration and the central state each take a share of the county's business. The compact gives the countryside a reason to answer the governor rather than the garrison."
 SHX_officer_school: "The Officer School"
 SHX_officer_school_desc: "Officers trained in Taiyuan rather than in Baoding owe their commissions to the province, and the province expects them to remember it."
 SHX_refuse_beijing: "Refuse Beijing"
 SHX_refuse_beijing_desc: "The dispatch is answered with a courteous letter and no troops. Beijing can do nothing about it now, and the province keeps its men."
 SHX_pay_beijing: "Send the Detachment"
 SHX_pay_beijing_desc: "The province pays for the detachment Beijing asked for and keeps the capital's goodwill and the road east open. The officers will notice that the treasury was opened for the capital and not for them."
 SHX_railway_to_the_coast: "The Railway to the Coast"
 SHX_railway_to_the_coast_desc: "A line running east rather than north ties the province's coal and iron to the coast's markets instead of to whichever clique holds the capital."
 SHX_provincial_army: "The Provincial Army"
 SHX_provincial_army_desc: "A garrison the province pays, feeds and can move without borrowing another government's transport."
 SHX_price_of_neutrality: "The Price of Neutrality"
 SHX_price_of_neutrality_desc: "Neutrality has kept the province out of four wars and cost it four opportunities. From here the province prices what staying out is worth."
 SHX_the_model_province: "The Model Province"
 SHX_the_model_province_desc: "Books balanced, arsenal working, villages quiet and no army on the province's soil but its own. Yan Xishan's model province is finished, and the next decade will be spent defending it."

 SHX_brokers_table: "The Brokers' Table"
 SHX_brokers_table_desc: "Every clique at war needs a province that is not in it. Taiyuan sells passage, munitions and a room where the parties can meet, and charges for all three."
 SHX_sell_passage: "Sell the Passage"
 SHX_sell_passage_desc: "The railway and the roads east carry other men's armies. The province charges for the use of them, and keeps its own men out of the fighting."
 SHX_sell_munitions: "Sell the Arsenal's Output"
 SHX_sell_munitions_desc: "Rifles from Taiyuan reach whichever clique pays first. The arsenal expands again on the proceeds, and the province learns exactly how much the others need it."
 SHX_host_arbitration: "Host the Arbitration"
 SHX_host_arbitration_desc: "When two cliques cannot finish a war, they meet in Taiyuan. The province that provides the table also drafts the terms."
 SHX_suiyuan_question: "The Suiyuan Question"
 SHX_suiyuan_question_desc: "Suiyuan lies north across the pass, and every government in China has claimed it while none has governed it. The province has the railway and the nearest garrison."
 SHX_chahar_road: "The Chahar Road"
 SHX_chahar_road_desc: "The road north through Chahar is a trade route while it is quiet and a march route when it is not. The province surveys it and files the claim."
 SHX_join_the_expedition: "Join the Northern Expedition"
 SHX_join_the_expedition_desc: "The southern army is moving north and will remember who joined it. The province sends its men late, when the outcome is no longer in doubt, and sends them in its own uniform."
 SHX_wait_out_the_expedition: "Wait Out the Expedition"
 SHX_wait_out_the_expedition_desc: "The province stays inside its own borders and lets the expedition pass. The treasury keeps what a campaign would have spent, and the southern government keeps a note of who did not come."
 SHX_provincial_army_reform: "Reform the Provincial Army"
 SHX_provincial_army_reform_desc: "The garrison is reorganised into divisions the province can supply, with its own officers, its own depots and no borrowed transport."
 SHX_the_province_endures: "The Province Endures"
 SHX_the_province_endures_desc: "The cliques have fought each other to exhaustion and the province is still here, still paid for, and still governed from Taiyuan. What comes next will be decided by whoever holds the capital, and the province intends to be worth buying."

shx_nanjing_submission_navigation: "The Answer to Nanjing"
shx_nanjing_statute_navigation: "The Provincial Statute"
shx_nanjing_arsenal_navigation: "The Northern Arsenal"

SHX_answers_nanjing: "Answer Nanjing"
SHX_answers_nanjing_desc: "A letter from Nanjing asks the province to accept the National Government's authority over its taxes, its garrison and its courts. Yan Xishan has governed Shanxi since the dynasty still stood, and he reads the letter twice before he answers it."
SHX_nominal_submission: "A Signature and Nothing Else"
SHX_nominal_submission_desc: "The province accepts the title Nanjing offers and returns the tax registers to Taiyuan unopened. The National Government gains a province on its map. The province keeps the government it already had."
SHX_real_submission: "Take Nanjing's Officers"
SHX_real_submission_desc: "The province accepts Nanjing's officers, its currency and its orders. The commanders who expected to be consulted find the ministry's appointments waiting in their own depots. The garrison is paid on time and answers to a government two hundred miles away."
SHX_autonomy_statute: "The Provincial Statute"
SHX_autonomy_statute_desc: "The province drafts the terms on which it belongs to China. Nanjing keeps the name, the flag and the foreign ministry. Taiyuan keeps the taxes, the courts, the schools and the right to raise its own garrison, and the statute sets all of it down in writing."
SHX_the_charter: "The Statute Chamber"
SHX_the_charter_desc: "Delegates from the commanderies, the chamber of commerce and the county gentry meet in the provincial capital to hear the statute read and to sign it. A province that has signed such a paper is harder for any government to take back."
SHX_nanjing_command: "The Nanjing Command"
SHX_nanjing_command_desc: "The garrison is reorganised along Nanjing's tables, with Nanjing's ranks and Nanjing's pay. It is a better army than the province could pay for on its own, and it belongs to a government that can order it onto a train."
SHX_northern_arsenal: "The Northern Arsenal"
SHX_northern_arsenal_desc: "Iron from the northern hills and coal from the valley floor feed a mill the province owns outright. The statute's tax registers pay for it, and no patron is owed a single crate from its output."
SHX_the_squeeze: "The Northern Squeeze"
SHX_the_squeeze_desc: "Japanese surveyors arrive to walk the line north and to value the coal behind it. They speak of a loan, a railway and a joint company, and every one of those words means the province's mountains will belong to somebody else."
SHX_garrison_reform: "A Garrison With Schools"
SHX_garrison_reform_desc: "Schools, depots and a staff college in Taiyuan, staffed by officers trained in the province and promoted by it. The garrison stops needing borrowed instructors and starts needing only time."
SHX_the_decade_closes: "The Decade Closes"
SHX_the_decade_closes_desc: "Nanjing has fought its wars, the coalitions have broken, and the province is still governed from Taiyuan on its own statute. The next war will come from the north, and Shanxi will meet it with its own treasury, its own arsenal and its own officers."
