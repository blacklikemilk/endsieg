l_english:
 endsieg_soviet_commanders.1.t: "The Death of Lev Dovator"
 endsieg_soviet_commanders.1.d: "Major General Lev Dovator has been killed near Ruza during the counteroffensive west of Moscow. His cavalry corps will continue the advance under a new commander."
 endsieg_soviet_commanders.1.a: "The cavalry will remember him."
 endsieg_soviet_commanders.1.tt: "§YLev Dovator§! has been removed from the commander roster."
 endsieg_soviet_commanders.2.t: "Shaposhnikov Steps Down"
 endsieg_soviet_commanders.2.d: "Marshal Boris Shaposhnikov has asked to be relieved as Chief of the General Staff. His doctors have warned that he can no longer sustain the hours the post demands. His staff will take over the day-to-day work while the marshal withdraws from active command."
 endsieg_soviet_commanders.2.a: "Give the marshal time to recover."
 endsieg_soviet_commanders.2.tt: "§YBoris Shaposhnikov§! has retired from active command and is no longer available as a military theorist."
 endsieg_soviet_commanders.3.t: "The Death of Nikolai Vatutin"
 endsieg_soviet_commanders.3.d: "General Nikolai Vatutin has died in hospital in Kyiv. He was wounded in an ambush while travelling between headquarters in February. The General Staff has ordered the front to continue operations under its current command."
 endsieg_soviet_commanders.3.a: "We have lost a fine commander."
 endsieg_soviet_commanders.3.tt: "§YNikolai Vatutin§! has been removed from the commander roster."
 endsieg_soviet_commanders.4.t: "The Death of Ivan Chernyakhovsky"
 endsieg_soviet_commanders.4.d: "General Ivan Chernyakhovsky has died of wounds after coming under artillery fire in East Prussia. The General Staff is preparing new orders for the 3rd Belorussian Front."
 endsieg_soviet_commanders.4.a: "Send our condolences to his family."
 endsieg_soviet_commanders.4.tt: "§YIvan Chernyakhovsky§! has been removed from the commander roster."
 endsieg_soviet_commanders.5.t: "The Death of Boris Shaposhnikov"
 endsieg_soviet_commanders.5.d: "Marshal Boris Shaposhnikov has died after a long illness. Since leaving the General Staff he had devoted himself to the training of its officers. Generations of staff officers studied his work on mobilization and the conduct of war."
 endsieg_soviet_commanders.5.a: "His work will outlast him."
