l_english:
 iran_settle_pahlavi_tt: "Reza Shah is proclaimed Shah: the Majlis is set aside, the cabinet serves the crown, and the army answers to the sovereign."
 iran_settle_constitution_tt: "Ahmad Shah keeps his throne as a constitutional monarch: the Majlis legislates, the cabinet answers to the chamber, and the crown reigns within the law."
 iran_settle_republic_tt: "The assembly abolishes the monarchy: a president, an elected chamber and a cabinet responsible to it replace the court."
 iran_settle_qajar_restoration_tt: "The assembly confirms the Qajar house: the court resumes its ministries, elections are suspended and the crown rules again over a country that has learned to argue."
 iran_settle_nationalist_tt: "The national front forms a government without elections: the movement, its officers and its press hold the state between them."
 iran_settle_socialist_tt: "A republic of councils is proclaimed: the estates and the mills pass to committees of those who work them, and the state is run by the organisations that made it."
 iran_trans_iranian_railway_tt: "A railway from Bandar Shahpur through Ahvaz and Tehran to Bandar Shah: new workshop capacity in Khuzestan and graded line and road along the whole route."
 iran_state_railways_tt: "A state railway from the Khuzestan oilfields to the Caspian, funded from the treasury and voted through the chamber rather than ordered by decree."
 iran_treasury_path_bonus_tt: "A government that has already made the treasury its own collects a further grant of political power and authority."
 iran_gendarmerie_bonus_tt: "A gendarmerie already under arms adds political power and a measure of quiet to the disarmament."
 iran_germany_path_bonus_tt: "A cabinet already leaning towards Berlin draws political power and army experience from the mission."
 iran_oil_national_bonus_tt: "A government already committed to nationalising the oil draws political power and authority from the expansion."
 iran_fund_the_debt_settlement: "Fund the Debt Settlement"
 iran_fund_the_debt_settlement_desc: "The wartime debt to the British treasury is still carried on the books, and the interest is paid in obligations. Put money against the principal and the government owes less to a creditor that has no interest in its freedom."
 iran_league_appeal: "Appeal to Geneva"
 iran_league_appeal_desc: "A seat at the League is worth nothing until it is used. Bring the concession dispute before the council, and let the record speak for the government where the Royal Navy cannot."
