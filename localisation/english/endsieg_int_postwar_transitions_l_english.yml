l_english:
 INT_postwar_transitions.1.t:0 "The Administration of Banat"
 INT_postwar_transitions.1.d:0 "The settlement of Banat calls for our forces to withdraw from the Timișoara district and hand administration to Romania. The western district will remain under our authority."
 INT_postwar_transitions.1.a:0 "Carry out the handover."
 INT_postwar_transitions.1.b:0 "Retain the district."
 INT_postwar_transitions.2.t:0 "Romanian Administration in Transylvania"
 INT_postwar_transitions.2.d:0 "Following the assembly at Alba Iulia and the collapse of Austria-Hungary, Romanian authorities are preparing to take over the districts still administered by Hungary."
 INT_postwar_transitions.2.a:0 "Establish our administration."
 INT_postwar_transitions.2.b:0 "Leave the districts as they are."
 INT_postwar_transitions.3.t:0 "The Handover of Burgenland"
 INT_postwar_transitions.3.d:0 "The agreements over western Hungary provide for the handover of Burgenland to Austria. Sopron and its surrounding district are the subject of a separate plebiscite."
 INT_postwar_transitions.3.a:0 "Carry out the agreement."
 INT_postwar_transitions.3.b:0 "Retain Burgenland."
 INT_postwar_transitions.4.t:0 "The Ukrainian Question"
 INT_postwar_transitions.4.d:0 "German troops are withdrawing from the former imperial borderlands. The Ukrainian government remains in Kyiv while the Red Army considers an advance into the region."
 INT_postwar_transitions.4.a:0 "Order the advance into Ukraine."
 INT_postwar_transitions.4.b:0 "Leave Ukraine alone."
 ww1_romania.1922.t:0 "Ferdinand Appoints Brătianu"
 ww1_romania.1922.d:0 "King Ferdinand has asked Ion I. C. Brătianu to form a National Liberal cabinet. The new government will seek a parliamentary majority and a constitution for the enlarged kingdom."
 ww1_romania.1922.a:0 "Form the cabinet."
 INT_postwar_transitions.7.t:0 "The Southern Frontier of Albania"
 INT_postwar_transitions.7.d:0 "The Conference of Ambassadors has confirmed Albania's southern frontier. In Northern Epirus, Albanian officials are taking charge of the districts along the Greek border."
 INT_postwar_transitions.7.a:0 "Establish the border posts."
