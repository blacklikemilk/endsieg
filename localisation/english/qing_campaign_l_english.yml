l_english:
 qing_regency_court: "The Regency Court"
 qing_regency_court_desc: "The throne is occupied by a child and governed by a regent, a Grand Council and a household that has outlived its purpose. Every decision requires the agreement of men who disagree about whether the dynasty should survive at all."
 qing_constitutional_monarchy: "A Constitutional Monarchy"
 qing_constitutional_monarchy_desc: "The crown governs through a written constitution, a chamber with a mandate and a cabinet that answers to it. The arrangement gives the dynasty a law it can appeal to and a parliament it cannot dismiss."
 qing_imperial_autocracy: "The Imperial Autocracy"
 qing_imperial_autocracy_desc: "The court governs through the Grand Council, the governors it appoints and the army it pays. Decisions arrive quickly and the provinces have no legal way to object, so their objections find other forms."
 qing_beiyang_government: "The Beiyang Government"
 qing_beiyang_government_desc: "The army runs the ministries and the provinces, and the throne survives because the officers find it useful. Policy is made by men who measure every question in divisions and pay."
 qing_federal_empire: "The Federal Empire"
 qing_federal_empire_desc: "The provinces keep their taxes, their assemblies and their armies, and Beijing keeps the dynasty, the foreign service and the name of China. The union is real, voluntary and permanently negotiated."
 qing_banner_army: "The Banner Army"
 qing_banner_army_desc: "The banners remain the dynasty's oldest garrison and its least useful one. They are loyal, expensive and unable to fight a modern war, and the court keeps them because loyalty is scarce."
 qing_new_army: "The New Army"
 qing_new_army_desc: "The divisions raised after 1895 carry modern rifles and a modern education. They are the best troops in China and the most politically conscious, which the court has not yet decided is an advantage."
 qing_modern_officer_corps: "A Modern Officer Corps"
 qing_modern_officer_corps_desc: "Staff officers trained in academies and attached to foreign missions can plan a campaign, supply it and fight it. They also expect to be consulted, and they know how to make themselves heard."
 qing_broken_treasury: "The Broken Treasury"
 qing_broken_treasury_desc: "The government collects less than it spends and borrows against revenue it has already pledged. Soldiers are paid late, officials are paid in promises and every reform begins with a shortfall."
 qing_japanese_pressure: "Japanese Pressure"
 qing_japanese_pressure_desc: "Tokyo treats China as a market, a frontier and a future colony, and it makes the same demands to every government in Beijing. Refusing them costs money. Accepting them costs legitimacy."
 qing_wartime_mobilisation: "Wartime Mobilisation"
 qing_wartime_mobilisation_desc: "The country is organised for war. Conscription, requisition and war production take precedence over every civilian priority, and the government's survival now depends on the front."

 QIN_throne_and_assembly: "The Throne and the Assembly"
 QIN_throne_and_assembly_of_power_category: "The dynasty's authority is claimed by the court and by the assemblies that speak for the provinces. Neither can govern alone, and each believes the other has taken what belongs to it."
 QIN_throne_and_assembly_category: "The Throne and the Assembly"
 QIN_throne_and_assembly_category_desc: "Where power actually sits in China."
 QIN_side_court: "The Court"
 QIN_side_assembly: "The Assembly"
 QIN_bop_settlement: "The Written Settlement"
 QIN_bop_court_ascendant: "The Court Ascendant"
 QIN_bop_court_government: "Government by the Court"
 QIN_bop_court_absolutism: "Rule by Decree"
 QIN_bop_assembly_ascendant: "The Assembly Ascendant"
 QIN_bop_assembly_government: "Government by the Assembly"
 QIN_bop_assembly_supremacy: "The Sovereignty of the Assembly"

 qing_imperial_government: "The Imperial Government"
 qing_imperial_government_desc: "The court, the ministries and the reform programme."
 qing_reconstruction: "Reconstruction and Revenue"
 qing_reconstruction_desc: "Railways, arsenals, currency and relief."
 qing_foreign_policy: "Foreign Affairs"
 qing_foreign_policy_desc: "The powers, the concessions and the Japanese question."
 qing_war_council: "The War Council"
 qing_war_council_desc: "Mobilisation, supply and the government of a country at war."

 QIN_liang_qichao: "Liang Qichao"
 QIN_liang_qichao_desc: "A writer and reformer who has spent his life arguing that China can change without ceasing to be China. He is useful to any government and trusted by none of them."
 qing_unequal_treaties: "The Unequal Treaties"
 qing_unequal_treaties_desc: "The customs are supervised by foreign commissioners, foreigners are tried in their own courts and the indemnities are paid before the army is. The government cannot tax or judge its own subjects without a consul's consent."
 qing_provincial_autonomy: "Provincial Autonomy"
 qing_provincial_autonomy_desc: "The land tax, the likin and the provincial troops belong to the governor, and Beijing receives a remittance when he is willing. Every ministry in the capital is financed by men it cannot instruct."
 qing_reformed_finance: "A Reformed Treasury"
 qing_reformed_finance_desc: "One bank issues the notes, one budget is published and the salt revenue is collected by the ministry rather than by the provinces. The government can finally borrow at a rate it names."
 qing_public_schools: "Public Schools"
 qing_public_schools_desc: "A curriculum, normal schools to teach the teachers and county budgets that pay them. The next generation of officials, officers and editors is being written here."
 qing_regime_settled: "The Xinhai revolution has been settled"
