l_english:
iran_ww1: "Constitutional Persia and the Great War"
iran_interwar: "The Interwar Settlement"
iran_ww2: "Iran and the Second World War"
iran_politics_navigation: "Government and Provinces"
iran_economy_navigation: "Treasury and Development"
iran_army_navigation: "Army and National Defence"
iran_diplomacy_navigation: "Foreign Relations and Sovereignty"
IR1_second_majlis: "The Second Majlis"
IR1_second_majlis_desc: "The restoration of parliament has brought constitutional government back to Tehran, but the Majlis still depends on provincial allies and an uncertain treasury. Deputies must decide how much authority the cabinet can exercise beyond the capital."
IR1_parliamentary_mandate: "A Parliamentary Mandate"
IR1_parliamentary_mandate_desc: "Give the cabinet a mandate from the Majlis to collect revenue and negotiate with provincial leaders. Parliamentary backing strengthens state authority and opens the domestic treasury programme."
IR1_court_patronage: "The Court's Patronage"
IR1_court_patronage_desc: "The Qajar court can rally officials and influential families who distrust parliamentary reform. Their support gives the cabinet political room to act, at the cost of greater foreign leverage over a government sustained by patronage."
IR1_provincial_assemblies: "Work with the Anjomans"
IR1_provincial_assemblies_desc: "Provincial constitutional associations helped defend the Majlis and expect a voice in local government. Open negotiations with their representatives and organize a security programme that can support a provincial compact."
IR1_bakhtiari_bargain: "The Bakhtiari Bargain"
IR1_bakhtiari_bargain_desc: "Bakhtiari leaders helped restore constitutional rule and hold influence the court cannot ignore. Seek their cooperation in provincial administration and prepare the security programme needed to sustain an agreement outside Tehran."
IR1_law_in_the_provinces: "Law in the Provinces"
IR1_law_in_the_provinces_desc: "A negotiated provincial compact gives the cabinet a basis for enforcing national law without reopening every local dispute. Once that compact is complete, affirm the constitutional settlement and strengthen public confidence in the government."
IR1_empty_treasury: "The Empty Treasury"
IR1_empty_treasury_desc: "Customs receipts and provincial taxes reach Tehran irregularly, leaving officials unpaid and reforms unfunded. Begin a treasury programme to bring revenue under the cabinet's supervision."
IR1_shuster_mission: "Shuster's Financial Mission"
IR1_shuster_mission_desc: "Morgan Shuster's proposed financial reforms offer the Majlis a way to supervise revenue and challenge privileged tax exemptions. Support the mission to strengthen central authority and establish a treasury administration answerable to the government."
IR1_customs_revenue: "Put Customs to Work"
IR1_customs_revenue_desc: "Merchants pay duties at the frontiers, but the cabinet needs reliable access to those receipts. Organize customs income into a development programme and secure political support for provincial construction."
IR1_treasury_gendarmerie: "A Treasury Gendarmerie"
IR1_treasury_gendarmerie_desc: "Tax collectors need protection on roads where local armed men can stop revenue from reaching the treasury. Prepare a gendarmerie programme and train officers to support the financial administration."
IR1_domestic_workshops: "Support Persian Workshops"
IR1_domestic_workshops_desc: "Tehran's workshops can supply civilian needs if craftsmen receive premises, credit and dependable orders. Authorize workshop subsidies and construction projects, with investment to follow through the national projects programme."
IR1_a_national_budget: "A National Budget"
IR1_a_national_budget_desc: "The treasury reform must first turn promised provincial receipts into regular income. With that work complete, adopt a national budget that strengthens confidence in the cabinet and anchors future development."
IR1_divided_command: "A Divided Command"
IR1_divided_command_desc: "The Cossack Brigade, gendarmes and provincial forces answer to different officers and patrons. Begin a common security programme and use their experience to prepare a more dependable national command."
IR1_swedish_officers: "The Swedish Officers"
IR1_swedish_officers_desc: "Swedish instructors offer a model for a gendarmerie trained to patrol roads and enforce the government's authority. Make their methods the foundation of officer training rather than building the army around the Cossack command."
IR1_cossack_command: "The Cossack Command"
IR1_cossack_command_desc: "The Persian Cossack Brigade provides an established officer corps and a force within reach of Tehran. Use its command tradition as the basis for military training, giving the brigade a central place in the national army."
IR1_officers_college: "An Officers' College"
IR1_officers_college_desc: "An equipped gendarmerie gives trained officers a force in which to serve. Once its equipment programme is complete, establish professional instruction and prepare a reserve programme for the army."
IR1_frontier_posts: "Frontier Posts"
IR1_frontier_posts_desc: "A permanent defensive post in Iranian Azerbaijan will give the army a stronger position on the northwestern approaches. Build fortifications there while the province remains under our ownership and control."
IR1_tehran_arsenal: "The Tehran Arsenal"
IR1_tehran_arsenal_desc: "The army needs workshops that can repair weapons and sustain domestic arms production. Expand Tehran's arsenal with a military factory, provided the capital remains in Iranian hands."
IR1_between_empires: "Between the Empires"
IR1_between_empires_desc: "British and Russian interests constrain Persian diplomacy, and their rivalry reaches into the treasury and armed forces. Open a foreign policy programme to choose how the government will defend its independence."
IR1_guarded_neutrality: "Guarded Neutrality"
IR1_guarded_neutrality_desc: "Declare that Persian territory must remain outside the European powers' quarrels and prepare the public to defend that position. Neutrality will be our chosen policy rather than an understanding with either camp."
IR1_entente_understanding: "An Entente Understanding"
IR1_entente_understanding_desc: "An understanding with Britain could ease the government's immediate shortage of arms. Examine British credit and its obligations before deciding whether foreign supplies justify deeper dependence."
IR1_german_opening: "A German Opening"
IR1_german_opening_desc: "German contacts offer a possible source of equipment outside the established British and Russian channels. Open discussions on assistance, reserving the government's decision on the terms offered."
IR1_protect_the_harvest: "Protect the Harvest"
IR1_protect_the_harvest_desc: "Requisition, insecure roads and disrupted trade threaten the movement of grain to Persian towns. Establish a relief programme so that civilian distribution can compete for supplies with the army."
IR1_caspian_communications: "Caspian Communications"
IR1_caspian_communications_desc: "Gilan's roads connect Caspian trade to the interior and carry food toward the capital. Give their improvement priority in the national construction programme, opening a paid road project in the province."
IR1_gulf_lifeline: "The Gulf Lifeline"
IR1_gulf_lifeline_desc: "The Gulf approaches provide an alternative route for goods when northern communications fail. Prioritize infrastructure in Hormozgan and open a construction project to improve the southern lifeline."
IR1_independence_at_the_peace: "Independence at the Peace"
IR1_independence_at_the_peace_desc: "A government that has delivered relief can speak with greater authority for a population worn down by war. After the peace negotiations become a practical prospect, press Persia's claim to independence and strengthen the cabinet's standing at home."
IR2_postwar_settlement: "The Postwar Settlement"
IR2_postwar_settlement_desc: "War has left the government short of revenue and the provinces in need of security. Review the proposed foreign settlement and reopen the treasury and provincial administration programmes."
IR2_reject_the_agreement: "Reject the 1919 Agreement"
IR2_reject_the_agreement_desc: "The Anglo-Persian Agreement promises assistance that would give Britain a larger role in Persian finance and military affairs. Reject its terms and reduce foreign leverage over the government."
IR2_accept_the_agreement: "Accept the 1919 Agreement"
IR2_accept_the_agreement_desc: "British assistance could provide equipment for a government struggling to restore order. Commit to the agreement's tutelary framework and examine the credit on offer, accepting the political burden of that dependence."
IR2_command_and_cabinet: "Command and Cabinet"
IR2_command_and_cabinet_desc: "Army officers seek a stronger executive, and deputies fear that military intervention will weaken the Majlis. Decide whether to prepare an assembly to consider the future settlement or defend parliamentary guarantees."
IR2_pahlavi_settlement: "The Pahlavi Settlement"
IR2_pahlavi_settlement_desc: "A dynastic settlement can place Reza Khan at the head of a new Pahlavi monarchy. Establish a non-elective royal government and strengthen central authority, accepting the unrest that accompanies the transfer of power."
IR2_constitutional_crown: "The Constitutional Crown"
IR2_constitutional_crown_desc: "Retain the monarchy under a constitutional settlement with elections and a stronger Majlis. The crown will remain, and parliamentary legitimacy will help the government strengthen authority without a dynastic rupture."
IR2_parliamentary_republic: "A Parliamentary Republic"
IR2_parliamentary_republic_desc: "A provincial compact and a reformed treasury can support an elected government without a hereditary crown. Establish a parliamentary republic and bring Mohammad Ali Foroughi forward if he is available, accepting the immediate strain of the constitutional change."
IR2_royal_administration: "A Royal Administration"
IR2_royal_administration_desc: "The Pahlavi monarchy needs officials who can carry the cabinet's orders into the provinces. Establish a civil service and open equipment-backed provincial security operations to extend central authority."
IR2_ministers_before_the_majlis: "Ministers before the Majlis"
IR2_ministers_before_the_majlis_desc: "The constitutional crown depends on ministers who can defend their conduct before elected deputies. Establish a civil service within that settlement and strengthen confidence in parliamentary government."
IR2_responsible_government: "Responsible Government"
IR2_responsible_government_desc: "The republic needs a civil service that serves elected ministers and keeps provincial administration working through changes of cabinet. Commit the government to constitutional administration and the preparation of elections."
IR2_law_of_the_state: "The Law of the State"
IR2_law_of_the_state_desc: "The provincial compact gives national courts a basis for exercising jurisdiction outside Tehran. Establish the courts under our chosen government and affirm that provincial administration must answer to national law."
IR2_treasury_commission: "The Treasury Commission"
IR2_treasury_commission_desc: "A treasury commission can assess revenue and direct scarce funds toward construction. Open the domestic reform and national projects programmes to support the interwar reconstruction."
IR2_domestic_capital: "Mobilize Domestic Capital"
IR2_domestic_capital_desc: "Persian merchants and workshop owners can finance development without a new foreign concession. Favor domestic capital and authorize the Tehran workshop subsidy as the first practical investment."
IR2_foreign_concessions: "Foreign Concessions"
IR2_foreign_concessions_desc: "British supplies offer a quicker answer to shortages than domestic investment alone. Examine an equipment credit, weighing its immediate usefulness against the influence it gives the lender."
IR2_khuzestan_oil: "Khuzestan Oil"
IR2_khuzestan_oil_desc: "The oilfields of Khuzestan are central to the country's export income and its relations with Britain. Open a capacity project in the province so that investment can expand extraction and ease foreign dependence."
IR2_trans_iranian_railway: "The Trans-Iranian Railway"
IR2_trans_iranian_railway_desc: "A railway linking Tehran with the Caspian and Khuzestan would connect markets separated by difficult roads. Authorize northern and southern railway projects, each requiring sustained use of civilian industry."
IR2_schools_and_workshops: "Schools and Workshops"
IR2_schools_and_workshops_desc: "Teachers and skilled craftsmen are needed to keep new workshops productive. Open investment in a technical college that can expand research capacity, and extend support for domestic workshops."
IR2_an_integrated_market: "An Integrated Market"
IR2_an_integrated_market_desc: "The treasury reform and completed Tehran workshops give the cabinet a domestic base for development. Consolidate the national budget and reduce reliance on foreign patrons."
IR2_unified_command: "A Unified Command"
IR2_unified_command_desc: "Provincial security forces need officers who can work under a common command. Begin military reorganization and prepare an equipment programme for the gendarmerie."
IR2_provincial_army: "A Provincial Army"
IR2_provincial_army_desc: "An equipped gendarmerie gives the government a foundation for professional service outside the capital. Build on that force with trained officers and prepare a reserve programme for national defence."
IR2_arsenal_network: "An Arsenal Network"
IR2_arsenal_network_desc: "The army's arsenals need a reliable center for weapons manufacture and repair. Expand military production in Tehran if the arsenal has not already been built."
IR2_frontier_supply: "Supply the Frontiers"
IR2_frontier_supply_desc: "A defensive post in Iranian Azerbaijan will anchor the army's northwestern positions. Fortify the province while it remains under Iranian control and prepare further frontier support."
IR2_air_and_gulf_services: "Air and Gulf Services"
IR2_air_and_gulf_services_desc: "Military aviation and a Gulf service need trained personnel before they can support the army. Develop their service experience and authorize an airfield programme alongside southern infrastructure investment."
IR2_treaties_of_sovereignty: "Treaties of Sovereignty"
IR2_treaties_of_sovereignty_desc: "The cabinet must address British influence, relations with the Soviet government and the security of neighboring borders. Open the foreign policy programme with Iranian sovereignty as its guiding purpose."
IR2_northern_treaty: "The Northern Treaty"
IR2_northern_treaty_desc: "A working relationship with the Soviet government can reduce friction along the northern frontier. Pursue treaty relations with Moscow while the two countries remain at peace."
IR2_third_power_contacts: "Third-Power Contacts"
IR2_third_power_contacts_desc: "Commercial and military contacts with Germany offer an alternative to existing British channels. Explore equipment assistance without granting an automatic commitment to Germany's wars."
IR2_regional_nonaggression: "Regional Nonaggression"
IR2_regional_nonaggression_desc: "Secure borders with neighboring states would let the cabinet devote more resources to domestic development. Prepare a regional policy based on negotiated security and nonaggression."
IR2_shatt_al_arab: "The Shatt al-Arab Question"
IR2_shatt_al_arab_desc: "Navigation and the river boundary remain sensitive questions between Iran and Iraq. Authorize negotiations with Baghdad, allowing a settlement to be proposed through the sovereignty programme."
IR2_bahrain_question: "The Bahrain Question"
IR2_bahrain_question_desc: "Persian claims concerning Bahrain face Britain's entrenched position in the Gulf. Open a proposal for a diplomatic commission with Britain. Acceptance can reduce foreign leverage, but the commission will not transfer the islands to Iran."
IR3_inheritance_of_the_state: "The State We Inherit"
IR3_inheritance_of_the_state_desc: "The cabinet inherits the institutions and commitments that have brought Iran through the interwar years. Review their condition and reopen the treasury and security programmes under the existing government."
IR3_provincial_compacts: "Provincial Compacts"
IR3_provincial_compacts_desc: "Agreements with provincial representatives can sustain national government without another coercive campaign. Establish a compact and a civil service within a constitutional administration, strengthening stability across the country."
IR3_direct_administration: "Direct Administration"
IR3_direct_administration_desc: "Appointed officials and security forces can extend the cabinet's reach where local intermediaries resist its orders. Establish direct administration and strengthen state authority, accepting the resulting loss of public confidence."
IR3_public_granaries: "Public Granaries"
IR3_public_granaries_desc: "Grain shortages threaten urban workers and provincial communities alike. Authorize a bread distribution programme that uses equipment and civilian production to move and protect food supplies."
IR3_a_country_at_work: "A Country at Work"
IR3_a_country_at_work_desc: "Delivered relief gives workers and merchants a reason to trust the government's supply arrangements. Consolidate the budget, end the supply emergency and strengthen state authority once distribution has succeeded."
IR3_industrial_programme: "The Industrial Programme"
IR3_industrial_programme_desc: "Iran needs a larger domestic base for civilian goods and military supply. Open national construction projects and workshop subsidies so that the cabinet can direct investment toward practical production."
IR3_abadan_capacity: "Expand Abadan's Capacity"
IR3_abadan_capacity_desc: "Khuzestan's oil industry gives the cabinet a material interest to defend in its relations with foreign powers. Authorize further extraction investment and prepare the settlement of foreign obligations."
IR3_national_workshops: "National Workshops"
IR3_national_workshops_desc: "The army needs domestic workshops able to maintain weapons and organize arms production. Open a paid project to expand the Tehran arsenal if it has not already been completed."
IR3_trans_iranian_connections: "Trans-Iranian Connections"
IR3_trans_iranian_connections_desc: "The railway must connect with usable roads at both ends if it is to serve Iranian trade. Open railway construction and give priority to infrastructure in Gilan and Hormozgan."
IR3_technical_education: "Technical Education"
IR3_technical_education_desc: "Engineers, mechanics and teachers are needed to sustain Iran's new industry. Open investment in a technical college whose completion will let Iran pursue an additional research programme."
IR3_logistics_commission: "The Logistics Commission"
IR3_logistics_commission_desc: "The cabinet needs a body that can coordinate Gulf arrivals, inland transport and northern deliveries. Prepare a corridor logistics programme whose operation will require Allied cooperation and control of the Iranian route."
IR3_defence_of_iran: "The Defence of Iran"
IR3_defence_of_iran_desc: "Iran's army must defend long borders with limited equipment and uneven communications. Review its service experience and reopen the security programme to prepare the country for a wider war."
IR3_professional_reserves: "Professional Reserves"
IR3_professional_reserves_desc: "A reserve system needs trained officers and frontier arrangements that can receive men when they are called up. Authorize reserve and frontier programmes to support national defence."
IR3_zagros_defences: "Defend the Western Approaches"
IR3_zagros_defences_desc: "The western approaches need positions from which the army can delay an invasion. Build a defensive post in Iranian Azerbaijan where ownership and control permit, and prepare defensive mobilization."
IR3_airfield_network: "An Airfield Network"
IR3_airfield_network_desc: "Aircraft need serviced landing grounds near the army's main centers of supply. Prepare an airfield programme and develop the service experience required to operate it."
IR3_gulf_service: "The Gulf Service"
IR3_gulf_service_desc: "The Gulf coast needs personnel familiar with naval service and dependable inland communications. Develop naval experience and prioritize the Hormozgan infrastructure programme."
IR3_between_the_blocs: "Between the Blocs"
IR3_between_the_blocs_desc: "Iran's trade and security are increasingly exposed to the rival powers gathering for war. Open a foreign policy programme to decide between armed neutrality, Allied cooperation and a German opening."
IR3_armed_neutrality: "Armed Neutrality"
IR3_armed_neutrality_desc: "Maintain Iran's independence from the competing camps and prepare defensive mobilization. The cabinet will seek to keep foreign war off Iranian soil without accepting a sponsor's political direction."
IR3_allied_cooperation: "Cooperate with the Allies"
IR3_allied_cooperation_desc: "An understanding with Britain may protect the government from a confrontation it cannot afford. Improve relations and prepare a supply corridor, retaining the need to commit equipment and industry to actual deliveries."
IR3_german_opening: "The German Opening"
IR3_german_opening_desc: "An independent Germany may offer equipment outside British channels. Seek its support while it remains a viable partner, accepting that a visible German alignment can deepen Allied pressure on Iran."
IR3_sovereignty_under_pressure: "Sovereignty under Pressure"
IR3_sovereignty_under_pressure_desc: "Foreign demands and the strategic importance of Iranian communications require a decision from the cabinet. If the sovereignty crisis remains unresolved, consider a negotiated accommodation or a commitment to national resistance."
IR3_persian_corridor: "The Persian Corridor"
IR3_persian_corridor_desc: "Allied cooperation gives Iran a place in the supply route from the Gulf to the Soviet frontier. Authorize corridor deliveries, which require control of Khuzestan, Tehran and Gilan, completed railway preparations and a material contribution."
IR3_national_resistance: "National Resistance"
IR3_national_resistance_desc: "The government has chosen to resist foreign pressure. Prepare defensive mobilization and use the army's experience to sustain that commitment without surrendering the responsibility to feed the population."
IR3_tehran_declaration: "The Tehran Declaration"
IR3_tehran_declaration_desc: "Iran's contribution to wartime communications supports its demand for recognition of territorial integrity. Present that demand and open a programme to seek foreign guarantees once peace or completed corridor deliveries gives the cabinet a basis to proceed."
IR3_northern_settlement: "The Northern Settlement"
IR3_northern_settlement_desc: "The end of the war brings renewed demands for provincial rights in Iranian Azerbaijan. Open negotiations over local government and decide how the cabinet will preserve national authority in the north."
IR3_regional_guarantees: "Regional Guarantees"
IR3_regional_guarantees_desc: "An independent Iran can seek more durable security through its neighbors. Reopen regional diplomacy and prepare negotiations with Iraq over the Shatt al-Arab."
iran_state_authority: "State Authority"
iran_state_authority_desc: "State authority: [?iran_authority|0]/100\nForeign leverage: [?iran_foreign_leverage|0]/100\n\nAuthority measures the government's reach into the provinces on a scale from 0 to 100. Provincial agreements, treasury reform and an equipped gendarmerie strengthen it. At 50 authority, a government outside the Pahlavi or republican settlements replaces fragmented authority with a constitutional state. Pahlavi and republican governments retain their own institutions.\n\nForeign leverage measures dependence on outside patrons from 0 to 100. Credit increases it, and repayment or domestic development can reduce it. At 50 leverage or more, foreign dependence diverts civilian production and weakens the cabinet's political freedom."
iran_national_projects: "National Development"
iran_national_projects_desc: "Tehran workshops, Khuzestan oil, technical education and national communications need sustained investment. Projects reserve civilian industry until completion. Work tied to a named province requires Iranian ownership and control of its site. Losing required territory cancels the work without granting its intended result. Completed projects cannot be repeated."
iran_sovereignty: "Iranian Sovereignty"
iran_sovereignty_desc: "State authority: [?iran_authority|0]/100\nForeign leverage: [?iran_foreign_leverage|0]/100\n\nManage foreign obligations, negotiate with neighboring governments and organize wartime cooperation. Repaying credit reduces foreign leverage but consumes military equipment. Corridor deliveries require the Iranian transport route to remain under our control. Foreign governments decide whether to accept our proposals."
iran_provincial_compact: "Negotiate a Provincial Compact"
iran_provincial_compact_desc: "Bring provincial representatives into an agreement on the cabinet's authority. Talks require Iranian ownership and control of Tehran and Gilan, slow political work for 60 days and strengthen state authority when completed. Losing either required province ends the negotiations."
iran_treasury_reform: "Reform Provincial Tax Collection"
iran_treasury_reform_desc: "Send treasury officials to establish regular accounts and bring provincial receipts into the national budget. The 120-day reform diverts civilian production toward consumer needs and strengthens state authority on completion."
iran_equip_gendarmerie: "Equip the Gendarmerie"
iran_equip_gendarmerie_desc: "Issue 250 infantry equipment and commit 10 army experience to training and organizing provincial gendarmes. After 60 days, the equipped force strengthens authority and provides the foundation for further officer training."
iran_bread_distribution: "Organize Bread Distribution"
iran_bread_distribution_desc: "Commit 100 infantry equipment to protect grain stores and distribution routes. For 60 days, civilian production must give greater priority to consumer needs. Completed distribution improves stability and ends the supply emergency."
iran_provincial_security: "Extend Provincial Security"
iran_provincial_security_desc: "Deploy equipped security detachments to enforce the cabinet's orders in the provinces. The operation consumes 250 infantry equipment and 10 army experience, reduces stability immediately and strengthens authority after 60 days."
iran_tehran_workshops: "Expand the Tehran Workshops"
iran_tehran_workshops_desc: "Reserve one civilian factory for 120 days to expand workshops in Tehran. Completion adds one civilian factory and room for it, provided Iran retains ownership and control of the capital."
iran_khuzestan_capacity: "Expand Khuzestan Oil Production"
iran_khuzestan_capacity_desc: "Reserve one civilian factory for 120 days to improve oil extraction in Khuzestan. Completion adds 10 oil and reduces foreign leverage. Iran must retain ownership and control of the province throughout the project."
iran_caspian_roads: "Improve Gilan's Roads"
iran_caspian_roads_desc: "Reserve one civilian factory for 60 days to improve the roads serving the Caspian trade. Completion adds one level of infrastructure in Gilan if the province remains owned and controlled by Iran."
iran_gulf_harbour: "Improve the Gulf Approaches"
iran_gulf_harbour_desc: "Reserve one civilian factory for 120 days to improve inland communications serving the Gulf coast. Completion adds one level of infrastructure in Hormozgan if Iran retains ownership and control."
iran_railway_north: "Build the Northern Railway"
iran_railway_north_desc: "Reserve one civilian factory for 120 days to establish a railway from Tehran to Gilan. Ownership and control of both provinces must be retained, and construction is restricted to a friendly route."
iran_railway_south: "Build the Southern Railway"
iran_railway_south_desc: "Reserve one civilian factory for 120 days to establish a railway from Tehran to Khuzestan. Ownership and control of both provinces must be retained, and construction is restricted to a friendly route."
iran_tehran_airfield: "Expand Tehran's Airfield"
iran_tehran_airfield_desc: "Reserve one civilian factory for 60 days to improve aviation facilities in Tehran. Completion adds one level of air base if the capital remains owned and controlled by Iran."
iran_repay_foreign_credit: "Settle Foreign Obligations"
iran_repay_foreign_credit_desc: "Commit 500 infantry equipment from national stocks to settle foreign obligations and reduce leverage over the cabinet. The transaction leaves fewer weapons available for the army, so another repayment must wait for the programme to reopen."
iran_shatt_negotiations: "Open Shatt al-Arab Negotiations"
iran_shatt_negotiations_desc: "Ask Iraq to settle the Shatt al-Arab dispute through negotiation. Agreement improves relations and confidence at home. Refusal weakens the cabinet's authority and leaves the river question unresolved."
iran_corridor_deliveries: "Deliver through the Persian Corridor"
iran_corridor_deliveries_desc: "Contribute 100 infantry equipment and reserve one civilian factory for 120 days to support Allied transit. Both railway preparations must be complete, and Iran must own and control Khuzestan, Tehran and Gilan. Successful deliveries strengthen authority and reduce foreign leverage. Loss of the route cancels the operation."
iran_withdrawal_guarantees: "Request Guarantees of Independence"
iran_withdrawal_guarantees_desc: "Ask Britain and the Soviet government to guarantee Iran's independence. Each government will answer separately, and a refusal provides no guarantee. This request does not itself remove foreign troops or transfer territory."
iran_fragmented_authority: "Fragmented Authority"
iran_fragmented_authority_desc: "Provincial power brokers and separate armed forces limit the cabinet's reach. Political work and recruitment suffer until authority reaches 50 or a new governing settlement replaces these arrangements."
iran_constitutional_state: "Constitutional State"
iran_constitutional_state_desc: "The Majlis and cabinet have enough provincial authority to sustain national government. Parliamentary legitimacy strengthens stability and political work."
iran_pahlavi_state: "Pahlavi State"
iran_pahlavi_state_desc: "The monarchy directs construction and military training through a stronger central administration. Royal control accelerates development and training, but restricts the cabinet's political freedom."
iran_parliamentary_state: "Parliamentary Republic"
iran_parliamentary_state_desc: "Elected government encourages political participation and research. Parliamentary supervision makes mobilization slower as ministers seek agreement on the country's commitments."
iran_foreign_dependence: "Foreign Dependence"
iran_foreign_dependence_desc: "Outside patrons hold substantial influence over the treasury and the cabinet. At 50 foreign leverage or more, their claims increase consumer demands on civilian production and reduce political effectiveness. Repayment and domestic development can ease that dependence."
iran_divided_officer_corps: "A Divided Officer Corps"
iran_divided_officer_corps_desc: "The colonels remember who paid them and who did not. Orders from Tehran are obeyed in the manner they are given: slowly, partially, and with an eye on who is likely to be in the palace next year. Staff work suffers, and formations take longer to answer a summons than their tables of organisation admit."
iran_supply_emergency: "Supply Emergency"
iran_supply_emergency_desc: "Food shortages and insecure transport disrupt daily life and factory work. Organizing bread distribution can restore confidence and end the emergency."
iran_security_cost: "§Y250§! equipment, §Y10§! Army XP"
iran_security_cost_blocked: "§R250 equipment, 10 Army XP§!"
iran_security_cost_tooltip: "Requires and consumes §Y250 infantry equipment§! and §Y10 army experience§!."
iran_relief_cost: "§Y100§! equipment"
iran_relief_cost_blocked: "§R100 equipment§!"
iran_relief_cost_tooltip: "Requires and consumes §Y100 infantry equipment§!."
iran_provincial_settlement_tt: "Complete the provincial compact through the State Authority decisions."
iran_tax_reform_tt: "Complete provincial tax collection reform through the State Authority decisions."
iran_gendarmerie_ready_tt: "Complete the gendarmerie equipment programme through the State Authority decisions."
iran_constitution_prepared_tt: "Complete both the provincial compact and provincial tax collection reform."
iran_projects_ready_tt: "Complete the Tehran workshops and provincial tax collection reform."
iran_relief_delivered_tt: "Complete a bread distribution programme."
iran_cooperation_tt: "The government has agreed to Allied cooperation."
iran_resistance_tt: "The government has chosen national resistance in the sovereignty crisis."
iran_project_cancelled_tt: "The required territory has been lost. This project ends without granting its completion benefits."
iran_campaign_country: "Iran's national administration is active."
iran_sponsor_britain_valid: "Iran and Britain are independent and at peace with each other. Britain has not capitulated."
iran_sponsor_germany_valid: "Iran and Germany are independent and at peace with each other. Germany has not capitulated."
iran_provincial_states_held: "Iran owns and controls Tehran and Gilan."
iran_corridor_states_held: "Iran owns and controls Khuzestan, Tehran and Gilan."
iran_security_affordable: "At least 250 infantry equipment and 10 army experience are available."
iran_relief_affordable: "At least 100 infantry equipment are available."
iran_railway_ready: "Both the northern and southern railway preparations are complete."
iran_allied_pressure: "Iran faces Allied demands or military pressure."
iran_tax_reformed: "Provincial tax collection has been reformed."
iran_gendarmerie_ready: "The gendarmerie has been equipped."
iran_relief_delivered: "Bread distribution has been completed."
iran_allied_cooperation: "The government has agreed to Allied cooperation."
iran_resistance: "The government has chosen national resistance."
iran_treaty_relations: "Treaty Cooperation"
iran_campaign.10.t: "The Majlis and the Cabinet"
iran_campaign.10.d: "The Second Majlis has restored a center for constitutional politics in Tehran. Deputies want a cabinet that answers to parliament, but provincial leaders and the Qajar court retain the means to frustrate its orders. The government must choose whose support will sustain its work beyond the capital."
iran_campaign.10.a: "Place the question before the deputies."
iran_campaign.11.t: "An Agreement with the Provinces"
iran_campaign.11.d: "Local representatives and influential families expect the government to recognize their place in provincial affairs. Their cooperation could help keep roads open and tax collectors safe. A compact will require negotiations backed by a security force the cabinet can actually equip."
iran_campaign.11.a: "Prepare the provincial security programme."
iran_campaign.12.t: "Revenue for the Government"
iran_campaign.12.d: "Uncertain receipts leave ministries unable to plan even their ordinary expenses. Treasury officials propose regular provincial accounts and closer supervision of tax collection. The work will take resources away from immediate needs, but the cabinet cannot sustain reform on promised revenue."
iran_campaign.12.a: "Begin the treasury programme."
iran_campaign.13.t: "Persia's Foreign Position"
iran_campaign.13.d: "British and Russian interests reach into Persian customs, credit and military organization. German contacts offer another possible channel for assistance. The cabinet must decide whether neutrality or a foreign understanding gives it the best chance of preserving its freedom to govern."
iran_campaign.13.a: "Examine our diplomatic options."
iran_campaign.14.t: "British Equipment Credit"
iran_campaign.14.d: "British representatives offer equipment to relieve the government's shortage of arms. Accepting the credit would give the army supplies it can use immediately and leave the cabinet more exposed to British influence. Refusing the offer would preserve greater freedom in the government's foreign dealings."
iran_campaign.14.a: "Accept the equipment credit."
iran_campaign.14.b: "Decline further dependence."
iran_campaign.15.t: "An Offer from Germany"
iran_campaign.15.d: "German contacts have raised the prospect of supplying equipment to Iran. The offer could ease shortages and widen the government's foreign connections, though a new supplier would acquire influence of its own. The cabinet can accept the supplies or rely on its domestic position."
iran_campaign.15.a: "Accept German equipment."
iran_campaign.15.b: "Keep the government's freedom of action."
iran_campaign.16.t: "Grain on the Roads"
iran_campaign.16.d: "Insecure roads and interrupted trade are keeping grain from the towns that need it. Requisition adds to the pressure on households already struggling to obtain bread. The government needs protected stores and distribution routes, even as the army demands equipment and supplies for its own service."
iran_campaign.16.a: "Organize relief for the population."
iran_campaign.20.t: "Persia after the Great War"
iran_campaign.20.d: "The war has changed the powers around Persia and left the government with damaged communications, uncertain revenue and urgent provincial demands. The cabinet must address foreign proposals alongside the reconstruction of its own authority. Treasury reform and provincial security remain the practical foundations of the settlement."
iran_campaign.20.a: "Take up the work of reconstruction."
iran_campaign.21.t: "The Anglo-Persian Agreement"
iran_campaign.21.d: "The 1919 agreement offers British assistance in finance and military organization. Its proposed advisers and obligations have provoked opposition among those who fear a lasting tutelage. The Majlis must decide whether the promised help justifies the influence Britain would acquire."
iran_campaign.21.a: "Review our foreign obligations."
iran_campaign.22.t: "The Army and the Constitutional Order"
iran_campaign.22.d: "Officers associated with the Cossack command demand a stronger government capable of restoring order. Deputies want guarantees that military power will remain subject to the constitutional settlement. The cabinet can prepare an assembly to consider the country's political future or reaffirm the Majlis's position. Neither course by itself settles the question of the crown."
iran_campaign.22.a: "Prepare an assembly and work with the command."
iran_campaign.22.b: "Reaffirm the constitutional guarantees."
iran_campaign.23.t: "National Courts in the Provinces"
iran_campaign.23.d: "The provincial compact has given the government room to establish courts beyond Tehran. Judges and officials can apply national law with a clearer claim to local cooperation. Their work strengthens the authority of the government under the settlement the country has chosen."
iran_campaign.23.a: "Support the courts' authority."
iran_campaign.24.t: "Investment in Khuzestan"
iran_campaign.24.d: "Khuzestan's oil industry occupies a central place in Iran's economy and its dealings with Britain. The cabinet proposes investment in extraction capacity within the province. Completion will require civilian industry and continued Iranian control of the site."
iran_campaign.24.a: "Authorize the oil capacity programme."
iran_campaign.25.t: "A Foreign Policy of Our Own"
iran_campaign.25.d: "The cabinet has opportunities to address northern relations, widen commercial contacts and seek agreements with neighboring states. Each approach will have to serve a government still building its domestic strength. A coherent foreign programme can keep immediate offers of assistance from dictating every decision."
iran_campaign.25.a: "Open the foreign policy programme."
iran_campaign.26.t: "Relations with the Soviet Government"
iran_campaign.26.d: "Iran's northern frontier makes a working relationship with the Soviet government important to trade and security. Treaty relations offer a basis for reducing friction without surrendering the cabinet's responsibility for the provinces. The government will cultivate that relationship while peace between the two countries permits it."
iran_campaign.26.a: "Develop relations on a treaty basis."
iran_campaign.30.t: "Iran Faces a Wider War"
iran_campaign.30.d: "Iran enters a period in which its oil and communications will draw growing attention from the great powers. The government retains the institutions built in earlier years, along with their unresolved obligations. Construction and diplomacy must prepare the country for demands that domestic reform alone cannot answer."
iran_campaign.30.a: "Prepare industry and foreign policy."
iran_campaign.31.t: "The Government's Inheritance"
iran_campaign.31.d: "The cabinet governs through the institutions the country has established. Provincial administration, treasury revenue and foreign obligations will determine how much freedom it has as international tensions rise. Ministers must decide how to strengthen those institutions under the existing political settlement."
iran_campaign.31.a: "Review the state's condition."
iran_campaign.32.t: "Cooperation with Britain"
iran_campaign.32.d: "An understanding with Britain offers a way to reduce confrontation and organize wartime transit through Iran. The cabinet can prepare a corridor programme without granting away the country. Actual deliveries will still require equipment, civilian industry and control of the route from the Gulf toward the north."
iran_campaign.32.a: "Prepare cooperation and corridor logistics."
iran_campaign.40.t: "Iran's Sovereignty at Issue"
iran_campaign.40.d: "Iran's communications and foreign connections have become a central question in the surrounding war. The cabinet faces a choice between making room for Allied cooperation and committing the country to resistance. An accommodation is possible only while Iran remains at peace with Britain and the Soviet government."
iran_campaign.40.a: "Negotiate cooperation and preserve the government."
iran_campaign.40.b: "Commit to national resistance."
iran_campaign.42.t: "The Corridor Delivers"
iran_campaign.42.d: "Supplies have passed through the Iranian route with the equipment and industrial support committed by the cabinet. Successful deliveries give the government a stronger position in its foreign dealings and demonstrate its ability to organize work across the country. Ministers can press Iran's interests with less dependence on promises of future assistance."
iran_campaign.42.a: "Use our contribution to defend our independence."
iran_campaign.43.t: "Iran's Territorial Integrity"
iran_campaign.43.d: "The government has set out its demand that Iran's territorial integrity and independence be respected in the wartime settlement. Foreign assurances will need to be secured through direct approaches to the powers concerned. The cabinet can open those discussions without treating a declaration as a completed withdrawal."
iran_campaign.43.a: "Seek guarantees from the foreign governments."
iran_campaign.44.t: "Provincial Government in the North"
iran_campaign.44.d: "Demands for a greater provincial voice in Iranian Azerbaijan have placed local administration on the cabinet's agenda. A negotiated accommodation could ease tensions, while direct central supervision would strengthen the government's immediate authority at the cost of unrest. Ministers must decide which course they can sustain."
iran_campaign.44.a: "Negotiate an accommodation on provincial affairs."
iran_campaign.44.b: "Place administration under central supervision."
iran_campaign.60.t: "Iran Proposes River Negotiations"
iran_campaign.60.d: "The Iranian government has asked Baghdad to settle the Shatt al-Arab dispute through negotiation. An agreement would improve relations between the two countries without a transfer of territory. Refusal would leave the river question unresolved and weaken the Iranian cabinet's effort to secure a settlement."
iran_campaign.60.a: "Accept a negotiated settlement."
iran_campaign.60.b: "Refuse the Iranian proposal."
iran_campaign.61.t: "An Iranian Request for a Guarantee"
iran_campaign.61.d: "The Iranian government requests a guarantee of its independence as it seeks a durable settlement of foreign involvement in the country. Accepting would place a formal obligation behind our assurances. The request does not arrange a troop withdrawal or alter the ownership of Iranian territory."
iran_campaign.61.a: "Guarantee Iran's independence."
iran_campaign.61.b: "Decline to give a guarantee."
iran_campaign.62.t: "Baghdad Accepts a Settlement"
iran_campaign.62.d: "The Iraqi government has accepted negotiations as the basis for settling the Shatt al-Arab question. Cooperation on the river improves relations and gives the Iranian cabinet a diplomatic success it can defend at home. The agreement leaves territorial ownership unchanged."
iran_campaign.62.a: "Build on the agreement with Iraq."
iran_campaign.63.t: "Baghdad Refuses the Proposal"
iran_campaign.63.d: "The Iraqi government has refused the proposed Shatt al-Arab settlement. The river question remains open, and the cabinet must explain why its diplomatic approach has produced no agreement. The failure weakens its authority without providing a mandate for war."
iran_campaign.63.a: "Reassess our position on the river."
iran_expand_arsenal: "Expand the National Arsenal"
iran_expand_arsenal_desc: "Reserve one civilian factory for 120 days to establish a military factory in Tehran. Iran must retain ownership and control of the capital. The project is available only if the national arsenal has not already been completed."
iran_technical_college: "Establish a Technical College"
iran_technical_college_desc: "Reserve one civilian factory for 120 days to train engineers and establish permanent facilities for technical study. Completion adds one research slot, giving Iran the capacity to pursue an additional research programme."
iran_constitutional_petitions: "Hear Provincial Petitions"
iran_constitutional_petitions_desc: "Give provincial representatives a constitutional channel through which to bring grievances to the cabinet. Hearing their petitions slows other political work for 60 days, then strengthens state authority and stability."
iran_gulf_arbitration: "Propose a Gulf Commission"
iran_gulf_arbitration_desc: "Ask Britain to accept a diplomatic commission on the Bahrain question. Acceptance improves Britain's opinion of Iran and reduces foreign leverage over the cabinet. Refusal reduces stability at home. The proposal does not transfer Bahrain or commit either country to war."
iran_regional_assurances: "Guarantee Our Neighbors"
iran_regional_assurances_desc: "Guarantee the independence of Iraq, Afghanistan and Turkey wherever those states exist and remain at peace with Iran. These assurances commit Iran to its neighbors' security without creating a faction or obtaining reciprocal guarantees."
iran_northern_administration: "Settle Northern Administration"
iran_northern_administration_desc: "Devote 120 days to implementing the northern settlement in Iranian Azerbaijan and Gilan. The work slows political activity and improves stability on completion. Iran must retain ownership and control of both provinces throughout the programme."
iran_campaign.64.t: "Iran Proposes a Gulf Commission"
iran_campaign.64.d: "The Iranian government proposes a diplomatic commission to examine the Bahrain question. Accepting would improve British relations with Iran and give its cabinet greater freedom in foreign affairs. The commission would not transfer Bahrain to Iran or settle its sovereignty through annexation. Refusal would leave the Iranian government facing disappointment at home."
iran_campaign.64.a: "Accept a diplomatic commission."
iran_campaign.64.b: "Decline the proposed commission."
iran_campaign.40.c: "Grant transit under protest, and keep the government in Tehran."
iran_transit_standing: "The Transit Agreement"
iran_transit_standing_desc: "The Allies move their supplies through Iranian roads and rail by agreement, not by right of conquest. No foreign garrison sits in Tehran, the Majlis still meets, and the cabinet can still say no to a demand - though everyone in the room knows how much that refusal would cost."
IR1_russian_ultimatum_1911: "The Russian Ultimatum"
IR1_russian_ultimatum_1911_desc: "St Petersburg has presented a demand with a deadline attached: dismiss the American treasurer or the Russian army will cross the border to enforce it. There is no force in the country that could stop them, and the cabinet has one night to decide what the word sovereignty is worth when it is written on a note from a foreign minister."
IR1_dismissal_of_shuster: "Dismiss the Treasurer"
IR1_dismissal_of_shuster_desc: "Shuster is sent home and the Majlis is told the alternative was a Russian column on the road to Tehran. The treasury returns to men who do not count the receipts, the loan is lost, and every deputy in the chamber understands exactly what the last six months were worth."
IR1_provincial_tax_risings: "The Provincial Tax Risings"
IR1_provincial_tax_risings_desc: "The new assessments were meant to be paid by the landowners and are being collected from the villages instead. Telegraph offices are cut in three provinces, a gendarmerie post has been burned, and the governor of Fars reports that he can either collect the revenue or hold the roads, not both."
IR3_zagros_fortification_line: "The Zagros Line"
IR3_zagros_fortification_line_desc: "The passes through the Zagros are the only roads an army can bring guns over, and there are eleven of them. Concrete, telephone wire and a garrison that knows the ground will not stop a modern army, but it will make the army choose a pass and pay for the choice - and every week spent on a pass is a week the capital has to organise."
IR3_reserve_mobilisation_plan: "The Reserve Plan"
IR3_reserve_mobilisation_plan_desc: "Not conscription - a register. Every district office is told to record the men of military age, what they can do, and where they can walk to. When the order comes, the depots will know who to expect and the men will know which depot to walk to, which is more than any Iranian mobilisation has managed before."
IR3_bandar_abbas_batteries: "The Bandar Abbas Batteries"
IR3_bandar_abbas_batteries_desc: "Guns at the mouth of the Gulf, pointing at the water rather than inland. The Royal Navy will pass through the Strait of Hormuz whatever Iran does; the batteries are not there to stop it, but to make every passage a decision that has to be explained in London."
IR3_tehran_air_defence: "Anti-Aircraft Command"
IR3_tehran_air_defence_desc: "The war has taught every capital in the world the same lesson about aeroplanes. Tehran's answer is a battery on the northern hills, a searchlight section, and an air-raid alarm that the bazaar will learn to obey."
IR3_corridor_supply_depots: "Depots Along the Corridor"
IR3_corridor_supply_depots_desc: "The Allies move their freight through Iran and the freight has to sit somewhere while the locomotives are turned. Depots at the junctions mean the convoys stop for hours instead of weeks - and that Iran, not the foreign quartermaster, decides which roads are repaired."
IR2_shatt_navigation_rights: "Navigation Rights on the Shatt"
IR2_shatt_navigation_rights_desc: "The Shatt al-Arab is Iraq's river and Iran's only deep approach to Basra. A treaty that fixes the channel, the pilotage and the tolls settles a border dispute that has outlived the empire that drew it, and gives the Gulf ports a route that does not end in a British customs house."
IR2_caucasus_refugees: "The Caucasus Refugees"
IR2_caucasus_refugees_desc: "Every year since the revolution the north has emptied into Iran: Armenians, Assyrians, White Russians, men who fought on the losing side of somebody else's war. They arrive with trades, debts and no papers. A government that registers them gains workers and taxable hands; a government that does not gains a province it cannot count."
IR2_caspian_caviar_trade: "The Caspian Fisheries"
IR2_caspian_caviar_trade_desc: "The sturgeon grounds off the Caspian coast are the most valuable fishery in Asia and are worked on a concession granted by a government that no longer exists. Take the beds into Iranian hands, sell the caviar in Tehran and Baku rather than through a Russian agent, and the north pays for itself for once."
iran_constitutional_consolidated: "The Constitutional Settlement Holds"
iran_constitutional_consolidated_desc: "The compact between crown and Majlis has survived a decade of tests and is now the ordinary way the country is governed. Ministries answer to the chamber because that is where authority is understood to live, and the court has learned to work through it rather than around it."
iran_parliamentary_consolidated: "A Republic That Works"
iran_parliamentary_consolidated_desc: "The republic has outlived its founding argument. Cabinets change, budgets are voted, and the army has been told - twice, and successfully - that it does not decide who governs. It is unglamorous, and it is the most fragile thing Iran has built."
iran_pahlavi_consolidated: "The New State Delivered"
iran_pahlavi_consolidated_desc: "The programme is no longer a programme. Railways run, factories have roofs, the army has a staff college and the tribes have been counted. The state built in the 1920s is now the country's ordinary machinery, and it runs whether or not anyone is watching it."
iran_nationalist_consolidated: "The Nation Organised"
iran_nationalist_consolidated_desc: "The committees, the press and the officer corps have fused into a single movement with a single argument: that Iran is a nation before it is a market or a province of anyone's empire. It is disciplined, it is impatient, and it has stopped asking permission."
iran_socialist_consolidated: "The Workers' State Consolidated"
iran_socialist_consolidated_desc: "The councils that began in the workshops now sit on the boards that run them. Oil, rail and the Caspian fisheries are administered by people who were clerks and fitters five years ago, and the country produces more than it did - at the cost of everyone it disagreed with."
