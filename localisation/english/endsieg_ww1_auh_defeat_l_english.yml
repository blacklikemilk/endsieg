 endsieg_news.480.t:0 "Zagreb Breaks with Vienna"
 endsieg_news.480.d:0 "The Croatian Sabor has severed its ties with Vienna and Budapest. The National Council in Zagreb has proclaimed a State of Slovenes, Croats and Serbs, claiming authority over the South Slav lands of the monarchy. Serbia remains a separate kingdom while talks over union begin."
 endsieg_news.480.a:0 "A new government in Zagreb."
 endsieg_news.481.t:0 "Czechoslovak Troops Enter German Bohemia"
 endsieg_news.481.d:0 "Czechoslovak troops have reached Reichenberg, seat of the German Bohemian provincial government. Prague claims the old Bohemian crownlands, while the German-speaking provincial leaders have appealed to Vienna. Czech troops now administer the district as the border dispute goes before the peace conference."
 endsieg_news.481.a:0 "Prague takes control of the district."
 endsieg_news.482.t:0 "Czechoslovak Troops Take Opava"
 endsieg_news.482.d:0 "Czechoslovak troops have taken Opava, known to its German-speaking residents as Troppau. The provincial authorities had sought to join German-Austria. Their departure puts the eastern district under Prague's administration while Vienna still presses its claim."
 endsieg_news.482.a:0 "The border remains in dispute."
 endsieg_news.483.t:0 "German-Austria Proclaims a Republic"
 endsieg_news.483.d:0 "Charles has withdrawn from Austrian affairs. The Provisional National Assembly in Vienna has proclaimed a republic and declared its intention to unite with Germany. The new government claims the German-speaking districts of the old monarchy, including several claimed by Prague."
 endsieg_news.483.a:0 "The assembly assumes authority."
 endsieg_news.484.t:0 "Charles Withdraws from Hungarian Affairs"
 endsieg_news.484.d:0 "At Eckartsau, King Charles has relinquished his participation in Hungarian state affairs and accepted that Hungary will decide its own form of government. The National Council in Budapest is preparing to settle that question."
 endsieg_news.484.a:0 "Budapest will decide."
 endsieg_news.485.t:0 "The Hungarian People's Republic"
 endsieg_news.485.d:0 "The Hungarian National Council has proclaimed a republic in Budapest. Mihály Károlyi's government must contend with shortages, returning soldiers and rival claims to the lands once governed by the Hungarian crown."
 endsieg_news.485.a:0 "Hungary has a republic."
 endsieg_news.486.t:0 "The Alba Iulia Assembly Votes for Union"
 endsieg_news.486.d:0 "Romanian delegates assembled in Alba Iulia have voted for union with the Kingdom of Romania. Their declaration also lays claim to the Banat, where Serbian troops are already taking control. Romanian troops continue to advance into Transylvania."
 endsieg_news.486.a:0 "The assembly declares for Romania."
 endsieg_news.487.t:0 "A Kingdom of Serbs, Croats and Slovenes"
 endsieg_news.487.d:0 "In Belgrade, Prince Regent Alexander has proclaimed the union of Serbia with the South Slav state represented by the National Council in Zagreb. The new kingdom brings together lands divided by the old imperial frontier."
 endsieg_news.487.a:0 "Belgrade and Zagreb unite."
