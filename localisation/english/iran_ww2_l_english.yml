l_english:
 IR3_name_of_the_nation: "The Name of the Nation"
 IR3_name_of_the_nation_desc: "Foreign chancelleries and maps still speak of Persia, while the government has asked to be known as Iran. The change reaches further than a word: it asserts a continuous national identity before the powers and asks them to deal with a country that names itself."
 IR3_wartime_government: "A Wartime Government"
 IR3_wartime_government_desc: "War in Europe has made Iranian neutrality a matter of consequence to every belligerent. The cabinet reorganizes its ministries for emergency work, and the chamber is asked to grant the government the powers it will need while the fighting lasts."
 IR3_succession_crisis: "The Succession Question"
 IR3_succession_crisis_desc: "The invasion has broken the authority of the old order, and the court, the cabinet and the chamber must decide what is to inherit it: a crown confirmed inside the family, a regency that holds the monarchy at arm's length, or a government that carries on without either. Every answer tells the occupiers what kind of country they are dealing with."
 IR3_mohammad_reza: "The Young Shah"
 IR3_mohammad_reza_desc: "Mohammad Reza Pahlavi comes to the throne in a capital held by foreign armies, with the army his father built in disorder. He must establish his authority over officers trained in the old command and over ministers who owe their seats to the chamber."
 IR3_wartime_regency: "A Council of Regency"
 IR3_wartime_regency_desc: "Rather than settle the crown on an untried heir in the middle of an occupation, the government places the monarchy under a regency. A council drawn from ministers and princes governs in the crown's name, and the succession waits for quieter times."
 IR3_the_route_we_keep: "The Road We Keep"
 IR3_the_route_we_keep_desc: "Whatever government holds Tehran must decide what the country will do with the roads and railways the war has made valuable. Ministers set out the course they intend to follow through the remaining years of the conflict."
 IR3_occupation_government: "Government under Occupation"
 IR3_occupation_government_desc: "Foreign columns hold the railways, the ports and the approaches to the capital, and the cabinet meets still because the occupiers prefer an Iranian administration to none. Its officials must keep the provinces governed while answering for decisions taken elsewhere."
 IR3_resistance_council: "A Council of Resistance"
 IR3_resistance_council_desc: "Ministers who will not countersign the occupiers' instructions meet in secret with officers, deputies and provincial notables. Such a council speaks for the country's independence without commanding an army, and what it can do depends on how many Iranians answer it."
 IR3_pahlavi_progress: "The Pahlavi Programme"
 IR3_pahlavi_progress_desc: "The crown presents itself as the one institution capable of holding the country together through occupation and war. Army, administration and construction are bound into a single programme, and the country is asked to judge the monarchy by what it builds."
 IR3_royal_army: "The Royal Army"
 IR3_royal_army_desc: "The army Reza Shah built was scattered in 1941, its depots emptied and its officers divided. Rebuilt under the crown, it becomes the instrument of the monarchy's authority as much as the defence of the frontier."
 IR3_development_corps: "A Development Corps"
 IR3_development_corps_desc: "Officers and engineers are set to roads, factories and public buildings in place of garrison duty. The corps gives the crown a visible achievement in the provinces and a body of men whose careers depend on its favour."
 IR3_pahlavi_1945: "The Crown Endures"
 IR3_pahlavi_1945_desc: "By the last year of the war the monarchy has survived invasion, abdication and occupation. The shah's government offers that survival as proof that the country needs a strong centre, and asks for the authority to carry its programme into the peace."
 IR3_constitutional_wartime: "Constitutional Government at War"
 IR3_constitutional_wartime_desc: "The Majlis has been dissolved, reconvened and set aside by turns since the occupation began. Deputies now insist that wartime administration run through the cabinet and the chamber, and that emergency powers be granted for a stated purpose and a stated term."
 IR3_wartime_majlis: "The Wartime Majlis"
 IR3_wartime_majlis_desc: "Elections held under occupation return a chamber of landowners, lawyers, merchants and a few avowed radicals. Its debates on the occupation, the harvest and the oil concession give the country a place where ministers can be questioned in public."
 IR3_cabinet_stability: "A Cabinet That Lasts"
 IR3_cabinet_stability_desc: "Governments have changed with the seasons, each weaker than the one before. Ministers work to hold a coalition together long enough to negotiate with the occupiers, and to persuade the chamber that a durable cabinet serves the country better than a rapid succession of them."
 IR3_constitutional_1945: "The Constitution Holds"
 IR3_constitutional_1945_desc: "The war ends with the Majlis still sitting and the cabinet still answerable to it. Parliamentary government has survived invasion, inflation and foreign pressure, and its defenders argue that the country's independence was kept by institutions rather than by one man."
 IR3_republic_wartime: "A Republic at War"
 IR3_republic_wartime_desc: "The monarchy has been set aside and the government rests on an elected assembly and a cabinet drawn from it. Wartime conditions test whether a republic can defend the country without the concentration of authority that a crown permits."
 IR3_republican_defence: "Defence of the Republic"
 IR3_republican_defence_desc: "A citizen government raises its own defence: volunteers enrolled by provincial committees, instructed by the officers it trusts, and posted where the roads enter the country. The republic asks its people to hold what the old army could not."
 IR3_civil_defence: "Civil Defence"
 IR3_civil_defence_desc: "Air raid warnings, fire parties, first aid posts and rationing committees are organized in the towns. Civil defence gives ordinary citizens a duty in the war, and gives the republic a claim on their loyalty that no decree could secure."
 IR3_republic_1945: "The Republic in the Peace"
 IR3_republic_1945_desc: "The war ends with the republic standing and the question of the crown settled against it. Its government turns to what outlasts armies: elections, provincial administration, and the terms on which foreign interests may remain."
 IR3_court_wartime: "The Court in Wartime"
 IR3_court_wartime_desc: "The restored court governs through the household and the families that have always surrounded it. Ministers are chosen for loyalty and the provinces are managed through patrons, so the government's authority rests on the court's standing rather than on its offices."
 IR3_household_army: "The Household Regiments"
 IR3_household_army_desc: "The court keeps its own regiments, paid from the household and officered by men whose families have served it for generations. They guard the palace, escort the sovereign, and give the restoration a force that answers to the throne directly."
 IR3_royal_finance: "The Royal Finances"
 IR3_royal_finance_desc: "The court's estates, its share of the customs and the debts it inherited are gathered into a single household treasury. Settling old obligations to foreign lenders narrows the claims outsiders can press against the government."
 IR3_restoration_1945: "The Restoration Settled"
 IR3_restoration_1945_desc: "The Qajar court has outlasted the war that took the Pahlavi throne. Its government asks the country to accept that the old dynasty was never lawfully displaced, and that the settlement of 1925 now stands reversed."
 IR3_national_mobilisation: "National Mobilisation"
 IR3_national_mobilisation_desc: "The front calls for the country to be organized for its own defence rather than for a foreign supply route. Volunteers are enrolled, the press campaigns for the national cause, and the government claims a mandate from the streets as well as from the chamber."
 IR3_oil_sovereignty: "Oil Sovereignty"
 IR3_oil_sovereignty_desc: "The concession of 1933 runs to the end of the century, and its terms are the standing grievance of the nationalist movement. The government reopens the question of Iranian control over extraction, royalties and the company that holds them."
 IR3_national_army: "A National Army"
 IR3_national_army_desc: "The front raises a volunteer army under officers it selects itself, equipped from whatever source the government can secure. It is a force of the movement rather than of the crown, and its officers know it."
 IR3_nationalist_1945: "The National Front"
 IR3_nationalist_1945_desc: "The war ends with the nationalist movement organized, its newspapers circulating and its candidates seated in the chamber. Its leaders intend to make the oil question and the foreign presence the tests by which any government will be judged."
 IR3_workers_war_effort: "The Workers' War Effort"
 IR3_workers_war_effort_desc: "The factories at Tehran, Isfahan and Tabriz run with committees of workers alongside their managers. Labour is organized for production, and a government that depends on it must answer to the men who run the machines."
 IR3_tudeh_organisation: "The Tudeh Party"
 IR3_tudeh_organisation_desc: "The party founded in 1941 has grown from a handful of Marxist intellectuals into an organization with branches, a newspaper and a following among industrial workers. Its discipline makes it useful to a government that can hold it, and dangerous to one that cannot."
 IR3_peoples_army: "A People's Army"
 IR3_peoples_army_desc: "The party's militia is recruited in the workshops and the northern towns and instructed in politics as well as drill. It gives a socialist government a force it can rely on where the old officer corps cannot be trusted."
 IR3_socialist_1945: "The Workers' Republic"
 IR3_socialist_1945_desc: "The war ends with the left in government, the factories under committees and the party's papers on the streets. Its leaders must now defend a republic against the suspicion of the Allies and the hostility of the landowners."
 IR3_seventh_plan: "The Seventh Plan"
 IR3_seventh_plan_desc: "Economic work has proceeded by seven-year programmes since the early thirties, and the next one must be drawn up while the country is occupied. Ministers set out what can be built with the revenue and the freedom the war leaves them."
 IR3_steel_mill: "A Steel Mill"
 IR3_steel_mill_desc: "Iran has ore near Kerman and no plant to smelt it, so every rail and girder must be imported. A national steel works would give construction and the armament programme a domestic supply."
 IR3_cement_and_power: "Cement and Electric Power"
 IR3_cement_and_power_desc: "Building has been held back by imported cement and by the shortage of power in the towns. Kilns and generating stations are authorized so that construction no longer waits on shipping."
 IR3_tehran_water: "Water for Tehran"
 IR3_tehran_water_desc: "The capital draws its water from qanats and shallow wells that fall short every summer. A supply scheme brings water down from the mountains and gives the government a public work every household can see."
 IR3_bandar_shahpur: "Bandar Shahpur"
 IR3_bandar_shahpur_desc: "The port at the head of the Gulf is where the railway meets the sea, and the war has made it the busiest harbour in the country. Wharves, cranes and a naval station are built to handle what arrives."
 IR3_double_track: "Double Track"
 IR3_double_track_desc: "The single line from the Gulf to Tehran cannot carry both the country's trade and the traffic the war demands. The railway is doubled in sections, and the government uses the work to press the Allies over who sets the timetable."
 IR3_oil_refinery: "A National Refinery"
 IR3_oil_refinery_desc: "Iran exports crude and imports the refined products its own towns require. A refinery under national management would keep more of the value of the oil inside the country."
 IR3_agriculture_1940: "The Land in Wartime"
 IR3_agriculture_1940_desc: "Wheat, barley and cotton are bought by armies and sold at prices the towns cannot pay. The government extends irrigation and credit in the grain provinces so that the harvest survives the demands made on it."
 IR3_grain_reserves: "Grain Reserves"
 IR3_grain_reserves_desc: "The bread queues of 1942 taught the government what an empty granary means in a city of half a million. Reserves are laid up in Tehran and the provincial centres, and the supply emergency is treated as a permanent problem rather than a bad season."
 IR3_price_controls: "Price Controls"
 IR3_price_controls_desc: "Inflation has put meat and cloth beyond the reach of wage earners while profiteers thrive on scarce goods. The government fixes prices, licenses the grain trade, and lives with the black market that follows every control."
 IR3_wartime_industry: "Wartime Industry"
 IR3_wartime_industry_desc: "The Allies will buy what Iranian workshops can produce, and the army needs what cannot be imported. Factories are turned to war work, and the government keeps a share of the output for its own forces."
 IR3_reconstruction_1945: "Reconstruction Begins"
 IR3_reconstruction_1945_desc: "Four years of transit have worn out the roads, bridges and rolling stock of the occupied provinces. With the fighting receding, the government begins to repair what the war consumed."
 IR3_economy_capstone: "A Balanced Economy"
 IR3_economy_capstone_desc: "The war leaves Iran with inflation, foreign debts and an economy organized around traffic that will soon stop. The government sets out to settle its obligations, restore the currency and put the country's finances on a footing it controls."
 IR3_conscription_expansion: "Expand the Conscription"
 IR3_conscription_expansion_desc: "The army of 1941 was too small and too dispersed to hold the frontier. Conscription is widened and the intake trained quickly, in the knowledge that every man called up is a man taken from the harvest."
 IR3_arsenal_programme: "The Arsenal Programme"
 IR3_arsenal_programme_desc: "The Tehran arsenal can repair rifles and assemble ammunition but cannot yet equip a division. Workshops and machinery are added so that the army's losses need not be made good from abroad."
 IR3_armoured_brigade: "An Armoured Brigade"
 IR3_armoured_brigade_desc: "The armoured cars and light tanks bought before the war were lost or interned in 1941. A new brigade is formed around the vehicles the government can obtain, and the army learns to use them on the roads it has."
 IR3_mountain_brigades: "Mountain Brigades"
 IR3_mountain_brigades_desc: "The passes of the Alborz and the Zagros decide where an invading column can go. Brigades raised in the hill country are trained for that ground and posted where the roads narrow."
 IR3_air_wing: "An Air Wing"
 IR3_air_wing_desc: "The air force has a handful of aircraft and fewer trained pilots. A wing is formed with instructors and machines obtained where they can be had, and the army gains eyes over the roads it must defend."
 IR3_naval_patrol: "Naval Patrol"
 IR3_naval_patrol_desc: "The Gulf coast carries the country's oil exports and most of its imports. A patrol force, however small, gives the government a presence in waters where foreign navies have long operated without asking."
 IR3_supply_network: "The Supply Network"
 IR3_supply_network_desc: "A division that cannot be fed cannot fight, and the roads that carry grain and petrol are the roads the army needs. Depots, bridges and surfaces are improved along the routes the war has made important."
 IR3_officer_corps_1940: "The Officer Corps"
 IR3_officer_corps_1940_desc: "The military academy produces too few officers for the army the country needs, and too many of the older men owe their commissions to patrons. Instruction is widened and promotion tied to service rather than to connection."
 IR3_army_capstone: "The Army of Iran"
 IR3_army_capstone_desc: "The army that comes out of the war is smaller than the one that met the invasion, but it is trained, supplied from domestic workshops, and commanded by officers who have seen what a modern campaign requires. Its staff has learned to plan for the ground the country can actually hold."
 IR3_soviet_trade_pact: "The Northern Trade"
 IR3_soviet_trade_pact_desc: "The Soviet Union is Iran's northern neighbour, the largest market for its rice and cotton, and the power whose troops stand across the frontier. A trade agreement settles duties, transit and the terms on which goods cross in both directions."
 IR3_british_ultimatum_response: "The British Ultimatum"
 IR3_british_ultimatum_response_desc: "In the summer of 1941 Britain and the Soviet Union demand the removal of German nationals and the opening of the country to their forces. The cabinet must answer a demand it cannot resist, and make the answer cost the country as little as possible."
 IR3_tripartite_treaty: "The Tripartite Treaty"
 IR3_tripartite_treaty_desc: "The treaty of 1942 binds Britain and the Soviet Union to respect Iran's independence and to withdraw their forces six months after the war with Germany ends. It gives the government a written basis for every later argument about the occupation."
 IR3_american_mission: "The American Mission"
 IR3_american_mission_desc: "An American financial mission takes charge of the treasury, the currency and the collection of revenue. Its officials are honest, well paid and foreign, and their work gives the government an account of its own finances for the first time in years."
 IR3_turkish_border: "The Turkish Border"
 IR3_turkish_border_desc: "Turkey has stayed out of the war and shares a long frontier with Iran. A border agreement and mutual assurances keep the western passes quiet while both governments watch the Caucasus."
 IR3_arab_neighbours: "The Arab Neighbours"
 IR3_arab_neighbours_desc: "Iraq and the Gulf states lie across the routes by which Iranian goods and pilgrims travel. Relations are cultivated with Baghdad and Riyadh, and the Shatt al-Arab question is left for a more favourable season."
 IR3_united_nations: "The United Nations"
 IR3_united_nations_desc: "The Allied powers have taken that name for their coalition and will carry it into the peace. Iran signs the declaration and joins an organization whose charter promises the sovereignty of small states, on terms that will be tested soon enough."
 IR3_postwar_alignment: "Choosing a Side"
 IR3_postwar_alignment_desc: "The war is over and the two victors already watch each other across Iranian ground. The government weighs which connection will better protect the country's independence in the peace that follows."
 IR3_postwar_settlement: "The Postwar Settlement"
 IR3_postwar_settlement_desc: "The war in Europe is ending, and the government must decide what it will ask of the peace. The chamber, the provinces, the foreign troops and the oil concession all press at once, and each settlement will set the terms of the next."
 IR3_azerbaijan_crisis: "The Azerbaijan Crisis"
 IR3_azerbaijan_crisis_desc: "In the last months of 1945 a provincial government in Tabriz, with Soviet support behind it, claims autonomy within Iran. Tehran must recover the province without giving the Soviet Union grounds to keep its troops in the country."
 IR3_tudeh_question: "The Tudeh Question"
 IR3_tudeh_question_desc: "The party has organized the northern factories and won seats in the chamber, and its opponents call it an instrument of Moscow. The government must decide whether to proscribe it, tolerate it, or bring its leaders into the administration."
 IR3_oil_debate: "The Oil Debate"
 IR3_oil_debate_desc: "Deputies dispute the company's payments and the terms on which the concession was granted, and both Moscow and London have made offers of their own. The chamber argues over nationalization, a new agreement, and how much of the industry Iran can run itself."
 IR3_final_settlement: "The 1945 Settlement"
 IR3_final_settlement_desc: "The war ends with foreign troops still on Iranian soil and a provincial government in Tabriz. The government presses for the withdrawal it was promised and tries to close the account of four years of occupation."
 iran_wartime_route_tt: "The course the government will follow through occupation, transit and the peace is now fixed."
 iran_campaign.33.t: "The Name of Iran"
 iran_campaign.33.d: "The government has asked foreign chancelleries to use the name Iran rather than Persia in their correspondence and treaties. The change asserts a continuous national identity, and it is received abroad with a mixture of courtesy and indifference."
 iran_campaign.33.a: "The country will be known as Iran."
 iran_campaign.34.t: "A Government for the War"
 iran_campaign.34.d: "War in Europe has reached Iran's trade, its frontiers and its revenues, and the cabinet asks for the powers to meet it. The chamber must decide whether emergency government should be concentrated in the crown's hands or kept under the scrutiny of the Majlis."
 iran_campaign.34.a: "Give the wartime cabinet a free hand."
 iran_campaign.34.b: "Keep the cabinet answerable to the Majlis."
 iran_campaign.35.t: "The Succession"
 iran_campaign.35.d: "The invasion has broken the shah's authority, and the court and cabinet must decide how the crown is to pass. A quick settlement within the family would preserve the monarchy at the price of showing that it holds the throne at the occupiers' pleasure; a transition through the Majlis would cost more time and more argument."
 iran_campaign.35.a: "Confirm the succession within the family."
 iran_campaign.35.b: "Let the Majlis and the cabinet manage the transition."
 iran_campaign.36.t: "The Powers and Their Offers"
 iran_campaign.36.d: "Britain, the Soviet Union and Germany all have business in Iran, and each would prefer the government's friendship to the others'. The cabinet sorts through what is offered in equipment, credit and technical service, and decides which relationships it can afford to encourage."
 iran_campaign.36.a: "Open a foreign policy programme."
 iran_campaign.37.t: "Terms for the Peace"
 iran_campaign.37.d: "The war in Europe is drawing to its end, and the government must decide what it will ask of the settlement. Foreign troops, the oil concession and the provincial administrations all require attention at once, and the cabinet intends to present its terms before the powers arrange matters without it."
 iran_campaign.37.a: "Set out the government's terms."
 iran_campaign.38.t: "The Azerbaijan Crisis"
 iran_campaign.38.d: "A provincial government in Tabriz has declared its autonomy with Soviet troops still in the province, and Tehran's writ no longer runs beyond the passes. The cabinet can send the army north to restore the province by force, or send negotiators to bring its leaders back into the administration on terms."
 iran_campaign.38.a: "Restore the province by force."
 iran_campaign.38.b: "Negotiate with Tabriz."
 iran_campaign.39.t: "The Settlement of 1945"
 iran_campaign.39.d: "The war has ended, and the government has carried its case through the Majlis and the foreign legations. The treaty promises withdrawal, the northern province has been brought back into the administration, and the oil question is left open rather than conceded; the work now is to make the settlement hold."
 iran_campaign.39.a: "Close the account of the occupation."
