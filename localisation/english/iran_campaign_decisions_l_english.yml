l_english:
iran_political_course: "The Political Course"
iran_political_course_desc: "The government has settled on a form, and its supporters now expect it to be governed accordingly.\n\nThese actions are the ordinary work of the chosen settlement: appointments, sessions, reviews and assemblies. Each one costs political capital or equipment and cannot be repeated at once. They are the difference between holding office and holding the country."
iran_wartime_emergency: "Wartime Emergency"
iran_wartime_emergency_desc: "War has reached Iran, whether as a belligerent, a corridor or an occupied country.\n\nThese measures compete for the same stores and the same officials. Bread, shelter, prices and public order cannot all be attended to at once. Measures already taken are marked, and most can be taken again only after the administration has recovered."
iran_tribal_settlement: "The Tribes and the State"
iran_tribal_settlement_desc: "Provincial communities negotiate, resist or bargain, and the cabinet must answer.\n\nNegotiation brings men and stability but slowly; force brings submission at the price of confidence and equipment. Neither course settles the provinces permanently, and each action must wait before it can be attempted again."
iran_court_appointments: "Appointments at Court"
iran_court_appointments_desc: "Fill provincial governorships and court offices with men loyal to the crown. The administration becomes more responsive to the palace, though the excluded families withdraw their cooperation for a time."
iran_majlis_session: "A Session of the Majlis"
iran_majlis_session_desc: "Convene the deputies and put the government's business before them. A working session costs time and patronage but gives the cabinet decisions that the country recognises as lawful."
iran_army_review: "Review the Army"
iran_army_review_desc: "Bring the divisions past the sovereign and the general staff. The review consumes equipment held in store but makes the army's condition visible to the country and to its officers."
iran_free_assembly: "The Free Assembly"
iran_free_assembly_desc: "Open the halls to workers', peasants' and soldiers' delegates. The assembly raises men for the new order and hardens its supporters, while unsettling those who expected the revolution to end with the old government."
iran_constitutional_referendum: "Put the Constitution to the Country"
iran_constitutional_referendum_desc: "Submit the republican constitution to a public vote. A confirmed constitution gives the government a settled basis for its authority, and the question cannot be reopened while this government holds office."
iran_court_reform: "Reform the Court Establishment"
iran_court_reform_desc: "Cut the household's claims on the treasury and put its estates under the finance ministry. The court loses some of the reach that foreign creditors and provincial notables once used against it."
iran_bread_rationing: "Ration Bread"
iran_bread_rationing_desc: "Take the grain stores under public control and issue bread against ration cards. The measure protects the towns through the winter, but the stores it consumes cannot be used by the army."
iran_black_market_crackdown: "Crack Down on the Black Market"
iran_black_market_crackdown_desc: "Close the bazaars' unofficial exchanges and prosecute hoarders. The government recovers control of prices and loses some of the goodwill of the merchants who kept goods moving."
iran_civil_defence_drill: "Civil Defence Drills"
iran_civil_defence_drill_desc: "Rehearse air-raid precautions, firefighting and evacuation in the larger cities. Preparedness steadies the population, though the drills take working days from industry."
iran_refugee_shelters: "Shelter the Displaced"
iran_refugee_shelters_desc: "Open public buildings and requisitioned houses to families driven from the frontier provinces. The shelters consume stores and labour, and give the government a visible claim to have protected its people."
iran_underground_press: "The Underground Press"
iran_underground_press_desc: "Print and distribute news the occupation authorities have forbidden. Each issue is a small act of defiance, and each one exposes the printers to arrest."
iran_negotiate_tribe: "Negotiate with a Tribal Confederation"
iran_negotiate_tribe_desc: "Send envoys with gifts and guarantees to a tribal leadership. Agreement brings recruits and quiet roads, at the price of recognising the confederation's own authority in its own country."
iran_punitive_expedition: "Punitive Expedition"
iran_punitive_expedition_desc: "March a column into the hills and break the confederation's armed power. The expedition consumes equipment and army experience, and the destruction it leaves behind is remembered."
iran_tribal_regiment: "Raise a Tribal Regiment"
iran_tribal_regiment_desc: "Enrol tribesmen as a regular regiment under their own officers and the army's discipline. The regiment provides trained men without a general campaign."
iran_frontier_subsidy: "Subsidise the Frontier"
iran_frontier_subsidy_desc: "Pay for roads, gendarmerie posts and grain depots along the Azerbaijani frontier. The work secures the province against a campaign that may already be visible on the horizon."
