l_english:
 GE1_ww1_regional_freight: "Regional Railway Administrations"
 GE1_ww1_regional_freight_desc: "Army districts and civilian railway authorities use separate freight schedules. Mobilisation will put both systems under strain. Coordinate freight, agree common priorities and test the new schedules before entrusting the army to them."
 GE1_ww1_regional_freight_partial: "Common Freight Priorities"
 GE1_ww1_regional_freight_partial_desc: "The railways now recognise the same classes of military freight. Dispatchers still need to rehearse the transfer of rolling stock between districts."
 AUH_ww1_reform_step_1_tt: "Eases discontent in Bohemia, Croatia and Hungary where the Crown controls those regions."
 AUH_ww1_reform_implementation: "Hear the District Delegations"
 AUH_ww1_reform_implementation_desc: "Invite representatives from the Bohemian, Croatian and Hungarian districts to report which orders and notices cannot be understood or put into practice.\n\nThe first measures take effect after two years. The final review follows in the fourth year."
 AUH_ww1_reform_step_2_tt: "Eases discontent in Bohemia, Croatia and Hungary where the Crown controls those regions."
 AUH_ww1_reform_trials: "Staff the Provincial Offices"
 AUH_ww1_reform_trials_desc: "Fund interpreters and train clerks in the districts heard by the delegations. The new offices will address some immediate grievances while the Imperial Council continues the broader settlement."
 FR3_ww1_reform_implementation: "Revise the Reserve Registers"
 FR3_ww1_reform_implementation_desc: "Match reservists to their units and send the revised lists to the depots. Extending service has given the army more trained men, but the districts must know where to send them."
 FR3_ww1_reform_trials: "Exercise the Reserve Districts"
 FR3_ww1_reform_trials_desc: "Call up a sample of the reserve formations and put the depots through a full exercise. Use the results to correct delays before a general mobilisation."
 FR3_ww1_reserve_registers: "Revised Reserve Registers"
 FR3_ww1_reserve_registers_desc: "The district offices know which men to call and where to send them. The depots still need an exercise at full strength.\n\n§Y$FR3_ww1_reform_implementation$§! starts the programme. §Y$FR3_ww1_reform_trials$§! completes it."
 EN1_ww1_reform_implementation: "Train the County Cadres"
 EN1_ww1_reform_implementation_desc: "Give the county associations regular officers and permanent instructors. Their first task is to produce units able to train and mobilise together."
 EN1_ww1_reform_trials: "Exercise the Expeditionary Depots"
 EN1_ww1_reform_trials_desc: "Practise receiving, equipping and forwarding replacement drafts. A long campaign will depend on how well the depots keep up with the expeditionary force."
 EN1_ww1_territorial_cadres: "Territorial Cadres"
 EN1_ww1_territorial_cadres_desc: "County associations can now raise and train formed units. The depots still need to prove that they can replace losses overseas.\n\n§Y$EN1_ww1_reform_implementation$§! starts the programme. §Y$EN1_ww1_reform_trials$§! completes it."
 RUS_ww1_reform_implementation: "Reorganise the Military Districts"
 RUS_ww1_reform_implementation_desc: "Assign the railheads and depots to permanent military districts and standardise how each draws stores and sends replacements to the front.\n\nThe first measures take effect after two years. The final review follows in the fourth year."
 RUS_ww1_reform_trials: "Test the Districts in the Field"
 RUS_ww1_reform_trials_desc: "Move complete formations between districts and make the depots keep them supplied. The exercise will reveal which lessons from the war in the Far East have actually been learned."
 RUS_ww1_reorganised_districts: "Reorganised Military Districts"
 RUS_ww1_reorganised_districts_desc: "The districts have common rules for issuing stores and dispatching reserves. Revised rolls bring more men within reach of the depots, though gaps remain. Field trials must still prove that the system works over long distances.\n\n§Y$RUS_ww1_reform_implementation$§! starts the programme. §Y$RUS_ww1_reform_trials$§! completes it around year four."
 IT1_ww1_reform_implementation: "Inspect the Army Corps"
 IT1_ww1_reform_implementation_desc: "Send officers through the corps to compare their training, depots and reserve rolls. The inspectors can correct the most obvious failures while the army prepares for larger exercises."
 IT1_ww1_reform_trials: "Carry Out the Corps Exercises"
 IT1_ww1_reform_trials_desc: "Bring the regiments together under corps command and make them practise the movement of troops, stores and replacements over several days."
 JP1_ww1_reform_implementation: "Convene a Joint Purchasing Board"
 JP1_ww1_reform_implementation_desc: "Put officers from both services on a single board to compare their orders for steel, machine tools and other stores. A combined list will give the cabinet a clearer view of what the factories can deliver."
 JP1_ww1_reform_trials: "Approve Common Contracts"
 JP1_ww1_reform_trials_desc: "Settle which specifications the services can share and how factories will be assigned. Let the ministries retain control of equipment designed for their own service."
 JP1_ww1_joint_purchasing: "Joint Purchasing Arrangements"
 JP1_ww1_joint_purchasing_desc: "A common purchasing office has removed some competing orders. The services are still disputing which designs and factories will receive priority.\n\n§Y$JP1_ww1_reform_implementation$§! starts the programme. §Y$JP1_ww1_reform_trials$§! completes it."
 OT1_ww1_reform_step_1_tt: "Improves imperial food security."
 OT1_ww1_reform_implementation: "Register the Provincial Grain Stocks"
 OT1_ww1_reform_implementation_desc: "Have district officers record what the mills, warehouses and railheads can actually supply. The ministries can then budget for the lean months on figures they can trust.\n\nThe first measures take effect after two years. The final review follows in the fourth year."
 OT1_ww1_reform_step_2_tt: "Improves food security and eases discontent in the controlled Anatolian, Syrian and Mesopotamian districts."
 OT1_ww1_reform_trials: "Fund the Provincial Distribution Depots"
 OT1_ww1_reform_trials_desc: "Use the new registers to stock depots nearer the districts that rely on them. Better distribution will ease shortages, while local grievances still need attention through the provincial administration."
 US2_ww1_scattered_depots: "Scattered Army Depots"
 US2_ww1_scattered_depots_desc: "The Army has stores scattered across the country and little practice supplying a large field force. The General Staff must draw up a common inventory, establish regional depots and test the system."
 US2_ww1_regional_depot_network: "Regional Army Depots"
 US2_ww1_regional_depot_network_desc: "Regional depots have a common inventory and a clear chain of responsibility. The Army has yet to test their ability to supply formations moving between districts."
 WW1_four_year_plan_begin_tt: "Starts a §YFour-Year Programme§!. The first measures take effect after §Ytwo years§!. The final review completes the programme around year four."
 WW1_four_year_plan_finish_tt: "The programme has entered its final review period."
