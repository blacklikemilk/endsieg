l_english:
 GE1_D_naval_convention:0 "Anglo-German Naval Convention"
 GE1_D_naval_convention_desc:0 "Germany recognises Britain's naval predominance. Our fleet may contain no more than six combat vessels for every ten in the Royal Navy; surplus warships are scrapped, beginning with older classes. Convoys and auxiliary vessels are exempt."
 GE1_D_naval_convention_terms_tt:0 "The German combat fleet is limited to §Y60%§! of the Royal Navy's combat vessels. §RSurplus warships will be scrapped§!, beginning with older classes; this also applies after new construction, captures or British losses. Convoys and auxiliaries are exempt. The convention expires in 1936 and can be renounced through a decision at peace, ending the Anglo-German alliance."
 GE1_D_alliance_commitment_tt:0 "Our government remains bound by the ratified Anglo-German alliance."
 GE1_D_naval_convention_category:0 "The Naval Convention"
 GE1_D_naval_convention_category_desc:0 "The agreement with Britain secures peace in the North Sea in return for German acceptance of a fleet six-tenths the size of the Royal Navy. Renouncing it would end the Anglo-German alliance and gravely damage British confidence in our word."
 GE1_D_renounce_naval_convention:0 "Renounce the Naval Convention"
 GE1_D_renounce_naval_convention_desc:0 "The Reich must be free to decide the strength of its own fleet. Renouncing the convention will end our alliance with Britain and cost us diplomatic confidence at home and abroad."
 GE1_D_naval_convention_broken:0 "Repudiated the Naval Convention"
 GE1_D_convention_ratification.t:0 "The Naval Convention"
 GE1_D_convention_ratification.d:0 "Our understanding with Britain rests on recognition of the Royal Navy's predominance. The Admiralty now asks us to bring the German combat fleet within the agreed ratio of six vessels to every ten British warships. Surplus vessels must be scrapped if the convention is to retain its meaning."
 GE1_D_convention_ratification.a:0 "We shall honour the convention."
 GE1_D_convention_ratification.b:0 "Germany will accept no naval limit."
