l_english:
 Entente:0 "Entente"
 comintern:0 "Comintern"
 ww1_mutual_defence_goal_name:0 "Uphold the Alliance Treaties"
 ww1_mutual_defence_goal_desc:0 "Our coalition joins governments with different institutions through agreed obligations. Keep the core territory owned by our member states under coalition control. Progress measures the share of those states held by our alliance or its subjects, supporting public confidence in the treaties."
 ww1_armed_neutrality_goal_name:0 "Preserve an Independent Concert"
 ww1_armed_neutrality_goal_desc:0 "Our partners seek a common voice outside the rival great-power blocs. Maintain peace among the member governments while preparing to protect their independence. Progress measures the share of alliance members currently at peace."
 WW1_COLLECTION_SECURED_CORE_STATES:0 "Member-owned core states held by the coalition"
 WW1_COLLECTION_FACTION_MEMBERS:0 "Alliance members"
 WW1_COLLECTION_MEMBERS_AT_PEACE:0 "Alliance members at peace"
 joining_rule_ww1_focus_commitment:0 "Ratified Treaty Membership"
 joining_rule_ww1_focus_commitment_desc:0 "Membership requires a national policy or accepted diplomatic agreement that authorises entry into this coalition. Partners may retain different forms of government."
 joining_rule_ww1_balkan_members:0 "Balkan Treaty Partners"
 joining_rule_ww1_balkan_members_desc:0 "Membership is reserved for the Balkan governments covered by the league's treaties and their agreed national commitments."
