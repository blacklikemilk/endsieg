l_english:
iran_coup_1921: "The Cossack Question"
iran_coup_1921_desc: "The Persian Cossack Brigade was raised by the late Shah's government and officered by Russians, and it has outlived both. Its commander answers to Tehran only for as long as Tehran pays it. Every cabinet since the war has asked the same question in private: who commands the only disciplined force in the country, and what does he intend to do with it?"

iran_court_the_officers: "Court the Officers"
iran_court_the_officers_desc: "A colonel's commission is cheap next to a railway. Send the pay chests out to the barracks, let the officers see a government that remembers them, and the Brigade's commander will find his colonels less attentive to his ambitions."

iran_buy_the_brigade: "Buy the Brigade's Obedience"
iran_buy_the_brigade_desc: "The Brigade has not been paid in full for eleven months. Settle the arrears, issue new rifles from the arsenal, and its officers will remember which government did it. The treasury will not forgive this, and neither will the men who were promised the same money."

iran_majlis_motion_reza: "Motion Against the War Minister"
iran_majlis_motion_reza_desc: "The Majlis can still do what the palace cannot: put a minister's conduct to a vote in public. A censure motion will not dismiss him, but it will tell every officer in Tehran that the chamber is watching him, and that those who follow him do so against the constitution."

iran_promote_reza_minister: "Bring Him Into the Cabinet"
iran_promote_reza_minister_desc: "Give him the War Ministry. It is the oldest bargain in Iranian politics - the strong man is safer inside the government than outside it - and it has never once worked. His name on a cabinet list will settle the army, and it will make him the second most powerful man in the country by Thursday."

iran_purge_the_cossacks: "Break the Cossack Command"
iran_purge_the_cossacks_desc: "Dissolve the Brigade's independent command and distribute its squadrons among the Gendarmerie and the provincial levies. Half the officer corps will resign, the rest will learn what the government is prepared to do, and the country will be without a mobile force for a year."
iran_coup_standing_tt: "Reza Khan has the standing with the officer corps to force a change of dynasty"
