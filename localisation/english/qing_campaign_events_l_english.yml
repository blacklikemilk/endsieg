l_english:
 qing_campaign.1.t: "The Regency"
 qing_campaign.1.d: "The imperial court faces a country changing faster than its institutions. Provincial assemblies demand a greater voice, the New Army expects modern equipment and reliable pay, and the treasury struggles to meet obligations at home and abroad. While the young emperor remains under a regency, the court must decide how far it is prepared to reform."
 qing_campaign.1.a: "The throne must provide direction."
 qing_campaign.2.t: "A Question of Reform"
 qing_campaign.2.d: "Provincial representatives have presented proposals for an assembly, a revised legal code and greater scrutiny of the budget. Supporters see a chance to restore confidence in the dynasty; courtiers fear that concessions will weaken the authority of the throne."
 qing_campaign.2.a: "Endorse the proposals."
 qing_campaign.2.b: "Refer them to a court commission."
 qing_campaign.2.c: "The throne must retain its authority."
 qing_campaign.10.t: "The Railway Protection Movement"
 qing_campaign.10.d: "The government plans to bring important railway projects under central control and seek foreign financing. Provincial investors who contributed to the lines fear the loss of both their money and their influence. Their objections have found support among merchants, students and local officials."
 qing_campaign.10.a: "Compensate the investors and share responsibility."
 qing_campaign.10.b: "Assert central control over the lines."
 qing_campaign.10.c: "Establish an authority with provincial representation."
 qing_campaign.11.t: "Unrest in Sichuan"
 qing_campaign.11.d: "Opposition to the railway policy has gathered strength in Sichuan. Provincial officials warn that an attempt to impose the government’s decision by force may deepen the crisis, while officers insist that the authority of the court must be upheld."
 qing_campaign.11.a: "Negotiate with the provincial representatives."
 qing_campaign.11.b: "Send officers loyal to the court."
 qing_campaign.19.a: "The opportunity has passed."
 qing_campaign.20.t: "The Court Considers Terms"
 qing_campaign.20.desc: "The uprising has brought the dynasty and the republicans into open conflict. Representatives of both sides are considering whether a settlement can be reached before the fighting becomes still more costly. The court has a brief opportunity to offer terms, but the choice will determine how the empire is governed."
 qing_campaign.20.a: "Offer a constitutional settlement."
 qing_campaign.20.a_tt: "The assembly will accept a written constitution only once reform has taken hold in the court."
 qing_campaign.20.b: "Propose a compact with the provinces."
 qing_campaign.20.b_tt: "The provincial assemblies will sign a compact only while they still trust Beijing."
 qing_campaign.20.c: "Entrust Yuan Shikai with the government."
 qing_campaign.20.c_tt: "Yuan Shikai can carry a settlement only while the Beiyang army answers to him."
 qing_campaign.20.d: "Restore order under the throne’s authority."
 qing_campaign.20.e: "Make no settlement for now."
 qing_campaign.21.t: "The Court Prepares for War"
 qing_campaign.21.d: "The uprising has exposed divisions within the army and the provinces. The court lacks the strength or the political support to dictate a settlement, and the regent’s advisers urge him to prepare the capital while there is still time."
 qing_campaign.21.a: "Prepare the defence of Beijing."
 qing_campaign.22.t: "An Opportunity for Settlement"
 qing_campaign.22.desc: "The army remains a force to be reckoned with, and the court may yet be able to negotiate from a position of strength. Its advisers differ over what should be offered to the provinces and what authority the dynasty should retain."
 qing_campaign.22.a: "Offer a constitutional settlement."
 qing_campaign.22.a_tt: "The court can offer a constitution only after real reform."
 qing_campaign.22.b: "Propose a provincial compact."
 qing_campaign.22.b_tt: "The provinces will take a compact only from a court they still trust."
 qing_campaign.22.c: "Entrust Yuan Shikai with the government."
 qing_campaign.22.c_tt: "Only Yuan Shikai's hold on the army makes this offer credible."
 qing_campaign.22.d: "Restore order under the throne’s authority."
 qing_campaign.23.t: "The Court Council"
 qing_campaign.23.desc: "The fighting has brought renewed calls for a settlement. Courtiers, ministers and officers disagree over the concessions needed to preserve the dynasty, but all recognise that further delay will carry a cost."
 qing_campaign.23.a: "Negotiate a constitution."
 qing_campaign.23.a_tt: "The assembly will treat only with a court that has reformed."
 qing_campaign.23.b: "Offer the provinces a compact."
 qing_campaign.23.b_tt: "The provincial assemblies will treat only while they still trust Beijing."
 qing_campaign.23.c: "Entrust the settlement to Yuan Shikai."
 qing_campaign.23.c_tt: "The southern negotiators will accept Yuan Shikai's word on the army."
 qing_campaign.23.d: "The throne will not negotiate with rebels."
 qing_campaign.24.t: "A Constitution for the Empire"
 qing_campaign.24.d: "The court has accepted a constitutional settlement. The assembly will have a greater role in government, and ministers must now turn promises made during the crisis into institutions that can endure it."
 qing_campaign.24.a: "Let the assembly convene."
 qing_campaign.25.t: "Authority of the Throne"
 qing_campaign.25.d: "The court has chosen to preserve a strong central government under the dynasty. Its ministers must now demonstrate that authority can bring order without losing the confidence of the provinces."
 qing_campaign.25.a: "Strengthen the court."
 qing_campaign.26.t: "Yuan Shikai Forms a Government"
 qing_campaign.26.d: "Yuan Shikai has been entrusted with the government. His influence among the officers gives the court a powerful ally, though it also leaves the dynasty dependent on a man with ambitions of his own."
 qing_campaign.26.a: "Confirm his appointment."
 qing_campaign.27.t: "A Compact with the Provinces"
 qing_campaign.27.d: "Representatives of the provinces and the court have reached an understanding over the distribution of authority. The agreement gives local leaders a greater stake in the empire, while leaving much to be settled between them and Beijing."
 qing_campaign.27.a: "Seal the compact."
 qing_campaign.28.t: "The Government’s Finances"
 qing_campaign.28.d: "The new government has inherited obligations it cannot easily meet. Ministers are divided over whether to strengthen the central budget or rely on the court and the existing provincial arrangements to raise the funds."
 qing_campaign.28.a: "Give the cabinet responsibility for the budget."
 qing_campaign.28.b: "Leave the matter to the court."
 qing_campaign.29.t: "The Officers’ Petition"
 qing_campaign.29.d: "New Army officers have petitioned for reliable pay, fair promotion and a greater voice in military affairs. Their request has supporters in the ranks, but some courtiers warn against rewarding collective pressure from men under arms."
 qing_campaign.29.a: "Consider their demands."
 qing_campaign.29.b: "Discipline the petitioners."
 qing_campaign.30.t: "A Generation Demands Change"
 qing_campaign.30.d: "Students, writers and merchants are calling for a stronger and more independent China. Some demand reform within the empire; others question whether the existing order can deliver it. Their demonstrations have placed the government under pressure to respond."
 qing_campaign.30.a: "Hear the students’ demands."
 qing_campaign.30.b: "Disperse the demonstrations."
 qing_campaign.30.c: "Appoint a commission of inquiry."
 qing_campaign.31.t: "The Provincial Commanders"
 qing_campaign.31.d: "Provincial commanders control men, revenues and arsenals that the central government cannot easily replace. The court must decide whether to draw them into government, appoint new officers or accept a wider measure of provincial autonomy."
 qing_campaign.31.a: "Bring the commanders into government."
 qing_campaign.31.b: "Appoint officers loyal to the court."
 qing_campaign.31.c: "Leave the provincial armies in place."
 qing_campaign.32.t: "The Nationalist Movement"
 qing_campaign.32.d: "Nationalist organisers have renewed their calls for a stronger and more unified China. Some seek reform through negotiation; others reject the dynasty outright. The government must decide whether to seek common ground or treat the movement as a threat."
 qing_campaign.32.a: "Open talks with the Nationalists."
 qing_campaign.32.b: "Restrict the movement."
 qing_campaign.32.c: "Offer its leaders a place in government."
 qing_campaign.33.t: "The Emperor and the Government"
 qing_campaign.33.d: "The emperor is old enough to take a greater part in governing. The ministers who have exercised authority in his name must decide how to transfer responsibility and what safeguards should accompany it."
 qing_campaign.33.a: "Entrust the emperor with government."
 qing_campaign.33.b: "Maintain the present arrangements."
 qing_campaign.33.c: "Require a constitutional oath."
 qing_campaign.34.t: "The Southern Question"
 qing_campaign.34.d: "Nationalist leaders in the south are seeking greater influence over the future of China. Their supporters call for national unification, while officials loyal to the court warn that the movement could challenge the government’s authority."
 qing_campaign.34.a: "Explore a coalition."
 qing_campaign.34.b: "Prepare the Yangtze defences."
 qing_campaign.34.c: "Seek the support of their commanders."
 qing_campaign.35.t: "The Manchurian Question"
 qing_campaign.35.d: "Japanese interests in Manchuria remain a source of tension. The court has received reports of growing pressure over railway rights and the authority of local officials. The government must decide how firmly to defend its position."
 qing_campaign.35.a: "Take the matter to the powers."
 qing_campaign.35.b: "Prepare the Manchurian garrison."
 qing_campaign.35.c: "Seek an accommodation."
 qing_campaign.36.t: "A Rival in Manchuria"
 qing_campaign.36.d: "A Japanese-backed government has appeared in Manchuria. Its claim to speak for the region challenges the authority of the court and raises difficult questions about the future of the north."
 qing_campaign.36.a: "Denounce the new government."
 qing_campaign.36.b: "Withhold recognition but avoid escalation."
 qing_campaign.37.t: "The Northern Frontier"
 qing_campaign.37.d: "Japanese representatives are seeking restrictions on Chinese military activity in the north. Some ministers believe that an agreement could prevent a wider conflict; others fear that any concession will invite further demands."
 qing_campaign.37.a: "Accept the restrictions."
 qing_campaign.37.b: "Refuse and prepare the army."
 qing_campaign.40.t: "The Empire in a Changing World"
 qing_campaign.40.d: "The dynasty has survived, but its future is far from assured. Ministers face the continuing task of strengthening government, securing the provinces and protecting China’s interests in an increasingly uncertain world."
 qing_campaign.40.a: "The work continues."
 qing_campaign.41.t: "A Confrontation with Japan"
 qing_campaign.41.d: "A dispute with Japan has brought relations to a dangerous point. Officers urge a firm response, while diplomats argue that a local settlement may still be possible. The court must decide whether to prepare for war or seek an agreement."
 qing_campaign.41.a: "Resist Japanese pressure."
 qing_campaign.41.b: "Seek a local settlement."
 qing_campaign.42.t: "The Government in Wartime"
 qing_campaign.42.d: "War with Japan has forced the government to consider how it will continue its work if the capital or the communications serving it come under threat. Ministries must prepare for a long conflict without abandoning their responsibilities to the provinces."
 qing_campaign.42.a: "Prepare an inland administration."
 qing_campaign.42.b: "Keep the court and army concentrated."
 qing_campaign.43.t: "The Burden of War"
 qing_campaign.43.d: "The demands of war are placing great strain on the government and the provinces. The court can draw more heavily on regional resources, or attempt to concentrate authority over the war effort in Beijing."
 qing_campaign.43.a: "Mobilise the provinces."
 qing_campaign.43.b: "Centralise the war effort."
 qing_campaign.44.t: "The War Widens"
 qing_campaign.44.d: "Japan now faces other major powers as well as China. The wider conflict may bring opportunities for assistance, but cooperation will also require difficult negotiations over resources and strategy."
 qing_campaign.44.a: "Seek cooperation with the other powers."
 qing_campaign.44.b: "Maintain independent direction of the war."
 qing_campaign.45.t: "The Strain on the Army"
 qing_campaign.45.d: "The war has tested the army and the administration alike. Commanders are asking for reinforcements and supplies, while ministers disagree over whether every threatened position can still be defended."
 qing_campaign.45.a: "Commit to a determined defence."
 qing_campaign.45.b: "Conserve the army where possible."
 qing_campaign.46.t: "The War with Japan Ends"
 qing_campaign.46.d: "Japan’s defeat has transformed the position in East Asia. China must now address the consequences of the war, restore its administration and decide how the sacrifices of its people will be recognised."
 qing_campaign.46.a: "Begin the work of recovery."
 qing_campaign.50.t: "China and the Powers"
 qing_campaign.50.d: "The government must decide how to conduct relations with the European powers. Their rivalry offers opportunities as well as dangers, and ministers disagree over whether China should cultivate closer ties or preserve greater freedom of action."
 qing_campaign.50.a: "Cultivate ties with Britain and France."
 qing_campaign.50.b: "Maintain an independent policy."
 qing_campaign.50.c: "Press the question of foreign concessions."
 qing_campaign.51.t: "Japanese Proposals"
 qing_campaign.51.d: "Japanese representatives have presented demands for a greater political and economic role in China. Ministers differ over whether an accommodation would preserve the peace or leave the empire exposed to still greater interference."
 qing_campaign.51.a: "Seek an accommodation."
 qing_campaign.51.b: "Reject the demands."
 qing_campaign.51.c: "Delay the reply and consult the provinces."
 qing_campaign.52.t: "A Request for Assistance"
 qing_campaign.52.d: "Foreign representatives have approached the court about Chinese support. Ministers must weigh the diplomatic benefits of cooperation against the demands that any contribution would place on the population and the treasury."
 qing_campaign.52.a: "Provide a labour contingent."
 qing_campaign.52.b: "Direct our effort to domestic works."
 qing_campaign.52.c: "Decline the request."
 qing_campaign.53.t: "China at the Peace"
 qing_campaign.53.d: "The powers are discussing the terms of a settlement, and the government must decide what position its representatives should take. Some urge a firm defence of Chinese claims; others believe that cooperation will secure a better standing abroad."
 qing_campaign.53.a: "Insist on China’s claims."
 qing_campaign.53.b: "Seek an agreement with the powers."
 qing_campaign.60.t: "The Question of Shandong"
 qing_campaign.60.d: "Japan’s interest in German rights and property in Shandong has drawn the attention of the court. Ministers fear that a change in foreign influence could leave Chinese authority no stronger than before."
 qing_campaign.60.a: "Raise the question with the powers."
 qing_campaign.60.b: "Accept an accommodation with Japan."
 qing_campaign.60.c: "Prepare the garrison."
 qing_campaign.61.t: "Unrest in the New Army"
 qing_campaign.61.d: "Reports from Hubei speak of revolutionary activity among officers and soldiers. The court can try to address the grievances behind the unrest, recall a trusted commander or impose stricter control over the garrisons."
 qing_campaign.61.a: "Open negotiations."
 qing_campaign.61.b: "Recall Yuan Shikai."
 qing_campaign.61.c: "Impose martial law."
 qing_campaign.62.t: "The Future of the Throne"
 qing_campaign.62.d: "The dynasty faces demands for fundamental change. Some advisers believe a constitutional settlement could preserve the throne, while others insist that the court must rely on its army and reject any challenge to its authority."
 qing_campaign.62.a: "The throne will not abdicate."
 qing_campaign.62.b: "Offer a constitutional settlement."
 qing_campaign.62.b_tt: "The assembly will treat only while the legations' armistice holds and the court has reformed, kept the army and held the provinces. The terms follow the court's reach and its treasury: a partition of the country if it holds the north alone, reunion if the assembly accepts the monarchy and is paid, and the army's terms if Beijing is still in hand."
 qing_campaign.62.c: "Prepare the defence of the capital."
 qing_campaign.63.t: "The Army and the Dynasty"
 qing_campaign.63.d: "Officers claiming to defend the dynasty are demanding a greater role in government. Some courtiers welcome their support; others fear that the throne will become dependent on soldiers whose loyalty is uncertain."
 qing_campaign.63.a: "Distance the court from the officers."
 qing_campaign.63.b: "Endorse their defence of the dynasty."
 qing_campaign.63.c: "Make use of their support."
 qing_campaign.1.late.d: "The dynasty continues to govern a country changed by decades of reform and upheaval. Ministers must balance the authority of the court with the demands of provincial leaders, officers and those calling for a greater voice in government."
 qing_campaign.35.war.d: "War with Japan has placed Manchuria at the centre of the empire’s concerns. Ministers must decide how to defend Chinese interests and sustain the garrison while fighting continues."
 qing_campaign.50.war.d: "War among the European powers has unsettled the foreign legations and opened debate in Beijing over China’s position. Some ministers see an opportunity to cultivate closer ties with Britain and France; others urge neutrality or a renewed effort to address the concessions."
