l_english:
 qing_campaign.1.t: "The Regency"
 qing_campaign.1.d: "The court at Beijing governs an empire it no longer understands. The regent holds the seals for a child emperor, the Grand Council writes edicts that provincial governors read as suggestions, and the New Army drills with foreign rifles while the treasury borrows against next year's salt revenue. Reform is discussed in every yamen and decided in none of them."
 qing_campaign.1.a: "The throne must be seen to act."
 qing_campaign.2.t: "The Edict of Reform"
 qing_campaign.2.d: "A memorial from the provinces proposes elected assemblies, a revised legal code and a national budget. The court can endorse it, dilute it, or bury it, and each choice tells the provinces what kind of dynasty they are dealing with."
 qing_campaign.2.a: "Endorse the memorial."
 qing_campaign.2.b: "Dilute it into a court commission."
 qing_campaign.2.c: "Bury it."
 qing_campaign.10.t: "The Railway Protection Crisis"
 qing_campaign.10.d: "The new trunk lines were to be built with foreign loans and owned by the state. The provincial companies that had raised their own capital see confiscation, the gentry see a foreign mortgage on their provinces, and the garrisons see orders to fire on shareholders. Crowds have already occupied the Chengdu offices."
 qing_campaign.10.a: "Compensate the shareholders and share the line."
 qing_campaign.10.b: "Keep the line and send the New Army."
 qing_campaign.10.c: "Let the provinces run the railway and pay for it."
 qing_campaign.11.t: "Chengdu Under Occupation"
 qing_campaign.11.d: "The railway offices in Chengdu are held by shareholders and students, and the governor reports that his own troops are unwilling to clear them. The court must decide whether this is a riot to be suppressed or a negotiation to be opened."
 qing_campaign.11.a: "Open negotiations with the provincial assembly."
 qing_campaign.11.b: "Replace the governor and send a loyal division."
 qing_campaign.20.t: "The Court Opens Negotiations"
 qing_campaign.20.d: "The Wuchang garrison has not risen. Its officers have sent a memorial instead, and the provincial assemblies have sent another. Both name the same price: a government the provinces can recognise, and a throne that accepts a law above itself. The regent can still choose what kind of settlement this will be."
 qing_campaign.20.a: "A written constitution before the bayonets."
 qing_campaign.20.b: "A compact with the provincial assemblies."
 qing_campaign.20.c: "Let Yuan Shikai guarantee the throne."
 qing_campaign.20.d: "The court will restore order itself."
 qing_campaign.20.e: "Let the dynasty take its chances."
 qing_campaign.21.t: "The Garrison Stirs"
 qing_campaign.21.d: "Officers of the New Army have been seen meeting without orders, and the railway towns are full of men who have lost their capital and their patience. The court issues a proclamation of confidence. In the streets of Wuchang nobody is confident."
 qing_campaign.21.a: "Prepare the capital."
 qing_campaign.22.t: "The Army Can Still Impose a Settlement"
 qing_campaign.22.d: "The Beiyang divisions are intact, the capital is quiet, and the revolutionary committees in the south have not yet found a commander they all accept. The court can end this before it becomes a war, at the price of real concessions."
 qing_campaign.22.a: "Offer the constitution now."
 qing_campaign.22.b: "Offer the provinces their compact."
 qing_campaign.22.c: "Let Yuan Shikai take the government."
 qing_campaign.22.d: "Impose order and postpone the settlement."
 qing_campaign.23.t: "The Court Council"
 qing_campaign.23.d: "The war has lasted long enough for the southern provinces to organise and for the treasury to empty. The Grand Council meets behind closed doors while the fighting continues, and the question before it is whether the dynasty can still purchase its survival."
 qing_campaign.23.a: "Settle with the assembly."
 qing_campaign.23.b: "Settle with the provinces."
 qing_campaign.23.c: "Put Yuan Shikai in charge of the settlement."
 qing_campaign.23.d: "The throne does not negotiate with rebels."
 qing_campaign.24.t: "The Constitution Is Proclaimed"
 qing_campaign.24.d: "The edict is read in the Hall of Supreme Harmony. The throne keeps its dignity, the assembly keeps its seats, and the provinces keep their taxes, but the budget must now be voted and the law applies to the court as well. The courtiers bow. Nobody in the hall believes them."
 qing_campaign.24.a: "Let the assembly sit."
 qing_campaign.25.t: "The Throne Rules Alone"
 qing_campaign.25.d: "The regent dissolves the committees and governs through the Grand Council and the governors it appoints. The edicts are clear and the provinces obey them slowly. In the yamen they speak of strength. In the tea houses they speak of the last dynasty that tried this."
 qing_campaign.25.a: "Strengthen the court."
 qing_campaign.26.t: "Yuan Shikai Forms a Government"
 qing_campaign.26.d: "Yuan Shikai accepts the premiership and brings the Beiyang divisions with him. The throne keeps its title and its palace, and the army keeps the government. Officers who once waited for promotion now wait for orders from a man who never wanted a constitution."
 qing_campaign.26.a: "Confirm the appointment."
 qing_campaign.27.t: "The Provincial Compact"
 qing_campaign.27.d: "The governors and the provincial assemblies sign a compact with Beijing. The provinces keep their own taxation and their own militia, the centre keeps the name and the foreign service, and both sides call it a restoration of the empire rather than a division of it. It will be tested the first time the centre needs money or men."
 qing_campaign.27.a: "Seal the compact."
 qing_campaign.28.t: "The First Cabinet"
 qing_campaign.28.d: "The settlement has produced a government and the government has produced a budget it cannot pay for. Ministers argue over the salt revenue, the provinces argue over their quotas, and the throne watches to see whether the new institutions can survive their first year."
 qing_campaign.28.a: "Let the cabinet find the money."
 qing_campaign.28.b: "Let the court find the money."
 qing_campaign.29.t: "The Officers' Petition"
 qing_campaign.29.d: "A group of New Army officers has petitioned for pay, promotion by examination and a say in the war ministry. The petition is polite, signed by men who command real divisions, and impossible to ignore."
 qing_campaign.29.a: "Grant the petition."
 qing_campaign.29.b: "Arrest the ringleaders."
 qing_campaign.30.t: "The May Fourth Generation"
 qing_campaign.30.d: "The peace conference has given Shandong to Japan and the students of Beijing have taken to the streets. They demand the return of the province, the punishment of the ministers who signed, and a government that represents the nation rather than the dynasty. The slogans are new. The crowd is not."
 qing_campaign.30.a: "Support the students' demands."
 qing_campaign.30.b: "Suppress the demonstrations."
 qing_campaign.30.c: "Promise a commission of inquiry."
 qing_campaign.31.t: "The Warlord Question"
 qing_campaign.31.d: "Provincial commanders have begun to keep their own revenue and their own arsenals. Some call them governors, some call them warlords, and the difference is whether Beijing can still remove them."
 qing_campaign.31.a: "Bring them into the government."
 qing_campaign.31.b: "Replace them with loyal officers."
 qing_campaign.31.c: "Let the provinces keep their armies."
 qing_campaign.32.t: "The Nationalist Revival"
 qing_campaign.32.d: "A revived Nationalist party is organising in the south, with a programme of national unity, land reform and the end of the dynasty. Its leaders are careful to say they are loyal to the nation rather than to the throne, and the distinction is doing a great deal of work."
 qing_campaign.32.a: "Open talks with the Nationalists."
 qing_campaign.32.b: "Outlaw the party."
 qing_campaign.32.c: "Invite its leaders into the cabinet."
 qing_campaign.33.t: "The Emperor Comes of Age"
 qing_campaign.33.d: "Puyi has reached his majority, and the regency ends. The court has spent a decade governing in his name and now must decide whether to hand him the seals. A young emperor with an education and no experience is a question the whole country is waiting to see answered."
 qing_campaign.33.a: "Hand him the government."
 qing_campaign.33.b: "Keep him in the palace and the regency in place."
 qing_campaign.33.c: "Bind him to a constitutional oath."
 qing_campaign.34.t: "The Northern Expedition"
 qing_campaign.34.d: "The Nationalist armies have left Guangdong and are moving north with the stated aim of uniting China. Their commanders want either a share of the government or a war, and the provincial governors between the south and Beijing are already deciding which of those they prefer."
 qing_campaign.34.a: "Negotiate a coalition government."
 qing_campaign.34.b: "Fight them at the Yangtze."
 qing_campaign.34.c: "Buy their commanders."
 qing_campaign.35.t: "The Manchurian Incident"
 qing_campaign.35.d: "Japanese officers have blamed a Chinese attack on the railway at Mukden and have occupied the surrounding towns. Tokyo calls it a local measure. The Kwantung Army calls it a solution to a problem it has described for twenty years."
 qing_campaign.35.a: "Appeal to the League of Nations."
 qing_campaign.35.b: "Resist with the Manchurian garrison."
 qing_campaign.35.c: "Accept the loss and keep the peace."
 qing_campaign.36.t: "The Northern Client"
 qing_campaign.36.d: "Tokyo has proclaimed a new state in Manchuria under a Qing prince, or so the announcement says. The claim is an insult aimed at the dynasty and a warning aimed at Beijing: the north can always be given to someone more agreeable."
 qing_campaign.36.a: "Denounce the client state."
 qing_campaign.36.b: "Do not recognise it and do not fight over it."
 qing_campaign.37.t: "The Tanggu Question"
 qing_campaign.37.d: "A Japanese ultimatum demands a demilitarised zone south of the Great Wall. Accepting it moves the frontier of Japanese control to the outskirts of Beijing. Refusing it means a war the army is not ready to fight."
 qing_campaign.37.a: "Accept the zone."
 qing_campaign.37.b: "Refuse and mobilise."
 qing_campaign.40.t: "The Dynasty at War"
 qing_campaign.40.d: "The 1936 world has no memory of the compromise that saved the Qing. The dynasty governs a country with foreign concessions on its coast, Japanese armies in the north and a generation that has never known another regime. It has survived a quarter of a century. It has not yet been tested."
 qing_campaign.40.a: "The government will hold."
 qing_campaign.41.t: "The Marco Polo Bridge"
 qing_campaign.41.d: "A missing soldier at the Marco Polo Bridge has become an exchange of fire, and the exchange has become an ultimatum. Tokyo speaks of local settlement while its divisions move south. Beijing must decide whether this is an incident or the beginning of the war everyone has expected."
 qing_campaign.41.a: "Resist the Japanese advance."
 qing_campaign.41.b: "Negotiate a local settlement."
 qing_campaign.42.t: "The Government Leaves Nanjing"
 qing_campaign.42.d: "The Japanese advance has reached the lower Yangtze and the capital is no longer a safe seat of government. The court, the ministries and the foreign legations must move upriver. The choice is how much of the state travels with them."
 qing_campaign.42.a: "Move the government to Chongqing."
 qing_campaign.42.b: "Keep the court in Beijing."
 qing_campaign.43.t: "The Long War"
 qing_campaign.43.d: "The front has settled into a war of positions and supply lines. The coast is lost, the railways are contested, and the government governs through provincial governors who now command their own armies. What the dynasty does next will decide whether it is a government or a symbol."
 qing_campaign.43.a: "Mobilise the provinces."
 qing_campaign.43.b: "Centralise the war effort."
 qing_campaign.44.t: "The Pacific War"
 qing_campaign.44.d: "Japan is at war with the United States and the British Empire, and the Chinese front is no longer the only one. Aid may come, but so will demands for bases, roads and a voice in the peace."
 qing_campaign.44.a: "Cooperate with the Allies."
 qing_campaign.44.b: "Keep the government independent of foreign command."
 qing_campaign.45.t: "The Year of Disaster"
 qing_campaign.45.d: "The Japanese offensive has broken the front in the south and the government has lost provinces it governed for a generation. The treasury is empty, the armies are separated, and the provinces are asking whether the dynasty can still protect them."
 qing_campaign.45.a: "Fight for every province."
 qing_campaign.45.b: "Conserve the army and abandon the south."
 qing_campaign.46.t: "The Japanese Surrender"
 qing_campaign.46.d: "The war has ended in the Pacific, and the Japanese armies in China are laying down their arms. The dynasty has survived the greatest test of its existence, and the question that follows every victory is now in front of it: what kind of China has it earned the right to govern."
 qing_campaign.46.a: "Accept the surrender in the name of the emperor."
 qing_campaign.50.t: "The Great War"
 qing_campaign.50.d: "The European powers are at war and both sides are counting China's divisions, railways and ore. The dynasty can sell its neutrality, join the Entente and hope for a seat at the peace, or use the war to renegotiate the concessions that have humiliated it since 1900."
 qing_campaign.50.a: "Join the Entente."
 qing_campaign.50.b: "Sell neutrality to both sides."
 qing_campaign.50.c: "Use the war to reclaim the concessions."
 qing_campaign.51.t: "The Twenty-One Demands"
 qing_campaign.51.d: "Japan has presented a list of demands that would make China a protectorate in all but name: railway rights, mining rights, advisers, and a pledge not to lease any coastal territory to another power. The foreign ministry has five days to answer."
 qing_campaign.51.a: "Accept the demands."
 qing_campaign.51.b: "Reject them and appeal to the powers."
 qing_campaign.51.c: "Delay and leak the text."
 qing_campaign.52.t: "The Labour Corps"
 qing_campaign.52.d: "The Entente wants Chinese labourers behind the Western Front and Chinese battalions in Siberia. Both requests pay in credits and both cost in lives. The court can send men, send money, or send neither."
 qing_campaign.52.a: "Send the labour corps."
 qing_campaign.52.b: "Send money instead of men."
 qing_campaign.52.c: "Send nothing."
 qing_campaign.53.t: "The Peace Conference"
 qing_campaign.53.d: "The war is over and the powers are deciding what China's contribution was worth. Shandong is promised to Japan, the concessions remain, and the Chinese delegation has been told to sign. The news reaches Beijing before the delegation does."
 qing_campaign.53.a: "Refuse to sign."
 qing_campaign.53.b: "Sign and take the League seat."
