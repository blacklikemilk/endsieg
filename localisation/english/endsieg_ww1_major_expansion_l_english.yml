l_english:
 RUS_ww1_expansion_depot_siding_schedule: "Reserve Sidings for Army Stores"
 RUS_ww1_expansion_depot_siding_schedule_desc: "Ammunition trains need places to wait and unload without occupying the main line. Work out which sidings each military district can use."
 RUS_ww1_expansion_war_industry_committees: "Organise the War Industry Committees"
 RUS_ww1_expansion_war_industry_committees_desc: "Industrialists and local committees can find workshop capacity the ministries have overlooked. Give them a list of the army orders that need attention first."
 RUS_ww1_expansion_zemstvo_hospital_trains: "Fit Out Zemstvo Hospital Trains"
 RUS_ww1_expansion_zemstvo_hospital_trains_desc: "Local committees can fit out carriage stock and find the staff to take wounded men away from the crowded front-line stations."
 RUS_ww1_expansion_coastal_repair_tenders: "Contract for Coastal Repair Tenders"
 RUS_ww1_expansion_coastal_repair_tenders_desc: "Small tenders can carry spares and fitters to ships operating away from a naval yard. Set aside vessels for that duty before the next fleet exercise."
 RUS_ww1_expansion_reserve_instructor_courses: "Run Courses for Reserve Instructors"
 RUS_ww1_expansion_reserve_instructor_courses_desc: "The regular regiments will lend instructors to the reserve depots. Their task is to teach officers how to bring recruits up to a common standard."
 RUS_ww1_expansion_black_sea_mine_schools: "Train Black Sea Mine Crews"
 RUS_ww1_expansion_black_sea_mine_schools_desc: "Regular laying and sweeping exercises will help protect the fleet anchorage and give merchant captains safer approaches to the coast."
 RUS_ww1_expansion_frontier_flying_stations: "Survey Frontier Landing Grounds"
 RUS_ww1_expansion_frontier_flying_stations_desc: "The aviation detachments need fields they can reach from the forward depots. Engineers will record landing surfaces and find sheds for spares."
 RUS_ww1_expansion_district_remount_depots: "Inspect the Remount Depots"
 RUS_ww1_expansion_district_remount_depots_desc: "Cavalry and gun teams draw horses from different districts. An inspection will identify where replacement stock needs to be kept before the next mobilisation."
 RUS_ww1_expansion_frontier_loading_trials: "Exercise the Frontier Railheads"
 RUS_ww1_expansion_frontier_loading_trials_desc: "Have a full formation embark with its guns and stores. Station masters can use the exercise to revise loading times and the order of trains."
 RUS_ww1_expansion_observer_map_sections: "Train the Map Sections"
 RUS_ww1_expansion_observer_map_sections_desc: "Observers and surveyors will work from the same grid so photographs and reports can be compared at district headquarters."
 RUS_ww1_expansion_depot_tool_contracts: "Contract for Arsenal Machine Tools"
 RUS_ww1_expansion_depot_tool_contracts_desc: "The arsenals need gauges, lathes and cutting tools to keep rifle and gun orders moving. Place orders before the repair shops run through their stocks."
 RUS_ww1_expansion_caucasus_fuel_reserve: "Build a Caucasus Fuel Reserve"
 RUS_ww1_expansion_caucasus_fuel_reserve_desc: "Hold a reserve of fuel for the railways and the Caspian steamers. Purchases will be staggered so that ordinary trade can still draw supplies."
 RUS_ww1_expansion_fleet_merchant_signals: "Issue Common Convoy Signals"
 RUS_ww1_expansion_fleet_merchant_signals_desc: "Give the merchants and escort officers a common signal book. They must practise keeping station and reporting obstructions before wartime traffic arrives."
 RUS_ww1_expansion_special_defence_council: "Convene the Special Council for Defence"
 RUS_ww1_expansion_special_defence_council_desc: "The army and industry must answer to the same body when deciding which contracts the country can fill. Give the new council authority to settle priority disputes."
 RUS_ww1_expansion_armaments_returns: "Collect Monthly Armaments Returns"
 RUS_ww1_expansion_armaments_returns_desc: "The council needs to know what the factories have delivered and which depots are still short. Require the arsenals and ministries to keep the same accounts."
