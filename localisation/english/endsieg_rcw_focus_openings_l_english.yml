l_english:
 SO2_civil_war_opening: "Convene the Soviet Leadership"
 SO2_civil_war_opening_desc: "The government must bring its political and military leaders together to settle the immediate priorities of the republic. A common direction will give the institutions of the state the means to act."
 WHR_civil_war_opening: "Convene the White Leadership"
 WHR_civil_war_opening_desc: "The many authorities claiming to speak for Russia must agree on the immediate work before them. A council of civilian and military leaders can establish a common direction."
