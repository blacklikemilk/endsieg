 MKN_nestor_makhno:0 "Nestor Makhno"
 ww1_ukraine.8.t:0 "The Directory Challenges the Hetman"
 ww1_ukraine.8.d:0 "Skoropadsky has pledged to federate Ukraine with a future non-Bolshevik Russia. His opponents have formed a Directory under Volodymyr Vynnychenko and are gathering troops around Bila Tserkva. With German troops preparing to leave, the fate of the government in Kyiv is in doubt."
 ww1_ukraine.8.a:0 "The Hetmanate is under pressure."
 ww1_ukraine.9.t:0 "Petliura Takes Charge of the Directory"
 ww1_ukraine.9.d:0 "Volodymyr Vynnychenko has resigned from the Directory. Symon Petliura, the commander of the Ukrainian People’s Army, now heads the government. He must find arms and foreign support while the republic fights for a foothold in its own country."
 ww1_ukraine.9.a:0 "The republic has a new leader."
 ww1_ukraine.10.t:0 "Poland and West Ukraine Fight for Galicia"
 ww1_ukraine.10.d:0 "Polish and West Ukrainian troops are fighting for control of Eastern Galicia. The two governments each claim the region, and the roads and railways around Lviv are among the first objects of the fighting. The Allied powers have yet to agree on a final frontier."
 ww1_ukraine.10.a:0 "Galicia is still contested."
 ww1_ukraine.11.t:0 "The Directory Goes to War With the Whites"
 ww1_ukraine.11.d:0 "The Ukrainian government has declared war on the White forces in the south. General Denikin’s command claims authority over the former Russian Empire and refuses to recognize the republic. The Ukrainian People’s Army now faces another front while the Bolsheviks press from the east."
 ww1_ukraine.11.a:0 "A new front opens."
 ww1_ukraine.12.t:0 "Makhno’s Insurgents Return to Zaporizhzhia"
 ww1_ukraine.12.d:0 "The Revolutionary Insurgent Army has re-established a foothold in the district around Huliaipole. Nestor Makhno has called on local councils to organize their own administration. The movement’s independence puts it at odds with the armies contesting southern Ukraine."
 ww1_ukraine.12.a:0 "The Black Army has returned."
 ww1_ukraine.13.t:0 "Poland and Ukraine Sign an Agreement in Warsaw"
 ww1_ukraine.13.d:0 "Józef Piłsudski and Symon Petliura have reached an agreement for joint action against the Bolsheviks. Warsaw recognizes Petliura’s government, and the Directory accepts Poland’s claims west of the agreed frontier. The first shipments of Polish equipment are being readied for the Ukrainian army."
 ww1_ukraine.13.a:0 "The former rivals will fight together."

 ww1_ukraine.14.t:0 "An Agreement With Petliura"
 ww1_ukraine.14.d:0 "Petliura's envoys have offered to accept Poland's claims in Eastern Galicia and western Volhynia. They ask for arms, freedom of movement and recognition of the Ukrainian People's Republic. With both armies fighting the Bolsheviks, Piłsudski believes a convention can give the Ukrainians the means to hold their front."
 ww1_ukraine.14.exile:0 "Petliura's government has lost its territory. From Poland, his envoys seek recognition of the Ukrainian People's Republic and arms for its troops. In return, they will accept Polish claims in Eastern Galicia and western Volhynia. The Ukrainian riflemen training in Poland could take part in a joint campaign."
 ww1_ukraine.14.a:0 "Offer the convention."
 ww1_ukraine.14.b:0 "We will fight on our own."
 ww1_ukraine.15.t:0 "Warsaw Offers a Military Convention"
 ww1_ukraine.15.d:0 "The Polish government offers recognition and supplies for our army. In return it asks us to accept the proposed frontier in Galicia and Volhynia. Officers on both sides have already begun discussions on how to supply the front. Acceptance will bring Poland closer at a price that many Ukrainians will find hard to accept."
 ww1_ukraine.15.a:0 "Sign the agreement."
 ww1_ukraine.15.b:0 "Decline the terms."
 ww1_ukraine.16.t:0 "Two Ukrainian Republics Proclaim Union"
 ww1_ukraine.16.d:0 "Representatives from Kyiv and Eastern Galicia have proclaimed the union of their republics. The agreement commits both governments to a common Ukrainian state. In the meantime, the West Ukrainian administration and army will retain their own command as fighting continues in Galicia."
 ww1_ukraine.16.a:0 "The two governments pledge to unite."
 ww1_ukraine.17.t:0 "Denikin's Army Approaches"
 ww1_ukraine.17.d:0 "The Volunteer Army has advanced into southern Ukraine. Denikin refuses to recognize our government, and reports from the front leave little hope of an agreement. The Directory must decide whether to open hostilities while the Bolsheviks continue their advance."
 ww1_ukraine.17.a:0 "Order the army to oppose Denikin."
 ww1_ukraine.17.b:0 "Keep the army on the Soviet front."
 ww1_ukraine.18.t:0 "The Dispute Over Eastern Galicia"
 ww1_ukraine.18.d:0 "West Ukrainian authorities have taken power in Eastern Galicia. Warsaw claims the province, while the new government intends to defend its independence. Officers in Lwów are asking for orders before the competing claims lead to a wider confrontation."
 ww1_ukraine.18.a:0 "Send the army into Galicia."
 ww1_ukraine.18.b:0 "Pursue the claim through diplomacy."

 transcauc.11.t:0 "The Azerbaijani Revolutionary Committee"
 transcauc.11.d:0 "The Revolutionary Committee in Baku has assumed power in the name of Soviet Azerbaijan. Nariman Narimanov heads the new government, which claims authority over the provincial administration at Ganja as well as the capital."
 transcauc.11.a:0 "Appoint the Council of People's Commissars."

 INT_CRI_regional:0 "Crimean Regional Government"
 INT_CRI_regional_DEF:0 "the Crimean Regional Government"
 INT_CRI_regional_ADJ:0 "Crimean"
 INT_CRI_1919_soviet:0 "Crimean Socialist Soviet Republic"
