 INT_CRI_1919_soviet_ADJ:0 "Crimean"
 INT_eastern.14.t:0 "A New Ministry in Crimea"
 INT_eastern.14.d:0 "With the German troops withdrawing, Solomon Krym has formed a new regional government in Simferopol. The ministry looks to the Allies for support while the civil war approaches the peninsula."
 INT_eastern.14.a:0 "Krym takes office."
 INT_eastern.15.t:0 "The Crimean Soviet Republic"
 INT_eastern.15.d:0 "The advance of the Red Army has ended the regional government's rule. In Simferopol, a provisional workers' and peasants' government has formed under Dmitry Ulyanov."
 INT_eastern.15.a:0 "Proclaim the republic."
 INT_eastern.16.t:0 "The Whites Return to Crimea"
 INT_eastern.16.d:0 "White forces have regained the peninsula. Sevastopol and its naval base now form part of the southern White command."
 INT_eastern.16.a:0 "Secure the ports."
 INT_eastern.17.t:0 "Soviet Administration in Crimea"
 INT_eastern.17.d:0 "The Red Army holds the mainland approaches to Crimea. With the southern White forces unable to reach the peninsula, Dmitry Ulyanov's provisional government has handed its administration to Soviet Russia."
 INT_eastern.17.a:0 "Assume responsibility for the peninsula."
 transcauc.12.t:0 "The Transcaucasian Union"
 transcauc.12.d:0 "Delegates from Soviet Armenia, Azerbaijan and Georgia have agreed to a federative union. Their republican administrations remain in place as the three governments bring foreign and economic affairs under common direction."
 transcauc.12.a:0 "Ratify the union treaty."
 transcauc.13.t:0 "Transcaucasia Enters the Soviet Union"
 transcauc.13.d:0 "The Transcaucasian federation has joined the Union of Soviet Socialist Republics. Armenia, Azerbaijan and Georgia now share representation in the Union through the federation."
 transcauc.13.a:0 "Bring the federation into the Union."
