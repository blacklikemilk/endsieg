 ww1_ukraine.19.t:0 "A Soviet Government in Kharkiv"
 ww1_ukraine.19.d:0 "With Kharkiv in Red Army hands, Khristian Rakovsky heads a Soviet Ukrainian government. The Directory continues to claim authority over Ukraine and can still field its own army."
 ww1_ukraine.19.a:0 "Recognize the Kharkiv government."
