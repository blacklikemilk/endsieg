 INT_DON_rostov_soviet_DEF:0 "the Don Soviet Republic"
 INT_DON_rostov_soviet_ADJ:0 "Don"
 INT_don_settlement.1.t:0 "The Don under Soviet Administration"
 INT_don_settlement.1.d:0 "The Soviet authorities are bringing the former territory of the Don Host under regional administration. Its separate government and foreign relations have come to an end."
 INT_don_settlement.1.a:0 "Place the region under Russian administration."
 INT_don_settlement.2.t:0 "A Soviet Republic at Rostov"
 INT_don_settlement.2.d:0 "The Don revolutionaries have proclaimed a republic at Rostov. Led by the Cossack Bolshevik Fyodor Podtyolkov, its council claims authority over the Don Host, where opposition is gathering."
 INT_don_settlement.2.a:0 "Recognize the council."
 INT_don_settlement.3.t:0 "The Don Cossacks Recover Rostov"
 INT_don_settlement.3.d:0 "The Bolshevik government at Rostov has fallen. With the lower Don back in Cossack hands, delegates can assemble in Novocherkassk to elect an ataman."
 INT_don_settlement.3.a:0 "Convene the circle."
 INT_DON_rostov_soviet_communism:0 "Don Soviet Republic"
 INT_DON_rostov_soviet_communism_DEF:0 "the Don Soviet Republic"
 INT_UKR_regional_fronts_tt:0 "The Soviet Ukrainian government commits its forces to the fronts in Ukraine and Poland."
