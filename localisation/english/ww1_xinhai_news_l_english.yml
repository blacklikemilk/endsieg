l_english:
 ww1_xinhai_news.1.t:0 "The Revolution Triumphs in China"
 ww1_xinhai_news.1.military.d:0 "Republican forces have entered Beijing, and the Qing government has capitulated. The revolution that began in the provinces has reached the imperial capital, bringing the authority of the dynasty to a breaking point.\n\nThe fighting has left the new government with formidable problems. Provincial commanders hold power of their own, while the future of the court and the terms of peace remain to be settled."
 ww1_xinhai_news.1.settlement.d:0 "The Qing dynasty has fallen, and the republican government has assumed authority in its place. The revolution that began in the provinces has brought centuries of imperial rule to an end.\n\nCelebrations have greeted the news, but the new republic faces a difficult task. Provincial commanders, rival politicians and foreign powers will all have a say in the future of China."
 ww1_xinhai_news.1.a:0 "A new chapter for China."
