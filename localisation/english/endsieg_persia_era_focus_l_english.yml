 ### SHORTCUT ###
 PER_qajar_shortcut: "Qajar Twilight to Reza Khan's Persia"
 PER_occupation_shortcut: "Occupied Iran"

 ### ERA I: QAJAR TWILIGHT ###
 PER_the_persian_question: "The Persian Question"
 PER_the_persian_question_desc: "Since the Convention of 1907, London and St Petersburg have treated Persia as a field divided into two zones, with the Majlis, the treasury and the throne itself caught between them. Ahmad Shah is a boy of twelve, the provinces answer to khans and governors-general, and every ministry that tries to govern finds the customs revenue already pledged abroad.\n\nBefore Persia can choose a road, it must decide whom it can afford to be seen choosing."

 PER_shuster_mission: "The Shuster Mission"
 PER_shuster_mission_desc: "The Majlis has asked Washington for a Treasurer-General, and W. Morgan Shuster arrives with authority to collect taxes, settle the Treasury's debts and raise a treasury gendarmerie of his own. Every rial he collects is a rial no foreign consul can promise or withhold.\n\nBoth neighbouring empires have noticed."

 PER_third_power_diplomacy: "A Third Power"
 PER_third_power_diplomacy_desc: "If London and St Petersburg will not leave Persia alone, Persia must find friends who are not its neighbours. Berlin has no zone to protect and Washington wants none. A Persian envoy received in either capital is a diplomatic act the two empires cannot ignore."

 PER_accept_the_spheres: "Live Within the Spheres"
 PER_accept_the_spheres_desc: "The Convention of 1907 is a fact of Persian life, and a government that spends its strength denying it will have nothing left to govern with. By answering each demand separately, ministers can keep the Majlis sitting and the customs houses open, at the price of saying yes to the foreigners more often than the public would like."

 PER_the_army_question: "The Army Question"
 PER_the_army_question_desc: "Persia has no army. It has a Russian-officered Cossack Brigade in Tehran, a gendarmerie trained by Sweden, and provincial levies loyal to their khans. Whoever commands the troops that can actually march will command the capital."

 PER_swedish_gendarmerie: "Swedish Officers"
 PER_swedish_gendarmerie_desc: "Swedish officers, neutral and with no claim on Persian soil, offer to train a national gendarmerie from Persian recruits. The posts they build along the trade roads will be small and underpaid, but they will belong to the Persian state and to no foreign power."

 PER_cossack_brigade: "The Cossack Brigade"
 PER_cossack_brigade_desc: "The Persian Cossack Brigade is the only disciplined formation in the country. Its instructors are Russian, its pay is regular and its loyalty belongs to whoever signs the vouchers. To make it a national force, Persian officers must rise through its ranks while its Russian commanders still enjoy the Shah's confidence."

 PER_the_tribal_question: "The Tribal Question"
 PER_the_tribal_question_desc: "The Bakhtiari khans carried the constitutionalists into Tehran, the Qashqai hold the road to Shiraz, and Sheikh Khazal of Mohammerah leases land to the oil company that no governor can reach. A central government must decide whether to treat these men as partners or as rivals."

 PER_bakhtiari_alliance: "Alliance of the Khans"
 PER_bakhtiari_alliance_desc: "The tribal confederations are the only armed force in the south with a record of defending the constitution. A standing arrangement with the Bakhtiari and their neighbours trades provincial autonomy for peaceful roads and quiet in the oil fields."

 PER_provincial_governors: "Governors-General"
 PER_provincial_governors_desc: "Governors-general appointed by Tehran and backed by the gendarmerie can collect revenue where the khans collect tribute. The khans will remember who sent them."

 PER_wartime_neutrality: "A Neutral Battlefield"
 PER_wartime_neutrality_desc: "In the autumn of 1914 the Persian government proclaims its neutrality. Ottoman, Russian and British columns will cross its frontiers regardless. A neutral Persia can at least say which of its uninvited guests it had warned."

 PER_ratify_the_agreement: "The Anglo-Persian Agreement"
 PER_ratify_the_agreement_desc: "Foreign Minister Vossug od-Dowleh has negotiated a British loan secured on the customs revenue and British advisers for the army and the treasury, and in return Britain guarantees Persia's independence and integrity. The price is a protectorate in everything but the name."

 PER_reject_the_agreement: "Reject the Agreement"
 PER_reject_the_agreement_desc: "The Majlis has not been convened to ratify the treaty and the press has called it a sale of the country. Persia will rely on its own people and on whatever the new government in Moscow is prepared to concede in the north, rather than bind itself to any single patron."

 ### ERA II: REZA KHAN'S PERSIA ###
 PER_the_1921_coup: "The Coup of 1921"
 PER_the_1921_coup_desc: "On the night of 21 February, the Cossacks ride into Tehran without firing a shot. The cabinet falls, the journalist Zia ol-Din Tabatabaee becomes prime minister, and the colonel who led the column, Reza Khan, becomes commander of the army. The Shah accepts what he cannot prevent."

 PER_pahlavi_dynasty: "The Pahlavi Crown"
 PER_pahlavi_dynasty_desc: "Ahmad Shah has been in Europe since 1923, and in December 1925 the Majlis votes the Qajar dynasty out of existence. Reza Khan takes the throne as Reza Shah Pahlavi, with the army behind him and the deputies reluctantly in front of him."

 PER_republic_movement: "The Republic Movement"
 PER_republic_movement_desc: "In 1924 the army's commander, Reza Khan, comes close to proclaiming a republic on the Turkish model. The clergy, the bazaar and a handful of deputies block him. If the movement carries the Majlis instead, Persia will be governed by a parliament that has never been tried."

 PER_constituent_assembly: "The Constituent Assembly"
 PER_constituent_assembly_desc: "The deputies write the new order into the constitution of 1906: a hereditary throne, an elected assembly, or both, with the army standing at the door of the chamber in either case."

 PER_pacify_the_provinces: "Pacify the Provinces"
 PER_pacify_the_provinces_desc: "Gilan, Azerbaijan, Khuzestan and the Kurdish and Turkmen frontiers all have their own armed men. The army marches province by province until each one acknowledges Tehran."

 PER_codify_the_state: "A Code for the State"
 PER_codify_the_state_desc: "Ali Akbar Davar's new civil code, a national ministry of education and a state notary replace the old judges and local custom. Courts, schools and registry offices are all built in the capital's image."

 PER_universal_conscription: "The Conscription Law"
 PER_universal_conscription_desc: "The conscription law of 1925 makes service universal and the provincial levies obsolete. For the first time, a Persian soldier from Isfahan and a Persian soldier from Tabriz wear the same uniform and obey the same orders."

 PER_the_name_of_iran: "The Name of Iran"
 PER_the_name_of_iran_desc: "In 1935 the Foreign Ministry asks every government to call the country by the name its people use: Iran. The old concessions, spheres and advisers belong to the Persia that is being retired, and the state that remains can begin to build."

 ### ERA III: OCCUPIED IRAN ###
 PER_the_august_ultimatum: "The August Ultimatum"
 PER_the_august_ultimatum_desc: "London and Moscow demand the expulsion of Axis nationals from Iran and the use of the railway and the oil fields. Their columns are already on the frontier. Tehran has a few days to decide what kind of country it will be when they arrive."

 PER_defend_the_homeland: "Defend the Homeland"
 PER_defend_the_homeland_desc: "The army cannot win, but it can refuse to hand over the country unopposed. A defence at the frontier, however brief, will be remembered by the officers who fought it and by the allies who had to break it."

 PER_the_tripartite_treaty: "The Tripartite Treaty"
 PER_the_tripartite_treaty_desc: "Iran signs a treaty of alliance with Britain and the Soviet Union. Allied forces will use the railway and the roads to supply Russia, and will leave within six months of the end of the war."

 PER_look_to_berlin: "Look to Berlin"
 PER_look_to_berlin_desc: "If Germany comes through the Caucasus, Iran will be on the right side of it. Until then, Berlin's friends in Tehran hold their tongues and prepare."

 PER_german_agents: "German Agents"
 PER_german_agents_desc: "Abwehr agents slip across the frontier, tribal chiefs receive arms and radios, and Iranian officers are promised commands in the new order. The Allies read the traffic and wait."

 PER_persian_corridor: "The Persian Corridor"
 PER_persian_corridor_desc: "The ports of the Gulf, the Trans-Iranian Railway and the roads to the north become the main supply line to the Soviet Union. Iran builds it, the Allies run it, and the country must live with both."

 PER_tehran_declaration: "The Tehran Declaration"
 PER_tehran_declaration_desc: "At the end of the Tehran Conference, the three Allied powers promise to respect Iran's independence and territorial integrity and to reduce their forces once the war is over. For the first time in years, Iran's sovereignty is written into an Allied communique."

 PER_the_azerbaijan_question: "The Azerbaijan Question"
 PER_the_azerbaijan_question_desc: "Soviet troops still hold the northwest, and a Soviet-sponsored government sits in Tabriz. The treaty says they must leave. The army must stand ready to reoccupy the province if they do."

 ### TOOLTIPS ###
 PER_great_war_begun_tt: "The Great War has begun"
 PER_agreement_proposed_tt: "The Anglo-Persian Agreement has been proposed"
 PER_coup_season_tt: "The winter of 1921 has arrived"
 PER_allied_demands_tt: "Britain and the Soviet Union have presented their demands, or Iran is at war with either"
 PER_tehran_conference_held_tt: "The Tehran Conference has been held"
 PER_northwest_crisis_tt: "The war has ended and Soviet forces remain in the northwest"

 ### NATIONAL SPIRITS ###
 PER_spheres_of_influence: "Spheres of Influence"
 PER_spheres_of_influence_desc: "Russia holds the north, Britain the south, and the middle is left to Persians who must still ask permission."

 PER_anglo_persian_tutelage: "Anglo-Persian Tutelage"
 PER_anglo_persian_tutelage_desc: "British advisers sit in the Treasury and the army headquarters, and their loan is secured on the oil revenue."

 PER_weak_central_authority: "Weak Central Authority"
 PER_weak_central_authority_desc: "Tehran's writ runs to the edge of the capital and little further. The khans collect their own taxes, raise their own men and receive the governors with polite indifference."

 PER_allied_occupation: "Allied Occupation"
 PER_allied_occupation_desc: "British, Indian and Soviet troops hold the railways, the ports and the oil fields. The ministers still sit in Tehran, but the armies that matter report elsewhere."
