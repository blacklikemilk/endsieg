l_english:
 iran_great_powers: "The Great Game: Powers and Crises"
 iran_great_powers_desc: "Germany has no frontier with Iran and no concession to defend, so its relationship is technical and commercial - until a war makes it a liability. The crises in this panel run on deadlines: an unanswered demand is a decision made for you."

 iran_invite_german_mission: "Invite the German Technical Mission"
 iran_invite_german_mission_desc: "German engineers, chemists and accountants arrive with offers of machinery and a research institute. They ask for no territory and no customs house. For a government that has spent thirty years being carved up, that alone is worth the invitation."
 iran_german_barter_trade: "Conclude the German Barter Agreement"
 iran_german_barter_trade_desc: "German machine tools and rifles against Iranian wool, cotton and ore. No credit, no legation supervision, no concession - a trading relationship on terms that would be unthinkable with either of the old patrons."
 iran_expel_the_german_mission: "Expel the German Mission"
 iran_expel_the_german_mission_desc: "The Allies have made it plain that the mission is now a strategic problem rather than an economic one. Sending it home costs us the machinery and the institute, and buys us a hearing in London and Moscow."

 iran_crisis_anglo_persian_begin: "The Anglo-Persian Agreement"
 iran_crisis_anglo_persian_begin_desc: "A draft treaty sits on the cabinet table: British financial and administrative assistance, British officers for the army, British advisers for the customs - and, in the annexes, an Iran that conducts its foreign policy through one legation. Ratify it, refuse it, or let it wait until the deadline decides for us."
 iran_crisis_anglo_persian_ratify: "Ratify the Agreement"
 iran_crisis_anglo_persian_ratify_desc: "Sign it, and take the money, the officers and the advisers. The Majlis will not be asked again."
 iran_crisis_anglo_persian_reject: "Reject the Agreement"
 iran_crisis_anglo_persian_reject_desc: "Refuse it in the chamber, in the press and in the street, and accept that the legation will find other ways to make its displeasure felt."

 iran_german_technical_mission: "The German Technical Mission"
 iran_german_technical_mission_desc: "German engineers run the workshops and the institute, and their government asks for nothing in the customs house. The arrangement is generous, and it will be used against us the moment it becomes inconvenient."

 iran_campaign.74.t: "A Request for Transit"
 iran_campaign.74.d: "The British military attache has come with a map rather than a note. There is a corridor from the Gulf to the Caspian, a war that needs it, and a request - made politely, and made once - for Iran to permit the passage of men and material. The alternative, he says, would be a pity."
 iran_campaign.74.a: "Grant the transit. Take the payment."
 iran_campaign.74.b: "Refuse. This is a neutral country."
 iran_campaign.74.c: "Grant it to the Germans instead."
 iran_campaign.75.t: "The Northern Route"
 iran_campaign.75.d: "The Soviet mission has watched the British request arrive and now wants the same corridor, on better terms, in writing, and with the right to station its own troops along it. Both powers now consider the road theirs by necessity."
 iran_campaign.75.a: "Agree to the northern transit."
 iran_campaign.75.b: "Refuse them both, and hold the road."
 iran_campaign.76.t: "The Mission Must Go"
 iran_campaign.76.d: "London and Moscow have agreed on very little in this war, but they agree on this: the German engineers in Tehran are a strategic problem, and the Iranian government will remove them. The note does not ask whether the mission has been useful."
 iran_campaign.76.a: "Send the mission home."
 iran_campaign.76.b: "Refuse. Germany has asked for nothing we would not give."
 iran_sovereignty_capitulations: "The Capitulations"
 iran_sovereignty_capitulations_desc: "Foreign officials collect the revenue, foreign officers command the gendarmerie, and the cabinet does not change without a legation being informed. The government governs, but it governs within limits set elsewhere."
 iran_sovereignty_constrained: "A Constrained Government"
 iran_sovereignty_constrained_desc: "The concessions are still in force and the advisers are still in their ministries, but the government chooses which requests to answer and can refuse one without a crisis. It is not independence, and it is no longer tutelage."
 iran_sovereignty_assertive: "An Assertive Government"
 iran_sovereignty_assertive_desc: "The budget is voted in Tehran, the customs houses are staffed by Iranians, and the great powers deal with the government rather than around it. Every agreement still costs something, but the price is now negotiated."
 iran_sovereignty_sovereign: "A Sovereign State"
 iran_sovereignty_sovereign_desc: "No power holds a privilege Iran did not grant and cannot revoke. The country is still small, still poor and still surrounded, and it makes its own decisions - which is what forty years of foreign administration were meant to prevent."
