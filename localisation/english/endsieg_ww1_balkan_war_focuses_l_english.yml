l_english:
 shared_GEN_join_balkan_league: "Accede to the Balkan League"
 shared_GEN_join_balkan_league_desc: "Serbia has brought the Balkan governments to the negotiating table. A place in the League would give us partners in any war with the Ottoman Empire and a voice in the settlement that follows."
 shared_GEN_first_balkan_war: "March Against the Porte"
 shared_GEN_first_balkan_war_desc: "The League has drawn up its plans and the armies are ready. If the Porte will offer no settlement acceptable to our governments, the frontiers will have to be settled in the field."
 shared_GEN_second_balkan_war: "The Macedonian Dispute"
 shared_GEN_second_balkan_war_desc: "The Treaty of London settled the war with the Ottoman Empire. It left the division of Macedonia to the victors. Sofia's demands have gone unanswered, and the army is pressing the government to secure the districts it was promised."
