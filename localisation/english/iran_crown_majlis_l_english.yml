l_english:
 PER_crown_and_majlis:0 "The Crown and the Majlis"
 PER_crown_and_majlis_of_power_category:0 "Since the Constitutional Revolution the country has been pulled two ways. The court holds the army, the treasury and the provinces; the Majlis holds the law, the budget and the claim to speak for the nation. Neither can govern alone, and neither will accept the other's supremacy."
 PER_crown_and_majlis_category:0 "The Crown and the Majlis"
 PER_crown_and_majlis_category_desc:0 "Where power actually sits in Persia."
 PER_bop_crown:0 "The Crown"
 PER_bop_majlis:0 "The Majlis"
 PER_bop_constitutional_settlement:0 "The Constitutional Settlement"
 PER_bop_crown_ascendant:0 "The Court Ascendant"
 PER_bop_court_government:0 "Government by the Court"
 PER_bop_royal_absolutism:0 "Rule by Decree"
 PER_bop_majlis_ascendant:0 "The Majlis Ascendant"
 PER_bop_parliamentary_government:0 "Parliamentary Government"
 PER_bop_parliamentary_supremacy:0 "The Sovereignty of the Majlis"
 PER_bop_appoint_royal_cabinet:0 "Appoint a Royal Cabinet"
 PER_bop_appoint_royal_cabinet_desc:0 "Ministers chosen by the Shah, answerable to him alone."
 PER_bop_convene_the_majlis:0 "Convene the Majlis"
 PER_bop_convene_the_majlis_desc:0 "Let the deputies sit, speak and vote."
 PER_bop_negotiate_the_settlement:0 "Negotiate the Settlement"
 PER_bop_negotiate_the_settlement_desc:0 "Bring the court and the chamber to terms neither of them likes."
 PER_bop_ratify_the_fundamental_laws:0 "Ratify the Fundamental Laws"
 PER_bop_ratify_the_fundamental_laws_desc:0 "Write the settlement into law while both sides still accept it."

 PER_bop_budget_vote:0 "The Budget Vote"
 PER_bop_budget_vote_desc:0 "Once a year the treasury asks the deputies to sanction the accounts. The Majlis votes only while the state can collect what it votes, the Court is not governing alone and no decree has lately gone over its head. Let the vote lapse and the quarrel becomes a constitutional crisis."
 iran_pahlavi_autocracy:0 "Pahlavi Autocracy"
 iran_pahlavi_autocracy_desc:0 "The Majlis still meets, but it sits at the Shah's pleasure. Ministers answer to the throne, the budget is settled in the palace and the deputies ratify it. Occupation and the Shah's departure would end this."
 iran_campaign.77.t:0 "The Majlis Reconvenes"
 iran_campaign.77.d:0 "The Shah has gone, and with him the habit of silence. Deputies who sat through sixteen years of ratifying decrees arrive at the Baharestan with their own demands. The Allies want a government that will sign what is put before it; the deputies mean to be that government, on their own terms."
 iran_campaign.77.a:0 "The chamber has its voice again."
 iran_campaign.78.t:0 "A Constitutional Crisis"
 iran_campaign.78.d:0 "The accounts were laid before the Majlis and no vote was taken. The Court calls the delay obstruction; the deputies call it the only power they have. Tax collectors wait for orders and the ministries are paid on credit, while both sides watch what the other will do first."
 iran_campaign.78.a:0 "Dissolve the chamber and govern by decree."
 iran_campaign.78.b:0 "Yield to the deputies."
 iran_campaign.78.c:0 "Send for the leaders of both sides and negotiate."
 PER_bop_push_crown_large_tt:0 "The Crown gains decisive ground against the Majlis"
 PER_bop_push_crown_tt:0 "The Crown gains ground against the Majlis"
 PER_bop_push_crown_small_tt:0 "The Crown gains a little ground against the Majlis"
 PER_bop_push_majlis_large_tt:0 "The Majlis gains decisive ground against the Crown"
 PER_bop_push_majlis_tt:0 "The Majlis gains ground against the Crown"
 PER_bop_push_majlis_small_tt:0 "The Majlis gains a little ground against the Crown"
 PER_bop_pull_to_centre_tt:0 "The Crown and the Majlis move towards the constitutional settlement"
 PER_bop_sign_agreement_tt:0 "An agreement signed by decree strengthens the Crown; one ratified by the Majlis strengthens the Majlis"
 PER_bop_decree_treaty_tt:0 "No treaty has been signed over the Majlis's head in the past year"
