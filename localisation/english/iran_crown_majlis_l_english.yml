 PER_bop_parliamentary_government:0 "Parliamentary Government"
 PER_bop_parliamentary_supremacy:0 "The Sovereignty of the Majlis"
 PER_bop_appoint_royal_cabinet:0 "Appoint a Royal Cabinet"
 PER_bop_appoint_royal_cabinet_desc:0 "Ministers chosen by the Shah, answerable to him alone."
 PER_bop_court_the_notables:0 "Court the Notables"
 PER_bop_court_the_notables_desc:0 "Pensions, titles and invitations bring the great houses back to the court."
 PER_bop_royal_tour_of_the_provinces:0 "Tour the Provinces"
