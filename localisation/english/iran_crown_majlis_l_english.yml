 PER_bop_rule_by_decree:0 "Rule by Decree"
 PER_bop_rule_by_decree_desc:0 "Suspend the sittings and govern as the Qajars once did."
 PER_bop_convene_the_majlis:0 "Convene the Majlis"
 PER_bop_convene_the_majlis_desc:0 "Let the deputies sit, speak and vote."
 PER_bop_pass_the_budget:0 "Pass the Budget through the Majlis"
 PER_bop_pass_the_budget_desc:0 "No taxation without the chamber's consent."
 PER_bop_empower_the_anjomans:0 "Empower the Anjomans"
 PER_bop_empower_the_anjomans_desc:0 "The provincial councils were the revolution's first institution."
 PER_bop_press_freedom:0 "Allow the Press"
 PER_bop_press_freedom_desc:0 "Newspapers are the only parliament most Persians ever see."
 PER_bop_negotiate_the_settlement:0 "Negotiate the Settlement"
 PER_bop_negotiate_the_settlement_desc:0 "Bring the court and the chamber to terms neither of them likes."
