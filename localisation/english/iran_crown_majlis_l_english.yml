 PER_crown_and_majlis:0 "The Crown and the Majlis"
 PER_crown_and_majlis_of_power_category:0 "Since the Constitutional Revolution the country has been pulled two ways. The court holds the army, the treasury and the provinces; the Majlis holds the law, the budget and the claim to speak for the nation. Neither can govern alone, and neither will accept the other's supremacy."
 PER_crown_and_majlis_category:0 "The Crown and the Majlis"
 PER_crown_and_majlis_category_desc:0 "Where power actually sits in Persia."
 PER_bop_crown:0 "The Crown"
 PER_bop_majlis:0 "The Majlis"
