# Codex project configuration for Endsieg / sanaa_branch
# Adapted for this repository from the Agentic-HOI4-Modding workflow.

approval_policy = "never"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 131072

[agents]
max_threads = 8
max_depth = 2

[agents.hoi4_repo_explorer]
description = "Read-only scout for mapping Endsieg files, dependencies, vanilla precedents and likely validation steps before risky changes."
config_file = "agents/hoi4_repo_explorer.toml"

[agents.hoi4_compatibility_debugger]
description = "HOI4 version-compatibility and crash debugger. Compares the mod against installed vanilla content and repairs missing, obsolete or incompatible definitions with minimal changes."
config_file = "agents/hoi4_compatibility_debugger.toml"

[agents.hoi4_script_auditor]
description = "Audits and fixes HOI4 script across common, events, history, decisions, focus trees and localisation references while preserving Endsieg behavior."
config_file = "agents/hoi4_script_auditor.toml"

[agents.hoi4_interface_debugger]
description = "Audits and fixes HOI4 interface, GUI, GFX and main-menu/scenario presentation issues by comparing against current vanilla structures."
config_file = "agents/hoi4_interface_debugger.toml"
